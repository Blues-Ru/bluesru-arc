    text: Это преображение, поможет ему применить свои способности в экстремальных условиях. Хэнкок - это не совсем обычный
      супер герой. Еще при выходе первой части фильма, он запомнился зрителям, как довольно эксцентричная личность, которая
      кроме всего прочего занимается еще и спасением города. Главным отличием этого супер героя от других, это отсутствие
      какой-либо маски. Они редко думает, перед тем, как браться за какое-то задание. Все что он делает, возникает на чистой
      импровизации, которая зачастую оказывается довольно успешной. После длительной паузы в своей карьере супер героя, ему
      предстоит вернуться обратно в свое старое-доброе ремесло. За время его отсутствия в городе произошло много довольно
      странных вещей, которые несли угрозу будущему всего города. Узнав обо всем этом, он сразу же берется за решение этой
      проблемы. Но только сразу возникает небольшая проблема, он никак не может понять с чего бы лучше начать. В ходе раздумий,
      он вновь доверяется своей импровизации, и идет на выполнение задания без какого-либо плана действий. В этот раз дело
      оказывается действительно серьезным, и в такой ситуации нужно делать все по максимуму, так как последствия неудачной
      попытки, могут быть слишком велики. Хрупкая и беспомощная на вид девушка по имени Мэллори решает в одиночку отправиться
      в небольшое путешествуя, минуя красочные виды каньонов, на пути к своей свадьбе. http://kogda-data-vihoda.org/multfilm/
