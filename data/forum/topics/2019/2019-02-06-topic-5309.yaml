  text: уважаемые старожилы! Я хочу ознакомиться с этим потрясающим жанром музыки. Меня сюда привела песня Dire Straits "You And Your Friend", в которой меня заворожило необычное звучание гитары. Не могли бы вы посоветовать что-то подобное? С чего следует начать знакомство с блюзом?
