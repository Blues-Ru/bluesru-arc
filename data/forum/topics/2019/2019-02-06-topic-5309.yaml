    text: 'Здравствуйте, Ув. Тихон.

      Коллективный разум блюзфорума приносит Вам извинения за столь долгий период перед ответом...

      На Ваш прямо поставленный вопрос имеем ответить следующее...

      Приведённый Вами пример слегка блюзового исполнения в виде замечательной пиесы Dire Straits "You And Your Friend" имеет ярко выраженный характер истинно европейского белого понимания блюза, что имеет выражение в виде слезливой слегка блюзовой баллады...

      многие европейские исполнители грешат сим обстоятельством...

      на что имеют своё полное право в этом...

      это их понимание жизни, красоты, блюзовой формы...

      они в своём полном праве...

      и кто я такой, чтобы осуждать...

      извините отвлекся...

      теперь к делу...

      исходя из опыта, такие слегка напоминающие блюз вещицы в достаточно большом количестве встречаются в творчестве замечательного Eric Clapton...

      Layla и какие то ещё вещицы вроде этой...

      вообще Эрик свой в доску парень с правильным пониманием блюза, его мощи и целенаправленности...

      но иногда в его творчестве попадаются такие невнятные белые европейские вещи...

      блюзовые старики называли такие вещицы - such and such a blues...

      такой себе растакой вроде блюз...

      по форме вроде и блюз...

      но по духу совсем не...

      ну и вообще, стоит поискать такого рода околоблюзовые вещицы в творчестве всякого рода белых европейских гитаристов, вроде Peter Green, John Mayall (и гитаристов, игравших и играющих в его окружении)...

      что же до того к чему стоит стремиться...

      то, извините, возьму на себя смелость рекомендовать...

      Lonnie Johnson


      это человек с очень правильной блюзовой гитарой в руках...

      https://www.youtube.com/watch?v=n8fyb9vpIc0

      а вообще, блюз в каждом десятилетии имеет свои отличия и своих героев в каждом из них...

      бывает блюз быстрый, бывает медленный, бывает тяжёлый и забойный для баров и танцулек, бывает искусный для получения удовольствия от красоты мира...

      каждый выбирает свой блюз...

      по настроению и мироощущению...

      единственное, что роднит все виды настоящего блюза между собой - это непоколебимая уверенность в музыке и словах в том, что все будет как надо и нет в нём места унынию...

      самоуверенность, да...

      это и подкупает в этой музыке...

      надеюсь не прослыть среди Вас "черным расистом" после такого рискованного и раскованного ответа...


      Всегда Ваш, белый европейский подростковый любитель блюза...'
