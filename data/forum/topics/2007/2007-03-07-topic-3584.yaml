    text: "Как ни странно, чуть не забыл написать...\nПосле просмотра этой ссылки\
      \ на китайский блюз приснился мне ночью СОН, следующего содержания:\n Стою я\
      \ будто на дебаркадере, день такой ясный ясный, жаркий жаркий водичка тёплая\
      \ речная плещется повсюду - ляпота! И подходит ко мне в  пьяный жопу Сан Хауз\
      \ и говорит, так мол и так, с тобой Мадди Вотерс познакомиться хочет, только\
      \ он на другом дебаркадере - плыть придётся.\n Ныряем, плывём, Сан Хауз прямо\
      \ в костюме плывёт и в шклетах лаковых.\nЗаходим на другой дебакрадер, там какие\
      \ то корридоры , лесницы... заводит он меня в какую то комнату, а там... сидит\
      \ в кресле пьяный Александр Маслюков из КВН... да такой пьяный, что он больше\
      \ на Юрия Сенкевича похож, да так сильно похож, что я через минуту верить начинаю,\
      \ что передо мной Сенкевич... покойный... А Сан Хауз мне на него показывает\
      \ и сзади на ухо шепчет: \"Иди, поздоровайся с Мадди (Вотерсом)..\"\n      \
      \   мда...вот ведь. живи теперь с этим."
