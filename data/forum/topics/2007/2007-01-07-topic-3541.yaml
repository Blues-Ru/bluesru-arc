  text: "Я неоднократно слышал от посетителей блюз- клубов то, что туда редко захаживают\
    \ красивые(или симпатичные)тёлки - простите за фривольность. Долгое время как\
    \ то не обращал на это внимания, а потом понял, что красивую тёлку на старьё не\
    \ затащишь(плохй звук, ортодоксальная подача материала, скучное нытьё  со сцены\
    \ про нечищенные ботинки и пр.)Даже сам вид виниловой пластинки их отпугивает.\
    \ Но к чему бы это? А к тому, что красивые тёлки (девушки, женщины)\nлюбят бывать\
    \ там, где весело,где стильно и современно где можно потанцевать ( покрутить задницей\
    \ и потрясти сиськами), что так привлекает мужчин, особенно у которых есть деньги.\
    \ И поэтому всем будет хорошо, если блюз перестанет быть музейной и неприкасаемой\
    \  музыкой -  музыкой плешивых и бездетных .Посмотрите на Мадика , на то как он\
    \ одеваля, какой причесон носил, послушайте как он играл свои песни,   это было\
    \ стильно и современно. \nБеда совка в том что все смотрят на запад и ждут разрешения\
    \ от местных авторитетов ,в надежде услышать слово  МОЖНО."
