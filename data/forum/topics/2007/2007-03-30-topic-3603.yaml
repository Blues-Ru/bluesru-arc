  text: '29 марта посещаемый блюзовый ресурс ВluesWax.com (доступ с бесплатной регистрацией)
    поместил рецензию на альбом Арсена Шомахова Dangerous (Blues Leaf Records, 2006).
    Оценка - 9 из 10 рейтинговых пунктов. С текстом рецензии на английском языке (без
    регистрации) можно ознакомиться на кешированной странице: http://www.arsenic.blues.ru/htm/BW/blueswax.htm.'
