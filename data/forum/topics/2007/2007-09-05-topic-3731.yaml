    text: "Не на русском? Нет? :))\nВсем привет! По моему,сугубо личному мнению, блюз на русском языке может и должен быть,\
      \ если (уж простите) мы родились и живем в России, и как я уже сказал, думаем и переживаем на русском. Да, проблема\
      \ ритмики и фонетики русского языка очень остра, но лишь до тех пор, пока не появится кто-то, кто сможет сочинить настоящие\
      \ блюзовые стихи, и положить их на блюзовый квадрат. А сделать это не так-то просто. Еще одна проблема - поэтический\
      \ жанр - блюз. Да, трудно уложить нашу речь в квадрат. Но на то и есть поэзия, и конкретно песенная, чтобы заниматься\
      \ решением таких курьезных задач. При этом откуда-то берутся люди (например с приснопамятного rusblues.ru) - только\
      \ не обижайтесь, - у которых просто ничего не выходит, да они и не могут по-моему. Ладно не о них речь, хоть и обидно\
      \ жанр как таковой. На мой взгляд и вкус, русский блюз - это нормально и естественно. И если ты глубоко понимаешь и\
      \ знаешь эту музыку, и тебе повезет с текстами, - то почему бы и нет? Ведь если говорить откровенно, то наши, московские\
      \ так называемые блюзмены, игратели каверов - ничего кроме скуки и раздражения, и иногда желания убивать не вызывают,\
      \ за ооо-чень редкими исключениями. А своего ничего нет и не может появиться. А ведь за что мы все любим классических\
      \ блюзменов - ну не за технику же, и наверное не за цвет кожи или язык (иначе -это уже патология, извращение), а за\
      \ что-то предельно честное, частное, внутреннее я бы даже сказал прекровенное. За  то, что может прозвучать наверное\
      \ на любом языке, как, я не знаю,- молитва что-ли... А наши игратели, пусть даже будучи блестящими исполнителями - хер\
      \ выскажут то, то было у Wells-a, или у Howlin-a, или у Campbell-a... продолжать? и пусть кто-то скажет что это не так!\
      \ Многие давно уже забыли, что там было, в этих песнях. Находятся и такие, кого даже (!) не заботят слова! -люди просто\
      \ снимают словестную кашу, которую не в состоянии перевести. И кто из них после этого блюзмен? :) Да, молодец - снял,\
      \ сыграл, спел, умница - садись, - пять! \n\nА кто же мне вынет душу? Хотя бы даже без слов?"
