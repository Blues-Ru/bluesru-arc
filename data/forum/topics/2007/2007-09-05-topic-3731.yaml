  text: "Здравствуйте многоуважаемые коллеги музыканты.\nВопрос скорее всего к Вам, практикующим концертным деятелям, хотя\
    \ было бы интересно послушать мнения, точнее, методики и теоретического звена блюзового форума.\n Не секрет ( гыгыгы ),\
    \ что львиная доля композиций, исполняемых на блюзовых концертах на английском языке, всвязи с чем, среди слушателей порой\
    \ слышишь недовольные высказывания, сформулированные в виде настойчивых просьб, изрыгаемых, порой, угрожающим тоном, Играть\
    \ и петь на Русском.\n Конечно, наверное к счастью, с годами недовльных всё меньше, особенно в столицах,.. куда чаще слышишь\
    \ сие \"пожелание\" в других областных и районных центрах, но всё же думаю каждый из концертирующих музыкантов хотя бы\
    \ 1 раз, сталкивался с настойчивыми просьбами спеть что нибудь \"понятное\".\n Если это не является вашей профессиональной\
    \ тайной, поделитесь пожалуйста вашими методиками разъяснительной работы со жаждущими русской песни. \n Спасибо. \nP.S.\
    \ Заранее извиняюсь, если тема уже поднималась ранее."
