    subject: Не эх, а ух!
    deleted: false
    text: 'Извините, что вмешиваюсь. В Питер Чак Берри приезжал года 3 или 4 назад. К слову, на разогреве у него был.. Розенбаум
      (все зрители в это время носились в поисках пива). После Розенбаума сопр. состав Чака с полчаса поиграл "сольно", т.е.
      без него. Большого энтузиазма это ни у кого не вызвало, хотя вроде такой же рок-ролл / ритн-энд-блюз, как и у Берри.
      Вроде БЫ. А когда вышел сам со своей КОРЯВЕНЬКОЙ гитарой.. опять же говорю, вроде всё тоже самое - но всё стало ПО-ДРУГОМУ.
      Зал (СКК в Питере, стадион под крышей) встал на уши. И нельзя было на них не встать.. Кончилось всё тем, что народ ломанулся
      на сцену (а народ-то не особо молодой был в основном), и дедушку Чака унесли под белы ручки, а через пару минут сказали,
      что концерт окончен.

      Это я к тому, что если Берри не сдал сильно за эти 3-4 года - то можете идти смело. Не пожалеете. Редкий оттяг, поверьте
      очевидцу.'
