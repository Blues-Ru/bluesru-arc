        text: "Флаеры генерируются автоматически на все даты, когда могут быть концерты. Под флаером написано следующее:\n\
          \nПожалуйста, напечатайте, вырежьте и возьмите с собой этот флаер.\nВнимание! Зарегистрированный посетитель blues.ru\
          \ может\nиспользовать только один флаер за один вечер.\nНа специальные мероприятия скидки не распространяются. \n\
          Следите за объявлениями и уточняйте информацию в клубе по телефону.\n\n\"Специальные мероприятия\" на блюз.ру никак\
          \ не помечены, весь вопрос в том, какая часть мероприятий является \"специальными\" и не перегибает ли клуб палку.\
          \ Тут нужно рассматривать конкретные случаи..."
