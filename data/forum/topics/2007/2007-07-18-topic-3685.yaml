      text: "За указанные деньги трудно купить хорошо звучащий инструмент.\nСкорее всего, это будет что-то очень китайское. \nИграть оно, конечно, будет, но за звук администрация не ручается.\nА блюзовый звук он вообще в специальном органе блюзмена живёт, с гитарой вместе никак не продаётся. Наука до сих пор этому органу не дала точного названия.\n\nКороче, на неконкретно поставленный вопрос невозможно дать конкретный ответ. Пусть человек поедет на Кузнецкий мост для начала, там недалеко друг от друга 3 магазина с колониальными музыкальными товарами, походит да приценится, инстрУменты пощщупает.\nЕсли не может - пусть хотя бы изучит ассортимент www.buymusic.ru или чего-то похожего и спросит что-нить типа \"А если я куплю гитару X, будет ли она звучать как гитара Y, или обе они звучат как Й?\""
