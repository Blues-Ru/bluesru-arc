  text: "Несколько слов об этих концертах. Видит бог, не хотел ничего писать, \nно\
    \ вижу опять полная тишина. Много других актуальных тем вокруг, а  блюзовые старички...ну\
    \ что с них возьмешь и что они еще покажут новое? А зря. Очень сильные выступления.\
    \ Был на последних двух в ДуДе и было заметно, что с каждым своим выступлением\
    \ Фил исполнял все лучше и лучше. Это безусловно сыгранность с нашими музыкантами\
    \ и конечно акклиматизация.Уже можно сравнивать с другими чикагцами: не так экспрессивен\
    \ как Lurrie Bell,не так техничен как Bob Stroeger...\nНо с настоящим блюзовым\
    \ грувом - этого у него не отнимешь. Мастер одним словом. Еще раз спасибо"
