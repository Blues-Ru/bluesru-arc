  text: во вторник 24-го июля у нас будет выступать американский гражданин и музыкант по имени Chris Walz. Он преподаёт гитару в Old Town Scool of Folk Music(Chicago). К нам его сосватал Миша Владимиров, а Михаил Мишурис настолько был восхищён искуством этого артиста, что пожертвовал своим запланированным концертом!!! "Наши люди"(те кто уже слышали и видели Криса) отзываются о нём в превосходных тонах. Крис в совершенстве владеет разнообразной гитарной техникой и очень хорошо поёт. Концерт у нас будет происходить при участии Михаила Владимирова(гармоника). Вход на концерт в этот день будет совершенно свободным для всех, так что не проморгайте!
