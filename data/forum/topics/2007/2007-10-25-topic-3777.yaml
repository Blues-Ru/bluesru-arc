                      subject: Да спорить то и не о чем
                      deleted: false
                      text: 'Я правда думаю что Boubacar Traorй ближе и к народной африканской музыке и к блюзу чем Ali Farka Toure, но я как примитивист вообще, рассматриваю всю мировую музыку как борьбу двух тенденций - индийской и африканской, ди и это не важно, но вот то, что после африканских "блюзменов" и после исламской музыки севера африки мне стало легче понимать ритмику североамериканского блюза - факт, хотя, может это просто мои личные заморочки.

                        Как например, я не врубался в ритмику латиноамериканской румбы до тех пор как Андре Пеленда (гитарист из Конго) не показал как это играется в их далекой конголезкой деревне откуда он родом. Хотя и континет совсем другой.'
                      replies:
                      - id: 33769
                        parent_id: 33768
                        date: 2007-10-30 15:34
                        poster: Muddy Lives
                        email: mlives_6@hotmail.com
                        subject: Африканская румба
                        deleted: false
                        text: 'Ирония в том, что африканская румба имеет латинамериканские корни (и наоборот).  Она в начале развивалася в Латинской америке на основе африканских и европейских традиций, a потом пришла оттуда в Африку в 50-ых годах.  В начале она пользовалась популярностью в Гане, а потом в Нигирии и Конго.  Конголезкие и другие африканиские оркестры, которые играли румбу в 1950-ых и в начале 1960-ых годах играли очень близко к латинамериканской модели, но замеиняли духовые инструменты (для которых денег не было) гитарами. В конце 1960-ых и в 1970-ых годах Конголезкие музыканты стали прибавлять более коренные элементы собственных музыкальных традиций (Folklore) к своей румбе. Франко был главынм артистом по этому направлению.  Так что, перемещение и влияние в музыке идет не только из Африки в другие места, а также наоборот.  Нельзя всегда предпологать, что африканский вариант - первоисточник.


                          Muddy'
