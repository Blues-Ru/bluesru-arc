                    subject: Deja Vu
                    deleted: false
                    text: "Если я не ошибаюсь, мы уже много говорили на эту тему несколько лет тому назад. Может спорить о степени одного или другого влияния в происхождении блюза, но основнве факты мне кажутся ясными.  Черная музыка США (блюз, джаз, госпел) имеет важные корни, и африканские, и европейские.  Но музыка сама своеобразная, именно американская - не африканская, не европейская.   \n\nКонечно, пыталися рекламировать Ali Farka Toure, как \"блюз.\"  Но если слушать внимательно его ранние записи (до того, как работники в отделе маркетинга его уговорил петь и играть более по-американски), понятно, что его музыка принадлежит известным богатым музыкальным традициям \"мандинго,\" которые действительно имеют что-то общее с блюзом, и действительно повляли на его развитие, но все-таки не блюз. Это последнее утверждение тяжело доказать, так как четкого общепринятого определния блюза нет. Но я бы сказал, что чувства в музыке \"мандинго\" могут быть очень глубокими, но все-таки не блюзовыми.  Присутствует больше сахара, и меньше соли, чем в блюзе.  Музыка \"мандинго\" слаще, без блюзовой горечи.\n\nMuddy"
