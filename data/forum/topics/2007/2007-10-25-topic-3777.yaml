      text: "Они, музыка Маракеша и американский блюз, конечно, уже разошлись во времени очень сильно, за столько веков-то, но это нормальный процесс дивергенции, как в языках при переселении народов, но в музыке тоже можно отследить процессы изменения интонационных элементов во времени.\nУ лингвистов, конечно, своя методика, но я думаю, что учёные музыковеды проведут параллели, если уже не провели.\nКто интересуется вопросом, прежде чем на травы ссылаться, пусть почитает , например, http://en.wikipedia.org/wiki/Gnawa_music\nПотом про музыкальные суфийские традиции Qawwali, появившиеся \nПро технику исполнения на древнем арабском инструменте ood тоже полезно почитать. Про макамы (мугамы) в вокальной и инструментальной музыке - тоже нелишнее.\nУ внимательного читателя наверняка появятся более интересные мысли про связь мировых культур, и о том, что чёрная Америка, Марокко и Пакистан гораздо ближе друг к другу, чем их относительное географическое положение.\nЭто будет немножко разнообразней, чем предположения о том, что авторы накурились травы."
