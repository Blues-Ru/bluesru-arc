                text: "Я абсолютно искренен! Почему - паясничать?\nЯ сейчас Вам, все поясню. Так случилось, что приходят ко мне разные музыканты (бывает). И вот уже несколько лет, все твердят - тебе вот блюз нравится, а вот его сенегальские корни, а вот исламские с севера африки и юга европы. Хорошие люди, и я, как человек плохо разбирающийся в музыке, им верю! Вот Старый Майор - у меня нет повода сомневатся в его порядочности - о том же. Ну там когда Али Фарка сидел под деревом телеги толкал Вы объяснили - накурился. Или там Хукер говорил о недостающем звене. А тут еще и жена моя - археолог, езжу с ней копать всякие там городища и могильники, общаюсь в результате со всякими там историками. И они, в свободное от раскопок время рисуют стрелочки - вот гуны пошли сюда, вот готы, вот арии, вот сдвинулись народы. А я пытаюсь соотнести, ага - вот на этой територии появилась новая музыкальная традиция, вот ее привнесли эти племена и вот она докатилась до алтая и там осталась и т.п. \nИнтересно же!\nТак вот, мне очень интересно услышать Ваше мнение о том, почему нет африканских корней (и исламских) там, где их по мнению мною уважаемых людей не может не быть. Именно Ваше, как человека безусловно разбирающегося в музыке. Без всякого стеба, и как я уже писал, если можно, то без ссылок на наше плохое умственное развитие и приверженность к психоделикам."
