                  subject: Кот, я в ЖЖ уже отписал, но здесь повторю.
                  deleted: false
                  text: "На самом деле прямого заимствования в раннем блюзе из исламской традиции инструментального исполнения на струнных-щипковых нет.\nОсновная часть рабов поставлялась из т.наз. Сенегамбии, в которой исламское влияние было слабее, чем в регионах северной Африки. \nОднако, источники сообщают, что в 16-17 веках до 30% рабов были мусульманами, и по крайней мере вокальные традиции муэдзинов принесли с собой. Есть очень интересные абзацы о том, что вполне христианские молельные дома в 18-19 веках строились с ориентацией на Каабу )) Это говорит только о том, что простодушные негры с присущей им непосредственностью смешали в своих религиозных ритуалах всё на свете - древние языческие представления, ислам, христианство (лишь бы от работы  сачкануть ))\nЕсли посмотреть на Википедии по ссылкам кое-какие видеоролики национального исполнительства на инструменте Aconting - прототипе банджо, то можно услышать много знакомых мелодий. Например, шаманские камлания в стиле Бо Диддли, или что-то неуловимо похожее на Boogie Chillen и другие обманчиво-примитивные мелодии JLH."
