        text: "Это не арифметика, а музыка. Тут от перестановки мест слагаемых сумма очень даже меняется. \n\nПросто в твоём представлении джаз и блюз где-то рядом.\n\nА у нас в \"приджазованном блюзе\" есть одна номинализация - блюз, и один предикат - \"приджазованный\". Берем блюзовый темброво-ритмический фрейм, играем блюзовую пьесу, но с элементами джазовой стилистики, правильно?\n\nРассмотрим наоборот. \"Приблюзованный джаз\". Берём джазовый темброво-ритмический фрейм, играем джазовый стандарт, но \"по-блюзовому\", т.е. больше грува, больше пентатоники и блюзовых нот.\n\nВ некоторых случаях они могут сойтись, но в общем случае - это разные явления.\n\nПонятно, двоечник? )))\n\nПьеса хорошая, молодец. И по БиБи поиграл, и по Альберту, и по неизвестным авторам.\nПару квадратов в середине можно было бы сократить, т.к. в них новых мыслей уже не було.\nДжаза там конечно нету, чуток расширенной гармонии есть, и то хорошо.\nЯ бы в серединке бриджик бы добавил, чтобы освежить слушателей:\n\nРазмер 2/4\nE | E | E | E\nH | A | G#| G#\nтут мелодический ходик вверх: с#-d#-e-f-f# \nна гармонию\nC#m|C#m|F#7|F#7| \nHm|G#m|C#m|F#7 \n\nАльтерации сам прикинь. Если не поймёшь, как это должно звучать, послушай у Би Би Night Life.\n\nМожно ещё модуляцию в конце сделать в тональность D на полный квадрат, с повышенной экспрессией, а потом вернуться  с басом d-c#-c-h обратно и последний квадрат доиграть в H, так Фредди Кинг делал.\nМожно модуляцию в C#, тогда turnaround должен быть вот какой:\n\nH|G#m|C#m|G#7 - вуа-ля - мы в C# мажоре"
