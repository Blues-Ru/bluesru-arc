  text: "Записал вчера со старым другом, бывшим одноклассником на его домашней студии демку, двенадцатитактовый мажорный блюз с усложненной гармонией. Сыграно было на Ibanez Artist в небольшой комбик Peavay с пружинным ревером через Ibanez Tube King. Барабанный луп не редактировали, все партии гитар и баса сыграл я. Трек практически не сводили. Начинается трек с мелодической темы, затем следует традиционная блюзовая импровизация, но ближе к концу я постарался сыграть близко к манере Джорджа Бенсона, Уэса Монтгомери и Кенни Баррела, хотя джазом никогда толком не занимался! :-) \n\nВыложил на imeem и на ifolder:\n\nhttp://tonyskylark.imeem.com/music/Y-uYgTwo/audiotrack_09/\n\nhttp://ifolder.ru/3236335\n\nБуду благодарен за конструктивную критику! :-)"
