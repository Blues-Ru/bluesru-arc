  text: 'Сегодня читаю в "летиях": в 1996 состоялся первый концерт в "Беляево". Насколько я помню, он открылся раньше. И блюз там играли до 96-го, хотя не только блюз. Этот подвал под клуб пробила Ия Моцкобили, она же достала средства на аппаратуру и ударную установку "Тама" (потом, правда, два козла курили и сожгли Таму дотла, но это уже другая история). Потом руководство клубом, действительно, перешло к Лёше Калачеву. Сложная история. Как правильно говорил Кутузов, кто в чужие дела лезет... Но если вспоминать, то было так.'
