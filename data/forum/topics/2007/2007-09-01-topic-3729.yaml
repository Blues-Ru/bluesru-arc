  text: '<a href="http://www.foxnews.com/story/0,2933,295467,00.html">ALBANY, New York —  American folk singer Pete Seeger has the Joe Stalin blues.</a>

    Decades after drifting away from the Communist Party, the 88-year-old banjo-picker has written a song about the Soviet leader that is as scathing as any protest tune in the folk legend''s long career.

    "I''m singing about old Joe, cruel Joe. He ruled with an iron hand. He put an end to the dreams of so many in every land," Seeger wrote in "The Big Joe Blues."

    Seeger said he left the Communist Party around 1950 and he apologized years ago for not recognizing that Stalin was a "very cruel misleader." But he told The Associated Press on Friday that the long-gestating song he finally finished this year is a first for him, despite three visits to the Soviet Union beginning in the ''60s.

    "It''s the first overt song about the Soviet Union," Seeger said during a telephone interview from his Hudson River Valley home in Beacon, New York. "I think I should have though, when I was in the Soviet Union — I should have asked ''Can I see one of the old gulags?...........


    <a href="http://top.rbc.ru/society/01/09/2007/115774.shtml?print">Здесь по-русски:</a>

    Американский фолк-певец, в прошлом член Коммунистической партии США, сочинил песню про бывшего советского руководителя Иосифа Сталина, сообщает агентство Associated Press.

    88-летний Пит Сигер долгое время был убежденным коммунистом, и хотя со временем его политические взгляды несколько изменились, ему по-прежнему не безразлична судьба человечества.

    "Я пою о старом Иосифе, жестоком Иосифе. Он управлял "железной рукой". Он разбил мечты стольких людей повсюду", - поется в песне "Блюз Большого Иосифа".

    П.Сигер вышел из рядов Коммунистической партии еще в 1950-е гг. Сейчас экс-коммунист признает, что Сталин был "жестоким диктатором", а несколько лет назад он извинился за то, что не признавал этого раньше. П.Сигер рассказал в телефонном интервью агентству, что это его первая песня о Советском Союзе, несмотря на то, что он побывал там трижды, впервые – в начале 1960гг.


