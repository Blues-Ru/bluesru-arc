    text: 'Названные вами композиции - не чистые инструменталы, просто в них есть длинные гитарные соло


      Если интересуют именно гитарные соло - запилы, то их полно у Бадди Гая (особенно в альбоме Sweet Tea, который местами
      почти хэви-метал), Роя Бьюкенена, Рори Галлахера (на Irish Tour есть 2 подряд вещи - One Million Miles Away и Walkin''
      On A Hot Coals), у того же SRV в Voodoo Child (Slight Return), Texas Flood, The Sky Is Cryin'', Джимми Такери со своей
      бандой, у Джонни Винтера встречается


      при желании, можно поискать зерна прекрасного в мусоре говно-рока 90-х - начиная с Гэри Мура и заканчивая Джонни Лэнгом,
      Вальтером Трутом и сотнями малоизвестных американцев


      Что касается "чистых инструменталов", то на них специализируется Ронни Эрл (или Ирл иногда пишут), но он тяготеет к
      инструментальному джазу, утяжеленной электрики, как у названного уже здесь Роя Бьюкенена, у него в принципе нет и не
      может быть, что не всем нравится, особенно тем, кто пришел к блюзу через британский блюз-рок и хард-рок

      Для примера послушайте альбом Р. Эрла "Healing Time" (2000)


      Дюк Робиллард, но у него ещё больше джаза и бопа, если Вас не вштыривает Ронни Эрл, то Робиллард вам точно не понравится


      есть довольно много инструменталов у Бо Диддли


      несколько совершенно чудных вещей у Ти-Боун Уокера, Кларенса Гейтмауса Брауна, Отиса Раша (по-моему самого недооцененного
      гитариста, я его ставлю на второе место после божественного Бадди Гая по гениальности), да и практически у любого чикагского
      героя 60-х парочка инструменталов найдется'
