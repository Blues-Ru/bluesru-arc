  subject: Про Майлза Дэвиса
  deleted: false
  text: 'Господа блюзмены, я весьма болезненно отношусь к неким заявлениям касательно
    одного или другого музыканта. Хочу внести ясность "Гений игры на трубе", как выразились
    в блюзовых новостях на этот день (25,05,07) на самом деле так и не овладел техникой
    игры на этом инструменте в должной степени, то есть по сравнению с другими исполнителями,
    пользующимися данным инструментом для выражения своих мыслей, он выглядел бледновато
    (по крайней мере - в техническом плане). При этом, я слышал, что мистер Дэвис
    обладал отвратительным характером...

    Однако, не смотря на это его вклад в Джаз весьма велик. Человек, участвовавший
    в становлении бип-бопа и кула, фактически придумавший фьюжн, а так же излечившийся
    от наркомании, наверное, самым зверским способом (запершись в домике для гостей
    на ферме отца и перетерпев ломку, когда понял что дело зашло слишком далеко) без
    сомнения уважения заслуживает великого. Ко всему прочему, он был хорошим организатором
    и... действительно - гением трубы... в конце концов, с классической точки зрения,
    даже электрогитарной, техника Джими Хендрикса оставляет желать много лучшего,
    а уж про Джона Ли Хукера я и не говорю, но какой он вклад оставил в музыку!

    Спасибо за внимание.'
