                      text: "Наверное можно (и нужно) снова првести то описание как пользоваться mIRC ( кодовое название <b>Закрома Родины</b> :-)\nЭто старое сообщение Старого Пирата за февраль прошлого года:\n<i><b>Как пройти в Закрома Родины  - Старый Пират    (22/02 16:00)</b>\nСообщаю в очередной раз.\nЧтобы добраться до перацких архивов всей и всяческой музыки, нужно следующее:\n1. Скачать клиент для сетей IRC - mIRC с сайта www.mirc.com\n2. как продлить его срок действия сверх 30 дней триал-периода - объяснять не буду ;)\n3. Из списка сетей выбрать сеть UNDERNET, коннектиться лучше к Undernet, Random US server\n4. Зайдя в сеть, подключиться к каналу #Mp3blues\n5. скачать файл-листы (командой @имя) следующих людей: @buzz, @davilo и @wldflwr - у них самые приличные коллекции. Можно и других, но для того, чтобы понять, кто в канале есть who, надо понаблюдать некоторое время за потоком сообщений. Примечание: Скачивать файл-листы не обязательно, можно пользоваться поисковой системой, см.ниже.\n6. Файл-листы читаются простым нотепадом. Часть файл-листов и старую, но вполне рабочую версию mIRC (без регистрации) можно скачать у меня с сайта: http://gypsy.bluesman.ru/mIRC/\n7. Для поиска в канале можно использовать поисковую систему, которая вызывается командой:\n/ctcp cse !cse\nУ неё очень простой интерфейс и есть он-лайн хелп.\nПример:\n.search Texas Flood - найти все исполнения Texas Flood у всех держателей архивов\nНа выходе будет строка примерно такого вида (получено прям щазз):\n!buzz^ 07. stevie ray vaughan - texas flood.mp3 [8.3 MB]\n!buzz^ willie nelson_milk cow blues - 15 texas flood (kenny wayne sheppard).mp3 [9.3 MB]\nПолученные строчки, начиная с восклицательного знака, надо скопировать и отправить в канал для того, чтобы скачать ЭТО.\n!buzz^ willie nelson_milk cow blues - 15 texas flood (kenny wayne sheppard).mp3\nСредняя скорость скачивания - 10-50 кбайт/сек, так что надо иметь терпение.\nЕжели будут вопросы, то ответы и советы по работе с каналами IRC и программой mIRC буду давать по мере их поступления.</i>\n\nТак вот, вопросы всё-таки вазныклы:\nЯ скачал с www.mirc.com прогу mirc версию 6.3 (размер всего 1,5 Мб), а на http://gypsy.bluesman.ru/mIRC/ лежит файл mIRC.zip размером 10,5 Мб. Такая большая разница в размерах. Почему так? Кстати, кpяк-регистрация тоже нашел и скачал, размер всего 312Кб.\nЗашел на Undernet затем сконектился с Random US server, но в списках #Mp3blues не нашлось, а просто вписал #mp3blues в окошке \"Подсоединиться к...\". Короче, сконектился. Но там юзеров @buzz, @davilo и @wldflwr тоже не нашел.\nЯ так  и не понял как скачать файл-листы, ну и ладно с этим: я воспользовался поисковой системой, которая вызывается командой:\n/ctcp cse !cse\nтам (в командной строке, в самом низу окошка, как долго я не мог найти куды вписывать...) я вписал \n.search steve miller\nНашлось то что искал у юзеров texdan и vicky. Например:\n!texdan steve miller band - living in the 20th century - 10 - ain't that lovin' you baby.mp3 [3.9 MB]\nТак вот, я скопировал то что начинаестя с восклицательного знака (включая восклицательный знак) но без указания размера [3.9 MB]:\n!texdan steve miller band - living in the 20th century - 10 - ain't that lovin' you baby.mp3\nи вставил в командную строку окошка #mp3blues. Через некоторое время появилось сообщение что texdan и vicky don't have steve miller band - living in the 20th century (что-то типа того).\nПодскажите, что я делал не так?\nИ ещё, я бы не сказал что у программы простой интерфейс, как раз-таки савсем не прастой и не дружественный. В он-лайн хелп не заходил - лень."
