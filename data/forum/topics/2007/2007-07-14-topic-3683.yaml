  text: "11 августа с 12 часов дня до 23 вечера в парке «Лефортово». Стоимость билетов\
    \ 500 рублей (очень демократично), но можно купить дешевле распечатав флайер на\
    \ блюз ру и приехав с ним в Би Би Кинг, вы получите билет за 250 рублей, однако\
    \ действие этого билета ограничено. Войти на территорию нужно с 12 до 2 часов\
    \ дня, если опоздаете, придётся платить снова и уже полную стоимость.\n\nУчастники:\
    \ \n\nЗнаменитый Марк Форд, в прошлом гитарист групп The Black Crowes и Gov’t\
    \ Mule, обладатель Grammy (2005)\n\nУроженка Югославии и выпускница Голландской\
    \ Академии в Утрехте, певица и гитаристка, Ана Попович обладает огромным количеством\
    \ наград и регалий. В своей музыке она соединяет блюз с другими современными стилями.\
    \ После американского турне в 2005 году Анну признали звездой мирового уровня,\
    \ а сама она переехала на постоянное место жительства в США. \n\nЭти музыканты\
    \ играют полуторачасовые сеты. Приезжают со своими группами в полном составе.\n\
    -------------------------------------------------------------------\nТакже на\
    \ фестивале играют:\nSОВО – Израиль\nGREEN SPIRIT – Эстония\nSecond Breath и Макс\
    \ Таврический – Украина\nНаверное Svet из Белорусии\nБудут музыканты из Сербии\
    \ (решаем кто)\nКакайта группа из Словакии (Воронов знает, я не помню)\nКоллективы\
    \ из регионов России\nНу и конечно самые лучшие москвичи\n\nДО КОНЦА СЛЕД НЕДЕЛИ\
    \ ПРОГРАММУ УТВЕРДИМ ПОЛНОСТЬЮ."
