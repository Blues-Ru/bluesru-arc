        text: "Для не владеющих разговорной латынью переведу - \"в знак признания заслуг\".\nЛюди по разным причинам не являются концертирующими музыкантами, но это не значит, что а) плохие музыканты б) должны быть вычеркнуты из всех списков и преданы забвению. \nОбъясните теперь мне, дураку, список составляется с коммерческими целями  или с информационными? Если с коммерческими, я дискуссию прекращаю. Баблос побеждает, как всегда, возразить нечего.\nИ что такое критерий \"концертирующий\"? Регулярно играющий гиги? Тогда в список попадут одни фронтмены, сиречь поющие гитаристы (так уж у нас сложилось), а все сайдмены - в саду?\nПо-моему, совершенно необъективно. Опытные сайдмены не в меньшей степени несут блюзовую культуру, хотя и не собирают лавры."
