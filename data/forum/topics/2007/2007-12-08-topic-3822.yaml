  text: 'случайно по ящику наткнулся на киношку ГРЕМЛИНЫ.

    гнусные чудища веселятся в баре.... Один не весел. Он в черной шляпе сидит в одиночестве, курит, перед ним солидный стакан
    вискаря. Я еще не успел ничего заподозрить, как этот Гремлин четко произнес "Блууз". потом получил стаканом в лоб и упал
    со стула.

    Я считаю, что, дружно отстояв честь Лед-Зеп, все форумчане должны дать отпор негодяю Спилбергу. Ибо никто не смеет делать
    пародии на блюз. Спилберг, это была твоя последняя ошибка. Выходи на бой, подлый трус.'
