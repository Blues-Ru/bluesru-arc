  text: "Открытые джемы всё же отменяются. Решение было принято Юриванычем, Анатолием и другими руководителями клуба. Есть открытый джем по воскресеньям, а в понедельники мы (группа Dr. Nick) будем звать проверенных друзей и гостей, которые хотят мило джемануть с акустическим звуком. Дело в том, что публике не очень нравится совсем любительский уровень многих джемующих, особенно когда это громко в комбики. \n\nВот такая вот новость. Она обычная, нейтральная."
