  deleted: false
  text: 'что мы живём в ублюдочной и воровской стране.


    на нас конкретно наехали во время и после концерта. мощный браток, а с ним несколько
    дам. потом и дружки подтянулись. я услышал "век воли не видать", "я щас вас всех
    тут закопаю" и другие приятные вещи. в баре было много людей, они всё это видели.
    конкретно наезжали и на меня, и на Ветерана. я пытался узнать в баре, что нам
    делать, мне сказали, что всё ОК, это всё не страшно. потом я всё же нашёл менеджера
    и узнал у него, что нам делать. ударника мы попросили незаметно убрать гитары
    у нему в машину. менеджер что-то лениво сказал бандитам, но они продолжали говорить,
    что похоронят нас...


    это происходило в крутом месте, где цены раза в 2 больше обычных. вокруг были
    богатые и вроде бы культурные люди. на дворе 2007 год, а мне показалось, что я
    снова в начале 90-х. а лица этих людей. а их говор. а как они одеты (дамы в том
    числе)...


    я вам честно скажу, я жалею, что я не взял нидерландское гражданство в 2001 году.
    эта страна обречена. это народ убьёт себя сам, а мамеды помогут.


    музыкантам: вы знаете это место и будете там выступать. ибо у нас нет ни тусовки,
    ни профсоюза, ни дружбы, ни музыки... все просто приехали сюда грести бабки, которые
    отваливаются периодически от всякой братвы и гос. мафии разных видов.


    у меня ужасное настроение. вы бы слышали, что они мне говорили. и что у меня с
    передними зубами и губой - они постоянно лупили по стойке...'
