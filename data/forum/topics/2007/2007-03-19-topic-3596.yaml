    deleted: false
    text: "Минусы:\nБарабаны _вообще_ никакие, играют совсем не то и звучат гнусно\nБас мимо всего летает\nЗвук гитары _откровенно_ плохой и неправильный\nВсе в целом не слушается, нету плотного грува и цельности\n\nПлюсы:\nЕсть дудки, а значит группа так вообще всем этим достаточно глубоко занимается, что в любом случае хорошо\nПоработали над аранжировками, не то что бы как надо, но сам факт работы это хорошо\n\nВообщем, надо заниматься дальше. Больше слушать, искать нормальный звук гитары и учить барабанщика играть как надо. Ну и всем вместе ловить правильное ощущение грува и вообще учиться попадать в друг друга. Тогда все получится и все будет как надо.  \n\nВсе вышесказанное есть мое личное мнение :) не претендую на какую-либо значимость, заранее извиняюсь за, может быть, излишнюю резкость в оценках."
