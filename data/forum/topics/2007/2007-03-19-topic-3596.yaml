    text: "Естественно нельзя сваливаться в полный звуковой хаос...ибо это тоже будет \" а у меня дома линолеум под старый дуб \". Мы живём в современном мире и требования к звучанию у нас должны быть соответствующие... И даже если современные музыканты пишутся на старой лампово-бабинной халабуде 50х годов, их записи слушаются всё равно современно , только с одним вкусным ньюансом - передача всего позитивного музыкального наследия накопленного за историю звукозаписи.\nа в данный момент,( ну это моё видение) ... звукорежиссёр это такой же член группы как и басист, барабанщик... и он , своей работой должен тоже создавть настроение, передавать чувства музыкантов всеми возможными средствами..а не просто следить насколько отчётливо цыкает чашка у райта в верхних частотах и насколько зычно ухает бас... \nЗвукорежиссер - есть та самая прокладка между рулём и сидением, без которой музыкальная машина не тронется с места...и не поразит всех мощным рёвом , динамичным ускорением  и красивыми фигурами автопилотажа."
