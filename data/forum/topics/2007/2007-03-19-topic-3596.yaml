    text: "John ! Сами мы не местные, и человек я не особо умный , но сказать хочу следущее..\n Трилизгон не такой уж несоотвествующий тексту - на мой взгляд драмматизм выдержан в рамках стремительного фанка уносящего героя в даль от прошлого неприятного.. \"трила\"...( ну я лично себе объясняю так) ...Опять же тёти на подпевках это всегда плюс... ХучуКучуман достин высоких похвал...\n\nЕдинственное, но это опять же моя лично философия, что меня ломает при прослушивании руссиш-блюз-бандов вабще : \n Русский акцент от которого не возможно кому то избаиться совершенно...и при этом вокалист всё таки упроно и нарочито поёт \"под асашай\" видимо думая, что таким образом он приближается к аутентичному блюзовому звучанию... Я думаю это скорее вызывает резонную, граничущую с насмешкой улыбку, нежели искренний возглас \" вау зис из фирма! зис из блуз!\"... \n Доктор Ник сказал правильно - с Языком надо работать.. и желательно что б тебя , как в шпионской школе , котроллировали носители языка ни давая спуску.... \n Или есть другой выход, мне более близкий... Петь откровенно с русским акцентом вабще не запариваясь, что нужно косить под американца, и искренне как ребёнок выражать свои эмоции. хммм пример тут правда не блюзовый, а сайкобилли-панковский - Gogol Bordello  - вабще не парится над тем что у него русский акцент...И мало чего в его музыке меня ломает..разве что через 3-4 песТни становится скучновато...музыка уж больно через чур напористая...( но акцент - не ломает, это факт, а придаёт стильный шарм, работая по принципу \"дали тебе лимон- сделай из него лимонад\")\n к чему это я... всякое старание петь максимально приближенно без акцента, душит в первую очередь твои личные человеческие чувства, которые ты выражаешь как артист... Мне чувства более интересны, нежели фирменное звучание тарелок гитар барабанов и дудок...Да хоть на тазах и расщепах играй - главное быть собой и петь искренне о чём болит. Качество записи это дело десятое... \"Стариков\" же никто не критикуетт за то что у них пол песни что то пердит в микрофонах... \n Я за правду и праздник.\n \nЭто моё личное мнение - можете кидать в меня теперь ссаные тряпки."
