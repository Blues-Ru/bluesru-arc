    subject: Слушали-постановили...
    deleted: false
    text: "Полный Зачот! \nВ кои-то веки довелось услышать хорошую профессиональную работу, а не дилетантские претензии на ловлю филина в мутных нотах.\nВсё хорошо звучит, прозрачно, все инструменты читаются. Аранжировочки хорошие, командная игра отличная. Особенно вставочки духовых радують, редкость в наше время тотального гитаризьма. А гёлз на подпевках - это уж вообще барство какое-то, прям непозволителная роскошь ))\n\nBlues Before Sunrise - очень жизнерадостно получился, бодрит.\nВ конце когда гитарист завис на аккорде G, я подумал - щас Time Machine им.Grand Funk заиграют..не, коду сыграли.\nDon't Talk About Love - все хорошо, но загнали слехка.\nХучи-Кучи порадовала нестандартным, прям-таки симфоническим подходом к аранжировке.\nЗа что хочется повоевать - так это за стилистические сдвиги.\nС фанки-версией Thrill Is Gone я не совсем согласен, песня-то лирическая, но это ладно, за гёлз на подпевках я всйо прощу!\nА вот One More сдвинутая из рутс-реггей в хард-рок - это уже, извините, слишком далёкая традукция. Джа обидится и не ниспошлёт на вас благодать ))) Хотя сделано вполне грамотно.\n\nИз недоделок по мелочам.\nУ ударных медь какая-то уж очень рассыпчатая. Как даст \"бзынь\", так на два такта вперед она и бзынькает пока не заглохнет - особенно в Blues Before Sunrise. \nI got the blues **БЗЫНЬ!!!!** before sunrise.. - я аж подпрыгнул ))\nВозможно, это творческий приём такой? =)"
