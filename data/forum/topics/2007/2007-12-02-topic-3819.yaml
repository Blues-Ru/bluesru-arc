            text: 'Почему же мы так боимся собственного мнения то? Зачем ИМХО каждый раз добовлять, если человек пишет, и подписывается, то ясен пень - он выражает именно свое мнение, и если оно не совпадает с мнением ткачих из иванова или там Димы Казанцева -то и славно. А ИМХО ставят путь только те, кто обычно пишет от имени всего народа или Б. общественности, но у нас то таковых почти что и не имеется.

              А выражать общепринятые мнения вообще тупизм - признавать свое слияние с толпой, серой массой, отсутствие собственного вкуса и способности разобратся.

              Так что давайте писать по всем правилам русского языка, который не предусматривает никаких ИМХ.'
