    text: Насколько я помню (пусть товарисчи старшие меня поправят, если не так) калибр стволов у американцев меряется в процентах от дюйма. Соответственно - 32 - это около 78 миллиметров. Двойное обозначение - 32 - 20 - это рассверленный 20-ка. Были и такие стволы, рассверливали на больший калибр. Скорее всего - это маленький колт типа "бульдога".
