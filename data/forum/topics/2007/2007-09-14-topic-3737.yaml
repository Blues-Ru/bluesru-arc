  text: 'Я и КОТЫ!

    ( выставка животных с музыкой в клубе БиБиКинг)


    14 сентября 20.30 :)


    МАСТ СИ ОЛ ОФ Ю!


    В программе ожидаются:

    Рассказы, воспоминания о МАМАКАБО (это отдельная крутая тема!)... крыме.... пансионате химик... коньяке...

    Джеме с Максом Таврическим после _Всего_.

    О том что такое аварийное окно в поезде и как его могут опустить и поднять два гитариста без использования штатного рубильника... как барабанщик может стать оператором оконного тормоза и наколоть цыганку.

    Что лучше - дыня или гашиш?

    Почему гитаристы начинаю носить обувь наоборот.

    Матрас, который видел живого Ленина.

    Что нужно есть чтобы отравиться как следует.

    Почему водители музыкантов склонны к дайвингу в канализации.

    Как быть "настоящим мужыком".

    Что такое грязь поколено и зачем нужны умывальники...

    Почему надо есть черную икру только вместе с красной ..

    Что такое блюз и почему Николай Сырцев не сумел попасть на фестиваль...

    Да и многие другие свежие воспоминания от которых хочется... МНОГОЕ!'
