  text: 'Недавно на другом форуме читал интересную вещь. запостил её мой товарищ с
    никнеймом john lee hooker:

    <i>Недавно, от нечего делать, уставилси в ясчик, где показывали кажецца, муви
    "Домино", где играл Микки Рурк... И опять, как и в "Ковбое Маарльборо и Харлее...",
    Рурк упоминает SRV. На этот раз он повествует о том, как играл со Стиви в самом
    начале в клубах. :-)

    В реальности Стиви и Микки стали приятелями в 1988-ом. Рурк звал СРВ на роль байкера-полуиндейца
    в фильм "The Ride"... Стиви пришлось отказаться по причине сильной занятости (гастроли
    и тэ пэ). Дружбе сей отказ не помешал.

    Кстати, напомню, что  СРВ также принимал участие в записи неплохого альбома Дон
    Джонсона со своим английским приятелем , неким Ронни Вудом :-)

    Короче, становицца понятным, почему лого "SRV" на куртке торчит постоянно в кадре
    "Харлея и Марльборо"</i>

    <img src="http://www.beatles.ru/img/f/777b/777755.jpg">'
