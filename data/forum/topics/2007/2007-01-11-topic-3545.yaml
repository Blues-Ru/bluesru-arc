    deleted: false
    text: "Вообще хорошо, что появляются молодые группы, да ещё исповедующие эстетику сёрфа и чистого гитарного звука. Но\
      \ поскольку просили злостную критику, то получите. \n\nПервая проблема с арифметикой. Пара ссылок равна четырем ссылкам.\
      \ Но это от застенчивости, со всяким бывает.\n\nСледующая проблема с самоидентификацией. Или вы занимаетесь серьёзной\
      \ музыкой, или пародийной. Если вы называете свои пиесы \"колбасный стандарт\", то именно он у вас и получится. За советами\
      \ по пародийной стилистике пожалуйста к Руслану Чифурову, он у нас зав.отделом йумора и сотиры.\n\nСамая большая проблема\
      \ с голосом. Надо что-то делать, причем радикально. Идея типа \"Кузнец, скуй мне голос\" вполне пойдет. Лучше орать,\
      \ чем шептать или мямлить. При этом желательно попадать в ноты.\nЕсли в ноты попасть ну никак невозможно, тогда лучше\
      \ не петь, а просто проговаривать текст, в истории есть много примеров таких.\n\nЕще проблема - по-моему, или на гитаре\
      \ слишком толстые струны, или пальчики слабенькие. Подтяжки кривые, особенно в конце. \nСсылки на СРВ и его комплект\
      \ .13-.62 не предлагать, не проканают.\n\nТретья проблема - зависание пустот. Ударник с басом несколько раз посредине\
      \ песен бросают инструменты и просто прекращают играть. Возникает вакуум. Я за минимализм, но паузы должны быть в нужном\
      \ месте и длиться нужное время. Какое - определяется опытным путём. Опыт достигается упражнениями.\n\nТеперь по пиесам.\n\
      1) Need Somebody To Love - вступление получилось. Импровизация в конце \"порадовала\" аццкими диссонансами. Слушатели\
      \ активно помогали вокалисту  найти правильную ноту в финале произведения, за что им отдельное спасибо.\n2) Слабые пальчики.\
      \ Pipeline конечно можно так играть, но лучше еще порепетировать. В конце темы pipeline не надо играть лишние \"тататататата\"\
      , это руки чешутся. См.ремарку про звучащие паузы.\n3) Рифф хороший, хотя напоминает почему-то Slade. После вступления\
      \ начался чисто \"умирающий лебедь\". Бросили инструменты и потеряли взятый в начале грув. Испугались, наверное.\n4)\
      \ Название конечно с претензией. Опять же отмечу робость и вялость ритм-секции, которую никак не может компенсировать\
      \ энтузиазм гитариста."
