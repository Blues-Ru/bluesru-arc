  text: "<p>Мы молодые музыканты из города Владимира. \nИграем блюз и все на нем замешанное. \nЗовемся The Deadly Drunkers,\
    \ выглядим так:\n<div align=center><a href=http://www.dedmorozzz.elcom.ru/pics/yo29/06.jpg><img src=http://www.dedmorozzz.elcom.ru/pics/yo29/06_t.jpg></a></div>\n\
    </p>\n<p>В рамках федеральной программы \"выньте снаряд из жопы\" выкладываю пару ссылок на наши записи. Хочется узнать\
    \  мнение авторитетов о том, что мы делаем. Злостная критика и вообще ругань приветствуется. В целом всю правду о наших\
    \ ошибках и косяках я, конечно, знаю, но мнение со стороны всегда интересно. </p>\n<p>\nСсылки такие:\nNeed Somebody To\
    \ Love -  <a href=http://www.dedmorozzz.elcom.ru/sound/yo29/02_need_128.mp3>128 kbps, 3.5 MB</a> | <a href=http://www.dedmorozzz.elcom.ru/sound/yo29/02_need_64.mp3>64\
    \ kbps, 1.7 MB</a>\n\nDick Tracy - <a href=http://www.dedmorozzz.elcom.ru/sound/yo29/17_dicktracy_128.mp3>128 kbps, 3.0\
    \ MB</a>   | <a href=http://www.dedmorozzz.elcom.ru/sound/yo29/17_dicktracy_64.mp3>64 kbps, 1.5 MB</a>\n\nLost In You\
    \ - <a href=http://www.dedmorozzz.elcom.ru/sound/yo29/07_lostin_128.mp3>128 kbps, 3.9 MB</a>   | <a href=http://www.dedmorozzz.elcom.ru/sound/yo29/07_lostin_64.mp3>64\
    \ kbps, 1.8 MB</a>\n\nLe Slow Danse De Kolkhoze - <a href=http://www.dedmorozzz.elcom.ru/sound/yo29/09_kolkhoze_128.mp3>128\
    \ kbps, 3.9 MB</a>   | <a href=http://www.dedmorozzz.elcom.ru/sound/yo29/09_kolkhoze_64.mp3>64 kbps, 1.8 MB</a>\n</p>\n\
    <p>\nПервая - это среднетемповой шаффловый стандарт, вторая - колбасный серфовый стандарт, третья - минорный шаффл про\
    \ любофь, типа нашего сочинению; четвертый - минорно-мажорный серфовый медляк, тоже наш. \n</p>\n<p>\nТак что вот. Заранее\
    \ спасибо за внимание :) \n</p>"
