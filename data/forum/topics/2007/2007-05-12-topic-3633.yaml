            text: "> 15 тому назад удивило Columbia Records своей популярностью, достигая статуса \"золотого диска\" по количеству\
              \ продаж\nЭто для меня очень удивительно и отрадно. Хотя с другой стороны это же и несколько печально так как\
              \ (вероятно) этот факт мало относится с постсоветскому пространству: в коллекции \"нашего\" \"культурного\"\
              \ человека трудно сыскать записи Роберта Джонсона.\nК сожалению, в Совке имя Роберта Джонсона. известно не многим,\
              \ и даже среди музыкантов (даже просто имя многие не знают, а тем более его творчество). \nНу, а имя Клаптона\
              \ известно многим, почти каждый обыватель знает это имя (именно и только имя: спроси название какой нибудь песни\
              \ - только прадвинутые назовут Tears in Heaven и Layla).\nРазумеется, всё вышесказаннное моё IMHO."
