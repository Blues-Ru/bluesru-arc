          subject: Не уверен
          deleted: false
          text: 'На самом деле диски Роберта Джонсона не плохо продаются уже некоторое время.  Полное собрание Джонсона, которое
            вышло лет 15 тому назад удивило Columbia Records своей популярностью, достигая статуса "золотого диска" по количеству
            продаж.  В отилчии от других ранних или деревенских блюзовых музыкантов Роберт Джонсон стал очень модным - единственным
            блюзмэном, который должен быть в коллекции любого "культурного" человека.  Конечно, Clapton Unplugged тоже продовался
            немало.  Но я не уверен, что больше людей знают версию Walking Blues Клаптона, чем версию Джонсона.  То, что больше
            знают, и версию Джонсона, и версию Клаптона, чем версию Сона Хауса - само собой разумеется.


            Muddy'
          replies:
