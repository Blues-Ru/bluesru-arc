      text: 'У того же Клэптона позже вышел такой альбом: Sessions For Robert J - кто такой этот Роберт, я думаю, понятно.
        Так вот на мой взгляд, наибольший интерес представляет двд, который в некоторых изданиях продается с альбомом. И менно
        на этом двд Клэптон подробно и весьма интересно рассказывает про Роберта Джонсона, про то ,как записывался этот диск
        (они специально играли там же, где Джонсон и т.п.). Т.е. надо отдать Клэптону должное - он предложил интересующимся
        людим из множества массового слушателя узнать именно о Роберте Джонсоне.'
