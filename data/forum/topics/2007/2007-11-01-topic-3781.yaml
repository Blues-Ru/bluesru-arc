          subject: Ходить - не ходить.
          deleted: false
          text: "Множество годиков назад в журнале Guitar Player читал я беседу Бадди Гая со здравствующим тогда Албертом\
            \ Коллинзом. Беседа была дружественная, и зашел разговор, что порой, как ни старайся, концерт не идет. А порой\
            \ – на одном дыхании.\nНе так бы я сильно над этим задумался, если бы не один момент в книге Роберта Палмера,\
            \ где он описывает, как в 70-х побывал на концерте Отиса Раша. И одно отделение было – полный провал, второе –\
            \ полный успех… я об этом писал уже на блюз-ре и не хочу повторяться, но все-таки кое-что повторю…\nВы хотите\
            \ иметь гарантированный товар? Покупайте Диму Билана. Хуже, чем показано – не будет.\nИдя на блюзовый концерт\
            \ – вы всегда рискуете. \nЯ был на двух концертах Тейл Дреггера. Первый был хорош как экзотика – не более.. На\
            \ втором случилось нечто, что я не забуду никогда.\nБлюз – живая музыка, а в жизни бывает всякое.\nИдя на блюзовый\
            \ концерт – вы рискуете… не любите рисковать? Покупайте гарантированный товар."
        person_id: 335
      person_id: 4
