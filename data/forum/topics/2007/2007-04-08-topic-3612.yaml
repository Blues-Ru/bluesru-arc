  text: "Друзья!\n\nТеперь не будет открытых джемов, как я понял. Группы по средам должны найти специального гости и звать на сцену только проверенных друзей-музыкантов (трезвых и умеющих). \n\nБиБиКинг - это блюзовые джемы. В крайнем случае блюз-рок, рок-н-ролл, ритм-н-блюз, соул. Не металл, не русский рок, не джаз, не попса, не хард-рок, не джимихендриксфорева. Это я пишу для тех, кто выходит пилить на гитаре, а не играть ПО БЛЮЗУ.\n\nВ эту среду играет Dr. Nick. Наш гость - Новокольский Дима из групп Apple Jack & BACK. Если кто-то из практикующих музыкантов хочет с нами сыграть тоже, то просто дайте мне знать по почте или тут в форуме.\n\nСпасибо за внимание!"
