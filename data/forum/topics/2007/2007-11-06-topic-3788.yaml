    deleted: false
    text: "Но к сожалению широко распространены 2 заблуждения:\n\n1) блюз - это джаз\n2) блюз это медленная грустная песня.\n\nНасчет \"какого-то фанка\". Фанк - это вообще-то одно из направлений блюза и есть. \n\nИ я не заметил особого отличия в сторону \"блюзовости\" у Гарнера. На мой взгляд очень интересный Маккрэй (особенно в третий день - в первые два дня басист его полностью затмевал). Шерри Уильямс - очень неплохо. Сакс Гордон добавил драйва. А вот Гарнер какой-то как раз непонятный был (за исключением последней песни, которую они все вместе пели)."
