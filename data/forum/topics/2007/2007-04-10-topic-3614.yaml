  text: 'Эти дни в истории блюза...

    В 1946 году (61 г. назад) Лео Фендер (Leo FENDER) запатентовал Stratocaster.

    Бадди Гай говорил журналу Guitarist: "На ходу с багажника на крыше машины свалился "страт". И хоть бы хны! Только слегка
    расстроился".

    Вот такое вот событие стратосферного уровня :-)'
