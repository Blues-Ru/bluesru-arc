      Сам я петь не пошёл (прошу прощения у тех, кто на меня расчитывал) и вот почему:

      Во-первых, уже сказал- голова...

      Во-вторых и самое главное, я не знал что мне там делать и зачем я там нужен. Гитаристы-то понятно- играют вместе -им
      весело. А я должен был сначала объяснить всем чего я хочу, потом пару куплетов петь, потом стоять у стенки и ждать ,
      пока все наиграются. Петь там, в общем, было кому, моё появление что-то улучшить не могло. Я было собрался уже выступить
      с Иващенко и Коньковым, но Петрович меня опередил, на что я не в обиде, естественно.


      "Себя показать" совсем не хотелось...


      Итог: понравилась первая часть джема- Каверкин-Дзагнидзе-Новосёлов. Не понравилось Иващенко-Коньков-Петрович. Потом
      понравилось Робиллард-Норсия-Иващенко и всё остальное.'
