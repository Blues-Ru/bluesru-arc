  text: 'Джентльмены!

    Тут совсем неподалёку (/beefheart/sounds.htm) выложена кое-какая музыка, которая м.б. кому-то интересна. В данном случае (в "блюзовом контексте") я бы обратил ваше внимание в первую очередь даже не на последний альбом "самого", а на имеющиеся там же вещи Бифхарта, записанные его (бывшими) музыкантами в 2000-х годах. Играть ребята умеют, энтузиазма тоже хватает.. ну и т.д. Битрейт невысокий (сл-но, объём небольшой), но для ознакомления качество приемлемое, на м. взгл.

    С удовольствием отвечу на любые вопросы (просьбы), если таковые будут.'
