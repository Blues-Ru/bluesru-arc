  text: 'У Джона Леннона есть известное высказывание насчет блюза: он назвал блюз «самым первым стулом», на котором посидели все рок-н-ролльщики. Led Zeppelin сделали для этого стула обивку, украсили его искусной гравировкой, раскрасили в яркие, кричащие цвета и сделали из него самый большой и самый дорогой стул за всю историю музыкального бизнеса. Они заново изобрели этот стул - так из блюза вырос хеви-метал.

