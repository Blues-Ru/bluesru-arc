          text: "жизнь показала что при подмешивании одного к другому общая картинка намного лучше и выразительнее. Это я\
            \ не конкретно про вокал. На самом деле если брать сигнал с пульта то он вывернут наизнанку т.е то что громко\
            \ играет на сцене будет тихо в пульте,а то может и вообще идет мимо,ну и соответственно наоборот что тихо тут\
            \ то громко там.И вот тут-то приходят на помощь микрофоны вылавливающие недостающее и вообще передающие атмосферу\
            \ действа. Если оставить только микрофоны...ну не знаю в маленьком клубе типа \"Б.Б.Кинга\" и \"Дома у дороги\"\
            \ может быть и то как-то сомневаюсь,а в большом типа \"Ритм-н-блюз кафе\" эхо затрахает.\n-------------------------------------------------------------------\
            \   \n  На самом деле произошедшее крайне неприятно из-за своей неожиданности. За время существования блюзмана.ру\
            \ никто и никогда ни в одном клубе включая таких монстров как \"Форте\" и \"Ле клуб\" не говорил таких очень правильных\
            \ слов смысл которых всего-то навсего свёлся к тому что мол это мой аппарат и врубиться я тебе не дам. \nЧто ж\
            \ после могучего праздника пойду с поклоном в ББКинг,может там не прогонят ;) благо пока писалку Ralandовскую\
            \ не забрали (плюю и стучу). Правда до дома добираться в два раза дольше,ну да ладно мож соображу чего."
