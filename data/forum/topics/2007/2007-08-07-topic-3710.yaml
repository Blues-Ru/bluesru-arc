          subject: А вот и нет!
          deleted: false
          text: "В маленьких клубах, типа ДУДа, вообще, с порталов (и соответственно с линеки пульта) идет только вокал. Гитары,\
            \ бас, ударные - только с комбов и живым звуком, ловить их в линии - глупо.\nПолноценно все идет из колонок при\
            \ мощности аппарата где то от 10-12 кВт, и при зале (открытой площадке) больше чем на 500 человек.\nУдарные подзвучиваются\
            \ тоже, неполноценно - бочка, в лучшем случае еще и малый, но не более того. Хотя и есть схемы, как 3 микрофонами\
            \ полноценно вызвучить установку, их на моей практике никто не применяет.\nПри записи с пульта (когда есть такая\
            \ задача), я например - забиваю на публику, одеваю закрытые уши, и работаю только на них. \nПравдв до того, я\
            \ все таки пытаюсь обычно настроить систему так, чтобы было похоже, то что идет с порталов и то, что слышно в\
            \ ушах. Но на это уходит часа 4 минимум, почему то никто не заморачивается хотя бы с настройкой кроссовера и портальных\
            \ эквалайзеров.\nА с роландом самое нормальное писать так - 2 канала микрофонная стереопара, 2 канала - линейный\
            \ выход с пульта, и оставшиеся 4 распределить на наиболее важные и трудно выстраиваемые инструменты - выделить\
            \ на инструментальную подгруппу, на вокалы и оверхеды, и обязательно бочку и бас отдельно. Лучше кстати не брать\
            \ с пульта, а провесить своими микрофонами, ну будет на комбах по 2 мика - чего же им :-) Но все равно, для полноценной\
            \ поканальной записи стандартной группы, надо минимум 16 каналов, а потом - заморочки со сведением на пол-года,\
            \ так что может лучше просто микрофоны и мастеринг записи."
