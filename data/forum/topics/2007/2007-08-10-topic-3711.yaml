  text: "Мы сегодня ходили на Sobo в БиБиКинг, мне понравилось! Хорошая ритм-секция\
    \ играла очень уверенно, точно и забойно в разных стилях. Качественный вокал у\
    \ басиста + приятное обхождение с публикой. Даня Криман играет слайдом на полуакустической\
    \ гитаре типа national steel просто великолепно. Никакой каши и джема, все песни\
    \ до одной саранжированы. Звук получается довольно драйвовый - забойный. Репертуар\
    \ был довольно простой без изысков, местами с рок-стандартами, а когда пришел\
    \ потанцевать Валентин, то для него было сыграно поппури из хитов рок-н-ролла.\
    \ Мне лично не хватало чего-то нестандартного в подборе песен, какой-то рафинированности,\
    \ необычного использования того, чем они владеют. Но, в общем, понятно, что программа\
    \ рассчитана на израильскую публику, которая слушает блюз не каждый день. \n\n\
    Концерт был приятным неожиданно, ибо хороших групп бывает, увы, довольно мало,\
    \ не каждый день ;)) Ура!"
