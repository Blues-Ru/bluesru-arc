            subject: 'Журнал Джаз-Квадрат дает краткую справку о Форде:'
            deleted: false
            text: "Концерт Робина Форда 9.12.07\n\nМесто Робина Форда в элите современного\
              \ блюза вряд ли кто-то возьмется оспаривать. О его феноменальной виртуозности\
              \ ходят легенды. Он начал с классического джазового инструмента – саксофона,\
              \ но потом заболел гитарой и даже на какое-то время свернул в сторону\
              \ рока. Но кумирами для него все равно оставались великие джазовые исполнители\
              \ Джон Колтрейн и Майлз Дэвис.\n\nСтав профессионалом в конце 1960-х,\
              \ он играл во многих группах – то блюз, то рок, то фьюжн, выпустив в\
              \ 1978 г. свой первый сольник как раз в этом стиле. В начале нового\
              \ тысячелетия интересы Форда вновь сосредоточены на блюзе, хотя он не\
              \ устает предупреждать своих поклонников: «Вы услышите все, кроме того,\
              \ что ожидали услышать».\n\n9.12.07 Светлановский зал \nСЕРИЯ \"Герои\
              \ блюз-рока\" \nРоббен ФОРД, гитара/ вокал (США)"
