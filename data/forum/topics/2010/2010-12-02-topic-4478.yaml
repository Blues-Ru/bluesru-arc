  text: "«Пан или пропал?», «Что первично: материальное или духовое?», «Хорошо ли\
    \ быть одержимым во имя победы?», «Какова настоящая роль лидера?» Всё это лишь\
    \ часть, причём далеко не самых острых вопросов, которые поднимались на подготовке\
    \ к эфиру очередного  выпуска молодёжного ток-шоу, которое «варится на ночной\
    \ кухне» телеканала «Столица». Это своего рода, интеллектуальный клуб, где собираются\
    \ самые яркие, креативные и перспективные представители своего поколения.\nВо\
    \ время очередной записи, разгорелся ожесточенный спор о  близости материального\
    \ и духовного, об идеологии лидера и хорошо ли молодому человеку быть одержимым\
    \ идеологией победы.\n Ведущие проекта, затронули многие стороны жизни общества,\
    \ которые пока еще хранятся в памяти многих людей. Равно как и  воспоминания о\
    \ временах, когда люди, желающие достичь большего в своей жизни, попадали в категорию\
    \ карьеристов, мещан, буржуев и прочих товарищей, которые «нам совсем не товарищи»….\n\
    Лидер группы ПЛИМУТ высказал, мысль о том, что человек создан достигать большего,\
    \ а поколение 60-70-х выросло на «духовных котлетах», что ущемляет их самореализацию\
    \ возникающих из-за этого внутренних противоречий.\n- Наше поколение, – сказал\
    \ он, -  не имело точного понимания того, что желать большего не является чем-то\
    \ противозаконным или недостойным, поскольку идеология общества не давала, в то\
    \ время, молодому человеку оценить весь спектр возможностей и перспектив.\n«Духовные\
    \ котлеты» оскорбили певицу Марину Хлебникову, также принявшую участие в программе.\
    \ Она была возмущена цинизмом высказывания, отметив, что «ее родители свою жизнь\
    \ положили, чтобы заработать хотя бы на такое пропитание для своих детей».\nТоварищ\
    \ ПЛИМУТ согласился, что его родители также выращивали его на «духовных котлетах»\
    \ за что благодарен своим родителям и на свои формы он отнюдь не жалуется.\nЗатем\
    \ стороны примерились мыслью о том что, действительно, «духовных котлет» много\
    \ не бывает… Они не успевают накопиться и их обязательно надо чередовать с материальными.\n\
    Кроме того, участники дискуссии отметили, важность воспитания в молодом человеке\
    \ желание выразить себя в этой жизни, показать перспективы и возможности, и не\
    \ забывать при этом родительский рецепт приготовления «духовной котлеты», без\
    \ которой все достижения будут бессмысленными.\nВ конце программы вокалист и гитарист\
    \ группы ПЛИМУТ выступили под акустику с песней «Привет» дебютный клип на эту\
    \ композицию был недавно презентован в Чайна Таун Кафе. \nЭфир программы вы сможете\
    \ увидеть 14 декабря 2010 на ночном молодежном канале телеканала «СТОЛИЦА».\n\
