  deleted: false
  text: "<i>http://muz.ru/Store/NewsDetails.aspx?NewsId=73949 сообщает интересную новость (только формулирует ее странновато):</i>\n\
    \nБлюзовый гитарист Albert King <b>согласился</b> поучаствовать в записи концертного альбома культовых американских рокеров\
    \ из группы «The Doors».В самом скором времени группа «The Doors» издаст на CD некоторые свои концертные записи. Примечательно,\
    \ что при подготовке данной фундаментальной работы участники группы пригласили культового американского блюзового гитариста\
    \ Альберта Кинга. Пока неизвестно, когда именно этот альбом появится на прилавках музыкальных магазинах, но известно,\
    \ он станет компиляцией композиций, которые были записаны на различных выступлениях в 1970 году. Предстоящий релиз уже\
    \ получил название «The Doors– Livein Vancouver 1970».\n\nПока многочисленные поклонники творчества культовых рокеров\
    \ с нетерпением ждут нового альбома, музыканты спешат развеять слухи о том, что больше не будут играть вместе, в частности\
    \ сообщая, что новые концерты ещё обязательно будут. К примеру, прославленный клавишник Рэй Манзарек и сейчас продолжает\
    \ работать над новым музыкальным материалом, ну а сотрудничество с таким мэтром гитарного искусства, как Albert King,\
    \ хоть и выглядит весьма иллюзорным, ведь происходило достаточно давно, сейчас может лишь подогреть интерес к группе,\
    \ активная деятельность которой прекратилась ещё в 1971 году после смерти вокалиста Джима Мориссона. \n\nАльберт Кинг\
    \ является уникальным гитаристом, поскольку, будучи левшой, он не стал поворачивать гриф влево, равно как и не стал переставлять\
    \ струны. Получилось, что самая толстая струна оказалась для него нижнее. Аналогов такой оригинальной гитарной технике\
    \ игры на гитаре фактически нет. Стоит также отметить, что Albert King записывался с «The Doors» ещё сорок лет назад и\
    \ вот теперь эти композиции будут опубликованы."
