  text: 'Очень грустные новости, Коттон Клаб, который открылся в сентябре 2009, не устоял и закрывается как музыкальный клуб
    с 1-го мая. Что будет дальше в помещении клуба, - неизвестно, ЮрИваныч уже не будет иметь к этому отношения.


    Вся блюзовая жизнь из Cotton Club перемещается в Дом у Дороги, в котором всё вполне безоблачно.


    Что можно сказать, поддерживайте любимые клубы, ходите туда сами, просаживайте деньги на пиво, тащите друзей, пишите об
    этом в блогах, и тогда клубы будут процветать!'
