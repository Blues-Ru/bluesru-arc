  subject: Где научиться играть на гитаре? Совет от капитана Немова!
  deleted: false
  text: "Выбор преподавателя - пожалуй самый ответственный шаг в процессе обучения в целом. \nПопадётся дотошный педант - испортишь себе нервы и разоришься на кругленькую сумму,\nпопадётся весёлый ненапряжный халявщик, у которого любимая фраза \"всё ОК - ты молодец\"   - ничему не научишься и впустую потратишь деньги.\nВсё зависит от поставленных целей. \nМой совет всем кто ищет преподавателя: обратите внимание на стоимость услуг: если она слишком низкая, значит это халявщик (\"всё ОК - ты молодец\"), если слишком высокая - это либо профессионал экстра класса, либо халявщик с манией величия. Выбирайте средний вариант и никогда не ошибетесь!\nhttp://www.vivaharmony.ru/ - зайдите сюда, здесь лучшие преподаватели!\nЖелаю удачи!"
