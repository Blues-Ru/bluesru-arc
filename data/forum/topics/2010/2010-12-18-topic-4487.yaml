  text: 'В 1908 году (102 г. назад) в Вейкфилде, Кентуки, родился Билл Карлайл (Bill
    CARLISLE). Сольно, под гитару, и с братом Клиффом, игравшим на добро, они играли
    кантри с хорошей долей блюза, добавляли йодель и гавайскую гитару для пущей сладости
    или, наоборот, терпкости. Название некоторых песен Билла озадачивают… Например,
    Jumpin'' and Jerkin'' Blues.


    И фотка Дона Гибсона.'
