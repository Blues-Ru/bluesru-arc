  text: '<small>INFOLine, ИА и Advis.ru ( http://www.advis.ru/cgi-bin/new.pl?23055DD5-71D4-EC4C-A7BF-3384B687FF6A
    ) сообщает:</small>


    "17-19 декабря 2010 г. с 10.00 до 20.00 в Выставочном центре "КраснодарЭКСПО"
    (г. Краснодар, ул. Зиповская, 5 Павильон № 1) будет проходиnь очередной Фестиваль
    "Вина Кубани 2010"... В рамках этого мероприятия пройдет Фестиваль популярной
    инструментальной музыки "Винный блюз". Принимают участие лауреаты конкурсов и
    фестивалей игры на трубе, саксофоне, гитаре, победители джазовых конкурсов, студенты
    и учащиеся университета культуры и искусств, музыкальных училищ города и края.
    Вход бесплатный."


    <small>А блюз он воообще бесплатный. It''s just the worst feeling I ever had.</small>'
