    text: 'В «Cotton club»- звук – просто сказка. О большем и мечтать нечего: выверенное, сбалансированное и объемное, и сочное. Все «верха», все «низы» – на месте. В «Доме у дороги» звук не хуже, он просто принципиально другой.


      Лучший свой концерт Лейзи Лестер отыграл в «Коттоне» - ему не впервой выступать перед респектабельной публикой, особо живого отклика он в таких случаях и не ожидает. Концерт прошел, что называется, гладко. Неметт в «Коттоне» тоже не растерялся, однако в «ДУДе» он играл куда оживленней! Его жарко встречали, что не могло не завести и самих музыкантов, в ответ – встречная волна эмоций, резонанс и прочие лучшие «оттяги» именно блюзовых концертов. Особая атмосфера, те самые «good vibrations» возникают именно в таких условиях.  «Cotton club» - место еще новое, и блюзом не пропитанное. Представить в нем такую же толпу «стоящих» прямо перед сценой просто невозможно. В «ДУДе» клиенты, заказавшие столик не перед самой сценой, на концертах просто обречены видеть только спины «стоящих», в «Cotton club» более комфортно, а вот «горячая атмосфера» и прямая взаимозависимость музыканта и слушателя теряется. «ДУД» четко делится на два зала (на всякий случай: и в «ДУДе» и в «Cotton club» есть еще отдельные комнаты для бильярда). Однако на Неметте услышать хоть что-то во втором, дальнем от сцены, зале было невозможно. Публика гомонила, перекрикивая музыку. В «Cotton club» - другая беда. Его делят пополам колонны, и, хотя музыка за колоннами слышна не хуже, самой сцены уже не видно. Вот вам и дилемма. И тут надо что-то делать? С чего начать – с простого: ходить на концерты в новый «Cotton club». Я помню времена, когда на любом концерте в «ДУДе» всегда были свободные столики. Сейчас там не протолкнуться практически в любой вечер. Юрий Иванович сумел так поставить дело, что навлек в «ДУД» больше публики, чем клуб способен вместить. Так что надо расширять экспансию.


      (ни слова не сказано по поводу «Blues Time» по той простой причине, что я там еще не бывал. Но услышанные отзывы – только положительные).'
