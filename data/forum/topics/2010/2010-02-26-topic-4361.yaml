    text: "Лестер – тертый блюзовый калач. Он знавал и (относительный) коммерческий успех, играл с легендами блюза, давно ушедшими в небытие, был активным участником Excello Records (не слыхали о таком – не претендуйте на знание блюза), уходил из музыки и вернулся уже в преклонные годы (хотя глядя на его прямую осанку, слово «преклонные» к нему абсолютно не применимо).\n\nНеметт приехал к нам в ореоле новой звезды вест-коаст. В отличие от Лестера, он и подавал себя как черную икру на блюдечке с золотой каемочкой. На мой взгляд, самооценка явно завышенная.\n\nПро Неметта я узнал по отзывам Элвина Бишопа. Допускаю, что это имя кому-то мало знакомо. Для меня же Бишоп – неисправимый блюзмен, даром что белый. Так вот, Бишоп Неметта расхваливал на все лады: он-де и молодой, и профессиональный, и виртуоз, и новатор и все такое прочее. Знакомство с записями Неметта никакого впечатления (лично на меня, уж извините) не произвело. В чем причина шума, поднятого вокруг его имени, я не понял (второй раз извините меня). Однако, работа в студии, часто бывает, показывает музыканта с одной стороны. А его живые выступления – совсем с другой. Известие о его приезде в Москву сулило многие надежды… Оправдавшиеся лишь на одну десятую.\n\nОн, спору нет, на гармонике играть умеет. У него есть индивидуальный саунд – а это базовое качество блюзмена. Есть хорошая техника, и от его игры можно получить хорошее удовольствие, не вдаваясь в науку. Но блюз – это не техника игры, и даже хорошего саунда недостаточно. У Неметта напрочь отсутствует чувство ритма. «Прыгучие коты» разучили аранжировки по его записям, а он буквально сбивал их с панталыку, плавая в темпе то туда, а то сюда. Еще хуже оказалась манера его пения. Он, похоже, просто «не в теме» -  ни в малейшей степени он не понимает блюзовую ритмику вокала, фразировку, отличающую блюз от эстрадной песни. Это еще только начало – он не просто не владеет голосом, но и не осознает пределы своих вокальных способностей. Стоит ему слегка полезть в «верха», как вокал заканчивается и начинается довольно противное блеяние. Все эти недостатки явно не стоят того, чтобы выносить его в качестве солиста. \n\nНеметт не обладает свинговым драйвом, который характеризует современный вест-коаст блюз как направление. Неметт уверяет, что он поет соул. Для того, чтобы понять, что такое соул-вокал, не обязательно даже лезть в архивы, достаточно послушать новый диск «The Holmes Brothers”. Они с Немметом играют «соул» с разных планет.\n\nБлюз дожил до XXI века именно потому, что не останавливался в развитии. Потому он и не лежит в музее, а звучит. И новое поколение музыкантов приходит, чтобы не только «продолжать», но и «развивать» дальше. Так что, Неметт, или Шульц, или «норвежские гитаристы» - чем разнообразней, тем лучше. Однако по соотношению количества публики на концертах Лестера и Неметта получается, что на последнего пришло втрое больше народу. Отсутствие интереса к корням никак не может способствовать развитию – вот что грустно."
