    text: "Лестер вышел к публике в футболке, Неметт – в костюме и при шляпе (никто не помнит жестокие баталии на блюз-ру по поводу блюзменов в шляпах?))).  \n\nРик Эстрин тоже появляется на сцене как пижон, но его саркастический юмор в текстах, самоирония, артистизм движений вряд ли позволят принять это пижонство за чистую монету. Но когда Неметт заявил что в душе он «country boy” – это было туповато... Типа, «ребята, я свой».\n\n Лестеру для объявления песен хватало коротеньких фраз. Например, «вечнозеленые» темы собственного сочинения он представлял: «А эту песенку я написал, когда был совсем маленьким». И хватало, поскольку «I'm A Lover, Not A Fighter» и «Sugar Coated Love» - до сих пор на слуху и легко узнаваемы. Неметт, который уже миновал тот возраст, в котором Лестер сочинил эти темы, пока ничего претендующего на тест временем, не создал. Но он толкал речи, и какие речи!.. У Лестера самая продолжительная речь была в конце его выступления в «Коттоне», он был явно удовлетворен результатом выступления, и лишь отработав концерт он сказал несколько слов о музыке, как о чуде, которым нужно делиться с миром и людьми вокруг. Жаль, я не записал его слова в точности, поскольку говорил он от сердца и без пафоса. И говорил не больше минуты.\n\nНеметт речами упивался. Едва группа подхватывала «грув», едва публика начинала «раскачиваться» - Неметт брал «слово для высупления»... Сначала он коротенько, всего минут за десять, рассказал о лучезарности своей карьеры – где и с кем играл, как он записался для «Величайшего блюзового лейбла в мире», как он номинировался на Blues Award. Кто там не был, скажет, ну и правильно, почему бы не представиться публике с лучшей стороны. Если бы это заняло минуту-две, это было бы уместно. Но Неметт тоглкал долгую нудную телегу. Описав очередной этап своей восходящей карьеры, он брал долгую паузу, обводя зал взглядом и кивая головой – «ну, вы поняли, как это важно и сколь значимо?». Примерно так же в паузах конферанса кивал головой и обводил зал взглядом лягушонок Кермит из Маппет-шоу. Если бы дедушка Лестер столь же многозначительно описал бы свою историю в блюзе, для музыки вообще времени бы просто не осталось. \n\nЛадно, описав свои достижения, Неметт снова заиграл, снова легкие затруднения в ритме, снова вроде бы «грув» уже пошел… И бац – опять пауза для торжественной речи. Тщательно выверяя длиннющие паузы между предложениями, Неметт растолковывает, что один его диск стоит 600 рублей (в произношении Неметта это было больше похоже на «рупий», но это уже мелочи). «А если вы купите два диска – то это будет стоить всего тысячу рублей» - вещал Неметт… снова  пауза, потом снова слова о том, как выгодно купить сразу два…. Хорошо, действительно, музыкантам стоит торговать своими компактами… Но торговля еще не закончена, Джон убедительно разъясняет, что выгодней всего купить сразу три его компакта. Уфф…\n\nВы думаете, он на этом остановился? Да черта-с-два! Заокеанский коробейник пустился гневно и по пунктам обличать всех, кто скачивает музыку из интернета. Из зала кто-то робко сказал, что оплачивает загрузку с Амазона, но Неметт был непреклонен. Он сказал, что покупая музыку в электронном виде, вы не знаете, кто автор песни и кто был сайдменом на записи (это я согласен). Но, главное, продолжал Неметт – при скачивании «You don't get all those pretty pictures»! \n\nГоворя о бизнесе, парню заплатили за то, чтобы он играл. Никто не заплатил ему за то, чтобы прослушать его лекцию об экономике шоу-бизнеса. Почему, вместо выполнения той работы, за которую ему уже заплатили, он кормит публику лекциями про то, что Неметту полагается заплатить еще и еще??? Ну а в «ДУДе» он развернул продолжительный аукцион по продаже своего компакта. Он получил не 500 рупий, а целых 1400 (кажется). В общем, организаторам аукционов следует обратить на него внимания – чертовски ловок! \n\nPS. Ожидаемая реакция – это уличить меня в сугубой ненависти к Неметту. Это не так. Пусть себе играет и ведет себя так, как ему угодно. \n\nДля меня остается неприятной загадкой, почему ни Лестер, ни Неммет не сыграли в Москве так блистательно, как на этих свежих «ютюбинах»: с блеском, напором и полной самоотдачей…\n\n<object width=\"425\" height=\"344\"><param name=\"movie\" value=\"http://www.youtube.com/v/wbVVqZgTAMI&hl=ru_RU&fs=1&\"></param><param name=\"allowFullScreen\" value=\"true\"></param><param name=\"allowscriptaccess\" value=\"always\"></param><embed src=\"http://www.youtube.com/v/wbVVqZgTAMI&hl=ru_RU&fs=1&\" type=\"application/x-shockwave-flash\" allowscriptaccess=\"always\" allowfullscreen=\"true\" width=\"425\" height=\"344\"></embed></object>\n\n<object width=\"425\" height=\"344\"><param name=\"movie\" value=\"http://www.youtube.com/v/lviCGQoqGAA&color1=0xb1b1b1&color2=0xcfcfcf&hl=ru_RU&feature=player_embedded&fs=1\"></param><param name=\"allowFullScreen\" value=\"true\"></param><param name=\"allowScriptAccess\" value=\"always\"></param><embed src=\"http://www.youtube.com/v/lviCGQoqGAA&color1=0xb1b1b1&color2=0xcfcfcf&hl=ru_RU&feature=player_embedded&fs=1\" type=\"application/x-shockwave-flash\" allowfullscreen=\"true\" allowScriptAccess=\"always\" width=\"425\" height=\"344\"></embed></object>"
