    text: 'Был в Jagger Club  на концерте John Nemeth. В Питере концерт продолжался 1,5 часа. Джон держался солидно, хотя между песнями трепался о чем-то. Песен Джуниора Уэллса он так и не исполнил. Драйва было вполне достаточно. Ваши ребята-москвичи (особенно лидер-гитарист)играли великолепно. Понравилось все: пение, игра на харпе и звук в относительно большом зале -абсолютно выверенный тональный баланс. Любителей и знатоков харпа, я думаю, было всего несколько человек. Диски продавал по 500р, я думаю не более 20 шт. В зале - одна молодежь, видимо, пришла поглазеть на заморского гостя задаром (вход на стоячие места был бесплатным). Удовольствие получили все присутствовашие на концерте. PS голос и звучание харпа при прослушивании дома CD кажутся на 1 тон выше, т.е. зал есть зал.'
