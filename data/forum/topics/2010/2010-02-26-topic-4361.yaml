  text: 'Сегодня вечером я ходил в Blues Time на концерт John Nemeth. Его привез Вова Русинов и Co. Я очень люблю и ценю пластинки Неметта, которые у меня есть, я слышал очень много хороших слов про него от людей, вкусу которых я безоговорочно доверяю. На концерте Неметт превзошел мои ожидания и зацепил за живое. Ксения, Миша, Вова и Гриша - молодцы, выучили столько новых хороших песен, и их, видно, проперло также, как меня.


    Неметт поет по большей части свои песни, наполовину это соул. Он - очень сильный, исключительный вокалист, на гармонике он не переигрывал, но она была очень важна. Отдельные блюзовые номера от Джуниора Веллса с импровизацией были особенно эмоциональны и достали по-настоящему.


    У Неметта очень интересная манера держаться, он много шутит и разговаривает, иронизирует, но остается стильным чуваком. Всем было на него очень приятно смотреть и его слушать не отрываясь 2.5 часа - его ум, музыкальная утонченность и сильные эмоции завораживают.


    В Blues Time я был первый раз, клуб - не очень большой подвал человек на 40, больше не помещается. Все места были заняты, а публика очень соответствовала, кажется, сам Неметт был искренне доволен тем, что получается. Музыканты находятся рядом, почти посередине зала, есть эффект присутствия на живом концерте ;) Зал маленький - часть комбиков включили без подзвучки, но все было отчетливо слышно, удивительно, что все получилось без проблем.


    Завтра я обязательно продолжу в Cotton Club, чего и вам искренне желаю!'
