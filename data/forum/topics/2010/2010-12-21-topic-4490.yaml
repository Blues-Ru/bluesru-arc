  deleted: false
  text: '<small>Александр Липницкий беседует с Алексеем Беловым (группа "Парк Горького"); Алексеем Беловым (группа "Удачное
    приобретение") беседуют блюзе, об истории группы "Удачное приобретение", об альбоме "Три Белова" и всяком прочем:</small>


    БЕЛОВ ("УП"): "Мне вдвойне приятно говорить на эту тему, поскольку в этом году нам исполняется сорок лет. Мы начали играть
    в стиле англоязычного блюза и рок-н-ролла в конце семидесятого года. То есть ровно сорок лет. Поэтому сам факт того, что
    сорок лет вообще трудно прожить в наше время, а прожить с группой… Естественно, люди менялись, это не один состав, который
    просуществовал сорок лет, но в этом есть свое жизненное развитие, в этом есть смысл оркестра, группы как живого организма.
    Поэтому что-то отмирает, а что-то возникает, и на теле человека происходит примерно то же самое. Говоря о группе "Удачное
    приобретение", первые семь лет, это был состав: Михаил Петрович Соколов на барабанах, Владимир Матецкий на бас-гитаре,
    а мне приходилось играть на гитаре и петь. В 1975 году, один год певцом у нас был Алик Микоян. Как раз на пластинке "Удачного
    приобретения" в 1974 году, в песне, которую вы слышали в самом начале, на губной гармошке солирует Алик Микоян. В дальнейшем
    у нас был саксофонист Гусейнов Исмаил оглы – колоритный, совершенно потрясный восточник, играющий на саксофоне, очень
    интересный и харизматичный персонаж, который впоследствии уехал в Америку и не работает музыкантом, как я знаю, но, тем
    не менее, жив-здоров, и он там со своей женой из Москвы, из России, в общем, живут и я считаю, что все нормально".




    <small>Читать полностью: http://finam.fm/archive-view/3466/ .</small>'
