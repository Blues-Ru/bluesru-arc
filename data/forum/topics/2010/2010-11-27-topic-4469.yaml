  text: "в большом обзоре о публичных лекциях в Москве поминается и \"Блюзовая академия\" Кожекина (http://rokf.ru/carera/2010/11/23/095504.html):\
    \ \n\n...один из лучших отечественных исполнителей на губной гармонике, Владимир Кожекин, вместе со своей группой \"Станция\
    \ \"Мир\"\" ведет проект \"Блюзовая академия\". Учебное мероприятие обычно состоит из кожекинской лекции и музыкальных\
    \ иллюстраций в исполнении \"Станции \"Мир\"\", но есть и практикумы (зрители учатся петь, держать свинговый ритм), а\
    \ также экзамены, которые, как уверяет Кожекин, обычно проходят очень весело."
