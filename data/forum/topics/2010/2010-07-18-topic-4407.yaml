      text: Первый раз я слышу мнение, что Плант поет по-черному.  Да, пел он черные песни, но очень по-своему, и не особенно по-черному.   Про Пресли это было сказано в 50-ых годах, когда мало белых пели блюз таким образом, как Пресли.   Но сегодня его голос мало отличается чем-нибудь "черным."  Много в нем канрти.  Джоплин - это пример белой певицы, которая действительно вдохновилась исключительно черными певцами - как Etta James и Big Mama Thornton.   Много черного есть в ее вокалах, но она я бы все равно не сказал, что она поет совсем по-черному.   Пример белого певца, который поет очень по-черному - Tad Robinson.   Если бы я не знал, я бы думал, что он чернокожий.
