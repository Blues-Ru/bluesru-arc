  text: "Написано \nВ 1915 году (95 г. назад) в Ваукеша, Висконсин, родился Лес Пол (Les PAUL). Гитарист-самоучка, он стал настоящим виртуозом. В 30-х пел сам, или аккомпанировал блюзовым вокалистам. Недовольный электрогитарами из магазина, во второй половине 30-х годов начал экспериментировать над созданием собственной конструкции. Модель Les Paul ныне одна из самых популярных в каталоге Gibson. Последние годы каждый понедельник дает концерты в клубе поблизости от дома, Iridium Jazz Club, что в городе Нью-Йорке. Там намерен отпраздновать и нынешний день варьенья.\n\nЛес Пол не сможет отпраздновать свой 95 день рождения, потому что он умер 13 августа 2009 года"
