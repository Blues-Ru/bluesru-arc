  text: 'Jimmie Vaughan альбом Strange Pleasure (1994), композиция (Everybody''s Got) Sweet Soul Vibe. Ну очень нравится как и весь Джимми. Нужен текст. Набросал сам, не всё понятно. Помогите прояснить.


    There''s something in the light

    There''s something in the dark

    Something ''neath my fingertips (that) we can touch

    Anytime you say, we can sail away

    On a steady stream of consciousness


    Did you ever feel the (beast)

    Did you ever love the (fear)

    Did you ever hear in the truth so cristall clear

    There''s a place to go

    Where we all know

    That a river that always will flow


    Everybody everywhere''s got sweet soul vibe

    There''s something special in the air

    (???)


    Don''t be left behind

    Just move straight ahead

    Remember be yourself (hear) what I said

    It''s all in your mind

    A sweet soul vibe

    Come along ???????????


    P.S. Приятно порадовал (и даже удивил) Steve Miller Band альбомом Bingo! (2010): из 10 вещей 3 композиции Jimmie Vaughan''а, причём именно все 3 из этого альбома Strange Pleasure.'
