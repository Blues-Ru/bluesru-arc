  text: "Я сходил в пятницу на концерт, в субботу на полконцерта Эйрика с его другом басистом Яном Эйриком и группой Mr.Wonderful. Я получил огромное удовольствие! Это был блюз-блюз-блюз с аранжировками, blues feeling, ни фига не джем-сейшн. Кажется, так должна звучать и петь такие песни блюзовая группа моей мечты. \n\nРвите на себе волосы те, кто пропустил, следующий раз - в следующем году, не раньше.\n \nДвое из группы шести - Красивов и Пальчиков во вторник в гостях у Jumping Cats в Доме у Дороги."
