  text: "<i>некто er.ru ( http://er.ru/about/text.shtml?16/2107 ) дарит миру новость:</i>\
    \ \n\n<b>Сергей Галанин: Мы подарили Медведеву гитару Эрика Клэптона</b>\n\n\"\
    Накануне президент РФ Дмитрий Медведев в Москве встретился с известными российским\
    \ рокерами в «Ритм Блюз Кафе» Андрея Макаревича. Собравшиеся обсудили многие актуальные\
    \ проблемы: мэра Москвы, трассу через Химкинский лес, охрану животных, однако\
    \ главной темой была все-таки музыка, яркий символ которой – ретро-гитару Эрика\
    \ Клэптона – музыканты подарили президенту.\"\n \n<i>сразу становится интересной\
    \ откуда \"у них\" эта самая гитара... подробности проясняются много поле яркого\
    \ заголовка:</i>\n\nСергей Галанин: Самое главное - мы президенту гитару подарили.\
    \ Замечательный электрический инструмент фирмы «Gibson», раритетная модель, которой\
    \ больше 40 лет. На такой играет Эрик Клэптон. Это выдержанный, проверенный временем\
    \ инструмент, который был куплен в Америке. Мы все на ней расписались и подарили\
    \ Дмитрию Анатольевичу. Он был очень рад и приятно удивлен. Не знаю, будет ли\
    \ он сам играть, но сын его, по его же словам, интерес к этому проявляет. \n\n\
    Я не думаю, что раньше ему дарили подобные вещи. Обычно на таком уровне дарят\
    \ другие подарки, а гитара - это душевный, символичный подарок. Мы встречались\
    \ в атмосфере единства музыки и большую часть времени все-таки говорили о ней,\
    \ как о части нашей жизни. Мы пели песни, в которых есть ответ на разные жизненные\
    \ вопросы, в этои и есть смысл рок-музыки.\n\n<i>Родимые пятна пафосности отечественно\
    \ рока - во всей красе. А на фотке и непонять по лицам, кто больше государственник:\
    \ сам или макар...</i>\n\n<center><img src=\"/bluesnews/10summer/RNB_Med.jpg\"\
    \ width=\"299\" height=\"192\" alt=\"\" title=\"\" border=\"0\" align=\"\" /></center>"
