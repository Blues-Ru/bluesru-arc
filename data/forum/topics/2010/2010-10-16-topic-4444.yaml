  deleted: false
  text: 'Оспариваются права на песню рок-музыканта «Georgia Blues», записанную 40 лет назад, сообщает агентство Рейтер со ссылкой на издание Hollywood Reporter.


    В середине 1960-х годов Хендрикс, выступавший тогда под именем Джимми Джеймс, играл в группе саксофониста Лонни Янгблада. Позднее гитарист-виртуоз покинул коллектив, но в 1969 году совместно с Янгбладом записал песню «Georgia Blues» в студии в Нью-Йорке.


    Про композицию вспомнили после того, как она прозвучала в 2003 году в передаче Мартина Скорсезе, посвященной блюзу. Кроме того, в дополнение к телевизионному шоу было выпущено несколько музыкальных альбомов, один из которых включал песню Хендрикса.


    Лонни Янгблад подал в суд на Мартина Скорсезе, наследника Хендрикса и звукозаписывающую компанию MCA Records, утверждая, что песня была использована без его позволения. При этом он отметил, что отказался от предложенных ему трех тысяч долларов за права на песню.


    В свою очередь нынешний обладатель прав на интеллектуальную собственность Джимми Хендрикса предъявил встречный иск, требуя объявить себя законным владельцем песни. Согласно архивным данным, которые попали в окружной суд Нью-Джерси, Хендрикс спродюсировал и записал песню за свой счет.'
