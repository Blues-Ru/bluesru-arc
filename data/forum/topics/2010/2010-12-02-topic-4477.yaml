  text: "В субботу удалось совершить много лет назад задуманное паломничество в Бостон\
    \ на концерт Ронни Эрла. Для меня Ронни Эрл - любимый классик блюзовой гитары.\
    \ Последние 10 или больше лет он болеет, у него были в разное время проблемы с\
    \ алкоголем и депрессией, сейчас ситуация нормализовалась, но из-за всего этого\
    \ он далеко от дома не выезжает. \n\nЕдинственная возможность услышать его вживую\
    \ - подгадать время и доехать до Бостона. На этот раз пришлось еще отмахать 120\
    \ миль в сторону, благо в соседней деревне жили мои друзья, которых я заодно навестил.\n\
    \nРонни Эрл играет в группе из 4-х человек с органом, без вокала. Группа у него\
    \ неплохая, но, конечно, не та что в старые годы - с Брюсом Кацом, Дэррелом Нюлихом\
    \ или Шугар Рей Норсиа. Сам Ронни Эрл не очень хорошо себя чувствует физически,\
    \ это отражалось на звуке, он местами играл не очень остро, хотя он это огого\
    \ как может, что слышно на его концертных записях разных лет. В одной из интемиссий\
    \ между песнями, которую он произносил слабым высоким голосом, он сказал, что\
    \ благодарит судьбу за то, что остается трезвым в последние годы.\n\nРонни играл\
    \ старые песни, я раньше не слышал только 2 вещи из концерта. Во второй части\
    \ он разыгрался, видно было, что музыки и энергии у него в голове больше, чем\
    \ в его измученном бренном теле. Несмотря на то, что мой личный вкус многие вещи\
    \ были сыграны не лучшим образом, если сравнивать с историческими записями, публика\
    \ была на взводе и в восторге в течении всего выступления.\n\nКонцерт продлился\
    \ 2ч35м без перерыва, там были только инструменталы и гитарно-органные соло. Удивительно,\
    \ что никто не завял, и даже мои друзья к блюзу не привычные выслушали все на\
    \ одном дыхании.\n\nХочется искренне пожелать здоровья и бодрости Ронни Эрлу,\
    \ а творческие успехи непременно приложатся."
