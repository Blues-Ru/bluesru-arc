  text: "В рубрике «Блюзовые новости», кроме прочего, мы еще и разыскиваем любые новые публикации о блюзе в «рунете». Публикуем\
    \ их в «репринтном» режиме, сиречь, без редактуры, в первозданном виде и без комментариев.\n\nА иногда все же так хочется\
    \ прокомментировать. К примеру – радостная весть, <a href=\"http://blues.ru/news/?p=201005#767\">передача о блюзе на минском\
    \ телевидении</a>. (Нам тем более радосно за менчан, поскольку московское телевидение к блюзу относится индифферентно).\
    \ Но кроме набившего оскомину общего заглавия и странного ориентира на творчество «Крим» в определении достижений современно\
    \ блюза, одна фраза напрягла меня всерьез:\n\n«Блюз – это в первую очередь гитара. Можно, конечно же, играть блюзы и на\
    \ клавишных, но с точки зрения корней, блюз – это гитара, которая проецирует грусть, изливает ее в струнных всхлипах.»\n\
    \n1.\tПро точку зрения корней. Корни блюза – в хоровом пении во время работы в поле (work songs и hollers, стоящихся по\
    \ принципу call&response), в посиделках у костра вечером, или в «пятничных танцах» в кабаке, а так же в хоровом пении\
    \ по воскресеньям. С точки зрения корней – первым был вокал, и «всхлипы» были не струнными.\n2.\tС точки зрения формирования\
    \ блюза, первыми были самодельные инструменты: диддли бо, барабаны и флейта, и самодельные jag’и разного устройства. Потом\
    \ уже приспособили играть под блюз гитары, скрипки и трубы…\n3.\tМне кажется, что в этой фразе «Блюз – это в первую очередь\
    \ гитара» перепутаны причина и следствие. Вряд гитара, как и любой другой инструмент, является отправной точкой для блюза.\n\
    \nЯ бы сказал, что на постулате «Блюз – это в первую очередь гитара» собственно блюз как раз и заканчивается, а начинается\
    \ нечто абсолютно аморфное, что иногда называют «гитарная музыка». Слово «аморфное» не является негативным определением.\
    \ Просто «гитарная музыка» не определяется используемой музыкальной формы, будь то блюз, джаз, рок, этника и еще более\
    \ закрученные музыкальные навороты. Главное – игра на гитаре, (слегка фетишизм по сути). В «гитарной музыке» настолько\
    \ начихать на форму и содержание, что в ней одновременно царствую Пэт Матини и Ал Ди Миолла, Гэри Мур и Ингви Мальмстим,\
    \ Джефф Бек и прочая. \n\nКак помнят знатоки, в культовом фильме Crossroads блюзовую дуэль в финале сам у себя выиграл\
    \ Стив Вай – эталон гитарного героя и антиблюзмен по сути. Меня всегда забавлял факт, что дуэль была выиграна благодаря\
    \ исполнению классической музыки. В целом, сцена дуэли как раз невольно отражает отношение чемпионов «гитарной музыки»\
    \ к блюзу: презрение. Их отношение к блюзу зиждется на гармонической ограниченности блюза и необходимости следовать некоторым\
    \ блюзовым стандартам и в импровизации, и в исполнительской технике. А так же в тупом нежелании понять, что блюз как искусство\
    \ и гитарное мастерство как исполнительская техника – преследуют совершенно разные цели. Исходя из этого, их просто бессмысленно\
    \ сравнить. \n\nВ свою очередь, некоторые современные исполнители блюза, и не только гитаристы, частенько тщатся «обновить\
    \ блюз», талдыча, что «скучно играть одно и то же». Это алексы шульцы в различных проявлениях. Всем им свойственно желание\
    \ проявить себя виртуозами. Желание похвальное, но зачем за блюз-то цепляться? Себе же хуже делаете: любой гитарист, претендующий\
    \ играть блюз, в сетке ценностей «гитарной музыки» всегда останется музыкантом второго сорта, так что – пора взрослеть.\
    \ Переиграйте какого-нибудь стива вая, или кто там сейчас занимает первое место – и будет вам счастье, почет и уважение!\
    \  Блюз от вашего ухода не обеднеет, а вы наконец-то сбросите ненавистные «вериги» - и все будут довольны."
