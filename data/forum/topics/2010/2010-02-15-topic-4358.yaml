    text: 'учитывая критерии отбора "лучших дисков первого десятилетия", стоило бы добавить в список дебют John Nemeth 2004-го, последний диск Ronnie Earl 2009, Bryan Lee,Eddie Clearwater...блюз, как мне кажется, держится на таких людях,в той или иной мере.

      Но никак не на Отисе Тейлоре,Кенни Уейне Шеппарде и последних работах Бадди и Би Би, разве что с коммерческой точки зрения.

      Кстати,не хотел бы Андрей Евдокимов составить свой список таких знаковых дисков, чтоб и традиции сохранялись, и будущим поколениям пригодилось бы? Было бы очень интересно, да и пообъективнее, как мне кажется.'
