  text: "1.  Buddy GUY \"Sweet Tea\" 2001 (Jive Records)-ДА\n   2. R.L. BURNSIDE \"Wish I Was In Heaven Sitting Down\" 2000 (Fat Possum)-ДА\n   3. Otis TAYLOR \"White African\" 2001 (NothernBlues Music)-НАХЪ\n   4. Solomon BURKE \"Don't Give Up On Me\" 2002 (Epitaph Records)-ДА\n   5. Koko TAYLOR \"Old School\" 2007 (Alligator)-НУ...Так себе..\n   6. B.B. KING \"One Kind Favor\" 2008 (Geffen)-кто-то не слушал Би Би  Кинга вообще?\n   7. NORTH MISSISSIPPI ALLSTARS \"Electric Blue Watermelon\" 2005 (ATO)-....\n   8. Irma THOMAS \"After the Rain\" 2006 (Rounder)-не слушал.\n   9. John HAMMOND \"Wicked Grin\" 2001 (Virgin)-можно было бы и не упоминать.настолько ровный альбом....как и любой Хамонд 2000-х.\n  10. Bobby RUSH \"Raw\" 2006 (Deep Rush)-это кайф, да.\n  11. LIL'ES & the Blues Imperials \"Rattleshake\" 2006 (Alligator)-пилилово.но кайфовое.\n  12. Buddy GUY \"Skin Deep\" 2008 (Silvertone)-по сравнению с предыдущим-нах.\n  13. The HOLMES BROTHERS \"Simple Truths\" 2004 (Alligator)-подозрительные пацаны. даже вживую.\n  14. Mavis STAPLES \"We'll Never Turn Back\" 2007 (Anti-Records)-не понимаю вибраций её голоса.писать не буду ничего. но папа-любимец.\n  15. Corey HARRIS \"Mississippi to Mali\" 2003 (Rounder)-это в категорию-\"ЭТНО МУЗЫКА\"\n  16. Nick MOSS & the FLIP TOPS \"Play It 'Til tomorrow\" 2007 (Blue Bella)-не в курсе.\n  17. Tommy CASTRO \"Painkiller\" 2007 (Blind Pig)-бодро.\n  18. Corey HARRIS & Henry BUTLER \"Vu-Du Menz\" 2000 (Alligator)бодро-но скучно.\n  19. WATERMELON SLIM & the WORKERS 2006 (NothernBlues Music)-неплохо так.но не кабак. не три отделения...\n  20. Hubert SUMLIN \"About Them Shoes\" 2008 (Tone-Cool)-не догоняю соло Маккартни после Битлз.\n  21. James Blood ULMER \"Bad Blood in the City: the Piety Street Sessions\" 2007 (Hyena)-послушаю. Дядя мощный в последнее время.\n  22. Mighty Mo RODGERS \"Red Neck Blues\" 2007 (Dixiefrog)-не слушал ещё.но есть подозрения\n  23. The MANNISH BOYS \"Lowndown Feelin'\" 2008 (Delta Groove)-супер группа!! послушаю. надеюсь,без разочарований будет.\n  24. Otis TAYLOR \"Recapturing the Banjo\" 2008 (Telark)-ну, уж нет.\n  25. Kenny Wayne SHEPHERD & Various Artists \"10 Days Out: Blues From The Backroads\" (Reprise)-ну уж нет-так нет."
