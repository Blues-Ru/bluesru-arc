  text: "Таблоиды кричали - 16 ноября пройдет концерт группы ПЛИМУТ, которая презентует\
    \ в Чайна Таун Кафе дебютный клип на песню «Привет», но это все слова, вот что\
    \ было на само деле…\nМузыканты  группы ПЛИМУТ начинали концерт с легкого перфоманса,\
    \ со сцены они предлагали зрителям воспроизвести  звуки похожие на шелест дождя,\
    \  на экране было спроецировано видео  Amazing choir с композицией «rain».  Когда\
    \ хор дважды изобразил раскаты грома, а зал пребывал в тревожном ожидании,  на\
    \ папарацци и богемную элиту обрушился цунами под названием ПЛИМУТ РОК в середине\
    \ концерта вокалист группы, под акустику исполнил нежную песню «Весна» зал затих,\
    \ девочки плачьте…\nЭто была бомба! «Брутальные романтики», так окрестили их журналисты,\
    \ они   с легкостью взорвали зал, пост-рок, пост-панк, пост-гранж, говно-рок,\
    \ актуальный мейнстрим-рок называйте как угодно. \nБескомпромиссное творчество\
    \ ПЛИМУТ отличают тексты с глубоким эмоциональным окрасом, харизма и высокий уровень\
    \ профессионализма музыкантов, все эти качества сразу покорили многоуважаемую\
    \ публику (Сергей Созинов – барабаны, Петр Миков – электра гитара, Ренат Ахмадиев\
    \ – бас-гитара,  и Товарищ Плимут – гитара, вокал). \nДля меня ПЛИМУТ-это мощь\
    \ двигателя, символ эксклюзива, запах бензина, свежий ветер Девоншира, суровая\
    \ романтика скалистых берегов,  тепло калифорнийской пустыни,  поэзия преодоления\
    \ новых вершин, это  музыка пилигримов я за  ПЛИМУТ РОК !!!!!!!\nПроснувшись утром,\
    \ после  концерта группы ПЛИМУТ, ловишь себя на том, что невольно напеваешь слова\
    \ малознакомой песни «…расскажи мне о себе шепотом опавших листьев…» вот  это\
    \ послевкусие !!!! \nТак что настоятельно советую, как только предвидится такая\
    \ возможность, не пропустить концерт  брутальных романтиков группы ПЛИМУТ .\n\
    Официальный сайт группы «Плимут»: www.plimut.com\nГруппа «Плимут» «Вконтакте»:\
    \ vkontakte.ru/club19700191"
