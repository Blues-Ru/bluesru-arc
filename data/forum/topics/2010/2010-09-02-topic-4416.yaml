    subject: Шаффл у барабанщиков
    deleted: false
    text: 'Ну, хорошо играть шаффл сложно, нужно, в первую очередь, слушать хороших барабанщиков, которые играют свинговую
      музыку, а не блюз-рок. Тогда, может, станет понятно, к чему стремиться...


      Вот три истории:


      Приезжал с Примичем из Остина барабанщик, который говорил, что шведский Маркус Андерсен круче всех играет шаффл, ему
      никогда так не научиться, но он страшно много старается, смотрит какое-то его видео и пробует повторить.


      Когда приезжал Маркус Андерсен, он говорил, блин, шаффл - такая сложная штука, я вот 15 лет занимаюсь по паре часов
      в день, до сих пор собой недоволен.


      В Нотодден приезжал блюз-рокер Уолтер Траут со своим трио. В музыкантском отеле, как обычно, ночной джем, их барабанщик
      оказался за барабанами. "Что теперь поиграем? Ну, давайте шаффл в C.". Барабанщик сказал, что он не знает, как играть
      шаффл, когда попробовал, у него ни фига не вышло...'
