  text: 'Это просто бяда...

    Не пойму почему так трудно многим барабанщикам играть шаффл? Что для них в этом рисунке такого неуловимого, невозможного?
    Как пояснить мне (не барабанисту) как это должно быть? Обычно поясняю я это неким подобием шаркающей походки, но не уверен
