    subject: 'Кози Пауэлл:'
    deleted: false
    text: 'http://ru.wikipedia.org/wiki/Rainbow

      Найти барабанщика было сложнее. Блэкмор хотел найти не просто технически грамотного музыканта, но настоящего мастера.
      Из тринадцати прослушанных кандидатов ни один гитариста не устроил. Уже почти отчаявшись найти достойную кандидатуру,
      Ричи Блэкмор вспомнил про Кози Пауэлла, которого видел в 1972 году на его последнем концерте в составе Jeff Beck Group,
      и велел менеджеру связаться с ним, чтобы пригласить на прослушивание. Кози Пауэлл вылетел в Лос-Анджелес, где проходили
      репетиции:

      <i>Там была толпа народу: члены группы и Бог весть кто, наверное, половина Голливуда. Мне пришлось играть на ударной
      установке, которую я никогда до этого не видел. На меня пялилась сотня людей, словно я был золотым мальчиком, которого
      выписали из Англии, заплатив кучу денег. Ричи сразу же меня спросил, могу ли я сыграть shuffle. И я начал играть. Через
      20 минут мне сказали, что я принят на работу.</i>

      :)))'
