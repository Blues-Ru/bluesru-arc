  deleted: false
  text: '<p class="rtecenter"><img alt="Русский Блюз разыскивает!" src="http://zlzlz.narod.ru/wanted.png"
    /></p>

    и вот оно!!! пришло наше время: нас увидели, услышали, и крепко взялись за развитие
    и продвижение жанра русского блюза. Теперь нам предстоит много поработать, поэтому
    нужны люди.


    Во-первых, мы ждем с распростертыми обьятиями наших братьев и сестер по блюзу!
    Разумеется только если вы играете авторский блюз на русском языке. Причем, даже
    в рамках широко открытых дверей, мы не можем разместить на портале группы других
    жанров. Пожалуйста, отнеситесь с пониманием. Только блюз.


    Что вам даст включение в движение "Русский Блюз":

    * уникальную страницу коллектива на тематическом портале, с возможностью публиковать
    фото, видео и аудио группы. т.е. ваш потенциальный слушатель найдет вас легко
    и просто;

    * участие в рейтингах и обсуждениях вашего творчества;

    * участие в коллективных тематических концертах;

    * участие в фестивалях и шоу-программах в рамках проекта "Честный Блюз";

    * возможность общаться с единомышленниками, которых вы будете знать в лицо. более
    того, общаться с такими же как вы, музыкантами, блюзменами;

    * всевозможный приар и продвижение ваших значимых достижений на поприще русскоязычного
    блюза;

    * немного погодя (а вообще есть варианты и сразу) - работа на дружественных площадках,
    хозяева а главное публика которых давно и откровенно хотят видеть в программе
    качественный русскоязычный блюз.

    ...и поверьте - это далеко не все возможности, которые перед вами открывает участие
    в движении "Русский Блюз"!


    Если вы верите в будущее Русского Блюза, и хотите чем-то помочь, - участвуйте
    в работе над порталом! - у вас есть идеи, мысли, интересная информация - пишите
    статьи, обзоры, делайте интервью. Вы разбираетесь в музыке, постоянно шарите по
    интернету в поисках нового/старого блюза? Вы знаете людей играющих блюз на русском
    языке, посещаете мероприятия, просто имеете своё оригинальное мнение? - ПИШИТЕ!
    Здесь вы найдете единомышленников и целевую аудиторию.



    По всем вопросам и предложениям пишите, ждем: bibleblues@yandex.ru'
