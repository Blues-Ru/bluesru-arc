            subject: Интернет джемы
            deleted: false
            text: 'Качество звука - не проблема, можно сделать хорошее. С задержками тоже умеют бороться, возможно, только трансатлантически сделать не получится. Делим 10000 км на 300000 км/c, получаем 30мс, раундтрип 60мс - минимально возможный. Вот здесь написано, что 25мс - комфортный допуск.


              http://www.proavmagazine.com/acoustics/virtual-jam-session.aspx


              Еще одна проблема - эхо.


              При всем, при том, есть софт и сайты, которые позволяют это делать на меньших расстояниях.'
