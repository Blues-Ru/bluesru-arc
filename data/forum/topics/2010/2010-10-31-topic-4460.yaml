        poster: Федор Романенко
        subject: Интернет-джем
        deleted: false
        text: "Это - онлайновый джем, когда джемующие участники находятся в разных местах мира. \n\nНасколько я понимаю, с ними есть техническая проблема. Типичная задержка в интернете запросто может составлять 50-100мс, что совершенно неприемлимо для музицирования. Ударники и музыканты попадают в долю с гораздо меньшими допусками.\n\nХотя, наверное, что-то придумали в последнее время?"
        replies:
        - id: 37180
          parent_id: 37179
          date: 2010-11-02 00:07
          poster: Эльдар
          subject: ду-у-у-у-урь
          deleted: false
          text: я очень сомневаюсь что с технической точки зрения это возможно из-за этой задержки и из-за качества звука.
          replies:
          - id: 37181
