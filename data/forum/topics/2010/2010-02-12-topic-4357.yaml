        text: "Уж не берусь судить насколько это правда или не правда (собственно, потому что я не знаю что такое хабанера\
          \ и поэтому и не могу её разглядеть/расслышать в Slippin'n'Slidin' или в Hound Dog), просто приведу что там же написано.\n\
          http://www.idance.ru/show.php?id_a=274\n<i>Вы можете найти хабанеру во многих первых рок-хитах: ее использовали\
          \ и –европо и афро-американцы. Наряду с более медленными балладами в трехдольном размере и более быстрыми песнями\
          \ буги-вуги, хабанера стала стандартным ритмом, исполняемым в различных инструментальных вариациях. Например, ее\
          \ можно было часто услышать благодаря левой руке пианиста или из струнной бас-гитары и саксофона. Саксофонисты использовали\
          \ хабанеру как ритмический лейтмотив: примеры этому – вариант «Shake Rattle and Roll» Билла Хейли 1954 года и более\
          \ спокойный «Blue Monday» Фэтса Домино 1955-го. \nДругой пример использования хабанеры – «Slippin'n'Slidin'» Литтл\
          \ Ричарда, которая в марте 1956 года взобралась на второе место чарта Billboard R&B. В этой песне саксофонные секции\
          \ преданы полному восьминотному свинговому паттерну, басы же исполняют синкопированную версию хабанеры. Музыка под\
          \ вокалом Литтл Ричарда целиком и полностью афро-кубинская! \nВ рокабилли есть противоречия – те, которые проглядывают\
          \ из фразы Карла Перкинса «белая песня с черным ритмом». Эта музыка родилась в сердце сегрегированного юга США и,\
          \ хотя некоторые белые музыканты могли напрямую общаться с музыкантами-неграми, большинство не могло и довольствовалось\
          \ прослушиванием негритянского радио и записей. Забавным выглядит тот факт, что негритянская музыка проникла на\
          \ территорию белого стиля кантри в пору благоденствия такой популярной его разновидности, какую представлял, например,\
          \ Хэнк Уильямс. Тогда коллективы кантри подчинялись своим обычным негласным правилам аранжировки, при которых акустический\
          \ бас играл по-простому, две или четыре ноты за такт, или, в случае с &#190;, только одну ноту за такт, а электрогитара\
          \ брала на себя ритмоопределяющую роль барабанов и издавала приглушенные однонотные звуки нижних струн. В пятидесятых\
          \ барабаны только-только начали появляться в музыке кантри. Все это составляло решительный контраст с синкопированными\
          \ ритмами рокабилли, неотделимого от барабанного бита, извечной и неотъемлемой части латинской музыки. Без барабанов\
          \ и синкопирования кантри выглядел спокойно и ласково – это было в начале пятидесятых годов. Потом явился Элвис\
          \ Пресли. \nСложно поставить под сомнение влияние хабанеры на музыку пятидесятых, но стоит заметить, что музыканты\
          \ рокабилли того времени даже и не пытались играть латинскую музыку!\nСознательно или случайно, но они заинтересовались-таки\
          \ хабанерой, в первую очередь из-за уникальности ее звучания – и это стало их формой протеста против кондового кантри.\
          \ Южные музыканты, такие как Элвис, столкнулись с латинскими ритмами лицом к лицу, но отнеслись к ним как к джазу,\
          \ который считали забавным экзотическим ритмом – и не больше того.\nНекоторые авторитеты считают ранние записи Элвиса\
          \ Пресли на «Сан Студио» началом рокабилли. Однако они предшествуют основным его успехам, и в них латинское влияние\
          \ отчетливо не заметно. Только две песни имеют прямое отношение к хабанере: «Trying to Get to You» и более медленная\
          \ блюзоподобная «I'm Left, You're Right, She's Gone», записанные в 1955 году. В обоих случаях электрогитарист Скотти\
          \ Мур играет хабанеру на нижних струнах, а бас действует в традиционной «two-beat»-структуре кантри. В 1956 году\
          \ с переходом Элвиса к Ар-Си-Эй* заслуги хабанеры в восхождении его звезды становятся очевидными.\nЭлвис записывает\
          \ для Ар-Си-Эй в Нашвилле гимн рокабилли – «Hound Dog», в котором главным и постоянным ритмом становится синкопированная\
          \ хабанера. Примерно в это же время другие музыканты исследуют ее возможности, расширяют стиль рокабилли и работают\
          \ уже с вариациями хабанеры. Например, часто записывавшаяся песня «Twenty Flight Rock» (впервые ее записал Эдди\
          \ Кохран), использует латинский ритм как jumping-off point: эту технику дублирует хит Джина Винсента и «The Blue\
          \ Caps» «Teen Age Partner». Формула Кохрана заключалась в использовании гитары и баса, играющих хабанеру, только\
          \ во время куплетов; для припевов и соло же использовался принцип буги-вуги. Благодаря этому появился особенный\
          \ стиль рокабилли, который, благодаря несинкопированному кантри, напоминает хабанеру лишь отчасти.\nСо времен рождения\
          \ и юности рокабилли что-то было потеряно, и не удивительно, что энтузиасты рока предпочитают классику той «дряни»,\
          \ которой во время многочисленных возрождений стиля на протяжении полувека торговали музыкальные дельцы. Музыковед\
          \ Roy Brewer замечает: «<b>Несмотря на бум латинских ритмов в мире рокабилли и ритм-н-блюза пятидесятых годов, по\
          \ иронии судьбы одной из потерь во время возрождения стиля в восьмидесятых оказалась как раз хабанера.</b> И то,\
          \ что сейчас повсеместно используют в телерекламе в силу ностальгии, несмотря на историю, гораздо прочнее отождествляется\
          \ с афро-американскими блюзовыми артистами, нежели с рокабилли». \n* \"Ар-си-эй\" - корпорация Radio Corporation\
          \ of America.\nИсточник: www.geosities.com/sd_au, автор: Paul F. Clifford\nПеревод: iDance.ru </i>"
