  text: 'http://ru.wikipedia.org/wiki/Hound_Dog

    <i>Hound Dog (англ. Охотничья собака) — известная песня, соответствующая музыкальным стандартам жанра рок-н-ролл, <b>в
    которой главным и постоянным ритмом становится синкопированная хабанера</b>. [3] Песня написана в тандеме Джерри Лейбера
    и Майка Столлера и была впервые исполнена американской блюзовой певицей Уилли Мэй Торнтон, наиболее известной как «Большая
    Мама» Торнтон в 1952 году.</i>

    Я звиняюсь, а что такое хабанера? посмотрел там же на Википедии:

    Хабанера (песня) — песня кубинских моряков.

    Хабанера (танец) — кубинский народный танец.

    Не пойму при чём тут кубинские дела???

    Прошу, поясните в чём тут дело, плииз. При чём тут Куба-то???'
