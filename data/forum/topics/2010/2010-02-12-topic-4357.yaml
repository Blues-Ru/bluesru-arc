    text: "Ой, блин... тут есть же об этом:\nhttp://www.idance.ru/show.php?id_a=274\nТех, кто называет рокабилли чистейшей\
      \ формой рока, может удивить, что в кругах танцевального спорта рокабилли считают просто другой формой рок-н-ролла (или\
      \ свинга) и классифицируют как латинский стиль танца. Существует несколько объяснений такой классификации: они касаются\
      \ танцевальной техники и стиля; так или иначе, корни всего этого – в афро-кубинских ритмах. \nУ сальсы, румбы и всего\
      \ разнообразия музыки и танцев, которое мы небрежно относили к афро-кубинской группе, настоящие основы лежат в кубинском\
      \ стиле музыки девятнадцатого века и даже еще более давних времен – хабанера (от Гаваны). Танго происходит от хабанеры,\
      \ и, хотите – верьте, хотите – нет, рокабилли – тоже."
