  subject: 23 июня - Юбилей Дениса Мацуева в Кремле
  deleted: false
  text: "[b]23 июня[/b] звёзды мировой классической музыки соберутся на сцене [b]Государственного Кремлевского Дворца[/b],\
    \ чтобы поздравить легендарного пианиста [b][url=http://matsuev.ru/]Дениса Мацуева[/url][/b] с сорокалетним юбилеем. \n\
    \n[img]http://funkyimg.com/i/YtMi.jpg[/img]\n\nСпециальными гостями концерта будут: [i]Владимир Спиваков, Хибла Герзмава,\
    \ Юрий Башмет, Евгений Миронов и Сергей Безруков, Борислав Струлев и Айдар Гайнуллин, Игорь Бутман, Андрей Иванов и Дмитрий\
    \ Севастьянов.[/i] Не обойдется и без воспитанников фонда [b]«Новые имена»[/b] – юных артистов, которым помогает Денис.\
    \ Этот праздничный концерт станет для публики великолепной возможностью услышать в исполнении известного пианиста шедевры\
    \ мировой классической музыки и джаза, а его друзья устроят на сцене в честь юбиляра настоящую феерию!\n\nКонцерт пройдет\
    \ в сопровождении [i]Государственного симфонического оркестра Республики Татарстан. Дирижер – Александр Сладковский.[/i]\n\
    \nНачало концерта в 19:00\nЗаказ билетов в кассах ГКД: (495) 628-52-32\n\n[url=http://jazzinmotion.ru/novosti/afisha/23-iyunya-2015-denis-matsuev.html]Подробности[/url]"
