  text: "15 ноября в Арт-кафе «Дуровъ» с большим сольным концертом выступит участник самых популярных ТВ-шоу, самый модный\
    \ танцевальный джаз-бэнд страны - Jazz Dance Orchestra!\n\nJazz Dance Orchestra - этот коллектив известен всей стране!\
    \ Их можно услышать в плейлистах топовых радиостанций, наряду с треками Paul Anka, Palast Orchester и Brian Setzer Orchestra,\
    \ Pink Martini, JazzAmor, De Phazz и др. Эфиры в рейтинговых программах на центральных телеканалах – Первый, Россия, НТВ,\
    \ ТВЦ, СТС, Москва 24. В течение трех лет оркестр был участником шоу «Прожекторперисхилтон» на Первом канале, где под\
    \ их сопровождение пели Иван Ургант, Сергей Светлаков, Александр Цекало, Гарик Мартиросян, Роберто Карлос, Александр Розенбаум,\
    \ Александр Градский и др.\n\nУчастники Jazz Dance Orchestra - настоящие профессионалы. Своё мастерство они совершенствовали\
    \ в лучших российских биг-бэндах Игоря Бутмана, Георгия Гараняна, Олега Лундстрема и Анатолия Кролла. Работали в ансамблях\
    \ таких звезд как Леонид Агутин, Анжелика Варум, Сосо Павлиашвили, группа Gorky Park и др.\n\n15 ноября в Арт-кафе «Дуровъ»\
    \ зрителей ждет торжество музыки и новых технологий, грандиозное концертное шоу и яркий видеоряд. Только хиты! Только\
    \ любимые мелодии в танцевально-джазовых обработках! Только хорошее настроение!\n\nТоропитесь приобрести билеты в кассах\
    \ и на сайтах:\n\nhttp://www.ticketland.ru/kluby/art-kafe-durov/jazz-dance-orchestra/\nhttp://concert.ru/Order.aspx?ActionID=46758\n\
    \nА также в кассе Арт-кафе «Дуровъ» по адресу: ул. Павловская, 6 (м. «Серпуховская» или «Тульская»). \n\nСправки и билеты:\
    \ +7 (495) 665-00-70."
