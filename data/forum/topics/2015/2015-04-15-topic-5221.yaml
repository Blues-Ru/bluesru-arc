  text: "В прошлую пятницу в Воронеж приезжали наши друзья - замечательный бэнд из Липецка - Гастарбайтер Блюз. \nhttps://vk.com/gastarbaiter_blues\n\
    \nПервым делом шло небольшое выступление в прямом эфире на местном телевидении – несколько мощных чикагских блюзов, а\
    \ в конце совместными усилиями (+ Мама Чолли, Сом) исполнили спиричуэл. Немного кривовато, но зато где вы ещё увидите\
    \ спиричуэл на российском тв? Фактически это была молитва, призывающая высшие силы помочь тем, кто в беде. Ведь повод\
    \ к выступлению – обращение внимания слушателей, блюзового сообщества и всех сопереживающих к ситуации с харпером Гастарбайтер\
    \ Блюз – Романом Застрожиным. \n\nВ настоящее время он проходит лечение одной из разновидностей лейкоза в Гематологическом\
    \ Научном Центре Минздрава РФ. Собираются средства для оплаты донора костного мозга. И просим всех кто может, помочь:\n\
    \nВ группе по сбору средств указана информация для банковских переводов: https://vk.com/pomogi48\n\nПосле выступления\
    \ на тв, ребята отправились играть в местный клуб(продолжая серию концертов по сбору средств) – здесь уже блюз звучал\
    \ в своей полной силе, и как говорил Джон Ли Хукер – “Блюз лечит”, мы верим что вылечит и Романа!\n\nВидео с телевидения\
    \ и концерта https://vk.com/wall-13370755_4440"
