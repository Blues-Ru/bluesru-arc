  text: "Вечер среды, маленькой пятницы. Куда податься московскому любителю блюза? Попробуйте старый добрый клуб Jimi на новом месте: Пропект мира, Протопоповский переулок, дом 3.\nКлуб просторный, вход свободный, музыка достойная во всех отношениях, проверена и одобрена Blues.Ru и программой \"Весь Этот Блюз\". \nНачинаем через неделю и будем продолжать каждую среду - в 50 метрах от м. \"Проспект мира\"! Клуб ДЖИМИ - JIMI club\nЗачинщиком блюзовых сред выступят Gia Dzagnidze & Modern Blues Band!\nПослушать их шикарный Reverse Side of the Blues дают ВКонтакте: http://m.vk.com/wall-26363764_28030?from=comments\n\n<img src=\"file://C:/Users/2014/Pictures/1007Dz_s.jpg\" width=\"357\" height=\"500\" alt=\"\" title=\"\" align=\"left\" />"
