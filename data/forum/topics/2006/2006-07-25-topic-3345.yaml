    text: "Настоящий чёрный-пречёрный piano-entertainer в хорошем смысле этого слова. Провел свою музыкальную юность в Калифорнии,\
      \ но сейчас прижился в Канаде, где имеет большой локальный успех в г.Ванкувер. \nКак пишет allmusic, \"... Wayne's blues\
      \ isn't the kind of music that inspires one to cry in one's beer.. it's a good-time blues\" - в вольном переводе, \"\
      под его музыку вы не будете ронять скупую мужскую слезу в ваше пЫво, это блюз для приятного времяпровождения в веселой\
      \ компании\".\n\nСоответственно, он играет развесёлые пиесы в лёгких стилях вест-коаст, свинг, джамп, буги-вуги и тому\
      \ подобное.\n\nСамый его известный альбом Blues Boss Boogie записан в 1999 году и производит вполне приятное, хотя и\
      \ легковесное впечатление.\n\nНе путать с Kenny Wayne Sheperd, они не родственники и даже не однофамильцы!"
