  text: "Отдал свою любимую акустику гитарному мастеру сменить лады. Заплатил немалые деньги. В итоге получил инструмент с трещиной на деке длиной так около 20 см. Хорошо, что заметил только дома, я не знаю, как бы я среагировал там в мастерской. \n\nЧто за грёбаная у нас страна - ничего не умеют делать; всё надо уметь самому. Я просто офигеваю в очередной раз!\n\nВот такие дела; жуткий стресс."
