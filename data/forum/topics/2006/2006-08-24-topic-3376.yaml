  deleted: false
  text: "Анонс телеканала \"Культура\":\n\n25 августа в 00:25 для всех, кто любит блюз, телеканал «Культура» покажет запись\
    \ концерта Би Би Кинга и его группы «B.B.King Blues Band» в рамках фестиваля JazzOpen, который прошел в Штутгарде (Германия)\
    \ в 1997 году. \n\nКороль Кинг\n\nКогда-то Би Би Кинг давал по 300 концертов в год. Со временем число концертов сокращалось,\
    \ пока в 2004 году король блюза окончательно не ушел со сцены. Теперь у его поклонников есть только одна возможность увидеть\
    \ своего кумира – это смотреть записи его выступлений. Например, концерт Би Би Кинга на фестивале JazzOpen в Штутгарде.\n\
    Под звуки ансамбля, именуемого «B.B.King Blues Band», и рукоплескания аудитории на сцену неторопливо выходит человек,\
    \ ещё издали сияющий лучезарной улыбкой. Традиционная цветастая рубашка, темно синие брюки, золотой перстень на пальце.\
    \ Он приближается к краю сцены, берет в руки гитару – как он сам ее называл «темнокожую Люсиль» (в середине 50-х годов\
    \ во время концерта Кинга в одном из ночных клубов вспыхнула драка из-за женщины по имени Люсиль. В суматохе начался пожар.\
    \ Кинг сначала выбежал на улицу, но потом вернулся в горящий зал за любимой гитарой. С тех пор все его гитары носят имя\
    \ «Люсиль») - и вступает. Через несколько минут он скажет: «Спасибо», и вызовет шквал оваций. \nОн исполнил многое из\
    \ того, что считается его классическим репертуаром: «Blues for us», «Whole lot of loving», «Please accept my love», «The\
    \ Thrill Is Gone» Роя Хопкинса, сентиментальную песню «Why I sing the blues», старый хит Биг Билла Брунзи «Key to the\
    \ Highway». И только обычно открывающий его концерты номер «Everyday I Have the Blues» он заменил на песню «Let the good\
    \ times roll». \nПритопывая, покачиваясь и довольно щурясь, Кинг много разговаривает с публикой. Шутит, разыгрывает сценки\
    \ с музыкантами из группы, немного паясничает. Это старая традиция - наследие афроамериканских водевильных шоу. Тех, что\
    \ катались по городам Северных Штатов Америки сто лет назад, и где артист был универсален - и пел, и танцевал, и играл.\
    \ Би Би Кинг, кажется, всё тот же, - разве что под конец играет сидя. Но все так же мощен его блюзовый рык, так же блестящи\
    \ сольные партии, так же выразительны мимика и жестикуляция. Только прибавилось стариковской сентиментальности в исполнение\
    \ «All over again».\n\nPS. Пока я хихикал, весь в бантиках, люди проницательные отметили для себя дату и время, когда\
    \ можно посмотреть когнцерт Кинга по тв."
