  text: '<b>Знакомая прислала  ссылку познакомится с "замечательной музыкой в стиле блюз":</b>

    http://love.newstav.ru/a-mp3artist/stype-4/search-226/

    Исполнитель: Дидюля Альбом: Сатиновые берега Стиль: Blues

    <b>Мне стало интересно кто этот блюзовый исполнитель. Вот что нашёл:</b>


    Он участвовал в создании и записи дебютного альбома Авраама Руссо, работал с Кристиной Орбакайте, Дмитрием Маликовым.
    Когда Пласидо Доминго приезжал в Россию, на приеме в Кремле ему предложили назвать имена артистов, чьи выступления он
    хочет увидеть. Великий маэстро назвал одно лишь имя - ДиДюЛя.


    ДиДюЛя - это древняя белорусская фамилия и одновременно с этим - сценический псевдоним артиста. Музыкой Валера начал заниматься
    рано, приблизительно в шесть-семь лет, когда мама подарила ему его первую гитару. Увлечение музыкой не ограничивалось
    многочасовыми занятиями на ней, его страстью N 2 были музыкальные записи. На полках молодого меломана можно было обнаружить
    грампластинки Paco de Lucia, Al di Meola, Led Zeppelin, Pink Floyd, Elvis Presliey, Аллы Пугачевой, гр. "Браво", записи
    классической музыки композиторов разных лет - этот список можно было продолжать очень долго.

    Окончив среднюю школу в Гродно, родном городе музыканта, Валера попадает в Испанию, где и проходят последующие несколько
    лет его жизни. Именно там происходит его знакомство с фламенко, музыкальным стилем, который в дальнейшем изменит всю его
    жизнь. Вникнув полностью в испанскую стилистику, Дидюля начинает всерьез заниматься этой музыкой и вскоре придумывает
    свою идею, создает свой стиль. Вернувшись домой, он работает звукооператором в ансамбле народного танца Беларуси "Белые
    росы".


    Потрясающе, мощно он выглядит на концерте. Ураган эмоций, виртуознейшие гитарные пассажи, тончайшие мелодические нюансы,
    блеск испанской гитары во всей ее красе. Все это ощущает зритель попавший на выступление ДиДюЛи. Это новая эстетика в
    танцевальной, инструментальной музыке.

    ДиДюЛя - феноменальный мелодист, качественный аранжировщик, создающий фирменный саунд. Живой и чистый звук - непременный
    составляющие концерта гитариста.

    <b>И надо ж, сегодня наткнулся на его концерт по телику. Естественно, после этого я даже и не стал искать где его послушать.

    Вот что в сознании наших людей означает блюз.

    Кстати, как я заметил, по телику был концерт в Кремлевском Дворце, и он был под фонограмму. Или мне это показалось? Бывает
    ли фонограмма в Кремле? (мне, чё то, кажется что этого в принципе не может быть. иль я слишком хорошо думаю о КДС)</b>'
