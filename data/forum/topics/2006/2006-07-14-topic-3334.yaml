  text: "Многие радиослушатели интересуются, а кто такая знаменитая рыба Catfish, которой так хотел стать Би Би Кинг, а также\
    \ другие известные блюзмены.\n\nОтвечаем: Catfish - это рыба сом. Сом бывает пресноводный, водящийся в реках, в том числе\
    \ и в милой сердцу каждого любителя блюза Миссисипи. Сом также бывает и морской, в этом случае он называется Зубатка полосатая.\n\
    \nОчевидно, что именно морской сом имелся в виду в Catfish Blues, поскольку он плавает в deep blue sea, а не в river или\
    \ lake.\n\nОднако, наиболее крупные сомы, соответствующие масштабам истинного блюзмена, водятся только в реках.\nФотографию\
    \ см. <a href=http://www.smijer.com/blog/archives/BIG%20Catfish.jpg>ТУТ >></a>\n\nМорские сомы значительно мельче, но\
    \ более грациозны и жизнерадостны.\n\nПодробнее о сомах с научной точки зрения можно прочитать <a href=http://www.vitavet.ru/animal/klass/otr-Osteichthyes/Siluriformes.htm>ТУТ\
    \ >></a>\n\nМногие сомы имеют промысловое значение. Блюда из них вкусны, питательны и полезны для здоровья всех любителей\
    \ блюза. Купить консервы из сома можно в любом продовольственном магазине. \n\nПриятного вам аппетита!"
