      deleted: false
      text: 'и поделилась с им с миром, напечатав 15.07.2006 в газете Советская Беларусь (Минск) мвою статью "Мужчины и шары"
        Вот финал этого произведения:


        Зато я обнаружила (с некоторым удивлением, нужно признать) другое место с огромным разнообразием мужчин — красивых
        и не очень, но зато все — с интеллектуальными лицами, а это, согласитесь, несомненный плюс. Отправились с подругами
        и одним на всех мужем на блюзовый концерт в один минский клуб (название писать не буду, чтобы не сочли рекламой).
        Небольшое помещение, процентов на 85 заполненное теми самыми славными представителями мужской породы, с которыми всегда
        есть о чем поговорить, даже если за секунду до этого вы не были знакомы. Потому что, попав в этот круг, ты сразу получаешь
        метку — «свой». Чужие здесь не ходят. Или почти не ходят — потому что (да простят меня знатоки!) до этого концерта
        я не знала, кто такой Алексей Козловский, и название группы «Сузор’е» мне ни о чем не говорило. А жаль. Жаль, что
        не узнала о них раньше, потому что диски со старыми записями расхватали сразу, а я еще не знала. Зато муж подруги,
        который поначалу идею воспринял без восторга (как–то неловко ему было вести в клуб собственную жену), потом и подпевал,
        и подтанцовывал — это была любимая группа его молодости.


        Как они играли!.. Это был такой восторг, что подруга (та, что без мужа) спросила: «Как ты думаешь, это лучше секса?»
        Сидевший напротив парень слишком поспешно (похоже, испугался, что вопрос был адресован ему) ответил: «Сегодня — да».
        И нам было о чем с ним поговорить — о музыке, которая объединяет и доставляет удовольствие всем. Просто так.


        «И это — блюз?» — с удивлением спрашивали мы друг друга. Потому что до сих пор нам казалось, что блюз — это нечто
        пронзительное, острое и непременно печальное. А тут мы услышали этакий победный блюз и поняли, что он рождается не
        только когда «хорошему человеку плохо», но и тогда, когда этому человеку становится радостно. Хотя бы на время.


        Живая музыка — это когда она остается жить в твоих ушах и твоем сердце даже после того, как мелодия затихла. Когда
        ты еще долго бредешь по ночному городу без цели, потому что не хочется спать, а хочется продлить этот миг, потому
        что тебе хорошо и все беды и печали отошли на второй, а то и на третий план. Потому что горести и счастье приходят
        и уходят, а блюз — это навсегда.'
