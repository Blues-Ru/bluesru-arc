          text: '..желание сыграть Little Wing с точностью до ноты проходит.

            Зато появляется возможность сыграть его по-своему.


            А преподавателей блюзовой гитары в Москве сейчас практически не осталось,
            есть множество выпускников Гнесинки и других уважаемых высших музыкальных
            заведений, имеющих факультеты эстрадно-джазового искусства. Они учат совсем
            другому - "эстрадной" гитаре в широком смысле слова "эстрада", тут и джаз,
            и рок, и все остальное понемножку.

            Конечно, у каждого преподавателя есть свои предпочтения, например, весьма
            мною уважаемый Сергей Борисович Попов, преподававший в Красном Химике,
            имеет склонность к Пэту Мэтини и Дж.Скофилду, произведения коих исполняет
            скрупулёзно.

            Учиться у них можно и полезно. Но для некоторых может показаться скучновато,
            поскольку блюз лично им обычно не интересен, и проходят они его мимоходом
            как этап развития гитарного искусства.


            Я не согласен с тезисом про "слушай побольше вообще разной музыки" - на
            определенном этапе обучения полезно слушать только очень ограниченный
            набор произведений конкретных музыкантов (или вообще одного музыканта),
            чтобы выполнить настройку внутреннего слуха.

            Иначе внимание рассеивается и концентрация пропадает.


            Впрочем, это мой личный подход, я его рекомендую попробовать, но не навязываю.'
