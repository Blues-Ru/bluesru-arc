      text: 'уважаемые, ну что ж вы так сразу... вернемся лучше к сабжу.

        я все прекрасно понимаю что умение играть блюз не есть знание теории и нотной
        грамоты, эти звуки извлекаются не пальцами, а душой. это вполне очевидно,
        хотя бы для меня ;-) и вполне может быть и достаточно знания нескольких аккордов.
        но развиваться то как-то надо. объясните мне, дураку, как без теоритической
        подкованности сыграть, например, "Little Wing " в исполнении SRV? сидеть 10
        лет подбирать по слуху? при этом не представляя что такое тремоло, вибратто...??'
      replies:
      - id: 29212
        parent_id: 29211
        date: 2006-10-27 14:05
        poster: Владимир Русинов (BluesCat)
        email: volodya@blues.ru
        subject: все просто :)
        deleted: false
        text: "играть музыку базовой культуры - ту черную совсем настоящую - вряди\
          \ тебе захочется. всеравно культуры такой нет сейчас.. и особенно тут. Учится\
          \ поэтому стоит всему... и нотам, и теории и технике .... блюзовую технику\
          \ принято снимать на слух. Все вокальные приемы игры такие как бенды и вибрато\
          \ и пр. - лучше всего снимать на слух - так как у каждого исполнителя они\
          \ уникальные... и если хочешь именно повторить - то надо слушать и пытаться\
          \ найти такойже звук в руках. Ноты тут  не помогут. Так же они не помогут\
          \ поймать ощущение от музыки.. Ощущение есть у всех настоящих исполнителей\
          \ .. в любом жанре. Ловить эти ощущения - это значит просто действительно\
          \ слушать музыку, а не прослушивать... Но если ты будешь играть, то только\
          \ наличает твоего собтсвенного ощущения породит музыку. Даже самое тщательное\
          \ воспроизведение ощущения которое ты получишь от гипервнимательного прослушивания\
          \ Хукера - не позволит тебе сделать чтото _настоящее_. Настоящая музыка\
          \ может идти только изнутри. \nЧтоб начинать это различать - слушай побольше\
          \ вообще разной музыки, которая тебя цепляет....  Это все про изотерику\
          \ ;)\n\nА вот чтобы там просто сыграть литтл винг - надо набрать нехреновую\
          \ технику, разобрать множество хитрых фишек, которые СРВ поснимал у отцов\
          \ блюза... И разумеется уметь снимать музыку с записи на слух. Если будешь\
          \ сейчас заниматься именно музыкой и данные есть, то в конце концов будешь\
          \ иметь возможность снять эту вещь до ноты. Если конечно желание будет :)\
          \ \n\nУчись снимать на слух что угодно. Снимай побольше любимой музыки.\
          \ :) А еще лучше пойти к перподавателю который тебе побольше покажет и расскажет..\
          \ объяснит разницу между понятиями грув и ритмический рисунок и расскажет\
          \ что такое равномерно темперированный строй на самом деле ;)\n\nА потом\
          \ когда ты уже научишся играть музыку - ты сможешь в любой момент играть\
          \ ту музыку, которую чувствуешь.. а если только будешь сидеть выбирать Хукера\
          \ (которого тоже надо выбрать  всеравно )... то потом будешь только маргиналить\
          \ два аккорда, а всем объяснять да чуваки просто вы не понимаете настоящего\
          \ блюза... я играю именно его, а не какую то заимствованную фигню криво\
          \ ковыряю :) \n\nТак что лучше хоти стать музыкантом. Даже если и блюзовым.\
          \ гораздо лучше все будет."
