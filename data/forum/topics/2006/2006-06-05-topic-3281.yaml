    text: 'Читаем там:

      <i>05.06(сегодня). В 1979 году (27 г. назад) в Чикаго, Иллинойс, Мадди Уотерс
      (MUDDY WATERS) заключил брак с Марвой Джин Брукс. Жениху было 64 года, невесте
      как раз в этот день исполнилось 25 лет.</i>

      А дедуля-то совсем не промах! Она ему во внучки годится...

      Фото (см. ниже) с вкладыша альбома King Bee (1981): рядом с ним (слева от нас)
      - жена-молодуха Sunshine (Marva) ну, и видать всё семейство. (а всё ли? :-)

      И ещё:

      <i>06.06. В 1944 году (62 г. назад) в Сан-Франциско, Калифорния, родился Питер
      Албин (Peter ALBIN), настоящий по-калифорнийски хипповый гитарист. В группе
      <Большой Брат и Акционерная Компания> (Big Brother & the Holding Company) он
      был гитаристом, басистом и запевалой, пока его не сменила Джэнис Джоплин. Группу
      много ругали за профессиональный дилетантизм.</i>

      Я вспомнил как лет 15 назад мы обсуждали игру гитариста в группе Джэнис Джоплин.
      Я ещё всё возмущался (кажется, особенно за Summertime): ну что это такое - та-да-ду-да...
      Один из наших старшЫх сказал: Играет как комсомолец :))))))))))))))))))))))))))))))

      <img src="http://image009.mylivepage.com/chunk9/26234/22/muddywaters.jpg" align="bottom">'
