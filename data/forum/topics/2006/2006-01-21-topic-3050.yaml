          text: "я написал обычную мини-рецензию не для новичков. то есть для тех,\
            \ кто знает Арсена и его музыку.\n\nпро что альбом? да вообще не про что.\
            \ просто набор песен и композиций. это ж не арт-рок всё же. сыграно местами\
            \ очень круто, но звуки довольно однообразные, из-за этого может быть\
            \ скучно тем, кто привык слушать полифонию и многостилье на одном диске.\
            \ но всё это нельзя писать в рецензиях. ибо так можно обидеть любого исполнителя.\
            \ \n\nпочему неинтересно кто делал дизайн и мастеринг? звук - это самое\
            \ главное во всём этом деле. и я чётко написал, что несмотря на то, что\
            \ альбом выпущен в США, звук всё равно совковый. жду реакции Арсена. может\
            \ он спецом так делал? а может этот г-н Морабия вовсе не крут? пока Арсен\
            \ молчит.\n\nи мне, как дизайнеру, очень странно и обидно слышать, что\
            \ ДИЗАЙН АЛЬБОМОВ - это вообще неинтересно. удивительно."
