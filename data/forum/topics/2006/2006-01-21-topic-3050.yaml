        text: "В рецензиях я привык узнавать, про что вообще альбом (на взгляд рецензента),\
          \ какая там основная мысль, цельный ли альбом или нет, как вообще сыграно\
          \ все - круто или скучно, на что из известного похоже, какие эмоции вызывает\
          \ прослушивание, что конкретно понравилось автору рецензии, что не понравилось\
          \ - с точным указанием этих моментов. \n<br>При этом рецензию как-то должно\
          \ быть интересно читать :) это же минирассказ по сути, а не сводка  в стиле\
          \ криминальных новостей \"гражданинами N и M сыграно 3 трека, 2 шаффла,\
          \ 1 свинг, пострадавших нет\" :) \n<br>Совсем неинтересно кто там делал\
          \ дизайн и сводил :) \n<br>Зы: все вышенаписанное - сплошное имхо, разумеется."
