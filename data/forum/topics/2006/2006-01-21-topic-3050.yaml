          text: '...у наших к нашим всегда будет предвзятое отношение. И не только
            у наших к нашим.


            Я наблюдаю, что у многих людей в голове какие-то такие тараканы, которые
            мешают им ко многому очень качественно сделанному относиться адекватно
            (в данный момент речь не столько об альбоме Арсена, который я не еще слышал,
            к сожалению). Кто-то что-то себе настолько сильно придумывает, что аж
            жуть.


            Вот американцы иначе отосятся. И издают самые разные вещи. У нас никогда
            не было середины - был только верх (в виде записей и очень редких концертов
            звезд) и низ (все, кто пытается делать то, что делают наверху, но не могут
            в силу отсутствия школы). А у них до чертиков разных групп. Весь спектр,
            от совсем никаких до самых-самых. И все что-то делают.'
