              subject: Я вроде подробно описал
              deleted: false
              text: "что именно Арсен играет на этом альбоме. Упомянул шафллы и свинги\
                \ инструментальные, свои песни (пара из них с фанки-соулом)... Про\
                \ голос его нежный и красивый...\n\nПочему нельзя? Да потому, что\
                \ для кого-то это однообразие и есть кайф. Слушают же люди Стиви Рэя\
                \ - там всё одно и тоже; один звук и ноты. И у Арсена почти также.\
                \ Всё сыграно на Фендере почти с одним звуком. Он не использует квакушки,\
                \ тремоло, хорусы, флэнджеры и другие войсбоксы. Можно сказать, что\
                \ он играет \"одно и то же\" с почти одинаковым звуком, но это будет\
                \ оскорбление. Если рассматривать это как рок-альбом, то на нем слишком\
                \ мало работы со звуками и инструментами. Хотя контрабас в паре вещей\
                \ дал свой кайф на контрасте. \n\nПро мастеринг и сведение. Это и\
                \ есть почти самое главное в альбоме. Можно так свести и смастерить,\
                \ что слушать вообще нельзя будет. Странно, что тебе это неизвестно.\n\
                \n(Жаль, что сам Арсен не реагирует).\n\nА в рецензии я не хотел всего\
                \ этого писать потому, что я сравнивал этот диск с нашими же артистами.\
                \ На этом уровне он очень хорош. Но поставить его в один ряд с кем-то\
                \ из фирмачей я не могу. Не ставить же ему два балла за это? Я думаю,\
                \ Арсен сам знает все ответы на вопросы. Думаю, он скажет."
