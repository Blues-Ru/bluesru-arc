            text: "<b>я написал обычную мини-рецензию не для новичков. то есть для\
              \ тех, кто знает Арсена и его музыку.</b>\nЯ знаю, что играют Арсен\
              \ и его команда :) но не знаю, что они сыграли на этом альбоме, потому\
              \ что еще не слушал его. При чем здесь новички? :) я, как-то более-менее\
              \ худо-бедно слушающий блюз и все, что к нему близко, ничего не понял\
              \ из твоей рецензии :) потому что это не рецензия, а какая-то, фигурально\
              \ выражаясь, сводка с фронта или рассказ о спортивных результатах :)\
              \ неинформативно и неинтересно.  \n<br> \n<b>про что альбом? да вообще\
              \ не про что. просто набор песен и композиций. это ж не арт-рок всё\
              \ же. сыграно местами очень круто, но звуки довольно однообразные, из-за\
              \ этого может быть скучно тем, кто привык слушать полифонию и многостилье\
              \ на одном диске. но всё это нельзя писать в рецензиях. ибо так можно\
              \ обидеть любого исполнителя.</b> \nА почему нельзя писать про однообразие\
              \ диска в рецензиях? т.е. вот сказать, что альбом однообразный - нельзя,\
              \ а написать здесь на форуме, что это просто \"набор песен\" и \"альбом\
              \ ни про что\" - можно? :) не понимаю логики :) \n<br>\n<b>почему неинтересно\
              \ кто делал дизайн и мастеринг?</b>\nОбложка диска мне вот лично не\
              \ особо неинтересна :) пусть хоть там будет белый фон и черные буквы\
              \ :) я все равно послушаю диск. \nМастеринг - какое мне дело до того,\
              \ какая фамилия-имя у этого человека, если он не является особенно значимой\
              \ фигурой в звукозаписи? :)"
