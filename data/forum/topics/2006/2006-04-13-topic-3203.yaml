  text: "Красное Знамя (Сыктывкар) 12.04.2006 опубликовал статью:\n\n\"Шоколадные\" музыканты дали жару\n\nВ понедельник в республиканской филармонии прошел вечер джаза, что в\nСыктывкаре случается не так уж и часто. На сцене играл знаменитый\nамериканский джаз-квартет под управлением саксофониста Николая Панова.\nКонцерт в нашей республике завершил гастрольный тур коллектива по России. Прославленные музыканты побывали в Старом Осколе, Твери, Днепропетровске, Иркутске и Екатеринбурге. Джазменов повсюду принимали <на ура>: специально подготовленная для поездки\nпрограмма <Территория ритма> позволила раскрыться исполнителям и по\nотдельности, и всем вместе. Тем не менее, в России квартет бывает редко: в последний раз - восемь лет назад.\n\n- Дело не в зрителях. Хотя собирать массы не удается: джаз ведь - музыка элитарная, - признался руководитель коллектива. - Просто организовать поездки очень сложно. Директора концертных залов, как только узнают про наш репертуар, сразу же начинают открещиваться.\nДескать, спасибо за предложение, но как-нибудь в следующий раз. Те же, кто соглашается на риск и проводит такие концерты, на мой взгляд, совершают подвиг. Вероятно, по этой причине Николай Панов со сцены горячо благодарил директора нашей филармонии Вячеслава Майсерика, который не просто гостеприимно принял джаз-квартет, но и активно занимался устроительством гастролей.\n\nВместе с Нилом Смитом (ударные) и Майклом Хокинсом (контрабас) в концерте участвовал особый гость - американец Сайрус Честнат, признанный у себя на родине лучшим джазовым пианистом. Звездам Нового света сыктывкарская публика устроила овацию еще до того, как те притронулись к инструментам -очень уж колоритно смотрелись <шоколадные> музыканты на фоне белоснежного одеяния сцены.\n\nВ течение двух отделений прозвучало всего десять произведений, но зато\nкаждое - на вес золота: хагенский <Ноктюрн Гарлема>, попурри <Бэгз гру>, <Сэнт-Льюис блюз>, <Мантека> Гилеспи и даже ученический <Этюд №2> Скрябина, а также детская американская хороводная песенка. В руках мастеров оригинально аранжированные произведения обрели потрясающее, свежее звучание.\n\nК тому же каждый музыкант проявил и чудеса импровизации, без которой, как известно, считать джаз настоящим и полноценным невозможно.\nМногоминутные соло, как и полагается виртуозам, музыканты заранее не\nготовят: экспромт рождается именно в то мгновенье, когда каждый из них как бы выходит на <первый план>. Судя по свисту и топанию (вполне адекватная реакция на джаз-концерте), в неописуемый восторг зал пришел от Нила Смита.\n\nЕще бы! Что только не выделывал он на барабанах (кстати, за весь тур самая лучшая ударная установка была предоставлена именно Коми филармонией). Звуки они издавали немыслимого < колорита>: от шороха осенних листьев до громогласных перезвонов, от шепота ветра до комариного писка. Кстати, как выяснилось, темнокожий джазмен начал познавать азы музыки у себя в Штатах, едва оказавшись на школьной скамье. Сначала это были частные уроки на дому, затем игра в городских молодежных ансамблях. Далее: колледж и Оберлинг-консерватория, после которой - работа в церкви. У продвинутых\nкатоликов службы, в отличие от наших, проходят в музыкальном сопровождении (вплоть до рока). Но самую лучшую практику, как он сам рассказал, ему дали <уличные университеты>.\n\nЧто же касается маэстро Честната, сыктывкарцы оценили его по достоинству не только как пианиста, но и композитора, послушав его авторские произведения в исполнении с квартетом: аппетитную и зажигательную <Пищу для души>, печальный <Минорный фанк>, необыкновенно трогательную и лиричную <12-тактовую балладу> и другие.\nПо возвращении в США Сайрус будет занят на сольных концертах, музыканты отправятся на очередной фестиваль, а Николай Панов начнет готовить новую программу и займется продюсированием. Поскольку совместных проектов с различными музыкальными знаменитостями США у него много, может быть, мы вновь увидим альянс маэстро Панова, тем более, что в Коми джазмены - всегда желанные гости. \n\nДарья ШУЧАЛИНА.\n\n---------\n\nЗЫ. Cyrus Chestnut, \"признанный у себя на родине лучшим джазовым пианистом\", - это сильно. Но и музыкант он далеко не из последних. Можно только позавидовать любителям джаза в Старом Осколе, Твери, Днепропетровске, Иркутске, Сыктывкаре и Екатеринбурге. Ну и поудивляться, как это он с родной ритм-сексцией проехал мимо Москвы и Питера. \nКстати, в эти дни в Донецке и Киеве в программе \"Do#Dж-2006\" выступит Hiram Bullock Band."
