  deleted: false
  text: 'Читая предыдущий пост "Вчерашний концерт в ДУДе" у меня возник вопрос. Он
    не о блюзе, он о музыке ваабще. Наверное офф-топик, но он меня волнует хочу узнать
    ваше мнение.

    Я уже более года не играю с группой по кабакам [а это у нас, пожалуй, единственное
    место где есть возможность играть: для исполнителей, так сказать, современной
    музыки (поп, рок, джаз...) нет возможности играть концерты. Но меня не оставляет
    вопрос о выступлениях группы в кабаках (у нас называють это "Живой музыкой": "Скажите,
    а есть у вас (сегодня) живая музыка?") Каким выступление должно быть: негромким
    (быть фоном вечера, пусть посетители общаются, а мы заполняем пространство музыкой)
    или громким (читай: концерт, при этом посетителям приходится кричать друг другу
    что бы их услышали, приходится ждать паузу в песнях что бы поговорить). (пришел
    пообщаться? ну, попробуй :-)

    Да, я знаю что бывают люди (компании) которые приходят, сидят и слышают только
    тебя. Они даже не общаются за весь вечер. Чаще всего это дру Но таких меньше чем
    обычных посетителей которые пришли в кабак не ради музыки. К числу таких обычных
    посетителей я и себя и причислил бы. Я думаю что музыка в кабаке, пабе и т.д.
    должна быть негромкой, не привлекать к себе особого внимания. При этом даже если
    музыкант ошибётся, этого почти никто не заметит (кажись, Клаптон в Sessions For
    Robert Johnson говорил что в пабе ошибку музыканта в пабе могут и не заметить.
    что-то в этом роде, не могу щас проверить: двд отдал посмотреть).

    Что вы думаете по этому поводу?'
