    subject: О кабаках
    deleted: false
    text: В Америке в клубах играют довольно громко, потому что люди не разговаривать
      пришли, а пиво пить и веселиться, а веселье= громкая музыка. Играют обычно блюз
      и рок кавера. В основном, в заведениях с "живой" музыкой нет кухни- люди пьют.
      Разговоры разговаривают в ресторанах, где кроме саксофона иль ф-но фоном вообще
      ничего не нужно. В этом главное различие между рестораном и клубом. А когда
      всё валят в кучу и называют кабаком- я не понимаю о чём речь. Если человек пришёл
      в заведение с "живой" музыкой поговорить или тихо посидеть, то он просто ошибся
      дверью. А звук может быть громким, но не раздражающим- вопрос к оборудованию
      и ушам звукооператора.
