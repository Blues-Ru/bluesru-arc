      text: 'Мне лучше уточнить: имеется в виду бар и паб (кухни имеются).

        Ещё кое-что: у нас таковых заведений (имею в виду достаточно приличных) всего-то,
        не более 5. ну, максимум 10. И они совсем не просторные по размерам (это так
        сказать к соотношению размеры помещения/громкость звука). Выбор куда пойти
        весьма не велик (по себе чувствую).

        И ещё: нет большого разнообразия исполнителей в этих местах: 5 групп (из них
        только 2 с настоящими барабанами и бас-гитарой). Репертуар не часто обновляется
        у них. Есть песни которые все поют: Sunshine reggea, I will survive, Every
        breath you take, Imagine, Venus, Let it be...

        Достало меня это... Вот и пишу сюда, спросить а как у вас.'
