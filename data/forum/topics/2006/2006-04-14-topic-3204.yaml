    text: "вот про что песня:\nБаба сеяла горох\nпрыг-скок, прыг-скок\nобвалился потолок\nпрыг-скок, прыг-скок\n---\nуверен,\
      \ найдутся добрые люди, которые скажут, что песня это про оголтелый секс. ибо для высева гороха не требуется скакать,\
      \ а сеять горох под крышей так же нелепо, как сеять его и на крыше. Значит, все ясно - скакала баба в койке так, что\
      \ обвалился потолок. Упоминания \"гороха\", который она при этом \"сеяла\" делает песенку и вовсе непристойной. \nоднако\
      \ можно предположить, что, отправившись на танцы, баба весело прыгала (всего лишь!), до тех пор, пока не \"обвалился\
      \ потолок\". Верояно, в русской версии это означало, что потом она уже была \"легко готова на все\" (mellow down easy).\
      \ Упоминания \"гороха\" дать понять, что она, отправляясь на танцы, знала: что посеешь, то и пожнешь."
