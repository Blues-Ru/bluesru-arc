    deleted: false
    text: 'Это такие вот особенности русского языка и русскоязычной души:

      - Джон Мэйолл. Когда говорят что "Джон Мэйолл сделал всех", или он "надрал задницу to smbd" это совсем не значит что
      имел место физический, сексуальный контакт тел Мэйолла и остальных...

      - Бадди Гай. здесь всё просто откесь сия утка: Guy > Гай > (транслитерация) Gay > Гей

      Гей Славяне! Guy это не Gay: "парень" далеко не всегда "гей"...

      - Литтл Ричард. Тут слажнее: есть такое дело среди нелучшей половины человечины когда некоторые не-в-меру-эмансипированные
      мужищины называють известную часть своего тельца своим собственным именем с приставкой "Малыш".

      Ричард Пенниман же, был на самом деле небольшого роста (даже и фамилия его выдавала :-) Ну, и взял он таковой псевдоним...
      а некоторые человеки из вышеназванного числа решили раз товарищьчь назвал себя в честь своего детородного органа, то
      он тошно "тот самый"...

      Я помню что популярную 20 лет назад евро-диско группу Bad Boys Blue, из-за этого Blue все считали "галубыми". Ну, а
      тагдашний идол (да простят меня форумчане за то что произношу всуе его имя:) Томас Андерс, из-за своего "мягкого как
      вата" голоса тоже считался цветным. Битлз - антисоветская группа ("Русские берегитесь Англии" в Yellow Submarine), и
      Пинк Флойд тоже (они про Брежнева пели), а уж Кисс - то ваще фашисты. и AC-DC тоже (хотя не знаю за што)... Тогда много
      было глупостей. Видать и сейчас они есть...

      Жив Курилка! э-ге-Гей, гали-гали....

      P.S.

      > "господа блюзманы"

      Сам такое слово!'
