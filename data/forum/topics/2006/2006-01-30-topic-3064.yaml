  text: "Уважаемые музыканты! Есть в нашем городе Дмитрий Червец, музыкант группы \"Мухи\" и совладелец одного клуба (не называю этот клуб, поскольку другие совладельцы к основному тезису отношения не имеют). Так вот, при контактах с г-ном Червецом по поводу гигов СТАВЬТЕ ОБЯЗАТЕЛЬНЫМ УСЛОВИЕМ 100% ПРЕДОПЛАТУ. \nГруппа Черный Хлеб и я отказываемся от деловых контактов с упомянутым человеком по причине его ненадежности.\nЭтот постинг ставит своей целью не сведение счетов, а предупреждение возможных неудобств для порядочных людей."
