  text: "Здравствуйте, я уже довольно долго играю на классической гитаре, но в последнее\
    \ время заинтересовался блюзом, и решил купить электрогитару.  На других форумах\
    \ все почему-то советовали Fendor Squier Stratocaster. Подскажите, пожалуйста,\
    \ какой инструмент лучше взять для игры блюза, немного джаза (не более 250$),\
    \ ну и что к нему там нужно (комбик, усилитель, процессор), можно ли подключать\
    \ к компу вместо комбика? Очень ли опасно брать Б/У инструмент, на что тогда внимательней\
    \ стоит смотреть? Сразу скажу, что электруху покупаю чисто для себя, а дальнейшее\
    \ развитие планирую именно на классической гитаре. \n\nЗаранее всем благодарен."
  replies:
  - id: 27225
    parent_id: 27224
    date: 2006-04-28 17:14
    poster: Федор Романенко (fedor)
    email: fedor@blues.ru
    subject: Электрухи
    deleted: false
    text: 'Электруха - не самоцель! За 250$ можно купить электрогитару очень начального
      уровня, Squier стоит немного дороже. Без комбика/эмулятора комбика использовать
      ее не имеет смысла. В частности, включать в домашний усилитель, это - бессмысленно,
      ибо звука не будет, играть не захочется. Для компьютера, возможно, можно найти
      программу-эмулятор, но, возможно, понадобится маленький микшер и пр. Есть еще
      примочки-эмуляторы комбика или другие многофункциональные устройства. Т.е. минимум
      50-100$ придется выложить на что-нибудь, заменяющее комбик. Короче, ничего хорошего
      в этом смысле за 250$ не придумаешь.


      Поэтому, гораздо лучше купить хорошую акустику за те же деньги, на которой можно
      добраться до 12-15 лада и тянуть струны. И учиться играть на ней блюз. Единственный
      недостаток - будет не так красиво выглядеть перед зеркалом, в остальном - гораздо
      лучше и полезнее.'
