        text: 'Верно всё то что сказал Старшой Майор.

          Я лишь добавлю что бы научиться играть и понимать музыку (вне зависимости от её стиля) надо её много слушать ("здесь мало услышать - здесь вслушаться надо") и пытаться это самому сыграть (проще говоря: "снимать").

          Но по поводу "снимать": здесь такой непростой момент. Можно и пытаться сыграть по своему (сначала, у всех, как получается, потом как это тебе видится), а можно и копировать кого-то (на слух, либо по таблатурам). Вот во втором случае, мне кажется есть нехорошая штука: нахватавшись чьих-то фишек, можно стать просто очередной копией кого-то. и это больше нехорошо чем неплохо. Мне кажется что эта ситуёвина легко наблюдаема на примере тех кто косит по СРВ (я сам в некоторой степени на это попался...)

          Наверное что б этого избежать надо много слушать РАЗНЫХ музыкантов. (ну, Америки-то я и не открыл).

