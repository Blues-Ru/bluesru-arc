    subject: 'Вот такие объяснения:'
    deleted: false
    text: 'http://ikonnikov.livejournal.com/7893.html


      В воскресенье стало известно о том, что концерт легендарного Эрика Клэптона,

      намеченный на 3 августа на Красной площади, не состоится, пишут "Известия".

      Как выяснила газета, за день до этого на Лобном месте будет отмечаться

      400-летие начала российского освободительного движения от польской

      интервенции. Мероприятие благословил лично Патриарх Московский и всея Руси

      Алексий II, а разрешение дал президент России. Так как историческое

      торжество совпало с днем ВДВ, то организаторы решили совместить крестный ход

      с показательными выступлениями десантников. А чтобы монтировщики сцены Эрика

      Клэптона не мешали патриотическому действию, рок-музыканту в проведении

      концерта отказали. Но москвичи без звуков не останутся: они услышат

      выступления песенных коллективов ВДВ и патриотические шлягеры в исполнении

      группы "Блестящие".

      ---------------------------------------------------------------------


      Мне лично не известно, насколько это достоверно, но весьма правдоподобно.'
