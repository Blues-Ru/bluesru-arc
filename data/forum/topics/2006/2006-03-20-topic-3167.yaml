  text: "Было еще круче, чем в Москве. Видимо Джуниор хорошо выспался (в пятницу он\
    \ говорил, что спал всего два часа) и дал жару. Море драйва, позитив тоннами и\
    \ вообще все прошло замечательно. Играл много разных других песен, в том числе\
    \ и достаточно сложных чтобы сыграть \"с ходу\" для ритм-секции, но Билл с Алексом,\
    \ как известно, просто суперчуваки так что все было очень очень круто :) \n<br>\n\
    Одним словом, приезд Ватсона лично для меня это Явление с большой буквы, как ни\
    \ пафосно это звучит :) я получил огромнейшее удовольствие, массу положительных\
    \ эмоций и просто поглядел на самого крутого чувака :)"
