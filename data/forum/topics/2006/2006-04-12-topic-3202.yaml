    text: "Я сделал чуть по-другому, мне кажется проще, удобнее и быстрее:\nВзяв ссылку Stevie Wonder,Stevie R Vaughan,Jody Watley Superstition\nhttp://www.youtube.com/watch?v=UtSeS5kL-mM&search=STEVIE%20RAY%20VAUGHAN\nпо приведенному тобою способу получил новую ссылку\nhttp://www3.youtube.com/get_video?video_id=UtSeS5kL-mM&search=STEVIE%20RAY%20VAUGHAN\n- к http://www3.youtube.com/get_video?video_id= добавил концовку моей ссылки UtSeS5kL-mM&search=STEVIE%20RAY%20VAUGHAN\nПолученную ссылку вставил в свой менеджер закачек (FlashGet, ReGet, Download Master...) и закачал файл get_video (без расширения). И потом его переименовал как мне угодно и также дал файлу расширение .flv\nНу, вот и всё.\nP.S. Прислал мне друг кучу ссылок на SRV. Кое что есть у меня, но не всё. Может кому будет тоже интересно:\nSRV IN JAPAN  (SCUTTLE BUTTIN’)\nhttp://www.youtube.com/watch?v=YrCZ3AonhhY&search=STEVIE%20RAY%20VAUGHAN\nStevie Ray Vaughan - Rude Mood Live ACL 1983\nhttp://www.youtube.com/watch?v=rMZg0vUZyWs&search=SRV\nSRV TEXAS FLOOD SOLO  ACL 1983\nhttp://www.youtube.com/watch?v=4DJshgftkzk&search=SRV\nLIFE WITHOUT YOU (4-22- 1988) LIVE\nhttp://www.youtube.com/watch?v=f_gp1ZpUj3c&search=STEVIE%20RAY%20VAUGHAN\nStevie Ray Vaughan BB King Albert Collins \"Texas Flood\" 4-22-88\nhttp://www.youtube.com/watch?v=nPnXtfSY3LQ&search=STEVIE%20RAY%20VAUGHAN\nStevie Ray Vaughan and Albert collins - Frosty 1988 \nhttp://www.youtube.com/watch?v=nTtrCU8SQXo&search=STEVIE%20RAY%20VAUGHAN\nStevie Ray Vaughan - Testify - MTV Unplugged 1990\nhttp://www.youtube.com/watch?v=WZZyv_UAApo&search=STEVIE%20RAY%20VAUGHAN\nAlbert King and Stevie Ray Vaughan MAXBOX BLUES\nhttp://www.youtube.com/watch?v=-nPsIBky8Rg&search=STEVIE%20RAY%20VAUGHAN\nLittle Wing - SRV - El Macambo\nhttp://www.youtube.com/watch?v=C2Qrxp-IItE&search=STEVIE%20RAY%20VAUGHAN\nStevie Wonder,Stevie R Vaughan,Jody Watley Superstition\nhttp://www.youtube.com/watch?v=UtSeS5kL-mM&search=STEVIE%20RAY%20VAUGHAN\nLittle wing clip\nhttp://www.youtube.com/watch?v=y-oO11qodaI&search=STEVIE%20RAY%20VAUGHAN\nVOODOO CHILE (EL MOCAMBO 83)\nhttp://www.youtube.com/watch?v=1GSpbuFSr2o&search=STEVIE%20RAY%20VAUGHAN\nSRV - Lenny  (EL MOCAMBO 83)\nhttp://www.youtube.com/watch?v=gMSnQL58-BA&search=STEVIE%20RAY%20VAUGHAN\nCOLD SHOOT CLIP :-)))\nhttp://www.youtube.com/watch?v=LHBYh_6EU2A&search=STEVIE%20RAY%20VAUGHAN\nLIFE WITHOUT YOU Stevie Ray Vaughan in Finland, 17-7-85 Pori Jazz Festival \nhttp://www.youtube.com/watch?v=kxgrnmf0V2g&search=STEVIE%20RAY%20VAUGHAN\nSRV & Jeff Beck “I’m Down” live from the UCP Arena\nhttp://www.youtube.com/watch?v=VIJVusB6Sms&search=STEVIE%20RAY%20VAUGHAN\nSRV “CROSSFIRE” (NBC Night Music)\nhttp://www.youtube.com/watch?v=g7CUuWgZdh4&search=STEVIE%20RAY%20VAUGHAN\nStevie Ray Vaughan, B.B. King, Albert King, Paul Butterfield - The Sky Is Crying!\nhttp://www.youtube.com/watch?v=_YSBtd7Ao-I&search=STEVIE%20RAY%20VAUGHAN\nStevie Ray Vaughan goes crazy at El-Mocambo 83 (THIRD STONE FROM THE SUN)\nhttp://www.youtube.com/watch?v=bLpCZR3BUDg&search=SRV\nSRV Superstition (Outtake) \nhttp://www.youtube.com/watch?v=zCiYqGrUr_M&search=STEVIE%20WONDER"
