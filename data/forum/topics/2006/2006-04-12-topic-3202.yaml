  subject: Как получить видео для локального просмотра
  deleted: false
  text: "Уважаемый Grey Wolf (Harmonica.Ru) по моей просьбе предоставил алгоритм сохранения видео-файлов с сайта www.YOUTUBE.com для локального просмотра. \n\nПредставленные на сайте файлы имеют внутренний стримовый формат Macromedia Flash под названием FLV, который ну никак не просматривается стандартными плеерами типа WinAmp и Windows Media Player.\n\nПоэтому сначала скачаем и установим freeware FLV Player размером чуть более 1 мегабайта отсюда:\n\nhttp://www.download.com/FLV-Player/3000-2139_4-10505954.html \n\nДалее для примера возьмём прекрасное исполнение Howling Wolf'ом песни Love Me Darling, изображение чёрно-белое и следовательно небольшое по размеру - всего 9 мегабайт. \n\nИсходный адрес его такой: \n\nhttp://youtube.com/watch?v=3MCyYM-GQK0\n\nВ таком виде файл просматривается с удалённого сайта и никак не хочет сохраняться на локальном диске, т.е. хочешь посмотреть ещё раз - опять здравствуй трафик. Как говорят, нафиг этот трафик, нормальные герои всегда идут в обход.\n\nВ качестве броузера используем стандартный IE версии 6.0.\n\nИз адреса надо выделить последнюю часть - бессвязный набор букв и цифр и подставить его в строку следующего вида: \n\nhttp://www3.youtube.com/get_video?video_id=3MCyYM-GQK0\n\nПосле этого файл будет предложено открыть (Open) или сохранить на вашем локальном диске (Save), выберите Save.\n\nПоскольку все файлы по умолчанию будут называться одинаково - get_video (без расширения), то перед сохранением файлу надо дать человеческое имя, для чего в поле File Name формы Save As.. введите что-нибудь типа HW-LoveMeDarling.FLV \nОбратите внимание, что сохраняемый файл ОБЯЗАТЕЛЬНО должен иметь расширение FLV, поэтому не забудьте его добавить!\n\nПосле того, как файл загрузится, и если перед этим FLV-плеер был успешно установлен, то можете кликнуть и наслаждаться!\n\n(c) Grey Wolf (Harmonica.ru) - алгоритм, \n(С) Gypsy (Gypsy.bluesman.ru) - текст."
