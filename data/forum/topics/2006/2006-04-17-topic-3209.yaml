  deleted: false
  text: 'На страничке "Эти дни в истории блюза":

    <i>В 1960 году (46 г. назад) в день окончания английских гастролей, Эдди Кохрэн (Eddie COCHRAN), Жен Винсент и Шарон Шилей
    возвращались в Лондон. Кохрэн был за рулем, и он единственный, кто погиб в той автокатастрофе. Ему, автору исполняемой
    и поныне популярной песни «Летний блюз» (Summertime Blues).</i>

    Такой вопрос: Summertime Blues и Summertime Дж. Гершвина - это не одно и тоже?

    Почему спрашиваю: здесь упамянается и Джин Винсент (Gene Vincent) который исполнял Summertime Гершвина. И благодаря ему
    Summertime стала частью и рок-н-ролла (помню об этом было сказано в аннотации какого-то англ. музыковеда к пластинке П.Маккартни
    "Снова в СССР").

    Просто другого блюза Summertime я и не знаю. Нет ли здесь путаницы?'
