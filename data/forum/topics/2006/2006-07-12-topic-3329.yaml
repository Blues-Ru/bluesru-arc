    deleted: false
    text: 'На форуме битлз.ру пишут что с билетами на концерт происходит нездоровая фигня. Люди уже купили билеты, а теперь
      им говорят что теперича надо их возвратить, но при этом деньги возвратят не все, бронь (300 руб.) не возвращают. В общем,
      вот что пишут:

      - Только что мне позвонили из Show Trade и сказали, что фан-зону отменили. Остались только партер и танцпартер. Они
      возвращают деньги, в течение 2-х дней, без услуги бронирования.

      - Звонили из ТопБилет с сообщением, что "типа организаторы якобы пересмотрели цены" и билеты, указанные у них по 2000,
      теперь стоят 3000.

      P.S. Слух по поводу Крэя (который дошел до меня, который я здесь и озвучил) как я вижу никак не обсуждается. Сдается
      мне что это говорит о том что этот слух и есть не более чем слух. Надеюсь на это.'
