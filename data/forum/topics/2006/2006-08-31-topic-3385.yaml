    subject: Просмотр flv файлов в полноэкранном режиме
    deleted: false
    text: "У вышеприведенных плейеров есть один недостаток: видео воспроизводится в маленьком окошке, нет возможности воспроизведения\
      \ на весь экран.\nЯ нашел такое решение этой проблемки:\nСкачал и установил \n<a href=\"http://download.betanews.com/download/945901171/tcmdr655.exe\"\
      >Total Commander</a> и <a href=\"http://wincmd.ru/files/wlx_swflst_2.0s_.zip\">плагин SWF Lister plugin 2.0 for Total\
      \ Commander</a>\nВ ReadMe файле плагина описано что далеше надо делать.\nПосле несложных процедур мы можем смотреть\
      \ flv файлы в полноэкранном режиме"
    replies:
    - id: 28567
      parent_id: 28565
      date: 2006-09-02 17:30
      poster: Эльдар Музафаров
      email: elicaster co6@kaмейл-d0t ru
      subject: Регистрация плагина SWF Lister plugin 2.0
      deleted: false
      text: 'Кстати, у плагина SWF Lister plugin 2.0 такая прикольненькая регистрация: надо ввести в Name: xUSSR и жмём OK.
        далее будет вопросик по математике, ну и усё :-)'
    - id: 28585
      parent_id: 28565
      date: 2006-09-04 23:12
      poster: Эльдар Музафаров
      email: elicaster co6@kaмейл-d0t ru
      subject: 'SWF Lister: совет от автора плагина'
      deleted: false
      text: 'В плагине SWF Lister реализован полноэкранный режим (чего нет в вышеназванных плейерах), но вот появился другой
        момент: несколько мешает трэкбар (кнопки воспр/пауза и вкл/выкл звука). Конечно, он нетрудно исчезает как только увести
        курсор влево. Но было бы намного удобнее если бы с самого начала запуска он не появлялся бы сам, если бы он вызывался.

        И ещё, было б очень удобно если была б возможность перемотки при воспроизведении *.flv файлов.

        Я спросил об этом автора этого плагина - <a href="http://tcplugs.shuriksoft.com/">Shurik</a>''а. Вот что по этому
        поводу он сказал: <i>уберите использование скина вообще, для этого в lsplugin.ini (этот файл обычно лежит в корневой
        папке Total Commander''а) найдите flvSkin=??????.swf  и сотрите этот параметр, а лучше оставить вот так flvSkin=

        По поводу перемотки во время воспроизведения *.flv файлов. Эта возможность зависит от типа flv, если он потоковый
        то перемотки нет. А вот как раз файлы с youtube в основном потоковые</i>'
