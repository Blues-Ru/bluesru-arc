    text: '19 января в госпитале Рестона, Вайоминг, в результате сердечного приступа умер легендарный американский соул-исполнитель
      Уилсон Пикетт (Wilson Pickett). Артисту было 64 года. Музыкант, наряду с Аретой Франклин, Робертой Флэк и Соломоном
      Бурком считающийся одним из самых значительных исполнителей ритм-н-блюза и соул, получил известность у публики в середине
      60-х благодаря таким хитам, как «Midnight Hour» и «Mustang Sally».

      Уилсон Пикетт родился в 1941-м году в Пратвилле, штат Алабама. Юношей он переехал в Дейтройт, где присоединился к группе
      The Falcons, с которой в 1962-м году записал ставшую весьма популярной песню «I Found a Love». В 1965-м году музыкант
      подписал контракт с компанией Atlantic и начал выступать как сольный исполнитель.

      В 60-х годах Уилсон Пикетт записал и выпустил несколько хитовых синглов, включая «Land of 1,000 Dances», «Funky Broadway»,
      «634-5789», «She''s Lookin'' Good» и «Mustang Sally». В начале 70-х одна за другой в лучшей двадцатке чартов оказались
      его песни «Engine Number 9», «Don''t Let the Green Grass Fool You» и «Don''t Knock My Love Pt. 1». Пикетт регулярно
      записывался вплоть до середины 80-х. В 1991-м году музыкант был введен в символический Зал Славы Рок-н-ролла.

      В последнее время, по сообщению менеджмента Уилсона Пикетта, он испытывал серьезные проблемы со здоровьем.

