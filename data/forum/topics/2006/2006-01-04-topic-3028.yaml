  text: "Yuppie-Blues - Яппи-Блюз\n(вторая редакция от 20.07.2003)\n\n\nДень и ночь. \nСвет и тьма.\nСутки прочь. \nДни... Года...\n\nБизнес-план. \nПлан-проспект.\nОфис. Банк. \nГранд-проект.\n\nТерминал.\nФейс-контроль.\nСпец-сигнал.\nКейс. Пароль.\n\nАвтобан.\nКофе-брейк.\nРесторан.\nЧипсы. Стейк.\n\nТелефон.\nТелефакс.\nКраткий сон\nчерез раз...\n\nТам - дефолт.\nТут - прогресс.\nШум банкнот.\nВечный стресс!\n\nЭто - Яппи-Блюз!\nЭто - Яппи-Блюз!\nЭто - Яппи-Блюз!\nЭто - Яппи-Блюз!\nЗа дело взялся яппи! -\nCчитай, что дело в шляпе!\nЭто - Яппи-Блюз!\n\nБизнес-класс.\nЯппи-клуб.\nСмокинг. Джаз.\nСлед от губ.\n\nПовстречал. \nПригласил.\nПереспал.\nПроводил.\n\nДом. Гараж. \nМерседес.\nДуш. Массаж. \nЭкстрасенс.\n\nФитнес-зал.\nE-mail. Спам.\nИммунал.\nТазепам.\n\nКалендарь.\nСуета.\nВечер. Хмарь.\nПустота...\n\n300 виз.\n30 лет.\nЭпикриз.\nИмпотент.\n\nЭто - Яппи-Блюз!\nЭто - Яппи-Блюз!\nЭто - Яппи-Блюз!\nЭто - Яппи-Блюз!\nЗа дело взялся яппи! -\nCчитай, что дело в шляпе!\nЭто - Яппи-Блюз!\n\nDark and light.\nRound the clock.\nDay and night.\nRoll and rock.\n\nBusiness plan.\nSuper size.\nOffice. Bank.\nLooking nice.\n\nAirport.\nFace control.\nLoaded word.\nUrgent call.\n\nAutobahn.\nCoffee break.\nRestaurant.\nChips & steak.\n\nVery steep,\nquick progress.\nTroubled sleep.\nNervousness.\n\nStock goes up.\nStock gives way.\nSeven Up.\nStress & shake.\n\nIt's a yuppie blues!\nIt's a yuppie blues!\nIt's a yuppie blues!\nIt's a yuppie blues!\nInvite in business yuppie,\nand you'll be fine and happy!\nIt's a yuppie blues!\n\nBusiness class.\nJuppie Club.\nBlack tie. Jazz.\nLipstick daub.\n\nMet aside\nPretty lone.\nSpent the night.\nTook her home.\n\nHouse. Garage.\nLimousine.\nDouche. Massage.\nTherapy.\n\nFitness. Gym.\nSchedule. Draft.\nAspirin.\nSleeping-draught.\n\nFuss. Watchdog.\nSad. Depressed.\nEvening. Fog.\nEmptiness...\n\nNet result.\nThirty years.\nTo sum up.\nImpotence.\n\nIt's a yuppie blues!\nIt's in the bag!\nIt's in the bag!\nIt's a yuppie blues!\nIt's in the bag!\nIt's in the bag!\nIt's a yuppie blues!\nIt's in the bag, bag, bag!\nIt's a yuppie blues!\nIt's in the bag!\nIt's in the bag!\nInvite in business yuppie,\nand you'll be fine and happy!\nIt's a yuppie blues!\n\nIt's in the bag!\nIt's in the bag!\nIt's in the bag!\nIt's in the bag!\nIt's in the bag!\nIt's in the bag!\nIt's in the bag!\nIt's in the bag!\nIt's in the bag, bag, bag, bag, bag, bag, bag!\nIt's in the bag!\nIt's all right! \nYeah...\n\n___\n\nСЛОВАРЬ\n\nroll - пачка денег\nrock - деньга, монетка, доллар\nloaded word - веское слово\nStock goes up. - Акции растут.\nStock gives way. - Акции падают.\nblack tie - строгий вечерний костюм\nLipstick daub. - След от помады.\nsleeping-draught - снотворное средство\n\n___\n\nПРИМЕЧАНИЕ: Яппи-Блюз исполняется в стиле Shuffle Blues.\nМузыкальный рисунок и ритм близки к\nhttp://www.blueslessons.de/kostenlose_backing_tracks.htm\n(Backing Track - Shuffle Blues in A.mp3)\n\n___\n\nЯППИ (Yuppie, Young Urban Professional, молодой городской профессионал) — \n- молодёжная субкультура, представители которой ведут конформистский \nобщепринятый образ жизни человека современного западного общества. \nЯппи имеют высокооплачиваемую работу, в одежде предпочитают деловой стиль, следят за модой, посещают фитнес-центры, лето проводят на курортах. Основной критерий \"яппи\" - фэшенебельность (\"модность\"). Понятие \"яппи\" возникло в начале 1980-х как противовес понятию \"хиппи\". \"Яппи\" не отрицают сексуальной революции (допускают случайные сексуальные связи до брака и терпимо относятся к изменам как к расторжению контракта), однако признают институт семьи. Мировоззрение \"яппи\" - американский прагматизм, здравый смысл \nили \"разумный эгоизм\". Первый свой миллион долларов \"яппи\" создают \nв двадцатилетнем возрасте в ущерб здоровью, личной жизни, образованию \nи прочим прелестям жизни. А к тридцатилетнему рубежу их нервная система просто уже не выдерживает сверхчеловеческих нагрузок... \n(http://ru.wikipedia.org)\n\n___\n\n© Copyright: Амелькин Александр Анатольевич, 2003\nСвидетельство о публикации №1307180805\nhttp://www.stihi.ru/poems/2003/07/18-805.html\nhttp://zhurnal.lib.ru/a/amelxkin_a_a/blues.shtml\nhttp://www.stihi.ru/poems/2005/12/31-1197.html\nhttp://www.stihi.ru/author.html?amelkin"
