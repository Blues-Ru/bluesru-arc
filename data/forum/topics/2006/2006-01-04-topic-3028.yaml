                text: "Glazed, Sexual Telepathy, New Orleans Street Talkin\nРаннего его, к сожалению, мои источники не содержат. Возможно, тогда ещё грамзапись не изобрели.\n\nНу нет в нём ничего такого монументального, я б его отнёс к Дюкам или Ёрлам, но никак не к Кингам. Темы вроде неплохи, но незапоминающиеся, а которые запоминаются, так что-то напоминают из предыдущих ораторов - Magic Sam и Guitar Slim. \nНи одного эвергрина за ним как-то не числится, гитарный звук отдаёт пластмасской какой-то, голосок прям скажем, не ахти. \nВ общем всё как бы на четвёрку, но радости особой не приносит.\nНетути в нём истинно королевского величия.\n\nА вы, товарищ хамелеон, примите какую-нить конкретную форму! А то от ваших метаморфоз в глазах рябит!"
