        subject: надо братцы, надо
        deleted: false
        text: "А то вишь какая путаница в головах. Вот я понимаю людей не различающих\
          \ Шотландскую волыночную музыку от Ирландской. Или Костромской фолк не отличающих\
          \ от Вологодского. Или даже тех, кто считает джазом оркестры Глена Миллера\
          \ и Утесова. Или на худой конец путающих Грига с Чайковским. \nНо блюз то\
          \ от Джаза! Да это все равно, что спутать валенок с войлочными сапогами\
          \ от Дольче и Габано!\nС точки зрения джаза, Блюз - это примитивная народная\
          \ музыка без гармонического и ритмического развития, где слабость аранжировки\
          \ и бедность сознания подменяются малограмотными пошловатыми стишками. Да\
          \ еще и сплош перепевки одних и тех же народных-блатных мелодий.\nНа родине\
          \ блюза - им занимаются те, кому собственно и положенно - малограмотные\
          \ негры с криминальным прошлым (настоящим или будущим). В нашей парадоксальной\
          \ стране, блюзом занимается преимущественно \"интелегенция\", точнее, самый\
          \ деклассированный ее вид - бомжи, несостоявшиеся зубные техники, дети знаменитых\
          \ родителей, различных национальных диаспор и т.п. М.б. это наиболее полно\
          \ отражает место интелегенции в нашем обществе, уже вроде и не на плантациях\
          \ рабы, но еще и не белые люди. Кстати, блюз наверное и перестали петь на\
          \ его родине, негры получили образование, работу, успех и т.п. \nДжаз -\
          \ музыка немного поприличнее, да тоже в общем то никому нафиг не нужная,\
          \ кроме нескольких десятков эстетствующих пиЖонов."
