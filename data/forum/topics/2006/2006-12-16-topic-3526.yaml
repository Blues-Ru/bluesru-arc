      subject: Да, неплохо сказанно.
      deleted: false
      text: 'А в самлм деле, вопрос интересный и заслуживает обсуждения.

        Давайте все таки исторически. Блюз - народная музыка. (изначально) Дважды
        на протяжении столетия оказавший влияние на формирование мировой тенденции
        в музыке. В начале прошлого века явившись основоположником джаза. и в середине
        - рок-н-рола. И в джазе, и в роке были и другие состовляющие. Но корень блюза
        - пожалуй самый толстый.

        Потому, если говорить - то блюз - это один из родителей джаза.  Да такой,
        что в общем пережил своего "сынка" и продолжал плодить деток дальше, когда
        его потомки уже стали страдать проблемами с потенцией.

        Другое дело, что джаз - сильно развился за более чем сотню лет. и пережил
        и множество эпох. И Жоабимовские боса-новы уже не спутать би-бопом или кул-джазом.
        И корень блюза уже не везде можно опознать. Да и блюз, как отдельное музыкальное
        течение претерпел немалое развитие. Но тем не менее, наверное треть джазовых
        композиций написано в стиле (гармонические сетки, ритмика, 12 тактовая структура
        и т.п. формальные признаки) блюза. Хотя должен сказать, что джазовый блюз
        и то что исполняет тот же Хукер очень сложно причислить к одному стилю :-).
        Но есть конечно и общие черты кроме формальных. Импровизационный характер
        музыки, ритмический "грув", настроение.

        Хотя, конечно разная это музыка. Очень разная. Хотя и называется одним словом
        - БЛЮЗ'
