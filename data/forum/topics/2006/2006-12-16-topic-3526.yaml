    subject: мое мнение
    deleted: false
    text: 'Нет четкой границы между блюзом и джазом.  Толкьо что покинувший нас великий
      джазмен Jay McShann всегда говорил, "хороший блюз - это есть джаз.  И хороший
      джаз - это есть блюз."   Лично, я не считаю "блюз" женром, а языком музыкального
      общения.  Можно общаться на блюзовом языке в джазе, в роке, в госпеле, в соуле...  И
      наборот, можно играть джазовую музыку практически без блюза. Можно даже играть
      блюзовые песни пратически без блюза (и довольно часто это бывает).


      Muddy'
