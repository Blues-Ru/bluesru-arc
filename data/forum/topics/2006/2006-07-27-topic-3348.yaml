                            тем, на джеме обычно играют некоторые обобщенные темы, а именно:


                            1. Медленное возилово в соль. Под него поётся The Sky is Crying и Stormy Monday.

                            2. Быстрое гремелово в ля. Под него играются инструментальные шаффлы без начала и конца.

                            3. Непонятного темпа шумелово в ми. Под него играется всё что угодно - от Mary Had A Little Red
                            Rooster до Pride and Joy.


