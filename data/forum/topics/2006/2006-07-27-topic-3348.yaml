                        subject: Правила поведения на джеме.
                        deleted: false
                        text: "Появляться стоит. Но аккуратно. \n\nПривожу правила поведения на джеме.\n0. Выходить на сцену\
                          \ с настроенной гитарой. Выйдя, спросить у лидера хаус-бенда тему и тональность. Подключившись,\
                          \ проверить на малой громкости, нормально ли звучит тонический аккорд, не расстроились ли струны\
                          \ пока шёл - мало ли, задел грифом за кого-то.\n1. Внимательно слушать тему и импровизировать именно\
                          \ на её основе, а не играть любимое соло СРВ совсем из другой оперы, на ходу транспонированное в\
                          \ любимую тональность \"Ми монот\",\n2. Смотреть на лидера хаус-бенда, он даёт команду когда кому\
                          \ из джемующих вступать. \n3. Не перебивать чужие соло, даже если Мара Левина играет уже 25-й квадрат,\
                          \ но все никак не разрешится от бремени импровизации. \n4. Играть чисто и мало, выключить на фиг\
                          \ все процессоры, поражать всех не техникой а мелодизмом. \n5.Играя, улыбаться, а не изображать\
                          \ на лице всю скорбь по безвременно ушедшему от нас СРВ.\n6. Отыгравши, поклониться публике, при\
                          \ этом постараться не заехать грифом в глаз солисту, и выйти со сцены, освободив её для следующего\
                          \ джемующего, а не застаиваться на сцене как памятник Ришелье в надежде, что дадут поиграть ещё.\n\
