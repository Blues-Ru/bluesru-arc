      AI RoboForm 6.7.7

      Обновился плагин, предназначенный для автоматического заполнения веб-форм. После регистрации на различных веб-сайтах
      приходится запоминать регистрационные данные и вводить их вручную. Эта программа позволит запомнить регистрационные
      данные и подставить их в нужные места на веб-сайтах при необходимости. AI RoboForm может делать следующие операции:
      сохранит пароли из парольной формы; автоматически заполнит пароли; автоматом зайдет в сетевые аккаунты; сгенерирует
      случайные пароли; шифрует пароли; может хранить пароли на любом съемном диске; спасает, восстанавливает и печатает пароли.
      AI RoboForm работает в операционной системе в качестве дополнения (плагина) к различным браузерам: Internet Explorer,
      AOL, MSN, Mozilla, Firefox, Netscape. В этой версии улучшена интеграция плагина в браузер Internet Explorer, доработан
      интерфейс, исправлено несколько ошибок.'
