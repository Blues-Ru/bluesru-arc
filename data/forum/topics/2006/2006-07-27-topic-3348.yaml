                    poster: Старый Майор
                    email: gypsy@mail.ru
                    subject: Ну извольте.
                    deleted: false
                    text: "Короче. Прослушанный фрагмент blues.mp3 представляет собой подражание кому-то из белых guitars\
                      \ heroes, типа Jimmy Page, SRV и Clapton, исполненное в медленном темпе в минорной тональности, напоминающей\
                      \ си минор. \n\nФрагмент демонстрирует, что молодой человек умеет держать в руках гриф и извлекать на\
                      \ нём ноты. И это хорошо. Некоторые и этого не умеют, а на сцену лезут. И не только на блюзовых джемах.\n\
                      \nНо. Безусловно, это не блюз. Объясняю почему. Конспективно, поскольку после обеда меня всегда в сон\
                      \ клонит.\n\nБлюз - музыка негров.\nКак все люди южные, негры очень сексуальны.\nПоэтому блюз - это\
                      \ сексуальная музыка.\nСекс - это ритм, который хочется повторять снова и снова, пока не устанешь.\n\
                      Также и блюз.\nРитм блюза называется groove.\nGroove - это такой стиль исполнения ритма, когда ритм-секция,\
                      \ предоставленная самой себе, при солисте, ушедшем попить пивка либо наоборот, играет настолько клёво,\
                      \ что публика не разбегается, а прихлопывает и притопывает, пока не устанет. \nКроме того, в блюзе обязателен\
                      \ рифф.\nРифф - это короткая эффектная мелодическая фраза, которую быстро запоминаешь, и потом ее хочется\
                      \ повторять снова и снова, потому что она в кайф. (\"Кайф\", см. \"Секс\").\n\nПриведённый отрывок таковыми\
                      \ качествами не обладает. Зато в нём чувствуется чуждая здоровому негритянскому духу психоделическая\
                      \ псевдокрасивость и псевдозначимость - т.е. аморфное перебирание струн и извлечение \"ликов\" в ритме\
                      \ \"умирающего лебедя\", инспирированное приёмом лёгких психотропных препаратов типа алкалоидов каннабиса.\
                      \ \nЭтим можно заниматься до, после или вместо секса, но никак не во время оного. Посему и блюза из\
                      \ такой музыки не получится. \n\nНе вставляет!"
