                        deleted: false
                        text: 'Дело в том, что привычка джемовать по средам в БиБи укоренилась в сознании некоторых "странных
                          людей", поэтому необходимо сначала побороть привычку, т.е сбить стереотип поведения методами, которыми
                          в определённых заведениях обычно лечат маниаков разных типов.


                          Я предлагаю:

                          1) Закрыть джемы в БиБи Кинге по средам на месяц или два, чтобы у "странных людей" рассосалась вредная
                          привычка посещать клуб именно в среду. Через месяц-другой можно возобновить джемы, но желательно
                          в другой день недели, например во вторник, тогда это будет джем совершенно другого формата с новыми
                          правилами.


                          2) Разделение на агнцев и козлищ надобно ввести квотированием - т.е. ту смесь бардака с вокзалом,
                          в который превратились джемы в БиБи, можно побороть только тем, что ограничить число выступающих,
                          например, до 10.


                          3) Полицейские меры следует применять администрации клуба, а не бэнд-лидерам, которые по природе
                          своей люди мягкие, интеллигентные, не умеющие отказать и тихо страдающие постфактум. Если администрация
                          будет уклоняться от того, чтобы отказать от дома, сиречь от клуба, всяким недоучкам, то эти агрессивные
                          графоманы от музыки в конце концов вытеснят с джемов всех нормальных музыкантов.


                          4) Уважаемым молодым коллегам среднего уровня продвинутости я бы рекомендовал воздержаться от регулярного
                          посещения джемов, чтобы собой не создавать толпу рвущихся на сцену.'
