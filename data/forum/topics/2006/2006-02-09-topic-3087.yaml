  subject: Есть серьезный разговор
  deleted: false
  text: "по поводу джемов в БиБиКинге. Мы обсуждали эту тему с Вороновым и Дагаевым (они, возможно, подключатся к обсуждению).\n\
    \nЛёша и другие руководители клубы хотят улучшить качество джемов и увеличить их посещаемость. Дело в том, что в последнее\
    \ время на сцену выходят странные люди. Кто-то совсем не умеет играть и петь, кто-то начинает пилить на гитаре с примочкой,\
    \ есть те, что выходят с ненастроенными гитарами и не знают КАК РУЛИТЬ звук на комбике, есть также просто нездоровые люди\
    \ (что сразу всем ясно в зале). Всё это не очень смешно, ибо БиБиКинг - это приличное место и клуб, а не сборище для психов.\
    \ Много раз бардак устраивают люди типа Дегтярюка или Жоры (как это было сегодня с хамским поведением). Не все лидеры\
    \ групп могут справляться с этим, а некоторые ведут себя очень жестко, наоборот, что тоже сразу заметно и остается дурацкий\
    \ осадок. \n\nДагаев хочет договориться со всеми лидерами, чтобы давать больше играть ЗВЕЗДАМ и ХОРОШО ИГРАЮЩИМ новичкам,\
    \ и вообще стараться не пускать отморозков, пьянь, металлистов, психически нездоровых ребят (все прекрасно знают, о ком\
    \ идет речь).\n\nКакие есть мнения. Очень интересует мнение Аграновского, Булкина, Евдокимова, Фёдора, Оксаны, Виноградова,\
    \ Каверкина, Старого Майора и т.д.\n\nИ самое главное, что об этом думают те, кто ИГРАЮТ на джемах и те, кто СЛУШАЕТ (приходит\
    \ за деньги).\n\nСпасибо за внимание! Лёша добавит, я надеюсь."
