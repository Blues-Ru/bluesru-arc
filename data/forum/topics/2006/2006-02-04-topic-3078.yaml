    subject: While My Guitar Gently Beeps
    deleted: false
    text: "http://www.gizmag.co.uk/go/5124/\nJanuary 31, 2006 Fed up posing in front of the mirror strumming a tennis racket?\
      \ Still searching in vain for the lost chord? Help is on hand for all aspiring rock gods thanks to Fender and Intel,\
      \ who’ve teamed up to create a concept guitar that explores the possibilities and redefines the term ‘music on the move’\
      \ – an internet-enabled super guitar. Beginning with the iconic FENDER Telecaster - made famous by legends from Bruce\
      \ Springsteen to Franz Ferdinand – the ‘surf guitar’ is the world’s first to allow you to download and playback your\
      \ favourite riffs from the internet without touching the strings, so you can sound like Bo Diddley while doing diddly-squat.\
      \ Yes folks, if this concept ever makes production, you’ll be able to play, record, email and surf the web from the\
      \ comfort of your six-string\nIncorporating Intel Centrino Mobile technology, the supercharged TELE also means players\
      \ can, send a quick email in-between songs on stage, scour the web for inspiration or chords they’ve forgotten, practice\
      \ their guitar solo grimaces via a built in webcam and check their royalties online.\nChannelling the combined power\
      \ of an Intel Centrino mobile technology-based laptop with the distinctive sound and look of the TELECASTER, there’s\
      \ nothing to stop the touring rock god from recording a guitar riff in the back of the van and emailing it from the\
      \ guitar to their producer in the studio in LA or to friends and band mates wherever they are in the world, making the\
      \ world of online jamming just a plectrum stroke away.\nThe prototype v1.0 guitar is the result of a partnership between\
      \ Intel and Fender to push the boundaries of music technology and demonstrate the power of Intel Centrino mobile technology\
      \ that allows internet access on the go.\nBuilt in software means you can access a massive variety of sounds directly\
      \ from the computer. And for the older guitarist about to embark on the reunion tour, the internet-connected mp3 player\
      \ means they can download the old hits for a quick refresher before the first night.\nSimon Shipley, UK and Ireland\
      \ Brand Manager said: “Forty years after the first surf guitar sounds came out of California, a new generation of ‘surfing\
      \ guitars’ have been born.”\n“With this guitar, it doesn’t matter if you’re Joe Walsh or Joe Bloggs, you’ll sound just\
      \ as good once you get this guitar online, download a few of your favourite tracks, and strike a pose in front of the\
      \ mirror. And if you’re already halfway to becoming a rock legend, this guitar will help you to record, playback and\
      \ email your music to your agent, your band, or just your mates with the minimum hassle.”\nThe Intel Concept TELECASTER\
      \ Guitar incorporates the latest Intel Centrino mobile technology and was developed to provide the ultimate in technology\
      \ for music on the move. The guitar can be played when you want, wherever you want, allowing you to:\n      Plug in\
      \ headphones and listen to your tunes through the built in amp Record demo songs and email them to friends Go online\
      \ to find the chords to that song someone just requested Stay in touch through email or Instant Messenger – on stage\
      \ or on the tour bus Conduct webcam interviews with friends or fans Download your favourite tunes and just listen -\
      \ or play along\nThe TELECASTER guitar contains a Hewlett Packard TC1100 tablet laptop with 1.25ghz RAM and an Echo\
      \ Indigo I/O soundcard for maximum fidelity\nThe laptop uses Intel Centrino mobile technology to access a wireless network,\
      \ where one is available.\nThe guitar’s pickups are routed straight into the tablet PC for direct recording\nTwo _ inch\
      \ jack sockets allow you to either play the guitar like a normal Telecaster, or listen to the songs you’ve downloaded\
      \ direct from the guitar. Of course, if you want to travel light you can just run a lead from your guitar to the venues\
      \ PA system and play live through the computer.\n<DIV align=center><IMG align=baseline alt=\"\" border=0 hspace=0 src=\"\
      http://www.gizmag.co.uk/picture.php?s=29&p=5124_10206120515.jpg\"></DIV>\n<DIV align=center><IMG align=baseline alt=\"\
      \" border=0 hspace=0 src=\"http://www.gizmag.co.uk/picture.php?s=29&p=5124_10206120500.jpg\"></DIV>\n<DIV align=center><IMG\
      \ align=baseline alt=\"\" border=0 hspace=0 src=\"http://www.gizmag.co.uk/picture.php?s=29&p=5124_10206120445.jpg\"\
      ></DIV>\n<DIV align=center><IMG align=baseline alt=\"\" border=0 hspace=0 src=\"http://www.gizmag.co.uk/picture.php?s=29&p=5124_10206120423.jpg\"\
      ></DIV>"
