  text: 'Слушаю сейчас Dwight Yoakam and Buckwheat Zydeco - Hey, Good Lookin''. хорошая, веселая штука! Вот и вспомнил, я уже как-то спрашивал:

    Кто из блюзменов исполнял эту вещь Хэнка Уильямса?

    Дело в томи что однажды я слыхал её по радио (если не ошибаюсь название передачи "В блюзовых тонах", вёл её Н.Арутюнов, конец 80-ых), была она в исполнении какого-то блюзмена. Запись старая (50-ые, 60-ые гг.)

    Я тогда и не знал что изначально это кантри песня, звучала она абсолютно по блюзовому...

    Вопрос этот занимает нас (меня и Сергея Бабаева) все эти годы.

    Тогда даже кто-то предположил что Мадди Уотерс...

    Ну, кто бы то мог быть?'
