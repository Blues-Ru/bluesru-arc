    subject: а вот из Твери сообщает Софья Воротынцева
    deleted: false
    text: '10.04.2006 Блюз в честь войск ПВО

      В минувшую пятницу в зале Военной академии воздушно-космической обороны выступал
      прославленный Первый отдельный военный показательный оркестр Министерства обороны
      Российской Федерации. Концерт был приурочен к профессиональному празднику –
      Дню войск ПВО. Кроме того, повод в академии был свой – 35-летний юбилей пятой
      кафедры. В тот день в зале были почти исключительно люди в форме – те, кто решает
      или кому лишь предстоит решать стратегические государственные задачи.

      Перед началом концерта были зачитаны телеграммы в адрес ВА ВКО, объявлены благодарности,
      вручены грамоты. А затем зазвучал главный оркестр страны. Начальник оркестра
      и его художественный руководитель – заслуженный артист России Андрей Колотушкин,
      дирижер – Сергей Дурыгин. Произведения, которые исполняли военные музыканты,
      были преисполнены проникновенной патриотки, которой, к сожалению, так не хватает
      сегодня. «Не стареют душой ветераны», вальс «Амурские волны», «Последний вальс»,
      «Эти глаза напротив», «Самара-городок» - эти и многие другие душевные песни
      исполняли в Твери заслуженная артистка Наталья Баннова, Вилль Ахметов, артистка
      театра и кино Елена Пирогова-Филиппова и всем известный полковник Юрий Рудаш.
      В подарок пятой кафедре прозвучал блюз. На сцену вышел заслуженный артист России,
      доцент Московской военной консерватории, лауреат Международного фестиваля джазовой
      и фольклорной музыки Вениамин Мясоедов, который признался, что блюз был написан
      накануне концерта на тверской сцене. Произведение так и называлось «Блюз пятой
      кафедре». На сцену на медленный танец Мясоедов пригласил журналистку «Каравана»
      Софью Воротынцеву, сидевшую в первом ряду, приняв ее за сотрудницу академии.
      А затем виртуозный музыкант удивил зал игрой на африканской дудке с экзотическим
      названием и на русской свирели. В завершение вечера на сцену были приглашены
      известные дирижеры военных оркестров страны, присутствовавшие в зале.'
