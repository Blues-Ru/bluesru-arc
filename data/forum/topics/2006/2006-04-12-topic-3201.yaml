  text: 'Дорогие Федор и Андрей,


    Скоро в Москве выступает гитарист из Чикаго Lurry Bell. Скоро - это совсем скоро,
    через неделю (19-22 апреля). Загодя фото и информация про Белла была послана вам.
    Федор прислал ответ "обязательно!" С некоторым удивлением я не могу обнаружить
    на лицевой странице этого сайта ни фотографию, ни объявление о концертах. Пару
    раз даже побеспокоил уважаемого Федора звонком, услышал в ответ, как у Жванецкого:
    "Счас, счас, счас..." Прекрасно понимаю занятость организаторов сайта. Осознаю
    также и незначительность события, о котором мы с Омаром печёмся. Особенно по сравнению
    с другими событиями, афиши которых давно висят на блюз-ру. И все же это дикость,
    друзья. По моему скромному мнению.'
