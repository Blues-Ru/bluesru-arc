    text: 'Тут по аське мне товарищ пишет:

      О Выступления мировых знаменитостей на частных закрытых вечеринках в России я знаю не по жёлтой прессе и не по наслышке,
      а из (почти) первых уст… организаторы, очевидцы и т.д.

      например (из последнего) – этим летом когда мы работали на свадьбе сына олигарха в Самаре там также были приглашены
      и бармены из Москвы… точнее один из них работает в подмосковье, где часто бывают крутые банкеты.

      так вот он на поведал, что не задолго до приезда Стинга в Моск. в рамках своего турне, он примерно за месяц, приезжал
      к ним в помосковье на корпоративку, а вернее на частную вечеринку, где Стинг в скромном составе играл для кучки русских
      олигархов

      спрашиваю: не знаешь сколько заплатили ему?

      он: не знаю сколько Стинг, но агенству заплатили 1,5 млн. долл.

      а вот английская группКа Touch & Go приезжала в Самару всего за 6 тыс. долл

      ну правда, перед этим они стабильно заезжают в Моск.

      зато Катя Лель в Самаре просит 15 штук… и лимузин к самолёту

      а в Моск она стоит не более 8

      Машина Времени стоит 50 штук, Пугачёва 80 тыс ЕВРО

      какТо мы (уже во второй раз) играли после Машины на 15 летии банка СВЯЗЬ банк

      там Машина сделал скидку, очень попросили

      отработали за 25 тыс долл

      но только 40 минут, по программе… а в итоге, всё сдвинулось,

      Макар выебнулся и сказал, не еб*т

      закончим по программе…

      и отработали минут 20

      вот так вот … эликастер …

      А Тельман, он же хозяин знаменитого ресторана ПРАГА

      про его Новый Год со звёздами, тоже давно знал…

      Черкизовский, КрокусСити, Прага … почему бы не позвать на НовГоднюю ночь мировых звёзд и выложить 3 лимона

      Написал elicaster 12.11.2006 в 17.57'
