  deleted: false
  text: 'Прошу прощения за оффтопик, но очень меня заинтересовал сей сабж.

    Я уже однажды <a href="http://elicaster.mylj.ru/7381.html">писал</a> о том что Scorpions поют с Фабрикой Звёзд. А вот
    и новый ракурс на тему "Тамошние у нас":

    То что я прочитал в Интернете меня весьма удивило. Собственно вот:


    <a href="http://www.newsru.com/cinema/27oct2006/lopes.html">На юбилей хозяина Черкизовского рынка тайно прилетала Дженнифер
    Лопес</a>

    <i>На день рождения к хозяину Черкизовского рынка Тельману Исмаилову, отпраздновавшему в четверг свое 50-летие, прилетела
    Дженнифер Лопес. Мировая звезда выступила на юбилее бизнесмена в столичном зале торжеств "Сафиса" за 1,5 млн долларов.
    Сюрприз в виде голливудской звезды Исмаилову преподнесли сыновья, пишет "Комсомольская правда".

    Поп-дива и ее супруг, певец Марк Энтони, тайно прилетели в Москву из Нью-Йорка 26 октября около 15:00, отмечает "Твой
    день".

    Как отмечает издание, певица до последнего не давала конкретного ответа, сможет она прилететь в Москву или нет. Она была
    наслышана о ситуации в России и отвергала любые предложения о визите. Даже на открытие собственного бутика год назад Лопес
    не прибыла, хотя и заверяла организаторов о своем личном присутствии. Но в этот раз все было по-другому. Близкие люди
    Тельмана Исмаилова начали переговоры с певицей задолго до его 50-летия, но завершились они только накануне дня рождения.
    Дженнифер сказала долгожданное "да" и в шесть утра по московскому времени вместе с мужем и музыкантами вылетела из Нью-Йорка.

    Говорят, одним выступлением на юбилее Исмаилова Дженнифер не ограничится: 27 октября звезду якобы ждут на открытии "Ярмарки
    миллионеров" в "Крокус-сити". Там певица исполнит четыре песни, причем заказчик уже совсем другой - крупный российский
    банк.

    Исмаилова западные звезды развлекают не впервые: в сентябре 2004-го на свадьбе его сына пел Рики Мартин, в ночь под 2005
    год для бизнесмена и его друзей выступали Робби Уильямс, Мэрайя Кэри и все тот же Мартин. Говорят, Рики заплатили за часовое
    выступление 850 тысяч долларов, а Робби и Мэрайе - по миллиону.

    Также Тельман Морданович занимался финансированием Авраама Руссо. После того как последний попал с огнестрельным ранением
    в больницу, поползли слухи, что именно Исмаилов решил припугнуть певца таким образом, чтобы вернуть долг (по слухам, 2,5
    млн долларов).</i>


    <a href="http://www.kp.ru/daily/23797.4/59169/">К хозяину Черкизовского рынка на 50-летие прилетела Дженнифер Лопес</a>

    <i>Мировая звезда в Москве на дне рождения Тельмана Исмаилова спела за $1,5 миллиона

    Как нам стало известно из достоверных источников, сыновья Исмаилова приготовили отцу сюрприз - втайне от него пригласили
    за $1,5 млн. на праздник собственно госпожу Лопес и еще одного уважаемого артиста, легенду фанк-музыки - 73-летнего (!)
    Джеймса Брауна.</i>


    <a href="http://www.kommersant.ru/doc.html?docId=719395">Группа A-ha, тигр с пантерой и взорванный милицейский автомобиль</a>

    <i>Так отметил день рождения глава "Росгосстраха" Даниил Хачатуров. В общем, всё правильно сделал!</i>


    <a href="http://www.newsru.com/cinema/10jan2006/robbie.html">Робби Уильямс спел для российского олигарха за 2 млн долларов</a>

    <i>В праздничные дни Москву по приглашению российского олигарха посетил известный певец Робби Уильямс. Его гонорар за
    концерт составил около 2 млн долларов. Также на одной из вечеринок в российской столице выступала американская певица
    Анастасия - по слухам, она заработала 800 тыс. долларов.

    Кто именно приглашал иностранных звезд, неизвестно. Однако "Комсомольская правда" предполагает, что это мог быть Роман
    Абрамович, который отмечал Рождество на Рублевке.</i>


    Вот и ещё несколько моментов мы привели <a href="http://www.beatles.ru/postman/forum_messages.asp?msg_id=12707&cpage=85">тут</a>:

    <i>- На свадьбе Алсу играли Джордж Бенсон, Эл Жеро, Рикки э Повери.

    - В Москве на частных вечеринках выступали: Рики Мартин - 900.000$, Марая Кэри - 1.000.000$, Робби Уильямс - 2.000.000$,
    Дж. Лопес - 2.000.000$, Кристина Агильера - 1.000.000$, Стинг - 1.300.000$, Анастейша (Анастасия) - 800.000$. Выступление
    Мадонны было зимой, около получаса.

    - Еще о «дачных» закрытых концертах, оказывается пару недель назад в Москве на закрытом мероприятии выступал Джеймс Браун,
    прибыл с полным составом и исполнял полную программу, информация проверенная человек узнал от персонала гостиницы по своим
    каналам подписал рад пластинок…</i>


    На корпоративные вечеринки "Серебряного дождя" в прошлом году приезжали Earth, Wind & Fire, а в этом - Лайза Минелли.


    Насколько я помню ещё ранее приезжали на такие же мероприятия и Селин Дион, и Патрисия Каас...'
