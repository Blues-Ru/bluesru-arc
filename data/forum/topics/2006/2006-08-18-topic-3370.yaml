    text: 'Странно для меня то что никакого нет скандала по этому поводу, нет разбирательства. Ведь сорван концерт по вине одной из сторон, и в этом случае другая сторона вправе требовать неустойку за невыполнение обязательств. Не то что бы я хочу увидеть крови, просто удивительно что нет ничего. иль они там всё сами меж собой тихонько хотят уладить?

      Нет, я всю-таки хочу кровищи: сорван ведь концерт не кого-то там, а Эрика Клаптона (сэр, между прочим) и Роберта Крэя (мистер, дык сказать)!!! Это не шутки (для меня)...

      Только представьте, а что будет если Мадонна не приедет??? Думаю, поднимется вой нехилый...

      Так что хачу воя по ЭК!!!

      Всё вышенаписанное, естесственно, моё IMNSHO'
