      text: '> менеджеры Эрика заявили "Клэптон должен играть там же, где играл Маккартни, а не в другом месте"

        Мне кажется, что именно так это и было. То бишь, с самого начала команда ЭК хотела именно КП.

        Что ж, плохо это иль хорошо, гордыня - не гордыня, я думаю, это не вопрос: они захотели так, а не этак (и это было условием приезда) - значит надо это выполнить. Т.е. если организатор концерта в Москве (СтарВокс) подписал договоренность что на КП, то он обязан это выполнить. Договорились на КП, не на какой-то стадион, не на концертный зал. Как говорится, договор дороже денег.

        Но, возможно, есть тут "но" и вопросы.

        Организация шоу в Москве была из рук вон плохой: - продажа билетов началась не в апр-мае (как было бы правильно, как это планировалось: см. анонс на WheresEric.com), а за месяц до шоу (шансов продать все билеты, в этом случае, много меньше чем если б начали в апреле), - менее чем за месяц до шоу отменили фан-зону, тогда когда уже туда уже были проданы билеты, более того: после отмены ф-зоны Show Trade продолжал торговать билетам в несуществующую фан-зону, перенос с КП на ВасСпуск (когда уже висели афиши с указанием КП)... Да и теперь процедура возврата денег идёт тяжело, с нервами. Об этом подробнее <a href="http://www.beatles.ru/postman/forum_messages.asp?msg_id=12707&cpage=68">тут</a>

        В этой связи возник у меня вопрос: как это менеджмент ЭК связался с левой компанией СтарВокс? Что они слепые? Не могли в России посоветоваться, провести типа опроса/выяснение что это за контора которая организовывает (цитата с их  на сайта): Семейные корпоративные праздники. Загородное корпоративное мероприятие. Юбилей, День Рождения. Оганизация празднования 8-го Марта. салют из живых тропических бабочек. Детский праздник. Организация свадеб. Более полный список их героического пути <a href="http://www.beatles.ru/postman/forum_messages.asp?msg_id=12707&cpage=17">здесь (см. сообщение SergeK)</a>

        Теперь этого на их сайте не увидишь, на днях они сменили страничку сайта: сами посмотрите: www.starvox.ru и www.starvox.info

        Обсуждение что СтарВокс левая контора шло на вышеприведенном форуме уже давно: по сути дела, с того момента как стало известно КТО является организатором (весьма странно что это стало известно менее чем за полтора месяца до начала).

        Если информация о СтарВокс была доступна простым участникам вышеприведенного форум, то и конечно же это было доступно и менеджменту ЭК (если бы они это захотели бы узнать).

        Теперь о КП. Я так понимаю, что возможность проведения громких по звуку концертов на КП более чем призрачна. Или точнее, практически равна нулю. И кажется, что дело тут даже не в том что РПЦ (церковь) против или Митрофанов (ЛДПР)... Причина (как я думаю) в том что что-то типа архитектурного департамента мерии Москвы против этого: громкий звук наносит вред близстоящим историческим зданиям. И вот отсель возникает вопрос: А как вообще могла возникнуть договоренность между СтарВокс и командой ЭК когда сей факт, для сведующих людей, небезызвестен? В поисках ответа, я могу предположить что, <b>возможно</b>, в договоре было прописано что в случае чего место проведения может быть изменено на ВасСпуск. Почему я так предполагаю? Мне трудно поверить что организаторы могли бы пойти на откровенный обман: в то время когда все знают о проведении на КП, они вдруг всё меняют на ВС. Уж слишком это нагло, глупо и дерзко. Может быть на это у них и было основание как то прописанная в договоре такая возможность.

        Впрочем, это только лишь мои предположения. Я доровора не видел, как и все участники этого обсуждения.

        И ещё, СтарВокс обвиняет ЭК в срыве концерта. ЭК просто же говорит что "ситуация вышла из под его конторля", не обвиняет СтарВокс, не приводит контраргументы. Я думаю, что в этой ситуации строна ЭК должна максимально информировать его поклонников. В противном случае это смахивает на пренебрежение поклонников которые жаждут информации, а раз у нас, здесь, её нигде не нарыть, то ЭК мог бы и подсуетиться и пояснить нам энто дело. (не хорошось, тов. Эрик). В общем, СтВкс обвиняет ЭК, а ЭК не обвиняет СтВкс. И что я могу подумать (при отсутствии информации)??? Могу подумать, а может и на самом деле виноват ЭК?

        Опять же: это только мои предположения в силу отсутствии исчерпывающей информации.'
