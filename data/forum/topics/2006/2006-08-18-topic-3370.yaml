      text: 'Насколько мне известно, концерт Клэптона рассматривался как элемент пиара Москвы и и России. Дать согласие играть на Красной площади - это фактически пригласить человека. В контракте такого уровня обязательно прописывается площадка (замешано ведь много всего: охрана, организация для випов, нехилые спонсоры и провайдеры, которые получили свои откаты, и проч.). Следовательно, должны были быть веские причины, чтобы сменить в последнюю минуту площадку и опустить ЕС (я сейчас не говорю про его позицию и его менеджеров).  Едва ли тут последним было слово патриархов. Хотя десатники и могли внести свуою колоритную струю в организационные мероприятия :))


        Если кто-то располагает сведениями о контрактной стороне этого дела, то опять же буду весьма и весьма.'
