        text: "Оказывается я был не так далёк от истины. Вот что мне на работе показали:\n“Королева” споет с рок-принцессой \nСегодня вечером в Кремле произойдет, вероятно, один из самых впечатляющих музыкальных альянсов последнего времени: группа “Queen” выступит на церемонии MTV Russia Awards 2004 с новым солистом, зовут которого... Земфира Рамазанова. На сцене КДС главная рок-звезда России и легендарные британские музыканты исполнят две культовые композиции — “We Will Rock You” и “We Are The Champions”.\nИдея спеть с русским вокалистом возникла у Брайана Мэя и Роджера Тейлора (участники “Queen”) месяц назад, когда они приняли предложение выступить на закрытии MTVшной церемонии в Москве. Получив же записи Земфиры, музыканты не сомневались ни секунды.\nПосле смерти Фредди Меркьюри от СПИДа в ноябре 1991 года группа “Queen” так и не обрела другого солиста. Брайан Мэй, гитарист, автор большей части музыки, “второе крыло “Королевы”, как его называют западные рок-энциклопедии (первым, естественно, остается Фредди), время от времени гастролировал с “золотым репертуаром” “Queen”, ударник Роджер Тейлор занимался сольными проектами. Объединялись они под великим именем на специальных концертах и фестивалях, где в качестве приглашенных солистов с “Queen” выступали в разное время такие суперзвезды, как Джордж Майкл и Дэвид Боуи, а из представительниц женского вокала — только Энн Леннокс и Лиза Стэнсфилд.\nПрослушав месяц назад записи Земфиры, музыканты были сильно впечатлены удивительным, пронзительным вокалом девушки, который, возможно, как никакой другой соответствует музыкальным формам мировых хитов “Queen” и адекватен уровню великого рок-голоса ХХ века Фредди Меркьюри.\nСама же Земфира, погруженная нынче в работу над новым альбомом и потому не жалующая публичные появления, а особенно выступления, с огромным интересом и волнением приняла предложение спеть с “квинами”. Не каждый день ведь легенды мировой музыки делают такие ангажементы.\nДве недели “Queen” и Земфира репетировали предстоящий экспириенс по отдельности, вчера — произошла наконец их очная встреча и первая совместная репетиция в Кремле. Те, кто видел это, выходили растроганными и одухотворенными...\nВо что выльется новый дуэт мировых рок-звезд — увидим очень скоро.\nКапитолина ДЕЛОВАЯ.\nМосковский Комсомолец\nот 16.10.2004 \n\nЗемфира отказалась от премии MTV RMA-2005 \nЗемфира гневно отказалась от премии MTV RMA-2005. Напоминаем, что награду певица снискала в номинации «Лучший видеоклип», коим стал ролик на песню «Блюз». Земфира считает, что результаты премии были подтасованы, поскольку на сайте канала установлена несовершенная голосовалка. Именно поэтому Земфира недовольна победой наших поп-иузыкантов во многих номинациях. \n- Я официально отказываюсь от этой премии RMA-05 (“Видео года”). Потому что, узнав заранее (а вовсе не в день церемонии) о ее результатах, поняла, что это все фикция, - призналась рокерша в интервью «МК». - Но сделать уже ничего было нельзя, потому что я отлучилась с гастролями в другую страну. А на мою просьбу отказать мне в этой премии MTV не обратило никакого внимания. Я не ходила никогда на эти премии. И, понятно, прошлогодняя церемония MTV у меня ассоциируется исключительно с двумя парнями из всемирно известной группы (с участниками “Queen” Брайаном Мэем и Роджером Тейлором Земфира исполнила “We Are The Champions” в финале RMA-04). И мне было даже неинтересно, что там за номинации, кто там чего получает. А в этом году получается, что я сама влипла туда по самые гланды. И суть в том, что мне стыдно находиться в ряду награжденных, и я от этой премии отказываюсь."
