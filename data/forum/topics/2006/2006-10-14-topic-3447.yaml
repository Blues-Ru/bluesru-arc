  text: "Зашел на сайт www.heyjoe.org\nТам есть страничка <a href=\"http://www.heyjoe.org/perf.html\">Hey Joe Versions</a>\
    \ и на ней перечислены тыщи перепевое её.\nВот что меня удивило: обилие не то что славянских, а именно русских фамилий:\n\
    \ Morozov,  Malyugin, Sergey,  Gladkov,  Goncharov, Vladislav,  Grebentchikov, Max (2 versions),  Ivanov, Ivan & Eugene,\
    \  Ivanov Sergei,  Kobakov, Vlado,  Kozevnikov,  Kuznetsov, Alexander,  Kuznetsov, Oleg,  Leonov (2 versions),  Leontiev,\
    \ Sergey (2 versions),  Menshikov,  Mironov,  Mokretsov,  Novikov, Svyatoslav (2 versions),  Petrov, Michael (2 versions),\
    \  Mokretsov,  Samozenkov,  Stemkovsky (2 versions),  Tsygankov, Anton, \n Vera Spinarova,  Bassyrov, Alexey (more versions),\
    \  Birilov (more versions),  Burlak, Yura,  Bykov,  Chernikov (2 versions),  Dobrovolsky,  Gordeev (2 versions,  Gulevsky,\
    \ Kiselev (2 versions),  Kolobaev,  Korneev, Max,  Korneyasev,  Kornev, Mark,  Kozevnikov,  Kultyshev, Vanezzz,  Merkuriev\
    \ (2 versions),  Nickolaev,  Volgograd, Denis (2 versions),  Vorobyev (2 versions), \n\nИ даже южане присутствуют в списке:\n\
    Gulishev, Ovanes 92 versions),  Kourbanov, Amir\nПрям паразительно!"
