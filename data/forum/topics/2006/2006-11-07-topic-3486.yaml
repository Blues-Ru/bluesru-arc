    text: "это James Cotton \"100% Cotton\" (электрика) и \"deep in the blues\" (акустика). \nЧто касается погрубее - то это Jimmy Reed. Самый клевый его альбом - \"Live at Liberty Hall, Houston, TX, 1972\". Там он как раз с Джони Винтером играет. Вот это БЛЮЗИЩЕ... 4 песни по 10-15 мин. каждая. Пропитый прокуренный хриплый голос Джимми Рида, грязная его же ритм-гитара, грубейшая его же гармошка, и все это сдобрено мощными соло Винтера."
