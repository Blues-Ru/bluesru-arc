        text: 'Действительно, традиция домашнего и салонного музицирования ушла. Насчет церковных воскресных школ – не знаю (не был, не участвовал…). Однако, по-моему, это все-таки вид культовой музыки, которая сопровождает церковные обряды и более ничего.

          А «в печали, и радости» в дворянской среде исполняли, романс. А у крестьян – свои песни – обрядовые, застольные, плясовые и просто «задушевные» - да Вы и без меня знаете. Пели их совсем не обязательно участники церковных хоров – русский народ, как и любой другой – музыкален от природы.

          Романс сейчас выродился в концертную форму, что, по-моему, совершенно извратило его первоначальную идею и направленность, и слушать его со сцены стало мне лично просто невмоготу. К счастью, подлинный русский этнос (песни) сохранился, но очень ограниченно. Он, кстати, довольно хорошо сочетается с рок-сопровождением. Возможно ли это совместить с блюзом – не очень представляю. Но было бы крайне любопытно…'
