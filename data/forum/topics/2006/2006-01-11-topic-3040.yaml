  deleted: false
  text: 'Вчера в «Доме у дороги» состоялся довольно необычный эксперимент: Юрий Каверкин играл блюз в компании с балалаечником Дмитрием Калининым. Кроме Калинина и Каверкина на сцене был еще Александр Новоселов – вобщем такое струнное трио. Я, конечно с большим уважением отношусь к каждому из участников этого трио, но, по-моему, балалаечный блюз – это нонсенс. Даже густой баритон Каверкина и его свеже натертые мозоли на пальцах дела не спасали. Общий замедленный темп, эклектичные по стилю балалаечные пассажи, тихий гитарный фон (концерт был акустический) - словом, не хватало еще жалейки и пастушьих рожков, да текстов про «березовые ситцы». Вобщем не блюз получился, а «древне русская тоска».'
