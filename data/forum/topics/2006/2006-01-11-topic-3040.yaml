      text: "Так дело не в балалайке! \nМНе доводилось делать звукосниматели на различные, в том числе и экзотические инструменты. Конечно! для концерта - только подзвучка! с микрофонами работать гораздо сложнее, и далеко не все умеют это делать! А со стандартными для наших клубов \"родных\" Shure SM58 китайского производства - это совсем неразрешимая задача.\nНу так надо работать. Готов оказывать всяческое содействие в концертной озвучке всяких нетрадиционных для блюза инструментов. \nПотому как тот же Шитов со своими кларнетами - весьма органичен и в блюзе (есть запись с моего ДР, где он полемизирует с губной гармошкой). Есть Дмитрий Калинин с БЛЮЗОВОЙ балалайкой. Это ж клево как!\nНадо, просто научится их готовить (С)"
