      text: 'в фильме Deep Blues есть замечательная сцена, когда чел натягивает на дверной косяк кусок ржавой проволоки, и играет на этом слайдом (банкой из под пепси) самый настоящий блюз.

        В том то и фишка, что настоящие блюзмены начинали играть блюз на том, что было - на дверных косяках, на бочках из под авиатоплива, на расческах, да и гармошка то появилась, как удобный для ношения, простой и дешевый заменитель саксафона...

        У нас, увы - балалайка уже давно перестала быть народным инструментом.  Ее нет в каждом доме как предмета первой необходимости, ушла как и собственно необходимость музицировать за работой в поле, в конном походе или набеге, в бурлацкой ходке по берегу речки и т.п. Не стало церковных воскресных школ где УЧИЛИ хоровому пению и НЕВОЗМОЖНОСТИ жить без музыки в радости и печали, в повседневной работе и отдыхе. Сплошное общество УНИВЕРСАЛЬНЫХ потребителей - а и правда, зачем самим то напрягатся, включил музыку, пиво принесут, а то и из дома  (автомобиля) вылезать не надо. а жаль, может бы было и больше исполнителей блюза на пастушьих рожках, жалейках (а чем не блюзовый инструмент?), мандолинах и домбрах, гуслях, волынках  и гармошках.'
