    text: "Дело не столько в инструментах – действительно, талантливо можно сыграть и на двуручной пиле, и на деревянных ложках, и на глиняных горшках, и т.д.  Причем сыграть и блюз, и рок, и классическую музыку. Но при этом, по-моему, нелишне специально обратить внимание, как все это будет звучать в конкретном помещении и в сочетании с другими инструментами. Скорее всего, в переходе на Смоленской балалайка действительно звучит отлично. И в большом зале консерватории она будет хорошо слышна даже в последнем ряду 2-го амфитеатра. А вот в помещении клуба (наверное, любого) – гораздо хуже: акустика не та. Если играть на обычной балалайке или гитаре (не электро), то все-таки слышно их далее 5 метров от сцены уже плоховато – многое пропадает. Словом, для акустических концертов в клубе нужна профессиональная система микрофонов, как в хорошем концертном зале. \nЯ к тому, что если звучание не отстроено нормально, то клубный концерт, к сожалению,  превращается в некий междусобойчик – типа «сами играем, и сами же кайфуем от собственного мастерства»…"
