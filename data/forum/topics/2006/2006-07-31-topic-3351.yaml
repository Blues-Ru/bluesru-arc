      subject: А как же ещё?
      deleted: false
      text: "Ты ж человек образованный, ноты вроде знаешь, и слух вроде есть.\nБерешь компутер, программу типа Amazing Slow\
        \ Downer с сайта http://www.ronimusic.com, и вперед.\nСтавишь, например, альбом A.King \"Born Under a Bad Sign\" и\
        \ аккуратненько его весь переснимаешь. Нота в ноту не надо, а надо вот что:\nа) гармоническую сетку\nб) рисунок баса\n\
        в) рисунок ударных\nг) рисунок гитары в аккомпанименте и в соло\n\nКогда всё это сложится вместе, получится конкретное\
        \ узнаваемое произведение, а не \"колбаса\", как говорит коллега VR.\n\nСлово \"Рисунок\" относится прежде всего к\
        \ ритму, а не к нотам!\nЕсли гитарист играет правильно ритмически, то даже играя простую пентатонику, он будет слушаться\
        \ более выигрышно, чем его коллеги, у которых ритмика хромает на все 6 лап.\n \nВ 75% блюзов всего три аккорда ))\n\
        \nPS: именно они, Альберт, Би Би и Фредди. Я бы ещё добавил к этому списку T-Bone Walker'а.\n\nВчера мне было очень\
        \ неловко слушать попытку исполнить The Hunter (A.King) группой трудящихся - оказывается, доблестные джемующие это\
        \ произведение либо не слышали, либо хорошо подзабыли."
