  text: 'Я сразу и без сомнений удаляю все посты, в которых нарушаются правила, даже,
    если там написано что-то интересное. Если хотите, чтобы вас прочитали, напишите
    пост, в котором не нарушаются правила! Оба нарушили правила уже по нескольку раз,
    несмотря на первое устное предупреждение. Это второе второе предупреждение.


    Как модератору мне совершенно не интересно, кто первый начал, кто устал, и в чем
    суть спора. По-человечески я всем сочувствую, все понимаю и пр. Но я буду удалять
    любые сообщения с минимальной порцией неуважительного отношения к собеседнику.
    Если они будут продолжаться, я попрошу временно не писать на форум.'
