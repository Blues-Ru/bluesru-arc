    subject: О процедуре модерирования - все, что вы хотели знать, но боялись спросить
    deleted: false
    text: "Еще раз расскажу, как я работаю в качестве модератора:\n\n1) Беру каждый\
      \ отдельный пост, проверяю на формальное соответствие правилам. Например, есть\
      \ ли там какие-то хоть мелкие личные наезды и пр. \n2) Если есть, я его удаляю,\
      \ пишу сообщение о том, что пост удален. Если их несколько, я делаю предупреждение\
      \ автору.\n3) Если после предупреждения кто-то опять нарушает правила, я прошу\
      \ не писать сутки.\n\nСобственно и все. Спорить, взывать к справедливости, аппелировать\
      \ к моим высоким чувствам, пытаться втянуть меня в дискуссию по-существу и пр.\
      \ - абсолютно бессмысленно, честное слово, буду тупо следовать указанной процедуре.\
      \ И в этом смысле действия мои в качестве модератора абсолютно предсказуемы.\
      \ В 95% случаев можно точно знать, как я отреагирую на какой-то пост.\n\nИ в\
      \ связи с этим хочу сказать, что не надо на меня обижаться или спорить, называть\
      \ меня по имени, хе-хе. С тем же успехом можно обижаться на турникет в метро\
      \ или пытаться его убедить в том, что он как-то не так себя ведет."
