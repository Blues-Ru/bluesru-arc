  text: "Рекламный ролик для поддержки заявки Сочи на проведение зимних Олимпийских\
    \ игр 2014 года\nКампания пройдет в несколько этапов и будет ориентирована как\
    \ на российскую аудиторию, так и на мировое сообщество.\nЦель первого этапа национальной\
    \ кампании — увеличить поддержку идеи проведения зимних Олимпийских Игр-2014 в\
    \ Сочи среди россиян. Поскольку целевой аудиторией кампании явилось беспрецедентное\
    \ количество человек — по сути, все население России в возрасте от 18 лет — перед\
    \ агентством стояла задача найти универсальный формат сообщения, понятный как\
    \ молодежи, так и людям преклонных лет. Вскоре в стенах агентства родилась идея\
    \ записать гимн Заявки «Сочи-2014», которая и была реализована благодаря композитору\
    \ Николаю Арутюнову и автору текста Карену Кавалеряну. \n<a href=\"http://community.livejournal.com/advertka/5084444.html\"\
    >Далее...</a>\nтам и сам ролик есть (7,83 Mb) - я сам не качал (траффик жалко).\
    \ но кто скачает и <s>посмотрит</s> послушает - отпишите, пожалуйста, интересно\
    \ или нет."
