  text: "http://www.vai.com/News/tourdates.html\n\nСупергитарист Стив Вай (Steve Vai)\
    \ 18 марта в Москве \nмастер-класс и автограф-сессию супергитариста Стива Вая.\n\
    Steve Vai на сегодняшний день является наиболее влиятельным  музыкантом в современных\
    \ гитарных течениях.\nSteve Vai известен по работе с Frank Zappa, Alcatrazz, David\
    \ Lee Roth, Whitesnake, но все же его сольная карьера стала наиболее ярким явлением\
    \ в современной рок-культуре.\nSteve Vai владелец музыкального лэйбла \"Favored\
    \ Nations\", на котором записаны альбомы Marty Friedman, John Petrucci, Alan Holdsworth,\
    \ Frank Gambale, Eric Johnson и множества других .\nSteve Vai является лауреатом\
    \ премии Grammy. \nБеспрецендентный тур Стива Вая с мастер-классом по трем городам:\n\
    Екатеринбург - 14 марта\nКиев - 16 марта\nМосква - 18 марта \n\n(утром - автограф-сессия\
    \ в московском МузТорге, вечером - мастер-класс)\nВ Москве мастер-класс пройдет\
    \ в ДК им. Горбунова (ул. Новозаводская, 27)\nНачало в 19-00 \n\nВ этот же день\
    \ в 11-00 Стив Вай проведет бесплатную автограф-сессию в московском салоне МузТорг,\
    \ в ходе которой все желающие смогут пообщаться и сфотографироваться с великим\
    \ музыкантом.\nВнимание! Купить или забронировать билеты на мастер-класс можно\
    \ ТОЛЬКО в МузТорге! \nО наличии билетов можно узнать по телефону 741-00-00 или\
    \ непосредственно в салоне МузТорг (Краснохолмская наб. д. 3, стр. 1).\nБилеты\
    \ на мастер-класс Стива Вая уже в продаже\nhttp://www.muztorg.ru/news_arch/new?id=4272"
