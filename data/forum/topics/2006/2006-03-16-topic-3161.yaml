    text: 'Мне интересно мнение Мишуриса о приезжающих варягах. Мне интересно любое
      мнение в том случае - если оно не "общепринятое" - а люди высказывают именно
      свой взгляд. Мнение о музыкальной стороне концертов - не является "охаиванием"
      или "грызней".

      Пора давно понять. Если о человеке пишут только "хорошо" или "ничего" - то это
      уже давно труп. Если мы не будем говорить о том что хорошо, а что плохо в блюзе
      - то тот полуразложившийся субъект на нашей сцене не встанет и не побежит.

      Такова судьба музыканта и любого "публичного" человека - журналиста, промоутера.
      Если ты вышел на сцену, если привез интересующего тебя музыканта - так будь
      готов к обильному граду камней. Это - НОРМАЛЬНО. В пустой огород как известно
