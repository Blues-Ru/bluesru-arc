    \ участник Canned Heat - а до этого записывался только на клубном уровне – я не\
    \ про уровень профессионализма и талант – я про уровень известности). Я и сам\
    \ не разделяю многих положений и оценок статьи Калачева. Я и сам не понимаю как\
    \ хорошо образованного Данна можно спутать с бичом. Но абсолютно враждебной реакции\
    \ на всю статью я просто не могу понять! Ребята, вы когда и где еще видели профессиональную\
    \ журналистскую статью с положительным отношением к российскому блюзу? Вот плюнет\
    \ Калачев на нашу возню – и прав будет. Потому что можно всю жизнь рассказывать\
    \ о блюзе, не упоминая московские потуги – и ничего, по сути, не пропустить...\n\
    \ \n2.\tЗахотел Федор поделиться музыкой, которая ему нравится... бабки на это\
    \ выложил трудовые, а не с неба свалившиеся... время и сил сколько потрачено?..\
    \ а какова реакция? Опять-таки, я не в восторге от вчерашнего концерта, но, блин,\
    \ воевать и обвинять?!.. Федор, как персона, имеет полное право пропагандировать\
    \ то, что ему нравится, и так, как он может. Если он, как модератор, закроет на\
    \ блюз-ру все стили, кроме норвежского, тогда мы с ним и схлестнемся не по-детски.\
    \ А сейчас?  Казанцев пишет обо всех дисках, которых ему захочется. И вы, г-н\
    \ Мишурис, имеете полное право писать о тех музыкантах, о которых вы считаете\
    \ необходимым поведать миру. Это можно сделать в общем списке, а можно открыть\
    \ раздел «блюз от Мишуриса» - как угодно. Миша, хочешь – делай. Не делаешь – не\
    \ обвиняй тех, кто делает, что они тебе что-то навязывают. И вылезший, как черт\
    \ из табакерки, пескарь, не бывавший на «норвежских концертах» - бляха... «я пастернака\
