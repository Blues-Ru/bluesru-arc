    text: "Многое здесь похоже на правду, но это не вся правда!!!\nДоподлинно известно что настоящее имя Чака Берри было Чары Бердыев-\n(впоследствии имя изменили на американский манер).\nродился он в маленьком туркменском поселке Битли в центре Каракумов\n(позднее Beatles увековечили его в своем названии, причем Леннон изменил одну\nбукву - как обычно, захотелось выделиться хоть чем то)\nЕще в детстве мальчик отличался искусством игры на 6-string дутаре из саксаула\nсобственной конструкции, был черен,горласт и пел дестаны собственного сочинения.\nСлава об одаренном мальчугане быстро разнеслась по округе и по миру.\nПотом было знакомство с Гайдаром (Хайдар Аркач), который тоже родом из этих\nмест.Прозвище маленького Чарышки,\"чак-чак\"как любя называли его земляки и легло\nв название книги Хайдар-ага в слегка измененном виде. \nЭто уже потом было знакомство с Берией и первые закрытые кремлевские концерты\nгде малыш ублажал тирана и его малолетних любовниц поневоле (вспомните Sweet\nlittle 16) своей музыкой."
