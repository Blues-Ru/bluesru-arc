        text: 'случайно стер первую букву: "б" (нуджно было пробелы между строчками убрать - перестарался, оказывается)

          а статья без подписи - просто от инф-агенства.

          если интересно, что там дальше, то вот... тоже есть перлы, но уже не такие искрометные:

          И голос каждый

          раз звучит по-разному>. Мина Агосси - француженка с огромным семейством в

          Бенине (по отцовской линии) и широким размахом музыкальных ориентиров: с

          ходу называет Марию Калласс, The Roots и Хендрикса. Ей всегда нравился

          славянский тип страстности - настолько, что в детстве она мечтала выучить

          русский. К несчастью, в Нигере, Кот-д>Ивуаре и Марокко, где она росла, ей

          русских школ не попалось, и только уже во взрослом возрасте она купила себе

          какой-то самоучитель. Впрочем, надеяться, что это к чему-то приведет, можно

          едва ли - величайшим грехом Агосси признает за собой ужасное нетерпение. Она

          все делает быстро - один из альбомов, к примеру, записала в Бруклине за

          полтора дня (у нее четыре сольных диска, первый из которых был выпущен в

          1997 году, а три других кучно выстрелили после некоторого перерыва в

          2001-2003-м). Усидчивость не ее конек, зато и схватывает все на лету:

          интерес к традиционной музыке разных стран, как и маршруты Мининых

          путешествий, отпечатаны в ее пении черным по белому. Еще слышны такие черты:

          семижильный оптимизм, открытый ум и исправное чувство вкуса. Не остается

          сомнений, что трио Мины Агосси (Реми Шодань (контрабас), Иширо Оноэ

          (ударные) представит нам оригинальный портрет джазовой Франции. Кстати, на

          сцену в этот вечер собирается выйти и джаз-оркестр филармонии под

          управлением Валерия Мурзова, а это уже грозит настоящим джем- сейшном! Заказ

          билетов по тел. 222- 600.'
