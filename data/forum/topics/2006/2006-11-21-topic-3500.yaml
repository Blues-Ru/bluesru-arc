      deleted: false
      text: 'Был я в Питере. Вот вернулся. Долго искал в интернете что-нибудь блюзовое. В итоге нашел Contrast Blues Band
        в клубе Jazz@Френия.

        Сходил. Первое впечатление было просто ужасное. Начали ребята с того, что заиграли какую-то ресторанную фоновую музыку,
        называя ее Карлосом Сантаной. Из предварительного разговора с ними я понял, что они стараются угодить публике и репертуар
        выбирают исходя из нее... Судя по выбору первой композиции, в большинстве случаев публика не оставляет желать лучшего
        в плане блюзовости.

        Однако ж потом, музыканты всё же заиграли таки блюз, причем очень даже неплохо...

        Общее впечатление почему-то грустное. Надеюсь, что я всё-таки попал не в то место и где-то в Питере есть блюза и получще
        и побольше и повостребованнее.. ибо если это он и был, то грустно..'
