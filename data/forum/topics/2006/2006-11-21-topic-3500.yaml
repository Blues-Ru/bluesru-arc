    text: "Клубы типа ДуДа - явление у нас уникальное, выбирать не приходится. В Питере дело плохо, блюзовых клубов практически\
      \ нет, есть пара-тройка околоблюзых групп, хороших мало и т.д. На концертах денег музыкантам почти не платят, публика\
      \ не ходит. Расписание было на блюз.ру, но потом вымерло, ибо его перестал апдейтить питерский энтузиаст, и апдейтить-то\
      \ было нечего, практически.\n\nЕсли я ошибаюсь, буду рад услышать возражения с указанием полезных и точных фактов! \n\
      \nP.S. Кстати, такой вопрос от посетителя блюзового форума - вполне показателен. ;)) Если идея сходить на блюзовый концерт\
      \ возникла только через несколько месяцев, то горе питерскому блюзовому шоу-бизнесу. Кто ж тогда на эти концерты-то\
      \ ходил бы, если бы они были??"
