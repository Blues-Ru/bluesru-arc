    subject: День второй
    deleted: false
    text: "Мне тоже понравился вчерашний концерт. Звук был не ахти (что еще можно ожидать от ангара), но походив по залу можно было найти места с вполне сносным звуком. Зал большой и вместил всех желающих.\nНе было очередей за пивом и в туалеты (как на прошлогоднем).\nИз музыкантов- это конечно Праймер, он зажигал и было видно что человек играет и поет с большим желанием. Зора побаловала нас сильным вокалом, таким сильным, что иногда не было слышно других музыкантов (но это не ее вина). Сил добавил в блюзовый концерт звуки фанка и соула. Еще очень понравились сессионные музыканты...про технику и говорить нечего, а какие голоса....\nБыли там замечены Михаил Мишурис, Джон (Мuddy Lives), Андрей Евдокимов, Гия и масса приятных людей, которых уже не первый год встречаешь на Эффесовских фестивалях \nТак что полный позитив и советую посетить эти концерты."
