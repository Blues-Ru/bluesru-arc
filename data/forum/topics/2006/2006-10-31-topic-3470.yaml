      deleted: false
      text: 'как можно судить о звуке, если не дотерпеть до концерта....

        ну да не важно! Главное! Звук отстроили!!! Стало слышно не только вокал, но даже духовую секцию у Джонсона!!! :))))

        Конечно, аппаратурка всё равно не фонтан, да и акустика зала так себе, но слушать можно и нужно. Для формата фестиваля - всё вполне очень.

        Вчера музыканты поменялись местами: сначала была Зора, потом Праймер, потом Джонсон. Ну еще Маргулис в этот раз доехал и вёл действо. :) И надо сказать, вчера исполнители "жгли" еще "отжигательней" чем в первый день.

        Вопреки словам прошлого оратора хочу сказать, что это, возможно не лучший, но один из лучших Эфесов (могу судить только по 6 последним).

        Мне хэдлайнером, как в первый, так и во второй день показался Праймер. Все хороши, но вот всё же он почему-то поярче.. хотя как раз у него меньше всего пафоса. Как пример, и Зора и Джонсон специально готовят эффектное появление на сцене, а Праймер спокойно выходит со всеми музыкантами на сцену и еще до своего представления стоит спиной к залу и спокойно настраивается... :)'
