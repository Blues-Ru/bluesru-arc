    text: Вы меня простите, но это самый отстойный эфес из четырех последних, на которых мне довелось побывать. Лажа со звуком (а также с залом, вентиляцией и мочеподобным пивом) - это еще мягко сказано. И тут никакая энергетика исполнителей не поможет. Но 500 рублей это точно стоит, хотя я до конца не дотерпел, чего до этого не было со мной ни на одном концерте (даже халявных).
