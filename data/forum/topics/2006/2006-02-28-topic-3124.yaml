      text: 'Полностью согласен, что Southern soul имеет более прямые блюзовые корни.
        Это, как я же писал, видно по звучанию выпускаемых пластинок. У этих артистов
        даже припевы-хуки строятся по определенной форме, как правило. Реплика солиста
        и тут же короткий (обычно женский) бэкграунд. Я говорю об альбомах 1995-х-2000-х
        годов. + классический ритм-энд-блюзовый размер в ритме.

        Интересно почему все эти деревенские ребята из Алабамы, Теннеси и Луизианы
        тяготеют имено к блюзу/ритм-энд-блюзу... Там же тоже госпел на юге поют.,
        а его вокальные приемы они практически не используют.. По сравнению с коммерческим
        urban их музыка может показаться немного нелепой)) Даже оформления отличаются.

        "Более открытое эмоциональное содержания" я лично вижу в различиях в смысловой
        нагрузке песен. это выражено даже в названиях. Вряд ли у каких-нибудь Boys
        2 Men могла быть песня с названием "I Got My Woman Upset" (Jeff Floyd)'
