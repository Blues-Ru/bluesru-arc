    text: '2 Федор Романенко и Dmitri Kazantsev:

      www.funky-soul.narod.ru посвящен преимущественно современному соул, во многом
      так назвываемому сегодняшнему urban "R&B", но это не самоцель, меня интересуют
      все соул музыканты котрые издаются на небольших независимых лэйблах. А по большому
      счету обозреваю там и contemporary gospel, и тот же southern (новичков последних
      лет),и примитивный new jack swing начала 90-х, во всем  этом, как правило, можно
      найти что-то интересное для себя.

      Сколько сам этой музыкой увлекаюсь, а до конца все ее тонкости и хитросплетения
      разобрать не могу, но скажу одно - Для себя я четко определил, что чем артист
      известней, тем он, обычно, менее "качественней". Неизвестность, безусловно,
      не панацея, но major лэйблы лепят из исполнителей откровенный "продукт". Думаю
      это применимо ко многим жанрам.

      2 Muddy Lives и Dmitri Kazantsev

      Спасибо,господа, за ваши разъяснения. То, что происходило с southern и nothern
      soul в 60-70-е мне, в целом, понятно. Непонятно, что происходит сейчас. Что
      там теперь с Motown? Чего они представляют? В большинстве случаев сомнительную
      "мочалку" для молодежи :) А вот тот же Southern существует по всей видимости
      и сейчас. Не поленитесь друзья найти в интернете и послушать The Love Doctor
      или, скажем, пошловатого Marvin Sease... Я так понимаю, именно эти люди делают
      то, что СЕГОДНЯ называют словом "southern soul" :-)

      А что теперь с "Филадельфией"? вот The O''Jays записали в 2004 году очередной
      альбом, на Sanctuary Records. Теперь его "территориально" никак не кфалифицируешь....


      P.S.

      2 Dmitri Kazantsev


      А кто, если не секрет, здесь Джон??? :)'
