    text: "Может быть лучше начинать с вопроса «что такое “soul”»  Правда, это слово\
      \ сейчас употребляется по-разному.  По отношению к музыке, стали пользоваться\
      \ \"soul\" в 1950-ых годах.  С этого времени по 1970-ые годы, «soul» обозначал\
      \ заимствование элементов из госпела в блюз, ритм и блюз, и джаз (слово даже\
      \ появилось впервые в джазовых кругах).  Многие из лучших певцов классического\
      \ soul перешли в R&B прямо из госпела: Sam Cooke, Aretha Franklin, Wilson Pickett,\
      \ James Brown, Lou Rawls, O.V. Wright, Johnnie Taylor, Bobby Womack, Laura Lee,\
      \ и т.д.\n\nРазделение «Northern Soul» и «Southern Soul» не очень четкое, но\
      \ относится прежде всего к главным направлениям, которые возникли в Detroit,\
      \ Chicago, New York, с одной стороны, и Memphis, Alabama, Louisiana, Georgia\
      \ с другой стороны.   Типичный Northern Soul выходил из Motown в Detroit и от\
      \ группы музыкантов вокруг Curtis Mayfield в Chicago.   Самые известные источники\
      \ классического Southern Soul: Cтудио Stax в Memphis и Fame (Muscle Shoals)\
      \ в Alabama.  В общем классический Southern Soul имеет более прямые блюзовые\
      \ корни, и более открытое эмоциональное содержание, чем (относительно сдержанный)\
      \ северный вариант.\n\nПравильно, что большинство (но далеко не все) soul групп\
      \ относится к Northern Soul.  Ведь Doo Wop пользовался большей популярностью\
      \ на севере.  Но южные группы включают the Staple Singers, the Soul Children,\
      \ the Ovations, the Dramatics, the Emotions, Sam and Dave, the Mad Lads, Ollie\
      \ and the Nightingales, Booker T. and the MGs, the Bar-Kays, the Wallace Brothers,\
      \ the Carter Brothers.\n\nMuddy     \n\nТеперь слово “soul” употребляется в\
      \ более широком смысле.  Southern Soul – это продолжение традиций 60-ых и 70-ых\
      \ годов.  Как я написал внизу, много Американских негров сейчас называют эту\
      \ музыку просто «блюзом.»"
