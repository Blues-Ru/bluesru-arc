        text: "Интересно, что главное различие подходов Southern Soul и Northern Soul\
          \ относится не к самым певцам, а к особым группам музыкантов разных студий.\
          \  Многие певцы с юго записали диски Northern Soul, многие певцы с севера\
          \ записали диски Southern Soul, многие певцы записали и то, и другое: например\
          \ Laura Lee и Etta James много записали Northern Soul в Chicago на Chess.\
          \  Потом Chess их послал на юг в Muscle Shoals, и вышли классические альбомы\
          \ Southern Soul.  После госпела Aretha Franklin работала в Northern Soul,\
          \ пока Atlantic ее не отправила на юг, где она стала первой звездой Southern\
          \ Soul. Есть много других примеров.\n\nВ Southern Soul обычно больше чувствуются\
          \ блюзовые корни.  Но вот интересная ирония: в 1960-ых годах большинство\
          \ музыкантов (не певцов) Southern Soul  были белыми, а большинство музыкантов\
          \ (не певцов) Northern Soul были черными. \n\nMuddy"
