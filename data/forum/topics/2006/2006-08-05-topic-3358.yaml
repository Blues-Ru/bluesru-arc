                    text: 'что у большинства людей совсем плохая аппаратура. в лучшем случае неплохие полочные колонки и дешевый
                      усилок. обычно это играет от 50-60 герц, но пишут 35, конечно :)


                      просто нет смысла оставлять все это бУхание на живых записях блюза и рока. такие частоты можно оставить
                      в электронной музыке и там где есть глубокий контрабас. да и то надо сделать пометку, что не надо это
                      слушать на говённой аппаратуре и переводить файлы в мп3 и прочую хрень.


                      обычно когда я (мы) работаем в студиях, то всегда режем гитару от 100, голос от 150, бас от 50. просто
                      чтобы было прозрачно и ничего не давило. нет ничего хуже, чем когда низкий и громкий бас разрывает и
                      распирает маленькие и слабенькие колонки.


                      кстати, когда делают фоно-корректоры для винила, низ тоже срезают. это делают для того, чтобы не было
                      паразитных звуков и колебаний динамиков при плохой акустике комнаты, при дешевом усилке, при лёгкой
                      вертушке, при кривых дисках, когда пол деревянный и вибрирует (типа как у меня), когда люди пляшут,
                      когда громко слушают с басом и т.д. могу тебе всё это дома продемонстрировать. особенно херово, когда
                      колонки стоят близко у стены (даже если они супер). и совсем хреново, если у них задний фазоинвертор
                      (у меня именно так). в таком случае, надо ставить колонки на метр от стены (у меня метровая высота),
                      глушить стену или чем-то прикрывать фазоинверторы (но не затыкать). ну вот как-то так....'
