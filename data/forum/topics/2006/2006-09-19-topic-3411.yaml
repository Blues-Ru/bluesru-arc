  text: 'У Калачева написано, что в 1996 – в московском районе Беляево состоялся первый концерт - открылся «подпольный» блюзовый клуб. В течение последующих двух лет он превратится в одно из культовых мест неформального блюзового общения. Хаус-бендом в Беляево стал ансамбль блестящего профессионального харпера Романа Гегарта; в клубе, оттачивая мастерство, выступали ныне ведущие артисты жанра.


