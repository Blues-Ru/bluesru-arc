                                песен, которые тот же самый человек с этой же гитарой сделал спустя год дома на магнитофон
                                для аудитории из трех человек? А они все такие и есть. Ну на концерте хлопают между песнями...

                                В общем, есть очень широко известный коламбиевский СD-двойник "The Father of the Delta Blues:
                                The Complete 1965 Sessions", записанный в студии, и есть документовский диск "Son House at
                                Home", это домашняя запись 1969 года. Все прочие записи - концертные, и их изданных совсем
