  text: 'Понимаю что оффтопик. Но очень надо. Помогите пожалуйста, думается мне что
    здесь смогут что-то подсказать.

    Такое вот дело - заглавная страничка:

    http://realworldrecords.com/

    Далее заходим в audiowall

    http://realworldrecords.com/audiowall/center.html

    и там смотрим, например, на на второй ряд, 5-ый справа, это диск City of Love
    by Ashkhabad (записанный, кстати, при поддержке Питера Габриэля). Кликнем на него
    (на картинку) то попадём на страничку:

    http://www.realworldrecords.com/action.lasso?...t_player.html&-token.rwrID=cdrw34&-nothing

    на которой начнёт загружаться QuickTime''овский звуковой файл с расширением *.mov

    Вот этот файл Ashkhabad - City of Love - Bayaty (Instrumental) и надо выцыганить
    и сохранить в компьютере. По идее, после таковой загрузки в окне браузера Internet
    Explorer, точнее после завершения загрузки (когда мы уже можем спокойно слушать
    звуковой файл), мы должны найти этот файл в папке Temporary Internet Files которая
    находится по адресу: C:\Documents and Settings\Admin\Local Settings\Temporary
    Internet Files или здесь: C:\Documents and Settings\Admin\Local Settings\Temporary
    Internet Files\Content.IE5

    Но вот там я этот файл почему-то не нахожу. Но ведь он где-то ЕСТЬ!!! Где же он?

    Искал прямую ссылку для скачивания. Вроде бы получается две ссылки и они ДОЛЖНЫ
    работать:

    http://realworld.co.uk/media/qt3/cdrw34/cdrw34.mov

    или

    http://www.realworldrecords.com/media/qt3/cdrw34/cdrw34.mov

    но они закачивают совсем не то что нужно :-(

    Пожалуйста, помогите с этим делом разобраться.

    <img src="http://www.beatles.ru/img/f/m/13367.jpg" align="bottom">'
