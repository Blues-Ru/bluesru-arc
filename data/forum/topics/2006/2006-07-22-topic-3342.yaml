  deleted: false
  text: "Профиль от 24.07.2006 печатает статью АЛЕКСАНДРа КАРАВАЕВа \n\nМистер блюзмейстер\n\
    \n        Красная площадь. 3 августа. Эрик Клэптон.\n   Однажды  Джимми  Хендрикс\
    \ пришел в нью-йоркскую квартиру Фрэнка Заппы и  сказал  ему:  «Слышь,  Фрэнки,\
    \  у меня к тебе дело». Поскольку Джимми тогда  сильно  набрался, то тут же и\
    \ отключился на диване. Фрэнк оставил его  на  попечении  домочадцев  и ушел играть\
    \ концерт, а когда вернулся, того  уже  след простыл… С тех пор Заппа и весь музыкальный\
    \ мир мучаются вопросом:   что  же  хотел  сказать  Джимми?  Вдруг  история  рок-музыки\
    \ повернула  бы на другую колею, Заппы—Хендрикса, породив сногсшибательный коктейль\
    \  вуду-блюза  и  джазовой  электроники?  Не  случилось.  Зато мы получили умеренную\
    \ версию от сэра Эрика Клэптона.\n   Некоторые   авторитеты   говорят:  дескать,\
    \  Клэптон  звучит,  словно карамелью  по  леденцовой  доске, — с барочной пышностью,\
    \ эдакий дорогой прикид  для  жирной  элиты.  С  этим  можно бы и согласиться,\
    \ потому что тестировать  Клэптоном  музыкальную систему от $150 тыс. явно лучше,\
    \ чем Шнуром.  Знакомый  звукорежиссер, налаживая почтенным гражданам музыку в\
    \ особняках  на  Рублевке,  так  и  делает.  Клэптон  пишет не для дешевых рингтонов,\
    \  но  и  не  ради  дорогих  понтов. Все делает качественно и с сердцем.  Как\
    \  в  1965-м,  67-м  и 68-м годах, в Cream и далее везде. Он всегда  и  теперь\
    \  продолжает  играть  музыку,  рожденную  духом Дельты, наигранную  в  товарняке\
    \  где-то  между  Новым  Орлеаном  и Чикаго. Этим транспортом   частенько  пользовались\
    \  многие  хорошие  блюзмены:  кумир Клэптона  Роберт  Джонсон,  герой  той  самой\
    \  легенды  про перекресток, безлунную   ночь  и  сделку  с  дьяволом.  Джонсон\
    \  действительно  обрел известность  и  поражал  своим  блюзом  вплоть  до  1938\
    \ года, когда его отравила  женщина  из  ревности.  Сейчас  это  музыка респектабельных,\
    \ а раньше  —  неприхотливых  черных американцев времен Депрессии. Со старых фото\
    \  на  нас  смотрят бродяги, старающиеся хорошо одеться, в начищенных ботинках,\
    \   в   костюмах,   шляпах.   В  какой-то  степени  блюз  —  это американский\
    \  блатняк  из  прокуренного  клуба.  Протолкнуть  бочком  на стадионы  такую\
    \  же,  но  модернизированную  музыку  как  раз и довелось поколению Клэптона.\n\
    \   Он  играл в нескольких командах, а добился славы в составе Yardbirds, John\
    \  Mayall’s  Bluesbreakers.  В  1965  году  на  станции  Айслингтон в лондонской\
    \  подземке  появились  граффити  —  «Клэптон  —  Бог».  Автор, наверное,  преувеличил\
    \  достижения,  но что Клэптон — сэр, это точно: он стал  почетным  кавалером\
    \  ордена  Британской империи, титул вручила ему королева  в  2004  году.  Намертво\
    \  к Клэптону прицепился и его блюзовый позывной  Slowhand. Кто придумал — неизвестно.\
    \ Гитарист Yardbirds помнит эту  историю  так:  английская аудитория придумала\
    \ погонялку Клэптону за то,  что  медленно  менял струны на концертах. Сам Эрик\
    \ рассказал другую путаную  версию про речевку о быстром гитаристе с игрой слов:\
    \ «медленный хлопок  в  медленную  руку».  А  потом  другую  — игра слов на части\
    \ его фамилии  Clap  и  выражении  slow  handclap — если английские футбольные\
    \ болельщики медленно хлопают, это означает низшую степень  их расстройства.\n\
    \   Клэптон  —  не  быстрый гитарист, но плодовитый, у него пятеро детей. Личная\
    \  жизнь  сложилась,  как положено гитаристу его уровня: от высокой романтики\
    \  до  большой  трагедии  и  печали.  Первая  жена — Патти Бойд, успешная  модель\
    \  60-х.  Благодаря  ее очарованию он записал в 1970 году Layla  And  Other  Assorted\
    \  Love  Songs.  Но  Патти  вышла замуж за его близкого  друга  Джорджа  Харрисона.\
    \ А затем разводится с Харрисоном и в 1979-м  возвращается  к  Эрику,  а потом\
    \ вновь уходит. Все любили Патти. Года  три назад Эрик еще раз женился и родил\
    \ еще трех дочерей. Сейчас он счастлив,  но  в  начале  90-х его постигла трагедия\
    \ — сын выпал из окна нью-йоркской  квартиры.  Клэптон  пишет печальную песню\
    \ Tears in Heaven, она становится саундтреком к «Смертельному оружию-2».\n   Буквально\
    \  в то же время Клэптон оказался причастным к другой утрате. Легендарный  техасский\
    \  гитарист  Стив  Рей  Вон  после  концерта,  чтоб быстрей  добраться  до аэропорта,\
    \ сел в личный вертолет Клэптона. Машина разбилась.\n   Клэптон  и  без  этих\
    \  переживаний вел нездоровый образ жизни. Добрый человек   Фил   Коллинз   не\
    \   раз  вытаскивал  Эрика  из  наркотиков  и алкоголизма.   Зато  сейчас  Клэптон\
    \  владеет  шикарным  диспансером  на Карибах,  где  кроме  элитных  ребят  могут\
    \  лечиться  и  простые парни. Профилакторий содержится в числе прочего за счет\
    \ аукционов его гитар.\n   Клэптоновская  музыка, да и весь современный блюз —\
    \ совсем не новый и ожидаемый  музыкальный  процесс.  Он  на  том  уровне,  когда\
    \ ему некуда развиваться,  но  его спасают некоторая самоирония и эклектика, делающие\
    \ неизбежные  повторы  от альбома к альбому не столь невыносимыми. Клэптон хорош\
    \  уже тем, что не потерял искренности. Иногда известные вещи звучат столь  неубедительно,\
    \ что, кажется, он каждый раз придумывает их заново. \nКак  говорит  русский \
    \ блюзмен доктор Аграновский: «Людей, которые могут зайти  в  магазин  и  немножко\
    \  по-другому,  чем  прочие  99%, попросить бутылку  водки  и  распрощаться  так,\
    \  чтобы  тебе в ответ улыбнулись, — единицы».  Так  же — и в блюзе. «Идет дождь,\
    \ болит голова, и одна тоска, главное,  чтобы  жизнь не стала лучше, чем она есть».\
    \ Если иначе, то это уже кантри. А зачем нам это кантри?"
