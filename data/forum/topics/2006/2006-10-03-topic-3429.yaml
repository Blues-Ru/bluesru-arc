        subject: А вот более редкий вариант!
        deleted: false
        text: 'Напрасно все думают, что это был "незапланированный джем"- ничего подобного! Это шоу готовилось и снималось
          несколько дней, и в один из дней была "репетиция" этого состава. Один из репетиционных вариантов доступен на массе
          бутлегов- вот например здесь можно послушать:

          <a href="http://www.pasportov.net/songs/yer_blues.mp3">Yer Blues</a>

          Если послушать эту запись, то можно сделать вывод, что на репетиции они играли гораздо более бодро что ли, а на
          самом шоу довольно сонно и вяло (при этом- это лучший номер из всего шоу, все остальные играли ещё более обкуренно).
          Вывод- до выхода на сцену музыканты успели как следует выпить (или "покурить"). Об этом гласят и многие рассказы
          об этом шоу- задумка была хорошая, но всё как-то не клеилось и снималось очень долго и нудно- все просто успели
          устать и "перегореть" за это время. В результате это видео в свет как и не вышло тогда, а вышло лишь в 1997 году,
          когда это уже было расчитано на ностальгирующую публику :-)))))'
