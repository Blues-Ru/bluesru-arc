  text: 'Вот что прочел в Сети:

    http://www.club.ru/spb/news/clubnews_1/zemlyane

    Супер Гала-концерт - 30 лет Землянам состоится 9 ноября в Ледовом Дворце. Организаторы - ФГУП ''Кремль'' и ПЦ ''Белые
    ночи''

    Участвуют: Bonni Tyler, Tony Martin (голос Black Sabbath), Nazareth, Ken Hensly (Urian Heep), Alan Silson, Smokie, Brian
    May, Quenn, Ronnie James Dio, Kingdome Come, Creedence Clearwater Revival, Animals & Friends, Rick Wakeman и др.

    http://www.fibo-forex.ru/pages.php?page=167&id=141278

    концертов «Землян», которые пройдут 7 ноября в Государственном Кремлевском Дворце и 11 ноября во Дворце спорта «Лужники»
    при участии мировых рок-звезд из NАZАRETH, URIAH  HEEP, DEEP PURPLE, BLACK SABBATH, RICK WAKEMAN, KINGDOM COME, BONNIE
    TYLER, GLENN HUGHES.

    Нехилый список... Ну, не теперешние герои, но всё-таки имена...

    Собственно меня вот что заинтересовало: кто из Creedence Clearwater Revival там будет???

    P.S. Странно что германо-российский коллектив Скорпионз не участвует :)))

    P.P.S. Я некоторых форумах я видел что многие плюются услышав имя Киселёва. Как я понимаю руководитель Землян (и бывший
    барабанист) ныне директор ФГУП ''Кремль''. И что он имел непосредственное отношение к афёрам(?) с организацией концертов
    Клаптона и Мадонны.

    Что, на самом деле, что он такой пих-пах?'
