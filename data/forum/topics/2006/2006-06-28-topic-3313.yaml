    text: "Агентство 7 новостей (Рязань) сообщает:\n\nВо вторник, 27 июня, в Концертном зале имени Сергея Есенина состоялось открытие выставки-ярмарки «Мода 2006. Летний блюз». Перед тем как рязанские модели вышли на подиум, появился священник Христорождественского храма Виталий Рыбаков и, окропив святой водой организаторов, предложил «помолиться Господу, дабы благое дело сие продолжалось». \n\n«С божьей помощью» дефиле состоялось: модели демонстрировали повседневные и вечерние туалеты."
