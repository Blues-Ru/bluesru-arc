    subject: а вот что интересного сообщают нам из Казахстана агентство "КонтиненТ "
    deleted: false
    text: "Хотя группе всего три года, основатели команды знают друг друга и играют вместе уже много лет: «Гагарин» была образована в 2003 году из останков двух команд – «33 Марта» и «Мессир Леонард» в лице Дениса Колючего и Тима Пип, в миру Тимура Карабаджак.\n\nСвой второй альбом участники записывали уже на собственной студии «Кома Рекордз», там же был записан и третий CD – «New York 61» из десяти песен на английском языке. Вовсе не потому, что участники «Гагарина» польстились на заморские лавры. Вся жизнь вокалиста группы Тима Пип настолько тесно переплетена с английским языком, что он стал для него вторым родным. Если два первых альбома состоят из бесшабашно драйвовых композиций с небольшими вкраплениями лирики, «New York 61» – это эксперимент и совершенно новое звучание группы. «Гагарин» пробует себя в блюзе, а сам альбом получился качественным и истинно американским. Девиз группы «Нет границам!» заметен во всем: и в негритянском звучании, и даже в оформлении альбома. После своего полета в космос Юрий Гагарин отправился в турне с миссией мира, и был везде горячо встречен, но в США его не приняли. Группа «Гагарин» на обложках своего диска помещает Юрия Гагарина на улицы Нью-Йорка. По дизайнерскому решению, сделанному Сергеем Морозовым, диск выглядит очень эффектно. \n\nМногие российские профессионалы шоу-бизнеса отмечают, что в сфере музыки казахстанцам потенциала не занимать. Возможно, когда-нибудь мы будем слушать качественно сделанную музыку местных исполнителей и гордиться этим."
