                        text: "Ай, поспешил нажать кнопка! Продолжаю тут.\n\nПравельно песадь Julie London, немного послушать можно тут: gypsy.bluesman.ru/1/Julie%20London/. \n\nКак писал на упомянутой мною ранее странице коллега Hoaxer, \"Поющие 50-е... Джулия Лондон (Julie London) была поющей актриссой, как Любовь Орлова и Мэрилин Монро и ещё много красивых женщин. Лондон не достигла особенных высот ни в кино, ни в пении, но мне она нравится. В своё время она была секс-символом Америки, или одной из таковых — это было в то время, когда вкус у американцев ещё не полностью испортился, и такие сегодняшние «красавицы», как Синди Кроуфорд с Клавой Шиффер, занимались своим прямым делом — чисткой сараев. Может быть, я несправедлив к этим двум ожившим барби, но, во всяком случае, хрен они так споют\". \nЯ бы добавил, что она была любимой женщиной знаменитого Gary Cooper'а, это уже само по себе много значит.\n\nА вообще есть много направлений женского вокала вокруг-да-около блюзовой, джазовой и софт-роковой тематики, их даже трудно все перечислить."
