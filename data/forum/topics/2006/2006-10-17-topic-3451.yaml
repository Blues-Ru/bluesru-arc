    subject: Чтобы не было конфуза, сообщи названье блюза!
    deleted: false
    text: 'Расписание открытых джемов на главной странице сайта www.blues.ru, обычно и еженедельно - среда, 20:00 (Би-Би Кинг) и воскресенье, 18:00 (Дом у дороги). Для записи желательно явиться за 15 минут до начала.


      В любом случае нам было бы интересно узнать, какой именно блюз хочет спеть девушка. Желательно, чтобы он был на английском языке и из классического блюзового репертуара. Особенно если хочет чтобы ей аккомпанировала ритм-секция .

      Если она сама себе аккомпанирует - пусть приходит со своим инструментом. Надеюсь, что это не рояль.'
