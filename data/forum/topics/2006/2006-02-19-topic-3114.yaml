    text: "Led Zeppelin взаимствовал много песен.  Ну что?  Они же выдали свои довольно оригинальные версии (в отличии от\
      \ многих более \"классических\" великобританских блюзовых групп (John Mayall, например)).  Что касается взаимствования\
      \ песен давайте тогда посмотрим на хиты B.B. King:  Three O-Clock Blues(от Lowell Fulson), \nEveryday I Have the Blues\
      \ ( через Lowell Fulson от Memphis Slim)\nMy Own Fault (через Muddy Waters от Tampa Red), Beautician Blues (от Roy Brown),\
      \ Sweet Little Angel (через Robert Nighthawk и Tampa Red от Lucille Bogan), How Blue Can You Get (от Louis Jordan),\
      \ Rock Me Baby (от Muddy Waters и многочисленных), Crying Won’t Help You (через Robert Nighthawk от Tampa Red), The\
      \ Thrill is Gone (от Roy Hawkins), и т.д.   Дело блюза обычно не в оригинальности песен."
