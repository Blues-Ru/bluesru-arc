        deleted: false
        text: "http://www.turnmeondeadman.net/Zep/Originals.html \n\nЕще как прут!\n\n\"A rather ironic note is that in recent\
          \ years a number of artists have been accused of copying Led Zeppelin. A 1988 Rolling Stone article cited numerous\
          \ examples of bands imitating Led Zeppelin's sound and style.(6) Also, with the advent of sampling, Led Zeppelin\
          \ recordings have been put to use by several artists.\" (с) \n\nРазумеется, продаваемость не определяет качество\
          \ музыки. А непродаваемость, что - определяет?\n\nЧто касается Бритни Спирс равно как и Майкла (Пед(р)о) Джексона\
          \ - примеры неудачные. \n\nМузыка Спирс и ей подобных не обладает узнаваемостью, ставка делатся скорее  на предложения\
          \ хреновенького  качества плоти, но в любом случае это обычная раскрутка, как и всяких прочих спайсгерлОВ, после\
          \ себя они ничего не оставляют и следующее поколение к ним уже не прислушивается.  \n\nДжексон же, да, пожалуй,\
          \ создал некий персональный стиль -  помимо бесконечного подтягивания на сцене собственных яиц и демонстрации белых\
          \ носков, - и, по оптимистичным прогнозам, оставит после себя кое-что - помимо сабли Коржакова, хотя мне кажется,\
          \ что публика будет эмоционально шевелиться при звуках Billie Jean до тех пор, пока не перемрет нынешнее поколение\
          \ его фанов. \n\nНо его гонорары - другого поля ягоды. Их можно сопоставлять с гонорарами рок-музыкантов не больше,\
          \ чем гонорары Аллы Борисовны с гонорарами БГ. Публика-то принципиально разная. Аудитории же LZ и тех, кого они\
          \ широко цитировали (и правомрено, и правильно!) - гораздо ближе друг к другу."
