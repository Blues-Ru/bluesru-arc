    text: "гласит: гении прокладывают дорогу, посредственности развешивают на ней дорожные знаки. С тех пор много времени\
      \ прошло, теперь стало модно развешивать повестки в суд.\n\nЭтот список гуляет по сети давно.  Какой с него навар читателям\
      \ – неясно, кроме глухого морального удовлетворения от принижения таланта. Как говорил А. Пушкин: «Толпа жадно читает\
      \ исповеди, записки, etc, потому что в подлости своей радуется унижению высокого, слабостями могущего…. Он мал, как\
      \ мы, он мерзок, как мы!» \n\nОсобую пикантность «делу о плагиате» придает то обстоятельство, что любой любитель музыки,\
      \ в том числе и тот, кто получает особое  наслаждение, в праведном копирайтном гневе попинав ЛЗ, может с первой же ноты\
      \ узнать группу - чего отнюдь нельзя сказать о некоторых источниках. \n\nВ свое время Лев Толстой клеймил позором и\
      \ нехорошими словами Шекспира, выводя его на чистую воду и всячески превознося Бена Джонсона.  Но Толстой прожил долгую\
      \ жизнь, изучил вопрос со всех сторон, писал статью о Шекспире для публикации после смерти и только друзья уговорили\
      \ его на склоне лет позволить себе выплеснуть эмоции в адрес «вороватого» Шекспира. Ну, и еще одна мелочь – Толстой\
      \ сам был гением.\n\nВообще-то, поклонники ЛЗ уже не просили разъяснить, а что, собственно, общего  у вступления Taurus\
      \ и Stairway To Heaven? Равно как и в музыке You Need Love и Whole Lotta Love? Что же до текста, то любой меломан без\
      \ труда наскребет штук 50 произведений,  про I like the way you  walk I like the way you talk.\n\nНо дело даже не в\
      \ этом. ЛЗ никогда не открещивались от блюзовых влияний. Да и трудно такое сделать, когда альбомы продаются миллионными\
      \ тиражами, а выступления не ограничены аудиторией двух-трех баров особо тонких ценителей.  Просто играли, что хотели,\
      \ и все. Но почему же «обоворованные» не стали так богаты, как ЛЗ? В статье http://www.turnmeondeadman.net/Zep/Originals.html\
      \ верно подмечено, что «многие исполнители дельта блюза боролись за кусок хлеба, а ЛЗ стали очень, очень богаты благодаря\
      \ своей музыке». А ведь дорога в суд - уж тем более в Штатах! - для желающих всегда открыта. Так в чем проблема? \n\n\
      И кстати, как там у оригинальных исполнителей со взаимствованиями? Всегда ли они так креативны и оригинальны?\n\nМожно\
      \ окрестить ЛЗ аранжировщиками. Но тогда это тот уровень аранжировки, который вполне равноценен «аранжировкам» Шекспира.\
      \ А желающие могут наслаждаться пьесами Бена Джонсона.\n\nПушкин между прочим в конце цитированной фразу писал такие\
      \ слова: «Врете, подлецы: он и мал, и мерзок – не так как вы, иначе»."
