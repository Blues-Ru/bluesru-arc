  subject: Плагиат и Led Zeppelin
  deleted: false
  text: "Тут уже не раз вспоминали о заимствованиях/плагиате ЛЗ.\nНа http://www.warr.org/zep.html приведён нехилый список\
    \ таковых. Я и не предпологал что их так много.\nNow by popular demand! A list of some of the songs Zep stole from other\
    \ artists:\n    * \"Babe I'm Gonna Leave You\" - A folk song by Anne Bredon, this was originally credited as \"traditional,\
    \ arranged by Jimmy Page,\" then \"words and music by Jimmy Page,\" and then, following legal action, \"Bredon/Page/Plant.\"\
    \n    * \"Black Mountain Side\" - uncredited version of a traditional folk tune previously recorded by Bert Jansch.\n\
    \    * \"Bring It On Home\" - the first section is an uncredited cover of the Willie Dixon tune (as performed by the imposter\
    \ Sonny Boy Williamson).\n    * \"Communication Breakdown\" - apparently derived from Eddie Cochran's \"Nervous Breakdown.\"\
    \n    * \"Custard Pie\" - uncredited cover of Bukka White's \"Shake 'Em On Down,\" with lyrics from Sleepy John Estes's\
    \ \"Drop Down Daddy.\"\n    * \"Dazed And Confused\" - uncredited cover of the Jake Holmes song (see The Above Ground\
    \ Sound Of Jake Holmes).\n    * \"Hats Off To (Roy) Harper\" - uncredited version of Bukka White's \"Shake 'Em On Down.\"\
    \n    * \"How Many More Times\" - Part one is an uncredited cover of the Howlin' Wolf song (available on numerous compilations).\
    \ Part two is an uncredited cover of Albert King's \"The Hunter.\"\n    * \"In My Time Of Dying\" - uncredited cover of\
    \ the traditional song (as heard on Bob Dylan's debut).\n    * \"The Lemon Song\" - uncredited cover of Howlin' Wolf's\
    \ \"Killing Floor\" - Wolf's publisher sued Zeppelin in the early 70s and settled out of court.\n    * \"Moby Dick\" -\
    \ written and first recorded by Sleepy John Estes under the title \"The Girl I Love,\" and later covered by Bobby Parker.\n\
    \    * \"Nobody's Fault But Mine\" - uncredited cover of the Blind Willie Johnson blues.\n    * \"Since I've Been Lovin'\
    \ You\" - lyrics are the same as Moby Grape's \"Never,\" though the music isn't similar.\n    * \"Stairway To Heaven\"\
    \ - the main guitar line is apparently from \"Taurus\" by Spirit.\n    * \"White Summer\" - uncredited cover of Davey\
    \ Graham's \"She Moved Through The Fair.\"\n    * \"Whole Lotta Love\" - lyrics are from the Willie Dixon blues \"You\
    \ Need Love.\" \nI'm not listing covers that the band credited to the actual authors (\"You Shook Me\") or the less blatant\
    \ ripoffs (the \"Superstition\" riff in \"Trampled Underfoot\"). If you have anything to add to this list, please tell\
    \ me. (DBW)"
