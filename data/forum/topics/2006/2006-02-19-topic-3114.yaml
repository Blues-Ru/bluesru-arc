                subject: Как пройти в Закрома Родины
                deleted: false
                text: "Сообщаю в очередной раз.\nЧтобы добраться до перацких архивов всей и всяческой музыки, нужно следующее:\n\
                  \n1. Скачать клиент для сетей IRC - mIRC с сайта www.mirc.com\n2. как продлить его срок действия сверх 30\
                  \ дней триал-периода - объяснять не буду ;)\n3. Из списка сетей выбрать сеть UNDERNET, коннектиться лучше\
                  \ к Undernet, Random US server\n4. Зайдя в сеть, подключиться к каналу #Mp3blues\n5. скачать файл-листы\
                  \ (командой @имя) следующих людей: @buzz, @davilo и @wldflwr - у них самые приличные коллекции. Можно и\
                  \ других, но для того, чтобы понять, кто в канале есть who, надо понаблюдать некоторое время за потоком\
                  \ сообщений. Примечание: Скачивать файл-листы не обязательно, можно пользоваться поисковой системой, см.ниже.\n\
                  6. Файл-листы читаются простым нотепадом. Часть файл-листов и старую, но вполне рабочую версию mIRC (без\
                  \ регистрации) можно скачать у меня с сайта: http://gypsy.bluesman.ru/mIRC/\n7. Для поиска в канале можно\
                  \ использовать поисковую систему, которая вызывается командой:\n/ctcp cse !cse\nУ неё очень простой интерфейс\
                  \ и есть он-лайн хелп.\nПример: \n.search Texas Flood - найти все исполнения Texas Flood у всех держателей\
                  \ архивов\nНа выходе будет строка примерно такого вида (получено прям щазз):\n<CSE> !buzz^ 07. stevie ray\
                  \ vaughan - texas flood.mp3  [8.3 MB]\n<CSE> !buzz^ willie nelson_milk cow blues - 15 texas flood (kenny\
                  \ wayne sheppard).mp3  [9.3 MB]\n\nПолученные строчки, начиная с восклицательного знака, надо скопировать\
                  \ и отправить в канал для того, чтобы скачать ЭТО.\n\n!buzz^ willie nelson_milk cow blues - 15 texas flood\
                  \ (kenny wayne sheppard).mp3  \n\nСредняя скорость скачивания - 10-50 кбайт/сек, так что надо иметь терпение.\n\
