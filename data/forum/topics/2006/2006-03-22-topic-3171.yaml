  text: 'Афиша на главной странице не читается в самом деле, поэтому, пусть с опозданием постараюсь текстом ее дополнить. Итак: 25-го числа, в эту субботу в "Акватории" (Выборгская наб., 61) состоится мини-фестиваль, скорее, большой джем, "Спокойной Ночи и друзья". Суть: четыре с лишним часа музыки, спокойники во главе процесса, около десяти (без лишней скромности - кайфовых) мызыкантов в качестве поддержки. Специальнейший гость - Александр Ляпин: гений, легенда и все такое. Много тишайшего акустического блюза, много громкого блюз-рока. Заказ билетов и любая информация в любое время - по телефону 956-9305. Билеты так же есть в театральных кассах. Нужно подойти к окошку и спросить билет в Mojo Club (это мы, организаторы), и тогда Вам продадут билет в Акваторию:) Билеты - от 200 до 700 рублей. Входные билеты можно будет купить на входе - по 200. По любым вопросам - звоните! Всем привет, спасибо Blues.ru, надеюсь, увидимся в субботу!'
