            https://en.wikipedia.org/wiki/Syreeta_Wright


            Syreeta Wright (August 3, 1946 – July 6, 2004), who recorded professionally under the single name Syreeta, was
            an American singer-songwriter, best known for her work with her ex-husband Stevie Wonder and musical artist Billy
            Preston.


            Wright was married three times. Her first marriage, to longtime collaborator Stevie Wonder, lasted 18 months,
            from 1970 to 1972, while a marriage to bassist Curtis Robertson Jr. was also short-lived. Wright briefly lived
            in Ethiopia in the mid-1970s, where she worked as a Transcendental Meditation teacher. She eventually settled
            in Los Angeles, where she lived for the rest of her life.[citation needed] Born and raised a Baptist, she converted
            to Islam following her third marriage.

            Wright died in 2004 of congestive heart failure, a side effect of chemotherapy and radiation treatments she was
            receiving for breast and bone cancer. She was buried in Inglewood Park Cemetery.'
