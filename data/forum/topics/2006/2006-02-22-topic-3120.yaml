  text: 'Был вчера в "Доме у дороги" на акустике Вадима Иващенко.

    И вдруг, вижу славные лица ...это Док с Каверкиным, а с ними большой и добродушный не...пардон афроамериканец (прям как
    Геркулес из известного романа ЖВ).

    Великолепно отыграл Вадим свою акустику и в этом ему помогали:

    Джон Сорокин,Валера Дедов,Леонид Веденеев и гитарист из "Кукурузы"

    (интересные гитарные дуэты у него с Иващенко получились).

    А потом на сцену вышел дядька Каверкин, сразу видать хорошо отдохнувший и зарядившийся положительными эмоциями....и  наш
    новый друг и так они отыграли...Я слышал гармонистов..это были в основном белые ребята, которые к нам приезжали. Но такой
    мощной и чувственной игры я здесь пока не слышал. Жаль что это был короткий сет, но он был весьма показательным - большой
    мастер этот Keith Dunn.'
