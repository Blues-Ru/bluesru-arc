    text: 'Я дам комментарии как главный ответственный. ;) Во-первых, мы не перестали делать концерты в Форте - крутейшие
      Холмстром и Пол Лэмб в ноябре-декабре играли по концерту в этом клубе. Во-вторых, мне кажется, надо осознать, что клубы
      делятся не на хорошие и плохие, а по другим критериям. Мне нравятся и Форте, и Дом у Дороги, и Би Би Кинг - по-разному.
      Вы сказали, что в ДуД накурено и слишком много народу. Другой скажет, что в Форте его меньше, что не всегда хорошо,
      все слишком дорого и чувствуешь себя не так раскованно. С другой стороны, отличный звук и условия, что слушать музыку.
      Короче, клубы, рассчитанные на разную публику и разное восприятие музыки. И мне, как "промоутеру" это нравится, ибо
      больше проблем, когда делаешь два концерта в очень похожих клубах, а публика начинает мучительно выбирать.


      На этот раз с Эйриком я подумал, что тесная, более демократичная атмосфера в чисто блюзовом кабаке лучше подойдет для
      этих концертов. Предложений у меня много, поэтому есть из чего выбирать, можно даже подумать о "концепции". Например,
      сейчас в первый раз я попробую сделать концерт в ОГИ. Там совсем другая публика, которая не привыкла к блюзу. И, я думаю,
      что если подсунуть хорошее, то эта публика будет в восторге. И, если там удастся делать регулярные блюзовые концерты,
      только здорово, ибо это расширяет потенциальную аудиторию для каждых гастролей.


      P.S. В Форте обязательно сделаем еще концерты. А в этот раз я бы посоветовал сходить в ДуД в среду, там не будет давки,
      ибо все решат придти в пятницу ;)'
