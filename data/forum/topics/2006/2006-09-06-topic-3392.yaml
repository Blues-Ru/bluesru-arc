  text: 'Вопрос ко всем форумчанам, гораздо лучше меня разбирающимся в блюз-роке.

    Один мой знакомый, в процессе нашего "пивного" разговора об SRV упомянул

    Joe Bonamassa и сказал, что сейчас этот парень, типа, rulez!. Слил с и-нета его
    концерт, и,- просто не досмотрел до конца. На последующий вопрос моего товарища
    Ну Как?, я пожал плечами и смог  сказать что " ну,парень...владеет иструментом...играет
    быстро...хорошо...чисто берет верхние ноты..что мне сейчас пока не всегда удается..."
    Может,у Вас есть более развернутые мысли, мнения по сему поводу? Может, Бонамасса--действительно--один
    из лучших представителей нового гитарного поколения и мне стоит еще раз-более
    внимательно--просмотреть его концерт?'
