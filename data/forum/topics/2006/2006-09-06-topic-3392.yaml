      Вообще юное поколение гитарных героев скорее разочаровывает, у меня уже целый\
      \ список разочарований накопился - многих прочили в новые лидеры мирового блюзового\
      \ гитаризма, ан нет - перегорают пацаны где-то на пол-пути к Олимпу.\n\nА некоторые\
