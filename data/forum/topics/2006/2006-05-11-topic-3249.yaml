            poster: Алексей Дагаев (axle)
            email: axledog@mail.ru
            subject: Учасники
            deleted: false
            text: "Ragtime, конечно сделаем предложение, если они будут в Москве\nС Мишурисом не все ясно, джем постараемся\
              \ организовать, но в виду того, что в фестивале учавствует C. Duarte, то он (джем) наверное будет гитарным.\
              \ Ну а девушки.... потом...... после фестиваля (ну или во время, если оч хоцца).\nФестиваль ограничен по времени,\
              \ наверняка будут изменения среди участников. Например, терзают меня сомнения(со-мнения) по поводу Мистер Твистер,\
              \ со Svet Boogie Band непонятно (группа зарубежная))), неясно также по поводу выступления W.Белова, давно я\
              \ его не видел, Blues Cousins с нетерпением ждут в Америке, ну и вообще мало ли что.......\nА вообще мне все\
              \ очень нравиться, чувствую знакомый мандраж, и воздух густой какой то... Все складывается. Надеюсь на ВАШУ\
              \ поддержку. Прошу всех (особенно тех, кому не нравится ИМХОприблюзованныйхардрок), что организаторы не поедут\
              \ в новые квартиры на Кутузовском на мерседесах. В первую очередь фестиваль - это праздник для всех, и усилитель,\
              \ с помощью которого мы громко можем заявить Москве о культуре и музыке которая нам всем дорога и каждое заявление\
              \ прибавляет в наши ряды молодых и талантливых \n\nВо как\n\nМаракату будет обязательно"
