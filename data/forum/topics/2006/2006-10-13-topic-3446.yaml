    text: "<i>И сразу же саундтрек фильма. Скучный, за исключением пары-тройки композиций.\nТо ж самое: выкладывал не я (ссылки сам не проверял, но говорят рабочие).\nЭльдар</i>\nCrossroads (OST) 1986г.\nMusic by Ry Cooder. Original Motion Picture Soundtrack.\nRarely have an artist and a musical project been more perfectly suited for each other than Ry Cooder and the original motion picture soundtrack to the Walter Hill film \"Crossroads\". A hounting tale of the search for blues legend Robert Johnson`s famous lost song, the authentic feel of the Crossroads soundtrack is the work of a man who has spent his life rediscovering and reinterpreting America`s lost musical tradition.\nRy Cooder`s musical credentials stretch back to the early 60`s when he was an active member of Las blues and folk communities. In 1966 he formed The Rising Sons with another renowned archivist, Taj Mahal, and later worked with Captain Beefheart on his landmark album Safe As Milk. Cooder began his own recording career in 1970 with his self titled debut album, the first in a string of acclaimed albums introducing a new generation to a wide variety of little known musical styles-from Tex-Mex to calypso to vaudevillian minstrel songs. Some of his best known LP`s include Intro the Purple Valley (1972), Paradise and Lauch (1974), Chicken Skin Music (1976), Jazz (1978) and Bop Till You Drop (1978).\nIn 1980 Cooder entered into what would prove a most fruitful creative partnership with director Walter Hill, scoring the acclaimed film \"The Long Riders\". A year later he teamed again with Hill in the gripping bayou drama \"Southern Comfort\" and then, in 1986, the film maker began work on a cinematic parable centering on a powerful, blues-driven soundtrack, Cooder was the natural choice for musical supervisor.\nThe result is Crossroads, capturing in sound the haunting imagery of Hill`s cautionary tale of ambition, temptation and redemption. Cooder enlisted a number of top-notch sessions artist and long-time friends for the \"Crossroads\" score, including keyboardist Jim Dickinson, drummer Jim Keltner, bassists Jorge Galderon and Nathan East, and backing vocalist Bobby King. Terry Evans, Willie Green. Jr., and others. Cooder himself sings and plays guitar and mandolin and among the soundtrack`s special guests are legendary blues harmonica man Sonny Terry, the multi-faceted Van Dyke Parks and \"Crossroads\" co-star Joe Seneca. Standout cuts include the Robert Johnson title track J.B. Lenoir`s \"Down in Mississippi\" and such Cooder originals as \"Feelin` Bad Blues\", \"See You In Hell, Blind Boy\" and the Terry/Cooder collaboration \"Walking Away Blues\"\n01 ry cooder - Crossroads.mp3\n02 j.b. lenoir - down in mississippi.mp3\n03 Frank Frost & Richard Holmes & Otis Taylor & John price - Cotton Needs Pickin'.mp3\n04 noah lewis - viola lee blues.mp3\n05 ry cooder - see you in hell, blind boy.mp3\n06 fred burch & donald hill - nitty gritty mississippi.mp3\n07 fred burch & donald hill - he made a woman out of me.mp3\n08 ry cooder - feelin' bad blues.mp3\n09 traditional. arr. by ry cooder - somebody's callin' my name.mp3\n10 ry cooder & joe seneca - willie brown blues.mp3\n11 sonny terry & ry cooder - walkin' away blues.mp3\nи парочка бонусных, выдранных из фильма...\n12 Blues it's when a good man is weary.mp3\n13 Blues Man vs Hell.mp3\nТак-же в архиве находятся сканы книжки от диска, правда качество слегка страдает (как никак 1986г.) и там-же лежат тексты с этих сканов. \nАрхив размером 76 Мб +5% для восстановления:\nhttp://www.filefactory.com/file/8eeb00/\nили здесь:\nhttp://rapidshare.de/files/35705073/Crossroads-Original.Motion.Picture.Soundtrack_192kbps_Rip_By-Kupr_Soft_.rar\n<DIV align=center><IMG align=baseline alt=\"\" border=0 hspace=0 src=\"http://img1.nnm.ru/imagez/gallery/doci/kup/kupr_soft-1160135372_i_3701_full.jpg\"></DIV>"
