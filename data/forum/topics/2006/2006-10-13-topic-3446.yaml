    text: "(дабы не открывать новую тему)\nПользователь с ником Dimonius рассказал ОЧЕНЬ удобный (для меня) вариант воспроизведения *.flv файлов (файлы размещенные на www.youtube.com ). Этот способ включает в себя <b>и перемотку, и увеличение размера картинки</b>.\n(правда, я не устанавливал FFDShow, т.к. у меня уже стоял K-Lite Mega Codec Pack, но всё сделал следуя инструкции - так что можно и с FFDShow, и с K-Lite Mega Codec Pack) \nНадо скачать:\n- FLV Splitter (332 Kb)\nftp://soft:soft@dimonius.homeip.net/soft/Codecs/Splitters/FLV_Splitter/Release%20Unicode/FLVSplitter.ax\n- FFDShow (4.1 Mb).\nftp://soft:soft@dimonius.homeip.net/soft/Codecs/Video/FFDshow/FFdshow-20060716-rev2546.exe\nFLV Splitter скопировать в C:\\WINDOWS\\system32 и выполнить \"пуск\" - \"выполнить\" - \"regsvr32 FLVSplitter.ax\" чтобы зарегистрировать его в системе.\nПосле установки FFDShow (или K-Lite Mega Codec Pack) зайти в опции декодера > Кодеки > \"FLV1\" и поставить там \"libavcodec\".\nВ итоге Media Player Classic, BSplayer, и даже Windows Media Player (но не Winamp) будут играть их как обычные видео файлы.\nМинус - надо поставить кодек, плюсы - все остальное. Ресайз, перемотка, возможность применять файльры из FFDShow во время проигрывания для увеличения качества проигрывания и тд и тп. Плюс в FFDShow находятся хорошие компрессоры и декомпрессооры других форматов, и прочие вкусности :)\nК сожалению сейчас изредка попадаются видео, которые FFDShow не проигрываются - проблема видимо в сплиттере. Пока новый сплиттер я не видел, но думаю, что ребята его поправят.\nКак скачивать *.flv файлы с www.youtube.com подробно написано на\n<a href=\"http://elicaster.mylj.ru/6618.html\">http://elicaster.mylj.ru/6618.html</a>"
