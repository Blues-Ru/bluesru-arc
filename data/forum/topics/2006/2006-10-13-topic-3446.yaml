    ПЕРЕКРЕСТОК / CROSSROADS (1986) [DVDrip] COLUMBIA PICTURES, США (1986; 1 ч. 36 мин.)

    Режиссер: Уолтер Хилл /Walter Hill

    В ролях: Джон Хэнкок /John Hancock/, Ралф Маккио /Ralph Macchio/, Деннис Липском /Dennis Lipscomb/, Джо Мортон /Joe Morton/, Хэрри Кэри-младший /Harry Carey, Jr./, Джо Сенека /Joe Seneca/, Джэми Гертц /Jami Gertz/, Роберт Джадд /Robert Judd/, Стив Вай /Steve Vai/

    Оператор: Джон Бэйли /John Bailey

    Сценарист: Джон Фаско /John Fusco

    Продюсер: Марк Карлинер /Mark Carliner

    Монтажер: Фримэн Дэвис /Freeman Davies

    Композитор: Рэй Кудер /Ry Cooder

    Художник: Джек Т. Коллис /Jack T. Collis

    Исполнительный продюсер: Тим Зиннеманн /Tim Zinnemann

    Кастинг: Джудит Холстра /Judith Holstra/, Марсия Росс /Marcia Ross

    Описание: Перекресток" ("Crossroads") - это фильм, который, так или иначе, стал одним из любимых или хотя бы значимых фильмов многих блюзовых музыкантов. Это история о начинающем гитаристе, талантливом ученике гитарного колледжа по классу классический гитары - Юджине Мартоун (Julliard School of Music, Eugene Martone), который жаждал постичь тайну блюза... И вот какая вышла история... Сюжет фильма: Молодой, честолюбивый гитарист (Маккио из "Парня-каратиста") находит легендарного исполнителя блюзов в гарлемской больнице и соглашается помочь ему вернуться домой в обмен на старые и утраченные песни.

    Великолепные песни Рай Кудера, который в картине сам играет на "блюз-гитаре". На "блюз гармонике" играют Сонни Терри и Джон "Дьюк" Логан. Фильм этот, великолепный сам по себе, имеет культовый успех среди музыкантов и тех, кто любит блюз и рок-н-ролл. Писать о нем бесполезно. Его надо смотреть и слушать.

    (Иванов М.)

