  deleted: false
  text: 'Просматривая на прошлой неделе мой любимый раздел "Эти дни в истории блюза.." (http://www.blues.ru/calendar/#today),
    я наткнулся на упоминание о чикагском блюзмене Andrew Brown, о котором Allmusic.com высказался весьма однозначно: "Трагически
    недозаписанный..." (Tragically under-recorded until late in his career...)


    Обратившись к упомянутым мною ранее Закромам Блюза, я обнаружил, что записи этого замечательного фронтмена практически
    отсутствуют! Тем не менее, одну запись с сорокапятки 1962-го года мне удалось разыскать, и я с удовольствием выкладываю
    её для ознакомления поченной аудитории:


    http://gypsy.bluesman.ru/1/Andrew%20Brown/


    Однако сюжет поиска записей A.Brown развивается - к делу подключился лично тов.Muddy! Я надеюсь, что чуть позже он напишет
    о результатах своих изысканий. По предварительным данным, они весьма интересны...'
