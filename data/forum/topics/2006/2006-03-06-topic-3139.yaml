    text: "Да, уважаемый господин Майор обратился ко мне по поводу единственных двух пластинок, занасанных Andrew Brown, которые\
      \ вышли в начале 80-ых годов.  Но в начале я не мог ничем нашего майора обрадовать.  Не только нет этих пластинок у\
      \ меня, но я даже их никогда не слышал.  Но не хотелось оствавлять господина майора в таком уничоженном состоянии. \
      \ Поэтому я написал продюсеру этих пластинок, великому чикагоскому блюзовому продюсеру (и совсем не плохому гитаристу)\
      \ Dick Shurman.  Dick Shurman ответил, что, к счастью, в этом же году выйдет на двух дисках Black Magic приктически\
      \ полное собрание записей Andrew Brown.  Оба диска должны будут на руках господина майора до нового года 2007!   Видите,\
      \ не все в жизни кончается печально.  \n\nMuddy"
