  text: "Чикаго потерял своего лучшего блюзового бассиста, силного вокалиста, и замечательного артиста.  Кент играл регулярно в какое-то время практически со всеми звездами чикагоского блюза, в том числе Muddy Waters, Howlin' Wolf, Little Walter, Junior Parker, и Eddie Taylor.  В последнее время он был одним из самых любимых блюзовых музыкантов Чикаго. Ему было бы 70 лет в этом году.  Rest easy, Willie. \n\nMuddy"
