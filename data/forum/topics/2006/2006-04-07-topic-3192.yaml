      - Я не хочу подвести родной Волгоград, - продолжает Наташа, - поэтому каждый
      день у меня тренировки по плаванию и стрельбе. После них хожу на танцы - на
      конкурс я готовлю номер под блюз: выйду на сцену в дорогом мужском костюме черного
      цвета, в шляпе и с тростью. Это будет очень эффектное и стильное действо - танец-страсть,
      танец-жизнь!'
