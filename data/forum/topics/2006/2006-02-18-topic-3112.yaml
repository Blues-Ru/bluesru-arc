        text: "Вот так и рождаются, \"нездоровые сенсации\". Конечно - к нам! потому\
          \ как имею и непосредственное! А журналисты - вечно все напутают. Вот кто\
          \ то написал с обкурки - ПХ фолковый фестиваль, и пошло по всем СМИ. а все\
          \ почему? просто приехали на первые 2 команды, и пропустили все остальное\
          \ (валялись где нибудь в палатке, или в речке в непотребном виде). журналисты\
          \ одним словом. Вечно все напутают.\nА вот вопрос - к сообществу. И в самом\
          \ деле - серьезный. Потому попытаюсь без обычного ерниченья.\nПХ (фестиваль\
          \ Пустые Холмы) проходит летом, в 11-14 июня, обычно в 120км от Москвы (под\
          \ Таруссой). Уже было 3 феста, на первом - было 22 команды и 450-500 человек,\
          \ на втором - 18 команд и около полутора тысяч, на третьем - 32 команды\
          \ (2 большие сцены) и порядка трех тысяч. В этом году ожидаем сильно больше,\
          \ поскольку прошлый прошел довольно позитивно (надеюсь, что не больше тысяч\
          \ 6, а то не сдюжить). \nВ кратце, по последнему - 2 сцены, хороший звук\
          \ (7кВт и 4.5 кВт) с нормальными мониторными линиями, хорошими микрофонами\
          \ и комбами, свет и все такое. Проф. видеосъемка и аудиозапись. Музыкантов\
          \ привозили, расселяли по желанию или палатки, или дома отдыха под Таруссой\
          \ (очень красивые места), или как сами захотят.\nТак вот БЛЮЗА - действительно,\
          \ крайне мало. Что меня например, не может не расстраивать. Но есть и сомнения,\
          \ по поводу блюза.\n1) А оно им надо? Блюзовая публика - в основном ленивая\
          \ и пивная-клубная. Тащится за 100 км чтобы послушать пару блюзовых клубных\
          \ команд, без девочек - официанток разносящих пиво - влом. Блюз - это для\
          \ пабов, а не для опен-эйр фестивалей.\n2) А оно Вам - надо? Фестиваль -\
          \ бесплатный. Следовательно музыкантам - не платят. (привозят, кормят и\
          \ т.п. за счет организаторов, но гонорара нет). Ехать в лес, напрягатся,\
          \ придумывать программу чтобы звучала на большой сцене (а клубный формат\
          \ - совсем не проходит) - и для чего? Чтобы несколько тысяч человек узнали\
          \ о вас? О блюзе? Купили ваши диски? да, меньше чем за штуку баксов и дорогу\
          \ то лень перейти... Да и музыканты - все же профи, за так просто не поедут.\n\
          3) Многие \"клубные\" блюзовые команды - просто даже и не звучат на такой\
          \ площадке. Легко остатся незамеченными, не произвести фурора, потерятся\
          \ в череде мощных творческих, ярких и самобытных команд исполняющих \"свою\"\
          \ музыку на основе \"своего\" фолка, родных (татарских, русских. еврейских\
          \ и т.п.) корней.\nКороче. Я бы хотел в самом деле серьезного обсуждения\
          \ этого вопроса. Нужен ли блюз \"вне\" клуба, нужно ли чтобы он был достойно\
          \ представлен например на ПХ2006 наряду с другими стилями (джаз, рок, панк,\
          \ фолк, реггей, ска, фанк и т.п.) Или  - забить и не суетится? И нам достаточно\
          \ чисто блюзовых фестов - междусобойчиков?"
