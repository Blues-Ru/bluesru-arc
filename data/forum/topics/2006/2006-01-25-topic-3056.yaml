    text: "Г-н Бирюков.\nНе написано, что он был \"пианистом и мандолинистом\" (что бы последнее слово не означало :)\nНаписано:\
      \ \"Певец, гитарист, пианист, мандолинист\". После певца, фактически, перечислены инструменты, на которых он мог играть.\
      \ Причем, в той последовательности, в какой он отдавал им предпочтение. Разумеется, он в первую голову - гитарист. Но\
      \ мог играть еще и на мандолине и фортепиано. \nБлагодарим за внимание к нашей первой странице.\nС уважением,\nРедакция"
