    deleted: false
    text: 'Давно существует этот замечательный квартет.  В "золотые годы госпела (1945-1960)," они вместе с Spirit of Memphis
      являлись самыми сильными квартетами в Мемфисе.  До сих пор поют составы Fairfield Four и Spirit of Memphis.  И очень
      хорошо поют.  Тем не менее прежде всего стоит слушать классики из 1940-ых и 1950-ых годов.  В это время главный певец
      Fairfield Four был Sam McCrary.  МсСrary - это кумир Би Би Кинга, и его главное вокальное влияние.  В Spirit of Memphis
      пела велколепная тройка: Silas Steele, Little Axe Bкoadnax, и Jet Bledsoe.  Вот это были певцы, ребята!


      Muddy'
