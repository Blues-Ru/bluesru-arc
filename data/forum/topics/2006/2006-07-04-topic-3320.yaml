  subject: Коммерсант пишет о Барбаре Хендрикс
  deleted: false
  text: "Оперная певица Барбара Хендрикс спела джаз в Москве \n\nВ Большом зале Петербургской\
    \ филармонии и в Московском концертном зале имени Чайковского с джазовой программой\
    \ в сопровождении шведского квартета под управлением саксофониста Магнуса Линдгрена\
    \ выступила всемирно известная оперная певица Барбара Хендрикс. В том, что опера\
    \ и джаз две вещи несовместные, в очередной раз убедилась ВАРЯ Ъ-ТУРОВА. \n\n\
    Многие оперные певицы то и дело позволяют себе маленькую слабость -- берутся петь\
    \ джаз. Этим грешит и Джесси Норман, и Кэтлин Бэттл, и даже Елена Образцова иногда\
    \ играет на сцене в Эллу Фицджеральд. В общем-то, как и положено чернокожей женщине,\
    \ родившейся в Арканзасе, Барбара Хендрикс джаз поет, знает и любит уже давно.\
    \ Взять хотя бы тот факт, что одной из первых ее записей была гершвиновская \"\
    Порги и Бесс\", правда, с классическим Лорином Маазелем за пультом Кливлендского\
    \ симфонического оркестра (1974). Ее джазовый дебют состоялся в 1994 году на джазовом\
    \ фестивале в Монтре, и с тех пор она регулярно выступает по миру именно с джазовыми\
    \ программами. Только в наступившем июле у нее четыре джазовых выступления в разных\
    \ краях света. \n\nЗа свою долгую карьеру помимо дюжины записанных оперных партий\
    \ и нескольких камерных концертов госпожа Хендрикс записала шесть альбомов, скажем\
    \ так, имеющих отношение к джазу: это были, в частности, спиричуэлс, изданные\
    \ на виниле, с пианистом Дмитрием Алексеевым и песни Гершвина, записанные с прошлогодними\
    \ московскими гастролерами -- сестрами-пианистками Катей и Мариэль Лабек. Но московский\
    \ концерт Барбара Хендрикс решила посвятить не душеспасительным спиричуэлс или\
    \ сладким мелодиям Гершвина, а матерому блюзу. То ли \"Summertime\" (которую она\
    \ спела только на бис в качестве подачки публике) ей уже вконец приелась, то ли\
    \ оперная дива в самом деле чувствует себя настолько уверенной в джазе, что берется\
    \ за одну из самых сложных его ветвей. \n\nВесь концерт певица старательно и безуспешно\
    \ изображала Билли Холлидей, непревзойденную исполнительницу того же репертуара.\
    \ Если в знаменитой пьесе Дюка Эллингтона \"Mood indigo\" музыканты поднапряглись\
    \ и придумали неплохой состав -- голосу аккомпанирует только контрабас, то в песнях\
    \ самой Билли Холлидей дело обстояло куда хуже. Усугубляло ситуацию то, насколько\
    \ известна эта музыка. Ее ведь или играть совсем как-нибудь по-новому, будь то\
    \ новизна концептуальная, или, скажем, эмоциональная, или уж совсем, наверное,\
    \ не играть: любая попытка сыграть эту музыку просто, так же, как ее играли и\
    \ пели великие, неизбежно превращается в подобие концерта в холле дорогой гостиницы\
    \ за полчаса до ужина. \n\nВпрочем, и это ощущение само по себе еще можно было\
    \ бы пережить, если бы не выбранный певицей репертуар. Душераздирающие в оригинале\
    \ блюзы \"Don`t explaine\", \"I love my man\", \"God bless the child\" в версии\
    \ госпожи Хендрикс звучали буржуазно, прилизанно и аккуратненько. Какой уж тут\
    \ джаз, когда певица звенит своими прекрасными до сих пор верхами ровно столько,\
    \ сколько указано в нотах, а о свободе -- смыслообразующем элементе джаза -- и\
    \ речи нет. \n\nЭто не снобизм, консерватизм или приверженность строгим жанровым\
    \ рамкам -- но академические музыканты действительно не умеют играть джаз. Это\
    \ объяснимо и понятно: классика с ее строгими и неизменными на протяжении веков\
    \ гармоническими, мелодическими и ритмическими нормами, аксиомами и законами,\
    \ воспитывающимися в любом музыканте лет эдак с пяти, попросту не позволяет по-настоящему\
    \ расслабиться. Это как разница между человеком, выучившим язык, и его носителем.\
    \ Ведь надо не играть в джаз, а разговаривать на нем. \n\n----\n\nЯ не был на\
    \ концерте. Однако отказываюсь считать джазовые баллады, о которых идет речь,\
    \ \"душераздирающими блюзами\". =)"
