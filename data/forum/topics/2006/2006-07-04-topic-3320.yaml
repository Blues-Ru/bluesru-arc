    text: "Фрагмент статьи \"Пожилые негры затмили молодых белых\" о фестивале в Монтре\
      \ (газета КоммерсантЪ Daily 05.07.2006):\n\"Первые вечера на самой крупной площадке\
      \ Montreux Jazz Festival -- Auditorium Stravinski -- были посвящены компании\
      \ Atlantic Records. Мы уже писали об открывавшем фестиваль концерте в честь\
      \ ее 83-летнего основателя Ахмета Эртегана (см. Ъ от 3 июля). Побывав на концерте\
      \ памяти его брата и компаньона Несухи Эртегана, а также на выступлениях совсем\
      \ новых артистов, БОРИС Ъ-БАРАБАНОВ задумался о смене поколений в популярной\
      \ музыке. \n\nКлассики с Atlantic Record на Montreux Jazz представили во всей\
      \ красе \"ресторанную\" сторону жанра. В отличие от \"углубленного в себя\"\
      \ исследовательского джаза, который царит поздней осенью на London Jazz Festival,\
      \ летний Монтре представил джаз как бесконечный перформанс, оправдывающий каждый\
      \ уплаченный зрителем швейцарский франк. \n\nСильно раздавшаяся вширь Чака Хан\
      \ по поручению Ареты Франклин пела \"Natural Woman\". Откуда-то из небытия возникла\
      \ мощнейшая фанк-группа 70-х Chic. Ее лидер, певец и гитарист Найл Роджерс не\
      \ сходил со сцены, кажется, целые сутки: играл свои песни и аккомпанировал Чаке\
      \ Хан в Auditorium Stravinski, потом джемовал в ночном кафе, а на следующее\
      \ утро еще и провел мастер-класс для молодых музыкантов в аккуратном зале Petit\
      \ Palais. Ансамбль бразильского пианиста Серджио Мендеса, недавно вернувшегося\
      \ на сцену с новым альбомом, представил эталонный бразильский эстрадный саунд\
      \ с примесью рэпа и, как положено, шумными карнавальными перкуссионистами. Би\
      \ Би Кинг в рамках своего прощального турне дал концерт в Auditorium Stravinski\
      \ и еще сыграл на борту пароходика, что совершал фестивальный круиз по Женевскому\
      \ озеру. \n\nДуэт басиста Стэнли Кларка и пианиста Джорджа Дюка звучал слишком\
      \ буржуазно даже для Монтре, но сдержать эмоции при звуках их версии \"Les feuilles\
      \ mortes\" было сложно, женщины как по команде заплакали. Даже только ради этого\
      \ номера стоит прийти 21 июля на концерт Кларка и Дюка в московский клуб Ikra.\
      \ Жаль, они не возьмут с собой в Россию вышедшую к ним на сцену Auditorium Stravinski\
      \ подвижную черную бабулю Рэнди Кроуфорд. \n\nВечера традиционного джаза, соула\
      \ и блюза не обошлись и без белых артистов. Пел автор-исполнитель Стив Уинвуд,\
      \ вышла к микрофону 58-летняя экс-вокалистка Fleetwood Mac Стиви Никс -- люди\
      \ важные и известные. Клоун от рэп-металла Кид Рок лез вон из кожи расшитых\
      \ золотом штанов: он \"заводил\" толпу матерными кричалками, солировал на барабанах\
      \ и скрипел диджейскими вертушками, но на фоне темнокожих музыкантов казалось,\
      \ что в жилах артистов англосаксонского происхождения течет не кровь, а какая-то\
      \ гораздо более инертная жидкость. \n\nЕдинственным, кто по большому счету имел\
      \ право петь с легендарными неграми Atlantic Records, был Роберт Плант. Этот\
      \ англичанин по-прежнему ощущает блюз почти на том же генетическом уровне. За\
      \ день до начала фестиваля заболел бывший партнер певца по группе Led Zeppelin\
      \ гитарист Джимми Пейдж. Надежды меломанов раз в кои-то веки услышать в их исполнении\
      \ \"Stairway To Heaven\" рухнули, но Роберт Плант заменил хит Led Zeppelin еще\
      \ более эксклюзивным материалом. Он вообще не касался Led Zeppelin и пел только\
      \ старые блюзы, в том числе материал Honeydrippers, первой команды экс-\"цеппелинов\"\
      \ после роспуска Led Zeppelin. Экраны давали крупные планы поросшего щетиной,\
      \ усталого лица певца, он не вытягивал половины нот, но осталось чувство стиля.\
      \ В одном из джем-сейшнов на сцену вывели престарелого Ахмета Эртегана. Найл\
      \ Роджерс называл его \"нашим папой\", Кид Рок читал рэп в его честь, черные\
      \ вокалистки в его честь особо активно двигали бедрами, и только Роберт Плант\
      \ пропел в микрофон те две необходимых ноты, задал именно тот необходимый ритм,\
      \ чтобы рекорд-магнат, явно не отличающийся идеальным слухом, смог вписаться\
      \ в ансамбль и подпеть. \n\nКомпании Atlantic Records в следующем году исполнится\
      \ 60 лет, но фестиваль Монтре смело можно расценивать как поминальную песнь.\
      \ С одной стороны, вот уже несколько десятилетий Atlantic Records со всеми своими\
      \ подразделениями является частью корпорации Warner. Объединение Warner с еще\
      \ одним рекорд-гигантом -- EMI -- вопрос времени. Возникнет альянс стоимостью\
      \ $20 млрд, рынок звукозаписи будет поделен всего лишь между тремя участниками:\
      \ Universal, SonyBMG и Warner--EMI. На этом фоне \"семейные ценности\" Atlantic\
      \ Records выглядят милыми слониками с бабушкиного комода. \n\nВ торжествах корифеев\
      \ звукозаписи в Монтре есть и еще одна грустная нота. Музыка, как известно,\
      \ стремительно перетекает на альтернативные носители, артисты осваивают альтернативные\
      \ способы дистрибуции. Винил и CD, на которых выходили альбомы классиков блюза,\
      \ один за другим переходят в разряд симпатичного утиля.\"\n\n--------\n\nЯ понимаю,\
      \ почему стебет \"МК\" - лучший способ прикрыть свою некомпетентность. но зачем\
      \ этот тон серьезной фроде бы газете \"КЪ\" - не понимаю."
