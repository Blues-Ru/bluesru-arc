      \ У него удивительное чувство ритма... он мастерски руководил музыкантами, распределял\
      \ их солирующие роли, а иногда просто выходил в зал  и пел без всякого микрофона.\n\
      Также понравились музыканты: Даниэль очень сильный гитарист,ну Омар -он выше\
      \ всех похвал и конечно еще раз спасибо за то, что привез Bob Stroger. \nОдин\
