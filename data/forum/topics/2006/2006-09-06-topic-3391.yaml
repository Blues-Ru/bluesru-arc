  text: "Я сходил в \"BB King\" на Боба Строгера...\nЯ по-хорошему шокирован- это\
    \ же чудо! Электрический чикагский блюз играется тихо, как акустика. Голос напоминает\
    \ Lightnin' Hopkins, а иногда Pinetop Perkins. И ритм, ритм... О!О!О!\nСаша Половинкин\
    \ (барабаны) весь взмок- говорит, что переучиваться с неправильной музыки на правильную\
    \ тяжело.\n\nЯ понял (впрочем, подозревал всегда)- главное в музыке- это бас.\
    \ Ну и голос человеческий, естественно.\nСчастье!!! Вот оно!!!\n\nГитаристы Омар\
    \ и Даниэль (оба аргентинцы)- выше всяких похвал. \n\nПоговорили. Выяснилось,\
    \ что мы с Бобом уже встречались в Чикаго ( он играл тогда с Отисом Рашем). Он\
    \ дивный человек- очень коммуникабельный и открытый. Называет Джеймса Уиллера-\
    \ the best и говорит, что так теперь не играют. \n6-го (ну или 7-го, ну в крайнем\
    \ случае, 8-го) всем строем в Дом У Дороги!!! Или 9-го в Jazz Town. Я постараюсь\
    \ быть везде.\n\nПосле этих стариков такого блюза больше не будет никогда."
