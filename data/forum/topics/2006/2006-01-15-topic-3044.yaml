    text: Вообще говоря, в новом году в ДуД происходят не совсем обычные концерты. Кроме Д. Казанцева с Ветераном акустику(и
      не только блюзовую) играют и будут играть всем известный Юрий Каверкин(дуэтом и полным составом), Евгений Немов в составе
      квартета Gadjes Band(чудо, а не квартет!!!!), Мишурис с Немовым и Артёмом Жульевым(без Оркестра!!!), Егор Майоров и
      Сергей Виноградов(правильно получается), Воронов с Гией и некоторые другие персонажи, а всё потому, что акустику играть
      не просто и спрятаться за электрозвучанием примочек не удаётся, честнее получается... А ещё в Доме каждое воскресенье
      с шести часов вечера джем. За вчерашний даже обидно, не правильно обещать(кто обещал - тот знает) и не прийти... Ну
      и, "молодая гвардия", вы то все где? не так уж просто удаётся поиграть с мастерами, а у нас вчера пять(!) басистов и
      ни одного гитариста.. Чудеса!
