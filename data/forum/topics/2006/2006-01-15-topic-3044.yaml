      subject: Про акустику в ДУД
      deleted: false
      text: 'Вот давно мечтал послушать дуэт г-д Воронова и Дзагнидзе... и наконец сподобился и пошел вчера в Дом... Не знаю,
        как бы это было, если бы г-н Воронов не заболел, но вряд ли бы получилось так душевно. Братья Дзагнидзе и Юрий Каверкин
        всю душу вынули, в хорошем смысле этого слова. И несмотря на почти пустой зал (вероятно, из-за морозов) и концерт
        и атмосфера были прекрасными. Музыканты даже немного забылись, увлеклись и играли почти 3 часа! правда где-то час
        из них был потрачен на систематическую настройку гитар, не вынесших такого холодного обращения. ;)))

        В общем, всем большое спасибо! :)'
