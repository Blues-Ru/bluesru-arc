    subject: Очень мощный концерт
    deleted: false
    text: 'Поразительно, 3 отделения и все на одном дыхании.

      Первое отделение Джуниор + норвеги. Джуниор играет так, что захватывает дух. Я первый раз здесь в Москве слышал такую
      игру-полутона, драйв,все очень сочно и выразительно. Великолепный музыкант!!! Второе отделение - чисто норвежское.

      Здесь я увидел каков гитарист этот Томми... Паренек то не прост, играет дай боже. Он кстати напомнил мне Бюска (манерой
      игры конечно).

      Но одно "но", ему лучше не петь...голос у него никакой.

      Пусть это делает Эрик, у него это лучше получается. Эрик опять прибавил в игре на гармошке и вчерашний концерт этому
      подтверждение.

      Билл и Алекс (ритм-секция) - эти перцы всегда на высоте "5+".

      Третье отделение Норвеги + Джуниор. Здесь Ватсон уже аккомпанировал

      норвегам. Абсолютно высший пилотаж. Почти три часа классной музыки,

      ребята - это праздник. Спасибо музыкантам, всем организаторам (Федору особенно), Юрий Ивановичу и всем всем.....'
