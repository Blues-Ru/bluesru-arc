  text: 'Такой вот интересный момент прочел о Texas Flood.

    Words and Music by Larry C. Davis and Joseph W. Scott

    In typical gentlemanly fashion, Stevie once gave $5,000.00 to Larry Davis, who was credited with writing the song. When he later learned it was written by Fenton Robinson, the guitarist in Davis''s band, he laid some cash on Fenton as well. Interestingly, Larry Davis studied guitar briefly under Albert King''s tutelage and play bass in his early bands while in St.Louis-emphasizing the historic King-Davis-Robinson connection which forms the basis on Stevie Ray''s version of "Texas Flood."

    Типичным джентльменским способом, Стиви однажды дал 5 000.00 $ Лэрри Дэвису, которому приписывается авторство песни. Когда он позже узнал, что песня была написана Фентоном Робинсоном, гитаристом в группе Дэвиса, он дал некоторую сумму наличными Фентону тоже. Примечательно что Лэрри Дэвис кратко изучал гитару под опекой Альберта Кинга и играл на басе в его ранних группах в Сент Луисе,  таким подчеркивается историческая связь Кинг-Дэвис-Робинсон, которая делает основу в версии Стиви Рея "Texas Flood."'
