  text: "Когда вчера в «Дом у дороги» вошел Сергей Рыженко, сразу вспомнился, ставший\
    \ уже классикой, питерский рок 80-х: ДДТ, «Аквариум»…  Но вчера Рыженко играл\
    \ не рок – он вместе с Александром Новоселовым  участвовал в блюзовой акустической\
    \ программе Юрия Каверкина. Наверное, не стоит вдаваться в классификацию того,\
    \ что получилось, да это и не важно, но получилось неплохо. \nПоначалу у меня\
    \ были опасения, что по звуку скрипка напрочь забьет и ту и другую гитары - поначалу\
    \ так оно и было. Но, к счастью, вскоре эта проблема была решена. Надо отдать\
    \ должное мастерству Рыженко: изящное пиццикато, замечательные сольные фрагменты\
    \ – все это придало традиционной программе Каверкина тембровую изысканность и\
    \ своеобразный шарм."
