    subject: попробую посоветовать, чтото что можно сделать :)
    deleted: false
    text: "это типа план.. вдруг такой подойдет. \n\nВедующие джемы бенд-лидеры не могут сами решить все проблемы. Они же еще и играют и поют и так далее. Они всеравно будут отвлекатся :) \n\nМожно сделать так - начиная со среды, перед каждым джемом ты просто говоришь тем кто его ведет, что они могут не пустить человека на сцену, могут его сразу согнать. И не обязаны гарантировать возможность сыграть более чем 10 или 15? музыкантам за вечер. \n\nПосле этого, наблюдаешь за процессом и буквально делаешь пометки, что было как надо, кого не согнали во время, кого не надо было пускать, кому надо было дать поиграть побольше. После джема, сформированное свое мнение передаешь Бенд-лидеру.\n\nТаким образом ты четко и единолично руководишь процессом джема, который уже ведется творческим чутьем бендлидера. Руководство и ответсвенность должны быть четкими. Тогда и бендлидер сказать может тому кто нежалетелен - извините, такой отбор - это политика клуба. \n\nТы можешь даже вести список джемующий. ОБщий.. давать его перед джемом ведущим... И следить чтобы у них было время нормально ставить список, посмотреть натех кто будет с ними играть. и так далее. \n\nВот так чтото можно сделать. как мне кажется."
