    subject: Оксане Кочубей (почитав ЖЖ)
    deleted: false
    text: "Оксана, разве ты на последнем своем джеме принимала участие? Кроме того, ваша группа стала одной из самых неорганизованных, некоторые из вас всегда опаздывают не только на саунд чек но и на концерт. Задумайся Оксана, какая твоя часть говорит что вокруг тебя кошмар, думаю, что не лучшая. Еще раз убеждаюсь, что  многие из тех людей, которые радуясь выпускали в темноту светлячков, с возрастом со злорадством начинают их давить, темнота становится для них уютней и они прячутся за собственную тень..... и стараются изо всех сил накрыть ей всех кто поменьше. До сего момента я не усматривал разницы между Оксаной и Кочубей. Оксана пришла на джем 3 года назад и была самым активным его участником. Спустя два года она провела свой собственный который был одним из лучших в Би Би Кинге. Прошло время и Кочубей говорит, что вокруг нее одни недоделки. \n\nВсе дело в собственной мягкотелости и пофигизме, многие из групп стали просто отрабатывать бабки. Нет больше искры. Старость и пожилость путают с опытом, вялость и лень с профессионализмом и вершиной мастерства. Главное энергия музыканта. Если она ограничивается напряжением мышц диафрагм, горловых связок, пальцев и т д , то о чем тогда можно говорить."
