  text: "Мы тысячу раз разговаривали на эту тему.\nОткрытый джем предполагает участие совсем незнакомых музыкантов, даже больше, их присутствие желательно, для этого ОJ задумывался. Поиск и развитие молодых музыкантов - разве это не благородная цель? Многие из тех, кто сейчас важничает и фыркает, однажды пришли к нам и скромно так попросились поиграть. Полицейские меры и дедовщина на открытых джемах приведут к тому, что вы все в своем тесном кругу и состаритесь. Новые музыканты перестанут участвовать в таком закрытом обществе джемующих. Перестанут к нам приезжать иностранцы и музыканты из регионов. Я по-прежнему думаю, что на открытых джемах может принять участие каждый (конечно тому, кому не чужда эта культура), ну хотя бы один раз, НО........\nВо всем должен быть порядок. \n(хаос - высшее проявление порядка, потому, что лучше организован)\nЕсть довольно неплохая тактика, только она совсем не используется.\nПредположим, что на цену приглашается некий Вася Блюзов, и начинает тошнотворно играть...... Почему бы ритм секции не это не прекратить на втором такте например так... Тарам пам пам пам бум..... спасибо Вася Блюзов, а теперь на сцену приглашается Юрий Каверкин...... Весело, интересно, живо, а Вася Блюзов либо тут же дешево продаст свою крутую гитару, либо пойдет домой заниматься.\nПоймите, что среда - это день, в который музыканты главные люди, они руководят процессом, я им только помогаю."
