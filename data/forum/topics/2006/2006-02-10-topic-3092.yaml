                          text: '...элементарную вещь,что есть музыканты которых надо не только слушать, но и просто СМОТРЕТЬ!!!!!!!!!!!!!!!!!!!!!!! Это было счастьем для меня лично просто увидеть Лузиану Реда, Длинного Джона Хантера,Меджик Слима,Гейтмаус Брауна,БиБи Кинга,Флойда Ли,Майкла Хилла,Джона Праймера,Джимми Смита, Рэя Чарлза (имена преднамеренно не классифицированы по заслугам) и еще ряд других, порой совсем не блюзовых "легенд". Я крайне осторожно отношусь к словам "энергетика" ,"положительный заряд" и т.д., но наверное тот кайф который любящий блюз человек испытывает от одного музыкального пространства с ними можно определять этими терминами. Да плевать (слово заменено цензурой) мне кто как выступил и кто как отработал в данный момент, в любом случае я не подсчитываю количество ошибок допущенных тем или иным, меня вполне удовлетворяет искренность их порой совсем не совершенных выступлений.....Мне так жаль,что я не видел выступления Уилера и мне совсем не жаль, что кому-то он не понравился..... Это просто счастье(прости меня Господи!!!), что Джон Ли Хукер помер не доехав до нашей Родины блюза....'
