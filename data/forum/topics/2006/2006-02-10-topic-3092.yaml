                  deleted: false
                  text: 'А нравится ли Вам музыка Roomful of Blues?


                    А что значит сверхэкспрессивная? Если гитара с жутчайшим перегрузом и гитарист её насилует изо всех сил - это сверхэкспрессивная? На мой взгляд, это не экспрессия, а что-то другое.


                    Пожалуйста, назову музыкантов. Rod Piazza, Rick Holmstrom, Ronnie Earl, Roomful of Blues, Paul Lamb, Rusty Zinn, Johnny Dyer, Buddy Guy, Junior Wells, Son House, Junior Watson, Tommy Castro, B. B. King... Направления называть не берусь - слишком плохо в них ориентируюсь.


                    Что ж, если Вам понравилось, я готов признать, что просто я с моим восприятием не понимаю именно такую музыку. Быть может. Быть может это несколько странно, потому что тот же Отис Раш мне нравится, хотя и не вызывает такого дикого восторга, как некоторые другие исполнители из Чикаго.


                    Я полностью согласен с тем, что если бы такое концерты были чаще, никто бы (я в том числе) и не подумал написать хоть слово плохое о таких концертах. Это у меня от музыкального голода. Я рассуждаю так: если уж я иду на концерт исполнителя из Чикаго, так это должно быть просто нечто невероятное по эмоциональности. Естественно, будь Уиллер отечественным исполнителем, я бы ходил на его концерты и считал бы его очень хорошим музыкантом.


                    Говоря про "пафосных неюношей" я именно отечественных исполнителей и имел ввиду. Быть может, я уже давно не видел таких уж аншлагов на их концертах, но если вспомнить, что два года тому назад Кид Андерсен играл в Москве в РнБ кафе и в Форте при практически пустых залах, встаёт вопрос - что считать хорошей посещаемостью концертов?'
