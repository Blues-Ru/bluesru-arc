            text: 'мне кажется, что у отечественной публики - другая проблема. Ведь не на "юношей с проворными пальцами" приходит посмотреть больше всего народу, а на далеко уже не юношей, но всё ещё с невнятными идеями и горой пафоса почтенных блюзменов.


