    text: 'Ватсон присоединится к Eirik Bergene / Tommy Kristiansen / Bill Troiani / Alexander Pettersen на двух концертах. Дом у Дороги в пятницу, 17-го марта. Во Владимире в воскресенье 19-го марта в Z-Club. Это будут длинные концерты - почти два отделения Eirik с Tommy и одно отделение - Jr. Watson с ритм-секцией с или без Эйрика и Томми, пока не решили. Может, будет все еще более перемешано, посмотрим.


      В субботу Ватсон будет гулять по Красной площади и пр., а мы укатим в Рязань. Если кто-то с машиной/английским/любовью к блюзу хочет потусоваться с Ватсоном с субботу - давайте обсудим.'
