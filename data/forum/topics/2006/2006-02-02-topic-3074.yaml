      text: 'Мне рассказывали историю про эту песню. Не знаю, насколько правдивую.
        Типа приходят уже такие известные Битлы к еще маленьким Роллингам, говорят:
        "Давайте мы вам песню подарим - и как раз про I wanna be your lover baby,
        i wanna be your man". Роллинги сказали: "Не, не будем мы такую фигню играть".
        А Битлы: "А вы расскажите, что это мы её вам подарили - и все будет круто".
