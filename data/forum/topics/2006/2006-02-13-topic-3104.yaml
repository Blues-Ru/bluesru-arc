      \ обучение видам красок, методам работы с ними. Профессиональным \"фишкам\"-приемам: нанесение  больших изображений\
      \ 1 в 1 на стены любого размера, на авто(используя эти приемы даже непрофессионал -владеющий лишь основами художественного\
      \ мастерства - сможет выполнять качественные аэро работы), обучение подготовке поверхности до росписи, роспись, обработке\
      \ поверхности авто после росписи, применению трафаретов (в том числе -работе с трафаретами по криволинейным поверхностям),\
      \ обучение технике classic chopper flames, применению флюоресцентных красок. Обучение предварительной подготовке эскиза\
      \ для нанесения-с использованием adobe photoshop, corel draw, а также обучение разработке эскиза \"для клиента\"-в контексте\
      \ \"как будет\"(так как клиент почти всегда хочет видеть-как будет выглядеть объект после нанесения аэрографии).Обучение\
      \ производится на моем оборудовании - аэрографы двойного действия, компрессор до 8 \nатмосфер. На \nучу -что нужно для\
      \ начала занятия аэрографией - какое оборудование, материалы. ПРАКТИКА- самый лучший способ научиться-так как теория\
      \ и практический опыт весьма далеки друг от друга......так что опыт и теория -разные вещи. \nМой телефон для контактов\
      \ в Москве: 89035192779"
