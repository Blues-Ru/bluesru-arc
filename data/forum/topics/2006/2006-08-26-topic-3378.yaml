  text: "Имеется видеозапись фестиваля в лефортово. К сожалению, видеокасеты камеры \"бетакам\" оказались пустыми (привет операторам), но есть материал, снятый второй, вспомогательной камерой (какой я предусмотрительный :-)), а так же касеты DAT, на которые писался звук с пульта. Помогите найти мастера, который мог бы грамотно свести видео и звук.  Попытался сделать сам, но чёткакто не получается пока. Выкладываю фрагмент записи фестиваля, к сожалению аудио, видео у меня получилось 4 гигабайта на 15 минут, сжать не удалось (может кто знает, как это делается?). \n\n\nКрис Дуарте (аудио записано видеокамерой)\n\nwww.filepost.ru/?act=files&id=1314919"
