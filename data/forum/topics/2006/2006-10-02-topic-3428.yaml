      deleted: false
      text: "Это впечаления очевидицы праздника...Правда,она ушла довольно быстро,даже до 12 не смогла...Но все равно любопытно...\n\
        день рождения\n«Дому у дороги» исполнилось в субботу 3 года! Праздновали, «как большие»: гости за столиками – каждому\
        \ бокал шампанского и легкая закуска. На сцене – корифеи московского блюза. Главный тост со сцены произносит Юрий\
        \ Иванович – кому же еще, как ни директору клуба! Он же, будучи при должности, одаривает подарками «за заслуги», представляет\
        \ «новеньких». \nНо, не смотря на легкий налет корпоративности, все очень по-доброму. Здесь практически всегда чувствуешь\
        \ себя «своим среди своих», и это чувство уже само по себе приятно согревает душу.\n\nА прошлый день рождения «Дома»!…\
        \ Это был веселый капустник, все завсегдатаи приходили с подарками: еще бы – в шуточном приглашении была приписка:\
        \ «кто придет без подарка – три года расстрела!». Были цветы, фотографии, книги, диски и даже домашние пироги. \n\
        В ту пору еще не играли в «Доме» воскресных джемов, поэтому тот джем в день рождения был каким-то озорным, бесшабашным.\
        \ \nГости в зале танцевали… Красавица Мириам под блюз танцевала восточные танцы, и рядом с ней таяли от восторга и\
        \ аристократичный Аграновский, и могучий Каверкин… И длился праздник всю ночь до утра…\n\nТеперь времена не те. Все\
        \ музыкальные посиделки, которые заваливают в клубе за полночь, резко прекращает приход группы милиционеров, вооруженных\
        \ автоматами… Конечно, жителей близлежащих домов понять можно, но автоматы !!!..."
