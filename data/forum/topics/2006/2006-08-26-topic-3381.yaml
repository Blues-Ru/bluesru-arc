    text: 'а не устраивать дискуссию "ученых мужей". Человек привел три конкретных примера - так что к этому близко, Дима?
      я не слишком знаком с этой темой, и сам посоветовать не решусь. Разве что Mighty Mo Rogers (только не концертный диск)
      - у него есть гармоника, художественная гитара, негритянский голос, хотя это далеко не аскетичный блюз. Зато идейности
      там  - через край. )

      И встречный воспро iLq: что значит "бескуплетный"? без вокала? тогда при чем тут "негритянский голос"? да, кстати -
      стоит поискать саундтрек к фильму "Crossroads" - "Перекресток" (только не спутать его с относительно новой комедией
      с таким же названием). В том перекрестке есть и сам Кудер, и негритянские голоса, и все прочее из перечисленного. и
      найти пластинку не трудно.

      PS - и не надо удивляться, что составители сборников со словом "блюз" в названии могут думать о блюзе все, что им заблагорассудится.'
