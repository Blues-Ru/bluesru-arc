    text: 'Dark was the night - музыка к фильму (она у него была на первом альбоме под другим названием)

      Feelin'' Bad - музыка к фильму (зарисовка)

      Кудер белый. Он играл не только блюз, слава Бобу. Если Вам нравится такая подача, то слушайте Leo Kottke (но блюзом
      это не стоит называть). Блюз - это песенка такая.


      Pete Haycock - английский рок-музыкает. При чём тут блюз, простите?


      Если Вам нравятся блюз-роковые и фолк-инструменталы, то такого очень и очень много - нужно открывать целую тему.'
