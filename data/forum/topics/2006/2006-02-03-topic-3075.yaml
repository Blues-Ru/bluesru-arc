  subject: Вчерашний концерт в ДУДе
  deleted: false
  text: "Что-то опять не заладилось у Каверкина. Вчера в ДУДе был акустический концерт с участием Андрея Шепелева. Спасибо Петровичу, который тоже вышел на сцену: он со своими инструментами заметно скрасил общее невеселое впечатление. \nА было то, что Новоселовская гитара добро и слайд-гитара Шепелева, близкие по тембру, оказались в ансамбле практически неразличимы - их было видно, но очень плохо слышно. Какое-то высокочастотное кружево висело в воздухе… Во втором отделении и вовсе Новоселов не глядя крутанул ручку пульта за спиной, и концерт превратился в сольное выступление Каверкина – все остальные сильно ушли в тень, хотя громкости и прибавилось. \nНарод в клубе, кажется, быстро устал, и вечер незаметно перетек в приятный ужин под ненавязчивый музыкальный фон, на который можно вообще не обращать внимания, а просто от души потрепаться с приятелем о том, о сем. Происходящее на сцене за весь вечер никого не заставило оторваться от заветной тарелки, чтобы послушать. Сопереживали Каверкину только несколько своих друзей - музыкантов…\nВобщем, не понимаю, что происходит. Были ведь замечательные концерты Каверкина с участием Ивана Жука (только когда он играл на клавишах, а не на гитаре), со скрипкой Сергея Рыженко. А вот балалайка Дмитрия Калинина совершенно «потерялась», точно так же, как вчера - гитара Андрея Шепелева. Дело здесь не в мастерстве Калинина и Шепелева – то, что они мастера своего дела никто не отрицает. Но даже дилетанту априори ясно, что: гитара – гитара добро – балалайка, или гитара – гитара добро – слайд гитара – сочетание темброво довольно сомнительное, когда кроме этих трех инструментов в группе более ничего нет. Что, кстати, на практике и подтвердилось. Зачем это надо было играть - не понятно. \nВозможно, дело в отсутствии у Каверкина какой-то внятной идеи, согласно которой все это организуется. Не знаю, не знаю…\nПросто хочу пожелать Юре хорошо отдохнуть в теплых краях, куда он собирается отбыть в ближайшие дни, и вернуться уже в весеннюю Москву с приятными впечатлениями и со свежими мыслями."
