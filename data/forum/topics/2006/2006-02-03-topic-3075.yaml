    text: "Думаю, внятная идея у Каверкина есть: добавить к хорошо сыгранному дуэту неожиданный инструмент в качестве «фактора неожиданности» - и посмотреть, что получится. Импровизация и есть идея таких выступлений. А что концерт на концерт не приходится – в блюзе это закон. Общий результат у каверкинских «посиделок» - положительный. Концерт с Рыженко вообще искупает штуки три «неудачных». Беру слово в кавычки, потому что мне не очень-то верится в неудачный концерт Каверкина. \nКстати, отсутствие ударных в этом ансамбле гениально решило проблему ритма, обычную для наших блюз-бэндов. Каверкин с Новоселовым - то дуэтом, то по очереди - отлично справляются с обязанностями ритм-секции!"
