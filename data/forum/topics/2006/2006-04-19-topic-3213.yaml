    text: Я вообще никогда не слышал, чтобы Старр с кем-то был в плохих отношениях. В его All Starr Band переиграло столько
      народу, что вряд ли кто-то может сравниться. С ним играли и пели Dr. John, Joe Walsh, Nils Lofgren, Jim Keltner, Todd
      Rundgren, Billy Preston, Rick Danko, Levon Helm, Zakk Starkey (его сын и тоже драммер), Peter Frampton, Mark Farner,
      Jack Bruce, Ozzy Osbourne, Steven Tyler, Carl Perkins- и много кого ещё. Со Стиви Реем вроде как нигде не играли на
      официальных записях, но вполне возможно, что по жизни дружили. Всётаки Старр наверное один из тех людей, которые умеют
      не конфликтовать.
