  text: 'На похоронах Стиви Рэй Воэна присутствовали Jeff Healey, Dr John, ZZ Top, Ringo Starr, Stevie Wonder, Jackson Browne,
    Bonnie Raitt, Buddy Guy.

    Ну, про дружбу со Стиви Уандером говорит не только клип SRV Superstition, но и их совместное исполнение этой же песни
    - есть зажигательный трек и ролик с SW, SRV, Jody Watley, Salt n''Peppa. ZZ Top тоже понятно: техасцы. Они кстати, в один
    год - 1983, приобрели мировую известность. Jeff Healey, Buddy Guy - они точно вместе играли, c Bonnie Raitt были тоже
    знакомы. Jackson Browne ему помог в самом начале в 1982-88.

    А вот Ринго... Я никогда не слахал об их дружбе и знакомстве.

    Может кто-нибудь знает об этом и сможет пояснить?'
