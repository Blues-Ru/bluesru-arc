      text: 'Для тех у кого стоит запрет на просмотр lenta.ru выкладываю текст:

        <b>Австралийская майка сделает гитаристом любого</b>

        <i>Австралийские ученые объявили о создании высокотехнологичной футболки, которая превращает бренчание пользователя на воображаемой гитаре в настоящую музыку. Это стало возможно благодаря встроенным в этот предмет одежды сенсорам движения и специальной компьютерной программе, преобразующей движения пользователя в гитарные риффы, сообщает агентство Associated Press.

        Расположенный в левой части майки сенсор отвечает за темп игры, а в правой – за аккорды, которые якобы берет пользователь. При желании компьютер можно настроить так, чтобы поменять функции левого и правого сенсоров, таким образом дав возможность почувствовать себя матерым гитаристом и левшам.

        Чудо-майка под названием WIS (wearable instrument shirt, дословно “ пригодный для ношения инструмент” - прим. Ленты.Ру) “является простым в использовании виртуальным инструментом, который позволит играть музыку людям, даже не имеющим опыта обращения с музыкальными инструментами или компьютером,” – сказал один из создателей новинки Ричард Хельмер.</i>

        Кстати, там же, ниже есть ссылка на также интересную статью:

        <b>Stewart Guitar создала раскладную электрогитару</b> - Lenta.ru, 21.06.2006

        <i>Компания Stewart Guitar создала раскладную электрогитару. Пригодная для транспортировки гитара Stow-Away, по заявлениям создателей, без ущерба для целостности инструмента и его звуковых характеристик может уместиться в небольшом чемодане, сообщает сайт Harmony Central.

        Превращение Stow-Away из гитары в компактный и пригодный для транспортировки кусок дерева и пластика происходит благодаря отстегивающемуся грифу, который крепится к специальному разъему в корпусе гитары. Для того, чтобы снять гриф, не нужно ослаблять натяжение струн - конструкция гитары позволит собрать и разобрать Stow-Away без изменения настройки инструмента.

        Гитара будет оснащена 3 звукоснимателями типа single, 22-ладовый отстегивающийся гриф Stow-Away сделан из клена с добавлением красного дерева. Стоимость Stow-Away составит от 650 до 690 долларов. </i>

        Мне больше всего здесь интересует именно то что "конструкция гитары позволит собрать и разобрать Stow-Away без изменения настройки инструмента"... Как это может быть?.. озадачен...

