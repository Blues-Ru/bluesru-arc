              text: 'там же: http://www.modernguitars.com/archives/002283.html

                Q: Your main guitar is the Fender Stratocaster and yet you’re pictured on the cover of ''Soul To Soul'' with a Gibson. Any reason why?

                SRV: Mmm, I played it on some of the...on one or two of the songs. That’s what I had with me that day, too. [Laughs.] [The Gibson] is on "Empty Arms" and, let’s see here, actually I guess that’s the only one that I left it on; I’d used it on one of the takes of "Say What!"’ but I ended up using my Stratocaster on there. So, I guess it’s just on "Empty Arms" but it’s on the rhythm part, lead part, and what sounds like a organ. <b>It’s a guitar. I play the drums on it. I play everything but bass and piano.


                Q: Are you a real drummer?

                SRV: Yeah, but I don’t get a chance to play too often. When I practice for a couple of weeks at a time, I can play the shit out of ‘em. I have fun doin’ it, too.</b>'
