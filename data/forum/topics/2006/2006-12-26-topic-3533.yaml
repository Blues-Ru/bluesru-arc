  text: "В кредитах к песне James Brown - Living in America указан SVR - гитара. Кстати, эта песня звучит в фильме Рокки-IV: в фильме показывают выступление JB, но SVR там нет (только чернокожий гитарист). \nНо слушая эту композицию, я там нигде не различил его гитары.\nПожалуйста поясните что это за сотрудничество когда музыканта там никак не разгледеть.\nТоже самое по поводу альбома Bob Dylan \"Under the Red Sky\" - 1990. В кредитах там указаны и Джимми и Стиви Рэй, но слушая там НИЧЕГОСЬ воэновского и нету. Та игра гитары (насколько я помню, то чаще там звучит акустическая гитара) что там есть по силам любому средненькому гитарасту. Зачем приглашать тогда именитых музыкантов, если они там НИКАК не раскрываются. Только альбом зазря скачал (купил)..."
