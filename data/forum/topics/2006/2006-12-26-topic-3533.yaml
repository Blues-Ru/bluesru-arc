    text: "Вот что нашлось: (спасибо S Kashin за подсказку)\nhttp://www.modernguitars.com/archives/002283.html\nStevie Ray Vaughan Interview by Steven Rosen.\nOctober 29, 1985\n\nSteven Rosen: You were a bit edgy about your performance on the 'Rocky IV' soundtrack? [Stevie played on the James Brown track, “Living in America\".]\nSRV: I don’t understand it at all. It’s kind of, I don’t want to take it this way, but it’s kind of insulting. There’s only enough of what I played on there to legally use my name. You can’t really even tell what I played.\n\nSteven Rosen: If someone didn’t know you were on the track, they would be hard pressed to identify you as the guitar player? \nSRV: I can show you what I played on it and where I played. I mean I played on the whole thing; they had me do the whole thing several times so that they could have different parts of the same style to use. And this is the first mix I’ve heard that didn’t use my guitar part all the way through. And I’d used parts off of a song that I was writin’ and I blew it off. I blew it off so that I could keep this one in a separate place. Now they didn’t use my parts that are on there. I don’t know, it’s just that I’m kinda shocked."
