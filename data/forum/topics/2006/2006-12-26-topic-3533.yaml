    text: 'Проверил внимательней. James Brown - Living in America: гитара СРВ звучит там по времени с 01:37 до 01:56, с 02:38 до 02:50. Гитара смещена ближе к левому каналу и не ахти как явно прослушивается, мне пришлось послушать внимательнее.

      Странненько что участие СРВ такое небольшое, весьма короткое: 8-10 коротких фраз которые "задвинуты" несколько назад.

      Конечно же это дело James Brown''а (не моё это дело), но стоило ли ради этого приглашать СРВ? Так могбы сыграть даже средненький гитарист.

      Cкачивая эту композицию я расчитывал на б0льшее.'
