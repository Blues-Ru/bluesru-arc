  text: "ЯППИ-БЛЮЗ\n  \n(ЯППИ (Yuppie, Young Urban Professional, молодой городской профессионал) — молодёжная субкультура,\
    \ представители которой ведут конформистский общепринятый образ жизни человека современного западного общества. Яппи имеют\
    \ высокооплачиваемую работу, в одежде предпочитают деловой стиль, следят за модой, посещают фитнес-центры, лето проводят\
    \ на курортах. Основной критерий \"яппи\" - фэшенебельность (\"модность\"). Понятие \"яппи\" возникло в начале 1980-х\
    \ как противовес понятию \"хиппи\". \"Яппи\" не отрицают сексуальной революции (допускают случайные сексуальные связи\
    \ до брака и терпимо относятся к изменам как к расторжению контракта), однако признают институт семьи. Мировоззрение \"\
    яппи\" - американский прагматизм, здравый смысл или \"разумный эгоизм\". Первый свой миллион долларов \"яппи\" создают\
    \ в двадцатилетнем возрасте в ущерб здоровью, личной жизни, образованию и прочим прелестям жизни. А к тридцатилетнему\
    \ рубежу их нервная система просто уже не выдерживает сверхчеловеческих нагрузок... (http://ru.wikipedia.org))\n\nДень\
    \ и ночь. \nСвет и тьма.\nСутки прочь. \nДни... Года...\n\nБизнес-план. \nПлан-проспект.\nОфис. Банк. \nГранд-проект.\n\
    \nТерминал.\nФейс-контроль.\nСпец-сигнал.\nКейс. Пароль.\n\nАвтобан.\nКофе-брейк.\nРесторан.\nЧипсы. Стейк.\n\nТелефон.\n\
    Телефакс.\nКраткий сон\nчерез раз...\n\nТам - дефолт.\nТут - прогресс.\nШум банкнот.\nВечный стресс!\n\nБизнес-класс.\n\
    Яппи-клуб.\nСмокинг. Джаз.\nСлед от губ.\n\nПовстречал. \nПригласил.\nПереспал.\nПроводил.\n\nДом. Гараж. \nМерседес.\n\
    Душ. Массаж. \nЭкстрасенс.\n\nФитнес-зал.\nE-mail. Спам.\nИммунал.\nТазепам.\n\nКалендарь.\nСуета.\nВечер. Хмарь.\nПустота...\n\
    \n300 виз.\n30 лет.\nЭпикриз.\nИмпотент.\n\nПрипев:\n|: Это - Яппи-Блюз! :|\n|: Это - Яппи-Блюз! :|\nЗа дело взялся яппи!\
    \ -\nСчитай, что дело в шляпе!\nЭто - Яппи-Блюз! \n\n***"
