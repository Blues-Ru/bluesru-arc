  text: 'Приятно писать на форум этого замечательного сайта. Я басист московской инструментальной группы "Том и Фантомы". Обожаю черный блюз,особенно классический,середины 20 века,звук CHESS RECORDS. Недавно мы с гитаристом моей группы,который такой же любитель и ценитиель старого блюза замутили проект,назвали,просто и бесхитростно))) ANIMALS))) Сейчас пишем на базе,с использованием всех старых технологий,некий блюзовый альбом. Вот ссылка на две первые темы

    http://music.lib.ru/a/animals/

    Оцените,кому не лень,ну и коменты пишите.

    Я буду туда добовлять новые постоянно))) Мы очень готовы и концерты играть. Послушайте ANIMALS)))'
