      text: "И из печки на стол, и сам момент донесения некоторго кайфа из клубной\
        \ амосферы в места отдалённые. Я по блюзману.ру - скучаю - и заглядываю на\
        \ него - хотя бы просто так - лишний раз взглянуть, порадоваться, что вот.\
        \ И архив прекрасный. \nА иначе - да, московский блюз, блюзовое комьюнити\
        \ - а оно заверчено только на себе. И выхода на за пределы садового кольца\
        \ пляс ещё пару тысяч км - никакого. Если б не ты да не Матраскин - был бы\
        \ компот в одной взятой кастрюле.\nИ к слову об Алабаме и не только. Помнится,\
        \ было время, когда я, как и миллионы мне подобных:) были уверены, что блюзовых\
        \ команд в Москве и в России всего - две. Кроссроадс и Лига блюза.\nА потом\
        \ - как раз с твоим детищем это связано - я послушал Аграновского. Помню -\
        \ концерт на Биофаке МГУ было первое, что услышал. Уэй! - и как же это было\
        \ непохоже на то, что я себе представлял о московском блюзе. Кайф! Протащило\
        \ очень мощно. дальше - пошло-поехало. И приезжать немножко стал, и в клубы\
        \ ходить, и познакомился. А всё с кого началось? С вас, товарищи-братья Аграновский\
        \ и Головачёв,  - неподозревающие основатели ханты-мансийского блюза:))))и\
        \ Каверкин и Матраскин.\nСпасибо всем.\nИгорь, а мы с тобой виделись в некоем\
        \ немалоградусном состоянии в ночь в Лефортове. Ты ещё писал всё действо с\
        \ высокого столба своим хитрым микрофоном. Я не успел на ЧЁРНЫЙ ХЛЕБ тогда.\n\
        Осталась запись? Равно и про Дуартэ тот же вопрос.\nвсё. исчезаю.\nВсем спасибо,\
        \ будьте мне здоровы."
