  text: "Вышел наш CD \"Алабама\". Это концертая запись 2002 года. Показ 17-го в клубе\
    \ \"Фитиль\" и 23-го в \"Доме-у-дороги\". \nДиски есть в магазине отделения \"\
    Выход\" (известного Олега Ковриги). Магазин в Кутузовском проезде дом 4 (рядом\
    \ с Бородинской панорамой). Место интересное, есть виниловый отдел. \nКстати,\
    \ исполнители блюза могут поставить там свои диски на продажу. Звоните, спрашивайте\
    \ Ковригу (телефон 148 13 03)."
