  text: "Hi,\n \nWe organize a new international blues contest in Finland incoming summer in conjunction with the Backas Jazz festival, first six weeks on the internet, the six winners of these internet contests are invited to Finland, accomodation covered + 50% av international travel costs up to $500. The winner of the final receives a grand prize of $3000. The houseband in the finals is Wentus Bluesband.\nWe hope you can help spread around information about the contest. We hope also Russian bluesartists will be interested in joining. Deadline for submitting songs is March 6:th.\nMore information can be found at http://compo10.com\n \nWarmest regards Eva Gr&#246;nblad\n\n\nCompo10.com together with Vantaa Jazz Heritage Association organizes a blues song writing contest based on traditional blues heritage. \n \nThe first part of the contest is organized on the internet during 6 weeks from the 20th of March to the 30th of April\n\nA local Jury consisting of music professionals will select out of the received entries 60 compositions + lyrics to be participating in 6 weekly competitions ( ten each week )! \n \nThe winner of each week will be invited to participate in the live finals in Vantaa, Finland on the 10th of June, 2006. \n \nThe Jury will award a grand prize of USD 3,000 to the winner of the finals in Finland. \nNo sign up fees!\n\nIMPORTANT!!!! Read the Rules and regulations !!!\n\nYou can find all the info needed at http://compo10.com\n\nblues@compo10.com"
