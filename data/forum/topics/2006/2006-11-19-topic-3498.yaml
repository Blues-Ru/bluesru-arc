    text: 'У меня - у гитариста не рукер, а крюкер (не Крюгер, а именно крюкер)

      Да, вы знаете, у настоящего блюзмена - не рукер, а хрюкер

      (вы понимаете, о чём я)

      И ему хорош и Фредди Кинг, и Ларри Дэвис,

      Но важней всего кто? ( ну, да, вы угадали, братья) - конечно же, Джон Ли Хукер.


      И я проснулся нынче ночью - между двумя и семью-с.

      Я проснулся глубокой ночью - где то меджду двенадцатью минутами четвёртого и семью-с.

      И вспомнил одну ёкарнобабайскую вещь-

      Много лет назад я родился - и теперь я напьюс.


      Если ты будешь пить виски, друг - будь осторожен

      Виски с закуской, парень, - две редиски и пять сортов морожен

      Поздравь Майора с праздником - ведь твой тост сегодня вполне возможен.

      Тёрн-эраунд.

      Кода.

      Си-до-диез-си ре.....'
