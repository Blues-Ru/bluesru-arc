      subject: С умным видом.
      deleted: false
      text: "С умным видом залез на Харриз Блюз Лирикс, ибо сомнения закрались и у\
        \ меня теперь, разъяснить для себя раз и навсегда - Цо ше за такэ Джукджойнт.\
        \  И вот чё пишут \n Jukejoint :\n1 - a small inexpensive establishment for\
        \ eating, drinking, or dancing to the music of a jukebox. For more info on\
        \ juke joint and jukeboxes take The Jukebox Historical Tour from the Memphis\
        \ Guide.\n Из чего ясно, что Джукджойнт есть в первую очередь- заведение,\
        \ заведение для выпивона-закусона с музыкой и танцами.\n И сразу же вспоминаются\
        \ слова песни \"Оля ин зе монинг\" ( Early in the Morning ( - у нас во Владимире\
        \ просто под неё зачётная стриптизёрша Оля танцевала, да бы народу праздник\
        \ усугубить. Потом она уехала в Епонию на заработки и взяла запись нашей песни\
        \ туда с собой, ибо у ней под сие произведение номер был подготовлен. Хорошая\
        \ была Оля...гимнастичная и артиситчная...пропала куда то...Тык вот:\nТам\
        \ слова: Эз ай вок бай зе Джукджойнт, пипд ин сру зе до, ши уоз дуинг э буги\
        \ вуги, райт ин зе миддл ов зе фло, ...ОООЛя ин зе моонинг)\nтипа чувак шёл\
        \ мимо заведения , и через дверь ненароком завидел  Олю, которая делала Бугивуги\
        \ прям посередь пола). \n Так вот касательно Джукджойнтов, в которых играют\
        \ блюз, а не \"живая музыка с тёткой в платье с люрексом и мужиком на синтезаторе\"\
        , то такое место - это кафе \"Песня\". Там правда, нет узкой направленности\
        \ на блюз, что характерно для маленьких городов, узко направленных клубов\
        \ вабще нет. Есть только широконаправленые - тут Техно, там Неформалы, тут\
        \ Ресторан в стиле \"Всем отделом в ресторан\". В \"Песне\" и барды и панки(Зе\
        \ Блакмайлерс Блюз Банд) и блюз(они же) и этно и прочее прочее... Так же там\
        \ пожно после концерта ,любому вменяемому желающему залезть на сцену и спеть\
        \ под гитару хоть \"Комиссионный решили брать\", хоть \"Изгиб гитары жёлтой\"\
        , хоть мою любимую песню \"Сто шагов назад\"   Ко всему прочему очень   хорошее\
        \ руководство и приветливая охрана. \n Вот сайт Кафе \"Песня\" http://song18.narod.ru/\
        \ ( сайт хоть и холодно- футуристичный - внутри \"Песни\" там всё не так)\n\
        Есть конечно и более модные заведения с лучшим звуком, но это уже не подходит\
        \ под разряд Джукджойнтов.\n Надеюсь эта инфа помогла \"от блюзмену\""
