  text: "Санкт-Петербург. Театр марионеток им. Е.С. Деммени в июне продолжит показ своих спектаклей для маленьких петербуржцев,\
    \ несмотря на окончание театрального сезона и закрытие большинства городских театров в связи с гастролями или отпуском.\
    \ Как сообщили Балтийскому информационному агентству (БИА) в отделе связей с общественностью театра, в июне на сцене театра\
    \ можно будет увидеть романтическую кукольную пантомиму «Театр Пьеро и Коломбины» и новую версию известного мультипликационного\
    \ мюзикла «Голубой щенок», которая идет в Театре марионеток под названием «Щенок по кличке Блюз». \n«Оригинальную музыку\
    \ к этому спектаклю, как и ко многим другим, идущим в театре, написала известный петербургский композитор Татьяна Алешина.\
    \ Эту историю особенно следует посмотреть молодым мамам. По признанию одной из зрительниц, история щенка Блюза потрясла\
    \ ее не меньше, чем иные шекспировские сюжеты», — отметили в театре."
