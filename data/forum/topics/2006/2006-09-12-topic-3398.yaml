                text: 'Раз двадцать перечитал фразу Михаила, и не нашел в ней никаких
                  признаков чувства самодовольства.

                  Наоборот, по моему сугубому мнению практикующего психа-аналитика,
                  фраза составлена в нейтрально-извинительном стиле, о чем свидетельствуют
                  безличная форма "есть информация" и многоточие в конце фразы.


                  Вот я, если честно, придерживаюсь мнения анонимного прохожего -
                  в самом деле, неужели Gus Cannon такая фигура, что ежели бы он появился
                  на 15 лет позже, то и блюза бы не было? Ой, сомневаюсь я однако..


                  Просто удивительно, что вокруг события 130-летней давности разгорелись
                  такие страсти, чес-слово, буря в стакане воды.


                  Лично для меня календарь - источник постоянного вдохновления, я
                  юоткрыл для себя очень много хорошей музыки, каждый раз заглядываю
                  в Закрома в поисках того, о чём написал АЕ. Хотелось бы, чтобы календарь
                  был ещё больше, толще и длиннее.


                  Вот на этой оптимистичной ноте разрешите закончить.'
