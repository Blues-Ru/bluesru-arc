              text: "Я думаю, прохожий едко пошутил. А вот Мадди сказал правду: тут\
                \ действительно очень важна дата, поскольку речь идет о первопроходце.\n\
                Но, блять, как это было сказано?..\nЧто за отношение к моей работе,\
                \ а?\nРебята, мудрецы дорогие. А вы знаете дату рождения Джона Ли\
                \ Хукера? Точно?... Точнее, чем он сам? а знаете дату рождения Луи\
                \ Армстронга? Не знаете? А дату рождения Гаса, значит, знаете? Супер!\
                \ - напишите нам календарь, пожалуйста, а то я уже заебался. \nЕсли\
                \ без шуток - я поражаюсь, как так мало ошибок - ведь ни редактора,\
                \ ни корректора, все - сам.\nЧто касается гугла - все эти ребята переписывают\
                \ друг у друга одну ошибку. Пусть кто-то укажет источник, где они\
                \ взяли именно эту дату. Харрис ошибается значительно реже, чем АМГ\
                \ - и я буду придерживаться его версии. \nИ, ААА, я не чистый порох.\
                \ Был бы чистым - давно бы взорвался. А так - воняю немного. И, с\
                \ точки зрения мудреца, рифма \"информация - в задницу\" - совершенна,\
                \ лучше всяких танок и хоккок. ) \nИ на ошибки указывать нужно, иначе\
                \ они будут вертеться из года в год - и никто не поправит. Вот только\
                \ чувства самодовольства, проявленное пИскарем - кажется мне мудацким.\
                \ У него, блять, есть другая информация - и торчит она у него в заднице."
