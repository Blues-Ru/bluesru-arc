                      deleted: false
                      text: 'Когда-то давно, в одном городе, жил великий мудрец. Слава
                        о его мудрости разнеслась далеко вокруг его родного города,
                        люди издалека приходили к нему за советом.


                        Но был в городе человек, завидующий его славе. Пришел он как-то
                        на луг, поймал бабочку, посадил ее между сомкнутых ладоней
                        и подумал:"Пойду-ка я к мудрецу и спрошу у него: скажи, о
                        мудрейший, какая бабочка у меня в руках - живая или мертвая?
                        Если он скажет мертвая, я открою ладони, бабочка улетит, если
                        он скажет живая, я сомкну ладони и бабочка умрет. Вот тогда
                        все поймут, кто из нас умнее."


                        Так все и получилось. Завистник пришел в город и спросил у
                        мудреца: "Скажи, о мудрейший, какая бабочка у меня в руках
                        - живая или мертвая?"


                        Тогда мудрец, который был действительно умным человеком, сказал:"Все
                        в твоих руках'
