    subject: Спасибо музыкантам и организаторам
    deleted: false
    text: "Большое спасибо за прекрасный фест, и даже июльская стужа не смогла испортить праздник. В этот раз была хорошая организация: отличный танцпол, приличный звук, вежливые охранники и самое приятное это те самые тряпочки (помимо принесенного коньяка), согревавшие нас в этот морозный июльский вечер. Музыкантам отдельное спасибо... это почти подвиг терпеливо (трезво)ждать своего выступления в этих экстримальных условиях. Очень понравились: Dr.Nick(южная фанк музыка \nбыла весьма кстати), Петрович (продолжил темп и исполнил несколько новых классный вещей), Каверкин (видать очень замерз и исполнил просто зажигательный сет...я чессссно не ожидал от него такого).\nНо самый ураган - это Крис Дуарте. Человек-гитара, великолепный импровизатор... просто удивительно какие звуки он выжимал из своего Страта. Все еще нахожусь под впечатлением.\nПро выступление остальных музыкантов может кто-нибудь еще добавит свое мнение, но фестиваль конечно удался.\nСпасибо Леша, Сергей, BBK !!!!"
