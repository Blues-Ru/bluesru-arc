  text: 'Новичок я здесь на блюз.ру, правильно ли пишу, туда ли, но вчера в Лефортово срубило, особенно Крис Дуарте. Организаторам - огромный респект, в частности, молодому человеку в джинсовом костюме и майке со звездой, который настоятельно рекомендовал вернуться к 22.00, когда наша компания из BeatlesClub.ru решила закругляться, где-то после Левана Ломидзе. Такого драйва, океана музыки, как от Криса, давно не встречал. Спасибо, Крис! Спасибо, клуб B.B.King! Blues and The Beatles - Forever!!!


    sergeya'
