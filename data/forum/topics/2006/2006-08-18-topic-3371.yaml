  deleted: false
  text: 'Находясь в совершенно благодушном состоянии духа и , что не менее важно - тела, полез в дебри паутины дабы посмотреть
    чего пишут про меня хорошего ( и не врите мне, что только я этим грешу...), и наткнулся на пару удивительно злобных, но
    также и удивительно смешных текста касаемых (увы) не только меня.... Первый текст принадлежит некому  Льноградскому (может
    и не так его фамилия пишется, но лень проверять...) , который услышав мое музицирование в священном гвневе  отправляет
    меня класть шпалы ( откуда ему знать, что шпалы я тоже когда-то клал) вместо нахождения на сцене...Ну это ладно, это его
    журналистское право, но у себя на сайте ( хотя сайт вроде принадлежит другому человеку, чьим арт (?)директором сей индивид
    является) этот глюпый, глюпый карапуз предупреждает (якобы шутя) , что в случае его смерти(!!!) (100 лет жизни ему!!!)
    следует винить меня , Владимира (эта коаловая масса даже имена путает в плотском воожделении!)Иващенко и еще несколько
    человек которых он пытался обдефицировать (хотел культурно слово "обосрать" изобразить...). Я лично его убивать не буду
    - ибо нельзя убивать сирых и убогих. А сир и убог г-но Льноградский хотя бы тем, что сравнивает меня с такими великолепными
    гитаристами как Вадим Иващенко,а так же с другими очень достойными музыкантами. Я лично этим польщен, и если бы не откровенно
    злобные намеки на мой возраст (он мне, писун этакий  55-60 лет дал, хотя мне всего 51 (ну 52), то я бы ему еще и спасибо
    сказал...Так, что убивать не буду, а вот по попке надаю, а так,для порядку....Что-ба обкакав кого либо потом не боялся,
    а вырос, окреп и стал профессиональным засранцем, а не так - серуном зыбким...Серуны зыбкие они безвредные, но очень вонючие...Гораздо
    хуже засранцы профессиональные - запасы у них не ограничены...Воняют они не так едренно, но долго.....

    Ну а Тынку - это просто песня...Он даже не серун, он так... пук бунтующий...Он меня в такой список ненавидимых им гитаристов
    включил, что я теперь наверное ноты начну учить, цифровки там всякие,табулатуры (прости Господи!), форумы начну гитарные
    посещать и прочими умными делами займусь...С такими ребятами в одной шеренге оказался!!!Вадим, Арсен !!! Я с вами!!! Вот
    так приходит слава....

    Так-что тынку вери матч!!!

    И когда эти два красавца мойпут, что не гитарист я!!! Наверное никогда, ибо сиры головой они, как было сказано выше и
    убоги в существе своем и обличии непрезентабельном...Серые они какие-то...и завистливые что-ли.....

    I''m sittin'' on Top of the World...'
