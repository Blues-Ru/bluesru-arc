    text: 'Это не совсем блюз. Вокал у нее мощный, но ОЧЕНЬ много манерности и современного
      соул-блеяния. Очень резко звучит на высоких нотах. Слышно, что это вообще не
      черное пение. Слишком много ненужных нот и якобы эмоций. Кривляние начинается
      сразу с первого куплета и так до конца. Более того, тут она поет совсем не своим
      голосом - это сразу слышно. Но спето очень точно и ярко. Но Др. Джон поет более
      правильно :)


      По звуку это очень похоже на работы Джона 90-х на фирме GRP. И конечно, ни у
      нас, ни в Европе нет подобных голосов. Другое дело, что в блюзе такие голоса
      - это скорее вред, чем польза. Блюз - это обычно гитарист/певец, пианист/певец
      или гармонист/певец. Отдельный блюзовый певец - это нонсенс, на мой взгляд.
      Обычно это что-то эстрадное, приджазованное, попсовое или, наоборот, роковое.'
