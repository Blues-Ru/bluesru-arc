  text: 'кто придумывает истории о том, что блюз родился в Африке. Здесь белые люди
    играют фолк на гитарах, скрипках и банджо; половина вещей звучит как блюзы. Не
    думаю, что эти мужики (многие рождены еще в 19 веке) нахватались этого у чёрных
    из Африки. Они рассказывают другие истории (всё про юг, про горы да про Англию
    с Ирландией). Обалденный диск!


