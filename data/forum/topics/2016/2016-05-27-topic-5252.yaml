  text: '9 июня канадский певец и актер Брюно Пельтье представит в Крокус Сити Холле
    программу «Музыка и кино», в которую вошли популярные мелодии из мюзиклов и кинофильмов.



    Сотни тысяч россиян влюбились в уникальный голос канадского певца и актера Брюно
    Пельтье (Bruno Pelletier) после того, как он исполнил одну из главных ролей во
    всемирно известном мюзикле «Нотр-Дам де Пари». Пельтье – один из самых известных
    в мире франкоязычных певцов, а в своей родной Канаде он среди звезд первой величины.
    На счету Пельтье десятки престижных наград и титулов (Felix, World Music Awards),
    а его неофициальное звание «Золотой голос Квебека». В его дискографии двенадцать
    альбомов, в том числе альбом «Miserere», ставший в Канаде дважды платиновым. Голос
    Брюно Пельтье признан музыкальными критиками одним из самых красивых в мире. Он
    пел с такими звездами мировой сцены как Селин Дион и Лара Фабиан. В биографии
    Брюно роли в таких всемирно известных мюзиклах, как  «Notre Dame de Paris», «Starmania»,
    «Dracula, еntre l’amour et la mort» и многих других. В музыке Пельтье не придерживается
    одного конкретного стиля, он успешно экспериментирует с жанрами – рок, поп, классика,
    джаз.


    Певец неоднократно приезжал в Россию, и каждый раз его концерты сопровождались
    неизменным аншлагами. Артистизм, обаяние и энергетика певца превращают его выступление
    в захватывающее шоу. Певец отвечает взаимностью благодарной российской публике
    и каждый раз включает посещение Москвы в свой гастрольный график. Пельтье и нынешнюю
    поездку ждет с нетерпением: «Меня постоянно спрашивают, когда же ты приедешь?
    Мне очень приятно». По многочисленным просьбам российских зрителей Брюно вновь
    посетит Москву. На этот раз певец представит программу «Музыка и кино», в которую
    вошли популярные мелодии из мюзиклов и кинофильмов. Концерт пройдет при участии
    Калужского Молодёжного Симфонического Оркестра.


    Песни Брюно Пельтье полны эмоций, любви и искренних чувств. Потрясающий голос
    брутального и харизматичного мужчины покорил множество сердец во всем мире. Лучшие
    образцы мировой эстрады в исполнении Пельтье – это обещает стать ярким событием
    не только для поклонников мюзикла «Нотр-Дам де Пари», но и для всех любителей
    современной музыки.



