  subject: Почему так громко?
  deleted: false
  text: 'Полагаю, что среди читателей форума есть немало музыкантов играющих в группах. Вопрос (очень занимающий меня в последнее
    время) именно к ним. Почему многие (даже хорошие) музыканты не могут в группе играть тихо?

    Почему не удаётся оставаться на умеренной громкости, даже предварительно договорившись об этом? Отчего это происходит?

    У меня есть своё мнение на этот счёт, но не уверен что оно верное. Приведу его здесь позже если будет интерес к теме.

    Эта проблема актуальна в небольших помещениях (клубах/кафе) — посетителям трудно общаться между собой (а порой и невозможно)
    когда играет группа.

    Есть ли методы/варианты решения этой проблемы?'
  replies:
  - id: 39430
    parent_id: 39429
    date: 2016-12-01 14:00
    poster: Федор Романенко
    subject: Про громкость
    deleted: false
    text: 'В музыкальных клубах музыка должна играть достаточно громко, хоть и без без экстрима. Основной приоритет - получить
      определенные эмоции именно от музыки, а для этого она должна пронимать. Если ты не слышишь бас изнутри  своего тела,
      ты не чувствуешь гармонию, в результате даже удачные солирующие инструменты не воспринимаются головой достаточно круто,
      не накладываются.


      Нормальный баланс группы с ударными и ламповым гитарным комбиком не может быть очень тихим, в любом случае.


      Фоновая музыка в ресторане должна быть не очень громкой.


      Первая проблема в том, что организаторы концерта и публика не могут определиться с тем, зачем мы все здесь собрались.
      Легкий жанр или не очень и пр. В лихие 90-е в Москве куча ресторанов стали звать живых ярких артистов, но пытались их
      зажимать по громкости, чтобы еду со столов не сдувало. Однако, некоторые определились. Например, клуб Forte (т.е. "громко"
      ;) выбрал себе название и, хотя это хороший ресторан, с самого начала последовательно  себя позиционировал как музыкальный
      клуб, в первую очередь. Публика тоже настроена на музыку в первую очередь.


      Вторая проблема в неумении выстраивать звук. Если это гитарное трио, то гораздо больше шансов, что гитарный комбик будет
      орать так, что всем будет физически тяжело. Если больше инструментов, разнесенных по частотам, то при общей большой
      громкости будет восприниматься лучше. Еще одна ошибка - звукорежиссеры вытаскивают, например, как в роке бочку очень
      сильно и пр. Т.е. при неумелых действиях музыкантов и звукорежиссеров сила поражения большая, а возможность хорошо все
      слышать - средняя.'
