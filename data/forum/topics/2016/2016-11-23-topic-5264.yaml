    subject: Мониторы
    deleted: false
    text: Ну и второй момент - музыкант должен хорошо себя слышать, лучше, чем остальные. Для этого можно повернуть гитарный
      комбик в свою сторону или его наклонить, повернуть на себя вокальные и прочие мониторы и пр. Это поможет музыканту держать
      свою громкость в общем миксе на более низком уровне.
