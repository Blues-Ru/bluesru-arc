  text: 'Уважаемые знатоки блюза!

    Прежде всего, прошу простить меня, если я не туда пишу, но уже лет 20-25 безуспешно пытаюсь определить исполнителя и название блюза.

    У меня была эта запись на бобине, у друга когда-то записал, кажется в 89-90гг.

    Он сам не знает, что это за блюз.

    Помню, что записал у друга дописью, пока не кончилась плёнка,

    свёл уровень записи до нуля.

    Т.е. блюз идёт, видимо, больше, чем 6 мин 19 сек.!

    По стилю, это не 60-е, и не 90-е.

    Может, середина 70-х. Предполагаю, потому что у Livin'' Blues

    похожий характерный бас в Blue Breeze.

    В дальнейшем я эту запись с катушки оцифровал,

    вот ссылка - https://yadi.sk/d/7qa1C19su97ge

    На мой взгляд, что-то среднее между Chris Bell (Elevator To Heaven)

    и Livin'' Blues (Black Night), но не то, и не другое.

    Помогите, я уж в блюзах не силён, но уж очень в душу запал этот блюзик!'
