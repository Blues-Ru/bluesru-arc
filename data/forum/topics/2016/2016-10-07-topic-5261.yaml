  text: "13 сентября в краснодарском кафе «GoodZone», состоялась расширенная встреча\
    \ участников Общества Авантюристов «Счастливый Случай» и их гостей. В мероприятии\
    \ приняли участие - предприниматели, представители научной и творческой интеллигенции,\
    \ известные спортсмены и музыканты. \n\nСреди присутствовавших было немало известных\
    \ людей. Правда, многие просили НЕ афишировать их имена, потому, что опасаются\
    \ за своё будущее с ярлыком «Авантюрист». Некоторых из гостей назвать можно, они\
    \ об этом НЕ просили:\n- Александр Травников, профессор кафедры международного\
    \ права, писатель, доктор философии, кандидат исторических наук, член Союза писателей,\
    \ 9 дан каратэ.\n- Олег Хапаев, неоднократный чемпион Юга России и Мира по жиму\
    \ лёжа, серебряный призёр чемпионата Юга России по пауэрлифтингу, серебряный призёр\
    \ чемпионата СНГ по кикбоксингу, мастер спорта по жиму лежа, персональный тренер\
    \ по пауэрлифтингу и фитнесу.\n- Аман Атилов, тренер по боевым единоборствам,\
    \ двукратный чемпион мира по муай тай, обладатель чёрного пояса 5 Дан по хапки-до,\
    \ 4 Дан по таэквон-до.   \n- Мирослав Валькович, предприниматель, гражданский\
    \ активист.\n- Раланд Вольф, предприниматель, общественный деятель, благотворитель.\n\
    - Тигран Хачатуров, режиссёр, бизнес-тренер, шоумен.\n- Анатолий Терёхин, предприниматель,\
    \ авантюрист с большой буквы «А». Этот молодой человек около года назад без особых\
    \ раздумий встал на улице Красной с табличкой «Собираю на свадьбу!» и начал продавать\
    \ цветы прохожим. Скоро у него свадьба. Теперь, он собирает на цветочный магазин.\
    \ Кроме того, Анатолий запустил интернет-магазин по доставке цветов и сейчас всячески\
    \ развивает его.\n- Шовкат Раджабов, выпускник МГИМО, предприниматель в области\
    \ сельского хозяйства.\n- Эдмонд Барсегян, предприниматель, общественный деятель.\n\
    - Дмитрий Морозов, предприниматель, представляющий в Краснодаре новые технологии\
    \ в индустрии красоты. В настоящее время занимается развитием проекта безинъекционного\
    \ омоложения по южнокорейским нанотехнологиям.\n- Владимир Шумилов, остеопат,\
    \ и его супруга Елена, автор методики «Счастливое питание».\n- Альберт Гаямян,\
    \ юрист, журналист, автор-исполнитель песен в стиле «шансон», по совместительству\
    \ – Ответственный секретарь Общества Авантюристов «Счастливый Случай». \nПринято\
    \ решение — продолжать развитие нашего клуба для того, чтобы знакомиться, общаться,\
    \ отдыхать от будней, продвигать новые и интересные проекты».\nОтмечу, что клуб\
    \ авантюристов в данном формате – единственный НЕ только в Краснодаре или на Кубани,\
    \ а даже в России. Как уверены участники Общества Авантюристов «Счастливый Случай»,\
    \ их деятельность будет набирать обороты, так как страна нуждается в новых интересных\
    \ проектах.\n\nИсточник: ИАП «Интер-Информ» http://inter13.ru/odare/\n\nhttps://www.youtube.com/watch?v=JrUZg5jMCDI"
