  text: "16 февраля в Камерном зале Московского международного Дома музыки состоится Юбилейный концерт легендарного коллектива\
    \ MOSCOW ART TRIO – 25 лет!\n\n«Какая редкость, когда границы между эпохами, восточной и западной фольклорной музыкой,\
    \ джазом и классикой, сглаживаются так изящно и тонко как это делает Moscow Art Trio. Личности самих музыкантов гораздо\
    \ важнее, чем инструменты, на которых они играют», - Mike Zwerin, International Herald Tribune.\n\nMoscow Art Trio отмечает\
    \ 25-летний юбилей! Все эти годы Moscow Art Trio остается, пожалуй, одним из самых востребованных российских этно-джазовых\
    \ проектов за рубежом! Хотя джазовым в прямом смысле этого слова его назвать сложно. Творчество коллектива относится к\
    \ элитному направлению – камерной импровизационной музыке. Moscow Art Trio соединяют дух джаза, фольклорную стихию и академическую\
    \ дисциплину.\n\n16 февраля Moscow Art Trio дадут концерт в Московском Международном Доме Музыки! Три ипостаси творческого\
    \ альянса трех выдающихся Художников - неповторимая авторская музыка Альперина, напевная стихия Старостина и волшебная\
    \ валторна Шилклопера - приглашают вас в окутанный светящейся дымкой мир воображаемого фольклора, имя которому Moscow\
    \ Art Trio.\n\nДля вас прозвучит программа «Воображаемый фольклор» «Moscow Art Trio. Избранное». Не пропустите!\n\nБилеты\
    \ можно приобрести в кассах и на сайте:\n\nhttp://mmdm.ru/ru/events/koncert-moscow-art-trio\n\nА также в кассе Дома Музыки\
    \ по адресу: Космодамианская набережная, 52, стр. 8 (м. Павелецкая). \n\nСправки и билеты: +7 (495) 730-10-11."
