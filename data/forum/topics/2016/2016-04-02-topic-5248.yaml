    text: 'Здравствуйте. Фраза "Back to the land of California

      To my sweet home Chicago" часто заменяется на "Back to that same old place. Oh sweet home Chicago" - потому как ещё
      никто не дал точного ответа, почему Джонсон, будучи подковал в географии, поместил Чикаго в штат Калифорния.. А поскольку
      петь надо только о том, что знаешь - вот и меняют)


      Плюс много похожих песен было как до(http://www.youtube.com/watch?v=2CZEGJfes1c), так и после (например Take a Little
      Walk with Me - Robert Lockwood, Jr.)


      ps кстати и википедия кое-что рассказывает об этой песне https://en.wikipedia.org/wiki/Sweet_Home_Chicago'
