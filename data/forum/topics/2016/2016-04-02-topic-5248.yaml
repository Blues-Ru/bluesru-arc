  text: "Братцы! Кто прояснит, почему и как образовался текст у \"Sweat home Chicago\", который давно уже поют не в том виде,\
    \ в котором он был придуман и спет Робертом Джонсоном? (\"...Comon...\" вместо \"Oh\", Калифорния из текста исчезла и\
    \ другие дела поменялись). Просто интересна история замены текста. Спасибо, если кто знает и ответит старому лабуху!:-)\n\
    \                         Леонид Резник (LeoMReznik)"
