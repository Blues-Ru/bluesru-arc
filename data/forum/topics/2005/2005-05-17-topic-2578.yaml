    subject: Наследие Брозмана
    deleted: false
    text: "Да, Брозман поразил. Он крут на видео 10-летней давности, но с тех пор\
      \ стал играть еще интереснее. Я, честно говоря, не ожидал, что он будет играть\
      \ так хорошо и интересно. Он сам несколько раз говорил, что постоянно учится\
      \ и играет интереснее и бодрее с каждым годом. На концертах был фантастический\
      \ успех. Наибольшее впечатление на меня произвело то, как визжали девки в ЦДХ\
      \ ;) Очень хорошая вещь для атмосферы на концертах, надо подумать о том, чтобы\
      \ сколотить постоянную группу поддержки ;))\n\nВ голове осталось куча простых,\
      \ но неочевидных мыслей Брозмана, которые он подпихивал для размышления. Вот\
      \ несколько штук, не все запомнил:\n1) По части гармонии Европейцы знают все,\
      \ но по части ритма по сравнению с Африкой, Азией и другой народной музыкой,\
      \ все это - детский сад и примитив. Вообще, в своем мастер-классе он минут 10\
      \ уделил тому, какие ноты играть, а два часа - ритмам. Сложнейшим ритмически\
      \ вещам для Европейцев в Индии учат 3-х летних детей.\n2) Надо стараться максимально\
      \ использовать динамику - разницу в громкости, агрессивности и пр., ибо это\
      \ очень окрашивает и разнообразит. Очень много западной музыки играется на среднем\
      \ ровном уровне громкости. Благодаря использованию динамики Брозман звучит также\
      \ интересно, как группа.\n3) Образ гитарного героя-рокера - продукт маркетологов\
      \ и психологов. Образ не имеет ничего общего с хорошей музыкой. Типа, быть гитарным\
      \ героем, - не круто. Все они - слабаки.\n4) Если будете пилить большое число\
      \ нот в соло, то будут приставать мальчики, если неспешно играть можные, низкие\
      \ и ритмичные звуки, все тетки будут ваши. Нет ни одной тетки, которая говорила\
      \ бы, что любит блюзменов, которые \"делают это быстро\".\n5) Умение играть\
      \ на инструменте во многом определяется тем, насколько хорошо связываются мышечные\
      \ усилия с тем, что звучит в голове. Можно играть с напряжением все мышц, бицепсов\
      \ и пр., как это делает Брозман, при этом кончики пальцев могут делать очень\
      \ точные и нежные вещи. Качок может напрячься и при этом очень аккуратно погладить\
      \ ребенка по щеке. Можно играть агрессивно или мягко, но хороший музыкант будет\
      \ использовать все тело и мышцы, чтобы сделать это точно.\n6) Звукоизвлечение\
      \ на гитаре очень сильно зависит от того, насколько точно правая и левая рука\
      \ работают вместе. В частности, чтобы удар правой рукой точно совпадал по времени\
      \ с действиями левой.\n7) Европейская музыка, которая во многом развивалась\
      \ несколько сот лет под звуки марша, слишком ориентирована на первый удар и\
      \ начало ноты. Гораздо важнее - окончание ноты. Упражнения, которые он предлагал\
      \ делать, состояли в том, чтобы стараться варьировать время, когда стучишь,\
      \ например, 2-ю и 4-ю доли. Например, постараться хлопать позже всех и пр. По\
      \ этим причинам у белых очень плохо дело состоит со свингом и пр.\n8) Надо при\
      \ каждом удобном случае делать простые ритмические упражнения. Например, на\
      \ прогулке. (Конкретные упражнения нужно было запомнить на мастер-классе или\
      \ попробовать найти на сайте Брозмана). Или можно несколько минут играть разные\
      \ ритмы, которые вам нравятся, на заглушенных струнах гитары, не думая вообще\
      \ о нотах.\n9) Великие музыканты, например, Армстронг, мыслили исключительно\
      \ музыкальными фразами, каждая из которых звучит интересно и по-разному даже,\
      \ если мы вообще не будем обращать внимания на ноты, из которых они построены,\
      \ а будем слушать только длительности. Фразами можно рассказать историю. Паузы\
      \ - также важная часть между фразами. Если сделать то же самое с соло Мальмстина,\
      \ то получится ровная последовательность из 16-х долей, в которой нет никакой\
      \ информации, никакой истории.\n10) С точки зрения нейрологии, есть три части\
      \ мозга - одна отвечает за движение - от рептилий, вторая - за эмоции - от обезьян,\
      \ третья - интеллект. Часть, отвечающая за интеллект, появилась недавно и работает\
      \ в 35 раз медленней, чем эмоциональная. Музыка не предназначена для интеллекта,\
      \ ибо он для нее - слишком медленный, и музыка содержит столько информации,\
      \ сколько интеллект не способен переварить. Поэтому для музыканта важно, насколько\
      \ его эмоциональная сфера находит выражение в движениях, которые он делает в\
      \ процессе игры на инструменте. Инструмент для мозга музыканта - это полноценная\
      \ часть тела подобно конечности, а не внешний предмет.\n11) Изначально предполагалось,\
      \ что музыка - это вещь, которую играют в первую очередь для удовольствия, и\
      \ что нужно пробовать получать его как можно быстрее после того, как начнете\
      \ играть, а не ждать долго, пока научитесь хорошо играть. Поэтому надо находить\
      \ простые вещи, от которых можно получить удовольствие. Удовольствие от своей\
      \ музыки - достаточное основание, чтобы ее продолжать играть.\n12) Если играешь\
      \ минуту одно и то же, то сначала тебе это нравится. Потом - начинает утомлять,\
      \ в этот момент надо что-то поменять, симпровизировать, начать играть по-другому,\
      \ пока это не наскучит уже на новом уровне и т.д. \n13) Вообще, музыканту стоит\
      \ учиться и заниматься музыкой ровно до тех пор, пока ему интересно пробовать\
      \ новые вещи. Хороший музыкант все время, хоть в 50 лет, узнает и пробует что-то\
      \ новое.\n14) Детей не стоит заставлять заниматься музыкой, если им это не нравится,\
      \ больше чем в течении 2-3 недель. Важно поддержать стремление ребенка, если\
      \ ему это нравится, но если - нет, то лучше не прежимать."
