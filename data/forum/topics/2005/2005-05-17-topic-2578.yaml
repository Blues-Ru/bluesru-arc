  text: 'Это было очень и очень сильно. Смешание римтмов и различных этнических музыкальных
    культур и все это очень бодро и весело. :) Очень клево.


    Мастер-класс был более чем продуктивный. почти три часа Боб показывал и рассказывал
    многие _важнейшие_ ритмические принципы. Раскрывал более глубокую суть римтмической
    составляющей в музыке. И это то, чего касторафически не хватает у _всех_ наших
    исполнителей. То что в лучшем случае именуентся "оттягом" 2и4 ой.. а на самом
    то деле там всего еще больше. И еще многие очень важные вещи... Вообщем я неслабо
    вдохновился всем этим :) Это было здорово!'
