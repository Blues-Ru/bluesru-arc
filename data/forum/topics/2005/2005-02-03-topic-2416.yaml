    subject: Johnny Be Good
    deleted: false
    text: 'Этот американский слэнг... Когда получил паспорт и смог записаться в госбиблиотеку, первым делом пошёл в отдел
      иностранной литературы. Там есть немало интересных книг. Так вот, в словаре американского сланга с удивлением прочёл
      что Johnny Be Good это полицейский. Я тогда ещё не знал что песня называется Johnny B. Goode и прочто она я тож не знал.

      Кстати, после отдела иностранной литературы я пошёл в отдел искусства, там есть (точнее были :-) интересные винилы:
      Chuck Berry "Golden Decade (2LP)" - 1972, Muddy Waters "King Bee" - 1981, B.B. King "Love Me Tender" - 1981 (очень посредственный
      диск), Muddy Waters "Warsaw Session"... Представьте моё состояние когда я это всё увидел (эт было в 1990г. ещё при Союзе).
      Лежали они там до того времени как минимум лет 10. Диски фирменные, в хорошем состоянии - конечно, а кому они нужны?
      Поэтому они теперь там и не лежат :-)

      P.S. По поводу словаря американского слэнга: было б здорово если б мой любимый Lingvo выпустил б таковой.'
