    deleted: false
    text: 'Очень интересные музыканты, Пера Джо уже не первый раз в Москве, но каждый раз открываешь для себя разнообразную
      манеру игры этого талантливого исполнителя. Кстати, Док очень документально описал визит Пера и Стана:http://www.agranovsky.ru/guestbook.htm

      Но больше всего меня покорил Стан...очень эмоциональный музыкант с удивительной техникой звучания, а то что ..."вихляние
      и выкабенивание" , так это несомненно темперамент наших южных братьев-сербов. Да и наши музыканты сразу зазвучали по
      другому....больше стало экспрессии. Интересно конечно послушать сербов в своих сольных проектах, но это наверное в следующий
      раз.'
