    subject: Пера и Владан
    deleted: false
    text: 'Я был в ЦДХ. На мой взгляд, оба серба - очень хорошие музыканты, я бы не стал их сравнивать с нашими, все-таки,
      они уровнем несколько повыше. Как говорится, у них же опыта больше! ;)


      Пера Джо - "гибкий", опытный гармонист, хорошо себя чувствует в разных стилях. Станошевич - отличный слайд-гитарист
      с уклоном в рок а-ля Хендрикс, когда играет без слайда. Отрицательным моментом, пожалуй, было то, что все это было большим
      джемом, в таких условиях индивидуальность музыканта теряется. Я думаю, что в рамках собственной программы сербов слушать
      было бы интересней... В любом случае, огромное спасибо, каждый приезд хорошего музыканта подпихивает местные блюзовые
      дела чуточку наверх...'
