    deleted: false
    text: 'К корифеям себя не отношу, но свое мнение есть.


      По-моему, когда выходил играть Пера Джо, было хорошо слышно, какого это уровня музыкант. Не хочу никого обижать, но
      разница с нашими гармонистам все-таки огромная. Этого нельзя не признать. С таким звуком, мелодизмом, с такой классной
      подачей и ритмикой никто у нас не играет.

      Конечно, на вкус и на цвет товарищей нет... Но разница совершенно очевидна. И разница эта в пользу Пера Джо.


      Я лично остался концертами очень доволен (как и все знакомые, с которыми говорил на эту тему) и не вижу повода "брызгать
      слюной".'
