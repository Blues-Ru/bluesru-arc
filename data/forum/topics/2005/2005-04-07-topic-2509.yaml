  text: "Я о гостях-сербах Пера Джо (гармоника) и Владан Станошевич (слайд-гитара). Заходя на форум,думал,что все брызжут\
    \ друг на друга слюной в полемике. А тут тишь да гладь. Корифеи,каково ваше мнение ?\nЯ без музыкального образования.\
    \ Только эмоции.\nДля затравки.\nМне,как зрителю,очень не понраилось:\n- вихляние и выкабенивание Станошевича;\n- жвачка\
    \ во рту Джо.\nНе оценивая ньюансы исполнения (мажоры,диезы и т.п.) подозреваю,что Каверкин не хуже играет. А если надо\
    \ побыстрее,то можно и Ломидзе пригласить (трезвого только). :-))\nСаша Братецкий,тебя обсуждать не берусь,т.к. буду явно\
    \ необъективен.\n(Он знает. Я в хорошем смысле.).\nВсе равно,спасибо организаторам. И всем гостям \"Дома у дороги\". Классно\
    \ было. Только накурено здорово. Зато водки меньше выпил. Гы. \n:-))\n(Теперь ругайте и бейте,только не по голове).\n\
    Вадим."
