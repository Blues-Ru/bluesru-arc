  text: 'Вчера был как всегда замечательнейший концерт Мишурис Блюз Бэнд в Экспедиции. Ребята отыграли на ура, сочно и с хорошим
    драйвом. Отдельно хочется отметить вокал и гармошку Мишуриса, умопомрачительную гитару Вадима Иващенко и еще меня в этот
    раз почему-то сильно тронул тенор-саксофон... ;) На танцполе атмосферу создавал сами понимаете кто. ;) В общем, было очень
    здорово!

    Но я не об этом! ;)))

    Где-то за неделю до того как на блюз.ру появилась информация о новом альбоме Мишуриса, я почти случайно приобрел его в
    магазинчике "Мистерия звука". Послушал, вдохновился, о чем писал ранее... А вот вчера я увидел настоящий альбом "I got
    money".... у него немного другое оформление обложки, вкладыш и бонус трек с интересной версией "On the bottom". В связи
    с чем у меня вопрос: неужели это была пиратская версия или может быть какой-то малобюджетный вариант? Шо это было? ;)))'
