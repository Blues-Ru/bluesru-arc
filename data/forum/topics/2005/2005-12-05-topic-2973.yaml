  deleted: false
  text: "оказались очень разнообразными. Первая половина концерта, на которой выступали наши, отечественные исполнители показалась\
    \ сплошным недоразумением. В афише значилось, что фестиваль блюзовый, но где он, блюз? Первая группа – вообще не группа.\
    \ Ощущение первой репетиции или концерта для близких родственников: своеобразный репертуар (несомненно известные хиты,\
    \ плохо сыгранные, ноты на гармонике проваливаются, лучше не ругать…). В Gadjes Band приятное впечатление произвел контрабас.\
    \ И все. Да, и еще «Очи черные…» - это был предел. Слышала раньше отдельных музыкантов данной группы, но такого не ожидала\
    \ ни на Международном фестивале, ни от них.\n«Станция Мир» играла, видимо, для своих молодых поклонников из Самары. Увы,\
    \ мне не 16 лет :( Блюза от этой группы я так и не дождалась. А раньше слышала, помню. \nПотом зажглись звезды :) Paul\
    \ Lamb & The King Snakes. Даже не знаю что сказать. Очень- очень. Восторг! Ради такого можно было пережить начало. Профессиональные\
    \ критики гораздо лучше прокомментируют качество игры, артистизм, шутки и эпатаж музыкантов. Это был праздник. Спасибо."
