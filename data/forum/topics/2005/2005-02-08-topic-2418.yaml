  text: 'Был в пятницу в "Доме у дороги" на концерте BD.

    Шел на этот концерт с некоторой боязнью, а вдруг ребята сломались...

    всетаки потеря клавишей и барабанов - серьезно для BD.

    Первое отделение несколько подтвердило мои опасения ...чувствовалась некоторая
    нервозность, но потом все встало на свои места и даже оно и к лучшему.Володя стал
    играть более жестко и бескомпромиссно, с очень интересными гитарными аранжировками.
    Молодцы, было очень здорово и еще отдельное спасибо Сереге Батракову (ударные
    ""Life''n''Joy)...'
