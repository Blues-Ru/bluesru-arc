      subject: отойти теперь без шансов
      deleted: false
      text: "О каком отходе от концерта может идти речь, после этой феерии. Vidar,\
        \ конечно, просто безумный, в лучшем смысле этого слова. То, что он творил\
        \ в соляках, затягивало. Каждый звук был чем-то очень важным, каждый звук\
        \ нужно было услышать и прочувстовать. Ух.\n\nЕдинственное, что в Доме (да\
        \ и в B.B.King) который раз уже расстраивает это отсутствия хотя бы небольшого\
        \ места для дэнсинга. С первых риффов невозможно было просто так стоять на\
        \ месте, но у сцены стояли дополнительные столы, а во-втором зале заметно\
        \ хуже слыно, так как звук туда, почему-то отдельно не шёл.\n\nЯ думаю, что\
        \ весь бар мог бы танцевать под это. Под \"танцевать\" я имею ввиду, конечно,\
        \ выражать своё восхищение музыкой и драйвом, идущим со сцены.\n\nНо, в любом\
        \ случае, если кто-то сомневался идти или нет - такие люди враги собственному\
        \ удовольствию. Концерты такого уровня огромная редкость.\n\n(и, наверное,\
        \ прав был тот, кто говорил, что Бюск в маленьких залах чувствует себя лучше...\
        \ По крайней мере, он весь был тут.).\n\nДа что я всё о Бюске?! Эйрик тоже\
        \ великолепен. 21 год, а такое великолепное чувство блюза. Дикая, но меткая\
        \ гармошка, сильный и проникновенный вокал. \n\nОтойти от концерта, действительно,\
        \ невозможно. Огромное спасибо, Фёдору и other за организацию концертов!"
