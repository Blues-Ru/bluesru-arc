    subject: Праздник -"100 -летие норвежско-российских дип отношений"
    deleted: false
    text: 'Да именно так.. в самом начале концерта на сцену вышла молодая девчушка
      из норвежского посольства и зачитала очень смешной текст о том чему посвящен
      этот самый концерт, а дальше норвеги просто взорвали "Дом у дороги". Такого
      выступления я там еще не видел.

      Бюск выдавал из своего потертого Фендера такие чумовые звуки, что мороз по коже....гитара
      в его руках то словно ревела, то тихо шептала. Играл он на удивление легко и
      это после позавчерашних чудачеств. Мастер...нет слов. Но самое офигительное
      вчерашнего вечера - это дуэт с Эйриком. Сильный вокал и чумовая гармошка Эйрика
      + фантастическая гитара Бюска - это я скажу такая смесь.....

      Кстати, такого количества слушателей на концертах в "Доме" я еще не видел....два
      зала были полностью заполнены. Было много московских музыкантов и немосковских
      тоже.

      Прошу прощения за некий сумбур и патетику, но я еще не отошел от концерта.'
