  deleted: false
  text: "Главный идеолог Кремля потребовал от российских рок-музыкантов лояльности власти...  \n\nЧетверг 31 марта 2005, 10:10\
    \   \n\n     Замглавы президентской администрации Владислав Сурков провел тайную встречу с ведущими российскими рок-музыкантами.\
    \ Кремлевский \"серый кардинал\" хотел добиться от артистов гарантий лояльности власти.\n      \n      Встреча прошла\
    \ в одном из московских отелей и была, по понятным причинам, закрыта для прессы. По словам одного из участников, с Сурковым\
    \ встретились Борис Гребенщиков, лидер группа \"Ленинград\" Сергей Шнуров, Вячеслав Бутусов, продюсер группы \"Сплин\"\
    \ Александр Пономарев, продюсер группы \"Чайф\" Дмитрий Гройсман, Земфира и Лева и Шура Би-2.\n      \n      Изначально\
    \ встреча должна была состояться в Кремле, однако ее пришлось перенести из-за группы Би-2. У ее солистов австралийские\
    \ паспорта и им сложно было бы попасть за кремлевские стены.\n      \n      По данным The Moscow Times, Сурков боится\
    \ повторения в Москве украинских событий. Во время \"оранжевой революции\" украинские рок-музыканты бесплатно играли для\
    \ оппозиции. Сурков потребовал от русской рок-элиты гарантий того, что в Москве подобного не произойдет.\n      \n   \
    \   Сурков не просил у музыкантов ничего конкретного и не угрожал им, но намекнул, что власть на них рассчитывает. \"\
    Власти хотят помочь музыкантам разрешить те проблемы, которые у них могут возникнуть, и рассчитывает на то, что они, в\
    \ случае восстания, хотя бы сохранят нейтралитет\", - цитирует Суркова The Moscow Times со ссылкой на журналиста Олега\
    \ Кашина.\n      \n      Пресс-служба Кремля слухи о встрече комментировать отказывается. Участники встречи также не хотят\
    \ общаться с прессой. Пресс-секретарь Земфиры отказался подтвердить или опровергнуть факт встречи. \n      \n      \"\
    Последние два года власть заигрывает с музыкантами. Это эдакий нежный флирт, легкий секс. Одним дают награды, а других\
    \ зовут играть в Куршавель. Власти понимают, что в случае какого-нибудь катаклизма или выборов можно относительно недорого\
    \ - и это очень важно - обеспечить себе лояльность молодежи с помощью 15 рок-музыкантов\", - говорит известный московский\
    \ продюсер Александр Кушнир.\n      \n      Владислав Сурков когда-то был помощником заключенного в тюрьму Михаила Ходорковского.\
    \ Сегодня он играет роль кремлевского идеолога и политолога. Ему приписывают создание \"управляемой\" многопартийной политической\
    \ системы, а также важную роль в создании пропутинской партии \"Единая Россия\", которая доминирует в парламенте, а также\
    \ националистического движения \"Родина\".\n      \n      Сурков является председателем совета директоров компании \"\
    Транснефтепродукт\" - российской государственной монополии на транспортировку нефтепродуктов по трубопроводам. (NEWSru.com)\
    \  \n\n\nПервоисточник: http://www.inline.ru/polit.asp?NewsID=58408"
