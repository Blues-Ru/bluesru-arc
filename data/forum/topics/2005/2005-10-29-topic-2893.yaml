        poster: Илья Кривандин (Populoss)
        email: ilija@bk.ru
        subject: Прекрасный диск
        deleted: false
        text: "Один из моих любимых. Причем, у Clarence \"Gatemouth\" Brown, например,\
          \ тоже есть диск, где он исполняет музыку Луиса Джордана. Но мне у Би-би\
          \ понравилось гораздо больше. А \"Is You Is Or Is You Ain't My Baby\" с\
          \ Доктором Джоном с этого диска вообще имхо считаю лучшим исполнением этой\
          \ песни. \n\"80\" - очень хороший диск получился, есть еще порох в пороховницах,\
          \ не смотря на возраст. Никогда не мог представить, что мр. Элтон Джон так\
          \ хорошо может вписаться в Rock This House - приятно было послушать и очень\
          \ неожиданно. А, например, \"Funny How Time Slips Away\" - вообще эдакий\
          \ разговор двух умудренных жизнью старцев. Короче - очень позитивный диск,\
          \ слушается легко и с удовольствием (лично для меня).\nИтог: Би-Би был и\
          \ есть великолепен. Естественно есть у него альбомы, которые кому-то не\
          \ нравятся, а кому-то не нравятся другие. Ну тут уж извините, он весьма\
          \ разноплановый музыкант, а всем мил не будешь!"
