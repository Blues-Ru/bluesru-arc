        parent_id: 24231
        date: 2005-11-02 15:02
        poster: Muddy Lives
        email: mlives_6@hotmail.com
        subject: Тут я не согласен
        deleted: false
        text: 'Я все-таки считаю БиБи Кинга одним из самых важных, оригинальных и
          влиятельных блюзменов за всю историю этой музыки.   Как гитарист, они с
          Т-Боном бесспорно пользовалися самым большим влиянием в блюзе.  Как вокалист,
          БиБи тоже прекрасный (По-моему Его лучшее пение относится к 50-ым годам).  Даже
          без гитары он бы очень отличался.  Его свинг и чувство ритма - просто уникальные.  Не
          случайно, что он самый поплярный блюзовый музыкант среди любилей джаза.  Если
          он "популяризатор," nj это потому что он достиг высокого уровня поплярности.  Я
          считаю, что своей популярностью он 100% заслужил.


          Muddy'
        replies:
        - id: 24256
          parent_id: 24254
          date: 2005-11-02 16:08
          poster: Илья Кривандин (Populoss)
          email: ilija@bk.ru
          subject: Соглашусь
          deleted: false
          text: 'что я выразился не совсем точно. Я не имел ввиду, что он был ТОЛЬКО
            популяризатором всегда и целенаправлено. Безусловно, новый слушатель,
            который захочет послушать блюз, купит Кинга, т.к. на слуху, даже у широких
            масс, что Кинг - это блюз. Я хочу сказать, что он благодаря своей популярности
            мог и может позволить себе некоторые эксперименты, которые могут подтолкнуть
            неискушенного слушателя к его музыке и к блюзу вообще в дальнейшем. Многим
            любителям традиционного блюза они могут не нравиться, но он НЕ потеряет
            и этих слушателей благодаря тому, что делает в другой плоскости. Кстати,
            он не только среди любителей джаза самый популярный блюзовый музыкант,
            ИМХО, а вообще среди людей не относящих себя к любителям блюза, но умеющим
            ценить музыку.

            Так вот основная мысь предыдущего поста в том, что это есть и на поздних,
            даже более того, последних альбомах. И за это ему большой респект. Когда
            я услышал его вокал на концерте в позапрошлом году, был просто в шоке,
            конечно, не 50-е, но столько в нем силы еще, что ого-го! Представляю,
            каково было послушать его вживую лет 45 назад!'
