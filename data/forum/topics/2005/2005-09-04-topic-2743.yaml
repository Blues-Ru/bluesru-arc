  text: 'очередной доклад на тему "блюз в восприятии наших современников"

    "Эхо планеты" вот что пишет в номере от 19.08.2005 в рубрике Музыкальный Олимп:


    BILLY''S BAND "Оторвемся по-питерски"

    Grand Records

    Настоящий отрыв не имеет ни географических, ни временных ограничений для собственно отрывающихся. И доказательство тому
    -- эта пластинка, вышедшая уже довольно давно, но актуальности не утратившая. Ведь летом (и не только) можно бух..., ой,
    извините, гулять круглосуточно... Чувственно-акустические по духу композиции одинаково хороши и на германских площадях,
    и в питерских подземных переходах -- как проверка на профессионализм, и на клубных и театральных сценах.

    Не знаю, нашелся ли победитель конкурса на название стиля, в котором играет Billy''s Band, объявленный музыкантами, но
    независимо от цвета ночи, пока выпекается жидкий хлеб, а скамеечки стоят, и будут звучать то разухабисто-балканские плясовые,
    то тягучий лузерский блюз, то надлежаще похмельный уэйтсовский хрип души.

    Да, еще одна деталь: один из лучших российских "слухачей" Руслан Тарасов, эксперт по аудиотехнике журнала "Салон Audio
    Video", включил этот диск в подборку для тестирования отнюдь не дешевой аппаратуры. А это, поверьте, дорогого стоит.'
