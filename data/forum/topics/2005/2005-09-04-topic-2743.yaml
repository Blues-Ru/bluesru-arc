              subject: Всё очень просто
              deleted: false
              text: 'Как-то в журнале читал отрывки из книги Макаревича "Всё очень просто". В 70-ые они группой летом ездили
                на море. Дешевое вино, девушки-студентки из стройотрядов, наверняка и анаша была, море, шашлык, а вечером
                на танцах играть... Блин! Просто рай!!! Так вот, на какой-то там танцплощадке заведующий или культработник
                парка в котором находится площадка ворчал что за музыку они играют: "Твисты всякие там загранишные", видать
                "Шизгару" играли и т.д., что тогда слушали, под что танцевали. Культработник требовал прекратить это безобразиё.
