                Это ж его друг лучше всех играет блюз:

                "...<I>как-то там</I> летит душа

                от саксофона до <I>сами-знаете-куда</I>..." (надо ж!)

                P.S. А ведь было время, где-т 1987-88 гг., когда я всерьёз считал Макаревича лучшим гитаристом страны, а значит
                и одним из лучших гитаристов мира... Полагал что наш советский рок сделает фурор в мировом роке... Гребенщиков,
                Цой, Кинчев...

                > музыкальная безграмотность. Которая является тяжелым следствием изолированности этого общества.

                Грустно мне что так оно и было. И уж совсем не весело что оно и щас так.

                Блин! В то время, когда было валом свободного времени (благо что школьник), какой же огромной радости я был
                лишен. Я даже и не знал имён Хаулин Вулфа, Джона Мейолла, Алберта Кинга, Стиви Рей Воэна, Роберта Джонсона...
                Их и не было в звукозаписях, да и сами кассеты были не дешевы для меня...'
