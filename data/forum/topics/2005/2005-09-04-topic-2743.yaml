              text: 'Шанхайский Блюз Машины Времени. Ещё один кирпичик в формирование мнения что такое блюз.

                Прочим между, Е.Маргулис участник того первого феста Блюз в России в 2002 г. Он играл в Siver Rouble. На пластинке
