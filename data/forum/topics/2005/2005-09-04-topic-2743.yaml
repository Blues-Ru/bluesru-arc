    subject: Мочалкин Блюз
    deleted: false
    text: 'После фестиваля "Блюз в России" в начале 1992 г. по ящику "Вид" показывал телеотчет о фесте. Была там такая фишка:
      народ на улице спрашивали что такое блюз. Отвечали люди никак, ни чущь, ни вдор - лабуда какая-то, неинтересно. Но был
      там один ответик: "Мочалкин Блюз!"

      Думаю что эта песня "Аквариума" прозвучавшая к/ф "Асса" составляет всё представление о блюзе для многих любителей т.н.
      "русского рока".

      Кста, щас по телику идёт фильм "Брат-2", фильм культовый для вышеназванных любителей. Там Маковецкий под дулом обреза
      описывает своего американского коллегу (тож атрицательный типчик: шишка какой-то там мафии). Интересное пояснение: "...владелец
      блюз и рок клубов в Чикаго". В общем, нехороший человек, редиська.'
