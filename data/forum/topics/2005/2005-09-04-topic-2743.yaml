        text: 'В Совке Гари Мур No. 2, а вот No. 1 это нипривзайденная каралева блюза Патрисия Каас. Общеизвесно, она радилась
          на родине <i>настаящего</i> блюза, ва Франции. Её песня "Мадмуазель паёт блюз" навсегда запала в душу нашего народа.

          А кароль блюза это нипадражаемый Луи Армстронг. Он даже написал специально для рекламы "Альфа Банка" песню "Лет
          май пипл гоу" (хатя позже её ещё лучше спел наш джаз-блюзовик Александер Буйнов).

          Как известно, блюз переводится с англиского как грусть, миланхолия. Посему, смело можно причислить <s>к лику</s>
          в число блюзменов наших Т. Буланову (наверное родственница Буйнова, тож начинается на "Бу-" и канчается на "-нова")
          и Гурдскую. Кстати, последняя также как и известный американский певец Р. Чарльз слепая.

          Так что есть и у нас блюзменщики и блюзменки.'
