  deleted: false
  text: 'Не могли бы вы подсказать название композиций или дать названия исполнителей
    которые играют, что-то похожее на блюз южных штатов. Эту музыку можно услышать
    в фильмах, чаще о диком западе, особенно когда "показывают" южан. Такая характерная
    тягучая, не спешная мелодия где солирует гитара. Под неё не поют.


    Как пример: фильм День Независимости(Independent Day). Перед высадкой инопланетян,
    показывают бар в одном из южных штатов, где сидит мужик которого якобы в молодости
    стырили инопланетяне. Там как раз "та" музыка.


    Извините, за некий сумбур. :)'
