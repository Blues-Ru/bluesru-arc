        - id: 22409
          parent_id: 22402
          date: 2005-08-22 18:22
          poster: Muddy Lives
          email: mlives_6@hotmail.com
          subject: Один пример полезности дискографии
          deleted: false
          text: "Приезжает в Москву John Primer, который играл в последней группе Muddy Waters.  К сожалению Primer никогда\
            \ не имел возможности играть с Muddy Waters на его дисках.  \n\nВопрос: Cуществуют какие-нибудь записи Muddy Waters\
            \ c John Primer?\n\nОтвет: есть три знакомые записи \"live\" c John Primer\n\n1) Chicagofest, Navy Pier, Chicago\
            \ 16/8/80\n2) Iowa State University. Ames, Iowa  9/11/81\n3) Checkerboard Lounge, Chicago 22/11/81\n\nК тому же\
            \ первая запись - только одна песня, которая вышла давно на пластинке XRT.  Большинство второго концерта вышло\
            \ на Charly (1257).  Одна часть третьго концерта вышла на Swingin' Pig (1152), но не все песни, в том числе версия\
            \ Your Gonna Miss Me, где John Primer поет.\n\nГолова кружится от количеста собранной информации.\n\nMuddy"
          replies:
