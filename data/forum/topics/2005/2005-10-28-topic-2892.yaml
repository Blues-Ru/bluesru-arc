      text: "Билет без места означает: кто первый встал, того и тапки. То есть никто никому сидячего места не обещал. Столы\
        \ есть, если рано приехать - можно занять место. Реально видно только в 30-50 метрах от сцены, но по бокам большие\
        \ экраны с крупными планами. \nЛюдей с фотоаппаратами видел, хотя в билете написано, что фото-видео-аудио - низззя.\
        \ Никого вроде не повязали.\nГардероб там есть.\nКлимат - не душно, скорее прохладно. Грейтесь телодвижениями.\nГлавная\
        \ мелочь, на которую надо обратить внимание - не обращать внимания на мелочи и получать удовольствие от музыки и жизни.\
        \ :)"
