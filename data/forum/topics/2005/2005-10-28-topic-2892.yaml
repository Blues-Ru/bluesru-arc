      text: "Тут всё о высоком в основном: звук там какой был, кто круче Стиви Рэй, Отис Раш или Маджик Слим ну а у меня вторая\
        \ серия: \"Назад к сортирам\".\nА что с сортирами? Да ничего, нормальные блюзовые сортиры:) Конечно немного удивило\
        \ и смутило большое количество женских особ в \"мужской\" очереди, но всеобщая деликатность , понимание момента, и\
        \ отсутствие пошлых шуточек, весьма подняло мое мнение относительно нынешних мужиков (допустим не всех, а слушающих\
        \ блюз:)) Что еще из мелочей...\nПожалуй всё, хотя нет еще пару бытовых моментов отметил бы.\nПервый. Уж если пиво\
        \ \"пустили\" на мероприятие, то надо сделать его\nдоступным: либо количество штуцеров увеличить, либо цену приподнять:).\n\
        Второй. Немного напрягало некоторое количество людей\nуже на концерте понявших, что действо не имеет ничего общего\
        \ с \"фабрикой звезд\". С кислыми физиономиями они мучительно ожидали окончание концерта, но покинуть его раньше почему-то\
        \ не решались: то ли жаба душила, то ли врожденная воспитанность не позволяла:) Хорошо что таких \"бацилл уныния\"\
        \ в зале были единицы и от них можно было легко слинять в сторону.\n   Все остальное БЛЮЗ. Отличный качественный блюз\
        \ выше всяких похвал, гремел в этой стекляшке и заводил всех от седых старушек до юных отроков неизвестно как попавших\
        \ на это мероприятие. В копания о том кто был лучше, кто хуже, где был звук и какой, даже не хочется вступать, настольно\
        \ это мелочи по сравнению с тем, что выдали великие\nмэтры за эти три часа. Отличный концерт с великолепной атмосферой\
        \ всеобщего праздника и блюзом как в ушах так и в душе. Огромное спасибо организаторам и музыкантам."
