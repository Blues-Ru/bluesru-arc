    text: 'Я первый раз иду на этот фестиваль, хотелось бы узнать как

      он организован в частности:

      Что значит билет без определенного места? мне сказали что там какие-то столики. За ними видно что нибудь, или надо приходить
      раньше и искать место ближе к сцене?

      Пропускают ли в зал с фотоаппаратом и можно ли там фотографировать?

      Давно был на ВДНХ и еще давнее в 20-ом павильоне, может поэтому не припоминаю там наличие гардероба, или сейчас есть?
      И какой климат в зале, прохладно или душно?

      Ну и может еще какие-то мелочи на которые необходимо обратить внимание?

      Спасибо.'
