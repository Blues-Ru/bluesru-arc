      deleted: false
      text: 'Ну, для начала, о мелочах:

        Столики со скамьями там есть, их не так много, они достаточно далеко от сцены. Мы вчера пришли где-то в 6:15 - почти
        все столы (по крайней мере лучшие места) уже были заняты. А сегодня планируется больше народу в связи с пятницей,
        так что....

        Гардероб есть, пиво есть, какая-никакая еда есть, курить можно (хотя у входа в туалет висит предупреждение о штрафе
        в 500 рублей ;)), туалет есть соответственно (туда в перерыве между исполнителями очереди). Бесплатные маршрутки от
        главного входа ВВЦ начинают ходить в 18:00. У главного входа ВВЦ стоит маршрутка - касса. Вчера там были билеты по
        500 рублей...

        Когда выходят музыканты танцпол перед сценой забивается достаточно плотно (можно, кстати, сидеть на ящиках). Но со
        столов все равно всё видно (тем более есть прекрасные большие экраны и оператор работал неплохо).

        Вот... а теперь о главном:

        Хуже места придумать было нельзя. Всё что говорилось ранее о звуке и акустике - правда. Так себе был звук, скажем
        честно... Однако это не смогло омрачить такого праздника.

        Первыми выступали Teardrops. Здорово, но в ожидании выхода Слима я их слушал почти в пол уха. ;)

        Но Слим не вышел!!! ;) Вышла Биг Тайм Сара! Совершенно очаровательная исполнительница! Вот ее бы я с огромнейшим удовольствием
        послушал бы в маленьком клубе с хорошим звуком... Эх.. И как она здорово умеет shake her thing.... ;)))

        Потом, собственно говоря, был Слим. Не знаю, у меня остались какие-то скомканные впечатления. Он показался мне несколько
        вялым. Ожидал большего. Постарел Magic. Может показалось - сегодня проверю.. ;)

        А после великолепного дуэта Сары и Слима появился и сам Король Зайдеко. Вот он был вчера в ударе! Валентин, не переживайте,
        живой танцевальной музыки будет много! ;)))

        Короче говоря, всем рекомендую! Увидимся на Эфесе! ;))'
