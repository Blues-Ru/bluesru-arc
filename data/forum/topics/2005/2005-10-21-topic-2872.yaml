  text: "One of the founding fathers of rock & roll, BO DIDDLEY celebrates his 77th\
    \ birthday on Friday December 30th 2005 and we encourage all his many fans around\
    \ the world to sign the BO DIDDLEY-The Originator website Guestbook with their\
    \ birthday greetings and messages.  \n\nAs we always do at this time of the year,\
    \ we are making special arrangements for BO DIDDLEY to view each and every one\
    \ of your greetings. This is an opportunity for you to convey your appreciation\
    \ and best wishes to one of the undisputed legends of rock & roll and a true original,\
    \ on the occasion of his 77th birthday. \n\nPlease sign the Guestbook, located\
    \ at http://members.tripod.com/~Originator_2/guestbook.html and show your support\
    \ for The Originator - BO DIDDLEY. \n\nThank you very much.\n\nDavid Blakey, Webmaster,\n\
    BO DIDDLEY-The Originator\nhttp://members.tripod.com/~Originator_2/index.html\n\
    A Celebration of his unique contribution to Popular Music.\n1955 to 2005 - Celebrating\
    \ 50 Years In Music!"
