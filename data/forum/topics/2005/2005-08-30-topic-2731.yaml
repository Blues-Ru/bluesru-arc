  text: Это был вечер презентации диска г-на Мишуриса и К под символическим названием I got money. Вечер получился феерическим,Михаил
    был в ударе,вставал на стул и т.д.Вся группа играла с удовольствием после двухнедельного отпуска,атмосфера была просто
    великолепная.Посетили мероприятия гг.Романенко и Евдокимов,Каверкин.Играл часто присоединяющийся в последнее время к группе
    Миши г.Циганков...Особо выдающимся деятелям раздавали диски бесплатно с автографом Миши,а один диск был выловлен со дна
    ведерка с водкой,из которого по очереди угощались участники оркестра и почетные посетители клуба и был подарен мне,грешному...Удалось
    зажечь очень неплохо...В общем,большое спасибо Мише,его группе и всем участвовавшим в этом мероприятии музыкантам...По
    поводу диска - запись студийная,а вообще очень хотелось бы иметь еще и концертную хорошо сделанную запись,ибо в таком
    исполнении Миша с группой выглядел бы более выигрышно...
