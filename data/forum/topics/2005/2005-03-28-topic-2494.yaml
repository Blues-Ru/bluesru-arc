  subject: Маленькая просьба.
  deleted: false
  text: 'Попросили меня написать статью о российской блюзовой сцене.

    Памятуя о том, как реагировала общественность на статьи различных авторов

    Предлагаю следующее:


    1. Музыканты - расскажите о себе. Кого-то я знаю. Кого-то не очень.

    Последние полгода за сценой следил краем глаза. Вдруг кто-то новый объявился и зажигает по полной.

    Ссылки на ваши МП3тоже пригодятся :)


    2. Слушатели - расскажите о клубах, где вы блюз слушаете. О фестах. Об ощущениях.

    Мнения. Суждения. Забавные истории тоже пригодятся :)


    Также приветствуются исторические зарисовки. Воспоминания о концертах и фестах. Хронологии :)


    Постарайтксь при этом избежать перепалок в жанре: "Да ты кто такой? Это я, кто такой!?"'
