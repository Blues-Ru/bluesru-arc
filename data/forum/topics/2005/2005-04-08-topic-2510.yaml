    text: Прежде всего-Роберт Джонсон. У Бадди И Джуниора Уеллса есть еще один чудный акустический live альбом:Last time around. У Уеллса есть еще альбом с приглашенными слайд-гитаристами come on in this house -тоже тема!(хотя он и не совсем акустический) Также:Corey Harris,John Cephas и Phil wiggins(Cephas-гитара,Wiggins-гармошка)- это современники;из музыкантов прошлых лет Skip James,Leadbelly,Blind boy Fuller;очень интересен Lonni Johnson(он более джазовый товарищ,один из первых кто фактически пытался играть джаз на гитаре); Ну еще не надо забывать Charlie Patton(отморозок был полный)-один из основателей delta blues,потрясающе исполнял spirituals(видимо потому что много грешил=),а в одной из его вещей:кажется Jesus is a dying  bed maker,присутствует то что называется сейчас телегой,рэп короче говоря,хотя это конец 20-х,начало 30-х годов),Son House-тоже стоит ознакомиться-все это так сказать корни музыки блюз
