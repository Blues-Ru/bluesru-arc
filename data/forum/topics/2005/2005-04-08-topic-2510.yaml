        text: "Сегодня набрёл в eMule'e на две акустических песни Hendrix'a - одна из них точно его (т.к. это видеозапись из Royal Albert Hall), а на счёт второй я очень сомневаюсь. Если кто нибудь хочет попробовать идентефецировать то вот ссылка в осле: ed2k://|file|jimi%20hendrix%20-%20Instrumental%20(Acoustic).mp3|14430470|F3E05FEFD81FD6FD93DC02F6390CBBCC|/\n\n И ещё вопрос, кто нибудь знает что нибудь об акустических \"опусах\" Hendrix'a - т.е. какие вообще диски\\песни существуют? Спасибо."
