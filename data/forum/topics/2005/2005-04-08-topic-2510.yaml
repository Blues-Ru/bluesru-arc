    text: 'Даже не знаю как точно тебе ответиь. Скажу так: начиная с конца 60х до нашего. Я так же понимаю, у блюза много всяких ответвлений типа Delta, Folk... Понимаю в этом я не много и поэтому прошу если можно просто выложить список с как можно большим количеством имён, а я уже по мере прослушивания сам отсею.. Те стили в акустическом ритм-н-блюзе каторые мне наиболее нравятся это, как я уже писал раньше, албом Alone & Acoustic by Buddy Guy and Junior Wells а так же, например у Hendrix''a есть песня Hear my train is a comin'' в акустическом варианте, вот. Спасибо за отзыв. И сорри за некомпетентный вопрос.'
