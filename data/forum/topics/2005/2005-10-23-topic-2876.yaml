  text: "http://www.efespilsener.ru/press/?id=45\n\nЗа последние несколько лет Buckwheat приобщил к стилю зайдеко больше людей, чем кто-либо за всю историю музыки. Buckwheat Zydeco - это одна из лидирующих «праздничных» групп. Виртуозный аккордеонист Buck может с легкостью переключаться с двух аккордов, характерных для зайдеко, на 12-аккордную блюзовую мелодику, присущую классическому жанру. Он стремителен, его техника проворнее любого другого исполнителя из Луизианы, а музыка вынуждает танцевать публику так, что трясутся стены. Buckwheat - обладатель нескольких престижных музыкальных наград, у него многомиллионная армия поклонников, и он является правящих королем царства зайдеко! \n\n\nкакаяже всетаки крутая в классическом блюзе мелодика :))"
