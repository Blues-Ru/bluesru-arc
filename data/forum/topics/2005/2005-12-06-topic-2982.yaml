  text: "Вышел потрясающий диск Otis Rush на Delmark Records: All Your Love I Miss Loving: Live at the Wise Fools Pub: Chicago.  Концерт был записан в Чикаго в 1975-ом году, но только сейчас выходит впервые на диске.  Отис в прекрасной форме!  я в восторге.  Очень рекомендую послушать:  \n\nhttp://www.allmusic.com/cg/amg.dll?p=amg&sql=10:giftxqtdldde\n\nПосле тяжелого инсульта в прошлом году Отис пока еще находится в плохом физическом состоянии.  Слава богу за эту неожиданную возможность снова его сушать в полную силу, как он играл когда-то в Чикаго.  Легенда бессмертная.\n\nMuddy"
