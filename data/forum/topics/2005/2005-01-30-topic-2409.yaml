    email: fedor@blues.ru
    subject: Led Zeppelin
    deleted: false
    text: На мой взгляд, - супер-группа. Играла рок-музыку, разумеется, под сильным влиянием американской традиционной музыки,
      в т.ч. и блюза. В раннем творческом периоде есть много блюзов по форме, в частности, и позаимстованных у блюзовых классиков
      (особенно, на Led Zeppelin II). Однако, влияние рока очень сильно, и стиль группы блюзом я бы не стал называть.
    person_id: 2
