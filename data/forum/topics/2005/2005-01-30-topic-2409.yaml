    text: "Однако 2 песня на всех альбомах - блюз.\nПлюс - довольно мощное влияние кельтской музыки.\nСплав своей народной\
      \ (кельтской) и заимствованной  (блюзовой) музыки. Потому то наверное и интересны. Кстати, и пост-цепелиновские альбомы\
      \ музыкантов тоже весьма забавны.\nДа, и гитарист там неплохо играл... :-)И в результате они вроде как и оказали влияние\
