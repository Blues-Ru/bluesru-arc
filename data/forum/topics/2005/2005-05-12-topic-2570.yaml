  text: "Комментарии: В Питере скоро должны состояться два концерта группы \"Ключ\"\
    \ под управлением Владимира Голованова. \nКОНЦЕРТЫ: \n15 мая, воскресение \n\n\
    Клуб \"АРТ-АКУСТИКА\"\n\nул. Наличная, д.3 (напротив Ленэкспо, вход со двора),\
    \ м. Василеостровская, Приморская \n\nначало в 19-00 \nВХОД СВОБОДНЫЙ! \n\n--------------------------------------------------------------------------------\n\
    \nклуб КАМЧАТКА\n\n\n30 мая, воскресение, с группой \"Магнит\"\n\n\nул.Блохина,\
    \ 15, м. Спортивная \n\n\nначало 19-00.\nЕсли вы живете в этом городе или захотите\
    \ туда приехать в этот период, милости просим на концерт.\n22 мая будет сейшен\
    \ в поселке Токсово (Ленинградская область), там будет проходить фестиваль \"\
    Солнечный Дождь\".\nИнформацию о группе можно получить на сайте: www.kotmatrs.rinet.ru/art/kluch.html\
    \ - там есть история группы и два видео-ролика, записанных на концерте, а также:\
    \ www.kotmatrs.rinet.ru/art/golovanov.htm - там есть песни с альбома \"Имя Рек\"\
    . Также ссылка на группу есть в разделе \"друзья\". Сайт группы: Key.post.ru\n\
    kluch.kulichki.ru\nАдресс: kluchnew@mail.ru"
