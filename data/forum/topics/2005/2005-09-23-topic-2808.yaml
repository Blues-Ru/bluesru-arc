  text: Когда наш юный саксофонист Олег узнал что во время нашего выступления в B.B
    King туда придет Дио, то вместо ожидаемого "Круто!" последовало лишь "А кто это
    ?" Да, теперь уже чувствуешь что превращаешся в смешного oldie со своими муз.пристрастиями
    детства \впрочем,по Дио я не зарубался никогда\.Он пришел в клуб вместе со всей
    группой,выглядел усталым, но очень дружелюбно общался и "звезду" не давал. Благодаря
    некоторым провокационным действиям Андрея Евдокимова у меня теперь будет фотография,
    где Дио держит мой CD который гостю был вручен. Это не менее забавно,чем моя фотография
    с пластинкой Дио\ если бы такая существовала фотография\. Детство кончилось когда-то
    \ведь оно не навсегда\, а наш юный саксофонист Олег так и не понял,наверное,чего
    это вокруг этого маленького пожилого иностранца столько суеты.Распрощавшись с
    монстрами хард-н-хеви поспешил я в дом у дороги на концерт Джона Праймера. Вот
    ведь Москва,мегаполис,блин, кого не встретишь только :от металлиста из Лос Анджелоса/?/
    до чикагского блюзмена.А про Праймера напишу позже,когда съезжу с ним в Рязань
    и впечатление будет полным.
