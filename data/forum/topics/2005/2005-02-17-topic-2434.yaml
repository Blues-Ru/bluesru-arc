  text: "Продается диск Howlin’ Wolf – London Sessions – ремастированный, юбилейный, с бонусами на целый второй сидюк. Издание шикарное, но 45 баксов??? Я понимаю, что Edition – Deluxe, но сравните цены: <a href=\"http://www.cduniverse.com/search/xx/music/pid/5276361/a/London+Howlin+Wolf+Sessions++Deluxe+Edition.htm\" target=\"_blank\">http://www.cduniverse.com/search/xx/music/pid/5276361/a/London+Howlin+Wolf+Sessions++Deluxe+Edition.htm</a>\nИ тут же рядом переиздание европейских записей Memphis Slim - Paris Mississippi Blues. Шикарная музыка, великолепное издание, отличный буклет, черно-белые арт-фотографии с хорошей статьей и точным описанием каждого трека (где записано, кто играет, прочие обстоятельства) – мечта коллекционера! Стоит 377 рублей. Почему? Edition не Deluxe?\nИ еще... В комиссионном разделе лежит диск Морюда – с автографом!.. То есть, на концерте понравилось, захотелось купить, автограф взять – но вот года не прошло – разонравилось и вспоминать не хочется, лучше сдать за 3 бакса? =) \nНу ладно... всяко бывает."
