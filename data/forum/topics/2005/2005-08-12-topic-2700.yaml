        subject: Не могу молчать
        deleted: false
        text: "22 и 23 сентября Праймер действительно будет играть в ЦДХ, а вечерами - в Доме-у-дороги и Ритм-н-Блюз кафе. 24-го - клубный концерт в Рязани. Идея у нас была следующая - пригласить не суперзвезду (это дело больших концертных агентств), а просто хорошего чикагского блюзмена. \nПосмотреть здесь, как это сейчас реально происходит там.\nИграть с ним будут люди, специально для этого подготовленные (есть два варианта, но об этом пока не буду говорить). \nDirty Dozen и ЧХ (каждый в свой день) будут играть первый сет в ЦДХ, предваряя сет Джона Праймера. \nБилеты в ЦДХ пойдут по 250 р. (15 ряд), 300 (12-14)... и до 500 (3-4 ряд). На www.artup.ru или по тел. 238 19 55 можно узнать, когда билеты будут в кассе, и даже их заказать с доставкой. В понедельник они не работают.\nЗаранее спасибо всем, кто расскажет о концерте друзьям и придет послушать."
