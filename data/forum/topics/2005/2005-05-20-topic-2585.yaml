          text: "Здесь очень любят критиковать и ворчать- \"нет филинга\", \"у нас вообще никто играть не умеет\" и т. д. Это очень серьёзно! У людей, играющих блюз и читающих этот форум может начисто отпасть желание это делать! Либо надо быть ОЧЕНЬ большим фанатом своего дела и плевать на всё это, в противном случае очень сложно. Многим здесь досталось- и Петровичу, и Воронову, и менее именитым. Кому это понравится, тем более если человек это делает от души. А здесь такое мнение как в средние века, когда композитор становился великим только после своей смерти, а здесь и после смерти не дождёшься. Слишком много негатива.\n А в попсе всё гораздо проще- там нет такого понятия как \"поп-филинг\"- сыграл правильную ноту- и хорошо, и молодчина."
