  deleted: false
  text: 'Новые Известия опрашивают музыкантов, что они слушают.

    одним из музыкантов оказался Владимир Кузьмин:


    – В основном я слушаю старый джаз, кантри и блюз-рок. У меня большая коллекция блюз-рока – 42 пластинки. Называть фамилии этих музыкантов бесполезно: их никто не знает. Попсу вообще не слушаю. Ни американскую, ни русскую. Самое последнее, что я купил, – Джонни Митчелл с песнями Боба Дилана и других.

    -----


    Что ни слово - золото! А кто что знает про альбом Митчелл с каверами? Я пропустил что-то важное? =)'
