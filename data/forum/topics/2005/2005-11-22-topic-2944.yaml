      subject: клавиши...
      deleted: false
      text: 'Это надо звуковику вопрос задавать. К сожалению, у нас нет хороших звуковиков в клубах. Все дают много обработки и мало что смыслят в звуке (обычно они мало получают и вообще не профессионалы; а я сам не могу следить за всем этим со сцены - там другой мониторный звук). Своего у нас пока нет.


        Иногда мы играем только блюзы. Всё зависит от места и состава. Вчера был странный день и получилась вот такая программа. Дэйв еще на ходу много что придумывал - настоящий jam-band. Блюзы мы играем в БиБиКинге, в Доме у Дороги, в Курсе. Не все клубы и пабы позволяют играть блюз, на самом деле.'
