  text: "это было очень здорово. Звук конечно был загадочный.. там где мы сидели все было слышно неплохо, но тиховато.. народ еще жаловался из разных мест на разное.\n\nНо вообще это конечно супер группа с супер пониманием музыку.. блюза и свинга (тоже его было оч много).. пульс у группы невероятный.. музыканты все отличные :) Выступление было гораздо более содержательным чем в горбушке... хотя с другой стороны в горбушке было мощно, а тут было скорее изыскано :) \n\nКстати на концерте видел УЖАСНЕЙШУЮ ВЕЩЬ!! Гитарист Крис Вэйчон играл великолпнейшее соло в вещи In The Open Фредди Кинга... но гдето на 8ом такте последнего великолепного квадрата, прямо посреди душещипательной фразы - вокалист группы Марк Дуфренс перебил!! откровенно перебил этого заслуженного гитариста громким объявлением его имени и соотвественно аплодисментами зрителей....\nНадо будет им рассказать, что с таким отношениение в России пути к блюзу нет!! Чтобы ребята в следующий раз подготовились.\n\n.... да меня заело :))) но это не какой то там факт.... это именно так все и было на самом деле! \n\nА вообще супер супер супер... мы всей группой получили очередной заряд просветления :))) \n\nА Николай Арутюнов пел к сожалению неудачно - очень плохо по ритму, вообще не со всеми... У него свой грув  с загоном у группы свой с раскачкой и железным временем.  Ну чтож поделать."
