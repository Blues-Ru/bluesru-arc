    subject: Я скептичен...
    deleted: false
    text: 'Тут как всегда два вопроса - что и где? Все усилия промоутеров направлены на "где", а со "чтом" лучше у нас от их усилий не станет. Любую группу, при желании, можно послушать в 20 местах, выбрав под свой вкус. От того, что тех же исполнителей воткнешь в непривычную обстановку, лучше не станет. Я когда-то много убил времени и душевных сил, чтобы организовать что-то типа "Беляева-2". Но теперь понимаю, что сегодня это - совершенно бессмысленно. Блюзовая сцена перегрета, группы играют какое-то невозможно количество концертов, поэтому единственная надежда - на случайных посетителей ресторанов. Даже, если все клубы вообще закрыть, кроме, например, Дома у Дороги, то блюзовой музыкальной программы в городе и то будет предостаточно.

      Я вообще убедился, что единственный путь развития, - географическая экспансия. Нигде - ни в Норвегии, ни в Америке никто в одном городе больше, скажем, 4-х концертов в месяц не играет.

      Однако, если уж делать упорно понедельники, то нужно, конечно, кино и прочие пироги.'
