    text: 'Дойл играет так, как играли и играют многие (Алберт Кинг, Бобби Вумак и т.д.)


      Джеймс Тейлор - певец, гитарист, автор, продюсер, супер-звезда фолк-рока и стиля Singer-songwriter. Начинал в одной
      группе со знаменитым гитаристом Дэнни Кортчмаром, они также вместе учились. У Джеймса великолепный голос и гениальные
      песни (с хорошими текстами). Довольно много хитов, хотя он никогда не играл попсу. Карли Саймон (знаменитая певица,
      гитаристка и т.д.) была его женой в 70-е. Первый сольник ДТ вышел на фирме Эппл, Макка играет на басу в одной песне
      (он также есть с Линдой и на других альбомах). ДТ до сих пор пишет альбомы, и все они хорошие (как минимум). За все
      эти годы (с 1968) с ним играли лучшие из лучших (считали это за честь). Он умница, талант, интересный человек и необыкновенный
      вокалист.'
