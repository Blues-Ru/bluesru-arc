  text: 'Сейчас смотрю Eric Clapton - Crossroads (Guitar Festival) и там удивил меня Doyle Bramhall II, он левша, а играет
    на гитаре для правши.Скажите: "Ну и что? Хендрикс играл тож на гитаре для правши..." Дело в том, что у Брамхолла гитара
    настроена тоже для правши, т.е. тонкая струна сверху. Странно, что же это его отец (друган и соавтор многих песен SRV)
    не научил его как было б прально?

    А вот собственно что я хотел бы спросить: на этом видео есть некто James Taylor. Савсем мне он нипанравился. (но ему там
    аккомпонировали знатные перцы: Стив Гатт, Джо Уолш). Так кто такой James Taylor?'
