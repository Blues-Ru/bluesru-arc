  text: "Вот такая вот новость прочитана на http://www.bluesnews.ru/news/?id=2239\n<b>Королева отметила заслуги John Mayall\
    \ перед империей</b>\n<i>На прошедшей неделе в связи со своим днем рождения королева Британии подписала список граждан,\
    \ причисленных к аристократии. Титул Officer of The British Impire был присвоен «отцу британского блюза» Джону Мэйоллу.\
    \ Пару лет назад подобной же чести «за заслуги перед отечеством» был удостоен легендарный гитарист Джимми Пейдж. Сам Джон\
    \ через своего пресс-агента отреагировал лаконичным благодарственным заявлением, в котором, в частности, говорилось, что\
    \ награда явилась сюрпризом для артиста, представляющего блюз. \nФэн-клуб Мэйолла сообщил, что во время одного из концертов\
    \ в Калифорнии Джон прямо на сцене вручил подарок – золотые часы – своему давнишнему барабанщику и другу Joe Yuele. Оказывается,\
    \ исполнилось аккурат 20 лет, как Джо служит в группе «Блюзбрейкерс».\nАК 17.06.05</i>\nКак я понимаю, officer тут означает\
    \ не чиновник и не офицер. Тогда что это означает?\nМожет что-то типа Officer - кавалер ордена IV степени?"
