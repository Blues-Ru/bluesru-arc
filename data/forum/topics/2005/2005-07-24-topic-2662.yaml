  deleted: false
  text: 'Я держу вруках диск The Roots of Led Zeppelin. Пластинка произвела на меня сильное впечатление. Она издана в качестве
    приложения к английскому журналу Mojo — в каждом номере есть пластиночка. Здесь собраны 15 классических треков, которые
    вдохновляли великую группу в период, когда она начинала свое творчество.


    Первый трек — Литтл Ричард, Long Tall Sally. Это та самая песня, которую слушает Шварценеггер с компанией, когда они летят
    на дело в начале фильма «Хищник». Именно эту песню я пел в самом начале, до «Ва-Банка», когда только начал заниматься
    рок-н-ролом. Сорвал тогда себе глотку, потому что всегда брал оригинальную тональность — соль-минор, подстраивая свой
    баритон под откровенный тенор Литтл Ричарда. Так вот, оказывается, какая тональность инспирировала Led Zeppelin! Еще очень
    воткнул легендарный Роберт Джонсон, которого многие считают непревзойденным королем блюза. Здесь его песня Travelling
    Riverside Blues. Как известно, все свои песни он написал однажды в студии чуть ли не единым махом, и ему посвящен знаменитый
    фильм Crossroads, который я недавно купил на пиратском DVD на Горбушке. Этот фильм построен на легенде о том, что Джонсон
    на самом деле записал тридцать блюзов и последний из них пропал. Может быть, это лучший фильм про блюз и рок-н-ролл. Всем,
    кому интересна душа этой музыки, рекомендую его посмотреть.


    И абсолютным открытием для меня на этом диске стала песня Baby, I’m Gonna Leave You. Я всегда думал, что эту великую песню
    написали Led Zeppelin, а оказалось, что даже не Джоан Баэз, которая поет ее на этом диске. Изначально эта песня принадлежит
    к репертуару фолк-певицы 50-х Ани Бредон. Не говоря уже о том, что внимательное ухо расслышит на этом диске, откуда Джимми
    Бэйдж черпал вдохновение для своей великой гитары. In My Time of Dying — еще один потрясающий блюз, авторы которого тоже
    не «цеппелины», а Блайнд Вилли Джонсон. Есть там и Матти Уотерс, и Хоулин Вулф, и другие потрясающие люди.


    Это пластинка-откровение. Чем большее ее слушаешь, тем лучше понимаешь, насколько глубоки корни гигантов и насколько их
    культура перерабатывалась и делалась их музыкой. Самое важное, что ты начинаешь понимать, — это то, что ничто не рождается
    на голом месте, существует традиция. И я для себя понял, насколько важно обращаться к Вертинскому, Козину, Утесову, Лещенко.
    Потому что это — наши корни, и если ты их не будешь знать, то ты себя обеднишь как артиста и сделаешь себя площе и примитивнее
    вне зависимости от того, какой тип музыки ты исполняешь.'
