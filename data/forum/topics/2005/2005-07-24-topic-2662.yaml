            (правда, пока они надумали, лично ей уже было ни горячо, ни холодно от такого почета).

            Хукер судился с ZZ Top - тоже миром поладили.

            на мой взгляд, это не было лобовым плагиатом - LZ значительно переработали темы. А ZZTop использовали бугивужную
