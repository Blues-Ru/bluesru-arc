  text: "И практически с первых шагов «Осенний блюз» стал любимым для екатеринбуржцев и жителей области. В этом году «Осенний блюз» соединяет в себе два самостоятельных раздела: «Урожай» и «Флора» \n\nВ программе «Осеннего блюза 2005» состоится подведение итогов городских конкурсов, конкурсы «Хозяюшка» и «Барышня-Капуста», объявят победителей областного конкурса «Лучшая сельская усадьба».\n\n«Осенний блюз» - одна из самых посещаемых выставок в Екатеринбруге. За 3,5 дня КОСК «Россия» принимает более 20 тыс. посетителей. \n------------\nа ведь в этом что-то есть - назвать осеннюю сельскохозяйственную высткавку - блюзом."
