    text: '6 - 9 сентября при поддержке Администрации Екатеринбурга и районов города в КОСКе «Россия» пройдет 19 специализированная выставка - ярмарка «Осенний блюз – 2005». Организаторами выступят управление Россельхознадзора в области карантина растений и семеноводства сельхозрастений, ОГУП «Областная контора пчеловодства», Свердловский Союз сельских женщин. Официальная церемония открытия выставки состоится 6 сентября в 12.00. В программе ожидаются семинары, конференции, мастер-классы и подведение итогов ряда конкурсов: «Страна теремов – Мой дом-2005», «Хозяюшка», «Лучшая сельская усадьба». 7 сентября состоится круглый стол «Стратегический проект «Сады Урала». Закроется выставка 9 сентября церемонией награждения лауреатов и участников.'
