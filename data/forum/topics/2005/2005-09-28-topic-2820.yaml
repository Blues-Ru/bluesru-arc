        text: 'Если это про Рязань ,то могу объяснить: никаких проблем с дамами у сцены не было. Джон попросил ФОТОГРАФОВ
          не лезть обьективами в лицо и сказал что-то вроде:" не мешайте нам ок(??!!)Мы тут пытаемся музыку играть!!!" Сказал
          довольно раздраженно ,правда в перерыве говорил с одним из парней и хлопал по плечу, может извинялся за резкий тон.
          Вроде бы по времени это действительно совпало с танцами,а своеобразный блюзовый акцент нашего гостя мог помешать
          правильно мстолковать происходящее даже человеку английский вполне понимающему. Кстати, это вполне объясняет тот
          факт.что начавшиеся было танцы не продолжились. А я вот ,допустим, не вполне разобрал дико интересную историю закрытия
          известного чикагского клуба Checkerboard Lounge (за правописание не отвечаю, а лезть проверять-лень), которую Праймер
          рассказал мне. Там было что-то про Бадди Гая,его девушку-в общем, чудная чикагская сплетня а я не понял...Эх,не
          там мы учились и не тому!'
