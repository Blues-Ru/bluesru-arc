    text: 'Я не был в Рязани, но очень наслаждался некоторыми его Московскими выступлениями.  До этого момента я только слышал
      Праймера на концертах, когда он работал с Magic Slim. У меня осталось впечетление хорошего и настоящего блюзового музыканта
      Чикаго, который не очень отличается от других.  Я ожидал в Москве "народного артиста," который будет правильно исполнять
      (восстанавливать) классики Чикаго-блюза.  Я совсем не ожидал такого уровня оригнальности и собственного творчества.  Праймер
      прекрасно играет и поет именно свою музыку, он делает блюзовые классики своими. Праймер принадлежит велкой американской
      традиции, которая наверно исчезнет с его поколением.  Всегда будут народные артисты настоящего блюза, но таких, как
      Праймера, уже осталось немного.


      Muddy'
