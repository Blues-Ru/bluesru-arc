  deleted: false
  text: 'Как и обещал ранее,после концерта небезызвестного Джона Праймера в Рязани пишу о своих впечатлениях как очевидец,и
    вполне довольный, где-то даже счастливый очевидец. Начну с того,что выступление в Доме у дороги на меня впечатления особого
    не произвело(хотя многим понравилось). Все бы ничего, но почему-то обламывала ритм-секция- мешала мне она включиться в
    происходящее.Надо сказать, что музыку я воспринимаю только ушами, глаза закрываю и шоу обычно не смотрю, но слушаю.Ну
    и не слушалось что-то мне...Поездки в Рязань ждал с нетерпением, ибо не был ни в ЦДХ ни в Ритм-н-блюз кафе. В Рязани имел
    я счастливый шанс не участвовать в концерте напрямую а просто выкрикнуть погромче :"Дамы и господа,встречайте-Джон Праймер!"и
    далее быть вполне себе свободным. Общение с Праймером началось еще до отъезда - оказался он человеком открытым и разговорчивым,в
    отличие от многих черных блюзменов,которых я видел.Алексей Аграновский представил ему меня почему-то как харписта, а Праймер
    и давай меня пытать:"Что ты чувствуешь когда играешь на гармошке?"чем смутил изрядно. Ехали мы ехали и приехали прямо
    на пресс-конференцию,организованную в пабе "Кэролл" на месте предстоящего выступления.Надо сказать,что журналисты пришли
    подготовленные и вопросы задавали хорошие.Зал был полон задолго до выступления и концерт начался точно по расписанию(Ё!).
    Открывали Аграновский с Братецким под аккомпанимент аргентинского трио. Кстати,ребята-аргентинцы оказались совершенно
    очаровательными людьми преданными блюзу до...В общем,наши люди. Доктора с Сашей публика встретила очень здорово-аплодисменты
    не умолкали.Праймера пришлось вызывать раза три- в общей суматохе ему никто не сказал что пора на сцену и вышел он ,как
    мне показалось, довольно раздраженный, но когда началась музыка все тут же встало на свои места. Очень чутко играла группа,отвечая
    на все нюансы солистов-Омар был супер-молодец! Праймер играл изумительно.Никакой расслабленности,как в Доме у дороги и
    очень"вкусно".Это был настоящий блюз из Чикаго со всеми присущими этому стилю штуками. Это просто гипнотизировало."Традиционалист"
    оказался музыкантом довольно изысканным и не чуждым некоторой гитарной "пиротехники"-мелкие пассажи присутствовали и были
    сыгранны очень аккуратно.Особенно мне понравилось как Джон комбинировал игру пальцами и слайдом-здесь фраза Мадди Уотерса
    превращалась в нечто праймеровское и слушать это было чудо как хорошо.Про пение я даже и не говорю:не обладая мощным голосом
    ,Праймер подает обычный "квадратный" блюз как песню и совершенно естественно выпевает мелодии одна от другой отличные,
    что не позволяет заскучать даже если номера идут в одном ритме и в одной тональности. Это была музыка сыгранная для всех,но
    обращенная к каждому-он не давал гитарного героя или супер-звезду,а дарил людям то,чему научился в детстве в Дельте: то
    что когда-то заворожило нас-юных и непуганных на классических блюзовых записях. Эта штука называется БЛЮЗ и ничего похожего
    нет больше в мире.'
