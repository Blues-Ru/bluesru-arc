    deleted: false
    text: "Информация о фестивале из rockmusic.ru -\n\"Филевский блюз\" в стенах Горбушки\n\nДвадцать четвертого сентября в ДК им. Горбунова пройдет фестиваль \"Филевский блюз\". В качестве хедлайнера выступит британская джаз-фьюжн группа \"Colosseum\". Коллектив образован в 1968 году бывшим участником \"Graham Bond organization\" и \"John Mayall's bluesbreakers\" Джоном Хайсманом. В разные периоды в команде \"засветились\" такие звезды как Гари Мур, Дой Эйри, Нил Мюррей, Крис Фарлоу, Майк Стар и многие другие. Группа распадалась и возрождалась под именем \"Colosseum II\". В конце девяностых музыканты собрались и записали \"Breads & Circuses\" - альбом был с восторгом встречен новым поколением фанов, в результате пришлось переиздать на CD все творчество группы. \n\nХозяева фестиваля - группа \"Лига блюза\", одна из ведущих блюзовых команд России. \"До \"Лиги блюза\" я уже лет десять играл в разных никому не известных ансамблях. И везде сталкивался с одной и той же проблемой - все они хотели быть \"битлами\", а я - однозначно \"роллингом\". Наконец, мне все это надоело, и я решил сколотить свою группу, которая бы целиком концентрировалась на ритм-энд-блюзе\", - сказал в свое время лидер группы Николай Арутюнов. \n\nТакже в фестивале примут участие Arina и группа \"Veto Bank\"."
