    text: 'Известия Казахстан от 30.08.2005 сообщают:

      Три дня Астана жила джазом и только джазом. Улицы города пустовали — народ находился в концертных залах и наслаждался
      творчеством Энвера Измайлова, Кена Арда, биг-бэндов Игоря Бутмана, Александра Аблаева, Якова Хана. А многие, наверное,
      сами того не ожидая и не замечая, на концерты приходили утром и уходили домой лишь затемно. Участники первого международного
      фестиваля «Астана Блюз» признавались, что джаз в стране обязательно приживется — давно они не встречали столь благодарной,
      открытой и музыкальной публики.

      ----

      ну, почему блюз, а не джаз? - вопрос не ко мне'
