                  Джаз-Блюз-Рок клубу - 35 лет>. Здесь на импровизированной сцене обрались известные и любимые многими музыкальные
                  группы Казани - "Дом Кукол", "Волга-Волга", "Макс и компания", "Мураками" и другие, а также коллективы из
                  Ульяновска, Санкт-Петербурга и Москвы, в том числе полюбившаяся многим группа, играющая веселый ска - "Мамульки
                  Бэнд". Для молодежи столицы Татарстана выступили с хитами <Ресницы> и <Вторая половина> гости из Москвы
                  - находящиеся сейчас на пике известности "Братья Грим". Своим сильным голосом порадовала не теряющая популярности
