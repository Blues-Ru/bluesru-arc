  text: 'Сейчас смотрю это видео B.B. King & Friends. Есть несколько вопросов, не
    поможете прояснить некоторые из них?

    - Какой это год? Середина 80-ых, а какой конкретно?

    - Мне товарищ который записал этот диск рассказал в двух словах как эта сессия
    была записана. Я в тот момент был малехо в подвыпитье и смутно помню тот рассказ.
    Что-то типа все ждали до трёх ночи приезда Клаптона и Воэна, самолет которых задерживался...
    Хотелось бы узнать об этом подробнее. Может кто знает? иль ссылку где можно об
    этом прочесть...

    - Видео идет всего 56 минут. Маловато будет :-( Может это урезанная версия и есть
    полная? Или какой нибудь outtake?

    - Albert King. Он левша, но у него гитара для правши (тонкая струна вверху, а
    толстая внизу). У меня создалось впечатление что у него может и другой строй гитары,
    не E-B-G-D-A-E. Так ли это?

    - Etta James. Я не видел её ранее, но думал что она чёрная. Теперь не пойму: местная
    она иль приезжая :)))

    - чушь канешна: Фил Коллинз как туды попал? Да, он тогда в группе Клаптона играл,
    но тогда чё ж нет например Натана Иста? (кстати, а кто там на басе?) Ничего личного
    против ФК (имею в виду не Ф.Киркорова), но как-то не привычно видеть его в такой
    компании.'
