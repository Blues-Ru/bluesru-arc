      это год 1987.


      56 минут маловато? совсем нет.


      Этта всегда была белая и толстая.


      Фил Коллинз - парень из тусовки. Столько он загубил альбомов, но все его приглашали
      в те проклятые 80-е годы. Есть там еще Чака Кан - этот визг слушать нельзя (ее
      70-е тоже ужас).'
