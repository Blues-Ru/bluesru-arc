    text: 'На саксофоне играла жена основателя Сolosseum и барабанщика Джона Хайсмана
      - Барбара Томпсон. И очень хорошо играла!


      Жаль, что не игрались бесподобные вещи из проекта Colosseum II. Но оно и понятно
      - то был совсем другой состав (не считая Хайсмана). Да и не вписались бы они
      в стилевые рамки фестиваля, так как являют собой смесь фьюжна и арт-рока. :)


      Про звук. Звук на балконе, где я сидел, оказался почти изумительным. Все было
      прекрасно слышно. Хотя у меня складывалось впечатление, что зал ДК немного подгуживает.
      И еще редко-редко, но саксофон задвигался клавишными.


      От концерта полный восторг! "Пенсия" показала всем, кто тут почти 37 лет в строю!
      :)'
