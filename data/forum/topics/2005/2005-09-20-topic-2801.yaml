  subject: Альберт Асадуллин об афро-татарской мелизматике
  deleted: false
  text: 'Наша татарская музыка очень органично входит в мировое музыкальное пространство.
    Я, например, нахожу у нее много общего с ирландской и кельтской музыкой.


    - Любопытная мысль, хотя и не бесспорная.


    - Да, это сходство можно проследить, я давно обратил на него внимание, и не только
    я. Более того, сходство есть и с музыкой негритянской, например, с блюзом. Блюзовая
    основа есть во многих татарских мелодиях, народных темах. Мелизматика татарская
    удивительно пересекается с блюзовой мелизматикой. Можно найти общее нашей музыки
    с мелодиями Китая. Какие-то незримые нити связывают татарскую музыку с музыкой
    разных народов. Вот именно это - наша музыка не имеет границ - я и хочу сказать
    своим новым диском.


    - Жаль, что ее не очень много исполняют в мире.'
