  deleted: false
  text: 'Да! Я! Ярый любитель НАШИХ(в масштабах СССР) исполнителей блюза,в том числе и его замечательного оркестра. Блин,ну чем Шомахов или Иващенко хуже.... (это я о гитаристах)? А коллективы Каверкина, Аграновского, Садикова, Петровича и Мишуриса опять же? А послушайте последнюю пластинку Гии это ж полный ... в общем красота.Мне тут Вова Русинов нарезал от души всяко-разно музыки.Явно слышимых косяков -море! У НАШИХ бывает гораздо меньше,ей-ей.А вообще-то, хорошенько выпив :)), пришел к выводу что наши блюза прирастают ....ну явно не московскими музыкантами, что в общем-то отчасти удручает,но с другой стороны сильно радует... Пианая мысль тьеряется... Но! Очень хотелось бы услвшать бы Серегу Бабаева с его "Бенджамином"(Ашхабад) и Валеру Прохожева(БигВзла,Минск) +Свет@Co чесслово!!!! Бум ждать!!!Ну мож клгда-нибудь... Это очень хорошие люди! Поверьте!!!


    p.s

    До сих пор писаюсь и какаюсь одновременно :)от записи годичной давности "BIG BLUES REVIVAL" которую,так как она есть сейчас,

    и сожалению никто не услылышит :( Офигенный коллектв!!!!!

    Жалкое подобие - на bluesman.ru'
