    text: '...но я считаю что у нас нет НИ ОДНОЙ  блюзовой группы, представляющей общемировой художественный интерес. Есть хорошие солисты, но этого недостаточно. Причины таковы : Во- первых, слабая музыкальная эрудиция исполнителей. Во- вторых, отсутствие школы. В некотором роде, мы ее сейчас создаем. Очень мало специальных мест (клубов) для блюза-третья, но не главная проблема. Только сейчас приличные исполнители стали приезжать, а раньше...Причин хватает. Не могу разделить твоих восторгов, но все же спасибо большое. А нам надо серьезно учиться.'
