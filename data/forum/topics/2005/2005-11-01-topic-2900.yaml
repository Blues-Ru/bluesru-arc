        subject: По поводу эрудиции...
        deleted: false
        text: 'Ну да, у нас все знают ,скажем, Deep Purple или Nathareth, а иностранные музыканты ( особенно блюзовые) вряд ли. Зато имена Johnny Shines или Mose Allison вызывают у наших лишь недоуменное пожатие плечиком, в то время, как любой, допустим, норвежский исполнитель блюза с удовольствием поговорит об этих очень известных исполнителях. Про соул музыку я вообще не говорю...Я не самый большой эрудит, но за некоторыми исключениями с нашими музыкантами говорить вообще не о чем (я музыку имею ввиду естественно).Джаз туда, фьюжн сюда, Пасториус... Одни и те же имена мусолятся и перетираются тыщу раз и в результате все басисты ждут, когда им соло дадут, а элементарный ритм сыграть не в состоянии. Я уже больше 10 лет бенды организую и все время слышу: Мэтини то, Скоффилд сё... Если бенд-лидеры еще чего-то там слушают, то барабанщики, басисты etc. вообще нихрена не знают. А с басистом Little Charlie & Nightcats мы обсуждали нюансы исполнения блюза и понимали друг друга вполне. А норвежский барабанщик говорил о Биг Джо Тернере и глаза у него горели при этом... Ну и откуда возьмется школа, скажите ?'
