      subject: Не вполне согласен...
      deleted: false
      text: ">>слабая музыкальная эрудиция исполнителей. \nВот с этим я не согласен в первую очередь. Почему-то я убежден в том, что музыкант во-первых должен любить музыку и любить ее играть, ну и уметь конечно. А быть музыкальным энциклопедистом он вовсе не обязан. И я думаю что многи наши музыканты могут в плане эрудиции дать большую фору многим зарубежным.\n\n>>отсутствие школы\nС этим согласен совершенно, если под школой понимать некую среду, в которой блюзовый музыкант становится блюзовым музыкантом.\n\n>>Очень мало специальных мест (клубов) для блюза\nЯ думаю что это из-за невысокой востребованности жанра и искаженным пониманием его. Над искажением трудится довольно много народу, увы. Да и мотивация для исполнителей в общем-то оставляет желать много лучшего."
