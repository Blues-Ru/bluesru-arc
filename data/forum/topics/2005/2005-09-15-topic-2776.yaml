    text: 'Значит, если я (поклонник Джимми) написал, что на его ЛЕВЫХ, посмертных, концертных записях Джими лажает и играет на ненастроенной гитаре (что истинная правда), то это провокация. Сам Хендрикс НИКОГДА бы не издал эту жуть.



      А если бы я написал, что Лес Дудек - плохой гитарист, а Ветеран - хреновый басист, то никто бы и не заметил. Понимаешь о чем я, о Модератор?



      Так что НЕ НАДО обсуждать мои СООБЩЕНИЯ, когда они не нарушают правил форума. А то, что тебе, Вове и тем двум нравится грязь Джими на концертах - это чисто ваши проблемы. Мне (и другим) они не нужны.



      Учти, Федя.'
