        Чтобы уточнить свою позицию по данным вопросам. Я когда-то круто фанател от Хенрикса, собрал кучу каких-то бутлегов, некоторые сам слушать потом не смог. Действительно, грязи очень много, и со временем она начинает утомлять, слушать становится тяжело. Хотя посреди грязи встречается большое количество вполне "гениальных" мест. ;) Ну, правда, сейчас мне все это менее интересно, ибо я уже все переслушал и полюбил немного другие аспекты. Но, в молодости прослушать Хендрикса нужно обязательно, на мой взгляд...'
