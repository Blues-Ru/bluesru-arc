  deleted: false
  text: 'Два участника темы про Хендрикса получили взыскание от модератора за дело. Хамить нельзя по правилам, а также, по моим личным представлениям, вообще ни в какой ситуации. Даже, если с кем-то категорически не согласен. Было бы гораздо более авантажно - вежливо написать о том, что ты совсем не согласен с оценками. Сообщения Димы К., на мой взгляд, были по форме весьма провокационными, что вызвало флейм с тенденцией к массовости. Я бы (на моем месте) выбрал бы другую форму высказываний без провокации. Хотя, 100 раз признаю, что правила Дима в данном случае не нарушил.

    Кроме того, на мой взгляд, очень полезно обсуждать почти любые музыкальные темы, даже столь острые. Остается надеяться, что при этом участники форума будут оставаться в рамках, хотя это, может, и сложно...'
