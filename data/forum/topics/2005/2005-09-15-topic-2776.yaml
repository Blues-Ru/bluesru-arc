      text: 'Я внимательно перечитал твои посты на тему Хендрикса и не нашел в самих сообщениях ничего провокационного. В связи с этим приношу свои извинения. Тема, однако, является провокационной, ибо существует очень много фанатичных поклонников Хендрикса.


