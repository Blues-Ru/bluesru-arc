                text: "Я никогда не понимал, почему в некоторых кругах Клаптон считается гигантом блюза.  Как блюзового гитариста, Я его воспринимаю, как одного из многочисленных очень умелых блюзовых гитаристов, которые тем не менее очень затрудяются найти свой собственный голос.  Особого чувства ритма и свинга у него тоже нет.  Как блюзовый певец он просто слаб (по-моему).\n\nКлаптон мне намного больше нравится, как рок-музыкант и композитор таких песен, как Layla, Cocaine, Tears in Heaven.  Вот это я понимаю.  \n\nMuddy"
