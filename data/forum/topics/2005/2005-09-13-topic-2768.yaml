                    subject: Би Би Кинг & Клэптон
                    deleted: false
                    text: 'У Би Би Кинга есть достойная идея популяризации блюза в массах, особенно, в молодежных. Потом, я думаю, он не напрягается такими вопросами - крутой Клэптон, или нет? У Би Би есть известная пластиночка, где и Клэптон, и Ю-ту, и Гэри Мур. Разумеется, участие Клэптона в любом блюзовом проекте повышает его коммерческий успех в разы...

                      Мне лично очень нравятся многие вещи Cream, где Клэптон поет и играет. Мне он ужасно не понравился пару лет назад на московском концерте в качестве блюзового гитариста, очень плохо это было, на мой взгляд.'
