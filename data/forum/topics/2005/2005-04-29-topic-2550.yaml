    text: "Великолепный артист!   Мне особенно нравятся записи его собственной группы\
      \ с Lafayette \"Thing\" Thomas на гитаре. Был потрясающий диск \"The Walk: Jimmy\
      \ McCracklin at His Best (Razor & Tie RE 2124-2).\"    \nИ есть два хороших\
      \ диска ранних записей \"The Modern Recordings (Ace Records)\"\n\nЯ согласен,\
      \ что \"From High on the Blues\" - удачная пластинка.  Среди его более поздного\
      \ творчества мне очень нравится \"My Story (Bullseye Blues NETCD 9506, 1991).\"\
      \    \n\n\nMuddy"
