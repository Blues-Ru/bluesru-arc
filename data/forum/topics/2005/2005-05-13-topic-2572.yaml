  text: 'Обращаюсь ко всем сочуствующим - Вова Кожекин замутил очень крутой фестиваль на 5 дней в не очень у-дачный сезон. Концерты по отзывам - отличные, но публики с билетами крайне мало, в результате Вова может крупно пострадать финансово, что скажется на его желании в дальнейшем чем-либо подобным заниматься на наше же благо.

    В связи с этим я призываю всех сходить на фестиваль, притащив туда как можно больше своих друзей. По нашей блюзовой части особенно это касается воскресенья, когда будет выступать Брозман и Энвер Измайлов. Брозман будет играть две разные программы в ЦДХ и Доме у Дороги, поэтому было бы очень логично вместе с Брозманом прокатиться с первого концерта на второй ;)) Энвер Измайлов крут необычайно, в чем я убедился на последнем гитарном фестивале. Этот тот случай, когда брови от удивления оказываются где-то в районе затылка.......'
