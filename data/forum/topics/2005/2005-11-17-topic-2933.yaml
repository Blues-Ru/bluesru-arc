  text: "он умер за три месяца до того, как я узнал, что он вообще был. \nно альбом - потрясает. оказываетися, блюз не скуксился в веселухе нью-вест-коаста:\nhttp://www.amazon.com/exec/obidos/tg/detail/-/B0002DFQ4A/qid=1132206674/sr=2-2/ref=pd_bbs_b_2_2/103-5327095-3345415?v=glance&s=music\n\nЯ думал, с Папой Джоном Кричем скрипке в блюзе больше нет места. А это не так! Я думал, что мне не нужна новая версия I Ain't Gonna Play No Second Fiddle - и пропустил нечто очень важное.\n\nна горбушке диск можно купить у Олега.\nрецензия для ньюсвика:\nLivin' With the Blues \nVassar Clements\nСкрипичные «переливы» на фоне стандартных гитарных «переборов» пугают только в первых тактах. За интродукцией начинается блюз подлинный и глубокий. И неожиданный. Вассар Клементс прожил долгую жизнь. Из своих 77 лет он был профессиональным музыкантом шесть десятков. Записав под собственным именем всего несколько альбомов, он пользовался непререкаемым авторитетом в сообществе любителей кантри-музыки. И вдруг за год до смерти он собрал в студии мастеров блюза: черных (Боб Кокрэн) и белых (Рой Роджерс), молодых (Дейв Мэтью) и патриархов (Элвин Бишоп), общепризнанных (Чарли Масселвайт) и тех, кто своим путем идет (Боб Брозман). Поющих и играющих девушек не забыл (Мария Малдаур, Рут Дэвис). Пеструю компанию построил по своему разумению. И записал потрясающий альбом, поставив высшую планку в блюзе 2005 года. Стандарты и сюрпризы, сладкий блюз и суровая деревенщина - чередуются с легкостью невыносимости бытия. Веселье на грани отчаяния и тоска под шутки-прибаутки – как и должно в настоящем блюзе. Вы слышали “Green Onions” в акустике?.. Оказывается, он «Жил с блюзом» (а с виду – типичный red-neck). Признался в этом, уходя. Его не стало в августе, в том месяце, когда альбом вышел в свет."
