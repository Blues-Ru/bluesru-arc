  text: 'несколько дней в Рязани проходил фестиваль "Лето. Джаз. Фонтан". Во второй день на городской площади состоялся концерт,
    о котором пишет рязанский печатный орган "Совет директоров":

    "Кстати говоря, вёл концерт Михаил Мишурис, чей белый костюм, шикарная борода и трубка притягивали восторженные взоры
    дам ещё до того, как стало ясно, что он, собственно, и есть ведущий. Правда, по-моему, блюз-меном Мишурис оказался куда
    более убедительным, нежели шоуменом. Его коллектив под названием <Mishouris Blues Band> зажигал под занавес. И ещё как
    зажигал!"'
