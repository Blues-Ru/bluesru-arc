                text: "все таки вдохновение хорошо когда оно посещает настоящих мастеров. Есть очень много плохих музыкантов, которые вместо оттачивания мастерства и профессионализма ждет что их вдруг \"пропрет\" на концерте. А потом запись подобного \"вдохновенного\" концерта слушаешь, и такая лажа, что точно не захочется слушать диски. \nЭто как у моего знакомого. Он утверждал, что без бутылки коньяка у него не встает. А подруга его потом раскрыла - что и с бутылкой то у него, тоже не встает, только он об этом уже не помнит.\nХотя слушать наипрофессиональные технические приемы (беглые пальчики резво бегущие по стандартным гармоническим разрешениям), или хорошее звукоизвлечение супер басистов (прям Пасториусов)играющих без грува слушать тоже невыносимо."
