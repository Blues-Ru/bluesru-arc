                  text: 'Однако существуют и имеют полное право на существование музыканты, которые занимаются исключительно развитием техники. Так сказать, музыканты для музыкантов. Слушать их невыносимо, но достижения их, ежели не ради рекордов (Вспоминаеццо пресловутый "Помёт Шмеля" в исполнении Зинчука), а ради оттачивания формального мастерства, поражают. Пример - Ингви Мальмстин. Я тут недавно скачал его ролик, где он мастер-класс по блюзу(!) проводит. Ну чё сказать... с одной стороны, никто из нас так в жизни не сыграет, с другой - душераздирающее слушанье. Однако же для него это вдохновение! По лицу видно! )) Но кто-то ж с такого тащится, имеет право..

                     

