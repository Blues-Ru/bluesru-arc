  text: 'Хочу поделиться впечатлениями от прошедшего 31-го марта в ЦДХ весера блюза. Собственно, если бы впечатления были
    только хорошие, писать бы не стал.


    Мне очень не понравилось поведение на сцене сабжа. Такое поведение ИМХО никак не соответствует тематике исполняемого материала.
    За примером далеко ходить не приходится, вот исполняет сабж песню, в которой рассказывает, как от него ушла девушка, как
    он просыпается утром один и как ему плохо по этому поводу, исполняет извиваясь и кривляясь, к сожалению.

    Замечательная музыка, отличный голос... Но за поведение - неуд.


    Вторая часть концерта завораживала, удовольствие получил неописуемое... кроме, разве что, самого конца, когда на сцене
    снова появился сабж...


    Нехитрый вывод - д-ра Аграновского лучше слушать, чем смотреть.'
