      text: 'Ну зачем цепляться за слова. Мне кажется, то, что я имею в виду понятно: плохое исполнение.

        Напишем так: когда <b>знаменитые</b> люди (немузыканты) начинают музицировать и делать это плохо. То, что называется
        "заняться не своим делом". Например, актёры: Ирина Мирошнеченко (ну просто ужас её пение), Александр Михайлов (хороший
        актер, но поёт никак), Харатьян. Орбакайте ваще тяжёлый случай... Их музыкальные достижения никакие. Как я уже писал:
        Крайне редко такие опыты были удачны.

        что же тут делать? Америку я не открою: если чё-то делать (и выставлять это на всеобщее обозрение), то делать надо
        хорошо. Иначе лучше не заниматься этим (в данном случае музыкой) или музицировать в своей тусовке (в смысле: я не
        музыкант, но кой чаго могу).

        .....

        Мне бы про Диброва узнать...'
