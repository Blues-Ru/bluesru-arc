  subject: Дмитрий Дибров - что за музыкант такой?
  deleted: false
  text: "Вот <a href=\"http://www.mp3search.ru/news.html?id=965\">тута</a> прочел вон то: см. ниже.\nЗдесь на форуме несколько\
    \ раз упамянался он, мол он, ДД, <s>неплохой</s> музыкант (иль исполнитель), даже вроде блюзы и рок-н-роллы исполняет.\n\
    При моём личном отношении к нему как к телеведущему (а оно, мягко говоря, нехорошее), я не очень-то верю что он в музыкальном\
    \ плане что-то интересное представляет (Ну, вот так я думаю!). Не совсем это прально: я же ничего не слыхал из его репертуара.\
    \ Вот и поэтому хотелось бы и узнать у сведующих людей: Дибров - что он за музыкант? Может кто ссылку подкинет что бы\
    \ его послушать (если это того стоит)?\nИ ещё: он на самом деле на гитаре играть может? На фотке ниже: руки и пальцы похоже\
    \ что правильно держит (к примеру, <s>музыканты</s> Киркоров и \"Лицей\" совсем не могут этого). По ящику я его даже со\
    \ слайдом видел (но он не играл)...\nА вообще, мне крайне не нравится (даже раздражает) когда актёры, ТВ ведущие начинают\
    \ заниматься не своим делом: музицировать. Крайне редко такие опыты были удачны. По крайней мере в нашем советско-российском,\
    \ так сказать, \"шоу-бизнесе\".\nP.S. Однажды в гостём \"Антропологии\" был барабанщик Билли Кобэн... Блин, я был готов\
    \ пристрелить Диброва за его вопросы. Идиот! И замечания его такие же. Может для кого-то это и было интересно: наш Дибров\
    \ на равных говорит с тамошней джазОвой знаменитостью, так сказать: разговор душ, но меня его пафос просто бесил. Он даже\
    \ хуже того ведущего программы \"Джем\" (1992-93 гг.) с его дурацкими вопросами и комментами.\nИзвиняюсь за мой, вот такой\
    \ раздражённый тон: день сегодня такой :-(\nА ведь может он человек хороший...\n\n<i>    Новый проект Дмитрия Диброва\
    \ «Рок-механика»\n  Дмитрий Дибров и Александр Ляпин представляют мультимедийный проект Hi-Tech. \n 2 апреля 2005 года\
    \ в 21.00 в развлекательном центре «Молодая гвардия» вы можете стать свидетелями рождения нового проекта Дмитрия Диброва\
    \ и Александра Ляпина «Рок-механика» Это недавно родившийся проект сочетает в себе живую музыку и эксперименты с новыми\
    \ технологиями звукозаписи, вынесенными на сцену, строгую просчитанность и непредсказуемые импровизации. \n Ляпин дразнит\
    \ слух музыкальными изысками и виртуозными гитарными пассажами, а Дибров сочиняет новый видеоряд. Эти два оригинала упиваются\
    \ свободой и втягивают в свое пространство лучших музыкантов, провоцируя их на экспромты. Юрий Шевчук оценил шоу «Рок-механика»\
    \ так: «Наконец-то в России появилась достойная, дорогая музыка качественно нового уровня». \n Не останется в стороне\
    \ от музицирования и аудитория музыкального спектакля, которой будет предложено участие в сиюминутном рождении «Рок-механики».\
    \ \n Основные участники проекта: \nАлександр Ляпин - «национальный герой гитары», титулованный так питерским журналом\
    \ «РИО». Был постоянным участником «Поп-механики» Сергея Курехина, работа в которой вдохновляла гитариста на новые музыкальные\
    \ подвиги и искания. Александр считает «Рок-механику» продолжением священного дела друга. Принимал «электрическое» участие\
    \ в записи большинства номерных альбомов группы «Аквариум». Имел параллельные проекты «Теле-У», «Опыты», «ДДТ». По приглашению\
    \ сэра Пола Маккартни Александр Ляпин проводил мастер-класс в Ливерпульском Институте Искусств (LIPA). \nАндрей Васильев\
    \ - один из ярчайших российских гитаристов («ДДТ», «Разные люди»). Удивительно смотреть, как Андрей работает на сцене!\
    \ Он не просто играет, он живет в каждом звуке, гармонично вырисовывая музыкальные картины. \nЭйми Питерс - молодая афро-американская\
    \ исполнительница, которая идеально вписывается в концепт шоу. Её удивительное владение индийским вокалом, сочетающимся\
    \ с корневыми блюзовыми и современными речитативными исполнительскими тенденциями, придаёт уникальное звучание всему гитарному\
    \ шоу. \nДмитрий Дибров - лучший телеведущий страны, автор и ведущий программ «Воскресенье с Дмитрием Дибровым», «Антропология»,\
    \ «Аутодафе», «Ночная смена», «Апология». Ведущий телевизионных игр «О, счастливчик», «Народ против», шоу «Я готов на\
    \ все». Лауреат международных кино- и телефестивалей, в том числе Международного фестиваля электронного кино в Монтрё.\
    \ Периодически совершает крестовые походы в музыкальные проекты, например, такие, как гитарное шоу «Рок-механика». \n\
    \ Проект поддерживают лучшие творческие силы мирового шоу-бизнеса. С Александром Ляпиным уже год сотрудничает знаменитый\
    \ режиссёр-постановщик и продюсер Paul Brun (Circue Du Soleil, Peter Gabriel, Show Celin Dion). \n В планах творческого\
    \ союза - создание кардинально новых направлений развития современного искусства на базе использования последних достижений\
    \ в области мировых технологий. \nИсточник: www.starstory.ru\n25.03.2005</i>\n<DIV align=center><IMG align=baseline alt=\"\
    \" border=0 hspace=0 src=\"http://img.mp3search.ru/mp3search/news/dibrov.jpg\"></DIV>"
