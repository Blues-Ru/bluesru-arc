    deleted: false
    text: 'Основной концерт, на который мы всех зовем, будет 3-го числа в четверг в "Курсе". Ожидается много народу, так что атмосфера будет весьма веселой. 4-е число у нас теперь выходной, так что можно смело напиваться накануне. Одно открывающее отделение сыграет Арсен Шомахов с норвежской ритм-секцией. Этим же составом он в эту субботу и воскресенье будет играть на Шпицбергене, там как раз окончательно сыграются. Я слышал состав Арсен+Билл+Алекс в Осло, это было круто весьма... И, к тому же, вполне эксклюзивно ;))


      Также, наверняка, будет очень приятный концерт в пятницу в Доме у Дороги, где мы, конечно, тоже все будем, но я бы откладывал до пятницы, ибо это будет последний московский концерт и, думаю, там будет биток, можно будет просто не попасть к сцене.'
