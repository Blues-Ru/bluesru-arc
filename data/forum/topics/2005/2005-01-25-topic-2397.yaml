    text: "Джейми Фокс получил \"Золотой глобус\" в номинации \"Лучший актер\" за\
      \ исполнение роли Рэя Чарльза в фильме \"Рэй\". Это значит, что его шансы на\
      \ получение \"Оскара\" весьма высоки.\n\nВот где и когда будет идти \"Рэй\"\
      \ в Москве:\n5 звезд 27.01-30.01 Зал Куросава: 23-15 Зал Птушко: 13-20, 18-40\
      \ \nБудапешт 27.01-02.02 Зал № 3. 9-15, 16-30, 23-50 \nВитязь 27.01-31.01 Зал\
      \ № 3. 11-40. 16-50. 22-00 \nВысота 27.01-02.02 Красный зал: 9-00, 14-00, 23-45\
      \ \nГоризонт 27.01-31.01 Зал № 3. 11-25. 16-30. 21-55 \nКиргизия 27.01-31.01\
      \ Зал № 2. 11-40. 16-50. 22-00 \nПять звезд на Новокузнецкой 27.01-30.01 Зал\
      \ № 5. 12-00, 14-45, 17-30, 20-20, 23-05 \nРолан 27.01-30.01 Большой зал: 13-00,\
      \ 18-15, 23-30 \nСофия 27.01-31.01 Зал № 4. 12-30. 17-05. 21-40. 02-15 \nСтрела\
      \ 27.01-31.01 21-40 \nФормула Кино (Атриум) 27.01-02.02 Зал № 1. 10-05. 13-05.\
      \ 16-05. 19-05. 22-00. 00-55 \nФормула Кино на Можайке 27.01-02.02\n\nВообще-то\
      \ фильм критикуют за неточное отображение фактов их жизни Чарльза. Например,\
      \ в фильме первая жена Рэя – Делла, от которой у него было трое детей. На самом\
      \ же деле его первой женой была Эйлин Уильямс, мать одного из его детей, но\
      \ она вообще не показана в фильме. Делла в реальной жизни была одной из бэквокалисток\
      \ в The Raelettes, а в фильме она была участницей другой госпэл-группы. Делла\
      \ также показана в конце фильма на церемонии в Джорджии в 79 г., но на самом\
      \ деле их брак распался в 77-м.\nТакже в фильме показан роман Чарльза с Марджи\
      \ Хендрикс. Однако нет ни намека на то, что у Рэя было по меньшей мере 9 детей\
      \ от 5 разных женщин. (После его кончины сообщалось, что он был отцом 13 детей\
      \ от разных женщин.)\nПри всем при этом Чарльз был консультантом фильма до последних\
      \ своих дней и одобрил окончательный сценарий. Как обычно Голливуд взял на себя\
      \ смелость упростить сюжет, использовав меньше персонажей, чем на было самом\
      \ деле?\nТем не мене, все это никак не умаляет достоинств великолепной игры\
      \ Джейми Фокса!!!\n\nНе пропустите этот фильм, не пожалейте два с половиной\
      \ часа на это зриво: боль-любовь-музыка...\n\"Если всевышний по каким-то причинам\
      \ решит меня позвать к себе завтра, я совершенно не буду огорчаться. Не будет\
      \ никаких сожалений, ведь это он вознес меня на вершину вершин\". (с) Рэй\n\n\
      На фото: Фокс в образе\n<DIV align=center><IMG align=baseline alt=\"\" border=0\
      \ hspace=0 src=\"http://www.beatles.ru/img/forum/message345135.jpg\"></DIV>\n\
      \nВсё взято <a href=\"http://www.beatles.ru/postman/forum_messages.asp?msg_id=9022&cpage=5\"\
      >отсюда</a>"
