  text: 'Всем привет.

    Очень интересует текст песни "Run Sinners" в исполнении LeadBelly.

    Пытался снять с записи, но порой пение там плохо различимо, и есть некоторые пробелы.

    Начинается она так (чтобы ограничить поиски):

    Run Sinners,

    You''re better run...

    Спасибо'
