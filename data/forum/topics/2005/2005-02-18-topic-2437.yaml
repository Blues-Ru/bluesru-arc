          subject: Теперь всё ясно
          deleted: false
          text: 'Теперь всё стало ясно. Всё дело в том что я очень редко захожу на заглавную страничку блюз.ру.

            Для тех кто ещё не в курсе, вот та статья: <a href="http://www.blues.ru/news/?p=200502#164">Дыхание и голос блюза
            в Виннице: "Rainy Day"</a>

            А статья то... блин! дурацкая статья. а точнее Инна КЛЮЧИНСКАЯ. Раздражають мене такой размышлений. Приведу только
            начало статьи:

            <i>Дождь - очень блюзовое состояние. Блюз - это грусть, но не вводящая в депрессию, а выводящая из нее. От депрессии
            лечит блюз. Живой, сильный, настоящий. В этом убеждаешься после посещения репетиции первой и пока единственной
            винницкой блюз-команды "Rainy day".</i>

            Ближе к концу этой небольшой статьи, первые два предложения (Дождь - очень блюзо...) повторяются вновь. слово
            в слово. (ключевать Линчинскую :-)

            <b> Кстати, </b> помню на фесте "Блюз в России" в 1992 г. выступала украинская команда "Дождь". Гармошка, слайд,
            на Диамантах играли :))) Если не ошибаюсь на вышедшем после феста двойном виниле была в ихнем исполнении "That''s
            Alright Mama". Мне она очень нравилась :))) Но, кажись, те ребята были из Харькова. Что теперь с ними, где и как
            они?

            Нет ли связи между "Дождём" и "Rainy Day"? Так сказать: Украина, блюз, дождь, <i>аптека, улица, фонарь</i>...'
