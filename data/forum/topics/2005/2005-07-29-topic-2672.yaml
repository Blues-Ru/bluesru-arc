  text: 'Называется Mojo Club. Пока без большого размаха. но стараемся, как можем. Сейчас основная площадка - на теплоходах.
    Концерты по субботам, и постараемся сделать по пятницам, опыт покажет, насколько розовы наши очки:) Ближайший концерт
    - в эту субботу, приходите! 21-00, в это время отплывает теплоход. Причал найти просто: в него упирается проспект Чернышевского
    (другим концом он упирается в Кирочную). Метро - Чернышевская, оттуда идти пять минут. Стараемся сделать вменяемый бар,
    добродушная обстановка складывается как-то сама собой. Ждем всех, следите за афишами и спасибо за внимание!'
