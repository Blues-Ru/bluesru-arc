  subject: В Москве появился свинговый грипп
  deleted: false
  text: "Один мой пациент плохо умел играть на гитаре, но в последние месяцы вдруг начал играть сплошной шаффл, и ничего,\
    \ кроме шаффла, выдавить из себя не мог. Ему помогла лишь принудительная терапия: были использованы вещи с огромным количеством\
    \ фанка. \nВторой мой пациент играл очень хорошо; он недавно приехал из США покорять блюзовую Москву. Неизвестная болезнь\
    \ настигла его прямо на улице - заставить его не свинговать не получалось. \nСвинговый грипп, или триолит - очень опасное\
    \ и малоизученное заболевание. У человека атрофируется участок мозга, отвечающий за прямой ритм. Вирус триолита поражает\
    \ и музыкантов, и барабанщиков. \nВ нашей клинике, как мы уже упомянули, мы придумали только одно средство борьбы со свинговым\
    \ гриппом. Но лечение фанком имеет побочный эффект: может развиться секстолит - смесь свингового и фанкового гриппа, а\
    \ против этого медицина бессильна."
