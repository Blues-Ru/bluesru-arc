    text: 'цитатнЁм:

      "1999 г. – Виктория организовала собственную ритм-н-блюзовую группу Пьер-Мари Бэнд, обрамленный ее Викторианским балетом."

      ---

      А гран-При на фестивале в Мотре перестали присуждать еще до рождения "Российской королевы блюза". Вначале это был конкурс-фестиваль,
      и главным призом была возможность записать в студии LP. Как раз на заре 70-х конкурс пропал (а с ним и Гран-При), фестиваль
      остался - но наград уже никаких не раздавали.

      А вот в чем не сомневаюсь, так это в двух медалях (золотых!) выигранных на Чемпионате Мира по Искусствам в Лос-Анджелесе.'
