              subject: О применимости слов к музыке.
              deleted: false
              text: "Однако прошу пардона за применение слов из молодёжного лексикона. \"Плющить и колбасить\" на языке моей\
                \ дочери означает некоторое физиологическое восприятие музыки, выражающееся в сложной кинестетической реакции\
                \ типа мурашки по спине, шерсть дыбом на загривке, эйфория в голове и подпрыгивание в ногах и других частях\
                \ организма. Я доступно выразился? =))\nДа, так продолжаю про иллюзии г-на Белаго Кролика. Как все советские\
                \ люди, г-н Б.К. воспринимает блюз как музыку, хотя традиционный блюз это типа нашего КСП - о чём вижу, о\
                \ том и пою. А играть я типа не очень умею, так что звиняйте, играю как могу. Зато от души. По английски -\
                \ with feeling. Вот за эту неказистую простоту, которая у старых добрых блюзменов достигала уровня высокого\
                \ искусства, блюз и любят. Но редкая современная молодёжь дослушает до середины Роберта Джонсона. Или Джона\
                \ Ли Хукера. Почему, спросит читатель? \nА мы и отвечаем. Потому что слова ихние на языке оригинала нам не\
                \ понятны, поелику языкам не обучены, а ежели кто и обучен, то контекст непонятен - слова вроде по отдельности\
                \ ясные, а вместе ерунда какая-то.. ну вот поёт Би Би про какую-то Hayshark - соломенная акула, ан webster.com\
                \ про неё ничё не знает.. значит, сие есть аллюзия и коннотация, и подозреваю я, что как говаривал г-н полковник,\
                \ \"содержит сие идею двойного греха\" (спасибо Доку за реминисценцию), а вот какого - пойди разбери.. И что\
                \ нам, внеконтекстовым, делать остаётся? Наслаждаться музыкой вне содержания слов, что и делаем. Чем музыка\
                \ нас больше за feeling трогает, тем она типа блюзовее.\nПослушал я Peoria, кстати. Это по стилю не блюз вовсе,\
                \ а такой.. прифанкованный джазец, в 60-х только ленивый не играл 15-минутные запилы на гармонию I-IV по пол-такта,\
                \ ну идея такая охватила музыкальные массы, бывает..\nЧё-то разговорился я и разбежался мысью по древу.. старый\
                \ стал совсем, пеняю молодёжи.."
