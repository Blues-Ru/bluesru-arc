    text: "Был давеча в двух блюз-барах на N.Halsted street - B.L.U.E.S и знамениты Kingston Milesю Первый - небольшое уютное\
      \ помещение с достаточно аутентичным блюзом (с, сюдя по программе. Второй - огромный ангар с тремя залами, редкостная\
      \ помойка с плохо отстроенной акустикой. Толстые брателло на всходе требуют 15-20 баксов за проход. Если скажешь, что\
      \ бедный и из России - такса будет двойная :-)) \nС 9 по 12 июня в Чикаго происходит блюз-фестиваль. Подробности здесь\
      \ http://www.cityofchicago.org и дальше по ссылке 'Festival'"
