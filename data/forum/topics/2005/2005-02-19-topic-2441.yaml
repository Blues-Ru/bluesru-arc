    deleted: false
    text: 30 марта Казань должен посетить певец Ли Эндрю Дэвисон - Черная Бомба. Это
      прозвище американский чернокожий певец получил в Бостоне, когда руководил хором
      Гарвардского университета. Но с 1991 года этот артист, объехавший с гастролями
      весь мир, стал практически нашим соседом - живет и работает в Чехии. В Казань
      он привезет программу, состоящую из блюзов, госпел и песен эпохи раннего джаза.
