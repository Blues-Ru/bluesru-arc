  text: "Продолжаем читать прессу! Сообщение \"РИА Новости\":\n\nНа дневном концерте\
    \ в Театральном зале выступит джазовый пианист и ведущий цикла \"Мир джаза - от\
    \ А до Я\" Григорий Файн, который расскажет всем желающим 90-летнюю историю блюза.\
    \ Иллюстрировать рассказ приглашены джазовая певица Мариам и саксофонист Константин\
    \ Горшков. \n\nА эти лохи из Конгресса, начитавшись W.C.Handy, отмечали столетие\
    \ блюза года два назад! Да и блюз-ру поддались на вражескую пропаганду!\n\n(P.S.\
    \ А, может, он расскажет 90-летнюю историю, а последние десять лет рассказыать\
    \ не будет? кто знает...)"
