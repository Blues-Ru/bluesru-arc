    deleted: false
    text: 'Можно заметить, что по всем имеющим доказательстам Buddy Bolden играл в
      основном блюз в Новом Орлеане.  Bolden перестал играть уже в 1907-ом г.  Jelly
      Roll Morton вспоминал много блюзовых пианистов в Новом Орлеане в самом начале
      20-го века.  Он даже жаловался на мнгогих "необразованных" пианистов того времени,
      которые ничего кроме блюза не умели играть.


