  text: Хочу высказать свои соображения о блюзе "местного розлива" и прояснить свою позицию досконально. Да, я считаю, что
    наш блюз пока не состоялся, точнее, он в пеленках пока. И для того, чтобы этот младенец вырос и стал достойным членом
    общества ему нужно воспитание и...ЛЮБОВЬ. Не тыкать пальцем, злорадно хихикая :" Ага, опять обгадился !", а реально помогать
    и поддерживать то немногое, что есть. А именно, хотя бы ходить на концерты и фестивали, которые пока проводятся ( впрочем
    и критиковать за халтуру нещадно), надо дать понять музыкантам, что они не дикие твари из дикого леса, а нужны хоть кому-то.
    Тогда и ответственность за свое творчество усилится. Мои коллеги и я ведь правда стараемся изменить что-то, и посмотрите,  двигается!
    И это в полупустых помещениях и при постоянном шельмовании. Кто будет открывать новые клубы, если в них пусто будет ?!
    Если вы, уважаемые обитатели форума не ставите своей целью полное истребление российского блюза ( а такое впечатление
    иногда складывается), то ощутите свою ответственность за его будущее, PLEASE/ BLUES NEEDS YOUR SUPPORT !
