    deleted: false
    text: "Рискну влезть в ваше обсуждение.\n\nЯ отношу себя к рядовым (если можно так выразиться) любителям блюза. Первый\
      \ раз я его услышал 4 года назад благодаря передаче \"Доктор Блюз\", тогда и понял, что нашел свою музыку. Хоть Тула\
      \ и крупный город, надеяться на какой-нибудь концерт не приходилось. Через год я приехал учиться в Москву и поразился\
      \ обилию клубов и концертов.\nЭто чрезвычайно трогательное лирическое отступление мало имеет отношения к делу. А сказать\
      \ я хотел вот что: мне, как студенту, живущему довольно далеко от родителей, довольно накладно посещать концерты с некоторой\
      \ регулярностью. У меня есть несколько знакомых - тоже студентов, любящих блюз, для них это тоже накладно. Поэтому стремишься\
      \ послушать как можно больше разных исполнителей в разных местах. Наверное, я отражаю лишь малую часть блюзового контингента\
      \ Москвы. \nА относительно пафосности музыкантов, я отел сказать следующее: недавно я быд на джеме у Аграновского и\
      \ подошел тогда к А.Братецкому со своей гармошкой и набором вопросов и проблем. Тогда отмечали его день рождения, но\
      \ он меня выслушал, подарил 2 своих диска и показал, некоторые моменты.\nТак что слушатели есть, и блюз востребован.\
      \ И играют его замечательные люди, за что им большое спасибо."
