    deleted: false
    text: "Посколько ст.Делириуму страсть как хочется свободно самовыражаться с использованием столь любимого им тезауруса, то я предлагаю ст.Делириуму и всем желающим высказаться с нарушением правил Форума, покупать ИНДУЛЬГЕНЦИИ на одноразовое произнесение на форуме слов и выражений, употребление которых запрещено преподобным Модератором.\n\nСписок ТЕХ САМЫХ СЛОВ составит г-н Евдокимов, после чего он будет утверждён г-ном Романенко и опубликован в соответствующем разделе Форума.\n  \nИндульгенции будут изготовлены на красивых бланках фабрики Гознака и иметь три степени защиты от подделки. На каждой индульгенции каллиграфическим шрифтом будет написано одно из ТЕХ САМЫХ СЛОВ. \n\nОПЛАТА индульгенций будет производиться по WM либо по пластиковой карте.\n\nТот, кто единовременно приобретёт полный КОМПЛЕКТ ИНДУЛЬГЕНЦИЙ, получит гитару типа Фендер Стратокастер производства КНР с автографами звёзд отечественного блюза, а также красивую рамочку.\n\nВсе доходы от продажи индульгенций пойдут в фонд поддержки тигровых амуров, а также на финансирование долгосрочных гастролей группы БК в Гондурасе - родине дерева mahagony.\n \nПо-моему, хороша идея... осталось домыслить мелочи, типа разумной стоимости одной индульгенции, и вперёд!"
