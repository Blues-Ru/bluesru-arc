  text: "Альбом одного из ветеранов чикагского блюза представляет собой сборник каверов легендарных блюзменов прошлого века плюс одна авторская («This Is The End, Little Girl») вещица. Состав музыкантов представлен действительно звёздными фигурами, такими, как Eric Clapton, Bob Margolin, David Maxwell, Keith Richards и др. За свою длиннющую музыкальную карьеру (тогда Хьюберту было 72) для Самлина характерно выступление на вторых ролях за спинами James Cotton, Muddy Waters, Howlin'Wolf. И сейчас он демонстрирует совсем неторопливый, отнюдь не яркий, но в высшей степени качественный блюз, выступая в роли серого кардинала. Видимо, такие люди тоже нужны, которые являются надёжным звёздным блюзовым тылом (звучит парадоксально? ;)) фронтменов. Звук намеренно грязен, инструментальный состав традиционен. Но в этом то и ценность этой и подобных этой работ. Пластинка призвана продемонстрировать те грани талантов исполнителей, которые так или иначе по разным причинам зачастую остаются за рамками их собственных сольных работ. Думается, для музыкантов всегда интересно поучаствовать в таких проектах, и Самлин предоставляет им такую возможность. Это практически джем, что почти всегда необычно, интересно и непредсказуемо. Keith Richards («Still A Food») привносит в классического Muddy Waters’а роллинговскую резкость подхода и агрессивность вокала. Примечательны «She’s Into Something» и «Don’t Go No Farther» с агрессией Nathaniel Peterson’а. А на «The Same Thing» Willie Dixon’a можно насладиться хриплым грудным раскачивающимся затяжками вокалом David Johansen, очень уж он хорош. Лидирующий вокал самого Самлина есть лишь на «This Is The End, Little Girl». Вкрадчивый, бормотливый, подскрипывающе-визжащий под аккомпанемент двух акустик (сам Самлин + Ричардс) и Paul Nowinski на басу. \n\nТакая вот не общеупотребительная, но, вне всякого сомнения, достойная внимания пластинка."
