    poster: Rugged
    email: kirill@hillbilly.ru
    subject: Это...
    deleted: false
    text: '...так называется заболоченный рукав реки или залив (короче - полуозеро, полуболото) в штате Луизиана.


      Слово действительно имеет французские корни, т. к. в заболоченных местах Луизианы живут злобные кейджуны (эта местность
      так и называется - cajun country), которые этнически являются выходцами из Франции :) С их легкой руки слово и попало
      в американский английский.


      Только не надо меня спрашивать про этимологию слова "кейджун" :)'
