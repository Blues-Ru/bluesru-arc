  text: "Быстренько пропустив по первой и второй, старик Делириум не спешил с третьей...\
    \ медленно прожевав селедку, он произнес...\n-\tФорум у вас – штука тонкая...\n\
    -\tА что тебе не так, - сердито спросил я. Мне эти разговоры уже поперек горла\
    \ встали.\n-\tДа мне все так, я-то никуда не спешу... между второй и третьей...\
    \ просто забавно.\n-\tНу и что тебе так забавно, старый хрен? – на кусочек черного\
    \ с маслом я положил селедочку и прикрыл ее сверху кружком лука. – ты бы уж наливал\
    \ бы, что ли?\nСтарик Делириум взял главспирттрест и уверенно плеснул по рюмкам...\n\
    -\tО! Глаз – ватерпасс! – удовлетворенно отметил он равный уровень горячительного\
    \ в рюмках...\nМы молча чокнулись и поспешили закусить.... Старик Делириум, аккуратно\
    \ прожевав, продолжил...\n-\tЗабавный у вас форум... вот, скажем, - глаз его хитро\
    \ блеснул, - если назвать Кима Уилсона «гавноблюзом» - то тебя на сутки забанят...\
    \ А если обозвать группу BBR «блядюгами» - то это просто так нормально, по ходу-пароходу.\n\
    -\tНе пизди, старый!\n-\tВо-во... однократное употребление крепкого словца не\
    \ возбраняется.... Но если Евдокимову сказать, что он в передачу «блядюг» включает\
    \ – это полемика такая, а вовсе не «неуважительное отношение к мнению и вкусам\
    \ других участников форума»... такое отношение – запрещено однозначно! А если\
    \ имяреку сказать, что он ничего не понимает в блюзе – то таковое высказывание\
    \ будет немедленно изъято и оштрафовано. А если сказать, что борода и шляпа вот\
    \ уже который десяток лет ничего не понимает в блюзе – то это обратно будет достойная\
    \ полемика. Вот я и говорю – тонкая штука...\n-\tНу и к чему ты клонишь?\nНе дождавшись,\
    \ я сам взял главспирттрест и постарался аккуратно разлить поровну... не получилось.\n\
    -\tЭх.... – крякнул старик Делириум, - правильно модератор не возражал, когда\
    \ имярек говорил тебе в этом форуме: «Ты не видишь, что ты смешон со своими книжными\
    \ знаниями?! Заткнись!»\n-\tУ тебя что, других тем нет? Только настроение портить\
    \ умеешь?!\nНе чокаясь, махнули еще по одной... Прожевав закуску, старик Делириум\
    \ взял гитару.\n- Могу и поднять.... Нет другого пути назад, есть лишь дорога\
    \ во тьму... – затянул он.\n- Тебе не нужно страдать, только живи с миром Дарксайда...\
    \ – подхватил я..."
