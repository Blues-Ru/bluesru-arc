    text: "Перекрестный отец \n// Сергей Воронов пропел с Crossroads 15 лет \n\nконцерт\
      \ блюз\n\nГруппа Crossroads отметила 15-летие в клубе \"Апельсин\". Понять,\
      \ зачем слушать гитариста Сергея Воронова, когда еще живы Эрик Клэптон и Би\
      \ Би Кинг, пытался БОРИС Ъ-БАРАБАНОВ. \n\nВ просторном клубе собрались люди\
      \ с отпечатком особого знания на лицах, очень типичная аудитория концертов отечественных\
      \ блюзменов. Эти мужчины за сорок 15 лет назад обживали первые столичные пабы.\
      \ Тогда все было первое: первые клубы, первые рейвы, первые видеоклипы, первые\
      \ FM-станции. И не то чтобы до 1990 года в России не было музыкантов, называвших\
      \ себя блюзменами, но группа Crossroads во главе с гитаристом Сергеем Вороновым\
      \ была вещью новой, лишенной негативного совкового бэкграунда, поданной в \"\
      фирменной\" упаковке, и поначалу никого не смущало даже то, что в стране победившего\
      \ русскоязычного бард-рока Crossroads упрямо поет по-английски. \nУ Crossroads\
      \ было три козыря. Первый – песня \"Diamond Rain\", единственный до сих пор\
      \ настоящий хит, номер, без дураков, мирового уровня, больше ничего подобного\
      \ господину Воронову сочинить не удалось. Второй – сотни раз рассказанная история\
      \ про то, что лидер Crossroads записывался с Кейтом Ричардсом из The Rolling\
      \ Stones. И, наконец, главный козырь Crossroads – внешность лидера. Господин\
      \ Воронов весь, от усов-антенн до связки тяжелых брелоков на поясе и сапог с\
      \ правильными носами,– безусловная ролевая модель для младого племени с гитарами.\
      \ Он хорош на глянцевой полосе и на телеэкране, с сигарой и трубкой, с Гариком\
      \ Сукачевым и с Валерием Меладзе. Вот и на праздничном вечере в \"Апельсине\"\
      \ он появился в стильном костюме в тонкую полоску и очередной несусветной шляпе\
      \ с массивной кокардой; прочие музыканты надели свои, видимо, самые пестрые\
      \ рубахи. \nМузыканты начали концерт с \"Crossroad Blues\" Роберта Джонсона,\
      \ вещи, в честь которой и был назван коллектив. Усачи-бородачи на сцене заиграли\
      \ стандартнейшую из музык, усачи-бородачи в зале подняли повыше кружки с пивом.\
      \ За эти 15 лет эта публика видела уже в Москве и Эрика Клэптона, и многих других\
      \ из живущих ныне корифеев блюза, а Би Би Кинга так и вовсе несколько раз; была\
      \ возможность, так сказать, почувствовать разницу. Сергею Воронову не откажешь\
      \ в профессионализме, просто его блюз все-таки немного другой природы, несмотря\
      \ на шляпы и хороший английский. Судя по всему, ровная и очевидная музыка Crossroads\
      \ остается для пришедших неким ностальгическим символом – на многих лицах можно\
      \ было наблюдать неподдельный восторг, а господа с более байкерской внешностью\
      \ к концу концерта чуть ли не ходили колесом. \nCrossroads чередовали номера\
      \ собственного сочинения со стандартами Джимми Хендрикса, Ментора Уильямса,\
      \ Дэвида Боуи, Би Би Кинга, Бадди Гая, The Rolling Stones. На сцену поднимались\
      \ коллеги-друзья. Александр Ф. Скляр украсил мероприятие своим элегантным баритоном,\
      \ а Андрей Макаревич ограничился игрой на гитаре, продирижировав небольшим,\
      \ но азартным джемом с участием игравшего на lap-steel-гитаре Андрея Шепелева\
      \ из \"Грассмейстера\". Нескончаемой чередой к сцене тянулись заслуженные гитаристы:\
      \ Дмитрий Четвергов, Александр Ляпин, Гия Дзангидзе... Искренние взаимные симпатии,\
      \ крепкие и очень одинаковые соло. Весь концерт проходил на подъеме, но как\
      \ бы в одной плоскости. \nВечеринка получилась неплохая, но устроители празднования,\
      \ конечно, совершили ошибку, когда, пока собирались гости, запустили на экране\
      \ вместо традиционных хроник тревожной молодости именинников фильм \"No Quarter\"\
      \ с Джимми Пейджем и Робертом Плантом. В этом сборнике концертных съемок, как\
      \ известно, зафиксировано обретение бывшими музыкантами Led Zeppelin в ходе\
      \ гастролей по Египту и северу Африки нового измерения для своей музыки, целиком\
      \ коренящейся, как и песни Crossroads, в классическом блюзе. У Crossroads нечто\
      \ похожее на дополнительное измерение наметилось лишь раз – когда к исполнению\
      \ \"Diamond Rain\" подключился джазмен Анатолий Герасимов с сопрано-саксофоном\
      \ и зарядил изрядного Дживана Гаспаряна.\n\n<a href=\"http://www.kommersant.ru/doc-y.html?docId=579378&issueId=23409\"\
      \ target=\"_blank\">http://www.kommersant.ru/doc-y.html?docId=579378&issueId=23409</a>"
