  deleted: false
  text: "Юбилейные концерты почти всегда приятны и хороши именно своей ретроспективностью,\
    \ возможностью услышат то, что, как правило, на рядовых концертах уже сто лет\
    \ не играется, а также гостями, которые всегда привносят каждый что-то своё, что\
    \ тоже интересно и приятно. Вчера было много и первого, и второго.\n\nВоронов\
    \ был отличной форме, «ответственно» подойдя к мероприятию, а Crossroadz - в расширенном\
    \ составе: помимо стандартного квинтета наличествовали бэк-вокалистки, а также\
    \ ex-«Неприкасаемый» Рушан Аюпов (клавишные), который, впрочем, уже записывался\
    \ и играл с командой Воронова, например, на «Salado» (1999). \n\nВ 3-х часовой\
    \ концерт вошли песни со всех альбомов, а открывал день рождения само собой «гимн»\
    \ «Crossroad Blues». «Fool Boy», «Be What You Are», «Foxy Lady», «Wild Wild World»,\
    \ «Bright Light Big City» - всё это было. На их фоне после плотного саунда лиричная\
    \ «Blue Angel» звучала особенно прозрачно. Конечно, концерт не обошёлся без классической\
    \ «Venus». А вот вездесущего «Hoochie Coochie Man» не было.\n\nТеперь расскажу\
    \ про гостей. Думал, вот сейчас как начну хвалить, ан нет, не всё так гладко получилось.\
    \ Впрочем, что есть, то есть.\n\nАлександр Ф.Скляр исполнил очень старую песню\
    \ под названием «Сигаретный блюз» с ва-банковского альбома «На кухне» (1992) Не\
    \ надо забывать, что в те далёкие времена ещё не было столь явного разделения\
    \ на русский рок и блюз, все были вместе. Вот и Воронов участвовал, наряду с пластинкой\
    \ «Всё это рок-н-ролл» (1992), в записи «На кухне». Вчера же замечательный инструментал\
    \ музыкантов Crossroadz вкупе с сочным баритоном Скляра доставили мне истинное\
    \ наслаждение.\n\nАндрей Макаревич выглядел плоско и неинтересно. Иного, собственно,\
    \ и не ожидалось. Гитарист он никакой, а, наверное, любая из его песен звучала\
    \ бы в исполнении Crossroadz просто не к месту.\n\nГия Дзагнидзе – близкий друг\
    \ и сподвижник Воронова – человек настроения. Он может завести зал так, что мало\
    \ не покажется. Вчера был иной случай. Гия не блистал. Сыграл всё, что и как положено,\
    \ и рассосался.\n\nИгорь Бутман заболел и не смог участвовать в концерте зато,\
    \ к Crossroadz присоединилась медная духовая секция его оркестра. «Southern Woman»\
    \ прозвучала именно так, как она записана на «Salado». Это очень кайфово: дудки,\
    \ бэк-вокал, все дела. Вот это и есть настоящий Crossroadz, а не его сухой остаток,\
    \ звучащий, например, в «B.B.King»’e.\n\nОтлично выступил вчера Николай Арутюнов.\
    \ Как правило, в сборных, юбилейных концертах он как-то до конца не выкладывается,\
    \ что ли, и выглядит более блёкло, чем на своих концертах. Вчера, видать, звёзды\
    \ встали, как надо. Так, как им была исполнена роллингстоунсовская «Jumping Jack\
    \ Flash», пожалуй, из наших музыкантов не исполнил бы её никто. Вот это голосище,\
    \ пафос, масштаб.\n\nСюрпризом стало появление на одной сцене с Кроссроудз и Арутюновым\
    \ (как раз на «Jumping Jack Flash») Александра Ляпина (ex-«Аквариум», еx-«Рок-механика»),\
    \ уже давно проживающего в США и появляющегося в Москве лишь изредка, наездами.\
    \ Я его никогда не слышал до этого вживую. Ну, не знаю… наверное, надо слушать\
    \ его собственный блюзовый проект. Вчера меня его игра как-то не пропёрла. Может,\
    \ от того, что его выход был в конце, когда на сцене скопилось уже значительное\
    \ количество «громких» гитаристов. Он оказался лишь одним из.\n\nАбсолютно тоже\
    \ самое можно сказать и про ещё один сюрприз – появление на сцене Дмитрия Четвергова.\
    \ Четвергов, насколько мне известно, сейчас в основном играет fusion (хотя ведь\
    \ участвовал же он в фактически hard-проекте «Четверг Арутюнова»). Вчера был откровенный\
    \ hard. Но, опять же, игра не впечатлила. Всё-таки от таких фигур, как Ляпин или\
    \ Четвергов, ждёшь чего-то особенного, и когда этого особенного в результате не\
    \ получаешь, ощущается некое разочарование.\n\nАнатолий Герасимов (сопрано-саксофон)\
    \ – ещё один неожиданный гость на сцене. Надо сказать, что, слышав его несколько\
    \ раз на джемах, я так и не понял чем же он так замечателен, почему его так все\
    \ восхваляют. Ну, саксофонист, ну, звезда, а дальше-то что, если играет неинтересно?\
    \ Вчера в «Diamond Rain» со своими world-music-проигрышами Герасимов звучал отлично.\n\
    \nКороче говоря, день рождения удался:) Мне лично понравилось."
