                  text: Вот нелюбимый вами Фрэнк Заппа действительно часто играл атональную музыку. Атональная- это не синоним "лажовая"- то есть партии на самом деле продуманы и инструменты строят. А игра Хендрикса на концертах это часто ГРЯЗЬ и неритмичная игра. И не надо его превозносить до уровня богов- никто не отрицает его ОГРОМНОГО влияния на музыку, но возводить его игру на концертах до эталона совершенства это неправильно.
