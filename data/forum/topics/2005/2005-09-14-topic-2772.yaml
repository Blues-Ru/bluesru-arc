                    deleted: false
                    text: '..была упомянута для примера. Что не всегда можно (и нужно) запихивать музыку в какие-то рамки. Кроме того, существует такие вещи, как импровизация (где ВСЁ продумано быть не может по определению) и, повторюсь, свинг. А свинг и есть игра не совсем точная тонально (т.е. в некотором смысле "грязь") и ритмически. И чётко определить грань между откровенной лажей и свингом я лично не возьмусь. Тут тоже нет абсолютных критериев. А уж если ещё и фри-джаз вспомнить..

