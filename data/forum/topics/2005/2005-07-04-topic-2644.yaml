      text: "BBB закачан куда следует и переименован. Действительно, шедевр.\nОднако прослушивание полного собрания сочинений Bobby Bland'а навело на меня некоторое уныние (наверное, сходством с Энгельбертом Хампердинком =))) Или я чего-то в ём не понял?\n\nАрхив Stormy Monday - достаточно старый, я, наверное, не очень тщательно прослушал подборку песен. Наверное, владелец архива с этой песней перепутал что-то, поскольку поётся что-то про дождливую погоду.\nОднако поёт точно Билли Холидей, голос не спутаешь. Где у нас поётся \"I've been down so long? ... Where can my good man be?\" далее неразбо...\n\nЛовля записей в пиринговых сетях типа eMule и BearShare похожа на ловлю рыбы - то густо, то пусто, зависит от того, находятся ли владельцы хороших архивов в онлайне, и отдают ли они файлы вообще, или ими только хвастаются. Приходится делать несколько заходов.\nВот намедни охотился я на \"Reconsider Baby\", и только на третий день удалось отловить разлюли-залихватскую версию в исполнении Doug Sahm. Ну нравиццо он мне! \nКстати, если у кого есть альбом \"The Last Real Texas Blues Band feat. Doug Sahm\" - поделитесь плизз!"
