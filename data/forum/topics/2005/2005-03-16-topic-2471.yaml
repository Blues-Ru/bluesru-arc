            text: 'А что такое блюз?

              Вот вот. Я вот совсем ниХра не понимаю.

              Петровичу - респект. Спасибо за аппаратуру и всю его жизнь. Воронову
              - особый респект. Несмотря на мое невезение. Да и что значит - "НАЕХАТЬ"?
              Ты не прав. Я тут всю жизнь живу. Это другие, "понаехали тут", а я не
              оперирую понятиями абсолютной истины - а просто делюсь своими сугубо
              частными ощущениями. Типа - "меня тут не прет" - но музыкантом то -
              ни тепло и не холодно, что какому то драному коту из подворотни не катит
              от их музыки.

              А вот что такое блюз? Я вот после всех стараний и блюзовых фестивалей
              был убежден что блюз - это Федор Чистяков. Теперь оказывается что Федор
              - это этно (это совсем не наезд на замечательного баяниста). Вместе
              с Брозманом. Оно и понятно. Типичная этно музыка. Или фолковая. Даже
              с позволения сказать - народная.

              Только я - полностью потерял стилевые ориентировки. При чем тут Воронов?
              Сумбур сплошной.

              Вопрос носков в блюзе - на мой взгляд наиболее важный, ты прав. Белые
              носки - это так сказать блюзовая классика. Черные - уж куда не шло,
              но на крайняк сойдут. Но - совершенно не допустимы носки в полосочку.
              И уж совсем кощунственны - вязанные полосатые шерстяные гетры.

              Вопрос шляп - тут почему то явная диспропорция. Мня явно не нравится
              "блюз"  в исполнении людей со шляпами на голове. (я думаю, это некая
              национальная особенность наших голов). Предполагаю - что ободок шляпы
              слишком сдавливает, и ухудшает кровоснабжение ушей. У западных музыкантов
              - я такого не заметил. Может быть шляпы - это их секретное оружие против
              нашествия русского блюза? Скорее всего - просто шляпы - не те. Те, что
              продают в сувенирных лавках - это как наши акустические гитары пермского
              мебельного комбината.  А в "ИХ" шляпах - есть секретные прорези.

              С блюзовыми ботинками - все очевидно. ТОЛЬКО из крокодиловой кожи! никакой
              кожи теленка, свиньи или там синтетики" Так что Юра - ты совершенно
              не разбираешься в блюзе. Разве можно допустить компромис с блюзовыми
              стандартами?

              По музыке кумекать. Ну, это ты вАще загнул. Какая наХ музыка?

              Надо бы премию организовать. "Бобер Года" ... "За отсутствие реальных
              музыкальных достижений за истекший период". Номинант номер один - наш
              президент. Ни одной песни не спел за весь срок!

              С номинантами - тоже проблем не будет. Или назвать ее  - "За верность
              традициям". Типа 30 лет все та же нота и т.п.

              Весна. Скучно. Хочется блюзового безумия.'
