      text: "Народу мало - ? Верный признак настоящего блюза :-/\nА я вот фильм смотрел\
        \ (не подскажите люди добрые как он называется?) Там такой старый негритянский\
        \ хрен катался в доме престарелых на каталке и дует в гармошку. Мне - понравилось.\
        \ Типа - неплохо так дует. Я вот как Петровича послушаю - тоже блин дует.\
        \ Круто так дует, уверенно. \nА еще смотрел (тоже не помню как) - так там\
        \ типа музыкант ездит по дельте Мисисипи со своим микрофоном (Shure SM58).\
        \ Новенький такой микрофон. И на крыльце сидят там негры. Старые, беззубые.\
        \ Что то так невнятно впаривают. Подуют в гармошку и впаривают. Еще мужик\
        \ на косяке дверном играет. Бодренько так. Или в кабаке замусоленном. Я вот\
        \ по наивности и не понял - это чего они там? Это блюз или как? Толкают телеги\
        \ про жизнь.  Нихрена не понимаю. \nА смотрел тут передачку про автогонки.\
        \ Там показывали Воронова и толкали что типа сам БиБи Кинг исполняет его блюзы!\
        \ Это же круто! Не подскажите, на каком из альбомов БиБи записал блюз Воронова\
        \ и какой? А то я по наивности сижу, и нихрена не разбираюсь кто у нас в стране\
        \ круче всех играет блюз.\nТут мои друзья из Конго спели песенку. О том -\
        \ что в их стране то красные придут, то зеленые, то анархисты, то империалисты.\
        \ все воюют, а он стоит в стороне и на все это смотрит. ТЫпа - со стороны.\
        \ И душевно так спели - 30 лет как на родине не были, а веришь им, чуствуешь\
        \ боль за страну и вину за то что бросили их плохие белые братья разбиратся\
        \ в этой каше гражданской войны. Красивая песня - жуть. Но - совсем не блюз.\
        \ Не любят они - благополучных афроамериканцев зажравшихся на своей совсем\
        \ не исторической родине. Запопсевших и заРЕПевших. Вот их слушаешь - и ВЕРИШЬ.\
        \ А вот слушаю я Петровича - и не ВЕРЮ. Или там Воронова - и тоже не верю.\n\
        Хотя боюсь - это мои тараканы. Собственные. Но с другой стороны - откуда у\
        \ меня бы взялась личная неприязнь? Нет этого. Скорее - наоборот. Безмерное\
        \ уважение к вышеназванным личностям за их безпримерный труд на ниве популяризации\
        \ блюза на столь каменистой почве. \nА тут еще посмотрел Брозмана на видео.\
        \ Вот нихрена не верю - но так круто играет, такие трюки на гитаре исполняет\
        \ - и ведь не лажает нихрена, что все равно хорошо, хоть и не верю.\nИ вот\
        \ по наивности совсем уж ничего не понимаю, блюз, не блюз, что хорошо а что\
        \ плохо и какая нахрен разница - если кайфово. \nА с Петровичем мне просто\
        \ не повезло. Наверное попал на неудачный день (гармошки были не те, (точнее\
        \ - не той тональности) комбик недостаточноЛамповый, или просто - солнечный\
        \ ветер дул не туда. Вот и не хожу на концерты больше. А сходил бы на концертов\
        \ 20-40. Так и попал бы на тот волшебный где Петрович бы \"играл мало, но\
        \ весьма смачно...\". \nИ Вороновым тоже не повезло. Его звукреж так перегрузил\
        \ зал - что был слышен только невнятный гул. Пришлось из зала убежать. А остался\
        \ бы - глядишь И понял бы наконец - что это за музыка которую \"считают\"\
        \ блюзом. А то я по наивности думаю что блюз - это то что втюхивали те самые\
        \ - на крыльце - из дельты Мисисипи. Или на дверном косяке, но не в суть важно.\
        \ Что то такое - чему веришь. Той нехитрой истории что рассказывают."
