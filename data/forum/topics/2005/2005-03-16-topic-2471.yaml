              то я уверен - его альбом наверняка смог бы завоевать мое доверие. А
              так - мы его конечно любим и уважаем, но вовсе не за музыкальное творчество.
              А за то - в чем он безусловный профессионал.

              Понимаете - я ведь почему про шляпы и носки. Это все - внешние, формальные
              признаки БЛЮЗА и явно не основные. Как скажем и 12 тактная структура,
              как гармонический блюзовый ряд - это все рассосано в учебниках и преподается
              в музыкальных училищах. И выходят оттудова выпускники в полном убеждении
              что они ЗНАЮТ, что такое блюз и как его играть. Вот скажем - как Земфира.
              Я уже этот клип ее пару раз по телеку видел - с названием - блюз.

              А вот не самый плохой музыкант - Мик Джагер - специально нанимал отцов
              блюза, чтобы они его НАУЧИЛИ БЛЮЗУ. Ездил к ним. Сейшенил. Есть тому
              аудиоподтерждения. А вот - так и не научился. Т.е музыка - как бы на
              основе блюза. А вот того - чего то непонятного, так и не уловил. О чем
              сам неоднократно заявлял. И мне кажется  - наивно пологать что наш,
              российский музыкант выросший на машине времени, "Одессе маме" и подмосковных
              вечерах, и послушав - ну пусть не 5 (тут Федор уж явно переборщил),
              а 7, или даже 15 альбомов вдруг возьмет, и заиграет БЛЮЗ.

              Мне тут хороший музыкант из Конго рассказывал о детских считалочках
              что у них в детских садиках и школах. Там ТАКИЕ ритмические рисунки,
              мама дорогая. Я думаю что только поняв их и научившись считать не только
              до четырех четвертей можно будет чуть чуть, самую малость, приблизится
