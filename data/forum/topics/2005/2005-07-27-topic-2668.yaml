      subject: Зетцер и разогрев
      deleted: false
      text: 'Не совсем в тему сабжа, но всё-таки:

        Вот <a href="http://www.beatles.ru/postman/forum_messages.asp?msg_id=5586&cpage=2">здесь</a> прочёл что у Зетцера и Стиви Рэй Воэна было несколько совместных выступлений коллективов в единой гастрольной программе.

        Вот, что говорит сам Брайан:

        That night at "Mud Island" in Memphis I was watching him [Стиви] from the side and he called me up onstage. He[Стиви] handed me his guitar and he said, "Play!". I didn''t know what to expect. I thought it would be really loud and just, you know, all over the stage. It wasn''t though, it was about as loud as I set my guitars. It even kind of sounded like mine. I was so surprised. He stood there in front of the pedal board with his arms crossed just hitting different pedals. At that moment I realized...jeez, it''s all about what''s in this guy''s fingers. What can I say? He was one of the truly great guitar players. We never played together at the same time, but I''ll never forget that night.

        <img src="http://www.beatles.ru/img/f/267/267592.jpg">'
