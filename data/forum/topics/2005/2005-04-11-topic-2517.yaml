    text: '4 года назад, именно 11 апреля, в Кремлевском Дворце Съездов был концерт
      Клаптона. В холле я с товарищем встретили Н.А. Мы подошли, он узнал нас (точнее
      Сергея Бабаева, мы вместе приезжали на концерт). так нармальна поговорили, Николай
      представил нас своим друзьям: "Вот, товарищи из Туркмении. Тоже играют там блюз
      :-)" Приятно было. Оказывается, в тот день у него было ДР - 45 лет! Концерт
      Клаптона - хороший подарок :-)

      Я никогда не забуду приезд "Лиги Блюза" летом 1991в Ашхабад. Те два концерта
      в июле, во многом полияли на меня. В зале было человек 50 (ну а что вы хотите
      в советской азиатской республике), но как они играли!.. Я был в восторге. Тогда
      Н.А. рассказал нам что Johnny B. Goode это не "Джонни будь хорошим" (а я в этом
      нисколько не сомневался), а имя паренька.

      Кстати, насколько я помню, что бы привезти сюда "Лигу Блюза" наш ашхабадский
      рок-клуб сначала пригласил сюда "Наталью Гулькину (экс-Мираж)" на этом сделал
      деньги и пригласил "ЛБ", при этом концерт был бесплатным: с самого начала было
      понятно что концерт коммерчески не окупится. По сути, рок-клуб организовал приезд
      ЛБ для небольшой группы людей, для музыкантов, в том числе для нас, тогда ещё
      18-летних пацанов. За что рок-клубу Спасибо.

      Что-то я совмес от сабжа ушёл :-)

      Кажись что Н.А. и не бывает здесь на форуме, но хоть и с опозданием хочу поздравить
      Н.А. с 49-летием. Здоровья, удачи, творческих узбеков (и что бы другие среднеазиатские
      республики не забывал :-)'
