                text: "Да, традиция блюза становится слабее.  Лучшие блюзовые артисты нас покидают один за другим.  Но я не согласен, что все уже позади.  Далеко не так.  Еще много людей исполняют блюз в настоящее время, поют и играют то, что сейчас волнует, общаются на блюзовом языке.  Здесь оригинальные песни не обязательны.  Даже такие, как Muddy Waters, BB King, и John Lee Hooker исполняли мало чисто своих песен. Но они пользовались уже известными классическими песнями в качестве механизма блюзового общения и в настоящее время.  Тем самым они рассказывали именно свои истории.  Это еще происходит, и в южной части США довольно часто.  \n\nMuddy"
