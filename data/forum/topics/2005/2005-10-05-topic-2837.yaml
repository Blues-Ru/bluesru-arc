            text: "Блюз - это зеркало настоящей жизни, голой настоящей жизни без краски. Поэтому он покрывает, и блатняк, и все остальное, что имеет отношение к ежедневным испытаниям людей.  Я согласен с замечанием Мишуриса по поводу \"частушек.\"  И в США многие люди считают, что блюз - это просто народная музыка Американских негров.  Кончечно, корни блюза лежат там.  Но блюз давно развивается рядом с джазом и госпелом, как важная область настоящего музыкального искусства.    \n\n\nMuddy"
