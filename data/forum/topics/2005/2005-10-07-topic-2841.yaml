      text: "Подвиг блюз-рокера \nКак Джон Праймер и Уайт-Белов Москву на уши ставили \n  \n \n     Вставай, струна огромная!\
        \ Первый осенний месяц года стал настоящим праздником для тех, кто не хочет гнаться за музыкальной модой, предпочитая\
        \ натужным неомейнстримовым мероприятиям блюзовые, например, клубы. Там все по-прежнему скромно, но душевно. В подвалы,\
        \ где бьет ключом взрослая андеграундная жизнь, по-взрослому погрузилась рок-поэтесса и рок-критикесса Марга Пушкина.\
        \ Благодаря ее постоянным усилиям читатели “ЗД”, хоть и спорадически, но все-таки не теряют пульса подлинно культурной\
        \ музыкальной жизни, с удивлением обнаруживая, что таковая еще не перевелась…\n     \n     Великая блюзовая буза случилась\
        \ в столице во второй половине сентября. Московские музыканты, решив, что спасение утопающих во всякой попсе и псевдо-рок-н-ролле\
        \ — дело рук самих утопающих, самостоятельно скинулись по паре баксов и притащили в столицу одного из последних могикан\
        \ чикагского блюза по имени Джон Праймер. Щупловатый темнокожий гитарист 60 лет от роду, в не очень глаженных черных\
        \ штанах, темной рубахе, жилетке и шляпе, здорово смахивал на персонажа американских фильмов о чертовых музыкантах,\
        \ родившихся с блюзом в крови и промаявшихся несколько полнолуний подряд на перекрестке с преступной целью продать\
        \ свою душу Дьяволу в обмен на всяческие блюзовые блага. \n     Видимо, попавшийся Джону Дьявол был представителем\
        \ нечистой силы средней руки, ибо сделка состоялась, да не все вышло гладко. Кто слушал записи Праймера, почему-то\
        \ решал, что ничего суперского и особенного музыкант из себя не представлял, — особый дух Джоновой магии терялся на\
        \ виниле (а выпустил он свой первый альбом в 46 лет!). Зато в остальном все было чики-поки: вкалывал Праймер в клубах,\
        \ не покладая гитары, играл с легендарным Вилли Диксоном, потом с Мадди Уотерсом, родил 8 детей, уже заимел внуков,\
        \ получил ярлычок “Последний традиционалист Чикаго”, успел погоревать, что нет у него последователей, и, наконец,\
        \ объявился в Москве. В компании аргентинцев: гитарист — аргентинец, басист — аргентинец, ударные — тоже аргентинец.\
        \ \n     До последнего момента я никак не могла понять, зачем надо было тащить в Москву аргентинскую ритм-секцию,\
        \ пока до меня не дошло: знали эти замороженные с виду парни всякие блюзовые фишки, крючочки и загогулины, известные\
        \ только Праймеру, умели читать его мысли со спины… Эх, какие высокие, низкие звуки издавал этот огромный негритянский\
        \ рот под тонкими усиками, какое дивное вибратто! А играл-то он как здорово… Наплевав на все контракты, временнЫе\
        \ ограничения — он мог бы играть и петь сутками и при этом выглядеть как свежий парниковый огурчик. Четыре концерта\
        \ за два дня в Москве, а потом — Рязань, где, если верить поговорке, грибы с глазами. Но оказалось, что грибы там\
        \ еще и с ушами, причем чутко реагирующими на блюз…\n     Наши бузотеры-соотечественники, что на свой страх и риск\
        \ притащили Праймера в обожравшуюся всякими музыкальными новинками и старинками столицу, тоже не ударили в грязь лицом,\
        \ выходя с ним на одну сцену. Юрий Каверкин с его Dirty Dozen и Доктор Аграновский со своим “Черным Хлебом”, а также\
        \ приглашенными гитаристом Игорем Бойко и гармошечником Братецким еще раз доказали, что российский блюзмен — он и\
        \ без торговой точки на пресловутом перекрестке Блюзмен с большой буквы. \n     Судя по громадью планов наших блюзовиков,\
        \ сидели мы в том зале отнюдь не в последний раз — вот только была бы у товарищей та самая пара баксов, чтобы скинуться.\
        \ Глядишь, и трудолюбивый Праймер еще раз приедет, да не один, а с младшей дочкой, которой и года-то нет, и Фил Гай,\
        \ младший брат Бадди Гая… И еще кто-нибудь, такой неожиданный и весь сотворенный из блюзовых слез, крови и пота…\n\
        * * *\n     Но это лишь продолжение Великой Сентябрьской Блюзовой Истории. А вот начало было положено несгибаемым\
        \ блюз-рокером Алексеем Уайтом-Беловым и 35-летием группы “Удачное Приобретение”. \n     В течение 2 часов 40 минут\
        \ на сцену выходили люди, исповедующие религию Блюза, каждый по-своему. Явления гитарной жизни демонстрировали уже\
        \ упоминавшийся Игорь Бойко, дуэт во главе с самобытным Иваном Смирновым, Леван Ломидзе, Игорь Золотухин (в шутку\
        \ названный Беловым Роги Нихутолоз и тем самым превращенный в норвежца), Алик Сикорский. Рубился и оригинальный состав\
        \ “Приобретения” в лице самого Уайта, Владимира Матецкого и Петровича (Михаила Соколова) на ударных. К удивлению присутствующих\
        \ Уайт первую половину концерта фигурял в арабском одеянии, вызывая явное неудовольствие моего соседа, увидевшего\
        \ в этом тайный политический подтекст. Однако подозревать Алексея в сочувствии террористам крайне нелепо. Это одеяние\
        \ — лишь напоминание о том, как он выходил на сцену исторического рок-фестиваля “Тбилиси-80” в составе не “Удачного\
        \ Приобретения”, а группы “Глобус”. Уайт, будучи по натуре человеком проницательным, еще до начала фестиваля понял,\
        \ что всех участников соответствующие службы берут под колпак и после окончания действа начнут мочить почем зря (напомню\
        \ для тех, кто позабыл или еще не родился в том далеком 1980-м, что рок и блюз считались в те годы жанром крайне подрывного,\
        \ антигосударственного толка). Поэтому и замаскировался он тогда под интернационал, что официально поощрялось, и сохранил,\
        \ между прочим, работу в МОМА (Московском объединении музыкальных ансамблей). А за ту работу в те годы многие могли\
        \ душу Дьяволу отдать, как негры за блюз… \n     Многие музыканты, приехав из Тбилиси, лишились надежных рабочих мест\
        \ и вылетели из комсомола. Последнее Уайту не грозило — в рядах молодых строителей коммунизма он принципиально не\
        \ состоял…\n     Одним из украшений юбилейного концерта, несомненно, стало выступление известного критика А.К.Троицкого,\
        \ обтянувшего свою мощную грудь майкой с тройным изображением модного в богемных и околобогемных кругах партизана\
        \ Че Гевары. При этом я подозреваю, что идея революции лично Артемию Кивовичу как прирожденному интеллигенту, конечно,\
        \ ненавистна, и вот думаю: “Стал бы Че церемониться с нашим бомондом, приди он здесь к власти? Расстрелял бы всех\
        \ к чертовой матери, как на Кубе со своим дружком Фиделем, и даже маечки с его изображением бы не помогли…” \n   \
        \  Артемий трогательно поведал аудитории о том, как он учился у Белова-старшего всяким интересным словам и словосочетаниям.\
        \ Подтверждаю, словарь Уайта действительно богат и интересен, хоть сейчас издавай. Один глагол “штопаться” (тусоваться,\
        \ появляться то в одном составе, то в другом) чего стоит! \n     …И заиграла тяжелая музыка, и застучал по барабанам\
        \ виртуознейший Сергей Григорян, и ненавидящий все тяжелое и немодное Троицкий заблажил, захрипел старинный хит “In-A-Gadda-Da-Vida”\
        \ группы Iron Butterfly. Выражаясь по-русски, своим пением мимо сада он нанес мощный удар по соседям. Западные музыканты,\
        \ которые, успев помереть за эти годы, оккупировали в райских кущах всякие плодовые деревья, от столь неожиданного\
        \ звукового удара посыпались с веток гнилыми грушами. Артемий вообще охоч до музыкальных изголений, граничащих с издевательством.\
        \ Помнится, он на каком-то из юбилеев Примадонны (не к блюзу будет помянута) таким же макаром поизмывался над “Королевой”\
        \ — песней и ее живым воплощением. И все натужно улыбались, сделав вид, что это всего лишь милая интеллигентская шутка…\n\
        \     Короче. Было здорово, и хиты были сыграны, и кое-что выпито теми, кто еще может пить, а кто не может… Тот обсуждал,\
        \ какие хиты были сыграны и сколько было выпито теми, кто еще может пить, а рефреном этой нескончаемой песни можно\
        \ считать слова: “Да-а, не всякая группа доживет до своего 35-летия, не каждый музыкант может позволить себе купить\
        \ такие классные красные штаны, как Уайт, и не все понимают, что играть Джими Хендрикса в наше время так, чтоб дух\
        \ захватывало, — подвиг. Если не разведчика, то блюз-рокера уж точно!”\n     На окончание блюзовой истории — возвращение\
        \ группы “Лига Блюза”, певицы Арины и приезд легендарного Colosseum — ни сил, ни места уже нет. Тем более что меня\
        \ на том празднике жизни не было…\n      \nМосковский Комсомолец\nот 07.10.2005\n Марга ПУШКИНА"
