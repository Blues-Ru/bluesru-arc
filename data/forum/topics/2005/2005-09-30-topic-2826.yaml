        deleted: false
        text: 'По-моему Magic Slim - это самый настоящий живой блюз, что можно слушать
          сегодня.  Он самый сильный представитель великой традиции Чикаго "Southside."  Его
          концерты обычно очень крутые.  Только не надо его слишком угощать по-русски
          до концерта.  Он может забыться и очень ранно напиться.  Я это видел раз
          в Париже, и концерт накрылся.


          Muddy'
