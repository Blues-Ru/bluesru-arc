        text: 'Magic Slim - звезда первой величины и побывать на его живом выступлении
          - просто подарок. Но и прошлых эфесных исполнителей я назвать мутными не
          могу.

          Кстати, вообще не считаю, что на Эфесах есть какой-то хедлайнер. Эфес пытается
          показать разные стили и стороны блюза и это у него прекрасно получается.
          Сравнивать того же Slim-a и Buckwheat Zydeco - уже довольно странно и, на
          мой взгляд, неправильно. Это несколько разные направления.

          Короче говоря, подбор приезжающих гостей - очень порадовал. Думаю, что даже
          возможные проблемы с организацией или качеством звука не смогут омрачить
          такой праздник!

          ;)))'
