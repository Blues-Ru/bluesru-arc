        deleted: false
        text: Да, они толстенные. Но в данном случае "medium" --- это не качество, а _название_. .013" струны для акустики
          _называются_ medium, .012" --- light, .011" --- custom light, а .010" --- extra light (в чём легко убедиться, посмотрев
          на маркировку на упаковке,  например). Так исторически сложилось :)
