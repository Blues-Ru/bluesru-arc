          deleted: false
          text: 'Дим, а сильно ли (заметно ли) сказывается настройка гитары со струнами 13 на пол-тона ниже?

            Я часто втречал упамянания о том что СРВ играл на таких струнах, поэтому не сомневаюсь что так оно и было.

            А вот недавно прочёл такую фигню будто он, что бы не очень сильно уродовать руки, опускал кончики пальцев в мгновенный
            клей (тот что за несколько секунд сохнет). Но после концерта или репетиций -- всё до мяса-крови... Об этом написано
            в книге “Stevie Ray Vaughan: Caught in the Crossfire” в интервью 28.06.1993 Патоски (один из авторов) в присутствии
            DT, Buddy, Эрика  сказал следующее:

            His[SRV] contemporaries would have had blood all over their fingertips, and in fact Stevie had on numerous occasions
            torn up his fingers in such a way that he rather than ah go to a lighter gauge string he just whipped out some
            crazy glue, put them on any cuts or or torn calluses on his finger and got back out there and played. I think
            that those physical abilities to to handle something that tough made his playing sound tougher.

            <i>Я сам эту книгу не читал, этот фрагмент я скопировал с <a href="http://www.beatles.ru/postman/forum_messages.asp?msg_id=5586&cpage=16">форума</a>  </i>

            С удивлением об этом читаю... Всё-таки похоже на вымысел. Я не думаю что даже при его агресивной манере игры его
            пальцы разбивались в кровь (т.к. многолетняя практика укрепляет кожу пальцев), и я прям не знаю, даже сомневаюсь,
            что клей как-то может помочь. Хотелось бы узать: может ли это на самом деле помочь?'
