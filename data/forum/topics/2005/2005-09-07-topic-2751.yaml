    text: "http://www.proza.ru/texts/2000/10/21-26.html\nОсенний блюз\nРесничкина\nВечер шелестит за пластинками моих динамиков\
      \ влажными шинами троллейбусов и железным эхом электрических проводов. Я иду по пути Обратно…\nЯ слушаю город. Женщина-манекен,\
      \ поймав эхо ритма в моих наушниках, плавно улыбнулась на другом конце улицы. Небо…\nЭто лето принесло небу богатый\
      \ урожай. Там трехмесячный ласковый кот Федька с перебитым диваном позвоночником, подмигивая серо-зеленым глазом, наблюдает\
      \ свою непрожитую осень. Отрывные листки календаря, испещренные вчерашним днем страницы ежедневника. И еще полчища комаров\
      \ и мух, окончивших симфонию жужжания под моим холмом Венеры…Я знаю, Федька в раю. Он будет в следующей жизни этаким\
      \ индивидом, промелькнувшим в дымчатом BMW, с человеческим затылком и лоснящимися боками… в сорок лет вздрагивающим\
      \ от звука захлопываемого дивана.\nСвои шаги не слышны, как ритм сердца, внизу, где капли обгоняют падающие листья.\
      \ Там, где две их армии желто-зеленых устраивают вихревое сражение на карте асфальта… а исход битвы будет решен всего\
      \ лишь подавляющей численностью наземных.\nЖизнь застыла зарисовкой перехода, секундой стоп-кадра, когда стрелки замкнувшись\
      \ на двенадцатой цифре, дадут ход зиме. \nЯ смотрю на дышащий город, искрящийся светом витражей и лампочек накаливания\
      \ в террариумах окон. Люди-ящерицы и люди жар-птицы. Вот где-то рядом призрак Эдема обдал меня запахом достатка - дымным\
      \ маслом жареной осетрины и ферментного одеколона. Память… Июльская жара уже давно испарилась клубящимся словесным паром,\
      \ живя в подмышечных впадинах, цепляясь сегодня за летние гастрольные афишки и промокшие этикетки выпитой \"Кока-колы\"\
      . \nМифология осеннего жертвоприношения. Потемневшее небо движется, грозясь горизонтом вернуть утраченные в землю капли…\n\
      Судьба благословила досмотреть сюжет четверостишия времен года. Мы наблюдаем осень. Нас много - имеющих счастье ощутить\
      \ намокший рукав и шершавость поручня на пути домой… Обдав неверным жаром полуискусственного лета, шипящие двери салона\
      \ впускают… И движутся стрелки. И мигает зеленым глазом кошачий блик светофора.\n© Copyright: Ресничкина, 2000   ЕНД:\
      \ 2010210026"
