    text: 'Почему я искал именно эту картинку. В году примерно 1988 я был в г.Мары (в английском написании "Mary" :-) и там
      в газете Марыйская Правда (печать ч/б, ужасная) увидел рекламу этого одеколона: упаковка и сам флакон стояли на... виниловой
      пластинке. Прям варварство какое-то... Лейбл диска был сокрыт. Запомнилась мне та реклама.

      И ещё одна фича связанная со словом Блюз. В фильме В Джазе Только Девушки когда они все заканчивают свой первый концерт,
      их дирежёриха объявляет о завершении: А напоследок прозвучит (медленный или лирический) блюз. что-то в этом роде...
      Звучит какая-та музЫка малоимеющая отношение к блУзу :-)'
