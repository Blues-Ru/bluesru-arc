  deleted: false
  text: 'Эйрик Бергене со своей группой попал в финал всенорвежского конкурса Underwood
    (финалистов выбрали из 400-х групп-претендентов разной стилистики), проходящий
    в привязке к огромному фестивалю Norwegian Wood Festival. Сейчас у них проходит
    интернет-голование, 8 групп по результатам этого голосования будут выступать на
    фестивале в финале. Если вы были на концерте Эйрика, и вам понравилось, проголосуйте
    за него в вебе ;) Для этого нужно пойти на страницу


    http://www.nrk.no/musikk/festival/norwegian_wood/4650018.html


    Найти Eirik Bergene Band в списке, на следующей странице нажать "Stem her!", после
    чего опять найти Eirik Bergene Band в списке и проголосовать.'
