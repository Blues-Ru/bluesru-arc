          text: "В фактах ты прав. Перефразируя твои слова: Брозман - супер-инструменталист и отличный стилист, все, что он\
            \ делает, делает круто. Похож на академика благодаря своему имиджу. Один устраивает супер-шоу. Из исполнения блюзов\
            \ делает полное стебалово. Блюзовым пафосом от него и не пахло. \n\nВесь вопрос в том, что слышно за этими фактами?\
            \ Для меня он - крутейший чувак, ты, может, чего-то не расслышал. И что за странный вопрос о том, как нужно, и\
            \ как не нужно играть блюз??? Если все будут делать как нужно, то все будут это делать одинаково. А такой блюз\
            \ нам не нужен. Как Боб играть блюз, разумеется, пытаться бессмысленно, это и не нужно.\n\nДля меня любой музыкант\
            \ представляет интерес не постольку, поскольку он соответствут усредненному \"правильному\" образцу, а тем, если\
            \ ли в его музыке что-то интересное и не банальное, у каждого - свое. По этой части Брозман для меня в первых\
            \ рядах."
