                subject: Все музыкальные стили имеют право на существование, если они хорошие )))
                deleted: false
                text: 'Давайте разделим блюзменов и музыкантов, исполняющих блюз, но не живущих жизнью исконно-посконных блюзменов,
                  и будет мир и согласие во человецех!

                  А то получится, что классический музыкант должен всю дорогу во фраке ходить и жить в усадьбе, среди добрых
                  пейзан, а рок-музыкант на сцену должен выходить с капельницей с героином для полного вживания в образ и
                  соответствия стилю жизни.

                  А что делать бедным артистам кино, которые постоянно в амплуа негодяев? Где же искренность, когда изнасиловав
                  на экране красотку, они возвращаются домой к жене и детям! Сие неправильно есть! Марш в Измайловский парк
                  маньячить! Даёшь стиль жизни!


                  Напоминаю, что любое искусство есть условность и попытка передачи чужого жизненного опыта и эмоций. Степень
                  достоверности попытки принимается нами за искренность артиста, хотя это всего лишь вживание в образ на момент
                  исполнения. Слез со сцены - выпал из образа и превратился в частное лицо.'
