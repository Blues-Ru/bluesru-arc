        text: "Типичный пример академического подхода к блюзу. если другие, как правило музыкально малограмотные блюзьмены\
          \ осваивают одну - две \"фишки\" в игре на гитаре, то Брозман их знает ВСе!!! мало того - виртуозно их применяет\
          \ без всякой лажи, в количестве 20-30 штук в каждой песне. Как он умудряется долбить по гитаре ножкой стула используя\
          \ гитару как инструмент ударный и при этом извлекать чистые ноты и все это еще и в темпе - ума не приложу. \nСтрашный\
          \ человек. Учитель и собиратель экзотических гитар и приемов игры на них. Профессор консерватории. Фигляр и трюкач.\
          \ Всем гитаристам стоит поучится - как можно играть на гитаре, всем блюзменам - тоже стоит поучится - как не нужно\
          \ играть блюз."
