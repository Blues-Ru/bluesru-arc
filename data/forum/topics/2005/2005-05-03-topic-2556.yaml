            text: "Дело вовсе не в том, что Брозман отличается от остальных. Ты правильно перефразировал слова - да Музыкант.\
              \ да, очень хороший Музыкант. Офигительный гитарист. \nТолько вот для меня блюз - это в первую очередь - искренность.\
              \ Причем, не наигранная перед зеркалом. а блюз (на мой непросвященный взгляд человека \"не в теме\") - это стиль\
              \ жизни. Ну, не обязательно конечно самому работать на плантации или ждать луча прожектора от 12-ти часового\
              \ проезжающего поезда прильнув к тюремной решетке. Но вот хотя бы стены красить - как минимум надо... :-) Чтобы\
              \ достоверность была.\nУ Брозмана же - блюз в стиле клоунады. Да, он крутейший чувак. Да - надо ОБЯЗАТЕЛЬНО\
              \ сходить на него любому музыканту дергающему за струны. Но вот играть так блюз - это пожалуй не стоит. Потому\
              \ как вместо искренности - набитое всякими блюзовыми \"фишечками\" трюкачество. Тот самый формализм в чистом\
              \ виде. Блюз по форме лишенный главного.\nодно конечно радует. то что \"пафоса\" тоже нет. Это пожалуй было\
              \ бы еще круче... :-("
