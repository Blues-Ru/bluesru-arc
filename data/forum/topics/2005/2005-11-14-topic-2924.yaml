      text: 'никто тут ничем особе не интересуется. Блюза в СССР не было. В России он есть в форме кабацкой музыки (халтуры разные), на грани с танцевальной попсой (буги, типа рок-н-ролл) и клоунадой. Есть люди типа Каверкина Юрия (музыка не для всех), которые играют свою жёсткую музыку, но это почти не формат в кабаках и наших "клубах". Большинство из тех, кто поет и играет якобы блюзы, не знают английского языка и не знают самой МУЗЫКИ. можно сказать, что никакого блюза тут нет и быть не может. хотя есть парни, что пишут и свои песни (Мишурис, например...)


