    text: "на который нет короткого ответа.\nблюз приходил в москву через джаз или рок-обработки. Если любителей Роллинг стоунз было совсем немного (песня Angie - исключение), то ценителей Led Zeppelin было - пруд пруди. Альбомы производства Chess были исключительной редкостью. В связи с этим и понимание блюза было весьма искаженным. Особый вред нанесло издание альбома голландской группы Livin' Blues на польской фирме - их творчество было воспринято блюзовым эталоном просто по той причине, что других \"блюзов\" не было (если не считать пластинок Армстронга и Эллингтона - но это уже крен в другую сторону). Но были и музыканты, выискивавшие изначальный блюз и исполнявшие свои песни под акустику - разумеется, их записи не сохранились. \nТак что \"блюзы\" были и репертуаре оркестров Утесова и Цфасмана в 30-х годах. Имя Бесси Смит было известно меломанам и при горячем желании, можно было найти и ее записи. Но фолк-блюз и его электрофицированный чикагский вариант были совершенно недоступны (в Москве, думаю, было два-три филофониста, обладавшие этими записями - но, видимо, делиться ими они не собирались). На заре перестойки Дм.Ухов подготовил несколько пластинок для фирмы \"мелодия\" (Хаулин Вулф, Лайтнин Хопкинс и пр.) - только с этого момента началось понимание, что блюз существует по своим законам, а не является частью джаза и рок-музыки. Началось - для многих, подчеркиваю, что единичные исключения были и раньше."
