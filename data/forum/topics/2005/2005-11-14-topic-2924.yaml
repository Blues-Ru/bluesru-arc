      text: Например, моё личное знакомство с настоящим блюзом совершилось в начале 1990-х, - в основном, именно по пластинкам серии, которую готовил Дм. Ухов. И сегодня, уже ознакомившись со многим и многим, я по-прежнему считаю, что те два винила - Мадди Уотерс и Хаулин Вулф, - могут служить образцовым введением как в творчество указанных артистов, так и в мир блюза вообще, поданным с большим знанием предмета, любовью к нему и вкусом.
