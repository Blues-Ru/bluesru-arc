      text: "Я вспоминаю ранние 70-е, когда я жил в Крыму, через который шёл большой поток привозимого в СССР винила. Скажем так, новинки рока появлялись у нас с задержкой не более 2-3 месяцев - аккурат чтобы дальние каботажники смотались в Болгарию или Югославию и вернулись обратно. Поскольку на блюз не было массового спроса от барыг, то моряки его и не везли. Я помню практически всё, что проходило через меня и моих приятелей - в старших классах и в институте я был активным участником процесса =))\nСамыми блюзовыми группами считались LZ, CCR и какой-то непонятный Bob Seger & The Silver Bullet Band (по-моему так). Найкрутейшими блюезами считались Since I Have Been Loving You и Mistreated (Deep Purple, Burn - кстати, очень рекомендую всем нашим молодым гитаристам поковырять её на досуге, отличная хрестоматия всех фишек Блэкмора в полном его расцвете). Немного слушали Fleetwood Mac, до сих пор помню Bare Trees на ленте, воспроизводившейся почему-то процентов на 25 быстрее, из-за чего звук был совершенно фантастический, но мы по наивности считали что фирмачи реально так шустро лабают и поют писклявыми голосами. О! Вспомнил крутую группу The Bread со сладкими песенками, они почему-то тоже проходили по блюзовой статье.\nЯ сознательно опускаю Beatles и Rolling Stones - куда ж без них, но Роллинги считались более скушной пролетарской группой.\nПочему-то к блюзу причисляли некоторые песни Status Quo и Suzie Quattro. Никогда к блюзу не относили Jimi Hendrix, в чём мы солидарны с неграми Muddy )) \nСлушать Elvis Presley считалось почему-то признаком плохого вкуса..\n\nКороче, путаница в умах советской молодежи и пОдростков была изрядная. А вы говорите.."
