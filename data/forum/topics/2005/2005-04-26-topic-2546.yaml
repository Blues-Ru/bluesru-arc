    text: 'И еще раз убедился, что у норвегов очень классная ритм-секция.

      Это уже немолодые Frode Storvik (drums) и ветеран бассист Bill Troiani (до этого
      я видел как он играет у Морюда и Кид Андерссена).

      Барабанщик такое выделывал....он очень грамотно подстраивался под манеру игры
      Бюска.

      Этот состав,с моей точки зрения, самый лучший из всех норвегов, которых я видел
      здесь. Да и Эйрик здесь оказался весьма кстати.

      Хотелось бы их еще раз увидеть и услышать - они супер!!!!'
