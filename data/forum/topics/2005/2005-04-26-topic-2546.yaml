  deleted: false
  text: 'Вот я и прикоснулся к искусству:) Для меня это лишь второй концерт Бюска,
    и первый – Бергене. Первый был в теперь уже далёком 2002-м в Le Club''е. Почему-то
    считается, что понедельник и вторник – абсолютно не концертные дни. Фигня. Очень
    даже подходящий день понедельник, и сегодняшний концерт – лучшее тому подтверждение.
    RJ Club был под завязку, что, безусловно, очень приятно. Вот они результаты трудов
    Фёдора Романенко по популяризации скандинавского блюза в России. Кто-нибудь скажет,
    ну, да, конечно, ещё бы не пойти на халявный концерт! Не в этом суть. На многие
    халявные концерты не приходит и малой толики того количества народа, которое было
    сегодня.


    Теперь, собственно, про сам концерт. Бюск нынче уже не тот набриолиненный парень,
    зажигавший почти 3 года назад на сцене пафосного Le Club''а. Сегодня в Бюске со
    товарищи гораздо больше блюза, местами даже блюз-рока (естественно, с рокабильным
    оттенком), чем раньше. Но, как и тогда, звук его гитары либо нарочито грязен,
    либо прозрачно-протяжно чист. Среднего нет. Плюс всяческие повизгивания, поскрипывания
    …. и тишина… и зал замирает, потому что знает, что дальше последует взрыв. А уж
    чего-чего, а темперамента у этих парней не занимать. Вот и Бергене – совсем молодой
    парень, только недавно влившийся в группу, но, блин, какой напор и драйв! Музыкант
    с очень агрессивно-подвижной манерой игры и неплохими вокальными данными. Нет,
    конечно, все вели себя достаточно сдержанно, всё-таки альбом писался, ситуация
    обязывала, но и тут Бюск не удержался, выдав-таки под занавес несколько своих
    хоть на этот раз и скупых, но фирменных «коленец».


    «Холоднокровные» скандинавы отыграли 3 полноценных отделения общим временем почти
    3 часа – таков итог этого вечера. Это было супер!'
