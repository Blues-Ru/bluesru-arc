            text: "В далекие 50-е, или даже 30-е годы - звукозаписью занимались Инженеры. Это были высоко образованные люди,\
              \ с широким кругозором, хорошо разбирающиеся в психоакустике, физике, схемотехнике и музыке. Они бережно писали\
              \ на ламповые микрофоны, с помощью ламповых же преампов (пультов тогда и не было вовсе), методом прямой нарезки\
              \ на восковую болванку. Стоимость восковой болванки была - 100 баксов, по тем временам - большие деньги, и если\
              \ скажем Джо Пасс и Элла не могли спеть с первого дубля, они вычитали стоимость запоротой болванки из их, и\
              \ так небольшого гонорара. Музыканты не лезли в процесс звукозаписи и занимались в основном музыкой.\nИ это\
              \ счастье продолжалось до конца 60-х годов, когда изобрели многоканальные магнитофоны, пульты, и больше не требовалось\
              \ высокое искуство постановки ОДНОГО микрофона. Появилась возможность перезаписи и мУЗЫАНТЫ решили, что они\
              \ сами способны записывать свою гениальную музыку, без всяких там Инженеров и Звукорежиссеров, только с техниками.\
              \ И не надо репитировать до отупения и офигения, всегда же можно дублик то - переписать. А потом, и нарезать\
              \ там, что надо, замедлить - убыстрить, подвинуть, переиграть и т.д. А поскольку большинство мУзыкантов - малообразованные\
              \ придурки слабо представляющее себе как образуется пространственный интерференционный гребенчатый фильтр, то\
              \ для того, чтобы защитить слушателя от идиотизма музыкантской записи-сведения и пришлось вводить выходной контроль\
              \ - с стереометрами, гониометрами РМСметрами и пр.пр.пр. На которых можно было бы отделить хотя бы САМЫЕ грубые\
              \ ошибки сведения. Поскольку если ГОНИОМЕТР показывает красный язычек вместо зеленого (специально для мУзыкантов)\
              \ - то при воспроизведении по радио, или ТиВи - пропадет (совсем) один или несколько инструментов, а при воспроизведении\
              \ на домашнем ХайЭнде - звук приобретет замечательную полосатость, скажем на диване будет слышно гитару, и она\
              \ будет громче всех, а 30 см в сторону, и ее не будет совсем. \nИ вот, бедные тетеньки, в поте лица, круглые\
              \ сутки, стараются только для того, чтобы малообразованные мУзыканты тешили свое самолюбие и не слышали, что\
