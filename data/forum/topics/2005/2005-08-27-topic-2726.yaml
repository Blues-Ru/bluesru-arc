                - id: 22549
                  parent_id: 22528
                  date: 2005-08-29 11:54
                  poster: Elicaster
                  email: elicaster(@))mmmmmmmmmail.ru
                  subject: возникают вопросы
                  deleted: false
                  text: 'Ясно что речь идёт не о творческой стороне дела, а о технической. Весьма занимательно... возникают
                    разные вопросы, вот например:

                    > Года 2 назад по сети гуляла запись, проигрывание которой на аппаратуре почти любого класса приводило
                    к выгоранию ВЧ головки в колонках.

                    Я полагаю, что колонки должны соответствовать аппаратуре, то есть, то что аппаратура (читающее устройство
                    и усилители) может выдать, то это АС должно воспроизвести. Ну уж по крайней мере те колонки которые идут
                    в комплекте с аппаратурой. Не так ли?'
                  replies:
                  - id: 22554
                    parent_id: 22549
                    date: 2005-08-29 12:54
                    poster: Матраскин
                    email: кот
                    subject: Объясняю технику дела
                    deleted: false
                    text: 'Идут. В комплекте. Но - все очень просто. Доля ВЧ сигнала в реальной музыке - довольно мала. И
                      потому, в колонках распределение мощностей головок примерно такое:

                      НЧ - 100 - 300 ВТ

                      СЧ - 15-30 ВТ

                      ВЧ - 5 - 10 ВТ

                      Усилитель под это дело - ватт 200. Частоты выше 16 кГц - уже практически не слышны, и если их замаскировать
                      реальным сигналом (с низким уровнем громкости), то естественная реакция человека когда музыка слышна
                      тихо - прибавить громкости, а если при этом на ВЧ головку начинат падать 100 Вт мощи - ясен пень, сгорает
                      она.

                      На нормальном сигнале (реальной мызыки) такое не произойдет никогда.

                      Кстати, в это же и проблема выгорания драйверов сценических мониторов. Если устроить на сцене нехилый
                      завод по ВЧ (а непрофессиональные звукрежи очень любят это делать), а моща монитора - ват 700, то драйвера
                      там стоят - максимум ват 30. Шансы выжить - только если стоит процессор который за этим следит, или
                      отдельный усилитель для ВЧ - меньшей мощности (т.е. не пассивный кроссовер в колонках, а отдельный усилитель
                      для каждой полосы)'
