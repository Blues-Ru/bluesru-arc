                  subject: Об особенностях Устройства Головы Мади Уотерса. На правах Офтопа.
                  deleted: false
                  text: 'Почему сам музыкант никогда не должен быть допущен к сведению? Да очень просто. Все дело в физике.
                    Когда вокалист поет, его тело работает резонатором. Есть характерные для данного человека частотные состовляющие
                    (певческие форманты) определяемые в частности формой его конкретной головы и носа, а так же - заполнением
                    этой самой головы (плотностью), и чем собственно больше ПУСТОТ - тем богаче и красивее голос.

                    Когда человек слушает свои записи - они уже обогащены этими частотами, и опять начинают в его голове резонировать.
                    ВСЕ вокалисты требуют удаления этих частот, и когда их вырезаешь - вокал становится ПУСТЫМ и усредненным,
                    без характерных для этого человека формант - только тогда, он начинает слышать СВОЙ голос, к которому
                    собственно и привык.

                    Т.е. Абсолютно не верно, что исполнитель сам знает лучше всех, как должна звучать его музыка. Если бы
                    Мади Уотерса допустили к сведению, мир бы никогда не узнал его голоса.

                    И это только один из примеров. Что слышит гитарист играющий на акустике? Звук излучаемый обечайкой гитары.
                    А слушатель  - со стороны верхней деки. А перкуссионист сидящий сзади - только отражения от стен. Музыканты
                    привыкшие играть на сцене и понятия не имеют, как все это слышит слушатель.'
