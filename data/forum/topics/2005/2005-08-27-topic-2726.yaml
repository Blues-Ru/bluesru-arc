                text: 'Конечно ЗА. Записи звучат ТАК плохо вовсе не из за гониометров. Гониометр это прибор позволяющий определить
                  ГРУБЕЙШИЕ ошибки на сведении. Типа нарушения фазового соотношения в стереоканале.

                  А записи 80-х звучат плохо и одинаково потому, что из профессии тогда ушли профессионалы и ручки стали крутить
                  сами музыканты - было такое увлечение. Причем музыканты музыкантов тоже исключали из процесса - типа, нахрена
                  нам кто то - вместо ударника - драм машина, играет ровнее, вместо оркестра - стринги, вместо хора - сэмплеры
                  и т.п. А посколько все это барахло лишено ИНДИВИДУАЛЬНОСТИ, то саунд отличался только тем, забивали ли вы
                  подклад на Ямахе или на Роланде, и незначительно отличался по ценовым категориям примененных на студии моделях..
                  "Бюджетные" студии привели к грубым ошибкам - когда фонограммы звучат ПО РАЗНОМУ на разных устройствах,
                  всяческие максимайзеры, компрессоры привели к тому, что нарушается комфортность прослушивания, и ничего,
                  кроме головной боли 90% современных фонограм не вызывают. Контроль  - в хорошей мастеринговой студии позволяет
                  немного исправить ситуацию, или хотя бы вернуть материал на пересведение при ГРУБЫХ ошибках кои недорежиссеры-недомузыканты
                  делают катастрофически много.

                  Кроме того, при нарезке винила возможны такие беды, как выбрасывание иголки из канавки. Для того, чтобы
                  не допустить таких бед и служил отдел контроля.

                  Или вот еще прикол. Года 2 назад по сети гуляла запись, проигрывание которой на аппаратуре почти любого
                  класса приводило к выгоранию ВЧ головки в колонках. Простейший спектроанализатор - тут же показывает в чем
                  там дело. На слух - НЕТ НИЧЕГО КРИМИНАЛЬНОГО. Что будет если такая запись выходит в тираж? 80% автомобильных,
                  домашних центров потребуют замены... Я уж не говорю о вреде здоровью домашним питомцам.

                  Только сейчас, очень медленно, ситуация исправляется. Но увы, пока не у нас. Когда к звукозаписи привлекаются
                  люди, понимающие что такое гониометр и для чего он нужен. И контроль качества фонограм происходит на всех
