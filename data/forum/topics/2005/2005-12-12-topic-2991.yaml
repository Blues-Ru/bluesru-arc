  text: 'в связи с вновь открывшимися обстоятельствами сегодня в Курсе группа Dirty D будет чествовать д-ра Аграновского лично (без ансамбля) в связи с выходом на DVD записи  концерта группы "Черный хлеб" с харпером-виртуозом Пера Джо. (Вероятно, когда выйдет DVD с записью выступления Пера Джо с группой Dirty D - тогда уж будет очередь "Черного хлеба" чествовать Юрия Каверкина). Сегодня в концерте участвуют Владимир Кожекин в роли Пера Джо, а так же Дмитрий "Груша" Красивов.

    Кому-то из тех, кто купит билет, достанется диск Alligator Records Presents Crucial Harmonica Blues'
