  text: "\"Речь\" (Череповец)\nИДЕТ \"КОЗА\" РОГАТАЯ. \n\nВсе сделали по уму. Концерты\
    \ окрестили почти по-филармонически - фестивалем музыкального искусства \"Глоток\
    \ чистой музыки\" - и предварили серьезной рекламой. Основной идеей фестиваля\
    \ стала актуальная для рок-музыки тема наркотиков, бороться с которыми внутри\
    \ отдельно взятого зала пригласили директора городского наркодиспансера Андрея\
    \ Волкова. Андрей Вячеславович пришел на открытие в радостной оранжевой футболке\
    \ и джинсах, а вовсе не в халате, каковое обстоятельство, уверен, помогло собравшимся\
    \ ближе принять говоримые им со сцены вещи. Прежде всего о том, что музыка и прочее\
    \ искусство могут увести от шприца. Наверное, ситуация с употреблением наркотиков\
    \ начнет меняться, когда врачи скинут халаты и пойдут в народ. Первый день фестиваля,\
    \ признаться, ожидаемой толпы не собрал, хотя состав участников впечатлял. Практически\
    \ все из вышеупомянутых групп выступали 1 октября, но в конце вечера концерт уже\
    \ вовсе походил на квартирник с полусотней зрителей, из которых половина сами\
    \ участники. <b>Опыт с разностилевым репертуаром как будто себя не оправдывал:\
    \ пришедшие послушать блюзы заткнувшей за пояс Эллу Фицджералд Ирины Федотовой,\
    \ которой, исполняя \"Хелло, Долли\", каким-то чудом удалось полностью самоистребить\
    \ въевшийся русский акцент, не желали внимать волосатым рокерам и, несмотря на\
    \ то, что \"уплочено\" (билет на концерт стоил 150 рублей), ретировались</b>.\
    \ Однако второй вечер получился как будто повеселее. Клуб уже трещал по швам,\
    \ а выступления \"Заложников\", \"Дарвин-клуба\" и трудно выговариваемого Karmuazine\
    \ только добавляли треска. Каждый из выступавших в оба дня обязательно произносил\
    \ хотя бы несколько агитирующих против наркотиков слов, и торговцам смертоносным\
    \ зельем в эти два вечера наверняка икалось. Зрители встречали сказанное кумирами\
    \ одобрительной \"козой\" (это такая комбинация из пальцев), которая стала кукишем\
    \ нашей рок-общественности всему наркобизнесу. И музыканты, и врачи оценили первый\
    \ опыт как положительный и договорились о новых совместных акциях."
