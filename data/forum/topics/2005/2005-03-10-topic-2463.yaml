    text: 'Народу было мало, и это несколько удивило. Неужто никто не хочет поиграть вместе в LJC?

      Очень порадовал хоум-бенд. Действительно классная команда - все профессионально и очень весело. Много разных вещей, и поэтому не надоедает. :-) Играть оказалось очень приятно - как-то всё само играется в такой компании.

      Из джемующих запомнились клавишник Стив (вдруг вышел абсолютно незнакомый парень и неплохо порубил) и Федор Романенко - редко видно на джемах, а очень зря. Да и в целом понравилось. Все старались, не так уж много ошибались, и поэтому джем оставил очень приятные впечатления.


      Так что в "Оракул" обязательно нужно сходить! Гитары в руки, гармошки в зубы, а клавиши дадут на месте :)'
