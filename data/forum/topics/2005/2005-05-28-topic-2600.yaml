    text: 'В 94г. - 9-е место, а потом работать на подпевках у людей, которые заняли
      места существенно более низкие чем она.

      Сейчас продьюсирует "Другие Правила" - проект типа фабрики звезд, но куда отбирали
      людей со слухом и голосом, и делал его Сева Новгородский в тщетной попытке внести
      на нашу "эстраду" людей работающих живьем и умеющих петь.

      Делает "саунд" "певицам" - писклям безголосым, делая такой бэк-подклад, что
      им и петь то не надо вовсе, наверное... И "певцам" в общем тоже.'
