  text: 'Сегодня по ящику была передача о т.н. музыкалькых "рабах", о тех кто записывает
    свой голос, а вот уже под их фонограмму поют другие (типа Hi-Fi, Витус и т.д.).
    И там была упамянута Мария (Маша) Кац, упамянута как вокальный продюсер. Как я
    понял, она сейчас весьма востребована и авторитетна. Помнится в 1994 она выступала
    на Евровидении (никакой конкурс) под именем Юдифь (что-то в районе 10 места).
    Но как потом я узнал, она до этого пела в Лига Блюза. А были ли (есть ли) у неё
    ещё какие-нибудь выступления в/с блюзовыми коллективами?

    И ещё другая вокалистка которая пела с Лига Блюза: Татьяна Анциферова. Тот же
    вопрос и о ней. А также где она сейчас, что делает?

    Я про неё с детства помню вот что: она пела со Львом Лешенко на закрытии Олимпиады
    в Москве в 1980г. "До Свидания Наш Ласковый Миша" :-)'
