  text: Ну и люди пришли замечательные  Жук,Мишурис,Каверкин,Омар Итковичи,Фил...Тока
    ведущего Джона опять не было.Дали помузицировать и молодым.Порадовала мощная игра
    Юры.Ваня был в ударе,за клавишными,а потом и на гитаре,а в конце весь зал под
    его управлением с азартом пел Hit The Road Jack.Миша,как всегда,был очаровательным
    конферансье,несмотря на некоторое нездоровье ну еще и пел.В общем,почаще бы такие
    события происходили...Ну и акустика очень неплохая,спасибо Юрию Петровичу за его
    усилия...
