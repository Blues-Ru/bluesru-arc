  deleted: false
  text: 'Van Morrison - Magic Time - 2005 (Geffen) ****


    Это уже третий номерной альбом Вэна в 21 веке, на этот раз на новом для него лейбле
    Geffen. Van The Man решил сделать разнообразный альбом, и это у него получилось.
    Не теряя своих кельтских и фолк-корней, он по-прежнему свободно работает по джазу,
    блюзу, соулу и кантри. Моррисон - это не просто голос, слова и мелодии, он сам
    играет на гитарах, саксофоне и губной гармошке. Ему 60 лет, а звучит он убедительно
    и ярко, а это значит, что его душа жива, а мозг хочет создавать новые песни и
    звуки.


    Диск длится около часа, на нем 13 песен - Вэн написал 10 + три кавера. В этой
    музыке нет ничего нового, но звучит она современно и радостно.


    (Блюзы тут есть!) :)))'
