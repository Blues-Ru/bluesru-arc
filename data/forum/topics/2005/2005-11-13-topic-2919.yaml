        deleted: false
        text: 'Знаю три диска с его участием.

          Первый - тут уже указан. На CD он называется "Blues Masters Vol. 3".

          Второй - документовский "Memphis Blues" DOCD-5159, где, помимо прочих, собраны записи Дх.Х.Б. 1938 года - все 5,
          из которых коммерчески изданы были всего две, на одной сорокапятке.

          Третий "Blues Live!" - записи с европейских концертов: Sleepy John Estes 1967 г. и John Henry Barbee 1964 г. (записи
          отличны от "Blues Masters Vol. 3").'
