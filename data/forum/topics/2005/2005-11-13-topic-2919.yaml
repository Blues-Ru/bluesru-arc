                          text: 'в данном зале не был. Имел возможность анализировать запись (пультовка и накамерник)

                            Вспомнил старый анекдот о схожести звукорежиссера и змеи.

                            В самом деле - не бывает катострофически плохих залов. Профессиональный человек, проводя инсталяцию
                            почти всегда сможет подобрать наиболее подходящий вариант озвучки зала, скоректировать стоячии
                            волны и собственный АЧХ зала.

                            Другой вопрос - что большинство наших инсталяторов - непроходимые идиоты, бывшие неудачники музыканты
                            и неучи ничего не понимающие  в акустике. Вся их задача - срубить бабла, впарить подороже купленный
                            по дешевке залежалый товар. Вся их "научность" связанна с выученными названиями известных фирм
                            (Маршал, нойман, меза буги, ампег и т.п), с умелым надуванием живота, и в лучшем случае - убежденностью,
                            что если хорошую аппаратуру (как у них!) свалить в кучу то все будет хорошо, а в худшем - поиском
                            "бюджетных" вариантов мексиканско-китайских бехрингеров и паров с громкими названием  - Маршал
                            и Аллен херц.

                            Или того проще. Заказывают инсталяцию "пацанам" которые подыскивают сносный вариант.

                            Пока не возникнет ситуации когда - плохой звук - на следующий концерт приходит 8 человек по билетам
                            и музыканты отказываются выступать - владельцы подобных заведений чесатся не начнут.

