  text: Говорят, что журналисты опять пришли неподготовленные, но все равно было интересно,
    Ломидзе выступил как великий популяризатор блюза и выбрал создание генетически
    модифицированных обезьян как главное событие дня. Кто-нить знает когда повтор
    или может скрипты, как на Эхе, где-нить есть?
