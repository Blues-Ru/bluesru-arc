    text: "V фестиваль «Blues.Ru – Весь Этот Блюз»\n\nПредлагает свой выбор лучших\
      \ отечественных блюзменов нынешнего сезона.\n\n1.\tПервопроходец и патриарх\
      \ игры на губной гармонике – Михаил Петрович Соколов. Неутомимый музыкант, в\
      \ нынешнем году он представил свой новый проект: “Hot Rod Band” – с которым\
      \ играет зажигательную смесь блюза и джаз-рока. Интернет-сайт: http://www.harmonicaman.ru/\n\
      \n\n2.\tИван Жук последние годы занимался этнической музыкой, лишь изредка появляясь\
      \ на блюзовых джемах. Лишь несколько месяцев назад вместе с гитаристом Алексеем\
      \ Селуяновым он собрал новый блюзовый квартет, дебют которого впечатлил всех\
      \ любителей хорошего электрогитарного блюза. Вместе с ним на фестивале выступит\
      \ партнер Жука по группе «Станция Мир» Владимир Кложекин, один из лучших и наиболее\
      \ самобытных на сегодня харперов Москвы. \n\n3.\t«Jumpin’ Cats» существует всего\
      \ полтора года, но уже обрел признание блюзовой общественности. В группе два\
      \ солиста: гитарист Владимир Русинов и клавишник Петр Репин. И две стороны их\
      \ репертуара: классика джамп-блюза и современная гитарная импровизация. Они\
      \ говорят о себе: узыкальный коллектив ориентирован на весёлый клубный вариант\
      \ блюзовой музыки. Основой стилистики является Jump и West Coast Blues. Это\
      \ направление наиболее удачно сочетает бодрость и веселье свинга с эмоциональной\
      \ глубиной блюза. Музыка, под которую можно танцевать и просто с удовольствием\
      \ слушать. Каждое выступление нацелено на прямой контакт со слушателем, включает\
      \ в себя зажигательные дуэли солистов, свободные импровизации и прямое общение\
      \ с публикой. Интернет-сайт: http://www.bluescats.ru/\n\n4.\tDirty Dozen под\
      \ руководством опытного Юрия Каверкина уникальна тем, что создает умопомрачительную\
      \ атмосферу тяжелого блюза без использования приемов рок-музыки. В репертуаре\
      \ старая блюзовая классика в оригинальных аранжировках и собственных песни.\n\
      \n5.\t«Мишурис и его оркестр» так же представляют блюз по собственным оригинальным\
      \ рецептам, в которых современный уэст-коаст встречается с элементами джамп-блюза\
      \ и ритм-энд-блюза  40-х и 50-х годов. Великолепному голосу Михаила Мишуриса\
      \ соответствует виртуозная гитарная игра Вадима Иващенко. Однако этот октет\
      \ следует считать ансамблем виртуозов. За три недели до фестиваля группа презентовала\
      \ свой дебютный альбом “I Got Money”, полностью составленный из песен собственного\
      \ сочинения. Интернет-сайт: http://www.mishouris.ru/\n\n6.\t“Svet Boogie Band”\
      \ – единственные стопроцентные традиционалисты в программе фестиваля. Возглавляемые\
      \ певцом, пианистом, харпером, гитаристом и харизматичным шоуменом Svetом, группа\
      \ с успехом выступает по европейским фестиваля Польши, Германии и Париже. По\
      \ удачному совпадению, за десять дней до фестиваля вышел первый тираж их альбома\
      \ “Nothing But Love”, так же полностью состоящий из собственных композиций.\
      \ Они играют зажигательные буги, и обладают редким талантом создавать в зале\
      \ атмосферу благодушнного веселья. Интернет-сайт: http://svetboogieband.blues.ru/\n\
      \n7.\tПо окончанию основной программы начнется блюзовый джем с участием лучших\
      \ блюзменов Москвы. Джем продлиться до 5 утра. \n\nЕжегодный фестиваль «Blues.Ru\
      \ – Весь Этот Блюз» проходит под эгидой старейшего блюзового сайта рунета «Блюз\
      \ в России» (http://www.blues.ru) и старейшей блюзовой радиопрограммы в России\
      \ «Весь Этот Блюз»\n\nФестиваль состоится в понедельник, 3 октября, в клубе\
      \ «Курс». Начало в 20.оо Клуб располагается в малом зале театра им.Гоголя, представляющем\
      \ собой отличную концертную площадку с танцполом, местами за столиками и ярусом\
      \ лож VIP. Общий антураж очень напоминает знаменитый чикагский концертный зал\
      \ House Of Blues. Кроме того, в клубе имеется второй зал, «барный», где концерт\
      \ можно наблюдать в трансляции  на большом экране. \n\nФестиль «Blues.Ru – Весь\
      \ Этот Блюз»  3 октября знаменует начало цикла блюзовых вечеров, которые теперь\
      \ будут проходить в клубе «Курс» еженедельно, по понедельникам. Следующий концерт\
      \ состоится 10 октября и будет посвящен презентации нового альбома «Мишуриса\
      \ и его Оркестра»."
