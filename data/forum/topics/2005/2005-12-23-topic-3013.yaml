  text: 'Последнее время очень устал от нашего ТВ (сериалы,реклама,реалити-шоу и пр.
    лабуда) и решился наконец подключиться к спутниковой антене.

    И что я там увидел...Сегодня канал "Ностальгия" -концерт Frank Zapp-ы

    "Baby snakes" (00.20-01.55), канал "Mezzo" концерт Джо Завинула, завтра на этом
    же канале концерт Шемикии Коупланд и много,много джаза (очень хороший музыкальный
    канал).

    Поверьте, это все не на правах рекламы... а уж очень задолбало наше ТВ.'
