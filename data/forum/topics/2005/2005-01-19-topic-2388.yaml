    text: "Dear Event Promoter,\n\nI'm writing this letter to inform all domestic\
      \ and international blues festivals that Delta Groove Productions, a relatively\
      \ new record label based in North Hollywood, California, is offering it's roster\
      \ of recording artists for live performances. \n\nLast year one of our acts,\
      \ The Mannish Boys, performed at several prominent festivals in the United States.\
      \  Their performance is an exceptionally powerful hard-hitting review.  The\
      \ Mannish Boys' first CD was released in the United States on Nov. 23rd, 2004\
      \ and it is currently the #1 CD in the Living Blues radio chart.\n\nThe reviews\
      \ for the album have been exceptional in all major publications.  Foreign distribution\
      \ for The Mannish Boys CD and all Delta Groove products will soon be  solidified.\
      \  Reviews for both the album and for live performances can be seen on our website\
      \ at www.deltagrooveproductions.com The Mannish Boy lineup consists of June\
      \ Core and Ronnie James Webber on drums and bass guitar respectively.  They\
      \ both have had outstanding careers and are currently playing with The Fabulous\
      \ Thunderbirds and Charlie Musselwhite. Keyboards in the group are by veteran\
      \ piano man Leon Blue whose career has spanned three decades. He spent almost\
      \ ten years with Ike and Tina Turner and also long periods playing with Albert\
      \ Collins, B.B. King and Joe Turner.\n\nThe two guitar players in The Mannish\
      \ Boys are Frank \"Paris Slim\" Goldwasser and Kirk Fletcher.  Frank is a veteran\
      \ guitar player and singer who has toured the world with the a Who's Who of\
      \ the Blues and has released several solo albums under his own name. Kirk has\
      \ a new CD out on Delta Groove which has been released in Europe on CrossCut.\
      \ He had a previous album out on JSP as well. Kirk is nominated for a 2005 WC\
      \ Handy Award for guitar instrumentalist of the year.  When he isn't available\
      \ to play with The Mannish Boys due to his commitments with The Fabulous Thunderbirds\
      \ his guitar duties are fulfilled by Kid Ramos who is well known for his guitar\
      \ pyrotechnics as a member of the James Harmon Band as well as The Fabulous\
      \ Thunderbirds. Kid has also released a series of his own albums. The lead singer\
      \ of The Mannish Boys is Finis Tasby. Finis is known as one of the last deep\
      \ authentic Blues/Soul singers still thriving in today's market. \n\nTo complete\
      \ this powerful review Delta Groove Productions is also offering to include\
      \ some of the guest artists featured on The Mannish Boys album. For last year's\
      \ festivals we featured Mississippi-born Johnny Dyer who is one of the last\
      \ Chicago-style players and whose vocals are reminiscent of those of Muddy Waters\
      \ as well as Arthur Adams, Mickey Champion, Lynwood Slim and myself, Randy Chortkoff.\
      \  I encourage any interested buyers to view our website under \"music production\"\
      \ and read the review titled Positively Entertainment. The financial and entertainment\
      \ value for a festival that contains several stages or days is that The Mannish\
      \ Boys and special guests can be split up to accommodate solo acts on various\
      \ stages over the course of two or three days culminating in a 90 minute grand\
      \ finale review. \n\nThank you in advance for considering our artists for your\
      \ festival.  We guarantee a performance your fans will never forget. \n\nPlease\
      \ check our website ( www.deltagrooveproductions.com ) for audio clips, reviews\
      \ and other artists that you may be interested in for your event.  You can also\
      \ click on the link below to view the Delta Groove (West Coast) Blues Revue\
      \ One Sheet. (www.themannishboys.com/2005festivalonesheet.jpg ).\n         \
      \                                                                       \nSincerely,\n\
      \                                                                          \
      \      \nRandy Chortkoff--- (C.E.O.)\nDelta Groove Productions\n818.755.4460\n\
