  text: 'Фестиваль не только блюзовый, но и джазовый. Помогайте пиарить!


    Прессрелиз здесь: http://www.livejournal.com/users/kozhekin/80595.html




    В блюзовой части фестиваля не заявлены, но если финансы позволят (посмотрим, как

    будут продаваться билеты) будут обязательно приглашены: Коля Садиков, Серега

    Воронов, Юра Каверкин, Гия Дзагнидзе, Дима Красивов и Женя Немов. Доктор Ник не

    приглашен, потому что я считаю его прекрасным бэнд-лидером, но не настолько

    блистательным (блистательным, но ненастолько) гитаристом. Вайт Белов не

    приглашен потому что все предыдущие контакты с ним (к сожалению)  не

    складывались. Если еще кого забыл - срочно напомните!'
