          text: Все было круто ;) Билл с Алексом и Фредди за две репетиции выучили песни Арсена на три отделения. С каждой минутой концертов сыгранность была все выше и выше. Народ стоял на ушах, все получили большое удовольствие. Арсен очень хорошо вписался в уровень мадди-уотерза. Музыканты там обычно играют крутые, пожалуй, более опытные, отличные стилисты и пр., но Арсен своими оригинальными муз.идеями и умением играть на гитаре смотрелся весьма ярко на фоне. Жаль только, что не было возможности подольше попрактиковаться в подобном составе, надеюсь, что в следующий раз будет. Все-таки, Мадди Уотерз Хауз Бенд - супер-группа, играть с ними, как я понимаю, огромное удовольствие. Я лично также торчу от гитары Фредди, у него супер-мощный блюзовый тон и манера, напоминающая, Фредди Кинга, пожалуй...
