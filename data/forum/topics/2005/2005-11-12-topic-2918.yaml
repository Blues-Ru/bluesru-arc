  deleted: false
  text: "Сие есть рецензия журнала \"Книжное обозрение\" на роман \nНит П.\nНовоорлеанский\
    \ блюз / Пер. с англ. Ю.Вейсберга; Под ред. А.Митрофановой.\n\nСПб.: Амфора, 2005.\
    \ - 588 с. - (Амфора 2006). 4000 экз. (п) ISBN 5-94278-947-9\n\nДжаз родился в\
    \ трущобах, в грязи, и от рождения был черным, как ночь. Он родился в Луизиане,\
    \ в Култауне, пригороде Монмартра. Этот Култаун всегда был адом на земле, и когда\
    \ - одновременно с джазом - там родился Лик Холден, и меньше всего это стало благом\
    \ для самого новорожденного.\n\nРоман, выстроенный в форме классического двенадцатитактового\
    \ блюза, - это история великого трубача Лика Холдена, полжизни положившего на\
    \ поиски своей Сильвии. По ходу дела судьба сводит героя со всеми великими джазменами,\
    \ начиная с Луи Армстронга. Действие охватывает весь XX век, география - от Лондона\
    \ до Африки от Нового Орлеана до Нью-Йорка. И в этом эпическом пространстве с\
    \ каждой страницы слышишь, как звучит блюз - тут надо отдать должное переводчику.\n\
    \nКнига может показаться слишком яркой, слишком жесткой, слишком напряженной -\
    \ но таков и настоящий блюз, - и если совпадения, рефрены и импровизация позволительны\
    \ в музыке, почему бы не быть им и в литературе?\n\nСамое странное в этой книге,\
    \ разумеется, автор. Патрик Нит - британец, стопроцентно белый, никогда в жизни\
    \ не ступавший на землю Луизианы... Как это он смог почувствовать себя негром\
    \ преклонных годов, заговорить этим языком, увидеть этот старинный джаз, где \"\
    ударник - словно комар под дождем: он так возбужден, что весь дрожит, будто лежит\
    \ голый на снегу. А у пианиста пальцы скользят по клавишам, как жуки-плавунцы\
    \ на воде, когда ее поверхность морщится под ветром. Басист -это конь-тяжеловоз,\
    \ который привык ступать медленно, а саксофон точь-в-точь хобот африканского слона;\
    \ когда его хозяин трубит в него, то хочет, чтобы все звери его слышали\"... В\
    \ 2001 году роман этот покорил жюри Уитбредской премии - и она была присуждена\
    \ Патрику Ниту - \"за экстравагантность\". В этом, конечно, есть доля истины -\
    \ уж слишком сложная, многоплановая и печальная книга получилась.\n\nНо настоящий\
    \ блюз всегда таков. \"После коды мы чувствуем опустошенность, но тем вернее воспаряют\
    \ наши души. А труба все держит последнюю печальную ноту, и она стихает, и это\
    \ - блюз. И он не кончается, и нам всегда хочется еще\"."
