    text: "Привет всем.\nПрочитал про \"нового Эрика Клэптона\". Стала интересна.\nРешил послушать. Скачал сэмплы.\nНу што можна сказать... Написал вот и подумал - а что, действительно, можно сказать?! гы гы гы \nБред все это. Игра в \"вундеркиндо\". Ведь што такое блюз? Для меня, по крайней мере. Блюз - это не есть техника - вокальная там или гитарная. Блюз - это кагда сказать что-то можно людям. То что ты пережил, увидел, узанл. Потому как Джон Ли Хукер - самый, х...вый, видимо гитарист на свете. И певец - тоже тот еще. Но почему-то когда он поет о наводнении Tupelo\n\nTupelo Blues\n\nDid ya read about the flood?\nHappened long time ago,\nIn Tupelo, Mississippi.\nThere were thousands o' lives,\nDestroyed.\n\nя ему верю. Не знаю - видел ли он это самое наводнение или нет - но уж кое-что подобное в жизни пережил. А вот когда 11-летний пацан фальцетов петушиным верещит:\n\nMy baby left me this morning,\nLord knows I don't know the reason why.\nMy baby left me this morning,\nI don't know the reason why.\nAnd everytime I think about it,\nI hang my head and cry.\n\nу меня от смеха слезы наворачиваются :-)))\nИ дело тут не в том кто как и сколько играет. Вчера надыбал DVD-фильму Montreux Dream в которой могучий B.B. King объясняет как и почему он играет. Тоже, кстати, тот еще виртуоз гитары - не считал, конечно, но наша новая звезда 11-летняя нот больше за один присест сыграл чем Кинг за всю жизнь.\nРезюме - гавно это все, господа. PR чистый - ибо мужиков старше 20 по кабакам играет все эти блюзы - хоть жопой ешь. Не про них же писать и по НТВ или BBC какому-нить показывать. А про 11-летнего - само то.\nТока к блюзу это какое отношение имеет?\nКстати - тута в форуме проходился кто-то по поводу Земфиры и ее песни \"Блюз\" - так вот там, по-моему глубокому убеждению, блюза в сто раз больше чем у Эрика. И у половины московских \"блюзменов\".\nНу это так - уклон в сторону.\nУдачи всем.\nИ здоровья."
