    subject: Jimmy Bowskill - еще один Blues Prodigy
    deleted: false
    text: "В Коктебель приезжает Jimmy Bowskill - другой 14-летний блюзовый вундеркинд из Канады. Eric Steckel безусловно талантливый парень и у него светлое будущее, но голос и манера исполнения у Джимми гораздо лучше. Джимми Боускилл уже завоевал почти все музыкальные награды в Канаде, осталось получить только самую главную - Juno Award, на которую он номинировался в этом году наряду с такими легендами, как Downchild Blues Band, Rita Chiarelli и др. Когда Джимми было всего 11 лет, его пригласил к себе в клуб Джефф Хили, а позже записал с Джеффом и целым рядом других блюз-легенд свой первый диск. Его стиль немного отличается от Эрика, но когда его слушаешь, мурашки бегают по коже и рты раскрываются от удивления - такой поток эмоций и энергии идет от его исполнения. Джимми уже играет на разогреве у таких монстров, как Deep Purple, ZZ Top, Johnny Winter, April Wine и др. Ходят слухи, что планируется целый тур по Украине, приуроченный к джаз-фестивалю в Коктебеле. \nНа сайте Джимми можно послушать отрывки из его последнего CD и также посмотреть видео - не пожалеете! www.jimmybowskill.com \nНасчет Too young to know не согласен. Этим мальчикам-вундеркиндам просто безумно нравится эта музыка, как говорит Джимми: \" Блюз вызывает столько чувств...\""
