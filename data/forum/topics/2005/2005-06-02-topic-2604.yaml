    text: "Есть у него сайт:\nhttp://www.ericsteckel.com/\nА вот его последний диск:\nHigh Action\n Funky C Funky Do  \n Slow Train  \n Espirita  \n Hey Sister  \n Char-broiled  \n Some People Tell Me  \n Blues Is A Feelin'  \n Oh Yeah  \n Born Under A Bad Sign  \n Further On Up The Road  \n Lucille  \n Never Run From The Rain  \n Hide Away  \n Sad Nite Owl\n<img src=\"http://www.in-akustik.com/tt/images/cover/250/068/0681122.jpg\">\nА тута http://www.ericsteckel.com/HTML/esb__esband_vids.htm есть видео его выступлений.\nИ вот такая вот статья:\nOriginally from Allentown, Pennsylvania where he was first known for his energetic guest appearances with many of the area's finest performers, Eric's early musical influences inspired him to pick up his first Fender Stratocaster at the age of nine. \nThere was no looking back............. \nEric's passion for the Blues enabled him to soon share the stage with many nationally known artists including Bob Margolin, Debbie Davies, James Armstrong, Steve Guyger, Kenny Neal, Chris Beard, Tommy Castro, Joe Kubek, Solomon Burke and Hubert Sumlin. \nWith a feeling and natural ability that just can't be explained for someone so young, Eric delivers a Freddy-BB-Albert King influenced performance with an intensity and skill that belies the fact that he is only 14 years old. With a style at times reminiscent the great ones, Eric combines a variety of influences while reminding everyone the real thing comes from the heart and soul. \nThe Eric Steckel Band's debut CD, \"A Few Degrees Warmer\", was recorded live in April 2002 when Eric was a mere 11 years old. A Few Degrees quickly became a CDBaby Top Seller in the Blues genre and the record continues to delight Blues Guitar fans everywhere as it receives positive critical feedback and enthusiastic international attention.\nThe \"ESB\" has thrilled and amazed live audiences with their powerful brand of guitar oriented Blues as Eric's spirited and soulful guitar work is complimented by the solid backing of a professional and cohesive band. While remaining deeply rooted in the Blues, a live ESB set often recalls the sound of the 60s and 70s Blues Rock era. \nThe ESB developed a strong local following in the Eastern PA/NJ region as they played several multi-act festivals and many regular club gigs including opening sets for Marcia Ball, Tommy Castro, Shemekia Copeland and B.B. King. Those who experience the ESB for the first time seem to know they are part of something special as it is not uncommon for Eric to be compared to many of the great Blues guitar players who came before him all while he has become an inspiration to others with his own style and approach. \nIn November of 2003 the ESB appeared at the Sarasota Blues Festival where Eric delighted the crowd with his powerful set and cameo appearances to become the talk of the day. Although Eric would later earn a return invitation by popular demand in 2004, it was the 2003 festival where Eric was introduced by John Mayall as the youngest person ever on stage with the Bluesbreakers. \nEric left a lasting impression on Mayall and in the Summer of 2004, Eric appeared in Sweden, Norway and Denmark as a special guest with John Mayall and The Bluesbreakers during their Scandinavian Tour and in early 2005 Eric traveled to Los Angeles where he joined Mayall for session work on the upcoming Bluesbreaker's record titled \"Road Dogs\".\nAnd so it continues.....the Blues is a feeling.\nEric has performed live on-air on WDIY and WLVR in Bethlehem, PA and has been featured in The Allentown (PA) Morning Call, The Doylestown (PA) Intelligencer, The Philadelphia Inquirer, The (NY) Times-Herald Record, Music Head Magazine, The Warren (NJ) Reporter Forum, Guitar World Magazine, The Easton (PA) Express, The Bridgewater (NJ) Courier Times, The Sarasota (FL) Herald-Tribune and The Florida Times Union. \nEric was also featured in a 2002 Comcast CN8 TV News Extra and in 2003 he has appeared on NBC 10 in Philadelphia, Comcast CN8, Fox Philadelphia and SNN6 in Sarasota. \nIn November 2003, Eric was presented with The Lehigh Valley Music Award for Outstanding Electric Guitar. \nDuring the cold 2003-2004 Pennsylvania winter the ESB hibernated in the recording studio and proudly emerged with their long awaited full-length studio release titled \"High Action\". \nEric now resides in Jacksonville, Florida and the ESB continues to forge ahead by performing at selected venues and festivals in Florida and the Northeast."
