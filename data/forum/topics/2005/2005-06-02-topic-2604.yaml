    text: "На сайте <a href=\"http://www.1tv.ru/owa/win/ort6_videopage.img_main?sender=news&p_topic_id=77850&p_img_num=1&counter1_href=287212&counter2_href=id=268366;t=56\">ОРТ</a>:\n<i>03.06.2005 13:08\nОдному из лучших блюзовых гитаристов в мире всего 14 лет \nНовые выступления начинает один из лучших блюзовых гитаристов в мире. Самое удивительно, что Эрику Стэккелу из Флориды всего 14 лет. Притом, что блюз считается один из самых сложных музыкальных стилей, Стэккел настоящий виртуоз.\nЕго родители говорят, что ребенок всегда был чрезвычайно талантлив. Первый концерт маленький блюзмен дал в 10 лет, а год спустя записал первый альбом.</i>\nКакие только ярлыки не придумают это обыватели журналисты (а лучше сказать дилетанты, те что из числа \"публика - дура\")! И \"Один из лучших блюзовых гитаристов в мире\", и \"Новый Эрик Клаптон\", и \"Надежда блюза\"... Как говорится, ради красного словца не пожалеют отца, сына и святого духа...\nКстати, там же:\n<i>блюз считается один из самых сложных музыкальных стилей.</i>\nНадо ж! А какие \"стили\" одни из самых простых?"
