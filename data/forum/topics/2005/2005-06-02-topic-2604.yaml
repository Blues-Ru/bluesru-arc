  subject: 'НТВ: Эрик Стэкел (14 лет) - "Новый Эрик Клаптон"'
  deleted: false
  text: 'Только что в новостях НТВ был сюжет о 14-тилетнем американском мальчугане по имени Эрик Стэкел. Знаете ли как там его называли? "Новый Эрик Клаптон" и "надежда блюза"!!!

    В репортаже рассказали что он впервой взял гитару в 8 лет, а в 11 уже вышел его первый альбом. Его родители в его детстве слушали южный рок и вот сын тож в ту степь.

    Сюжет в новостях приурочен началу его европейскому туру.

    Показали коротко, как он поёт The Sky Is Crying где-то в кабаке. Как поёт мне не понравилось, а вот по грифу быстро пальцы бегают, чисто играет. Показали его несколько гитар, все Стратокастеры. И ещё показали кусочек, начало клипа: приличненько было, прикольно (ну, это судя по тому коротенькому отрывку).

    Его интервью: он говорит что многие начинают играть из-за денег, а у мнея это идёт из души (или что-то в этом роде...)

    Честно говоря, я весьма сомневаюсь о каком-то осмысленном исполнении (не только блюза) в 14 лет. Слижком уж юн. Too young to know. Но об этом судить пока не могу покуда не послушаю. Буду рад если мои сомнения будут неверны.'
