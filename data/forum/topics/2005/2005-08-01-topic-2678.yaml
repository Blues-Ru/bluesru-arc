        text: 'У меня некоторые наблюдения, а также пожелания к будущим действам...

          Подбор музыкантов был хорош...одно но, Ва-Банк и Сукачев были вааапще не в тему.Но здесь я могу быть неправ, многие возможно пришли на этих раскрученных артистов, и в итоге послушали действительно каааачественную музыку. VIP - зона, оно и понятно что нужна, но танц-пол то где???? Надо уж будет в будущем совместить эти два места, а то как сказал Мишурис: "Все это больно напоминает финские пивные празники". И еще о музыкантах: были совершено забыты немосковские команды (Svet, Blackmailers, Ragtime и др.). Я думаю, что пригласив этих музыкантов Вы бы еще больше повысили статус феста. А в остальном был полный угар...

          Леша, Сережа спасибо!!!!'
