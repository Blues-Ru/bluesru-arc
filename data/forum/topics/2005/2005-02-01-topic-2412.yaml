  text: "В <a href=\"http://www.blues.ru/vocabulary.htm\">\"Словаре блюза\"</a> Доктора\
    \ Аграновского это слово описывается так:\n<b>hoochie coochie</b> - 1) гетеросексуальные\
    \ интимные отношения; 2) танец (\"to dance the hoochie coochie\").\n<b>hoochie\
    \ coochie man</b> -1) вудуист; 2) любовник (даже герой-любовник, супермен, мачо\
    \ и т.д.) (Muddy Waters, Hoochie Coochie Man & Mannish Boy).\nПосто интересно\
    \ мне, а откуда возникло это слово, его происхождение.\nПопытался кое-что выяснить\
    \ с помощью Lingvo. Вот что он говорит:\n<b>hooch</b>\n1) спиртной напиток <i>\
    \ ( особ. добытый незаконным путем )</i> \n2) самогон\n<b>Hoochinoo</b>\n1) хучину\
    \ <i>( племя индейцев Аляски )</i> \n2) индеец из племени хучину\n3) <i>( hoochinoo\
    \ )</i> \n а) водка <i>( производимая индейцами Аляски и северо-запада Канады\
    \ )</i> \n б) перегонный куб <i>( для производства индейской водки; hoochinoo\
    \ still )</i>"
