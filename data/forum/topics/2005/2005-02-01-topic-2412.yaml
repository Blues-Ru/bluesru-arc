        subject: Уточнение
        deleted: false
        text: 'Текст упомянутой мной песни выглядит так:


          Somebody knows just

          How to tease me, how to please me

          Somebody knows just

          How to woo me, bill and coo me


          Именно в этом варианте права на нее были зарегистрированы в 1915 году, правообладатель
          - Harry Von Tilzer Music Publishing.


          А вот чуть попозже ''bill and coo me'' было заменено на ''coo chee coo me'',
          потому что так было удобнее петь, и по звучанию к песне лучше подходило.


          А собственно выражения ''bill and coo me'' (точного перевода, увы не знаю)
          и ''coo che coo me'' были очень популярны в самом начале 1900-х годов, и
          к 1915 году уже были несколько устаревшими.


          Так написано в умной книжке, в которую я заглянул вчера вечером.


          Harry Von Tilzer, насколько знаю - один из представителей Tin Pan Alley.'
