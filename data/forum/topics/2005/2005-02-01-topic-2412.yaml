    text: '...но вот была такая популярная песенка в 1910-е годы, ее автор - известный
      песенник тех времен Harry Von Tilzer:


      Somebody knows there how to squeeze me, how to tease me

      Somebody knows there how to woo me, coo chee coo me


      (Кстати, песня обалденнейшая!!!)


      Вот и натолкнуло меня сходство в звучании слов ''hoochie coochie'' и ''coo chee
      coo'' на предположение, что первое происходит от второго. Кстати, если верить
      словарю Аграновского, то значение "гетеросексуальные отношения" очень даже подходит
      по смыслу в приведенной мной песне :)'
