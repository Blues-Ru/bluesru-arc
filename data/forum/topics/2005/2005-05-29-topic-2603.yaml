  deleted: false
  text: '100 лет назад (года 4 назад) несколько раз слышал на одном радио. И никогда не объявляли, кто это поет.


    Где денег взять, чтоб стать счастливым?

    Друзья советуют санитаром в морг пойти или пчел разводить...

    Да только все это бред - ничего не получается

    И не получится...


    Смотри парнишка замерзает...

    Нет автобуса, нет автобуса

    И не будет


    :) Блюз был точно!'
