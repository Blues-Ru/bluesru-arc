  text: 'Вот, такое читаю на первой странице в "Этих днях в истории блюза" за 03.07:

    "В 1923 году (82 г. назад) в Бостоне, Массачусетс, родилась Энни Рейн. Поскольку ей нравились блюз и губная гармоника, дебютировала она в традициях: Маленькая (Little Annie RAINES). Работала традицию в дуэте с Полом Ришеллом. Наивысшее достижение в звукозаписи – пассивная губная гармоника в альбоме Пайтопа Перкинса и Хьюберта Самлина Legends 1998г."

    Если учесть, что Annie RAINES нет и сорока лет, то весь этот коментарий с претензией, в котором обсуждаются чьи-то высшие достижения становится еще более смешным.

    Зато, регулярно в Форуме появляются комментарии по поводу чьих-то опусов о блюзе.'
