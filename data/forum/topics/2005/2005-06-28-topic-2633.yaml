  text: "Я так понимаю, что просто отстал от. Однако всё равно напишу, вдруг кто не знает. Про две вещи.\n\n1. www.bluesbox.ru\
    \ - месяц халявного скачивания для российских сетей (они там что тестируют, и по этому поводу сделали такое). Помимо хорошего\
    \ качества битрейта, просто много приятных альбомов. \n\n2. В частности, Aynsley Lister. Альбом 2002 года, концертник,\
    \ со слегка необычным для британца названием: Supakev N Plichards. \nМожно я не буду подробно описывать, как он один (вообще\
    \ один) умудряется весь альбом держать так плотно, что не замечаешь, что прослушал уже три раза, и очень хочется ещё?\
    \ Конечно, влияние SRV чувствуется. Но... Надеюсь, что кто-нибудь, более изящный на слова, прослушав сразу же напишет\
    \ восторженную (или не очень :) минирецензию. ;) http://www.bluesbox.ru/album/605/\n\nБыло бы нефигово, если бы кто-нибудь\
    \ его концертик организовал бы. Хотя, если у него реально тот же продюсер, что у SRV, то может это и дороговато выйдет\
    \ :)"
