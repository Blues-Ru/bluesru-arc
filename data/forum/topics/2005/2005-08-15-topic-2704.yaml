  subject: Фестиваль "Танцы"
  deleted: false
  text: 'Я сходил в субботу на фестиваль “Танцы“. Меня порадовала организация, все было четко, публика не скучала, ибо играли попеременно на разных сценах с паузами минуты по 3. Приятно, что у нас начинают делать фестивали, похожие на то, как бывает на западе. Мне есть с чем сравнить, ибо мы только что приехали из Нотоддена. Мелкие упущения были - немного медленно продавали пиво, не выпускали выйти погулять (везде в мире используют штампики на тело), сортиров было явно мало. Временами звук на главной сцене был не идеальным. В остальном - атмосфера праздника, много народу, воздушные шарики и пр.


    Из музыки - открылся фестиваль Zydeco-группой Corey “Lil Pop” Ledet & His Zydeco Band из Луизианы. Состав - малый - четыре человека, один фронт-мен с доской, второй - с гармошкой, оба поют. Инструментов меньше, задушевности даже побольше. В общем, мне понравилось, было очень приятно их послушать.


    Royal Crown Revue - очень хорошая группа, все играть умеют, концерт был чуть бледноватым по сравнению с идеалом, однако мне тоже вполне понравилось. Три дудки, полуакустика, сумасшедший контабасист. ;)


    В промежутке протащились от военного оркестра. Какое чувство стиля, дирежер - супер-чувак. На другой сцене, говорят, круто зажигал Moscow Ragtime Band, вероятно, с поппури из Дог-Шоу, но я этого не видел. ;)


    Baobab Orchestra - хедлайнеры из Сенегала, исполняли африканскую музыку в современных аранжировках. Несколько дудок, две гитары, много вокалистов. Пожалуй, произвели на меня наибольшее впечатление. С одной стороны, очень интересные африканские ритмы, отличная инструментальная игра, при этом - драйв и лирика. Группа - очень старая, ей лет 30, поэтому с одной стороны - умеют играть профессионально, а не просто ребята из деревни, с другой стороны - копают материал, который не услышишь в американско-европейской музыке. Конечно, музыка, скорее, "медитативного" плана, без развития музыкальных идей в течении композиции, основана на повторении каких-нибудь лупов и вариациях на тему. Такую музыку я люблю меньше, и несколько композиций были откровенно не очень интересны. Однако, в остальных - богатство звучания, необыкновенные ритмы, настроения - все искупали. Я получил от Баобаба большое удовольствие. Спасибо Матраскину, что дал на водку.'
