    subject: О бабушке Хукера
    deleted: false
    text: '«без развития музыкальных идей в течении композиции, основана на повторении каких-нибудь лупов» (© Ф.Р.)

      Ну.. более традиционно называть это риффом :-)

      Да, вся Малийско-Сенегальская музыка построена на риффе. И не важно, гитарном, вокальном или дудочным, или исполненым на традиционных инструментах. И действительно, она НЕИМПРОВИЗАЦИОННАЯ. Там нет развития МЕЛОДИЧЕСКИХ тем, свойственных индийской музыке (и перекочевавшей в европейскую). Зато, в полной мере присутствуют ритмические игры (сдвиги и смещение долей, пересечение рисунков, та самая система вопроса-ответа), все то, что с успехом перекочевало в блюз. и тем, кто знаком с пластом малийского блюза (Boubacar Traore или Ali Farka Toure например), было бы забавно слышать знакомые интонации, вокальные, инструментальные и ритмические приемы и "фишки" в совсем другой музыке - латиноподобной африканской сальсе. А потом и вовсе осознать, что бабушка Хукера была из этих краев родом. и колыбельные что ему пела - были на тех же риффах и ритмах.'
