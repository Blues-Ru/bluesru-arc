      deleted: false
      text: "Мне очень понравилось выступление Баобаба.  \n\nОркестр Баобоб из Сенегала, но играет в основном по старой традиции Highlife/Rumba, возникшей в Африке (начиная в Гане и Нигирии) в конце 40-ых годов под очень сильным влияниям латинской (особенно кубинской) музыки. (И конечно латинская музыка до того развивалась под влиянием африканской.)  Интересно, как разные африканские племена постепенно прибавляли все больше и больше \"своего\" к кубинской румбе, и тем самым создавали разные манеры западноафриканской популярной музыки.  Музыка Баобоба относится к времени, когда этот процесс развития уже шел, но музыка еще не успела недалеко уехать от Кубы.  Храняется великая традиция прошлых лет.  \n\nПожалуй самое первое (и очень важное) африканское изобретение в оркестре румбы произошло из-за недостатка денег на духовные инструметны.  Пришлось их заменить гитарами.   \n\nMuddy"
