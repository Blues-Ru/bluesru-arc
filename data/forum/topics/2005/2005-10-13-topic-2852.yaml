  text: 'Так уж получается, что один за другим уходят от нас замечательные представители старшего поколения блюзменов, родившиеся
    в 20-40-е годы.. а в связи с тем, что заголовки новостей чередуются "за здравие" и "за упокой", получается трагикомический
    эффект, например, в сентябре, в один день на титуле сайта присутствовали следующие заголовки:


    - Скончался R.L.Burnside

    - Скончался Clarence "Gatemouth" Brown

    - Иван Жук вернулся... (Ваня, долгих тебе лет!)


    Да и в октябре блюзовые новости не веселее ((


    Я предлагаю Фёдору вынести все траурные сообщения в раздел "Блюзовый мартиролог", там они будут более уместны, мне так
    кажется.'
