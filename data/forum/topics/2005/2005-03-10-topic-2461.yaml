  text: '16-го марта в 19-30 в помещении библиотеки им.А.П.Чехова состоится концерт джазового трио "GADJES TRIO". Только здесь
    Вам представится возможность окунуться в атмосферу Америки 30-40-х годов ( времён "сухого закона") и послушать любимую
    музыку гангстеров той эпохи в живом исполнении "GADJES TRIO"! В программе прозвучит бессмертная музыка Django Reinhardt
    , Duke Ellington, George Gershwin, Stephane Grappelli и многих других  джазовых композиторов. В составе трио - московские
    музыканты: Евгений Немов - slide guitar, Дмитрий Купцов - acoustic guitar и Андей Макаров - double bass ( контрабас).
    Приходите, мы ждём Вас!!! справки по тел.152-22-46.'
