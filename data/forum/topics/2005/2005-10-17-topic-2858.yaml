    text: Он там не солирует, но альбом записан его блюзбэндом в полном составе и при его участии. Запевают, Кроме Джонсона, еще и гитарист Sammy Lawhorn и харпер Mojo Bufford. А пианист Otis Spann, обратно, не поет. =) Связанный контрактом с Чесс, Мадди не солирует. Но благородно аккомпанирует своим аккомпаниаторам.
