  text: 'В пачке винила с гордым названием Muddy Waters нахожу диск под названием MUD IN YOUR EAR. Фирма Muse, записи студийные одной сессии. Я прыгаю от радости и начинаю слушать. Но там вовсе не голос Мадди, да и музыка совсем не его. Выяснил, что это альбом Luther "Snake Boy" Johnson, где Мадди играет на гитаре и продюсирует.


    На КД они его тоже издали как Мадди, но еще и с уродской обложкой (в оригинале было прикольное ухо нарисовано). http://image.allmusic.com/00/amg/cov200/dre300/e301/e30138nz9oa.jpg'
