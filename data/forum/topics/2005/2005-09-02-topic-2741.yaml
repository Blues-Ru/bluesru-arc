  subject: Как вы относитесь к группе Life'n'Joy?
  deleted: false
  text: "А вот давно хотелось узнать у вас, дорогие товарищи-\nкак вы относитесь к группе Life'n'Joy? Ведь, по сути,\nблюза там НЕТУ ВОВСЕ, и даже рок-н-рола нет, и ничего\nпохожего на то, что играеть вся блюзовая тусовка тоже\nнет. Однако, и в Бибике джемы проводят и на Путинке\nиграют. Это как понять? Есть варианты ответов-\n\n1. Группа никогда не играла блюз, и примазалась к тусовке\n   что бы срубить денег. Деньги важнее.\n2. Группа раньше играла блюз, теперь нет- но по инерции\n   их еще причисляют к блюзовым группам.\n3. Группа никогда не умела играть блюз, но очень хотела\n   попасть в тусовку. Тусовка важнее. Блюз- это круто.\n4. Группе настолько все равно какой музыкой заработать денег,\n   что играют все подряд, что б понравиться всем.\n5. Группа умеет играть блюз, но специально издевается\n   над всеми нами.\n6. А что это за группа? Я их не знаю, они не в тусовке.\n7. Я знаю их. Они крутые. Мне все равно что они играют\n   и как это все называется- это просто отличный коллектив.\n8. Я знаю их. Это говно. Они не умеют играть вообще ничего,\n   а только кривляются на сцене, этим и берут.\n\nТак же вы можете предложить свой вариант ответа."
