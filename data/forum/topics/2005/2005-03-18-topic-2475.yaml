                                    text: 'Столько веток, что я уже и не улавливаю. Вопрос по "Джон Ли Хукер - это алфавит
                                      по отношению к Сону Хаусу" ?

                                      С таким трудом пытался удерживать топик в рамках заявленной темы, и даже намеки на весенние
                                      обострения психического здоровья старательно переводил на древнеафриканские мотивы.
                                      Нет чтобы сказать просто - кто кому алфавит не мне судить, да я и не пытаюсь. И рекомендую
                                      заниматся начинающим блюзменам ритмикой именно под Хукера только потому что его грув
                                      и ритм просто архитепичен для определенного направления блюза, и что уловив его ритмическую
                                      основу, будет гораздо легче играть и другие блюзы, и выражать собственную индивидуальность
                                      в блюзовой музыке. Но с таким же успехом - можно заниматся под многих других. Ну - в
                                      алфавите - много букв. И словосочетаний. И блюз хорошо своим многообразием.

                                      И я еще раз повторюсь - не прет меня от тех "блюзовых музыкантов" которые не поняв "кривой"
                                      ритмики блюза, играют его в "музыкальных традициях других народов" (ой как сказал),
                                      в частности, в традициях не имеющих глубоких народных корней - Клуба Самодеятельной
                                      Песни. Ведь блюз - это очень простая, даже я бы сказал - примитивная музыка. И кажется
                                      что играть его очень и очень просто. Достаточно выучить 3 аккорда и к месту и не месту
                                      подтягивать струны. Но, как и любая народная музыка простота эта только для тех, кто
                                      сможет уловить "дыхание" блюза - его сложную для нашей культуры ритмическую пульсацию.

                                      Вот. Самого затошнило от собственной банальности и серьезности. А кто там А и кто В
                                      - не мне судить. Без всего многообразия букв все равно ничего не сказать. Даже большому
                                      и нудному толстому коту.

                                      И Ваще - отстаньте от меня все. Поправлю здоровье и опять уйду в глубокое подполье.
                                      Надо бы поработать, потому что пора получать Гремми в номинации "блюз". Хотя бы за звукорежиссуру.
                                      Одна беда - кто бы так сыграл у нас блюз, чтобы весь мир проперся? Если услышите что
                                      нибудь способное к такому на нашей клубной сцене - вы свистните тут? Ладно? Я бы сходил
                                      бы, послушал...'
