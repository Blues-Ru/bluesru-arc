                                  \ и стихийного развития песни.  Я лично считаю его непредсказуемость и гибкость неотъемлемой\
                                  \ частью его искусства.\n\nКонечно с другими музыкантами было сложно.  Поэтому в одно время\
                                  \ Хукер практически перестал играть сам и уступил \"грув\" своей группе очень умелых музыкантов.\
