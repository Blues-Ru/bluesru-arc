                subject: Африка
                deleted: false
                text: 'Мне в силу служебной необходимости сейчас приходится слушать много африканской, и в частности западноафриканской
                  музыки. И вот, что стало меня тревожить. В принципе - то что характеризует хороший блюз - грув, основанная
                  на ярком рифе структура, манера голосоведения и достоверность произноимого - все это там есть, и в гораздо
                  более сложной и тонкой форме. И вот закрадывается мысль, что блюз - это вовсе не развитие, а скорее - упрощение
                  и огрубление, придание более доступной формы африканской музыки. Ну, примерно как "Одесса мама" адаптировала
                  еврейскую народную музыку к ресторану привратив в пошлый, но значительно более понятный "блатняк!. Убрав
                  свет, тонкость, боль веков, и привнеся лишь грубый драйв.

                  Так и блюз - адаптировал западноафриканскую музыку к бурбону и пиву, перешел на английский язык, "упростив",
                  убрав всю тонкость и свет в музыке и привнеся грубость и драйв. И понятно - изменение текстов - вместо музыки
                  "воды" ( в такт весла в пироге) - музыка мотыги на дорожных работах.

                  и понятно, что появлялись исполнители выросшие не на прошлой культуре, а уже на суррогатной. И как только
                  они совсем утеряли "корни", так блюз практически и закончился перейдя в область "академической" музыки.
                  Оставив народный блюз только в архивных записях Ломакса.'
