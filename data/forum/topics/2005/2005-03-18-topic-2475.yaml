                                deleted: false
                                text: "В начале были только гласные. А, И, О, У. Чуть позже - Е. Практически все основные\
                                  \ эмоциональные понятия можно было передать через них. Тогда же - появилось пение. Сидя\
                                  \ у костра, кроманьенцы пели гласные на чистых интервалах (нетемперированные кварты, квинты\
                                  \ и октавы). Для того, чтобы выразить бурю переполнявших человека эмоций столь скромными\
                                  \ средствами - приходилось серьезно работать над выразительностью. Потом - появился стук\
                                  \ камней. И уж потом - согласные. \nСогласные были как мягкие так и твердые. Несогласные,\
                                  \ тоже появившиеся примерно в то же время были обречены на съедение во благо основного алфавита.\
                                  \ Еще больше выразительности придало появление \"новых гласных\" когда вместо короткого\
                                  \ и однозначного \"Е\" можно было произнести начальственно неопределенное \"Ээээ\", а вместо\
                                  \ \"О\" - скабрезное - \"Ёёёё\"\nУже потом, спустя тысячелетия, алфавит стали систематизировать\
                                  \ и сокращать.\nНо в любом случае - он насчитывает в среднем от 20 до 50 основных звуков,\
                                  \ и множество составных. Но это уже относится к словарям."
