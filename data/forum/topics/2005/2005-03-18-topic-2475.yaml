    text: "Конечно, западноафриканские элементы имеются в блюзе.  Ведь оттуда приехало большинство рябов в штаты Mississippi\
      \ и Lousiana.  Но очень похожо, что язык блюза возник именно в США.  Этот язык включает и африканские, и европейские\
      \ элементы.\n\nНикто из западноафриканских певцов, кого я слущал (включая Ali Farka Toure), не поет с таким классическим\
      \ блюзовым чувством, как Хукер.  Музыка Мали очень хорошая и богатая.  Но она слаще блюза.  Нет такой горечи от веков\
      \ рабства на чужбине.  Вот, по-моему, в чем данное \"искажение.\"  И это искажение - суть блюза.  \n\n\nMuddy\n\nP.S.\
      \  По-моему прямое западноафриканское влияние особенно чувствуется в музыке Robert Pete Williams."
