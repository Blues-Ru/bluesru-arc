                                  \ музыканты которых считал \"неритмичными\" но от которых было \"кайфово\" - в самом деле\
                                  \ подчиняются строгим законам ритма, но вот только не всегда сразу очевидным привыкшим к\
                                  \ прямолинейности ушам белых людей.\nЯ вот и начал то с чего - с Конголезких детских считалочек.\
