                                          text: '"Консервы" - это специфичный термин в звукорежиссерских кругах (чаще - радиовещание)обозначает
                                            сляпанную (в большинстве своем студентами музучереждений - в домашних условиях,
                                            но и солидные студии в этом замечены), с глобальным применением миди инструментов
                                            (не только ударные и клавиши - но как правило и все остальное), часто с применением
                                            автоаранжировщиков "музыку"

                                            Отличаются - тривиальностью решений (преуславутый ля минор три аккорда, бочка
                                            либо в сильные доли сейчас модно во все) незатейливым вокалом и морковными словами
                                            (любовь, морковь, девичьи слезы и подростковые грезы) и полным отсутствием какй
                                            бы ни было творческой ценности (в истории не остаются). Целевая аудитория - музыкально
                                            неразвитые (и не только музыкально) подростки периода полового созревания, но
                                            встречаются и оставшиеся на этом уровне повзрослевшие особи - как "музыка" для
                                            расслабухи при выезде на природу и ненапряжного отвисания. Слабость музыкальных
                                            выразительных средств компенсируется мощностью савбуфера и пищалок в автомобиле
                                            средние частоты там совсем не нужны) - короче, клавное, чтобы был "бух" и "цык"

                                            Характерные примеры в нашей стране - "Руки Вверх", "Мираж", да и практически 90
                                            процентов поп эстрады за редкими исключениями. РВ "аранжировки" генерятся в программе
                                            "Бенд ин э бокс" со скоростью 1 штука в 8-15 минут.

                                            Боб Дилан - точно не консервы :-!

                                            Дима Билан - не далеко ушел от этой "музыки".'
