                              \ я к нему докапываюсь или еще что. Это не значит что вышеуказанный Филип - плохой музыкант\
                              \ или плохой человек или я его недостаточно уважаю. Это означает только одно - что когда играет\
                              \ Хукер - мне кайфово (хотя это далеко не самый любимый мой блюзмен), а когда Филип, или кто\
                              \ из вышеперечисленных (уважаемых музыкантов и хороших людей) - мне не кайфово. В отличае от\
                              \ многих тысяч а может и миллионов людей. И это - моя беда. Мои собственные тараканы в голове.\
                              \ \nИ потому - впредь прошу. Если мы обсуждаем музыку - давайте обсуждать ее корни, ритмическую\
                              \ структуру, гармонии и т.п. Технические, артистические, вокальные приемы ее исполнения. Но\
                              \ не обвинять в наездах, докапов и в чем нибудь подобном. Мы ведь не камни бросаем. И в пианистов\
                              \ не стреляем - они играют как умеют.\nА то останется только заткнутся в тряпочку, и жить со\
                              \ своим горем. Слушая зажеванную кассету Роберта Джонсона.\nКстати Дибров - я видел его по телевизору.\
                              \ Он приходил на \"фабрику звезд\" и учил их чему бы Вы думали? Как раз - блюзу. А Вы говорите-\
                              \ не играет.... Не просто играет, а и молодежь учит. Наставник. Теперь наша эстрада будет знать,\
