        deleted: false
        text: 'А он и есть "нормальный"

          Просто "продюссерские агенства" не занимаются живой музыкой. Не умеют. Им проще "консервами" торговать, а там совсем
          другие правила игры.

          Я вот все жду, когда же братва раскусит что их нае..ют. Что фанерные выступления - это проявление неуважения и обман
          лоха. И начнут отстреливать музыкантов за фанеру прямо на сцене. Ну, или заставлять отрабатывать свои деньги каким
          либо другим способом :-/

          Оттого и задачи у интермедии совсем другие, чем были бы в нормальной стране. Притом, что люди там работают - хорошие.
          И с большим удовольствием включают артистов ЛЮБОГО музыкального жанра, хоть самого экзотического. И очень радуются
          появлению в каталоге чего нибудь музыкального.

          А потом уже вступает в действие наш замечательный рынок. Младшее менеджерское звено с фирмы по продаже "блесток
          для живота" берет этот каталог, и честно перемалывает по всем телефонам на предмет предложения столь необходимого
          для каждого "музыканта" товара.

          А вот тех, кто занимается промоутерством скажем блюзовой музыки - мы всех знаем в лицо. Немного их. Катастрофически
          мало этих славных героев. И они, задумав тур для блюзовой команды из раши по Армении - не станут искать блюзовую
          команду в каталоге "интер(медия)" (купив его за 100 зеленых). А на крайняк - просто наберут блуз точка ру :-) благо
          есть нынче великий каталог - интер(нет)

          Хотя конечно - никто не мешает попробовать. А через год скажем - рассказать ощущения от вхождения себя любимого
          в столь славное издание.'
