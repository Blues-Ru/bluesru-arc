  text: 'Песню Guitar Slim - Letter To My Girlfriend a.k.a Prison Blues многие играли.
    У меня ещё есть она в исполнении Vidar Busk & His True Believer, Stevie Ray Vaughan
    and Double Trouble. И все они поют "I want<b>s</b>".

    Что за прикол такой с S в окончании? Почему так?

    <i>I wants to know what your doin'' tonight

    Wish I could see if everything was alright

    Hold you long in my arms until it''s light

    Your smilin'' face would make a wonderful sight

    I wants to be with ya, love with ya, eat with ya, sleep with ya, stay with me
    all of my life</i>

    Да и у SRV в Dirty Pool (Texas Flood - 1983) тож есть такая же фишка с S:

    <i>True love is gone....I''s been played for a fool</i>

    Что это такоесь?

    Очень мне интересны такие грамматическо-орфорграфические штучки.'
