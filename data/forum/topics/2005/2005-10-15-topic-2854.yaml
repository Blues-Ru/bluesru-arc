  text: '<br/>

    <img alt="" src="http://harmonica.ru/content/main/marineband.jpg"/><br/>

    <br/>

    <strong>&quot;Губная Гармошка Gathering&quot;</strong> - это вечеринка для всех
    любителей губной гармошки.<br/>

    Самые драйвовые музыкальные коллективы, активно использующие в своём творчестве
    этот замечательный инструмент - губную гармошку, выступят со специальными&nbsp;программами,
    разработанными исключительно для этого праздника.<br/>

    <br/>

    В этот вечер на сцене в течение нескольких часов нон-стопом выступит 4 группы:<br/>

    <strong>Владимир Кожекин (&quot;Станция Мир&quot;) </strong>- один из самых заслуженных
    авторитетов по игре на губной гармошке.<br/>

    <strong>&quot;Maxis&quot;</strong> <strong>-&nbsp;</strong> коллектив из Новосибирска,
    профессионально играющий хиты от фолка и кантри до блюза и рок-н-ролла.<br/>

    <strong>&quot;Tambourinman&quot;</strong> - рок-н-ролльный драйв с губной гармошкой.<br/>

    <strong>&quot;Session-band&quot;</strong> - то, что можно увидеть в клубе &quot;Вереск&quot;
    по вторникам на джем-сейшенах.<br/>

    <br/>

    Начало вечеринки в 20:00.<br/>

    Стоимость входа - 250 р., по флаеру или клубной карте - 200 р.<br/>

    <br/>

    Клуб <strong>&quot;Вереск&quot;</strong>.<br/>

    Старый Арбат, 22, вход слева сбоку.'
