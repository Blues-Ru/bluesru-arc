  text: 'В воскресенье на радио "Говорит Москва" в 22:05 будут крутить передачу, которую
    записывали с Брозманом. Он там играет песен 5-7 прямо в студии вживую + трепется
    о музыке и очень много о политике ;))) Там был небольшой бардак с переводом, ибо
    мы это делали вдвоем, но все равно, я думаю, получится весело.


    Может быть, будет дополнительно музыка с компакта, может они разобьют на две передачи,
    я точно не знаю...'
