  text: "Московский Международный Дом музыки (ММДМ) 17 декабря\nКосмодамианская набережная, 52 - \nЦикл «Джазовый Олимп» \n\nКвартет Жан-Жака Мильто \nЖан-Жак Мильто, губная гармоника \nМанюэль Гальвен, гитара \nЖиль Мишель, ударные \nЭрик Лафон, бас-гитара \nВ программе: европейский блюз \n\nЖан-Жак Мильто – виртуозный музыкант-инструменталист. Он по праву считается одним из лучших исполнителей блюза на губной гармонике не только у себя на родине во Франции, но и в мире. Гастролировал в составе оркестров Ива Монтана и Шарля Азнавура, а это более чем серьезная профессиональная рекомендация. \nВ 1992 году оглушительным успехом пользуется его альбом Explorer, а в 2000 году его альбом Bastille Blues получает премию Django d’Or как лучший блюзовый альбом года. Затем был отличный альбом Memphis и вот, наконец, Blue 3rd – амбициозный проект, в основе которого лежит европейский блюз. В Москве Жан-Жак выступит в составе своего знаменитого блюзового квартета.\n\nКто нибудь слышал этого перца??"
