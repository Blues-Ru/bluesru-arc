            text: 'это запах листа эвкалипта, обертки индийских сигарет (без никотина) -"биди" называются - можно купить в
              любой лавке восточных прибамбасов за 30-40 руб.

              на вчерашний концерт было продано 6 билетов (им улыбался Мадди Уотерс - по меткому замечанию Мишуриса). Двое
              ушли, не дождавшись антракта и шансы выиграть Crucial Texas Blues от Alligator стали 1/4. так что - есть смысл
              зайти за компактом в следующий понедельник?

              Сам концерт был потрясающий! Hot Rod Band начали лениво, что понятно при таком аншлаге, но Петрович спел все
              ту же Sugar Mama столь проникновенно, что прозвучало она очень хорошо и свежо, после чего концерт стал набирать
