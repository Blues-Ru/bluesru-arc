      subject: Миру - Мир! А Миру-1 - Мир-2!
      deleted: false
      text: 'под "подводными камерами" я не имею ввиду научно-исследовательские судна, глубоководные аппараты и камеры предварительного заключения, расположенные ниже уровня моря. Я имею ввиду только то, что америкосы в этой экспедиции использовали две ТЕЛЕкамеры, оснащенные на манер плавучих (под водой, главным образом) динстационно-управляемых устройств. Собирались называть "камера один" и "камера два"... но сбились на братьев блюз. Ничего трагического я в этой истории не нахожу.

        Искренне Ваш,

        г-н Евдокимов'
