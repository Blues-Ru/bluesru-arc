    text: "Я не знаю, что имеет в виду г-н Евдокимов под \"подводными камерами\", но на всякий случай сообщаю, что г-н Камерон для съемок подводных сцен арендовал в 1998 советское (выпуска 1985 г.) научно-исследовательское судно \"Академик Мстислав Келдыш\", оборудованное двумя глубоководными аппаратами, называемыми соответственно \"Мир-1\" и \"Мир-2\". \n\nСсылка: http://www.expo.ras.ru/present/images/p4o9_1.jpg - портретное сходство с Blues Brothers неочевидно."
