    text: 'Нет, это большая радость. Что наконец то у нас появилась своя национальная премия "За Блюз"

      Блин. Вот опять. И Что у нас за страна такая - страна войн. Нежнейший топик навеянный фильмом Скорцезе о паралелях между музыкой западноафриканской и североамериканской воспринимается как рубку в капусту и чистку рядов. Кончайте блин. Пора изгонять дракона из себя. Уж лет 50 прошло с тех времен разгибания саксофонов, когда обсуждение о национальных тенденциях в музыкальных стилях неизбежно перерастало в чистку рядов. Пора прекращать БОЯТСЯ высказывать мнение о кривых долях и усматривать в этом ДОНОС.

      И надо понять. Что оградить нас от ХАЛТУРЫ на сцене - может только жеванная морковка в купе с гнилыми помидорами и тухлыми яйцами.

      Кстати. Господа блюзовые журналисты. Вы готовы ВЫСКАЗАТЬ свою позицию по поводу этой премии в своих изданиях? Как и положенно музыкальным журналистам (критикам) - публично, для своих слушателей (читателей)? Когда слушать? Я уже пошел настраивать свой радиоприемник. На какую волну?

      А то и правда. Великие попсовики берутся за блюз - и это хорошо. Но надо же им и подсказать, с какой стороны им братся то.

      Да, я слышал краем уха, что хорошая блюзовая группа целиком ушла на поддержку тура "Фабрики Звезд". Правда ли это? Заметно ли улучшение звучания наших конвеернособранных?'
