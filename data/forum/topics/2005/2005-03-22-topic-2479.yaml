    text: 'Тихой сапой слово "блюз" сделалось популярнее, чем раньше. И в этом заслуга многих людей... в том числе и посещающих этот сайт. "Блюз" - это такой стал трейдмарк, вроде Роллс-ройса - краем уха слышали, вещь солидная, с каким-то своим кайфом, но и не поездишь каждый день, да и не надо. Попсовики это хорошо чувствуют.

      A propos: Михал Петрович в воскресенье в ББК сел за барабаны и дал нам поддержку. Спасибо ему.'
