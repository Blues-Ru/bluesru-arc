    text: Знаете что не дает блюзу вылезти на нашу огромную эстрадную сцену? А я вам совет хочу дать очень простой, причем совершенно бесплатно. Больше пафоса надо, дорогие мои. Без пафоса нет искусства! Не важно что играть- важно как это приподнести. Берите пример с Гэри Моора, который является лучшим блюзменом во всем мире. В своем величайшем блюзе про Париж он почти на минуту затягивает ноту, и эффект не заставляет себя долго ждать- шквал оваций публики! Вот это и есть настоящий блюз. А то вспомнили тут Петровича, Воронова. У них общий недостаток- нет пафоса. Пафоснее, пафоснее и пафоснее и больше патриотизма.
