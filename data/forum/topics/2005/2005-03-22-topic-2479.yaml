  deleted: false
  text: "И не где-то, а на ежегодной церемонии награждения премий «Звездная пара - 2004» (слыхали о такой?) объявилась номинация «Дуэт в стиле блюз». Победили не Петрович с Вороновым. Победили Михаил Денисов и Лолита Милявская с песней Денисова на слова Е.Муравьева. «Время назад на блюз». Я прослушал означенную композицию. Она даже лучше многого из того, что звучит на нашей поп-эстраде.. \n\n<i>Встречи на час, сны наизусть –\nДень – это джаз, ночь – это блюз.\nСпрятана в нас синяя грусть\nвыключив джаз, падаем в блюз</i>\n\nТому, кот знает, что худший блюз – перед рассветом, трудно слушать без смеха песню-лауреата.\nЯ согласен, что этой информации не место на блюзовом сайте... однако, вам не кажется, что рядом с блюзами-лауреатами, все эти наши попытки сбросить петровичей и вороновых с корабля современности – это большая буря в мелком болоте?.. Пытающихся играть блюз, а не «Лунный блюз» и так мало... и когда они пускаются в чистку своих куцых рядов... мне кажется, это какая-то генетическая предрасположенность к самоубийству. За истинный блюз - порубать в капусту любого. А поскольку до Лолиты – руки коротки, рубают тех, кто поближе. Успехов вам, робята, воюйте дальше."
