    subject: 2 диска
    deleted: false
    text: "Почти все его классические (и по-моему лучшие) записи содержатся на двух\
      \ дисках:  \"Earl's Pearls\" (WestSide) и \"Come On: The Imperial Recordings\"\
      \ (Okra-Tone).   Первый диск - это классический New Orleans R&B 1950-ых годов.\
      \  Второй диск вышел недавно и включает его записи для Imperial в начале 1960-ых\
      \ годов, в том числе две его комозиции, которые чаще всего исполняются блюзовыми\
      \ артистами сегодня- Trick Bag и Come On.  \n\nВ 1990-ых годах у него тоже вышло\
      \ несколько неплохих новых дисков, но его легенда связана именно с ранним трорчеством.\
      \  Он был очень талантливым, как певец, композитор, гитарист, и артист (на сцене).\
      \ \n\nMuddy"
