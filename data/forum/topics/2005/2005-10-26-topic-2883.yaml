  text: 'Я вчера совершенно случайно зашел в Дом у Дороги. Не пожалел ни разу.


    Попал на акустическое выступление Dirty D Юрия Каверкина. Играли не подключаясь - через микрофоны - дядя Юра на 6 и 12-струнках, Саша Братецкий дул в дюралевую кружку :-)), на добро слайдом играл тоже Саша - фамилию запамятовал.


    Черт подери, стоило закрыть глаза - и я уже был не в Москве, а на сцене передо мной сидели не пожилой седобородый дядька и два молодых человека славянской наружности, а самый настоящий черный бэнд в каком-нибудь из бесчисленных баров где-то на Миссиссипи... Просто сказка.


    ЗЫ: мне как-то стало нравиться, когда в клубе немного народу. Вчера было от силы человек 20 в обоих залах, как и на прошлом акустическом выступлении Доктора Ника. При этом настолько уютная и располагающая ИМЕННО к слушанию музыки атмосфера, в отличии от дней, когда клуб битком и люди буквально по головам ходят. Хочется верить, что такие замечательные акустические вечера в ДуДе станут традицией.


    Кстати, очень хочется узнать чья (и поиметь себе) песня про Джорджию - исполненная в конце, до биса :-))'
