        \ этом огульной и деструктивной критикой - покинь эту группу людей и примкни к другой, которая тебе больше нравится,\
        \ делов-то. \nГлавное, чтобы не разочароваться в новой тусовке, а то история имеет свойство повторяться. \n \nНам\
        \ нравится то, что мы делаем, ровно так же, как тебе нравится то, что делаешь ты, мы этим занимаемся в силу своего\
        \ таланта и разумения.\nУ меня есть очень разумное предложение - не оценивать друг друга. Для оценки музыкантов существуют\
        \ зрители, журналисты и другие люди, находящиеся вне процесса. \nА ежели наши любительские таланты тебе не угодили\
        \ - извини.\nРазвивай свой профессиональный, благо есть куда."
