      text: 'А я и не говорил, что басист плох. Я сказал, что он слабый. И это правда. Если человек не лажает и грамотно поддерживает
        ритм-секцию - это хорошо. Но если у него совершенно отсутствует склонность к импровизации - не нужно давать ему играть
        соло. Пусть клуб небольшой, пусть не пафосный, но всё-таки это не репетиционная база. Я вот, по большому счету, хожу
        в тот же "Дом у дороги" не поужинать, а всё-таки хороший блюз послушать и когда неоднократно объявляются аплодисменты
        басисту и соло, а тот долбит одну и ту же ноту (не спорю: прекрасно при этом гармонируя с барабанами) - это, честно
        говоря, обламывает.

        А когда я писал про развитие коллектива, я имел в виду не только качественно-профессиональный рост, но и общий образ
        группы, ту же пошлую популярность и признание в конце концов. Такие сильные перспективные музыканты, а из-за всех
        этих экспериментов, на мой взгляд, скатываетесь к какой-то школьной самодеятельности, стиль группы смазывается.

        И опять же про разделение труда: мне кажется, каждый должен заниматься своим делом (тем более, если у них это хорошо
        получается). Евдокимов - юморист (я имею в виду Михаила), Шварцнегер - актер, Русинов - гитарист. По-моему, так. ;)))

