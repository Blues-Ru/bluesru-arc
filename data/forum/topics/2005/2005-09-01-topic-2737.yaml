  text: "Хотелось бы услышать мнения ценителей и просто людей, недалеких от музыки. Уверен, многие из вас знакомы с творчеством\
    \ замечательной московской команды \"Louisiana Jumping Cats\" (кто не знаком - обязательно познакомьтесь). \nМое субъективное\
    \ мнение: \nПрекрасный коллектив, замечательный блюз, есть свой стиль. Великолепный вокалист, он же изумительный клавишник.\
    \ Не менее замечательный барабанщик с большим, как мне кажется, потенциалом. Несколько слабый басист. Грандиозный гитарист\
    \ Володя Русинов... Вот на нем я и хочу остановиться подробнее. Вы меня простите, но он же просто ужасно поет!!!.... Зачем\
    \ он это делает? Ведь есть же изумительный вокалист в команде. Сам Володя прекрасно владеет своим инструментом... Зачем\
    \ лезть не в свое дело? Мне кажется, этот факт (наряду с привлечением в джемы зеленых талантов и прочей самодеятельности)\
    \ сильно тормозит развитие коллектива в целом и лично мне портит общее впечатление от концерта.\nВот и скажите мне: я\
    \ один такой придирчивый сноб или кто-нибудь разделяет мое мнение? Что вы думаете?\n \nP.S.: а перебивать соло Андрея\
    \ Цыганкова шуточками - это вообще кощунство!!! ;)))"
