  text: "<i>Фёдор, привет из Нью Йорка. Я тоже люблю блюз, но когда-то в 1977 году\
    \ во время гастролей в СССР дуэта Липс из Лондона я познакомился с Даяной. Дуэт\
    \ приезжал с певцом Роберт Янг. Янг пел первую часть концерта, Липс вторую. Фёдор,\
    \ если у тебя имеется какая-нибудь информация о дуэте или их песни, пожалуйста\
    \ сообщи.</i>\n\n\nЭто очень забавно, потому что, когда я был маленький, я с огромным\
    \ удовольстваием прыгал на диване под пластинку фирмы Мелодия \"Грег Бонам и вокальный\
    \ дуэт Липс\". ;))) Увы и разумеется, этой пластики больше нет,  и я не знаю,\
    \ где искать их записи. Возможно, что поиски в интернете могут помочь.... Желаю\
    \ успеха! \n\n<p><b>Может, кто-то может помочь? ;)</b>"
