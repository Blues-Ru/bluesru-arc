        subject: Липс и ГБ
        deleted: false
        text: 'Если не путаю, на той пластинке было что-то из Битлз, а последнюю песню
          они (и Липс и ГБ) пели наполовину по-русски, типа: Прощай, my love, goodbye,
          и ещё спасибо вам за всё...

          Вот что нашёл в Сети он их:

          "Липс" это британский женский вокальный дуэт, засветившийся в конце 70-х
          на эстрадном конкурсе в Сопоте с Хабл-Бабл, потом они выступали в Москве
          уже в другом составе. Фирма "Мелодия" выпускала пластинку с записью их концерта
          (жуткая была пластиночка).'
