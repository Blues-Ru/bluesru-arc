        text: "Всё написанное ниже предназначено для людей с некоторыми навыками самостоятельного изведывания нового, мне просто лень сообщать некоторые подробности того, как правильн делать ЭТО =) \nЖелателен нормальный коннект, ясно дело что качать 5-мегабайтные файлы по модему - чисто каторга. Однако опция докачки встроена в mIRC.\n1. У меня на сайтике http://gypsy.bluesman.ru/mp3blues4u%20lists/ надо скачать и установить программу IRC-клиента mIRC616.exe\n2. Там же скачать и распаковать файл-листы Lists.rar\n3. Запустить mIRC, выбрать сеть NewNet (Connect - Servers - IRC Networks)\n4. Войти в канал #mp3blues4u (Tools - Channels List) и посидеть там минут 5, чтобы понять а чё ваще происходит. Там будут идти толпой сообщения на языке вероятного противника, раскрашенные во все цвета радуги защитного цвета. Предупреждаю: живые люди там встречаются редко, но иногда и поговорить можно. Все чьи имена начинаются с @ - это местные роботы. Они дадут много файлов, если грамотно попросить.\nУ самого большого робота 85 тыщщ блюезов. Обслушаешься, млин!\n5. Как просить у робота:\n5.1. Открыть один из файл-листов в Rar-архиве с моего сайта, найти простым Search в Notepade чё интересует. Если интересует целый альбом - выделить все входящие в него песни и скопировать в клипборд. Если одын песня нужен - ну значит его и скопировать.\nПример: \n!^steam John Lee Hooker Jr - Blues With A Vengence -10 - Stormy Monday.mp3 ::INFO:: 6.3MB\n5.2. Проверить, а в сети ли сейчас добрый робот? В списке справа должно быть его имя. Крупных роботов всего 3-4, главные - @^steam и @bluesserv. Последний иногда и живьём появляется, его зовут buzz, он сам сидит в городе Торонто, говорит на английском чуть хуже чем на французском ))\n5.3. Сделать Paste всего этого добра в строку сообщений mIRC - робот всё это проглотит и выдаст радостные сообщения типа чувак ты попал в очередь сиди и жди.\n5.4. Ну типа сидеть и ждать. На хорошем канале закачка идёт со скоростью 20-30 кб/сек. \n\nThat's all tales good folks! Leech till ya drop =))"
