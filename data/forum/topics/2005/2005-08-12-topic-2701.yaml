    deleted: false
    text: "Поскольку речь идёт об американской музыке, процитируем один из музыкальных журналов штата Флорида, где колонку ведет Джоанна Джонс, совладелица консалтинговой компании по вопросам музыкального бизнеса: \"Кто бы ни написал песню, КАЖДЫЙ может её публично исполнять. Иглз не могут прийти на ваш концерт и запретить петь \"Отель Калифорния\". Таким образом, команды, играющие каверы, но не пишущие альбомов, никому ничего не должны в соответствии с законодательством США. \nЗаписи - другое дело, с них должны идти отчисления авторам. Альбом нашей группы был записан в 2001-м, когда в России действовал закон, в соответствии с которым отчисления должны были поступать за записи песен 1973 и последующих лет. Таковых на ТИКе не было.\nЯ мало что знаю про механизмы сбора отчислений в нашем богоспасаемом Отечестве и не буду здесь комментировать. Будем решать вопросы в порядке их поступления в ходе жизни и творчества."
