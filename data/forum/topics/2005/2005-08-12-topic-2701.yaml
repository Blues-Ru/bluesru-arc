    subject: Права
    deleted: false
    text: 'Как правило, отчисления собираются через так называемые Collection Societies, конторы, которые есть в разных странах, и которые стригут за прокрутку песен по радио, на компакт-дисках и на больших концертах. Имя автора песни на компакте (причем, как правило, не псевдоним, а настоящее имя) используется для перечисления денег. Клубных концертов это не касается, а вот при издании компактов наших музыкантов, как правила, отчисления делаются (по центу с композиции с диска, кажется).


      В России главной Collection Society является контора под названием "РАО", которая, отчасти, занимается бандитской деятельностью, в частности, продавая фальшивые лицензии на издание пиратских компактов.'
