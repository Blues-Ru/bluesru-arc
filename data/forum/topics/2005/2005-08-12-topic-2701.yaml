      text: 'да, главой РАО является величайший композитор всех времен и народов - Игорь Крутой, и он контролирует нехилый поток авторских отчислений (кстати, с любого концерта, даже клубного отчисляются деньги, пусть и небольшие, но слагающиеся в большую реку) и решает, кому дать, а кому нет, этим кстати и объясняется великая любовь ВСЕХ попсовиков к данному композитору, ибо - либо ты исполняешь ПОПсУ Крутому, либо не получаешь денег на свою ПОПсУ.

        Потому - деньги хукера идут на раскрутку всяких там Маш, Филь и прочей дребедени.'
