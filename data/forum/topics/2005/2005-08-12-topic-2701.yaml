    Кому не лень будет сей дискашшн прочитать - скажите пожалуйста, все-таки, кто кому и сколько платит за исполнение песни Хучи-Кучи мэн.Ну или хотя бы вкратце объясните, каков механизм взимания налогов за исполнение чужих блюзов. И кому, например платят (или должны платить) Черный Хлеб, Дёрти Дазн, Мишурис, ЛайфнДжой, Сколдеры, Кроссроудз, Оффбит и ты ды :-)))))'
