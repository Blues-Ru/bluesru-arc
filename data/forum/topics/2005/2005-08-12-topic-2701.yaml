      text: 'Леша, за песни исполняемые на концерте ( в клубе или зале или доме культуре) платит заведение. Насколько я знаю, есть стандартный процент отчислений с КАЖДОГО концерта в РААП - что то вроде 0.4% со сбора. Есс-но, поскольку большинство клубов платит черным налом, и налога не берут :-), то и суммы выплачиваемые ЧХ на ПОПСУ - не велики. Концерты в залах, где есть БИЛЕТЫ - совсем другое дело. Так что с наших блюзовых фестивалей, мы честно платим Маликовым, Киркоровым и пр. хрени.

        Да, на мой сайт как то наехало агенство (правда английское), и как раз на один из твоих каверов. Переписка была занимательная, если будет интересно - опубликую.'
