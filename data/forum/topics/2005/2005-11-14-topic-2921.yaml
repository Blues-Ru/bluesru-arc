    text: "Михаил, давно ли ты листал \"Комсомольскую правду\"? по степени желтизны\
      \ она соперничает с лучшими изданиями в этом жанре. А ее региональные выпуски\
      \ - это отдельное что-то с чем-то. \nЯ бы попросил не пропустить комментарии\
      \ к публикации:\n\nДенис [10.11.2005 13:22]: Чувствуется, автор статьи силился\
      \ как можно больше обосрать... кого? что? выступавших? блюз? ну упала и упала\
      \ - что ж с того? Зажигали они на все 100, это главное. \n\nМишель [10.11.2005\
      \ 15:01]: Выступление Сары было потрясным! Злости и горечи у автора будет достаточно\
      \ не на одну Сару, она ведь просто запуталась в проводах, лучше бы условия создали...\
      \ \n\nмордехай [10.11.2005 18:05]: Ваши Мила Киян заметки постоянно оставляют\
      \ впечатление, что вы их пишете перебрав \n\nPS - я читал эту заметку и раньше.\
      \ И не счел нужным пускать ее на форум или в новости. Есть такое простое правило\
      \ - не распространять непроверенную информацию. Стоит ему следовать - и процесс\
      \ энтропии во вселенной слегка замедлится. Я ведь сам ничего не имею против\
      \ пролонгированной дигустации водки. Я имею что-то против общего тона заметки\
      \ - именно он заставляет подозревать автора в передергивании."
