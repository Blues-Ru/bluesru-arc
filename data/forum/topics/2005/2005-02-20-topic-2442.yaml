      text: 'Интересно мне, почему SRV при жизни он не выпускал записей где он играет слайдом. После его смерти вышло несколько композиции: Boot Hill (автор неизвестен) с альбома The Sky Is Crying - 1991, Slide Thing (автор - сам же SRV) с альбома In The Beginning - 1992 (запись April 1, 1980) и неудачное исполнение гимна <a href="http://music.advertka.ru/music/srv/16. Star Spangled Banner.mp3">Star Spangled Banner</a> (1.9 Mb, 128 Kbps, 44 KHz, 02:01) на стадионе Houston Astrоdome, 1986 (пиратский альбом Stevie Ray Vaughn - Unplugged and Jamming - 1999). Вот почему так немного он записывал слайд?'
      replies:
      - id: 20547
        parent_id: 20546
        date: 2005-02-21 18:35
        poster: Elicaster
        email: elicaster(@)))mmmmmmmmmmail.ru
        subject: О композиции Boot Hill
        deleted: false
        text: "In the case of \"Boot Hill,\" Stevie recorded the tune virtually every time the band was putting an album together, but it never quite fit in with a particular release's overall complexion. This rendition, from the In Step sessions, was the only version to feature Stevie's slide playing; in fact, this is the first time that aspect of his guitar playing has been revealed on record. The reason the track didn't see the light of day was because, as drummer Chris Layton points out, \"I think the subject matter was a little bit dark for In Step.\"\n \"Exactly,\" Jimmie concurs. \"All the other songs had real positive, nice messages, and this was, 'I don't want to wax you, baby, 'cos you gave me my first thrill.'\"\nIn the 1989 interview Stevie talked about the then work-in-progress: \"Some of the songs are kind of like getting straight with other people — making amends — and then we also did 'Boot Hill.' It's the meanest version, lyrically, of 'Look Over Yonder's Wall.' It's about a guy telling his woman to get him his gun because he's gonna kill her. It starts off like that,\" he laughed, \"and goes from there. So we still cover the other side of things, too.\"\nВ случае \"Boot Hill,\" Стиви записывал эту мелодию фактически каждый раз, когда группа составляла альбом, но она никогда не подходила общему характеру. Это исполнение, во время записи In Step, было единственной версией которая показывает игру Стиви со слайдом; фактически, это первый случай, когда этот аспект его гитарной игры был показан в записи. Причина того что эта композиция не выходил в свет состояла в том, что, как указывает барабанщик Крис Лэйтон, \" я думаю, что эта песня была немного мрачновата для In Step.\"\n\"Совершенно верно, \" соглашается Джимми. \"Все другие песни имели настоящий позитивный, приятный посыл, а в этой песне было, 'I don't want to wax you, baby, 'cos you gave me my first thrill.'\" (что то типа: Я не хочу гневиться на тебе, ведь ты мене дал первый адреналин в мой кровь)\nПо тексту, это самая злобная версия песни 'Look Over Yonder's Wall'. Песня о парне, который приказывает своей женщине дать ему его пистолет, потому что он собирается убить ее."
