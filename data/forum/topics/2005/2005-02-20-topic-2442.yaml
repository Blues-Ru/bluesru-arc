  text: "Стиви Рэй Воэн в ролике Государственного департамента дорог США. Играет слайдом. Стиви Рэй призывает брежно относится к своему родному штату Техас.\nПримечательный момент: при жизни он не выпускал своих записей где он играет слайдом. Только после его трагической смерти вышло 2-3 композиции, записанных им ранее, где он использует эту технику.\nВот этот <a href=\"http://music.advertka.ru/music/srv/71. don't mess with texas.mov\">ролик</a> (6.0 Mb, 00:30, Quick Time)\n<b>Stevie Ray Vaughan for the State Department of Highways.\nEach year we spend over 20 million dollars picking up trash along the Texas highways. Messing with Texas isn't just an insult to the Lone Star State. It's a crime.\nSRV: Don't Mess With Texas.</b>\n\n<DIV align=center><IMG align=baseline alt=\"\" border=0 hspace=0 \nsrc=\"http://music.advertka.ru/pics/ads/srv2.jpg\">&nbsp;<IMG \nalign=baseline alt=\"\" border=0 hspace=0 \nsrc=\"http://music.advertka.ru/pics/ads/srv1.jpg\"></DIV>"
