  text: "Пятница, 5 декабря 2014 г. 15:54\t\nКУЛЬТУРА\nВологду с концертом посетит блюз-певица из Чикаго Шарон Левис\n\nВологду с концертом посетит блюз-певица из Чикаго Шарон Левис\n\nБлюз-дива из Чикаго Шарон Левис даст концерт в Вологде.\nБлюз-дива Шарон Левис начала заниматься музыкой с детства. С сестрами в церкви она пела госпел. Певица росла в Техасе, а потом переехала в Чикаго. Отсюда сочетание госпела, блюза, чикагской и техасской блюзовых школ, которое делает стиль Шарон Левис действительно уникальным. Плюс мощный и проникновенный вокал, который музыкальные критики назвали восьмым чудом света.\n\nЗа годы своей карьеры Шарон Левис выступала на одной сцене с известными блюзовыми и соул-легендами, уже несколько лет подряд она является хедлайнером фестиваля блюза в Чикаго и резидентом двух главных блюзовых клубов Чикаго.\n\nЯркая и харизматичная певица объехала полмира с гастролями. В Вологде она выступит впервые, сообщает ИА \"СеверИнформ\".\n\nКонцерт состоится 11 декабря в 20:00 в клубе \"Харди Гарди\"."
