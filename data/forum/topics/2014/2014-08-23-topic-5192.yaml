  text: "из прессы:\n\nВ последние выходные уходящего лета живой блюз будет звучать в Санкт-Петербурге, Кронштадте и Ломоносове. Такой подарок решили сделать гостям первого Санкт-Петербургского международного морского фестиваля российские и зарубежные музыканты мировой величины\n\n30 августа на набережной Лейтенанта Шмидта, на главной музыкальной сцене у Горного университета состоится Х юбилейный Международный фольклорный блюзовый фестиваль «Дельта Невы». В 17.30 гала-концерт откроет Адмиралтейский оркестр Ленинградской военно-морской базы в эффектном дуэте с соло на хроматической губной гармонике в исполнении  питерского музыканта Максима Некрасова. Команда из Риги Blues Gang порадует слушателей ураганными блюзовыми композициями 20-х годов прошлого века.\n\n31 АВГУСТА НА ПЛОЩАДКАХ В ПЕТРОВСКОМ ПАРКЕ В КРОНШТАДТЕ И НА ПАРОМНОМ ПРИЧАЛЕ В ЛОМОНОСОВЕ НА ОТКРЫТОМ ВОЗДУХЕ ПРОЙДУТ ШЕСТИЧАСОВЫЕ КОНЦЕРТЫ, В КОТОРЫХ ПРИМУТ УЧАСТИЕ ЛАУРЕАТЫ X МЕЖДУНАРОДНОГО ФОЛЬКЛОРНОГО БЛЮЗОВОГО ФЕСТИВАЛЯ «ДЕЛЬТА НЕВЫ», А ТАКЖЕ МОЛОДЫЕ ИСПОЛНИТЕЛИ\nАтмосферу сочного блюзового саунда создаст проповедник уникального блюза Среднего Запада Big Daddy Blues Phil Speat (США). Московские музыканты Mishouris Blues Band во главе с неизменным лидером Михаилом Мишурисом, представят программу классического блюза 40-х и 50-х годов прошлого века и собственные композиции.\n\nПетербургские музыканты Old Fasioned покорят сцену динамичным саундом и мощным вокалом солистки Элизабет Аллаи. Творческий дуэт музыкантов из России и США King B & Layna Shery порадует публику первоклассными ритм-секциями и, несомненно, добавит фестивалю блюзового драйва. Классику продемонстрируют на сцене основатели немецкой школы блюза Blues Company.Неизменным хэдлайнером фестиваля станет легендарный музыкант, основатель Санкт-Петербургской Филармонии джазовой музыки, народный артист России Давид Голощекин: исполненные им блюзовые композиции в джазовой интерпретации станут роскошным подарком всем ценителям импровизационной музыки.\n\nВ 23 часа гала-концерт завершат звезда европейской блюзовой сцены, виртуоз блюзовой губной гармоники Петар Миладинович и группа Homesick Mac & Pera Joe Blues Band (Сербия-Швеция), которую отличает подлинное чувство блюза. \n\n31 августа на площадках в Петровском парке в Кронштадте и на Паромном причале в Ломоносове на открытом воздухе пройдут  шестичасовые концерты, в которых примут участие лауреаты X международного фольклорного блюзового фестиваля «Дельта Невы», а также молодые исполнители.\n\nЗавершится романтическая музыкальная программа 31 августа (21.45-22.00) исполнением отрывков из пронизанной морем оперы-мистерии А. Рыбникова «Юнона» и «Авось». Полные экспрессии и созидательной силы великого чувства, музыкальные аккорды любимых композиций в исполнении Альберта Жалилова и Анны Малышевой взлетят в небо, чтобы отразиться большим праздничным фейерверком в зеркале Невы.\n\nАвтор: Виктор Наумов\n\n\nhttp://ok-inform.ru/stil-zhizni/dosug/19195-vykhodnye-v-ritme-blyuza.html"
