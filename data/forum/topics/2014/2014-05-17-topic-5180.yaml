  deleted: false
  text: 'Ежегодно каждое лето волонтеры приюта для бездомных животных устраивают выставки
    для своих подопечных, чтобы помочь им найти хозяев.


    В этом году первая наша выставка пройдет в крупном московском городском парке
    при поддержке Правительства Москвы.


    Приглашаем всех желающих музыкантов выступить на нашем мероприятии.


    У парка есть все необходимое для проведения концерта, от музыкантов нужны только
    инструменты, хорошее настроение и конечно же замечательная музыка.


    Если вы заинтересовались, пишите на dlia-pochti@yandex.ru'
