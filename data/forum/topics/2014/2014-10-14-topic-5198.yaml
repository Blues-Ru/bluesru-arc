  subject: Алексей Меринов пишет о вчерашнем концерте Джона Мэйолла
  deleted: false
  text: "https://www.facebook.com/alex.merinov/posts/10204312171596039:0\n\nСам Джон:\nЧто скрывать, шли на концерт с неким\
    \ опасением.Через месяца полтора дедушке будет 81 год.\nСейчас, думаю, вывезут старика на коляске, как дыма поддадут,\
    \ сорок теток на подпевках, двадцать шесть губногармошечников на дубляже, тридцать восемь гитаристов на подхвате, минусовочка,\
    \ страбоскопы, поди догадайся, кто там на самом деле...\nФИ-ГУШ-КИ! ( тут ,конечно, другое выражение должно стоять)\n\
    Подтянут, озорлив, играл на всем, до чего рука доставала.Пел сам, безо всякой помощи \"вечной\" троицы негритянок-певуней...)Вскоре\
    \ совсем разошелся, играя одновременно и на \"органоле\" и на губной гармошке...\nСережа Воронов потом скажет:\n- Ну ладно,\
    \ я всё понимаю, на гитаре, на фоно ещё можно. Но как он пятиминутное соло на губной гармошке-то смог! Это ж какие легкие\
    \ надо иметь в таком совершеннолетнем возрасте...\nПолтора часа безо всякой паузы, без приседаний на табуреточку. Ни единого\
    \ \"пол-кирпича выше, полкирпича ниже\"...Ни одного \"петуха\" за всё время( Это я щас о музыке,если что))\nДрайв, с улыбкой\
    \ на лице при этом.\nБас-гитарист:\nИконообразной внешности. Весь концерт находился в тени, скромен не по годам и в быту\
    \ опрятен. Зато, в финале, когда все участники группы давили соляка, выдал что-то диавольское. Слился со своим басом настолько,\
    \ что в непонятках: то ли он на нем играл, то ли бас командовал телом и руками музыканта\nБарабанщик:\nБыл спрятан за\
    \ своим агрегатом. В конце оказался здоровенным негром.) Ну такой, стучал часто и исправно. Не посрамил Папу Британского\
    \ Блюза.\nГитарист\nМощный парень.Сигалошварцнеггерообразный. Мне кажется, когда он на гитаре не играет, он в неё ещё\
    \ сто колков вкручивает, двести стальных струн наворачивает, к грифу пару колонок привязывает и тягает, аки штангу. С\
    \ таким и в Бирюлево в ночи за водкой можно сходить. Часов до двух ночи. Потом, конечно, один черт, вальнут...\nНесмотря\
    \ на атлетическое телосложение-истый лирик. О чем свидетельствуют его \"запилы\" при медленных соляках и частосъезжающие,\
    \ печальным домиком, бровки. Но мог и пофеерить, когда надо. Периодически кому-то в зал посылал \"приветики\", благодарил\
    \ за аплодисменты после своих наигрышей-проигрышей, был приветлив и своим\nПосле финальной песни, по-простецки, взял какой-то\
    \ рюкзачок,лежащий на сцене, перекинул через плечо...и,типа, со словами:\n-Ну ладно, ребят, мне тут завтра ещё в Малом\
    \ Ярославце на свадьбе играть, убежал ловить маршрутку\n)\nПублика\nЧужих не было. Принимали на \"ура\". Оно и понятно,\
    \ ибо первую пластинку Папа Джон выпустил аж в 1965 году.То-есть, пришли те, кто на его музыке вырос. Посему зал не слепил\
    \ глаза блеском бриллиантов. Правда, мы тусовались в \"танцующем\" партере. Что там наверху творилось, на сидячих местах,\
    \ не знаю. Хотя, Гия там был. На нем по окончании тоже алмазов обнаружено не было...\n)\nВпереди два дядьки устроили танцы.\
    \ Постарше меня будут. У одного вскоре устало всё. Он просто лег на спину и стал в такт поднимать руки-ноги. Так иногда\
    \ домашние зверушки делают когда их по пузу гладишь. Второй же увлеченно бегал вокруг тела друга,пыхтя паровозиком из\
    \ Ромашкино.\nСлева худющий крендель в майке-алкашке, вдруг, как-то одномоментно вошел в образ целого ансамбля песни и\
    \ пляски имени Святого Витта. У него \"дрожью члены все охвачены\" и работали одновременно, но совершенно автономно. \n\
    В общем, публика вошла в раж и угар. Местами. Потребовала Маэстро \"на бис\", Маэстро сотоварищи это исполнил.\nДа,ещё\
    \ об одном. В который раз убедился в том, что,чем артист талантливей, тем меньше в нём снобизма, жлобства и понтов. Стоим\
    \ компанией уже после концерта в зале...Тут какое-то шевеление у правого портала сцены. Народ хлынул. Маша моя,вспомнив\
    \ свое репортерское прошлое, пчелкой жужжащей метнулась. Через пару минут возвращается с билетом, на котором автограф.\n\
    Я даже поначалу немного потупил:\n-Этой чей?!\n-Здрасссьте! Его!\n-кого??!\n-Да Джона!!!\n...я то подумал, что это гитарист,\
    \ не поймав маршрутку,решил заночевать до первой электрички в кулисах. А оно, вот как вышло. Спустился Майалл и всем желающим\
    \ давал автографы и фоткался.\nКлуб\nИз плюсов-огроменная барная стойка,практически по периметру зала. Со всяко-разным\
    \ бухлом. Большой зал, видно отовсюду хорошо. Насчет звука. Не знаю, мы стояли близко к сцене, мне всё было по кайфу.\n\
    Минус:\nТакое впечатление, что охрана в своих этих наушниках слушает песню про то, что за ними Путин и Сталинград и что-то\
    \ там про установки \"Град\". И люто ненавидит всю эту праздношатающуюся шушеру, которая вместо коллективного просмотра\
    \ программы \"Время\" приперлась сюда и нарушает. \nЖалеют,что им не выдали оружия. С боевыми патронами. Лютая, короче,\
    \ охрана. Курить на улицу не пускают. \"Не положено\". Да у нас же билеты. \"Сказано, что не положено\", \nДа и черт с\
    \ ними. В конце концов,сберегли нам здоровье на пару часов\n)\n...А на выходе стайка девушек торговала \"автографами\"\
    \ Джона. в таком количестве, в котором он за все свои годы не успел бы подписать....Ну, нам-то не надо было....у нас свой\
    \ был.\n)\nА, да...ещё и магнитиками!!! Ну, тут уж мне Маша аж два купила. Правда, они чёй-то никуда прилипать не желают,\
    \ но сам факт,что теперь с концерта можно и магнитик принести,меня отчего-то дико радует. Так ведь,ежели дальше дело пойдет,\
    \ скоро и холодильники с развлекательных мероприятий будешь в дом, в семью, таскать.\nP.S.\nВ общем, схватили огромный\
    \ кайф от встречи с Отцом Британского Блюза. И не верилось, что он к нам приедет. Так,запросто. \nПрошу мой отчет строго\
    \ не судить, поскольку в музыке я ничего не секу...был за компанию, приходил, исключительно, за магнитиками\n)"
