    text: "Конечно, ждали приезда и выступления Мэйелла всю \nпрошедшую музыкально сознательную жизнь, года с 72. Не верил,\
      \ что увижу его вживую. Довелось - спасибо организаторам. И самому Мэйеллу за то, что во время своего турне по городам\
      \ и весям Мира нашел время заехать в две Российские деревни, поиграть у нас.\nВыступление очень сильное, профи-музыканты.\
      \ Восхитились, в первую очередь, Самим: на все хватает сил (из каких источников в его-то 81!!!), все умеет - и вокал,\
      \ и клавиши, и гитара, и духовой инструмент во всю мощь, и прыгает ...\nОтличный ансамбль малого состава: мастер-гитарист\
      \ (а холели бы услышать lovely Mick Teylora?), а какой басист - изменить правый кистевой сустав так, чтобы пальцами\
      \ руки до локотка доставать, а его порхающие руки-птицы во время музыкального оргазма ... Барабанщик тоже хорош - колбасил\
      \ что надо. Понятно, Мэйолл выбрал что надо. м.б., сэкономил на саксофонисте.  Огорчил звуковик - в начале концерта\
      \ звук был дрянь, потом, мне показалось, что с третьго раза, звук поправил. поправил. Концовка выступления - феерическая!!!\n\
      THANK YOU, МАСТЕР JOHN !!!"
