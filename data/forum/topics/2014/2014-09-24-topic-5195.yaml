  text: Блюз на русском языке не только имеет право быть, он уже давно существует.
    Это тот стиль, в котором не может быть ограничений, ведь первые блюзовые исполнители
    поют о вещах понятных, их можно почуствовать и понять даже не зная языка. Это
    настроение! Какая разница на каком языке его выражают?! Джаз и рок-н-ролл никого
    не смущает с песнями на родном языке, почему же блюзу отказывают у нас в международности?
    И глупы те, кто сравнивает блюз с частушками...простите, но частушки не стали
    основанием для развития стольких стилей и направлений в музыке.Блюз- это уже та
    культура, которая не имеет границ. Так что давайте говорить о мастерстве или о
    том, что нравится или не нравится, но не будем говорить "так делать нельзя в блюзе"-
    это очень однобокий взгляд.
