  text: 'http://www.youtube.com/watch?feature=player_detailpage&v=Q0GNVslujd0#t=1


    А вот это – настоящий раритет! Долгое время я думал, что видео-записей моего любимого блюзмена, одного из мастеров чикагского блюза - Jimmy Lee Robinson - не сохранилось, но потом обнаружил несколько (http://vk.com/wall-13370755_833). Но сегодня я предлагаю посмотреть большой двухчасовой(!) сборник видео!


    Запись делится на несколько частей:


    1. Выступление в клубе – с группой и сольно.

    2. Сольное выступление на сцене зала, хорошо записанное, где помимо самих песен, много интервью и интересных историй.

    3. Выступление в клубе – из тех, кого узнал: Steve Freund – гитара, Bob Stroger – бас, Willie "Big Eyes" Smith – ударные, уже совсем старенький Sunnyland Slim за пианино. Jimmy Lee тут только мелькает среди зрителей и скорее всего сам снимает на видео.

    4. Видео с блюзового фестиваля. Примечательно тем, что снимает его точно сам Robinson(и берет интервью у всех, кто ему попадается)

    Выступают и появляются в кадре:

    Golden "Big" Wheeler

    John Brim

    The Ice Cream Men: Johnny Burgin, Scott Dirks, Dave Waldman, Steve Cushing

    5. Отрывок концерта Otis "Big Smokey" Smothers при поддержке The Ice Cream Men и опять продолжается видео с фестиваля

    6. И вот на 1ч 35мин выходит на сцену сам Jimmy Lee Robinson, затем несколько невнятных вещей играет John Brim и завершается видео – инструментальной композицией Robinson''a, снятой уже в клубе.


    Крайне рекомендую к прослушиванию студийные альбомы.'
