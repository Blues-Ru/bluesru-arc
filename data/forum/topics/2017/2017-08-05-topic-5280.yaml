  text: 'Жизненный путь выдающегося американского поэта и писателя, историка и публициста Ленгстона Хьюза (1902-1967) был
    нелегким и не простым. Он родился в семье негритянки-поденщицы. Трудиться ему пришлось с детских лет. Кем он только не
    работал. Был шофером, матросом на океанском пароходе, поваром, лифтером, швейцаром в ночном кабачке на Монмартре и кухонным
    рабочим в ресторане. Он учился в Колумбийском университете в Нью-Йорке, но закончить его Хьюз из-за недостатка денег не
    смог. Только в 1927 году ему удалось завершить свое образование в университете имени Линкольна в Филадельфии. К этому
    времени он уже был известным поэтом.

    Вся эта непростая мозаика жизни Ленгстона Хьюза нашла отражение в его стихах и блюзах.

    Блюзы - одна из распространенных форм негритянского фольклора. Форма блюза такова: первая строчка (иногда слегка измененная)
    повторяется дважды и рифмуется с третьей. Исполняются блюзы, как правило, от первого лица.

    Блюз - это маленький монолог какого-то персонажа, через которого высказывается автор, в данном случае Л. Хьюз.

    Мне показалось интересным собрать эти столь разные монологи, проникнутые то грустью, то юмором, то протестом, то размышлением,
    в одну композицию, соединив поэзию Хьюза с музыкой.

    Я предложил замечательному, на мой взгляд, музыканту - пианисту Борису Фрумкину, поработать вместе. Он согласился, и вот
    пластинка у вас в руках...

    Стихи Хьюза, включенные в композицию, написаны в период 30-х - 50-х годов... Поэтому характер и стиль музыки "ностальгический".
    Состав трио: фортепиано, бас-гитара, ударник. Иногда подключается труба.

    Я позволил себе иногда напевать отдельные строчки, добавив однажды в конце блюза ничего незначащее, но довольно типичное
    восклицание "о, бадедезе, о ей". Это "цитата" из финалов блюзов, исполняемых покойным Луи Армстронгом, который незримо
    присутствует в этой пластинке в блюзах "Трубач", "Когда я умру" и других.

    Эта пластинка - дань любви и уважения к негритянскому искусству, искусству поэзии и джаза прошлых лет. Но мысль ее, как
    мне кажется, современна, своевременна и сегодня: люди созданы, чтобы быть равными, независимо от расы, нации и цвета кожи...

    Люди имеют право на счастье, любовь и добро.


    М.Козаков


    http://alexeig.myjino.ru/pics/5719350463949135.jpg

