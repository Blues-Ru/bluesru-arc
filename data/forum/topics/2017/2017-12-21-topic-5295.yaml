  text: 'Andy Summers - бывший гитарист The Police, обладатель двух Грэмми в категории
    Best Rock Instrumental Performance, в течении 5-ти лет становившийся победителем
    в номинации Pop Guitarist журнала Guitar Player и введенный в Зал Славы этого
    журнала.

    Я был крайне удивлён услышав что он играет слайдом в манере Элмора Джеймса.

    (как я понимаю, с ним на пианино играет Джулс Холланд)

    https://youtu.be/YFWj8JIPLI8?t=457'
