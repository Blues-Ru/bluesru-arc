    text: 'Я не встречал в сети бесплатных. На досугу русские сериалы предпочитаю смотреть http://burundukino.net/top-russkih-serialov.html.
      Но если не жалко можно на озоне выбрать книжку.

      Вот сюжет фильма который понрравился:

      А точнее, она была королевой русского балета. Она очень любила свое дело, и была в нем настоящей мастерицей, чем пленила
      сердца многих мужчин, но главное, сердце императора. Если бы не трагические обстоятельства, которые привели к смерти
      Николая Второго, возможно, именно она бы стала той женщиной, которая способна была изменить историю. Она была тем самым
      человеком, который утвердил русский балет как один из лучших. Их любовь помнят стены Большого Театра и Мариинки... Матильда
      просто ни дня не может прожить без своего любимого дедушки. Она очень любит своих родителей, но дедушка для нее - это
      эталон. Они все время проводят вместе - он воспитывал ее с рождения. Он водит ее гулять каждый день, рассказывает ей
      истории о ее бабушке - его жене, которая умерла и по которой он очень скучает. Она была главным человеком в его жизни,
      и он живет только воспоминаниями о ней и любовью к своей маленькой внучкой. И тут у Матильды случается настоящая травма.
      Матильда идет в монастырь и понимает, что ей придется принять роды у одной из послушниц. Она обещает никому об этом
      не говорить, и в итоге, несмотря на отсутствие нормальных условий и прочие неудобства, ей удается принять роды. И тут
      оказывается, что ходят беременными довольно большое количество монахинь, которых во время войны изнасиловали, и теперь
      у каждой из них в течение нескольких дней должны родиться дети. НО об этом никто не должен знать, ведь подобное светит
      очень большим скандалом в обществе... Матвей - парень, который вырос "во дворе" и предпочитал вести самый обычный ни
      к чему не обязывающий хулиганский образ жизни.'
