  text: "http://www.blues.ru/rblues/ourATB2.htm\nПервый мировой блюзовый бум прохлопали в угаре НЭПа. Три месяца 1926 года\
    \ в СССР гастролировала \"негритянская оперетта\" \"Шоколадные Ребятишки\"(THE CHOCOLATE KIDDIES) — причем \"Известия\"\
    \ сочли шоу \"недостаточно горячим и вовсе не эксцентричным\". Хотя сцена выступление этого варианта министрел–шоу, вошедшая\
    \ в авангардный фильм Дзиги Вертова \"Одна шестая\", говорит, что это было энергичное и малопристойное представление.\
    \ Как бы то ни было, блюз пришел в Россию грустной пьесой из репертуара танцевальных джазовых оркестров… \n\nАндрей Евдокимов\n\
    \nЖурнал «Красная нива», 1926 год, СССР\nhttps://cdn.jpg.wtf/futurico/61/a9/1494006467-61a996914ec4e992ec7a69a40433fb02.png"
