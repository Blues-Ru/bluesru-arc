    text: "Шестая часть мира / One-Sixth of the World (1926, СССР, документальный)\nhttps://www.youtube.com/watch?v=tKawuKOXY8U\n\
      Режиссер: Дзига Вертов\nСценарист: Дзига Вертов \nВ марте 1925 года классику мирового кино Дзиге Вертову и его группе\
      \ поручили заказ на киноленту о внешнеторговом предприятии Госторге, который осуществлял экспорт исконно русских товаров.\
      \ Понимая рекламный характер работы, Вертов, тем не менее, оценил размах выдвинутых предложений. Он разослал киноэкспедиции\
      \ во многие регионы СССР и из снятого материала смонтировал один из своих шедевров - \"Шестую часть мира\". Съемка фильмов\
      \ о Госторге велась по всему Союзу: отстрел пушнины на Крайнем Севере, уборка льна на севере и в центральных районах,\
      \ выращивание овец для выделки каракуля на Кавказе, выращивание хлеба в черноземных и южных житницах, погрузка товаров\
      \ в крупнейших портах. Да и само название картины мало вязалось с рекламно-госторговскими задачами (уже не говоря о\
      \ финале фильма с поднимающимися на борьбу народами востока). Больше соответствовало вертовским планам - рассказать\
      \ о человеке, вооруженном киноглазовским зрением.\n\nhttp://i69.fastpic.ru/big/2015/0729/cb/f4f15f6cbeb2e751f75c7c3fcd866fcb.jpg"
