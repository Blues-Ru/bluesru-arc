      'Росомаха', группа этих смельчаков, отчаянно проявляет свои умственные способности,
      острый ум, смекалку, смелость, борясь с врагами и стараясь освободить свой народ.
      "Это было ошибкой" – судачили многие – "мы не готовы так быстро совершить еще
