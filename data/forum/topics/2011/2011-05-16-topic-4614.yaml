  text: "текст взят отсюда вот: http://reporter.zp.ua/2011/05/16/v-zaporozhe-priezzhaet-luchshii-blyuzmen-belorussii\n\n19\
    \ мая любителей настоящего блюза ожидает праздник - концерт лучшего блюзового гитариста Белоруссии и великолепного певца\
    \ Сергея Курека и группы \"NIGHT DRIVE\".\n \nТе, кто был на 5-м международном фестивале \"Запорожский Джем\" в ноябре\
    \ прошлого года, помнят, как белорусские блюзмены тогда просто ошеломили публику своим драйвом и накалом страстей.\n \n\
    Концерт Сергея Курека и группы \"NIGHT DRIVE\" проходит в поддержку дебютного альбома, который выходит в мае. В программе\
    \ будут представлены авторские композиции последних лет, а также исполнены некоторые произведения таких классиков блюза,\
    \ как Muddy Waters, Albert Collins, John Lee Hooker и других.  \n \nКонцерт пройдет 19 мая в арт-боулинг-клубе \"КапиталистЪ\"\
    , начало в 20-00.\n\n<b>РепортерUA</b>"
