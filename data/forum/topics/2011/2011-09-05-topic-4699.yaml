  text: "кинофестиваль Венеция–2011: \n\nФассбендера можно было увидеть в роли сексоголика в эротической драме Стива МакКуина «Стыд».\nПесня «New York, New York» в исполнении Кэри Маллиган полна тоски и драмы. Стив МакКуин на пресс-конференции признался, что всегда считал эту композицию блюзом: «Вы послушайте текст, он же невероятно грустный». \n\nНЕстандартный взгляд на прославленный Фрэнком Синатрой биг-бэгд-марш, из текста которого следует, что блюз-тоска приключается только в маленьких городишках...\n\nВики >>> http://en.wikipedia.org/wiki/Theme_from_New_York,_New_York"
