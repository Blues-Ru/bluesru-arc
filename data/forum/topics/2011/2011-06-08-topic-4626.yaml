  text: "Может, в ГЕРМАНИИ иметь фамилию Миллер - это все равно, что не иметь фамилию воообще. Но у человека со стеганной\
    \ головой и зайцем на лысой башке фамилию никто не спросит однозначно )))\n\nиз саратова (http://www.saratovnews.ru/newspaper/article/2011/06/07/steve-miller-band-let-your-hair-down/\
    \ ) пишут: \n\n<i>Steve Miller band \"Let Your Hair Down\"\n\nНомер: Июнь 2011\n \n\nSteve Miller музыкант более чем известный.\
    \ Достаточно вспомнить славные 80 годы, когда его  хит Abracadabra звучал во  всех танцзалах. Сам Пол Маккартни считал\
    \ за честь  сотрудничество  со Steve Miller. Так что чутье к хитам у него в крови. В прошлом году он выпустил альбом Bingo!,\
    \   имевший  фантастический успех. В чем секрет? Он  прост. Группа  исполняет лучшие музыкальные композиции в истории\
    \ блюза и рока.  То, что уже проверено временем. Главное, как исполняют. Лучшие музыканты на лучших инструментах с лучшими\
    \ звукооператорами создают совершенно новое звучание этих бестселлеров. И это впечатляет.  По стилистике  новый альбом\
    \ близок к предыдущему.\n\nSteve  сам прекрасный гитарист да и остальные музыканты- лучшие из лучших. Добавьте своеобразный\
    \ вокал, полный набор –от рок-ролла до тягучих баллад и станет ясно- диск понравится всем. И это именно так. Он уже в\
    \ хитах. Рейтинг растет день ото дня и будет расти дальше, пока они не выпустят новый альбом по тому же рецепту. А пока\
    \ - получите удовольствие от Let Your Hair Down.\n\nПослушать фрагмент можно здесь. http://www.amazon.com/Let-Your-Hair-Down-Special/dp/B004RLNRGC/ref=sr_shvl_album_3?ie=UTF8&qid=1307390462&sr=301-3\n\
    \nБакуткин В.В. Автор благодарит медиамаркет Music star за предоставленный диск</i>\n\nСтив Миллер на блюз-ру: /artist/steve-miller-band/"
