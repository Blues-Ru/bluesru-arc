  text: "Король блюза\n\nНовости кино ( http://kino.siteua.org/Новости_кино/259321/Король_блюза ). Автор: Алина Косян \n\n\
    Уэнделл Пирс, сыгравший тромбониста в сериале «Тримей», снова появится на экране в образе музыканта – актер подписался\
    \ на главную роль в байопике «Би Би Кинг и я» (B.B. King and I).\n\n\n\n\n\n \n\n\n\nНо если для сериала ему пришлось\
    \ брать уроки игры на тромбоне, то для нового фильма нужно будет переучиваться на другой инструмент – Би Би Кинг занимает\
    \ третье место в списке 100 лучших гитаристов всех времен (по версии журнала Rolling Stone).\n \nРуководить процессом\
    \ будет Майкл Шрейдер («Человек в кресле»), а за сценарий ответственны Мелора Донохью и Майкл Занетис. Кстати, именно\
    \ Занетис и является тем «я» из названия картины. Фильм основан на его личном опыте барабанщика, отправившегося в Голливуд\
    \ покорять музыкальный мир. Здесь Занетис и встретил Би Би Кинга, с которым его на всю жизнь связала дружба. Сюжет фильма\
    \ будет сконцентрирован на пути легендарного блюзмена к звезде на голливудской Аллее славы, которую он получил в 1990\
    \ году. Роль Занетиса отдана актеру Патрику Фьюджиту («История одного вампира», «Почти знаменит»).\n \nПроизводством займется\
    \ компания King Size, которая запланировала начать съемки 1 сентября, а выход фильма на весну 2012 года."
