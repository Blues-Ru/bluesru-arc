  text: "БГ (о мертвых музыках): \"Тоже и с блюзом. То, что сейчас называется блюзом… Мы далеко от Миссисипи. Английский блюз\
    \ таковым назвать нельзя. И никто не пытается говорить, что это так. Форма-то есть, а содержания прежнего нет – стиль\
    \ жизни другой. Каждая музыка рождается для какой-то жизни, для какого-то образа жизни, для людей, которые живут этой\
    \ жизнью полноценно. И то, что игралось на крылечке в 1912 году на трех струнах – это был блюз. И люди, исполнявшие его,\
    \ не знали, что они исполняют блюз. Это было счастье. \n\nИз всего сказанного получается, что умер скорее не рок-н-ролл\
    \ или блюз, а тот образ жизни\". \n<a href=\"http://www.segodnya.ua/interview/14291352.html\">Источник</a>"
