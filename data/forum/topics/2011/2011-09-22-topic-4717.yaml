    text: В России блюз набирает обороты..музыканты и публика стали интересоваться блюзом гораздо больше чем скажем пять-десять
      лет назад..скорее рок теряет актуальность..у нас сейчас такое же время как в Америке в 20-30х..люди в депрессии от не
      легкой жизни..они идут в клубы чтобы вдохновиться..развлечься..потанцевать.и блюз единственная музыка которая способна
      удовлетворить людей..музыкальный уровень групп,качество исполняемой музыки,уровень музыкантов растет.все это происходит
      без рекламы.Кризис всегда был самым лучшим временем для понимания подлинного искреннего искусства и цели для чего оно
      служит.
