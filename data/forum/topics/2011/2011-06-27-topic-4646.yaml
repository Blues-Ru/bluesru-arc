  text: Чисто для галочки - вчера в столице с большим успехом (не в смысле заполненности
    зала, которая оставляла желать большего, но в смысле приёма артиста) прошёл первый
    и единственный в Москве концерт Джона Фогерти, одной из легендарных рок-личностей,
    вожака и голоса Creedence Clearwater Revival, достойного упоминания на этом форуме
    хотя бы потому, что он профинансировал из собственного кармана установку надгробий
    на могилах Роберта Джонсона, Чарли Паттона, Миссиссиппи Джо Калликотта и других
    блюзменов прошлого.
