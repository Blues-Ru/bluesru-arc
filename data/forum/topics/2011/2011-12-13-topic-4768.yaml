  text: "В последнее время группа неплохо развивается. Ансамбль получил приз за оригинальную\
    \ композицию на конкурсе Gnesin Jazz. Солист ансамбля саксофонист Юрий Севастьянов\
    \ получил в награду сопрано-саксофон престижной марки Paul Mauriat и приз за творческую\
    \ индивидуальность на конкурсе Голос саксофона в современном мире, став его дипломантом.\
    \ Музыканты записывают альбом, разучивают новые пьесы. \nВсё это не может не радовать."
