  text: 'Фирма "Калория" продолжит выпуск фирменных сыров - Ура, товарищи! читаем тут: http://www.yuga.ru/news/231682/


    <i>"Сыр с голубой плесенью "Кубанский блюз" сочетает в себе яркий вкус, интригующий аромат, удивительную нежность и пикантную остроту. Сыр покрывают фольгой, чтобы предотвратить потерю веса от испарения и не повредить натуральную корочку. Внутри – маслянистая мякоть с голубой плесенью, которая образует небольшие полости. Сыр "Кубанский блюз" отличается ярко выраженным неповторимым вкусом, напоминающим вкус лесных орехов. Этот сыр будет являться украшением любого стола. Обычно его подают в конце обеда, нарезанным на кусочки или в составе десерта"</i>'
