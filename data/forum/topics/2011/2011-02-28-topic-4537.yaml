        text: "1 марта, в 1951 году (60 г. назад) в Мемфисе, Техас, Сэм Филлипс (Sam Phillips) записал оркестр Айка Тернера (Ike Turner) с песней «Рокета 88» (Rocket 88). Запись он продал для издания чикагскому лейблу Chess. Пластинка вышла под именем солиста оркестра, певца Джеки Бренстона (Jackie Brenston). Вообще-то, оркестр исполнял модный ритм-энд-блюз. Но критики-историки посчитали именно эту запись – первым рок-н-роллом на пластинке. \n\nракета разве не через А по-русски?"
