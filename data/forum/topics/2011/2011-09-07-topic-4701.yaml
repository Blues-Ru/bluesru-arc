  deleted: false
  text: "Журнал GO - толстый, глянцевый, гламурный и мужской - провернул супер-тусу\
    \ в Королевском оперном театре «Ковент-Гарден». Среди \"Человеков года\" оказались\
    \ двое, поработавших не по своей главной специальности. Кит Ричардс (The Rolling\
    \ Stones) стал \"писателем года\" за свои мемуары. Мощь его писательского таланта\
    \ замтна уже в названии: не какая-то там \"исповедь\", а целая \"Жизнь\" (Life).\
    \ \n\nМузыкантом года назван Хью Лори («Доктор Хаус») - за запись хлипкого блюзового\
    \ альбома Let Em Talk.\n\nЛауреаты и номинанты,парадные фотки, видео на красном\
    \ ковре и за кулисами и прочая мишура: http://www.gq-magazine.co.uk/men-of-the-year/home"
