  deleted: false
  text: "Я был в жюри, которое определило первых двух победителей мини-голосованием с обменом впечатлениями. Мой личный подход\
    \ - оценить не уровень сегодняшнего профессионализма, а возможность в будущем вырасти и сыграть музыку, которая мне будет\
    \ интересна и чем-то тронет. Поскольку большая часть профессионалов меня сегодня не трогает, поэтому я не считаю, что\
    \ это ориентир, к которому стоит стремиться. У человека со вкусом должны быть свои ориентиры и понимание, что хорошо.\
    \ Внешняя оценка и оценка публики не должны сбивать с толку.\n\nСама премия, с моей точки зрения, это вид поощрения, и\
    \ человека, который вышел на высокий уровень, но занимается фигней, поощрять совсем не хочется. Поскольку простое соучастие\
    \ в результате голосования не позволяет выразить отношения в полной мере, я запишу свои микрорецензии тут.\n\nПолина Паровозова\
    \ (вокал) - на примере песни Think я бы посоветовал немного ослабить напор и поиграть как Арета Франклин с таймингом.\
    \ Она чувствует себя комфортно в ритме, иногда специально запаздывает и наоборот. В этом именно искусство пения.\n\nАнастасия\
    \ Шелутькова (вокал) - вошла в мою четверку, первое место за сценический образ, сценический костюм и искусство перевоплощения.\
    \ Вокал у Анастасии на очень высоком уровне, однако нужно заниматься дальше, чтобы во всех местах было вибрато и менее\
    \ плоский тембр. Для того, чтобы стать именно блюзовой певицей, нужно добавить теплоты, больше погрузиться именно в блюзовую\
    \ более грязную форму. Кажется, что если все это случится, можно стать очень ярким персонажем на сцене.\n\nИлья Анисимов\
    \ (гитара, вокал) - все по-достинству оценили качества шоумена и экспрессию. Я бы добавил в плюс чуть неординарный способ\
    \ играть на гитаре и фанковые штуки. В остальном подход и выразительные мне не понравились. Из трех песен две были потрачены\
    \ на какие-то скучнейшие рок-н-роллы, которые меня не трогают. Не было попытки продемонстрировать мне какую-нибудь клевую\
    \ песню. Было ощущение, что содержание песни - второстепенная вещь и только средство, чтобы устроить свое шоу. Соответственно,\
    \ на гитаре было сыграно мало. Текст со сцены тоже был в минус, отдавал эго(центр)измом. Imho, все неправильно.\n\nЮля\
    \ Демьянская (вокал) - понравилась мне больше всего: хороший выбор песен, поведение на сцене и похожий на настоящий вокал,\
    \ который используется как средство показывать нюансы в хороших песнях. Причем видно, что техника, видимо, результат обучения,\
    \ а чувство песни - личное. Нужно, imho, еще заниматься вокалом, чтобы оттачивать пение на сцене, когда себя не слышно,\
    \ а главное - слушать и пытаться играть много хорошей и разной музыки. Поздравления!\n\nСтас Шишков (гитара, вокал) -\
    \ для начала нужно отдать должное технике извлечения забойных звуков. Это требует времени и некоторого таланта, а, главное,\
    \ желания звучать забойно. В остальном, сплошной минус за внутренние установки. Так играть - это не круто!! Сплошная экспрессия\
    \ - это очень однобокое выразительное средство, скучное и неинтересное. Разбавлять ее тихими местами - положения не спасает,\
    \ ибо знаешь, что это только затишье перед бурей. Есть куча разнообразной музыки, нежели чем блюзы Led Zeppelin, выразительных\
    \ средств и эмоций, помимо надрыва. Настоятельно рекомендую поскорее вырасти музыкально и перестать заниматься фигней,\
    \ тем более, что техника и талант есть!\n\nЩеглов Александр (гитара, вокал) - вошел в мою четверку. Вместе со всеми отдаю\
    \ должное профессионализму на гитаре, на сцене и даже по части вокала. Я думаю, что у Александра есть очень хорошие возможности,\
    \ однако, нужно много чего исправить. Слишком холодно, ровно, скучновато, нужно больше проявлять что-то, что называют\
    \ \"собственным голосом\". Песни выбраны ординарные и довольно скучные. На 95% уверен, что это происходит из скудности\
    \ фонотеки. Нужно прослушать минимум 1000 пластинок, пропустить через себя много музыки. Тогда необычные песни, которые\
    \ играешь, будут вызывать у самого больше энтузиазма, и это будет передаваться публике.\n\nОльга Лисикова (вокал) - профессиональное\
    \ появление на сцене в составе собственной группы. С одной стороны, опыта много, вокал отработанный, но, как написано\
    \ в начале, за это совсем не хочется давать призы. Я не услышал разных эмоций, кроме \"пою так мощно, как могу\", все\
    \ три песни были достаточно одинаково спеты. Если так дело обстоит у профессионала, который поет давно и вышел на такой\
    \ уровень, то, видимо, развития от него ждать не приходится? На мой взгляд, это не то, к чему стоит стремиться. \n\nАнна\
    \ Макеева (вокал) - нужно отдать должное уровню нескольких вещей, не буду называть, те, кто слышал, тот поймет. Общий\
    \ совет вокалисткам - \"нужно похоронить уже Дженис Джоплин\", не нужно продолжать умирать на сцене, хватит выжимать одинаковые\
    \ эмоции из всех песен, не нужно так пафосно относиться ко всему этому. Нужно отвлечься от себя и от темы \"я буду страдать\
    \ на сцене под музыку также, как она, это будет так же мощно\", а нужно обратить внимание на клевые песни, постараться\
    \ показать, чем они хороши.\n\nИлья Портнов (гармоника) - попал в мою тройку, дальше я уже выбирал, за кого голосовать.\
    \ Хорошая гармоника, копания в интересную музыку. Work Song и румба - хороший выбор, были попытки играть с музыкой, в\
    \ том числе ритмически. Нужно много чего поправлять (Work Song и Greasy Gravy не нужно играть в \"голимом мажоре\"), дальше\
    \ учиться технике и нюансам, стараться играть меньше, больше пауз и заигрываний с ритмом. Но, в общем, если двигаться\
    \ в правильном направлении, то можно стать интересным гармонистом в хорошей группе. Главное - концентрироваться на разной\
    \ интересной музыке и нюансах. Как их называет Эстрин \"a combination of musical devices designed to manipulate the emotions\
    \ of the listener\".    \n\nНу и бонус-трек с джема вне конкурса:\n\nМихаил Кистанов (гитара, вокал) - научился хорошо\
    \ играть, забойным штукам и вести себя на сцене. Миша срывал много раз положительные оценки на свежака и высокие оценки\
    \ уровня профессионализма. Но у меня такой подход вызывает глубокое чувство протеста, ну нельзя так!! Сколько можно играть\
    \ в экспрессию, дозируя побольше и поменьше? Нельзя больше одного раза подряд играть на джеме одну и ту же песню, на это\
    \ должно быть табу! И хватит играть песню про овечку! Я уже не могу это слушать... Блюзовый концерт - это не бенефис гитариста,\
    \ оно должно быть про музыку. Хорошую и разную. Музыка должна привлекать больше внимания, чем гитарист.\n\nДима Красивов\
    \ и Паша Семилетков (гитара, гитара) - очень порадовали. У Паши очень необычные гитарные мозги. У Димы гипер-вкус и опыт,\
    \ спросите у него, чему учиться, и чего делать не нужно.\n\nМузыканты, пожалуйста, не стесняйтесь и ищите себе продюсеров,\
    \ которые будут давать вам советы. Не нужно тратить время и совершать одни и те же ошибки. ;)"
