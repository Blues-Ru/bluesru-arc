  text: "Британский пианист Ben Waters записал альбом к 25-летней годовщине смерти британского пианиста Яна Стюарта <a href=\"http://www.amazon.com/Boogie-4-Stu-Ben-Waters/dp/B004S7T7YQ/ref=sr_1_1?s=music&ie=UTF8&qid=1308935371&sr=1-1\" target=\"_blank\">Boogie 4 Stu</a>. \n\nЭто был выдающийся музыкант и замечательный человек, первопроходец британского блюза... ну и неофициальный участник группы  the Rolling Stones... Имя у нас мало известное, а напрасно. Потому стоит послушать и почитать передачу А.Калачева \"Доктор Блюз\", посвященную этому альбому и истории самаго Стюарта, яркой и весьма поучительной. Читать здесь: http://www.radiorus.ru/news.html?id=546616"
