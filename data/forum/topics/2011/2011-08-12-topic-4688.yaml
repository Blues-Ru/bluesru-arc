  text: 'Приветствую всех старожилов! У меня такой вопрос. Заинтересовался один знакомый блюзом, просил посоветовать что-нибудь
    для ознакомления более глубокого. Я вот подумал, что для начала идеально подойдёт альбом BB King''а - Live At The Apollo.
    Он харизматичен, цепок, вкусен по моему мнению. Но Кинга нужно видеть - его харизма проявляется так наиболее ярко. Плюс
    Джин Харрис на фоно - это сам по себе культовый музыкант...Ну так вот, перелопатил весь инет - только CD. А ведь этот
    концерт показывали на нашем ТВ. Мало того, я его записал на кассету, да при переезде оставил на старой квартире, будучи
    уверенным, что всегда куплю его на DVD, к тому не имея видеомагнитофона уже. Мне уже самому страшно, неужели уже нельзя
    найти этот концерт на видео, а последнюю копию я оставил на растерзание несколько месяцев назад? Может кто подскажет,
    я уже просто тупо для себя хочу его восстановить.

    Капитану Немоффу отдельный привет! :)'
