  subject: Удмуртия услышит джаз и блюз на губной гармонике
  deleted: false
  text: "17 октября, на сцене государственной филармонии Удмуртии состоится концерт «Jazz & Blues» на губной гармонике. Как сообщает пресс-служба филармонии, в концерте примут участие один из немногих на сегодняшний день профессиональных исполнителей на губной гармонике в России Борис Плотников и один из самых молодых и перспективных джазовых пианистов музыкальной сцены Екатеринбурга Антон Зубарев. \n\nБорис Плотников играет на диатонической и на хроматической губных гармониках. Являясь одним из пионеров техники овербендинга на территории России, он активно использует все хроматические возможности диатонической гармоники. Игра музыканта отличается экспрессией, артистизмом и скоростными пассажами, которые иногда оставляют место для задумчивой меланхолии джазовых баллад. \n\nНа сегодняшний день Борис Плотников - солист джазового биг-бенда училища им. Чайковского под управлением В.Владимирова, участник джаз-квинтета В.Владимирова и джаз-рэп группы \"Виннебаго\". \n\nВ программе концерта прозвучат произведения Дюка Эллингтона, Чарли Паркера, Биг Билл Брунзи и других.\n\n- сообщает Удм-Тнфо: http://www.udm-info.ru/news/udm/14-10-2011/ijazznblues.html"
