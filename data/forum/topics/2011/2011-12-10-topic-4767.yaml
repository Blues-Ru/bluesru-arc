  subject: 'Прощание с Самлиным:'
  deleted: false
  text: 'отсюда: http://muz.ru/Store/NewsDetails.aspx?NewsId=109439


    Партнер Самлина, Тони Энн, сообщает: «Я просто хочу поделиться с вами новостью о том, что любящие поклонники Губерта,
    Мик Джаггер и Кит Ричардс, настояли на том, чтобы взять на себя все расходы по организации похорон. Боже, благослови «Rolling
    Stones».

    Губерт Самлин умер 4 декабря в возрасте 80 лет. Он был одним из самых выдающихся исполнителей блюза так называемой «чикагской»
    школы.

    В 2006 году Кит Ричардс вместе с Самлином работал над альбомом «Them Shoes» последнего.

    Служба пройдет в Хомвуде, штат Иллинойс, 13 декабря. Для поклонников церемония прощания состоится 12 декабря.

    Мик Джаггер заявил: «Губерт был выдающимся, просто поразительным музыкантом. Он отличался оригинальным мягким тоном, который
    прекрасно подходил для сочетания с вокалом Хаулина Вульфа. Губерт вдохновлял всех нас, мы учились писать песни, глядя
    на его творчество».

    «Это очень серьезная утрата для всех нас. Мы переполнены горем. И при этом хочется заметить, что мы были бы очень благодарны
    за то, чтобы в это время журналисты не лезли в нашу личную жизнь».'
