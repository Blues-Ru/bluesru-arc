    text: 'от BluesNews: http://www.bluesnews.ru/news/?id=3876


      Hubert Sumlin, умерший 4 декабря на 81-м году жизни, будет похоронен 13 числа в городе Хоумвуд, штат Иллинойс. Публичное
      прощание с выдающимся блюзовым музыкантом состоится днем раньше в городе Totowa (Нью-Джерси), где Хьюберт жил последние
      несколько лет. Все траты по организации траурных процедур, самих похорон и на установку памятника возьмет на себя группа
      The Rolling Stones. В сети появилось заявление гражданской жены гитариста Toni Ann Mamary: «Мик Джаггер и Кит Ричардс
      настояли на том, чтобы заплатить за похороны Хьюберта. Да благословит Бог «Роллинг Стоунз»». Музыканты легендарного
      ансамбля также объявили, что выступят на церемонии прощания со своим кумиром. При этом не уточняется, случится это во
      время гражданской панихиды для публики или во время самой церемонии похорон, на которую будет допущен узкий круг лишь
      самых близких людей. СМИ со ссылкой на портал contactmusic.com цитируют комплиментарные высказывания Джагера и Ричардса
      в адрес старшего коллеги. Последний в частности сказал: «С печалью принял я новости об уходе Хьюберта. Он отчаянно боролся.
      Для меня он был и как родной дядька, и как учитель. Все гитаристы должны испытывать похожие чувства. Сердечный, остроумный
      и всегда расположенный на игру, Хьюберт являлся джентльменом в высшем понимании слова. Да, мне жаль, однако у нас его
      записи. Мои соболезнования его семье. Я люблю тебя, Хьюберт». Самлин известен как гитарист-любимец Хаулина Вульфа. Он
      включен ТОР 100 гитаристов журнала «Rolling Stone». В 2004 году Кит Ричардс принимал участие в записи альбома Самлина
      "About Them Shoes".'
