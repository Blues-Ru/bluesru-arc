  deleted: false
  text: "Журналисты продолжают писать анонсы (http://www.7info.ru/index.php?kn=1299052873 ): \n\nВ рязанском кафе прозвучит настоящий американский блюз \n\n\nВ среду, 2 марта, в джаз-кафе «Фонтан» выступит американский блюзмен, творчество которого престижный журнал «Blues Review» охарактеризовал как «совершенное мастерство», – Роберт Лайтхауз. \n\nНа сегодняшний день Лайтхауз является одним из самых ярких представителей дельта блюза на североатлантическом побережье океана. На уникальный стиль музыканта оказали сильное влияние Muddy Waters, Dr. Ross, Elmore James, John Lee Hooker и Jimmy Hendrix. Последний альбом Robert’а («Democracy BLVD») вышел в 2009 году и получил очень хорошие рецензии от самых влиятельных зарубежных музыкальных критиков. \n\nЗа свою долгую творческую жизнь он успел поработать со многими выдающимися блюзовыми музыкантами, среди них такие звёзды, как Robert Cray, Taj Mahal, Mick Fleetfood, David Lindley, John Hammond, музыканты Muddy Waters и Howlin Wolf. Robert Lighthouse успешно выступает в Америке, Скандинавии и Европе. С 2008 года у музыканта было ещё четыре тура в нашей стране. \n\n<I>и кожда же наш пострел успел \"поработать\" с Хаулин Вулфом... Да и насчет Мадди - как-то сомнительно.</I."
