    deleted: false
    text: "Lightnin' Hopkins я бы посоветовал немного ослабить напор и поиграть таймингом. Надо чувствовать себя комфортно\
      \ в ритме, иногда специально запаздывать и наоборот. В этом именно искусство блюза.\n\nГде нормальный сценический образ?\
      \  Сценический костюм и искусство перевоплощения. Вокал у Lightnin' Hopkins на очень высоком уровне, однако нужно заниматься\
      \ дальше, чтобы во всех местах было вибрато и менее плоский тембр. Для того, чтобы стать именно блюзменом, нужно добавить\
      \ теплоты, больше погрузиться именно в блюзовую более грязную форму. Кажется, что если все это случится, можно стать\
      \ очень ярким персонажем на сцене.\n\nLightnin' Hopkins я бы добавил в плюс чуть неординарный способ играть на гитаре\
      \ и фанковые штуки. В остальном подход и выразительные мне не понравились. Из трех песен две были потрачены на какие-то\
      \ скучнейшие рок-н-роллы, которые меня не трогают. Не было попытки продемонстрировать мне какую-нибудь клевую песню.\
      \ Было ощущение, что содержание песни - второстепенная вещь и только средство, чтобы устроить свое шоу. Соответственно,\
      \ на гитаре было сыграно мало. Текст со сцены тоже был в минус, отдавал эго(центр)измом. Imho, все неправильно.\n\n\
      Lightnin' Hopkins нужно, imho, еще заниматься вокалом, чтобы оттачивать пение на сцене, когда себя не слышно, а главное\
      \ - слушать и пытаться играть много хорошей и разной музыки.\n\nLightnin' Hopkins - для начала нужно отдать должное\
      \ технике извлечения забойных звуков. Это требует времени и некоторого таланта, а, главное, желания звучать забойно.\
      \ В остальном, сплошной минус за внутренние установки. Так играть - это не круто!! Сплошная экспрессия - это очень однобокое\
      \ выразительное средство, скучное и неинтересное. Разбавлять ее тихими местами - положения не спасает, ибо знаешь, что\
      \ это только затишье перед бурей. Есть куча разнообразной музыки, нежели чем блюзы Led Zeppelin, выразительных средств\
      \ и эмоций, помимо надрыва. Настоятельно рекомендую поскорее вырасти музыкально и перестать заниматься фигней, тем более,\
      \ что техника и талант есть!\nЯ думаю, что у Lightnin' Hopkins есть очень хорошие возможности, однако, нужно много чего\
      \ исправить. Слишком холодно, ровно, скучновато, нужно больше проявлять что-то, что называют \"собственным голосом\"\
      . Песни выбраны ординарные и довольно скучные. На 95% уверен, что это происходит из скудности фонотеки. Нужно прослушать\
      \ минимум 1000 пластинок, пропустить через себя много музыки. Тогда необычные песни, которые играешь, будут вызывать\
      \ у самого больше энтузиазма, и это будет передаваться публике.\n Нужно отвлечься от себя и от темы \"я буду страдать\
      \ на сцене под музыку также, как они, это будет так же мощно\", а нужно обратить внимание на клевые песни, постараться\
      \ показать, чем они хороши.\n Но, в общем, если двигаться в правильном направлении, то Lightnin' Hopkins можно стать\
      \ интересным блюзменом в хорошей группе. Главное - концентрироваться на разной интересной музыке и нюансах. Как их называет\
      \ Эстрин \"a combination of musical devices designed to manipulate the emotions of the listener\"."
