  text: '"Самарский бизнесмен Владимир Аветисян и его блюзовый ансамбль D''Black гастролирует в Испании," - Об этом сообщил
    телеканал "Терра".


    "Артисты выступили на площади в городе Льянса. Начальник полиции города Виктор Алькарас подарил D''Black Аветисяну диск
    со своей музыкой. Концерт посетила супруга мэра, советник по культуре при горадминистрации Нурия. "Мы очерь рады, что
    музыканты, которые играют музыку Эрика Клэптона, выступили в нашем городе. Мы не ожидали, что это будет настолько фантастически
    высокий уровень", - сказала она.


    Следующий концерт D''Black даст на главной площади Барселоны."


