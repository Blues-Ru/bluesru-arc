  text: 'Тут у меня в частной переписке с с блюзолюбителем и завсегдатаем blues.ru и Дома у Дороги Андреем Соболевым завязалось обсуждение про то, уместно ли обсуждать на формуле тему про выборы. Пришли к выводу, что устраивать политический флейм тут - оффтопик и не полагается.


