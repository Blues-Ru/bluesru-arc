  text: "У нас часто возникает задача опубликовать какой-нибудь прекрасный текст на blues.ru. И получается, что текст лежит, ибо его нужно сверстать, причесать и html-изировать. Тут нужна некоторая доля аккуратности и единообразия, иначе потом костей не соберешь. У меня не хватает на это времени, а если хватает, то не хватает на какое-нибудь заумное программирование блюзовой афиши.\n\nБыло бы, конечно, просто прекрасно, если бы кто-то был готов поволонтерить и помочь в публикации статей. Пообещать за это ничего, кроме славы, упоминаний на странице \"О сайте\" и морального удовлетворения, я не могу. Но и этого может быть кому-то вполне достаточно ;) \n\nЗаранее спасибо, в том числе и всем сочувствующим!"
