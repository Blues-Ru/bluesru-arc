  text: '<I>Евгения Сухарукова пишет для http://cxid.info/78884.html  про блюз-рок
    на Рождество: </i>



    В Луганске пройдут рождественские встречи в стиле «underground»


    7 января в рок-кафе «TIGER» пройдет концерт «Рождественские встречи», в котором
    примут участие луганские группы «Алфавит», «Проспект» и «SinTeZ». Об этом корреспонденту
    Cxid.info сообщили организаторы.


    Луганским меломанам обещают уютную и приятную атмосферу, погружение в луганский
    «underground» и замечательную встречу Рождества. В этот вечер перед посетителями
    кафе выступят рок-н-ролльные команды, которые будут играть в основном композиции
    собственного сочинения. Об участниках концерта рассказал солист группы «SinTeZ»
    Родион Кривуля.


    «Группа «Алфавит» существует всего год. Несмотря на такую молодость коллектива,
    участниками его являются музыканты, юность которых прошла в 80-е годы.  И как
    не трудно догадаться, играют они уже больше чем полжизни, и это далеко не первый
    их коллектив. Музыканты характеризуют свой стиль как психоделический-рок, но многие,
    слушавшие их, говорят, что там больше от рока чем от психодела», - сообщил музыкант.


    Группа «Проспект» радует своих фанатов вот уже 6 лет, играя музыку в стиле блюз-рок.
    Тексты песен написаны в основном на социальные темы, поэтому слушатели пытаются
    примерить на себя символизм и образность композиций. «SinTeZ» образовался в октябре
    2007 года. Коллектив является частым гостем рок-кафе «TIGER», жанр ансамбля эклектичен
    и использует элементы классического рока, рок-н-ролла, блюза, регги.


    Концерт состоится 7 января в 18:30.'
