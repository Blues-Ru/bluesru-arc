  text: 'One Gin Please


    В страшное дымное лето четверка не только не бежала из столицы, но и, превозмогая
    природные катаклизмы, активно трудилась над записью нового материала. По заверениям
    участников, героические усилия были не напрасны, и ближе к сентябрю этого года
    10 песен составят альбом «Blues Smells Like a Corpse» («Блюз пахнет как мертвец»).
    Пока же группу можно послушать живьем, благо One Gin Please в последнее время
    развили бурную концертную деятельность. Сейчас они играют задорный, драматичный
    и грязный гаражный рок и блюз-рок, напоминающий The Hives и The Vines. Что будет
    завтра – неизвестно. Хотя история группы коротка, меньше года, ее звучание уже
    успело поменяться. «Наша группа через два года будет совсем другой, мы уже сильно
    отошли от того, с чем начинали. С каждой репетицией мы уходим в «больший ум».
    Психоделики на альбоме будет навалом!» — обещают музыканты.


    http://infox.ru/afisha/music/2011/01/14/weekend.phtml'
