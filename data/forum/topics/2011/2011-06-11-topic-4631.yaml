  text: '11.06.2011 15:18


    Смотреть



    В Австралии установлен новый мировой рекорд по одновременной игре на саксофоне.


    В Сиднее собрались 940 музыкантов разных возрастов и степени профессионализма. Вместе они исполнили композиции "Вальсирующая
    Матильда" и "С днем рождения". Акция была проведена в честь открытия местного фестиваля джаза и блюза. Предыдущий мировой
    рекорд был установлен в 2008 на джазовом фестивале на Тайване. Тогда собрались 918 музыкантов.'
