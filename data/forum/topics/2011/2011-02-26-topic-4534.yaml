  text: "На втором этаже был регулярный теперь для ДуДа по четвергам концерт Smitanaband. Это - фанковая группа с вокалисткой\
    \ Смитаной, которая хорошо выглядит, много поет и, видимо, участвует в создании весьма сложных аранжировок.\n\nГруппа\
    \ мне очень даже понравилась, у них крутая фанковая ритм-секция: инопланетянин на басу играет настолько мощно и четко,\
    \ что дрожит пол и барная стойка. Гитара играет много довольно сложного фанка. Наибольшее впечатление на нас с Димой произвела\
    \ клавишница - она была в образе скромной учительницы музыки, играла на сравнительно коротком синтезаторе, и с невозмутимым\
    \ видом выдавала грозные завороченные органные соло в стиле Meters.\n\nГруппу приятно слушать, я думаю, что если молодая\
    \ Смитана еще подрастит себе голос в ближайшие годы, будет совсем хорошо, тут, кажется, зарыт основной ресурс для роста.\
    \ \n\nЕсть одна опасность, которая подстерегает все фанковые коллективы, состоит в том, что они учатся хорошо играть,\
    \ но играют недостаточно разнообразные темы/идеи. Т.е. у них хорошо с \"как\", но не очень со \"что\". На мой взгляд,\
    \ фанк особенно хорош в смеси с чем-то осмысленным, имеющим какую-то идею. Это нужно, чтобы захотелось послушать не 2\
    \ песни, а целый концерт. Кажется, Смитанабенд пока еще в норме - не скучно ;)\n\nУ средних клубных блюзовых групп ровно\
    \ обратная проблема - играют песенные стандарты от великих авторов, где есть завязка-тема-кульминация и развязка, однако,\
    \ делают это некачественно и со скучными слишком простыми аранжировками. Я думаю, что многим было бы полезно посмотреть\
    \ на хорошую фанковую ритм-секцию, там стандарты качества повыше."
