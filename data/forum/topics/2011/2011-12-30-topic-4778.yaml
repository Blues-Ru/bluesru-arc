  text: GE told me of this night when I met him. Eddie Van Halen's wife was guest host of TV show for that week. Eddie came
    along because he was tired of Los Angeles. He hung around GE's office talking to musicians until a few days when GE looked
    and and said "Dah?". Eddie just looked at him and said "Oychen, oychen, oychen". The put this together and made history.
