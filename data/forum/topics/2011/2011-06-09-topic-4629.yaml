  text: "Издан альбом <b>The Doors  Live In Vancouver. 1970.</b> \n\nНа то, что запись концерта в зале Pacific Colliseum считалась утраченной, особенно роптали поклонники блюза. Ведь в тот вечер 6 июня 1970 года на концерт к The Doors заглянул культовый американский блюз-гитарист Альберт Кинг. И тоже вышел на сцену: сыграл с группой на слайд-гитаре свои культовые хиты: от Money Little до Red Rooster. А Джим Моррисон их спел, едва ли не единственный раз воплотив на сцене знаменитые стандарты короля резкого и напористого блюза. Кто их только не играл - от Эрика Клэптона и Free до Гэри Мура. Но только у Джима Моррисона получилось спеть их столь драматично и трагично, будто злясь на себя, с хрипящей болью и безнадежной страстью на обертонах. А дуэт гитаристов - \"своего\" Робби Кригера и гостя Альберта Кинга, устраивал такую неистовую перекличку на соло-гитарах, что песни в итоге растягивались до шести с половиной минут звучания. И импровизирующим музыкантам не хотелось останавливаться. \"В этот вечер мы играли блюзовые песни The Doors, а потом к нам присоединился Альберт Кинг с его классическим звучанием блюза. С большой сигарой в зубах, с минималистскими, мастерскими блюзовыми нотами. И Джим Моррисон буквально из штанов выпрыгивал, чтобы показать, что он тоже пожилой и заслуженный мастер корневого блюза\", - рассказал теперь об этом концерте и альбоме Live In Vancouver. 1970 клавишник и басист The Doors Рэй Манзарек.\n\nПочерпнуто из статьи Александра Алексеева в газете \"Культура\": http://www.rg.ru/2011/05/25/doors.html"
