  text: "В мае:\n1 – 75-летие со дня рождения недавно усопшего Lacy Gibson (личность пусть малоизвестная, но музыкант достойный и судьба блюзовая). Передача ВЭБ про него – сегодня ночью, в 02оо на «эхе»\n\n8 – 100-летие со дня рождения Robert JOHNSON. ВЭБ по этому исключительному поводу – в ночь с 7-го на 8-2.\n\n18 - 100-летие со дня рождения Big Joe TURNER (вот кого давно пора вспомнить, а то забыли совсем… А напрасно!) ВЭБ по этому исключительному поводу – в ночь с 21-го на 22-е.\n\n20 – 75-летие со дня рождения Sterling MAGEE, вокалиста-гитариста, чтеца и на всем, что звучит, игреца; участника уличного бэнда SATAN AND ADAM. ВЭБ по этому исключительному поводу – в ночь с 28-го на 29-е.\n\nА что делать? Пройти мимо этих юбилеев – значит, не любить историю блюза. \n\nА есть еще достойные, но не такие «круглые» даты: 90 лет Cleveland Chenier, 60 лет Greg Piccolo, 70 лет Eric BURDON, 80 лет Bud SPIRES, 90 лет Big Boy Henry, 70 лет Bob DYLAN, 75 лет Bill DICEY, 60 лет Ron LEVY – и это еще не полный список!"
