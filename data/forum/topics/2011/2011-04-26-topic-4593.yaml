  text: "<b>Завершено расследование дела о крушении самолета-амфибии</b> - <a href=\"http://www.glazey.info/news/more/social/zaversheno_rassledovanie_dela_o_krushenii_samoleta-amfibii/\" target=\"_blank\"><i>сообщается здесь</a>:</i>\n\n\"Катастрофа произошла близ поселка Мирный в Серпуховском районе13 июня прошлого года в 10.45. В результате чего погибли три человека. Трагедия унесла жизни 45-летнего владельца самолёта Владимира Соколова и двух пассажиров - супругов-москвичей 34 и 28 лет - Александра Бородина (саксофониста группы «Сколдер-блюз») и его супруги Киры, которая была беременна. \n\n\nРасследование уголовного дела прекращено в связи со смертью пилота, пояснил руководитель Московского следственного отдела на воздушном и водном транспорте СК России подполковник юстиции Павел Селиверстов. Установлено, что самолет-амфибия Л-44 ра-0600г под управлением Соколова, совершая учебно-тренировочный полёт, в районе поселка Мирный потерпел крушение, ударившись о поверхность земли, отчего произошёл взрыв и возгорание. Расследование проводилось в плотном взаимодействии со специалистами Межгосударственного авиационного комитета и органов Ространснадзора. Оно показало, что Соколов, пилотировавший воздушное судно, нарушил ряд требований безопасности. Пилот снизил скорость ниже допустимой, из-за чего произошло «сваливание» воздушного судна и последовало неуправляемое падение самолета.\n \n\n- Иных лиц, причастных к совершению преступления, не установлено, подчеркнул Павел Селиверстов.\""
