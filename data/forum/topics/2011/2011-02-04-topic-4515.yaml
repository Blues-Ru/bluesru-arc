  text: 'Из вчерашнего календаря:В 2003 году (8 г. назад) в Олхамбре, Калифорния, в собственном доме по обвинению в убийстве
    был арестован легендарный продюсер Фил Спектор (Phil SPECTOR), основатель лейбла Sun, изобретатель "стены звука", работавший,
