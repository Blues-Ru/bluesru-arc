  text: "Многие годы я повторяю, что Кеб может играть блюз, но не хочет. Почему-то,\
    \ именно за это меня зовут вздорным и желчным, хотя никогда я не говорил, что\
    \ Кеб - плохой музыкант...\n\nЛадно, вот вам мнение AMG о его новом альбоме: \n\
    \nReview by Steve Leggett\n\nBeing labeled and marketed as a blues musician was\
    \ never really a good fit for Keb' Mo'. True, he first came to the attention of\
    \ most when he came out of Compton playing Robert Johnson songs on a National\
    \ Steel guitar, and that’s how his recording career started, but this is a guy\
    \ who used to be a staff songwriter for A&M Records, so he has always had plenty\
    \ of pop, soul, R&B, and jazz in his kit bag and, truth be known, he’s really\
    \ closer to an artist like James Taylor than he is to Howlin’ Wolf. His new album,\
    \ The Reflection, the first on his own Yolabelle record imprint (he also self-produced\
    \ the album) after several releases with Sony, has nothing on it that could be\
    \ called blues, and nothing that even really comes close. и т.д. http://allmusic.com/album/the-reflection-r2205820/review\n\
    \nКлассный альбом - ласкает слух. Прекрасная музыка для фона!"
