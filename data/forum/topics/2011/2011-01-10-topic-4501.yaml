  subject: Концерты на блюз-ру
  deleted: false
  text: 'Уважаемый Федор,


    Раньше список текущих концертов на сайте был более компактным и включал блюзовые гиги или, по крайней мере, включал программу
    клубов, где блюз исполняют время от времени. Теперь он необъятен. Каждая "пятница-суббота" включает объявления о концертах
    широкого спектра исполнителей в жанрах, далеких от основной темы блюз-ру, и отыскать там блюзовые группы трудно. Возможно,
    это делается по обмену с другими сайтами и с благой целью "привлечь внимание". Но, мне кажется, такая перемена растворяет
    и отвлекает больше, чем может принести пользы.'
  replies:
  - id: 37270
    parent_id: 37266
    date: 2011-01-11 20:45
    poster: Федор Романенко
    subject: Блюзовые конценты
    deleted: false
    text: 'В блюзовом расписании показываются концерты групп, которые помечены, как играющие "блюз", или сборные концерты,
      которые помечены как "блюз". Также по историческим причинам там есть отдельные группы, которые играют в блюзовых клубах,
      типа 26Hz


      В правой колонке на первой странице - реклама клубов, там могут быть любые концерты.


      Еще сегодня некорректно самоидентифицировалась как блюз группа Helsinki Cowboys. Возможно, что они создали такое впечатление...


      Кто еще лишний в блюзовом расписании вот тут?


      http://www.blues.ru/gigs/'
