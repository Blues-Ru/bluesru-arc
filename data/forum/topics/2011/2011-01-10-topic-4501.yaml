    text: 'Доброе время суток!


      "Еще сегодня некорректно самоидентифицировалась как блюз группа Helsinki Cowboys. Возможно, что они создали такое впечатление..."


      Группа играющая ритм-н-блюз,рок-н-ролл и рок, видимо никак не "вписывается" в Ваши понятия о "рафинированном блюзе".
