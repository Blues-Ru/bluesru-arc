      subject: Ритм-н-блюз
      deleted: false
      text: "Дмитрий! \n\nЕсть много очень хороших групп, которые играют музыку разных стилей. Есть несколько сайтов про разные\
        \ жанры - jazz.ru, ska.ru и т.д. Люди, которые целенаправленно занимаются блюзом, и здесь таких очень много, хорошо\
        \ понимают разницу между жанрами джаз, блюз, рок, рок-н-ролл, ритм-н-блюз 50-х, современный рнб, несмотря на то, что\
        \ эти жанры друг друга обогащают и в них играют иногда одни и те же музыканты. \n\nКогда появляется информация о музыкантах,\
        \ которых нельзя назвать блюзовыми, посетители начинают возмущаться. Поэтому мы стараемся рассказывать не обо всем\
        \ на свете на конкретном сайте, и придерживаемся узкой тематики, про которую больше знаем и понимаем.\n\nДело не в\
        \ рафинированности, а в том, может музыковед назвать какую-то музыку блюзом или нет?"
