    Что такое Cigar Box Guitar?


    стория таких гитар весьма интересна. До 1840-х годов сигары перевозили в корзинах,
    а вот после половины позапрошлого века стали делать специальные ящики для сигар.


    В 19 веке сигары были очень популярны, и во многих домах скапливалось огромное
    количество сигарных ящиков. немудрено, что однажды взгляды музыкальных дел мастеров
    упали на эти коробки.


    Самым ранним свидетельством того, что из сигарных коробок стали делать музыкальные
    инструменты можно считать гравюру времен гражданской войны в США, на которой два
    солдата в лагере играют на скрипке, сделанной из такого сигарного ящика.


    Даже самые первые инструменты, сделанные из ящиков для сигар, были очень качественны
    и в Национальном Музее Гитар (США) есть две гитары из сигарных ящиков, сделанные
    в 1986 и 1989 годах.


    Они искусно сработаны и до сих пор не утеряли своего звука. Подобные гитары и
    банджо использовались и используются в блюзовых композициях.


    Также эти инструменты очень быстро получили популярность среди черного населения
    америки и стали почти что "национальным" музыкальным инструментом.


    Бокс гитары и скрипки, имеют важное значение в блюзе . Поскольку большинство исполнителей
    были афромериканцы, живущие в бедности, многие не могли позволить себе "настоящей"
    бас гитары. Используя эти, вместе бас, и губная гармоника вливалась в отличные
    исполнения с бокс гитарами, "черный" блюз музыканты выступали в socializations.


    В последние годы американцы возродили Cigar Box гитары, совершив очередную гитарную
    революцию и напомнив всем нам о корнях блюза!'
