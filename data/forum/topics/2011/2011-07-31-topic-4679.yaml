  text: '3-х струнная Cigar Box гитара, ручная работа, оригинальный дизайн.


    Гриф - канадская берёза, накладка - палисандр, корпус - никарагуанский кедр, ручки
    громкости и тембра - кедр, палисандр.

    Электроника - контактный пьезозвукосниматель, установленный в корпусе под нижним
    порожком.


    _____________________________________________________


    Cigar Box Amp "Magnum 46" - ручная работа, оригинальный дизайн.


    Его легко носить с собой, надолго хватает батарейки, прекрасно вписывается в любой
    интерьер, привлекает внимание зрителей.


    Корпус - коробка от кубинских сигар.


    Мощность 10 ватт, вход - джек, питание 9 вольт (батарейка)


    Вес 300 гр.


    Звучание блюзовое - мягкое, матовое, на максимальной громкости - перегруженное.


    Идеально подходит для губной гармоники и Сigar Box гитары, красиво смотрится в
    домашней обстановке.

