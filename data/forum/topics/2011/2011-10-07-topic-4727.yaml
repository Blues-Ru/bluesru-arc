  text: "<i>РосБизнесКонсалтинг сообщает:</i>\n\n\"В лучах блюза\n \n13 октября в баре \"Луч\" в рамках мирового тура дадут концерт легендарные \"Братья Блюз\" - The Original Blues Brothers Band. Тур приурочен к 30-летию выхода в свет музыкальной комедии \"Братья Блюз\" при участии таких звезд, как Рей Чарльз и Джеймс Браун, Арета Франклин и Джон Ли Хукер. Успех фильма принес славу музыкантам коллектива. Альбом группы \"Briefcase Full of Blues\" был продан в США тиражом более 3,5 миллиона экземпляров. В настоящее время это самый востребованный блюзовый проект в мире. Гастроли в Японии, Германии, Швеции, Италии, Франции и т.д. У них миссия - они посланники блюза! \n\nНеизменный драйв и чувство юмора - это фирменный стиль солистов The Original Blues Brothers Band.\n\nBOBBY HARDEN - вокальная сенсация Нью-Йорка, самый душевный вокалист Манхэттена и солист The Original Blues Brothers Band. Потрясающий голос, напор и обаяние - эти факторы не оставят равнодушным ни одного слушателя!\n\nANTHONY \"RUSTY\" CLOUD - легендарный пианист и клавишник The Original Blues Brothers Band. Много лет он является одним из музыкальных и креативных руководителей проекта. Тонкие насыщенные аранжировки и виртуозные блюзовые соло - это его фирменный стиль. В разное время он выступал с Southside Johnny, Gary US Bonds, Bo Diddley и т.д.\n\nERIC UDEL - сердце и главный двигатель коллектива. Его бас-гитара мощно и упруго поддерживает любые музыкальные проявления музыкантов группы. Работа с такими звездами, как John Scofield, Mike Clark, Bill Evans и т.д., - лучшее тому подтверждение.\nЯркое созвездие музыкантов - феерическое блюзовое, соул-фанк-шоу в уникальном стиле \"Братьев Блюз\"!\n\n07.10.2011 13:38:00 \n\n\n\n<i>оригинал здесь:</i> http://style.rbc.ru/events/2011/10/07/161719.shtml"
