      text: 'ссылка, которую я дал на амазон, как раз на книгу гордона и ведет. Книги
        Р.Палмера, sandra tooze (c предисловием Клэптона), robert santelli и справочники
        всяческие - говорят: 1915. а Alan Lomax обратно пишет: 1913 г. Естественно,
        истину знаю только Я! но никому не скажу...


        и что теперь? обосраться и не праздновать ДР Мадди? на фиг вам так принципиальна
        эта разница в два года? он менее гениален, что где-то соврал про год рождения?
        Лично мне хватает вполне 1915-го года - не знаю, как там союз музыкантов начислял
        ему пенсию, но все его коллеги по Chess считали, что родился он в 1915-м,
        а уж они-то точно лично отмечали с Мадди его ДР. (Джон Ли Хукер вообще предоставлял
        три разных года в качестве года своего рождения).


        Кстати, полез проверять, обнаружил у главного светоча современного блюзоведения
        Р.Сантелли опечатку в его Big Book Of Blues - там <b>14<b> апреля. <i>Ара,
        это ужасно!</i>'
