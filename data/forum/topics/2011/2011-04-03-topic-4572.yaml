  text: 'в каком году родился McKinley Morganfield, если AMG и Британская Энциклопедия
    пишут, что в 1915-м, а Wikipedia - в 1913-м?

    (Вот и Евдокимов тоже считает, что в 1915)


    А Википедики пишут следующее:


    Early life


    Although in his later years Muddy usually said that he was born in Rolling Fork,
    Mississippi in 1915, he was actually born at Jug''s Corner in neighboring Issaquena
    County, Mississippi in 1913. Recent research has uncovered documentation showing
    that in the 1930s and 1940s he reported his birth year as 1913 on both his marriage
    license and musicians'' union card. He did this to appear younger for recording
    companies.'
