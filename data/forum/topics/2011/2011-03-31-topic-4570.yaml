  text: "31 марта с 16.00 до 17.00 в эфире радио \"Серебряный Дождь в Барнауле\" на частоте 106,4 FM состоится \"живой\" концерт Ансамбля джазовой песни \"Леди Блюз\". \n\n\"Леди Блюз\" - вокальный коллектив, состоящий из пяти прекрасных девушек. Руководит ансамблем эстрадно-джазовой песни АлтГПА заслуженный деятель Всероссийского музыкального общества Владимир Круппа. Девушки исполнят в прямом эфире джазовые и блюзовые композиции. Партии эксклюзивны, записаны лично Владимиром Николаевичем. \n\n Вопросы задавайте по телефонам 65-81-05, 08-125, 00-22. Видео трансляция http://altapress.ru/live/#silverrain"
