      subject: Хорошо, что разобрались, однако
      deleted: true
      text: 'На мой взгляд, в этой ситуации есть две большие проблемы:


        - Боря не проговорил достаточно четко договоренности перед началом тура. И с Женей, и с Джимми. Это - важная часть
        организации. За деньги должен отвечать один человек, все остальные договариваться только с ним. Все возникшие проблемы
        нужно решать с этим человеком. Если ответственный Боря и он просит, чтобы Женя передал Джимми какие-то деньги, он
        должен четко описать алгоритм, кто, кому, когда и сколько. После этого проконтролировать. Иначе - это организационный
        факап.


        - Женя, как только возникают малейшие сомнения в том, что деньги перетекают правильно, у кого-либо, или что он не
        выполняет какие-то денежные договоренности, должен был сразу переговорить со всеми, потратить на это много времени.
        Ситуации, когда кто-то не может дозвониться, или один оставляет другого в непонятках, в таком щепетильном вопросе
        нужно полностью исключить.


        - Боре лучше было бы разобраться напрямую с участниками, потратив на это много времени, потом выносить на суд общественности.'
