  text: "Сегодня в выставочном зале Государственного музея изобразительных искусств Республики Татарстан широкой общественности была представлена уникальная выставка «Джинсы как культ». \n\nУзнав о выставке в Казани, лидер группы «Машина времени» Андрей Макаревич передал свои джинсы в дар музею. Это именно те штаны, в которых он записывался на легендарной «битловской» студии Abbey Road в Лондоне. Начинание поддержали и коллеги по цеху: Игорь Сукачёв, Вячеслав Бутусов, Чиж, Сергей Шнуров, Игорь Бутман, Сергей Минаев, Анжелика Варум, Группа «Ляпис Трубецкой», группа «Сплин», Александр Розенбаум, Даниил Крамер и многие другие. Их любимые джинсы, как произведения искусства, красуются за стеклом, по соседству с виниловыми дисками и старинными проигрывателями.\n\nЗавершилось мероприятие февральской «Блюзовой конференцией», в рамках которой для публики выступили известные казанские музыкальные группы.\n\nhttp://www.russkiymir.ru/russkiymir/ru/news/ruregions/news2840.html"
