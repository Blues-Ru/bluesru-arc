  text: "Павел Бабушкин, вокалист группы \"Т.о.ч.к.а.\" рассказал о ближайших творческих планах: \n\n\"На нашей летней пластинке будет одиннадцать или двенадцать треков, записанных нашими скромными силами и силами приглашенных музыкантов из дружественных ансамблей из Екатеринбурга и других городов. Это очень необычная, и как нам кажется, интересная работа. Под одной обложкой мы соберем все актуальные на сегодня жанры музыки - от рока и попсы (в хорошем смысле этого слова) до рэпа и танцевальной электронщины. Кроме того, к этим одиннадцати трекам мы постараемся снять максимальное количество видео. Сейчас в разной степени разработки пять клипов к этой нашей летней пластинке. Если после этого мы не проснемся звездами, значит все - разучим блюзовые квадраты и будем играть по кабакам грустные песни о неразделенной любви\". \n\nПожелаем ребятам удачи, ну не мучиться же им с блюзовыми квадратами!\n\nhttp://www.e1.ru/news/spool/news_id-344930.html"
