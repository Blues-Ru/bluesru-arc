  text: "http://www.vlg.rodgor.ru/news/muzyka/12953/\n\nПо просьбе Дмитрия Медведева Мэри Уилсон посетит Волгоград \n\n\n\
    Легендарная звезда ритм-энд-блюза, диско- и поп-музыки, знаменитая солистка самой известной женской соул-группы THE SUPREMES\
    \ Мэри Уилсон впервые посетит Волгоград.  \n\nСвоим визитом знаменитая американская исполнительница откроет новую для\
    \ Волгограда серию концертных программ «Истории успеха», в рамках которой известные исполнители – гости нашего города\
    \ будут делиться своей личной историей успеха с молодыми волгоградцами, проводить мастер-классы с начинающими исполнителями,\
    \ для которых с этой встречи начнется уже их История Успеха. \n\n– Гастрольный тур певицы по городам России пройдет в\
    \ рамках программы культурного сотрудничества, подписанной Президентами России и США Дмитрием Медведевым и Бараком Обамой,\
    \ – рассказывают в Государственном автономном учреждении культуры Волгоградской области «Агентство культурных инициатив».\
    \ – Миссия Мэри Уилсон – способствовать развитию культурного сотрудничества между Россией и США, внося свой вклад в дело\
    \ взаимопонимания между нашими народами.\n\nМероприятие пройдет 27 января в 15.00 в актовом зале Волгоградской государственной\
    \ сельскохозяйственной академии. Цена билета 100 рублей.  \n\n<i>Цена радует, место и время удивляют, масштаб президентской\
    \ культурной программы обескураживает, ИМХО.</i>"
