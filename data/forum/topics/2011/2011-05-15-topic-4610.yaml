  text: 'Звуки.Ру сообщает, что "легендарный "летучий состав" Fleetwood Mac воссоединится в 2012 году": http://www.zvuki.ru/R/P/25363/


    Правда, для меня лично "легендарный" состав - этот тот, что с Питером Грином. А состав Джон МакВи (John McVie), Стиви
    Никс (Stevie Nicks), Мик Флитвуд (Mick Fleetwood), Линдси Бэкингем (Lindsey Buckingham) и Кристина МакВи (Christine McVie)
    трудно назвать "летучим", наоборот, в долгой истории именно этот "англо-американский" состав просуществовал дольше всего.
    А в остальном, это приятная новость, пусть ребятишки тряхнут стариной!'
