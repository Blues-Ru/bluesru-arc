    text: '> Завершился Месяц афро-американской истории большим концертом...

      Американский актер <a href="http://willpower.tv/">Уильям Пауэр</a> прибудет с визитом в Туркменистане с 22 по 25 февраля. В ходе своего визита он проведет ряд презентаций в школах городов Туркменбаши и Ашхабад, а также выступит с открытым концертом в Ашхабаде. Эти мероприятия проводятся Посольством США в рамках празднования <a href="http://en.wikipedia.org/wiki/Black_History_Month">Месяца афро-американской истории</a> при содействии Министерства культуры и телерадиовещания Туркменистана.

      Уильям Пауэр будет главным исполнителем концертной программы в Ашхабаде, которая состоится в четверг, 24 февраля 2011 г. в 19:00 в киноконцертном зале «Туркменистан». Концерт бесплатный и открыт для всех.'
