  text: 'Жители Туркменистана познакомились с афро-американской культурой

    26.02.2011 17:33


    АШХАБАД, 26 февраля - ИП "ТУРКМЕНинформ". В Ашхабаде прошли мероприятия, посвященные Месяцу афро-американской истории. В рамках культурной акции в столице и велаятских центрах состоялись показы художественных и мультипликационных фильмов, в учебных заведениях страны были проведены познавательные встречи, рассказывающие о роли афроамериканцев в развитии истории США, известных борцах за права чернокожих – политиках, писателях, музыкантах, а также об особенностях афро-американской культуры.


    Завершился Месяц афро-американской истории большим концертом в киноконцертном зале "Туркменистан" с участием американских и туркменских музыкантов. В программу концерта вошли произведения в жанре блюз, соул и хип-хоп.


    http://www.turkmeninform.com/ru/news/20110226/03886.html'
