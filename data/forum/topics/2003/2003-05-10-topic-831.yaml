  text: '...вышла за пределы разумного. Никак, здешняя общественность решила, что СТНК действительно вознамерился подключить
    к делу братков? Так это бред полнейший, в реальном бизнесе разборки начинаются при суммах в несколько косарей зелени,
    а тут - любительский некоммерческий сайт. Или есть основания полагать, что Тынку - маньяк? Тогда и отдайте ему домен обратно,
    как здесь в одном из тредов сказал Jozef. Разве стоит домен такого риска?


    Да позволит мне Андрей Цыганков задать пару вопросов. Вот тут из уст Андрея прозвучала фраза, что происшедшее стоит воспринимать
    как конфликт между двумя субъектами бизнеса. Вот и первый вопрос - а можно ли деятельность владельцев bluesman.ru в рамках
    этого сайта назвать бизнесом? Другими словами, приносит ли этот сайт своим владельцам прибыль, и если да, то насколько
    большую роль в жизни владельцев сайта сия прибыль играет?


    И второй вопрос. Если уж говорить о бизнесе серьезно, то насколько увеличилась прибыль, получаемая с сайта после захвата
    домена bluesmen.ru? Оправдывает ли это увеличение прибыли издержки и риски, связанные с проектом, т. е. затраты на охрану
    и риск стать объектом физической расправы?


    И вот, уважаемые господа, с нетерпением жду ответа от гр. Цыганкова. Если все сказанное мной выше не окажется словоблудием,
    если Цыганков действительно все вышеуказанные нюансы учел, если сайт bluesman.ru - серьезный бизнес, и захват дополнительного
    домена позволил увеличить прибыль от этого бизнеса настолько серьезно, что на издержки и риски можно наплевать, то тогда
    - мои респект и уважение к Цыганкову.


    А в противном же случае придется признать, что Цыганков - по крайней мере не меньший маньяк, чем Тынку. Потому как в этом
    случае слова о "бизнесе" в рамках сайта bluesman.ru являются одним из проявлений паранойи. Возомнил человек себя большим
