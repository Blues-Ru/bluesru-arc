          по остаточному принципу. Я с ним помыкался и прекратил. Кстати, в последующих встречах с Санчилло и Якубом я объяснил
          свою позицию, и, по-видимому, они её поняли, потому что с тех пор мы с ними в нормальных отношениях.

          Для тех, кто не в курсе - сообщаю, что действительно перечисленные господа работали на меня в 96-07 году в меру
          своих сил и способностей за весьма символические оклады, которые я мог позволить в рамках весьма скудного бюджета,
          а вся сумма претензий сводится к невыплаченным однажды 50 долларам по причине того, что компания, где я тогда работал,
          прекратила финансирование проекта ввиду его полной коммерческой бесперспективности. Ну и бог с ним. И чего я, в
          самом деле оправдываюсь? У кого в жизни не было неудачного проекта, покажите мне этого умного человека, я у него
