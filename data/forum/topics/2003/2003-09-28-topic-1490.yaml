        text: "Джеймс, то и получил..\nУ Эллиса ведь тоже концертный альбом, но там всего один саксофон - Pee Wee Ellis, один тромбон - Fred Wesley.. К чему такой табун с бесчувственными дудками, как у Брауна в Доме Блюза? Они теряются, тонут друг в друге, и получаются приглаженными, без шороховатостей.. Шоу это малость несуразное - оно существует на сцене как-то параллельно с Джеймсом.. Видимо, поэтому так часто звучали слова sex machine, как заклинание, так как сам в это уже не очень-то и верит.. да американские флаги за каким-то бесом..\nА у Эллиса Мужчины (с большой буквы) поют, с сочным вокалом, - особенно улетно звучит Pass The Peas, Cold Sweat. На клавишах не кто иной, как Джимми Смит, опять же.. \nА Джеймс, к великому сожалению, превратился в свою собственную мумию.. \nи гитарист этот белый - вот зачем он там соляки выдавал, с какой целью.."
