  text: "на самом деле, год болюза это-же тема, и это повод собрать лучший народ,\
    \ поиграть блюз (и послушать) ... я обожаю блюз, слушаю его, чуть ли не с детства,\
    \ меня друзья заразили, теперь я без него никуда.\nМы с друзьями организованли\
    \ сайтик www.yearoftheblues.ru - это место где можно собраться всем ... Мы примем\
    \ любые предложения и вынесим их на обсуждение. У нас нет опыта сбора тусовок,\
    \ джемов, концертов, называйте это как хотите, но тема одна - если есть повод\
    \ \"Год Блюза\", то почему-бы и не собраться. Призываю к активному участию и blues.ru\
    \ \nЗдесь нет никакой коммерческой основы, хочется блюза, и нет денег что-бы организовать\
    \ подобное мероприятие (типа фестиваля блюза в честь Года Блюза), так давайте\
    \ соберемся и организуем вмете. Вы тут все сидите и жалуетесь на клуб Би Би Кинг,\
    \ пора действовать самим, ну сделайте же сами что-нибудь, кстати по этому поводу\
    \ есть задумки :)"
