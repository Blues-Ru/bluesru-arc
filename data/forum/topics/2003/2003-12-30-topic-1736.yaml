      text: 'Интересует именно Сан Рекордз начала 50х, все, что предшествовало рокабилли. Как бы записей кантри, хиллбилли
        и вестерн свинга в Питере - попой ешь :), а вот мемфисского блуза почти ни у кого (по крайней мере, из рокадебилов)
        нет. А ведь в сановском рокабилли блуза процентов 30-то уж точно есть. Вот слышал недавно несколько вещей - Shout
        Sister Shout Артура Крадапа, Mistery Train Джуниор Паркера, Baby Let''s Play House Артура Гантера - очень интересно,
        в сравнении с рокабилльными версиями.


        Вот еще Михаилу Бирюкову спасибо за ссылки на статью про Сэма Филлипса, которые он кинул в своем БЛОГе. Статья дополнительно
        подогрела интерес. Так что, повторюсь, если кто-либо готов поделиться со мной старыми мемфисскими записями в обмен
        на какие-либо бонусы с моей стороны - буду оч признателен.'
