    text: 'Я не совсем в тему, не знаете ли вы, что звучит в рекламе про извините памперсы. Где семья еде в машине, а за окном
      льет дождь

      и по вынужденым объективным причинам, покидают машину и промокают.

      В заключении говорится "Кажется нашему малышу повезло больше"

      Там поет своеобразная певица, что то про дождь.

      Еще раз извините.'
