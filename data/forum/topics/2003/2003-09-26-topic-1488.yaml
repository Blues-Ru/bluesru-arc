  text: "Не подскажите что за это за песня. В ней есть такие слова (по крайней мере, то что (и как) я это расслышал):\nTogether\
    \ we can make it\nA message friend to friend\nWe can take it step by step\nBut it's gone __________\n Show me your (colours)\n\
    Эта песня крутится по телику в рекламном ролике Oriflame (3 девушки).\nКто её поёт? Что за соул певица?\nВидел ту рекламу\
    \ всего пару раз, но цепанула  меня мелодия. Хочу её найти."
