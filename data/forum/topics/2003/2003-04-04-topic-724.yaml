        text: "Мне Таня Михеева очень понравилась. Было мало. Но влепила на таких верхах... Блок Аграновского вообще, весь\
          \ получился, хотелось еще. \nПо поводу Ломидзе - сплошные понты. А Вот Боря Булкин, вышел как есть, и совершенно\
          \ не понтуя и не парясь сыграл как настоящий блюзмен. Но, к чести Ломидзе должен сказать - очень четко он отошел\
          \ в сторону когда это было нужно.\nА вообще - хорошо. Я еще после 4 гармонистов подумал, что фанаты Чистякова послушав\
          \ Данилина может отойдут от своего мнения, что Федор лучший гармонист мира. (на трио Гальяно они точно не пойдут)\n\
          К сожалению -было очень мало времени на отстройку зала. В первый день - менее часа (а на ЦДХ надо не менее четырех),\
          \ сауд чека не было в принципе в такой ситуации. Во второй - почти два часа, и это есс-но сказалось. Правда такой\
          \ загадочный инструмент как ДОБРО, я увидел впервые только на сцене, и гудело от него как от дизельной электростанции\
          \ (какие-нибудь самопальные звукосниматели)\nА так - два комба сгорели на сцене, дри директ бокса, один из гитаристов\
          \ вместо акустической гитары включил что-то совсем невразумительное что только трещало и пердело в линию, а придя\
          \ домой после первого дня я не мог заставить себя поднятся на пятый этаж, не хватало мотивации. Райдеры мне читали\
          \ по мобильному телефону за 40 минут до начала концерта. Хороший был фест"
