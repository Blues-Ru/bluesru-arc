    subject: Сугубо личное мнение о первом дне
    deleted: false
    text: 'Самое большое удивление - полный зал ЦДХ и много случайной, неблюзовой публики. Даже не знаю, хорошо это или плохо?


      Самое сильное впечатление первого дня - вокал саксофониста новой группы Петровича. Кажется, его зовут Александр Бородин.
      Тембр голоса, как у Джона Фогерти, но сам голос будет помощнее. Жаль, что ему дали спеть только одну песню. Уверен,
      что о нем мы все уже очень скоро услышим.


      Самое большое разочарование - Воронов. Все еще фактурный, красивый, вальяжный, но уж слишком торчит на себе, на своем
      прикиде и пр. Очень много понтов. Два пальца правой руки держат дымящуюся сигарету, другие два - медиатор. Прибавьте
      к этому невнятный конферанс. В результате содержание, то есть собственно музыка, отходит куда-то на второй план. Зачем
      Воронов вызвал на сцену Гию Дзагнидзе - тоже непонятно, ибо соревнования или дуэта гитаристов не получилось. Звук у
      Воронова был ужасен: все забивал бас (кстати, весьма примитивный). Единственное светлое место выступления Воронова -
      блюзовая певица Инесса (или Инес?). Жаль, что ей дали спеть только одну песню. Умеет управлять голосом. Чувствуется,
      что где-то этому училась.


      Пера Джо - очень чистый звук гармошки. Концерт покинул на машине с американскими номерами.


      Андрей Козловский из Вологды - нечто среднее между Чижом и Шаовым. Может быть, сегодня вместе с "Грассмейстером" будет
      выглядеть интереснее.


      Федя "Ноль" Чистяков без баяна, как здесь уже написали, это нонсенс. Хотя он все равно хороший шоумен в стиле перформансов
      Чекасина.


      Грозненско-таллинский армянин Манукян очень хорош, когда его слышишь (и видишь) впервые. А на самом деле его инструментальные
      и вокальные приемы очень однообразны, утомительны и быстро приедаются. Было смешно наблюдать, как ведущий концерт Вова
      Кожекин, сняв с себя куртку и три(!) свитера, характерными жестами сгонял увлекшегося джазовым скэтом Сережу со сцены.


      Питерцу Селюнину с его песнями про пузыри и бухло я бы порекомендовал обратиться к логопеду: во рту у этого автора-исполнителя
      - сплошная каша, так что обсуждать его творчество пока преждевременно.


      Организаторы фестиваля порадовали отличным бесплатным компактом "Я не увижу Миссисипи".


      Сегодня пойти на концерт не смогу, так что прошу поделиться впечатлениями о втором дне фестиваля. И еще: мечтаю сводить
      своих малолетних детей на Чижа. Кто-нибудь в курсе, когда он будет выступать в Москве на концертной площадке (не в клубе)?
      Дайте знать на мыло.'
