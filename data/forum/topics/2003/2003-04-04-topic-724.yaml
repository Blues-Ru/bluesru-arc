    text: 'После окончания фестиваля я решил дать чувствам отстояться. Теперь, наверное, можно высказать свое мнение.

      Первый день больше огорчил, чем наоборот.

      Я не берусь даже говорить о выступлениях людей, ничего не имеющих общего с блюзом. Жалко, что не дали в первый день
      поиграть Пера Джо. Но он дал гвоздя в Вудстоке вечером и на второй день. Хотя, на мой взгляд - просто блюзовые стандартные
      ходы. Почему не даи поиграть Гие? Почему в оба дня скомканные выступления заключительных групп (и самых звезных)?

      Звук в первый день хуже, чем во второй - вот вам и испочненные впечатления.

      Во второй день Доктор Аграновский, Юрий Каверкин - БРАВО!!!!!!

      Ломидзе, которому просто не дали поиграть, играл действительно ДЖЕМ с вышедшими с ним музыкантами, а не тянул одеяло
      на себя дорогого-любимого.

      Любимые Кроссроудз... просто халтура,  так жалко ;(((

      А что никто не упомянул Садикова? Вот уж кто сыграл и с драйвом и с хорошим аккустическим звуком.'
