      text: "транзисторный фендер - это комбик придуманный чтобы играть музыку и его\
        \ звук на свои деньги является конечным продуктом, который даже и записать\
        \ можно, а ерасов это содранные поделки. дешевизна за несоблюдении технологии.\
        \ ламповый там не звук, а призвук.\nпомоему это полная лажа для человека который\
        \  хочет заниматься музыкой. лучше купить транзисторный фендер, а потом уже\
        \ купить чегонить серъезное. когда созреет. но не пользоваться поделками -\
        \ это очень важно :) \n\nи вообще зная чтотот ДедМорозз любит тогоже Ронни\
        \ Ерла сильно - без ревера ему будет грустно :)"
