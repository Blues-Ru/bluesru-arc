        text: '...я далеко не новичок в музыкальных делах, и у меня есть хорошая пара
          ушей :) Я имел возможность сравнить Ерасовы с другими комбами, относящимися
          к категории "чегонить серъезное", сравнить именно по звуку, а не по "соблюдению
          технологии". И вот они оказались не хуже. А сравнивать Ерасова с Фронтменом
          даже вообще глупо, уж настолько Фронтмен далеко позади... Поверь, я много
          играл именно через Фронтмен, и после первого же общения с Ерасовым понял,
          что Фронтмен пора в утиль :) Что и сделал, и щас собираюсь приобрести именно
          что-нить ерасовское.


          А что касается ревера, то тут конечно на вкус на цвет... Но вот если говорить
          о блузе, то ИМХО больше блуза сыграно без ревера, чем с ревером. Вот с утра
          слушал Хаулин Вулфа, так как раз обратил внимание на отсутствие ревера.
          Та же фигня у Би Би, щас вот в моем сидюшнике крутится одноименный названию
          твоей команды диск Бадди Гая - там тоже ревера особого не слышно... Так
          что ревер для блюза имеет гораздо меньшее значение, чем, скажем, для серфа
          :)


          Вдобавок ко всему ревер развращает. Я долгое время играл с ревером, и каждый
          раз, когда ситуация вынуждала им не пользоваться, оказывался не на высоте.
          Щас у меня агрегат без ревера, и мне долго пришлось к этому привыкать, оказывается,
          за звукоизвлечением-то следить надо внимательнее :) Зато в итоге стал играть
          гораздо чище...'
