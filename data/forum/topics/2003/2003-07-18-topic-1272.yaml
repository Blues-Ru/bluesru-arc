    subject: А соседи...
    deleted: false
    text: 'не мешают? Я вот свой комб на базу отвёз. Дома "на возбуде" всеравно не
      поиграешь. Я приобрёл карманный Marshall за 1500 р и недорогие наушники Newman
      за 450 р в Ямахе и очень доволен этим приобретением.

      А если ты собираешься работать с кассетами то лучше приобрести Ibanes

      от 100 до 150$ гитарный плейер. В нем очень красивый дисторшн и хорус, а так
      же регулировка скорости воспроизведения, что избавляет от перестройки гитары
      под запись. Я, правда, для этих целей использую диктофон, потому на него можно
      писать ритм и потом отрабатывать приёмы соло. А если ты всетаки хочешь взять
      комбо, то нужно брать лампу. Альтернатива курит в буфете особенно в блюзе

      Я бы тебе советовал Fender Junior или Laney  200$ на руках, 300-350$

      в магазине.'
