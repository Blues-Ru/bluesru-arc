        deleted: false
        text: "\"боло\"? :)\n Сам галстук может быть сделан из плетенного кожаного или матерчатого шнурка и соединен пряжкой. Ее разновидности имеют сотни вариантов инкрустаций в виде лошадей, шляп, птиц или просто зигзагов, в точности повторяющих рисунок банданы. Происхождение боло скорее всего связано с шнурком, на концах которого располагались два груза для того, чтобы можно было, бросив его, поймать страуса. Впрочем, остается неясным, по какой именно причине боло вдруг перебралось со страусиных ног на ковбойскую шею. \nhttp://westerns.agava.ru/cgi-bin/go.cgi?dir=lib&subject=pressa&parent=index&topic=mus_style"
