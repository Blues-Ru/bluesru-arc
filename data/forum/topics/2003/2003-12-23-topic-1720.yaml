  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDSUB040312222201360122&sql=A8z8j1vgjzzca\n\nЭто один из самых ранних альбомов Хукера на Chess Records; он состоит из ранних записей Джона. Тут 12 треков, 6 из них записаны в 1951, а другая половина в 1952 году. \n\nНа двух блюзах Джону помогает Эндрю Дюрэм на гитаре, а в Walkin' The Boogie и It's My Own Fault Джон записал double tracked вокал! В 1952 году дабл-трэк, это серьезный прогресс! Более того, в Walking The Boogie записана гитара с двойной скоростью (speeded up guitar)! Чудеса, да и только! Боб Турман или Берни Бесман (никто точно не помнит) играет на пианино в It's My Own Fault. Women And Money записана с (может быть, опять никто толком не помнит) Бобом Турманом на пианино, Эдди Кирклэндом на гитаре и Томом Уайтхэдом на ударных.\n\nХорошие блюзы раннего Джона, записанные с разным качеством и громкостью. Хотелось бы услышать их в хорошем качестве, но это уже невозможно. Оценка 4 балла. Тут есть очень серьезные треки типа Walkin The Boogie и Sugar Mama, но есть и несколько проходных блюзов. Альбом доставит немало радости любителям вокала Хукера."
