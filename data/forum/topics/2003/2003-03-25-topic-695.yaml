      text: "(опять я тудаже) :))\n\nБелинов попытался создать профсоюз блюзовых музыкантов,\
        \ чтобы байкотировать клубы именно по подобным и схожим поводам... идея богатая.\
        \ Но разумеется гибельная, потому что при таком количестве \nбезприницпиальных\
        \ и \"голодных\" музыкантов она с треском провалиться.\n\nТекст их будет гдето\
        \ такой:\n\"Понимаешь есть музыка, блюз, атмосфера клуба, а мне надо детей\
        \ кормить, которые вырастут и им надо будет жить в реальном мире, а не ко\
        \ всей этой шизофренической байде выдуманных абстракций. А я кроме как держать\
        \ в руках инструмент больше ничего не умею\".\n\nИ пока публика и клубы воспринимает\
        \ \"держание в руках инструментов\",\nв качестве музыки, то ситуация не изменится\
        \ ни при каких  обстоятельствах.\n\nТут есть еще один смешной момент, наш\
        \ человек часто имеющий в голове неосознанный темный чердак абстрактного мышления,\
        \ имеет возможность инсценировать на этом чердаке исполнение музыки, в тот\
        \ же момент когда просто \"держит в руках инструмент\". А публика, находящаяся\
        \ под воздействием схожих веществ, также часто готова впасть в состояние симуляции\
        \ прослушивания музыки. \nПроисходит так что, что одни представляют себе что\
        \ играют, другие представляют себе, что якобы слушают. Единственное находящееся\
        \ между ними - это \"держание в руках инструментов\", представляющее собой\
        \ нечто максимально абстрактое - верхушки музыкальных форм без содержания.\
        \ По простому - слабо снятые гармонии мелодии ритмы, вырожденные и сделанные\
        \ без понимания оригиналов. Собственно зачем нужно понимание и умение, если\
        \ нирвана быстро наступает  с чердака,\nбез черезмерного старания.\n\nДанная\
        \ абстрактность связи между \"исполнителем\" и \"слушателем\" дает \nпоразительные\
        \ результаты - Испольнителю не надо угадывать глубокие потребности слушателя,\
        \ а слушателю наплевать на самовырожение исполнителя - ибо он сам посебе,\
        \ под воздейвием легкого стимулируещго ассоцииации действа, самовыразиться\
        \ по полной программе.\n\nА в реальности получается что не важно, что исполняется\
        \ в дейвительности - блюз, метал, джаз или чтото еще, если \"слушатель\" нашел\
        \ в нем чтото свое и сам перед собой самовырозился, то цель \"исполнителя\"\
        \ достигнута.\n\nУдобность схемы в том, что она не в падает в конфликт ни\
        \ с какой реальной жизнью, так как является неосознанной и не мешает \"исполнителю\"\
        \ идти играть в непотребное место торгуясь до последнего и вообще представлять\
        \ себе денежную выгоду как главную затею предприятия. Лишь иногда оно вызывает\
        \ в человеке непонятную тоску и желание развеятся и прочуствоваться, также\
