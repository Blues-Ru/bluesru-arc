      text: "Мне в этом отношении очень понравилась система применяемая в Нью-Йоркском\
        \ \"Blue Note\". Вход в само кафе платный (до 100$как помню, в зависимости\
        \ от места) , в оплату входят гарантия посадочного места и какая-то выпивка\
        \ с закуской - далее по наполнености кошелька (никто коситься и не подумает!).Подход\
        \ к бару с улицы бесплатный, при этом видно сцену и слышно музыку... И всем\
        \ весело, все довольны. Кстати, музыку прекрасно слышно и с наружи. Стой на\
        \ улице, попивай из бутылочки укутанной в пакет и расслабляйся.... И буйных\
        \ как-то маловато было, так тихие обалдуи попросят монетку и тут-же рядом\
        \ пристраиваются музыку послушать. \nНадоело джаз слушать можно в \"Terra\
        \ Blues\" пойти, там правда вход платный и гарантий посадочных мест нет, короче\
