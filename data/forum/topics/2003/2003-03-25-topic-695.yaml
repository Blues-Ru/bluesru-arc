  text: "Вспоминая вечер, посвященный Ширяеву, и вместе со светлыми моментами (в частности,\
    \ навеянных выступлениями Козлока, Белова, Петровича, Гии, Арутюнова) не могу\
    \ отделаться от других впечатлений, навеянных Домом Блюза. Не хотел об этом писать,\
    \ и уже была такая дискуссия, но все же несколько фактов, без комментариев:\n\
    1. С Алика Микояна, видного музыканта поколения 70х, взяли 200 р. входных. \n\
    2. С водителя и директора Вайта пытались взять входные (им надо было ехать сразу\
    \ после первого сета). Еле отмазались. Денег не жалко, но это в принципе недопустимо.\n\
    3. Музыкантов с инструментами и фотокорреспондента солидного издания не хотели\
    \ пускать в клуб. По каждому случаю, чтобы не срывать достаточно важный для нас\
    \ вечер, пришлось вступать в нудные разговоры с менеджментом, объясняя, что правила\
    \ нельзя менять на ходу. Самое яркое из объяснений Джона: \"ЭТО МОЙ КАБАК\".\n\
    Репутация Би Би Кинга создавалась ряд лет усилиями многих людей. Хотите превратить\
    \ Дом Блюза в шашлычную? На здоровье. Это твой кабак, Джон."
