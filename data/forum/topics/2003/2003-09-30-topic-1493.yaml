  text: "это,по-моему,тот случай когда помочь надо. Да,Blues Cousins сами как трактор\
    \ копают,роют,прут,а главное работают-стараются дай Бог каждому,но в данном случае\
    \ без помощи друзей не обойтись. Все дело в том,что по контракту,заключенному\
    \ ими эти летом в США,нужен DVD диск о их творчестве. Концертное выступление как\
    \ часть этого DVD будет записываться в клубе Би-2 7-го октября. Седьмое это вторник\
    \ - день не очень хороший для такого ответственного мероприятия т.к народа,как\
    \ правило,мало. А поэтому если кто имеет желание и возможность поддержать в общем-то\
    \ первых НАШИХ пробившихся по-крупному туда - приходите.По-идее должны быть какие-нибудь\
    \ скидки и приятности. Флайеры тоже должны быть,смотрите по клубам. Ну вот как-то\
    \ примерно так.Да,во сколько начало не знаю.Я думаю информация еще появится.\n\
    p.s\nВ беседе ОПТИМИСТ-Леван сказал,что он уверен что у нас в России и Москве\
    \ в частности есть коллективы которые могут смело выступать там.\nГлавное не ждать\
    \ манны небесной,не соменеваться в своих способностях,любить и играть для зрителя.\
    \ В общем принцип \"ДЕЛАЙ КАК Я\",ну и конечно же совершенствоваться. Он,например,как\
    \ выяснилось,играет в день по 5-7 часов.Это ж,блин,героизм какой-то! И я отношу\
    \ это только! и исключительно! к достоинствам Левана.\nВедь давно известно известно\
    \ что талант-талантом а пахота-пахотой. \nЧестно скажу: я просто рад за этот коллектив\
    \ единомышленников (Blues Cousins +Тимур)"
