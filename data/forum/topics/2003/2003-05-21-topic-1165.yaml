  text: "... прочитал все темы про выступление Amund Maarud Band в нашем городе и понял, что московским ребятам местная публика понравилась. Так почему бы иногда, может быть раз в пару месяцев, а может и чаще, не устраивать джемы во Владимире? \nИ всем будет хорошо :)"
