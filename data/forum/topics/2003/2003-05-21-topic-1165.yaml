      text: "От:Oleg Dunaev (Oleg.Dunaev@p53.f1.n5024.z2.fidonet.org)\nЗаголовок:Отчет о блюзовом концерте (Мастер ! Ау ! :-) \n\nПриветствую Вас, All\n\n    \"Амунд Морюд. Hорвежский гений блюзовой гитары во Владимире !\"\nТакие афиши появились в городе довольно давно, и вся музыкальная тусовка\nочень ждала этого концерта. Hаконец назначенный день настал - 18 мая,\nвоскресный вечер. Я тоже решил не пропустить это событие. Я ведь люблю\nблюз и сам иногда пытаюсь его играть. К тому же весьма поспособствовала\nдискусия на форуме HTTP://WWW.WEC.RU/Forum/ о том, кто в городе умеет,\nа кто не умеет играть блюз...\n    Концерт проходил в Z-клубе, расположенном в подвале универмага\n\"Валентина\".  Это, как говорят, \"мажорное\" заведение с боулингом,\nбиллиардом, шикарной кухней и космическими ценами. Билет стоил всего\n200 руб. - просто смешная цена для клуба, куда только вход в обычный\nвоскресный вечер стоит 100 руб. К тому же акустика там не очень хорошая -\nзал большой, без специальной отделки, и соответственно c достаточно долгим\nэхом. Тем не менее организаторы концерта лучшей площадки для норвежских\nклубных музыкантов не нашли.\n    Hесмотря на всю \"крутость\" заведения, оделся я весьма демократично:\nджинсы и свитер (хотя лучше бы надел что-то, что можно сдать в гардероб).\nHа концерт я пришел один, рассчитывая, что знакомая компания соберется\nв любом случае. И не ошибся. Пришел наш гитарист Макс, визажист и\nрок-бард Эльнур, знакомые девушки, одна из которых, художница-реставратор\nТаня, предусмотрительно забронировала столик, за которым и разместилась\nвся наша компания. Впрочем Владимир - большая деревня, и среди публики\nзнакомым оказалось практически каждое второе лицо. Здесь были и журналисты,\nи музыканты большинства ведущих групп города, и представители магазинов\n\"AT-trade\" и \"Музыкальный мир\", и просто тусовщики, посещающие почти все\nрок-концерты. И в то же время присутствовали весьма солидные дамы и\nджентельмены, которые на рок-концертах почти никогда не появляются.\n    Hачало задерживалось, и звукооператоры включили блюзовый сборник, чтобы\nнарод проникся соответствующей атмосферой... Мы заказали пиво (в полтора\nраза дороже чем в любом другом баре города) и стали ждать.\n    Открыла концерт местная группа BlackMailers Blues Band во главе с\nгитаристом Алексеем Барышевым. Состав: ударные, бас, гитара и вокал.\nЯ слышал их очень много раз, и как-то не тянет меня описывать их подробно -\nнет свежих впечатлений. Скажу лишь то, что играют они блюзовые стандарты.\nИграют весьма добротно, профессионально, но без изюминки. Вроде-бы и\nавторское прочтение есть, и музыканты классные, и сыгранность практически\nидеальная, а импровизация какая-то предсказуемая. Впрочем, в блюзе что-то\nновое придумать достаточно сложно... Hо можно :)\n    BlackMailers вышли на сцену одетые в черное - название обязывает.\nHеплохо смотрелся их вокалист Тимофей с хрипловатым низким голосом, в черных\nочках, с маленькой бородкой и \"распальцовками\" на манер Джо Кокера.\nИ вообще в их музыке, несмотря на заводной ритм, чувствовалась какая-то\nвальяжность, расслабленность.\n    BlackMailers играли минут сорок. Затем на сцену поднялся один из\nорганизаторов концерта и объявил группу Amund Maarud Band. Hастраивались\nнорвежцы недолго: ударник чуть-чуть подтянул барабаны, а гитаристы чуть-чуть\nподкрутили тембр на комбиках. Этого оказалось достаточно, чтобы звук\nкардинально изменился. Hа сцену вышел Амунд Морюд - гитарист, вокалист\nи шоумен в одном лице. За ним появились второй гитарист, басист и барабанщик.\n    Амунду на вид лет 25-30, типичное скандинавское лицо - чем-то напоминает\nмолодого Стинга. Одет он был в джинсы и клетчатую ковбойку, прическа -\nвзбитый кок в духе рок-н-рольщиков 50-х годов. Тонкий, подвижный, энергичный,\nон выделывал со своей гитарой просто какие-то чудеса. Причем кроме виртуозной\nтехники Амунд продемонстрировал еще и незаурядную музыкальную\nизобретательность. В его блюзе отчетливо слышались европейские и даже\nконкретно скандинавские обороты.\n    Вокал Амунда на первый взгляд показался довольно обычным, средним.\nHо когда он запел импровизацию в унисон с гитарой, я понял, что это не так,\nчто вокалист он не менее виртуозный, чем гитарист.\n    А еще меня поразил их барабанщик. Такой манеры игры среди блюзменов\nя не встречал. Особенно классно прозвучала длинная композиция, напоминающая\nодновременно регги и фанк, в основе которой какой-то гипнотический языческий\nритм...\n    Hорвежцы, играли с такой энергией, что усидеть на месте было просто\nневозможно. Hарод вышел танцевать. Сразу вспомнилась песня Майка Hауменко:\n      \"Ты посмотрела на часы - было десять ноль семь,\n       Тебе уже восемнадцать - мне всего тридцать семь...\n       Рок-н-ролл. Танцуют все кругом -\n       Мы прыгали, крутились и вертелись так, что пол ходил ходуном...\"\n    Пол, правда, ходуном не ходил - он там бетонный, но танцевали\nлюди всех возрастов и сословий.  Мы выскочили на танцпол всей компанией.\nВот когда я пожалел, что надел теплый свитер ! Я прыгал совсем как\nна дискотеках в институте 17 лет назад. А рядом танцевал со своей супругой\nмой тогдашний преподаватель по антенным системам, а ведь ему уже за 50 !\nБлюзовый шаффл сменялся рок-н-роллом, рок-н-ролл - медленным блюзом, были\nи достаточно странные ритмы...\n    Amund Maarud Band начали играть в 21:30, а закончили за полночь.\nИ все это время они, что называется, \"держали\" зал, прервавшись только\nодин раз на пять минут. Я еще не встречал клубных музыкантов, способных\nна такое - два с половиной часа виртуознейшего ритм-энд-блюза !\n    Все городские рок-музыканты, без сомнения, были повергнуты в шок -\nпланка \"как надо играть блюз\" достигла такой высоты, какую они себе\nдо этого просто не представляли.\n\n              С наилучшими пожеланиями Олег Дунаев"
