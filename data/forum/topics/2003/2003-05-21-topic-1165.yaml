    text: "Да, Олег Д., свитер у тебя клёвый. Зелёный. Тёплый. Турецкий. Видимо с тех пор, как ты 17 лет назад на своей антенной дискотеке отплясывал, он и не менялся. Разбадяжили бы вы, Мистер, свой эпигонский слог, ну хотя бы из солидарности, в одном городе же, блин, живём. \nДа, вот ещё не совсем понял я, что вы пытаетесь играть? Блюз? Что-то на бардовскую песню похоже, да ещё на Феликса Царикати (или как там его звали) да ещё. Да ещё раз, да ещё много, много раз. По моему мероприятия такого плана устраиваются в нашем городе не так часто, чтобы являться на них с заранее негативным настроем. Старая театральная формула: \"отвергая - предлагай\". Вот такая фигня, а если не можешь, не берись. Пиво дорогое? Так это вам не кафе \"Блинчики\". Не хочешь - не пей. Заплатил за билет, и сиди - нкто слова не скажет. Не тому вы Олег Д. (Д???) свой репорт посвятили. \nС уважением, миланский мафиозо Розарио Агро"
