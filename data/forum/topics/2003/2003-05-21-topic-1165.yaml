    text: 'Народ во Владимире классный, но Макарке приходится потеть, чтобы все было здорово. Спасибо ему еще раз. Я был во Владимире два раза на концертах, оба раза мне ооооочень понравилось.

      Мне не кажется, что джем, когда собирается несколько средних музыкантов и играют еще хуже, чем обычно, потому что не договорились, - это такое действо, ради которого стоит кого-то куда-то таскать. На них бывает очень весело, но в основном благодаря приятной компании и пр. Гораздо больше удовольствия можно получить от концерта какой-нибудь одной нашей неплохой группы. Во Владимире явно были далеко не все, это и нужно исправлять, как мне кажется ;))'
