  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=CASS70307281845&sql=A996xlf0ehcqe\n\nОпять Силвертон, опять продюсер\
    \ Филд, опять хороший звук и исполнение, но где же те гениальные песни с двух предыдущих альбомов?\n\nКоко Монтойа ушел,\
    \ Бадди Уиттингтон пришел. Равноценна ли замена? Думаю что нет. На альбоме интересный чуть новый другой звук, но будто\
    \ чего-то не хватает. А может это просто сухие, профессиональные, бездуховные 90-е наступили на всех? Думаю, так оно и\
    \ есть.\n\nАльбом чуть покороче - 11 песен - 49 минут, но кажется, что он затянут. Это от того, что песни тяжелые, однообразные\
    \ и местами мутные. Тут чистой воды блюз-рок и хард-рок, от блюза мало что осталось, похоронил он и соул с фанком - плохо\
    \ это.\n\nЛучшие песни: Spinning Coin, Double Life Feeling (вот эта очень хороша!), Run (тяжелая, но очень убедительная),\
    \ Remember This (поучительная баллада). Все это очень неплохо, но тянет лишь на 4 балла. Звук все тяжелее, идей все меньше.\
    \ Я слышал и все последующие альбомы Джона, но решил, что этот последний, который я купил и оставил у себя в коллекции.\
    \ \n\nПомните песню When I'm 64? Там что-то типа Will you be near me, will you be with me when I'm 64? Так вот я не с\
    \ ним, когда ему стукнуло 64. 62 was enough."
