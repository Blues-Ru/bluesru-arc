                    person_id: 366
                  - id: 15230
                    parent_id: 15203
                    date: 2003-10-24 22:34
                    poster: Nick
                    email: greencat60mail.ru
                    subject: вы во многом правы
                    deleted: false
                    text: "Я хотел спросить, разговаривали ли вы с людьми, которые потенциально в будущем могут быть преподавателями у вашего сына. Складывается впечатление что ваш интерес ко всему этому делу несколько оторван от реальности, витает где-то в облаках.\nПо поводу влияния нейлона и металла я уже писал: \"...в детских руках нейлон-то комфортнее, потому что что такое детская игра в самом начале? В левой руке -сплошной недожим, а значит постоянный дребезг и отсутствие сустейна: в правой - грубое извлечение и лишние, ненужные касания пальцами струн, а значит - грязь. Понятно что с нейлоном всё это не так противно как с металлом. Это я к вопросу пропадании желания.\"   \nК русским народным песням это также относится. Но до них ещё надо дожить. Прежде надо поиграть пьески на раскрепощение правой руки, (т.к. поначалу это не человеческая рука, а куриная лапа с растопыренными деревянными пальцами; из неё надо сделать свободную, мягкую, лёгкую человеческую руку) пьесы-арпеджио (перебор) разных там каркасси-карулли-джулиани. Для чего нужны восадули? Для того чтобы ученик учился играть ровную мелодическую линию. Для чего? Для того чтобы он мог извлекать звук какой он хочет. А что получается вначале: одна нота громкая, грубая, вторую не слышно, третья глухая, четвёртая звонкая, следующая короткая, следующая длинная - мелодия не складывается, а порой не угадывается вообще. Я уж не говорю о какой-то слитности, легатности. Почему именно эти песни? Может быть потому что считается, что ребёнок слышал их, это немаловажно, но не только - в этих мелодиях поступенное движение - ноты идут по порядку, без скачков, то есть, как бы сказать, звуковысотные связи... короче это легко укладывается в детской голове, опять таки ровные длительности (которые как я понял вы так не любите), что тоже облегчает ему задачу.\nЕму и так слишком многое нужно контролировать. Можете ли вы поставить себя на его место? Нет. Буду рад если хоть немного помог вам в этом.\nЕстественно! Конечно! Если препод найдёт подобные примеры из музыки близкой вашему сыну - это будет просто супер. Ну а после всего этого можно будет попробовать что-нибудь далёкое от классики, те же буги-этюды Фридома, если кое-что упростить. Хотя практика показывает, что наши маленькие дети не очень дружат со свингом (как исполнители я имею в виду, может потому что эмоционально несколько зажаты?), 14-15 лет гораздо лучше. Так что пока тут и без железа есть отчего взвыть.\nА с чего вы собственно взяли, что я поклонник классической гитары, я по-моему ни слова об этом не сказал, и это совсем не так. Просто кое-какой опыт работы с детьми имеется. Поэтому об этих людях, о которых вы спрашиваете, я ничего не знаю. И вообще у меня плохая память на имена :), в отличие от вас. не мешает это вам?  Вот, а во всём остальном вы абсолютно правы. Полностью согласен, хотя есть ньюансы.\nЧто-же если кто-то учился на гитаре из сигарных коробок, надо и сейчас так делать? Просто у него так получилось, так сложилось и мы имеем дело с конечным продуктом, с результатом. А может вокруг него были сотни, у которых ничего не вышло. У нас вон во дворе было человек 20 пацанов и все учились на гитаре, потому что в то время только дурак этого не делал...  Кстати по поводу гармошки мысль действительно очень правильная.  ...а сейчас наоборот только дураки и играют..."
