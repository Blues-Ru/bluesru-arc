                poster: Nick
                email: greencat60@mail.ru
                subject: во-первых,
                deleted: false
                text: 'под "металлом" подразумевались всего лишь только струны, а во-вторых, если ему нравилось засыпать под mr. crowely, то почему надо ребёнку портить руки и вызывать отвращение к гитаре. То что нравится человеку не должно иметь отношения к тому, как надо держать ручку и писать палочки и крючки, впрочем кажется на второй круг пошли. Я ни о какой классике здесь речь не веду, я о том, как дать в руки инструмент чтоб на всю жизнь. Пересечение стилей? отличная тема для разговора, но только в том случае, если человек уже умеет говорить. Чего вы боитесь?

                  Что как только он возьмёт в руки гитару с нейлоновыми струнами, тотчас начнёт чахнуть и из вашего сына превратится в зомби, не переставая играющего аллегры и андантины? это бред. Я вам отвечаю, что как только он начнёт извлекать что-то путное, членораздельное, похожее на Звук (а с нейлоном это более вероятно) - его интерес к своей любимой музыке поднимется на более высокий уровень, более осознанный и даже можно сказать профессиональный. А вообще мне просто любопытно, вы где-нибудь ещё интересовались этим вопросом: в муз. школах и т.д.  или только здесь?'
                replies:
                - id: 15203
                  parent_id: 15191
                  date: 2003-10-23 23:49
                  poster: Greta
                  email: morehemp
                  subject: не сочтите
                  deleted: false
                  text: "за дерзость, если я сама себя же и процитирую в ответ./ Ибо на новый круг объяснений, где я была и куда ходила и какие от этого остались впечатления, заходить не хочется.\nhttp://www.blues.ru/forum/?id=30571&page=0&body=1#30571\nЭто ответ на вопрос: только здесь?\nне только.\nХотя не вижу ничего предосудительного в том, чтобы спросить и здесь. Ведь выпускники и гнесинки в том числе снимаются в клипах, размахивая за каким-то бесом gretsch'ем исключительно для антуражу. А здесь есть реальные люди, чья подача и звукоизвлечение _мне_ нравятся, и их мнение для меня важно. Не вижу ничего зазорного спросить у них. Благо передо мной есть примеры людей, сумевших научиться играть рок-музыку и блюз так, как не умеют люди со специальным на то образованием, как бы вроде бы предполагающим, что всякий, кто получил азы и грамоту, то есть научился \"говорить\", сможет играть всё. Ан нет.\nИ просьба к Вам. Я так поняла из Ваших постингов, что Вы и есть преподаватель и поклонник гитары классической..?\nТогда позвольте задать Вам один вопрос. К примеру, открываю я сборник (или самоучитель) с уроками для новичка. И вижу - Во саду ли в огороде (русская народная песня), Во поле березка стояла (русская народная песня) - безотносительно пока к содержательности и целесообразности самого материала, оставим это. Вопрос в следующем: каким образом влияет наличие под руками нейлона или железа на разучивание данных произведений..? Они коротки для заучивания, просты и непритязательны. Этому нужна дествительно классика?\n\nИ опять же, меня интересовал момент, реально ли у нас в стране начать обучение с простых, но НЕ русских народных и венгерских песенок? Масса детской музыки выпущена популярными музыкантами. Есть даже серия музыки для детей, в которую вошел и Taj Mahal. почему нельзя начать разучивание с них..? У нас другая ритмическая структура, и то, что родившемуся, к примеру, на Джамайке дается с воздухом и дыханием, у нас человек, следуя закономерной логике \"постижения азов\", может получить лишь в зрелом возрасте, когда сам до всего допрет, но тогда, увы, уже может оказаться поздновато - ведь наша \"официальная\" телевизионная поп-рок сцена молодеет, но стиль и качество игры отчего-то не лучшеет. В итоге у нас формируется сознание другое. На нашей земле есть любители классической гитары, есть отличные(!) _самоучки_, есть джазовые музыканты добившиеся мирового признания, которых иногда принимают в свои объятия известные западные коллективы.. а между всеми ними - бездна, пустота, ничем незаполненная. Рок-музыка у нас отсутствует. Едва появившись на теле-горизонте что-то приличное сразу умирает или трансформируется.. Это я не о том, на что я замахиваюсь (упаси боже), а о том, _какая_ у нас школа. \nБольшинство музыкантов, музицирование которых нравится мне лично (наших, западных - не важно), нигде и никогда музыке официально почему-то не учились, то есть дипломов не имеют. Не знаю, хорошо это или плохо, но это факт. И, может статься, закономерный..\nИ еще к вам одна просьба, если таковые существуют и они Вам известны, дайте пожалуйста ссылочки, где я могла бы послушать в сети отрывочки произведений и игру многоуважаемых Никиты Кошкина, Петра Панина, Дмитрия Мамонтова и пр. \nБыла бы очень признательна."
