      text: 'что между электрогитарой и акустикой с нейлоном много общего, и то и другое - гитара. А ставить задачу с детства играть в каком-то определённом стиле - нужно ли это? К 13-14 он сам решит, что ему надо. И разве плохо если к этому времени у него будет какая-то база.

