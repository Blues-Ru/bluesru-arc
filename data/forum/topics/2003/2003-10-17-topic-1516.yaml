                  subject: 'я понял:'
                  deleted: false
                  text: это про меня. С интересом выслушал бы другую точку зрения, на самом деле для меня это интересно и важно. Но пока, кроме того что это должна быть гитара с металлическими струнами, ничего не писали. Так, хорошо, что дальше с этой гитарой делать? Вот пришёл ученик 8-9 лет (или 11) на первое занятие, вернее мама привела (это важно! не сам пришёл, это неплохо, просто желание неосознанное), что происходит на этом занятии? С чего начинать? Выше я уже примерно обрисовал как выглядит детская игра поначалу. Второе, третье занятие - сдвигов может и не быть, усидчивость, сила воли должна быть недюжинная... на четвёртое он может и не прийти...
