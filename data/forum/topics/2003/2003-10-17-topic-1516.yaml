            subject: Более ограниченный, чем ф-но в музыкально-теоретическом плане
            deleted: false
            text: 'Диапазон гитары - где-то от ми большой октавы до фа третьей октавы. В плане полифонии, максимальное количество нот, которые могут звучать одновременно - 6 (по количеству струн), на ф-но - 10 (по количеству пальцев) плюс еще дополнительные ноты можно держать с помощью педали. Аккорды, внутри которых есть секунда, на гитаре уже исполняются с превеликим трудом, а то и вообще не берутся. Про блок-аккорды вообще промолчу. И т. д. и т. п. Надеюсь, бОльшие возможности ф-но не вызывают сомнений? Особенно они, кстати, важны для ребенка: на гитаре в блюзе-джазе одновременное исполнение мелодии и аккордов - задача нетривиальная, а на ф-но - не проблема, в одной руке - мелодия, в другой - аккорды. Т. е. ребенок учится одновременно чувствовать всю гармонию песни, а не отдельные ноты.


              Это, повторюсь, музыкально-теоретические возможности. То, что ИСПОЛНИТЕЛЬСКИЕ возможности любого инструмента зависят только от фантазии исполнителя - и ежику понятно.'
