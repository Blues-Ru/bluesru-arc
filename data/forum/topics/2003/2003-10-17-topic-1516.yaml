            text: "Весь прошлый год ребенок у меня ходил на коммерческое подготовительное отделение. 950 р. в месяц, 2 собеседования при поступлении (большим образом формальность). По окончании ученики сдавали экзамены для поступления в нулевой класс (это уже не коммерческое, а государственное образование). Вот здесь уже всё было серьезно - был отбор. Сейчас по школе ходят слухи, что со следующего года нулевые классы отменяются, так что после подготовительных отделений будут принимать в 1-й (с 7 лет). Более подробно можно узнать в самой школе по телефону: 142-19-30.\n Про маленькие гитары - пока не дозвонился. Последний раз, когда я был у этого мастера, у него было 2 таких стратокастера (1 он для своей дочки сделал, один на продажу). Это было где-то полгода назад. Как дозвонюсь - напишу.\n Ну и, наконец, пользуясь случаем, приглашаю Вас завтра (в среду) и послезавтра в кафе Scolder Blues (Старый Арбат, 24). В среду мы играем своим коллективом (Scolder Blues), а в четверг с Петровичем (Bluesmakers). Начало в 19. А в перерывах можно будет и проблемы детского музыкального образования обсудить!"
