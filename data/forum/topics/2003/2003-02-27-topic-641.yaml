      text: "Джем это что? Думаю, что в первую очередь это некая встреча с людьми с которыми интересно пообщаться. Общение\
        \ подразумевает взаимное понимание. \nНа сцене играют хорошие,проверенные бойцы - \"старослужащие\" в некотором смысле\
        \ и тут-то появляется молодой,\"салага\" у которого руки и все остальное трясется уже несколько дней от одной мысли\
        \ о предстоящем посвящении в касту \"блюзменов\". Выходит он на ентот самый подиум (читай \"к стенке\"),от волнения\
        \ инструмент у него растраивается сам по себе и гриф опускается как ... В этот самый момент хаус-бенд (читай \"растрельная\
        \ команда) начинает играть нестандартную тему с различными неизвестными новичку ходами.  Короче,\"салага\" убит с\
        \ одного выстрела. Далее,\"могильщики\" хоронят его, т.е. начинаются разгаворы типа - чувак-то того, не тянет, фуфло\
        \ гонит и т.д. и т.п.\nЯ это к тому, что разводящий на этом страшном суде называемом \"джем\", должен как-то въезжать\
        \ в ситуацию и не предлагать новичку что-то типа \"все! п....ц тебе!!!!\". Слышу возражения типа - сколько можно квадраты\
        \ гонять? Отвечаю - более сотни лет эти квадраты гоняют и все мы слушаем их и соплями утираемся. Вопрос в другом -\
        \ как их гонять? \nВ хаус-бендах довольно часто сами путаются и лажают так-что дай Бог каждому.... причем в самых\
        \ \"заигранных\" вещах. Басисты играют мимо,но громко, барабанщики лупят как в последний раз, а лид-гитарасты пытаются\
        \ выдать такое от чего даже видавшие виды гардеробщики падают в обморок. Все довольны, все не виноваты - а я чего?\
        \ я того - хотел играть тихо и чинно, но остальные.... А остальные-то это он сам и мы с вами.....Новичек рад ,что\
        \ не закидали объедками,музыканты хаус бенда довольны собой и клянут звукорежиссера, слушатели довольны тем, что вещь\
        \ закончилась....приобщились так сказать...\nГрустно....девушки...\nМожет действительно имеет смысл выработать некие\
        \ молитвы для членов хаус-бенда и для \"гостей\"?\nНапример, так:\nДля хаус-бенда.\nБлюз! Вразуми мя не играть сложных\
        \ вещей и не щеголять своим мастерством, работать на фронтмена,коим является \"гость\" ибо сказанно -гость от Бога.\
        \ Помоги мне помнить,что гость это друг, человек тонкий,ранимый,но глуповатый и не уверенный в себе и в окружающих,\
        \ плохо играет на музыкальных инструментах,плохо поет (но громко), забывает слова и мелодию.Бывает нагловатым и хамовитым,но\
        \ нуждается в доброжелательном отношении моем и всего хаус-бенда.\nПозволь,Блюз, играть хаус-бенду  тихо и просто,\
        \ а для удовлетворения наших собственных музыкальных амбиций пошли нам наши собственные концерты и позволь нам там\
