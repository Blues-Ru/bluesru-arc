  text: "тока што пасмарела фильм снова..\nДа, там маленький кусок из песни Доктора Джона \"Zu Zu Man\". У меня её нет :( \nОна, судя по всему(?), есть только на сборниках. И в саундтрек не вошла.\nНайти можно там:\nhttp://www.allmusic.com/cg/amg.dll?p=amg&uid=CASS70307021808&sql=H1512015\nPS: странная штука, столько разговоров было про ту песню под кровавым дождем - The Right Key But the Wrong Keyhole, а мне она совсем никак - такой банальной кажется.. При первом просмотре даже внимания на неё не обратила. А Zu Zu Man все не заметили как бы.. хотя она-то там как раз и создает атмосферу. Да voodoo dancers"
