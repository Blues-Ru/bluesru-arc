    subject: Zu Zu & others
    deleted: false
    text: 'Я уже как-то тут писал про непонятки с ранними работами Доктора до официального альбома Gris Gris. По некоторым источникам есть инфа, что была пластинка с этим материалом, но это редкость. Хотя она была издана на A&M в 65 году только в США под названием Zu Zu Man, переиздание есть и на Topline, и на Thunderbolt, и на Charly. Эти издания мне попадались, но выглядит все это как полулевый материал. Я же советую взять вот этот сборник на Rhino:

      http://www.allmusic.com/cg/amg.dll?p=amg&uid=CASS70307021808&sql=A7yd4vwvta9ek

      После него можно закрывать тему раннего Д-ра 60-х годов.

      Повторюсь, есть много сборников типа Loser For You Baby или Woman Is A Root Of All Evil (эти два у меня были), но получить удовольствие от них трудно, ибо они странно сделаны. Сборник на Рино будет лучше.'
