          text: "о фальшивости..\n*****В этот момент они чуть было не распались, и глупость этой ситуации особенно подчеркнул тот факт, что бывший менеджер группы Клифорд Дэвис организовал новый ансамбль под тем же названием, который не содержал никого из оригинальных членов, но успел совершить турне по США. \n\nФлитвуд и Маквай немедленно подали в суд с требованием запретить использование названия, и в конечном счете выиграли непомерно затянувшийся процесс. (Члены \"фальшивой\" Fleetwood Mаc под ярлыком Stretch сделали в 1975 году в Англии хитовый сингл \"Why Did You Do It?\", в текстах которого отражены перипетии этого дела). *****\n\nМне казалось, что Stretch выступили действительно с одним турне вместо FM.. но вовсе не как фальшивый коллектив, а из-за перипетий в составе FM или же в личной жизни одного из участников, точно не помню (увы, тот сайт накрылся..), в результате которых коллектив сам был не в состоянии поехать в запланированное турне. То есть как-бы Stretch тупо спасали честь менеджера (продюсера?). Но название у них таковым и оставалось - Stretch. \nStretch и без того несчастная участь постигла, так как выпустили они свои пластинки в самое неподходящее для этой музыки время..\nАльбом \"Elastique\" с ой самой \"Why Did You Do It\" (в ОСТ \"Карты, деньги, два ствола\" была использована), к сожалению, я так пока и не нашла. А вот несколько треков с \"You Can't Beat Your Brain For Entertainment\"(76) давно валяются вот тут. Хотя, как я могу понять, на этих двух альбомах записана совсем разная музыка..\nЕсли кому интересно, послушайте..\nhttp://greta.bluesman.ru/mine/Stretch/"
