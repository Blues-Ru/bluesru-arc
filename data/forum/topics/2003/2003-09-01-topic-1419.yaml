                  не блюзмены??

                  Теперь о Хопкинсе. Оставим в стороне легенду о том, что Хопкинс
                  был поводырем у самого Слепого Лимона и порой игрывал с ним вместе.
                  Положим, то был период ученичества, поскольку лет Хопкинсу на момент
                  смерти Джефферсона было не более 17. Ну а тот факт, что Хопкинс
                  бродяжил вместе с Тексас Александером - как это указано, например,
                  в буклете популярнейшего диска "The Very Best of Lightnin'' Hopkins"
                  Rhino RS 79860 - при том, что уже после этого Хопкинс сидел, <b>поcле
                  чего</b> в 30 лет женился и работал на хлопковых полях, потом всё
                  в середине 40-х бросил и снова ушёл играть с Александером - а Александер
                  не играл ни на одном инструменте, только пел, и стало быть ему был
                  нужен хороший аккомпаниатор?.. Видимо Хопкинс был таковым и в период
                  первых странствий с Александером ДО того, как ему было 30...

                  Странно как-то у тебя получается: раз нет записей, то и блюзмена
                  нет. И опять эта гаубичная аргументация - "и нечего тут спорить".

                  Есть тут чего...'
