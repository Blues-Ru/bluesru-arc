              subject: Вы неправы
              deleted: false
              text: Школы и течения были с самого начала. Дельта-блюз, техасский,
                мемфисский, сент-луисский, ист-коуст, деревенский, городской и прочие
                формы блюза никогда так явно не различались, как в 20-е и 30-е гг.
                Более того, по причине малой мобильности тогдашних кантри-блюзменов,
                зачастую ограничивавших ареал своих странствий (и соответственно выступлений)
                несколькими деревнями вдоль какого-нибудь шоссе, порой такие школы
                складывались в пределах такой ограниченной местности. Например, яркий
                пример - единственным известным ныне представителем т.н. блюза Бентонии
                является Скип Джеймс, и только.
