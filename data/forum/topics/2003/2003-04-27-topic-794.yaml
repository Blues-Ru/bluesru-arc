  text: "Вот купил три отличных винила этих парней. \nПомогите разобраться что к чему.\n\nНа Оллмьюзике нашел только один:\n\
    http://www.allmusic.com/cg/amg.dll?p=amg&uid=2:09:26%7CPM&sql=Ac9m8b594bsqh\nПочему он там в сборниках? Он на A&M 73 года\
    \ и там один состав. Ошибка там или история этого альбома сложнее?\n\nДва других не могу найти.\n\nОдин: Brownie McGhee\
    \ & Sonny Terry (Jazz Heritage Series) MCA 1983 (Recorded 3/1/69). Как он назывался в оригинале? На каком он был лейбле?\
    \ Вещи такие: Rock Island Line - Long Way Home - Big Question - Night & Day - You Just Using Me For A Convinience - Hole\
    \ In The Wall - Life Is A Gamble - Don't Mistreat Me - Pickin' Up, Gettin' Ready - B.M. Special.\n\nВторой: Brownie McGhee\
    \ & Sonny Terry (Storyville SLP 4007 1975, Recorded 1971).\nТоже непонятка. Интересно как они выходили в оригинале (если\
    \ вообще выходили) и как они обзываются на сидюках. Тут треки такие: Rock Island Line - John Henry - The Chariot Is Coming\
    \ - Two Points Of View - Midnight Special - Tears Rollin' Down - Backdoor Sunshine - Find My Way Home.\n\nСпасибо за помощь!"
