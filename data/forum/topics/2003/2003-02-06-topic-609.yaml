  text: 'Дом аспиранта и стажера (ДАС) МГУ снова зашевелился. Весна! Сезон открывается 16-го февраля (воскресенье) в 19:00 выступлением группы Де Блюз Спиннерс. Это будет не джем, хотя 2-3 друзей мы пригласим на сцену. Цены на билеты в жанре минимализма: по 50 р. Пиво приносить с собой (магазин на горке около трамвайной остановки). Бутылки можно оставить в зале.

    В прошлые разы, пока мгушное начальство не испугалось скинхедов и моджахедов, получалось весело. В кайф оживить этот зал. До встречи!'
