    poster: Elicaster
    email: elicaster@mmail.ru
    subject: По поводу KaZaA
    deleted: false
    text: "По поводу KaZaA. С помощью неё я нашёл то что искал годами, а также то о чем и даже и не подозревал что существует.\
      \ Я столько SRV скачал, нашёл многие оригинальные исполнения песен которые знаю по каверам:\nEarl King - Come On (Let\
      \ the Good times Roll)\nIsley Brothers and Jimi Hendrix - Testify (parts 1 & 2)\nGuitar Slim - Letter To My Girlfriend\
      \ a.k.a Prison Blues\nGuitar Slim - The Things That I Used To Do\nJimmy Rogers & Big Walter Horton - Walkin By Myself\n\
      Jimmy Rogers with Stephen Stills - Worried Life Blues\nArthur 'Big Boy' Crudup  - That's All Right\nArthur 'Big Boy'\
      \ Crudup - Mean Old Frisco\n и многое-многое другое.\nКонечно же, всё зависит от конкретного юзера, будет ли он ждать\
      \ 20-30 минут закачивая 3-х минутную песню.\nСкорость в Казе зависит от того насколько расшарен (share)/распространён\
      \ данный файл в сети Казы и, наверное, от скорости связя у пользователя. У меня, при моей скормной скорости Интернета,\
      \ средняя скорость Казы около 2,5-3,0 Kb/sec (ну, здесь малехо нужен и мааахонький навык). И порой Каза качает быстрее\
      \ чем закачка с помощью FlashGet'a. Так что в среднем на файл в 3,0 Мб уходит минут 20. Хотя вот Earl King - Come On\
      \ я скачивал минут 40, потом закачка сорвалась и файл обнулился (такое бывает, правда очень и очень редко), я тогда\
      \ послал сообщение (тому пользователю с компа которого я скачивал этот файл) с просьбой прислать мне песню, т.к. с закачкой\
      \ трудности и он мне прислал.\nА вот один мой товарищ мне пишет из Финляндии о скорости закачки: Let's name some user-oriented\
      \ numbers. a song from kazaa under 10 seconds. IE6 for 26 seconds. fast enough. but still, in USA they have it much\
      \ faster;)\nТак что, я ещё раз, рекомендую её.\nВот САМАЯ последняя версия KaZaA Lite (облегченный вариант безо всяких\
      \ там adware-spy):\nhttp://www.kazaa.times.lv/instalz/klitekpp243e.exe"
