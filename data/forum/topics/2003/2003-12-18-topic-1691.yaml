  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70312171807051293&sql=A1e62mpmg9ffo\n\
    \nЭто третий альбом МакЛауда на AudioQuest Music. Многое изменилось тут, Дуг будто\
    \ понял, что надо что-то менять и развиваться. Джефф Тёрмс остался в группе и\
    \ играет на басу; появился барабанщик Стив Магэлиан; очень важная новость - перкуссионист\
    \ Оливер Браун!!!; Майк Томпсон играет на органе в Roll Like A River; появились\
    \ подпевки в первом и шестом треках. А главное, появились яркие и интересные блюзы!\n\
    \nИ так 12 треков на 54 минуты. С самого начала все звучит очень здорово! Первые\
    \ два трека Unmarked Road и Necessary Clothes очень хороши! В первом треке многое\
    \ решает перкуссия и женский вокал. Очень симпатичный трек Home Cookin'! Talking\
    \ With Strangers звучит волшебно! Roll Like A River с шикарным органом и богатыми\
    \ подпевками выбивается из стиля, но уж очень она хороша! Отличный бит в бодрой\
    \ I Want You! Прекрасный акустический фолк-блюз Children Like You. \n\nОценка\
    \ 5 баллов! Просто отличный альбом! Перкуссия, National Steel Guitar, великолепные\
    \ песни (где они были раньше?, драйв, настроение, звук. Тут есть все, что-то напоминает\
    \ Роберта Джонсона, где-то слышны нотки Мадди, иногда Лайтнин и акустический Бадди\
    \ Гай; но все это - лучший альбом Дуга МакЛауда! Если хотите начать изучать его\
    \ творчество, купите сначала именно этот диск, не пожалеете."
