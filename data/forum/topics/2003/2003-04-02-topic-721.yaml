      text: Боюсь,что попытка установить в Ираке демократию по западному образцу может стоить больших денег и провалиться.Такой демократии нет ни в одной стране арабского мира,в котором,по данным ООН,живет около 280 миллионов (как в Штатах),а экономика вся около 531 млрд. долларов,что значительно меньше,чем экономика одной Испании,в которой нет ни капли нефти.Даже на этом фоне Ирак - беднейшая страна Ближнего Востока со средним доходом 1300 долларов в год на человека,причем была такой и до войны 1990 года.В то же время примеры Южной Кореи и азиатских тигров показывают,каких успехов можно добиться,не обладая нефтью (не говоря уже о Японии,которая жутко боится Северной Кореи).
