  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=MISS70308181857&sql=Ao6120r3ac48x\n\nНу вот добрались и до последнего из шести альбомов ДМ на фирме ABC, точнее Blue Thumb/ABC. Это были: New Year New Band New Company (1975), Notice To Appear (1976), A Banquet In Blues (1976), A Hard Core Package (1977), Lots Of People (1977) и The Last Of The British Blues (1978).\n\nНеплохо для 4 лет, да? 6 альбомов! 6 редких и коллекционных альбомов. Или точнее 4 альбома и два концертника. Они как раз последние в списке.\n\nЯ не люблю концертники по многим причинам, но не хочу на этом заострять внимание. Могу лишь сказать, что есть ГЕНИАЛЬНЫЕ лайв-альбомы, но это страшная редкость. В основном это плохо записанный, грязный, эмоциональный, случайный, не конкретный материал, которым забивают дыры. Есть конечно лайвы типа Turning Point (John Mayall 1969) - концептуальный гиг, записанный на альбом, но это исключение из правил. Говоря все это, я имею в виду блюзовые и рок-концерты; джаз - это другое дело.\n\nНачну с того, что концертнику я не поставлю 5 баллов, если это не что-то выдающееся (типа Waiting For Columbus - Little Feat). Так что начнем сразу с отметки 4 как максимум.\n\nКонцертник этот недлинный - 40 минут - 10 треков. Хорошо записан для живого альбома. Записан в Балтиморе, Цинциннати и Нью-Йорке. Играющих всего четверо плюс аж 7 подпевающих! Шума от них довольно много, новостей мало. Иногда что-то говорят интересное между песнями, иногда поет гитарист, а не ДМ.\n\nЧто играют? Грязный блюзрок что ли. Есть тут и новые, и малоизвестные вещи, и Parchman Farm с Hideaway - эти две просто неудачны - слишком шумно, быстро, да и зачем это вообще на таком коротком альбоме? Вообще есть пионерская тенденция загонять все вещи на этом концерте - так что не только российские блюз-лабухи страдают этим.\n\nЯ даже не хочу выделять никакие треки - это сложно в данном контексте. Оценка 3 - слишком много эмоций и шума, слишком мало музыки. Почему не 2 и не 1? Играют-то в общем хорошо, драйв на месте, запись удачная.\n\nЭтот альбом я посоветую только любителям концертников; у меня же он в паре с другим, так что приходится мириться.\n\nОстаются вопросы. \nЗачем надо было выпускать второй живой альбом подряд на одном лейбле? Может не было идей и так вот отделались?\nПочему такое название? Последний из британского блюза где? На АВС? Вообще? Или ДМ решил играть что-то другое? Разве в 78 году больше не было британских блюзменов? А кто там был первый? А были ли вообще? Не понятно.\n\nЕсть еще и Lots Of People - лайв годом раньше; о нем я не буду писать - его нет на руках, а по памяти такие же впечатления.\n\nВывод: хорошие 4 альбома на шикарном лейбле и смазанная концовка в качестве двух концертных компиляций."
