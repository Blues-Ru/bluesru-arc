  text: '/artist/peter-green/


    я все же напишу свой вариант дискографии Питера Грина.


    я не буду перечислять его работы с Мэйаллом и другими потому, что там полно синглов, сборников и редких странных альбомов. я также не буду перечислять бесконечные сборники - их море на разных лейблах и они обычно не нужны.


    и так, Peter Green:


    1970 The End Of The Game (ненужный альбом Грина)

    1979 In The Skies (лучший альбом Питера)

    1980 Little Dreamer

    1981 Whatcha Gonna Do?

    1981 White Sky

    1983 Kolors

    1987 A Case For The Blues (aka Katmandu etc. - странные сессии с разными музыкантами; иметь не обязательно)

    1988 Legend (сборник, но половина материала есть только тут)

    1997 Peter Green Splinter Group

    1998 Robert Johnson Songbook

    1999 Destiny Road

    2000 Hot Foot Powder (вторая часть песен Роберта Джонсона)

    2001 Time Traders

    2002 Soho: Live At Ronnie Scott''s (2CD)

    2003 Reaching The Cold 100


    Вот и всё, что нужно иметь. Было еще коллекционное издание двух альбомов песен Джонсона + ВСЕ песни самого Джонсона - хорошая коробка, можно купить для кайфа!


    http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70311191903211846&sql=A23jweae34x07

    Вот на эту туфту не попадайтесь! Грин не имеет к этому никакого отношения (почти)!


    Есть море разных сборников, но все они дурацкие, плохо оформленные и на разных полулевых лейблах. Не стоит на них тратить деньги, все вещи есть на номерных альбомах. У меня было больше десятка разных компиляций на КД и виниле и все это муть. Грин достаточно концептуальный чел, чтобы так не уважать его и покупать дрянные компиляции.


    Публикуй, Федор...'
