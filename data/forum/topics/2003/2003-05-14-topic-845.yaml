  text: 'Для тех, кто просил забронировать место - списки в клубы я отдал, все в порядке.
    Единственный момент - в рамках нашей компании они будут по-необходимости группировать
    народ, сажать кого-то за один столик и т.д. И еще просьба к тем, кто забронировал
    место, приходить не ровно к началу концерта (а он будет начинаться точно по расписанию),
    а хотя бы минут за 15, лучше - за 30. В Форте концерты будут начинаться в 21-00,
    в БиБиКинге на полчаса раньше. Морюд играет обычно два часа без перерыва, не считая
    "добавочного времени".

    Для тех, кто не просил забронировать место, но собирается прийти, места, наверное,
    будут. Я бы только не стал откладывать на субботу, ибо в субботу кто-то на концерт
    может и не попасть.'
