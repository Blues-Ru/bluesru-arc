        text: 'давно я с мастерами не общался, но через Ветерана могу найти тебе любого
          мастера, конечно.

          тихий звук? то есть она не полная? ну в общем это не проблема. у меня была
          тонкая Ямаха, звук был тихий, но очень РОВНЫЙ и КРАСИВЫЙ. моя акустика тоже
          не самая большая, но очень универсальная и именно КЛАССНАЯ - это важнее
          чем громкость в чистом виде.

          как ты будешь на ней играть-то? по блюзу на 12 струнах - это почти НОВЫЙ
          стиль изобретать - бенды делать нельзя, звук фолковый и т.д. может придумаешь
          новый СТИЛЬ?

          мой тебе совет - СРАЗУ строй гитару на ТОН ниже. звук станет ниже, сочнее
          и играть будет проще и правильнее. так делали многие - Нил Янг, Стивен Стиллз
          и т.д. привыкнет к этому кайфу и голос - результат будет ломовой!'
