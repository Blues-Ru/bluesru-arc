      text: История инструмента мне не известна (пока) - знаю, что куплена она в какой-то
        лавке много лет назад моим приятелем который много лет собирает гитары. У
        него их около 30-ти !!! - и все довольно старые. По его информации гитара
        60х годов (впрочем можно проверить по номерам). В сети удалось выудить информацию,
        что 12 струнки в щтатах стали делать в начале 20го века, а Gibson стал их
        производить как раз в начале 60х. Гитара с виду боевая, гриф идеальный, но
        с декой не понятно - в нижней части она деформированна врогнута немного в
        районе пластиковой накладки. Но врогнута настолько аккуратно, что возникает
        впечатление, что это сделанно специально. Высота струн регулируется подвижным
        порогом. Простые аккорды зажимаются легко, а сложные я и не беру. Звучит приятно,
        но как мне кажется немного тихо, хотя это может быть проблема деки. Короче
        надо разбираться с декой. Струны не менял пока - сегодня поменяю..... Нет
        ли у тебя хорошего мастера?
