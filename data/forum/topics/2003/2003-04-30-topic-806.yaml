  text: 'забрал сегодня из Болеро диск Хопкинса "Lightnin''s Boogie" из "черной" серии
    выпущенной дешевым лейблом  TIM CZ ( http://www.bolero.ru/index.php?level=12&topic=101649&manid=34935
    )

    Это сборник записей, 1946-47 годов, записанных Хопкинсом вместе с Wilson "Thunder"  Smith
    и сольно (приблизительно 50 на 50)

    Вполне приличное издание и по качеству звучания и по оформлению.  Вообще, там
    можно прикупить еще около 30 блюзовых дисков этого лейбла  30-60 годов по 200
    р.'
