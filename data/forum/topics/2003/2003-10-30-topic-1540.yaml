    text: 'Я думаю, сына приобщать (если он не старше 18ти) лучше на Ломидзе.

      Аграновский, Мишурис все же взрослая музыка по настроению, тонкости.

      А все нужно в свое время.

      Мало кто прямо в юности начинал слушать музыку с блюза и джаза. По моим впечатлениям, большинство любителей блюза в юном возрасте всякий бодрый рок слушали, а уж потом - к корням.

      А Ломидзе просто идеальный популяризатор блюза среди молодежи - за что ему, я думаю, от нас всех (от меня-то - точно) огромное спасибо. Ну вот взял человек на себя эту благородную нелегкую роль - и играет отлично!

      А уж если сын скажет:

      "Вы знаете, папенька, хотелось бы все же более тонкого подхода к динамике, экономности в художественных средствах, более изящного звукоизвлечения на ударной установке... и в конце концов - для чего такой шум?!.." - тогда, конечно, следующим номером ведем на того же Мишуриса :)'
