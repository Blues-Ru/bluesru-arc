  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=CASS80309011758&sql=Azatvad5ku8w8


    Таж и The Hula Blues Band. Гавайский блюз? Да, именно! Но не только, есть и почти
    чистые блюзовые номера, и регги, и приджазованные песни. 45 минут и 8 песен. Немного
    затянуто или не хватает песен, но это не так страшно.


    The Calypsonians - от этой вещи просто мурашки по коже бегут! Так петь, так играть,
    так чувствовать... Лучший трек на альбоме!

    Coconat Man - классный, веселый регги-блюз; немного затянут.

    Sacred Island - инструментальный номер Тажа. Неплохо, но нужен ли он именно на
    этом альбоме?

    Betty And Dupree - классный блюз Чака Уиллиса! "Betty told Dupree, she wanna diamond
    ring. Dupree told Betty: Baby, I''ll buy you anything!" Ну крсота ведь?

    The New Hula Blues. А что, отличный гавайский блюз! Или просто блюз? Решайте сами.
    Один из лучших треков тут!

    No Na Mamo - островная музыка на "их" языке. Все же выбивается из альбома.

    MAILBOX BLUES PART 150! Да, Таж опять сыграл этот шикарный блюз собственного сочинения!

    Kanikapila - а вот это уже интересный инструментал! Такой твистец с джазовым уклоном!


    Оценка 4 балла. Две вещи совсем слабее других, но зато остальные!...'
