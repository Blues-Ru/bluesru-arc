  text: 'Вторую неделю офигеваю над обиванием порогов управы собственного района и окружного комитета по культуре с одной
    единственной целью:

    Хочется провести в родном Ново-Переделкино open-air Рок-Фест. Ситуация такая: есть несколько молодых команд, разных стилей
    (почему подумал что может быть оффтопик ЗДЕСЬ - из 6 коллективов только собственно мы, Backsliders, играем рокнролл да
    еще ритм-н-блюзовая команда Clef).

    Всё предоставят, всё дадут, сцена, охрана, аппарат, звукореж.

    Нет одного - самого главного - денег. Сказали что обойдётся все удовольствие $ в 600, а то и меньше. Вопрос: глупо, конечно,
    но всё-таки - может кто-то знает организацию ли, человека ли, с которым можно было бы поговорить о благородном деле меценатства.
    Прицел дальний, хотим сделать Рок-Фест этот традицией, вполне возможно, приглашать туда музыкантов более высокого класса
    - на нашей окраине, кстати, множество поклонников блюза и рокнролла - так что это все можно и как приглашение к сотрудничеству
    воспринять.


    P/S/: с полной ответственностью заявляю: пока в нашем государстве ТАК будут относиться к молодежной и неформальной культуре,
    как относятся сейчас, через несколько лет за хайр опять начнут бить морду. Этим гадам, которые в своих креслах сидят -
    с..ать с высокой колокольни на все это - я не понимаю, ЧТО эти люди, якобы ответственные за КУЛЬТУРНУЮ жизнь своего города
    делают на своих местах. Было впечатление, что я попал в мир героев Салтыкова-Щедрина. Ничего не меняется(((('
