    subject: Worked with B.B. King, Rufus Thomas
    deleted: false
    text: 'In the early days, before Presley, Phillips worked mostly with black musicians, including B.B. King and Rufus Thomas.

      After the success of Presley on Sun, others who recorded for the label under Phillips included Johnny Cash, Jerry Lee
      Lewis, Roy Orbison, Conway Twitty and Charlie Rich.'
