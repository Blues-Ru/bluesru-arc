  text: 'В Мемфисе, Теннесси, в возрасте 80 лет <b><a href="http://www.cnn.com/2003/SHOWBIZ/Music/07/30/obit.phillips.ap/index.html"
    target="_blank">умер Сэм Филлипс</a></b>, основатель легендарного блюзового лейбла "Sun Records", подарившего миру множество
    классических блюзовых записей в 50-е гг. ХХ в., человек, открывший миру Элвиса Пресли и рок-н-ролл.

    <img src="http://www.kki.pl/elvisal/plat/p1e.jpg" alt="Sam Phillips and Elvis Presley" align="bottom" vspace="14" border="7"
    border color="#000000">'
