    text: "Кроме Коэна и Рибо у Зорна с Уэйтсом много пересечений. В записи последних\
      \ альбомов последнего, например, принимала участие скрипачка Карла Кихлстедт\
      \ из Tin Hat Trio, которая за последние пару лет поучаствовала во многих зорновских\
      \ проектах и только что выпустила сольный альбом на Tzadik. \n\nУ Рибо (точнее\
      \ у Рибо, Билла Фризелла и Тима Спаркса) вышел только что на том же Цадике новый\
      \ альбом, на котором каждый из музыкантов играет сольные переработки масадовских\
      \ вещей. По словам Марка, это его последняя работа на лейбле, но, конечно, не\
      \ последняя с Зорном. Кроме того, с печалью вынужден сообщить о том, что \"\
      протезы-кубинцы\" больше не собираются выпускать новых альбомов.\n\nИ, если\
      \ интересно, вот линк на свежее интервью с Рибо. Довольно любопытно, на мой\
      \ взгляд: http://www.tomajazz.com/perfiles/ribot_marc_eng.htm"
