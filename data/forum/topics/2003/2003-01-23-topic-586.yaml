  text: "Первый, или один из первых проектов - “Green Onions”(это было ужасно, как\
    \ говорит Марк), далее - “Brenda & The Realtones”. \n“Когда Бренда покинула коллектив,\
    \ мы стали путешествующим оркестром и аккомпанировали разным артистам, среди которых\
    \ были Solomon Burke (Soul Alive - http://www.allmusic.com/cg/amg.dll?p=amg&uid=10:47:37|AM&sql=Ag8ngtq3ztu47\
    \ ( Gr.), Carla & Rufus Thomas, Syl Johnson. Эта группа в свою очередь трансформировалась\
    \ в Uptown Horns. В течение этого времени я находился под сильным влиянием Джеймса\
    \ Брауна и усиленно насыщал партитуры для группы партиями духовых». \n(Marc Ribot\
    \ о себе из статьи «Безродный космополит» Bill Milkovsky).\nThe Realtones подыгрывали\
    \ Чаку Берри.\n“The Lounge Lizards”, “The Jazz Passengers”, Elvis Costello, Rootless\
    \ Cosmopolitans, Los Cubanos Postizos.. – далеко не полный список. У Марка Рибо\
    \ есть отличные сольные проекты, которые, впрочем, зачастую имеют совершенно отдельных\
    \ поклонников, которым чужды пластинки Marc Ribot & Los Cubanos Postizos.\nЗапись\
    \ пластинок с Томом Уэйтсом (Rain Dogs, Frank’s Wild Years, Big Time и Mule Variations\
    \ кажется тоже), существует несколько проектов с Джоном Зорном (Masada, The Gift,\
    \ Film Works...), где, на мой взгляд, у Марка Рибо едва ли не лидирующие позиции\
    \ – без его гитары они бы просто не состоялись. С неповторимой игрой Марка Рибо\
    \ у Зорна записано достаточное количество альбомов. (Кстати, у Зорна и у Вэйтса\
    \ участвует в записи один тот же человек – басист Greg Cohen, всё в музыкальном\
    \ мире тесно переплетено).\nTom Waits. Писал свои песни всегда сам, затем ему\
    \ в этом плотно помогала Kathleen Brennan (жена Тома Уэйтса), Greg Cohen что-то\
    \ сочинил, были песни на стихи Берроуза и других людей. Marc Ribot отличный гитарист,\
    \ и он многое привнес в музыку Уэйтса, но он никогда не писал песен для Уэйтса.\n\
    Сейчас это довольно занятый сессионный музыкант, есть совместные клубные выступления\
    \ с Susana Baca и пр.\nИ напоследок о банальном. У секретарей работа такая – отшивать\
    \ непрошенных гостей и привечать «прошенных», вот они и справляются со всем в\
    \ меру своих возможностей. Момент второй – существует достаточное количество известных\
    \ людей, сокращающих своё общение с компьютером до минимума. Ну не понимают они\
    \ сути этой машины с голубым экраном. И если человек не читает электронную почту,\
    \ это ещё не значит, что он не грамотный или читать не умеет. Момент третий, извините\
    \ за прямоту, но понятие «неграмотный еврей», на мой взгляд – нонсенс. А Marc\
    \ Ribot еврей. Блин, объясняю прописные истины..\nВот вкратце где-то так. Надеюсь,\
    \ я ничего не перепутала.\nPS: сорри за длинный постинг."
