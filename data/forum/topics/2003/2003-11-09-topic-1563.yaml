  subject: Впечатление о VI фестивале губной гармошки в ЦДХ 7 ноября.
  deleted: false
  text: "Сразу хотел бы сказать, что я не музыковед и даже не имею музыкального образования.\nХочу поделиться своими ощущениями\
    \ на уровне эмоций. Никакого музыковедческого анализа.\nПрежде всего, искренняя благодарность организаторам. Жена с сыном\
    \ были в восторге.\n\nФамилии многих музыкантов не помню, не обижайтесь.\nОчень понравился лысый, в красной маечке. Играет\
    \ у Доктора Аграновского. Со вкусом и не мучит ухо. Даже натужное демонстрирование, якобы, джем-сейшновской дуэли с гитаристом\
    \ из Свердловска, не испортило впечатления.\nПолное разочарование в «Петровиче» Соколове. Зал среагировал единогласно.\
    \ Как-то сразу стух. Трубы, тромбоны. Громко, безвкусно. Особенно убило объявление о флаерсах, выложенных на край сцены.\
    \ Коммерциализация здесь была неуместна. Хотя, я понимаю, что «Петровичу» тоже хочется кушать каждый день. Но там никто\
    \ себя флаерсами больше не пропагандировал. Было в планах пойти на концерт «Петровича» в JVL, на следующий день, 8-го\
    \ ноября. Мои единогласно отвергли. Да, и я теперь, пожалуй, буду слушать его только на диске. Там хоть трубы и тромбона\
    \ нет. Потише, пауз побольше и мысли тоже, нежели на  этом фестивале. Короче, самое большое разочарование – «Петрович».\
    \ \nКстати, вспомните, что гораздо теплее зал принимал двоих ребят (гитара + гармошка, пели на испанском, тихо-тихо),\
    \ игравших после «Петровича».  Пять баллов.\nСвердловцы – молодцы. “Blues Doctors”, вроде. Только много. На 1-2 пьесы\
    \ покороче бы. Под конец начали надоедать.\nЕщё более страшный «отстой» - Crossroadz. В первой песне гармошки не было\
    \ вообще.\nНарод из зала сразу стал разбегаться. Голосование ногами. No comments. ЧтО было после двух песен не знаю, мы\
    \ не выдержали такого аудионапора. Ушли. Как-то они не вписались в общую тональность фестиваля.  \nК нашему удивлению,\
    \ в гардеробе оказалось довольно-таки много покинувших зал. Даже шла дискуссия. По поводу «Петровича» все были единогласны.\n\
    \nНу, а теперь ругайте меня. \nМнение субъективное, естественно. Фразы «на мой взгляд», «как мне кажется» держим в уме\
    \ и вставляем в начало каждого абзаца, по умолчанию.\nНикого обидеть не хотел.\nВсем удачи и всего доброго.\nВадим.\n\
    Г. Тверь."
