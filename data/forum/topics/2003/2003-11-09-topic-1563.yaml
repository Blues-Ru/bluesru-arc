                    text: 'Я не думаю, что было бы лучше, если бы вышло 10 начинающих гармонистов на сцену в ЦДХ при большом
                      стечении народу. Это было бы интересно только самим участникам. Для этого нужно собираться в маленьком
                      клубе и играть в свое удовольствие. Сам по себе факт "тусовки" без мощного музыкального бекграунда совершенно
                      необязательно порадует зрителя. Какая разница - тусовка старперов или начинающих? На мой взгляд, концерт
                      одной хорошей группы будет интересней, чем супер-фестиваль, на котором играет 10 групп похуже, ибо количество
                      не переходит в качество. В этом смысле фестиваль этого года был лучше, чем предыдущие, ибо было 2-3
                      хороших выступления. Сам по себе джем в музыкальном плане интересен, если встречаются хорошие музыканты,
                      которые редко играют вместе, от чего возникает что-то новое. Но случайный подбор людей всегда хуже,
                      чем музыка сыгранной группы.

                      Также мне не совсем понятно желание непременно выйти на одну песню на большую сцену. Это - прямая попытка
                      подражания дурным манерам Петровича, Гегарта и пр., которые думают, что осчастливят публику одним фактом
                      своего появления, а не потому, что дома разучили хорошую песню.

                      Бывают ситуации, когда недооцененный музыкант уже играть умеет, но по каким-то причинам - недостаточно
                      популярен. Ему это нужно. Но таких людей у нас мало. Как правило, проблемы именно с умением играть.
                      А просто выходить на сцену с большими, чтобы показать, что я уже тоже почти играю похоже на "больших",
                      - не совсем понятно, зачем? При этом, все видят, что человек пока еще даже до уровня надоевших старперов
                      не дотягивает... Не знаю... Единственный совет, увы, трудновыполнимый, - вливаться в группу и разучивать
                      песни. А если что-то получится, то уже можно думать про то, как нужно становиться чуть более популярным.'
