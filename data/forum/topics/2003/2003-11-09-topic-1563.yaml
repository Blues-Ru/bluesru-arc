        text: 'Уважаемый Андрей. И что это за привычка у журналистов, привешивать ярлыки. По поводу Пастернака - я читал,
          и мало того, "доктора Живаго" действительно считаю выдающимся (и одним из моих самых любимых) произведений. Но столь
          кардинальное различие в культурных пристрастиях не должны мешать общению по поводу общей нашей любви - блюза.

          Поэтому - очень прошу в дальнейшем воздержатся от стандартных журналистких штампов и обвинений меня :

          в антисемитизме - за то, что я люблю русскую народную музыку

          в сионизме - за то, что я люблю еврейскую народную музыку

          в снобизме - за то, чтоя люблю классику.

          в пижонстве - за любовь к джазу

          в примитивизме - за рок музыку

          Ну, и так далее. Давайте говорить больше о музыке. Тем приятнее - что музыкальная оценка гармошечного феста - весьма
          схожа и уж очень совпала с моими ОЖИДАНИЯМИ.

          По моему мнению - фестиваль уже стал ТРАДИЦИОННЫМ. И это уже не тот раздолбайский фест в доме журналиста. Вполне
          уже все по взрослому.

          Только вот что странно. Ну, была, с тех первых фестивалей стандартная обойма московских харперов - Гегард, Петрович,
          Братецкий, Владимиров, Кожекин, Сорокин. И давнее уже открытие - Макс Некрасов. Кочевала эта обойма из года в год.
          В этом году - чуть подсократилась.

          Но - после Некрасова, ни один из фестивалей не стал ОТКРЫТИЕМ. Не появилось новых имен. Не появилось новых номеров
          (что я имею ввиду, а то опять не поймете. Вот, скажем на одном из квартирников Кожекин с Братецким выступили только
          вдвоем, когда гармошка и солировала и акомпонировала, гармошка может выполнять множество функций, от функции волынки
          в кельтской музыки, до функции труб - педалей и т.п.) Можно б даже силами этой нашей обоймы подготовить что нибудь
          интересное.

          А так. Отказ в пользу "хедлайнеров" от харперов.

          Ну будет фестиваль губной гармошки (следующий) - Чистяков-Козловский-Воронов. Кого бы еще добавить для привлечения
          народа ? Почему не пригласить Чижа, Машину времени а может даже и Филипа Киркорова с группой "Чикаго"? :-)

          Наверняка зал соберете, и даже больший. Но - не хочу я ходить и слушать одни и те же номера только ради того, чтобы
          послушать Макса Некрасова и Сашу Братецкова. Я их лучше отдельно послушаю.'
