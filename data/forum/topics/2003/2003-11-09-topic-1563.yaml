    text: 'Впечатления весьма позитивные.

      1 Братецкий +Кораблин - очень хороший дуэт.

      2 Blues Doctors - вне всяких похвал. Отличный вокал и гитара, а также драйв фронтмена Владимира Демьянова покорил многих.
      А о других музыкантах, которые играли с BD - Братецкий сыграл на 4 с "-", видна была несыгранность с BD, Ваня Жук -
      отлично как всегда, Вова Кожекин -таже самая причина, что и Братецкого.

      3 Петрович очень интересная подача губной гармошки. Это уже не блюз, а ближе к джазу. Видно что Петрович экспериментирует
      и не стоит на месте.Игра ребят с каждым разом становится все лучше и лучше, особенно медная группа.

      4 Островский -  без комментариев, т.к отсутствовал.

      5 Лебедев + Некрасов - просто великолепно. Первый раз услышал такую подачу босса-новы и все только высший класс. Похоже
      Некрасов нашел себя и это радует,что очень заметно в сравнении с прошлым московским выступлением Некрасова.

      6 Crossroadz -no comments. Я слышал только мощные барабаны Торопкина и больше ничего. И это не первый раз, когда в ЦДХ
      звукорежиссер делает им такой звук.И это смазало их выступление, хотя рябята играли очень хорошо.

      Т.ч. фестиваль удался и надо усраивать его почаще..'
