                      text: 'Само понятие Фестиваль подразумевает разнообразие исполнителей.

                        РАЗНЫХ. СБОРИЩЕ!

                        Мы же наблюдали, "концерт с участием губных гармонистов".

                        Мне присылали письма харперы из других городов, с просьбой участвовать на фестивале. Но я ничего не
                        решаю, я переправлял их к Кожекину.... проигнорировано. Кто они?

                        "...желание непременно выйти на одну песню на большую сцену" - Для меня это способ заявить о сайте
                        Harmonica.ru

                        Опять не об этом.

                        Где Джон с его нынешней группой, где Олег с Grey Hound Band? Тоже салаги? Не скажи.

                        С кем играл Владимиров? Почему не со своей группой Jack-Jack? Вот где он может показать, что он может.

                        Гегарт... ну с ним понятно.

                        Я был на 3-х последних фестивалях. Было категорично заявлено - в программе 2 хомбенда, наверное чтобы
                        не тратить время выступления на выход и на настройку новых музыкантов. Участники должны решить с какой
                        группой и что они будут играть. Причем, участники всё равно всячески старалсиь привести и внедрить
                        в свое выступление своих музыкантов. Дуэты Братцекий-Аграновский, Братецкий-Кораблин, Некрасов-Лебедев
                        (да и сам Кожекин играл с Козловским, а не с Вороновым :-)) это прекрасно демонстриуют. Ну типа понятно,
                        на персменку хомбендов можно их выставить.

                        Честно говоря, Кожекинские мероприятия приелсь, к ним привыкли.

                        Хочется чего-то нового... Новый фестиваль... как это происходит например с кельтской музыкой.... Но
                        тут нужна организация, которой у нас к сожалению нет.

                        С французами приезжал дядечка - призедент французской ассоциации губной гармоники. Круто. Почему у
                        нас такой нет? Как это делается? Какой у них бюджет? Кто бы рассказал?

                        ВОТ.'
