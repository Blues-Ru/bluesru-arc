                        subject: Фестивальььььь....
                        deleted: false
                        text: 'Добавлю несколько комментариев к вышесказанному:

                          1) Кроссроадз обычно приглашается за большие деньги, главным образом, чтобы пришли люди на известную
                          группу. Вы не совсем поняли, кто был в подарочном наборе. Не Кроссроадз прицепили к, скажем, Blues
                          Doctors, чтобы раскрутить Cr-z, а наоборот.

                          2) Мне совершенно не нравится ситуация из пункта 1 (уж меня-то в любви к музыке Воронова трудно
                          упрекнуть, хе-хе), но печальный опыт показывает, что на концерты, где нет Левана или Кроссроадз,
                          уважаемая публика не приходит, хотя там и музыка мирового уровня, и шоу, все сыграно и пр. Было
                          много досадных примеров!!!

                          3) То, что приходят люди и трезво оценивают ситуацию, и для них Кроссроазд - группа не серьезней,
                          чем, скажем, Братецкий с Кораблиным, - это первые признаки выздоровления. Глядишь, попадут наши
                          метры в более жесткую ситуацию, пойдут репетировать и учить новые песни, чтобы составить хоть какую-то
                          конкуренцию.

                          4) Я не уверен, что из имеющегося на данный момент в стране материала, можно сделать действительно
                          хороший харп-фестиваль, который бы всем понравился. Хорошие мероприятия происходят в другом месте
                          - сегодня Эфес, Очаковский фестиваль в сентябре, норвеги, Пол Лэмб и пр. Постарайтесь уж их-то не
                          пропускать.

                          5) Организаторы, тот же Кожекин, работают очень серьезно (я на этот раз не в их числе) - по этой
                          части претензии не уместны, на мой взгляд.


                          P.S. Очень рад возникшей дискуссии. ;)'
