  text: 'Хороший концерт. Было весело. Гурген зажигал на гитаре, Юля прекрасно (что давно уже добрая традиция) исполняла всенародно любимые блюзы.

    Порадовали и гости: Александр Братецкий, молодой харпер Федя (с каждым джемом все уверенее играет), приехавший Гия Дзангидз, замечательный саксофонист.

    Так что пожелаем Юле удачи. Все у нее получиться. Блюз жив.

    Спасибо, Юля.


    ПиЭс Весь концерт отфотографирован, как смогу передам фотки или Игорю Головачеву, или Андрею Цыганкову для размещения на блюзмене.'
