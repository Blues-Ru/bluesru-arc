      date: 2003-09-04 14:44
      poster: Старый Майор
      email: gypsy@mail.ru
      subject: Брат Кирилл, очевидно, Малыш имел в виду стиль, поскольку говорит о
        жанре.
      deleted: false
      text: 'Хотя термин "жанр" шире и в этом контексте, строго говоря, не применим.
        Оперетта, мюзикл, блюз, джаз - это жанр, то бишь "genre", в дословном переводе
        - "род". Внутри жанра существуют стили как "виды" (species), а вот стилистические
        приёмы определяют манеру исполнения.

        Это так, для терминологической точности.


        А вот ссылка в развитие темы. Для любителей филозопии. http://muza.lvs.ru/Txs/muz_meth.htm'
