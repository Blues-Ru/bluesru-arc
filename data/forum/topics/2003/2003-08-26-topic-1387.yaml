  text: "Последний номерной альбом мастера сделан в совершенно неожиданной\n  манере для блюза и уж тем более не в стиле самого\
    \ мастера. Звук\n  очень мягкий, томный и проникновенный. Музыкынты которые окампанируют\n  мастеру подобраны идеально\
    \ для того чтобы добится такого\n  звучания. И голос Морисана так изумительно контрастирует с\n  густым,глубоким голосом\
    \ самого Хукера что не может не вызывать\n  восторга у любого меломана. Альбом начинается довольно неожиданно с\n  легиндарной\
    \ Dimples и ни как не вписывается в общее настроение\n  альбома, но это одна из фишек Хукера (не зря его называют самым\n\
    \  оригинальным музыкантом). Гитара Хукера лиш слегка оттеняет\n   фактуру альбома, придает музыке своеобразие и хукеровскую\
    \ атмосферу.\n  Здесь главное голос и акомпанимент не заглушает его. Хукеру важно\n  что бы мы услышали, что и как он\
    \ поет, веть ему 80 лет, и ему есть что\n  сказать. Весь альбом это размышления, воспоминания. Столько лет\n  прошло,\
    \ столько кумиров сменилось (Red house память Хендрексу) столько женщин ушло, столько\n  было выпито, каких друзей потерял.\
    \ Но говорит Хукер Dont Look Back.\n  Впериди новые возможности, новые кумиры, но без Джона. Он выпил\n  сколько можно\
    \ было выпить, он сыграл сколько можно было сыграть.\n  Теперь дорога другим и Морисон здесь является олицетворением нового\n\
    \  кумира, новой музыки, другого времени."
