  text: 'Проанализировав playlists скачанных с mp3.int.ru (Казанцев, молчи!) альбомов,
    я обнаружил на них ссылку на broadcast.com.ru, однако по пришествии туда был встречен
    ERROR 403 You don''t have permission to access / on this server...


    Дальнейшие исследования с помощью тонких шанцевых инструментов показали, что этот
    сервер - наш старый добрый mp3files.int.ru.


    С чем себя и поздравляю.'
