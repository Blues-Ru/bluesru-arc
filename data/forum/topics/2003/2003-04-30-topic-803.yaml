    text: "Privet vsem iz Israel,\n\nNasha komanda SOBO (www.sobo.co.il)igrala do poslednego momenta v Mike's Place kajdyu Friday, Assaf(Sammy) - lead vocals, bass - on je i hoz'ain Mike's Place,\n\niznachal'no Mike's Place bil zadyman kak underground movement,\nmyzika blues and rock still not that big here in Israel, \n\nkajdii kto kagda libo hot' odin raz posmotrel live show at Mike's ostavl'al v dyshe chast' togo ideala kotorim mi vse dishali.\nFreedome, Rock-n-roll, LOVE\n\neto mesto poistini international - Amerikaneci, Anglichane, Izrail'tane, Rysskie, Rymini, Arabi, Kitaici, Avstraliici, voobshem vse kto hotite, - \nposmotrite na Mike's guestbook na www.mikesplacebars.com\nposmotrite kak so vsego mira ludi pishyt...\n\nYa lichno znal pochti vseh postradavshih,\nsimvolichno to chto pogibli oficiantka, muzikant i slushatel'\n(May they rest in peace)\n\nAvi Tabib - nash geroy, eslib ne on, ne 3 a 30 pogibli bi...\n\nMay all our prays go to the good folks at Mike's Place - Israel"
