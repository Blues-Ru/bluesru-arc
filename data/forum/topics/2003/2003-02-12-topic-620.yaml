    text: "С одной стороны - немного грустно, ибо распадается один из самых качественных и высокоуровневых коллективов, с\
      \ другой стороны, у нас есть шанс получить новую еще более интересную в музыкальном плане группу с двумя НАСТОЯЩИМИ\
      \ дудками (как у взрослых) и блюзовым репертуаром ;) Очень будем надеяться, что все получится, хотя гарантии никто дать\
      \ не может. Понятное дело, что распустить группу проще, чем создать новую. С другой стороны, в старом составе никаких\
      \ шансов на какое-то развитие и смену репертуара у них, в-общем, не было. \nЖелаем успеха!"
