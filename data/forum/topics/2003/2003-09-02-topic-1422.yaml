  subject: Taj Mahal - Shoutin' In Key - 2000
  deleted: false
  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=CASS80309011758&sql=Apq6m968ohepf\n\
    \nЭто очень хорошо сыгранный и записанный концерт Тажа. Записан он в 1998, но\
    \ вышел только в 2000. Концерт длинный и состоит из 13 композиций. В основном\
    \ это блюзы в новых аранжировках, но есть регги и карибская музыка. \n\nИграют\
    \ и поют просто великолепно - настоящий праздник для слушателя! Из \"классики\"\
    \ тут EZ Rider, Ain't That A Lot Of Love, Leaving Trunk, Mailbox Blues, Corrina.\
    \ Таж еще раз доказал, что его живые выступления также сильны как и студийные\
    \ работы.\n\nОценка 4 балла, слишком эклектичен для блюзового альбома (а именно\
    \ так он позиционируется) и слишком заблюзован для поп-пластинки."
  replies:
  - id: 14016
    parent_id: 14015
    date: 2003-09-02 02:37
    poster: Дима Казанцев (Dr. Nick)
    email: dr.nick@blues.ru
    subject: Taj Mahal - Hanapape Dream - 2001
    deleted: false
    text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=CASS80309011758&sql=A8n841v04zzca\n\
      \nЯ не знаю почему он вышел только два месяца назад в США, я его купил очень\
      \ давно и этот альбом 2001 года, а записан в далеком 2000-ом в Германии и на\
      \ Гавайях.\n\nЗдесь Таж со своими гавайскими друзьями The Hula Blues Band. Играют\
      \ весело и живо, некоторые треки записаны живьем в студии - это хорошо слышно.\
      \ Тут много своих старых и новых песен, а также традиция и даже Боб Дилан! Альбом\
      \ длится 45 минут и состоит из 11 треков - классика!\n\nНачинается альбом с\
      \ Great Big Boat - очень красивая \"островная\" песня Тажа не без блюзового\
      \ влияния.\nПотом идет старая народная вещь в обработке Тажа Black Jack Davey.\
      \ Тут реггийная обработка. Он уже записывал ее в 70-е. \nТретий трек Moonlight\
      \ Lady - что-то типа мексиканской кантри-песни с гавайскими звуками - очень\
      \ красиво и гармонично.\nЧетвертая вещь King Edward's Throne - это отдельная\
      \ история. Музыка Тажа, а слова народные. Всех слов-то: Love, love, love alone\
      \ caused King Edward to leave his throne. Минорная карибская музыка на текст\
      \ о бедном английском короле Эдуарде. Лучший номер на альбоме!\nAfrican Herbman\
      \ - известная вещь Ричи Хейвенса в реггийной обработке.\nBaby You're My Destiny\
      \ - приджазованная вещь Тажа с альбома 70-х годов. Ностальгия по тем годам?\n\
      Седьмой трек Stagger Lee - визитная карточка Тажа; одна из них. Тут в бодрой\
      \ твистовой обработке. Любит он эту песню!\nLiving' On Easy - веселая народная\
      \ песня о бедном пьянице. Интересная блюзо-латинистая обработка.\nMy Creole\
      \ Baby - классический блюз-сонг Миссиссипи Джона Хёрта. Его Таж очень любит\
      \ и уважает! Супер-песня!\nALL ALONG THE FUCKING WATCHTOWER!!! By Bob Dylan!\
      \ Вот это он дал, такого я не ожидал от Тажа! И Дилана значит чтит... Отличное\
      \ исполнение этой нетленки Боба. Один из лучших треков на альбоме!\nНу и под\
      \ конец одиннадцатым номером симпатичная островная инструменталка. Вовсе необязательная\
      \ после вещи Дилана.\n\nЧто сказать, оценка 4 балла. Много старых вещей, а мы\
      \ хотим новых или еще незаписанных! Остальная часть с новым материалом хороша\
      \ до неприличия!"
