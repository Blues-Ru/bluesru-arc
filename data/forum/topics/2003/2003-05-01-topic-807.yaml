  text: 'Кажется, Петровичу удалось повторить подвиг Н.Арутюнова с его ЛБ, собрав многочисленный и, что самое главное, дееспособный
    коллектив с мощной духовой секцией и полноценным, обладающим отличным запоминающимся вокалом, вторым солистом А.Бородиным.
    Вообще стоит заметить огромный вклад медных Сколдеров в «Bluesmakers». Александр Бородин (саксофон) и Сергей Капшин (тромбон)
    стали как бы вторым ядром группы, образовав отличный противовес харизматику Петровичу. В дополнение к ним в группе есть
    и трубач-виртуоз Александр Пчелинцев. Его соло слушались буквально затаив дыхание. Труба то пела, то визжала, то хрипела,
    издавая абсолютно нечелов… невозможные звуки. Пассажи переплетались один с другим, возникали внезапно в совершенно неожиданных
    местах, свешиваясь гроздями или отдельными вишенками.

    Запомнился барабанщик Сергей Чекморенко с безумным и в то же время наивно-детским взглядом. В некоторые моменты кажется,
    что ещё чуть-чуть и ритм будет потерян, но нет, это всего лишь видимость. Ситуация под контролем!

    Евгений Немов – незаменимый музыкант и воистину «балансный гитарист» ( (с) А.Аграновский)


    Ну и напоследок, чтобы не было так сладко… классная программа временами казалась не единым целым, а последовательно исполненными
    отдельными номерами. Может виной тому недостаточно активный конферанс? Привыкаешь, понимаешь ли, к хорошему то, слушая
    Аграновского с Мишурисом.


    И вопрос: отсутствие Мажукова, Дзагнидзе и Сикорского – это обычное дело или случайность? Вроде как изначально они декларировались
    как полноценные участники группы..'
