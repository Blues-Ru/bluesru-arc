            text: 'Злого умысла нагадить специально посетителям блюз.ру здесь действительно нет.

              И микрософт в данном конкретном случае не при чём.


              Этот вирус I-Worm.Ganda http://www.viruslist.com/viruslist.html?id=1980024 распространяется по e-mail и берёт
              адреса для своего распространения в том числе и сканируя содержащиеся на диске файлы *.htm* поэтому для того
              чтоб мы все получили этот вирус по почте достаточно было обладателю зараженого компьютера зайти в форум на блюзру.


              Современные способы передачи почты не предусматривают проверку адреса отправителя, поскольку разрабатывались
              задолго до появления интернета в нынешнем его виде (с хакерами спаммерами и вирусами), поэтому если вы получили
              письмо From: dr.nick@blues.ru это ещё ничего не значит.



              Судя по содержимому заголовков письма с вирусом это письмо было отправлено с ip адреса одного туркменского провайдера
              TurkmenTelecom ISP Network PROVIDER. Поэтому тому кто ходит на форум через этого провайдера (возможно Сергею
              Бабаеву) стоит проверить свой компьютер на вирусы.'
