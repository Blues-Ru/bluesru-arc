        text: 'Конечно можешь! Это может каждый.

          Картинка вставляется так:

          <img src="ЗДЕСЬ ПОЛНЫЙ АДРЕС КАРТИНКИ В ИНТЕРНЕТЕ" align="bottom">

          Именно адрес картинки, а не странички, т.е. в данном случае это было

          http://www.zoo.ru/Moscow/images/s_00034b.jpg

          Ну, ещё и такая фишка: можно здесь и гиперссылку разместить. Делается это так:

          <a href="ССЫЛКА">CЛОВО</a>

          Например:

          <a href="http://www.blues.ru/vocabulary.htm">Словарь блюза. Доктор Аграновский.</a>'
