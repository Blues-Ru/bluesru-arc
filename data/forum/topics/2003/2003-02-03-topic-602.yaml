    subject: Всё шутят...
    deleted: false
    text: "В 16тактовом блюзе, по моим наблюдениям, обычно просто удлинённое начало на одном аккорде - вместо 4х тактов 8,\
      \ а так - как обычно - вот, например, классический пример - Hoochie Coochie Man ;)\n\nПримеры 8тактовых блюзов я знаю\
      \ такие - (все напишу в до-мажоре)\n\nтипа Trouble in Mind    (Fm)\n|C    |G    |C   C7  |F  F#o |C   |G7   |C & turn|around|\n\
      \nтипа How Long        (F#o)\n|C    |C7   |F       |Fm     |C   |G7   |C & turn|around|\n           \nВидимо, ещё есть,\
      \ я сейчас не припоминаю.\n\nЕстественно, септаккоды, нонаккорды или трезвучия по вкусу; и после F иногда Fm, иногда\
      \  F#o, а часто и просто F остаётся.\n \nTurnaroundы разные бывают. \n\nА вот кто первый назовёт популярный 9 1/2-тактовый\
      \ блюз, получает пиво на следующем джеме! :)"
