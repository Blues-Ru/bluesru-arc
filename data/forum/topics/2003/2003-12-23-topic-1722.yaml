    text: 'вся песня про Мэри.


      изучи блюзовый словарь Аграновского на первой страницы Блюзры! там много что есть!

      Eight Ball - это черный шар с восьмеркой; цель игры в пул. Dirty Pool - нечестная игра в пул, но тут имеется в виду измена или обман. Все это аллегории и т.д.'
