  deleted: false
  text: 'Поступил мне новый привет от г-на Тынку. Очевидно, что он считает, что я это дело сохраню в тайне, дрожа от страха, как осиновый лист. Но я считаю целесообразным обнародовать его послание как есть, с сохранением стилистики оригинала. Удаляю из текста только имя третьего лица, так как не хочу делать его причастным к происходящим событиям.


    ==========================================


    19 мая я приеду из японии..

    рекомендую до того срока передать домен <*****> и забыть думать о плохом..

    а что будет потом на блюзмин ру тебя не касается и не тебе это судить..

    вот и весь мой подход... обсуждать нечего..  переговоров никто особо не будет вести..

    подойдут к тебе просто и начнут говорить на языке жестов..

    не знаю зачем тебе нужны эти неприятности, но очевидно жизнь скучна и

    хочется приключений..

    вероятно хочется блюза и чего-то грустного.. сам напросился...

    но моя совесть чиста - я не лез в чужие дела.. я защищаю свое имущество..

    stnk'
