      deleted: false
      text: "Я и адресок скажу. Впрочем, я его и не скрываю. Имеющий глаза найдёт его за пять минут.\nХотя мне более интересно побеседовать про твой реликтовый музыкальный инструмент, как он там называется? Который не продаётся ))\nА Тынку не гений, увы. Хотя в своём роде талантливый и энергичный парнишка. Контактен, обладает определённой харизмой, является стихийным аттрактором (если надо пояснить, что это за зверь, поясню отдельно :). Но одновременно эгоцентричен до нарциссизма, и определённо страдает графоманией. \nТеперь разделим мухи и котлеты.\nЗа то хорошее, что Тынку делает, организовывая всякие полезные интернет-проекты, его можно и нужно уважать. Впрочем, надо выяснить, насколько велика личная заслуга Тынку в создании оных, поскольку движки сайтов и дизайн делали другие хорошие парни, мне, к сожалению неведомые. Я понимаю, понимаю, что кролики - это не только ценный мех, а сайт - не только движок и картинки.\nА вот отрицательные качества г-на Тынку не хочу обсуждать. Смысла нету."
