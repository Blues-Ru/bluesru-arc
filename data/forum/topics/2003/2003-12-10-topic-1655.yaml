  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70312092209002204&sql=Apkl67uu0h0jd\n\nРоберт Люкас - молодой слайд-гитарист, харпер, вокалист и композитор. Можно сказать, что у него довольно своеобразный выразительный вокал и яркая манера игры на слайд-гитаре. Его группа тоже играет с каким-то своим звуком и их нельзя обвинить в копировании кого-то.\n\nАльбом записан на аудиофильской фирме AudioQuest и состоит из одиннадцати блюзов. Шесть вещей написал сам Роберт, а пять остальных - это известные всем нетленки: Good Morning Little Schoolgirl, Worried About You Baby, Feel Like Going Home, Meet Me In The Bottom, Stranger (Elmore James). Ребята молоды, но не мудрствуют лукаво - играют довольно традиционный современный блюз без особых изобретений и изюминок. Кое-где играют акустики и тогда становится интересно, где-то меняется ритм (Big Man Mambo), но в основном это то, что мы привыкли называть Boring Contemporary Blues (Generation 4). Выручает этот альбом тот момент, что парни играют довольно честно, ярко, грязновато и со \"своим\" настроением. Запись живая в студии (это условие аудиофильской записи - 2 майка и вперед!), и в этом тоже есть свой кайф, но все же не хватает харизмы, негритянского умения и обаяния, ума и таланта Дилана и Моррисона, если хотите. \n\nТут есть что послушать, но оценка 3 балла. Они пытаются играть старый чикагский стиль, сидя в шикарной студии в Калифорнии, и это сразу слышно (и видно на обложке пластинки). Рекомендуется любителям классики/традиции/Чикаго/трёхаккордности."
