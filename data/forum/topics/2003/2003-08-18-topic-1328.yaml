  text: "Честно говоря, я ожидал гораздо большего от этого альбома БиБи. Чего ожидать от этого толстяка в начале 70-х? Это был период его перехода в немного другие форматы музыки - соул, фанк, ритм-н-блюз. То есть он уже почти покончил со скучной блюзовой бадягой 50-х и 60-х, но еще не набрал форму альбома To Know You Is To Love You. \nПервое, что бросается в глаза, - это большое количество треков (11) и приличная длина альбома (44 минуты). С одной стороны это хорошо, но может быть и утомительно, если попался не тот продюсер или сам БиБи плохо подумал.\nНачинается альбом аж с Summer In The City - это хит Loving Spoonful 60-х годов (кто эту вещь только не исполнял в последствии). БиБи ее приблюзил, замедлил, а надо было бы наоборот для первого трека, наверное.\nМного средненьких композиций в стиле соул и поп - ничего страшного, но это еще не БиБи середины 70-х. Он так и не смог понять всю прелесть грува на тот момент и его вместе с продюсером тянет на лиоику, струнные, лишние дудки и прочую мишуру в аранжировках.\nПод конец Кинг все же нарезал знаменитую Five Long Years в десятый раз - тут все клево, но все это мы уже слышали.\nСтоит отметить тут наличие двух великих людей из мира соул/фанк/джаза - это гитарист Cornell Dupree и драммер Bernard Purdee. Обычно наличие этих двух перцев в составе уже гарантирует качество альбома, но тут это не так.\nЕще есть претензии и к самому звуку альбома. Может так было изначально, а может это так звучит современный английский ремастер - жалко 20 долларов за такой мутный и зарезанный звук.\nВывод такой; альбом этот иметь надо обязательно (все же из 11 песен половина \"конфетки\"), но не стоит ставить на него. Он хуже предыдущего In London и слабее всех его номерных альбомов аж до 81 года. 82-ой Love Me Tender поставил жирную точку на БиБи вообще, но какие были блистательные эти 10 лет!\nЯ бы дал этому альбому 3 балла из пяти (поверьте у ББК есть альбомы НАМНОГО хуже этого). Для сравнения, я бы поставил 5 баллов его Indianola Mississippi Seeds или L.A. Midnight.\nНельзя забывать лишь одно - у БиБи немного хороших альбомов, и этот 72 года скорее хорош, чем плох, но есть другие намного интереснее."
