    text: "Ты это, забегай если что. У меня и пульт дома есть, все покажу. Хотя я искренне считаю писать так концерты - БОЛЬШОЙ\
      \ глупостью и пустой тратой времени.\nПоясняю. \nНа пульт в АЛАБАМЕ - заведено далеко не все. Там не заведены барабаны\
      \ и бас. т.е. САМОЕ ГЛАВНОЕ!!!!!\nКроме того, аутентичная акустика клубного концерта. Все это будет слишком покоцано\
      \ направленными микрофонами (пролезанием), и внешний ревер на грязном звуке будет звучать глупо, если захочешь его положить.\n\
      Только - один и очень хороший микрофон (стерео)!!! Типа того, что стоит у меня на камере (видел такую дуру черную сверху?)\n\
      И, желательно на что писать. Тут лучше ДАТ магнитофон, я в последнее время пишу на SuperVHS камеру, там аудиотракт очень\
      \ нехилый и звучит куда как лучше СиДи диска, тем более отцифрованного хилым 12 битным кодеком ЛапТопа.\nОднажды, я\
      \ записал в Алабаме очень пристойно, но для этого, я собрал абсолютно независимую, свою систему микрофонов на запись(8\
      \ каналов), и только со своего пульта отдал на Алабамовский пульт (поканально), а потом уже сводил, подмешивая запись\
      \ зала с внешнего микрофона (с камеры). Но - это жуткий гем, со сведением возня - потому - мой совет, купи хороший!!!\
      \ стерео микровфон с преампом и внешнем кодером (щас есть такие, что по USB гонят 24/96, тогда можно и с Лаптопом),\
      \ ставь его на треноге, огораживай лентами пространство метра 3 (иначе затопчут или захотят трепатся прямо в микрофон),\
      \ и все... Пиши на здоровье."
