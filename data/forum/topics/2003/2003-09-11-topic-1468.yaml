        text: 'Завидую. Ты не подвержен аудиофилии, этой злой болезни губящей всю мою жизнь.

          Я объяснял как то Тиму О''Ги (основателю клуба "Неформат"), почему ему нравится некачественно записанная музыка.
          Просто музыка - звучит у него в голове, а внешняя запись - только дает точку опоры. Если музыка записанна качественно
          - это ему только мешает (слышна лажа, примитивность мышления, огрехи аранжировок и славость вокала и т.п.) Когда
          музыка записана плохо -с шумами, плохо различимой тембральной окраской, со смазанной атакой и т.п., он в голове
          ее ДОПОЛНЯЕТ до ИДЕАЛА.

          Может потому так хорошо звучат старые патефонные пластинки? Диапазон частот - 180 - 8600 Гц, искажения более 12%,
          о шумах старого винила я вообще не говорю. А звучит - полная мистика, живая аура звука.

          Даже хотел проделать эксперимент. Посадить его, и давать слушать кассетные копии с увеличивающимся (или в обратном
          порядке) номером. И записыват - с какой копии его начинает колбасить, а с какой - заканчивает. И так от 1 копии
          - до самого белого шума, когда музыка уже неразличима.


          Просто - клубные пультовки - это сильно убивает атмосферу и нарушает баланс звука. Правда. Если будешь серьезно
          этим заниматся (не профессионально, а просто серьезно), то лет через 5 - обязательно к этому придешь. Проверенно
          всей историей звукозаписи.

          Вполне приличный микрофон стоит меньше ЛапТопа. Преамп - можно сделать самому. И будут хорошие записи, за которые
          тебе самому через несколько лет не будет стыдно. И от которых сами исполнители не будут шарахатся и просить тебя
          НЕ РАСПРОСТРОНЯТЬ дискридетирующих их записей.

          Хотя, если делать все совсем по любительски - может это исполнителям и лучше. Мол, не мы тут налажали, а слышите
          - какая запись? :-)'
