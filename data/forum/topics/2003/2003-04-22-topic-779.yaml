                \ никогда, увы. А Вам рекомендую вернуться к началу и все перечитать.\
                \ На rusblues никто не набрасывался - пока нет повода, а тратить силы\
                \ впустую - увольте, не буду. Хотите рекламы, зайдя на другой блюзовый\
                \ сайт и наговорив гадостей музыкантам? Её не будет. Делайте рекламу\
                \ своими силами.\nКстати, правильно писать: TiTo & Tarantula, а не\
                \ TiNo (сорри, но ляпсус на первой же страничке и, заметьте, не в\
                \ форуме).\nО качестве и форматировании текста я вообще лучше промолчу..\n\
                \nА Вас, простите, поправлю: не blEus. ru, а blues.ru.. \nМожно, я\
                \ не буду дальше продолжать работу над вашими ошибками? Боюсь, здесь\
                \ места не хватит..\nЛучше отвечу \"по существу вопроса\". Достойный\
                \ музыкант - это тот, кто не присваивает себе авторство на музыку,\
                \ написанную НЕ ИМ. Достойный так бы и сказал: \"Музыка J.J.Cale \"\
                Sensitive Kind\" (+ все те другие песни, что он так же у кого-то \"\
                позаимствовал\"), слова - мои, Чижа\". \nВолодя Кузьмин, когда тырил\
                \ у Сантаны из \"Europa\" начало для своей \"Когда меня ты позовешь\"\
                , тоже ведь мог сказать: \"Каюсь, начало позаимствовал у Карлоса,\
                \ но текст и дальше - всё мое\". Но нет же, не сказал.. Видимо потому\
                \ как раз, что очень он ДОСТОЙНЫЙ..?\nК народному, судя по сказанному\
                \ выше, теоретически можно причислить буквально ВСЁ, на что ЛИЧНО\
                \ ВАМ НЕ ХОЧЕТСЯ по какой-либо причине признавать прав за кем-то.\
                \ У нас в стране, впрочем, принято тырить интеллектуальную собственность\
                \ - это не удивительно. Поражает то, что часто это даже ПООЩРЯЕТСЯ..\n\
                Но заимствуют не только у нас в стране.. (Для Вас это отрадно?)\n\
                Например, недавно заметила удивительное сходство в вещи того же Сантаны,\
                \ но теперь уже в обратную сторону: музыка в \"You Are My Kind\" -\
                \ четвертый трек с последнего \"Shaman\" (написанная Rob Tomas, впрочем)-\
                \  в \"припевах\" поразительно почему-то похожа на столетнюю вещь\
                \ итальянца Riccardo Fogli. Может быть, правда, этот кусок уложился\
                \ в 16 тактов (или каков там крайний верхний предел, после которого\
                \ вещь может считаться плагиатом?)..\nПо поводу официального заимствования.\
                \ Это не есть плохо, если при этом оказывается почтение написавшему\
                \ оригинал. К примеру, репперы довольно часто заимствуют не всю музыку\
                \ полностью, не отдельные куски, а лишь маленькие СЭМПЛЫ, но, тем\
                \ не менее, всех, у кого они их позаимствовали, репперы указывают\
