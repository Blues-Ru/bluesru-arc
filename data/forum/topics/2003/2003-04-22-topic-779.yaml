            text: "не скажу, а вот тех, кто постоянно сидит в форуме bleus.ru, наверное,\
              \ действительно десятка полтора. И почему-то некоторые завсегдатаи форума\
              \ решили, что они понимают блюз лучше других и взяли на себя право «казнить\
              \ и миловать». Причем делают это очень агрессивно и зачастую неаргументированно.\
              \ Вот набросились на www.rusblues.ru. Вырвав фразу из контекста статьи,\
              \ представили авторов сайта как каких-то недоумков. И у посетителей\
              \ форума может сложиться мнение, что сайт отстойный и не стоит внимания.\
              \ А мне кажется это не так. Сайт достаточно интересный и, самое интересное,\
              \ близкий по духу к blues.ru. Возьмите хотя бы раздел Рецензии или Герои\
              \ блюза. По-моему, статьи написаны здорово, со знанием дела, и любовью\
              \ к теме. Я себе половину отрецензированных дисков купил и не разочаровался.\
              \ А что касается массовости или элитарности – это вечная проблема искусства.\
              \ На самом деле и то и другое нужно для того, чтобы было движение вперед.\
              \ Просто зачастую, те, кто хочет, но не может добиться популярности,\
              \ провозглашают свою элитарность, пытаясь прикрыть творческую несостоятельность,\
              \ и начинают кричать, что во всем виновата публика, которая не доросла\
              \ до понимания их творений, или во всем виновато «бабло», или евреи,\
              \ или коммунисты, или….и т.д. А те, кто сознательно начинают заниматься\
              \ «не массовым» искусством, как правило, понимают, что большой популярности\
              \ у них не будет и не ««маются» от засилья вкусов толпы и в Новосибирске,\
              \ и на Урале», а просто занимаются любимым делом. (Это не про кого-то\
              \ конкретно, а общие рассуждения). \nА Чиж, конечно, не «образец русской\
              \ блюзовости», но музыкант вполне достойный, и мне непонятны те уничижительные\
              \ отзывы о нем, которые я читал в Вашем форуме."
