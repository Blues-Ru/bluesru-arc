      text: "Лэйм Манго Вашингтон\nКАК ПЕТЬ БЛЮЗ\n(Руководство для желающих сочинить\
        \ блюз)\nПеревел Дмитрий Коваленин\n\n\n\n\n\n\n1. Большинство блюзов начинается\
        \ словами: «Я проснулся сегодня утром». \n\n\n\n2. «У меня есть девчонка что\
        \ надо» -- плохое начало для блюза. Но уж если тебе так спелось -- постарайся\
        \ хотя бы в следующей строчке ляпнуть что-нибудь гадкое, например: «У меня\
        \ есть девчонка что надо -- только с фейсом ей не повезло». \n\n\n\n3. Сочинять\
        \ блюз несложно. Если удалась первая пара строчек -- повтори еще раз. А дальше\
        \ просто рифмуй с чем попало. Например: \n\n\n\nУ меня есть девчонка что надо\
        \ -- \nТолько с фейсом ей не повезло \nУ меня есть девчонка что надо -- \n\
        Только с фейсом ей не повезло: \n\n\n\nЕе зубы как у Маргарет Тэтчер \nИ весу\
        \ под сто кило. \n\n\n\n4. В блюзе не выбирают «или -- или». Ты влип по самые\
        \ уши, братец. Влип в болото, и выхода нет. \n\n\n\n5. Блюзовые автомобили\
        \ -- «шевроле», «кадиллаки» и раздолбанные грузовики. В блюзе никто не ездит\
        \ на «вольво», «БМВ» или джипах. Гораздо чаще в блюзе передвигаются дальнобойными\
        \ автобусами «грэйхаунд» или поездами южного направления. Ни реактивных самолетов,\
        \ ни дорог с полосой привилегированного движения в блюзе просто не существует.\
        \ Но все же главное в блюзовом стиле жизни -- это ходьба пешком. А также готовность\
        \ сдохнуть в любой момент. \n\n\n\n6. Тинейджеры не умеют петь блюз. Они ведь\
        \ еще не готовы сдохнуть в любой момент. Блюз умеют петь только те, кто расстался\
        \ с детством. «Расстаться с детством» в блюзе -- это значит дожить до возраста,\
        \ когда тебя могут посадить на электрический стул, как только ты пристрелишь\
        \ кого-нибудь в Мемфисе. \n\n\n\n7. Блюз может случиться с тобой, например,\
        \ в Нью-Йорке. Но только не на Гавайях. И уж ни в коем случае не в Канаде.\
        \ В Миннеаполисе или Тусоне твои «хреновые времена» воспримут лишь как очередную\
        \ депрессию. Лучшими местами для блюза по-прежнему остаются Чикаго, Сент-Луис\
        \ и Канзас-Сити. Там, где редко идут дожди, блюз не получается никогда.\n\n\
        \n\n8. Лысеющий мужчина -- еще не блюз. Лысеющая женщина -- блюз. Сломать\
        \ ногу, катаясь на лыжах -- еще не блюз. Сломать ногу, потому что ее пытался\
        \ откусить аллигатор -- блюз. \n\n\n\n9. Блюз не получится ни в офисе, ни\
        \ в универмаге. Слишком уж там светло. Переползай на улицу к автостоянке --\
        \ или хотя бы держись поближе к мусоропроводу. \n\n\n\n10. Лучше всего блюз\
        \ поется: \na) На хайвэе \nb) В тюрьме \nc) В пустой постели \nd) На донышке\
        \ стакана с виски \n\n\n\nХуже всего блюз поется: \na) В наркоманском притоне\
        \ \nb) В картинной галерее \nc) В элитном университете \nd) На площадке для\
        \ гольфа \n\n\n\n11. Никто не поверит в твой блюз, когда ты в костюме и галстуке.\
        \ Если, конечно, ты не старый индеец, который спит во всем этом уже не первую\
        \ ночь.\n\n\n\n12. Есть ли у тебя право на блюз? \n\n\n\nДа -- если: \na)\
        \ ты старее, чем грязь \nb) ты слеп \nc) ты подстрелил кого-нибудь в Мемфисе\
        \ \nd) в твоей душе покоя нет \n\n\n\nНет -- если: \na) все твои зубы целы\
        \ \nb) ты понял, как ты был слеп \nc) тот парень в Мемфисе выжил \nd) у тебя\
        \ пенсионный план или трастовый капитал \n\n\n\n12. Секрет блюза -- не в цвете.\
        \ А в том, насколько тебе не везет. Тайгер Вудз не умеет петь блюз. А Гари\
        \ Коулмэн -- умел. Белые уродцы тоже внесли в блюз свою лепту. \n\n\n\n14.\
        \ Ты просил воды -- тебе Детка бензин налила. Это блюз. \n\n\n\nТакже подходит\
        \ как блюз-питьё, если ты просил: \na) вина \nb) виски / бурбона \nc) мутной\
        \ воды \nd) черного кофе \n\n\n\nНикак не подходит как блюз-питьё, если ты\
        \ просил: \na) коктейля \nb) кошерного вина \nc) фруктового морса \nd) минералки\
        \ \n\n\n\n15. Смерть в дешевом мотеле, или смерть от случайной пули -- блюзовая\
        \ смерть. Нож под лопаткой от чьей-нибудь ревности -- тоже вполне Блюзовый\
        \ Способ Сдохнуть. Как варианты годятся: электрический стул, передоз и одинокая\
        \ смерть на сломанной раскладушке. Тебе не удастся умереть блюзово на теннисном\
        \ корте или во время липосакции. \n\n\n\n16. Примеры женских блюзовых имён:\
        \ \na) Сэди \nb) Биг Мама (Большая Мама) \nc) Бесси \nd) Фэт Ривер Дамплинг\
        \ (Толстый Речной Пельмень) \n\n\n\n17. Примеры мужских блюзовых имен: \n\
        a) Джо \nb) Вилли \nc) Литл Вилли (Маленький Вилли) \nd) Биг Вилли (Большой\
        \ Вилли) \n\n\n\n18. Люди с именами вроде Сьерра, Секуола, Обёрн или Рэйнбоу\
        \ никогда не смогут петь блюз, сколько бы народу они в Мемфисе ни укокошили.\
        \ \n\n\n\n19. Подбери себе Блюзовое Имя (пособие для начинающих): \na) Какой-то\
        \ физический недостаток -- Блайнд (слепой), Криппл (калека), Лэйм (хромой)\
        \ и т.п. \nb) Первое имя плюс название фрукта -- Лемон, Лайм, Киви и т.п.\
        \ \nс) Фамилия президента -- Джефферсон, Джонсон, Филлмор и т.п. (ну, может,\
        \ с «Киви» я и поторопился…) \n\n\n\n20. Только не грузи меня байками о том,\
        \ как трагична твоя жизнь. Пока у тебя есть компьютер -- ты не сможешь петь\
        \ блюз. Уничтожь его, так будет лучше всего. Спали с потрохами. Запусти в\
        \ монитор бутылкой из-под сивухи «Бешеный Пес». Расстреляй в упор из пистолета.\
        \ Или пускай твоя Большая Подруга усядется на него и раздавит в лепешку всеми\
        \ своими прелестями. Пробуй что хочешь, приятель. Мне все равно. \n \n \n\
        \ \nSpeaking In Tongues\nЛавка Языков"
