    subject: From The Cradle... To The Grave
    deleted: false
    text: 'В декабре 1994 я будучи в армии позвонил Сергею Бабаеву, он мне с восторгом
      рассказывал о том что Клаптон выпустил чисто блюзовый альбом. Каково было мне
      там: где в армии найдешь и послушаешь?

      Через несколько недель я был уже дома и взял у него ту кассету с записью альбома
      (кстати, на той польской кассете не было Motherless Child. Только позже, через
      полгода её услышал).

      То был то редкий момент когда большие ожидания полностью оправдались.

      Трудно выделить какие-то песни: абсолютно всё понравилось. Практически все песни
      (исключая только Hoochie Coochie Man и Five Long Years) мы услышали впервые.
      Этот альбом для меня был, своего рода, учебником: столько разного и добротного
      блюза.

      Безоговорочно: моя оценка диску - 5.'
