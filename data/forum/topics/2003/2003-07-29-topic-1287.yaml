  text: 'Не поможете мне?

    Ищу оригинальное исполнение Testify (George Clinton - Deron Taylor). Известна она всем как зажигательная инструментальная композиция в альбоме Stevie Ray Vaughan - Texas Flood, 1983.

    Однажды видел в книжке таблатур SRV и такое её название Testify (I Wanna) [она же Testify (I Wonna)].

    http://www.allmusic.com/cg/amg.dll?p=amg&uid=MISS70306030320&sql=H1296087 говорит что именно её играли ещё и:

    Johnnie Taylor "Philosophy Continues" - 1969

    Ron Wood "Live & Eclectic" - 2000

    Parliament "Up for the Down Stroke" - 1974

    Нашёл только Johnnie Taylor. Но это не она... Даже близко не она.

    А вот Ron Wood и Parliament не нахожу :-(

    Может кто знает кто же первый её исполнитель? или в чьём исполнении её слушал SRV?

    P.S. У Isley Brothers есть Testify. Это пожалуй единственная вещь где можно услышать гитарное соло Jimi Hendrix той поры когда он был side guitar player.

    И это тоже не та вещь :-('
