    text: 'Большое спасибо Дима!

      Послушал. Качество вполне удовлетворительно.

      Но вот где Parliament и где SRV? Это же АБСОЛЮТНО разные композиции!

      Не понимаю...

      Когда слушаешь Lonnie Mack - Chicken Pickin'', с закрытыми глазами (чуть ли и не с закрытыми ушами) становится понятно откуда у Scuttle Buttin'' ноги растут. А тут...

      Может то ошибочка издателей пластинки. Что маловероятно.

      Посмотрел в той книжке SRV таблатур:

      I Wanna Testify

      Words and Music by George Clinton and Deron Taylor

      Copyright (C) 1967 Windswept Pacific Entertainment Co. d/b/a Lonitude Music Co.

      Вроде б усё верно получается...

      Кстати, послушав Parliament я усек что Johnnie Taylor и Ron Wood играют именно парламентскую вещь.'
