                      poster: Федор Романенко (fedor)
                      email: fedor@blues.ru
                      subject: Шишка
                      deleted: false
                      text: "Откомментирую по пунктам:\n1) Ох, хоть это и само-антиреклама, но если бы я по должности не был обязан, я бы, может быть, склонился в сторону концерта Скофилда. (Совершенно серьезно, я как раз сегодня об этом думал). Если была бы возможность, посетил бы оба мероприятия. Может уйду с половины, глазком взгляну. Мне очень жаль, что два мероприятия совпали.  \n2) Я продолжаю настаивать на том, что и в музыке, и в любой форме искусства, заявления о том, что я в виду своей тонкой душевной организации не потребляю часть произведений по какому-то формальному признаку (период времени, к примеру) - это полный отстой, свидетельство некомпетентности. Т.е. ты просто начал что-то читать-слушать, но бросил и не принял из-за формы или собственной привычки, не заметив талантливого. Это - признак слабого вкуса. Любой литературовед назовет тебе несколько гениальнейших произведений из любого 10-летия, к примеру.\n3) Про посещаемость концертов Бюска и Морюда я не беспокоюсь. В обоих случаях, как и в возможных будущих, нашлось достаточно народу, которые пришли и получили массу удовольствия. Если им начать говорить абстракции и излагать логические соображения, они не поймут и ответят, что просто-напросто было \"оху...но\". ;)\nDisclaimer: как ты понимаешь, это все тоже к тебе лично не относится, просто размышления на тему ;)"
