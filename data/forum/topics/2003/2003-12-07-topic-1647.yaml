  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDCASS70312062120222714&sql=A79d7yl64xpmb\n\nЭто второй студийный альбом\
    \ на Eagle Records. Он состоит из тринадцати оригинальных композиций группы плюс бонус EP-Disc, на котором записаны старые\
    \ вещи Грина периода Флидвуд Мак; Black Magic Woman, It Takes Time (by Otis Rush), Green Manalishi!!!, Albatross. Ничего\
    \ нового Питер и Ко. не изобретают, они продолжают играть музыку вокруг блюза и блюз-рока и у них это хорошо получается.\
    \ Проблема лишь в том, что на этом диске меньше ярких и классных вещей, чем на Destiny Road или Time Traders. Для кого-то\
    \ это может быть и не проблема, но всё же нам есть с чем сравнивать. Альбом очень вязкий и плотный, менее \"попсовый\"\
    \ что ли. Трудно выделить лучшие треки, но Needs Must The Devil Drives и Smile очень хороши, конечно! \n\nОценка 4 балла.\
    \ Да, альбом более блюзовый, чем предыдущие два, тут меньше элементов поп и соул-музыки, но что-то потерялось в сочинительстве\
    \ и аранжировках. Бонус-диск очень душевный, но не спасает положения до конца. В любом случае, это хороший альбом с правильной\
    \ музыкой, просто он чуть слабее предыдущих работ. Будем надеяться, что это не последний альбом Грина."
