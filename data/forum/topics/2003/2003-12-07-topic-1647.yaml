    text: "Достаточно долгое время мне трудно было определить свое отношение к этому неоднозначному альбому. Вот во что оно\
      \ вылилось.\nВо-первых, жаль, что далеко не все издания - с бонусным диском. Мой экземпляр, увы, без него. Стоит отметить,\
      \ что альбом отвратительно длинный - 58 с лишним минут :)\n\"Reaching the Cold 100\" с первого раза не цепляет, к нему\
      \ нужно прислушиваться. Поскольку, если говорить о музыке, здесь в общей массе сыгран довольно ровненький, бесхитростный\
      \ блюз-рок. Что же до лирики - поначалу кажется, что жизни без траблов априори не бывает. К счастью, далее тучи развеятся\
      \ и щастье будет всем.\nНа \"Look Out for Yourself\" ритм-секция халтурит бездуховно - с таким же успехом эта вещь могла\
      \ быть записанной Крисом Риа. \n\"Dangerous Man\" неплоха, но восторгов AMG по ее поводу я разделить не могу.\nФантазия\
      \ впервые появляется в \"Needs Must The Devil Drives\". С нее, на мой взгляд, можно было бы и начинать, отбросив предыдущие\
      \ треки, - альбом ничего не потерял бы.\nКрасивой, светлой и душевной получилась \"Don't Walk Away\" - ритм-секция здесь,\
      \ наконец, перестала заниматься чесом, уйдя на второй план. Вокал Питера стартует с первой секунды трека в полнейшей\
      \ тишине, разделенной лишь звуками пока единственного инструмента - пианино. И в этой песне, о счастье(!), теперь слышно\
      \ вдумчивую, сначала акустическую, а в конце электро-, гитару. \n\"Spiritual Thief\" совсем не лишена мелодии, и в ней\
      \ трогательно, как-то не по-блюзовому, мычит-подвывает бэк-вокал. Ближе к концу мелодия подхвачена и вышивается гармоникой.\n\
      В искренней \"Smile\" приятно приквакивает :) гитара, вступает орган, а ударные лаконичны и пристойны. \nПервые три\
      \ трека я не смогла бы оценить больше, чем в два балла, - за банальность. Остальные - вполне тянут на пять, или на 4+."
