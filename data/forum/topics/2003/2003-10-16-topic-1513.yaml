              text: 'Извини за шутку, в своий 50 лет становлюсь скептиком и ворчуном (мидл лайф краизис). Не скажу что люблю Брозмана, но просто очень уважаю людей (не только музыкантов) которые при наличии таланта имеют волью,ентузиазм и енергию довести свое мастерство до максимального уровня. Боб один из таких, он виртуоз-инструменталист и знаток музыки разных стилей и народностей, многие так не сыграют. НО ОН НЕ ГЕНИАЛЕН потому что он не создал СВОЙ неповторимый стиль который скажем создал Аллан Холдсворт при наличии техническо-теоретического арсенала. Даже такой большой гитарист как Джон МкЛофлин сказал что "он с удовольствием украдет то что делает Аллан но беда в том что не понимает что и как это делает Аллан".

