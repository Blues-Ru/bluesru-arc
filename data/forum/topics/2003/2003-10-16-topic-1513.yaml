        text: "1. В начальной теме было вами написанно - \"Наибольший интерес для нас представляет выступление Blues Shacks совместно с Алексом Шульцем, величайшим гитаристом современности!\" я что то не вижу слова \"блюзового\" (пардон за буквоедство) хотя по моему \"великими блюзовыми\" являються другие - скажем Альберт Кинг и Гейтмаус Браун и Френк Заппа :-)) \n\n2. Почему людей раздражает слово виртуоз?\nУ кого предпочитаете лечиться у посредственного врача или у виртуоза?\nВиртуозность, мастерство, желательно (по моему) во всем, даже в сексе(изучайте Кама Сутру и Пучур Веда) но это же не значит что нужно заниматься любовью БЫСТРО как заяц.\nМне кажеться что Алберт Кинг и Алберт Колинз не хуже виртуозы чем Стоколо Розенберг или МкЛохлин (в чувство и мыслеизложений), а ШУЛЬЦ и ШТИРЛИЦ мастера другого калибра, несомненно на порядок лучше чем Бюск и Мюрид.\n\"Виртуозность вообще ничего не значит\" это самозащитная фраза не виртуоза! \n\n3. Мне кажеться что если человек серезно любит гитару то он не может бить равнодушным к разным стилям также как медик (хороший)к разным ответвлениям биологии и рукопашный боец к разным стилям мордобоя.\nТак что сегодняшному хорошему блюзовому студенту не плохо бы позаниматься фюженом (класик-джаз-рок-фанк-соул-кантри-уорлд и т.п), это не только мое мнение, так преподают в Беркли, ЛАМА и других гитарных институтах мира. Каждый год выпускаются сотня профи гитаристов из которых 3-4 супер гитаристы покруче Шульца (Матю скофилд, Гатри Гован, Дэйв Килминстер, Карл Вархейен и другие которых вы может быть и не слышали).\nЛюбите Шульца на здоровъе он отличный гитарист, но не надо навязывать читателям что он \"самый великий и ужасный\" и извиняюсь за роль Тотошки который доказал иначе."
