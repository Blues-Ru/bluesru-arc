      text: "- один из лучших сегодняшних БЛЮЗОВЫХ, гениальный, потрясающий и пр. в чем мы еще раз позавчера убедились. Это не самомнение, а собственное мнение (как гитариста, в частности), если что-то там не расслышали, это не моя проблема. Настоящих и крутых Самлина, БиБи и Бадди в нашей стране нас начинают любить через месяц после ознакомления с блюзом и продолжают любить до конца жизни. Но, увы, главным образом потому, что список на полке с компакт-дисками ограничивается 20 наименованиями. Это - величайшие, но - самые попсовые (в хорошем смысле) блюзовые музыканты. У них далеко не все альбомы хорошие - спросите у Димы Казанцева, он, возможно, даст подробное описание качественных и некачественных номерных альбомов лучше и внимательней других. Допустим, я их послушал несколько раз, что я теперь должен перемывать в сиди-плеере сборники БиБиКинга? Или коллекционировать 125е исполнение Хучи-Кучи-Мен на очередном бутлеге Мадди? По-моему, - тупейшее занятие, если этим ограничиваться. \nЗаваливать списком фьюжн-гитаристов меня бессмысленно, они меня не трогают, а если трогают, то не больше, чем блюзовые (наглядный пример - я писал в мае про замечательного Скотта Хендерсона). Они не умеют так играть БЛЮЗ, как Алекс Шульц. Учиться у них блюзовому гитаристу - очень плохая идея. Результат, обычно, на лицо. Виртуозность вообще ничего не значит. Главное правило для хорошего блюзового гитариста - не переиграть, сформулировать свои музыкальные идеи лаконичными выразительными средствами. Для фьюжн - наоборот.\nУ меня есть компакт Боба Брозмана, также я видел его видео. Потрясающий чувак, от него крыша едет. Помимо заворотов очень круто поет и играет Роберта Джонсона. НО! Он не играет блюз так, как Алекс Шульц. Он - молодец, но просто копает в другом, неблюзовом направлении. Если бы меня по-настоящему волновала гавайская музыка, я бы слушал целыми днями и Боба Брозмана тоже."
