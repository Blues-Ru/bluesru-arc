    deleted: false
    text: 'ответа уже не сыскать. Первыми блюзы, разумеется, начали играть у нас джазмены.
      Оркестр-переполох Парнаха, например. Блюз безработного, якобы народный, но в
      обработке А.Островского, действительно был записан огркестром Утесова. После
      речи Черчиля враждебное слово "блюз" было в названии заменено на "песенка".
      Для широкой публики слова блюз и джаз были из одной кастрюли. Неизвестно, кто
      первым начал играть именно блюз (а не простую гармоническую форму, как понимают
      "блюз" в джазе). Я знаю, что на заре 60-х два Микояна и один Ордженикидзе репетировали
      блюзы - но они их копировали с пластинок Роллинг Стоунз. Группа "Удачное приобретение"
      стала первым профессиональным коллективом, строящим свой репертуар на блюзах.
      Опять-таки копировали британцев: Ярдбердз и тех же Стоунз. Однако были и другие
      группы и личности, канувшие в лету, кто пытался играть "настоящий", а не опосредованный
      британцами, блюз. И.Вдовченко, например, рассказывает, что в 70-х на прибалтийских
      пляжах стихийно бывали акустические блюзовые джемы. Кстати, в 80-х Тыныс Мяги
      достаточно много блюзов включал в свою концертную программу - на меня огромное
      впечатление произвел тот факт, что он не только знает This Is A Man''s World,
      но и замечательно ее исполняет. Понимаю, в это трудно поверить: я не умею танцевать
      - это словно другой человек.'
