  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70312211905221638&sql=An95h8qxbbtc4\n\nЕще один релиз Кинга на ABC Records. Из Лондона БиБи двинулся в Лос Анжелес. Там он встретил Таж Махала с его волшебными тубами (геликонами), пианиста Виктора Фелдмана, гитариста Джо Уолша и многих других сессионных околоджазовых звезд. \n\nНа диске всего 7 треков, но они очень хороши! Это, пожалуй, самый блюзовый альбом БиБи 70-х, но грув тут тоже присутствует. Особенно стоит отметить отличный блюз I Got Some Help I Don't Need, прифанкованную инструментальную версию Help The Poor!!! и последний трек Lucilee's Granny - инструментальный джем \"со всеми ребятами\" в отличном ритме и настроении!\n\nОценка 5 баллов! Все очень просто, душевно и с драйвом. Даже обычные блюзы здесь звучат очень интересно и убедительно. Был хороший год и настроение, а может так по душе БиБи L.A. с его великолепными студиями и музыкантами."
