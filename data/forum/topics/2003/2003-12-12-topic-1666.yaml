      text: "Может и будем выступать. \nНадо искать приличные места с хорошей публикой (как в СколдерКафе). Проблема в том, чтобы собрать нормальную зарплату для группы в СколдерКафе, например, надо чтобы пришло 60 человек! Даже если они соберуться, то они туда не влезут; а играть 3 отделения за 500 рублей не каждый захочет, согласитесь.\nМосква - это купленная клоака в плане блюзовых мест. А СколдерКафе очень хорошее, но народ туда не влезет, да и не ходит. Мы говорили на эту тему с Каверкиным (да и не только); он вроде со мной согласился. Все это на хер никому не нужно тут, из-за этого нет большого желания выступать часто. Концерт в \"столовой\" мне лично не интересен, даже если там много платят."
