            Это - музыканты, которые находятся в периоде творческого расцвета, очень яркие, сильные и пр, но они еще не успели
            заработать мировую популярность, поэтому готовы играть музыку на энтузиазме и не выставлять слишком высоких требований.
            Для примера, у замечательнейшего Джимми ДиЛейна это соотношение раз в несколько раз хуже. На его гонорар можно
            было три раза привезти в Москву Морюдов, оплатив авиабилеты и проч. Если бы мне пришлось выбирать, как ты думаешь,
            я бы сделал?

            Вопрос второй - Грета, ты была на клубных концертах Бюска, Морюдов, Шведов и Немцев, за исключением самого неудачного
            концерта Бюска в ЛеКлубе? Я - был. И с полной уверенностью прокричу, что это был именно первостатейный, потрясающий,
            крутейший блюз. Если кто-то был, скажем, в Форте на Морюдах и не согласится со мной, пусть кинет в меня камень.
            В том-то и фишка - я бы этим не занимался, если бы мне это не нравилось до потери пульса.

            В качестве антипримера - люди из Твери привезли из Германии супер-группу в конце августа, кажется, Bluesnatics,
            которую мы рекламировали на блюз.ру (и сделаем это во всех случаях, когда кто-то кого-то повезет). Я был на этом
            концерте в Вудстоке, оказалось очень скучно. То же самое будет на концертах 100 групп из 150. Я прослушал два
