        text: "Грета! Не надо путать мои музыкальные вкусы и функцию модератора. То, что спор начался с моего обмена парой\
          \ реплик с Казанцевым - ничего не значит. Есть строгие правила - разрешено все, что не запрещено. Запрещены - грубость,\
          \ хамство, неисполнение судебного решения. Нарушил правила, получил взыскание, дальше - на свободу с чистой совестью.\
          \ Оключив Диму на сутки, я применил слабейшее из возможных взысканий. В Фидо при первом таком нарушении отключают\
          \ на месяц, а потом и на год. Я очень уважаю Димины музыкальные познания, но даже ими он не заработал себе права\
          \ хамить остальным участникам. Никто и никогда не запрещал в форуме высказывать свою позицию в цивилизованной форме\
          \ - за это отвечаю. \nЯ - такой же участник форума, имею право на свое мнение по музыкальным вопросам, которое и\
          \ высказываю. Если моя манера рассуждать более занудная и въедливая, уж извините, пишу, как умею. Когда я что-то\
          \ пишу, естественно, я ставлю перед собою целью то, чтобы читатели уяснили мою позицию. ;) Если хотите что-то противопоставить,\
          \ вперед, пишите о том, что вам нравится. На блюз.ру будет опубликована любая статья о блюзе - за это тоже отвечаю.\
          \ Про ругань с выражениями - не гарантирую..."
