      text: '1) Я ничего не доказываю Казанцеву. Зачинщик не он, он просто проще других ведется и выходит за рамки. Выражения
        в стиле "заткни свою поганую харю" всегда будут расцениваться как хамство.

        2) Мы с удовольствием вешаем анонсы любых дисков, если нас об этом просят. Про диск Братецкого и Кораблина я наслышан,
        даже видел у кого-то в руках. Сам диск он обещал мне дать, но так и не дал при трех встречах. Также он мне ничего
        не говорил про дату презентации или чего-то еще, ни о чем не просил. Свое позитивное отношение к дуэту (которое в
        данном случае - не имеет значения) я выразил в отзыве о фестивале гармошки. Еще вопросы?

        3) Про диск Аграновского и Каверкина слышу впервые. Это моя вина?

        4) Про зовут. Грета, знаешь сколько я потратил своих личных денег на гастроли, которые мы делали, не говоря уж о времени
        и об усилиях? Знаешь, сколько это стоит, я же тебе рассказывал? Позволь мне самому принимать решение, на что тратить
        свое время и деньги. За последние 3 года я получил порядка 150 писем с предложением приехать поиграть в Россию. Тебе
        прислали три и ты решила, что их нужно везти. Ехать хотят все, вопрос в условиях и в желании приглашающего. Sobo,
        Dr. Ika, Papa George в списке из 150 находятся где-то на 70-х местах, на мой собственный вкус. И дело не в стилистике,
        перед ними в списке есть десятка 2-3 фолково-фьюжновых-блюз-рокеров. Я привозил лучших в Норвегии, Швеции и Германии,
        а не кого попало.

        Давай, каждый будет делать то, что ему нравится. Мы отрекламируем на блюз.ру любого достойного исполнителя, если кто-то
        его привезет. Я же привожу музыкантов не благодаря тому, что задействую свой административный ресурс, и мне только
        пальцем махнуть на этого или этого.  Просто мне это больше других это нужно, у меня есть прикол и горячее желание.
        Только благодаря этому все и получилось. У многих других, скорее всего, ничего не выйдет.

        5) На блюзовые фестивали блюз.ру и очаково в Б-2 приглашались все, кто об этом попросил. Dr.Nick не изъявил желание
        спуститься до уровня выступавших там исполнителей. Хотя, я считаю, что эта группа несомненно бы украсила праздник.
        Во время фестиваля гармоники, кажется, Dr.Nick были не форме, даже отменив какой-то клубный концерт. Кроссроадз, я
        надеюсь, приглашать в такой форме больше не будут. Почему это происходит, я писал, плюс есть еще одна конъюнктурная
        причина. Нужны еще комментарии?

        6) Уж лучше наш местечковый уровень, чем благородная ругань на этот уровень. Меню исполнителей и тарелочки с голубой
        каемочкой не будет...'
