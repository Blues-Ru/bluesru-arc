      text: "я конечно, не в курсе, но мой ум аналитика мне подсказывает, что на музыкальные фестивали посвященные какому-либо\
        \ инструменту приглашают, как правило, не посетителей сайтов, (например любителей гитары с гитар.нет или популяризаторов\
        \ барабанов с драм.ком), а инструменталистов определенного профессионального уровня.\nНепрофессионалов не приглашают\
        \ главным образом, чтоб придавать мероприятию так называемой \"местечковости\", а так же из-за естественной ограниченности\
        \ концерта по времени.\n\nкритерии профессионального уровня, как правило, определяют организаторы (такова жизнь),\
        \ и, в рассматриваемом случае, обычно более-менее неплохо это делают (я слыхал, среди них есть люди, имеющие некоторое\
