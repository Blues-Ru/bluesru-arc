    email: blackcat@blues.ru
    subject: рэп
    deleted: false
    text: 'Отношение нейтральное.

      Что такое рэп? - Ритмически построенный речитатив под музыкальное сопровождение.

      Музыка ли это? - Очевидно, да.

      Играет ли роль в блюзе? - Видимо в какой-то степени да; это две взаимосвязанные традиции в афроамериканской музыке,
      восходящие к одним и тем же корням. О чем свидетельствует, например, выпуск диска <a href="http://www.allmusic.com/cg/amg.dll?p=amg&uid=CASS70306130444&sql=Ac9e097qkkr5t"
      target="_blank">"The Roots of Rap: Classic Recordings from the 1920''s and 30''s"</a>, не где-нибудь, а на блюзовом
      лейбле Yazoo, и включающий в себя, главным образом, записи артистов, обычно относимых к блюзовой традиции.

      Другое дело, что в какой-то момент пути рэпа и блюза довольно кардинально разошлись и теперь это два самостоятельных
      музыкальных направления.

      Личные предпочтения Би Би Кинга не являются безусловной догмой, но и я сам рэп, как правило, не слушаю.'
