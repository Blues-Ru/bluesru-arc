    Что такое рэп (хип хоп)?

    Музыка ли это?

    Играет ли он какуюнибуть роль в блюзе?

    Хотелосьбы напомнить

    80% современной амереканской черной молодежи слушают или поют рэп(хип хоп).

    Б.Б.Кинг не приемлет Рэп(не смотря на то что записывался с известными рэпирами).'
  replies:
  - id: 13980
