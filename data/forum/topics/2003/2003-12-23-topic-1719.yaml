  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDSUB040312222201360122&sql=A4x1tk6jxlkrg\n\
    \nХукер на джазовом лейбле Impulse! под соусом \"The New Wave Of Jazz Is On\"\
    ! Мы-то знаем, конечно, какой из Хукера джазмен, но как это не странно, этот альбом\
    \ звучит очень органично и интересно. Джону подыгрывают только джазмены под руководством\
    \ самого Панамы Фрэнсиса, но делают это они очень деликатно и ПРИМИТИВНО, этим\
    \ самым они отлично вписываются в монотонный и психоделический стиль Джона. Bottle\
    \ Up And Go, Sugar Mama, Decoration Day, Money, Serve You Right To Suffer - классные\
    \ треки с этого альбома! \n\nОценка 4 балла. Местами джазмены уж слишком монотонны,\
    \ а кое-где и Хукер почти засыпает. В целом же это необычный, редкий по исполнению\
    \ и необходимый в каждой коллекции альбом Джона Ли!"
