  text: 'Вот купил нового Питера Грина в Союзе. Пока не слушал. Послушаю, напишу.


    А вот отслушал альбом Тажа 86 года. Попсовый такой. Ритм-н-блюз, регги, островная
    музыка. Но есть один джамп-блюз Deed I Do (Федору бы понравился). Есть великолепная
    блюз-баллада Soothin''. В общем альбом веселый, к блюзу имеет очень далекое отношение,
    но качество исполнения и душевность на высшем уровне (как всегда у Тажа).


    Вообще в Союзе большие изменения. Много музыки по доступным ценам, много новинок
    (особенно в наших любимых разделах Блюза, Фанка и Соула).


    Ну и наконец начали переиздавать на СиДи Билла Уизерса, и я уже купил два в том
    же Союзе. Всего по 390 рублей (хорошая тенденция, учитывая редкость и свежесть
    переиздания).


    Вообще должен сказать, что купил более ста разных альбомов за последние два месяца,
    но нет времени обо всем писать. Купил почти всего Тажа (включай саундтрек Brothers)
    и могу сказать одно - у него просто нет плохих альбомов (особенно в 60-х и 70-х.


    Будет время напишу о других замечательных (и иногда редких) пластинках.'
