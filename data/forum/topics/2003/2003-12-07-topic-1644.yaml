  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDCASS70312062120222714&sql=A4djb7i72g75r\n\
    \nЭто третий альбом Питера на Artisan Recordings / Snapper Music. Опять супер-обложка,\
    \ классный современный дизайн и на этот раз диск записан в формате HDCD! \n\n\
    На этом альбоме только две чужие композиции: Madison Blues и There's A River,\
    \  остальной материал написан участниками Splinter Group! Грин написал только\
    \ два трека: Tribal Dance (его старый инструментал) и 13-ый трек, который не заявлен,\
    \ - это инструментальная версия Man Of The World идет в качестве сюрприза после\
    \ последнего 12-го трека. Основные же треки написаны Роджером Коттоном, Найджелом\
    \ Уотсоном и Питером Страудом. Ребята из Сплинтера умеют не только играть, но\
    \ и СОЧИНЯТЬ, а это прекрасно и мы долго этого ждали! В итоге получился классный\
    \ альбом со своим лицом и звуком. Блюз, блюз-рок, ритм-н-блюз. Замечательная музыка!\
    \ Хотелось бы выделить лучшие треки: Heart Of Stone, Tribal Dance, Burglar (лучшая\
    \ на альбоме), Indians.\n\nОценка 5 баллов! Хороший альбом со всех сторон!"
