      text: "Так, мельник-то, это - тот же Эфес. А, вообще говоря, флаг всем пивным\
        \ компаниям в руки! Меня радует то, что растет интерес, а следовательно и\
        \ уровень фестиваля - на Эфес в первый раз такие крутые музыканты едут. \n\
        Очень бы хотелось надеятся на то, что потратят побольше денег и времени на\
        \ отстройку звука. Тут ведь какая тонкость, организаторы Silence Pro выполняют\
        \ заказ Эфеса, отчитываются по количеству рекламы и пр., пиву нужна, в первую\
        \ очередь, та же реклама. А вопросы типа звука и того, что, собственно, происходит\
        \ во время концерта, всех организаторов не очень волнуют, лишь бы афиши по\
        \ городу висели. Но я ооооооооочень надеюсь, что в этот раз будет по-другому.\
        \ ;)) Ура!"
