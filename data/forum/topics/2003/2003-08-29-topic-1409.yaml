  text: 'Нередко ТВ рекламе можно услышать очень интересную музыку, в частности, блюзы (почему-то чаще всего с акустической гитарой и со слайдом).

    Помню одну из первых на нашем ТВ: в 1993-94 гг. ролик Suprimex (парень работает рубанком, весь в поту и в стружках. И тут заходит его подруга, тоже такая горячая...). Играло 3-4 акустики и гармошка.

    Давняя реклама Дирол или Стиморол (парень и девушка жуют жвачку и целуются, увидев это старик берет жвачку и пристаёт к своей старухе). Тоже блюз играл.

    Реклама, кажется, кофе Maxwell House. И вот недавно: мобильный телефон Siemens C-55 (женщина записывает кудахтанье индюка на мобильник в качестве рингтона). Звучит такой заводной трек.

    Это лишь маленькая толика того что я сейчас вспомнил, а вообще таких рекламных роликов было много.

    Я никогда не мог узнать кто же это там играл.

    Если кто знает кто это играл, прошу, просветите. Буду очень благодарен.'
