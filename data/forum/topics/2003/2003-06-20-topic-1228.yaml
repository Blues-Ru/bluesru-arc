                text: "купила этот \"Огонек\". Вполне ода дьяволу получилась :) \nЕсли у тебя ещё нет журнальчика, могу отсканировать и pdf-чик прислать :) \nВполне все честно, а где-то скрытый смысл с точностью до наоборот.. игра с дьяволом, что поделать. Сложно только согласиться с тем, что юмористы у нас люди замечательные, прекрасные и великие. Слабо верится, чтобы Док сказал такую фразу..\nВот еще Гордон в \"Другом\"(июнь'03) на тему голубого экрана и сознания массового зомби: \n\"ИМ(Игорь Мальцев): То есть вы работает демоном. Ставите людей в ситуацию плохо преодолимого нравственного выбора?\nАГ(Александр Гордон): Во. Точно. Я работаю демоном.\nИМ: Или бесом Достоевского?\nАГ: Пройдите по коридорам телецентра и посмотрите на эти лица: вот где бесы. Бесов вы не видели. Достоевский просто отдыхает.\nИМ: Спасибо, я здесь уже работал. Основное ощущение от \"Останкина\" - это то, что оно высасывает все жизненные соки, даже если не работать, а просто здесь находиться. \nАГ: Здесь чудовищная аура. Это все от коллективного тщеславия, конкуренции, жажды денег, ну и, конечно, плюс электромагнитные потоки, которые пронизывают здание\"..\n..сказал он, и отправился делать новую совместную программу с одним из проправительственных tv-лицеедев."
