        subject: В целом да, хорошо,
        deleted: false
        text: '"Blues Cousins" бы ещё научиться играть потише и со вкусом. Нет, молодцы ребята, конечно, ничего не скажешь.
          Работоспособность и амбиции ого-го какие, но как-то всё это грубо и безвкусно.


          Впечатлили "Сколдеры". Я их слушал в сольном варианте второй раз (первый раз - два года назад). Так вот, на мой
          взгляд, прогрессия просто офигенная. Настолько всё грамотно, слаженно, звонко (в хорошем смысле слова). От их выступления
          просто ведёт! Тогда в "Черчильс пабе" SB показались мне каким-то скучноватым клоном "Dire Straits", John Fogerty
          etc. Сейчас, пожалуй, можно сказать, что это на настоящий момент один из наших наиболее профессиональных коллективов.
          Сыгранная вкусная программа, шоуменство на хорошем неназойливом уровне. Раскрутки им не хватает. Может быть, наглости.
          Кто их знает? Да не в обиду им будет сказано, по большому счёту единицы. И это не есть хорошо.


          Братецкий & Кораблин. Заняли практически пустующую акустическую нишу. Вчера, правда, мне их выступление показалось
          каким-то суетливым что ли. Надо сходить на них ещё.'
