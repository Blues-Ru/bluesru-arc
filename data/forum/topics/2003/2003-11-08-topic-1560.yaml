    text: 'Начали хорошо, очень хорошо. Доктора и Братецкий зажгли, потом Некрасов с французом Антуаном - класс. Понравился Кораблин, Жук пилил как всегда суперски. А вот у Некрасовского гитариста вокал мне не очень... Или просто не было слышно.

      А потом скучновато было. Г-н Козловский загнал (ИМХО) все три песни.

      "Кроссроудз": сначала нормально, потом утомили. Фестиваль все же харперский, а казалось будто на концерт "Кроссроудз" пришел. Сие не есть правильно.


      В общем, больше надо было харперов! И было бы совсем замечательно.'
