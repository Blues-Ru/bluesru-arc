    text: 'А что случилось с Кожекиным? Он был после вчерашнего или перед сегодняшним? Никого не хочу обижать (здесь модно так говорить), но мы от него ждали большего. Жук рулит, as usual :) Первые (ломливо смотреть кто, извините, плохая память на имена) двое малтшиков очень понравились, следующие за ними...тоже :) Гитаристу Вове мои отдельные с кисточками :) Кстати, Кожекин мне сказал, что будет в Крымских Каникулах вчера. Наглая ложь, господин, хотя всё равно было круто :) Вчера была обстановочка более блюзовая, господа. (для незнающих -- рулезное продолжение последовало восьмого в клубе Крымские Каникулы).

      В общем респект общий, всё равно :)

