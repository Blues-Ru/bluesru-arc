    deleted: false
    text: 'У меня самое сильное впечатление от Blues Doctors - они за два месяца еще прибавили, супер, одна из немногих настоящих блюзовых групп у нас. Братецкий с Кораблиным выступили очень качественно. Некрасов с Лебедевым играли очень профессионально хорошую босса-нову и прочую бразильскую музыку. В этом качестве Некрасов играет куда более естественно, а его прошлогодние попытки играть блюз в стиле Тилиманса мне явно не понравились - непонимание стилистических различий и пр. Воронов играл очень долго, гораздо лучше обычного, собранно и пр., сам сыграл несколько действительно хороших блюзовых соло, хотя после Блюз Докторз публика от Кроссроадз немного подзавяла. Мощный ритм-н-блюзовый звук как с МТВ, но блюзовой бодрости у Кроссроадз было явно меньше. Вокалистка Катя спела плохо - у нее проступила главная проблема женского блюзового вокала - вместо того, чтобы "чувственно", естественно и лирически петь блюз, она пыталась "демонически" покрикивать как Дженис Джоплин, изображая ненормальную роковую женщину. ;) Ну это - всеобщая проблема.

      Все написанное - на мой личный вкус, чтобы никто не обижался. На мой взгляд фестиваль был более качественным, чем раньше, ибо вместо парада всех гармонистов, бардака и пр., несколько групп играло свою отработанную программу, получилось более качественно. (Кстати, очень хорошо, что так и не вышел Гегарт).

      После фестиваля я послушал одно отделение Хендерсона в Форте - все было похоже на <a href="/artist/scott-henderson/gigreview.html">майский концерт</a> - так же качественно, наворочено, забойно и громко. Это - не "моя музыка", но послушал я с огромным удовольствием.'
