    text: "Товарищи форумчане! Похоже что я нашёл (с маленькой помощью моих друзей\
      \ с www.beatles.ru).\nНа http://www.allmusic.com/cg/amg.dll?p=amg&uid=CASS80305170055&sql=A9ev8b5x4tsqk\
      \ сказано:\nMcGough & McGear. Одноименный альбом.\nMike McGear (Michael McCartney)\
      \ это родной брат Paul McCartney. Пол был продюсером этого альбома, а Джими\
      \ играл в последней вещи  \"Ex-Art Student\" на гитаре (естественно)!!!\nMcGough\
      \ & McGear\nMay 17, 1968 (release) LP Parlophone 7047\nJack Bruce  -  Bass \n\
      Dave Mason  -  Sitar \nPaul McCartney  -  Producer \nMike McGear  -  Vocals\
      \ \nRoger McGough  -  Vocals \nJimi Hendrix  -  Guitar \nGary Leeds  -  Drums\
      \ \nBarry Fantoni  -  Saxophone \nВот некоторое описание альбома:\n\"Far from\
      \ being just a Beatles-related curiosity, McGough & McGear is a fine (and rare)\
      \ album deftly combining poetry, comedy, and a good amount of solid pop-psychedelic\
      \ rock.\nThe record also boasted a roster of all-star guests, including, unsurprisingly,\
      \ Paul McCartney; McCartney's then-girlfriend, actress Jane Asher; Jimi Hendrix,\
      \ who adds cool psychedelic guitar to \"Ex-Art Student\"; the other members\
      \ of the Jimi Hendrix Experience; John Mayall; Zoot Money; Graham Nash; Spencer\
      \ Davis; ex-Pretty Things drummer Viv Prince; ex-Yardbirds bassist Paul Samwell-Smith;\
      \ Dave Mason; Gary Leeds of the Walker Brothers; and yet more names that will\
      \ be known to aficionados of swinging London, like Margaret Asher (Jane Asher's\
      \ mother) and socialite Prince Stanislaus Klossowiski de Rola. The Beatles'\
      \ official biographer, Hunter Davies, wrote the liner notes.\nThe album was\
      \ largely recorded in the summer of 1967, but not completed and released until\
      \ the following year. It's been reported that it was intended for issue on the\
      \ Beatles' new Apple label, but in the end it appeared on Parlophone (the Beatles'\
      \ standard record company). The album went little noticed, and was only briefly\
      \ reissued on CD before it went out of print again.\"\nКажись та заметка в книге\
      \ Blues Who's Who (см. моё сообщение в форуме за 22 мая 2003) смахивает на правду?.."
