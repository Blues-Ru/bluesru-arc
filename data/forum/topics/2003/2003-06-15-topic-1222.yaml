          and the Detroit Wheels, Buddy Miles Express, Cactus и The Rockets. Я из
          пригорода Детройта и живу в том же городе что и Jim Mccarty, и беседовала
          с ним не единожды. Он играет в местной блюзовой группе "Mystery Train" и
          это просто поговорить с ним в клубах, где он играет..."

          Да уж!.. ещё раз. Вот так вот запросто побеседовать с такими музыкантами...

          В этой связи вспоминаю, что когда я был в Англии, недалеко от Бирмингема,
          мне сказали что всего в 8 милях живет в своём доме Роберт Плант. И что он
          как нормальный человек, иногда, заходит в паб выпить пива, пообщаться с
          людьми которых он знает с детства (он-то сам из тех мест). И вот я на полном
          серьёзе намеривался взять фотоаппарат, поехать туда и "пасти" когда он пойдёт
          в паб. Собирался подойти и сказать: мол, салам тебе из Ашхабада. - А где
          это? - Недалеко от Кашмира... :-)

          Да уж!.. в третий раз. Тут-то бы меня и взяли б "боббики", заподозрив в
          связи с пакистанскими экстремистами :о)

          А ведь и на самом деле собирался, вот только не было на это времени.

          Да уж!.. в который раз. Так бы ходил и хвастал что я пил с самим Плантом.
          Не могут, мол они там, пить водку с пивом :)))'
