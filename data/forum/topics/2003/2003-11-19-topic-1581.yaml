        text: "Места действительно оказалось впритык... Я сам с супругой весь консерт простоял в партере от и до... (стоял кстати немного за вами, хих). Было тесновато, но то что не пройти - это ты брат, перегнул. Во время концерта я несколько раз ходил за пивом и без особых проблем возвращался с ним на прежне место. Тесновато - да, но не давки не было...\nО музыке.\nДжерри действительно здорово вставил, как грицца... аго акустик блюз сразу прокачал публику... Не знаю, в том году меня Луизиана Ред совсем не зацепил, правда тогда я слушал его далековато, с трибуны...\nКларк был тоже хорош! Но на мой взгляд басов и ударных в его бэнде было многовато, порой он звучал как хард-рок, гармошку в партере было очень плохо слышно... На своем последнем диске он звучит на порядок приятнее. \nНу а Румфул - это профи высшей пробы! Единственное, на мой взгляд у лидера группы не самый сильный вокал, но зато он компенсировался умением держаться на сцене и великолепной игрой на губной гармошке.\nА духовые - просто бест! Одни положительные впечатления. И то, что коллектив сильно сыгранный - ничего в этом плохого не вижу. \nНадо кстати будет к тебе, Вадим, заехать. У тебя там не завалялся Румфул Оф Блюз?\nЧестно говоря, в конце выступления Кларка я начал было немного позевывать, но Румфул задали такого драйва, что ноги сами пустились пританцовывать, жаль в партере было тесновато и не развернуться. \nБыл очень приятно удивлен, что музыканты остались после концерта и минут сорок, а то и больше раздавали автографы, пока всех желающих не удовлетворили. (в том году - не знаю как было - мы с тогда ушли чуть раньше). Я сам подходил к каждому раза по три - пока все что было - не подписал. Гыг... А у Кларка я тоже подписал его собственный диск - чему тот был несказанно удивлен.\nАвтографы ставили на все подрял. На билеты, плакаты, в зап. книжки, девушкам (сам видел) на приоткрытую грудь... А одна деваха - клянусь - стоял рядом - забралась на сцену - спустила брюки - оттопырила голую задницу и сказала - а меня сюда, плиз. В осадок чуть не выпали не тока музыканты, но и любители автографов...\nА пиво было очень даже ничего, тока очень холодное.. Горло до сих пор побаливает.\nЭтот Фестиваль - лучший! Однозначно! (правда я был тока в прошлом году. хих)\nЭх, хорошоооо!"
        inferred_person_id: 698
