        text: 'Как рокабилл и свингер (в смысле, свинговый музыкант, а не то, что кое-кто мог подумать :))), позволю себе заметить вот что. Мистер Джерри Рикс местами по приемам игры на гитаре очень близок к старому рокабилли. Это на заметку и Вам, Федор, а также всяческим чудакам на букву м, которые тут любят говорить слова вроде "ракабили", совершенно не пытаясь вдаваться в их смысл. И именно поэтому Рикс лично мне оч понравился. И вдобавок ко всему, лично мне было чертовски в кайф увидеть настоящего парня с Юга, который по-настоящему играет фингерпикингом. Даже несмотря на то, что этот парень - негр :)))


          А что до его выстуаления на фесте. Вот в Питере, скажем, он зажег по полной (ИМХО). Но все равно, такая музыка, как у Рикса - слишком камерная. И на большом мясном концерте может и не прокатить. Вот Вы говорите про Роберта Джонсона. А ведь Вы же никогда не слышали его вживую! Откуда ж Вы знаете, а вдруг и у него лажи, окажись он вдруг на Эфесе, было бы - хоть отбавляй? Да и вообще (опять же ИМХО) те "110 исполнителей из 500", которых мы знаем сейчас (по Вашим словам), дошли до нас не столько по причине своей музыкальной исключительности, а просто потому что им повезло чуть больше, чем остальным 390. Вот заглянул Алан Ломакс в некую тюрьму и нашел там Ледбелли. И теперь мы его знаем и любим его Rock Island Line и Pick A Bale Of Cotton. А как бы не шлялся чувак по тюрьмам, или шлялся бы, но не заглянул бы в ту самую - и не знали бы мы никакого Ледбелли, а знали бы кого-нибудь другого, и песни были бы тоже другие.'
