  - id: 15610
    parent_id: 15594
    date: 2003-11-19 18:35
    poster: Федор Романенко (fedor)
    email: fedor@blues.ru
    subject: Из Питера пишут
    deleted: false
    text: "Во вторник на целый вечер Питер стал столицей блюза\nВеликолепные Блюзмены, шикарный звук, много пива...\n \nНо есть ряд замечаний к устроителям фестиваля:\n1 Мы подъехали к Юбилейному в 18.40., но смогли попасть в зал только через час. Просто ох......но,\n7000 человек проходят через кордон \"санитаров города\",\nчерез 2 двери по одному человеку, причем на входе всех подвергали обыску, похожему на личный досмотр на таможне. Это всё походило на генеральную репетицию наших доблестных органов перед предстоящим концертом АЛИСЫ.\n2 Пиво, которое продавали на арене заметно отличалось по вкусовым качествам от того, которое продавали в вестибюле.(подозреваю, что его разбавляли водой)\n3 Почему так недолго выступал Jerry Ricks?????????\n \nДмитрий.\nCoBB@Front.ru"
    replies:
    - id: 15643
      parent_id: 15610
      date: 2003-11-20 02:45
      poster: Вадим  (AVA)
      email: vad2908@mail.ru
      subject: поделюсь и я ...
      deleted: false
      text: "..я, например, предупрежденный Сергеем (VolD), приехал со своим другом к \"Юбилейному\" минут в 20 седьмого - прошли спокойно, хотя сумки ошмонали, извинились правда, даже на них (ментов) не похоже.\nПива не пробовал, когда вошли в зал, я увидивился, что примерно половину зала отгородили (уполовинили!), ведь места не хватит! Но у устроителей мероприятия свой резон (а места, кстати было впритык!).\nВстретившись с друзьями, я подошел как можно ближе с сцене (ведь первым по традиции был акустик-одиночка), что бы можно было рассмотреть всё детально. \nДжерри с первых же аккордов \"вставил\" так, что не \"отпускало\" до конца всего действа. Между песнями он рассказывал (на инглиш ес-но)\nкакие-то короткие байки (народ, знающий язык - смеялся) и при этом очень лихо перестраивал гитару под разные вещи. По мне так, если бы он (Рикс) отыграл все четыре часа, вообще было бы в кайф. Зал, кстати, активно его поддерживал (хлопками, криками и даже пением в некоторых местах).\nКогда на сцену вышел Кларк, я попытался было ретироваться подальше на сидячие места (там мне стойко \"держал\" место мой приятель), но не тут-то было. Народу набилось столько, что пошевелиться можно было и то с трудом!\nЗвук, кстати, был очень даже неплохой (гораздо лучше, чем на предыдущих Фестах). Сам W.C. - великолепный вокалист (ближе к soul) и очень, очень выразительный гитарист (ближе к boogie). Особеннно меня пробила тема (не знаю названия), в F-7, где он солировал \"застывшим аккордом\" - ритмика - просто супер! Бэнд, правда, у него - не тянет такую музыку играть. Но зал они все же плясать заставили (правда не весь - пиво еще не все было выпито к тому времени).\nВ перерыве я ушел таки наверх к другу своему - и очень правильно сделал, т.к. звукореж врубил звук на всю катушку (я сидел как раз над пультом).\nRoomful оставили двойственное впечатление. \nС одной стороны - прекрасно сыгранная свинг-машина, с другой - слишком сыгранная!!!!!\nПианист и тенор-сакс мне лично раскрылись только в одной теме, трубач и гитарист, наоборот - все супер. Барабаны - очень точно, очень ровно, как по нотам. Бас катил без перерыва - мощно и достойно.\nВокал, по-моему, слабее, чем был раньше (напр. на альбоме Under the Roof - 97).\nКонцертное шоу есс-но отличается от студийных работ, может именно поэтому у меня случилось \"раздвоение\" чуйвств.\nНе смотря ни на что - этот Фест мне понравился больше предыдущих.\n(Зал больше, народу еше больше - много молодежи, что оч хор,)\nА главное - что на Фест приезжают такие разные классные исполнители вечно молодого жанра (см. Blues).\nИ в заключении, о своей маленькой радости:\nПосле концерта (кстати в этот раз не было \"джемовой\" темы почему-то) музыканты, потрадиции вышли на сцену и стали бросать в зал сувениры и раздавать автографы. Я пробился таки к Риксу и он (сильно, правда, удивившись) \"подмахнул\" мне автограф аж на ЧЕТЫРЕХ ДИСКАХ. Подарю друзьям и соратникам. Во!"
