  text: "о том, что нам нравится и что же это так тесно стало в Вудстоке после нескольких\
    \ джемов. \nПублика, натюрлих, приходит очень даже!\nВыходишь на сцену и хочется\
    \ выдать нагара, и что клёво ведь, принимают эту самую \"нагара\" как свои же\
    \ нервы. То есть с чувством. То есть с полной отдачей. Народ-то у нас не прост,\
    \ как видно. \nЗамечу, среди новых гостей появились молодые музыканты, о которых\
    \ известно по realmusic.ru. Ребята не теряют времени даром. Это здорово!\n Мальчик,\
    \ лет малых, вообще перебил все мои ожидания. Чей это был детёныш?! \nЖивём, стало\
    \ быть, ребята."
