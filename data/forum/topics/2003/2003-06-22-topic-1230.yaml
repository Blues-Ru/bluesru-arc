    text: 'Лаки играл с великими еще с младых ногтей. продюсером его первой пластинки был, видите ли, Вилли Диксон. А счастливчику было тогда пять лет. А вот пластинку нынешнего года продюсировал видный деятель фанковой музыки и прифанкованого джаза Bill Laswell. И другой деятель немаловажен: former Parliament/Funkadelic drummer Jerome "Bigfoot" Braily. Отсюда и абсолютно неблюзовое наполнение альбома. И Лаки понять можно: ему хотелось чего-то новенького. а вот зачем фанкоделическим деятелям голос и гитара Лаки - абсолютно непонятно.'
