      text: фанк или по крайней мере его отголоски появились на альбоме 2003-го года у Lucky не впервые. Первые фанковые опыты LP относятся к концу 80-х началу 90-х годов, когда он сотрудничает с Уинтоном Марсалисом и Эттой Джеймс. Однако, лишь сейчас фанк захлестнул музыканта через край. Пластинка оказалась не слишком удачной как с точки зрения поклонников блюза, так и любителей фанка. Видимо, пора двигаться в обратном направлении.
