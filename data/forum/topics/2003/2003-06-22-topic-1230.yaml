  text: 'Lucky Peterson «Ridin’». Очень сочная и воистину блюзовая, хотя и чрезвычайно разнообразная пластинка. Это одна из первых (1984 год) работ Lucky, однако уже тогда ему удалось какое-то время поиграть с самим B.B.King. Тогда Lucky Peterson ещё не «злоупотреблял» гитарой, а промышлял исключительно играя на клавишах (почему то вспоминается сразу Jimmy Smith), что чрезвычайно хорошо позволило проявиться его таланту. Виртуозная заглавная «Ridin’», неторопливый блюзец «Don’t Answer The Door», «Farther Up The Road» и «Little Red Rooster» c обильным органом.


    И вторая пластинка Lucky Peterson -  “Black Midnight Sun” (2003)

    Альбом весьма близок к фанку. Занятна достаточно пафосная вещица «Lucky In Love», чем-то напоминающая Eric Clapton. «Булькающая» песенка «Talkin’ Loud And Saying Nothing» пера James Brown тоже заслуживает внимания. А больше, пожалуй, и выделить нечего. В общем, как-то серенько и никак :('
