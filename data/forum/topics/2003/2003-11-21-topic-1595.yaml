                subject: жж vs blues.ru/blog
                deleted: false
                text: 'Поднять популярность идея правильная, только вот не верю я в рекламу своего сайта на своем сайте. :)

                  Далее по пунктам:

                  1. Даже учитывая то, что в жж я почти не пишу, и на сайте моем одни лишь картинки, судя по логам, на него
                  (сайт) регулярно заходят из жж. То есть популярность поднимается.

                  2. Размывания темы в жж как раз-таки не происходит, потому что в своем журнале ты абсолютный хозяин. Пишешь
                  про то, что хочешь, и комментарии тоже можешь регулировать.

                  3. Бантики из жж в куда угодно работают запросто. Все же транслируется через RSS.

                  4. Самое же главное - аудитория, несравнимая ни с каким сайтом. Любой мало-мальски интересный текст немедленно
                  обрастает комментариями, а автор, написавший один или несколько подобных текстов - друзьями.

                  На этом пропаганду жж я сворачиваю. :))'
