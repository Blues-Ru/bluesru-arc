  text: 'Всех с наступившим!


    Приобрел тут очередную порцию ДВД-музыки, есть кое-что и по блюзу.


    Купил-таки Alexis Korner And Friends Live in Marquee 1983.

    http://alexis-korner.net/1983dvd.htm

    Хотя Корнера я не люблю, но это видео мне понравилось. Его роль там не велика. Трое ребят из Стоунз (Уоттс, Уайман и Стюарт)
    делают все великолепно. Черная девушка Руби Тёрнер прекрасно поет. Дудки интересные. Звук отличный и видео тоже. Редкая
    вещь, но попалась и я купил. Советую.


    Фредди Кинг хоть и умер рано, и записал мало, но на видео его много почему-то. У Клепикова есть отличный концерт, и вот
    я купил еще один: Freddie King In Concert, Dallas, Texas, Jan. 20th 1973.

    Бодрый и улетный гиг в телевизионной студии. Он, два клавишника, басист и драммер. Блюз, фанк и энергия. Хорошая запись
    для тех лет. Тоже советую.


    Ну и наконец, новый ДВД-альбом Ерика. Все его ругают, но я бы не стал торопиться. С ним Стив Гадд, Билли Престон, Натан
    Ист, Дэвид Санчес, Грег Филлингейнс, и они делают отличную музыку вместе с Клэптоном и Andy Fairweather Low. Много блюза
    в программе. Все красиво и качественно. Советую только тем, кого не тошнит от ЕС вообще и от его пост-Unplugged периода.


    Вот как-то так пока. Держите хвост бодрей!'
