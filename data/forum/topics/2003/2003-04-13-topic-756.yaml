      text: "А я вчера в СОЮЗе купила две пластинки Taj Mahal - кроме детского ещё и \"Hanapepe Dream\"(2001) с The Hula Blues\
        \ Band. Странно, но гавайский \"Hanapepe Dream\" мне показался сначала менее ярким, чем, скажем, предыдущий \"Sacred\
        \ Island\". Но потом прониклась. Люди с ним играют замечательные и на инструментах \"правильных\".. Там есть довольно\
        \ интересная версия \"All Along The Watchtower\" Дилана, и красиво сыграна \"King Edward's Throne\" (явно без травы\
        \ не обошлось :). Отличная пьеса, несмотря на то, что и текста в ней всего две строчки: \nLove, love, love alone\n\
        Caused King Edward to leave his throne\n(слова народные :)\nВдобавок там же нашла две пластинки John'a Hammond'a -\
        \ \"Mileage\"(1980) и \"Trouble No More\"(1993). \n\"Mileage\" очень понравился! Хэммонд гениально, как всегда, спел\
        \ известные стандарты, на пластинке очень живая гармоника Джона и этот привычный живой голос. На гармонике он играл\
        \ и в ранних своих альбомах, но, видимо, со временем значительно усовершенствовал технику и качество игры. Отличные\
        \ версии \"My Babe\", \"Seventh Son\" и \"Help Me\". Искренне рекомендую тем, кто не слышал..\n\"Trouble No More\"\
        \ тронул меньше, несмотря на то, что спродюсировал этот альбом J.J.Cale. Джон здесь звучит каким-то немного уставшим,\
        \ отрешенным от всей предыдущей и последующей деятельности - возможно, это только первое впечатление.\nА Уизерса там\
        \ уже нет, и когда будет, и будет ли вообще - неизвестно :("
