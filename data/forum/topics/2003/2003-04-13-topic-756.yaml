  deleted: false
  text: 'Заехал в СОЮЗ на Ленинском и купил ВСЕ альбомы Donny Hathaway (их всего три, он умер в 79-ом).

    Очень советую изучить творчество это певца. Один из лучших людей в черной музыки; рядом с ним можно поставить только Стиви
    Уандера, Кёртиса Мэйфилда и Эла Грина, пожалуй. Невероятная музыка, других слов просто нет! Все три альбома разные, и
    это интересно.

    В СОЮЗе очень много новых пластинок в соуле и блюзе. Отличные американские издания. Еще взял Мэйалла 75-го всего за десятку
    - очень приятно.'
