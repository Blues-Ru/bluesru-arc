        email: skvoid@mail.ru
        subject: вот
        deleted: false
        text: "Первые 4 диска - это известная Антология (ее еще на ТВ крутили) - по два фильма на диск. А пятый диск самый\
          \ \"вкусный\" и ценный с позиции коллекционеров и фанатов Битлз :) \nЕго содержание:\n\nRECOLLECTIONS-June 1994\
          \ \nPaul,George and Ringo spend a happy summer's day together;singing \nplaying and warmly remembering early days\
          \ of room sharing, \nhaircuts,Beatleboots,first cars and meeting Elvis.Songs they \nperform are Baby What You Want\
          \ Me To Do,Raunchy,Thinking of Linking,Blue Moon Of Kentucky and Ain't She Sweet. \n\nCOMPILING THE ANTHOLOGY ALBUMS\
          \ \nPaul,George,Ringo and George Martin detail the process of how \nthey chose the tracks for Volumes 1,2 and 3-and\
          \ George Martin \nplays back the tape of the seminal first-take of A Day In The Life. \n\nBACK AT ABBEY ROAD-MAY\
          \ 1995 \nReturning to Studio 2,Paul,George,Ringo and George Martin reflect \non recording Golden Slumbers,I'm Only\
          \ Sleeping and Tomorrow Never \nKnows at Abbey Road studios in the Sixties and some of the inventive techniques\
          \ used in creating these recordings. \n\nRECORDING \"FREE AS A BIRD\" AND \"REAL LOVE\" \nPaul,George,Ringo and\
          \ Jeff Lynne reveal how they were able to \nproduce the two new Beatles tracks from John's original demos \nprovided\
          \ by Yoko.This section includes intimate footage filmed in \nthe studio during the recording of the tracks. \n\n\
          PRODUCTION TEAM \nNeil Aspinall,Derek Taylor,Geoff Wonfor,Chips Chipperfield and \nother key members of the Anthology\
          \ production team explain the \nprocess of how The Beatles Anthology series was created. \n\nMAKING THE \"FREE AS\
          \ A BIRD\" VIDEO \nAn intriguing insight into how the Grammy(Reg.T.M.)award winning \nvideo for Free As A Bird was\
          \ made.Director Joe Pytka explains \nhow he and Apple developed the concept and discusses the innovative techniques\
          \ that were used in the production. \n\n\"REAL LOVE\" VIDEO \nThe video that was not featured in the series,now\
          \ remixed in 5.1 \nSurround Sound. \n\nКстати, есть версия NTSC и PAL, я в Легионе купил NTSC... Подозреваю, что\
          \ ПАЛ для наших граждан все-же лучше."
