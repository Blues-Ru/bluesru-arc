  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=CASS70308172028&sql=Al4he4jn70wa4\n\nВ какой-то из рецензий на АК я писал о \"сливках\". Этот альбом очень близок к этому понятию. \nОн уже не на Стаксе, а на лейбле Tomato.\nПредыдущий - The Pinch - был возвращением на Стакс, именно его я считаю лучшим альбомом АК.\nНазвание New Orleans Heat говорит само за себя, но тут не просто ЖАРА, но сам эпицентр мощи новоорлеанской музыкальной тусовки (разве что Доктора Джона не хватает).\nИ так, продюсер - сам АЛЛЕН ТЮССО! Играют тут двое из Meters - Джордж Портер (бас) и Лио Носентелли (гитара), играет и сам Тюссо. Играют и другие люди, много дудок, есть струнные и даже дамы на подпевках.\nПесен мало - 9 - альбом довольно длинный - 42 минуты.\nНачинается с великого хита - Get Out Of My Life Woman (вещь Тюссо, один из главных хитов Ли Дорси). Что тут еще говорить, все супер!\nВторая вещь - культовая для любого блюзмена и блюзрокера - Born Under A Bad Sign (написана Букером Ти., главный хит самого же АК). Великолепный вариант этой вещи тут.\nДальше идет The Feeling. Кто-то может сказать, что это копия The Thrill Is Gone (хит у БиБиКинга), но разве это плохо? Обе вещи написаны \"третьими\" лицами и обе прекрасны. Эта мне нравится больше хита БиБи.\nПотом великолепная We All Wanna Boogie Аллена Тюссо - это, пожалуй, лучшая вещь на альбоме. В ней все на месте. Какой рифф, какая тема!\nThe Very Thought Of You - ммммм... небольшой провал. Попсовая баллада со струнными и нежным пением. Как это не странно АК любил исполнять такие вещи - они есть почти на каждом его альбоме. Поп-джаз какой-то, очень сентиментальный.\nI Got The Blues - вещь Носентелли. Супер-вещь! Странно, что такой лихой фанкер иногда пишет вещи с таким названием, Великолепный рифф и гармония.\nI Get Evil - это знаменитая вещь АК. Тут в отличном фанки-блюз исполнении. Вещь с юмором и драйвом. Грув и красота - все на месте!\nAngel Of Mercy - не удивляйтесь, но это блюз! Да, они это тоже любят и умеют там, в НьюОрлинз. Они все это и придумали, на самом деле.\nFlat Tire - известная инструментальная вещь Алберта. В данном случае исполнена на самом высшем уровне фанки-соула-блюза. Никто не играет эту музыку так, как делают это Митерз и Аллен Тюссо.\n\nНу что тут говорить. 8 супер-песен из 9 - это вроде не 5 баллов, но все же 5 - остальные вещи уж очень хороши! Не хотите пятый трек, сделайте программу или поднимите тонарм после четвертой песни.\n\nИ так, 5 баллов, уникальный состав, отличный альбом, после это Кинг не сделал ничего даже близкого к этому. Но не забывайте, что тут ему уже 55, а он все прифанковывает.\n\nЭто альбом необходим всем! Даже рокерам и любителям баллад! Просто прекрасная пластинка из города карнавалов, джаза и блюза."
