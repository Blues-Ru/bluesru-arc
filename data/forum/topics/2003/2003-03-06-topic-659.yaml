                        deleted: false
                        text: "не реагирую на её нынешнее \"творчество\". Повторяюсь, наверное, но ей довольно сложно было сохранить себя в этом мире ,как джазовую певицу.\nСоблазнов очень много, даже не соблазнов , а желания жить как люди...\nХотя понятие как люди довольно пространное и наверное у каждого свое..\nА тут еще эта \"музыкальная\" паутина в лице всевозможных продюссеров,промоутеров и прочих хрустящих зеленью пауков.\nВо время дуэта с Татевик мне более важно было послушать их разговор.\nНе знаю,но мне показалось,что определенная доля грусти в голосе г-жи Долиной сквозила.... Я очень надеюсь, что в связи с тем,что коряво,косо, по-нашему, но джаз и блюз пробивают себе дорогу, многие хорошие музыканты вернутся к первоначальному своему стилю... Один из лучших гитаристов которых я знаю играет с Кемеровским. Но я знаю каково ему играть эту жуть....Но это способ существования... \nГлавное, что-бы их не начали клевать по принципу: Ааааа....Ты, гад попсовал и жирковал, когда я по кабакам свой черствый (Док,без намека:-))хлеб зарабатывал. У нас это, ох-как любят...Слава Богу,проходили по истории любимой Родины... Чего это меня так пробило то????.... Я-то эту попсу до зубовного скрежета обожаю....Это такое чудо!!!"
