                text: "получился.\nБлагодаря усилиям одного хорошего человека, у меня есть запись этого шоу, и именно потому, что там присутствует Dr.John.\nА Доктор там не просто помогает, он играет на своем коронном инструменте, местами подпевает, а в конце поет целый кусок. Свой неподражаемый стиль он внес вместе со своим выходом на сцену. Зрелище очень лучезарное.\nПричем до этого в других вещах ей подыгрывал какой-то \"штатный\" клавишник - немного не то это было.. но с Mac Rebennack - просто супер!\nНасчет вокала Кристины - особенно достоен факт, что несмотря на поставленное шоу (не в Merry Christmas, baby\" конечно - там она стояла у рояля), на большие физ.нагрузки во время танцев, голос у девушки не выдыхается, не срывается и нигде не лажает. Правда, помогают бэк-вокалистки, но её вокал несмотря ни на что читается очень ясно. \nПри просмотре шоу напрашивается вывод, что эмтивишные видеоклипы возможности и талант Кристины убивают, зарывают - как хотите.. Такие люди стопроцентно лучше выглядят живьем. К тому же то, что показывают по ТВ, составляет лишь малую долю её репертуара, который, как выясняется, может быть очень далеким от стиля Бритни Спирс. Дуэт с Dr.John - яркое подтверждение.."
