            text: "дневной давности. Была приглашена приехавшая на гастроли из Америки, очень известная в прошлой,советской жизни джазовая певица Татевик Ованесян. Да...с годами мастерство только оттачивается. Как она пела... Вместе с ней выступали Сергей Манукян, Энвер Измайлов и ряд других известнейших джазменов. Был поразительный дуэт с Ларисой Долиной, причем последняя пела по телефону (!!!). Исполнили они вариации на тему \"Самертайм\" и как исполнили!!!! Жаль,что Долина работает в другом жанре, понять могу...простить, стараюсь.\n Потом были приглашены армянские музыканты играющие на национальных инструментах и они все выдали такой этно-джаз.\n Удивительно и приятно одновременно, что армянская (читай: наша, советская) певица живя в США преподает джазовый вокал в одном из престижных колледжей. Татевик будет выступать в Москве очень короткое время, так-что любителям женского вокала следует(всего лишь совет) поторопиться."
