            text: "стиль оформления, как я понимаю, в наследство остался от предыдущих хозяев.. Его перемены зависят в том\
              \ числе и от посещаемости и качества выступаемых музыкантов. А стены-мебель - все со временем подвергается переменам.\
              \ Если не запускать, все получится! \nВот места только там немного, пара аншлагов - и сидеть там будут на полу,\
              \ как в закрытом ***.. :) И \"дети улицы\" даже есть, создающие фоном дополнительную атмосферку (несовершеннолетнее\
              \ дитё, ненавязчиво предлагающее купить цветы, заигрывающее с посетителями не по-детски :) Так что вперед, слушатели!\
              \ Арбатским прохожим, как можно заметить, музыка нужна лишь только улично-крикливо-бардовая, и внутрь кафешек\
              \ они отчего-то мало заглядывают. А посему зовите, приглашайте ваших знакомых, и будет публика, и все будет..\n\
