      text: 'Предложения по фанку:

        1. Начать продавать в стране больше старой черной музыки - соул, фанк, ритм-н-блюз.

        2. Приучить людей слушать и любить эту музыку.

        3. Вырастить местных музыкантов, которых хоть что-то еще интересует кроме собственных персон и пьянства в сомнительных
        компаниях.

        4. Ритм-секциям репетировать грув ежедневно.


        А если серьезно, то у нас просто нет НИ ОДНОГО драммера, который правильно играет эту музыку. Есть Эдик Зизак, но
        он играет у Бутмана. Басистов СО ЗНАНИЕМ МАТЕРИАЛА кроме Ветерана НЕТ. Но он один в поле не ВОИН. Клавишников и правильных
        клавиш (Хаммонд, Фендер Родес, Клавинет, Муг и т.д.) нет вообще! А какой соул без органа и електропиано? Так что пока
        вопрос ФАНКА остается ЗАКРЫТЫМ. А мы с тобой будет играть акустические музыки с Божьей помощью, тем более что народу
        это один фиг понятнее, чем темы типа Hey Pocky A-Way или Look Ka Py-Py.'
