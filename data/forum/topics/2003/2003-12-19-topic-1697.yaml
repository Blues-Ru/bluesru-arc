  text: 'Кто-нибудь знает про концерт Blues Cousins в Мытищинском театре в пятницу
    19.12.03. Видел одну единственную афишу в Мытищах, изготовленную старым добрым
    совковым способом: руками и красками. Концерт якобы приурочен к презентации нового
    альбома. На сайте группы тоже есть информация, но время начала указано разное
    с афишей.'
