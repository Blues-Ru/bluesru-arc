  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70312021801262281&sql=Aqqf1zfiheh5k


    На задней обложке диска довольно длинная статья под заголовком "Peter Greenbaum".
    White Sky - не только название альбома, но и название его группы в те годы, где
    вместе с ним играет, поет и сочиняет его старший брат Майк. Все песни написаны
    M.D. Green-ом; кто это, мы не знаем. Вместо значка PVK на этот раз Headline Records
    с лицензией Creole, конечно.


    По музыке этот альбом уходит в сторону рока. Кому-то это нравится, кому-то нет.
    Майк поет в заглавном треке и это не очень хорошо. Альбом слабее трех предыдущих,
    но на нем также есть бесценные жемчужины: Time For Me To Go; The Clown (может
    быть лучшая вещь Грина вообще); It''s Gonna Be Me; Fallin'' Apart. Оценка 4 балла.
    Что-то потерялось, но магия Грина еще тут и ничего пока не говорит об очередном
    уходе в свой странный мир.'
