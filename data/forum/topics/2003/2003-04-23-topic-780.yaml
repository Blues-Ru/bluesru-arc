      text: "Както пару лет назал произошёл небольшой скандал. Представляете, перепутали группу Грин-Грей с группой Грин-дэй.\
        \ Приезжают Грингрэй в Нью-йорк, а их встречает два белых лимузина, отвозят в пятизвёздочный отель, потом после всего\
        \ везут не прессконференцию и тут-то и выясняется подвох. Сами Грин-грэй ничего не понимают, они и вправду поверили\
        \ что это именно их так встречают, но к сожалению они\nне Грин-дэй и поэтому вышел облом. Вот такая история а расказал\
        \ я её к тому, что не совсем понимаю чем недовольна группа LAZY. Жаль конечно что, её по ошибке не встретили два лимузина,\
        \ более того об этой ошибке во флаере они прекрасно знали за две недели до концерта. Вот бы и закатили скандал. Но\
        \ они напротив согласились играть под именем LASY. По поводу-же того безобразия которое они учинили на джеме, у меня\
        \ просто нет слов. Я конечно понимаю, что группа Lazy это не какая-то там LASY и она стоит большего, но гонорар групп\
        \ выступающих на джеме зависит от количества проданных билетов. А продано было на 2800 руб. Я честно разделил эту\
        \ сумму поровну между двумя группами LAZY и BANDERAS BLUES BAND не взирая на то, что LAZY\nработали всего час а BANDERAS\
        \ BLUES BAND оставался на сцене три часа без перерыва, проводя джем. (К примеру Доктор Аграновский вобще не платит\
        \ участникам джема и правильно делает у него нет такой головной боли как у меня.) Как говорится хотелось, как лучше,\
        \ а получилось как\nвсегда.  Я сделал ошибку. Я это признаю. Я рассказал Оксане о наших планах и перспективах. Но\
        \ она как девушка практичная восприняла всё буквально и более того ввела в заблуждение всех остальных. Слава Богу\
        \ мир не без добрых людей и мне удалось выпросить немного денег у администрации клуба 100$ которые вручил Оксане Ефремовой\
        \ при свидетелях и думал что замял это досадное недоразумение. Благими намерениями путь выстелен в Ад. Зря я это сделал,\
        \ лучше было дать больше денег Ване Жуку или Володе Мандрыкину или Рыбке со Странником которые опоздали на электричку\
        \ потому что ждали своей очореди выступить на джеме. Нет же я отдал их Оксане, которая прийдя домой уселась за компьютер\
        \ и стала писать на меня кляузы в форумы.Вот она\nблагодарность. Спасибо, спасибо ещё раз спасибо - все уволены! \n\
        \nОксана, орашаясь лично к тебе хоче сказать.\nЯ такой же участник джема как и все остальные, мой гонорар так же зависит\
        \ от того сколько мы продадим билетов, за организацию джема я вобще ничего не получаю, не из чего пока.\n  Я просто\
        \ люблю играть музыку, люблю блюз, мой дом не так велик чтобы собрать в нем всех своих друзей, поэтому я делаю джем\
        \ и устраиваю праздник себе и друзьям в Дефиле. Финансовая сторона здесь имеет место в последнюю очередь. Тот кто\
        \ этого не понимает может обижаться и клеветать на нас сколько угодно. Что же касательно тебя, думаю это Выпад в мою\
        \ сторону - просто попытка как-то оправдатся и перед своими друзьями, которых ты ввела в заблуждение и перед той публикой\
        \ которая была на джеме и всё это видела. Ты просто испугалась\nчто твоя скандальная слава разлетиться по Москве и\
        \ тебя будут избегать арт-директора других клубов. Я тебя понимаю, сам наступал на эти же грабли, по молодости.\n\
        \   Оксана ты зря так переживаешь, если кто то и облажался то только не ты, да и группа LAZY здесь не причём, ведь\
        \ везде была заявлена никому не известная группа LASY, а группа LAZY - это совсем другое,\nЭто супер группа, которая,\
        \ надеюсь еще не раз докажет что она LAZY, а не LASY. \n\nС приветом Banderas"
