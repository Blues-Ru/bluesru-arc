  text: "Кхе-кхе.. с началом весеннего сезона всех нас!\nВчера состоялся очередной вторничный джем под патронажем уважаемого\
    \ Бандераса в клубе Де-Филе.\nБыли замечены: группа Lazy в полном составе в первом отделении, истово исполнявшая бессмертные\
    \ произведения монстров рока. Почему-то сколько раз их слышу, столько раз не понимаю, каким образом звукооператоры делают\
    \ им ТАКОЙ УЖАСНЫЙ звук. Убивается всё живое. Наверное, при слове РОК наши клубные операторы инстинктивно крутят абсолютно\
    \ все ручки на пульте до упора вправо... максимум низов, реверберации и громкости. Результат: опавшие уши слушателей.\n\
    Ехаем далее...\nВо втором отделении, которое началось весьма бодро, поначалу, до приезда Жука из мест нам неведомых, солировал\
    \ Гурген. Нам стало известно, что у них с Ваней Жуком творческий дуэт, который благоприятно сказывается на обоих музыкантах.\
    \ В безудержной музыкальной экспансии Вани стало больше лиризма, а Гурген стал играть уверенней, хотя и есть над чем поработать.\
    \ Мы пророчим этому творческому дуэту большое будущее.\nВ известной композиции Evil Ways Ваня сыграл, пожалуй, своё лучшее\
    \ соло за последний год. Благо, всё записывалось на две камеры, и я надеюсь, что видеоролики будут выложены для обозрения\
    \ общественности в ближайшее время. \nБыли также замечен Вован Иванов с целым гаремом девушек, весьма двусмысленно пропевший\
    \ Susie Q и Key To Highway, а также играющий менеджер Сергей Иванов, демонстрировавший диковинный инструмент Musicman\
    \ Sabre 78 года с двумя страшной силы хамбэкерами, но из скромности державшийся в тени и толком ничего не сыгравший. Смелее\
    \ надо быть, товарищ! Раз уж вышел - играй.\nБандерас весь вечер таинственно бегал по залу с двумя листочками бумаги,\
    \ напоминая помрежа из кино про то, как снимается кино.\nВаш покорный слуга скромно выступил с партией второй гитары при\
    \ солирующем Жуке, чем снискал улыбки дам, и тем удовольствовался.\n\nКого-то я забыл упомянуть.... склероз..."
