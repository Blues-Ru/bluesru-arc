        subject: О музыке как профессии, или Политэкономия музыки. Продолжение.
        deleted: false
        text: "С одной стороны, профессиональная группа - это группа, которая зарабатывает музицированием как основным занятием\
          \ большей части своих участников.\nПо теории Маркса, которая, как известно настолько же всесильна, насколько и верна,\
          \ группа обменивает свой музыкальный товар на деньги. Товар обладает потребительной стоимостью, то есть тем количеством\
          \ денежных средств, которые покупатель готов выложить за товар, считая обмен эквивалентным. Потребительная стоимость\
          \ товара складывается из его востребованности целевой аудиторией (в данном случае, слушателем), то есть насколько\
          \ вообще нужен товар как таковой, рыночной конъюнкутуры (соотношения спроса и предложения), качества товара, предлагаемого\
          \ производителем, и, как было определено в последнее время и активно используется в рекламе, вторичных выгод, которые\
          \ приносит владение данным видом товара для покупателя.\nРассмотрим всё по порядку.\nВ: Какой товар производит группа\
          \ Lazy? \nО: Группа Lazy производит hard-rock и blues-rock в товарных количествах, представляемых как кавер-версии\
          \ известных хитов.\nВ: Какова востребованность данного вида товара?\nО: Очевидно, что эпоха повального увлечения\
          \ данным видом музыкального искусства осталась несколько позади. Музыка подобного стиля востребована определённой,\
          \ ограниченной по возрасту аудиторией, скорее относящейся к завсегдатаям клуба Sexton.\nВ: Каков спрос на музыку\
          \ подобного рода?\nО: Спрос ограничен желанием арт-директоров отдельных клубов слышать у себя такую музыку. Ажиотажный\
          \ спрос аудитории отсутствует.\nВ: Каково качество предлагаемого товара?\nО: Группу отличает достаточный профессионализм\
          \ при общей сыгранности всего коллектива. Группа обладает чувством стиля. Сама Оксана безусловно харизматическая\
          \ личность, обладающая уникальными вокальными данными и экспрессией. В то же время, следует отметить недостатки,\
          \ которые фиксировались нами по опросам аудитории. Однообразие аранжировок. Динамическая монотонность - постоянное\
          \ форте. Слишком агрессивная и подавляющая манера игры барабанщика при некоторой пассивности гитариста, который\
          \ отыгрывает свои соло виртуозно, но абсолютно отстранённо. Группа не контролирует звук на сцене, хотя именно группа,\
          \ а не звукооператор клуба в конечном счёте отвечает за максимальное соответствие звука на технических средствах\
          \ данного клуба тому идеальному представлению о звуке, которое имеется в голове руководителя группы. Если звук не\
          \ тот - остановите концерт на пять минут, покрутите ручки. Кроме того, сидя за пультом, Оксана не могла отстроить\
          \ сама себя, если я правильно понимаю. Ну разве только если воткнуть микрофон прямо в пульт.\n\nРекомендации.\n\
          Рекомендуем Оксане соизмерять желаемое с действительным. Не считать, что от одного постулирования себя как профессиональной\
          \ группы в кармане заведутся деньги. Следить за звуком и по возможности представить несколько концертных программ\
          \ в чуть более лёгких стилях с учётом интересов аудитории и менеджеров клубов.\nВолоде Бандерасу рекомендуем впредь\
          \ тщательнее оговаривать условия контракта, желательно в письменном виде, где в том числе прописывать условия, когда\
          \ оплата происходит по гарантии, а когда - по кассе, форс-мажоры, ответственность и прочие условия. Как у взрослых.\n\
          \nPS. Всё вышесказанное является личным мнением автора без претензий на истину в конечной инстанции. Написано с\
          \ уважением ко всем участникам случившегося конфликта при максимально нейтральной и объективной позиции автора."
