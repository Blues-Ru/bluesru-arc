  deleted: false
  text: "В общем, так.. было это то ли давно, то ли недавно, одному Богу ведомо. В лесу это было. Жили в лесу разные звери,\
    \ делами всякими занимались. Один был такой типа Барсук. Барсук - зверь основательный, хотя и прямолинейный. Норы прямые\
    \ роет и глубокие. Запасливый такоже. Всякое добро норовит в свою нору затащить, иногда без разбору. Барсук - зверь хоть\
    \ и не хищный, но когти имеет. По жизни он ими копает. А по необходимости - обороняется. Волка, например, порвать может.\
    \ Но для этого барсука разозлить надо сильно, сам он задираться не мастер. Не любит он это дело, по правде сказать. Да\
    \ и не умеет, если уж совсем честно. Хотя, ностальгируя по временам молодости, любит походить в военной форме старого\
    \ покроя. Такую сейчас уже не носят, да не в этом суть.\n\nИ был ещё в том лесу такой зверь, который себя на английский\
    \ манер величал Stinky, но для краткости написания гласные опускал, как древние восточные народы. На чём, впрочем, его\
    \ сходство с древними и заканчивалось. Интересный такой зверёк, я бы даже сказал, симпатичный. Сам чёрненький, хвостик\
    \ пушистый, полоски такоже беленькие на мордочке. Одна беда у него - душистый он очень. Ну пахнет типа плохо. Дезодорантом\
    \ не отобьёшь. Да и какие в лесу дезодоранты? Рядиться Stinky любил в свои цвета - чёрное с серебром. Где-то мы такой\
    \ фасончик уже видели, да не упомним где. \n\nКороче, Барсук своим делом занимался, а Stinky - своим. Дело у Stinky было\
    \ немудрёное, но прибыльное - дрова возил. Дело, в принципе полезное и нужное.\n\nДа, вот ещё. Были в том лесу места такие\
    \ типа пещеры. На стенах пещер этих все, кому не лень, рисовали кто что хотел. Короче, самовыражались звери лесные в меру\
    \ своего разумения - рисовали всякие наскальные рисунки и для потомков оставляли там своё вытьё и рыки звериные в длинных\
    \ туннелях с долгим эхом. Зайдешь, бывало, в один такой туннельчик, а оттуда доносится рёв, например, страшного зверя\
    \ Гекко \"Ху-у-у-у-учи!!! Ку-у-у-учи!!!\". И от рёва этого на душе становится легче, особенно когда самка ушла к другому.\
    \ Ну и всякие прочие звуки ночного леса, когда каждый зверь на свой манер рычит, воет или лапами по земле колотит. Иногда\
    \ складно получалось, иногда не очень. Но в общем весело. И по вечерам звери обычно по этим пещерам ходили, себя показывали\
    \ и на других зверей смотрели, а такоже к звукам из туннелей прислушивались. \n\n\nА закон там был такой: у каждой пещеры\
    \ хозяин должен быть. Чтобы не гадили в пещерах. Звери всё-таки. А пещеры все в общем принадлежали не лесу, а горным жителям,\
    \ и они с лесных за это плату брали. Ежели кто не уплатит, то таковая пещерка свободной считалась.\n\nЗначит, была своя\
    \ пещерка у Барсука, в ней он собирал портреты да рыки звериные. Но в некотором беспорядке. Времени разбирать не было\
    \ - норы многочисленные, хозяйство всякое хлопотное.. А у Stinky - своя пещерка. В ней безобразия всякие учинялись. Типа\
    \ портреты зверей в неприличных позах - вид сзади с поднятым хвостом и всё такое прочее. Стыдоба одна. И на других зверей\
    \ типа Барсука и его приятелей там всякие пасквили писал. Звери обижались, но сам Stinky называл это юмором. А зверьки\
    \ по той пещере шастали Stinky под стать - мелкие, но пахучие такие. \n\nОдна беда - входы у пещерок рядом были. Кто из\
    \ зверей зрением хорошим не отличался, путал часто. Однако по запаху быстро ориентировались. Запах Stinky ни с чем спутать\
    \ невозможно. Но Барсука эта путаница огорчала. Как древние говорили, \"шёл в комнату, попал в другую...\"\n\nНадо сказать,\
    \ что Stinky кроме этой пещерки, ещё и другие имел, с виду поприличней, но запах в них непременно присутствовал. Впрочем,\
    \ у некоторых зверей зрение хорошее, а нюха нету. Звери-то всякие бывают.\n\nВот. Переведём дух и потопаем дальше.\n\n\
    Значится, пошел слух по лесу, что Stinky енту самую пещерку по соседству не проплатил. То ли ушами прохлопал, то ли чем\
    \ ещё прощёлкал. Короче, освободилась пещерка. Обрадовался Барсук, пошёл к горным, заплатил им корешками съедобными сколько\
    \ надо, пещерку от хлама расчистил и присоединил к своей. Один только вход оставил, короче. Ну и будучи зверем прямолинейным\
    \ и, мы бы даже сказали, склонным к велеречивости, наскальную надпись об этом сделал. Типа, звери дорогие, конец непотребству,\
    \ да здравствует порядок! А Stinky нам всегда дорогой гость, мы, так уж и быть, носы закроем на время его нечастых визитов.\n\
    \nДа.. надо сказать, что горные звери порядок завсегда знали, и посему обитателя пещерки загодя предупреждали, что пещерка-то\
    \ скоро тю-тю, ты заплати, друг любезный. А если год проходил, и оплаты не было, так они вообще на месяц вход в пещерку\
    \ валуном закрывали. Крупным таким. Ежели даже слепой и без нюха - все равно лбом наткнёшься. Тем более, что у Stinky\
    \ за пещерами следить зверь один был приставлен. Но видать, службу он плохо нёс. Да и записана пещерка вообще была не\
    \ на Stinky, а совсем на другого зверя, дружбана евонного. И типа тот зверь в другом лесу временно обитался, потому и\
    \ не в курсе был. Если по правде рассудить, все они трое ушами прохлопали и хвостами промахали.\n\nКороче, как узнал Stinky\
    \ про то, что пещерка его к Барсуку перешла, дык весь аж перекособочился. Это как же так, что у него не спросили, дескать,\
    \ друг дорогой, мы на твоё непотребство давно смотреть не можем, но мы как демократы отдадим свои жизни за твоё право\
    \ вонять свободно, посему пожалуйста, не будешь ли ты столь любезен позволить мне твою пещерку занять. Типа так.\n\nВонь\
    \ пошла по всему лесу. Бегает Stinky по лесу, брызжет вонючим экстрактом из подхвостной железы. Сначала решил он Барсука\
    \ сам порвать, потом прикинул, что весовые категории разные, и стал вопить, дескать, шакалы тебя порвут! Порвут, блин,\
    \ конкретно, как тузик грелку, придёт беда откуда не знаешь! Дескать, украл ты моё добро без спросу, я его, мол, столько\
    \ лет лелеял и холил себе и друзьям своим на радость, а ты, мол, не Барсук, а волк позорный и всё такое прочее.\n\nБарсук,\
    \ как сказано было ранее, зверь мирный, но защищаться умеет, но ежели только один на один и по правилам. Например, до\
    \ первой крови. А от стада шакалов из-за угла вряд ли отмахается. Да и кто там разберёт, пойдут ли шакалы за Stinky Барсука\
    \ рвать, или гонит Stinky по своему обыкновению, на слабо пробует? А у Барсука хозяйство всё ж, он аж двадцать зверей\
    \ работой обеспечил, и сам надзор за работами ведёт. Ежели его порвут, это ж в работе настанет разброд и шатание...\n\n\
    Короче, подумал Барсук эту думу горестную и решил: сам-то я Stinky не боюсь, но с шакалами связываться не хочу. Да и ответственность\
    \ на мне не только за себя, а ещё за зверьё моё подопечное. Ну и попросил по старым связям в лесной гвардии помощи у сторожевых.\
    \ Есть такие звери. Они за корм зубы показывают. Ну и порвать могут почище шакалов, поскольку этому делу всю жизнь со\
    \ щенячьего возраста обучаются.\n\nА Stinky, значит, прыгает вокруг да подначивает Барсука, дескать, не самец ты вовсе,\
    \ позор тебе и другие нехорошие слова. А если ты самец - выходи в чистое поле один на стадо шакалов, докажи, мол, каков\
    \ ты самец! \n\nВот сидит теперь Барсук и думает:\n\n- с одной стороны вроде пещерку бесхозную за недорого прихватил..\n\
    \n- с другой стороны, запах в ней стоит такой, что ой-ой-ой просто.. уж незнамо сколько лет не выветрится..\n\n- с третьей\
    \ стороны, то ли порвут шакалы, то ли свистит Stinky, а сторожевым платить придётся. Много припасов уйдёт.. а они, сторожевые,\
    \ едят только свежее мясо убитых енотов, сокращённо - у.е., дефицитное оно больно..\n\n- да и вообще, не лучше ли за эти\
    \ самые тушки енотов в своей старой пещерке порядок и красоту навести, чтобы и смотрелась получше, чем у Stinky, но без\
    \ запаха, понимаете ли.\n\n- а пещерку эту спорную отдать назад Stinky, пусть вернётся в родную атмосферу, ежели ему там\
    \ с друганами евонными комфортно и сухо. Пускай плодятся там и размножаются способом, который у них там на стенах раньше\
    \ был нарисован. Ну по крайней мере получат удовольствие от самого процесса. Nobody's perfect, как говорили в финале одного\
    \ фильма наших старших братьев по эволюционной лестнице.\n\n\nА ты как думаешь, уважаемый читатель?"
