            \ идём \"на водопой\", никто не думает обижаться и не грозит карами небесными. Просто я знаю, что они хищники,\
            \ и они знают, что я своего случая не упущу, если они подставятся. Но в другие разы мы можем спокойно делать совместный\
            \ проект, если у кого не хватает собственных сил. Это называется \"террариум единомышленников\", если использовать\
            \ другую расхожую метафору, раз про сто баксов не нравится. \nДругими словами, нормальная конкуренция взрослых\
            \ мужчин, занимающихся своим бизнесом в рамках правового поля. Невозможно быть хорошим для всех и при этом соблюдать\
            \ свои интересы."
  - id: 12432
    parent_id: 12383
    date: 2003-05-12 19:30
    poster: Федор Романенко (fedor)
    email: fedor@blues.ru
    subject: Жене,  конструктивные предложения
    deleted: false
    text: "Женя, ты - человек культурный, и претендуешь на \"нормальные человеческие отношения\" с Цыганковым, нами и т.д.\
      \ Давай обсудим ситуацию с этих позиций. Ты высказал предположение, что Андрей должен был после того, как нашел домен,\
      \ позвонить вам, сообщить о том, что вы его про...ли, предложить его заново занять и пр. Это было бы по-твоему в рамках\
      \ \"нормальных\" отношений, \"без заподлянки\" и пр. Давай попробуем по этому гамбургскому счету рассмотреть ситуацию.\n\
      Сравнение с оставленной гитарой, на мой взгляд, очень неточно. Ибо, если ты оставляешь гитару, она остается твоей, и\
      \ мы обсуждаем вопрос о том, чтобы вернуть тебе твою собственность. Домены не являются собственностью, а после того,\
      \ как ты его про...л, а Цыганков - купил, домен bluesmen.ru является собственностью именно Цыганкова.\nПо закону и формально\
      \ ничего не нарушено. Но, как и в гипотетических случаях потери guitars.ru или blues.ru, которые каждый честный человек\
      \ должен был бы вернуть старому (!) (а не \"истинному\") владельцу, следует говорить вот о чем. Какие-то люди потратили\
      \ много времени и сил на создание ресурса, он им или кому-то еще почему-то был очень дорог и пр. Потеря доменного имени\
      \ является существенным ущербом этому проекту (хотя бы с чьей-либо точки зрения), поэтому хорошо бы домен вернуть, не\
      \ обращая внимания на формальную сторону вопроса, чтобы не разрушить хорошего начинания. Возможно, если бы Андрей рассматривал\
      \ вопрос именно так, он бы домен вам вернул.\nЕсли речь идет о том, что вам, как культурным людям, хочется иметь этот\
      \ домен для своего проекта, но вы его сами (!) потеряли (!), вы должны были по-хорошему обратиться к Цыганкову с просьбой\
      \ (!). Так мол и так, мы понимаем, что ты формально - прав, домен теперь - твой, но не мог бы ты нам его вернуть, чтобы\
      \ наш проект продолжил свое существование в старой форме? Именно так надо было бы поступать в рамках \"нормальных человеческих\
      \ отношений\" без конфликта интересов, не правда ли?\nВместо этого Цыганков получил серию угроз физической расправы\
      \ в самой некультурной форме. Он сам виноват в том, что спровоцировал эмоции Тынку своим первым сообщением. С Тынку\
      \ все ясно, он человек - неуравновешенный, как минимум. Но почему ты, Женя, в этом (т.е. в угрозах) участвовал? Ты считаешь\
      \ это приемлимым? Твои знакомые киевские корреспонденты исправно передавали твою позицию с намеками на насилие. Или\
      \ они что-то переврали? Ответь четко, пожалуйста, на этот вопрос. Вырази свое отношение к угрозам Тынку.\nДалее, Андрей\
      \ спрашивает мнение людей по поводу того, как поступить в этой ситуации. Я предлагаю некоторый вариант соглашения, который\
      \ может устроить или не устроить кого-то из участников конфликта. Во-первых, отдавать домен под воздействием угроз насилия\
      \ со стороны Тынку можно только ради собственной безопасности, но, вообще говоря, это - малоприемлимо. Если события\
      \ идут по этому сценарию, то Цыганков должен сам выбирать - принимать ли контрмеры, сдаться и т.д. Но, сценарий, когда\
      \ Тынку продолжает грубо угрожать, а Цыганков отдает домен, абсолютно выпадает из рамок \"культурных  и нормальных\"\
      \ отношений. Если это случится, то тебе Джон, и гитарз.ру будет объявлена война (чисто информационная или с применением\
      \ существующих законов), руки никто не подаст и пр. Домены забирать, может быть, нехорошо, но - физическое насилие,\
      \ это - гораздо больший грех во всех смыслах и по любому счету. \nСоответственно, первое условие \"нормальных\" переговоров,\
      \ это устранение всех угроз насилия со стороны Тынку. Если это принимается, то в этом случае, можно рассмотреть разные\
      \ варианты. Например, Цыганков великодушно и по своей воле отдает вам в пользование домен, который вы потеряли, чтобы\
      \ не зачах ресурс, который кто-то (не Андрей) считает ценным. Другой вариант: поскольку большого доверия к Тынку нет,\
      \ Андрей оставляет домен за собой, но направляет www.bluesmen.ru на ваш сайт столько по времени, сколько ему это покажется\
      \ нужным / допустимым. По старому адресу работает старый ресурс. Тут можно сказать, что для вас это плохо, ибо Андрей\
      \ будет держать вас за яйца, грозить отключением, цензурой и пр. Может быть, это - вопрос доверия к нему, ибо сам шаг\
      \ первоначального перенаправления являлся бы шагом доброй воли с его стороны. А он этого делать не обязан совершенно.\n\
      Если домен служит вам, то Андрей как владелец домена, должен от этого факта хоть что-то получать взамен. Конкретнее,\
      \ решить проблему с двумя написаниями адреса его замечательного ресурса www.bluesman.ru, ибо сейчас по этой части происходит\
      \ полный кавардак, Андрею не выгодный. Для этого, условием перенаправления домена на вас, должно быть наличие заметной\
      \ ссылки на первой странице www.bluesmen.ru на сайт www.bluesman.ru с подписью о том, что информация о московских блюзовых\
      \ музыкантах находится там, а здесь - другой стебный ресурс (или в какой-то другой форме).\nМое предложение может оказаться\
      \ неприемлимым из-за ожесточения позиций сторон, но, мне кажется, что пользы от такого варианта будет больше, чем от\
      \ лихой войны, выходящей за рамки интернета...."
