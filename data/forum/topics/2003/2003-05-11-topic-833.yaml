        text: 'Вообще, если оставить в стороне эмоции, корпоративные интересы и всякую лирику, со стороны это дело  выглядит,
          примерно так:

          Кто-то расслабился и прошляпил, грубо говоря, сайт. Другой (Барсук), не просчитав  "этическую" (а скорее "политическую")
          сторону своего действа, вполне ЗАКОННО его приобрел. Заметьте - не украл.  До этого места все понимаемо. Тут бы
          Stinky подойти к Барсуку и наедине объяснить, что он об этом думает, как на его взгляд это выглядит и какие последствия
          может вызвать. Если Барсук не идиот, он бы тогда и пришел бы к выводам, к которым подходит сейчас. То есть пожал
          бы плечами и вернул, что оказалось так  дорого Stinky. Но Stinky, в силу своей природы, сразу выпустил струю вони
          на весь лес. И понеслось. Стоят на поляне при большом скоплении зверей и лают друг на друга. Никто друг друга не
          слышит. У каждого своя правота.  Ну, ладно, дальше...

          Появляется, ну не знаю, ну, скажем, Медведь,  и спокойно так говорит: "лажа, браток, получилась, меня не было и
          все такое... Ты мне это, того, отдай назад мое дерьмо. Иначе нам потом неудобно будет вместе на водопое пиво тянуть,
          да на луну выть". Культурно так и спокойно. Резонно. Так как надо было это с самого сначала Stinky сказать. Тут
          как бы ситуация вернулась к нормальному пункту: первый потерял - второй поднял - перый попросил вернуть - второй...
          что сделает дальше второй? Думаю нормальный зверь все поймет и договорится, то есть вернет. И это дело совместо
          на водопое потом обсудит и похоронит.


          Тут еще небольшое замечание уже не по делу. Любимая поговорка Барсука про "бакс, который всем нравится, а я не обязан"
          превращаясь в некую жизненную парадигму, может в итоге привести к тому, что Барсук, теряя незаметно для себя обоняние
          и зрение, никому не будет нравиться. Но это его право и его выбор. Как и выбор тех, на кого он плюет, произнося
          крылатую фразу.'
