  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70312211905221638&sql=A3gjueai14xa7


    Да уж, БиБи решил стать звездой филли-соула? Или просто поп-звездой? Он снова в Филадельфии, но на этот раз нет Стиви
    Уандера и хитов на предыдущем альбоме 1973 года.


    На альбоме 7 песен и длится он всего 29 минут. Блюза тут нет вообще, есть филли-соул. Трудно даже назвать лучший трек;
    наверное это шестиминутный инструментал Philadelphia. Оценка 3 балла; ну так же нельзя, ни одной по-настоящему яркой темы!
    Играют и поют шикарно; этот факт спасает альбом от полного провала. Один из самых слабых дисков БиБи в 70-х.'
