  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDCASS80312152156081613&sql=A5rkcikbhbb59\n\
    \nСтранное название для содержимого этого альбома. Еще больше смущает наклейка\
    \ на компакте - 2 albums in one! Дело в том, что это целиком двойной концертный\
    \ диск Джона, записанный в 1965 году за год до его смерти. Тут ему уже 75, но\
    \ он в отличной форме и прекрасно играет и поет! Его вытащили из небытия только\
    \ в 1963 году на пике фолк-возрождения в Америке. \n\nНа диске 21 трек блюзов,\
    \ фолка, песен и госпела. Все это сыграно в fingerpicking style и совершенно божественно\
    \ и по-доброму спето. Блюзмен и сонгстер оставался бодрым и добрым даже в свои\
    \ 75 после стольких лет непонятной и тяжкой жизни. Нельзя не выделить несколько\
    \ гениальных треков, это I Shall Not Be Moved, It Ain't Nobody's Business, Candy\
    \ Man, Stagolee (aka Stagger Lee etc.), My Creole Belle, C.C. Rider, You Are My\
    \ Sunshine. Запись очень хорошая для 65 года, альбом слушается на одном дыхании\
    \ как одна длинная и красивая сказка. Необходимый альбом в коллекции любителя\
    \ фолка, акустического блюза и просто хороших песен!"
