            subject: О музыке
            deleted: false
            text: 'Тейлор 77 хорош, но есть у него альбомы и получше.

              То же самое касается Иена 74. Тебе бы надо его другие альбомы услышать, но они у меня все на виниле (кассеты могу прописать).

              Харпер хорош всегда, но эти два просто лучшие! Это не мусульманская тема, а народная музыка - они все (музыки) похожи чем-то. Кельтская музыка местами похожа и на индийскую и на арабскую. Русская много взяла от кельтов и скандинавов.'
