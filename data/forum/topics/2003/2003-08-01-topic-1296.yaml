  text: 'Одним из треков недавно вышедшего двойного сборника <i>The Very Best of Simply
    Red</i> идёт кавер песни <a href="http://www.blues.ru/BlackCat/rj.htm" target="_blank">Роберта
    Джонсона</a> <i>Come on in My Kitchen</i>, решённый в безошибочно "симплиредовской"
    манере, с элементами аранжировки, характерными для блюз-ориентированных работ
    Dave Stewart ("Cookie''s Fortune") и Moby ("Play").

    Весьма забавно.'
