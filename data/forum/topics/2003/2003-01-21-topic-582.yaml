    text: "...группа \"незавершенная\", в чем-то лажовщики,в чем-то понтяра, но дело в том,что они очень подходили Дженис с её музыкальным псевдо-пофигизмом ,уж очень она выгодно слушалась (это нынешнее восприятие)и прекрасно сглаживала все шероховатости бенда. Потом,следует учитывать личные связи, в том смысле,что всегда стараешся протащить своих и всячески оправдать их некомпетентность. Но сама-то она действительно была явлением (по моему)и действительно была одной из лучших. Только одна просьба - не сравнивать её с другими певицами (типа Нины Хаген и т.д.)- разные они все... А вот с Джими дело сложнее - сейчас и играют быстрее и богаче ,возможности гораздо большие, но такого сочного звука и такой гениальной \"агрессии\" я пожалуй и не слышал больше (воздержитесь, please, от фраз типа \"а вот этого и того ты слушал?).\nДжими играл на грани фола ,все время возникает ощущение пред-лажи ,но гениальность (хитрость,мастерство,везение...) в том,что он непостижимым образом избегал пресловутого фола и выдавал нечто... \nЗаппа.... гений другого измерения. Выверенность ходов, отточенность пассажей, просчитанность каждого хода при внешнем музыкальном сумашествии. Предтеча музыкальных компьютерных программ ,если хотите....Но гений,однозначно(для меня).\nА то, что он там про Джими или Дженис говорил - это фигня, у нас и не такое друг про друга несут (тоже гении, наверное....). Кстати, такие гитаристы как Стив Вэй, Джо Сатриани и иже с ними ,крайне высоко оценивают музыкальный взрыв Хендрикса. И еще - это все таки был блюзовый исполнитель,как мне видится, при всех его экспериментах. Кому как не блюзмену может быть по- фигу когда 6 становится 9???:-)"
