                          text: 'Молчание воспринимается как согласие. Но отвечать на некоторые выпады просто неохота. Доказывать по пунктам историческую важность Джоплин? Честно говоря, я до юбилейной передачи не слышал ее несколько лет. Но от перемены моего внимания или невнимания к ней место ее в блюзовой и рок-эволюции не меняется. И Дж.Дж не виновата, что кто-то из молодых подражает не эмоциональной насыщенности, а внешней экзальтированности. Это досадно. Но, если огромное количество подражателей Стиви Рея Воэна не должно мешать высоко оценить его роль в истории, но и для Дж.Дж. это должно быть так же. И яркость Джони Митчел никак не затмевает Дж.Дж. – обеим хватит места на небосклоне.

                            А безграмотность Рибо – это видимо комплимент. В пластинках Вейтса он и хотел казаться дремучим гитаристом, пьяным до полной абсурдности аккордов. Я уверен, что прообразом его гитарных брейков в альбомах Вейтса была работа Самлина с Хаулин Вулфом. Но разница-то заметна, если слушать внимательно. Кстати, когда я был пободрей, я любил ставить битломанам, как Рибо исполняет While My guitar… - настоящая «дворовая» трактовка.'
