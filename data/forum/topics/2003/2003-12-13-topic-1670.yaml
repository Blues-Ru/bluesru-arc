                      deleted: false
                      text: идет голимая деградация музыкальной индустрии и культуры вообще, а ты ее еще и поддерживаешь.
                        альбом - это носитель + дизайн обложки и ИНФОРМАЦИЯ; если этого нет, то это не альбом.
                      replies:
                      - id: 16249
                        parent_id: 16243
                        date: 2003-12-15 16:43
                        poster: Rugged
                        email: kirill@hillbilly.ru
                        subject: Музыкальная
                        deleted: false
                        text: '_индустрия_ имеет отдаленное отношение к культуре и собственно к музыке. Индустрия - это инструмент
                          для производства конечного продукта, продажи его потребителю и, в конечном итоге, получения прибыли.
                          И она никак не связана с музыкой, с творчеством, более того, зачастую идет во вред музыке и творчеству...
                          Поэтому на индустрию мне пополам.


                          А по поводу культурной деградации, я, конечно, ее поддерживаю по полной. Вместе со своим сайтом,
                          призванным ускорить процесс деградации Слава богу, есть у нас Дима Казанцев, который своими словами
                          о кошмарности Double Trouble и малокомпетентными выссказываниями про "ракабили" спасает людей от
                          наплыва пошлости и бескультурья...'
