                    text: 'Красивый буклет с текстами, нотные транскрипции - обязательно в глянцевой обложке и с подробными
                      комментариями... Это отучает от активной позиции в жизни и творчестве и ведет к синдрому трех Т. К тому
                      же налицо некая манипуляция сознанием потребителя: результат творческой работы музыканта (ведь именно
