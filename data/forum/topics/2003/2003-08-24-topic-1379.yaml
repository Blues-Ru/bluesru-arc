      Почти 25 лет чувак молчал.. Не шедевр века, быть может, но очень мягкая, приятная\
      \ и теплая пластинка. Две вещи вполне подходят в тему нашего форума. Это \"\
      Don Covay Boogie\" c Kim Simmonds и \"b.y.o.b.\" (здесь Covay не поет, а вальяжно\
      \ и лениво так наговаривает). \nОбратите внимание на список friends. \"Chill\
      \ Factory\", сопровождающаяся все тем же заговорщически ленивым и небрежным\
      \ вокалом, очаровывает красотой мелодии и игрой Lee Konitz.\nЭто пока первые\
      \ впечатления от еще недослушанной пластинки.. Вдвойне странно, что это вообще\
      \ единственный его CD, что удалось мне найти в магазинах за все время."
