  deleted: false
  text: "Э..что сказать, когда слов нет.. :) Ну ожидали многого, но результат все равно переплюнул все наши ожидания.. Было просто превосходно! Огромное спасибо музыкантам, отважившимся приехать из столицы и создать замечательный прецедент организации настоящего музыкального события в Петербурге. Надеюсь, что увидим ребят скоро опять (ну должно же им тоже захотеться в Питер вернуться ненадолго :) ). \n\n\nPS знаковый эпизод вечера - несмотря на быстро закончившийся алкоголь в баре клуба (по причине плохой подготовки администрации клуба), всех присутствующих (насколько я успел заметить) \"распирало\" по полной программе.. отчего бы, не от музыки ли и общей атмосферы... \n\nОтдельное спасибо Алексею за отвагу в организации мини-джема. :)"
