    subject: А. Аграновскому и Ко. огромное спасибо за праздничный вечер!
    deleted: false
    text: "Это было более чем ох....но! Более мягких слов не нахожу. Не предпологал, что блюз может так звучать в российском исполнении.\nВечер был кайфовейший! Звук - замечательный. Меня лично не так  зацепило на Ефес Пилсенер, как на вчерашнем действе. Наши дамы тож были в восторге и просили поблагодарить вас за прекрасный подарок к 8-му марта.\nХочу отметить высокий профессионализм каждого из музыкантов, энергию и обаяние фронтмена. Но особенно нашу компанию очаровал харпер (Братецкий - правильно?). Вот уж точно - он своей гармошкой всех с ума сведет!\nКаждое его вступление ожидал ну просто с таким чувством...\nНу... ну... ну... Всё - пора-пора-пора... Иииииии... Э-эх! Хорошо пошла... \nНе, все равно словами не получается. \nИз джемующих особенно понравилась девушка, которая была за ударными...Тонко чувствует...\nВ общем, еще раз спасибо за праздник блюза. Хотели бы видеть вас чаще. Господин Аграновский обещал быть в августе, а пораньше нельзя?\nИ еще - ИМХО - при наличии рекламы можно было бы собрать зал и побольше! Клуб хоть и очень уютный, но такой бенд мог бы собрать и гораздо большую аудиторию. \nА вы диск собираетесь записывать, господа? Уверен, что альбом такого блюза украсил бы любую коллекцию!\nЕще раз спасибо. И удачи!"
