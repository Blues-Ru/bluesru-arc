  text: 'Сегодня на СерДожде был Е.Маргулис. Давал хороший блюз. Я дозвонился спросить что из черного блюза а cappella знает
    (в магазинах пожимают плечами). ЕМ сказал что-то вроде "ХОСПИЛЗ". Не нашел ни хрена.

    Други! Кто что-нить посоветует, а может, даст скачать на мою тему. Если кто не понял о чем я - вспомните Вупи Голдберг
    в "Монашке" - какие чудные дела творили эти черные тетки!

    Если что - мыльте - может и я чем пригожусь.'
