  text: "5 лет создавался этот альбом, 5 долгих лет, над ним работали суперзвезды\
    \ для того чтобы создать сенсационный альбом в блюзе. Альбом был удостоен мультиплатинового\
    \ статуса ,НИКОГДА в истории блюза, ни один альбом не получал мультиплатиновый\
    \ статус.\nОтныне творчество Хукера делят до 1989г. и после 1989г. Теперь блюз\
    \ впервые выходит на большие суперсовременные музыкальные площадки (численность\
    \ посетителей которых насчитывает 10-тки тыс. человек) абсолютный успех. \nЗвук\
    \ на альбоме очень плотный, богатая аранжировка, отличная подборка композиций,\
    \ великолепно сыграно, никто из музыкантов не вываливается из звездного коллектива,\
    \ все играют в едином порыве, все играют для Джона. Альбом выдержан в лучших поп\
    \ стандартах.\n\nАльбом Healer сделал Хукера мультимилеонером, на Хукера появилась\
    \ мода.\nЕго модно было слушать, он звучал практически во всех комерчиски успешных\
    \ кино проектов 90х годов. Он трижды становился лицом года, контракт с Pepsi.\n\
    Его альбомы записывали самые элитные студии (например JACKSON писалась на одной\
    \ из таких студий). Его наградили всеми наградами в музыки. Он стал всемирно почитаемый\
    \ и модный музыкант, абсолютный авторитет в музыки.\nОтныне он не принадлежит\
    \ Блюзу. Теперь он JOHN LEE HOOKER."
