  text: 'Мы открыли еще одну тему для голосования - любимый клуб. Поскольку чисто-блюзовых
    клубов у нас почти нет, вопрос формулируется более мягко. "Какой из московских
    клубов, где играют блюз, был вам наиболее симпатичен в последние пол-года?".

    Голосуйте, пожалуйста ;) Мне кажется, что "выражение гражданской позиции" по этому
    вопросу может хоть и слегка, но положительно повлиять на атмосфэру в наших клубах,
    ибо будет вручена премия и пр.'
