  text: 'Те, кто не был вчера на «Bluezoology vol.IV», могут лить слёзы, однако, поздно.
    Придётся ждать до следующего раза, а такие события в славном московском зоопарке
    происходят лишь раз в полгода. Вчера же сейшн вело трио Юрия Каверкина «Wrong
    Way Band» (WBB), играющее настоящий чёрный блюз в стиле John Lee Hooker. Такой
    музыки в Москве пока больше не играет НИКТО! Кто ещё не слышал, рекомендуется
    к прослушиванию, очень впечатляет. Впервые Доктор Аграновский оказался на таком
    мероприятии в качестве гостя, а Юрий Каверкин  - центральной фигурой, что придало
    всему действу некую непривычно-забавную ассиметричность. Юрий, как и всегда, был
    в великолепной музыкальной форме, шутил и со своей новой ролью справился отменно.
    После коротких сетов WBB и WBB+ААА начался джем и тут, да простят меня все остальные,
    хочется отметить двух музыкантов: Blacky, практически бессменного харпера, великолепно
    вписавшегося в состав хауз-бэнда и мультиГилюту, который успевал быть везде и
    всё время: и на сцене, и в зале, и с гитарой, и за клавишами. В какой-то момент
    даже стало казаться, что весь концерт превращается в «бенефис одного актёра»,
    но нет, друзья не дали оступиться, и всё закончилось благополучно.

    Отдельное спасибо звукорежиссёрам за то, что не сумели на этот раз загубить звук
    окончательно. Молодцы, ребята! Правда, вот военному гитаристу Андрею Цыганкову
    пришлось на время переквалифицироваться в звукачи, но, что ж поделать, не без
    накладочек… В общем тигры с леопардами за своё будущее могут не беспокоиться ;)'
