  text: Около месяца назад была в клубе b.b.king.Там как раз были поминки по Николаю Ширяеву.Концерт очень понравился.Тем не менее мне неястно:каким образом проходил отбор участников концерта? Наряду с  маститыми блюзмэнами выступали совершенно неизвестные люди.Помню каких-то пацанов с гармошками,которые периодически выскакивали на сцену и играли вместе с остальными.Хотя играли они весьма неплохо,осталось непонятно:кто они такие? Объясните.
