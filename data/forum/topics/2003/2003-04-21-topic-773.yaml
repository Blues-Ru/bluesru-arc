    text: тем более что мы в этот вечер поддерживали джем. В этот вечер ждали многих музыкантов, начинавших в играть 70-е и хорошо знавших Ширяева. Не буду их перечислять. Пришли только Вайт, Арутюнов, Гелюта и Алексей Козлов - спасибо им. Джемом в БиБиКе рулит Воронов. Его способ делать джем - давать выступить (по возможности) всем, кто пришел и записался. Так было и в тот раз. Пацаны с гармошками не все были одинаковы; Братецкий, например, - профи. С другими все было сложнее. В общем, непростой был джем. Вдвойне приятно, что Вам он понравился.
