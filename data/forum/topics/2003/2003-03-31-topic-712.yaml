  text: "Продолжаю всех \"травить\" Вэном Моррисоном :) Приобрела ещё одну пластинку, совместную с Georgie Fame и John Lee Hooker - Too Long In Exile (1993). \nПо обычаю, хорошая пластинка, где много так свойственной Вэну мелодически отшлифованной музыки, идеально исполненной, но, тем не менее, весьма разнообразной. Почти наполовину блюзовой.\nХочется почему-то отметить Gloria (Van Morrison) с красивой ритмической основой, исполненную вместе с John Lee Hooker.\n\nОтличной получилась Good Morning Little School Girl (Sonny Boy Williamson) во многом благодаря мощной sax-атаке (Van Morrison - Alto Sax, Candy Dulfer - Alto Sax, Kate St.John - Tenor Sax), + congas, + игривой гармонике Вэна и, конечно же, его неповторимому вокалу. Из всех вариантов этой песни, что я помню, этот звучит наиболее грязно-развязно :) Когда её поет какой-нибудь юный музыкант - всё вроде бы встает на свои места; или Maddy Waters в слегка вальяжной устало-ленивой манере - не так цепляет.. В исполнении же Вэна есть некая особая интрига. В голосе местами присутствует \"вибрато\", чем Вэн, вроде бы, особо никогда не злоупотреблял.\n\nГениально сыграна I'll Take Care Of You, где изящно перекликаются-переплетаются звуки хэммонда Georgie Fame, саксофона, гармоники Вэна и вибрафона.\nТак что, мои наилучшие рекомендации :)\n\nКупила ещё самую первую \"Blowin' Your Mind!\" (1967), что раньше у меня была на CD-R. Пластинка ремастированная, переизданная в 1998 году, куда засандалили ещё +5 бонусов - альтерантивного исполнения 5-ти последних вещей с этой же пластинки."
