      deleted: false
      text: 'Vaughn или Vaughan - ну, не вопрос (все равно одинаково читается и произносится).
        Хотя здесь есть такой момент: гитарист Steve Vaughn это один из музыкантов
        работавших над Jesus Christ Superstar в 1970. Естественно, это не SRV (забавно).
        А в буклетике диска In The Beginning (запись1980) говорится что SRV раньше
        был Stevie Vaughan (или просто - Стёпа, по нашему :-), без Ray.

        А по поводу видео Stevie Ray Vaughan & Jeff Beck что есть у вас. Как оно называется?
        Guitar Legends on Stage? Нигде не могу найти информацию об этом: ни ссылки,
        ни упоминания, ни возможности покупки по Интернету.'
