  text: 'Хотелось бы что нибудь узнать о серии совместных выступлений SRV и Jeff Beck.
    Насколько я знаю, они выступали вместе осенью 1989. В Guitar School (Apr ''97)
    попадалось упомянание о видео Stevie Ray Vaughan & Jeff Beck - Guitar Legends
    on  Stage. Есть у меня их концертное видео одной песни I''m Goin'' Down. Забавно
    в этой съемке то, что по всей видимости, она была сделана кем-то из зала (одна
    камера, её дребежание, звук записан микрофоном на камере...). Интересно, было
    ли что нибудь выпущено на CD?

    И ещё: "Unplugged and Jamming" Stevie Ray Vaughn (почему-то без предпоследней
    "a"). Здесь есть выступлений SRV с BB King и  Albert Collins, а также исполнение
    Superstition вместе со Stevie Wonder (в уандеровской арранжировке) на MTV в 1988.
    Что это за CD? Бутлег или какой-то раритет? Он не попадается в дискографии SRV.'
