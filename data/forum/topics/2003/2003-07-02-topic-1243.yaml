    text: 'А вот это тоже ты написал?


      Удивительное незнание сущности вопроса. Клэптона звали Богом тогда, когда он
      играл в Ярдбёрдз, у Мэйалла и в Криме. Тогда мало кто умел играть на гитаре,
      а Эрик уже мог дать жару на концерте - вот и вся слава юного Клэппа.

      Потом же его прозвали Слоухэнд - а вот это уже то, за что я люблю его альбомы
      и музыку вообще. Все это было только до 83 года, потом опять другой Эрик и ничего
      особенно интересного для меня (хотя есть все альбомы). Скучный, драный, алкоголик,
      безголосый? Да, это про него! Но у него есть душа и драйв у него свой, не дубовый.
      Помнишь как Мамонов про Голубя поет - "Зато я умею летааааааать!"

      А там что написано? Злобное непрофессиональное ревью человека, которому вообще
      мало что нравится судя по всему.'
