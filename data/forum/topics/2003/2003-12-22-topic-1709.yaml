  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70312211905221638&sql=Auntxlfwe5cqr\n\
    \nB.B. goes Soul! The King goes Philly Soul! Да это так! Этот релиз на ABC Records\
    \ записан в Филадельфии со знаменитыми музыкантами стиля филли-соул и филли-диско.\
    \ Играют они просто великолепно! Да тут еще и Стиви Уандер оказался рядом! В результате\
    \ три супер-хита; I Like To Live The Love, Respect Yourself и To Know You Is To\
    \ Love You! \n\nНа альбоме всего 8 треков; звучание ровное и классное! Блюзы тут\
    \ очень хороши, а остальные треки - это настоящие хиты. БиБи все дальше уходит\
    \ от традиционного блюза, но когда он играл его? Когда был БиБи без лоска и поп-музыки?\
    \ Оценка 5 баллов! Не важно что тут да как, это великолепный альбом, и он обязан\
    \ быть в любой коллекции!"
