    text: "его роль называется database design. Но приятно увидеть его фамилию, согласен. Один из коренных людей сайта allmusic.com . \nКнигу-то купить можно, кто ж запретит. Кредитка или знакомый чел за границей - самые банальные способы. \nКак обладатель второго издания, могу сказать, что книга действительно хороша! отличный биографический справочник - лишь главная его часть. А еще статьи по истории, по стилям, по инструментам. Меня греет большой раздел блюза в джазе. \"Блюзовым редактором\" раньше был Cub Koda. На главной странице в окошке поиска напишите его имя, нажмите на кнопку Go! - получите результат. Кода, как большинство хороших блюзоведов, уже отыграл свою коду (в руки бы насрать каламбуристу, но они с Робертом Палмером забодали - умирать, недожив до хотя бы до 60)\nУ Мишуриса есть зачитанное до дыр первое издание. По содержанию прогресс от первого ко второму был огромным! В третьем, по-моему, на сотню артистов больше в биографическом справочнике и тысячи новых рецензий на альбомы. ну... рецензии - вещь субъективная. \nа по любому, это лучший блюзовый справочник из всех, что я видел."
