  text: "Зная, что здесь есть те, кому небезразличен соул и то, что происходит около,\
    \ поделюсь впечатлениями от прослушивания. Если интересно, - послушайте mp3. Да\
    \ и \"по блюзу\" :), как здесь принято выражаться, там есть некая доля..\nDon\
    \ Covay, некогда работавший с Роллинг Стоунз, Аретой Франклин, Фредди Кингом,\
    \ Уилсоном Пикетом, Джоном Хэммондом (!) и другими не менее интересными персонами,\
    \ участник \"Соул Клана\" в компании Solomon Burke, Joe Tex, Ben E.King, Arthur\
    \ Conley - после долгой паузы в 2000-ом году выпустил-таки пластинку. Не один,\
    \ с друзьями. Ссылаясь на непростые для соула 90-е (а как же восьмидесятые?) и\
    \ некую болезнь.\n\n\"One of the greatest gifts to soul music and great songwriting\
    \ ever... Don Covay is a treasure,\" - написала пару фраз к этому альбому Бонни\
    \ Райт. \nМатериал пластинки весьма разноплановый, но сплоченный общей идеей легкого\
    \ глумежа.\n\"A treasure\" Don Covay :) спустя почти четвертьвековое молчание\
    \ в 62 года выпускает глумливую пластинку, где в единственном фанковом номере\
    \ со всей ответственностью, но отчего-то умирающим голосом заявляет \"I want some\
    \ poontang\", а многоголосый бэк-вокал со свойственным ему воодушевлением Дону\
    \ вторит: \"poooontaaang\".\nhttp://greta.bluesman.ru/mine/Covay/11-poontang.mp3\
    \ \n\nChill Factory красоты потрясающей, несмотря на ее поверхностную легкость.\
    \ Гитарист и продюсер альбома Jon Tiven свиртуозил в первой половине трека пару\
    \ коротеньких красивейших пассажей, затем забил на игру, уступив место столь же\
    \ ленивому, но от того не менее красивому саксофону ветерана сцены Lee Konitz,\
    \ в конце лишь вновь слегка добавил красок пьесе, заигрывая с сомнительным, лексически\
    \ ненасыщенным \"текстом\" вокалиста. \nhttp://greta.bluesman.ru/mine/Covay/05-Chill_factory.mp3\n\
    \nСоуловый Syl Johnson в \"Victims\" выдал почти U2, почти что Simple Minds.\n\
    \nИз старых своих вещей Don Covay записал здесь \"Mercy Mercy\" с вокалом Пола\
    \ Роджерса и \"Three Time Loser\" с Уилсоном Пикетом. Добротно исполненная \"\
    Mercy Mercy\" звучит несколько скучновато на этой лениво-разухабистой пластинке.\
    \ В \"Three Time Loser\" все идет к тому, что в конце так и ожидаешь потустороннего\
    \ крика-хохота Screamin' Jay Hawkins'a. А нету :)\nВ аретафранклинской \"Chain\
    \ Of Fools\" прекрасный вокал Ann Peebles.\n\nДон в нескольких вещах заигрывает\
    \ с блюзом. \"b.y.o.b\", \"Podium\" - ничего себе названия..\nВ Podium почти семь\
    \ минут глумежа над всенародным \nhttp://greta.bluesman.ru/mine/Covay/13-podium.mp3\n\
    http://greta.bluesman.ru/mine/Covay/09-b.y.o.b.mp3\n\nЕсть на альбоме и пара почти\
    \ серьезных песен. Это красивая своей исполнительской простотой \"He Don't Know\"\
    \ с Отисом Клэем, да мечтательная \"Hall Of Fame\" (rock & roll hall of fame)\
    \ с искрометным spoken intro Пола Шеффера - пианиста и органиста данного альбома.\n\
    http://greta.bluesman.ru/mine/Covay/12-hall_of_fame.mp3\n\nВ который раз убеждаюсь,\
    \ что либо на олмьюзике оценки ставят от балды, либо их оценочные критерии с моими\
    \ слабо сочетаются."
