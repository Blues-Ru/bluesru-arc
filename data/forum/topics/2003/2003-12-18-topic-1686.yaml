  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70312171538482499&sql=A2srx284r05na


    Тут есть класс и драйв Мадди и очарование великих канадцев The Band. Левон Хэлм и Гарт Хадсон - только двое из The Band на этом альбоме, но они определяют звучание всего диска, настолько яркие они музыканты. Левон играет на барабанах и басу, а Гарт творит волшебство на оргАне, аккордеоне и саксофоне. Более того, помимо Гарта и Левона тут Пайнтоп Перкинс на пианино и вокале, Пол Баттерфилд на гармошке и Боб Марголин на гитаре. Записан этот альбом в Вудстоке в студии Левона Хэлма, и это немаловажный факт.


    На альбоме 9 веселых треков, слышно, что Мадди доволен работой и ему нравится атмосфера. Аккордеон Гарта и подпевки Перкинса делают этот диск непохожим на диски Уотерса, но звучит это очень приятно. Можно сказать, что выбор материала тут слабее, чем игра и атмосфера. Оценка 4 балла; некоторые треки очень банальны (Caldonia, Kansas City), но Why Are People Like That - настоящий хит! Пожалуй, это единственный альбом Мадди после 63-го года, который стоит иметь в каждой коллекции.'
