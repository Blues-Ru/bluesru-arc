            poster: Grem
            email: sergei.sergeev@emersonprocess.ru
            subject: Господа -хорошие Вы все ругаетесь...
            deleted: false
            text: "Господа -хорошие Вы все ругаетесь, а никто даже не написал ни строчки об этом мероприятии. Я увы там не\
              \ был.... обстоятельства ,однако.\nНо очень жаль, что музыканты стали обсуждать форму, а не содержание...\n\
              \ Да побольше бы этих юбилеев и концертов с ними связанных.\nГде же еще можно собрать столько музыкантов, как\
              \ ни на этих юб. концертах и фестивалях. Так что извиняйте.... и читайте из rockmusic.ru....\n \nЮбилей Михаила\
              \ Петровича Соколова: 35 лет в блюзе. ЦДХ, 20 сентября 2003 \n\nСтолько блестящих фендеров и гибсонов в одном\
              \ концерте увидеть сложно где-либо, кроме как на блюзовом фестивале. И каждый красуется, каждый звучит и наслаждается\
              \ своим звуком, весь в бликах, красивых изгибах. Аж в глазах рябит от такого количества гитаристов. И ведь они\
              \ пришли поздравлять отнюдь не гитариста, а старейшего харпера и ударника, Михаила Петровича Соколова (или просто\
              \ Петровича), которому тютелька в тютельку стукнуло 50 лет, 35 из которых он провел в блюзе. И вот в течение\
              \ трех часов на сцене ЦДХ топтались старики-блюзовики, смачно целующиеся с юбиляром, да и со всеми подряд. И\
              \ еще блюз играли, да. Сам Петрович выглядел немного ошалевшим, как будто совершенно не въезжал, кого тут и\
              \ с чем поздравляют. В общем, слонялся по сцене и целовался со всеми подряд. Ведущим концерта должен был быть\
              \ Доктор Аграновский, которому Петрович, по-моему, так и не дал слова сказать, потому что, впав в ностальгический\
              \ маразм, уже не мог понять, кто тут ведущий, а кто - юбиляр. В любом случае, Петрович был похож на доброго\
              \ и теплого деда, без лишних капризов и претензий. Он сам все рассказывал и показывал, сам вызывал гостей на\
              \ сцену. \n\nПетрович начинал свою карьеру в группе \"Удачное Приобретение\" в качестве ударника. И вот теперь,\
              \ после стольких лет, Петрович вновь занял табуретку за барабанной установкой и вдарил, немного по-старчески,\
              \ но стильно, по-блюзовому. На сцену вышел фронтмен \"Удачного Приобретения\" со жвачкой во рту, небезызвестный\
              \ Алексей \"White\" Белов. Он был наряжен в невероятный белый костюм и держал в руках леворукий фендер, хотя\
              \ сам - правша. Зато на Хендрикса похоже. Только Джими праворукий фендер переворачивал налево, а Белов - наоборот.\
              \ В общем, крутой блюзмен тот, кто, перевернув гитару вверх ногами, исполняет гимн США. \"Удачное приобретение\"\
              \ исполнили пару известных блюзов, закончив свой сет извечной \"Blue Suede Shoes\". Ностальгическому вечеру\
              \ было положено отнюдь не плохое начало. Вообще, эти блюзмены, как же они любят ностальгировать! Я думаю, блюзмен\
              \ начинает ностальгировать в ту секунду, когда в первый раз в жизни слышит блюз, и с тех пор не перестает этого\
              \ делать уже до самой смерти. \n\nВсе гости, выходя на сцену, очень оперативно отстраивались и очень здорово\
              \ звучали, - это было отличительной особенностью концерта, очень хорошей особенностью. Вот выполз Александр\
              \ Сикорский - фронтмен группы \"Старая Гвардия\", в которой Петрович тоже в свое время барабанил. Сикорский\
              \ - толстый и веселый дядька - сыграл вещицу Рэя Чарльза, такой американский плясовой блюз, очень глупый, но\
              \ разудалый. Несмотря на непрекращающуюся весь вечер ностальгию, в музыке все же доминировал мажор, и это не\
              \ могло не бодрить. Сикорский закончил свой сет экспромтным исполнением \"Great Balls Of Fire\". Слажал, конечно,\
              \ но все равно было приятно. Опять пришло время безумных лобызаний, опять Петрович всех облобызал и отправил\
              \ за сцену, освободив место группе \"Stainless Blues Band\". А там нужно было действительно много места, ибо\
              \ Борис Булкин - это килограмм 200 чистого блюзмена. Увидев такое огромное тело, все фотографы ломанулись к\
              \ сцене. А Петрович вышел из-за барабанов, вновь надел шляпу и взял гармошку. Булкин стал довольно резво наяривать\
              \ не слишком замысловатые блюзовые пассажи: получался такой мягкий \"AC/DC\" с гармошкой. Булкин - персонаж\
              \ невероятно колоритный. Пошли более спокойные композиции, и Петрович, наконец, показал свое мастерство харпера,\
              \ он извлекал из своей гармошки на удивление протяжные и приятные звуки. Как-то ему удавалось избавляться от\
              \ резкости, присущей звуку гармошки. \n\nСледующим проектом оказался \"Blues Hammer Band\". Лидер проекта, Николай\
              \ Садиков, подарил Петровичу ящик с молотками и гвоздями и сказал какой-то тост, тоже про гвозди. Потом подстроил\
              \ свою причудливую гитару (такая гитара с особым резонатором - один из символов блюза) и начал фигачить. Такое\
              \ мочилово началось. Исполняли очень резвые блюзы и кантри с характерным саундом из-за вот этой гитары и контрабаса.\
              \ Ну а барабанщик \"Blues Hammer Band\", Александр, - его игра явилась чуть ли не лучшим моментом всего чествования\
              \ Петровича. Кстати, сам Петрович все время держался очень скромно, можно даже сказать на втором плане (если\
              \ не считать лобызаний). Пожалуй \"Blues Hammer Band\" - самый интересный проект из тех, что пришли поздравить\
              \ Петровича, и из тех, в которых Петрович принимал участие. \n\nНесмотря на все однообразие блюза, слушать концерт\
              \ становилось все интересней и приятней. Ведь блюз - это прекрасно. Такая прочувствованная музыка, такая размеренная\
              \ и сексуальная. Вот вышел Доктор Аграновский, как всегда с акустической гитарой. Играть он не умеет, но уж\
              \ больно здорово стебется. Аграновский исполнял классические, предельно простые блюзы при минимуме сопровождения,\
              \ тем не менее эти блюзы подкупали своей подлинностью. Как жаль, что Аграновский - не негр, а то было бы вообще\
              \ замечательно. \n\nБлиже к концу концерта люди уже настолько утомились, что стали целыми толпами выходить покурить-пописать,\
              \ а тем временем на сцене появился основной состав Петровича, а сам юбиляр запел. Солисты-гитаристы продолжали\
              \ сменять друг друга. Вот Игорь Дегтярюк, играл суперсмачно, с оттягом, такой клёвый дедок, и Хендрикса играл,\
              \ и еще что-то, и замочек на руке у него, - прям как панк, я не знаю. От прочих гостей просто в глазах зарябило,\
              \ в концерте приняли участие более пятидесяти человек! Тут вам и суперпопулярный Леван Ломидзе, и Вовка Кожекин,\
              \ отстаивающий свою честь в губно-гармонической дуэли с Петровичем, и еще куча фраерков. Петровича лобызали,\
              \ одаривали цветами и подарками. Все его любили, а он так и топтался на сцене, в ностальгическом блюзовом маразме.\
              \ \n\nВот уж как за три часа мне приелись эти блюзы, а ведь люди играют их всю жизнь, и ничего, здоровы (правда,\
              \ ностальгируют все время). Конечно, понятно, что надо было упомянуть всех, никого не обидеть, со всеми сыграть.\
              \ Но слушать примерно одинаковую музыку три часа - это слишком тяжело, особенно для трезвого человека. Я смотрел\
              \ на всех этих стариков и думал: как же они все прутся сами от себя и от своего блюза! Вот это действительно\
              \ дорогого стоит: всю жизнь положить на блюз, не знать ничего, кроме этой незамысловатой гармонической последовательности\
              \ и нескольких мелодических заворотов, ну и магического ритма. И в этом они нашли бесконечно прекрасный мир,\
              \ вылезать из которого никогда не захотят. И все это очень трогательно, так что многая лета, типа того. \n\n\
              Степан Максимов, специально для РокмЬюзик.Ру"
