  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70312092209002204&sql=Aaifixqrhld0e\n\nЭто четвертый альбом Люкаса и он тоже записан и издан фирмой AudioQuest. Живая запись в студии, попытка схватить и записать настроение и драйв без сведения и наложений! В 1994 году это сложновато сделать, но они очень стараются. На этом альбоме довольно большой состав с оргАном, дудками, перкуссией и четыремя гитаристами! На альбоме 10 композиций, из них 8 написал сам Роберт, а две - это 300 Pounds Of Joy и Baby Please Don't Go. \n\nАльбом начинается с интересного трека Люкаса; хороший ритм и настроение. Почти кайф ощущается на 300 Pounds; Роберт играет на добро, интересно поет и звук очень классный! Акустика остается и на Baby Please Don't Go; эту вещь Роберт исполняет один. Дальше идет пение под рояль, а потом снова один на добро! Странное продолжение после вполне традиционного начала! На второй стороне все возвращается в нормальные рамки современного блюза, но есть еще один акустический номер и даже джамп-блюз High Priced Baby!\n\nОценка 3 балла. Пластинка довольно эклектичная, но всё же ребята явно из Калифорнии. Хорошая игра в стиле старых и не очень мастеров, но не более того. Я бы хотел выделить несколько треков, которые делают этот диск интересным; это If You Don't Want Me, 300 Pound Of Joy, Baby Please Don't Go, Trust Me. Диск понравится любителям Современного Бездуховного Театрального Блюза из... Калифорния!\n\nAll the leaves are brown and the sky is grey, I've been for a walk on a winter's day\nI'd be safe and warm if I was in LA, California dreaming..."
