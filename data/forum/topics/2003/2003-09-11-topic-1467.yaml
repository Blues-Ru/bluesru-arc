  text: 'Сразу скажу, что минчане мне очень понравились.

    Играют ребята великолепно.

    Но вот что, мне не понятно - вокал.

    Это что, стилизация или пародия? Зачем зажимать нос, когда поешь? Зачем его вообще менять, хрипеть и изображать старого
    негра на сцене?

    Нет, я понимаю, что в результате всё аутентично звучит, но это же не их вокал, а тех старых перцев, которые пели архаику.

    Нет, ну я понимаю, как Svet в Horay Horay поет двумя разными голосами за бабку и за деда, это зрелищно, и забавно (мне
    очень понравилось), но всё выступление строить на ПОДРАЖАНИИ старым перцам, это правильно?

    Вот, например, Юра Коверкин, тоже поет архаику, но своим голосом.

    Помогите разобраться, на сколько это правильно.'
