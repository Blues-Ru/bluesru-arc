        text: 'Ну чо Baltica завелся? Я ж понимаю, что минчане твои ребята, и ты за них горой. Никто не хотел их обидеть.
          Ребята суперские, и исполняют здорово... ноооо... я вот представил, что выйду я на сцену, и буду пытаться петь голосом
          Вульфа или Диксона (способности к подражанию у меня есть - я могу подражать Карлсону или Бармалею из мультика),
          но это ж не я, это подражание.

          То, что народу это нравится - здорово, и мне понравилось, но как мне быть - всю жизь в чужой маске не проведешь?
          Как строить свое творчество?

          И наверняка проблемы с английским произношением у меня будут. Ценители блюза сразу опустят - "совок, а тудаже".

          Мож не стоит даже и пытаться? Играть как Братецкий на гармошке молча.


