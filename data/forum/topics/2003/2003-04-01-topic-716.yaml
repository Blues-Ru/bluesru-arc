  text: "Тут поступила официальная информация, по случаю 55-летия Фендера они проводят\
    \ очередную акцию, на джемах в течении недели отбирают 3х самых активных молодых\
    \ участников-гитаристов, чтобы подарить какие-то совсем модные гитары, не те скваеры,\
    \ что раньше. Проголосовать за кого-нибудь можно, отправив письмо на guitars@attrade.ru\
    \ с subject-ом \"Неделя Fender\". Объявлять победителей собираются в последний\
    \ день джемов в ЦДХ. \nУ меня такая гитара уже есть, с Русинова уже хватит, так\
    \ что давайте голосуйте за кого-нибудь из наших. Я проголосовал за Цыганкова,\
    \ пора ему его гитару на батарейках заменить на стоящий инструмент ;)) (Не обижайся\
    \ - спасибо потом скажешь!) ;)"
