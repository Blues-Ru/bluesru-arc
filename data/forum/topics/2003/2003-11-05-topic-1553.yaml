          Если мне не изменяет память, кто-то что-то (воздержусь от мелочных уточнений)
          играл из Чака Берри даже на Пилзнер Блюз Фестивале в Москве.

          А вот со стороны наших шоу-дельцов везти 80-летнего старика с историческим
