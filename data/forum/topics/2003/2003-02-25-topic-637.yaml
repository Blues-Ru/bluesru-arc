  text: "Всем прювет. Не так давно купила сольную пластинку старичка Pops Staples \"Peace to the Neighborhood\" (1992), выпущенную им на 78-ом году жизни, за 8 лет до смерти. Отца бесконечного количества Staples (singers) и Mavis Staples в том числе. Музыка несказанно порадовала.\nМяукающий слабенький голосок деда здесь поддерживается голосами Бонни Райт, Mavis Staples и другими Staples :) Стилей в ней понамешано душевно.\nRoebuck (Pops) Staples родился в 1915 году и за свою 85-летнюю жизнь сыграл и спел со многими, организовал Staples Singers, и, как говорят на allmusic, поучаствовал в нескольких фильмах. Может кто-нибудь видел-помнит его в Wag the dog? Напомните, плиз, где, когда и кого он там играл?\nА в 94-ом получил гремми. Кто-нибудь слышал эту пластинку?\nПредлагаю послушать несколько вещей с \"Peace to the Neighborhood\", быть может это не такой редкий диск, как хочет казаться, и его ещё можно встретить :)\n\nШикарная вещь с вокалом неповторимой Mavis Staples: http://greta.bluesman.ru/mine/Pops/08-Pray_on_my_child.mp3\nА эта - легендарная от Pops Staples: \nhttp://greta.bluesman.ru/mine/Pops/07-Miss_cocaine.mp3\nTraditional (with Ry Cooder): \nhttp://greta.bluesman.ru/mine/Pops/10-I_Shall_not_be_moved.mp3\nWith Bonnie Raitt: \nhttp://greta.bluesman.ru/mine/Pops/01-World_in_motion.mp3\nИ напоследок, сильно отличающаяся от всех остальных на альбоме: \nhttp://greta.bluesman.ru/mine/Pops/03-America.mp3\nауу-ххууу....."
