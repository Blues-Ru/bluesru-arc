  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDSUB040311261710020634&sql=A0q6wtra9kl2x\n\
    \nПоследний альбом перед первым развалом группы. Тот же состав, что и на Brothers\
    \ And Sisters, та же музыка, но все гораздо слабее. Такое ощущение, что потерян\
    \ интерес к музицированию. На альбоме есть интересные треки, но нет ощущения альбома.\
    \ Хороший кавер Мадди Can't Lose What You Never Had, как обычно длинный приджазованный\
    \ инструментал Дики, тут это High Falls. \n\nОценка лишь три балла. Этот альбом\
    \ стоит иметь для коллекции и ради нескольких ярких моментов, но это уже не те\
    \ Оллманы. В таком составе они записали лишь два альбома и тут четко слышно влияние\
    \ Чака Ливелла на группу - он превосходный клавишник! Очень советую его группу\
    \ Sea Level!"
