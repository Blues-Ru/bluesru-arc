    text: "Народ! Тут такая фигня приключилась...\nСначала краткая предыстория. Есть такая конфа на Yahoo, CharlieMusselwhiteFanClub.\
      \ Короче полудохлая конференция, посвященная Чарли Масселвайту. Когда я подписался, на нее, написал приветственное,\
      \ типа всем привет, было бы прикольно услышать Чарли в России. На что Чарли написал, что это типа не так уж сложно и\
      \ он вообще очень хочет. Вот и поговорили (-:\nПозавчера я получаю следующее письмо:\n<i>Dear Boris,\n\n\nI am an old\
      \ friend of Charlie Musselwhite's, and he asked me to contact you \nduring my visit to Moscow next week (June 26-July\
      \ 7). I have known Charlie for \n20 years; I met him through our mutual friendship with Big Joe Williams (I was \nBig\
      \ Joe's road manager and buddy). I live in Mississippi and am an attorney \n(but I am also a guitarist).\n\nCharlie\
      \ asked me to contact you while I am in Moscow concerning both the \npossibility of a tour of Russia/East Europe, and\
      \ he also said you might be able to \nintroduce me to other blues fans in Russia or direct me to good places for \n\
      music/fun.\n\nMy address/phone in Moscow is:\n<b>skipped!</b>\n\nI have a degree in Russian from the university, but\
      \ I do not have much \nopportunity to speak (therefore I am not fluent). I would like to meet you while in \nMoscow,\
      \ and discuss what needs to be done for Charlie to make a short tour.\n\nI look forward to meeting you.\n\nBlewett</i>\n\
      \nПо-русски:\n\"Я старый друг Чарли Масселвайта, он попросил меня связаться с тобой во время моег визита в Москву на\
      \ следующей неделе (26 июня - 7 июля). Я знаю Чарли 20 лет. Я познакомился с ним через Биг Джо Вильямсф (я был другом\
      \ и дорожным менеджером Биг Джо). Я живу на Миссисипи и я адвокат (?) (но также я еще и гитарист).\nЧарли просил меня\
      \ связаться с тобой в то время, когда я буду в Москве, чтобы обговорить  возможность тура по России/Восточной Европе\
      \ (во загнул-то, млин...) и также, он говорил, ты можешь представить меня блюзовым фанатам в России и направить меня\
      \ в хорошие места, чтобы послушать музыку/отдохнуть.\n\nМой адресс и телефон в Москве: <b>пошкипано</b>.\n\nУ меня университетская\
      \ степень по Русскому языку [ХЗ, что это такое, эта степень, короче, думаю он просто его изучал], но я не могу говорить\
      \ (по крайней мере быстро). Я хочу увидеть тебя пока я в Москве и обсудить, что необходимо, чтобы устроить Чарли небольшой\
      \ тур.\n\nОжидаю встречи. Блетвет.\"\n\n\nЯ ему, конечно отвечу, что я в Екб и денег катить в Мск у меня, естественно\
      \ нет, что я не \nменеджер никакой и ничего устроить не могу, но хотел бы ему дать электронные адреса и телефоны людей,\
      \ которые в Москве реально что-то могут устроить подобное. Подозреваю, что это же можно отправить Кожекину, кому еще?\n\
      \n<b>ПИШИТЕ МНЕ В МЫЛО</b>"
