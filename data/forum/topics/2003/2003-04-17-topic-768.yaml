    subject: критика
    deleted: false
    text: 'Дим, а зачем ты записываешь "ломовые" хиты, типа Black Magic Woman, так близко к оригиналу? понятно, что ты не
      просто "снимаешь" Сантану один к одному, но у меня, например, в голове в этот момент одновременно две песни - твоя и
      Сантаны :-) и Сантана звучит громче, хоть он и не играет.

      Оговорюсь, я не знаю - зачем ты записал именно эти песни. Может ты коллегам музыкантам хотел что-то продемонстрировать
      или гитару новую пробовал. Я рассуждаю с точки зрения обычного слушателя.

      Резюме мое таково: там где я слышу Казанцева ( а слышу я его на Amsterdam, Right Down Here, Help Me, Norwegian Wood,
      Sensitive Kind) - мне очень нравится :-) А там, где я его не слышу - скучновато.

      Не мое дело давать советы музыкантам, но не удержусь :-)  - записал бы ты свое и какие нибуть стандарты, не такие ассоциативно
      "привязанные" к гитарным виртуозам.

      А вообще, мне понравилось, серьезно.'
