        text: 'просто версию Сантаны я услышал раньше и она мне в подсознание запала :-) да и нравится больше оригинальной.

          ну а насчет каверов, я думаю, ты сам все понимаешь :-)

          есть каверы и каверы. если у человека есть СВОЯ история (пусть даже и не слишком большая) он мне интересен. а если
          человек хочет сыграть КАК Сантана (варианты: Машина Времени, Мадди Уотерс.....) - мне неинтересно.

          Поэтому то я и слушаю иногда наших отечественных блюзменов. Я чувствую, что человек хочет мне рассказать что-то
          о себе. Пусть даже он и лажает :-)'
