  text: "13 мая, я приглашаю всех друзей блюза на третий, по счёту, TUESDAY JAM, проводимый в клубе Дефиле. Во время предыдуших джемов на сцене\nклуба выступали многие известные музыканты. Учитывая опыт предыдущих джемов мы на этот раз решили проводить его следующим образом:\nВначале с 20-00 до 21-00 будет играть BANDERAS BLUES BAND в составе:\nИван Жук - соло, Владимир Мандрыкин - бас, Гарик Багдагюлян - барабаны, Глеб Толстой - перкуссия, Владимир Бандерас - вокал. В 21-00 когда, как обычно, все соберутся мы начнём наш джем, продолжительность которого зависит от числа его учатников. Предыдущие джемы заканчивались около 24-00 \nДля того чтобы гарантированно участвовать в джеме лучше заранее записаться по тел. 790-76-36 или прийти пораньше до 20-00.\n\n   Флаеров в этот раз не будет. Вход по билетам 150 руб. Для музыкантов бесплатно + бокал пива + один пригласительный билет для гостя. \n   Обещаем хороший звук и много, много старого доброго блюза.\nАдрес клуба \"Дефиле\": Большой Путинковский пер. дом 5, ст. метро Тверская, Пушкинская и Чеховская, телефон для справок и для предварительной записи на джем 790-76-36 (Спросить Бандераса)"
