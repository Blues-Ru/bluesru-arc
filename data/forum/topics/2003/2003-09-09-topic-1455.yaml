              text: "расхожая шутка - писать о музыке все равно, что свистеть об архитектуре. Я точно знаю, что рассуждения\
                \ о технических приемах ничего не определяют. музыка - абсолютно абстрактное искусство. я разбирал фотографии\
                \ при Федоре - он признал разбор порфессиональным. но музыка так не разбирается. Единственный критерий оценки\
                \ музыки - эмоции. Мы тут - в блюзовом форуме, и при \"разборе\" должны учитывать специфику жанра. А она снова\
                \ диктует поливерсивность. Что делать?\nЯ читал книгу Сарджента \"Джаз\" - строго музоковедческий анализ сабжа.\
                \ И что? Он написал фундаментальный по объему информации труд, который сегодня никому не нужен - несколько\
                \ маленьких ошибок в исходных точках обрушили все творение.\nИли взять Коллиера \"Джаз\" - человек в первых\
                \ строках пишет, что не признает мнение дилетантов, и будет писать строко музыковедчески. Ок, так он и делает,\
                \ разбирая по нотам пластинки... Но доходит до блюза... и строгий академик не выдерживает. Он начинает лепетать\
                \ о сходстве блюза и сонета, о классической форме прелестной, когда она нарушена. он говорит \"это маленькое\
                \ чудо ХХ века\" (не фига себе, маленькое:)) Это стого по теории? - не, ребят... алгеброй гармонию не измерить,\
                \ хоть тресни. помните, в прошлом году было модно \"фишки\" считать. Прошло, как и не было. \n\"ласковость\
                \ превращается в равнодушие, расслабленность - в безделье\" - это рецензия на альбом. А \"признанный мастер\
                \ виртуозно использует то-то и то-то\" - это фигня. \"то-то и то-то\" должно сработать на слушателя. А если\
                \ не сработало - оно уходит в область устаревший технологий, откуда их достанет тот музыкант, кто сумеет наполнить\
                \ технический прием - эмоциями. тогда ласковость не обратится в равнодушие.\nя за фактами всегда обращаюсь\
                \ к AllMusic - весьма респектабельное издание, и их огрехи простибельны в сравнении с объемом обработанной\
                \ ими информацией. Но за \"подсказкой\"... за вопросом \"а что это?\" - я обращаюсь к Роберту Сантелли, к\
                \ Чарлзу Мюррей... или к Кьюб Коде (который был сотрудником AMG) - они умеют ясно писать об эмоциональной\
                \ стороне музыке. И когда их позиция не совпадает с моим восприятием - я все-таки понимаю, о чем именно они\
                \ говорят. \nвот как-то так... яснее не скажешь, хоть это и \"неуместно\" до усрачки."
