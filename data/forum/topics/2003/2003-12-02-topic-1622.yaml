  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70312011746472941&sql=Ad0yvadskv8w1\n\
    \nПрошло девять лет после странного и неудачного альбома Грина \"The End Of The\
    \ Game\". Дебют 1970 года Грину не принес ни славы, ни денег. Чем он занимался\
    \ эти девять лет знает только он сам, но ходит много всяких слухов по поводу психушек,\
    \ работы могильщиком и даже проживание в кибуцах (не забывайте, что Питер обрезал\
    \ БАУМ после Грина).\n\nАльбом вышел на фирме PVK/Creole Records - своего рода\
    \ инди лэйбл в 70-х годах; Грин мог играть что угодно и как угодно. На альбоме\
    \ 9 песен на 40 минут. Из них 5 инструменталов. Альбом слушается на одном дыхании\
    \ и создает атмосферу боли, нежности, растерянности и красоты; видимо Питеру досталось\
    \ от жизни за эти последние десять лет.\n\nМузыка очень интересная - сочетание\
    \ блюза, рока и чего-то такого, что только Грин и умеет делать. С ним играют отличные\
    \ парни: на гитаре Сноуи Уайт, на клавишах знаменитый Питер Барденс из Camel и\
    \ Them. Перкуссия местами выше всяких похвал; должно понравиться даже любителям\
    \ Сантаны. \n\nТрудно выделять песни в таком сильном альбоме, особенно когда слова\
    \ есть только в четырех. Конечно надо отметить гениальную In The Skies, грустный\
    \ и душераздирающий блюз A Fool No More, волшебную и сказочную Seven Stars. \n\
    \nОценка 5 баллов. Это лучший альбом Грина или один из двух лучших вместе со следующим\
    \ Little Dreamer. Обязательная пластинка в коллекции каждого любителя блюза и\
    \ рока."
