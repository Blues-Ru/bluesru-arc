  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70312091704361425&sql=Ahe6fmp9f9f3o


    Это предпоследний альбом Роджерса, он умрет через три года в возрасте 73 лет. Альбом вышел на виниле и КД на аудиофильской фирме Analogue Productions Originals, что не могло не отразиться на качестве записи, - тут оно просто прекрасно (у меня винил)! Альбом очень содержательный - 13 треков на 57 минут. Здесь с Роджерсом играют известные перцы: Кэри Бэлл на гармошке, Джонни Джонсон!!! на пианино (он определяет звучание пластинки), Джимми Ди Лэйн на соло-гитаре, Дэйв Майерс на басу и Тэд Харви на ударных. Традиционный состав для блюза в стиле Чикаго 50-х и 60-х. Самое интересное и скучное в том, что и музыка тут традиционна и вне времени. Чикаго-блюз в его самой обычной форме; ничего нового и интересного. Не смотря на то, что альбом был награждем премией Хэнди в 95 году, я бы поставил этой пластинке только 3 балла. Да, тут все хорошо играют, но стоило ли в 94 году заниматься тем, что все уже закончили делать еще в 60-х? Если Вам нужны еще исполнения Walkin'' By Myself, Rock Me Baby, Howlin'' For My Darling, Smokestack Lightning, Big Boss Man, то это альбом для Вас. Мне тут ловить нечего; даже хороший звук не выручает.'
