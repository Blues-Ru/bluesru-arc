        poster: Кот
        email: kotmatrs@mail.ru
        subject: Окраина
        deleted: false
        text: 'Не так давно, у меня была такая работа забавная. Ездил я по свету, железяки всякие чинил. В Минске прожил долго.
          В других европейских столицах - тоже.

          Мое впечатление. Разрыв с Москвой - разительный. Даже многие немецкие города (а жил я в Баварии) по сравнению с
          Москвой - жуткая провинция, где уже давно ничего не происходит.

          А в Минске было совсем грустно. Мне грустнее было только в Абхазии и в Кинешме. Даже в Тюмени - сильно веселее.

          Но это - личное впечатление. Впечатление что в Минске - отличная почва для блюза. Именно то состояние.

          Я не имел ввиду МОСКОВСКАЯ провинция. Скорее - Европейская провинция. Скучно там, стыло. Ничего не происходит и
          заторможенность на уровне совка 70 годов.'
