      subject: Ну ты и выступил,Леша:-)) Что за окраины?
      deleted: false
      text: Белорусь пока еще суверенное государство и Минск столица этого государства. Я еще где-то прочел типа того, что
        блюз есть не только в столице России но и в провинции, что доказали музыканты из Минска. За тчность цитирования не
        ручаюсь, но смысл был именно такой....
      replies:
      - id: 14361
