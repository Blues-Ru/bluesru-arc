  deleted: false
  text: "Друзья, простите за оффтопик и позвольте предложить вам диван.\nНа днях я понял, что мне не нужен диван и все это\
    \ время он был у меня только потому что он оч.крутой. Я поделился этой проблемой с Мальчевским Александром, на что он\
    \ дал совет: \"Сделай постинг на блюз ру, там бедные блюзовые люди, которым точно негде спать.\nТак вот, диван. Он очень\
    \ мягкий и, если так можно сказать насчет дивана, обтекаемых форм. Спинка (она же вторая его *половина*) может находится\
    \ в трех положениях (горизонтальное, градусов 80, и 55). По бокам каждой части есть такие \"уши\" (каждое размером в пятую\
    \ часть от *половины*), которые также могут находится под разными углами (со знаком плюс).\nЦвет преймущественно синий,\
    \ но палитра сине-желто-песчаная. Внизу ящик для белья. \nОтличный все же диван. Да, возраст - где-то полтора года. Хочу\
    \ 300 у.е. (новый стоит более 450)\nЕсли кому интересно, могу скинуть фотку и точные размеры.\nТакая вот меня на днях\
    \ посетила идея.\nda_physh@mail.ru"
