  deleted: false
  text: 'Конец сезона. Кругом явления, символизирующие власть стихий. В Афинах, колыбели демократии, сажают русского миллиардера в изгнании. Кругом дожди и градобитие. У меня аккумулятор в машине сел, а "Алабама" крякнула и отменила два концерта. По этому поводу в свободную пятницу пошел в "Оракул" на группу Джаспер Ли под руководством Ростика Звездина. Его многим приходилось слышать в ситуации блюзовых джемов, но это совершенно другая история. От гига я получил настоящее удовольствие. Рост, этот экстатический визионер психоделического блюза, и все остальные музыканты молодцы. Особенно лид-гитарист (простите, не знаю имени). Играли, правда, некую смесь - и Роллингов, и Пресли, и Твист Угейн, вплоть до "Шляпку оставь" Кокера. Специфика места. Но те блюзы, которые были в программе, прозвучали как надо (ребята играют и Хукера, и Вэйтса). Группа с гряноватым драйвом, некоторой трёхнутостью, с солистом, которого порой закидывает - ни на кого не похожая.

    А вот "Оракул" - весьма дорогое, гадкое и негостеприимное место. Ну да тут не клубное обозрение.'
