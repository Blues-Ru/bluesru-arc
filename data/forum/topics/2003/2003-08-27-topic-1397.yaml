    text: 'Этот альбом я записал незадолго до того как меня забрали в армию.

      Первые месяцы самые тяжелые: ни музыки, ни женщин, ни алкоголя, что и говорить - поговорить не с кем (русскоговорящих
      в роте: раз-два и обчёлся)...

      Но вот однажды, уже стемнело, проходя мимо домиков где жили офицеры я услышал знакомый голос. Я побежал на звук (во
      дворе никого не было, работал радиоприёмник, какая-то не наша волна).

      Хукер пел Hittin'' the Bottle Again.

      Ноги подкосились. Я опустился на землю. Слёзы встали в глазах.

      Вспомнил как услышал её в первый раз по радио: Евдокимов представил её как "Снова берусь за бутылочку" (записывали тогда
      на магнитофон те передачи).

      Эх... "мне бы его проблемы с бутылочкой" думал я.

      Да и вообще, многое вспомнилось.

      Я заплакал.'
