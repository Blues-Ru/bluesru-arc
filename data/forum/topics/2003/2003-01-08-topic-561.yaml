  text: "Слушайте, вчера прикололся по полной программе.\nХочу поделиться, где довелось услышать пиано блюз (точнее-фрагмент).\nПосреди дня (только оклемался после встречи Рождества) включаю телек, по TV-3 идет какая-то западная дурка - то ли сериал, то ли фильм с сексуальным уклоном, только без эротики. Типа, какие-то проблемы буржуазной пары плюс ко всему они еще хотят \"завести\" ребенка и сдают какие-то тесты и анализы.\nЯсен пень, обычно такое сразу переключаю, но спросонья мало чего соображаю, пью кофе и тупо смотрю эту дурку.\nИ тут \"Сцена Дня\" - герой собирается сдавать на анализ, извиняюсь, эякулят, очень волнуется, садится за рояль, играет ...блюз и поет.\nДословно воспроизвести не берусь, но что-то типа:\n\"Завтра у меня анализ спермы и на тумбочки стоит горшок...\n Завтра у меня анализ спермы и на тумбочке стоит горшок...\n Придется утром (что-то типа) мне тебя подергать, не подведи меня, дружок...\"\n В конце герой-исплнитель подвывает вместе со своей собакой...\n У меня челюсть отвисает, глаза вылазят, но нахожу в себе силы, толкаю жену и говорю \"Дорогая, вот это тоже блюз\".\n Занавес.\n P.S. Кто-нибудь это вчера видел? Ваша реакция, если можно."
