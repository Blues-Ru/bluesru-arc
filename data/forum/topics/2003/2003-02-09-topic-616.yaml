  text: "Мариам и \"Мирайф\" .... Да...это была музыка. Жаль,что не было практически никого из завсегдатаев джемов. Там было, что послушать и было на что посмотреть. Послушать - отличный джазо-блюзо-фанковый вокал с великолепными,виртуозными музыкантами ,посмотреть - как сами они кайфуют от того, что они делают. \nУвидите где нибудь объявление о выступлениях этих музыкантов - пойдите ,не пожалеете.... Я уверен, что многие из интересующихся этой музыкой их уже слушали, но те кто не знает их, получат огромное удовольствие. Самое главное, что-бы Мариам была в настроении петь и тогда можно услышать и почувствовать такую подачу, такой драйв, что мало не покажется.... Думаю, Док Аграновский был так-же впечатлен их выступлением. Алексей!!! Ну как??????"
