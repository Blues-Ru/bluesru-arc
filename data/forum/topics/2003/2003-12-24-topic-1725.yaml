    text: Вообще надо узнать, если первоначальные знания на гитаре. Если начинать вообще с нуля, то для начала легче обратиться в местный кружок (или любое его подобие). Если осваивать блюз как стиль, то надо снимать, двигать по грифу, акцентировать по другому и анализировать. По поводу медиаторной техники - можно зайти на один из многих спецгитарных сайтов.
