        text: "а еще много чего видел, но на все нет денег, как всегда.\n\nБыл в СОЮЗе, там восхитительный выбор блюза опять! Новые издания, новые переиздания. Цены от 190 рублей!\n\nГлаза сразу заметили новые переиздания БиБи - дорого по 20 долларов, но не смог удержаться и купил Guess Who - необходимый альбом. Осталось мне найти только Luicille Talks Back и у меня будут все нужные БиБи 70-х - это всегда приятно.\n\nПорадовали издания Мэйолла (такие же как БиБи) - два диска в коробке - цена как за один нормальный диск. Купил Notice To Appear/A Banquet In Blues и Hard Core Package/The Last Of The British Blues - 4 ломовых альбома!\n\nДорвался и до Руфуса Томаса - два главных альбома на Стаксе - Do The Funky Chicken и Did You Hear Me? - веселуха вместе с Букером Ти и ЭмДжиз.\n\nНе смог уйти от Алберта Кинга (хочу собрать его всего). В итоге купил лучшие, что там были - Blues For Elvis, The Lost Session (продюсер Мэйолл), New Orleans Heat и Lovejoy - вообще кайф! \n\nПорадовала цена в 190 рублей на два первых EW&F - взял сразу (теперь у меня все до 77-го года - кайфы).\n\nНе удержался когда увидел второй Митерз за 10 долларов - взял второй (у меня в другом дизайне).\n\n\nТам ОЧЕНЬ много новых дисков и изданий - просто праздник какой-то ;)\n\nНе ленитесь. Или мп3 и болванки интереснее?"
