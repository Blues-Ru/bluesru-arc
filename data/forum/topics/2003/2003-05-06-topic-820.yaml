          subject: Понятия
          deleted: false
          text: "Так, я напомню историю вопроса. Жили были блюз.ру и гитарз.ру. Блюз.ру занимался блюзами (с 96 года), гитарз.ру гитарами. Названия сайтов обязывают полно и объективно освещать соотв. тематику. Все прекрасно. Дальше Тынку придумал \"стебный\" сайт, на котором сначала вешал безобидные материалы про Регину Дубовицкую. У меня, к примеру, некоторую ухмылку когда-то вызвала какая-то одна первая статья с картинками. Забавно, новый подход, тема для стеба и т.д. Все остальные статьи были построены по кальке, т.е. не отличались друг от друга - везде \"стеб\", доведенный до абсурда и т.д. Они уже были не смешными (одна шутка несколько раз - уже неостроумно). Однако принцип доведения до абсурда был сохранен. \nПод конец появилось 2-3 статьи, кажется, про БиБиКинга, про блюз и что-то еще, которые по ФОРМЕ были грубым хамоватым обсираловом. В стиле 12-летних мальчиков, которые общаются у подъезда. При этом, подразумевалось, что это - смешной стеб, который не надо восприминать всерьез. Несколько человек, я в том числе, выразили сомнения в художественных достоинствах последней статьи, а также в том, что понятие безобидного стеба к данной форме уже плохо применимо. За что нас обвинили в том, что мы не понимаем юмора. ;) Т.е. чуваки, которые сегодня выступили на гитарз.ру, его ТОНКО почувствовали, а у нас не хватило чувства юмора ;) Вот это - действительно смешное предположение. Уверяю вас, дорогие мои, что психология грубого не очень умного подростка, для которого это смешно, для меня, к примеру, как на ладони. Я прекрасно понимаю, почему ЕМУ это может быть смешно. При этом для меня этот юмор - детский и туповатый.\nНу да ладно, речь шла о том, что форма плохо приемлима. А смешно - не смешно, это не так уж и важно...\nВ какой-то момент Тынку даже угрожал блюз.ру тем, что воспользуется популярностью гитарз.ру, чтобы всех нас крепко обо...рать.\nТынку первый открыл войну. А домен bluesmen.ru был его орудием. К тому же, домен использовался не по назначению. А теперь скажите, почему я или Цыганков должны нести Тынку домен на тарелке с голубой каемочкой, говорить, \"обсирай нас дальше, дорогой, нам приятно и смешно\" после того, как он его нечаянно обронил, а в течении двух месяцев о нем НИКТО так и не вспомнил?\nС законом - все ясно, освобожденный домен может зарегистрировать любой. Но где тут понятия, объясни? Мне так кажется, что Тынку должен был извиниться за свои статьи, а люди с вашего форума за свои дворовые слова...\nP.S. Мне кажется, что доменное имя в новом качестве будет использоваться с большей пользой. \nА теперь претензия к гитарз.ру по части использования домена по назначению - я очень уважаю этот ресурс и все такое. Но, мне кажется, что Тынку стал местами использовать его в своих целях. 1) Вышибать деньги из At Trade и прочих контор 2) удовлетворять свои обиды, рекламируя блюзмен.ру и пр. А где анонсы концертов Хендерсона и Скофилда?????? Или они денег не заплатили????? Почему на блюз.ру они висели и висят, хотя не по теме и бесплатно, а на гитарз.ру их нет??? Тогда честно признайтесь, что гитарз.ру - это не ресурс про гитару и все, что с ними связано, а частная лавочка. На блюз.ру никогда такого не было, и не будет..."
