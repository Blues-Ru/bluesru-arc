    text: "чем шутить на нём (от последнего предостерегал Набоков). В данном тексте самое главное - удобно ли тебе его петь. Его недостатки как \"текста\" или \"песни\" роли не играют. Они есть. Например, игра слов \"фрискобилли\" не оригинальна: и \"психобилли\" использован, и \"Dix-А-Billy\" (была такая песня W.Harris et al.) То есть натоптано. Но это, повторюсь, ерунда. \nА вот то, что автор не боится выставить написанное на общественное обозрение - ему в явный плюс."
