      subject: Согласен с тобой.
      deleted: false
      text: 'Но только вот волнует меня такой вопрос: насколько большая разница между "некомерческим обменом" о котором ты говоришь и "выкладыванием музыкальных файлов на сайте". Ведь, по сути, это одно и тоже - обмен (не обязательно обоюдный), просто во втором случае он принимает болеее массовый характер. Хотя, наверное, самая большая разница в том, что первое, кажись, не запрещено (пока???), а второе вне закона.

        Вопрос для меня на самом деле насущный, т.к. у меня сайтик на котором и выложены более сотни мр3 файлов. Практически все эти файлы я скачал в Сети (часто используя peer-to-peer программы) и закачал себе на сайт.'
