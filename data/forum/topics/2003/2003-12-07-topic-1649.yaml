      - id: 16160
        parent_id: 16155
        date: 2003-12-10 10:46
        poster: Andy mcletsoff (McL)
        email: mcl@macbox.ru
        subject: Обмен музыкой
        deleted: false
        text: 'Хочется напомнить, что есть такие вещи, как библиотеки, и никто не считает криминалом читать некупленные книги и даже (ой-ой-ой!!!) давать их почитать другим. Так в чем разница? Если я слушаю музыку, где написано, что я не имею права давать диск кому-то еще послушать? Или что он не имеет права переписать его себе?

          На эту тему считаю уместным упомянуть о предпринятой небезызвестной фирмой Apple попытке торговать музыкой в Интернете. Человек может скачать песню или диск и закачать ее на 3 компьютера. По-моему, в том есть разумное зерно.

          Вторая сторона вопроса, как мне видится, такова: Судя по всему, сейчас пошла очередная борьба с пиратством. Хорошо, согласен, за музыку надо платить. НО...

          А не получим ли мы в результате свободный доступ к дешевым попсовым дискам, а всякие "специфические" музЫки будут просто недоступны большинсту людей, в том числе по причине их стоимости. Согласитесь, новичок не пойдет в "пальцатый" магазин покупать неизвестную ему музыку за 50, да даже за 20 баксов. Либо он знает, что берет, либо проходит мимо. Вот так вот и люди "пройдут" мимо блюза.

          А возможность скачать что-то из Интернета, или взять послушать у знакомых рано или поздно приводит в магазины за покупкой этих дисков.

          Ну, прикроют нам еще один источник информации. Будем мы читать обзоры Димы, верить ему на слово - "Чуваки, диск номер 3656793 по каталогу AllMusic - ацтой, или Дурь." Короче, кулинария по телевизору нам останется - верьте, это вкусно, а как пахнет!.

          Что делать-то будем, господа хорошие? ;)))))))

          Простите за многословие'
