        subject: 'Re: Согласен с тобой'
        deleted: false
        text: Я не юрист, но насколько я понимаю, обмен  - это сделка заключенная между двумя людьми, и не более того. В этом случае тяжело придраться с точки зрения закона, даже если предложения обмена где-то разрекламированы. А файлы, выложенные в интернет, становятся доступными неограниченному колличеству пользователей, т.е. налицо массовое распространение, в обход авторских прав.
        replies:
        - id: 16190
          parent_id: 16166
          date: 2003-12-11 14:42
          poster: Elicaster
          email: elicaster@mmmmmmmmmmmmail.ru
          subject: 'Re: Re: Согласен с тобой'
          deleted: false
          text: 'Не думаю, что обмен - это сделка заключенная только между ДВУМЯ людьми. Полагаю, что их может быть и больше. Но это на самом деле не важно, не будем за слова цепляться.

            Вопрос не прост. Представим такую ситуацию, хозяин сайта убирает все ссылки для скачивания со своей странички и оставлет только названия песен и исполнителей (при этом сами файлы остаются в каталоге сайта) и помещает на странице предложение примерно такого содержания: "Если вы хотите получить данный МР3 файл, посылайте заявки на е-мейл". Конечно, в этом случае посылать каждому индивидуально файлы будет весьма хлопотно, поэтому в ответе будут ТЕ САМЫЕ удаленные ссылки. И технически не трудно это: автоответ на каждый е-мейл, даже не надо за ящиком следить. Человек получает в ответе ссылки и закачивает нужный ему трек (бесплатно, без рекламы).

            В итоге получается частная переписка между двумя людьми (и здесь, как бы, не придерёшься), НО по сути это мало чем отличается от ситуации когда ссылки для скачивания находятся прямо на сайте.

            Что я хочу сказать, стоит ли с этим бороться, когда такой "обмен", в принципе, непротивозаконен, когда распространение файлов может найти такой легальный выход.'
