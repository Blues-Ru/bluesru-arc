    text: Выкладывать на сайте музыкальные файлы - криминал чистый, нарушение авторских прав налицо. А вот некомерческий обмен законодательством не запрещен. Можно запросто в рамках форума договариваться об обмене и пересылать друг другу CD-R по почте.
