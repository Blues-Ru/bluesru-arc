  text: 'Есть идея - создать в рамках этого сайта раздел, на котором бы выкладывались для закачки

    (например раз в неделю) диски в формате wav, для дальнейшей записи на матрицы.

    Это было бы большое подспорье для любителей блюза, разделенных большим расстоянием.

    Очевидные проблемы:

    - проблема с копирайтами;

    - проблема с серверным местом;

    - ну и проблема с желанием хозяев сайта этим заниматься ;) .

    Заранее спасибо за внимание.'
