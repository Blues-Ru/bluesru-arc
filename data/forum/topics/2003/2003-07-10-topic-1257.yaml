      text: "Об электрогитаре: \n\nПри общей схожести акустической и электрогитары, между ними есть и \nпринципиальные отличия.Начнем с грифа.У электрогитары он уже и длинее и \nвместе со специфической формой корпуса позволяет дотянутся аж до 20 \nлада.Струны расположены ближе и к друг к другу ,и к грифу.Это позволяет \nприкладывать меньше усилий для их прижатия .Вернемся к корпусу \nэлектрогитары. Приемущества его формы мы уже стметили, теперь поговорим о \nтом что на нем находится.Это набор ручек и кнопок,звукосниматели и \n\"качок\".Ручки отвечают за тембер и громкость,а кнопки включают и \nвыключают звукосниматели. Они бывают одиночные - сингл или двойные - \nдабл.Дабл лучше.На электрогитаре звукоснимателей бывает несколько, \nпоэтому включая их в различных вариантах получим различную окраску \nзвучания инструмента.\"Качек\" ,он же вибрато,он же тремола - рычаг на \nпередней панели корпуса.При подтягивании его к грифу струны \nослабивают,звук затухает.Попробуйте и оцените этот прием.Все это \nхорошо,но чтобы электрогитара оправдала свое название необходимы еще две \nвещи:\"примочка\" и усилитель.Если с усилителем все \nясно(см.м/ф.\"Ну,погоди\"), то на \"примочке\"остановимся по подробней.Ее еще \nназывают \"эффекты звуков\".Это небольшая коробочка без которой \nэлектрогитара ни чем бы ни отличалась от акустической.Именно она ,главным \nобразом, и отличает их.\"Примочки\" бывают разных видов.Наиболее \nраспространеная \"дисторшен\" ,дающая резкие, гудящие звуки.Даже легкое \nкосание струн вызывает \"рев\".Другая \"примочка\" - \"квакушка\".Ее можно \nуслышать послушав \"металику\" или \"ганзы\".Еще есть \"хол\" - эффект \nэха,\"блюз\" - тут все ясно и др. Так что выберайте ,что вам нравится и \nвперед к вершине Парнаса.\n\nВсем знать наизусть! Особенно про ДЛИНУ и ГАНЗОВ!"
