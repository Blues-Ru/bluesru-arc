    text: 'Пользуясь случаем, хочу сообщить, что скоро выходит журнал, посвященный
      этой группе. Идея создания журнала возникла у сайта LedZeppelin.Ru, когда стало
      известно, что огромное число российских фэнов LZ лишены возможности пользоваться
      услугами интернета. Не секрет, что музыкальные издания печатают информацию о
      разных группах и исполнителях, а этой легендарной команде отводится незаслуженно
      мало места. Поэтому появится этот журнал, фэн-зин, который будет посвящён исключительно
      Led Zeppelin. Заказ журнала по адресу: order@ledzeppelin.ru или 109144, г. Москва,
      а/я 22. Стоимость журнала - 100 р.'
