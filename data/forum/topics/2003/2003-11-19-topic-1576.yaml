      text: 'Рассказывалось так - в 1975 году вроде) перед очередными гастролями в
        США в день вылета Пейдж элементарно прищемил себе палец в лондонской подземке,
        причем неудачно - ему загнуло мизинец дверью.

        Он в таком виде и полетел в Штаты и играл, пока не надоело терпеть боль. Когда
        сунулись к врачу - выяснилось - переломы. Руку заделали, но из-за позднего
        обращения мизинец уже слушался хуже.

        Так он стал великим гитаристом ;))))))))'
