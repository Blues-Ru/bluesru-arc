  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDCASS70311210441102671&sql=Abve097r7krat\n\nLightnin’ Hopkins – Soul Blues – 1964\n\nМощный альбом! Тут Хопкинс с басистом Леонардом Гаскином и барабанщиком Херби Ловеллом. С первых нот нешуточный напор и хорошая блюзовая злость и цинизм. Это уже не совсем интимный и нежный акустический Лайтнин; здесь рождается то, что потом будут называть роком. \n\nАльбом длится 42 минуты и состоит из десяти треков. Отличная по качеству запись и очень специальное настроение у этой сессии. Я, конечно, не слышал всех пластинок Хопкинса, но считаю этот альбом лучшим (пока лучшим). Здесь много известных тем: My Babe, I’m A Crawling Black Snake, Black Ghost Blues. Все вещи настолько интересные и яркие, что трудно выделить даже один (так всегда на альбомах Лайтнина – они почти концептуальны). Rocky Mountain Blues – моя любимая вещь тут, но я уверен, что Вам может понравится и другая. \n\nОценка 5 баллов и пока это лучший Хопкинс в моей коллекции.\n\nBlack ghost, black ghost, please stay away from my door\nYou know you worry poor Lightnin’ so now, I just can’t sleep no more…"
