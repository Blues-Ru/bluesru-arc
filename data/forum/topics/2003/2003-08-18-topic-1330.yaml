  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=CASS80308171832&sql=Aogdnvwxva9qk


    Это шестой альбом Алберта на фирме Стакс. Можно считать, что это вообще его шестой альбом, ибо до этого были только сборники и непонятное издание на Чесс вместе с Отисом Рашем.

    Это уже шестой альбом, но это лишь начало его звездной карьеры на Стаксе. Born Under A Bad Sign был великолепен, Live Wire/Blues Power - не самый лучший концертник по записи и исполнению, Blues For Elvis - это почти шутка - все песни Элвиса!!!, Years Gone By - необходимая компиляция, но не более того, Jammed Together записан на троих + Стив Кроппер и Попс Стейпл, был еще Lost Session под руководством Мэйолла, но он вышел гораздо позже.

    Так что получается, что это лишь второй НОРМАЛЬНЫЙ номерной, продуманный альбом. Неплохо продуман. Продюсер и автор многих вещей - Дон Никс; этот плохо не делает никогда.

    Странно, но по хитам (не путать с хитовостью самого альбома) - это самый мощный альбом Алберта! Тут не обошлось без сильного влияния Таж Махала - сразу две вещи с его второго альбома (обе хиты до него и после) - Corrina, Corrina и She Caught The Katy And Left Me A Mule To Ride. Во как! Но самое удивительное - это начало альбома - Honky Tonk Women Роллингов!

    И что же мы имеем тут? Надо помнить, что сам диск писали в 70-м, а вышел он в 71. Есть тут и РОК (вот странно-то), есть кантри-блюз, есть соул, фанк, блюз и даже неблюзовая баллада (последний трек Like A Road Leading Home). Все вместе очень интересно.

    Альбом не длинный - 36 минут, всего 9 треков, все разные. Это здорово! Ну а где же минусы? Да их почти нет. Разве что немного странный состав для Стакса - из "букеров" только Дональд Данн (бас), да еще каким-то странным образом затесался не менее великий Джим Келтнер на барабанах. Может еще немного не совсем сформированный стиль блюз-фанка, который Кинг довел до совершенства в 70-х. Тут же еще блюзовый по звуку альбом. То есть он хорош и по музыке и по игре и записи - Стакс все-таки.

    Отличное начало великого великана! Но сливки дальше. Я бы дал этому альбому твердые 4 балла. Почему не 5? Ну не знаю. Считайте, что баллада в конце не нравится ;)

    Эту пластинку должен иметь каждый, кто называет себя поклонником блюзов (для любителей фанка и соула - тоже "маст"; рокеры могут отдыхать - Хонки Тонк в этом испонении им врядли понравится).

    Стакс рулез - как говорят наши сисадмины или как их там...'
