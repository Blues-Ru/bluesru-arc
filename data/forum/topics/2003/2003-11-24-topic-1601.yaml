    text: 'Чтобы не было путаницы я называю НОМЕРНЫМИ только студийные альбомы Алберта. Параллельно выходили концерты, переиздания и сборники. У Алберта всего 14 номерных альбомов:


      01. Born Under A Bad Sign - 67

      02. Years Gone By - 69

      03. Blues For Elvis - 70

      04. The Lost Session - 71

      05. Lovejoy - 71

      06. I''ll Play The Blues For You - 72

      07. I Wanna Get Funky - 74

      08. Truckload Of Lovin'' - 76

      09. Albert - 76

      10. King Albert - 77

      11. The Pinch - 77

      12. New Orleans Heat - 78

      13. In San Francisco - Crosscut Saw - 83

      14. I''m in a Phone Booth, Baby - 84


      У меня не хватает только двух последних, но я их слышал и они ТОЖЕ хорошие (куплю как только увижу), хотя и слабее альбомов 70-х годов. Все эти 14 альбомов стОит иметь в коллекции, поверьте мне.


      Спасибо за внимание.'
