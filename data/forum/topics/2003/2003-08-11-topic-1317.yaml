  text: 'Диск о идее создания которого я уже однаэжды говорил практически готов. Старался выполнить все просьбы написавших мне и в результате получилось так. По группам: Ragtime,Stainless Blues Band,Арутюнов и ЧЕР-ТА(с новым составом записи пока нет),Мишурис и его оркестр(новый состав),Черный хлеб,Dr.Nick,Crossroadz,Lexicon оркестр.По участникам(так как в есть записи с джемов): Русинов,Каверкин,Воронов, Владимиров,Ломидзе,Белов,Михайлов,Кожекин,Жук,Красивов.УФ !!! Вроде бы все.Торжественное вручение:) всем желающим начнется,я так думаю,не раньше четверга.Извините уж,всеж довольно круглый день варенья .Чакры от воздействия алкоголя уже открыты и придут в нормальное состояние где-нибудь к среде,поэтому раньше ну никак не могу. В общем пишите,звоните,заходите.

    p.s

    Главные мои помощники жена,сыночек,кошка и черепаха одобрили и подборку и качество. Будет интересно услышать и Ваше мнение.'
