  subject: Концерт Юрия БОРИСОВА (контр-тенор) и Ольги МАРТЫНОВОЙ (клавесин) - 1 марта 2003
  deleted: false
  text: "Юрий БОРИСОВ (контр-тенор), Ольга МАРТЫНОВА (клавесин)\n\nв новой концертной программе\n\n“ AH ! HOW SWEET IT IS TO LOVE !” (“АХ ! КАК СЛАДКО ЛЮБИТЬ !”)\n\nСветская вокальная и клавесинная музыка русских, итальянских и английских композиторов 17 - нач. 19 вв. (Д.Бортнянский, О.Козловский, Г.Теплов, А.Скарлатти, Г.Перселл, Д.Дауленд), сочинения для клавесина И.Прача и У.Берда \n\nЛюбовная лирика. Новая веселая динамичная программа известного московского контр – тенора Юрия Борисова и очаровательной клавесинистки Ольги Мартыновой (лауреат международных конкурсов; Парижская и Московская консерватории, Высшая музыкальная школа Бобиньи; солистка ансамбля Moscow Baroque) состоит из широко исполняемых за рубежом, но большей частью неизвестных российскому слушателю жемчужин западноевропейского музыкального Возрождения и Барокко, а также цель исполнителей – познакомить зрителей с прекрасными популярными в 18 – нач.19 в. сочинениями русских композиторов, незаслуженно забытыми и редко исполняемыми.\n\n1 марта 2003 г. Начало в 16:00\n\nКонцертный зал гостиницы «Золотое Кольцо» Управления Делами Президента РФ\n\nАдрес: ул. Смоленская, д. 5. Вход в концертный зал через центральный подъезд гостиницы «Золотое Кольцо».\n\n Проезд: ст. метро Смоленская.\n\n Билеты 150 руб., льготные 90 руб.\n\n Справки по тел. 725-0271, 725-0272. Email: NCStars@mail.ru\n\n_______________________________________________________________________________________________\n\n    Во времена Ренессанса, Барокко в Европе необыкновенной популярностью пользовались певцы - кастраты (некоторых из них, обладавших особенно высокими голосами, по диапазону сравнимыми с женским сопрано, соответственно называли сопранистами). Они занимали главенствующее положение в опере, долгое время были незаменимы в католической богослужебной традиции, так как вход в храм женщине был запрещён; тем более лица женского пола не могли принимать участие в музыкальном сопровождении мессы или любой другой службы. Поскольку ангелы, доведись их услышать, по всей вероятности пели бы высокими серебристыми голосами, композиторы предпочитали поручать ведущие партии в своих сочинениях именно высокому чистому голосу, и сначала эту роль с успехом исполняли мальчики. Но с течением времени музыкальная наука шла вперёд, на смену относительно простым вокальным рисункам приходили новые и всё более развитые интонации. С другой стороны мальчики не могли постоянно звучать ангелами, они взрослели, и вместе с ними менялись и их голоса. Тогда в обиход вошла кастрация как средство для продления молодости мальчишеского голоса. Она позволяла как бы законсервировать звучание, остановить естественное развитие голосового аппарата. Наряду с сохранением светлого звонкого регистра в процессе взросления голос приобретал мужскую силу, широту диапазона (иногда поражающую воображение) и многие вокальные возможности, недоступные для ребёнка. Стали возможны для реализации самые смелые, самые технически изощрённые вокальные замыслы. Позднее кастраты практически подчинили себе оперный театр, в расчёте на них писались все заглавные партии, все античные цари и боги пели со сцены исключительно высокими голосами. Мастерство некоторых таких певцов, по свидетельствам многих современников, потрясало, их вокальные возможности считались неслыханными. Этому сейчас всецело веришь, стоит лишь бегло полистать партитуры некоторых не только барочных опер, но также духовных сочинений композиторов XVIII столетия. Порой кажется, что отдельные арии просто невозможно исполнить средствами человеческого голоса, это по силам лишь неземным созданиям. Всё это так красочно показано в фильме \"Фаринелли - кастрат\" (режиссёр Gerard Corbiau), посвящённом одному из самых известных исполнителей этого времени.\n\nИтак, в концерте 1 марта прозвучат английские и итальянские вокальные произведения XVII - XVIII веков, которые в большинстве своём могли быть написаны как раз для очень высокого мужского голоса. Ныне, как за рубежом, так и в России этот репертуар исполняют контр - тенора. Не следует путать их с кастратами, которые получили своё название от вполне понятной процедуры - физического увечья. Природа звучания голоса контр - тенора и кастрата различна уже хотя бы тем, что контр - тенор - это способность полноценного мужчины - певца петь высоким голосом, используя определённый механизм работы мышц, в то время как голос кастрата - неестественным образом полученная данность. Впрочем, как и кастраты, контр - тенора, безусловно, представляют собой яркое явление в музыкальной культуре, в наше время они совершенно незаменимы в едва ли не каждой сколь-нибудь исторически и стилистически достоверной постановке оперы или оратории XVI - XVIII веков. Не говоря уже о том, что в XX столетии интерес композиторов к такому голосу начинает переживать новое рождение, а аутентичная постановка вокально - инструментальных сочинений с непременным участием контр - теноров становится модной."
