            text: 'Два жлоба на дорогом джипаре въехали в жигули простого рабочего парня.

              По законам жанра последний должен был достать бооольшой гаечный ключ и отпендюрить жлобов по самое некуда. Еле выжившие жлобы вызывают ментов и рабочего парня отправляют в кутузку. И вот он сидит и поет о том, каким макаром он в эту кутузку угодил, и как бы он хотел выйти на свободу и встретиться с какой-нить клевой телкой. Это, конечно, не блюз, но зато самая что ни на есть кантруха - как раз в духе покойного Джонни Кэша.


