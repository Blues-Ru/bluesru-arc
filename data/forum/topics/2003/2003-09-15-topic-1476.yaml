          text: 'Хотя у Макаревича и не очень получается играть блюз, но в его книжке попадаются интересные моменты, вполне блюзовые:

            "...Настроение было превосходное, и, выруливая на Дорогомиловку, я произнес что-то восторженное насчет того, как все здорово, и какая дивная погода, и как мы сейчас замечательно все сделаем, и придут друзья, и выпьем, как люди.

            С этими последними словами я и въехал в зад одиноко стоящего на светофоре "Жигуленка".

            Улица была пуста, скорость моя близка к пешеходной, и объяснить произошедшее чем либо, кроме вмешательства потусторонних сил, я не могу. От слабого удара джип мой не пострадал, но "Жигули" распались на части, как в фильме "Братья Блюз", и открылся крепко держащийся за руль потрясенный их водитель. И он, и "Жигули" его были сильно немолоды, и понятно было, что это первый и последний автомобиль в его жизни.

            После того, как мы все опомнились, утешили хозяина "Жигулей", пообещав ему склеить его машину на лучшей станции, и отъехали с места катастрофы, Юз (Алешковский) посмотрел на меня очень серьезно и сказал: "Запомни, мудило: ангелы слышат МЫСЛИ, а бесы - СЛОВА. Поэтому о хорошем достаточно ПОДУМАТЬ, ТРЕНДЕТЬ не обязательно". (C) А.Макаревич "сам овца"

            Вот и с текстами и подачей примерно также :)'
