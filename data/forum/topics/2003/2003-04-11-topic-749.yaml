                                    люди идут, чтобы послушать Сатисфэкшн, Итс Онли Рокнролл и Браун Шуга, так и на АукцЫон
                                    люди идут, чтобы послушать Осколки, День победы и Дорогу (которую, кстати, ещё не каждый
