                                      deleted: false
                                      text: "С некоторых пор (искусствоведы в штатском меня пусть поправят) искусство делится\
                                        \ на две категории. \nПервая - для всех и для каждого. Образовательный ценз не нужен.\
                                        \ Музыка для тех, у кого есть уши, уши и ничего кроме ушей.\nВторая - искусство, в\
                                        \ котором без поллитры не разберёшься. Сначала надо что-то почитать, набить полный\
                                        \ тезаурус (слуховой, зрительный и какой-то там ещё..), а ужо опосля слушать. Искусство\
                                        \ герметическое, для посвящённых.\nОднако и здесь, и там есть мастера. Например, возьмём\
                                        \ наш любимый жанр блюза. Альберт Коллинз доступен и понятен всем на слух с первого\
                                        \ прослушивания. А вот Скотт Хендерсон, хотя и может задушевно исполнить \"I cant\
                                        \ climb the fence...\", но его авангардно-фьюжновые трактовки вечнозелёных тем являются\
                                        \ больше музыкой для музыкантов, чем для слушателей.\nДык вот я о том и речь веду.\
                                        \ Как говорил тов.Жданов на Первом съезде композиторов СССР, \"композитор должен уметь\
                                        \ сочинить народную песню\". Впрочем, я об этом уже говаривал месяцев пару назад...не\
                                        \ буду повторяться."
