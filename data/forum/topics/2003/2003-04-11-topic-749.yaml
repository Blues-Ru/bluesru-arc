                text: "Ну, на Боуи билеты были дороже, чем $100, а народ-таки пришел.\nУ нас проблема в том, что и на Уэйтса\
                  \ пойдут, потому что это круто, но вовсе не те, кому действительно это интересно, но кто не может это себе\
                  \ позволить, а богатая тусовка. Не зря же Боуи после концерта в Кремле плакал и ругался на самую отвратительную\
                  \ публику в мире. При этом, конечно, многие нормальные люди на концерт не попали. \n\nДумаю, что в процентном\
                  \ отношениии, Том у нас популярен не менее, чем в Европе или в Америке. Скорее даже более популярен. Культовый\
                  \ артист, как никак. Чьи еще гастроли объявлялись на пустом месте, с единственной целью привлечь аудиторию\
                  \ на что-то еще. А русские сайты ему посвященные? Да хотя бы тот факт, что тот же Сукачев перепел именно\
                  \ его песню, а не что-нибудь еще, говорит сам за себя.\n\nЧувствую, что сейчас меня будут убивать, но тем\
                  \ не менее скажу. Аукцыон, на мой взгляд, такой же, если не худший совок. По крайней мере за последние годы,\
                  \ они по моей шкале ценностей стали куда ближе к Чижу, чем к Гарику. Один приличный альбом за 8 лет и бесконечный\
                  \ чес по городам и весям с песнями из него говорят о многом. Вот уж у кого планка качества упала ниже некуда.\n\
                  \nPS Похоже, пора с этой темой завязывать. Уж очень далеко мы ушли от блюза."
