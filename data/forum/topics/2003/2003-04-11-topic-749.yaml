          subject: Подпольные
          deleted: false
          text: 'Что Чиж, что Сукачев пытаются производить музыку, которая по своему характеру не-мейстрим, не должна выпускаться
            на мейджорах, исполняться на стадионах. Не то, чтобы она была в самом деле такова, но эти артисты явно ее для
            себя такой видят. Они играют кавера, заимствуют ходы, и все такое. Однако при этом цели преследуют, обычные для
            любого советского артиста - к примеру, как Николай Трубач или Алена Апина. Эфиры на телевидении, интервью "Семи
            дням", дом за городом, построенный по понятному проекту, белые стены, черная мебель. И цели эти заставляют их
            становиться ближе к народу. Все ближе, и ближе, и ближе. Постепенно времена группы "Заход солнца вручную" остаются
            все дальше. Жизнь зато становится все лучше.

            Трудно сейчас гадать, насколько будет велика аудитория у артиста, который решится играть в России музыку, "как
            Том Уэйтс", или "как Джонни Дауд", или "как Мэднес". Играть без скидок на всеобщую сиволапость. Мне думается,
            что он вряд ли даже площадку найдет. Ну, может и найдет, не берусь утверждать. Судя по тому, какими темпами продвигается
            в массы блюз, на продвижение может уйти вся жизнь. Отрадно только, что, например, блюз все-таки продвигается.
            Что же до остального, Том Уэйтс пока превращается в Сукачева, "Мэднес", грубо говоря - в "Ленинград". А граждане
            приходят на концерты и, как сговорились, делают вид, что пришли на настоящий концерт. Главное ведь что? Миллиард
            раз повторить, что Гарик Сукачев - это такой у нас Уэйтс. Если бы кто вдруг заявил, что Уэйтс - это как Мадди
            Уотерс, долго бы этот товарищ проработал бы еще в журнале "Роллинг Стоун"?

            Кстати, сам Сукачев как относится к тому, что его сравнивают с кем-то? По идее, ему, с таким-то тщеславием, должно
            быть как-то неуютно.'
