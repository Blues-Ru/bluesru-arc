              deleted: false
              text: 'Уэйтса во всем мире и популярность его в наших палестинах - разные, по-моему, вещи. Немногие подданные
                Российской Федерации были бы готовы выложить сотню за его концерт, или все-таки - многие? И я, слава Богу,
                ошибаюсь? Что касается Чижа и Сукачева - ну, наверное, они разные артисты. Это понятно хотя бы из того, что
                у них разные фамилии. Однако, если слушать помногу и каждый день зарубежных артистов, разница между артистами
                отечественными как-то нивелируется. Какие бы у них не были развеселые и благие намерения. И пути.

