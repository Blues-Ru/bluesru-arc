            text: 'Я бы не стал сравнивать Чижа с Сукачевым. При всех своих понтах Гарик был и остается человеком, старающимся
              идти своим путем. Не думаю, что ему очень льстит сравнение с Уэйтсом. Другое дело, что получается у него далеко
              не всегда, и многие вещи кажутся уж очень наивными или притянутыми за уши.


              Другое дело Чиж, который может быть и написал пару пошлейших, но не самых ужасных песен в свое время, но всю
              дорогу упорно пытается пролезть наверх в бесменном образе старого циничного хипа. То есть он-то как раз типичный
              представитель отстойного совкового шоубиза.


              Что же касается аудитории, то давайте не будем забывать, что при всей своей оригинальности, Уэйтс, например,
              весьма успешный поп исполнитель. Билеты на его последние концерты в Европе и Америке стояли по $100 за штуку,
              и при этом залы были распроданы за месяц до шоу. Не Модонна, конечно, с недельными выступлениями в Мэдисон Сквер
              Гарден и билетами от $200 до $2000, но вдвое дороже, например, чем Стинг или Кинг Кримсон. Короче говоря, популярность
              к жанру имеет не прямое отношение. Дело в основном все-таки в таланте.'
