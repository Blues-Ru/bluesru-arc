  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=CASS80308281348&sql=A3gjyeai14xf7\n\nЭто 11-ый и последний альбом Тажа на Коламбии. Конец эры \"классического\" Таж Махала. Он запишет еще два альбома для фирмы Уорнер, а потом начнутся мелкие лейблы, странные концертники, почти полный уход из музыки на несколько лет, но это будет потом, через несколько лет. \n\nЗдесь же, на этом диске 76 года, представлены 9 композиций. Таж решил продолжать использовать разные жанры, стили и ритмы, но не забывать о блюзе и ритм-н-блюзе. Этого альбома ТОЖЕ нет на компакте; сколько же уже их у него не издано?\n\nАльбом начинается с отличного блюза Миссиссиппи Джона Хёрта Satisfied 'N Tickled Too в интересной реггийной обработке. \nДальше идет New E-Z Rider Blues - неяркая и непонятная вещь, имеющая немного отношения к блюзу.\nТретий трек Black Man Brown Man опять реггийный, хороший, но скучный и незапоминающийся.\nЧетвертая вещь - Baby Love - соул-баллада аж на 9 минут, но где же мелодия и энергия черной музыки? Что-то не то происходит с музыкой Тажа на этом диске. Он будно \"отписывается\" этим последним альбомом для лейбла.\nПоследний трек на первой стороне - знаменитая тема Ain't Nobody's Business. Ждешь ее с нетерпением, ибо не очень хочется ставить двойку за первую сторону диска любимому Тажу. Таж играет эту вещь прекрасно - это один из его коронных номеров вместе с Fishin' Blues, Hesitation Blues и Come On In My Kitchen. Этот трек просто-таки спас первую сторону пластинки, но в середине провал!\n\nВторую сторону открывает вещь Руди Косты (саксофониста из группы Тажа) Misty Morning Ride. Типичная карибская почти инструментальная композиция, но без ярких мелодий и тем. \nЗатем идет Easy To Love - фанковый номер с хорошим грувом и мелодией. Таж редко обращается к соулу и фанку, но делать он это умеет - с ритмикой у него все в порядке.\nТретий трек на второй стороне - Old Time Song - Old Time Love - что-то типа шуточного соул-блюза с мелодией как у Джонни Гитар Уотсона - хорошая вещь!\nПоследний трек этого альбома - We Tune - чистой воды латинский поп-джаз. Зачем это было нужно Тажу, я не знаю.\n\nЧто же мы имеем? Таж написал ВСЕГО две неяркие песни, собрал еще 7 не самых лучших порой каверов и все это хорошо записал. Получился очень слабый альбом, может быть самый слабый аж из 11 альбомов 67-76 годов. Жаль, очень жаль.\n\nОценка 3 балла, тут есть что послушать, но в основном скучно и не очень интересно.\n\nBye bye Columbia!"
