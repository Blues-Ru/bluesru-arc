  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=MISS70308172049&sql=Afzd0yl3jxpbb\n\nЕсли я напишу, что это лучшая работа\
    \ Джона, то это будет неверно. У ДМ есть блюзовые и неблюзовые альбомы. Так вот этот лучший неблюзовый. Это мой любимый\
    \ альбом Джона (попробуй-ка выбери из полсотни его творений).\n\nЧто тут хорошего? Тут ВСЁ делает Аллен Тюссо. Он всегда\
    \ делает ЭТО отлично (кто-нибудь может назвать слабую пластинку с его участием? То-то!)\nОн написал большинство песен\
    \ к этому альбому, набрал правильный состав, сделал умопомрачительные аранжировки, он ЗАСТАВИЛ ДМ правильно петь (мы знаем\
    \ немного странную манеру ДМ, но не забывайте, что он старше Аллена и достаточно упрям).\n\nЧто тут играют? А всё играют.\
    \ Южный соул, фанк (в стиле Митерз и Др. Джона с Митерз), соул-блюз, Битлз даже играют - Эй Хард Дэйз Найт - хорошо играют,\
    \ почти на одном аккорде!\n\nЧто тут плохого? ВООБЩЕ НЕТ ТАКОГО! То есть весь альбом отличный от начала до конца. Даже\
    \ песни, написанные Джоном. Звучит очень утопично, но это так.\n\nВеликолепная школа для начинающих басистов и драммеров.\
    \ Игра Тюссо на клавишах - это незабываемое ощущение. Так никто больше не играет. Его игра самобытна как игра Др. Джона\
    \ или Ричарда Ти, например. \n\nМоре музыки, вкуса, грува, Аллена, немного Джона (а может это и хорошо?)\n\nЭто пластинка\
    \ имеет рейтинг 5 и нужна просто ВСЕМ! Разве что любителям металла и шансона не стоит ее слушать - они не поймут.\n\n\
    Тюссо - это голова!"
