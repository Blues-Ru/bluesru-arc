  deleted: false
  text: "Сколько раз хожу на Арутюнова, и всегда только лишний раз убеждаюсь, что круче и профессиональнее вокалиста на нашей блюзовой .. гм.. блюзово-фанковой сцене (да простят меня все прочие вокалисты) нет. Было просто СУПЕР! Нет слов! Переполняют эмоции. \n   Любой проект Николая – это шедевр. Будь то «Лига блюза», Арутюнов  и «Чер-Та» или вот теперь Арутюнов и «Funk You». «Tower Of Power», James Brown и многое другое – вся классика фанка в оригинальных аранжировках группы в исполнении Арутюнова и компании.  Би Би Кинг стоял на ушах. Апплодисменты, переходящие в овации (круче, чем на съездах партии ;)). Наполнявший воздух апельсиновый аромат, постоянно доносившийся из соковыжималки, стоявшей как раз возле меня, лишь усиливал ощущение лета, солнца и праздника. Одним словом ФАНКА.\n   Меня предупреждали, что в Би-Би сейчас большие (ещё больше, чем месяц или два назад) проблемы со звуком из-за тех самых новых злобных соседей сверху. Всё было OK! Звонкий тенор-саксофон, клавиши, бас, гитара, ударные, замечательные бэк-вокалистки, ну и, конечно, сам маэстро. Мой сосед по барной стойке, который перед началом ворчал, что блюз, фанк и прочее г.. – это всё вонючая попса, а слушать надо «Megadeath» и «ZZ Top», прыгал и орал,  как ребёнок, а по окончании разве что не целовал Арутюнова со слезами на глазах.\n   «Funk You very much!» - воскликнул Николай на прощание. \nВчера был последний концерт сезона. Впереди у группы каникулы. Следующее выступление в Би Би Кинге в субботу 30 августа. \n    Друзья! Приходите! Не пожалеете!"
