                    рекомендую. Он по-прежнему не устарел.

                    Кстати, любители экзотики, могут раздобыть альбом "Jesus'' Blood Never Failed Me Yet" Гевина Брайрса.
                    Уэйтса там много. :-)

                    Что же до сборников, то весьма грамотно подобран прощальный сборник "Beautiful Maladies: The Island Years".
                    К нему можно даже ноты купить, если вдруг возникнет желание переиграть старика Тома.


