                      text: 'Ghost Dog, конечно, отличное кино, но, по большому счету, это уже другой Джармуш. Собственно
                        рекомендуется посмотреть все, что достанете. Но начать можно, раз уж мы в теме Тома нашего Уэйтса,
                        например, с Down by Law и Night on Earth. В первом он играет, ко второму написал музыку. Оба фильма,
                        как, впрочем все, что снял Джармуш, великолепны. Безумный Mystery Train стоит посмотреть предварительно
                        по возможности ознакомившись с одноименной пластинкой всяких разных блюзеров, которые писались на
                        Sun Records. Dead Man стоИт, равно как и Ghost Dog, немного особняком. Так, что там еще осталось...
                        Starnger than Paradise - пожалуй самый непритязательный фильм (а может я его просто плохо помню).
                        Еще есть три короткометражных Coffee and Cigarettes, из которых я видел только одну, последнюю с Уэйтсом
                        и Игги Попом. Если вдруг где найдете - смотреть обязательно. Все остальное я не видел. Хотя там не
                        так уж и много осталось: документальный фильм Year of the Horse про Нила Янга, который написал музыку
                        для Dead Man, пара совсем старых фильмов, да, пожалуй, и все. Хотя нет, вру. Есть еще эпизод в Ten
                        Minutes Older: The Trumpet, который снял Джим. Он, да еще один, снятый Вимом Вендерсом - лучшие в
                        фильме. А всего там 7 частей, снятых разными режиссерами и никак друг с другом не связанных (есть
                        еще 8-частевый Ten Minutes Older: The Cello, но его я не видел и там Джармуша нет).


                        Как-то многословно получилось. Кстати, в прошлом году Down by Law был переиздан в виде двух DVD, на
                        втором из которых есть куча интервью, не вошедших в фильм сцен, телефонных разговоров и тому подобного.'
