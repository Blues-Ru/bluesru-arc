                subject: представление != концерт
                deleted: false
                text: 'Как известно, "Franks Wild Years" - это представление в двух актах, с которым Том довольно долго гастролировал.
                  Постепенно оно обрастало другими песнями, в том числе и теми, что на альбомах не попадались. В частности
                  одной из его лучших песен - "Strange Weather", написанной специально для одноименного альбома Марианны Фэйтфул.
                  Big Time, тот что на видео, примерно наполовину состоит из этих самых представлений, снятых в Лос Анджелесе
                  и Сан Франциско, плюс что-то вроде сюжетных связок и конферанса. Режиссер Chris Blum постарался на славу.
                  На мой взгляд это лучший музыкальный фильм. К сожалению, на DVD его никак выпустить не соберутся.


                  Треки на CD с фильмом не совпадают. Кроме LA и СанФран, использованы записи концертов в Дублине, Стокгольме
                  и Берлине. Плюс одна студийная песня ("Falling Down"), записанная отдельно другим составом. Что там на LP
                  и MC я сейчас уже не помню, так как видел их лет пятнадцать назад (когда вышел альбом), то точно знаю, что
                  они частично не пересекаются с CD.'
