            text: "мы имеем:\n\n - \"Big Time\" (желательно во всех его 4 вариантах, то есть CD/LP/VHS/CS - они все разные,\
              \ по минимуму CD/VHS)\n - Soundtrack \"Night on Earth\"\n - \"Black Rider\"\n - \"Alice\"\nНа данный момент\
              \ все, если, конечно, тебя не интересуют отдельные появления TW в качестве гостя. Потому что, если интересуют,\
              \ то добавь туда Teddy Edwards \"Mississippi Lad\", Chuck E. Weiss \"Extremely Cool\", Tin Hat Trio \"Helium\"\
              , John Hammond \"Wicked Grin\", и Soundtrack \"Liberty Heights\" и Soundtrack \"Big Bad Love\"."
