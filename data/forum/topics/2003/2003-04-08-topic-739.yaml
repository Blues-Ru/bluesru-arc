                deleted: false
                text: "концертник, конечно. Но это не повод его отметать за ненадобностью к прослушиванию :) Хороший концерт.\
                  \ \nНа Bone Mashine есть куча хороших песен. Одни только Black Wings и I Don't Wanna Grow Up чего стоят.\
                  \ А потом, как же Jesus Gonna Be Here?\nУ меня из последних, что нет у тебя, есть:\nBone Mashine\nBig Time\n\
                  Black Rider\nAlice\nРекомендуется ещё Chuck E.Weiss \"Exremely Cool\" и John Hammond \"Wicked Grin\" - без\
                  \ преувеличения две гениальные пластинки с его участием.\nБери и слушай, а что-то переслушивай. Если у тебя\
                  \ это не очередное позерство :)\nКстати, у Тома есть отличный, гениально подобранный сборник - Used Songs(1973-1980).\
                  \ Хорош будет не только для ознакомления тем, кто плохо знаком с Томом. Но и просто рекомендуется его иметь\
                  \ - там очень выдержано настроение, благодаря чему многие вещи звучат иначе, чем на номерных альбомах."
