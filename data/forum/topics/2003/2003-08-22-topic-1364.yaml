  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=CASS80308211549&sql=At69ds32ua3bg\n\nКакие у нас ассоциации при имени Оллман Бразерз? Два барабанщика, два шикарных гитариста, которые играют и по разному и в унисон, шикарный оргАн Грегга и его необычный вокал, тягучие блюзовые рок-песни, длинные импровизации, всегда хорошая игра на инструментах... Так ведь? Но все это было давно, в конце 60-х, начале 70-х, а потом были очень слабые 70-е и развал в 81 году. Я никогда не верил в камбэки подобных групп, но увидел их видео 2000 года и решил попробовать. Так получилось, что начал я именно с этого, третьего альбома после воссоединения.\n\nИ что же тут? Есть два драммера, да еще одного перкуссиониста добавили; гитаристы на месте и на высоте; Грегг прекрасен; есть и музыка и импровизации - короче, звучит как в 70-е! Я сначала не поверил, но потом расслышал и уже позже вычитал, что это ЖИВАЯ запись в студии. То есть играют живьем, но нет зрителей, хиппи всяких и прочих подонков ;) Может играли и не по разу, но это дела не меняет.\n\nСразу скажу, что альбом ХОРОШ, но это, конечно, не ранние Оллманы. Всё вроде бы тут, но дух уже не ТОТ, а этот. Кому-то это может и понравится, но я все же люблю старую музыку и мне тяжело до конца любить записи 80-х и 90-х.\n\nИграют тут и по блюзу местами, но в основном это тяжелый, тягучий, классный, неяркий, довольно серьезный блюз-рок. Есть немного фолк-баллад. Я бы выделил тайтл-трек Back Where It All Begins и Everybody's Got A Mountain To Climb (обе вещи Дики Беттса). Вообще, все вещи, кроме одной, написаны группой - это похвально. Продюсер альбома - знаменитый Том Дауд - он сделал все, чтобы альбом был и живым и классно записанным.\n\nЯ поставил твердую 3 этому альбому. Ему не хватает яркости, легкости, юмора, но все остальное на месте и у меня появилось желание купить и другие их пластинки 90-х, а ведь это главное в нажем деле!\n\nИ так, этот диск (почти оффтопик на блюзовом сайте) я советую любителям блюз-рока и хард-рока (это много интереснее, чем все гаримуры и прочие тинлиззи, учтите это). \n\nWhen it all began, Gregg, brother Duane was alive.\n\nPS: если Вам интересно мое мнение, то лучшим альбомом Оллманов я считаю Idlewild South - их второй получасовой альбом 69 года."
