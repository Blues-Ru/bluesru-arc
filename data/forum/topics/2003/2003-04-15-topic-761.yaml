  text: 'Еще одно открытие - этот альбом драммера из группы Бэнд.

    Альбом вышел в 77 года, сразу после развала Бэнд.

    По качеству музыки и игры эта пластинка не хуже самих Бэнд.

    С Левоном играют: Booker T. Jones, Dr. John, Paul Butterfield, Fred Carter, Steve Cropper, Duck Dunn, Howard Johnson,
    Tom Malone, Lou Marini, Alan Rubin - то есть ВСЕ РЕБЯТА (они же Blues Brothers в последствии).

    Особенно хочется отметить игру Пола на гармошке. Это что-то очень правильное - мастер гармоники не лезет вперед, играет
    мало, но ценно, каждый звук и нота на месте. К сожалению, у нас так играть вообще не умеют. Даже Джон, даже Братец Кий.


    О гармошке.

    Очень сильно меня расстроил Некрасов на последнем джеме. Как мне сказали после гига, все было мимо и непонятные ноты на
    хроматике (то же мы слышали и на сцене). Кто-то говорил, что он - лучший харпер в России? Может лучше вообще тогда без
    Харпа в блюзе, чем с такой хроматикой?'
