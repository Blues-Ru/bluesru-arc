                deleted: false
                text: 'только о каком именно джазе идет речь?

                  Если о раннем (классическом) или свинге/блюзе, то там все от блюза пришло.

                  Если о бопе, то я лучше промолчу.

                  Ну а если о современном (после 60-х), то Eric Gale, Kenny Barrel, Cornell Dupree, Crusaders, все они очень
                  много играют блюзовых тем и нот (пентатонику+).

                  Про наш джаз я молчу, ибо это отдельная история.

                  Про авангардный джаз или ECM тоже не стоит говорить, но я уверен, что ЛЮБОЙ приличный джазовый сессионный
                  музыкант может прилично сыграть ИМЕННО по блюзу (без джазового говна и бредовых последовательностей).'
