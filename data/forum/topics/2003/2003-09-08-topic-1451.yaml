  text: 'http://www.blues.org/ibc/index.html


    "In order to keep the Blues alive, new talent must be cultivated. The Blues Foundation
    started the International Blues Challenge (IBC) with this theory in mind. Blues
    organizations affiliated with the Foundation stage regional competitions around
    the world and send the top unsigned artists from their region to compete in the
    IBC finals in Memphis. The winner receives a cash prize, studio time, appearances
    at several major Blues events around the country and the title of "Best Unsigned
    Blues Band". The judges also present a guitarist with the Albert King Award for
    the most promising guitarist. "


    Кто Россию будет представлять ?

    Кого пошлете?'
