        text: "Это не по-джентельменски - писать отрицательные рецензии на девушек. Не понравилось, ну и молчали бы себе. Не хочу никого учить, но мне кажется, что это не совсем красиво. \nЕще раз хочу сказать свое мнение - Меджик мне очень понравились. А поставленный на уши зал - это объективная реальность, измеряемая громкостью и продолжительностью апплодисментов. В этот вечер никому так не хлопали, как им."
