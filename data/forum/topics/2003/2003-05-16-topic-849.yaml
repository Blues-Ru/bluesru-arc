    deleted: false
    text: "Какой джем был, мама! \nВ смысле: лето, жара, дачи, а в ВУДСТОКе биток. Хвалить никого не стану (надо бы всех), кроме именно что Мagic. Неожиданное, сложное и удачное выступление из пяти рок-н-роллов, поставившее зал на уши. За день за джема наш ударник взял у Наташи кассету, и сыграл с ними так естественно и точно, словно репетировали.\nДавайте дружить дальше! \nНе в тему, о потерянной песне: мне прислали сайндтрек к \"Сердцу Ангела\", так вот там нет ни хрена этой песни, которая в финальной любовной сцене. Right Key, Wrong Keyhole - роскошная, но другая песня - ее поет Лилиан Бот вслед за Брайни МакГи в баре. Ну ладно, кого волнует чужое горе...\nНу, еще раз - Magic очень в кайф. \nСпасибо Юле, Инесс, Юрию, Андрею и всем всем всем."
