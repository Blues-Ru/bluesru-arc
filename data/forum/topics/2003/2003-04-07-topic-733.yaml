              email: gypsy@mail.ru
              subject: Тезис сей напоминает мне услыханную где-то глупейшую шутку...
              deleted: false
              text: "Тезис \"трава - не наркомания\" напоминает мне \"один раз не пид%^ас\". \n\nАлексей, Михаил и Дима уже\
                \ высказали то, с чем я полностью согласен, причём в лучшем, чем у меня стиле. Однако хочу внести свои два\
                \ цента.\n\nВ мире есть сушности, без которых было бы лучше. А ещё лучше, если бы их вообще не было. Например,\
                \ трава, не говорю уже о тяжёлых наркотиках. И апология их в любом виде опасна для умов неокрепших.\nГрета,\
                \ чес-слово, я отлично понимаю твоё честолюбивое желание победить в любой полемике, но это явно не тот случай.\n\
                \nКофе и никотин - не наркотики. Они стимуляторы. Они не изменяют сознание, в отличие от травы. К тому же,\
                \ кофе и чай не вызывают привыкание. Уважаемые гипотоники, предвижу ваши возражения, но это не тот механизм\
                \ привыкания. А алкоголь - наркотик, но срок привыкания к нему более продолжительный. К тому же, физиология\
                \ привыкания другая.\n\nКто хочет провести медицинский диспут? С удовольствием приму ваше приглашение :)"
