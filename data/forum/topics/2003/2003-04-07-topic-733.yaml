                                                  деньги, начинает работать та самая потребность. Мелкие дилеры, как правило,
                                                  наркозависимы, они получают вещество в долг, с условием возврата денег через
                                                  фиксированный срок. Вот они бодяжат, так бодяжат. Иногда они употребляют
                                                  продукт сами, что, конечно, создает некоторые проблемы для барыги, но в
                                                  основном для них самих. Барыги никогда не попадают настолько сильно, чтобы
                                                  прогореть. Норма прибыли настолько велика, что покрывает любые растраты.
                                                  А глупые нарки рано или поздно приползут на брюхе и попросят свой дэцел.
                                                  Нарисованная картина несколько идеализирована. Например, не учтено довольно
                                                  частое вмешательство коррумпированных карательных органов. Существуют еще
                                                  кружки умельцев, выезжающих летом на огороды, а затем всю зиму промышляющих
                                                  запасенным. Или вот медработники тоже иногда подрабатывают - рецепты, таблетки,
                                                  омнапон и т. д. Однако процесс стремится к упорядоченности и все больше
                                                  и больше принимает форму пирамиды. Я сознательно не касаюсь криминальных
                                                  сторон дела, поскольку именно они известны публике лучше всего.

                                                  Термин "пирамида потребности" ввел Уильям Берроуз. Эту методику в несколько
                                                  измененном виде используют деятели МЛМ.

                                                  Наркоманию как болезнь не изучает никто, нигде, никто из докторов и, следовательно,
                                                  никто в мире. Иначе бы под видом антинаркотической пропаганды не выходил
                                                  бы в свет бред сивой кобылы. Всякий, кто видел по НТВ программу "Кома",
                                                  поймет, о чем речь. Единственное, до чего дошли яйцеголовые за десятки лет
                                                  своей псевдо-деятельности - метадоновая терапия. Результат, достойный доктора
                                                  Менгеле. Потому что зависимость от метадона - это Вам, Майор, не легенькая
                                                  героиновая встряска. Это уже совсем другие деньги на лечение.

                                                  От подсчета лет, согласен, ничего не меняется. Хотя, насколько помню, Михаил
                                                  сам попенял мне, что, дескать, ничего я о нем не знаю, даже возраста, а
                                                  делаю выводы. Уж очень сильным было желание созорничать, Майор, ведь то,
                                                  как и что пишет Михаил, характерно для названного возраста, как след от
                                                  гусеничного трактора характерен для гусеничного трактора.

                                                  Забавно, Майор, что Вы сочли Михаила угнетенным и обиженным. Ведь именно
                                                  так позиционировали себя первые христиане. Ему должно быть лестно.'
