              text: 'Вред не от самой травы, а от того, что определенная часть людей с не очень гипертрофированной силой воли
                (никто про себя так не думает поначалу) и без "царя в голове" после регулярного употребления травы, которая
                приводит голову в приятно-дурное состояние, начинают пробовать более сильные средства, ибо просто трава уже
                не дает того кайфа. Это происходит не со всеми, но с большим количеством народу. Заранее точно угадать, с
                кем случится, а с кем - нет, не удается. Есть куча примеров самонадеянных наркоманов, которые долго были уверены,
                что со мной-то этого не произойдет.

                Чай, сигареты и алкоголь в больших объемах дают гарантированный, но часто меньший вред здоровью и состоянию
                личности, чем тяжелые наркотики. Кроме того, пристрастие к ним поддается большему контролю, и в большей степени
                определяется средой, личностью и пр. На тяжелые наркотики можно навсегда (т.е. до конца своей короткой жизни)
                попасть практически "случайно".

                И еще один довод к тому, чтобы не злоупотреблять травой. Дело в том, что если вы ее покупаете, вы голосуете
                рублем и поддерживаете сучье-фашистское племя наркоторговцев, которые своими действиями погубили огромное
                количество достойнейших людей. Причем, у этих красавцев (в отличие от употребляющих хипов-интеллектуалов,
                к примеру) никаких возвышенных целей в их деятельности нет. Они готовы губить людей ради получения денег.
                Учавствовать в этом как активно, так и пассивно, на мой взгляд - глубоко аморально. Те, кто торгуют травой,
                продают детям и другую, гораздо более смертоносную дрянь.'
