                          deleted: false
                          text: "Но примерно именно так часто происходит. Статистика - вещь упрямая. На ней вся реклама основана.\
                            \ Авторитет говорит, люди слушают. \n\nАвтомобили ИЖ - дерьмо по определению, но если их Панкратов-Чёрный\
                            \ и Дуров рекламируют, то многие слушают его, а не читают результаты краш-теста в журнале \"За\
                            \ рулём\", где русским по белому написано, что данный продукт отечественного автопрома спроектирован\
                            \ как бы специально для самоубивцев за рулем, потому что даже при правом-переднем столкновении\
                            \ рулевая колонка уходит в сторону водителя на 30 см, а движок прям как на салазках на евонных\
                            \ лонжеронах плавненько въежжает в салон, поддавая горячего маслица на новопреставленного...\n\
                            А многие даже прочитавши \"За рулём\", слушают-таки Дурова и Панкратова-Чёрного, потому как есть\
                            \ такое понятие в социальной психологии \"внешне-референтные личности с ориентацией для авторитеты\"\
                            . И их сознание непрозрачно даже для их собственного мнения. Они всю жизнь свою строят ориентируясь\
                            \ на чужое мнение. И даже жизнь за него могут положить. Хорошо, когда им вовремя попался авторитет\
                            \ с положительными жизненными установками...\nА компьютер и трава вещи разные в том смысле, что\
                            \ компьютер - он проводник информации, то бишь посредник, непосредственного действия не оказывает,\
                            \ как бумага, на которой книги печатают. А трава действует сама по себе, в бумагу только для удобства\
                            \ употребления завёрнутая.\nИ чес-слово, не стоит специально говорить детям о всей гадости, которая\
                            \ в жизни встречается, заранее, с целью профилактики. Детская психика сама по себе содержит множество\
                            \ нам, взрослым, непонятных блокировок от зла. Но они преодолеваются, если на них концентрировать\
                            \ внимание ребёнка. Дети непрозрачны для опыта взрослых. Аргументы \"будешь пить и курить - станешь\
                            \ такой, как тот дядя на картинке\" на них, увы, не действуют, так как у них нет собственного\
                            \ опыта ощущения возрастных изменений, особенно деструктивных. Тот дядя для них как бы данность,\
                            \ дети и подростки не в состоянии сделать обобщение \"я и тот дядя - люди\" и на его основе выполнить\
                            \ операцию дедукции \"то, что случилось с тем дядей, может случиться и со мной\".\nДля них \"\
                            тот дядя\" выглядит скорее как клоун из МакДональс, которого можно подразнить, а особо смелым\
                            \ - и спародировать. А копирование поведения увы, неизбежно вызывает интерес к атрибутам этого\
                            \ поведения, то бишь уровню предметного окружения. Рюмочки, стаканчики, косяки, баянчики. Маленькие\
                            \ дети в песочнице пластмассовым шприцем тыкают себе в сгиб локтя, и это страшно. Они уже воспроизводят\
                            \ популярную модель поведения взрослых...\nИнтересующихся странной фразой про \"непрозрачность\"\
