  text: Я вообще блюзом не увлекаюсь. Всегда ассоциации были связаны с Вороновым и его выступлениями в клубе "Бункер". Естественно
    знаю БиБиКинга и Гарри Мура. Во вторник попал случайно на фестиваль и не жалею. Узнал много нового для себя, особенно
    понравился седобородый вокалист, который потрясающе играл на губной гармошке. Да и люди правильные. Только вот мне интересно
    мнение блюзопочитателей о звуке на большой сцене, сравните его с другими клубами, где играют блюз. Просто я из "Б2" не
    вылезаю и слушал там много очень качественной музыки из-за рубежа - Нина Хагнен, Rammstain, H.I.M., нашей - Моральный
    кодекс (просто №1), Аквариум, Текиладжаз. Это те, кто звучит высококачественно. Многие звучат безобразно. Но вот, как
    мне показалось, на фестивале все группы выступили с приличным звучанием на большой сцене. Можно говорить о профессионализме,
    хороших инструментах, звукорежиссёре и т.д. Но имеет ли факт качества сцены, порталов, обработок и как с этим в "Б2" с
    точки зрения любителей блюза?
