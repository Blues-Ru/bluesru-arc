          subject: Наверное,
          deleted: false
          text: 'я всё же посоветовала бы начать с Astral Weeks (1968). Хотя если Вам понравился с Хукером, то можете купить
            ещё совсем недавно мной упомянутый Too Long In Exile (1993).

            У меня, правда, пока не много Вэна - всего 6 пластинок и одна на CD-R, и плюс Don''t Look Back, конечно.. но мне,
            как ни парадоксально, нравятся все. Вот остальные:

            Blowin'' Your Mind! (1967)

            Moondance (1970)

            A Period Of Transition (with Dr.John)(1977)

            How Long Has This Been Going On (with Georgie Fame & friends)(1995)

            Tupelo Honey (1971) тоже отличный.

            За бОльшей информацией обращайтесь к Диме. Он слышал если не всего, то почти всего Вэна :)'
