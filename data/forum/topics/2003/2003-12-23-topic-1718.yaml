  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70312222134141237&sql=Alz09kett0q7v\n\nНеобычный трибьют. На диске постоянно играют и поют участники группы Вулфа Хьюберт Самлин, Хенри Грэй и Сэм Лэй. Диск записан и выпущен фирмой Telarc.\n\nОчень неровный и скучный местами альбом. Ничего общего с яркими и искрометными записями самого Хаулина! Почему-то мало ярких гостей и очень вялая и невнятная игра. Почему-то бывшие участники группы Вулфа и его друзья решили, что они хорошо поют, и спели аж полальбома! Каб Кода тоже поет! Может ему лучше писать рецензии? \n\nОценка 2 балла! Самая плохая пластинка в моей блюзовой коллекции! Если бы не шикарные номера с Таж Махалом и Ронни Хокинсом, то альбом был бы полным кошмаром. Все же нужно звать ярких и интересных солистов (каким был сам Хаулин Вулф), а не заниматься самодеятельностью!"
