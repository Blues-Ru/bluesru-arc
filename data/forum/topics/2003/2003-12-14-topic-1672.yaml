    subject: Roll and I'll just ffeel something
    deleted: false
    text: 'Я очень люблю этот диск. Веселый, тёплый, вкусный. Джими и Стиви Рэй здесь совсем другие нежели они же на своих
      сольниках.

      Духовые, ритм секция, женские подпевки... Всё в кассу.

      Как же жаль что Стиви Рэй так рано ушёл. И не сомневаюсь что он бы ещё выпустил не один такой радостный альбом.

      P.S. "Hillibillies from Outerspace" в своё время мы называли "Гимном подводников" :-)

      Читая посты на форуме я ещё раз убеждаюсь, что на вкус и цвет товарищей нет. Мне нравится In Step (хотя его 83 и 83
      гг. мне больше по нраву, а 85 г. в меньшей степени) и тогдашняя ритм-секция ДТ мне нравится. Кому-то наоборот. Отношусь
      к такому мнению как к мнению другого человека: уважительно-терпимо с некоторой долей здорового пофигизма. К чему и всех
      призываю.'
