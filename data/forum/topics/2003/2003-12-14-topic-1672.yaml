  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDCASS70312140021540362&sql=A7p851v7jzzpa


    Уникальный и образцово-показательный альбом! Эклектичный и энергичный, популярный и классный. Ничего подобного сольно
    не сделал ни Стиви, ни Джимми. Здесь все по-другому; разнообразные песни и темы, интересные аранжировки, классный звук
    и продакшн, духовые, подпевки, классные соло, юмор, танцы, энергия. Оценка 5 баллов! Моя любимая песня - White Boots,
    а Вы выбирайте сами; есть из чего выбрать - 10 классных треков без филлера вообще!


    PS: хорошо, что тут не играет кошмарный дуэт Double Trouble.'
