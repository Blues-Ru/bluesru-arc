    text: "- А где швейная машинка?\n - Какая швейная машинка?\n - Ну, у них в прошлый\
      \ раз на сцене стояла швейная машинка.\n - Они чего на ней играют\n - Ой, не\
      \ знаю.. знающие люди говорят, что бывает и такое..\n\n                    \
      \    *******\n \n               (про Владимира Кожекина)\n\n - У них ещё есть\
      \ мужик, который после концертов всегда уезжает в Воронеж. \n - Чё, каждый раз\
      \ что ли?\n - Ага, представляешь!\n - Здорово! Концерт-Воронеж, концерт-Воронеж,…\n\
      \ \n                        *******\n\n - Во-во, смотри, пошёл!…\n - Кто пошёл?\n\
      \ - Ну, как же, ну вот, вот идёт..\n - Да кто же?\n - Аграновский. Он у них\
      \ за главного.\n - Это какой из них?\n - Да вот тот в пиджаке.\n\n         \
      \               *******\n\n - Девки, а здесь танцевать можно?\n - Не знаю..\n\
      \ - А то вдруг ищё выгонют..\n\n     \n                        *******\n\n \
      \                (про Бориса Булкина)\n\n - О-о-о, какой человечище!!! … (мечтательно)\
      \ Я хочу такого мужика..\n\n               \n                        *******\n\
      \n                 (про Юрия Каверкина)\n\n - А это чё, тоже музыкант?\n - Он\
      \ каждый раз приходит на джемы, я его уже однажды видел.\n - А он выступает?\n\
      \ - Блин, не знаю.. Обычно к тому времени я уже в ж..\n\n\n                \
      \        *******\n\n - Ну-у, (звяк-звяк..) ещё по одной. (Бульк-бульк-бульк-..)\
      \ Уф-ф-ф, харашшшооо! Стоп.. Да, держи её.. Ё… осторожней, расплескаешь в п…\
      \ . Вот урррод!!! \n - Да ты, б.., музыку слушай!\n - Это ты уже ужрался.. а\
      \ я слушаю, я ей (музыке) подзвякиваю.. Ну,… (звяк-звяк..) Нармальна пошла,\
      \ скажи..\n\n                  \n                        *******\n\n       \
      \           (про Валерия Гилюту)\n\n - А вот этот чувак поёт ещё.\n - Да ты,\
      \ лох, он ваще крутой мэн, у него свой группешник.\n - А чё играют то?\n - Да,\
      \ хрен их разберёшь.. то ли панк, то ли металл.. а как то он ещё на концерте\
      \ Газманова играл..\n - Да это ж попса?\n - А чё, он знаешь какие там бабки\
      \ зашибает!!!"
