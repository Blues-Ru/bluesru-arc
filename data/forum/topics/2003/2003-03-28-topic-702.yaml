  text: "Спасибо огромное за вчерашний джем! Очень здорово, вообще, было бы классно\
    \ устраивать в ДАСе почаще такие джемы – там есть где развернуться когда пляшешь,\
    \ уютный зал, неплохой звук, а главное, еще и не позднее время начала концертов,\
    \ что актуально для тех, кому вставать утром в 7 часов :)\nВсе было драйвово и\
    \ весело - Алексей, как всегда, прикалывался так, что мы от смеха чуть со стульев\
    \ не попадали :) Кстати, о стульях: можно считать танец на стуле настоящим каскадерским\
    \ трюком! :) А что за инструмент тот был – банджо али бузуки? А чего А. Братецкий\
    \ в этот раз так мало играл? Мало гармошки, мало! \nВсе вокалисты были великолепны,\
    \ музыканты зажигали, жаль только, что пианинко не было слышно. Очень понравилось\
    \ выступление Бориса Булкина, а «Sympathy …» Роллингов была, вообще, супер! Еще\
    \ раз спасибо!"
