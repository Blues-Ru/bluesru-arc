    subject: а был ли мальчик? :о)
    deleted: false
    text: '- Смотрю, вылитый Васо!

      - Котэ.

      - Что Котэ?

      - Отца звали Котэ.

      - Мы с твоим отцом, понимаешь, 3 года в одном танке... А ты "Котэ".

      - Он в пехоте служил...

      к/ф Мимино, 1977 (читать "Билли" вместо "Васо" :-)

      Вот спасибо! А я, увидев в кредитах One more car, one more rider имя Престона,
      подумал что он и в Москве был... Хотя у меня были сомнения: а был ли это он?
      Как же это так? Не расслышал имя его когда ЭК всех представлял? Поэтому и вопрос
      поставил с его именем.

      Зрительно я бы его все равно не узнал бы: всегда его представлял как чернокожего
      дядьку с аграмаднейшей шевелюрой.

      Так тож там был слева? Черный клавишник...

      Дойл Брамхолл. Я и запамятовал что есть и сын. Тогда в Kpeмлe увидел С-Пб-скую
      афишу с именем ДБ, вот и подумал что это отец-танкист, т.е. барабанщик :)))

      А вообще, как часто такое бывает когда именитые музыканты принимают продолжительное
      (не разовое) участие в выступлениях известных исполнителей? Как Гадд с Клаптоном,
      например.

      Ещё раз, спасибо за ответы.'
