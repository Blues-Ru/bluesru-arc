                        subject: где брат твой, блюзмен?
                        deleted: false
                        text: "С большим удовольствием переслушал свою коллекцию «черных\
                          \ ночей». Вариации с текстом столь же интересны, как музыкальные\
                          \ интерпретации. Менялись строчки, досочинялись куплеты…\
                          \ Коттон обошелся дипломатично – просто «брат в армии».\
                          \ Единственный чел, который выкинул куплет про родственников,\
                          \ хлебнувших горя, и особенно про брата, угодившего в заморскую\
                          \ войну – это Клиарвотер; он наиболее радикально изменил\
                          \ текст, расширив название до “Black Night – Falling Down\
                          \ Heavy” и добавив свое имя в соавторы к J.L.Robinson. \n\
                          В целом в моей коллекции статистика по прохождению воинской\
                          \ службы братьями блюзменов выглядит так:\n\n1951: Charles\
                          \ Brown – in Korea\n1966: Muddy Waters  – In Vietnam\n1971:\
                          \ Blues Project – In Vietnam\n1971: Livin’ Blues – in Vietnam\
                          \ \n1986: Eddy \"The Chief\" Clearwater – родня не поминается\n\
                          1990: James Cotton  – in the army\n1991: Buddy Guy  – In\
                          \ Iraq\n1997: Snooks Eaglin  - In Korea\n2000: Wilie Nelson\
                          \  – In Korea\n\nУвы, нет авторской версии, но если предположить,\
                          \ что она определяет большинство текстов, то должно бы было\
                          \ быть – в Корее.\n\nA rack – чудесное выражение, которое\
                          \ понимай, как знаешь. Но мне трудно представить, что в\
                          \ год, когда шла «Буря в пустыне» (для школьников – тогда\
                          \ америкосы накостыляли Ираку за Кювейт), Бадди Гай вдруг\
                          \ меняет общеизвестную строчку не на актуальный «Ирак»,\
                          \ а на расплывчатый “A rack”."
