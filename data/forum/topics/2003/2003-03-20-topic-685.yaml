    text: "К сведению господ, собирающихся привлечь блюз к ответу за войну в Ираке.\
      \ \nИстория ничему не учит? эх... я ведь уже писал об этой конкретной истории\
      \ и здесь, в форуме, и в кратце, тут вот: http://www.blues.ru/ww/ww_DixonW.htm.\n\
      \nВеликий блюзмен Уилли Диксон отстоял свое право не воевать за США во II Мировой\
      \ войне. В суде он заявил, что выжил не благодаря усилиям правительства и государственной\
      \ системе США - а вопреки всем их стараниям извести его и его собратьев. И потому,\
      \ проживая в США, не является гражданином США.  Диксон говорил в суде: \"Why\
      \ should I go to work to fight to save somebody that's killing me and my people?\"\
      \ (\"Почему я должен отправляться трудиться на спасение кого-то, кто убивает\
      \ меня и мой народ?\" - W.Dixon \"I'm The Blues\", Quartet books, 1989, p.54)\
      \ Диксон не считал ту войну войной с нацизмом - в 1941 году он мог занимать\
      \ такую позицию. Тогда он считал, что Родина вспомнила его, потому что ей, родной,\
      \ срочно понадобилось пушечное мясо. И как же решился этот принципиальный спор\
      \ в Государственном суде США? Никак. Было так, что из тюрьмы, куда его уже посадили\
      \ за уклонение от военной службы, он был выпущен БЕЗ СУДЕБНОГО ПРИГОВОРА. Этот\
      \ факт Диксон считает согласием США с его позицией: США не считают его, чернокожего,\
      \ своим гражданином. ПОтому что гражданина по закону нельзя схватить прилюдно,\
      \ во время выступления на сцене, посадить в тюрьму, отдать под суд, продержать\
      \ в неволе 10 месяцев и отпустить восвояси, не дав ни оправдательного, ни обвинительного\
      \ - вообще никакого приговора! С Диксоном обошлись именно так! как с субъектом,\
      \ на которого не распространяются американские законы. Уголовное дело было открыто\
      \ - и так до сих пор и не закрыто! Не слабо для отношений государства и гражданина?\
      \ Вопрос закрыт.\nЭто Диксон имеет право судить об отношении \"корневой культуры\"\
      \ с правительством США! Вряд ли кто-то из москвичей начала ХХI века имеет хоть\
      \ какое-то: историческое или моральное - право с ним спорить.\nК сожалению,\
      \ в ближайшее время блюзу и джазу придется отвечать перед скудознающим обывателям\
      \ за скудоумие Жоры Кустова. Пожалуйста, братцы, возьмите сей факт на вооружение\
      \ в дискуссиях.\nPS. (ну, то, что при всем, при том, Диксон не сгинул в лагерях\
      \ на Аляске - пусть собьет спесь с американоненависников. любая крайняя позиция\
      \ слаба своей неуравновешенностьюю. И впадать в любовь к пострадавшему Саддаму\
      \ так же нелепо, как нахвалить бушменов, его \"наказавшим\"... впрочем, упс,\
      \ это уже ярковыраженный оффтопик. Пойду, напишу про это в форуме любителей\
      \ машин Форда.хехехе!\"если ты, чувак, индеец... лялялялалаляля)"
