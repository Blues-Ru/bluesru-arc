  text: "Не блюз, но очень хочется привлечь ваше внимание к этой пластинке, точнее внимание тех, кто её ещё не слышал. \n\
    Недавно купила отличную пластинку Van Morrison With Georgie Fame & Friends \"How Long Has This Been Going On\". По сравнению\
    \ с теми, что я слышала у Вэна, пластинка звучит непривычно, она более джазовая.\nGeorgie Fame - vocals & organ (hammond).\n\
    А на саксофоне - Pee Wee Ellis (экс-саксофонист Джеймса Брауна в т.ч.).\nЗабавно на ней звучит Moondance, где поначалу\
    \ кажется, что Georgie Fame голосом не дотягивает до Вэна, но потом привыкаешь, и запись звучит просто оригинально, по-своему\
    \ здорово.\nВ \"Sack o' woe\" просто отличная подача голоса! \nК тому же я слышала мнения, что Вэн скучный и однообразный.\
    \ Поскольку на пальцах объяснять сложно, в конце маленькая мптришка :)\nНе знаю, донесет ли до вас хотя бы долю того,\
    \ что вкладывалось в музыку, mp3-файл, но попробуйте послушать..\n\nftp://greta.bluesman.ru/mine/05-Sack-o-woe.mp3"
