      text: "ты чуть-чуть не понял.. Я не пыталась высказать, что эта пластинка лучше или хуже других. Ни в коем случае. Она\
        \ просто другая. И её блюзово-джазовость нисколько не делает её хуже, на мой взгляд. Послушай, пожалуйста, ещё раз.\
        \ \nА упомянула я её потому, что до таких вещей люди как правило даже не доходят по множеству причин: \nпотому что\
        \ на allmusic поставили мало звезд, \nпотому что кто-то сказал, что её не стоит покупать,\nпотому что считают, что\
        \ после 90-х годов нет ничего хорошего и т.д. до бесконечности..\nМне было интересно узнать, что же такого они вместе\
        \ с Georgie Fame наиграли-записали, как у них это получилось, потому и купила эту пластинку.\nНа ней Вэн выглядит\
        \ немного с другой стороны. А новый опыт всегда интересен.\nС огромным удовольствием могу вывесить очень любимые мною\
        \ вещи с других пластинок Вэна, чтобы открыть Вэна тем, кто его не слышал раньше, если это кому-нибудь интересно,\
        \ и если Федор с Андреем не погонят меня отсюда поганой метлой за оффтопик.."
