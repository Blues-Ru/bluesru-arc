        subject: Поганая метла на запасном пути
        deleted: false
        text: "Вэн и Джордж дружат аж с 60-х. оба знавали коммерческий успех, оба за него не слишком держались. Когда в зрелые\
          \ годы Вэн покончил с роком и потянуло его на джазовость, он пригласил Джорджа \"музыкальным директором\". Так что\
          \ вместе записали они уже не мало, и немало по свету гастролировали. \n------\nНи один пост про В.Моррисона не был\
          \ назван здесь офтопиком. Хотя бы потому, что друг Дж.Л.Хукера - наш друг. :) а найдется и куча других доводов в\
          \ пользу его блюзовости. \nДж.Фейм по всем показателя подходит под категории \"джазовый блюз\" и \"мастер Хэммонда\"\
          \ - ему здесь самый топик. Кстати, по этим причинам он несколько раз был главным героем радио \"Весь Этот Блюз\"\
          . любимая моя его пластинка: Cool Cat Blues (кстати, на ней Моррисон тоже есть, и вечная \"Мундэнс\" - звучит).\
          \ Этот сидюк у меня Федор взял и не отдает!!! \nНу как, все еще страшно поганой метлы? :)"
