  text: 'Доброго всем!


    Солидарен с Димой Казанцевым. Альбом совершенно уникален, и мне на душу лёг, пожалуй
    больше, чем иные. Ещё могу отметить Ломаксовские, конечно, записи... и раннего
    сольного Мадди...в Чессбокс компиляции...


    А по Фолксингеру  года полтора назад я писал литтл-обзор. правда близко по восприятию
    с Дмитрием... Вот:



    Прослушал так изощрённо-внимательно Реал Фолк Сингер - впечатление завораживающее.
    Такой  обычно энергийный, концертный, с плотным жёстким саундом Мадди  здесь  -
    творит вещи, замешанные на тишине, чуть слышном скрипе струн и взрывающимися пронзительными
    и прозрачными слайд-фразами. УУУ... Ощущения  удивительные. Можно условно обозвать
    эти нюансы "Уроки Сона Хауса", но, конечно, он дал... Совершенно магнетическая
    какая-то музыка. Забирающая внутрь и привязывающая к себе, не отпускающая. Даже
    клубные полутанцевальные хиты превращаются в какие-то ритуальные гипнотические
    дела (Good morning little schoolgirl). Я уж молчу о дремучих архаических трэках.
    Чистая фолк-блюзовая магия...'
