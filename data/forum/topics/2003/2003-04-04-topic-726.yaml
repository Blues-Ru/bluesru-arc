  text: '..вот обзавёлся. Акустическая пластинка, записанная ещё в 1975, а выпущенная только в 1997 уже после смерти Lefty
    Dizz в 1993 году. В 3-х вещах к 2-м акустическим гитарам, харпу и вокалу LR добавляется очень аккуратненькое такое аккомпанирующее
    фортепиано. Голос Louisiana Red звучит непривычно молодо. Впрочем, и не мудрено, ему ведь на момент записи не было и 39.
    Особенно хороши: «King Bee» (Slim Harpo), «Stole From Me» (Kent Cooper), “Too Poor To Die“ (Louisiana Red), «Сold White
    Sheet» (Louisiana Red & Kent Cooper), “Mary” (Louisiana Red).


    Всем незнакомым с CD рекомендуется к прослушивания, а знакомым - к переслушиванию вновь и вновь :)'
