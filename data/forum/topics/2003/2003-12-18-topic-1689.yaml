  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70312171807051293&sql=A58q8g4entv5z\n\nЕго зовут Дуг МакЛауд, именно так произносится его фамилия. Когда-то он играл на электрогитаре со своей группой, но в середине 90-х начал записываться для AudioQuest Music и его стиль стал более акустически-фолковым. Надо сказать, что он классно и очень по-своему играет на акустике. Его вокал скорее повествовательный, чем эмоциональный, но слушать его приятно и комфортно. \n\nНа этом альбоме 12 композиций в разных стилях, тут есть кантри-блюз, дельта, фолк и даже ощущение госпела в некоторых композициях. Ему помогает Билл Стюв на контрабасе, Джими Ботт на ударных, Чарли Масселуайт играет на гармошке в двух песнях, а некоторые треки он исполняет один. В отличие от Джона Хаммонда, Дуг пишет песни сам, и на этом диске лишь два кавера - Bring It On Home (Willie Dixon) и Rollin & Tumblin (Muddy Waters). Из песен МакЛауда очень хороши Come To Find, Master's Plan, Ain't No Grave, Lost Something This Morning, Any Port In A Storm.\n\nОценка 4 балла; классный современный акустический фолк-блюз, но не более того. Некоторые вещи очень сильны, но много проходных и необязательных треков. Иногда есть ощущение, что не хватает еще каких-то инструметов для более интересных аранжировок. Надо отметь, что МакЛауд сочетает старую добрую фолк-музыку с современными текстами, которые он отлично пишет."
