    text: Билеты на стадион будут продаваться через parter.ru, через театральные кассы и кассы стадиона через несколько дней.
      На стадионе места много, но более дешевые билеты могут кончится заранее, так что имеет смысл озаботиться. Также очень
      крутые концерты ожидаются в клубах, билеты на эти концерты будут либо продаваться в клубах заранее, либо будут принимать
      заявки на бронирование по телефону, либо перед началом концерта. Есть большая вероятность, что некоторые клубные концерты
      будут забиты, поэтому лучше позаботиться заранее...
