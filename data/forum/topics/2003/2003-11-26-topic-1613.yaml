        text: 'У Робилларда есть пластинки получше-похуже, есть суперские. Например, Duke''s Blues или предпоследний Living With the Blues. У Румфула пластинки с Роббилардом - очень хорошие. Как и пластинки Румфула с Ронни Эрлом или некоторые с Вэшоном. Я слышал также живьем концерты Робилларда, которые были очень хороши, по крайней мере - наполовину. Концерт Румфул, особенно в воскресенье, мне тоже очень понравился.

          Но это - все детали, о которых ты никогда не узнаешь, если запишешь Робилларда в гавно, не послушав. Причем, конкретно Робилларду еще повезло. Типа, если этот мальчик захочет, и если поставить его в жесткие рамки, то ведь может прилично сыграть, как на диске ВВА. Остальным повезло явно меньше ;)

          Это все, конечно, - продолжение колкостей в адрес Димы, хотя, завязываю, я свое веское слово сказал!'
