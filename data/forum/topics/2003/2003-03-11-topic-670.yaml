      text: 'Не желая спорить, а скорее для развлечения расскажу такую историю про
        Форте. Случилась она, правда, в незапамятные времена, так что сейчас возможно
        все совсем не так.


        Мои друзья хотели тихо и спокойно пообедать в центре. Набрели на Форте, где
        первым делом им было сказано, что если они собираются сесть за столик, придется
        еще заплатить за Машу Кац. Никакие отмазки, что мол концерт Маши в восемь,
        а сейчас только пять и они к тому времени безусловно уйдут, не помогли. Пришлось
        им в абсолютно пустом клубе сидеть за баром и что-то там жевать, ужасаясь
        тому, сколько с них за это сдерут.


        Но примечательней всего финал этой истории. Когда друзья пытались расплатиться
        часов в шесть вечера, официант, не моргнув глазом, вписал-таки в счет Машу
        и упорно требовал с них денег, мотивируя это тем, что, во-первых, раз они
        ели, значит это то же самое, что сидели за столиком, а во-вторых, он не следил
        за тем где они там сидели, так что извольте платить. В результате из клуба
        они выбирались с боем. С той поры "А за Машу Кац ты заплатил?" вошло в поговорку.'
