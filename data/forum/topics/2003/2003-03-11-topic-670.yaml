  subject: Дом блюза или добро пожаловать..
  deleted: false
  text: 'История одного вечера...

    Решила я давеча приобщиться в блюзовой Москве, если вообще таковая имеется..(очень
    люблю джаз..с большим удовольствием посещаю московские джазовые клубы, вот и решила
    расширить диапозон мест релаксации).Как человек несведующий зашла на сайт blues.ru
    и естественно попала на портал клуба B.B.King (ранее слышала, но никогда не была).
    Мне понравился антураж, созданный описанием клуба, и я решила окунуться в атмосферу
    блюза как раз на 8 марта, заказав предварительно столик на 2-их. Надо сказать,
    что клуб пользуется популярностью и просто так в него не попадешь..надо бронировать
    заранее места.

    И что же дале..

    Вместе с братьями Блюз нас встретило кислое, немного раздраженное выражение лица
    менеджера..далее маленький, сильно накуренный бар, совершенно не располагающий
    к восприятию музыки, да и вообще чего-либо. Никакого единения музыкантов с публикой
    не произошло..музыканты одиноко отыгрывали программу, а публика трапезничала,
    как потом выснилось - немаловажным условием нахождения в клубе являлся размер
    счета (от 1500 руб). Замечу, что параллельно в баре работал телевизор, что также
    "способствовало" созданию атмосферы блюза...

    Но венцом всему было то, что примерно через минут сорок к нам подошел администратор
    (как он представился) и предложил пересесть за барные стойки, т.к. подошли еще
    4 посетителя, которые готовы с его слов "поесть на четверых в достаточном объеме",
    а размер нашего счета не позволяет ему держать наш столик (который заметьте был
    на 2-х). Отмечу сразу, что мы отмечали 8 марта в течение дня и приехали в клуб
    сытыми, заказали так..пива, сырных палочек..

    Естественно после такого откровенного ханжества мы решили покинуть этот бар..я
    попыталась потребовать компенсацию в размере нашего злополучного счета, т.к. юрист
    по образованию, но нам не отдавали верхнюю одежду..Естественно формально ничего
    сделать я не могла..

    Пишу не для того, чтобы посетовать на то, как меня обидели, просто, ребята, я
    впервые встретилась с таким низким уровнем организации бизнеса, когда тебе в лицо
    говорят, что "Вы для нас не выгодный клиент, потрудитесь освободить помещение".
    Замечу, что финансовых проблем у нас не было, но заказывать еду, когда ты не голоден..зачем?

    С времен развития в Москве огромной сети различных клубов, ресторанов, баров,
    кафешек и т.д. я была во многих местах различного уровня и направления, но такого
    встречать не приходилось..

    Я понимаю владельцев клуба - дорогая аренда, налоги, текущие расходы..но нельзя
    решать свои проблемы за счет клиента таким низкопрофильным способом и уж тем более
    называть себя Домом блюза. Согласна место освящено посещением самого B.B.Kinga,
    но это, к сожалению, единственное достоинство клуба..

    Понимаю, что моя речь - глас вопиющего в пустыне, наверное, мне просто хотелось
    высказаться. Извините за эмоциональность.'
