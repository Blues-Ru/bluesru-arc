    text: 'сплошное огорчение. Было кажется три команды, но я успел на выступление
      двух и на джем в конце. Вообще говоря, то, что там играли, скорее напоминало
      хеви метал, нежели блюз. Ударные заглушают абсолютно всё, аж в ушах звенит.
      Гитаристы все играют с жестоким овердрайвом да ещё и так, что ни одной ноты
      разобрать невозможно - сплошная каша. Блюзовая ритмика, как я понял, этим музыкантам
      не очень знакома - за весь вечер я только один шаффл услышал, и то очень уж
      непохожий на шаффл. Пели по большей части на русском языке, что ещё больше способствовало
      неблюзовой ритмике в вокале. Усугубляла ситуацию не очень хорошая акустика в
      зале и плохая аппаратура. На джеме я попытался спеть один куплет из The Sky
      Is Crying, но спеть не получилось - пришлось кричать, причём перекричать ритм-секцию
      даже при наличии микрофона было очень и очень непросто.


      Всю дорогу домой плевался... :-)'
