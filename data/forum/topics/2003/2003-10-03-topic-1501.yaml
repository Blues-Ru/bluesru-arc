  text: "First the Birth of the Blues, Then the Fight Over Who Owns the Baby\nSeptember 28, 2003 By BRENT STAPLES \n\nThe rap impresario Sean Combs, known as P. Diddy, had a\nhuge hit this fall as the lead producer of the soundtrack\nfor the movie \"Bad Boys II, which included\nthe hot party tune \"Shake Ya Tailfeather.\" Rap fans would\nbe surprised to know that the title dates back to the\nMississippi juke joints of the early 20th century, where\nblack field hands gathered to hear blues music after long\ndays in the cotton fields. \n\n[skipped]\n\n<a href=\"http://www.nytimes.com/2003/09/28/opinion/28SUN3.html?ex=1066111359&ei=1&en=04be4acd8ae7d585\">http://www.nytimes.com/2003/09/28/opinion/28SUN3.html?ex=1066111359&ei=1&en=04be4acd8ae7d585</a>"
