  text: "отправить на прослушку пару вещей \"одного человека с живой игрой и пением\" :) \nЗовут его Hasil Adkins, и я про\
    \ него как-то уже писала. В purple legion табличка с его именем стоит какого-то черта в блюзовом отделе; пластинок, правда,\
    \ нет. Но чувак, несмотря на его бредовую прическу :)) с лысиной, прикрытой парой жидких прядей, на мой взгляд, заслуживает\
    \ пристального внимания.\nВышел он на Fat Possum, видимо поэтому и был автоматом определен в блюзовый отдел. Надо заметить,\
    \ что real player пластинку тоже отчего-то идентифицировал как \"blues\". Альбом 1997 года \"What The Hell Was I Thinking\"\
    . \nИграет очень живо, порой подчеркнуто по соседям.. но очень радует.\nЖду ваших мыслей и отзывов об Эдкинсе. А может,\
    \ кто-то что-то о нем знает..?\nhttp://greta.bluesman.ru/mine/02-Ugly_Woman.mp3\nhttp://greta.bluesman.ru/mine/03-No_Shoes.mp3\n\
    http://greta.bluesman.ru/mine/05-Beautiful_Hills.mp3"
