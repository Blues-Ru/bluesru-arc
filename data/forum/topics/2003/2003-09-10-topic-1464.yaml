  text: '10.09. 1975 в Москве, СССР, родился будущий итонский выпускник Владимир Александрович
    «ВОВКА» Кожекин (Skinner). Застрельщик гармошечных фестивалей играет в «Станции
    Мир», творчески дружит с Федором Чистяковым и организует Московский международный
    фестиваль «Очаково-Блюз». В гармошку дует и после, и во время административно-блюзовых
    трудов.


    10.09.1951 в Москве, СССР, родился Алексей Владимирович БЕЛОВ (White), участник-основатель
    легендарной ныне блюз-роковой команды «Удачное приобретение». Уверенно занимает
    пост Старейшего российского блюзового гитариста.'
