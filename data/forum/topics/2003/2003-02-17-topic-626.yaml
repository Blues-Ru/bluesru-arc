    subject: '"the Blues Brothers" классный фильм,но'
    deleted: false
    text: 'я немного про другое.... Вчера я был просто убран, убит этим человеком
      (Петручианни). Вот где сила духа и предел самооценки .... Я слушал его записи
      с Грапелли раньше , но никогда не видел его. Простите за примитив и не оригинальность,
      но музыку надо так-же и смотреть.... А каковы слова Флойда который сказал,что
      благодаря инвалиду Мишелю он (Флойд) передумал умирать и стал записываться с
      последним. И видимо дело не в том,что Петручианни инвалид ,и не в том, что выдающийся
      пианист - просто он выдающийся ЧЕЛОВЕК.... забывающий свои физические проблемы
      (ФИЗИЧЕСКУЮ БОЛЬ!) когда играет Эллингтона или Бейси.... И к нему не испытываешь
      жалости,а лишь восторг от отдельно снятых,здоровенных рук на клавишах и слов
      типа: Чуваки, мои недуги вовсе не смертельны и я решил еще немного задержаться
      в этом мире и покайфовать с вами, если вы конечно не против. Грапелли был не
      против.... По моему это блюз, или джаз, или хрен знает как это называется.....
      Sorry за некую сопливость изложения, но видимо стоит заглядываться на дорогие
      автомобили и красивых женщин, игнорируя, стоя босиком витрины обувных магазинов....'
