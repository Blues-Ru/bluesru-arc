  text: 'Greetings from America!! The Blues Cousins performed their first concert
    in the USA on Friday, July 25 and were very warmly welcomed by the American blues
    fans. Booking agents and promoters are already lining up to sign these guys for
    the 2004 US Tour.

    They are all having a great time, Levan is in Seattle today shopping for a guitar
    and Levan''s wife was looking forward to a big shopping trip also. If you''d like,
    I will continue to provide updates for you as the tour continues.


    John "Bear" Millner, Blues Cousins US Tour Manager'
