    subject: Скотт
    deleted: false
    text: джаз-роковый виртуоз новой волны. Прославился тем, что играл с Чиком Кори,
      Джо Завинулом и Жан-Люком Понти. Начал писаться сольно в середине 80-х (жуткое
      время для музыки и звука). Высокохудожественная фьюжновая дрочка на гитаре.
      В Форте может быть интересно. Альбомы слушать не очень.
