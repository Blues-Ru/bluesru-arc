  text: 'Всё будет как обычно, но Ворон попросил провести этот джем в честь Хаулина Вулфа - 10-го у него ДР.

    В связи с этим прошу всех перцев подготовиться. Особенно хочется услышать певцов и певиц по этой тематике.

    У нас в программе есть несколько типичных вещей для Вулфа: Spoonful, The Red Rooster, Who''s Been Talkin'', Back Door
    Man. Хочется больше. Что-нибудь типа Smokestack Lightning, 300 Pounds Of Joy, Built For Comfort и т.д.

    Особая просьба к Каверкину, Русинову, Федору с Димоном и Кожекину с Жуком. Имеется в виду, что они петь тоже могут.

    Просто хочется провести хороший джем где половина программы будет из репертуара Хаулина Вулфа.

    Ну что Вы думаете?'
