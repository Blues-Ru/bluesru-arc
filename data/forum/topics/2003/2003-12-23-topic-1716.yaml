  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70312222040330401&sql=A8hqag4hbtv3z\n\
    \nБиБи собрал целую футбольную команду \"друзей\" для записи этого альбома. Беспроигрышный\
    \ вариант, особенно в 93 году, когда блюз стал снова \"популярен\"; недавно погиб\
    \ Стиви Рэй, Хукер стал поп-звездой, Бадди Гай популярен и бодр, Роберт Крэй стал\
    \ хитмейкером. \n\nИ так, на диске вместе с Кингом поют и играют: Роберт Крэй,\
    \ Кейти Уэбстер, Бадди Гай, Джон Ли Хукер, Коко Тэйлор, Этта Джеймс, Лоуэлл Фулсон,\
    \ Алберт Коллинз, Рут Браун, Ирма Томас, Джо Луис Уокер. Не слабый список, не\
    \ правда ли? Такое количество гостей можно было растянуть на пяток альбомов или\
    \ на целую творческую декаду! Помимо звездных гостей на альбоме играют звездные\
    \ же сайдмены: Рой Роджерс, Ким Уилсон, семья Уотерс на подпевках, Мемфис Хорнз\
    \ и многие другие (too many to mention). Мощный, классный, популярный звук! \n\
    \nА хороша ли музыка и идеи? И да и нет. С одной стороны, хорошая подборка из\
    \ 12 блюзовых стандартов, с другой, а что-нибудь нового никак нельзя было сделать\
    \ в 93 году? Хотя бы необычные песни или инструменты, звуки или гости, в конце\
    \ концов! Нет, БиБи решил держаться корней и успешной формулы.\n\nОценка 3 балла.\
    \ Очень мало ярких и интересных блюзов. Playin' With My Friends, You Shook Me,\
    \ Something You Got, Little By Little, You're The Boss - эти треки звучат интересно\
    \ за счет гостей и звуков, но сколько же можно записывать Stormy Monday?"
