                      text: 'Начнем по порядку хронологии


                        Хиллбилли - чисто белая, на 100%, музыка, которую на рубеже 50х-60х попросту переименовали в кантри,
                        т. к. в северных районах слово "хиллбилли" считалось оскорбительным названием людей из глубинки (также
                        как race music перекрасился в R''n''B).


                        Каджун - тоже чисто белая музыка, но тут история уже другая. Каджун - это культура французских жителей
                        штата Луизиана. История такова - изначально французы жили на территории современной Канады, и эти
                        поселения назывались Acadia (Акадия). После англо-французской войны в колониях в XXVIII веке французы
                        были вытеснены оттуда, и часть из них поселилась на территории нынешней Луизианы. Название "Аcadia"
                        за века "оболталось" на языках америкосов, и трансформировалось в "Cajun", и этот район Луизианы по
                        сей день носит название Cajun Country. Соответственно, музыка cajun - это музыка обитателей этого
                        района, и по своему возрасту сия культура превосходит блюз и рок-н-ролл авместе взятые :)


                        Кантри-блюз - как слышится, так и пишется - деревенский блюз, аутентичная форма блюза, исполнявшаяся
                        неграми на плантациях Юга на рубеже XIX-XX веков.


                        Кантри-рок - одно из направлений southern rock''а, опять таки, в чистом виде белая музыка, возникшая
                        в 60е годы в Калифорнии, когда местные кантри-музыканты наслушались Битлов и Роллингов.


                        Вы этого не знали, уважаемый знаток американской культуры?


                        Кстати, vr не совсем прав, утверждая, что рок-н-ролл - это блюз, сыгранный кантри-музыкантами. Значительное
                        влияние черных на манеру игры и репертуар нельзя отрицать, но, во-первых, оно имело место быть только
                        в Мемфисе (как известно, знаменитая студия Sun Records еще в начале 50х была чисто блюзовым лейблом,
                        где записывались Мемфис Слим, Хаулин Вулф с Мэттом Мерфи и др.), так что блюзы любили перепевать,
                        в основном, только мемфисские рокабиллы. А во-вторых, и помимо блюза у белых было на кого ориентироваться.
                        Имен различных великих белых музыкантов периода 20х-50х годов можно привести массу.'
