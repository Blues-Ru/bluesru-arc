    text: "кого назвали ритм-н-блюзом. \nСначала он играл почти чистые блюзы, но начал вставлять в них другие аккорды и ритмы.\
      \ Так и появился стиль. Очень постепенно и параллельно с другими. Все это было раньше периода Мотауна, Стакса и Атко\
      \ (Атлантика), так что название могло быть и другим в другие годы. Многие пишут соул, хот соул и т.д. А многие называют\
      \ хот-соул фанком и т.д.\nТо, что Роллинги, например, играли чистой воды РиБ, можно четко услышать, если послушать внимательно\
      \ Отиса Реддинга, других людей на Атко тех лет (1960-1968), ранний Стакс и т.д. \nА твой любимый Рэй быстро скурвился\
      \ и стал играть то поп-джаз, то твист и чистый поп, то кантри - это его стиль, к сожалению. I can't stop lovin' you...\
      \ и т.д. - все это попсовое кантри."
