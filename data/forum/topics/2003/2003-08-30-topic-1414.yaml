    text: '...история появления RnB примерно такова. Дело восходит годам к 40м - 60м. В те годы блюз был чисто фольклорным
      явлением. Но параллельно блюзу фольклорному, аутентичному, была и черная популярная музыка. Слушали ее, понятное дело,
      только черные. И называлось это дело - race music. В отличие от блюза, являющегося, в своем роде, чем-то концептуальным,
      популярная музыка следует, в основном, не традициям, а моде. Так, в 50е годы, благодаря Биллу Хэйли, Элвису и другим
      белым парням, в белой среде стали популярны рокабилли и рок-н-ролл. Черные ответили на это появлением Рэя Чарльза -
      вроде бы и рок-н-ролл, а вроде и не очень. Ну, были еще черные исполнители, которых часто относят к рок-н-роллу, но
      на "настоящий", белый рок-н-ролл они не похожи - например, Литтл Ричард, Фэтс Домино, Плэттерз (сравните, например,
      Фэтса Домино с Джерри Ли!). Ну, США - страна политкорректности, поэтому, чтоб не обижать негров :))), как, собственно,
      и сказал Федор, маркетологи придумали термин R''n''B, которым с тех пор и называют всю негритянскую попсу. Т. е. нечто,
      замешанное на блюзе-фанке-соул-рэпе и т. д., рассчитанное на популярность и коммерческий успех. Т. е. R''n''B - это
      и Рэй Чарльз, и Джеймс Браун, и Джордж Бенсон, и Уитни Хьюстон, и многие другие.


      Кстати, на рубеже 50х-60х нечто похожее происходило и в белой музыке - аутентичный и бескомпромиссный термин hillbilly
      был заменен аморфным и вовсю политкорректным country music, но это уже другая история.'
