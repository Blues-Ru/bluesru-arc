              text: '(1) не "ракабили", а рокабилли


                (2) рок-н-ролл - это и есть опопсованный (и не очень) рокабилли. Вспомни, чьи имена обычно ассоциируются с
                рок-н-роллом - Карл Перкинз, Джерри Ли, Джин Винсент, Эдди Кокран - сплошь белые и сплошь рокабиллы, Билл
                Хейли, Элвис Пресли - белые хиллбилли-музыканты, ударившиеся в попсу... А вот еще Чак Берри, Литтл Ричард,
                Плэттерз - это уже черные, но лишь перенявшие популярную музыку белых (Чака Берри на радио крутили только
                потому, что его манера пения была очень похожа на белую!). Если говорить формально, то рок-н-ролл - это ПОП
                МУЗЫКА 50х ГОДОВ. Изначально термин "рок-н-ролл" играл роль некого бренда, под которым, в слегка измененной
                форме, массам преподносилась народная музыка американской глубинки - хиллбилли и рокабилли. Впоследствии,
                к концу 50х эта музыка уже стала самой настоящей попсой, деревенских корней уже не осталось.


                (3) Билла Хейли энд хиз Кометс никак нельзя назвать рокабилли-группой. По составу это был как раз попсово-приджазованный
                оркестр. Подобных оркестров в 40е годы была тьма - у Арти Шоу, Фрэнка Синатры, Дина Мартина и многих других.
                Типичная попса 40х. Однако Билл Хейли добавил в эту попсу присущей деревенской музыке жесткости, вывел на
                передний план четкую пульсацию ритма - этом и была как раз и была сама соль рок-н-ролла.


                (4) а мало ли, у кого что в текстах песен было. Мы говорим о стилях музыки, а не о текстах песен, где, кстати,
                знакомые слова имеют, зачастую, совершенно другой смысл. Ты думаешь, "rock me baby, rock me all night long"
                по содержанию имеет какое-то отношение к рок-н-роллу? Хаха! Та же Good Rockin'' To-night, т. е. "хорошего
                #бла тебе этой ночью":


                Well I heared a news, everybody''s rockin'' to-night

                I gonna hold my baby as tight as I can

                To-night she''ll know I''m a mighty mighty man


                Каково? Тогда еще можно какую-нить песню из английского фольклора вспомнить, где есть слово rock в значении
                "скала", и объявить ее рок-н-роллом... Что, кстати, будет гораааздо ближе к истине, т. к. именно английский
                фольклор в свое время лег в основу того, что нынче называется кантри-музыкой. Но не забывай, что на самом-то
                деле термин "рок-н-ролл", в дословном переводе, означает - "качайся-и-крутись", т. е. именно танцевальные
                движения.'
