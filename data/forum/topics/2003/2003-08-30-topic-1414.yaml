              text: 'Это материал, что называется, из первых рук - слова Шерифф Текс Дэвиса, человека, который был менеджером
                Джина Винсента и соавтором Би-Боп-Э-Лулы:


                SHERIFF TEX: Well, to start this whole thing off nobody knew what we were doing, and we didn''t know what
                we were doing. The world didn''t know what we were doing. Nobody knew what this (rock ''n'' roll, rockabilly,
                whatever you want to call it) was all about. Nobody had any idea what was going to happen. It was one of the
                most amazing stories in the world, this new kind of music. The people in the trade didn''t even call it music,
                they called it "sh-t". They''d say, "Six months at the most and it''s gone." or "What''s that kind of trash
                you''re playing on the radio?" That was the way it all started. One of the things that got me was the fact
                that R&B radio people got onboard saying, "We''re that kind of music, too." They latched onto the bandwagon
                (the kind of music that Elvis and Gene were doing) and said, "We did this in 1953 and 1954." But they didn''t,
                it all started because of Elvis and Gene.'
