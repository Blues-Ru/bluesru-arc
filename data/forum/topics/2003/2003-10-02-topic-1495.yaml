                        text: 'Вот вы и добрались до моей статьи. Я предусмотрительно не сообщал здесь о её выходе, зная что это вызовет споры и разговоры на тему её художественной и журналистской ценности. О самой статье знали только три человека из здесь бывающих. Но вот вы с ней ознакомились и ваше мнение мне понятно.


