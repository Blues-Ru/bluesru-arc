    text: "Без накладок не бывает как в самом тексте так и в комментариях к нему.\nИ потом, статья-то расчитана на широкого читателя АиФ и естественно должна быть окрашена в контрастные тона - типа \"усталые плечи, кнут, похоронить не на что и т.д. и т.п.\"....\nЯ несколько о другом - сложно втиснуть в одну небольшую статью все свои мысли,ошушения, определения... Так наверное и не надо этого делать - получаются куски которые в силу формата просто не склеиваются друг с другом. Плантации и Булкин, кнут надсмотрщика и Мишурис....Ну не могу я представить Дока укладывающего рельсы или Воронова собирающего хлопок... \nЧестно говоря и наиболее известных коренных блюзменов мне трудно представить сильно вкалывающими на подневольных работах, иначе ни хрена они из Дельты в Чикаго толпами не валили бы... Раздолбаи они были, пьяницы,бабники,хулиганы и бездельники, учиться не хотели и как каждый талантливый лентяй предпочитали придумывать, что-то свое.. Чего и всем желаю...\nИ еще - комментарий о том что в России блюзмены в основном преуспевающие люди... Что-то особо преуспевающих (относительно кого и чего?) я не знаю. Люди как люди - с голоду не помирают, выглядят прилично - опять же, чего и всем желаю...."
