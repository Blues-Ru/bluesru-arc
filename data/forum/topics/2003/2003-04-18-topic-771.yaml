  text: Почти 20 дневной антиамериканской вакханалии в средствах массовой информации,в первую очередь на телевидении - смерть Юшенкова.Порой казалось,что я вижу нелепый сон - того и гляди,что блюзы запретят исполнять,как элемент враждебной американской культуры,или разрешат только на русском и с соответствующими текстами.Последняя официозная демонстрация у американского посольства,в то время как иракский народ с радостью встречал оккупантов.После всего этого я обнаружил в почтовом ящике газету Краснопресненского  местного совета - руководитель господин Краснов,в ней к весеннему призыву в армию была агитка,выдержанная в худших сталинских традициях.Испуганная девочка у мамы на руках,а на них направлен окровавленный штык с надписью USA.При этом написано,сегодня - Ирак,завтра Россия.Такие творения,судя по всему,были опущены в почтовые ящики всем жителям района.Чего уж тут удивляться гибели Юшенкова,истинных виновников,как всегда,не найдут.Россия же еще раз подтвердила,как она далека от западных либеральных ценностей.Парадокс же в том,что и консерваторов(а не реакционеров) в хорошем смысле слова тоже практически нет.Так мы уже скоро окажемся менее цивилизованными,чем сербы.Увы…
