  text: 'Случайно набрёл... рекомендую ознакомиться ратующим за инициативы на местах в противовес московскому болоту.


    http://www.wf.ru/blues/dela.html


    Судя по дате программы, померла инициатива ещё в 2000 г., не дожила до светлого сегодня. А жаль. Любопытно было бы взглянуть на результаты организованного внедрения блюза в широкие народные массы суровых таёжных жителей.


    А вот на этом пункте я просто прослезился от умиления: "Выпуск газеты Клуба ("Нечто голубое")" - Компьютер, копировальный аппарат, оплата редактора - 1 раз в месяц'
