    text: Он хостится на бесплатном сервере tripod.com. При этом ресурс - очень популярный. На tripod.com есть ограничения
      на объем исходящего траффика для бесплатных ресурсов. Если предел превышается, то сайт на несколько часов отключают.
      Если бы Harry платил им деньги, то ресурс бы не отключали. Кроме того, поскольку ресурс плохо работает последние пару
      лет, как только его включают, желающие получить информацию сразу запускают ботов, чтобы высосать весь сайт. Боты создают
      траффик и ресурс сразу выключают обратно...
