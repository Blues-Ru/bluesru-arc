  deleted: false
  text: "На экране застыла тень человека с поднятой гитарой и через несколько секунд динамики грянули на всю площадь:\n\n\
    You say yes, I say no,\nYou say stop, I say go, go, go.\nOh no.\nYou say goodbye and I say hello, hello, hello.\nI don’t\
    \ know why you say goodbye I say hello, hello, hello.\nI don’t why you say goodbye I say hello.\nI say high, you say low.\n\
    You say why and I say I don’t know.\nOh no.\n\nТак это все началось около 21:00...\nА около 23:00 было так: Толпа расходилась\
    \ медленно. Люди возрастом за 40 обнимались, у кого-то на глазах были слезы. Над Красной Площадью кружились блестки. Из\
    \ динамиков звучала Band on the run. Мир изменился... Мечта стала явью.\n\nЕго ждали и вот он приехал. Приехал, чтобы\
    \ на два часа перенести зрителя в золотые для Beatles годы, чтобы отдать дань памяти Линде, Джону и Джорджу, чтобы спеть\
    \ песни, которые заставляли замирать сердце меломанов на всей територии бывшего СССР... Прозвучала почти вся классика\
    \ были и Let it be и Hey Jude и Back in USSR (аж два раза), конечно была Yesterday.\n\nБыть может не все получилось как\
    \ задуманно: хромал звук (порой все звучало как из бочки), неудачно была расположена световая вышка - она закрыла почти\
    \ всю сцену для тех, кто был в танцевальном партере, и конечно было слишком мало :):):):)\n\nНо многое и порадовало: Неожиданный\
    \ конферанс на русском языке (всех музыкантов сэр Пол представил по-русски и каждый из музыкантов в свою очередь по-русски\
    \ зал поприветствовал), неожиданное начало, состоявщее из танцев народов мира (Индии, Испании, Китая и многих других),\
    \ видеоряд к песням из кадров кинохроники или просто абстракций, но подобранных так ловко, что просто диву даешься, конечно\
    \ исполнение харисоновской Something на гавайской гитаре и обещание вернуться...\n\nСостав сэра Пола мощный и сыгранный,\
    \ но и без него просто с гитарой или за пианино или органом, удавалось держать публику в напряжении... А публика пела\
    \ все песни вместе с Полом, замирала в нужных местах и встречала овацией известные места в каждой вещи... Для большинства\
    \ это был момент осуществления мечты, лицезрение того, кого раньше они видели лишь на обложках пластинок и на видео...\
    \ \n\nОн уехал... Напоследок поблагодарив всех за концерт... Может быть это его последний мировой тур... Но теперь мы\
    \ можем представить, как звучали Beatles, когда они были вместе..."
