        text: "- это было хорошо. Что было мало народу, неправильно и странно. Правда, будь его побольше, слышно бы совсем\
          \ ничего не было. Ребята не пользуются никаким усилением, кроме микрофонов. А поди-ка ими гитары подзвучь без специального\
          \ отношения к делу. Щелчки зажигалок мешали восприятию, не говоря уже о живой реакции на происходящее со стороны\
