    text: "Уже не в первый раз в форуме разгораются настоящие баталии по поводу отсутствия \"Великих\", а заодно и всех остальных,\
      \ на концертах приезжих музыкантов... Честно говоря, это вызывает некоторое недоумение... Возникает вопрос: зачем авторы\
      \ подобных писем сами ходили на эти концерты - послушать хороший блюз, или посчитать присутствующих в зале, обращая\
      \ особое внимание даже не на число, а именно на \"качество\" (принадлежность к рангу Блюзменов) слушателей?\nКонечно,\
      \ обидно, когда хорошие музыканты выступают при полупустом зале... Но настоящие музыканты остаются таковыми при любом\
      \ числе и составе слушателей (если  они действительно приехали играть блюз, а не просто заработать денег при полном\
      \ аншлаге). Так может просто порадоваться за них, что они такие, за себя - что вы были на их концерте, а всем остальным\
      \ предоставить право решать самим, как и где им проводить время? А то так ведь можно дойти до приравнивания концертов\
      \ к обязательным для посещения партсобраниям, с вывешиванием на столбе \"позорного списка \"ИХ ТАМ НЕ БЫЛО!!!\" и занесением\
      \ выговора в личное дело...\n\nВ подобной переписке по поводу концертов норвежских музыкантов очень точно на это отреагировал\
      \ Д-р Аграновский:\n So I lit a fire, isn't a good... - Алексей Аграновский (Док)   (21/05 16:52) Друзья, у меня полная\
      \ иллюзия, что я должен послать официальные объяснения по поводу неявки на концерты норвежской группы, с приложением\
      \ справок с мест пребывания в соответствующие дни, подписанных тов. Шойгу и Матвиенко. \nА какого, собственно, хера?\
      \ \nЧто за энтуазизм с оргвыводами?\nВам было очень хорошо в эти дни, рад этому обстоятельству - это чтобы закончить\
      \ на позитивной ноте.\nС благодарностями и наилучшими пожеланиями,\nДок\n\nВот уж действительно - лучше не скажешь!!!\n\
      \nА на будущее - совет человека нового, слушающего блюз и посещающего клубы и концерты  от случая к случаю: может, стоит\
      \ всю свою нерастраченную энергию перевести в более мирное русло, поместив в том же форуме не гневное письмо ПОСЛЕ,\
      \ а столь же эмоциональное, но позитивно-заряженное ДО концерта - и позвать на него всех, кто, может, и рад был бы прийти,\
      \ но ничего не знал об этих музыкантах. Или такие слушатели вам неинтересны, и их отсутствие никого не трогает? Конечно,\
      \ если вы обращаете внимание только на \"Великих\" и \"невеликих\", а все остальные - пустое место, то... (где уж нам,\
      \ в лаптях...)\nОт себя: не был ни на выступлении норвежцев, ни на данном концерте. Жалею - похоже, много потерял. На\
      \ все концерты ходить нет ни времени, ни желания - а как выбирать \"непосвященному\" человеку? Вот и пишите на форуме\
      \ - советуйте, делитесь впечатлениями о прошлых концертах - многие будут вам благодарны. А музыканты получат новых \
      \ слушателей - пусть не из \"особ, приближенных к...\", но зато с чистым восприятием, незамутненным \"внутри-..., около-...,\
      \ над-... etc. -блюзовыми\" интригами и выяснением отношений...\n\nЕсли кого обидел - простите великодушно. Не хотел."
