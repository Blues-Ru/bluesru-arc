  text: "Нееее, леди и джентльмены, если хотя бы пару раз в году будут в клубах Москвы происходить подобные концерты, то жить\
    \ можно....\nНесмотря, на довольно тихий звук (уж точно не вина исполнителей, а может быть и заслуга)) оттяжка была отличная.\
    \ Они имеют стиль, они ловят кайф от самих себя, они просты и они не могут не нравиться слушателям. Отличные ребята,отличные\
    \ музыканты с отличным вкусом (кто ели - знают)и сразу видно,что людям нравится дело которое они делают.\nОни крайне просты,\
    \ и в этом вся сложность для слушателей. \nКстати, долбанных слушателей было не много (я имею ввиду слушателей,а не \"\
    слушателей\") ,но это уже становится хорошей традицией - как что нибудь стоящее, так наших \"великих \"\"блюзменов\"\"\
    \ \" хрен увидишь.... Действительно, фули ходить-то - маленькую овечку которую имела Мери, не отымел только ленивый. А\
    \ тут приехали чуваки (страшно сказать откуда) и выдают Хукера,Мадди,Хаулин Вулфа и прочую дребедень. Ни тебе жужжалок,\
    \ ни тебе \"блюз-пафоса\",ни тебе неуе---нных шляп с капроновыми носками в кроссовках - смотреть не на что! Гитарных запилов\
    \ не было!!! Барабанов не было!!!! На гармошке играли мало и тихо!!!! Ужас,короче....Правда,был БЛЮЗ, но это как мы все\
    \ знаем, не самое важное...\n Из невеликих были замечены С.Воронов,Док Аграновский, душевно переживавший особо тонкие\
    \ моменты А.Меринов,also Юля Смолянин и В.Иванов.\nВсе остальные в этот вечер работали в Медиссон Сквер Гардэн и на других\
    \ площадках мирка.\nНеее...я понимаю, что кто-то приболел,кто-то на подневольных работах по заготовке и добыче подножных\
    \ кормов, кто-то (не дай Бог) помер, но не все же???? Аууууууу!!!! Отзовитесь горнистые!!!!Взвейтесь,соколы,бочкаревы\
    \ и эффесы - мать вашу!!!! Банзай!!!"
