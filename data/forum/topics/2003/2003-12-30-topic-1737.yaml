  text: 'так как до 5-го числа в инете вряд ли появлюсь...

    Так что поздравляю всех с наступающим Новым Годом!!!

    Желаю счастья, ЗДОРОВЬЯ, успехов во всем!!!

    Всем нам новых концертов, музыкантам - гастролей, альбомов, творческих проектов (блюзовых - есно!).


    Мечтаю увидет живьем Б.Б. Кинга,буду рад снова увидеть-услышать в Питере Аграновского-Гилюту-Братецкого и Ко, а также
    Казанцева, Каверкина, Воронова, Жука и всех-всех-всех (как у Винни-пуха)


    В общем, хорошего блюза нам всем!!!

    не могу не похвастаться - купил наконец ДВД - и понеслось - Воэн. Б.Б. Кинг, Альберт Коллинз, Роберт Крей и другие официальные
    лица.. хих..

    Семейный бюджет трещит по швам...

    Всем хороших праздников!!'
