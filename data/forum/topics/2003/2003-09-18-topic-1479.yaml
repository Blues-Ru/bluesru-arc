  text: Друзья! В ближайшее воскресенье, 21 сентября есть отличная возможность послушать блюзовую архаику в исполнении замечательного
    гитариста и певца Юрия Каверкина с его составом "Wrong Way Band". Выступление состоится в кафе "Scolder Blues" (Старый
    Арбат, 24), с 19 до 22 часов. Вход бесплатный. Отличный коллектив, хороший звук, уютная атмосфера. Ждём вас!
