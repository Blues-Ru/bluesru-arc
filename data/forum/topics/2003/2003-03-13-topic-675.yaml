    text: "Несмотря на трагические события предшествовавшие джему все-таки он удался. И наверное это главное, жизнь продолжается\
      \ и этот джем стал наверное очень достоиным прощанием с Николаем Ширяевым. \n Удивительно, но факт второй джем за неделю\
      \ и тем не менее оба очень удачные и очень разные. Причем отдельное спасибо Диме за этот концерт - так вдохновенно и\
      \ оптимистично он давно не играл. Видимо сказывается то, что постоянно он музыкой не занимается (то есть часто не играет)\
      \ и остается масса неизрасходованной энергии, которая и выплеснулась вчера в БиБике. Спасибо вам Дима, Дима и Виктор!!!\n\
      \  Теперь о джемовавших:\nКак обычно энергично и драйвово сыграли свои сеты Русинов и Гурген, было реально драйвово.\n\
      \ Вере и Ульяна исполнили песню, которая судя по всему скоро станет всенароднолюбимой (читай народной), догадались о\
      \ чем я ? Конечно о White Horse!!! К тому же им очень удалась версия Summertime, на мой взгляд очень выгодно отличающаяся\
      \ от той же песни спетой в Woodstock'e. В общем если дела у девушек пойдут также хорошо и свою команду они соберут,\
      \ то на московской сцене появится очень сильный коллектив.\n  Порадовал и блюз из Ханты-Мансийска, бодро весело и элегантно!\
      \ Спасибо Илья!\n  Отметился выступлением и Сергей Воронов. Его интерпретация Crosroads отличилась очень плотным гитарным\
      \ саундом и стоунзовской подачей. что ж пожелаем этому молодому музыканту успехов :):)!\n  Юрий Каверкин как всегда\
      \ безупречен.\nПублика весела и бодра. Официанты какие-то злые.\nВсем спасибо было хорошо!"
