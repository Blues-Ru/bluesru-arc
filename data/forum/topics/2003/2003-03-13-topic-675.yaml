    text: "Вчера было что-то особенное.. И дело совсем не в атмосфере даже. Дима играл и пел очень и очень прочувствованно.\
      \ Читалась, слышалась стопроцентная отдача, как мне показалось.. и голосом в первую очередь. В конце джема выдал таакие\
      \ музыкальные импровизы.. :)\nВолодя Русинов с Димой сыграли превосходно. С Юрием Каверкиным - супер! Жаль, Кожекин\
      \ - единственный в тот день харпер - подтянулся только ближе к концу джема. Но всё, что играли эти люди вместе - было\
      \ здорово.\nСергей Воронов, не побоюсь этого слова, сыграл эдакий hardcorecrossroadsblues :) А вы говорите Жора.. :)\
      \ \nЖора, напротив, был весьма блюзово настроен. Поначалу. :) Но и потом у них с Димкой получился замечательный дуэт\
      \ :) Вы не поверите.. Жора ДАЖЕ присел на стул :)\nВторая вещь, сыгранная с Сергеем Вороновым - была в кайф! А также\
      \ Воронов чуть-чуть с гармошкой.\nОтлично всё прошло, хотя мне полджема (конечно же невольно, верю) не давали полноценно\
      \ слушать - один туаришш сзади что-то ромко ронял постоянно и также громко поднимал, пребывал в состоянии неусидчивости\
      \ :), и, что самое поразительное, потом заявил, что я, дескать, тоже играть хочу, и не что-нибудь, а непременно J.J.Cale.\
      \ На резонный вопрос: \"Так в чем же дело?\", соседушка встал и шаткою походкой дойдя до сцены, на удивление таки удержал\
      \ в руках гитару и таки сыграл. Предполагаю, что в нешатком состоянии сыграл бы ещё более надежно :) Но, маленькая просьба,\
      \ люди.. находясь в состоянии эйфории (с горя ли, от счастья), не мешайте, плиз, другим слушать тех, кого они пришли\
      \ послушать. Никто не сомневается, что вы, возможно, тоже музыканты (сорри, нет желания обидеть, я не знаю, кто Вы были\
      \ и откуда), быть может очень неплохие, но слушать не мешайте, плиз. Сегодня не ваш концерт, джем (нужное подчеркнуть),\
      \ а посему вы такие же гости, как и я (он, она, оно). \nПубликой был бурно принят Илья Верховский, что экспрессивно\
      \ терзал Димину гитару, порой вызывая опасения за сохранность струн :) Внешний стайл - Eric Clapton forever :) В музыке\
      \ - интригующая идвидуальность :))\nВетеран со свойственным ему спокойствием, достоинством и уверенностью отлично отыграл\
      \ весь джем.\nСпасибо, Димы. Когда вы вместе - это здорово. Жаль, что в последнее время очень редко :)\nВсем спасибо."
