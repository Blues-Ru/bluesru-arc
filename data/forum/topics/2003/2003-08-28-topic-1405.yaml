      text: 'Давненько я не выступал на поле доброй русской брани, дорогой читатель!


        Итак, опять возвращаемся к исходной точке - должен ли композитор уметь писать народные песни? Вот писывал я давеча,
        что Шостакович написал, а Прокофьев не смог. И посему Шостакович жил долго и счастливо, а Прокофьев - нет. Мораль,
        однако.


        Смею напомнить уважаемой публике, что практически все любимые нами блюзовые и околоблюзовые жанры в своё время тоже
        были весьма коммерчески успешны и популярны, ориентированы на весьма неинтеллигентную публику (почитайте блюзовые
        тексты), и проходили именно по номинации популярной, то бишь народно-обожаемой музыки. Напомнить про всенародную любовь
        американского народа к Howling Wolfу? Просто с прошествием времени были вытеснены другими кумирами.


        В своё время вальсы и мазурки были не меньшей попсой, чем Зайка моя - сейчас, а нынче их в консерваториях изучают.


        И где грань между вкусом взыскательным и банальным?

        По моему сугубому мнению, сочинить истинно народный хит типа той же Зайки - не меньшее искусство, чем, как говорил
        один мой приятель, виртуозный исполнитель фламенко, "лабать унылые блюезы" и ловить вечно улетающего feelinа.


        Так что считаю я, что коммерческий успех всегда сопутствует музыке безусловно талантливой вне зависимости от жанра.
        Просто это другой жанр. Кому не нравится - не слушайте, а скопом всех попсовиков определять в "ацтой" - методологически
        неверно. Это брату Казанцеву на закуску за его последовательный снобизьм.


        Вот методологически более верно разделить талант и форму его выражения, то бишь музыкальный жанр, а также используемые
        при ентом выразительные средства.


        Если взять талантливого композитора, любой музыкальный жанр, и ограничить его средства самыми наглыми, кричащими и
        бьющими по ушам мелодическими, ритмическими и темброво-фактурными приёмами, то получим тот самый попс, родной брат
        кича и правнук "У самовара я и моя Маша", от которой так страдал Б.Пастернак во времена оны. Но это уже другая история.
        При этом в зависимости от жанра мы получим поп-блюз типа "На подушке осталась..." либо поп-рок типа.. ну сами понимаете
        типа чего.

        Примеры на языке вероятного противника я надеюсь, нам любезно предоставит тов.Казанцев, обладающий потрясающей (щий-щей
        - это звучит!!) моё воображение музыкальной эрудицией.

        А мастерства всё равно не пропьёшь. Его только разменять можно на вечнозелёные ценности.'
