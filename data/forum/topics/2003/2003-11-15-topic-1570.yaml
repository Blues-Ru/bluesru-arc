          text: 'Игорь, уровень наших лучших блюзовых музыкантов несравнимо ниже американского или европейского. Леван глубоко неправ. И пока они (музыканты) этого не просекут, они никогда не научатся играть, ибо у них не стоит цели подрости. На западе талантливые музыканты 20 лет уже достигают уровня, который для нас является пределом совершенства, но для них с таким уровнем куда-то соваться неприлично - ибо вокруг  каждый день играют гораздо лучше. Поэтому, они не бегут раскручиваться или меряться пиписьками, а продолжают заниматься и слушать музыку...

