    text: "Филадельфия Джерри Рикс. Это, собственно, и был блюз. Пожилой черный дядька с гитарой. Лаконично, энергично, с чувством. При всей внешней простоте, в Москве так не сыграет никто. Последний номер с Владимировым порадовал. 5 баллов.\nДабл Ю Си Кларк. После первых двух вещей подумалось - а вот так, как раз, в Москве могут. Довольно прямолинейный гитарный электрический блюз с длинноватыми запилами. Уж я даже немного заскучал. Но тут настроение на сцене изменилось, Кларк заиграл другую музыку - ближе к соул. И оказалось что он оченно неплохой эмоциональный вокалист. Душевно. \nРумфул оф блюз. Хедлайнеры, так сказать. Свинг, ритм-энд-блюз, соул. Что можно сказать? Профи. Маленький такой биг-бэнд :-) Звук супермощный, длинные соло. Колоритный толстяк певец. Гитарист их так старался :-) В общем отлично, но как-то предсказуемо отлично :-) Что-то устал я от них немного."
