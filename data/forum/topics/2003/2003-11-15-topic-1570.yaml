    text: 'Вот. Вчера побывали там. Больше всех порадовал Рикс со своим фингерпикингом. Временами его игра даже напоминала больше кантри, чем блюз (люди, знакомые с творчеством Мерла Тревиса, меня поймут). Кларк впечатления вообще не произвел, действительно, как-то слишком средне. Румфул Оф Блюз были очень драйвовы, но, мне показалось, им не хватало свинга. А может быть просто звук был так отстроен... Зато гитарист у них просто мега перец (по сравнению с тем же Кларком). Честно говоря, по общему ощущению, Румфулы слегка утомили, но это уже на совести людей, составлявших регламент концерта. Ведь Румфулам была отдана чуть не половина вечера, а, скажем, Риксу дали спеть вообще всего лишь пяток песен. А хотелось бы, чтобы всех было поровну.


      Если сравнивать с предыдущим фестом - то в прошлый раз было больше хороших гитаристов :) Я имею в виду Литл Эда и молодого белого парнягу из группы Шенье. Помню, после их прослушивания вживую я как музыкант реально поднялся по части фразировки на ступеньку выше. В этот раз такого, увы, не получится - ИМХО даже гитарист Румфулов проигрывает упомянутым мной выше двум товарищам.


      Что особенно порадовало лично меня - это временами проскакивавшие в программе песни из типично "белого" репертуара. Например, Please Don''t Leave Me Baby Please Don''t Go или Mystery Train. Причем, исполняя последнюю (она хоть и была блюзом изначально, но прославилась все же благодаря Элвису), Кларк явно отдыхал по сравнению со Скотти Муром :)))'
