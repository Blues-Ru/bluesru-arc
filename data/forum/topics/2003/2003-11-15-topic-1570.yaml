        text: "Но тогда ошибаюсь не я один.Про сцену и клуб это верно,где я ее сцену-то толком слышал.С уровнем тоже,возможно перегнул,но не много. Вполне допускаю,что невольно выдаю желаемое за действительное,но это все от неуемной любви к \"отечественному производителю\":).Не,серьёзно,я свято верю (по наивности?хе-хе;)) в достойный ответ. Хендерсон давеча рассказывал что у него бывают плохие и хорошие дни.В хорошие он позволяет фантазии разгуляться,а в плохие он играет как положено без изысков,но правильно,с математической точностью.Вот с этим у нас хуже.\nНаш брат по-моему сильно привязан к настроению.Может вот здесь самое место здоровому похуизЬму,но тоже как-то не очень проходит.И еще об одной не хорошей штуке которой подвержены музыканты - это отказ от репетиций.Да,можно не репетировать если через день концерты в остальных случаях это просто необходимо.Бывало не раз когда видишь на сцене известных,всеми уважаемых,музыкантов,а у них ничего не клеется просто-напросто из-за отсутствия сыгранности и взаимопонимания,да и вокальчик-то фальшивит от того что не пел давно.Отвыкли они друг от друга,а по телефону обовсем не договоришься.А,ну и работа,собака,мешает творчеству,но без этого никуда.Но точно знаю если \n\"трындычиху зацепить\" то будет будь здоров. ...ну такой вот я малохольный никак мозг не включаю,а за своих рад в лепешку разбиться."
