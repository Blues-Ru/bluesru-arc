    poster: Михаил Бирюков (nECKAPb)
    email: blackcat@blues.ru
    subject: этот диск...
    deleted: false
    text: '...есть у меня на хромовой кассете, и, если не ошибаюсь, должен быть на CD у одного человека, который тоже сюда
      иногда заглядывает.

      Диск прелюбопытный, но надо отдавать себе отчёт в том, что это преимущественно архивно-фольклорный материал, хоровой
      вокал заключенных, сопровождаемый ударами топора по бревну. Далеко не всегда это блюз; скорее это уорк-сонги и холлеры.
      Ну и плюс к тому - записи довольно старые; хоть и без скрэтча (поскольку на пластинках эти записи не издавались), но
      звук, с аудиофильской точки зрения, несовершенный. Что, впрочем, с других точек зрения может обернуться и преимуществом.'
  - id: 10297
    parent_id: 10290
    date: 2003-01-25 16:19
    poster: Andrei V. Evdokimov (evdokimov)
    email: evdokimov@blues.ru
    subject: на гармонике все верно расписано
    deleted: false
    text: "Разве что уточнить: СД у нас продовался несколько  лет назад, во времена популярности итальянской серии blues encore.\
      \ Этот диск германского издания Delta Music - Lazer Light. Не смотря на полулевое издаине, этот альбом - гордость моей\
      \ коллекции. Хотя бы потому, что эти записи в миссиссипских и луизианских тюрьмах делал Алан Ломакс. И \"Босс\", который\
      \ задает вопросы - это, собственно, именно он. \nзвук там не такой уж ужасный, бывает гораздо хуже. Записано на казенную\
      \ аппаратуру, поскольку заказчик - библиотека конгресса сша. Главный недостаток - глуховат. \nсобственно альбом нужен\
      \ только если интересны корни блюза, или любителям \"неиспорченной\"(забавно в этом контексте звучит) цивилизвцией народной\
      \ музыки. Любители кино могут вспомнить коротенькую забавную сценку из фильма Вуди Аленка (не помню название, что-то\
      \ об ужасном преступнике), где он попадает в такую кандальную компанию и поет. еще наглядней недавний \"О, где же ты,\
      \ брат\" - там показано, в каких именно обстоятельствах каторжники пели подобные ворк-сонгз, и как запевала определял\
      \ ритм и песни, и работы. \nНо настоящий шедевр из \"тюремных сессий\" Ломакса не вошел в этот альбом: песня, которую\
      \ можно послушать в альбоме ROOTS BLUES из серии Blues Masters фирмы Rhino.\nGo down old Hanna and don't you rise no\
      \ more. - Закатись, Ярило, чтоб тебя больше не видать.\nПрекрасно описывает отношение катаржников к солнышку, когда\
      \ их с восходом солнца выводят камни дробить."
