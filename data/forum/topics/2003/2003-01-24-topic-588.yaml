    text: Есть CD "Big Brazos (Texas Prison Rec., 1933&1934)" - это те записи Алана Ломакса, о которых написал Andrei V. Evdokimov
      (см. выше).  Это выпустил небезызвестный ROUNDER в серии Deep River of Songs. Go down, old Hannah - действительно, сильная
      вещь! на CD 20 песен - все а'капелла, под звук топора, два притопа - три прихлопа (какие музыкальные инструменты на
      зоне!). Могу помочь - есть TEAC CD-W524 напишу CloneCD (себе все так пишу)
