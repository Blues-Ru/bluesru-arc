  text: "Данилин, Чистяков, Кожекин, Некрасов.\n\nЧестно говоря, на билетах, да и на других каких-то бумажках, упорно значилась надпись \"Три гармониста\". Не знаю, почему. Помню, что подобная история произошла здесь и с А. Ф. Скляром, когда на билете печатали: \"Ф Скляр\". Может, организаторы своих гармонистов считать не умеют? На самом деле, это не так важно. Важно то, что я (подозреваю, что не только я) шел на концерт проекта под названием \"Четыре гармониста\", а попал на целый фестиваль разных гармошек, в котором участвовали четыре разных коллектива. Художественным руководителем и идейным вдохновителем фестиваля значился Вовка Кожекин, один из четырех гармонистов. Вообще, трудно назвать гармонистом человека, играющего на губной гармонике. Даже аккордеониста язык не поворачивается так называть, слишком у него (аккордеона) звук красивый и интеллигентный. Гармонист - это с размахом и, честно говоря, не очень-то аккуратно. У всех участников фестиваля (кроме Данилина) и то, и другое присутствовало, видимо, поэтому они и назвали себя так. \n\nК моему приходу зал ЦДХ был забит до отказа, люди сидели во всех проходах, поток входящих колдырей с позвякивающими сумками не иссякал до конца концерта. Я, вообще-то, столько алкоголя в почти академическом зале ЦДХ никогда не видел. Ну, сам-то грешил потихонечку, а вот у других не видел. И пьяных криков с последних рядов никогда не слышал. А тут разорались, хиппаны проклятые! Кожекина им подавай сразу! Чуваки, если и дальше будете так греметь бутылками, скоро и здесь начнут сумки на входе досматривать. \n\nМаксим Некрасов - молодой музыкант, играющий на хроматической губной гармонике. Раньше на таком инструменте часто играли американские и европейские солдаты. Теперь же больше популярна диатоническая губная гармошка, на которой легче всего исполнять блюзы. Отличие хроматической гармошки в том, что она может воспроизводить музыку практически во всех тональностях. Удается ей это благодаря тому, что каждый ее звук может быть альтерирован на полтона вверх / вниз, следовательно, можно выстроить любой звукоряд. Тембр такой гармошки более мягкий, певучий. Некрасов играет на ней блюзы. Помогают ему гитарист Жук, известный по совместным с Кожекиным проектам, и ритм-секция. Эти блюзы навевают атмосферу какого-то Вудстока: Хендрикс, Дженис Джоплин, все дела. Некрасов играет не какие-то тривиальные блюзовые ходы, а самостоятельные мелодические линии. В самой яркой композиции их сета (\"Караван\") звучат поочередные соло на гитаре, басу и барабанах. Сейчас эта форма построения композиции уже забыта. Никому не нужно десятиминутное соло на барабанах, времена \"Deep Purple\" уже давно прошли. Но наблюдать классически построенную блюзовую рок-композицию было приятственно. Сет Некрасова завершила металликовская \"Enter Sandman\". Абсолютно провальное исполнение. Композиции музыкантов-виртуозов лучше не переигрывать, если ты сам не виртуоз. Жук, попытавшийся сыграть партии Хэтфилда и Хэммета, смотрелся, к сожалению, как полный лох. \n\nХочется выразить отдельную благодарность организаторам фестиваля за участие в нем виртуозного джазового трио Данилин-Ростоцкий-Кузнецов. В отличие от остальных участников фестиваля, эти музыканты не имеют ничего общего с роком. Поэтому и смотрелись (слушались) они особенно контрастно. Три настоящих джазовых виртуоза, академические музыканты - они ничего не орали, руками не махали и не выёбывались. Трое спокойных седых людей просто заняли свои места на сцене и начали играть. Владимир Данилин трогал свой аккордеон очень легко, едва поглаживая, но извлекал вполне внятные, изумительно красивые (простите уж) пассажи. Так же, еле касаясь гитары, играл Алексей Кузнецов, выстраивая сложные гармонические последовательности, но делал это настолько непринужденно, что, только внимательно вслушавшись, можно было понять, насколько сложна его партия.\nА уж Ростоцкий (бас-гитара) уделал своей игрой просто всех. Его бас-гитара по-настоящему пела! Почти человеческим голосом! Ростоцкий играл все свои партии legato, даже скачки. Временами ему удавалось играть интервалами. Представляете? И зачем только люди покупают эти навороченные шестиструнные басы? Чё за понты такие? \n\nДанилин играл эстрадно-джазовые баллады американских композиторов 40-х, 50-х годов и быстрые джазовые композиции. Все его эмоции шли через аккордеон, сам же он был предельно сдержан. Музыканты были настолько поглощены своим занятием, что казалось, будто людей в зале они вообще не замечают. Они были наедине со своей музыкой! Напоследок сыграли пьесу Ростоцкого, посвященную московскому такси, под названием \"Московский пассадобль\". Эта быстрая пьеса основана на кусочках знакомых мелодий, которые, едва появившись, тут же проносятся мимо. За время выступления трио зал успел кончить рекордное количество раз. Браво! \n\nНа радость гремящих бутылками хиппи, на сцене появился Вовка Кожекин. Чуть сутулый, как всегда неопрятный, с вечно немытыми патлами - настоящий хиппи, одним словом. Губы Кожекина стали заниматься своими прямыми обязанностями - то бишь, дудеть. Лекций по инструментоведению читать не буду, скажу лишь, что Вовка играет на обычной диатонической губной гармонике, используя самые обыкновенные блюзовые приемы. Начали с Би Би Кинга, и дальше в том же духе - быстрые рок-блюзы и все в этом духе. Роль вокалиста исполнял гитарист Жук. Веселье в зале чуть зашкалило, и мне пришлось стать свидетелем отвратительной сцены вывода пьяных хулиганов из зала. Никогда бы не подумал, что в этом культурном зале когда-нибудь будут возникать подобные проблемы. Очень скоро к Кожекину присоединился долгожданный Федор Чистяков, и заиграли дуэтом блюзовые вариации на тему русской народной песни \"Эй, ухнем!\" (бурлацкая песня). К дуэту губной гармошки и баяна присоединилась вся группа, и тогда грянули по-настоящему. Народ радуется, а на бледном лице Чистякова никаких эмоций, только ноги дергаются и играет неаккуратно, как попало. Блюзовый вариант одной из главных песен о войне (\"Темная ночь\") вызвал у меня самые противоречивые чувства, так как это одна из моих самых любимых песен. Чистяков поет ее манерно, повсеместно меняя мелодию, ритм и фактуру. Безобразие, одним словом, надругаться над такой песней - форменное кощунство. Бледный Чистяков перемежает песни с сольными инструменталами, Кожекин тусуется на сцене просто так, в зале бардак. Поют песню про рыб и рыбалку: \n\nМанную кашу всю объедает,\nНо на удочку не попадает... \n\nУж не знаю, вкладывал ли свидетель Иеговы Чистяков в песню какой-то религиозный подтекст, но ассоциации у меня возникли: рыба - один из главных символов христианства, Иисус часто бывал на рыбалке, да и главные апостолы - все сплошь рыбаки. И Христос им сказал, что, мол, вы ловили рыбу, а теперь будете \"ловцами на человеков\". Так что, может, он не так прост, Чистяков-то? \n\nФедор Чистяков убежал на поезд в Питер, а Кожекин, быстро накопав губных гармонистов (приехал даже Петрович!), принялся джемовать с ними на радость всем хиппанам. В общем, бардак продолжился. \n\nСтепан Максимов, специально для РокмЬюзик.Ру"
