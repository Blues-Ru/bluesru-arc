  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=CASS80308211131&sql=Aai6zefekhgf5


    Питер Грин ушел. Ему стал не нужен Джон. А Джону был нужен классный гитарист.
    Вот тут мир и узнал о молодом и скромном Мике Тейлоре. Три альбома - три отличных
    гитариста: Эрик, Питер и Мик. В чем же разница? Разница в звуке и игре. Эрик и
    Питер играли наивный и чувствительный блюз, а вот Мик - это уже эпоха блюз-рока!
    Совсем другое звучание, другие ноты, другая подача. Мик местами играет так, как
    потом стали играть рок-гитаристы; теперь понятно, почему его взяли именно в Стоунз.


    Альбом неприлично длинный - 46 минут - 12 песен. Альбом тяжеловатый и вязкий,
    но ритм-секция играет уже лучше, а ведь прошло чуть больше года со второго альбома
    Джона! На басу МакВи (он еще не ушел к Питеру в группу), на барабанах Киф Хартли.
    Плюс хорошие, но немного "пионерские" дудки (у англичан это бывало) - Крис Мёрсер
    на теноре и Рип Кант на баритоне.


    Сразу слышно, что Джон и ребята послушали Букера Ти к тому времени. В некоторых
    песнях уже слышен роковый орган, есть серьезные инструменталы - Snowy Wood, Driving
    Sideways. Есть тут уже и дыхание психоделии (любили ли ребята Бёрдз?) Все стало
    как-то серьезнее, профессиональнее, плотнее.


    Еще тут много "хитов" типа Oh Pretty Woman, My Time After Awhile, I Can''t Quit
    You Baby (позднее ЛэдЗэп сыграли почти копию этой версии), Checkin'' Up On My
    Baby. Интересно то, что другие вещи даже интереснее.


    Я бы выделил Oh Pretty One (очень хорошо поет), Snowy Wood (написана Миком и Джоном,
    а могла быть и Кроппером ;)), Man Of Stone, The Death Of J.B. Lenoir, Streamline
    (отличный ритм и настроение), Me And My Woman (послушайте ритм-секцию и все поймете).


    Альбом очень хороший, я ставлю ему твердую 4-ку. Рекомендую всем, кто не против
    тяжелого, мощного звука.


    Rock crusaders are coming!'
