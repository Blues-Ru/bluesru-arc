  text: "Г-жа Михеева запомнилась блюзовой общественности своим ярким пением на джем-сессиях в Экспате и Вудстоке. \nГрета, Вы меня спрашивали, где ее можно послушать в других жанрах. \n30-го января Таня будет петь произведения собственного сочинения на юбилейном концерте ансамля Большого театра (новая сцена БТ, 19:00). Билеты в кассе по 600 р. (правда, позже могут выкинуть и более дешевые). \n30-го вудстокский джем, а Михеева в Большом. Вот те нате."
