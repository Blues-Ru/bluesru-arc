  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=CASS80308210934&sql=Axr7ibk09hakc


    Можно любить ранние синглы Мадди и сборники, собранные из них. Можно любить его странные альбомы 60-х или шикарный Woodstock
    Album. Можно даже любить его тяжелые и нудные последние три альбома с Джонни Уинтером, но этот диск 64 года останется
    лучшим в его карьере.

    И дело даже не в том, что он хорошо записан и прекрасно сыгран, а в том, что тут, на этом акустическом сэте, он делает
    то, что сделало его легендой и королем архаичного кантри-блюза.

    Малый состав, иногда только он и Бадди Гай, Диксон на контрабасе - все это создает невероятную атмосферу небольшой комнаты
    где собрались корифеи блюза и играют свою любимую музыку. Они живут ею. Всего 9 песен, но они прекрасны! Каждая из них
    - это маленькая жемчужина блюза. Эти песни известны и исполнялись не раз самим Мадди и другими, но ТАКОГО исполнения больше
    нет. Это был момент кайфа и МУЗЫКИ. Классная запись диска дает возможность оценить все это (на хорошей аппаратуре, конечно).

    My Home Is In The Delta, Little School Girl, Country Boy - это что-то невероятное, это больше чем блюз и больше чем музыка
    - это экстаз для слушателя.

    Оценка 5 баллов! Это один из лучших альбомов в блюзе и в музыке вообще. К сожалению это был пик Мадди, но надо учитывать
    его возраст.

    Simply the best!'
