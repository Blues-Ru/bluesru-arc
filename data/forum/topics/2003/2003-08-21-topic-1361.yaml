    text: 'Уважаю и ценю этот диск, но называть его абсолютным пиком Мадди Уотерса не стал бы. Одним из - возможно.

      Всё-таки легендой и королём блюза (почему именно архаичного кантри-?) его сделали как раз записи конца 40-х и 50-х гг.
      Возможно, они не столь филигранно прописаны, но это абсолютная классика; а качество записи блюзового трека - далеко,
      далеко не всегда определяющий момент для его оценки, мне так каэцца.

      Вообще, чем больше Мадди Уотерса - тем лучше. Что толку выискавать пики на мощном горном хребте, уходящем в облака?
      Можно карабкаться с любого места.'
