  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70312171807051293&sql=A3cmtk6kxqkrg


    Через два года после своего дебюта на AudioQuest Music Дуг выпускает вот этот
    альбом. Что же изменилось за два года? Да почти ничего в глобальном масштабе;
    место Масселуайта занял Кэри Бэлл (он играет на харпе и даже поет), в некоторорых
    вещах появился электрический басс - Джефф Тёрмс, на контрабасе все тот же Билл
    Стюв, на ударных снова Джими Ботт, а в двух песнях на скрипочке играет Heather
    Hardy (невозможно произнести это женское имя по-русски; Хизер, если хотите). В
    некоторых треках МакЛауд играет на электро-гитаре!


    На диске 13 композиций, все они написаны самим МакЛаудом. Надо сразу сказать,
    что инструментов стало больше, чем на предыдущем альбоме (Кэри играет в половине
    вещей), но качество самих песен ухудшилось. Первые интересные нотки появляются
    в веселой Papa John, а это уже пятый трек! Еще стоит отметить Hey Bartender (тут
    вокальный дуэт с Бэллом); душевно звучит Chill On Cold.


    Оценка 3 балла. Хороший блюз, близкая мне лично акустическая игра и вдумчивое
    пение, но где же интересные темы и блюзы? Это не 50-е и 60-е, когда Лайтнин Хопкинс
    мог играть одно и то же; то была другая атмосфера, да и Дуг не Лайтнин. В 90-х
    этого мало, особенно для студийной работы! Этот альбом длиннее и слабее предыдущего.
    Может все же иногда нужно быть Джоном Хаммогдом и исполнять чужие песни?'
