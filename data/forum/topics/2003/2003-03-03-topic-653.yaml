  text: Пересмотрел второй раз фильм Спилберга "Амистад" и поймал себя на том, что
    увидел и услышал зарождение блюза в одной из сцен. Это произошло тогда,когда белые
    христиане  пришли в тюрьму к черным невольникам. Черные пели,что-то типа песни
    протеста в четком,рэповом ключе ,а белые распевали псалмы. И в этом, вроде бы
    несовместимом наборе звуков с той и другой сторон, четко послышалось нечто блюзовое.
    Предупреждаю, был трезв и почти в здравом рассудке....
