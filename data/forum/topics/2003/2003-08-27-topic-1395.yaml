  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=MISS70308271210&sql=A37dovwzta9ik\n\
    \nПятый альбом Тажа на Коламбии немного странен. Первая сторона диска с концерта,\
    \ вторая студийная. Таж тут почти один - это что-то новое; лишь иногда ему помогают\
    \ The Pointer Sisters - подпевки, Howard Johnson - туба и хлопание в ладоши. Еще\
    \ хлопают в ладоши Грейс и Джейн, за что им отдельное спасибо на обложке.\n\n\
    Этот альбом, как и предыдущий, выходил на КД только на Mobile Fidelity - еще одна\
    \ редкость и мечта для большинства.\n\nКонцертник начинается с Conch Introduction\
    \ - Таж что-то на чем-то гудит, видимо происходит действо на сцене, а народ уже\
    \ радуется! Потом медитативный трек Kalimba, где Таж играет на калимбе, естесственно.\
    \ Третий трек - Bound To Love Me Some - классный блюз, только голос и National\
    \ Steel-Guitar Тажа. Четвертый трек - Ricochet - Таж развлекает народ, играя на\
    \ банджо - народу нравится (у нас бы за такое выгнали на фиг из всех клуюов и\
    \ занесли в черный список). Пятая вещь - A Free Song (Rise Up Children Shake The\
    \ Devil The Devil Out Of Your Soul) - Таж поет акапелло госпел на тему изгнания\
    \ дьявола из тела и души - народ в восторге и хлопает (за это у нас бы уже убили,\
    \ а не прсто изгнали из клуба). Шестрой трек - Corrina - наконец-то еще одна музыкальная\
    \ вещь Тажа с его второго альбома, вокал и Miss National. Седьмой трек!!! - Conch\
    \ Close - опять какие-то звуки из первого трека и ликование публики... Да уж,\
    \ только два музыкальных трека из семи! Кто-то бы сразу убрал такой диск куда\
    \ подальше, но мы-то знаем, что есть и вторая сторона пластинки.\n\nНа этой второй\
    \ стороне всего четыре вещи, но они отличные! Первая - Cakewalk Into Town - супер-блюз\
    \ под гитару, хлопки и тубу (эту песню также любил исполнять Рай Кудер). Вторая\
    \ - знаменитая Sweet Home Chicago в отличном исполнении вместе с сестрами Пойнтер.\
    \ Третья - приджазованный блюз Texas Woman Blues - Таж на контрабасе и сестрички\
    \ классно подпевают ему. Последняя вещь - Gitano Negro - длиннющая, медитативная,\
    \ инструментальная вещь с испанско-цыганскими корнями и блюзом. Вот это да...\n\
    \nЧто же поставить всему этому компоту? За первую сторону 2 балла (и этого многовато\
    \ - там одно настроение почти без музыки); за вторую 4 - последний трек слишком\
    \ длинный и мутный, а три первых хороши. Общая оценка 3 (ТРИ) балла! Да, и у Тажа\
    \ есть слабые альбомы. Этот же похож на какой-то саундтрек к музыкальному фильму\
    \ о корневой музыке. \n\nПятый альбом оказался самым слабым из всех. Он сильно\
    \ хуже предыдущих четырех, хотя на нем есть два отличных трека; Вы угадали - первые\
    \ два на второй стороне!"
