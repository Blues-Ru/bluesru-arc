  text: 'Концерты в Форте и Крымских Каникулах были отличные, немногие присутствовашие, я думаю, подтвердят. Арсен, несомненно, растет над собой, каждый раз новые песни и уровень выше. Когда ему удается расслабиться и удержать себя в руках, получается хорошо, как сегодня, например ;) Главный секрет, вероятно, в том, чтобы не переигрывать и менее ответственно относиться к собственной музыке ;))) Короче, "выбросить корнеплод" ;)

    Жалею вас, о, сидящие дома и пропустившие это достойнейшее зрелище! ;) Завтра последний концерт в Scolder Blues.

    P.S. Диск - тоже супер, надо сказать.'
