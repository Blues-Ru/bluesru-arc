    text: "Да чо там, пущай себе грызутся... Злобно строчат списки огрехов. \"В пустой огород камней не бросают\" (С Исус).\nЯ вот, на два вечера вылез со своей кухни. Как это не смешно, но самое яркое впечатления - от... Юры Каверкина с его составом.\nНу что Дилейн. Очень классно, супер профессионально, агрессивный стиль, жесткая подача, знает что надо публике. Но меня - почему то не зацепило. Ну да, если Ломидзе еще лет 40 поиграет, то его сын наверное научится играть что-нибудь подобное, во всяком случае вектор развития именно такой.\nЯ больше люблю более \"растютюйское\" (блин, ну чем еще заменить матерное слово дабы не шокировать местных ЧистоБлюзв. Одну вещь он так и сыграл, расслабленно... Может еще чего сыграл, да я со второго отделения из Форте свалил, не прикалывало.\nА в Алабаме. Минчане в стиле Петра Мамонова разыгрывали эпилепсического полудурка. Клево и прикольно, при этом не забывая хорошо играть. Каверкин со своим бэндом. Я не знаю никого, кто бы за последние 2 года так прогрессировал. Если так и дальше пойдет, то как бы не пришлось своим внукам рассказывать что поил \"САМОГО\" чаем. И ведь не будут верить блин. \nВ конце выползли рокабильные и веселые немцы принятые мной изначально за ............. Хотя, это наверное просто стиль движения Элвиса Пресли... Но соло немец на гитаре сыграл классное, все четко, осмыссленно, с кульминацией и драйвом.\nКороче, главное. Устроителям - памятник, или хотя бы губную гармошку (а то все на чужих играет). Появился у нас свой, мощный промоутер, который понимает и что такое блюз, и как делать такие радости как блюзовый фестиваль в промозглой столице страны вечнозеленых помидоров. И пусть не все получилось, ну так не все же сразу. А пока - мое большое спасибо.\nК.М."
