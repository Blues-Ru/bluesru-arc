      text: 'Маленький комментарий - в нашей стране все привыкли к блюз-року и унылым вариантам имитации чикагского блюза. Почти никто и никогда не слышал ничего другого, в частности, с элементами свинга. Именно поэтому, когда приезжают музыканты средне-блюзового направления, их принимают за Элвисов и рокабилли, просто потому, что слышали вживую только либо блюз-рок, либо что-то "традициенное". Ибо есть уверенность, что блюз - это уныло забойный жанр или же более-кээспэшные формы в противовес.

        Те, кто присутствовал на концертах шведов и немцев, слышали, насколько круто и по-блюзовому они в своей разнообразной программе в числе прочего исполняли Литтл Волтера, Сонни Боя 2, Джорджа Гармоника Смита, Джимми Рида и т.д. Это рокабили?????? Ни фига, это - супер-мастерски-классное исполнение блюза высочайшего уровня. Это блюзом и называется! А не то уныние, которое всегда звучало на нашей сцене.

        P.S. Я не полемизирую, а развиваю мысль, навеянную исходным сообщением.'
