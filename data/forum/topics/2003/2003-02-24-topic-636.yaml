          text: "но вприницпе  если говорить о смешании стилей, то это дело тонкое :)\nнадо обладать всемим компонентами в соврешенстве, а то будет не смешение, а пародия. :)\n\nИспользование Лупов, Семплов и вертушек в блюзе - требует очень \nбольшого умения и внимания - чем например меня и поразил сразу \nальбом Whish I Was In Heaven... например на предыдущем  Burnsine \n\"Comon In\" все гораздо более сыро, и так кайфово не слушается :)\n\nзабить/сыграть какойто стандартный для любого стиля ритм, а потом наложить на него  там гитару с  блюзовыми фразами и гармонию 12и тактовую - это конечно прикольно :) и именно как прикол это и позиционируется как мне кажется :)\n\nможно играть и играют блюзы в панковой ритмке, где все вперед,\nили совсем прямой - это тоже все возможно - и тоже примеры есть, иногда как прикол, а иногда как бы и не понятно даже...\n\nя могу ценить это как пародию/шутку/юмор.. :) но не более... \n\nа у тогоже Бернсайда и Холстрома - это уже не пародия..."
