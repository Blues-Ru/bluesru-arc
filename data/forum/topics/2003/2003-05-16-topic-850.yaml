          subject: It was really cool, people!!!
          deleted: false
          text: "Я в начале сомневался, думал,что будет что-то типа Бюска, а это не моя музыка. Но Маруды (почему-то хочется назвать их Мюридами:)просто убрали... Отличная ритм-секция и очень яркий лидер - вот вам и холодные норвежские парни. Драйва и качки было навалом и что приятно - все было выполнено по блюзу!Даже самые рок-обильные композиции!\nАмунд отличный музыкант, очень блюзовый гитарист и прекрасный шоу-мен.\nИ учитывая его вполне детский(для этой музыки:) возраст можно сказать,что он еще себя практически не раскрыл, и судя по тому, что он явно \"горит\" этой музыкой, у него огромный потенциал к дальнейшему развитию. А как он мастерски \"скопировал\" Альберта Коллинза и других \nблюзовых небожителей???\nShit!!! И это пишу я, для которого появление любого \"белого\" музыканта на блюзовой сцене приравнивается к запиванию пива водкой...\nТак можно и до-черт знает до-чего докатиться :))\nЕдинственный вопрос. Где вы,о монстры отечественного блуза??? Львы шестиструнного чеса, тигры звукоизвлечения,гориллы драйва??? Почему, практически никого не было? \"Профессионализм\" давлеет? Так это проходящее, если не подпитывать....\nВот Арсен Шомохов был и не стеснялся выражать свои восторги ,а уж он-то явно не из средних музыкантишек. Хотя, как там у классика - О, русский блюз! Самый жестокий и бессмысленный (дальше не помню!!! :))"
          inferred_person_id: 1719
