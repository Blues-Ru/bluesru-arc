  text: "Офигительно. Играет и поет  просто отлично. Музыка та самая :)\nШаффл играть умеют в отличие от наших команд... ну наверно за исключением Мишуриса... ну блин здорово :) Такая музыка - драйв - и все очень сильно и технично и эмоционально. Если кто еще думает - идти надо обязательно :)\n\nя иду на все... ;) \n\nНе знаю как кто, а я просто после таких мероприятий сразу начинаю играть гораздо лучше. Очень полезно дело :) Жалко редко.. но и то \nспасибо блин огромное Федору за такие мероприятия :)"
