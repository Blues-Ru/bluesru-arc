  text: "Не успокоюсь пока не найду :-)\nВот что нашлось в поисках трека Jimi Hendrix and Paul McCartney\nhttp://music.advertka.ru/elicaster/jh_leary_mccartney.txt\
    \  - 1.01 Kb Текстовый файл, который мало что поясняет (скорее малехо запутывает). Собственно, вот он:\nTimothy Leary\n\
    W/Jimi Hendrix (Bass), Stephen Stills (Guitar), John Sebastian (Guitar), Buddy Miles (Drums)\nSeptember 30, 1969\n\"You\
    \ Can Be Anyone This Time Around\"\nSource: Arhcive Record or CD? -> CD -> EAC -> SHN\nShn'd and Eac'd by: Twice (corey.langlois@verizon.net)\
    \ 09/01/02\n---------------------------------------------------------------\n01. Live And Let Die (((явно ошибка, должно\
    \ быть Live And Let Live)))\n02. You Can Be Anyone This Time Around\n03. What Do You Turn On When You Turn On\n----------------------------------------------------------------\n\
    Paul McCartney's Birthday Party Jam Session\nJanuary 20 1968 (((ещё одна неточность: PM родился летом)))\n\"McGough And\
    \ McGear\"\nFeaturing: Mike McCartney (A.K.A) Mike McGear, Roger McGough, \nJimi Hendrix, Mitch Mitchell, Graham Nash,\
    \ Dave Mason, Spencer Davis, John Mayall, Paul McCartney\nNote: Only the Songs Hendrix Played On Are Included!\nSource:\
    \ Archive Record Or CD? -> CD -> EAC -> SHN\nEac'd and Shn'd by: Twice (corey.langlois@verizon.net) 09/01/02\n---------------------------------------------------------------\n\
    04. So Much\n05. Ex Art Student\nА вот один из 5-ти музыкальных файлов (в остальных всякая ерунда типа Timothy Leary)\n\
    http://music.advertka.ru/elicaster/jh_leary_mccartney_t04.mp3  - 6.43 Mb\nЭто So Much/Ex Art Student. Меня уверяли что\
    \ в ней и играет JH, а на барабанах его ударник Mitch Mitchell, а поёт скорее всего брат Пола Mike McCartney (A.K.A) Mike\
    \ McGear или Roger McGough. Хотя где там Paul McCartney или John Mayall? А вот в Ex Art Student поёт женщина, хотя на\
    \ http://www.allmusic.com/cg/amg.dll?p=amg&uid=MISS70306030320&sql=6Ex|Art|Student есть список тех кто работал на альбомом\
    \ McGough & McGear в который входят песни So Much и Ex Art Student, но там нет женщин."
