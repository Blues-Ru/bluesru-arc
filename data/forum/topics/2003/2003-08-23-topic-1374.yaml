    text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=MISS70308221724&sql=A5v2tk60x9krf


      Ну это совсем слабо на этот раз. Их осталось только трое! Басист Ларри Тэйлор остался, Харви заменили на Джерри МакГи
      из Ventures, скрипача вообще убрали. И зачем все это? Умышленный шаг назад или куда?


      10 песен на 46 минут. Ничего особенного, разве что некоторые треки автобиографические и о своей семье. Джону опять нужно
      все менять, это ясно. Оценка 2 балла; я отнес этот винил обратно в магазин! Не могу выделить тут ни одной композиции.
      А играют хорошо, конечно.


      Нам такие воспоминания не нужны.'
