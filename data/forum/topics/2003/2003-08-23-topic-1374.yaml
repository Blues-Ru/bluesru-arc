    text: "старт! :) На самом деле, я бы десяточку, как минимум, поставила этому альбому.. Его в качестве обязательного для\
      \ изучения поставила бы в музыкальных заведениях.. Игра великолепная, великолепнейшая. Под девизом: долой драммеров,\
      \ если у них руки растут не оттуда. А уж песни какие..! Of the road только немного расстраивает, размещенная после night\
      \ flyer, - рука неизменно тянется либо вернуться к треку предыдущему, либо перескочить через него на следующий. Хотя,\
      \ по сути, сама по себе вещь неплохая, - может, ее просто не там поставили? Зачем она между двумя великолепными night\
      \ flyer и possessive emotions..? \nTook The Car - шедевр! По моему.. Дон Харрис точен, как аптекарь, ГАРМОШКА Джона\
      \ там ма-ма да-ра-га-я. Гитара - конфетка! Басист - умница. Там все мама дарагая, - до последней ноты, до последнего\
      \ писка, звука. Офигительно сыграно! Если услышу что-нибудь подобное вживую - умру, наверное, от счастья.\nЖаль, никто\
      \ у нас ее не играет. Трудно..? Не интересно..? Ясен пень, не блюз, но всё же.."
