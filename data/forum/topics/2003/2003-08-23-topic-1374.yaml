  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=MISS70308221724&sql=Ab9881vkjzzba


    Это уже третий альбом без барабанов и вчетвером, но тут уже совсем другой состав - только американцы с Джоном: Дон Харрис
    - скрипка, Ларри Тейлор - бас и Харви Мэндл - гитара. Саксы и флейты заменили на скрипку, англичан заменили на более профессиональных
    и драйвовых американцев. Музыка почти не изменилась, разве что все стало более солидно и продуманно. 10 песен на 48 минут
    - эта любовь Джона к длинным альбомам уже стала традицией.


    Альбом очень ровный и трудно что либо выделить. Безусловно хороша первая вещь Nature''s Disappearing с экологическим контекстом,
    Night Flyer очень приятна во всех отношениях, Possessive Emotions - отличная, Took The Car в полном порядке, неплохо звучит
    почти танцевальная Deep Blue Sea.


    Оценка 4, нехватка перкуссии достает и пора бы менять концепцию. Хорошо, что вещи очень приличные.


    Мэйолл уже в Америке, и душой и телом.'
