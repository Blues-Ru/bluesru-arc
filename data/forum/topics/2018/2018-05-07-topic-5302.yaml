  text: 'Фотограф Алекс Бартч (Alex Bartsch) отправился по следам культовых регги пластинок, обложки которых были сняты в
    пределах Лондона. В рамках своего проекта «Retracing Reggae Record Sleeves in London» он посетил различные малоизвестные
    места Лондона, чтобы на расстоянии вытянутой руки запечатлеть образы грампластинок на их реальных локациях. Фотограф смешал
    периоды выпуска популярных регги пластинок (1967 — 1987) с реальным временем, предлагая зрителю переосмыслить взаимосвязь
    между городом и его музыкальным наследием.

    https://zagge.ru/skvoz-vremya-mesta-syomok-oblozhek-dlya-reggi-plastinok-v-londone/


