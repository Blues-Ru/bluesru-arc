  deleted: false
  text: 'В начале 90-ых у меня была запись концерта Литтл Ричарда. Живое концертное исполнение, не стадион, а видимо театр или клуб. Ох, какой заводной он там был. Какая там была атмосфера! Многократно он повторял "Oh, my my my soul!", "Are you ready?" и публика ему отвечала.

    Одними из первых на альбоме шли песни (по крайней мере в числе первых пяти песен):

    The Girl Can’t Help It

    True Fine Mama

    Send Me Some Lovin’

    Но это точно не пластинка 1976 года K-tel Presents Little Richard Live! 20 Super Hits.

    Что за альбом это был?'
