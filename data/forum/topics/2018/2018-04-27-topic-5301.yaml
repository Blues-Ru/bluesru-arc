    text: Все перечисленные, безусловно, достойные блюзовые исполнители. Но, по-моему, нельзя сказать, что они исполняют русский блюз. Они исполняют блюз, настоящий, англоязычный, оригинальный, блюз как он есть. И сами при этом русскоязычных. А русский блюз, в моём понимании, это блюз с текстами на русском языке. Такие тоже есть, и самые лучшие русскоязычные блюзы, по моему мнению, у Ксении Федуловой, вот она умничка вообще. Есть два-три хороших русских блюзов у Андрея Козловского, но я бы не решился называть его блюзовым музыкантом. Это первые, что в голову пришли. А вообще большинство того, что принято называть русским блюзом, относится к собственно блюду так же, как большинство русского рока относится к собственно року. То-есть никак не относится, кроме названия.
