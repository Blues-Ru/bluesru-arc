    text: 'Мужики! не смоги бы мне помочь? Дело вот в чём: я вот давно ищу и не могу найти один трек из этого фильма: когда паренёк играет в музыкальной школе "Турецкий Марш" Моцарта. Там ещё он сделал коду блюзовой. Потом с ним беседовал его преподаватель о сиём неуважении.

      В саундтрек фильма (а он у меня есть) эта вещь не вошла. Знаю точно что это не Ry Cooder и не Steve Vai, в титрах указывался William Kanengiser - Rondo Alla Turka (Turkish March).

      Так вот: не смог бы кто-нибудь записать этот трек в формате мп3 и выложить его где-нибудь для того что бы я смог его качать или прислать его по мейлу?

      Если это только возможно. Я был бы очень благодарен.'
