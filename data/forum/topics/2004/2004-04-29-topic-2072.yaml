  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70311210457390546&sql=A9i8m961ogep6


    Типа совместное творение двух великих музыкантов: гитариста John Brim и пианиста Pinetop Perkins. На самом деле совместного на этой пластинке не так уж и много. Общих для них обоих треков на альбоме нет. Лишь в некоторых вещах играет один ударник Tim Taylor. Материал пластинки писался в несколько заходов: сессии 1989 и 1990 годов, две же заключительные на альбоме вещи John Brim датированы концом 70-х годов теперь уже прошлого века. И для Pinetop Perkins, и для John Brim характерна достаточно грязная манера игры, здесь же все без исключения треки прописаны непривычно чисто, что очень приятно.


    Если John Brim преимущественно писался со стандартным составом, то Pinetop Perkins выступает дуэтом с драммером. Интересно, что те самые вещи John Brim конца 70-х сыграны, можно сказать семейным коллективом: помимо самого John Brim (вокал+ гитара), John Jr. Brim (гитара, бас), Grace Brim (ударные). Вообще, жена John’а Grace прошла рука об руку с John’ом через всю жизнь. Всё они делали вместе: жили, любили, записывались, выступали, что, надо сказать, для блюзменов большая редкость. 53 года семейной жизни. Впечатляет, однако.'
