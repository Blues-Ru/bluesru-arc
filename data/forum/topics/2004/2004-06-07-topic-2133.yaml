  subject: Кид Андерсен во Владимире
  deleted: false
  text: "Это было просто чтото нереальное. Немерянно круто. С первого дня чуваки быстренько сыграли и наделали еще кучу вещей\
    \ и все это играли с такой энергией и ощущенеим, что кайф наступил не замедлительный  Кид разошелся очень круто и видимо\
    \ как раз и сделал все то, за что его понастоящему можно считать чуваком из самых супер чуваков  \n\nРассказывать нечего\
    \ - просто невероятное ощущение и свободный поток настоящего блюза и музыки вообще  \nВообщем настоящий концерт с которого\
    \ уходишь просветленным  \n\nВеликолепно сыграл в джеме Арсен Шомахов  Его тоже круто зацепило  \n\nПримичательно что\
    \ чувакам надо было всего 5 дней чтобы от легкого расколбаса в форте прийти к высочайшему качеству музыки и очень сильным\
    \ положительным ощущениям для слушателей  Это говорит о том, что у всех чуваков, не какоето там смешное перспективное\
    \ будущее, а самое что нинаесть мощное настоящее. \n\nНа мой скромный взгляд - если ктото думает что любит блюзовую музыку,\
    \ но не ходил или ничего не понял на таком вот или другом концерте - ему надо срочно подумать получше о том, чем собственно\
    \ он занимается. Но это разумеется мое личное мнение, всяческие другие менения я считаю полезным делом и считаю что они\
    \ тоже должны быть. Это личное дело каждого. \n\nДля справки, а то многие не понимают, хочу заметить, что Кид Андерсен\
    \ вовсе не играл какого чистого весткоста - он играл именно разный-разный блюз. Настоящий блюз. Потому что блюз у него\
    \ есть и он дейсвительно знает как это делается."
