      text: "Да, последний концерт был фантастический. Во многом, вероятно, благодаря публике ;) У меня нет слов! Снимаю шляпу\
        \ перед Владимиром и группой. \nСтрашно приятно было видеть там друганов, Дима катался все время с нами, Арсен - молодец,\
        \ приехал за 2000 км только ради концерта, Вова Русинов с Вовой Демьяновым приехали из Москвы. По случаю, кстати,\
        \ там же оказался Кожекин, который правда по дурости пропустил первые 3/4 концерта, но джемовал потом с особым усердием.\
        \ \nВ Ярославле и в Нижнем тоже все было отлично. После концерта возле академического театра им. Горького девушки,\
        \ которые со слезами прыгали Бьорну и Киду на шею, со словами, что без них не пойдут домой. Потом фантастический 30\
        \ минутный концерт в клубе Jam Prestige с супер-блюзовым очень клубным звучанием (один из самых впечатляющих в моей\
        \ жизни). В Ярославле - танцы до упаду, девушки, пляшущие гопники. Все прошло очень здорово! ;)))"
