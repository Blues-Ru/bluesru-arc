  deleted: false
  text: "Вчера послушал в БиБиКинге Юру Каверкина и Dirty Dozen. Это акустический вариант, где, кроме Каверкина на гитаре,\
    \ солируют А.Новоселов (добро), Д.Калинин (балалайка) и М.Владимиров (харп), при поддержке Ф.Пагнотти (ударные) и В.Серегина\
    \ (акустический бас). Смотрелось и слушалось все это, как в каком-то кино (Брауни МакГи и бэнд в \"Сердце ангела\"). Классно\
    \ звучали все инструменты. На таком тихом и ритмическом фоне выпукло звучали все оттенки голоса, а голос у Каверкина такой,\
    \ как надо. Это был беспримесный блюз, услышанный в московском Доме блюза впервые за долгое, долгое время. Если такому\
    \ составу удастся найти хорошую работу и сесть за репетиции, получится долговременное яркое событие, несомненно.\n   \
    \ Еще нельзя не вспомнить, из недавних впечатлений, выступление \"Svet Boogie Band\" в театре \"Поиск предмета\". Маленький\
    \ зальчик со складными стульями, 12 слушателей, бочка, сделанная из положенного на бочок том-тома, живое фоно, минимум\
    \ аппарата и подзвучки, и какая хорошая, вкусная игра! \n    Получил большое удовольствие, всем спасибо."
