    text: "Концерт был действительно неординарный, из тех на которых отдыхаешь душой, а не борешься отчаянно с зевотой, затыкая\
      \ уши специальными затычками. Ибо почему-то во многих случаях считается что \"играют хорошо - громко, и песня хорошая\
      \ - длинная\". Ни того, ни другого вчера не было - ни одуряющей громкости, ни скучных \"запилов\".\nА была отличная\
      \ музыка - веселая, грустная, заводная... всякая, но несомненно \"вкусная\". Все по-настоящему, как живется и чувствуется.\
      \ \nПризнаться, впервые вчера услышал, как звучит блюз на балалайке - до сих пор нахожусь вод впечатлением Калинина.\
      \ Музыкальные шутки Миши Владимирова удались и имели успех. Да что говорить - все были очень и очень хороши. \nОгромное\
      \ спасибо Юре Каверкину! Отличный получается проект!\nВот только одно печалит - слушателей маловато все же."
