        text: 'Все тоже самое....только Polske Radio было в Москве. Это было удивительно
          слушать все последние новинки западной рок-музыки гораздо более лучшего
          качества, чем передавали Голос Америки, ВВС. И это было благодаря радио
          DJ-м Мареку Гашинскому, Витольду Пограничному, как сейчас помню эти имена.Благодаря
          им я впервые услышал F.Zappa,Living Blues, Procol Harum, Supertramp и тд.
          У них тогда была даже передача, на которой передавали целИком новые альбомы.А
          Чеслав он и тогда очень выделялся среди польских исполнителей и даже западных.
          Его песня "Dzwni jest ten swiat" - самый настоящий блюз...

          После уже был концерт в театре Эстрады. Как я на него прорывался, аж сейчас
          мороз по коже, но этого стоило.

          Жаль уходят такие люди...RIP'
