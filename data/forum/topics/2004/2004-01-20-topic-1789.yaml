    text: "У каждой пластинки \nесть своя история. \n«……»\nВ 1981-82г. Находясь в\
      \ длительных командировках в космической дыре с поэтическим названием «Ленинск»\
      \ (читай - Байконур), в киоске «Союзпечать» покупаю «тряпочный» синий диск Чеслава\
      \ Немана с компиляциями альбома «Russiche lieder». Кто не слышал - русские народные\
      \ песни (вокал и все инстументы Чеслав Неман - полный контроль). \n\nБайконур\
      \ – 12 часов работы, сутки отдыха.\nПластинку запилили в «ноль», подыгрывая\
      \ на гитаре и бубне - в режиме «live, no over-dubs».\n«Клиенты» улетели и вот\
      \ - Большая земля:….. восполняем потерянное… \n  \nСоображаю: вышел «миньон»\
      \ НО ТО ЦО – появился «гигант», вышел «миньон» СКАЛЬДОВЕ – появился «гигант»….\n\
      \ Цель: ищем «гигант» Чеслава Немана - Не нашел.\n\nМесто действия: г. Калининград,\
      \ Московская обл. – сейчас г. Королёв, магазин «Мелодия», пр-т Королёва – отдел\
      \ уценённых товаров - CZESLAW NIEMEN «POSTCRIPTUM», списываю с конверта «цена\
      \ с 16.10.82 – 1руб 20коп», родной «MUZA, POLSKIE NAGRANIA – SX 1876». Перебираю\
      \ пластинки и нахожу «Трио Ганелина» - «POI SEGUE..» запись 1981г. и  «CONCERTO\
      \ GROSSO» запись 1980г. - цена на конверте 2,15 руб уценено до 20коп.\nРезюме:\
      \ Униженный музыкант всегда найдет достойную компанию.\n\nP.S. Чеслав Выдрицкий\
      \ (Czeslaw Juliusz Wydrzycki) родился в Белоруссии в семье интернированного\
      \ офицера «Войска Польского», получил начальное образование в СССР (к сожалению\
      \ не помню в каком городе (Гродно?)), там же учился в музыкальном училище по\
      \ классу духовых (гобой?). Семья получила разрешение вернуться в Польшу после\
      \ В. О. войны.\n\nP.S.S. 1962 год – «Beatles» парятся в Гамбурге, а Чеслав Неман\
      \ выпускает первый сингл (SP) и понеслось….. под «крышей» группы «Niebiesko-Czarni»\
      \ с 1962 по 1966 записано большое количество синглов (SP) и миньонов (EP). Первое\
      \ «соло» альбом «DZIWNY JEST TEN SWIAT» - (LP)  1967   Polskie Nagrania - Muza\
      \    XL 0411 PL, стал первым в истории Польши «золотым диском». С 1967 по 1974\
      \ многочисленные гастроли с разными составами в Англии, Франции, Италии (засветился\
      \ на SAN REMO '70), записывает с оркестрами этих стран SP, EP, LP. Далее Чеслав\
      \ начинает активно писать музыку для театра, кинематографа, для телевизионных\
      \ сериалов. В 1974 выходит «NIEMEN AEROLIT», (LP) 1974   Polskie Nagrania -\
      \ Muza   SX 1192  PL, за ним «KATHARSIS», (LP) 1975   Polskie Nagrania –Muza\
      \  SX 1262  PL, две самые известные пластинки Немана. Первая – великолепный\
      \ джаз-рок, вторая, по тем временам, настолько экспериментальная (космическая\
      \ сюита с кучей электронных эффектов), что на владельца этого альбома странно\
      \ посматривали. И сейчас, если и есть в какой-нибудь рок-энциклопедии имя Чеслава\
      \ Немана, то «KATHARSIS» упомянут обязательно, а о других пластинках забудут.\
      \ Последнее «соло» -  «TERRA DEFLORATA», (LP) 1989 Veriton  SXV 1001 PL, в 90-х\
      \ продолжает работать с разными музыкантами, но как-то в тени, на заднем плане\
      \ (там – MOOG, там – подпевки…), светился в разных сборных пластинках, в это\
      \ же время переиздаются все «авторские» пластинки на CD.\n\n               \
      \                              «Не вижу былого\n                           \
      \                          достойных мужей.\n                              \
      \                 Не вижу в грядущем\n                                     \
      \                наследников им.\n                                         \
      \      Постиг я безбрежность\n                                             \
      \        небес и земли.\n                                               Скорблю\
      \ одиноко\n                                                     и слёзы текут.»"
