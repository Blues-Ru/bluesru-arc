      subject: EPITAFIUM
      deleted: false
      text: "В начале 70-х на даче под Витебском на приёмнике VEF 201 прекрасно принимались\
        \  радиостанции «Радио-1, Польша – на ДВ» и «Радио-3, Польша – на СВ» , великолепнейшие\
        \ музыкальные передачи, особенно «Меньше слов – больше музыки». Однажды вечером,\
        \ настроясь на передачу, я слышу изумительную песню (тогда мы называли такие\
        \ «вещи» - «рок-номер») с хриплым вокалом, диапазон в несколько октав .\n\
        - Батя! Кто это? – (Отец – полиглот славянской группы).\n- Czeslaw Niemen\
        \ – «Король польского рок`н`ролла».\n- Король рок`н`ролла? А кто это - «Короли\
        \ рок`н`ролла».\n- Ну…. Элвис Пресли, Чак Берри…\nВернувшись после каникул\
        \ в Подмосковье, я начал рыскать в поисках упомянутых  «Королей!». Нашел –\
        \ 10-е копии на магнитофонах  «Нота», «АСТРА», (лучшая запись – ламповый «Neringa»\
        \ г.Рига). \nВпечатление: - И это «Короли»?....... Тогда Czeslaw Niemen –\
        \ это БОГ!\n\nПрошло несколько лет – матушка поручила сходить на базар и купить\
        \ авоську картошки и других овощей (г. Калининград Московской обл. – сейчас\
        \ г. Королёв),  в торговых рядах я натыкаюсь на «фарцовщика» с кучей пластинок\
        \ Восточно-Европейского рока. Не буду перечислять все пластинки, но две «NIEMEN\
        \ AEROLIT» и «KATHARSIS» (каждая по 15 рублей, а две по 10…..) – привет картошке!\
        \ \n\nМама до сих пор не понимает, как можно покупать пластинки за «такие\
        \ деньги», и вернувшись домой я апеллировал к отцу:\n- Папа! Я купил Чеслава\
        \ Немана!.... Давай слушать!.....\nРеакция родителей: _________________(пробел\
        \ заполнить самостоятельно).\n\nС тех пор прошло почти 30 лет, менялись стили,\
        \ «крутизна», но моё музыкальное мироощущение сформировалось и базируется\
        \ на 3-х китах: Владимир Мулявин (Песняры ( Generation P – этого не поймёт)),\
        \ Czeslaw Niemen, Frank Zappa.\n\nСчастливого перерождения Вам – гиганты рок`н`ролла."
