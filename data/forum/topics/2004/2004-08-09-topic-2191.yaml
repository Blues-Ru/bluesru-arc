    subject: Наконец-то после долгих скитаний диск "Boogyin' It" вернулся ко мне
    deleted: false
    text: "Чем же примечательна эта пластинка?\n\n1.Тем что это просто хорошая музыка,исполненная,как\
      \ и положено живому выступлению,на одном дыхании.\n2.Тем что это последнее выступление(по\
      \ крайней мере в Москве)вместе с Элом. И ближайшем обозримом будущем повторения\
      \ не предвидится.Быть может через пару-тройку лет.\n3.Тем что это одна из последних\
      \ записей сделанных в ББКинге когда там еще стоял старый,добрый аппарат с кучей\
      \ недостатков ,но предсказуемый и рулили им такие же добрые люди.(Нет,нет сейчас\
      \ в ББКинге и с аппаратом и с людьми все в порядке.Просто всегда немного жаль\
      \ того что безвозвратно уходит)\n4.Тем что впервые результаты \"легального подслушивания\"\
      :) BluesmAn.ru привели к появлению пластинки. И не беда что запись в общем-то\
      \ любительская.И не беда что мне не хватило наглости чуток повернуть басовый\
      \ комбик. Это настоящая хорошая живая музыка!!!\n5.Тем что пластинка вернулась\
      \ аккурат к приезду ребят.Это несомненно к удаче,...а может и к дожжу :)))\n\
      \nВозможно у директора этого славного коллектива В.Иванова (barmaley-vov@yandex.ru)\
      \ что-нибудь в загашнике и осталось\nПоспрашайте,он добрый :))   \n\nГоворят\
      \ нынешний гитарист тоже очень хорош.Э т о  и н т е р е с н о."
