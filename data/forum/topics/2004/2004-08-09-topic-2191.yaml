  text: "Дорогие друзья концерты Svet Boogie Band в Москве состоятся\n\n12 августа\
    \ \"Синяя птица\", 21-00 тел. 299 22 25, М.Дмитровка, 23/15, стр. 1, вход со Старопименского\
    \ пер., м. Маяковская\n12 августа \"Оракул божественной бутылки\" 23-00\n13 августа\
    \ \"Ритм-н-блюз кафе\"  21-00 \n14 августа \"JVL\" 21-00"
