    deleted: false
    text: "Еще некоторые общие замечания про R&B 40-50х годов\n\nОсновные корни:  (а) Джаз и блюз в Кансас Сити 30х годов,\
      \ особенно Count Basie c Jimmy Rushing.  Big Joe Turner и Pete Johnson уже играли настоящий R&B в 30х годов  (б) Городские\
      \ популярные блюз и Boogie Woogie 30х годов (Leroy Carr, Cripple Clarence Lofton, Big Bill Broonzy, разные пианисты-певцы\
      \ в Чикаго)\n\nНекоторые важные пионеры:  Louis Jordan (jump blues), Lionel Hampton и Illinois Jacquet (традиция \"\
      screaming saxophone\"), T-Bone Walker (R&B гитар)\n\nНекоторые великие певцы: Big Joe Turner, Jimmy Rushing, Wynonie\
      \ Harris, Roy Brown, Eddie Cleanhead Vinson, Jimmy Witherspoon, Big Mama Thornton, Ruth Brown, Dinah Washington, Clyde\
      \ McPhatter, Nat King Cole \n\nШкола западного берега:  Johnny Otis, Roy Milton, Jimmy Liggins, Joe Liggins, Lowell\
      \ Fulson, Jimmy McCracklin, Bull Moose Jackson, Gene Phillips\n\nШкола New Orleans:  Champion Jack Dupree, Professor\
      \ Longhair, Guitar Slim, Dave Bartholomew, Fats Domino\n\nШкола Memphis/Mississippi: Ike Turner and the Kings of Rhythm,\
      \ Little Junior Parker, Bobby Bland, BB King, Elmore James  \n\nи это только начало...(времени больше нет сейчас :)\
      \ )\n\nMuddy"
