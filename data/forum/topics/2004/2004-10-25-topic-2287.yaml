    subject: Западные гитаристы  R&B
    deleted: false
    text: "Ритм-и-Блюз 40-50х годов включает много разных направлений и школ.  Различать рить-и-ьлюз и самый \"блюз\" не всегда\
      \ просто.  Разные определения и разделения применяются у разных авторов.  \n\nЧто касается гитаристов одна очень важная\
      \ школа была основана T-Bone Walker в Техасе.  После войны была большая миграция из штатов Техаса и Оклахомы на запад\
      \ в Калифорнию.  Много прекрасных гитаристов ритм-и-блюза появилиь особенно в городах Лос Анжелес и Окленд (где я сам\
      \ родился).  В Лос Анджелесе были Pee Wee Crayton, Pete Lewis, Cal Green, Jimmy Nolen, и др.  В Техасе Clarence \"Gatemouth\"\
      \ Brown пользовался большим влиянием (Он еще жив, но в последнее время очень болеет.)  В Окленде были  Lafayette \"\
      Thing\" Thomas, Johnny Guitar Watson, Lowell Fulson, Johnny Heartsman.  Под влияниям западных гитаристов появились в\
      \ городе Мемфис BB King, Ike Turner, и Little Milton (все еще живы).             \n\nЯ не знаю, в какой степени записи\
      \ этих гитаристов доступны в России. Ace Records в Великобритании очень много выпускает.  Многие из лучших гтаристов\
      \ в Лос Аджелесе работали с Johnny Otis.  Его записи на Savoy включает много хорошого гитара.  Lafayette \"Thing\" Thomas\
      \ работал в основном с Jimmy McCracklin.  \n\nMuddy"
