    text: Hello, heard someone asked about 50?s R&B....(I can?t read this page myself, it?s just a lot of ??????????????...)
      When it comes to this era it?s actually so much good out on CD today, and if you?re a guitar player - you?ll easily
      find Tiny Grimes early recordings (Blue Moon etc.), and Johnny and Oscar Moore, with Floyd Dixon, Charles Brown and
      the Blazers (Specialty/Ace, Westside etc), and T-Bone?s and Ulysses James more obscure  but great takes with Roy Hawkins
      (Ace, Route 66 ). Johnny Otis "the Dig Masters" Volume 1-3, with Jimmy Nolen, Pete Lewis, Johnny Watson etc, are great
      compilations that covers the best of Johnny Otis fabulous work (Ace). Or if you wanna buy some great shit via EBAY -
      check out bignickelpublications, on the US edition - Galen is a great guy, and he always got tons of crazy, obscure
      R&B for sale for a reasonable price! AND - I know that Fedor has got some great Bill Jennings stuff..... Take care all
      you music lovers! Anders
