  deleted: false
  text: "Наконец-то произошло давно запланированное мной посещение нынешнего проекта Юрия Каверкина «Dirty Dozen». Дюжина не дюжина, а квартет на сцене таки имелся. Звучала, разумеется, классика жанра: «Nine Below Zero», «Mannish Boy», «Crowling King Snake», само собой не обошлось и без «Hoochie Coochie Man». \n\nОчень хотелось послушать балалаечную версию «Dirty Dozen» с участием Дмитрия Калинина, однако, этого не случилось. В тот вечер его заменял слайд-гитарист А.Новосёлов. Так что так и осталось моё восприятие Каверкина под аккомпанемент «russian balalaika» исключительно в варианте записи Игоря Г. На субботнем же концерте слайд-гитара приятно освежала традиционное традиционно-монотонное звучание (фирменный звук) каверкинского коллектива. Но, к сожалению, освежала и только. Я ждал чего-то большего, каких-то новых решений (хотя, какая в традиции в принципе может быть новизна?), необычности звука. Этого я не услышал. В зале был не то чтобы аншлаг, но где-то близко к тому. И, несмотря на это, что-то было не так. То ли субботняя вяло-жующе-немузыкальная публика влияла на всё происходящее, то ли неустойчивая погода, то ли и то, и другое одновременно. ПРОСТО концерт не стал хотя бы ПРОСТО праздником.\n\nВо втором отделении квартет преобразовался в квинтет. К музыкантам присоединился Александр Братецкий. Но, по большому счёту, и это проблему настроения не решило, хотя, между прочим, даже и звук выправился (вначале была излишне звонкая гитара и слишком громкий вокал). И всё равно, медленные вещи, которые я так люблю у Юрия, получались как-то не глубоко, что ли. На кантри- и быстрых шаффлах становилось «повеселее», но, видимо, прежде всего за счёт оптимистичной мелодичности и темпа.\n\nПопытался я повспоминать, какие же концерты Юрия Каверкина мне запомнились больше всего (конечно, я имею ввиду не многочисленные краткие сеты на джемах, а полноценные выступления), и пришёл к выводу, что это, во-первых, концерт в Scolder Blues Cafe в декабре 2003 года (ещё с Владимиром Фроловым на басу), а во-вторых, выступление на фестивале Blues.Ru-2004  в Б-2 в апреле 2004 года (уже с Валерием Серёгиным на басу, но ещё и с Михаилом Владимировым на гармошке). При этом они были очень разные: в Scolder Blues Cafe – истинно джонлихукеровский концерт; в Б-2 – саунд значительно потяжелел, стал напористей и агрессивней.\n\nВот написал я всё это и думаю: как же так, откуда критики то столько полезло? Неужели же всё было настолько кисло? Да, нет, конечно. Всё очень просто объясняется на самом деле: выступал бы любой другой на месте Юрия, я бы громче всех кричал, что, дескать, супер, шедеврально и всё такое. А тут знаю же, что всё, что делает Юрий – для нашей страны уникально и делается по высшему разряду, вот планка сразу задирается невозможно высоко, да некая необъективность вырисовывается. Но это токмо ведь пользы для. Вот чесслово!"
