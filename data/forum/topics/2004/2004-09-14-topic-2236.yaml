        subject: Глупости
        deleted: false
        text: 'Этно блюз - это термин типа сладкого сахара. Любая этно музыка (как и блюз) жестко завязана и на языковые особенности
          данного этноса, и на костюм, и на ментолитет и на культурно-исторические традиции. И вне данного этноса - просто
          бесмыслена. Типа папуасов поющих русские народные песни... :-)

          Но - господа. Если блюз будем расматривать как музыкальное течение оказавшее колоссальное влияние на всю современную
          музыку - то тогда извините - это дело ИСПОЛНИТЕЛЯ на каком языке ему петь. Если исполнитель не "имитатор" не парадист,
          не бутлег Мади- то уж сам решит данный непринципиальный вопрос. И если он не захочет петь "мертвячину" для 20 "любителей
          блюза" - то для рускоязычной публики будет петь на русском, для англоязычной - на английском, а если захочет - то
          хоть на иврите, если ему проще выражать на нем мысли и чуства.

          Закрытие музыки по какому-нибудь признаку - гармоническому ли, ритмическому, языковому, или по скажем половому или
          национальному - приводит только к умиранию. Жизнь прекрасна своим разнообразием. И блюз - это не свод правил типа
          воинского устава.

          А про структуированные лингвистические особенности - рассказывайте маленьким девочкам, пусть слушают широко открыв
          рот....'
