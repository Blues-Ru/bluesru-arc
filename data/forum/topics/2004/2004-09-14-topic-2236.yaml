            text: 'Да, клево все. Только вот для меня блюз - это прежде всего - достоверность. Искренность. Умение рассказывать
              истории от первого лица. И так, чтобы верилось. Что эта история - вот об этом конкретном дядьке на сцене.

              А когда историю о грязном кандальнике пытается рассказать чистенький мальчик с московским или еще хуже - с питерским
              акцентом. Извините - не верю. А когда он при этом еще и ритм не держит, хочется подойти к нему, похлопать по
              плечу и сказать - играй мальчик, играй...

              Большинство музыки - когда то имело прикладное значение. Культовое, боевое, праздничное или наоборот. Для работы
              - одна музыка, для праздника - другая. или для пьяного отдыха. Для похода и для любви.

              А потом пришла интелигенщина и лишила музыку ее смысла и значения. И вот уже, в хоре Покровского не изначальные
              мужички лапотники от сохи с дальних деревенек, а одевшие сапоги и шаровары чопорные консерваторцы. А любая музыка
              очищенная от своих корней становится просто игрой. Игрой определенной тусовки для себя же самих, любимых. Где
              правилами игры становится не собственно музыка - а делание ее "как" или даже "под". И не важно, конкретно под
              Хукера или под "Чикагский блюз". И если кто то начинает делать как он сам, тут же обвиняется во всякой глупости
              - то язык не тот, то гармония не блюзовая на все 100, то ритмику поломал не так как, да и вообще, просто не
              "впечатляет". А нормальные пацаны, не искушенные в тонкостях и хитросплетениях стандартов норвежского блюза,
              вынуждены ходить на концерты "фабрики звезд", вместо того, чтобы слушать "своего" парня расказывающего простым
              и понятным блюзовым языком о трудной судьбе бритоголовых из далекого подмосковья.'
