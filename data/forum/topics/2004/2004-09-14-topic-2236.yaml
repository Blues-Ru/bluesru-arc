        text: "Очень интересные выступления!  Спасибо!\n\nЯ бы хотел прибавить, что подражание в блюзе в сегодняшнее время\
          \ – это не просто какая-то русская особенность.  И в США, и в других странах я слышу мало хорошей новой (оригинальной)\
          \ музыки, основанной на блюзе.  Вот главная причина, почему я задал такой вопрос о русском блюзе.  В прошлом веку\
          \ так много было оригинальной блюзовой музыки в США, что голова могла кружиться.  Сейчас пока еще много талантливых\
          \ блюзовых музыкантов выступают, но чаще всего они востанавливают старую «чужую» музыку, и сами создают очень мало\
          \ своего.  Иногда, новые версии могут быть даже сильнее, в каком-то смысле, чем оригиналы.  Тем не менее, оригиналы\
          \ остаются оригиналами, и их стало мало (по-моему).\n\nВсе равно я согласен с общей мылью Федора (если я его правильно\
          \ понял.).  Я очень рад, что на земле (в том числе и в России), есть музыканты, которые продолжают старые блюзовые\
          \ традиции.  Эти традиции – очень ценные.   Когда я сам пою и играю блюз, я ничего нового не делаю,  Тем не менее\
          \ я получаю огромное удовольствие.   В пятьницу я был на коцерте «Blues Doctors.»   Эти ребята играли Американский\
          \ блюз безо всякого (нарочного) русского отенка.  Но мне очень понравилось.  Главный гитарист (как его завут?) серьезно\
          \ изучал великую американскую традицию, и научился по-настоящему «рассказывать» блюзовые истории на своей гитаре.\
          \  Это дело я очень уважаю и с удовольствием слушаю.  \n\nНо может быть дисков пока не буду покупать. :)\n\n\nMuddy"
