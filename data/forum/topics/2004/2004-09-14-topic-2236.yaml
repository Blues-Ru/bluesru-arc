        text: "можно ведь придти в БиБиКинг - и послушать выставленные там образцы, и выбрать что-то из них.\nНа мой вкус:\n\
          Ragtime - Troublemaker - очень сильный альбом. вопрос, насколько он блюзовый? но и блюз там имеет место. и по самым\
          \ высоким меркам - это очень сильная работа.\nModern Blues Band - отличная работа. причем, там есть и \"огрузиненная\"\
          \ Mojo, и белый блюз-рок, и не совсем архаичная акустика - и все очень интересно.\nBig Val - In My Kitchen - просто\
          \ великолепно. Если надоело слушать игранный-переигранный Hoochie Coochie - надо послушать его вариант - очень освежает.\n\
