              text: "Блюз - это музыка американского происходения, точнее негретянско-американского происходения.  Но ясно,\
                \ что эту музыку чувствуют не только американские негры.  Я считаю, что любой человек, который верно чувствует\
                \ блюз в своей душе потенциально способен его сыграть всерьез.  Такой же человек, есди еще одарен творческой\
                \ силой, также имеет возможность что-то создать оригинальное на основе блюза.  \n\nЯ пока очень плохо знаком\
                \ с Российским блюзом, и поэтому у меня пока нет мнения о стадии его развития.  Но казалось бы блюз в России\
                \ еще очень молодой, еще время есть для собственного развития.  Возьмите пример джаза.  Несмотря на наличие\
                \ многоих хороших музыкантов, европейский джаз долго оставался подражанием американского джаза (за важным\
                \ исключением Джанго и его коллег).  А сегодня некоторые считают, что евпропейцы уже обогнали Американцов\
                \ в создании могущих новых школ и направлений в джазе.  Европейский джаз созрел.  \n\nMuddy"
