          \ - на этом альбоме есть пара вещей, который я просто пропускаю - не для меня. А вот все остальное - очень мне по\
          \ сердцу. \n-----\nЕсли есть интерес к тому, что у нас тут происходит - все эти альбомы стоит послушать. Кроме того,\
          \ есть еще разные диски, на которых найдутся весьма достойные вещи. \nPS. мне до сих пор жаль, что не изданы записи\
          \ Blues Rhythm Section."
