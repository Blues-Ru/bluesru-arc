      text: "Я несколько раз читал на \"рус-блюз\" сайтах подобную формулу - все наши блюзмены, поющие стандарты по-английски,\
        \ - козлы в свой массе (ну это и так видно). Причина в том, что занимаются копированием, а не самобытным исполнением\
        \ по-русски. Формула красивая, но она бы казалась достоверной, если бы поткреплялась какими-то положительными примерами.\
        \ Все, что я слышал по-русски, либо просто кошмарно на уровне дет.сада (тоже не послушали Евдокимова), либо - серо\
        \ и ничем не отличается от миллионов представителей русского рока... Все эти доблесные сан-санычи-волгины совершенно\
        \ не впечатляют. \nОтказывать нашим в праве петь по-английски, означает искусственно закрыть огромный жанр в музыке\
        \ непонятно зачем. Можно еще запретить отечественным джазменам играть джаз, ибо это - чуждое для нас направление.\
        \ Ничего плохого в том, чтобы импровизировать, исполняя стандарты, на мой взгляд, нет. Просто нужно делать это хорошо\
        \ как и любое другое дело. Совершенно согласен с тем, что к большинству групп есть серьезные претензии. Для меня лично\
        \ достаточно наличия 2-3-х действительно хороших групп. Так, между прочим, происходит во всем мире. Говна везде навалом,\
        \ но не нужно его использовать в качестве доказательной базы для логических построений."
