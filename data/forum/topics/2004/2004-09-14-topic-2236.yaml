    text: 'Не по адресу обращаетесь. В этом форуме в основном подражатели и пародисты. Этакие "ряженые" одевающие широкополые
      шляпы (перья и стеклянные бусины в нос) для того, чтобы больше походить на негров с плантаций поющих блюз. Здесь общее
      мнение - что блюз может быть только на английском языке, и быть я-ля долина Миссисипи или на худой конец чикаго. Всякая
      национальная своеобразность - тут же освистывается и затаптывается ногами и перьями. Единственная национальная особенность
      - то, что блюз играется без учета партнеров. Ну, типа я играю гранд форте, и мне насрать что кто то в это время пытается
      еще и петь. Ну и понятно дело, что такое грув или там свинг почти никто не заморачивается. Что не говори, а родная "одесса"
      пролезет даже в хитах Хукера.

      Собственно этим и ограничивается "национальное своеобразие" блюза пропагандируемого в этом форуме.

      Есть ли блюз помимо "этой замечательной тусовки"? Да конечно есть. Многие и вполне серьезные музыканты пытаются (или
      пробовали) строить свое творчество на блюзовой основе. Называть их тут не буду - съедят :-Ж да, и это уже совсем другая
      история. Потому как мало. И еще меньше - понимающих. В основном, то что называется "русоблюз" - просто "провинциальная
      танцплощадка - белый танец". Этакие медляк закошенный под блюз исполняемый помятым гитареро для пяти поклониц. Тянутые
      струны и хрипатые голоса. И немеренные понты провинциальных "блюзменов" не удосужившихся хотя бы послушать передачу
      А. Евдокимова о блюзе, и потому все свои представления о "блюзе" берущих из небезизвестного мультфильма про собак и
      кошек.'
