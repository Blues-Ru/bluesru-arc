  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDSUB020402251829240505&sql=Ash4gtq4ztu4o\n\
    \nПо музыке и подбору блюзов это один из сильнейших альбомов Хопкинса. 11 песен\
    \ на 41 минуту. Он играет один, без группы. Вещи настолько сильны, что трудно\
    \ выбрать лучшие. Я бы выделил Sail On Little Girl Sail On, Goin To Dallas, Blues\
    \ In The Bottle, Catfish Blues. \n\nОценка 4 балла. По музыке все супер и пятерка,\
    \ но есть \"проблемы\". Гитара довольно сильно не строит, и это мешает. Стерео-разделение\
    \ \"голос слева\" - \"гитара справа\" может быстро достать; хочется сделать грамотный\
    \ моно-микс. И еще одно, гитара у Хопкинса не ахти и порой издает странные звуки\
    \ разломанной деки; это не очень приятно. На хорошем аппарате слышен весь кайф\
    \ записи, но слышны и эти проблемы со строем и звукоизвлечением. Любителям мп3\
    \ и глухим это не помешает..."
