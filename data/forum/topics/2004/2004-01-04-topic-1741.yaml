  text: "Друзья!\n Известное многим участникам форума кафе \"Scolder Blues\" на Старом\
    \ Арбате прекращает свою деятельность. Вместе с нашим зданием сносятся и несколько\
    \ соседних для постройки торгового центра, видимо очень неоюбходимого на Арбате.\n\
    \ Сегодня состоится последний концерт в этом клубе. Будет выступать группа \"\
    Scolder Blues\", а также приглашенные нами друзья - музыканты, выступавшие в этом\
    \ клубе.\n Хотим поблагодарить всех, кто в нем выступал и всех, кто бывал там\
    \ в качестве гостей. Огромное спасибо постоянно выступавшим у нас исполнителям:\
    \ Юрию Каверкину с коллективом \"Wrong Way Band\", Александру Братецкому и Валерию\
    \ Гелюте с группой \"Bottlenecks Boogie Band\", Дмитрию Казанцеву и Сергею Сорокину\
    \ с проектом \"Dr.Nick & John's Gang\" и многим другим (извините, что не упомянули\
    \ всех). Именно вы создавали полюбившуюся многим атмосферу и стиль заведения!\n\
    \ Кафе \"Scolder Blues\" обязательно продолжит свое существование в другом месте.\
    \ Сейчас подыскивается новое помещение. Надеемся, что это произойдет как можно\
    \ быстрее, когда это произойдет - обязательно сообщим. Ктати, если есть какие-то\
    \ предложения - с удовольствием рассмотрим различные варианты. Связаться с нами\
    \ можно по e-mail: scolderblues@yahoo.com\n Ждем всех сегодня в 20:00!"
