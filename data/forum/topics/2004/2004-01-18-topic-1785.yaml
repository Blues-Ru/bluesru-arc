  subject: «День издевательства над блюзом» (с)
  deleted: false
  text: "В воскресенье 18 января в «Би Би Кинге» звучал акустический «блюз» ;) в исполнении\
    \ Сергея Воронова и Гии Дзагнидзе. Местами блюзом назвать звучавшее язык не поворачивается,\
    \ но вот акустикой завсегда. «БиБиКинг» был переполнен. Полтора часа Сергей и\
    \ Гия отрывались по полной программе: звенели, как ансамбль народных инструментов,\
    \ шептали, как Боря Моисеев, вопили, как не знаю кто, и голосили, как Николай\
    \ Басков. Классика блюза сменялась отнюдь не блюзовыми стандартами, а то, что\
    \ было блюзом, звучало ну совсем не так, как к этому все привыкли, но было здорово\
    \ :) Праздник акустического раздолбайства или «день издевательства над блюзом»\
    \ (по С.Воронову) состоялся.\n     Отныне каждое воскресенье в «Би Би Кинге» будет\
    \ звучать акустическая музыка, и 25 января будет выступать Николай Садиков и кто-то\
    \ ещё. Кто именно – пока неизвестно. Следите за афишей! Ходите в «Би Би Кинг»!\
    \ :)))))"
