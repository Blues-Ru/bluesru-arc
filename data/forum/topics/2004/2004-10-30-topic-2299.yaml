      text: "Ну да. Есть еще рад тонкостей. \nСамые здоровые кабинеты - Маршала понтовые\
        \ для израдно поржавевшего металла - имеют огромные динамики. Ставят их штук\
        \ 7 на сцену - со сцены - сдувает, такое давление - а в зале (на стадионе)\
        \  - не слышно. Т.е. совсем. И это - большая радость для исполнителей, звукрежей\
        \ и слушателей. Поскольку - все довольны. Исполнителям - кайфово, звукрежи\
        \ - могут нормально отстроить звук в зале, слушатели - получают качественный\
        \ драйвовый саунд.\nНо увы - классические блюзовые комбы имеют маленький сопливый\
        \ динамик с бумажным диффузором и либо орет на весь зал без всякой подзвучки,\
        \ либо лампы в них насмерть убитые, и шнуры нераспаяные (а еще хуже - цветные\
        \ корейские которые хрустят при каждом движении на сцене) и звенят похабным\
        \ встроенным пружинным ревером от которого мутит как от советского общепита.\n\
        Но эта срань - именно ТОТ самый звук, который нужен. Тот самый, как у Мади\
        \ или Бади, у Эрика или там Хендрикса.\nНа записи иногда ставят 2 микрофона.\
        \ Один - спереди, под углом к динамику, длиже к краю. Там у тех квелых динамиков\
        \ что стоят в комбах, самые гадкие искажения, много второй гармоники, задавленный\
        \ низ и придушенные верха, короче - именно то что нужна чтобы эти высохшие\
        \ в доску гитары звучали хоть немного живо, а не просто как струны натянутые\
        \ на бревно. \nВторой - ставят сзади, метрах в полутора и притом качеством\
        \ - сильно выше основного микрофона. Типа \"воздух\" снимать. \nДа еще, \"\
        уважающие гитарный звук гитаристы\" ставят несколько комбов или кабинетов\
        \ одновременно. Типа - берем сустейн от фендера и атаку от МезаБуги. Все это\
        \ тщательно замешиваем, запутываем перекрестными проводами (усилитель от одного\
        \ работает на динамик от другого) и все. И к каждому - штуки по 4 миков, начиная\
        \ от тех через которые объявляют остановки в троллейбусах (именно они и дают\
        \ ту самую старую любимую гнусь и теплоту) и заканчивая широкомембранными\
        \ конденсаторниками типа B&K за 28 тыс баксов.\nПо моему - все это ерунда,\
        \ и ничуть не поможет, если играть не умеют. Все дело - в правильной постановке\
        \ рук, звукоизвлечении. Если постановка правильная - то и дешевый пар сын\
        \ Маршалла будет звучать как наикрутейшая фирма."
