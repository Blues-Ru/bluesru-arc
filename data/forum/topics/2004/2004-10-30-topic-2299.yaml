    text: 'Не буду говорить о процессорах, о примочках и пр. Скажу о настоящем гитарном
      звуке.


      Есть гитарист, есть гитара. Гитара подключается в гитарный усилитель (Fender,
      Marshall, Laney и пр.), к выходу усилителя подключается специальный гитарный
      динамик. Все это звучит на определенной громкости, для того что бы это записать,
      или усилить этот звук еще сильнее, к динамику под определенным углом и на определенном
      расстоянии ставится микрофон, который снимает звук.


      Так играет любой нормальный, уважающий гитарный звук гитарист.

      В данном случае в формировании звука играют следующие вещи:

      1. гитарист

      2. гитара

      3. гитарный усилитель

      4. гитарный динамик

      5. положение микрофона относительно динамика

      6. тип микрофона


      Это классика. Так играют все извесные гитаристы.'
