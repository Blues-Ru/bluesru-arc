  text: Как всегда,руководил парадом Док.Были все,кто бывает обычно.Док всегда умеет создать непринужденную обстановку,но в этот раз были Мишурис и давно пропавший пианист-бугивужник Денис Мажуков.Я помню его еще по давно почившей музыкальной телевизионной программе А.Видимо,он ушел в исполнение более попсовой музыки.Вот они-то помогли зажечь по полной программе с известнейшими хитами типа Rollover Beethoven.Главное,кажется,наконец-то появился очень приличный женский голос - некая Лена Иванова,если я ничего не перепутал,из Набережных Челнов.Это,на мой взгляд,второе,после Оксаны Ефремовой,явление,причем они разноплановые.В Лене поражает сила,чистота и непринужденность исполнения,без особого напряга.Дай бог чтобы это никуда не пропало дальше.
