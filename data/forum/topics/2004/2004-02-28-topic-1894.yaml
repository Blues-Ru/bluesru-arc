    text: 'Привычная располагающая обстановка. Приятные знакомые лица вокруг. Любимая музыка. Казалось, что ожидается джем – ОДИН ИЗ и не более. Но что-то с самого начала было необычное во всём происходящем. Наверное, неспроста, ведь это был последний jam-session зимы 2003-2004 гг.

      Как правильно <a href=” /blog/aaa/posts/294.aspx”>написал ААА</a> этот джем действительно был одним из лучших. Причём не только вудстоковских, а вообще. В памяти всплывают лишь два бибикинговских джема, сравнимые с четверговым вудстоковским по своей яркости и насыщенности: джем памяти Николая Ширяева с Доктором Аграновским 17 марта 2003 года и джем 4 октября 2001 года с Dr.Nick (это был тот единственный на моей памяти раз,  когда Роман Гегарт был с тамтамами, были John Сорокин, Blacky, VR, Dr. Agranovsky (!!!), Вовка Кожекин и многие-многие другие.

      В этот же раз подъехали Юрий Каверкиным с Филом Пагнотти, отыгравшие слот необычным составом (только гитара и ударные), были Михаил Мишурис с Вадимом Иващенко, Алексей Шачнев и редкий гость подобных мероприятий виртуозный пианист Денис Мажуков. Ещё до момента выхода на сцену Дениса Валерий Гелюта говорил: «Вот сейчас мы зах…м так, что мало, …, не покажется! Главное, чтоб сил хватило.» Как же всё у них гармонично получилось! И только спустя несколько минут меня осенило: они ведь вместе играли достаточно долгое время, записав в составе группы «Off Beat» 2 сильных альбома («Off Beat»-1995, и «That’s What I Am»-2001). Слот Мажукова - Мишуриса – Иващенко стал безусловно кульминацией вечера. А когда к ним присоединился вездесущий Валерий Гелюта, ну, просто кончились слова восхищения. Следующим необычным шагом был «обмен» инструментами Мажуковым и Гелютой (то бишь Гелюта – ф-но, Мажуков - гитара). Весь вечер на арене был незаменимый Саша Братецкий.

      Второй раз мне посчастливилось слушать выступление Алёны Ивановой. Полностью соглашусь с <a href=” /forum/?id=32866&page=0&body=1#32866”>Валентином</a>, что после Оксаны это первое действительно ЯВЛЕНИЕ с большой буквы: широкий вокальный  диапазон, вкус, чувство меры, лёгкость подачи – это всё Алёна. Очень хочется надеяться, что Алёна будет регулярно посещать джемы, а со временем сделает с ААА совместный проект. Может, в лице Алёны ААА всё-таки найдёт свою Ию Моцкобили, и, наконец, родится новый яркий творческий союз.'
