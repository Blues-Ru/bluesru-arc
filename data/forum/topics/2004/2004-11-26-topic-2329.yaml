    text: За великолепное выступление в МДМ 26 ноября.Идя туда,я вспоминая похожее выступление там Левана в 2001 году, очень
      опасался повторения - того,что плохой звук сгубит все.Тогда я ушел через 20 минут после начала.В этот раз поначалу мои
      опасения сначала сильно зашевелились - звук был неважнецкий,выступление вместе с джазовым коллективом было слегка любопытным
      и по звуку неудачным.Словесное выступление насчет совместного проекта было каким-то претенциозно напыщенным и откровенно
      скучным.Я уже было завял,но тут стал выступать сам Леван и настроение постепенно стало кардинально меняться.Да,Леван
      показал мне наглядно,насколько он вырос за эти 3 года.Мощный драйв,умение завести зал и самому зарядиться от него -
      это было прекрасно.Не скажу,что звук стал очень уж хорошим,но это уже не стало непреодолимой помехой для получения удовольствия.Явно
      работа в залах Америки пошла Левану на пользу,скажу,что в Москве очень редкое выступление проходит так ярко,особенно
      в МДМ.Ну и техника у Левана в общем,на весьма приличном уровне.Особенно впечатляет умение держать уровень исполнения
      в течени продолжительного времени.Так что я благодарю его от души и желаю так держать и стараться еще расти.
