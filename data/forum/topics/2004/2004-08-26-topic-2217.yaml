  text: 'Как заметили многие, блюз.ру слегка замер на лето. Связано это с разъездами, отсутствием времени и т.д. Времени действительно мало, есть отложенные материалы, до которых руки не доходят и пр., а тут еще надо и статью про Нотодден дописать ;) Одним словом, если у вас есть время, доступ в интернет и немного специализированных познаний, будем рады принять вашу помощь. Сейчас есть вот такие основные дела:

    1) Смастерить несколько статеек под стандарты блюз.ру. Тут нужны некоторые представления об html и умение его редактировать простым текстовым редактором.

    2) Андрей Цыганков больше года любезно модерировал раздел объявлений, сейчас у него нет на это времени, поэтому было бы здорово, если бы кто-то его сменил.

    3) Ну и есть вопросы по мелочи, которые откладываются бесконечно.

    Будем рады помощникам, заранее спасибо, пишите на мыло [адрес удален]!'
