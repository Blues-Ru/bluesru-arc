  text: 'После большого перерыва удалось-таки выбраться на джем. В этот раз его вели
    екатеринбургские «Блюзовые Доктора». Как видно, экспансия уральцев уже дала свои
    плоды, ибо вести джем в Би Би Кинге – это в некотором роде почётное право, свидетельствующее
    к тому же о заметном уровне группы и её «устойчивости при возможном кормовом ветре».


    Вообще, в Би Би Кинге много чего изменилось. Новый аппарат (я его ещё не слышал).
    Надо привыкать. Всё как-то стало иначе. Михаил «Петрович» Соколов за пультом –
    это сильно (А что, он теперь постоянно в качестве звукрежа?). Впрочем, старые
    звукачи, желающие лишь одного, - побыстрее свалить домой, - временами откровенно
    приводили в ужас.

    Состав джемующих заметно обновился,  молодые волки наступают на пятки старой гвардии.
    Приятно, что в российский блюз вливается молодая кровь. Главное, чтобы она не
    свернулась раньше времени.


    Уже традиционно порадовали Анатолий Таран (гитара, вокал) с сочным рокочущим вокалом
    и агрессивным инструментом, Егор Скороходов. Теперь к претендентам на ступень
    почёта заслуженно присоединилась Юля Смолянин. (где, кстати, нынче группа «USB»?).


    Стоит отметить также гитариста Алексея (?) Конькова и басистку Ольгу Шерстюк (сорри,
    если ошибся с именем). Очень достойные выступления. Девушек-басистов вообще можно
    по пальцам пересчитать. Навскидку, кроме Оксаны Кочубей (когда-то), и не припоминается
    никто, здесь же всё было на уровне: сочно, обильно и грамотно.


    Инесс была в своём традиционном амплуа, вызвала, тем не менее, активную поддержку
    слушателей. Юрий Каверкин, Вадим Иващенко, Владимир Русинов, Гурген Джангирян
    стабильно интересны и в представлении не нуждаются.'
