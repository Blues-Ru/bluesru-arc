  deleted: false
  text: '26 апреля (т.е. в понедельник) сего года в клубе "Ритм-энд-блюз кафе"

    случится крайне необычный концерт.

    На одной сцене сыграют David Kusworth вокалист и гитарист групп TV Eye, The Hawks, Dogs D''Amour, Jacobites" и The Tenderhooks
    и Дмитрий "Dr. Nick" Казанцев.

    Дэвид Касворт в музыке с 1977 года, он принял участие во многих проектах и считается одним из основателей стиля Love Rock.
    Его голос и гитару можно услышать на легендарном альбоме группы Dogs D''Amour - The State We''re In.

    Дмитрий Казанцев в представлениях, я думаю, не нуждается.

    Короче, то, что будет происходить завтра на сцене Ритм-энд-блюз кафе, надо услышать!


    Начало концерта в 20-30.

    Вход бесплатный.

    Будем очень рады всех видеть!'
