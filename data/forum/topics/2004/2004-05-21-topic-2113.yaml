    deleted: false
    text: 'Интересная система суждений господина Сергея Л., если её влёгкую так реконструировать. Не знаю насчёт блюзовых
      учебников, а вот инструкцию "Как писать злобные пасквили" из этой заметки экстрагировать можно запросто.

      1. Берём некий факт, который нам лично не нравится. Например, предыдущие приезды норвегов, и новый приезд.

      2. Начинаем усиленно думать о том, что лично мы можем выступать от имени и по поручению широких кругов возмущённых трудящихся,
      хотя выражаем своё собственное мнение. А заодно распределять артистов по сортам.

      3. Всё происходившее ранее припечатываем одним эпитетом - например "скучно".

      4. Исподволь проводим мысль, что норвеги не являются нормальными артистами, потому что учились "по учебникам" (интересно,
      как это?).  Соответственно, Норвегия - не страна вообще. Для создания эффекта пренебрежительной малости выстраиваем
      ряд "Болгария, Италия, Франция". Для противовеса - великая Америка. Читатель должен почувствовать разницу.

      5. Заодно пройдёмся по устроителями - вы чего такие бедные? Денег нету? Ну и не возите никого. Заодно и съэкономите.


      Резюме: типичный образец мизантропии в стиле "Сделайте мне красиво".'
