    text: 'Привожу я. А откуда представления про второй и третий сорт, вы на какой-нибудь концерт Норвежских музыкантов ходили?
      А на Бадди Гая?

      А были ли вы на первосортном Примиче в январе?

      А знаете сколько стоит привоз Бадди Гая?'
    replies:
    - id: 18523
      parent_id: 18519
      date: 2004-05-21 22:27
      poster: Федор Романенко (fedor)
      email: fedor@blues.ru
      subject: Подробнее про мои мотивы
      deleted: false
      text: "Напишу подробнее, не дожидаясь ответов на мои вопросы. Предполагаю, что ответ был бы \"нет, нет, нет и нет\"\
        , хотя могу ошибаться. Если вы написали таким образом о гастрольном вопросе, я предполагаю, что помимо эмоционального\
        \ посыла вы исходили из серии имеющихся заблуждений. Я задал эти вопросы, чтобы прояснить их наличие. Соответственно,\
        \ моя задача состоит не в том, чтобы ругаться в ответ, а в том, чтобы попробовать их развеять.\n\nЗаблуждение: Норвежские\
        \ блюзмены - второго или третьего сорта, ибо они не из Америки. Среда определяет качество исполнения.\n\nНу что можно\
        \ сказать, я уже успел насмотреться на разных блюзовых музыкантов, как из Америки, так и из Европы. Съездил на 7 очень\
        \ крупных блюзовых фестивалей (последний раз – неделю назад), еще один даже организовывал, старался не пропускать\
        \ ни одного блюзового концерта в Москве. За это время отслушал, скажем, около 50-70 групп. В том числе и большую часть\
        \ нынешних концертирующих хедлайнеров мирового уровня (из Америки), включая 2 раза Бадди Гая и три раза Шемекию. Так\
        \ что была возможность сравнить то, что можно услышать вживую сегодня, включая звезд и менее именитых исполнителей.\
        \ (А Мадди Уотерз, увы, уже не выступает). Общее впечатление такое – везде дерьма навалом, в Норвегии есть куча плохих\
        \ групп, в Америке – еще больше плохих групп, в России, в Германии и пр. Есть очень много именитого дерьма. Все хорошее\
        \ держится на отдельных людях с талантом на грани гениальности и горящими от любви к музыке глазами. Все они живут\
        \ в разных странах. Эти люди составляют первый интернациональный эшелон, за ним идет второй – нормальные группы, но\
        \ уже не такие интересные. Если по географии, то в Америке сегодня, скажем, групп первого уровня 20, в Норвегии –\
        \ 4-5, в Швеции – 3, в Финляндии – 0, в Англии – 3-4, в Германии – пара, в Италии – 2 и пр. При этом эти группы абсолютно\
        \ сравнимы между собой как по интересности концертных выступлений, так и по качеству вообще. Все держится на личном\
        \ факторе, а не на национальной принадлежности. Группы из Америки, как правило, просят больше денег, ибо очень много\
        \ людей на свете подвержены заблуждению N1. Черные парни стоят дороже белых из-за другого заблуждения. Буквально неделю\
        \ назад обсуждал этот факт с менеджером Отиса Раша, Билли Боя Арнольда и Джуниора Вотсона (это я чтобы придать больше\
        \ веса своим словам ;). \n\nС Норвегией у нас по историческим причинам очень хорошие связи. Кроме того, это – наиболее\
        \ развитая по части блюза Европейская страна. Поэтому мы привезли оттуда несколько групп. Кид Андерсен – 4-й по счету,\
        \ и уверяю вас, что я не собираюсь везти в Москву 5-ю, но уже плохую группу только потому, что она из Норвегии.\n\n\
        Я не хочу сказать, что, скажем, Эйрик Бергене Бенд, - классик блюза, Боже упаси, он сам так никогда считать не будет\
        \ ;). Но быть классиком и играть интересную музыку на концерте – две разные вещи. Для меня есть любимые американские\
        \ музыканты, которые, разумеется, посерьезнее и поинтереснее Эйрика или Бюска, например. Но они все в одной лиге,\
        \ их можно сравнивать. В Америке с блюзом лучше дело, но это не означает, что дистанция с той же Норвегией – непреодолимая.\
        \ Не надо мерять для проверки этого факта «провинциальный = неамериканский» уровень блюза по московскому, вот тут\
        \ дистанция - действительно аховая.\n\nСкажем, я был два раза на концертах Бадди Гая, который повлиял на огромное\
        \ количество музыкантов, один концерт был весьма хорошим, но не самым ярким выступлением на фестивале, другой - просто\
        \ плохим. А также был на трех концертах Амунда Морюда из Осло в разное время, все три концерта были потрясающими.\
        \ Гонорар за приезд Бадди Гая в Москву на выходные – примерно 12000$. Плюс 10000$ расходов. За эти деньги я бы мог\
        \ привезти Морюда, скажем, 8 раз ;) Итак, как правильно поступить на моем месте?\n\nВсе, что нами делается, делается\
        \ на собственную зарплату, а также благодаря наличию энтузиазма у музыкантов и отсутствие алчности. Это – не бизнес.\
        \ Так что мы уж сами решим, на что тратить деньги и время. А тем, кто был на одном из этих концертов, в голову не\
        \ придет мысль «раз нет денег на американцев, так не надо уж вообще».\n\nДругой интересный фактор – привезем мы американского\
        \ музыканта, потратим кучу денег, а вы на него не придете. Вот почему я спросил про Примича. Есть яркие тому примеры.\
        \ Другая неприятность, заплатишь американцу кучу денег, а он сыграет никакой концерт... Это - жизнь, мне просто кажется,\
        \ что у меня было больше шансов более адекватно ее оценить по части концертного блюза..."
