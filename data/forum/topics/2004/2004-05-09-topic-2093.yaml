  text: 'Очень гармоничный сбалансированный альбом классических блюзовых произведений с хорошим, действительно качественным звуком. Из отечественных пластинок по звучанию, сыгранности и драйву сравнима, пожалуй, лишь Crossroadz «Salado». В записи приняла активное участие духовая Scolder-секция, на паре треков засветилась в качестве бэк-вокалистки Мариам, а на одном Сергей Воронов (вокал, акустическая гитара) и Михаил Соколов (харп). Прикольная интерпретация бессмертного «Got My Mojo Working» с кларнетом Ираклия Калмахелидзе, который исполняет соло в грузинских тонах и  динамичным, практически джазовым Roland’ом  Евгения Ревнюка, что, лично мне очень импонирует. Вообще клавишные легки, ненавязчивы, но, в то же время, отвечающие в общем достаточно тяжёлой блюзовой эстетике Гии Дзагнидзе. Единственная авторская вещь Гии под «скромным» названием «Boogie», может быть, излишне запильна, но несколько Roland’овских glissando в финале всё компенсируют. Приятны и легки сладкие приджазованные «Don’t Let Me Be Lonely Tonight» James Taylor и «Nobody Knows You When You’re Down and Out» Jimmy Cox. А вот «Stormy Monday Blues», имхо, излишне затянута.


    Однако, обилие в этой рецензии производных от слова «джаз» отнюдь не значит, что пластинка не блюзовая. Наоборот, она истинно блюзовая, но сдобренная хорошей порцией джазового вкуса, что придаёт лёгкости, а иногда необычности оттенков привычному звучанию хорошо всем известным вещам.'
