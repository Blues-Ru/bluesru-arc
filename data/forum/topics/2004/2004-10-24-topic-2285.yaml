  text: "Как мы уже объявили, на неделе будет три концерта Арсена Шомахова с Регтаймом. У них в очередной раз обновилась программа. Большая личная просьба ко всем патриотам нашего блюза придти поддержать. ;) Ибо специально отслушивать Арсена на эти концерты приедет президент Blues Leaf Джо Морабиа. Сейчас обсуждается вопрос о том, чтобы выпустить третью пластинку на этом довольно серьезном американском лейбле, а также, возможно, переиздать более ранние вещи. Для Арсена, разумеется, это - много значит. Чем больше людей придет, тем веселее будет концерт. \nВ среду, 27-го в Форте мы позвали Вову Демьянова немного поджемовать с Регтаймом, будет забой на две гитары. В среду Джо (и я ;) будем на концерте точно.\nЕсли кто-то собирался послушать Регтайм на этот раз, лучше не откладывать до фестиваля в воскресенье, ибо там будут короткие выступления минут по 30-45...\nВсем спасибо!!! ;)"
