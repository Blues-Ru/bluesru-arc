  deleted: false
  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70401311743191310&sql=Arekvikk6bb39


    Британский блюз, блюз-рок, хард-блюз, психоделия и фолк-рок. Всё это есть на этом
    альбоме Элвина Ли и Ко. Пожалуй, это лучший альбом группы. 8 отличных композиций
    с явным акцентом на блюзовую музыку и импровизации. Местами чуть тяжеловато, но
    в 1970 году это было нормой.


    Оценка 4 балла. Все очень хорошо, но слишком серьезно и даже мрачновато. Кому-то
    именно это нравится в большинстве британских групп, но мы-то знаем, что блюз -
    это еще и юмор с иронией. Альбом довольно ровный, но хочется отдельно выделить
    прекрасные композиции Love Like A Man и Circles. Альбом понравится тем, кого не
    пугает тяжелый рок и психоделия 60-х.'
