  text: 'Для тех, кому это важно, есть повод собраться в БиБиКинге: музыку послушать, посмотреть видео-записи концертов SRV
    на большом экране, самим поиграть.

    З октября исполняется 50 лет со дня рождения Stevie Ray Vaughan. В этот день клуб "БиБиКинг" приглашает московских любителей
    блюза на специальную программу. Будут звучать записи SRV, будет концерт и джем на воэновские темы.

    Хауз-бэндом выступит Володя Русинов и Louisiana Jumpin'' Cats. Подъедут и Blues Doctors (правда, если успеют на поезд).

    Программа от 19.оо - и до полуночи.'
