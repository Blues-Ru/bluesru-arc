    text: 'Хотелось бы добавить от себя по поводу "качества исполнения". Я первый раз услышал ребят где то пару лет назад на блюзовой вечеринке в одном Минском клубе. Похоже это был их первый более-менее массовый концерт. Так вот, феномен этих Svet & Al не столько "музыкально-профессиональный" (они и по образованию, и по основному месту работы, далеки от музыки), сколько "культурологический". Они уникальны не тем, КАК они играют, а тем ЧТО!!! Ведь и в Польше они поразили жюри именно ЭТИМ. А ведь надо учесть, что "выросли" они не в богатой клубной жизнью европе, и даже не в Москве, а в Минске, где блюзовые вечеринки проходят раз в два месяца, и хватит пальцев одной руки, что бы перечислить ВСЕ минские блюзовые банды, а специализированного хотя бы "приблюзованного" клуба нет и никогда небыло! И вот в таких условиях появляются "бойцы", которые фанатично продвигают музыку, которая даже среди любителей "нормальной" музыки особой популярностью не пользуется. И надо заметить, что в этом деле они преуспели...

      Теперь собственно о "качестве исполнения". На том первом концерте ребята играли... мягко говоря "неуверенно", но уже через пару месяцев, на той же сцене, они попытались устроить перфоманс "а-ля дикий запад", а еще через год взяли Гран-При в Польше. Я это к чему - ребята растут, и растут ОЧ-Ч-Ч-ЧЕНЬ быстро, и то, КАК они играют сейчас не идет не в какое сравнение с тем, как они играли 2года назад, и думается они не собираются останавливатся на достигнутом! А НУ ВСЕ ЖИВОМ ЗА БИЛЕТАМИ!!!!!!  :)))))))'
