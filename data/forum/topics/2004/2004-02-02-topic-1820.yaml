  text: "Каждый концерт видного российского ex-bluesman’а, а ныне фанкера Николая Арутюнова всегда превращается в яркое шоу.\
    \ Cолнце, море, пальмы, хорошее настроение – всем этим пропитан фанк в его исполнении. Мгновенно забывается слякотная\
    \ скользкая Москва, а отпуск на берегу какого-нибудь тёплого моря становится реальностью.\n\tКлассический рваный фанковский\
    \ ритмический рисунок, «квакающие» электрогитару и клавиши, а также резко-пронзительный звук тенор-саксофона обеспечивает\
    \ Николаю группа «Funk You», созданная бас-гитаристом Романом Гринёвым ещё в 1999 году, а с 2003 года работающая в тандеме\
    \ с Арутюновым. Кроме этого, в коллективе есть 2 замечательные бэк-вокалистки, составляющие вместе с Николаем красивое\
    \ вокальное трио."
