    text: Предчувствия самые радужные... Считаю, что после пластинки с B.B. у Эрика начался новый творческий подъем. И Рептилию, и особенно One More Car, One More Rider оцениваю ОЧЕНЬ высоко. Действительно, в обработке чужих вещей Эрику НЕТ равных. А если это 100% блюзовые боевики - то ваще туши свет!!! Конечно, кто то ставит Клаптону в вину и откровенное небрезгование галимой попсой вроде Пилигримма, и то что "как сыр в масле" (хотя я бы поостерегся так заявлять. По моему жизнь Клаптона как раз один сплошной Блюз. Ну а то что бабла настриг немеренно - ну так а кто сказал, что музыкант должен быть голодным? По моему такие заявы уже не актуальны...), и ваще "белый". НО!!! Думаю никто не станет спорить с тем, что как музыкант в целом, и гитарист в частности - Клэптон ВЕЛИЧИНА! Да, он играет на дорогих (и настроенных) гитарах, и вообще "знает ноты" :) но лично я уже прошел тот период, когда выбирал гитаристов по цвету кожи. Вобщем, я буду первым :) кто купит эту пластинку!!!
