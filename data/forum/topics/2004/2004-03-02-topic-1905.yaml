  subject: Кажись март будет блюзовым месяцем
  deleted: false
  text: "И еще одних проперло на блюз....\nНе прошло и года с тех пор, как группа\
    \ Aerosmith начала работать над своим новым, блюзовым альбомом. И вот дата релиза\
    \ диска \"Honkin' on Bobo\" назначена \"Columbia\" на 30 марта 2004 года.\nБольшая\
    \ часть альбома записана в домашних студийях музыкантов. основной массив - на\
    \ студии гитариста Джо Перри (Joe Perry), некоторые треки - у вокалиста Стивена\
    \ Тайлера (Steven Tyler), а сведение было сделано на студии группы в Бостоне.\
    \ Продюсированием занимались Перри и Тайлер, с помощью Джека Дугласа (Jack Douglas),\
    \ который работал над классическими релизами Aerosmith \"Toys in the Attic\" (1975)\
    \ и \"Rocks\" (1976). Марти Фридрексен (Marti Frederiksen), который продюсировал\
    \ релиз 2001 года \"Just Push Play\" и работает с такими разными музыкантами как\
    \ Джонни Лэнг (Jonny Lang), Эминем (Eminem) и Пинк (Pink), был приглашен для дополнительного\
    \ продюсирования.\n\nСреди 12 треков нового альбома есть одна новая композиция\
    \ Aerosmith \"The Grind\". Остальное - кавер-версии несомненных блюзовых хитов.\
    \ Мадди Уотерс (Muddy Waters) \"I'm Ready\", Литтл Уолтер (Little Walter) \"Temperature\"\
    , Биг Джо Уилльямс (Big Joe Williams) \"Baby Please Don't Go\", Сонни Бой Уилльямсон\
    \ (Sonny Boy Williamson) \"Eyesight to the Blind\", Миссиссиппи Фред Макдауэлл\
    \ (Mississippi Fred McDowell) \"You Got To Move\", Бо Диддли (Bo Diddley) \"Road\
    \ Runner\", Fleetwood Mac \"Stop Messin' Around\" - неполный список перепетых\
    \ группой классических композиций. \n\nОднако группа предупреждает, что воспринимать\
    \ их альбом как уход в блюзовую традицию было бы абсолютно неверно. \"Мы не записывали\
    \ блюзовый альбом, мы записывали альбом Aerosmith, - цитирует Тайлера Badger Herald.\
    \ - Все, что когда-нибудь делали Aerosmith вдохновлено блюзом. В этот раз мы просто\
    \ вынесли это влияние ближе к поврхности\".\n\nПолный трек-лист альбома \"Honkin'\
    \ on Bobo\" опубликован на сайте Aerosmith:\n1 Road Runner \n2 Shame, Shame, Shame\
    \ \n3 Eyesight To The Blind \n4 Baby, Please Don't Go \n5 Never Loved A Girl \n\
    6 Back Back Train \n7 You Gotta Move \n8 The Grind \n9 I'm Ready \n10 Temperature\
    \ \n11 Stop Messin' Around\n12 Jesus Is On The Main Line"
