    text: "Вроде бы и хочется похвалить:\"Ну вот наконец и прикоснулись к настоящей музыке, а с другой -нафиг вам неймется....играли бы себе добротный, раскрученный рочок\". Почти все вещи записаны в каком-то бешенном ритме и порой казалось, что музыкантам хотелось все это побыстрому записать.... и дело с концом. Понравились 2-3 вещи, да в основном собственного или около изготовления. Первая заводная Road Runner (McDaniel)- хороша,но когда оказалось что и почти все в таком же ритме...это перебор.The Grind (Frederiksen/Perry/Tyler)-вот настоящая качественная аеросмитовская вещь (чувственый вокал Tyler и конечно же гитара Perry)Да и последняя Jesus Is on the Main Line (traditional)- вроде бы даже очень очень (хороший вокал Tracy Bonham),но какая-то недоделанная. Остальные классические блюзовые вещи по-мойму очень перегруженны скрипучим Tyler-овским вокалом и запилами Perry. Но все таки радует, что такие роковые ортодоксы, хотя и на старости лет, а  заиграли хорошую музыку. \nДа кстати, я не апологет \"чистоты жанра\"....."
