  deleted: false
  text: "Альбом представляет собой 12 классических блюзовых вещей в оригинальном исполнении Steven Tyler & Company. Стилистика Aerosmith с первых же нот определяет конву дальнейшего развития событий. Понятно, что будет звучать хорошо приблюзованный рок. Заметна старательность группы в исполнении инструментальных партий. Ясно, что в стандартном репертуаре Aerosmith ни одной из представленных на альбоме нет. Тем не менее альбом удался. Аккуратненько так получилась «Road Runner», заводной шаффл «Shame, shame, shame», совсем по-блюзовому звучат «Eyesight To The Blind», «Temperature» и «Stop Messin’ Around». А вот «Baby, Please Don’t Go» сыграна, пожалуй, раз в несколько быстрее оригинального исполнения, что вряд ли можно назвать находкой.\nИнтересно как бы в исполнении Тайлера звучал акустический блюз. Какие-то попытки делаются на «Jesus Is On The Mainline» (хор), но не слишком, на мой взгляд, удачно, и в первой трети «Back Back Train», где в итоге всё равно всё скатывается в электричество. И это зря. \n\nА вот на пианино с Aerosmith играл легендарный Johnnie Johnson. \n\nНо главное, конечно, во всём этом «безобразии» - бесподобный вокал Тайлера, наложенный на блюз. Супер! Истеричность попадает в резонанс с ритм-н-блюзовой ритмикой (как, например, в «I’m Ready») и получается просто нечто.\n\nИтого: рекомендуется к прослушивания любителям блюза и рока, за исключением апологетов той самой пресловутой «чистоты жанров» ;)"
