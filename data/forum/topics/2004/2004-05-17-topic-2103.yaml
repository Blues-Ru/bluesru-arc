  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70311210457390546&sql=Agzp1z81ajyv1


    Сборник, составленный из вещей с 4-х сессий Джонни, записанных на Rounder Records,
    соответственно меняется и состав группы. Гармоника, сакс, клавишные и другие инструменты
    то появляются на некоторых композициях, то исчезают. И при том, что это сборник,
    - пожалуй, самый скучный из имеющихся у меня альбомов Коупленда. Все вещи авторства
    самого Джонни за исключением «Claim Jumper», написанного в соавторстве с Rick
    Lovejoy, и «Ngote» пера T.P.Polyrhythmo


    Инструментальная «Copeland Special» начинается очень похоже на «Mary had a little
    lamb», но не следует такого просящегося развития. «Сlaim Jumper» - энергичный
    лёгкий быстрый шаффл с большим количеством медных дудок и узнаваемым вокалом Коупленда.
    Красива неторопливая сочная раскачивающаяся «Cold Outside». Ещё есть хорошие вещицы
    под лаконичным названием «Houston» и почти бигбендовская «Excuses» со звонкими
    клавишами и с местами чересчур вкусной духовой секцией.

    Трек #13 – длиннющая (больше 8 минут) затянутая инструменталка «Ngote» с нестандартной
    для Коупленда ритмикой. Завершают пластинку «Kasavubu» и  ещё одна инструменталка
    «Abidjan» с большим количеством трещоток, колотушек.


    В результате имеем сборник с неплохой серединой и достаточно скучными началом
    и концом. Вряд ли эту пластинку можно считать срезом всего творчества Коупленда.
    Почему она такая получилась – непонятно, но вот такой уж он «Texas Twister» Johnny
    Clyde Copeland.'
