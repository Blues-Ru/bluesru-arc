  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDCASS80401191750041280&sql=A1z8j1vgjzzza\n\nPrestige/Bluesville 1003\n\nWillie Dixon - vocal & bass; Memphis Slim - piano; Wally Richardson - guitar; Al Ashby - tenor sax, Gus Johnson - drums.\n\nДебютный лонгплэй Диксона записан не на Чессе, но на Престиже! Альбом записан самим Руди Ван Хелдером, и звук на диске просто восхитительный для 1959 года. Все настолько качественно и \"чисто\", что есть ощущение джазовой пластинки. Ритм-секция и саксофонист только добавляют джаза в это ощущение. \n\nДиксон - прекрасный композитор и текстовик, он неплохой басист и приличный продюсер, но вот его пение оставляет желать лучшего. Такое впечатление, что он просто отрабатывает около микрофона; он него не идет никакой энергии. Другой минус альбома - это небольшое количество глубоких вдумчивых блюзов, слишком много легких песенок в темпе (мы знаем, что Слим любит это). Не хватает чувств и эмоций, нет ощущения дрожи и экстаза. Такое впечатление порой, что они записали демо-треки для какого-то певца.\n\nОценка 3 балла. Альбом легко слушается, но не оставляет глубокого следа в душе. Хорошая запись - самый большой плюс этого диска."
