  deleted: false
  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDSUB040401130242073209&sql=Amkxvadzki8w8\n\nОдин из лучших дисков Дэвиса! Тут ему уже 65, но он бодр и музыкален. 12 песен аж на 45 минут. Запись сделана в августе 1961 года для Prestige/Bluesville Records. Здесь блюз, фолк, госпел, регтайм. Отличная игра на акустике, мощный вокал, преимущественно религиозные темы. \n\nДиск начинается с известнейшей You Gotta Move; Дэвис отлично ее исполняет! Есть и другие изюминки: I'm Glad I'm In That Number, There's A Bright Side Somewhere, A Little More Faith. Надо отметить прекрасный звук на альбоме; инженер - сам Руди Ван Гелдер! Оценка 5 баллов. Одна из немногих номерных пластинок Гари 60-х, она доставит удовольствие всем любителям кантри-блюза и фолка."
