  text: "www.gazeta.ru сообщает сегодня в 10:43:\n \nНайдены раритетные музыкальные инструменты, похищенные у Национального академического оркестра России имени Осипова. Пять раритетных контрабас-балалаек (!!!) украдены у коллектива, когда он находился на гастролях в Самаре. \n\nПо данным пресс-атташе Всероссийского музыкального общества Эльмира Джафарова, оркестр прибыл в Самару поздно вечером 3 октября, после чего был размещен в местной гостинице. Фура с необходимым для концерта реквизитом осталась неподалеку. Наутро, когда решили ее разгрузить, обнаружили взлом. \n\n«В ходе расследования следственная группа задержала одного из мафиозных авторитетов, в подвале дома которого и были найдены похищенные контрабас-балалайки. Подробности следствия пока держатся в тайне», – отметила пресс-атташе. //РИА «Новости»\n\nНе, ну прикиньте, пацаны, эти пять контрабас-балалаек в подвале у авторитета, и братва на них лабает... ох, душееевно-то как... Всё-ж таки тяга русского народа к музыке непокобелима!"
