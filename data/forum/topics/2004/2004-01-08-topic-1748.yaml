  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70401071913372086&sql=Aryazqj5uojha\n\
    \nНе надо смеяться над его почти славянской фамилией и забавной физиономией. Гари\
    \ родился в Чикаго и впитал всё лучшее из американской музыки. Он умело и приятно\
    \ поет, классно играет на гармошке, иногда цитируя своих кумиров и учителей, он\
    \ писшет отличные песни, в конце концов. Поет он спокойно, без пафоса, СВОИМ ОБЫЧНЫМ\
    \ голосом, но именно так, на мой взгляд, надо петь ВСЮ корневую музыку. Пафос\
    \ и \"школа\" неуместны в блюзе и фолке. На гармошке Примич играет очень стильно,\
    \ точно, МАЛО (о, это ВЕЛИКОЕ умение!), с правильным сочным звуком. Его стиль\
    \ - сочетание всего лучшего от Сонни Боя до современных мастеров харпа. Его музыка\
    \ полна хорошего вкуса и ПОНИМАНИЯ современной ситуации в блюзе. Никаких запилов\
    \ и ненужных соло; все сосредоточено на драйве, классных мелодиях, грамотных композициях\
    \ и ПРАВИЛЬНЫХ звуках. Это большое умение и мастерство. \n\nНа альбоме аж 12 песен,\
    \ но альбом не длинный - 46 минут. Гари играет по блюзу, но ВСЕ песни абсолютно\
    \ разные по ритмике и груву. Так умеют немногие. Его голос обычен и приятен; сразу\
    \ вспоминается его старший коллега и земляк Масселуайт, он тоже никогда не выпендривался.\
    \ Может быть Гари не хватает харизмы певца и звездности Джуниора Уэллса, но такие\
    \ люди рождаются не часто, и не стоит его винить в этом.\n\nОценка 4 балла! Все\
    \ очень хорошо! Гари молод для блюза, но в нем МОРЕ вкуса! Как звучит оргАн, гитары,\
    \ гармошки! Нет резких и дурацких звуков, музыка льется в удовольствие. Да, ему\
    \ не хватает истерики и боли, но это придет (или не придет) и тогда он станет\
    \ рядом с великими. Альбом обязателен для российских блюзменов и их поклонников.\
    \ Гари - еще один представитель ПРАВИЛЬНОГО блюза из Чикаго."
