  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDCASS80402020325513096&sql=Av2ja7ip8g7dr


    Очень странный и слабый дебют Янга записан на фирме Делмарк. Всего 7 треков, два
    из них очень длинные (9 и 11 минут), грязная и грубая запись, кривая игра музыкантов,
    однообразие. Это не похоже на 70-е годы и на Майти Джо. Очень неубедительно звучит
    духовая секция из двух инструментов; такое впечатление, что музыканты репетировали,
    а их случайно записали. Живость этого диска - огромный минус для самой музыки.
    Оценка 3 балла. Можно выделить лишь третий трек Every Man Needs A Woman и хороший
    вокал Джо на всей пластинке. Кажется, что Янг и Ко. просто напросто были не готовы
    к записи альбома.'
