  text: "Петрович благородно борется с бездомными собаками: берет их к себе домой. Всего уже четыре у него дома, плюс кошки. Но сейчас не о кошках. В результате собачьей свадьбы образовалось большое количество милых щенков, определенно блюзовых. Щенки раздаются в хорошие руки. \nЗвонить 202 1844, спрашивать Михаила Петровича.\nСмотреть товар лицом тут: <a href=\"/bluesnews/04Winter/puppy.htm\">http://blues.ru/bluesnews/04Winter/puppy.htm</a>"
