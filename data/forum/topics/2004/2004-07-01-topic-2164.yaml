    text: "Не советовал бы ,наверное, вслед за этим альбомом слушать \"Missisippi to Mali\" и \"Downhome Sophisticate\".\n\
      На первом, рядом с традиционщиной, блюзы с африканскими инструментами - не совсем привычно.\nНа втором, опять, рядом\
      \ с традиционными блюзами звучит все, что угодно - рэп, латиноамериканская музыка, да и \nэлектрогитара, мне кажется,\
      \ не для него, звучит странно.\nСоветую \"Vu-Du Menz\" -  великолепный альбом; дуэт с отличным пианистом Henry Butler\
      \ - просто Leroy Carr и Scrapper Blackwell :)."
