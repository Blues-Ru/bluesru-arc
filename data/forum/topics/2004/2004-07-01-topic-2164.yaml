      deleted: false
      text: Очень рекомендую диск "Fish Ain't Bitin'". Меня этот альбом сразил просто наповал. Фантастический дельта-блюз
        с духовыми... На мой вкус - лучший Харрисовский альбом и вообще один из лучших альбомов акустического блюза. И по
        мне Харрис - из молодого поколения блюзменов самый суперский чувак!! Вокал обалденный, аж до мурашек. А класс его
        игры на гитаре подтверждается тем, что его часто приглашают другие известные блюзовые музыканты для записи своих альбомов.
        Например, прослушай Junior Wells "Come On In This House".
