    text: "\"Не в форме\"? да нет. Бывало и хуже. Тут он хоть сам ходил. :-Ж\nА от\
      \ второй части - сплошная радость. Пришло новое поколение музыкантов блюза.\
      \ И Свет с Алом, и Братецкий и Иван - устроили удивительно качественный сейшн,\
      \ и в общем то порадовали прежде всего тем, что в отличие от музыкантов предыдущего\
      \ поколения - хотя бы поняли что такое блюз. \nИграли блюз \"до Muddy Waters\"\
      \ хотя и довольно современно. Что и понравилось. Играли легко и раскаченно.\
      \ Очень чистая игра слайдом. Хороший фронтмен и неплохой пианист. Совершенно\
      \ не пожалел что выбрался из своей норы."
