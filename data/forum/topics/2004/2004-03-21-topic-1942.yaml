  subject: '19.03.04: Сан Саныч Волгин и «Svet & Al Boogie Band» в театре «Поиск предмета»'
  deleted: false
  text: "Пребывающий в эти дни в Москве минский коллектив «Svet & Al Boogie Band»\
    \ в пятницу дал концерт в театре «Поиск предмета». \n    Но первым отделением\
    \ мероприятия  стало выступление уже ставшего легендарным Сан Саныча Волгина.\
    \ Мне никогда до этого случая не приходилось видеть его вживую, только в записи.\
    \ Наконец то это случилось. Сан Саныч оказался субтильного вида молодым человеком\
    \ со светлыми спутанными кудряшками сальных волос чуть ниже ушей. В пятницу он\
    \ был сильно «не в форме». Видно, что-то не сложилось. Но даже от тех реплик,\
    \ на которые он был способен, от тех звукам, что извлекал он из гитары, зал притих.\
    \ Он произнёс: «Я - это блюз!» И это было действительно так. Он сказал правду.\
    \ Ему даже не пришлось петь. Всё было ясно и так. Как выяснилось, ясно не всем.\
    \ Наверное, есть какие-то искры, какое-то свечение, которое заметно не всем. Это,\
    \ видимо, просто разное устройство мозга, завитки извилин закручены по-разному.\
    \ Вот только жаль, что музицирование не сложилось..\n    После небольшого технического\
    \ перерыва на сцену вышли минчане. Для меня это тоже была премьера. Их выступление\
    \ на стадионе «Динамо» в сентябре прошлого года – не в счёт. Удивительные ребята!\
    \ Сложно себе представить откуда у них такое чувство стиля, такое ощущение того,\
    \ что и как нужно играть. При этом все четверо играют абсолютно без изысков, у\
    \ них нет какой-то особой виртуозности. Они просто живут в этом. И ведь это акустика,\
    \ то есть всё на виду. Тут не спрячешься за электрические грохот и визг. Иногда\
    \ кажется, что временами они даже стесняются вот этой своей растворённости в стиле,\
    \ в этой, в общем, чуждой нам музыке. Но это ощущение мимолётно. Оно очень быстро\
    \ проходит. Проходит, когда их слушаешь. Наверное, пройдёт и вообще. У них ещё\
    \ всё впереди. Главное – не мешать им.\n     В качестве гостей на сцену по очереди\
    \ и одновременно выходили Алексей Барышев из владимирского «Blackmailers», Саша\
    \ Братецкий, Ваня Жук, а также Рома Гегарт."
