    text: "А что в этих джемах каждый может участие принять?\nПомнится в 2000 году в конце марта я участвовал в конкурсе блюзовой гитары \"Fender Party\". Я исполнял там вместе с \"Crossroads\" песню Чака Берри \"Johnny B. Goode\", а потом еще и блюз Джими Хендрикса \"Red House\". Я там даже первый приз получил- гитару \"Stratocaster\". \n Я к интернету недавно подключился, поэтому не особенно в курсе что там происходит."
