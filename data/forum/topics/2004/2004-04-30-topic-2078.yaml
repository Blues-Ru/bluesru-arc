  subject: 28.04.04, открытый джем с группой «X-Roadz» в Би Би Кинге
  deleted: false
  text: "При большом стечении всяческого музыкального народа в Би Би Кинге случился в прошедшую среду открытый джем с группой «X-Roadz». В последнее время наблюдается некоторый спад интереса народонаселения к джемам как таковым, видимо, в значительной части из-за их количества по Москве. Ещё пару лет назад по средам в Би Би Кинге всегда был аншлаг, сейчас же зачастую происходит в некотором роде распыление сил. В эту среду народу в московском доме блюза собралось действительно много, потому как событие само по себе неординарное, ибо с некоторых пор группа джемы не ведёт. \n\nПомимо завсегдатаев джемов, своим вниманием почтили Би Би Кинг А.Евдокимов, А.Аграновский, В.Гелюта, Г.Дзагнидзе и некоторые другие.\n\nКак и любой джем, этот отличался разнообразием качественного состава. Отмечу лишь тех, кто явно понравился или явно не понравился.\n\nСначала кто понравился.\nНеожиданно понравился Сергей Виноградов (гитара). До этого раза я почему то не понимал за что же его так хвалят. \nАнатолий Таран (гитара, вокал). Хорошая грамотная напористая манера игры, подача. Очень достойный спарринг-партнёр Серёже Воронову.\nВолодя Русинов (гитара) был замечателен. Это многие отметили. И на фестивале, и в среду – очень достойные выступления. Ещё одна безусловная звезда прошедшего джема - Оксана Кочубей (вокал).\t\n\nА теперь кто не понравился.\nИлья Вяткин (харп) пронзительно громко (Как сказал Миша Владимиров: «Ну, что ж теперь сделаешь, подача у человека хорошая».) и неинтересно.\nЖора (гитара) был достаточно вял (может, на фоне агрессивного Воронова?), но всё равно умудрялся забивать Гию Дзагнидзе.\nСкорее не понравился, чем понравился Анатолий Герасимов (сопрано-сакс). Второй раз его слышу и каждый раз думаю: что же в нём такого уникального? Ну, в кассу, конечно, но пресно."
