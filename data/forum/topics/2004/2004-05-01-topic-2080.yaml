  text: "БиБиКингу предстоит операция на глазах по поводу катаракты.\n-------\nINDIANOLA,\
    \ Miss. - B.B. King has postponed his cataract surgery and will be performing\
    \ as scheduled at his annual homecoming in Indianola in June. \n\nKing, 78, had\
    \ issued a statement saying he would not be able to make the June 11 trip to the\
    \ Mississippi Delta town because of the surgery, which has a lengthy recuperation.\
    \ \n\nAllan Hammond, interim director of the B.B. King Blues Museum and Foundation,\
    \ said Monday that King would postpone his surgery so he could attend. \n\nFloyd\
    \ Lieberman, King's manager, has said the singer hadn't had his eyes examined\
    \ in two years and learned from his doctor that he needs the surgery."
