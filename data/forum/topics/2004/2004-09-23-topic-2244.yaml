  text: "репортаж не претендует на объективность и всеохватность. просто некоторых фотографировать интересней, чем череду\
    \ гитаристов, понурившихся над гитарой. тут дело в картинках, а не в качестве музыки. Рок-н-Ролл мне не понравился, а\
    \ \"криль ушел\" - понравился очень, однако представлены и тот, и другой. А спектакля больше, потому что тут интересно\
    \ следить за движением - очень наглядно. особое одобрение публики и специалистов вызвало исполнение Русиновым Hey Joe\
    \ - что я совершенно разделяюю. однако на фото он только как участник трио. \nПрошу тех, кто был на сцене, а на фото не\
    \ попал - не искать в этом тайного смысла. Иногда это объясняется просто тем, что у меня в руках было пиво, а не камера.\
    \ надеюсь, в этом форуме это считается достаточно уважительной причиной :)"
