          deleted: false
          text: Вели джем в качестве хауз бэнда Crossroads. На джем в качестве зрителя пришел Ник Кейв, который в этот день
            отмечал свой день рождения. Он оказался на редкость общительным и очень интеллигентным человеком и вовсе не произвел
            впечатление мрачного типа, каким его описывают во всяких СМИ. Джем ему очень понравился. Я думаю, что Алексей
            Дагаев может по-подробнее рассказать.
