      text: "Там на флаере написано, что флаер не распространяется на отдельные мероприятия с просьбой уточнять в клубе. Правило\
        \ такое, если концерт стоит стандартно - 200 руб., то флаер работает. Если это Воронов за 350, который считается спец.\
        \ событием, или какой-нибудь Макаревич за 50 баксов, то флаер не работает... \nНу а на Воронова ходить я бы не посоветовал,\
        \ очевидно, что стоимость входного билета непропорциональна полученному \"удовольствию\", а то и с обратным знаком,\
        \ это ваше собственное решение, так что чего тут обижаться...\nБиБиКинг колбасит не по детски, как я понимаю, если\
        \ бы они не перенесли сцену, концертов, похоже, больше не было бы вообще. Весь вопрос в том, что они с этим сделают.\
        \ В принципе, если по двадцать сантиметров пенопласта пришить, то можно сделать нормальную звукоизоляцию.\nЯ бы на\
        \ их месте сделал сцену как в Мадди Уотерсе в Осло. Там тоже длинный клуб и сцена стоит в конце длинного зала, да\
        \ так, что ее видно из любого места в зале."
