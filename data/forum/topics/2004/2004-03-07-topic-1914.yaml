            Дейви ушел. Как выяснилось, Дейви был абсолютно прав: нам не удалось удержаться ни на одной работе.

            Например, нас выгнали из клуба "Томкэт-гоу-гоу" в Торренсе. В тот период американской музыкальной истории все,
            к чему ни цепляли в конце "гоу-гоу", пользовалось БЕШЕНОЙ ПОПУЛЯРНОСТЬЮ. Если вы музыкант и желаете иметь постоянную
