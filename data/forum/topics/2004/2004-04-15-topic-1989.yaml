  text: 'Альбом Jeff Healey "Cover to Cover" (кажись год 1994 или 1995) полностью состоит (как это и следует из названия диска) из каверов. Jeff Healey там играет вещи the Beatles, Cream, Robert Johnson, Creedence, Muddy Waters...). А вот последнюю вещь (акустический блюз) Healey играет один (интересно, тоже держа гитару на коленях?) и называлась она Me and My Crazy Self.

    Если кто знает, пожалуйста, подскажите кто её автор/первый исполнитель.

    И ещё: в этой песне я, убей меня, не понимаю некоторые слова (иногда ведь и в русских песнях не улавливаются знакомые слова):

    Me and my crazy self

    ????? woman made a fool out of me

    Now she ran away and left me

    I am lonesome as a fool can be

    Может кто сможет мне помочь и с текстом этой песни.

    Спасибо!'
