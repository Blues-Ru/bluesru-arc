  deleted: false
  text: 'В прошедший четверг взыскательная бибикинговская публика гуляла. Свой 4-ый день рождения отмечал коллектив раньше
    питерской, а теперь московской певицы Инесс.

    Из 4-х лет своего существования 3 года «SBA»  работала в Питере и лишь в последний год перебралась в Москву.

    Впервые появившись на джеме в  «Би Би Кинге» около года назад, Инесс успешно закрепилась и заняла достойное место на столичной
    блюзовой сцене. Пожалуй, она одна из тех, чей профессионализм заметен невооружённым взглядом. Группа играет не совсем
    блюз, а «рокешник» с редкостной экспрессией, как говорит один наш форумчанин. «Tutti Frutti» и та прозвучала в жёсткой
    хард-рокерской обработке.

    Большой неожиданностью стало перемещение сцены к противоположному, ближайшему ко входу концу барной стойки, что, по словам
    персонала, является временным явлением и связано с ремонтом старого места. Всё первое отделение музыкантов от зрителей
    отделяла сетка, от чего обстановка напоминала сгоревший в середине 90-х легендарный байкерский клуб «Sexton». Видимо,
    это должно было сдерживать наиболее активных слушателей. Посетовав на необходимость сидеть в клетке, Инесс, тем не менее,
    начала концерт, а в перерыве сетка была наконец-то убрана. Публика вошла в раж, на пол полетел, рассыпаясь брызгами белых
    осколков, фарфор…

    Звук же, как ни странно, был гораздо приятнее, чем на старом месте. Появились объём и звонкость, которых всегда так недоставало.
    Посмотрим, во что превратится «Би Би Кинг» после окончания ремонта.'
