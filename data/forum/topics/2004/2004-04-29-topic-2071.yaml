  text: "John Brim – легенда и долгожитель чикагского блюза. В разные годы John’у довелось играть с Muddy Waters, Little Walter, Willie Mabon, Memphis Minnie, Big Bill Broonzy, Tampa Red, Earl Hooker  и многими другими великими блюзменами. В начале 50-х он играл в его группе участвовал Jimmy Reed. В ударниках Brim побывал Альберт Кинг.\nАльбом «Jake’s Blues» стал последним в его дискографии и, в некотором роде, подведением итогов длинной и очень насыщенной жизни. Во время записи альбома John Brim было уже почти 80. \n\nПодлинный чикагский блюз, «грязноватый», «примитивный», что отнюдь не является синонимом слова «плохой». Значительная часть вещей с альбома авторства самого John Brim или совместно с гитаристом Jan Arenas. Грубый тёмный фальшивый вокал, временами напоминающий John Lee Hooker. Открывает альбом настоящий боевик, озаглавленный «Tougher Times». Медленная тягучая вещь\"What May Be Your Name\" с обильной слайд-гитарой контрастирует со следующей гораздо более динамичной \"You Put The Hurt On Me\". Чисто акустический блюз представлен \"No Place To Go\" и \"Oooowee\". Ряд вещей посвящён памяти любимой жены John'а  Grace Brim."
