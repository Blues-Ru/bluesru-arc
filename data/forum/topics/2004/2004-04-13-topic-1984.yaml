    text: 'В списке номинаций в опросе - русскоязычный блюз (хм, а в Китае тоже, наверное, проводятся конкурсы в номинации "блюз на китайском"), в числе номинантов - Чиж и Макаревич!!!


      А вот было дело, однажды я одному из "главных" людей блюз.ру дал послушать демо-диск своей группы. Оговорившись сразу, что это не блюз, но музыка весьма близкая по формату (не буду называть точное название стиля, ибо его здесь почему-то не любят, но охарактеризовать это можно как традиционную музыку американского Юга, являющуюся смесью блюза и кантри, естессно, на англ яз). И в ответ получил - ваша музыка к блюзу не имеет никакого отношения.


      А Макаревич имеет?'
