      text: "Я хочу сделать несколько замечаний. \n1) В данном случае результат голосования не будет использоваться для вручения призов на фестивале. Кроме того, на фестивале голосование будет продолжено в оффлайновом режиме.\n2) Полные результаты голосования, как и в прошлый раз, вероятно, не будут опубликованы. Только победители, ибо тут есть этический аспект, неожиданные результаты и пр.\n3) Цель голосования - выявление функционерами от блюза действительной популярности тех или иных персонажей, оценить, насколько существенны, скажем, нынешние достижения музыканта и степень его раскрученности в прошлом, чтобы спланировать свои гнусные PR-действия.\nУж извините ;)"
