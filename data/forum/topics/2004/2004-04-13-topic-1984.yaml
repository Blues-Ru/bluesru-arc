    text: 'Это я к тому, что купленная за 100 баксов салатница стала престижнейшим кубком. Может и нам, ну, типа скинутся на что-нибудь типа шляпы :-Ж и вручать каждый год с помпой на уже ежегодном Блюз.ру ?

      Увеличить количество номинаций (включить например номинацию - блюзовый лейбл года :-) ), или вот пример - Кожекину я бы 3 очка дал в номинации промоутер года, а как гармонист в этом году :-\

      И обязательно номинацию - легенда прошлого (за заслуги перед россоблюзом). А в других номинациях - строго за достижения ЭТОГО года. Ну, и на каждого номинанта страничку на блюзру - какие альбомы записал, саундтреки, в каких акциях, сейшенах, фестивалях, теле-радио программах. И журналистам будет проще писать, и народу оценивать. Да и самим номинантам будет легче себя со стороны оценивать. А то за многих по привычке голосуют, как за блюзовое лицо года, а за последние 15 лет ничего нового а тем более - достойного.

      Это так, не сейчас понятно дело. А на следующий год. И тянуть все голосование в течении всего года. И чтобы промежуточную статистику было видно и кореляцию ее например с выпущенным альбомом. По взрослому так сказать.'
