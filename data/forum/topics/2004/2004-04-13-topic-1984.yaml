      text: 'Я в такой форме не отвечал, и не мог, ибо, на мой взгляд, отношение имеет к блюзу почти все ;) Другой вопрос, можно ли назвать блюзом какую-либо музыку?

        Музыку Макаревича так назвать нельзя, но это и не повод цепляться, если в списке из 60 фамилий пара позиций спорные. В качестве компенсации, и чтобы не было обиды, могу включить в тот же список без проблем. Задача голосования - выяснить уровень популярности или даже попсовости, а также оценить наличие "заблуждений" у публики (по нашему мнению, ес-сно), к примеру, считающей, что Макаревич играет блюз. Мне так кажется, что он сам не играет, у него только друг есть, который делает это лучше всех.'
