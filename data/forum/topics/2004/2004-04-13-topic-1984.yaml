        text: "Федор, в данном случае я имел в виду не тебя (ничего если на \"ты\"?). Вас же, если правильно понимаю, у руля блюз.ру трое?\n\nЯ не имею обыкновения цепляться, и уж тем более обижаться на что-либо, связанное с музыкальной деятельностью, возраст не тот :) И моя реплика, след-но, не относилась к опросу. Речь шла вообще о формате как таковом. \n\nЕсли интересен мотив, по которому я написал вышеизложенное - объясняю. У меня, как у лидера муз коллектива есть, надеюсь, вполне объяснимое желание продвинуть свой коллектив и расширить его аудиторию. И, как мне кажется, мой коллектив не напрямую, но хотя бы косвенно в блюзовый формат попадает (если не ограничивать рамки формата только исполнителями 100% настоящего блюза). Возможно, я ошибаюсь, но внятного и аргументированного ответа на этот счет в свое время не получил.\n\nИ вдруг я вижу в опросе по блюзовым музыкантам - Чижа и Макаревича. И с точки зрения логики (абсолютно без каких-либо эмоций) у меня возникает вопрос, почему одно - не формат, а другое - формат. Но я на него, кстати, ответ получил, спасибо :)\n\nА за продвижение своего коллектива среди любителей блюза я-таки буду потихонечку бороться :)"
