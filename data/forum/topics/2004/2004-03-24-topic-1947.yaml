  text: "это rockmusic.ru\n Презентация DVD блюзового коллектива \"Blues Cousins\" в ЦДХ\n\nМосковская группа \"Blues Cousins\" 22 апреля в Центральном Доме Художника собирается устраивать большую презентацию живого концерта команды на DVD. Директор самого востребованного блюзового коллектива Тимур Джохадзе рассказал: \"Во время мероприятия будет устраиваться конкурс, победитель которого получит гитару Fender. Пришедшим в числе первых пятидесяти, будут вручены диски группы, а счастливчики, попавшие в первую двадцатку посетителей, будут вознаграждены DVD\". Со слов Тимура стало также известно, что \"буквально завтра группа приступает к записи концептуально нового альбома\" и \"на лето у коллектива грандиозные планы, выражающиеся в невиданном ранее по масштабу турне по США. Тур планируется начать 22 июня и завершить 28 сентября. За это время \"Blues Cousins\" дадут 50 концертов и примут участие в 12 фестивалях, в двух из которых (в частности, в крупнейшем фестивале штата Вашингтон \"Mount Baker Blues Festival\") выступят в качестве хэдлайнеров\". Группа \"Blues Cousins\", по возвращению с прошлогодних гастролей, стала первым блюзовым коллективом России признанным в США - на родине блюза"
