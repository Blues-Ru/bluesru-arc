    text: "Вероятно, речь идет о его политической заметке в блогах? Блог по формату - личный журнал одного человека, его уголок,\
      \ где он сам определяет, что хорошо, а что - плохо. Блоги на блюз.ру открываются для отдельных личностей, в них нет\
      \ цензуры, единственное, что может произойти из-за серьезных претензий к содержимому со стороны владельцев сайта, -\
      \ это закрытие ранее открытого блога. На данный момент никаких оснований закрывать Лешин блог у меня нет. \nА вот ваше\
      \ вступление в политическую полемику в блюзовом форуме - не приветствуется. В блоге Аграновского есть подходящие поля\
      \ для комментариев, пишите, пожалуйста, туда. А дальше - его личное решение, оставить комментарий или удалить. Думаю,\
      \ что Леша оставит."
