      subject: Альбом действительно занятный
      deleted: false
      text: "Недавно послушал. Альбом действительно занятный. Пусть некоторые ругают\
        \ AEROSMITH и говорят, что так блюз НЕ ИГРАЮТ...\n Вообще я к этой группе\
        \ отношусь положительно и никакого \"дерьма\" в их творчестве не вижу, взять\
        \ хотя бы альбом GET YOUR WINGS 1974 года, где на духовых играли такие люди\
        \ как STAN BRONSTAIN (из ELEPHANT'S MEMORY) и братья МАЙКЛ и РЕНДИ БРЕКЕРЫ\
        \ (известные в мире джаза люди). Были у них конечно неудачные вещи в 80-х\
        \ (но 80-е вообще самый отстойный период в музыке). Даже относительно попсовые\
        \ их вещи слушаются недурственно на фоне каких-нибудь Guns'n'Roses и Bon Jovi\
        \ (простите за \"нецензурные\" названия:)))))\n И голос у Стивена Тайлера\
        \ очень своеобразный. Послушайте какие он ноты вытягивает несмотря на возраст!\
        \ И каверы у AEROSMITH всегда получались довольно неплохо, взять например\
        \ битловские COME TOGETHER, HELTER SKELTER и I'M DOWN и знаменитый кавер на\
        \ блюзовый стандарт TRAIN CAPT A ROLLING. \n Данный альбом безусловно- удача!\
        \ Последняя вещь чем-то напоминает Ленноновские JOHN SINCLAIR и ATTICA STATE\
        \ (и по гармонии и по саунду)."
