  text: 'Умер Гуннар Граппс - знаменитый лидер "Magnetic Band", певец, композитор
    и барабанщик. Автор известной композиции "Lady Blues".

    Он был один из тех, кто на волне кратковременной предолимпийской оттепели принесли
    в наши дома звуки выразительной и удивительно граммотно технически исполненной
    музыки. Это была как вспышка звезды - яркая, но увы кратковременная... Очень запомнился
    его концерт в зале Олимпийской деревни, тогда впервые я в "живую" услышал настоящий
    качественный ритм-блюз в исполнении (тогда еще наших)музыкантов. Светлая память
    артисту...'
