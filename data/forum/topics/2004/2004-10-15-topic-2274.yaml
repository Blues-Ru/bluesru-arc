  text: "Уважаемый Андрей!\nЯ имела удовольствие присутствовать на первых двух битвах. К сожалению, третью пропустила. По моим наблюдениям, на концертах некоторые зрители были с видеокамерами.\nпредлагаю: выпустить \"Битву...\" на видео(или DVD), пусть даже и ограниченным тиражом, думаю, что найдется очень много желающих приобрести в свою частную коллекцию такую запись.\nДавно хочу выразить Вам свою признательность за все, что Вы делаете для развития современного искусства;-).\n По моему убеждению, чем больше людей слушает качественную живую музыку, тем меньше шансов у Фабрики звезд.\nМногие мои друзья и знакомые различных возрастов и музыкальных вкусов прослушав диск \"Я не увижу Миссисипи - 2\", говорят о том, что даже не имели представления о том, что существует в Москве такая \"настоящая, живая\" музыка. \nхочу пожелать Вам и г-ну Романенко дальнейших успехов на ниве \"несения культуры в массы\";)\nС уважением,\nАнна"
