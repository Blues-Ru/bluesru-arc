      text: 'кто-нибудь что-нибудь слушает из того что я иногда подбрасываю в форум (про БлюзмАн - молчу). Если НЕТ- то и
        вопросов нет.Если ДА - тогда отчего ж никто ничего не говорит.Неужели все настолько пресно что и сказать (поругать,похвалить,указать
        на достоинства или недостатки,сравнить или просто ''покалякать за жисть'',вспомнить былое итд) нечего? Даже,блин,
        как-то... Похоже на крик в пустоту. Не не в пустоту,а на крик в безэховой камере.Очень похоже и ощущения те же (для
        тех кто не знает: в хорошей камере полное отсутствие звуков как в вакууме,от этого жутко неприятное давление на уши
        или мозг?,голос ''отстается на уровне губ''.Пять минут и хочется бежать сломя голову. Идеальное место для пыток,и
        не надо никакого физического воздействия).Так что если есть что сказать то не стесняйтесь все ж свои,бубёныть. Да,и
        главное-то ,что речь не только и не столько обо мне, как о тех кто эту музыку играет. Да,да,да! Именно! Провоцирую
        на открытое общение!'
