    text: 'Сыграно добротно :) особенно T-Bone Boogie и ICQ Boogie клевые. Послушав
      последнюю прям как-то сразу втыкаешь, что и у нас есть грамотные, развивающиеся
      блюзовые клавишники :) отличная вещь, пять баллов.

      .

      Вот качество записи не особенно прикололо; как-то много ревера и высокие  частоты
      прут с немыслимой силой :) плюс баса мало и сочной середины :) но это никак
      не мешает оценить крутость банды :)'
