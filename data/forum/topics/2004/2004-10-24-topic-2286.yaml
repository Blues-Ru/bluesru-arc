  text: 'В воскресенье 31-го мы совершенно незапланированно организовали фестиваль на 6 групп в Клубе на Брестской. Подоплека в том, что мы хотели устроить там дополнительный концерт Little Charlie & The Nightcats, но по некоторым очень сложным причинам это сорвалось. Отчасти, чтобы компенсировать клубу потерю дня в расписании, а также развеять тоску от несостоявшегося концерта, решили сделать маленький _бесплатный_ фестиваль, участвовать в котором согласилось много очень хороших групп.

    Еще одна немаловажная подробность в том, что я там буду праздновать свое 30-летие, которое как раз случится в эти дни. ;) Приходите! Будет веселая блюзовая тусовка.

    Фестиваль начнется в 8 вечера, а с некоторой вероятностью в 6 часов там же будет мастер-класс Рика Эстрина и Чарли Бейти. Вопрос до сих пор открыт, может сорваться, точнее будет известно на неделе.

    От себя погрожу пальцем по-обыкновению и добавлю, что пропускать Эфес или Регтаймовский концерт из-за фестиваля в воскресенье - в высшей степени не разумно ;) Нужно собраться с силами и сходить на несколько концертов, ибо стоящих событий на этот раз очень много!'
