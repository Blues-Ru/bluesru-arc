    deleted: false
    text: "Шел на этот концерт со смешанными чувствами, благо до этого прочитал отзывы Федора и Михана о концерте во Владимире.Казалось\
      \ тот шок, который я испытал после концертов Морюдов больше не повторится...\nНо вот и опять эти северяне так шарахнули,что\
      \ мало не показалось.\nОчень классный бэнд...Хакун здесь оказался на высоте ( у Амунда чувствовалось, что он был как\
      \ бы в тени молодого виртуоза). А здесь он очень органично вписался. Очень понравилось сочное звучание его Эпифона и\
      \ восхитительные дуэты с гармошкой Эрика. А про этого перца особый разговор... Трудно поверить, что это субтильный юноша\
      \ всего  три года  как овладел этим инструментом (гармошкой), но такое выдает... Али там в Норвегии настолько все экологически\
      \ чисто и кормят их всякими био-добавками, что этот 20 летний вьюноша так дудит елы-палы. И голос у него тоже неслабый....\n\
      Про ритм-секцию... Очень хороший бассист, тоже молодой, а играет так, что многие старички позавидуют. Барабанщик тоже\
      \ классный, хотя иногда казалось что он немного тормозит... Короче? впечатления просто ох... \n(замечательные). Где\
      \ же та наша \"молодая шпана\" ????\nКто бы так мог сыграть, али только вся надежа на \"Blues Doctors\"....\nКстати\
      \ народу было немного (все теже знакомые лица )\nА жаль, ведь есть чему поучиться у этих варягов...."
