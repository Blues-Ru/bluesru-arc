    deleted: false
    text: Во-первых,народу было не очень много,но клуб маловат даже для этого количества.Это общая беда наших маленьких клубов.Люди
      стояли,аплодировали и пританцовывали,но почему-то никто так и не решился потанцевать по-настоящему.Играли они действительно
      неплохо,весело и достаточно раскованно.Неплохо пел и парень-солист.Вместе с тем я бы не стал употреблять выражения типа
      супер и т.д.Конечно,ребята явно уступают в классе Пол Лэмбу,такие впечатления сложились не только у меня.Но в общем
      мне понравилось,поскольку я на большее и не рассчитывал.Помещение явно уступает Алабаме,две небольших комнатки и бильярдная.Во
      второй комнатке впечатление от музыки явно теряется,прислуга какая-то нервная.Официантка куда-то явно торопилась и сама
      вылила мне в стакан остатки пива из бутылки.Кроме того,она явно нервничала,что посетители уйдут,видимо,не заплатив.Eсли
      бы я был Сони Терри или Лайтнингом Хопкинсом,то точно сочинил бы на эту тему блюз типа Женщина,дай мне допить мое пиво.
