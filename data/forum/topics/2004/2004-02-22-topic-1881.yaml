      некуда.

      Потому, пожалуйста, описывайте поподробнее все эти концерты - у меня хорошая фантазия :).

      Может кто-нибудь и нам кого-нибудь привезет.

      Переосмысляя и перефразируя любимого по постам и рецензиям (с ориентацией все в порядке)- определенный образ сложился
