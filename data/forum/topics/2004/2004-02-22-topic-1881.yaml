            text: "Сами они осенью не приедут, если я их не привезу ;) Кроме того, многие вещи второй раз не повторяются,\
              \ уже сейчас это ясно. Примеров, если подумать, очень много. \nПол Лэмб, который потрясающе играл два раза,\
              \ сменил гитариста, теперь уже если и приедет, то без Вайтхила. Не знаю, может и будет здорово, а может и нет.\
              \ \nДжейм Браун, когда приехал во второй раз, сыграл гораздо слабее, ибо состарился.\nБиБиКинг после мая уже,\
              \ возможно, в Москву никогда не приедет.\nБюск сейчас перестал блюз играть, хотя, может, и образумится. К нему\
              \ вообще очень трудно что-то предъявлять и чего-то ожидать, он совершенно не на этом свете, голова витает в\
              \ облаках.\nМорюд пишет забойную рок-пластинку. Кроме того, с прошлого мая он стал супер-рок-звездой в Норвегии,\
              \ возможно, что его это немного подпортит, агентство заломит большие деньги, а также он, возможно, будет играть\
              \ меньше блюза.\nХокун Хэйе в ближайший год не будет играть с Эйриком Бергене из-за коньюнктурных печальных\
              \ обстоятельств. Новый гитарист - похуже.\nНа то, чтобы привезти второй раз Шведов - Knock-Out Greg & Blue Weather,\
              \ нужно огромное количество денег, которые просто не найдутся в следующий раз. В сентябре просто все случайно\
              \ сложилось так, что они почему-то приехали ;)\nИтого, было очень много отличных концертов, которые вполне возможно\
              \ не повторятся. Конечно, будут другие отличные, но те, кто не пришел, упустил многие вещи НАВСЕГДА... Вода\
              \ утекает, вот такой блюзовый фатализимь. \nЯ лично бы не позволил себе пропустить хороший блюзовый концерт.\
              \ Даже, когда есть какие-то сомнения, типа слабых немцев Bluesnatics в конце августа. Для меня это - просто\
              \ немыслимо ;) А что еще может быть важнее, если любишь блюз, чем концерты и пластики? Т.е. непосредственно\
              \ - музыка в двух ее основных проявлениях? Концерты местных посредственных музыкантов? Джемы? Обсуждения в форуме\
              \ и тусовки? Сайт blues.ru? Все это не стоит и малой части настоящего концерта. 100 плохих концертов никогда\
              \ не заменят одного хорошего.\nP.S. Ни на кого не наезжаю, уже надоело, просто мысли вслух..."
