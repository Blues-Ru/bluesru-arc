  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70401111659581738&sql=Agqkxikm6bbo9


    Второй альбом Джона на Vanguard Records сильно отличается от его дебюта. Ему подыгрывает
    группа и сам он играет на электро-гитаре! Все это очень напоминает начальный блюз-рок,
    только вот в 64 году его еще никто не играл, да и термина такого не было. Слышно,
    что Джон пытается найти свою манеру и стиль, но его манерное пение может достать!
    Играют очень здорово, отличный матерал, но ВКУС еще не был развит, но это и понятно
    - молодость!


    Оценка 4 балла. Джон кому-то подражает, кривляется, манерность, дешевые театральные
    хуки в вокале. В некоторых треках это очень сильно мешает. Пожалуй, это единственный
    минус. Подбор песен отличный! Явное развитие после первого альбома. Еще чуть-чуть
    и он будет лучшим! Но уже зарождалось целое движение, и Джон станет лишь одним
    из лучших в Америке.'
