  subject: Николай Арутюнов – Miller Anderson – Chris Farlowe в клубе «Апельсине»
  deleted: false
  text: "В субботу 15 мая в клубе «Апельсин» состоялось крупное мероприятие, позиционировавшееся как российско-британский блюзовый фестиваль. Собственно, оно таковым и являлось. Несмотря на достаточно высокие цены на билеты, народу собралось предостаточно. Было много сурьёзных таких дядечек и тётечек–не мальчиков и девочек, пришедших, должно быть кайфануть, вспомнив молодость. При этом необычно мало доползло до «Апельсина» завсегдатаев подобных мероприятий с блюз-ру. В принципе оно и понятно: дачи-фигачи etc. Зато в толпе прогуливались Алексей Козлов и Евгений Маргулис, Маргарита Пушкина и Дмитрий Четвергов, Гия Дзагнидзе и Марк Розовский и др. \n\nПервым на сцену вышел Николай Арутюнов со своим нынешним фанк-проектом. Забавно видеть Арутюнова «на разогреве». Первый раз я слышал Николая с этим составом на большой сцене и повторю то, что говорил уже множество раз: Арутюнову на нашей блюз-роковой сцене равных нет. Конечно, блюз он сейчас не поёт, а в фанковой нише у него конкуренты отсутствуют в принципе, тем не менее он лучший. Подкачал звук. Видать, сложно было прокачать как следует здоровое помещение клуба. По-настоящему почувствовать мощь выступавших можно было только находясь у сцены. Тем не менее Николаю удалось разогреть публику. Места на сцене было достаточно и Арутюнов смог «попрыгать» вдоволь. В стеснённых условиях, к примеру, Би Би Кинга обычно бывает страшно за сохранность хрупких бэк-вокалисток :)\n\nВторым выступал Миллер Андерсон (гитара, вокал) при поддержке коллектива Криса Фарлоу. Звук наконец-то пришёл в норму (почему это нельзя было сделать с самого начала?!). Первые несколько вещей показались несколько пресноватыми: гитара в общем обычная (Воронов и круче могёт), гармошка более, чем простенькая (у нас и свои харперы не хуже имеются), клавишник лажал по началу. Но случился перелом. И драйв появился, и энергетика. Офигительные проигрыши с жутко агрессивными клавишными соло. Даже флегматичный гитарист из группы Фарлоу разошёлся. Зал просто ревел. Очень в кайф пошло. Прозвучала «House of the Rising Sun» с незнакомым (так, по крайней мере, показалось мне) текстом.\n\nТретий сет принадлежал Крису Фарлоу – дядька 63-х  лет от роду квадратного телосложения с седыми перьями волос, участв(овав)ующий в таких легендарных составах как «Colosseum» и «Atomic Rooster». Его энергии можно только позавидовать. Экспрессия, 2 биса – просто супер! После его первого (?) приезда в Москву на «Blues Summit-2001» я очень ждал дуэта с Арутюновым. И это случилось. Классический «Stormy Monday Blues» прозвучал в исполнении Фарлоу-Арутюнова и мощной поддержке Андерсона. «Лучший голос мира», - так сказал, представляя Криса Фарлоу, Николай Арутюнов. И действительно - хорош голосище, да и вообще могучий, так сказать, человечище!\n\nЗамечательный вечер. Замечательные музыканты. Случился праздник. Было б их побольше в нашей жизни. По словам организаторов, если всё будет так, как предполагается, то подобное мероприятие не станет последним. Очень хочется верить, что именно так и будет.\n\nСамо собой, при желании можно найти и минусы: в не всегда достойном поведении официантов, в снобизме аквариумной халявы, в не отстроенном по началу звуке, но кажется мне, что не в этих мелочах главное. В главном то как раз всё было очень и очень."
