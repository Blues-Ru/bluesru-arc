    text: 'Да, очень трудно передать эмоции, но это действительно лучший (в плане блюзового, фанкового вокала) концерт. Звук в начале очень сильно лажал - гитары "Funk You" почти не было слышно, да и многие инструметы Арутюновского бэнда "не играли". Но Коляныч показал, что он действительно лучший на нашей блюзово-фанковой сцене и видимо его сильно вдохновляло присутствие Chris Farlowe, кому он и посвятил исполнение старой песни Atomic Rooster.Про выступленение Millerа Андрей все правильно написал, но одно хочу добавить он был несколько тяжеловат и скован поначалу. Chris Farlowe - это.....

      Он еще хорошо запомнился с Blues Summit, как сейчас помню было очень холодно и у несчастного Chrisа в гавайке, аж пар валил изо рта. Но и тогда он запомнился многим и видимо, что сейчас народ пришел на этот концерт памятуя то выступление. Голос - трудно подобрать слова, он настолько завораживал своей силой и артистизмом. Последее он наглядно продемострировал во второй композиции, где он спел от лица "male" и "female" (закрыв глаза было трудно представить что это поет один человек). Это был праздник вокала и долго публика не хотела отпускать маэстро и его музыкантов.'
