    text: "Марго Пушкина в \"МК\" об этом концерте - довольно стебно (-)\nСначала было “Funk you”, \nа потом стало “Blues you” \n  \n \n     Суббота. 15 мая. Большинство москвичей-телеманьяков припало к бесстыжим голубым экранам и пялило глаза на орущие и пищащие по ходу очередного конкурса третьесортной европейской самодеятельности “Евровидение” куски молодых человечьих тел. Аппетитные голяшки, ляжки и ягодицы были едва прикрыты шкурами неопознанных наукой несчастных доисторических животных типа боевых сусликов из степей самостийной Украины. Не желая быть свидетельницей очередного позора близорукого российского менеджмента, который уж несколько лет подряд попадает пальцем в и без того заплеванное и захватанное жирными перстами коллег небо “Европомойки”, я отправилась накачиваться признаками реальной музыкальной жизни. Ибо реальной жизнью, как ни парадоксально это звучит, в наше время живут не те, кто рассуждает о ней на красивых диванах в телевизионных гостиных, а редкие, еще оставшиеся в живых психи от рок-н-ролла, блюза или фанка. Фанка, а не фака (прошу отметить особо).\n     \n     В роли таких психов на этот раз выступили некто Геннадий Макаров, искренне любящий некоммерческую нынче блюзовую музыку, и помолодевший, похудевший и слегка с голодухи озверевший Ник Арутюнов. Психи скорешились и пригласили на легкий субботний шабаш парочку ветеранов британского блюзового фронта с одной сопровождающей бандой на двоих.\n     Атмосферу хэппенинга антиевровидуисты создавали умело: сначала на огромном клубном экране мелькали и шевелили губами те, без кого наша жизнь была бы серой и бессмысленной… Вон молодой пухлощекий Элис Купер пробежал, а вон… “О-о-о! СЛЕЙД!” И все дружно тяпнули водки. Не в меру перевозбудившись, один из работников музпера мощно хлопнул по спине заглянувшего на звук блюза Евгения Маргулиса: “Макар, как я рад тебя видеть!” Ну и выражение лица было у Маргулиса в тот момент (не к добру, коль уже путают с коллегой по банде Макаревичем)… \n     Первым на сцене начал шикарничать сам Арутюнов в сопровождении лихих парней и девчат из созданной им группы “Funk You”. Маэстро был в ударе, представляя свой проект в суперэксклюзивной манере: разбавил фанк блюзом, уважив верных поклонников “Лиги Блюза” (из недр которой, кстати, и явилась миру та самая Юдифь — Маша Кац, открывшая России дорогу на “Евровидение”). \n     “Can’t Find The Reason” Винсента Крейна была исполнена специально для дорогого гостя, арутюновского учителя Криса Фарлоу, некогда певшего в крейновской культовой “Atomic Rooster”. Хотя, похоже, его сердце больше греют воспоминания об участии в “Colloseum”. Г-н Фарлоу, который второй раз приезжает в нашу страну, в свое время был отцом-родителем ритм-энд-блюзовой “Thunderbirds”, популярной на британских островах в 60-е годы. Говорят, ему как-то раз позвонил сам Пол Маккартни, который тогда еще не был никаким таким сэром, и предложил Крису заехать послушать одну песенку, которую он, еще не сэр, написал специально для Фарлоу, впечатлившись его вокалом. “Что-то лень мне было в тот день выходить из дома, — вспоминает Крис и улыбается, — я и не вышел… А песня та оказалась “Yesterday”. Мик Джаггер и Ричардс написали для певца около 10 песен, в том числе и знаменитые “Pain It Black” и “Out Of Time”, на ура принятые собравшимся 15-го числа народом.\n     Второй гость, Миллер Андерсон, представлял именно тот образ музыканта, который сегодня совершенно не интересует воротил нашего шоу-бизнеса. Британский мужчина с гитарой, крепко стоящий на ногах, временами дующий в губную гармонику и поющий так, как положено петь американскому блюзмену. Не обошелся Андерсон без традиционных “Хучи Кучи” и “Дома восходящего солнца”, вспомнил “Gimmie Some Loving”, пару песен из “Howling Wolf”, исполнил кое-что и со своего последнего альбома 2003 года “Blues Heart”, в записи которого принял участие не кто иной, как покинувший “Deep Purple” мой седовласый любимец Лорд. \n     А какая же блюзовая тусовка без джема? (Чуть было не напечатала “без Джеймса”… Интересная ошибка получилась бы: песен Джеймса Брауна на концерте было исполнено предостаточно!) Фарлоу, Арутюнов и Андерсон стройно, вдохновенно выдали “Stormy Monday Blues”, одну из самых любимых Крисовых песен. Крис с Ником дружно запевали, крепкий блюз-мужичок, отступив в глубь сцены, обеспечивал им яростное гитарное сопровождение.\n     Между сценой и зрителями происходил нешуточный обмен энергией."
