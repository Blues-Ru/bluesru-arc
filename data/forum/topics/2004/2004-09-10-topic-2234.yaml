      subject: Спасибо
      deleted: false
      text: "Привет, Grem!\n\nЯ очень постараюсь пойти в BB King Клуб в среду.  Сегодня\
        \ вечером по совету Федора я иду в Дом у Дороги послушать Blues Doctors. \
        \ \n\nМежду прочим я слышал, что сам BB King очень возмутился, когда узнал\
        \ в Москве, что основали этот клуб без его участия и знания.  Но потом он\
        \ наконец его одобрил.\n\nЕще одна Российская история о BB King:  ВВ находился\
        \ в Москве на гастроли еще в советское время в 1979 г.   Ему показали конечно\
        \ только самую лучшую сторону столицы.  Когда он вернулся в Штаты журналисты\
        \ спрашивали его мнение о СССР.\n\n\"Очень хорошо было,\" он сказал.  \"Русские\
        \ на самом деле очень глубоко чувствуют блюз.  Ведь какая разница, черная\
        \ кожа или белая кожа? Беднота есть беднота.\"\n\nMuddy"
