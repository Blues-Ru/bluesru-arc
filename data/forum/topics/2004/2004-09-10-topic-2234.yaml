    \ нахожусь в Москве по работе, и хочу познакомиться с Московским блюзовым обществом.\
    \  (Правда работа такая, что свободное время очень ограничено!)  \n\nЯ участвую\
    \ в форуме Blindman's Blues(http://blindman.forumhoster.com/).  Для тех из вас,\
    \ кто английский знает, я этот форум очень рекомендую.  Я узнал о форуме \"Блюз\
    \ в России\" благодаря Федору и Арсену, которые пришли в Blindman's Blues и представились.\
    \ Там участвуют некоторые очень известные связанные с блюзом лица, например Dick\
    \ Shurman.   \n\nПривет всем участникам форума!\n\nMuddy Lives"
