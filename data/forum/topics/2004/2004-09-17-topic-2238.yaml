  text: "Мне казалось, что продукцию лейбла Sun я хорошо знаю. Блюз всегда богат сюрпризами, и я получил очередной (даже два). \n\nПервое: Сегодня в ВЭБ на Эхе – сановская продукция: любопытная, забавная, местами – поразительная. \n\nВторое: в воскресенье на Арсенале – о тяжелом блюзе 2004г. Когда-то это направление доминировало и превратилось в до-отвращения-банальное. Теперь, гонимое, обретает человеческие черты. Есть курьезные проявления, вроде альбома Аэросмита. Есть туповато-прямолинейные, вроде Тинсли Эллиса. Но вот кто меня удивил – Гэри пресловутый Мур. Песня «дыра там, где были мы, пусто всё, когда нет нас» - это нечто. Начинается с такого обычного муровского лика, что просто скулы сводит скукой... а потом возникает блуууз... финальное соло – это все, чего я ждал от Джонни Уинтера, да так и не дождался. Иногда видно, как мура тянт на скорострельность - но он сам себя рубит такими грубыми аккордами, каких я у него еще не слышал. И еще. Если нет такого азарта – не надо браться за чикагские стандарты: послушайте Evil в муровском исполнении. Страстность - она все еще есть в блюзе. И, к сожалению, легко исчезает у артистов, падких на лесть. и иногда - может снова появляться, когда никто не льстит. Бэнд у мура - архи-белый. но как играют!"
