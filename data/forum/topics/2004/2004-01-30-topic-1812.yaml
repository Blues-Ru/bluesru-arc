  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDCASS80401291931510333&sql=Arx4uaknk0m3k\n\nЭто первый из трех альбомов Кинга на Шелтере. Продюсер Дон Никс; он же автор четырех из десяти композиций на этом диске! Великолепный состав и настроение, два барабанщика одновременно создают особую атмосферу. Немного сыроватая, но очень живая и трогательная запись; в некоторых треках специально не вырезаны вступления и концовки. Отличные варианты исполнения Worried Life Blues, Going Down и Key To The Highway. \n\nОценка 4 балла. Альбом чуть сыроват и местами есть слишком обычные ходы. Но большинство треков великолепны! Going Down - шедевр! Диск обязателен для всех любителей блюза, рока и соула (как и все последние пять альбомов Фредди 1971-1975)."
