  text: 'Друзья мои!

    Очень удивляет и расстраивает меня то обстоятельство что на этом форуме (в пылу разговоров мало имеющих отношения к блюзу
    и к музыке вообще) почти не заметным прошло появление альбомя Клаптона "Me and Mr. Johnson".

    Всего по этому поводу здесь было пара-тройка заметок.

    В обсуждении о том что ждать от будущего диска (какие предчуствия? - Дима Казанцев (Dr. Nick) (01/03 05:03)) в предверии
    выхода альбома было намного больше участников и постов.

    Такое впечатление создаётся что диска и не было (а был ли мальчик?) или его ещё не слушали...

    То, что альбом заслуживает внимания мне кажется однозначным. Хотя я ожидал несколько большего от него (уж СЛИШКОМ высоки
    были мои ожидания). Я бы поставил ему 4 с плюсом.

    На работе мой коллега прослушав этот диск заинтересовался Джонсоном. Да и я снова его переслушал (давно не брал я в руки
    шашек). Мне кажется, что этот диск пробуждает интерес к записям РД.

    И ещё: я (мы) привык(ли) что обычно альбомы-трибьюты записываются разными музыкантами, а тут ОДИН музыкант записал трибьют
    такого (как сказал мой коллега) "весьма не разнопланового" музыканта как РД. Может поэтому здесь не хватает некоего разнообразия.

    В общем, было бы интересно узнать ваше мнение о этой работе ЭК.'
