      text: 'этот альбом Питера Грина :-(

        Очень интересно.

        Посмотрел на All Music Guide и обнаружил что Peter Green за 2002-03 гг. выпустил аж 2 диска с песнями РД:

        Peter Green Splinter Group - The Robert Johnson Songbook [2003] (Oct 14, 2003): 16 песен http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDSUB040402292104191765&sql=A2x7uak2kam3b

        Peter Green with Nigel Watson (Splinter Group) - Peter Plays the Blues: The Classic Compositions of Robert Johnson
        (Nov 5, 2002): 14 песен AMG rating: *** http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDSUB040402292104191765&sql=A58q8g4eztv6z

        Из 30 песен этих двух альбомов 6 повторяются (это судя по кредитам), так что всего там представлено 24 песни РД (осталось
        всего 5; ну, может быть 6 :-)

        Да уж... надо их послухать.

        Насколько я помню, этот трибьют ПГ упамянался на форуме, но не обсуждался.

        Предполагаю что эти работы ПГ могут быть обсуждены отдельной темой.

        Кстати, у ЭК на альбоме 14 вещей. Плюс 4 песни которые он исполнял на ранее издававшихся альбомах (Ramblin'' on My
        Mind, From Four Till Late, Crossroads, Walkin'' Blues). Всего 18. Кажись, ещё на один трибьют хватает :)))'
