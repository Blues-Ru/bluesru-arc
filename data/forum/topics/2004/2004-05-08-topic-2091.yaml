          text: 'Судя по All Music Guide кредитам (названия песен и их длительность) The Robert Johnson Songbook [2003] это
            повтор The Robert Johnson Songbook [1998] (AMG rating: **), только прибавились Terraplane Blues и Kind Hearted
            Woman Blues. Но (опять же по кредитам), в 2003 звучат только 2 гитары, а в 1998 и басс, и ударные, и гармоника,
            а поёт (наверное в нескольких песнях) Paul Rodgers. А в Hot Foot Powder (AMG rating: 2 с половинкой) играют  также
            и Buddy Guy, Hubert Sumlin, Joe Louis Walker, Dr. John, Otis Rush.

            Собственно, я вот для чего на All Music Guide рыскал: просто интереса ради захотелось узнать все ли песни РД переиграл
            ПГ. Оказалось что все 29 :-)

            Может кто нибудь напишет об этих работах ПГ? Уж очень смущает такие невысокие оценки AMG rating. Я не сильно на
            них ориентируюсь, но когда ничего нет, а у меня этих записей нет :-( как говориться: и рок - рыба:-)

            Кстати, и про трибьют ЭКлптна тоже было б интересно узнать.'
