  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDSUB040402120155102587&sql=Ad9fuxq85ldfe


    На этом альбоме 10 треков, но только шесть из них можно назвать полноценными композициями.
    Четыре трека длятся меньше двух минут и представляют из себя странные психоделические
    заставочки. Вообще это альбом очень "дурной" и обкуренный (вчитайтесь в название).
    Блюза многа, но еще больше психоделии и тайнственно-мрачных настроений. Все это,
    конечно, не очень хорошо для музыки, но годы были такие. Элвин Ли прекрасно играет,
    задумчиво и мрачно поет. Запись довольно неровная по качеству, но это почти незаметно
    из-за стилистики альбома.


    Оценка 3 балла. Ну так нельзя... Всего 6 песен? Это маловато даже для 1969 года.
    Мрачно, тяжеловато, обкурено... Hear Me Calling - лучшая. Это не самый сильный
    диск группы; можно сказать, что он вообще необязательный.'
