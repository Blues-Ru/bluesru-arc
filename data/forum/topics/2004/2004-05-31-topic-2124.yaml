    text: 'Бесси - певица огромной выразительной силы, потрясающего чувства и неимоверного обаяния. Те 15 минут её съемок, что дошли до нас, дают -сквозь все эти семьдесят пять лет, черно-белый антураж, помехи и прочее - такую огромную инъекцию этого самого блюзового чувства, что мурашки бегают по коже не переставая. Воистину, это была Императрица Блюза. Пафосно? иначе не получается.

      Сходный трепет - лично мне, по крайней мере, - внушает ещё только просмотр съёмок Сона Хауса.

