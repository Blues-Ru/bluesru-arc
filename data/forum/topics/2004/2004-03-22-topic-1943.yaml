  text: 'Вчера в московском Доме блюза - клубе «Би Би Кинг» состоялось последнее в серии нынешних гастрольных выступлений
    группы «Svet & Al Boogie Band», приуроченных выходу первого официального студийного альбома бэнда - «Happy with Boogie».
    В двух отделениях музыканты представили электро-акустическую программу, составленную из классики архаичного жанра.  Открывали
    концерт непосредственно Svet (фоно, харп, вокал) и Al на акустической гитаре, разукрашенной белым «горошком» ака Бади
    Гай. Далее к дуэту присоединилась ритм-секшн в составе: барабан&контрабас. В медляках слово брал слайд Al`а и практически
    выворачивал наизнанку душу слушателя, а на заводных буги никто не мог сравниться с маэстро Svet`ом, который «зажигал»
    на клавишах, в экстазе щёлкал стильными подтяжками, бил в молодецкую грудь в особо «блюзовых» моментах, а перерывы между
    композициями заполнял шутками и общением с залом с профессионализмом опытного конферансье. Постепенно погружаясь в атмосферу,
    созданную музыкантами, замечаешь как звуки ритм-секции сливаются с биением сердца и первая часть концерта пролетает незаметно.

    Во втором отделении к Буги бэнду присоединился московский харпер Александр Братецкий, «окрещёный» Svet`ом «блестящим черепом»
    и оставшееся время прошло под знаком джема представителей двух столиц. Помимо прочего, вся бАнда залихвацки исполнила
    «Пуделиное Буги». Публика присоединялась в припевах. В завершении концерта Svet поочерёдно представил всех участников
    коллектива, включая джемовщика Братецкого. В программу «на бис» вошёл традиционный «поезд», порадовавший изобретательностью
    и свежестью приёмов, продемонстрированных харперами. Неожиданным было и губногармошечное исполнение Гимна Республики Беларусь
    – очередной фокус затейника Svet`а.

    Позабыв про реальный поезд на Минск, не на шутку разыгравшийся бэнд исполнил композицию про Рок-н-ролл, радостно подхваченную
    в зале!

    Новые приключения белорусов в России ожидаются совсем скоро на предстоящем апрельском "выпуске" фестиваля БлюзточкаРу!
    Спасибо всем, кто организовывал выступления этого замечательного коллектива в Москве!'
