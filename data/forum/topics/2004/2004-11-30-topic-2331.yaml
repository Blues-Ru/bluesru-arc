  text: "We are delighted to be able to announce the details of BO DIDDLEY's forthcoming\
    \ 76th birthday party! \n\nOne of the undisputed legends of rock & roll and a\
    \ true original, BO DIDDLEY will be celebrating his 76th birthday live on-stage\
    \ at Berbati's Pan, 10 SW Third Avenue in Portland, OR on Thursday December 30th\
    \ 2004. Further details can be obtained by calling the Box Office & Info. Line\
    \ on 503-248-4579.\n\nThe previous evening, Wednesday December 29th 2004, BO DIDDLEY\
    \ will be performing live at The Showbox, 1426 First Avenue in Seattle, WA. Further\
    \ details of this gig can be obtained by calling the Info. Line on 206-628-3151.\
    \ Please note that dates and venues are subject to change. Please check with the\
    \ Forthcoming Appearances page of the BO DIDDLEY-The Originator authorized website\
    \ at http://members.tripod.com/~Originator_2/dates.html for the latest updates.\n\
    \nIf you can't make it to the above shows, you can still send BO DIDDLEY your\
    \ special 76th birthday greetings and messages by signing the BO DIDDLEY-The Originator\
    \ website's Guestbook which is located at http://members.tripod.com/~Originator_2/guestbook.html\
    \ You can rest assured that BO DIDDLEY will get to see each and every one of your\
    \ messages.\n\nThe winter of 2004-2005 marks the 50th anniversary of BO DIDDLEY\
    \ recording a demo of his songs \"I'm A Man\" and \"Uncle John\". In late February\
    \ 1955 he entered the Chess Record Corporation offices at 4750-2 South Cottage\
    \ Grove Avenue in Chicago, IL with his demo recording and on Wednesday March 2nd\
    \ 1955 he made his debut recordings, taping the songs \"Bo Diddley\", \"I'm A\
    \ Man\", \"Little Girl\" and \"You Don't Love Me (You Don't Care)\" at the Universal\
    \ Recording Studio in Chicago, IL. Late March 2005 marks the 50th anniversary\
    \ of Checker Records releasing his debut single \"Bo Diddley\"/\"I'm A Man\" (Checker\
    \ 814) and Wednesday May 4th 2005 will mark the 50th anniversary of his single\
    \ entering the Billboard Rhythm & Blues Singles Chart, reaching No. 2, spending\
    \ a total of 15 weeks on the Chart and exceeding one million copies in initial\
    \ sales.\n\nThis is a unique opportunity for you to convey your appreciation and\
    \ best wishes to one of the founding fathers of rock & roll and the popularizer\
    \ of the world-famous BO DIDDLEY beat on the occasion of his 76th birthday and\
    \ his 50th anniversary in music.  Please visit the BO DIDDLEY-The Originator authorized\
    \ website at http://members.tripod.com/~Originator_2/index.html and sign the Guestbook\
    \ and show your support for The Originator - BO DIDDLEY. Thank you very much.\n\
    \nDavid Blakey, Webmaster,\nBO DIDDLEY-The Originator\nhttp://members.tripod.com/~Originator_2/index.html\n\
    A Celebration of his unique contribution to Popular Music.\n1954-55 to 2004-05\
    \ - Celebrating 50 Years of The Bo Diddley Beat!"
