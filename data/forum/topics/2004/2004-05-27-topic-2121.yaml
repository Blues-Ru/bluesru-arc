  text: "http://www.devilinmycloset.net/john_campbell_recordings.htm\n\nМалоизвестный\
    \ широкому кругу слушателей альбом уникального блюзмена Джона Кэмпбелла, записанный\
    \ на Robin Hood Studios в качестве демки за 9 лет до «A Man And His Blues», который\
    \ будет спродюсирован поверившим в него Ronnie Earl, записан в 1988 на Cross Cut\
    \ Records и выпущен столь малым тиражом, что останется практически незамеченным\
    \ даже в США, и за 12 лет до контракта с Elektra, после чего последуют один за\
    \ другим мрачные «One Believer» (1991) и «Howlin’ Mercy» (1993). \n\nПластинка\
    \ чисто акустическая. Их только двое – он и его гитара. Звучат хорошо известные\
    \ классические вещи «Walkin’ Blues», «I’ Can Be Satisfied», «Rollin’ Stone», «The\
    \ Sky Is Crying», другие, которые и до и впоследствии исполнялись и будут исполняться\
    \ сотнями блюзменов, но есть именно в этом жёстко аскетичном исполнении Кэмпбелла\
    \ что-то завораживающее. Джон совершенно по-зверски терзает гитару. Она ревёт,\
    \ вопит и рвётся из рук, струны визжат и звенят, но не так-то просто вырваться\
    \ из объятий Кэмпбелла. Своей кульминации пластинка достигает уже на 4 треке «Watch\
    \ Dog Blues» (K.C.Douglas) и так и не спадает до самого конца. Далее одна за другой\
    \ следуют две авторские вещи Джона: достаточно мягкая «Medley In C/Chump Man Blues»\
    \ с кантри-проигрышами и динамичная инструментальная «My Babe». Кажется, что вот\
    \ уже всё, кода, но нет, гитара взрывается с новой силой. Агрессивный slide guitar,\
    \ banjo style, почти классические переборы, рёв вокала Кэмпбелла – это всё «Tyler,\
    \ Texas Session». И лишь в конце 1999 года такой бриллиант стал доступен благодаря\
    \ выпустившей его Sphere Sound.\n\nPS Огромная благодарность Илье Верховскому\
    \ и Джону Сорокину, предоставившим мне возможность слушать эту замечательную пластинку."
