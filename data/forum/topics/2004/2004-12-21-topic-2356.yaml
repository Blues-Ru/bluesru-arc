          text: "Докладываю.\nУстановил и поставил на своём трубопроводе \"Уренгой-Помары-Дислокация вероятного противника\" программу eMule, которая подключает к одной из файлообменных сетей, не могу выговорить название, поскольку обучен только допросу пленных, а не терминологии изящных искусств.\nТретий день качаю моего любимого T-Bone Walker \"The Complete Capitol Black & White Recording\" объёмом около 200 мегатонн.. простите, мегабайт. Очень медленно выдаёт вероятный противник свои секреты, однако. С этой точки зрения BearShare лучше потому что быстрее, но там меньше полных альбомов, зато больше россыпью.\nОднако плюс eMule в том, что каким-то непостижимым науке образом даже наполовину скачанный архив открывается, и из него можно слушать отдельные треки. \nКак говорил товарищ полковник, \"наука умеет много гитик!\"."
