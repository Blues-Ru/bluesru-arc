  subject: Наверное это будет интересно-"King Crimson fest".
  deleted: false
  text: "\"King Crimson Festival\" состоится в Москве 16 и 17 апреля в клубе \"Б2\"\n\nКомпания \"GreenWave Music\" с гордостью представляет \"King Crimson Festival\" с участием \"TU\" (Trey Gunn and Pat Mastelotto) в московском клубе \"Б2\" 16 и 17 апреля. \n\n\"King Crimson\", основоположники прогрессив-рока, впервые приехали в Россию в июне 2003 года. Концерты прошли очень удачно, в связи с чем компания \"GreenWave Music\" решила в 2004 году начать серию концертов нынешних и бывших участников команды \"King Crimson\" под общим названием \"King Crimson Festival\". Музыканты \"King Crimson\" принимают участие во множестве проектов, играя буквально все - от нео-джаза и импровизационной музыки до нью-металла. \n\nДуэт \"TU\" является половиной состава \"King Crimson\". Трей Ганн (Trey Gunn) признан лучшим в мире исполнителем на \"Warr Guitars\" (уникальные гитары, которые позволяют вести партии баса и гитары одновременно). У Трея Ганна есть свой проект -\"Trey Gunn Band\", который отличается электронным звучанием и театральными постановками на сцене. Пат Мастелотто - один из самых оригинальных барабанщиков мира. Пат использует электронную и акустическую перкуссию, сэмплеры и компьютеры. \n\n\"GreenWave Music\" собирается начать \"King Crimson Festival\" с двух концертов \"TU\". В каждом концерте примут участие специальные гости: польский авант-роковый дуэт \"Sonus Akrobata\", Сергей Калачев, Сергей Старостин, Сергей Клевенский и джазовые импровизаторы."
