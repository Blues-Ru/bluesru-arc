  text: 'Обнаружили мы сегодня в некоем сообщении официальных источников некое слово,
    доселе нам неведомое, оттого вдвойне приятно. Ну типа как новую планету открыли.
    Или новый вид съедобных грибов в милых нашему сердцу подмосковных лесах.


    Значится, так.. контекст в оргинале гласил: "несмотря на то, что в блюзИ, как
    правило, поется о грусти". Отсюда вывод, что официальный источник измыслил жанр
    под названием "Блюзь", женского рода, ну типа как "Песнь" или "Быль". Или что-то
    вообще эвфемическое, аллюзивное и коннотативное, не поймите меня правильно.


    С чем всех нас и поздравляем. Теперь мы знаем, как правильно именовать блюз, исполняемый
    на бескрайних просторах наших клубных сцен.'
