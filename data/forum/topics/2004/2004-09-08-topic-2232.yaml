  text: За время общения с господами-музыкантами пришел к довольно печальному выводу.Некоторые(и к сожалению их немало) так и норовят плюнуть в душу своими действиями,а точнее бездействиями. Четыре плевка выдержал,думал про простоте душевной - так неувязочка. !!!НАДОЕЛО!!! Один после получения записи ушел в тину,другой скоро уж два года не может найти время(это ж как надо быть занятым) чтобы определиться что можно выложить(а ведь с его же слов получилось неплохо),третий извиняется...через год,ссылаясь на отсутствие интернета, телефона, телеграфа итд,четвертый - на отсутствие памяти. А по мелочи(относительной) так и вообще не сосчитать.Друзья мои с совестью у вас плохо,а мнение о собственной значимости,напротив,сильно преувеличено. То что я, отдавая эти записи,которые кстати превращиются в демо и даже! в пластинки для продажи, ничего не требую взамен кроме названия произведений которые можно выложить на BluesmAn.ru,совершенно не значит что я это делаю легко и просто минут за пять. Как тут недавно сказал один "Ерунда это все. Как слышится так и пишется". Так вот -лично мне это стоит больших усилий. Уже слышу возгласы типа "Если так все плохо иди на пенсию". Успею. Во-первых мне это нравится делать,во вторых просто хочется помочь пробить дорогу нормальной музыке,в червертых с деньгами-то у всех туго и лучше пусть уж сэкономленые деньги уйдудт в аппаратуру и прочее.Я мыслил примерно так как-то .Но похоже то что достается легко и бесплатно не достойно даже малейшего уважения. Жаль. Терперь записи и прочее- только в MP3 и в качестве непригодном для демо или продажи.   Смело надеюсь на понимание и продолжение сотрудничества.
