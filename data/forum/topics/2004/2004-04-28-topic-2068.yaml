    subject: бывал однажды
    deleted: false
    text: 'Довелось в конце декабря присутствовать на закрытом концерте. Пафосно средне, смокинг можно не надевать, но вообще
      это скорее развлекательный центр, чем просто клуб. Боулинг этажом выше, различные точки где поесть и прочее. Концертный
      зал, впрочем, вполне себе отдельно, и бар, кажется, там же предусмотрен. Зал сам по себе вместительный и звук отстроен
      был неплохо.

      Почем билеты, не скажу - в тот раз прошёл на правах своего от группы. Думаю, можно справиться по телефонам клуба (095)
      253-0253, 253-2121.'
