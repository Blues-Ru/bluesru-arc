                          deleted: false
                          text: "Конечно, русская музыкальная культура - оставила свой след в мировой :-)Особенно - в 19 веке, начале 20 го. \nРечь и идет о том. То что КСП (движение, к которому указанный Булат Окуджава никогда не имел отношения, и всячески открещивался от попыток его туда притянуть) не основана на \"традициях русской музыкальной культуры\" (увы). А основана - на примитиве - ритмическом и гармоническом. К которому на умняке - пришивали иногда хорошую поэзию (до сих пор меня коробит от Бродского переложенного на эту тупую схему)\nСтебался я стебался. Над попытками сравнивать \"мягкое с кислым\".\nЭто - беда нашего народа. На протяжении 80 лет полностью уничтожена народная музыка. Полностью уничтожена духовная музыка и вокальная школа с ней связанная. Бабки не поют колыбельных внукам. Женщины не поют когда моют посуду или стирают (или вышивают). Мужики не поют за работой.\nВместо всего этого - приходит суррогат. Люди не поющие с 3 лет в церковном хоре мальчиков готовы воспринимать только попсовый примитив.  Наша \"эстрадная песня\", убогий рок, КСП и \"руский шансон\" - это и есть тот самый заменитель, примитивный заменитель нормальной музыкальной культуры.\nЗа последние 80 лет мировая музыка ушла далеко вперед. А мы, попрежнему гордимся только Чайковским и остатками с той поры. И рубим свои три аккорда с ля минора. Мимо нас прошел джаз. Ушел рок.О блюзе - до сих пор у мнеогих представление по песням Розенбаума и Макаревича с Гребенщиковым :-) (ей, ей, многие таки и думают, что \"мочалкин блюз\" - это блюз :-/)\nЗа то, я и люблю наших блюзменов, что в этой вкусовой помойке пытаются играть такую музыку. И уж научились играть, поверьте, весьма прилично научились. Нет сравнимых по качеству у нас ни в роке, не в попсе, ни тем более - в КСП\nМожет быть я бы и среагировал спокойно - если бы сравнили блюзовую тусовку с фолковой темой (Старостин, Шилклопер и т.п.) Там - тоже ребята играть научились и серьезно занимаются музокой. Или джазовая - Бутман и иже с ним. Но - уж точно, не с КСП или там \"шансоном\"\nИ давайте закроем здесь эту тему о КСП, не интересная и не уместная она. Здесь о блюзе говорить принято.\nЗЫ и пожалуйста - не рекомендуйте мне слушать Вертинского или Петра Лещенко, Высоцкого или Аркашу Северного. Это все совсем другая история. Не имеющая с КСП никакой связи."
