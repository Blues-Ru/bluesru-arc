        text: 'на самом-то деле, это я так от злобных спамеров пытаюсь улизнуть :о)

          хотя и не знаю точно, действенный это способ али нет :о|

          По Москве закончился фильм в 02:40, у нас в это время было 03:40. Сразу же начал качать песни из фильма. Да уж... Цепанул меня саундтрек. Особенно понравились 3 песни:

          I Am a Man of Constant Sorrow (Soggy Bottom Boys & Dan Tyminski) - та песня, которую они, Soggy Bottom Boys, записали в студии, которая стала очень популярной в штате Миссиссиппи.

          Didn''t Leave Nobody but the Baby (Emmylou Harris, Alison Krauss, Gillian Welch) - три девушки (сирены) полощут белье и охмуряют наших ребят.

          O Death (Ralph Stanley) - сборище Ку-Клукс-Клановцев, кандидат в губернаторы штата поёт акапелльно. Жутковатенький (даже малехо страшненький) момент.

          Такой моментик: я нашёл две версии Man of Constant Sorrow: Radio Station Version (с мандолиной, слайд-гитарой и скрипкой) и та которая была первой в фильме, под гитару того чёрного парня Тони Джонсона (намёк на Роберта :))) Но оба трека поцоканы: местами как будто воспроизводятся с неимоверно высокой скоростью.

          Ну, бог с Radio Station версией, а вот с Тони Джонсоном...

          Может, кто поможет с поиском этой песни? Очень хочется её нормально послухать.'
