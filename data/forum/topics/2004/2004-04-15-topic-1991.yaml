      text: Как ни тяжело это говорить,но...Я безумно хорошо отношусь к Доку и к Мишурису,это обаятельнейшие,умные и совершенно не заносчивые люди,играют всегда от души,это им в кайф,все прекрасно,пока...Не пришел домой и не послушал записи ихних блюзменов.После этого впечатление как-то сразу меняется.Иногда оно меняется и тут же,в клубе.Был момент,когда призжали Roomful of blues,и кто-то из наших любителей сказал,что Мишурис лучше этой группы.Когда я сказал ему об этом,то он улыбнулся и заявил,что это несерьезно.К сожалению,практически нет до сих пор такого въедливого,с хорошей грустинкой блюза,а попытки его исполнить за редчайшим исключением оборачиваются занудной тягомотиной.Лучше удаются всякие буги-вуги,да и то отдает чаще всего дворовостью.Вокальные данные и Мишуриса,и Дока оставляют желать лучшего.Очень мне неприятно и тяжело это говорить,но,как говориться,истина дороже.Понятно,что у нас 7 месяцев в году зима,менталитет и музыкальная культура не та,да и клубов с хорошей акустикой раз-два и обчелся,а все-равно как-то жалко.А Мишурису и Доку я искренне желаю удачи,не отдавать же арену совсем уж примитивным и дурацким группам.А насчет дырочки в правом боку Никитинских так я в 80-х прекрасно растил ребенка под эту музыку и вполне можно сочетать КСП и блюз с джазом,хотя,конечно,в более зрелом возрасте впечатление от настоящего джаза с блюзом гораздо ярче,чем от КСП.Прошу извинить,если кого обидел.
