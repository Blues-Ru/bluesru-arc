                      text: "Конечно ошибаюсь. Все - от непонимания. Вот, вы говорите Сергей Никитин. Для меня он - скверный исполнитель, надуманная псевдоинтелегентщина, сплошной плагиат и убогость музыкального мышления. Плюс - дешевые приемчики на публику. Или там Визбор. Костер, сосны, никогда не понимал колективного туризма в мошку.\nНо, как и с \"Евгением Онегиным\" - это просто скудость моего восприятия я полагаю. Вот, есть такая певица - Ахонькова. Все при ней - бюст 6 номер и все такое. А я вот не въезжаю, и все тут. Вкус испорчен. Возможно - блюзом. Да, еще и джазом. А классика и фолк - заполировали мое неприятие КСП даже а лучших ее представительствах. \nА тут, подсчитал сколько у меня вариантов \"Летней поры\" Гершвина. Оказалось - всего. 28. И все такие... разные что-ли. И вот думаю, это сколько народу не смогли придумать что-то свое (хоть убогое, в ля миноре) ПЭртили ПЭСняк своими кривыми (иногда так просто черными ) руками. \nВы уж простите меня, я в музыке - плохо разбираюсь, особенно в КСП. Ну, совсем, совсем не въезжаю. Пытался как-то, прослушал \"под музыку Вивальди\" аж 16 раз подряд. Не проняло. Нет, в смысле достало на физеологическом уровне, но совсем не так, чтобы это могло понравится.\nКак и с Ахоньковой. Ну, т.е.овсем никак.\nНу, милее мне Mississippi Fred McDowell или там Blind Willie McTell. Или там Nina Simone не имеющая такого бюста как Ахонькова и не умеющая петь так слащаво как Никитины. При всем к ним моем уважении и осознании собственной убогости.\nА по поводу нового. Блюз, при всей его \"перепетости\" явился основой двух мощнейших музыкальных течений XX века. Я боюсь, КСП, не оставит своего следа. Во всяком случае - до сих пор, сколь нибудь заметного влияния на мировую тенденцию в музыке я не услышал.\nНу, будем ждать. Может Рыженко чего и напишет. Столь же значимое как блюз. Для мировой музыкальной культуры... :-)"
