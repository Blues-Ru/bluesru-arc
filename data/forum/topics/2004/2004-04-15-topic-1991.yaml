    deleted: false
    text: 'о котором так восторженно говорилось на форуме. Песни. Блюз. Да он должен быть таким, но о нем таком действительным участникам событий совсем не хочется вспоминать. Для нас это грустная душевная музыка с четким ритмом – для них – ритм, под который гнули спину 18 часов в сутки на жаре, а потом размышляли о том от чего оторвали, что кажется пределом мечтаний … далее все напоминает отечественные рассказы о труде зеков. Всем нужна бесплатная рабочая сила. Я неоднократно видела вдали от человеческих поселений следы их труда: проложенные в непонятном направлении линии электропередач и дороги, заканчивающиеся ничем (парой нежилых бараков на 30 человек при сильном уплотнении), видела общие могилы посреди редкоствольной тайги. Ну и Беломоро-Балтийский канал конечно. Да, это блюз, это его атмосфера. У нас чуть в другой форме, наверное Галича, но общие ощущения… А mr. Картер был цельный человек…

      Теперь о самом фильме. Слишком легкие, отвлеченные «голливудские» решения для серьезных проблем, например, куклус-клана. Сценарий слишком прост, скучен. Сначала  и до конца напоминает «Тупой – еще тупее».  Итог слишком понятен. До «Одиссеи» далеко-о! Картинка ничего. Уменьшение насыщенности цвета всегда идет на пользу. Есть еще эффект «старинной фотографии», пыли там добавить, коричневых оттенков. Ну «сказка» , во всех смыслах. А про лягушку – понравилось – дурацкий, но забавный момент. Это личное мнение.

      P.S.Про авторскую песню: там тоже много чего хорошего. Не обижайте зря.'
