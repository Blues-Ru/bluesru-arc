  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70401110458192819&sql=A8fdsa9ygb23g


    Это второй альбом этого шикарного дуэта. Как и первый, он издан на Rounder Records.
    Как и на первом, тут много классных музыкантов. На гитаре конечно же сам Рай Кудер.
    На басу великолепный Чак Рэйни!!! Спунэр Олдэм играет на клавишах, Регги МакБрайд
    играет на басу в половине композиций. Классный звук, отличные аранжировки и игра
    группы. Духовая секция добавляет удовольствия! Стоит ли говорить, что вокалисты
    поют так, что дух захватывает! Музыка довольно разнообразная, в названии альбома
    перечислены стили.


    Оценка 3 балла. Есть проблемы с материалом. Не хватает яркости первого альбома.
    В некоторых песнях всплывает дурацкий звук и продакшн 80-х, звучит это довольно
    странно. В целом же диск очень интересный и очень бодрый.'
