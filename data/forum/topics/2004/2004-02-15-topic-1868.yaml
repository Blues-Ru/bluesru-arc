  text: 'В ознаменование своего 140-летия в субботу 14-го февраля московский зоопарк уже в который раз принимал под своей крышей блюзовую тусовку. В этот вечер в «Тик-Таке» собрались харперы. Гостеприимность и доброжелательность хауз-бэнда под бессменным предводительством Юрия Каверкина обеспечили тёплую домашнюю обстановку, но рулили всем, конечно же, гармошечники во главе с Blacky. Они в прямом смысле слова, взяв власть в свои лёгкие, «делали игру», заказывая тональности, ритмический рисунок и конкретные вещи, а Юрий & Сo лишь податливо, но со вкусом отзывались на все их инициативы и пожелания. О московских харперах в определённых кругах существует точка зрения (да не обидятся на меня конкретные представители харперской диаспоры), что это «злобные и склочные существа». Субботнее мероприятие показало обратное: всё прошло приятно и в высшей степени дружелюбно. Впервые (по крайней мере для меня) на сцене появились девушки-харперши, кои пришли в количестве 2. Были допущены к таинству джемования и представители других дудящих конфессий: кларнетист, флейтист (необычная, правда, какая-то флейта была) и др.


    В следующий раз «Тик-Так» заключит в свои звериные объятия гитаристов.


    Чёрт возьми, почему не бывает клавишных джемов?! ;)'
