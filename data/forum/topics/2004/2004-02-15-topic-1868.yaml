    deleted: false
    text: 'Очень понравился доброжелательный и талантливый хоум-бенд(поблагодарил бы всех лично, но сомневаюсь в написании фамилии барабанщика %).

      Поиграли в полное свое удовольствие. Все вещи интересные и классные. Если харперы ошибались на сцене, то спасибо бэнду - поддержали, где нужно дожали, где нужно - врезали! Получилось замечательно.

      И послушать было кого - Владимиров зажигал по полной. Чумовой Train с элементами Чистякова и бутылочным соло просто супер. В общем - класс.


      P.S. А что касается злобных и склочных харперов - бывает, конечно. Но мы будем стараться! Ведь без таких джемов и спокойного, приятного общения с командами вроде Wrong Way и не разовьешь в себе умения играть в коллективе.'
