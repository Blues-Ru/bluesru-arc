  text: '"Блюзовый гитарист и певец Guitar Slim (Eddie Jones) записал лишь один хит
    - The Things That I Used To Do - #1 R&B. Джонс, один из артистов, известных под
    именем Guitar Slim (другие два, Alexander Seward и Norman Green были известны
    еще за двадцать лет до него), работал с новоорлеанским пианистом Huey "Piano"
    Smith еще в 40-х.'
