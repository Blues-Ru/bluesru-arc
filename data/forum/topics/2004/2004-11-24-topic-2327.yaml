  text: 'Поменяв не одну выпускающую фирму, пройдя через многолетнее сотрудничество с Blind Pig Records, Deborah Coleman по каким-то причинам перешла под крыло Telarc Records и не ошиблась. «What About Love?» выстрелил так, как будто запас энергии копился многие годы. На самом же деле за менее чем 9 лет профессиональной работы ему предшествовали 6 альбомов, вышедшие с интервалом в год-два. А началось всё с первого места на Charleston (S.C.) Blues Festival’s National Talent Search, призом которого являлось время на провинциальной New Moon Records, где Deborah Coleman и записала свой первый альбом «Takin’ A Stand» (1995). Однако, это было лишь началом успеха, пришедшим с «What About Love?» Даже по сравнению с «Livin’ On Love» (2001), за который Deborah Coleman была номинирована на W.C.Handy Award, чувствуется огромная разница.


    Из 11 треков 4 оригинальные, но остальные, к великому удовольствию, совсем незаезженные. Здесь нет золотых хитов блюза и фанка, удалось не сорваться и в буги. «What About Love?» - это золотая середина. Новый чистый звук, гораздо более энергичная подача, привычный для музыки soul специфический вокал с приятным вибрато, ставший по-настоящему заметным лишь теперь, характеризуют новый альбом Deborah Coleman.

    А открывается он авторским боевиком «Bad Boy», слушая который оказываешься под музыкальными чарами Deborah Coleman. Дальше – больше: грув Hammond B3 вплетается в классические гитарные линии, создавая живой плотный саунд. Но так лишь на ряде вещей («When Will I Be Loved?», «Loves Like Rain», «Lookin’ for a Real Love»). «Lie No Better» уже ближе к фанку. Авторская «The Rivel Wild» и вовсе в стилистике J.J.Cale или M.Knopfler. Не обошлось на альбоме и без медленных вещей («Can You Hear Me?», «A Woman in Love»). Заглавная вещь «What About Love?» стоит лишь под номером 8 и, можно сказать, что она всей своей блюз-роковой мелодичностью подводит итог, после которого ещё последует не менее вкусный заключительный блок.'
