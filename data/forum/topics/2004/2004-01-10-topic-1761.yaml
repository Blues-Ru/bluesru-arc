  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDSUB040401092251192641&sql=A2mkcu3t5andk


    Скучный, монотонный, безыдейный альбом группы! Это только второй диск Шэка, но что-то уже не то. Почти все песни - одинаковые тоскливые блюзы "а ля Чикаго" не о чем. Между песнями идиотские шутки непонятно для кого и зачем. Дудки играют странно и мутно. Какие-то признаки жизни и музыки появляются лишь на шестом!!! треке Кристины Перфект A Woman Is The Blues! Без нее этот диск имел бы оценку НОЛЬ; она отлично играет на пианино и поет! Стэн Уэбб поет очень странно и искусственно; даже странно, что именно этот диск побывал в Топ-10 английского хит-парада.


    Оценка 2 балла! Оба балла Кристине и Майку Вернону за приличный звук и продюсерство. Можно выделить лишь A Woman Is The Blues и I Wanna See My Baby. Странное совпадение, у Флидвуд Мэк был шикарный первый альбом, а потом СКУЧНЫЙ и МОНОТОННЫЙ второй! Они тоже писАлись на Blue Horizon с Майком Верноном, а на пианино у них играла та же Кристина. Думаю, что достаточно иметь лишь дебютный альбом Чикен Шэк 1968 года в своей коллекции!


    http://www.amazon.co.uk/exec/obidos/ASIN/B000025RSJ/qid=1073707840/sr=1-4/ref=sr_1_10_4/026-9763582-7674863

    Европейское издание имеет другую обложку, обратите внимание!'
