    text: 'отметить вчерашний день серьёзной репетицией за полночь и сочиненим новой композиции. Ещё как раз работали над Ball-n-Chain, гравировали, так сказать. Композиция достойна того, чтобы её не заигрывать, а вдыхать в неё всё новые идеи и эмоции. После 7 месяцев исполнения её мы хотели уж отказаться - хватит, наигрались...но что-то щёлкнуло внутри нас и теперь уже мы с новой любовью играем B-n-C.

