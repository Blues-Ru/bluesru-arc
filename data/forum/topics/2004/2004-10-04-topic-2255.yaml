  text: "Сегодня тридцатичетырехлетняя годовщина смерти Janis Joplin.  34 года! Неужели?   Я вырастал около города Сан Франсиско, и имеел честь видеть и слушать Janis на сцене с Big Brother and the Holding Company.\n\nЯ особенно вспоминаю, как она исполняла Ball and Chain.  Она украла эту штуку у Big Mama Thornton.  Но сделала ее своей собстенностью.  Big Mama Thornton просто эту песню потеряла.  Никакая запись не улавливает полностью, что Janis могла сделать с ней.  Всю свою душу она вкладывала в Ball and Chain.  После этого стало нечего петь, нечего слушать. \n\nКажется, что в России есть интерес к Janis Joplin. Да?  Я был очень удивлен услышать, как хорошо Оксана Кочубей поет в ее манере.\n\nСегодня я выпью один виски за Janis.  Она же любила это дело.  Но ее напиток (сладкий Американский виски Southern Comfort) терпеть не могу. :)\n\nMuddy"
