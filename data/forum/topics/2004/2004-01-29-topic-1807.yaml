  text: "Фестиваль \n \nПраздник, который два дня с тобой \nБлюзовые фестивали в Москве давно уже перестали быть редкостью - энергичные блюзмены из компании \"Другая Музыка\" то и дело организовывают какие-нибудь мероприятия, размах которых в последнее время становится все более и более внушительным. В 2003-м году был и фестиваль Blues.ru'03, и огромный \"Очаково-блюз\", длившийся целую неделю и закончившийся грандиозным галаконцертом на стадионе \"Динамо\" (кстати, под его \"шапкой\" будет проходить и нынешнее мероприятие), и множество отдельных концертов наших и зарубежных знаменитостей. В ближайшие выходные на уже привычной площадке ЦДХ пройдет двухдневный гитарный фестиваль. Гитара во всех своих видах является для блюза инструментом не менее важным, чем губная гармошка - между тем, харп-фестивалей в Москве состоялось уже целых шесть, а вот гитарный пройдет впервые. Обещает он быть очень насыщенным и представительным, так что должен стать для посетителей настоящим музыкальным праздником.\n Участие в фестивале примут почти все заметные русские блюзовые гитаристы - кого ни вспомнишь, все будут. И \"зубр\" Сергей Воронов (лидер группы Crossroadz), и создатель самой востребованной на родине блюза русской группы Blues cousins Леван Ломидзе, и известный по огромному количеству проектов Иван Жук (проект Федора Чистякова Bayan, harp & blues; Станция Мир), и один из главных подвижников \"архаичного\" блюза Борис Булкин (Stainless blues band). Перечислять можно долго - придут и хранитель блюзовых традиций Юрий Каверкин, и Гия Дзагнидзе (гитарист Modern blues band, созданного легендарным Михаилом Петровичем Соколовым), и Николай Садиков (the music hammer band), и Вадим Иващенко (Mishouris And His Swinging Orchestra).\n\nВпрочем, фестиваль будет вовсе не сугубо московским - на сцене ЦДХ поиграет Владимир Демьянов из уже полюбившейся столичным ценителям блюза екатеринбургской группы Blues doctors, организаторы обещали и белорусских музыкантов. В общем, будет на что посмотреть и кого послушать. Ожидать можно всего, чего душа любителя гитарного блюза пожелает - сольных номеров, групповых сетов и, конечно, многочисленных джемов самых непредсказуемых составов.\n\n Впрочем, гитара - это инструмент, конечно, не только блюзовый. И день блюзовой гитары будет только первым днем фестиваля. А вот 1 февраля на той же сцене выступят музыканты, которые умеют извлекать из этого инструмента совсем другие звуки. Дмитрия Малолетова, например, вообще можно назвать дипломированным специалистом - он написал несколько книг о том, как наиболее прогрессивно играть на гитаре. Самобытный дуэт Белый острог (электроакустическая гитара и электроакустическая скрипка) в России бывает не так уж и часто - постоянным местом жительства музыкантов сейчас является Нью-Йорк, да и вообще их творчество очень востребовано за рубежом, так что упускать возможность послушать Белый острог в Москве не стоит. Во второй день обещают ещё Акустик-бэнд, Дмитрия Четвергова и Елену Сигалову, а называться все это будет \"день прогрессивной гитарной музыки\".\n\nНо и на этом составляющие предстоящего пира звука не заканчиваются. После первого (\"блюзового\") дня организаторы обещают отвезти всех желающих на специальном транспорте из ЦДХ в клуб \"Паровоз\", где музыкальные увеселения будут продолжены в более камерной обстановке. Дистанция между слушателями и музыкантами сократится до предела, а джемы и импровизации станут ещё более душевными. На самом деле, ничего особенно удивительного в этом нет: как-никак, праздник все-таки. \n\nГитарный фестиваль\n31 января - 1 февраля\nЦДХ\nначало концертов в 18.30"
