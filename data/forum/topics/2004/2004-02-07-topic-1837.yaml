        deleted: false
        text: "первое ощущение , когда слушаешь - остро не хватает видеоизображения.\nНет , конечно все сделано замечательно\
          \ но все таки чего -такое есть , что мешает воспринимать все услышанное как real blues music. \n Мне кажется что\
          \ оценка \"3\" поставленная Димой оправдано прежде всего тем, что Кудер тут  играет \"всего-лишь\" как профессиональный\
          \ музыкант а не как настоящий блюзмен. \nСужу исключительно по себе - собственно то и Кудера начал слушать из -за\
          \ CROSSROADS. И таки понял, что парень раскрылся полностью не на этом альбоме а на упомянутом Chiken Skin Music\
          \ - который мне понравился целиком сразу  полностью и навсегда.\n\nМое резуме таково . Для Кудера блюз (внимание\
          \ не хочу вызвать бури возмущения ,это исключительно  мое мнение) одна из граней той музыкальной вселенной по которой\
          \ он путешествует. А то что души его в Chiken Skin Music больше чем в CROSSROADS так это однозначно."
