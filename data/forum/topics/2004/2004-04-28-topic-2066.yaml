    text: 'Публикация этих правил означает закрытие истории вопроса. Я не буду больше пытаться тебе объяснять зачем и почему я модерировал раньше, это бесполезно. Можешь считать, что я все делал неправильно. Однако с этого момента нельзя употреблять слово "б-га" через слово, бессмысленно выяснять, почему Казанцеву можно, а тебе нельзя и пр.

      Правило про уважительное отношение к чужому мнению оградит тебя от нападок, однако наложит на тебя самого очень жесткие ограничения, к которым ты, вероятно, не привык.

      Надеюсь, что публикация правил закроет нудные выяснения частных личных отношений, от которых у местной публики уже скулы воротит.'
