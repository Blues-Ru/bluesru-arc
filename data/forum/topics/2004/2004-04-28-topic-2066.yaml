  subject: Правила форума
  deleted: false
  text: "В связи с непрекращающимся бардаком возникла необходимость публикации правил. Правила могут быть разными, однако немаловажным фактором должно являться то, что они известны заранее, так что после их публикации модерирование должно производиться по всем понятным принципам. Итого:\n\n1) Не приветствуются сообщения, не имеющие отношения к тебе форума. Сообщения, имеющие хотя бы частичное отношение к теме, оффтопиком не считаются. Оффтопик в небольших количествах допускается, модерирование оффтопиков производится на усмотрение модератора. Перед модерированием следует просьба модератора закрыть тему.\n\n2) Запрещается все, что запрещено действующим законодательством. Также фашистские высказывания, экстремизм, расизм и пр.\n\n3) Запрещается реклама товаров, услуг и частные объявления. Реклама мероприятий и дисков, имеющих хотя бы минимальное отношение к блюзу, разрешается.\n\n4) Запрещается хамство и личные оскорбления по отношению к участникам форума. Оскорбление \"не участников\" является предметом форумной морали, но не законодательства. \n\n5) Запрещается неуважительное отношение к мнению и вкусам других участников форума. (* новое правило, раньше оно ни разу не декларировалось).\n\n6) Любые оценки любой музыки в любой форме разрешены, если это не противоречит другим правилам. Выражение отношение к музыке, вкусам и мнению других участников форума разрешено, если оно выражено в корректной форме.\n\n7) Разрешается употребление нецензурной лексики в небольших количествах, на нерегулярной основе. Употребление в больших количествах, в особо грубой форме, а также с нарушением пункта об оскорблении других участников, - запрещено. Допустимое количество  нецензурщины определяется модератором на его усмотрение. Перед применением санкций следует просьба остановиться.\n\n8) Нарушение правил одним из участников форума не дает права нарушать их другим участникам форума.\n\n9) Разрешены обсуждения правил и внесения в них изменений, однако любые изменения не имеют обратной силы.  \n\n10) Модератор вправе комментировать применение правил, однако делать это не обязан.\n\n11) В момент модерирования, т.е. удаления сообщений, модератор на свое усмотрение высылает текст удаляемого сообщения автору на указанный почтовый адрес с предложением откорректировать сообщение для удовлетворения правилам.\n\n12) Запрещается публикация сообщений анонимно или под поддельным именем в целях ввести посетителей форума в заблуждение относительно истинного авторства сообщений."
