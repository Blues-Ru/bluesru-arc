  text: "… и хрупкие своды «Forte» содрогнулись. Играла хард-рок команда «Balls Of Fire» с кем бы вы думали? А вот и не угадали ;)  С Машей Кац!\n\tИдя на этот концерт, я надеялся услышать то, что и как пела Маша в бытность групп «Maryland» и «Лига блюза», и что на афише, назвав себя хард-поп-рок группой, музыканты покривили душой. Ни фига преподобного! Честными оказались. Команда играет жёсткий хард (сорри за каламбурчик). Состав коллектива (по именам кроме Маши никого не знаю): 1 (МК) - вокал, бэк-вокал; 2 - гитара; 3 - гитара, вокал, бэк-вокал; 4 - бас, вокал, бэк-вокал; 5 - ударные. Ребята играют клёво, драйвово, но где же жемчужина – божественный машин вокал? За грохотом барабанов и рёвом гитар его фактически не было. Всё первое отделение Маша откровенно играла роль бэк-вокалистки, причём, из-за громкости, исчезни она, - можно было пропажи то и не заметить. Харизматичный басист-вокалист в кокетливой кепочке набекрень (он же, видимо, командир группы лесопилов) и обильно татуированный гитарист-вокалист – вот истинные герои первой сорокапятиминутки. И впал я в печаль. Слава свинкам, было ещё и второе отделение, и вот там то Маша развернулась. И всё равно было не так, как раньше: не было ни фанка, ни блюза, именно в которых способности певицы раскрывались наиболее полно. Тем не менее, хотите верьте, хотите – нет, но Маша Кац – это лучший женский голос нашей блюз-роковой сцены. Наверное, некорректно сравнивать дам, но все прочие поющие барышни по сравнению с ней просто дети. Очень странно, что такая замечательная вокалистка по каким-то неведомым мне причинам не участвовала в фестивале «Lady Blues». Аргумент, что, дескать. Сейчас Маша поёт совершенно не блюз, несерьёзен, поскольку и Инесс, и Тина Кузнецова тоже выступали, насколько я понял, в общем, с не блюзовой или c не совсем блюзовой программой. Жаль, что в проекте «Balls Of Fire» ей до конца реализовываться вряд ли удастся."
