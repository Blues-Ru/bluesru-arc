    text: "Сразу уточню две вещи:\n1)\tпопала только на конец концерта (застала Чистякова с Герасимовым, Блюз Докторз, Силю\
      \ и Станцию Мир+Чистяков)\n2)\tхорошо – потому что «для общего развития».\n***** (нехорошо короче;)) – потому что денег\
      \ за такое было бы жалко.\nПочитав отчёты, согласна с:\nГерасимов – скучно однако (возможна необъективность, ибо уже\
      \ в Бибике на джеме «маэстро» не впечатлил),\nЛетов – что-то не отсюда, но осталось желание как-нить послушать ещё!,\n\
      Докторз и правда как-то видимо уже по привычке попали в список – не то, приелись мэй би (опять же возможно дело не в\
      \ музыкантах),\nЧистяков – о чём спор? – однозначно нажрался!))) Да в принципе это не так важно;) Конечно ползанием\
      \ по полу и прыжками в наше время не удивишь, но непоклонники экстрима, думаю, этих фишек (в рамках блюзового действа)\
      \ слегка недопоняли.\nЧто было хорошего в конце-то концов? Понравился вроде бы в этот раз Кожекин, пока тоже не стал\
      \ крушить «родную-цэдэхушную» аппаратуру)) И не надо смеяться над «вроде бы»! Так сильно не понравился Силя, что всё\
      \ немногое, отмеченное в голове знаком «+», сошло на нет-нет и ещё раз нет – по числу исполненных вышеназванным автором\
      \ композиций. В этом плане отзывы webчан удивляют, но ... чур меня чур\nПосле концерта сделала вывод «Мне на такое ходить\
      \ не нада»))) Но это конечно с перепугу)) Вот интересно кстати, было ли такое в истории блюза, что зритель уходил с\
      \ концерта с подёргивающимися конечностями?)))) А народ и правда пришёл на Чистякова и после его выхода – часть публики\
      \ торопливо покинула зал. Оставшиеся требовали «Фё-до-ра!», впрочем как позже «Си-лю!» - из чего можно сделать вывод,\
      \ что хоть мероприятие и проходило под блюзовым стягом – публика пришла ОпрЕдЕлЁннАя и несмотря на вопли и нудятину\
      \ блюзолюбов – ОнА осталась довольна (чего и требовалось))."
