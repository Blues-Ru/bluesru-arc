  text: "Посмотрел недавно фильм \"Мир Призраков\" - трагикомический американский\
    \ фильм о самих себе и о одиночестве.\nОдин из главных героев - коллекционер и\
    \  поклонник блюза, на вопрос о 5 ценностях своей  жизни ответил:\n - традиционный\
    \ джаз;\n - блюз...дальше его прервали.\nСоветую посмотреть этот фильм всем любителям\
    \ хорошего кино и блюза, лично я  нашел в главном герое много \"своего\"\nкак\
    \ в плане отношения к жизни, так и к музыке ;)))))))))))).\nТак же интересна жизнь\
    \ американского коллекционера; фрагменты о блюзе в клубах  - акустику вытесняют\
    \ парни в дырявых\nджинсах, играющих нечто в стиле, наверное, какой-нибудь металлической\
    \ группы - можно характеризовать этот фильм еще как \n\"Мир заблуждений\" - жизненных\
    \ и музыкальных. :))))))))))))\nВот такое современное \"блюзовое\" кино.\nМожет\
    \ у кого-нибудь тоже есть какие-нибудь схожие впечатления.Интересно."
