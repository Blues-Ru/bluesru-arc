  text: 'Это очень слабо. БиБи совсем стар и не может петь и играть. У него классный гитарист, который играет ВСЁ, но больше слушать нечего. Голос хриплый, пальцы уже не слушаются (мимо нот и ритма), на лице выражение глубокого старика... Это уже не просто клоунада или кабаре-блюз, это еще плачевнее.


    Жалкое зрелище, но самый ужас начинается тогда, когда на сцену выходит уродец Джефф Бек! Вот это надо слушать! Это либо юмор такой, либо издевательство (он спецом играет АТОНАЛЬНЫЕ звуки в традиционных блюзах)! Просто омерзительно...


    Как же такое можно выпускать?'
