    deleted: false
    text: 'Интересно, что Mississippi Fred McDowell уже играл и выступал в 20-ых годах,
      но не имеел возможности записаться до 1959-г.  К счастью он после этого успел
      выпустить много прекрасных и своеобразных дисков.


      Он, пожалуй, самый сильный представитель жанра "Mississippi Hill Blues."  До
      войны этот жанр практически игнориловался музыкальными компаниями, которые искали
      блюзовых артистов в шт. Мississippi почти исключительно в Дельте или в городе
      Jackson.  Junior Kimborough особенно долго ждал своего "открытия" в 1980-ых
      годах.



      Muddy'
