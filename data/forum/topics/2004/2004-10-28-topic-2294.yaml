  text: 'Я человек на форуме новый,поэтому простите если что,но не даёт покоя вопрос: Почему никто не вспоминает о Jimi Hendrix? Ведь в своё время ему доводилось играть с Дж.Винтером и т.д., а знаменитый способ игры квакушкой он позаимствовал у Buddy Guy. SRV очень любил его творчество, а чего только стоят в его исполнении Voodoo Chile(4 композиция с альбома Electric Ladyland),Manish Boy (by Muddy Waters)с альбома Blues, можно долго перечислять.Пусть он немного психоделически это всё исполнял, но всётаки это блюз.Нельзя об это забывать.'
