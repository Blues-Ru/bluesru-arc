    text: "Почему Вы считаете, что о Jimi Hendrix забыли?   По-моему он не менее популярен сегодня, чем раньше.  Такое оригинальное и превосхондое  творчество не может забыться.  \n\nВы правы, что блюз и блюзовые традиции были в центре его искусства.  \nБлюз уже существовал хотя бы 60 лет до Hendrix.  Очень много уже было сиграно.  Но ничего похожего на Voodoo Chile не было.  Hendrix звучал, как блюзовая революция.\n\nMuddy"
