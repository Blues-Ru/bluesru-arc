    subject: Примич.
    deleted: false
    text: "Про Гарри: Пружинистая походка Гари, явно свидетельсвовала о том, что наши люди встретили и угостили человека перед концертом самым достойным образом. И тем не менее человек отыгрался и отпелся отлично. То что не было слышно голоса - это не его проблема, а звукачей в б-2. Гармозу он отрулил себе тоже... как мог, в общем.. В микрофон вокальный гармоха звучала куда ярче и живей. Звук, фразировка подача - всё очень клёво, по фирменному. Молодец, Гарри!\nВнешне Гарри мне напомнил водителя большого грузовика.\nпростой такой американский драйвер.\n\nПро группу: Какие-то они...умеренно-средне-холодные.. что-ли.. в барабанщике что-то есть, но пока непонятно.. кто знает, это его постоянный коллектив или он по объявлению набрал? Коллектива-то не чуствуется..\n\nпро репертуар: вполне, учитывая, что Гарри сам пишет музыку и слова.\n \nВцелом: хорошо, у нас действительно никто так играть не умеет. Поэтому большое спасибо людям, которые возят сюда таких музыкантов как Примич, показывают так сказать мировую культуру. Хватит уже вариться в собственном совковом соку. \n Всем рекомендую посетить его концерты сегодня-завтра.\n\nСовсем честно: Друзья мои, Пол Лэмб со своими КоролевскимиЗмеями нааамного покруче будет. Но это моё субъективное мнение!"
