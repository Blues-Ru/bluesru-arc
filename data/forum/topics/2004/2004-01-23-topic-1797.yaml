    deleted: false
    text: "мне понравилось... Не могу судить о технической стороне игры Примича на гармошке, но видно, что человек это делает искренне, весело...Да и остальные музыканты очень не плохи...Главное, что они сами балдеют от того что исполняют. Гитарист очень хорош - без выпендрежа лишнего...Хитрый такой гитарист. В первой же вещи мне показалось, что чувак слегка слажал во время соло, во второй тоже самое.....только на пятой или шестой (что не делает мне особой чести) я въехал, что это у него фишка такая - какой-то промежуточный пассажик на грани фола...\nБарабанщик, не смотря на возраст вполне вписывается в состав. Кстати, на его бизнес-карте написано, что он преподаватель, а не ученик....\nБасист играл скромно, но с хорошим звукоизвлечением...Может он тянул назад на предыдушем выступлении, но сегодня этого не наблюдалось.А самое главное, что все они работали на фронтмена, который прекрасно справляется со своей задачей. Пел очень искренне, даже душевно...\nИ голос у него вполне приличный, а уж о произношении я молчу - фирменнннннное!!!:-) Смайлик поставил!!!\nНе было особой виртуозности в игре и особых изысков в пении, а в принципе кому они на Х-Р (Федор! Комбики я не отвез,  по-этому выражаюсь мягко)нужны??? Был драйв (фиг его знает, что это),была подача....Примич явный мелодист в своей игре.\n Хорош был и Вовка Кожекин в последней вещи...\nНе знаю круче ли он Примича,но последний явно балдел от игры первого, что недвусмыслено выражал жизнерадостной физиономией...\nКороче, спасибо компании \"Другая Музыка\" за счастливое детство...в смысле...ну вы поняли....."
