      text: "первая половина вообще была скучновата и изза звука также. дейвительно на мой взгляд разошлись только под конец. брбанщик мне понравился :) ну тут я не объективен. :))) гитарист сначала играл както тяжело, а со второй половины разыгрался весьма. :) \nАндерс из Нокаутов, конечно в десять раз больший вирутоз и изощренец,\nно тут уже несколько другие приниципы всей музыки вообще :) \n\nНа гармошке так у нас _никто_ не играет. Даже Джон, который дейвительно мне тоже нравится больше всех :) Римтика - фразы,\nцельность звука - этого в таком размере нет ни у кого. сорри :) \nНа гитаре так - тоже никто не играет. Вадим - тоже монстр, но он играет совсем иначе - совсем. В таком стиле он не играет и такие темы и импровизации не выдает. у него совсем другая музыка звучит :) там он и молодец. \n\nчто касается всей группы целиком - так качественно  у нас никто не звучит. даже приблизительно.. ритмтика, динамика, цельность звука.. нет такого. :) и особенно ритмика в данных стилях - блюз, буги, свинг, шаффл... когда это у нас ктото играет обычно просто больно слушать. только у Мишуриса на мой взгяд нет таких детских болезней. у остальных у всех есть :) это мое личное мнение. :) \n\nесть более яркие по своей колбасности группы это да.. но музыка это или нет, это может для себя каждый слушатель сам решить :))\n\nвцелом концерт был более однообразен чем мнеб хотелось например :) \nно я пойду еще сегодня послушаю :) может еще чего напишу :)"
