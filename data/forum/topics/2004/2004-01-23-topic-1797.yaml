    subject: Примич
    deleted: false
    text: 'В Б-2 были проблемы со звуком в первом отделении, звукорежиссер слишком буквально понял просьбу Примича не отстраивать их как рок группу с задранной ритм-секцией, в результате барабанщик мучительно не мог расслышать бас и в части песен играл назад - это не фишка, а бага. ;) После того, как вставили три раза звукорежиссеру, а Дима Казанцев на великолепном английском выяснил отношения с барабанщиком, а потом по-русски с режиссером, сформулировав словами то, что смутно вертелось в голове у остальных ;), звук починился и второе отделение было очень удачным.

      В РБК с самого начала со звуком было лучше, поэтому ощущения от концерта были еще приятней. При отсутствии забойного драйва, который не свойственен этой немолодой группе, особое удовольствие мне доставили другие вещи - отличный вкус в голосе и соло гармоники, супер подобранные песни, очень интересная игра у гитариста. Shorty демонстрировал аккомпанимент на нетривиальные песни Примича, в стилях, которые у нас никто играть не пробовал, так что сравнивать с Иващенко, я бы не стал. Очень здорово, что на концертах удается получить кайф разного рода - забойный драйв на Морюдах, и относительно спокойный эстетизм и разнообразие на Примиче.

      Кстати, что интересно, Примич никогда не делает сет-листов, составляя концерт на ходу. Между песнями четкая пауза на 30 секунд, которая уходит на выбор гармошки, объяснение ритма барабанщику и вступление. В результате два уже прошедших концерта отличались примерно на треть по составу песен. Завтра в Форте!'
