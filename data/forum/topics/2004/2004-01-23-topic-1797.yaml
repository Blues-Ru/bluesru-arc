    text: 'все пишут о своих впечатлениях, но никакой конкретики и объективности.


      в первом отделении звука не было вообще; во втором исправили.

      программа очень однообразная; какое там смешение стилей?

      пение Примиче оставляет желать лучшего; все ОК, но скучно и однообразно.

      ритм-секция - ужас! драммер-тинейджер играл назад так, что чуть долю не поменял! басист непонятно что играл.

      никаких изюминок типа подпевок, соло, звуков, инструментов.

      шоу на нуле! гитарист похож на басиста из Стоунз, которого прибили гвоздями к полу.


      что же было хорошего?

      Примич шикарно играет на гармошке! Мало, вкусно, точно, сочно, все как я описывал в рецензтии!

      Гитарист - волшебник! Очень интересная и своеобразная игра на чистом звуке! Восторг!

      Были отличные песни! Я спросил его про Mama Don''t Tear My Clothes (моя любимая вещь Снукса); да, он обожает Иглина и Новый Орлеан! Было три-четыре таких композиции. Было несколько отличных блюзов; пол-программы было просто танцульками, конечно, но это обычное явление.


      И так, 3 балла за такой гиг! Бездуховность, глубина на нуле! Однообразие и нет шоу. Он как на дискотеке выступал; но это диктует публика.


      А теперь поставьте альбом 97 года! Эклектика, звуки, инструменты, песни - все на месте! Так что не надо мне говорить ПРО БЕЗОГОВОРОЧНОЕ преимущество живых выступлений! Я не был на концертах несколько лет, и еще раз убедился, что ОЧЕНЬ мало людей (в наше время) могут быть интересны ЛАЙВ.'
