            subject: Комплексный обед в Blue Note
            deleted: false
            text: "В Нью-Йорке клубов, где за вход берут $3 действительно крайне мало. В местах, где за вход вообще берут, цены начинаются где-то с $8, хотя бывает и $5.\n\nНо давайте не будем вводить людей в заблуждение. Вход в Blue Note стоит от $10 (ночные сеты и места у бара на обычных сетах) до $40-50 (супер крутые концерты). Обычно же билет за столиком стоит $25-30. Ничего в эту цену не входит, но клуб обязывает за дополнительную плату купить минимум два напитка по достаточно ломовым для Нью-Йорка ценам (~$6). Комплексные обеды существуют только по воскресеньям: Brunch is served from 11:30AM-4:00PM. $19.50 includes, brunch, the show and a drink. \n\nВ Terra Blues еще дешевле: Admission charge ranges from $5-$10 depending on who's playing. Правда и пиво там опять же $6.\n\nВо множестве баров музыка вообще бесплатная, но не очень дешевая выпивка.\n\nДа, ну и конечно, бывает, что все билеты проданы, но редко. Такие места, как Iridium, Blue Note, Birdland, Village Vanguard, обычно устраивают серии концертов. Одна и та же группа музыкантов играет несколько дней подряд по 2-3 сета в день. Так что достаточно зарезервировать место с утра или накануне."
