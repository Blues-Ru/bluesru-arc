  subject: Жаркое техасское лето в Б-2....
  deleted: false
  text: "Да это было именно так....в морозной и уже засыпающей Москве.\nПлотный лысыватый перец, совсем непохожий на фото на афише (как он мне потом объяснил 15 летней давности), сумел так зажечь зал, что иногда казалось ... все это происходит где-то в Техасе. \nПри всей калейдоскопической смеси стилей (техасский блюз,свинг, джаз)\nвсегда чувствовалась рука мастера -Гари Примича.Это такой  стиль, который я думаю лучше опишут специалисты...\nГитарист вне всяких похвал... иногда казалось, что ты попал на концерт\nджазового гитариста-виртуоза. Он мастерски выписывал джазовые гитарные партии... и вдруг взрыв губной гармошки Примича.\nБольшое спасибо ребята(\"Другая музыка\") за такого музыканта!!!!\nДа кстати, Примич продает на концертах свои CD( сам там прикупил и до поздней ночи слушал его). Господа, сходите (еще 3 три концерта)- не пожалеете."
