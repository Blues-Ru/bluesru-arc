    text: "Сразу предупрежу, что ушел с первой песни второго сета, но, мне кажется, мог все же составить впечатление.\n\nЧестно говоря, гитарист мне понравился меньше всех. Играл, на мой взгляд, вяло и формально. Джазовые гитаристы-виртуозы, это все же сильно другой уровень... да хотя бы технически, чтоб не говорить в таких труднодоказуемых субъективных категориях, как \"есть ему что сказать или нечего\". Вон, сходите разок в Ле Клуб, на какого-нибудь любого американского или европейского дж. г. - виртуоза, сравните:) По-моему, гитарист привозимых имых на Очаково-Блюз шведов был гораздо сильней.\n...Да в конце концов ЗАЧЕМ ОН ИГРАЛ СЗАДИ РИТМА, ВЫ МНЕ ОБЪЯСНИТЕ?!! :)\n\nРитм-секция играла удивительно нединамично (в плане \"то тише, то громче\"). Это как-то грустно. Но приятно было услышать то, что у наших барабанщиков есть у единиц, а за границей видимо просто обязательно для любого среднего профессионала - а именно знание старомодных ритмических ощущений. То есть у нас играют вместо шаффла либо джазовый свинг, либо 12\\8, быстрее или медленнее, а вот именно такой тяжеловатый шаффл вразвалку не умеет никто почему-то. Опять-таки вспомню по этому поводу барабанщика Blues Shaсks - он вот умел. Возвращаясь к барабанщику Примыча - меня, все же, пленило, как он в медленном номере играл мучительно назад, а вот Диме, помню, это показалось просто лажей. Не знаю. \n\nПение Примыча - было, хоть и, соглашусь, \"бездуховным\", но, что приятно, на сто процентов блюзово-уверенным, без моментов некоего, всегда свойственного современным белым блюзовым группам постмодернизма, я думаю, вы понимаете, о чем я. То есть ни полупародийная имитация черных, ни мучительная искренность \"да, я белый, и буду петь своим голосом\", а нормальное пение, как блюзовое, так и искреннее. Это - то чего нет ни у кого из наших групп, и видимо (судя по тем же опять немцам и шведам певшим, в общем-то в полурок-н-ролльной манере, правда это же джамп-блюз, там так наверно надо, я не разбираюсь),видимо, в Европе тоже, как минимум, редкость.\nВокал, в общем, не будучи main attraction, придавал всему мероприятию некоторую настоящесть, что очень важно.\n\nПро гармошку вот что скажу - был в БиБиКинге в среду, и наблюдал вблизи. Должен сказать со всей уверенностью - бывшие там же Братецкий и Кожекин играют техничнее! Четче и мощнее звукоизвлечение у наших-то пацанов! \nНо вот с некоторой общей музыкальностью у гостя из Америки сильно лучше. Играет три, четыре квадрата импровизации - и не скучно! Почему так? а есть такие вещи, как развитие соло, создание и разрешение напряжения, ритмического и мелодического, своевременное развлечение слушателя фишками и своевременное завлечение его внутрь музыкальной ткани отсутствием таковых, и т.д. - все это наш новый друг Гэри чувствует. Так что гармошка, как и ожидалось, порадовала сильнее всего - но о хорошем писать не так интересно.\nПойду щас, может, на гармоника.ру лучше, Кожекина и Братецкого поругаю - в сравнении с Примычем.\n\nВ общем и целом скажу такое свое мнение:\nОткровения, к сожалению, не было, но, конечно, уровень кабацких музыкантов в Америке несколько выше уровня кабацких музыкантов в Москве :)"
