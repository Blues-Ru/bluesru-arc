        Опоздала, пока приходила в себя акустическую часть не внимательно слышала. Знаю что Джексон играл на гитарке без фендеровских притензий, помимо прочего исполнял Джонсона и не лажал. Когда после него вышли Ночные коты, собственно решила, что больше ничего интересного для меня тут не будет - щас начнутся кривляния и работа на публику, музыка на второй план. - ФИГНЯ!)) Сколько там дяде Чарли? Мне сказали около 60. Как и соло-гитаристу. Вкратце о самых ярких моментах, ибо как сказала, в музыке ничего не понимаю)) В середине выступления старички поменялись: Чарли взял гитару (не без кривляния типа "что это такое"))) а гитарист дудел. И ведь зажгли! Кстати Чарли играет на баритон-гармошке, если кому интересно это важное уточнение))

