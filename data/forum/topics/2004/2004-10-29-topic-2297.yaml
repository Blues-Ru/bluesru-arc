    email: morozzz_ded@mail.ru
    subject: Здорово!
    deleted: false
    text: 'Было офигенно круто :)

      .

      Сначала про звук, пиво и прочую насущную мелочь.

      .

      Звук приличный, у сцены похуже, в глубине зала получше :) но и там и там все легко можно было различить :) Пиво - есть :) само собой Эфес, что-то вроде полтинника за поллитру. Публика - вполне адекватная :) никаких мордобоев, пинаний, расплескивания пиваса на головы мною замечено не было :)

      .

      Теперь, значиццо, рассказываю, как все проходило.

      .

      Первым выступал Фрутленд Джексон, большой черный мужик с акустикой. Я не знаток и любитель акустического блюза, но мне очень понравилось :) классно спел, правильно сыграл, даже немного зажег. Чуть-чуть картину подпортил выпущенный на сцену товарищ Владимиров, который неясно и не к месту подудел в гармошку пару песен. Но это фигня :) сам Фрунтленд крут по-любому; жалею, что опоздал на двадцать минут от начала.

      .

      Затем после выступления Фрутленда началось самое главное, для меня, во всяком случае :) - на сцену вышли Чарли Бейти с бандой. Вот это было просто здорово :) не знаю, как у меня голова и ноги не отвалились, все полтора часа я отстукивал и отмахивал ритм :) очень здоровская банда: подача, ритм, шоу - все на высочайшем уровне. Чарли Бейти - супермужик; он, правда, не играл почти своих фирменных изысканных и интереснейших фраз, не уходил в какие-то сложные импровизации, но это объясняется наверное спецификой Эфеса - как бы аудитории требовалось мясо - и мясо было выдано :) такое прямо реально замолотное поливалово, но без излишеств и ненужностей, четко и по делу.

      .

      Шоу у Найткэтсов клевое - разные там мегадиалоги Рика Эстрина с публикой, фишка с игрой за спиной, куча еще каких-то мелких приколов - вообщем, непафосных слов описать весь этот позитив у меня нет :) надо просто услышать, ощутить мощь и отчаянно потрястись в ритм, чтобы вкурить кайф :)

      .

      Последним выступал добрый черный дядька Майти Сэм МакКлин вместе с огромной бандой: дудки, клавишные и там все такое. Банда суперская, дудки здоровские, звучит все вместе отличнейшим образом. Сам Майти Сэм поет мощным приятным голосищем; придумывает слова на ходу, заджигает по-правильному и очень любит поговорить с публикой :) но песни всеми этими фишками он может затягивать минут на двадцать-тридцать в легкую :) начинает вещать про "снег, который должен скоро выпасть", про "как я тут всех блин люблю" и т.д. - конечно, это все прикольно :) но двадцать минут подряд такого словоблудия выдержать сложновато :)

      .

      Хотя, может, я просто лох и не догоняю фишки :) народ во всяком случае тащился и даже подпевал :)

      .

      Но это уже не важно :) в оченно хорошем настроении и состоянии глобального кайфа Эфес закончился и я поехал домой :) а утром и в самом деле пошел снег :)

      .

      Так что вот :) я счастлив :) а тем, кому что-то не понравилось, советую  искать проблемы в себе :) а не в Чарли Бейти или Майти Сэме :) у них вчера проблем точно не было :)'
