    poster: Андрей Ордальонов (Андрей PRG)
    email: peregnoy@mail.ru
    subject: '29.10.04: Эфесовский фестиваль. День второй.'
    deleted: false
    text: "В этот раз, как и два года назад, фестиваль проходил в «крокозябре» УСЗ «Дружба». Спортивные сооружения в принципе не располагают к прослушиванию «тонкой блюзовой материи», но, тем не менее, звук, свет, да и организация в целом были вполне на высоте. На боковых трибунах звук, конечно, был откровенно отстойным, ну да, собственно, а что ещё можно было ждать? У пульта звукрежа - тоже не фонтан, зато около самой сцены – на удивление прозрачный. И если у Little Charlie And The Nightcats басы всё же были мутноваты, то на Mighty Sam McClain звук стал очень и очень достойным. Программа строилась по уже накатанному плану, когда открывал концерт сет акустического музыканта, затем следовало выступление кого-то порезвее, а закрывало фестиваль что-то совсем уж зажигательное (например, в позапрошлом году это был наследный король zydeco C.J.Chenier).\n\nFruteland Jackson. Певец хлопковых плантаций и дельты Миссиссиппи. Когда он запел вкусом корневого блюза пропиталась, наверное, вся Дружба. Он привёз с собой запахи начала прошлого века. Кому надо, тот Jackson’а понял. Беда лишь в том, что большая часть пришедших на фестиваль – просто тусовщики, которым абсолютно всё равно подо что трясти своё тело. Примерно та же история была, к сожалению, и в прошлые годы.\n\nLittle Charlie And The Nightcats. Маленький Чарли - он же великий Charlie Baty вне всякого сомнения был шикарен. Что бы там ни говорили недоброжелатели, но его гитара великолепна. Эх, был бы я гитаристом.. А вот Rick Estrin – это уже в большей степени клоунада, чем музыка: кривлянье, гримасничанье, ужимки.. Вокал более чем скромный. Одной гармошки маловато будет. Вы скажете, ну, мужику за полтинник, надо сделать скидку на возраст. Да нет же, возраст тут не причём. Подача у Rick’а такая. Вон, возьмите того же Paul Lamb’а, разница же колоссальная. А ведь Paul - тоже уже отнюдь не мальчик. \nВ общем, если бы ни Little Charlie, то Ночные коты были бы для меня откровенно скучными.\n\nMighty Sam McClain. Выступление McClain’а началось с инструментальных вещей. Всё думалось, что вот сейчас из-за кулис выйдет он, но музыканты продолжали играть, а место перед микрофоном по-прежнему пустовало. Соло-гитарист почтительно топтался в глубине сцены, оставив возможность блистать Mighty Sam’у. Наконец на третьей или четвёртой вещи он появился. В пиджачном плаще и интеллигентных очках. Не блюз, конечно, это. А кто сказал, что должен быть исключительно блюз? Всё ведь, на самом-то деле, настолько переплетено, что зачастую трудно поддаётся классификации. Соул, соул на границе с госпелом, фанк, сдобренные грувом – это McClain, и это музыка для меня. «Солидный» клавишник, мощная свингующая духовая секция… Оркестр, да и только. Хотя бы ради того, что услышать McClain’a, стоило идти на фестиваль.\n\nПослесловие. А после феста случился «Дом у дороги», где в тот вечер выступал «Рэгтайм». Мы попали лишь на несколько последних вещей, но до чего же круто. Было дело - не понравились они мне на фесте Блюз-ру весной этого года. Но это, видать, было лишь раз. Теперь же - полная реабилитация."
