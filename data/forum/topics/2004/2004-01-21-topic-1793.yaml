  text: комментарий о форумщиках в скобках означал, что я хочу объяснить, зачем я скопировал текст с лицевой страницы и поместил
    его в форум. Недавно я поместил в новостях сайта подробный список номинантов Хэнди, возился с фиговыми таблицами, а на
    следующий день, без заморочек с хтм, список был вывешен здесь. Я так понял, что большинство форумщиков не смотрит на лицевую
    страницу. Не вижу в этом ничего ни для кого обидного. (если не считать потеряных хостов для сайта - а они часто бывают
    нужны для дела).
