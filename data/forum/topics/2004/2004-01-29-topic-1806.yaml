        text: "Потому что пришла мудрость.Кто был на концерте в Москве должен помнить, как он объяснил появление этого альбома. Это музыка из детства, из ранней молодости. Это переосмысливание себя самого. Достаточно вспомнить КАК он представил и КАК начали играть убойнейшую Whole Lotta Love - как старую песню \"откуда-то с Юга, из Дельты\", чем она всегда, собственно, и была - утяжеленным блюзом. \nТак что Великий Роберт - он старик, но не в смысле дряхлости, а в смысле мудрости."
