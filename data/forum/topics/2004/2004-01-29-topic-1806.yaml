    text: "Дим, ты наверное был на концерте RP в \"Олимпийском\"....\nТам как раз и игрались все чумовые треки с этого альбома.\nУ старика наверное открылось второе дыхание и это правильное дыхание.\nА его новая группа Strange Sensation - просто  великолепные музыканты.\nКстати хочу добавить у старого перца в 2003г. вышел очень хороший 2-й альбом \"Sixty Six to Timbuktu\" . Первый диск -это сборник с его номерных альбомов, а вот второй.... судите сами (раритеты с 1966 по 2003 гг.)\nDisc Two: \nYou'd Better Run - single 1966\nHey Joe - Band of Joy 1968\nFor What It's Worth - Band of Joy 1968\nOperator - Alexis Korner \"On the Move\" 1968\nRoad To The Sun \nPhiladelphia Baby - Porky's Revenge - Soundtrack 1983\nRed For Danger  \nLet's Have A Party - Last Temptation of Elvis - Soundtrack 1990\nHey Jayne - single I Believe/Great Spirit/Hey Jayne 1993\nLouie Louie - Wayne's World 2 - Soundtrack 1993\nNaked If I Want To - single Calling to You/Naked If I Want To/8.05 1993\n21 Years - single 29 Palms/21 Years/Dark Moon 1993\nIf It's Really Got To Be That Way - Adios Amigo - A Tribute to Arthur Alexander 1995\nRude World - Inner Flame 1997\nLittle Hands - More Oar - A Tribute to the Skip Spence - 1999\nLife Begins Again - Afro Celt Vol. III - Further In Time - 2001\nLet That Boogie Woogie Roll - Jools Holland & his Rhythm & Blues Orchestra - Small World Big Band Volume Two - 2002\nWin My Train Fare Home (live in Timbuktu) - 2003"
