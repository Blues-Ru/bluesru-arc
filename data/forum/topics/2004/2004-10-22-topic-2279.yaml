  text: "Это свершилось. Николай Садиков и «Blues Hammer Band» в его нынешнем составе выпустили свой первый альбом «Charter Flight». Презентация происходила 20 октября в Rhythm’n’Blues Cafe, что в Староваганьковском переулке. Удивительно, что послушать этот замечательный коллектив пришло очень мало представителей московской блюзовой тусовки. \n\nОткрыла концерт тягучая слайдовая заглавная вещь «Charter Flight Blues», которую Николай Садиков исполнил в одиночестве. Вообще же нынешний Blues Hammer Band – это сплав самых различных стилей. Тут и психоделический блюз, и вещи в джамп-н-свинговом ключе, и традиционные шаффлы, и рок-н-роллы. Но все они круто замешаны на джазе, для чего характерна заметная роль духовых инструментов (в т.ч. в концерте участвовал Олег Матвеев (саксофон/фагот в «Crazy Train»)). В отдельные моменты духовики (штатные и джемующие) на сцене имели даже численное преимущество. \n\nВ записи альбома принимали участие такие заметные фигуры московского блюза как Владимир Кожекин, Вадим Иващенко, Александр Братецкий, Александр Бородин, Сергей Капшин. Братья сколдеры пришли поджемовать с Blues Hammer Band и на концерт. Позже к ним присоединился «грассмейстер» Тимур Ведерников. А в качестве гостей были замечены Константин Никольский, Юрий Каверкин и Гия Дзагнидзе. \n\nКапля дёгтя вчерашнего концерта – это плоско-жёсткий звук, не распространявшийся по залу, а остающийся неизвестно где, видимо, из-за своеобразной акустики помещения, потому что в некоторых местах зала звук был вполне на уровне, и вялая отдача слушателей. Последнее всегда бывает особенно обидно. К сожалению, в первую очередь эти минусы были наиболее заметны на авторских вещах Николая.\nЭто, однако, частности. Чем же, прежде всего, заметен коллектив, так это какими-то внутренним и внешним лоском, можно сказать, отсутствием бесшабашности, которая присуща практически всем нашим блюзменам. Садиков, у меня лично, почему-то ассоциируется с Арамисом из трёх мушкетёров. Почему? Да кто ж знает. Может, виной тому внешняя утончённость, может, сценический образ. Однако всё это никак не сказывается на энергетике, с драйвом у группы всё в порядке. \n\nКроме этого, стоит заметить, что Садиков – один из немногих людей на нашей блюзовой сцене, которые не только играют каверы, но активно и успешно пишут и грамотно аранжируют свои вещи (из 11 песен альбома лишь 3 кавера). При этом исторически Садиков совсем не музыкант. В шальные во всех отношениях 90-е годы Николай бросил престижную работу на телевидении ради того, чтобы целиком посвятить себя музыке. Результат, как говорится, налицо.\n\nКак сказал открывавший концерт Алексей Калачёв aka Dr.Blues, «Николай Садиков и Blues Hammer Band входят в пятёрку лучших отечественных блюзовых да и вообще эстрадных коллективов». На мой взгляд, столь высокая оценка абсолютно заслужена."
