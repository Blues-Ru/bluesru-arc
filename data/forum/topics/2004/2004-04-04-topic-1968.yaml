  text: 'Сегодня вечером сходил на их концерт в БиБиКинг, у меня остались очень приятные
    впечатления. ;) Группе нужно еще много заниматься, но то, что они играют, интересно
    - группа пытается играть свою любимую музыку, что редко встречается среди наших
    исполнителей. Отдельно очень хочется похвалить Вову - больше никакой нечленораздельной
    духовности в стиле Бадди Гая, вместо этого - расчетливые, аккуратные, выученные
    соло, ничего лишнего и пр. ;) Чтобы сделать хорошую группу, нужно помимо таланта
    и затраченных усилий быть адекватным человеком. LJC в этом смысле - редкое исключение.


    Отдельно хочется с приятным чувством похвалить БиБиКинг - новая сцена, задраппированная
    черной тканью, замечетельно отделяет оазис духовности от питейной части, что создает
    какую-то атмосферу пииета к исполнителям. Здорово! ;)))'
