        text: 'Путаница какая то. Играть расслабленно - это разве плохо? Собственно
          этим на мой взгляд и отличаются белые музыканты - что не умеют играть "расслабленно".
          Играют блюз словно делают трудное и тяжелое дело - типа десятка кирпичей
          по лестнице на 9 этаж.

          Или ты чего другое имел ввиду? :-)'
        replies:
        - id: 17878
          parent_id: 17865
          date: 2004-04-05 19:47
          poster: Федор Романенко (fedor)
          email: fedor@blues.ru
          subject: Разум и Чувства
          deleted: false
          text: "Ну про белые-черные, расслабленно-напряженно - это слишком условная\
            \ схема. Я имел в виду другое - соотношение отрепетированной части и потока\
            \ импровизации на полную катушку. Многие любители блюза считают, что заморачиваться\
            \ рассчетливым разучиванием песен не стоит, лучше подождать вдохновения\
            \ и сыграть самое лучше спонтанное соло в своей жизни, в котором выразить\
            \ все, что знаешь и чувствуешь, если повезет. А играть всю песню какой-то\
            \ простой рифф, скажем, - это приземленно, излишнее внимание к несущественным\
            \ деталям (фишкам, как их еще называют), когда нужно сыграть о главном,\
            \ по-возможности, спонтанно, без подготовки. Отсюда и чрезмерная любовь\
            \ к джемам, где минимум подготовки, максимум надежды на собственную гениальность,\
            \ а дальше как повезет. \nЕсть примеры артистов, у которых промелькнуло\
            \ как-то раз что-то конгениальное в импровизационном соло, их за это похвалили\
            \ - \"вот это и есть истинное понимание\" и пр. В результате этот музыкант\
            \ вместо того, чтобы разную музыку разучивать, мучительно пытается осознать\
            \ и взрастить в себе искорку, играя одно и то же 1:45 в течении всего\
            \ концерта. Каким бы интересным не был какой-то сыгранный момент, хорошая\
            \ музыка складывается из сочетания разнообразных вещей. Ибо не существует\
            \ момента истины - той самой ноты, аккорда, темы или стиля, которые лучше\
            \ всех остальных, и которые нужно бесконечно повторять, чтобы добиться\
            \ успеха. К примеру, сыграл на концерте две песни - оказалось, что одна\
            \ хорошая, а другая - похуже. Тогда в следующий раз ту, что похуже, играть\
            \ не буду, лучше два раза подряд - хорошую.\nНе надо недооценивать роль\
            \ импровизации в блюзе. Однако, импровизация без повода или с небольшим\
            \ количеством поводов - вещь занудная и неинтересная. Классический пример\
            \ - блюзовые соло на 7 минут. Когда солист говорит, а хер с ней, с песней,\
            \ лучше я покажу, как я умею импровизировать, я же - гениальный, из меня,\
            \ бывает, прет. Отсутствие музыкальных деталей - классический пример занудства,\
            \ когда непрофессионалы, рокеры или джазмены начинают играть блюз - все\
            \ блюзы оказываются на одно лицо, после чего блюз признают неинтересным\
            \ жанром.\nПример хорошего - это когда музыкант придумывает несколько\
            \ песен, которые отличаются друг от друга теми самыми мелочами, которые\
            \ в совокупности, собственно, и являются песней. При этом, в каждом конкретном\
            \ случае в песне музыкант играет не все, что знает и умеет, никаких длинных\
            \ соло или беспредельного самовыражения. Зато в совокупности мелочей и\
            \ проявляется гениальность музыканта и интересность его музыки, а не из-за\
            \ того, что он сыграл главное соло. Вот пример из жизни по случаю наступления\
            \ весны. Как вы думаете, что лучше, погулять с девушкой по улице, сходить\
            \ в кино, съесть мороженое, посмотреть на выставку и пр. или запереться\
            \ на неделю в пустой комнате и проговорить о главном. Хотя в первом случае\
            \ ничего существенного в каждый момент сказано не будет, он с большей\
            \ вероятностью приведет к результату. \nТеперь о конкретике, о прослушанном\
            \ концерте - я очень рад за Вову, что он перестал пробовать скопировать\
            \ гениальные запилы из Бадди Гая, а начал разучивать разные песни, в которых\
            \ главное - не откровение солиста, а музыкальный узор, возникающий из-за\
            \ мелочей... Импровизация - это хорошо, но был бы хороший повод.\nКстати,\
            \ из всей моей речи, если она показалась достоверной, практический вывод\
            \ для начинающих музыкантов, который относится ко мне в первую очередь.\
            \ Начиная с какого-то момента нужно заканчивать тренировки по импровизации\
            \ на произвольную тему, а начинать целенаправленно изучать и подбирать\
            \ чужие песни, выявляя то, что в них интересно. Вова перешел к этой стадии,\
            \ а я по лености - нет. Помнится, Саша Крылов на заданный при мне вопрос\
            \ какого-то гитариста о том, как учиться дальше хорошо играть, сказал,\
            \ что нужно просто начать снимать песни. ;)"
