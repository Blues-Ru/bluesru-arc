  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDCASS80401291931510333&sql=Acy5e8qnpbtz4\n\nФредди записал три альбома для лейбла Shelter, этот третий и последний. Третий и лучший из трех. Один из трех лучших альбомов Фредди (вместе с Burglar и Larger Than Life). \n\nНа диске 11 прекрасных композиций. Везде играют два драммера - Чак Блэкуэлл и Джим Келтнер; Карл Рэдл на басу; Дон Престон на гитаре, сам Лион Рассел на пианино; Пэтрик Хендерсон на клавишах; The O'Niell Twins на подпевках. Сам Фредди поет и играет на гитаре с невероятной отдачей и драйвом! Великолепные соло и вокал, которому могут позавидовать любые маститые \"отдельные\" вокалисты. Музыка от блюза до фанка, все очень классно и разнообразно, интересно слушается даже Hootchie Cootchie Man (автор C. Long!!!). \n\nОценка 5 баллов! Следующие два альбома еще сильнее, но и этот диск уже что-то невероятное. Boogie Man, Leave My Woman Alone, Help Me Through The Night - настоящие хиты и жемчужины! Этот альбом обязан быть в каждой приличной коллекции по блюзу и соулу."
