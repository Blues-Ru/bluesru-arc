  deleted: false
  text: "Привет ребята. Хочу предостеречь Вас от неприятностей, которые могут с Вами случиться, если Вы соберётесь обратиться\
    \ к гитарному мастеру Богатырёву Сергею. Расскажу Вам историю моего с ним сотрудничества. Очень не хочется этого писать,\
    \ но этот, так сказать, \"мастер\" уже достал меня конкретно.\nТак Вот, год назад в июле месяце я принёс к нему инструмент\
    \ (ДжБ), который мне надо было немного подправить по моему желанибю и снова перепокрыть лаком. На басу стояла вся фурнитура,\
    \ колки Шаллер. Мы договорились о цене и о сроках. Богатырёв сказал что сделает в течение месяца. Оплата при получении.\
    \ Через месяц я приехал с деньгами, обнаружил свой бас в разобранном виде, кое-что из-того о чём мы договаривались Богатырёв\
    \ сделал. Договорились ещё на месяц. При этом Богатырь взял с меня аванс, я ничего не подозревая отдал ему часть денег\
    \ с такими мыслями, что дескать всё равно куда нибудь потрачу, ну и расплачиваться всё равно надо, раньше, позже, какая\
    \ разница. Ладно. Приезжаю ещё через месяц с оставшейся суммой, бас правда он уже начал покрывать лаком. Мне в три короба\
    \ наговорил, что много заказов, не успевает, тут типа осталось работы на неделю, всё будет нормально, плати оставшиеся\
    \ деньги, через неделю заберёшь. Ну я думаю, мастер вроде приличный, раз говорит через неделю, значит через месяц то уж\
    \ сделает точно. Расплатился с ним полностью и уехал ждать, радостный от того, что больше ничего не должен. Вот на этом\
    \ и закончилось нормальное общение с этим человеком. Через месяц я звоню, спрашиваю как дела, он говорит, что лак был\
    \ плохой, надо всё сдирать чнова и перекрашивать, звони типа через месяц. В следующий раз лак опять оказался плохой, потом\
    \ опять плохой. Таким образом в февралю месяцу лак наконец попался хороший, бас покрыт, но вот незадача, Богатырёв куда\
    \ то затерял мой бридж! Пообещал купить мне Gotoh за свои деньги и поставить. Покупает он его по сей день. И это не всё.\
    \ Когда я ему звоню на мобилу, он отключается, типа занято. Когда звоню ему домой, то меня женский голос сначала спрашивает\
    \ \"кто это?\", а затем говорит что он либо в ванной, либо спит, либо уже ушёл, либо его ещё нет, либо вышел покурить\
    \ и т.д. Несколько дней назад я приехал к нему в мастерскую с целью забрать все свои детали и части баса и собрать всё\
    \ самому, плевать на бридж, куплю новый, однако я застал лишь его напарника Костю (к которому у меня нет никаких претензий)\
    \ но найти всех деталей я так и не смог. Колков Шаллер нет, винтов нет, из всей фурнитуры есть только датчики, пластик\
    \ (с царапинами, которых раньше не было) и темброблок. Т.е. я попал не только на машинку, но ещё и на колки.  А Богатырёв\
    \ так и не подходит к телефону. \nТак что ребята, забудьте такого мастера, он крайне непорядочный и лицемерный человек.\
    \ Поберегите свои нервы, и деньги тоже. \nВот такая вот антиреклама."
