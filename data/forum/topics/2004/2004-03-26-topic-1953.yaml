  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDSUB040403252136371292&sql=Aesug6jp771t0\n\nУ Джо очень мало альбомов. Этот всего четвертый, хотя он уже 1976 года. Диск записан в Тулузе (Франция) для лэйбла Black&Blue. Лэйбл известен своим сотрудничеством с джазменами и блюзменами из США, которые были ТАМ мало кому нужны, но удачно устроились в кабаках Франции и других странах Европы. Это вовсе не ознчает, что все это плохо и попсово. Скорее, это РЕДКОСТЬ и ПО-ДРУГОМУ. На виниле вышло очень много разных альбомов и компиляций, а вот на КД все это стали издавать СОВСЕМ недавно. \n\nНадо отметить, что изначально на альбоме было всего 5 длинных песен. На КД есть целых два издания! На одном (то, что на сайте) 7 треков, но я держу в руках французское экспортное издание, состоящее аж из 10 треков (почти 70 минут).\n\nМайти Джо играет в основном по блюзу. Видимо, во Франции люди не очень врубались в грув и фанк в те годы (Европа тоже неритмична, как и мы), а вот в США Джо писал очень даже прифанкованные пластинки. Вместе с Янгом здесь играют: Ken Sadjak - piano & organ, Willie Mabon - piano, Cornelius Boyson - bass, Willie Hayes - drums. Записи очень хорошего качества и сразу слышно, что все музыканты очень стараются и играют от души (разве это может не радовать?)\n\nДжо исполняет свои блюзы, но также не забывает про классику: тут есть Five Long Years и Sweet Home Chicago. Вокал Джо очень классный и интересный, его невозможно ни с кем перепутать (да и сравнивать не стОит вовсе). Его игра на гитаре тоже самобытна и узнаваема. Его любимую гитару зовут Джозефина, и он расскажет Вам об этом в самом первом треке на этом диске. Джо - шоумен; он даже в студии говорит, рассказывает истории, представляет музыкантов. \n\nОценка 4 балла. Самые большие минусы тут - это слишком длинные песни и однообразные ритмы в блюзах. Но музыканты классно играют, а сам Джо великолепен! Эта пластинка нужна еще и потому, что у Джо всего семь альбомов, а ведь он очень хорош и талантлив."
