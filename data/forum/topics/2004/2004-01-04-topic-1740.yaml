      text: 'Посмотрел "Культуру" в очередной раз. Порадовался за Эллу, блин, с какими глазами на нее смотрели музыканты ей
        "акомпонирующие" :-)

        У нас и смотрят волком, и думают о 300 рублях за концерт только. А там - с любовью. Им самим - ну до того кайфово
        было ритм тянуть когда она на сцене чудила.

        А потом... Возникло ощущение - резервации. Этакой духовной резервации. С четко очерченными границам - за 3 слоями
        колючей проволоки. Типа - вот канал культура, вот зал - ЦДХ,ну, пару клубов (да и те- все время исчезают под очередным
        оползнем) и типа - живите и радуйтесь. И не надо вам во внешний мир, гда вашу Эллу, не взяли бы даже на подпевки к
        группе ВиаГра или тому же Филипу из-за несоответствия формату и фигуры.

        А культуре явно не хватает блюзовой фигуры. Великолепно представлена джазовая тематика, классика и никого, кто бы
        двигал блюз и рок музыку. Заняли б свято место, господа журналисты. Вас же - разбирающихся в блюзе не то что бы пересчитать
        пальцев на одной руке хватит. А еще и лишние останутся.'
