        text: "Насчет Эллы на подпевках - шалишь! :) Она там - культурной (!) иконой стала давным давно. У нас с этим хуже.\
          \ Армстронга знают благодаря Kiss Of Fire и еще чему-нибудь комическому. Остальное - для узкого круга. К сожалению,\
          \ участники этого \"узкого круга\" сами ведут себя как бирюки - сидят по берлогам, и ничего им не надо, кроме как\
          \ достать какую-нибудь редкость в записи, которой ни у кого нет. Вроде бы, что плохого быть коллекционером. Но есть\
          \ оборотная сторона этой позиции: все, что более-менее пробивается к \"широкому кругу\", объявляется \"продавшимся\"\
          \ или \"туфтой\". И вот уже Бутман объявляется не джазменом, а бизнесменом. Леван - сами знаете... реалии таковы,\
          \ что сначала все сетуют на \"узкость круга\", а потом открещиваются от любой возможности выйти в \"широкий\". \n\
          рейтинг теле-передач считается довольно по честному. не смотрят блюз - его и показывать не будут, и денег на пропагандистскую\
          \ (популяризаторскую) телепрограмму о блюзе - не дадут. Пожинаем плоды: жизнь в резервации. \nPS - у меня память\
          \ коротковата. не Матраскин ли говорил, что фесты в ЦДХ - фигня, куда и ходить не стоит, а Эфесовский фестиваль\
          \ - пустая трата времени и денег? если ошибаюсь - сто тысяч извинений. По-любому, здесь в форуме не раз с каким-то\
          \ неведомым мне удовольствием звучало: \"Правда, ацтой? Правильно я сделал, что не пошел!\" Нисколько не смущаясь,\
          \ что само слово \"ацтой\" - из эмтивишного лексикона."
