          text: "ЦДХ - почти единственный зал в котором можно услышать \"неформатную\" музыку. Фолк, джаз, и т.п. \nЕсли вы\
            \ внимательно читали и хорошо помните - о блюзовых фестивалях я писал что увы - не имеют они развития. Пора взрослеть,\
            \ а они как детская игра во взрослых. Те же лица, те же телеги. Как сериал - первая серия была прикольна, но полностью\
            \ исчерпала тему и фантазию. Ходить на подобные мероприятия без запаса гнилых овощей - только продлевать жизнь\
            \ музыкантам, которые как музыканты давно перестали быть интересными.\nЛеван (как верно писал господин Жук) -\
            \ единственная надежда блюза. Своей деятельностью, энергией, он привлекает к блюзу молодежь.\nДля того, чтобы\
            \ передача о блюзе была рейтинговой - может просто ее надо сделать интересной? Талантливой? А не бухтеть нудным\
            \ голосом себе под нос малопонятные фамилии?\nТолько что посмотрел по той-же \"культуре\" детскую америкосную\
            \ передачку про форму в музыке. Начали с простого, разобрали сонетную форму на примере Прокофьева. Ну, потом е-сс\
            \ но 32 тактный джаз ААВА, бридж и все такое. Закончили уж совсем крутым - 12 тактовым блюзом. Детишки там сидели,\
            \ лет так по 12, может и по 7. Такты считали, ручки тянули когда доминанта появлялась, ну и так далее. Оркестр\
            \ полный, джазовый бенд в студии. Блин, я - взрослый дед, а как самому интересно было.\nА резервация - наверное\
            \ это единственный способ сохранить самобытную культуру от наступающей, куда как более мощной техногенной цивилизации."
