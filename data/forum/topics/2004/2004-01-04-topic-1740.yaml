              text: 'Дай угадаю  - да не уж то, к деньгам?

                Да, молить Господа надо, что не продается у нас блюз как чипсы лейс, оттого и занимаются им - честные и преданные
                блюзу люди.

                Ну, даже представить страшно - смог бы журналист честно и объективно писать о блюзовом фестивале, если бы
                ему зарплату платил организатор этого самого фестиваля?

                А то, что американцы тратят деньги на организацию подобных передач для детей и юношества - так видно думают
                блин. А могли бы по карманам растащить, яхты там накупить, или какой-нибудь хоккейный клуб из республики Конго.

                Да, меня всегда волновал вопрос. А какой бюджет был у записи Роберта Джонсона? И сколько миллионов (-ардов)
                потратила звукозаписывающая компания на его раскрутку?

                Может - играли бы наши блюзмены так клево, что каждый день аншлаги и человек по 300 снаружи в клубе каком-нибудь
                небольшом, ну типа "точки" там... Записывали бы альбомы, которые продавались миллионными тиражами по всему
                миру. Получали бы Гремми - за вклад в блюз. Ну, и насрать бы тогда на инвестиции. Сами бы передачи делали.
                Что первично то - хорошая музыка или вложенные деньги? Не в попсе - в блюзе?

                И чего тогда стенать по поводу етих самых, что не от Бога?'
