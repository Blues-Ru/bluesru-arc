  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70402101939513310&sql=A4hqag4sttv3z


    Этот диск был записан во Франции в 1979 году и вышел там же на лейбле Isabel Records. Alligator выпустил его в США только
    в 1981-ом. Длинный альбом на 42 минуты, но на нем только 6 треков; ясное дело, что треки затянуты. Игра и пение Бадди
    блещут энергией и злостью, но музыкальность осталась на втором плане, к сожалению. Грязный звук перегруженный звук гитары,
    кривая игра ритм-секции, оруще-истеричный вокал - вот такой блюз-рок выдает Бадди во Франции в конце 70-х. Порой ощушение
    не "музыки протеста", но ПРОТЕСТА против самой музыки.


    Оценка 3 балла. Кто-то может и оценить это безумие и эту грязь! Надо отметить ОТЛИЧНУЮ игру Фила Гая на ритм-гитаре; выдержал
    всё в стиле! Запил за запилом, брейк за брейком, доли смешались, эмоции захлестывают. Блюз ли это? Да, вот такой вот блюз.
    Этот диск понравится любителям запилов и истеричной подачи.'
