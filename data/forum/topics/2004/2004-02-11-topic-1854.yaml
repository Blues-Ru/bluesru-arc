      c Джуниором Уэллсом и концертный Real Deal.C Уэллсом же у Бадди Гая вообще была сладкая парочка,уникальнейший дуэт в
      блюзовой истории.Великолепная слаженность,артистизм,классный стеб - это стоит посмотреть на видео.И все же Бадди был
