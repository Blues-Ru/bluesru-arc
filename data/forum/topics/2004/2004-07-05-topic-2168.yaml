          text: "По моим личным наблюдениям - гораздо опаснее уговаривать публику\
            \ (а заодно и себя) что все нормально. БОЛЬШИНСТВО наших исполнителей\
            \ именно этим и грешат. В результате - полностью теряют контроль над реальностью,\
            \ над понятиями что хорошо, а что плохо - развивается шизофрения (в подвиде\
            \ звездной болезни), заканчивается развитие и идет глобольный регресс.\n\
            Самое опасное в жизни и творчестве - потеря того, что мы, электронщики\
            \ - называем отрицательная обратная связь. Т.е. если она становится положительной\
            \ - система теряет стабильность,переходит в самовозбуждение и как правило\
            \ - либо сгорает, либо воспроизводит с безумными искажениями. \nНормальная\
            \ ситуация - неудачный концерт, плохо сыграл, проанализировал ситуацию,\
            \ понял как ее избегать, в следующий раз сыграл нормально. Дал в репу\
            \ ритм секции чтобы не загоняли, купил слуховой аппарат гармошечнику -\
            \ чтобы слышал не только себя, купил бутылку звукочу - чтобы выпил, и\
            \ свалил, и не мешал нормальным людям нормально отстроить звук, пригласил\
            \ на концерт пару хороших друзей, дабы они прикрыли своими телами от распрощавшихся\
            \ с молодостью дамочек. И все - ОК! Играй Юра.\nА если обратная связь\
            \ не работает - сыграл скверно - а все рады (или делают вид), понимаешь,\
            \ что всем либо просто пох.. либо ты такой гений, что хоть перди в микрофон\
            \ - у всех полное счастье и все. Прощай блюз. Либо - пердеть дальше на\
            \ потребу публики, либо делать вид что в этой стране тебя никто не понимает\
            \ и самому свято в это верить.\n\nЕщеНестарый Лейтенант."
