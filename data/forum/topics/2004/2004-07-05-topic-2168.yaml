  text: 'Состоявшаяся 29 июня с.г. в "Ритм-н-блюз кафе" акустическая премьера проекта
    Dirty Dozen Юрия Каверкина произвела крайне приятное впечатление. Ровный, приятный,
    мягкий вокал и спокойное обаяние Юры, а также работа других его коллег по проекту
    - блеск. Вся моя компания была в восторге. За счет виртуозной балалайки Димы Калинина
    проект порой мягко дрейфовал в сторону кантри, но это вовсе не диссонировало с
    общим настроением проекта.

    Юрочка, молодец! Спасибо! Фотографии - за мной!

    Леонид Остапенко'
