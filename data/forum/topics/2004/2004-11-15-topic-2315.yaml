  deleted: false
  text: "Вот любопытно, в стране найден еще один идиот.\n   Вернее идиотка, скорее шизофреничка, короче - полный трубец, товарищи!\n   Некая Маша (она же Мария) в рамках своей активности по организации концертов просто нападает на директоров и менеджеров клубов, а также на музыкантов и их группы.\n   Дама совершенно не соображает ни в технических требованиях к месту проведения мероприятий, ни в том, что сначало нужно обсуждать все подробности проведения и все нюансы непосредственно с директором группы и её участниками.\n   За всю историю существования группы MAGIC у нас не было ещё концерта, «веселее», глупее и устрашающе ужаснее по звуку аппаратуры и непосредственно самого выступления. Описать словами произошедшее просто нереально. \n   Мы ржём уже третий день :))\n   Мало того, что на афише Маша написала придуманное ею название группы (видимо не знала как пишется слово Magic) что-то из серии «Чёрные Кошки» и иже с ними... Что началось далее - это литературное безобразие...\n   Предварительно согласовав за две недели с директором группы Magic - Натальей Тереховой - время выступления в 23:00, Маша в ночь перед концертом не сама, как администратор обязан, а через вокалистку, передала, что концерт в 24:00. А так как за предложенную зарплату мы бы ждали открытия метро до шести утра и начать выступление позже не могли, мы предложили - либо отменяем, либо начинаем в 23:00.\n   Уже в этом баре мы переговорили с директором (корчившим в страшных муках лицо при виде Маши - думаю, ему досталось еще больше) и он дал добро начинать как нам удобнее. Маша стала бросаться на нас, периодически выдёргивая из рук то пюпитр вокалистки, то клавиши Сони, и после каждой песни устраивала истерику, что мы должны молчать до 24:00. И вот так минут сорок. То есть публика сидит, смотрит (Танцевать пробывали - Маша мешает...). Мы играем песню, потом Маша бегает перед нами задницей к людям и орёт бешенными словами, что ОНА решает, жить нам или не жить, и кто такая директор Наташа - она же просто гитаристка! (Могу заметить, что еще и тот человек, который эту группу собрал...) Один из посетителей пивнушки попытался в шутку убрать ненормальную, но тут же получил от неё матом. Потом она стихла и присела за столик.\n   Дождавшись окончания нашего выступления, она снова кинулась на нас с воплями всё о том же...\n   Продолжая бредить, создавая помехи между ногами и суету во время нашего сбора музыкальных инструментов, Маша грузила выученными и придуманными ею предложениями, подчеркивая, что ОНА работодатель! Боже... Соня горела желанием вызвать охрану и убрать бунтаря с  площадки.\n   Спасибо, конечно, за лишние 250 рублей , (в криках Маша обещала дать нам по целых пятьсот рублей, если мы все-таки начнем в 24:00, что оказалось бы абсолютно теми же 250-тью, когда б мы стали ночью ловить такси).\n   Маша просила сказать ей спасибо, что если бы не ОНА, мы бы никогда не играли в этом баре (и хорошо бы жили!). \n   Но таких мест можно найти сотни.\n   Это можно просто идти по улице, заходить во все пивнушки, забегаловки, пельменные... И договариваться - мол, за 200 рублей - пожалуйста, со своим аппаратом - без проблем, в два часа ночи - да ради бога..."
