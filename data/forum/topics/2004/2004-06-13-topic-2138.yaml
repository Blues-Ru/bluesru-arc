  text: 'Может быть не совсем вовремя, но все же…

    Так получилось, что я довольно длительное время не пользовался Internet, и наконец, добравшись до компьютера в первую
    очередь зашел на блюз.ру.

    Прочитал в блогах ответ Ф. Романенко на статью с гармоники.ру, посвященную Пера Джо.

    Согласен с Федором по поводу заблуждений типа: умеют только негры, у нас не умеют, “мастерство”.

    К слову о последнем, я не вникал и особо не пользовался никогда сайтом гармоника.ру, хотя сам довольно давно осваиваю
    этот инструмент, у меня другие источники :). Так вот, в одной из веток форума этого сайта парни устроили что-то вроде
    соревнования, кто как сыграет “Take Five” Брубека – техника у них на высоте. Прослушав очень много записей блюзовых гармошечников,
    скажу, что далеко не у каждого из них ТАКАЯ техника как у ребят, я понимаю, что в блюзе важно не это, но все же. Так что
    с мастерством проблем ПОЧТИ нет, но огромная проблема с отсутствием стиля (впрочем, это присуще всем бывшим совковым странам
    вообще). Под стилем я подразумеваю сценический образ, какую-то особую манеру игры, характерные ошибки, короче говоря,
    все те признаки, по которым мы узнаем, например, Junior Wells. Я абсолютно не имею ввиду отращивание характерных “блюзовых”
    усов, бакенбард как у Коттона в 70-80гг или повального ношения шляп. А стиль во всем своем многостороннем значении можно
    поиметь только ходя на концерты западных блюзовых музыкантов, слушая огромное количество записей блюзовых музыкантов,
    мало кто, я думаю слышал о таких именах как, например (без снобизма), Peppermint Harris, Big Wheeler, Little Willie Anderson,
    Zuzu Bolin и т.д. А не желание вырабатывать свой стиль подтверждает и то, как мало людей ходит на концерты устраиваемые
    Ф.Романенко. На западе уже давно нет проблемы со стилем, у нас только первые его ростки (на Петровича и Мишуриса просто
    смешно смотреть, по-доброму смешно, без сарказма).

    Так что, поймите меня правильно… Я не отрицаю, наличия блюза у нас в совке, я просто хочу, чтобы это был БЛЮЗ.

    P.S. Кстати, Федор, как насчет, чтобы привезти кого-нибудь на Украину, например в Днепропетровск, люди тут не такие избалованные
    норвежскими музыкантами :), да и в Москву часто ездить накладно :).'
