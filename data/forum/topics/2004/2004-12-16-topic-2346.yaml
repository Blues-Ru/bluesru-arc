  deleted: false
  text: "Оксана Кочубей & Life-n-Joy зажгли вчера в Би Би Кинге по полной программе! Дебютный джем прошёл на ура.\n\nЛюди, лица, инструменты... Все джемы похожи друг на друга и в то же самое время отличаются. Отличаются, прежде всего, атмосферой, и тем, что в ней витает. Вчера была атмосфера настоящего рок-н-рольного угара. Не рок-н-ролл? Ну, хорошо, блюз-роковый-джем. Не в этом суть. Главное, что был огонь, а он в последнее время на джемах ощущается не так уж и часто. Что греха таить, джем-сейшны, как это ни печально, постепенно сходят на нет. Года три назад, когда всё это только начиналось, каждую среду в Би Би Кинге был аншлаг. Сейчас – далеко не всегда. И тем ценнее то, что было вчера.\n\nНасколько я понимаю, обычная концертная программа Life-n-Joy была адаптирована под условия джема: стандарты игрались достаточно стандартно, а «рок-эксклюзив» был сведён к минимуму. Но «эту песню не задушишь, не убьёшь»: бешеная Оксанина харизма всё равно хлестала отовсюду, что, впрочем, не помешало ей отлично сыграть роль радушной хозяйки джема, и это было супер.\n\nЕщё один очень приятный запомнившийся момент. Паузы между песнями во время смены джемующих заполнялся не только конферансом примадонны вчерашнего вечера, но и прифанкованными инструменталками хауз-бенда, в результате чего создалось классное впечатление бесконечного праздника. Грамотный ход. \n\nНе интересно перечислять постоянных участников джемов, но двоих не могу не упомянуть. Первый - это Егор Майоров - харпер и вокалист. Честно говоря, не знаю, играет ли Егор в каком-нибудь коллективе, но на каждом джеме он шикарен: всё сочно, к месту и со вкусом. Второй – гитарист Руслан Чифуров, его вчера я видел впервые. Честная бескомпромиссная яркая игра. Просто молодчина! Неспроста он заслужил похвалу Ника Кейва. \n\nМне это из моего «угла» увиделось так. А вам?"
