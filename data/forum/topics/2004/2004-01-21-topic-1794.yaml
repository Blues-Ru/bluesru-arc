  deleted: false
  text: '<a href=”http://www.boogiewoogie.com/TEST/ARTIST/AMOUROUX/amorouxbertrand.htm”>Дуэтный
    live-альбом двух французских буги-пианистов</a>, записанный марте 1993 года в
    парижском Latitudes Jazz Club. Из 14 треков лишь на 5-ти им помогают ещё басист
    и ударник, а в остальном – только два рояля.  Редкая слаженность и чистота звука
    соединяются с поистине виртуозным владением инструментом. Солируют музыканты по
    очереди. Безусловно, слушать альбом нужно в хорошем стерео звучании, тогда замечательно
    слышны «переклички» роялей, и пластинка может выступать классным пособием для
    любого джазово-блюзового пианиста. Прослушиваемы все пассажи. Снимай – не хочу!
    Отсутствует грязь, характерная для игры большинства блюзовых пианистов. В значительной
    своей части произведения авторские Жан-Поля и Жан-Пьера. Из прочих представлены:
    G.Gershwin («On Lady Be Good»), легендарный Pinetop Perkins («Pinetop’s Blues»)
    и M.L.Lewis («Yancey Special» и «Honky Tonk Train Blues»).

    «All dignity, the musicians began the concert in evening dress. But they finished
    in their shirt-sleeves, in a atmosphere of unrestrained festivity. Once again,
    boogie had triumphed…».'
