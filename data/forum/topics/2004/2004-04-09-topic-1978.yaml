  text: "Вчера навстречу фестивалю Блю-Ру-2004 мне пришлось записать передачу на Эхе\
    \ Москвы. (Помня, что не нам, блядюгам, руками трогать Джона Ли, его и не трогал).\
    \ Отслушивая отечественные блюз-записи прошедшего сезона, я был вынужден прийти\
    \ в восторг! Столько всего - и качественно, и разнообразно. Десять лет назад и\
    \ вообразить было невозможно, что в нашей стране появится это вот «столько всего»\
    \ - причем - за один сезон. А ведь именно где-то лет десять назад я сошел с популярной\
    \ платформы «здесь никто блюз не может играть просто потому, что он - здесь».\n\
    Особое удовольствие было вызвано прослушиванием в наушниках (т.е. тщательным):\n\
    1.\tзаписей Аграновского – как альбома «Тик», так и еще неизданного джема\n2.\t\
    разумеется, Свет, Эл и Биг Вэл,  \n3.\tРэгтайм – елки, в это трудно поверить!\n\
    4.\tБлюз-Доктора. Но живьем они играют плотнее. Жаль, что их первый альбом всего\
    \ лишь «на уровне», они же могут лучше, просто надо научиться, как это делать\
    \ и в студии. \n5.\tModern Blues Band – их альбом ставит очень высокую планку\
    \ качества звучания, оригинальности и мастерства.\n6.\tТолько из-за качества звука\
    \ в передачу не вошли записи Blackmailers\n7.\tНезавершенный проект (всего две\
    \ песни осталось) М.Мишуриса и Т.Кожекиной"
