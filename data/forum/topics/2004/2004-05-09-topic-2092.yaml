  text: "Уважаемые форумчане. Всех с праздником Великой Победы!\n\nКто помнит, где-то\
    \  в прош году я приставала с новым блюз-бендом  JBboogie из Бордо ( с которым\
    \ я познакомилась в Мадриде :)(вот ссылка :http://shum.afisha.ru/forum_archive?forumId=forum_i_23653&page=3)\n\
    \ Ребята оч талантливые , особенно их лидер  Julien Brunetaud - на фр сайтах его\
    \ называют \"20 летним волшебником блюза\"  Свершилось! Я получила от них 2 диска,\
    \ уб просьба  всем,кто может помочь контактами или вообще, чтобы пригласить ребят\
    \ в Москву, они бы далеко пошли, я уверена.\nСпасибо! Кто заинтересовался - пишите\
    \ мне на мыло."
