  text: В прошлое воскресенье видел достаточно объемный журнал о блюзе,вроде бы также
    и названный и изданный в Москве за номером 1 за 2004год.Довольно много разных
    статей о блюзе,конечно,несколько фрагментарно,но тем не менее...Стоил он там 100
    рублей.Кто что из уважаемых любителей блюза может сказать по этому поводу...В
    любом случае это очень неплохо.
