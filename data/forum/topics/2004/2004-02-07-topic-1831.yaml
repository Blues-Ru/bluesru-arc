  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDCASS70402062203262725&sql=A4c7tk6jx9krj\n\nЧетвертый великолепный альбом Кудера! С этого момента у Кудера стало больше соул и госпел звучания, появились серьезные влияния островной и мексиканской фолк-музыки. Тут шесть подпевающих вокалистов и среди них сам Бобби Кинг. Ленни Варонкер по-прежнему продюсирует и делает это прекрасно! Джим Келтнер и Милт Холланд делают невероятные вещи с ритмом и перкуссией. \n\nОценка 5 баллов! Госпел-соул-фолк-блюз-рок высшей пробы. Jesus On The Mainline и Fool For Cigarette - лучшие вещи на альбоме. Рай кудер не стоит на месте, каждый его альбом - это коллекция прекрасных песен, но немного в другом стиле. Эта коллекция - одна из основных!"
