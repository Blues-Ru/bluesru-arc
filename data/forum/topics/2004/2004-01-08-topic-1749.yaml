  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70401071900082926&sql=A3st67u5010jf\n\nДжон - мультиинструменталист. Он работал еще с Райем Кудером и Терри Эвансом, но он также большой друг Гари Примича. В отличие от очень блюзового и чикагского Примича, Логан очень эклектичен и разнообразен во всех отношениях. Да и харизмы у него больше. И голос его звучит как вокал рок-идола (где-то он похож на Хаммонда, где-то аж на Джаггера!). Джон использует очень много перкуссии, фанка, соула, латины, блюза, рока, обояния, драйва; есть даже шуточный хип-хоп на этом альбоме! С Примичем их объединяет огромная любовь к классной музыке и ВКУС, тут его много! Он в каждой песне и каждом звуке. Вкус, юмор, мелодии и ритмы. Нет бездумной игры и пятиминутных запилов. Нет маразма гитарного блюза и бестолкового использования харпа (как у нас в Москве; дуют в дудку во все доли и дыры!). \n\nОценка 5 баллов! Это победа над скукой и однообразием! Логан - настоящая звезда корневой музыки, просто времена сейчас не те...\n\nЭтот альбом просто для всех! Каждый найдет свой кайф в этих 14-ти песнях на 63 минуты!"
