    deleted: false
    text: "Битва титанов в ЦДХ: Михаил Соколов VS Михаил Мишурис\n\nИнформационный повод в наши дни - очевидный и несомненный признак некрофилии. Просто так музыку уже никто не играет. Чтобы устроить концерт, необходимо событие - презентация пластинки, юбилей группы, день рождения барабанщика. Если ничего путного в голову не приходит, можно пустить в ход фантазию и придумать что-нибудь эдакое Сражение признанных мастеров жанра, как, свежо? Нет, конечно, но дни рождения и презентации практикуются чаще, поэтому для наших палестин сойдет. Кто победит - заведомо ясно: дружба. Кто проиграет - тоже... \n\nОдин замечательный человек как-то указал на занятное явление - метаморфозы и реинкарнации мнимого хора из Кампалы. На несостоятельность российского ска, то есть. \"Можете себе представить угандийский коллектив любителей русской словесности? Лиловых барышень в кокошниках и черных как смоль кавалеров в косоворотках? Страшно?\" - с нескрываемой любовью к хору спросил замечательный человек. \"Страшно\", - ответили мы и принялись почем зря склонять метафору применительно ко всем выдернутым из родной почвы музявлениям. Но даже не на несостоятельность российского блюза хотелось бы обратить внимание, а на всю комичность дефиниции. Однажды в редакции мы изрядно потешались над жутко пафосным и патетичным \"Единым Фронтом\" Эрнста Буша, вернее, над куплетом, спетым по-русски (кроме немецкого Буш, разумеется, никаких языков не знал), особенно над строчками \"ты войдешь в наш единый рабочий фронт, потому что рабочий ты сам\". Представляю, сколько радости мог бы получить американский ценитель блюза, попадись ему в руки кассета с российскими вариантами \"Alabama Train\" и \"C.C. Rider\". Но что комичнее всего - легенды российского блюза относятся к своему творчеству серьезно. \n\nКак-то обозревая современный рок, замечательный журналист Андрей Горохов справедливо заметил, что если артист осознает несуразность и абсурдность того, что он делает, то это не только оправдывает несуразность и абсурдность произведения, но и выводит его на некий новый качественный уровень. Замечено это было в связи с японской панк-группой \"Melt-Banana\", играющей на скорости, не фиксирующейся никакими спидометрами здравого смысла. Феномен группы, кстати, в том и заключается, что, разгоняясь до запредельной скорости, ребята вносят в свое творчество элемент игры, осознанно переигрывают, то есть. Исполняй они свой гипертрофированный панк-рок чуть серьезней, моментально превратились бы в еще одну из десятков тысяч посредственных групп. Серьезность российского блюза заставляет нервно ерзать в кресле. \n\nНе знаю, что придает Соколову больше шарма - седая борода, черная шляпа или сочная погонява Петрович, но что Мишурис выезжает на шоу - это однозначно. Нет, разумеется, Петрович еще и на гармошке лабать может, причем весьма дюже, а Мишурис голосит поставленным голосом так, как будто никакой звукозаписывающей аппаратуры и не существовало вовсе, но, сдается, успехом оба коллектива обязаны вовсе не музыке. Оба оркестра потеют, медные секции накаляются докрасна и, надеясь, что руководители не заметят, подыгрывают друг другу. То есть, настоящая битва получается - какое же сражение без коллаборационизма? Но все равно, ни дать ни взять эстрада. \n\nЕсли Петрович основной рисунок пьесы выводит собственными силами - своей гармошкой, то есть - концентрирует внимание публики на себе самом, то Мишурис только натужно вопит, гавкает, подвывает, подпрыгивает и хлопает себя по ягодицам, предоставляя право своему гитаристу заполнить пространственно-временной континуум музыкальной материей. Гитарист, конечно, хорош, надежный тыл коллектива и спасительная ниточка для слушателя, желающего чего-то большего, чем ужимки, позы и кривляния фронтмена. Владимир Иващенко - получите жетон! \n\nКонкурс капитанов - состязание Мишуриса с Петровичем было изначально несправедливым. Прямо как в знаменитом фильме \"Crossroads\": \"если ты, пацан, даже поезд сыграть не можешь, чего вообще за гитару взялся\". Петрович действительно сильный гармошечник, соперничать с ним бессмысленно. Другое дело - состязание Петровича с гитаристом Мишуриса. Впрочем, здесь снова повторяется эпизод из знаменитого фильма. Гитарист лажает, добро побеждает зло, но так ли всем хотелось, чтобы оно действительно победило? Разве есть люди, которые не болели бы за демонического Стива Вэя на соревновании в аду? \n\nВот такие зарисовки от rockmusic.ru Слишком много воды и позерства, хотя некоторые детали правильно подмечены."
