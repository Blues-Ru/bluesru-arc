  text: "http://afisha.weekend.ru/?action=pv&id=269587\n\nОчень энергичный и техничный блюзовый музыкант из Чикаго.  \n \n\
    Жанр: джаз/блюз\nУчастники: Гэри Примич\n \nГэри Примич начал свою карьеру под крылом у бывшего барабанщика Фрэнка Заппы,\
    \ Джимми Карла Блэка. их недолгое, но интенсивное взаимодействие вывело Примича на уровень одного из лучших исполнителей\
    \ на губной гармонике в США. \n\nЗа десять лет сольной карьеры Примич сменил несколько лейблов, объездил все штаты с гастролями\
    \ (и создал таким образом обширную армию фанатов) и записал несколько блестящих альбомов. Новый век он встретил с релизом\
    \ \"Dog House Music\". Это плотный американский блюз-рок (с непременными элементами рокабилли), сыгранный с удовольствием\
    \ и знанием дела. Любому человеку, который не испытывает от вышеописанного жанра неприятных ощущений, музыка Примича станет\
    \ хорошим подарком - просто так, без особого повода."
