          email: fedor@blues.ru
          subject: Кид и Бьорн
          deleted: false
          text: "Оба - очень серьезные гитаристы. Я в этом убедился на концертах.\
            \ Для тех, кто не был, возможно убедительными будут пара новых строчек\
            \ в пресс-релиз для придания веса - Кид с сентября будет выступать в качестве\
            \ гитариста в группе Чарли Масселвайта. У Бьорна - великолепное современно-традиционное\
            \ джазовое трио Solid! (гитара, хаммонд, ударные), они играют джаз без\
            \ соплей с мощной ритмической основой (звучание a-la Wes Montgomery и\
            \ других классиков), в каком-то смысле более близкий к блюзовым выразительным\
            \ средствам, нежели чем многие направления в джазе. Сам Бьорн (лучший\
            \ молодой джазовый музыкант Норвегии, если из пресс-релиза) - джазовый\
            \ монстр, знает очень сложные вещи, но говорит, что он счастлив, что начал\
            \ играть блюз до того, как серьезно занялся джазом. \nВ Форте в начале\
            \ выступления действительно были слышны стилистические неувязки, играли\
            \ они вместе с Бьорном эту блюзовую программу в первый раз. Но это начало\
            \ проходить уже к концу выступления, в чем убедились оставшиеся до конца.\
            \ На остальных концертах все было совершенно. Вообще, помимо прочего,\
            \ нам очень повезло, что мы услышали, как джазовый музыкант такого уровня\
            \ серьезно постарался раскрасить блюзовые аранжировки тем, что умеет,\
            \ не нарушив единства стиля. \nПоет Бьорн очень круто. В последний раз\
            \ я убедился в этом вчера вечером, когда он спел экспромтом две джазовые\
            \ вещи в одном весьма стильном заведении с отличным местным джазовым пианистом.\
            \ Позже в этом году выйдет диск, на котором Бьорн поет всю программу.\
            \ Кстати, в принципе, возможно, что он приедет позже со своим трио Solid!\
            \ в Москву на какой-нибудь джазовый фестиваль."
