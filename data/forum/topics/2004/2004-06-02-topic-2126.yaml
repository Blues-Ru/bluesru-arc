    text: "Да согласен с Володей было круто. Норвежцы как всегда были на высоте.\n\
      У Малыша Андерсена хорошие перспективы и оно заметно. Джамп он освоил хорошо\
      \ и думаю он еще будет развиваться в этом направлении.\nВещи \"Earthquake\"\
      \ и \"Aquavit\" были просто бесподобны.Все на месте - гитара, голос и положенный\
      \ драйв. Но когда начинали звучать медленные вещи, тут и проявлялись огрехи\
      \ (звук Лес Пола был явно перегружен и она иногда фонила), но здесь как раз\
      \ и выручал просто офигительнный второй гитарист (эдакий Johnny Winter альбинос)-\
      \ Bjorn Vidar Solli.Он играл на замечательной джазовой гитаре (наверное Grech)\
      \ и играл так, что казалось хедлайнер как раз он. А когда запел (увы только\
      \ одна вещь)... мороз по коже. Вот он диапазон и драйв -просто охреннено!!!Да\
      \ кстати, запел и басист Bill Trainni (аж целых 2 вещи)и во второй композиции\
      \ даже слегка заставил гитаристов спародировать всем известных гитаристов (BBK,Montgomerry,\n\
      J.Hendrix & others).Это было здорово...концерт удался.\nОдно наверное \"но\"\
      , для джампа игра Лес Пола немного утомляла и явно не хватало других инструментов\
      \ (гармошки, медных). Но это мое чисто субьективное мнение. \nИ еще были special\
      \ guests - это новый дуэт гитаристов Володя +Володя (Демьянов, Русинов). Уж\
      \ эти перцы не ударили лицом в грязь и выдали как им и положенно..... \nА напоследок\
      \ - чисто стариковское брюззззжание....ауууу народы..... маловато нас было....И\
      \ все, и звук хороший и цена (350р с флайером),\nа маловато в зале нас было,\
      \ но это я так ...короче, ходите на норвежцев и не прогадаете. Федору огромнейшее\
      \ спасибо...за диск тоже."
