  text: 'Байка такая. Кид Андерсен после 14-ти часового перелета из Лос Анжелеса сегодня
    ночевал в Шереметьево. Бдительные пограничники отказывались его пускать в Россию,
    потому что у него слишком потрепанный паспорт. К счастью, ситуация благополучно
    разрешилась сегодня днем после личного вмешательства консула, который поехал его
    вызволять в Шереметьево. Сам Андерсен - не слабак, говорит, что в невыспавшемся
    состоянии или же с похмелья он играет самые лучшие концерты, что можно будет проверить
    сегодня вечером в Форте ;)

    Я сам еще не слышал Андерсена живьем, только на его отличном диске, но все музыканты,
    с которыми я общался по поводу Кида, говорят, что он очень крут. В том числе -
    Мартин Виндстад (барабанщик Бюска), Хокун Хейе (гитарист у Эйрика Бергене и Морюдов),
    Джуниор Вотсон, Геир Ховиг (главный блюзовый радио-ведущий из Норвегии), ну и
    сам Кид говорит, что надерет всем задницу сегодня вечером ;))). Так что не пропустите!'
