        text: "Мне удалось послушать,по ряду причин, только вторую часть концерта\
          \ норвежской группы в \"Форте\". И тем не менее я получил удовольствие от\
          \ игры Кида Андерсона и вынес впечатление, что у него есть большое профессиональное\
          \ будущее. Особенно сильное впечатление произвела одна инструментальная\
          \ вещь, в которой было всё на месте - и мощь, и воздух, и блюзовое чувство.\
          \ Пение Андерсона должно, уверен, набрать силу (возможно, он действительно\
          \ тяжело перенес ночь в Шереметьево).\n     Ритм-секция нормальная, басист\
          \ отлично спел и вообще показался интересной персоной, понимающей в том\
          \ деле, которым занимается.\n     Увы, спел и второй гитарист, да еще и\
          \ сыграл сольные номера, совершенно никакие. Здесь уже начинаются вопросы\
          \ к тому, как группа продумала концерт и насколько серьезно к нему отнеслась.\
          \ Происходящее порой напоминало иллюстрацию известной свадебной формулы\
          \ \"у нас еще не все сказали\". За один номер, который Андерсон пытался\
          \ исполнить дуэтом со вторым гитаристом, он даже извинился - дескать, мы\
          \ не успели его отрепетировать. На гастрольном концерте, в первый раз на\
          \ новом месте, в новой стране, такой подход - с джемом и дроблением фигуры\
          \ солиста - был явным просчётом. \n    Возможно, на втором концерте всё\
          \ было безупречно. В любом случае, моё мнение не следует считать камнем\
          \ в огород Федора и других энтузиастов, которые привозят к нам интересных\
          \ блюзовых артистов из Северной Европы. Им - большое спасибо."
