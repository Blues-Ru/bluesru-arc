  deleted: false
  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDSUB040401121939450369&sql=A4pmyxdybjold\n\nЧетвертый альбом Мака Ребеннака на Атко. Три первых были почти в одном стиле, на этом начали происходить изменения. Изменился состав музыкантов. Тут с доктором играют и поют: Мик Джаггер, Грэм Бонд, Мемфис Хорнз!!!, Джим Гордон, Пи Пи Арнолд, Эрик Клэптон, Карл Рэдл и многие другие. Практически, это состав Эрика Клэптона. С этим составом музыка стала более понятна и доступна, часть дури и безумия и отступила. На этом фоне кажется, что появились мелодии и интересные ходы. Black John the Conqueror - очень хороша! Вообще, альбом слушается легко, но до него уже было три подобных проекта. Маку нужно было что-то менять. \n\nОценка 3 балла. Диск явно лучше предыдущих двух, но на нем уже нет новизны первого альбома. Клэптон и Ко. не очень подходят под настроение Мака, наверное. \n\nThere'll be some changes made..."
