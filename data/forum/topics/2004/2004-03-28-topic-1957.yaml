        \ мозги.\n\nКаждый слышит то, что хочет.\n\nВот список того, что услышал уважаемый Алексей Чернятин, но чего на самом\
        \ деле не звучало в интервью.\n\nЛюдей разных континентов объединяет отношение к несвободе, а не тюряга. Так это говорил\
