  text: "Здравствуйте, уважаемый Андрей !\n\nЯ знаю о Вас по тем давним ещё передачам \"Весь этот блюз\", которые имел удовольствие\
    \ слушать на Эсэнси в начале 90-х; я считаю Вас пожалуй самым \"рафинированным\" блюзоведом (пардон за словечко) из всех,\
    \ кого знаю; и я, безусловно с уважением отношусь к Вашим музыкальным пристрастиям, даже если и не разделяю их.\n\nСовершенно\
    \ случайно, за много лет, я настроился на вашу передачу, и то, что я услышал во вчерашней программе на 87,5 меня очень\
    \ расстроило. Я имею в виду конец программы, с Вашим рассказом о Big Blues Rev. Уж лучше бы Вы поставили очередных \"\
    блюз гастробайтерз\" :))\n\nЯ полагаю, группа, играющая шансон (пусть даже это и последний их альбом), достойна упоминания\
    \ в других программах, но никак не в блюзовых. Оказывается, со слов лидера этой группы, если тюряга объединяет людей с\
    \ разных континентов, то это можно называть блюзом.\nЯ, пожалуй, оставлю это без комментариев. \nВозмутило другое. В одном\
    \ из предыдущих альбомов они подняли руку на Хукера, изложив свою версию \"Baby Lee\", если не ошибаюсь. При этом, вокалист\
    \ поет если не с опережением, то ровненько, в такт. Вернее, сложно сказать, что не так, но блюзмены так никогда не делают.\
    \ Вообщем криминал полнейший. Но я прошу их только об одном: Оставьте Хукера в покое, блядюги !\n\nНу а подтекст у этих\
    \ горе-музыкантов, как всегда такой: \"все слушатели идиоты, они не способны воспринимать нормальную музыку, мы мечем\
    \ бисер, а денег при этом не видим, нам бы в америку, мы б показали...\".\n \nПечально. Так что было раньше, курица или\
    \ яйцо? Может, биологи дадут ответ? У нас так плохо играют потому что слушателя всё равно нет, или же слушателя нет, потому\
    \ что и слушать то нечего ?\n\n\n\n\nС уважением,\n\nАлексей Чернятин"
