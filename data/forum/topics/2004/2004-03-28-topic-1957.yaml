      \ стране афроамериканская музыка находилась под негласным запретом напротяжении большей части двадцатого века. (Возможно\
      \ свобода импровизации маловозможна при тоталитарном обществе). Мы наверстываем. Уже следующее поколение (я надеюсь)\
      \ перестанет петь \"рыбу\" (некоторые вокалисты не знакомы с английским языком) и гнать лажу. \n\nА пока - просветительство!\
      \ Россия должна понять и узнать блюз.\nПо этому, например, мои многочисленные и к сожалению Димы Казанцева, очень удачные\
      \ эксперименты в стиле \"блюзоподобный фьюжн\" с приглашением ярких инструменталистов, поэтому же Аркадий Северный у\
      \ Биг Блюз Ривайвала. Кстати, Дину Верни я считаю больее правильной кандидатурой для \"облюзения\", ее парижский состав\
      \ явно находился под джазоблюзовым влиянием. Кстати, лично от себя хочу заметить, что Биг Блюз Ривайвалу близка эстетика\
      \ кабака, но ведь это не обязательно плохо. Зажигают-то они по правильному!\n\nА задача блюзру и других блюзовых СМИ\
      \ давать экспертную оценку - держать планку, сравнивать все наши \"потуги\" с эталонами жанра, у Андрея - очень тяжелая\
      \ миссия, и перестаньте его критиковать. Ему очень непросто на нашем безрыбье. \n\nСейчас популярность той или иной\
      \ команды зависит в первую очередь от профессианализма ее директора, и многие качественные коллективы не имееют профессионального\
      \ директора. А многие не такие качественные - имеют. Блюзру с его фестивалями, форумом и экспертной оценкой от АЕ -\
      \ отличная компенсация \"перегибов\" суровой клубной реальности.\n\nА ссориться и друг друга на х. посылать - вааще\
      \ последнее дело."
