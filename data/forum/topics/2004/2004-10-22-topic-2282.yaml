  deleted: false
  text: "...о том, как новый менеджер группы Magic ходила концерт договариваться.\n Приехала в клуб наша засланка, стоит,\
    \ значит, разговаривает с директором, ставит музыку на диске и обсуждает уж было день концерта. И тут рядом вырастает\
    \ парень вида недалёкого и интересуется, а что за группу вы тут играете?\n - Magic, - ответствует менеджер.\n - Да знаю\
    \ я Magic! Это не их запись, это же не они же на демке же. А сама группа полное фекальное соединение. Даже и не группа\
    \ вовсе.\n - Ну у них состав поменялся. Вокалистка-саксофонистка чумовая у них.\n - Но Терехова же там осталась? Если\
    \ Терехова там, значит это не группа. Даже связываться не советую с ними. Забейте и забудьте...\n - А вы кто сами будете,\
    \ молодой человек? - спросила наша менеджер.\n - А я супер-пупер-звукорежиссёр всех клубов Москвы и Одинцовской области\
    \ : АНДРЕЙ БАРАНОВ! А на Magic положите, говорю я вам, не группа это, однако..."
