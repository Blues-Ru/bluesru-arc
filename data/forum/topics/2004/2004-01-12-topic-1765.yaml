  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDCASS70401120525543056&sql=Azicm96bo3epf\n\nДоктор Джон записал много альбомов в разных стилях в 70-х, но только в 81 году решился записать сольный альбом. Только он и рояль. Лишь пара треков с вокалом! Коммерческое самоубийство? Да, но Мак давно не был в хит-парадах и не его это дело - поп-музыка. \n\nМак отлично играет на рояле! Блюзы, буги, ритм-н-блюз, новоорлеанские темы. Он абсолютно уникален как пианист, но почти час одного рояля может утомить даже самого упрямого поклонника Доктора. Оценка 3 балла. Игра на 5, но нужно было что-то придумать чтобы сделать альбом более КОНКРЕТНЫМ и ЦЕЛЕНАПРАВЛЕННЫМ. А так похоже на игру гениального тапера."
