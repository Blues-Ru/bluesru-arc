  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDSUB040312081650041310&sql=Agm6htralkl2x\n\nВ огромной дискографии великого органиста это чисто джазовый альбом. В значительной своей части пластинка инструментальная. Всего 8 пьес в без каких-то секунд часовом альбоме, и лишь в трёх вещах появляется вокал. В одной песне («Hurry Change, If You’re Comin’») звучит голос самого Джимми, в двух других поют Marlena Shaw и Benard Igner.\nОтдельное внимание стоит обратить на просто-таки огромную духовую секцию. 6 (шесть!) духовиков и харпер впридачу принимали участие в записи, что, безусловно, много тем более для Джимми, предпочитающего всё-таки малые составы.\n\nВязкие мощносвингующие дудки открывают заглавную инструменталку «Sum Serious Blues». Неторопливое органное соло Джимми во втором квадрате принимает эстафету. Третий квадрат отдан саксам, в четвёртом царствует гитара. Далее же следует развитие основной темы «всеми имеющимися силами и средствами» бэнда.\nВторая вещь («’Round The Corner») подинамичнее, но тоже инструментальная. \nТретьей идёт уже упоминавшаяся «Hurry Change, If You’re Comin’» с хрипло-ворсистым вокалом Смита - вначале спокойный бархатный медлячок, раскачавшийся, впрочем, по мере вступления органа и других инструментов.\nТеперь перескочу чуть-чуть, чтобы остановиться на «You’ve Changed» с вокалом Marlena Shaw. Голос Марлены звучит почти речитативом, лишь к концу вещи проявляясь настоящим чёрным вибрато. Красивая, но в принципе ничем особо непримечательная вещица.\nВ следующем треке («Moof’s Blues») наконец-то звучит соло гармоники.\nЕдинственной условно блюзовой можно считать ещё одну длиннющую (более 9 минут) инструменталку «Open For Business». Но она достаточно динамична и не кажется затянутой.\nЗакрывает альбом «(I’d rather) Drink Muddy Water» с вокалами Marlena Shaw и Benard Igner. Уши к этому моменту устают, что имеющиеся достоинства воспринимаются уже кое-как.\n\nПлюсы: плотная добротная джазовость, вкусный орган, жирные дудки. В общем это та самая пресловутая «чистота жанра». Дело в том, что на тех альбомах, где Джимми Смит начинает смешивать стили, имхо получается месиво, приводящее к потере качества.\nМинусы: затянутость некоторых треков. Все они равномерно хороши, но 8 длинных вещей подряд слушаются несколько тяжеловато."
