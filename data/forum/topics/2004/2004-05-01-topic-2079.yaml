    email: gypsy@mail.ru
    subject: Фулиганы просто...
    deleted: false
    text: "Енто просто музыкальные фулиганы! Издевляются над классикой как хочут! Что они только из милого нашему сердцу Mistreated сделали, это же уму нерастижимо! Первая часть - традиционный хардешник, сыгранный, правда, несколько вяловато, спишем на недостатки кухонной записи. Вторая часть - растаманские напевы, предваряемые \"Step aside baby its a rasta\" и вполне адекватными воплями \"I bena losena ma mainda bab\", третья часть - \"Э-эй, ухнем\" в стиле поздней Арии или раннего Кипелова, металлическое соло на гитаре явно заслуживает премии имени Железной Девы. А вот концовка вяловатая, просто смазанная. Итого, 4 балла за технику, 4 с плюсиком за артистичность.\nТеперь, значит, про сабж. Интересно, что навеяло уважаемым авторам такую смелую мысль - спеть по-псевдопольски? \"Але ж чуеш мэнэ, алэ ж нэма грошив, щаз заграе гитара\" - це, панове, наша ридна украинска мова, а не польска! Так бы и казалы, що не москали, мы ж зрозумиемо!\nПо нашему мнению, сия пиеса была задумана исключительно для демонстрации школы гитариста, с коей задачей он справился, показав глубокое знание основ тяжёлого блюза. Дзенкуем, пане! Але ж юмора в вас гараздо! \nМы ещё послушали ряд песен, некоторые из которых были хороши, а некоторые не очень, но во всех текстах ничего, кроме молодёжного стёба, замечено не было. (Интересно, а что мы там хотели обнаружить?)\nРезюме: бойз-рок-бэнд. Неплохо играют, чувствуется школа, но тексты ужасны. Впрочем, кто из нас не писал <censored> стихов в молодости?\nПожелаем талантливым молодым людям больших и творческих!"
