  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDSUB040401121939450369&sql=A62x7gjvrj6ia


    И вот оно свершилось! Доктор попал в чарты! Мак написал ХИТ! Such A Night и Right Place Wrong Time в хит-парадах! Альбом в Топ-30! Из безумия и местячковости в звезды!


    Что же изменилось? Да всё! Доктор сосредоточился на фанке, соуле и блюзе; никакой дури и шаманства. Он работает с Алленом Тюссо!!!, группой The Meters и другими классными музыкантами. Все песни отличные, звук и продакшн на высоте (Аллен знает свое дело).


    Оценка 5 баллов! Это лучший альбом Доктора всех времен! Это альбом черной музыки, но Мак отлично чувствует себя в этом груве! Обязательная пластинка для ЛЮБОГО любителя музыки!'
