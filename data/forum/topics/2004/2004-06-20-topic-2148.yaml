    text: "В принципе-то по строгим законам Since I've Been Loving You абсолютно не\
      \ блюз, но слушаю его и поражаюсь- какое там блюзовое настроение! И это не только\
      \ касается голоса Планта, но и гитары Джимми Пейджа- соло-то не особо блюзовое,\
      \ но как прёт! Вообще одно из лучших соло в блюз-роке. Такое тихое вступление,\
      \ которое потом переходит в вакханальную истерику, аж мурашки по коже. Led Zeppelin\
      \ вообще одна из моих самых любимых групп.\n Хочется ещё вспомнить версию этой\
      \ песни с альбома No Quarter - совместного концерта Пейджа и Планта 1994 года.\
      \ Там она звучит с оркестровкой- казалось бы блюз и с оркестровкой фигня полнейшая,\
      \ но нет же песня от этого не проигрывает, а наоборот получилась очень даже\
      \ интересная версия!\n А какая классная версия блюза Nobodys Fault But Mine\
      \ с альбома Led Zeppelin \"Presence\"!"
