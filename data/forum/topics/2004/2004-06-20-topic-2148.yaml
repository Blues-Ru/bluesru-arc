    subject: Блюз и Рок
    deleted: false
    text: 'Вот вспомнил я одну бутлегерскую запись- Led Zeppelin на одной из репетиций
      исполняют вещь Чака Берри "School Days"- интересно что это блюз или рок? Вообще
      Чак Берри- это блюз или рок? Где проходит та грань, отделяющая блюз от рок-н-ролла?
      Кто-то считает, что блюз это медленно, а рок-н-ролл быстро. Но вот пример, опровергающий
      это утверждение: Shake Your Money Maker Элмора Джеймса считается блюзом, хотя
      темп там переваливает за 200, в то же время Be Bop A Lula Джина Винсента считается
      рок-н-роллом, хотя имеет ритм довольно размеренного шаффла. Где же та грань,
      за которую так усердно воюют блюзмены и рок-н-ролльщики? :-))) Не пора ли помириться?
      :-)))'
