    text: 'По-моему в данном случае критерием оценки выступления коллектива является именно реакция публики (я про ОффБит). Тем более удивительно слышать мнение типа "странно, что именно под них народ зажигал, хотя они так себе сыграли". Я тоже уехал около 12 и никак не могу сказать, что Доктора были на тт момент лучше всех. Я ожидал от ребят большего, как раз - то ли они выдохлись за долгое время прбывание в столице, то ли еще что-то, не знаю. ОффБит, простите за вульгарность выражения, дал жару, дал настоящего рокнролу - я, конечно, не суперпрофессионал, но звучало так, как должно было. Вспомните Линка Рея - тоже говорили "грязно", зато как живо и за душу берет. Блюзмейкеры тоже молодцы - по-моему кроме "Cellblock''a №9" ничего ТАК не подпевали.


      Еще раз скажу, оценивать опен-эйр фестиваль, по-моему надо как раз по степени "зажигательности", эмциональности выступления. Вот, даже таксерам понравилось %-)) А для ценителей хорошего звука и утонченного исполнения есть, собственно, клубы. Хотя именно рокнролл для меня всегда больше ассоциировался с музыкой уличной, хулиганской. Так что ОффБит - лучшие. ИМХО :-)))


