  text: 'Друзья!

    Те, кто не пришел, многое потеряли... Концерт парни отыграли "на ура". Я искренне недоумеваю по поводу того, как публика ломится на разных там "звезд" сомнительной ориентации, выжимающих из себя попсу под "фанеру". Искренность и драйв блюзменов просто потрясает. Я думаю, что в следующий раз нужно просто собрать оргкомитет, попробовать добыть через состоятельных любителей блюза (вполне возможно, такие есть) какие-то деньги и нанять на них хотя бы кого-то из телевидения для репортажа, чтобы люди поняли, что есть музыка и "музычка". Я очень уважаю Константина Никольского, но его вставка в общий формат мероприятия явно не вписывалась...

    Спасибо Сереже Воронову, "Петровичу", Гие, Мише Мишурису, Вадиму Иващенко, Денису Мажукову и Валерию Гелюте (всех просто перечислить невозможно) за высочайшее мастерство и истинное удовольствие.

    С уважением - Леонид Остапенко'
