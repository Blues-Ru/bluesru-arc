      subject: дичь крупным помолом
      deleted: false
      text: "Ок, фраза \"Еще я тогда побывал в детской больнице и надеюсь снова туда попасть.\" - просто неловко сформулирована. Ок, \"приезжал три года назад\" - что-то не правильно понято. Но когда Great Spirit перевели как \"Большой Босс\" - я не смог дальше читать. \nблин, а в другой статье: \"прощальный концерт - это как похороны\" - изящно как сказано! \nОткуда все это берется? Я три раза сказал \"Еженедельному журналу\", что \"Дельта Миссиссиппи\" - название района, а не географический термин... Все равно написали с маленькой. В статье у меня сказано, что приехал он в четвертый раз. Все равно, в подзаголовке статьи редакция пишет \"в третий\"..."
