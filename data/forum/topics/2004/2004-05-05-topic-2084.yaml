                  text: "Я к сожалению, не умею делать нормальные инсталяции. И в клубах работаю крайне редко по одной, и\
                    \ очень скверной причине - не переношу табачного дыма :-)\nБезумно заманчиво сделать нормальный блюзовый\
                    \ клуб, с превосходным звуком, с возможностью записи выступлений.\nВопрос о хорошем звуке, хоть и не имеет\
                    \ отношения к данному форуму :-) на мой взгляд крайне интересен, и заслуживает отдельного обсуждения.\
                    \ То, что у нас происходит - это полное отсутствие звукотехнической культуры, звукрежами работают как\
                    \ правило музыканты - неудачники с большими понтами. Слушатель \"приучен\" к скверному, перекомпрессированному\
                    \ звуку, к перегруженному помещению, к мексиканскому микрофону \"ШУР\" и т.п. И в результате - музыканты\
                    \ друг друга \"не слышат\", нет в игре тонкой динамики, все играют \"Гранд Форте\" и совсем нет тонких\
                    \ ньюансов.\nКак пример (простите ребята) - дуэт горяче любимого мной Братецкого и Кораблина. Ощущение\
                    \ - что они орут друг на друга. А ведь этот дуэт - далеко не самое худшее ( а скорее даже весьма положительное)\
                    \ что у нас есть. И самое страшное - это привычка уже самих музыкантов, к этой безумной вакханалии звука.\n\
                    Пример из личной практики. Отрулил одному музыканту очень чистый звук на сцене. Морочился часа 4, в результате\
                    \ - все друг друга слышат просто в идеале. Концерт - полный тухляк. После концерта мне объясняют - как\
                    \ вдарю по гитаре, слышу как облажался, пугаюсь и зажимаюсь в испуге. А тут бас - мимо ритма. Бочка -\
                    \ съехала. Боже мой, какая лажа. \nА когда всего этого не слышно - рубим в мутном и шевелящемся саунде,\
                    \ и все клево, всем весело... :-(\nПолитика клубов - тоже неоднозначна. Я как то по просьбе друзей музыкантов\
                    \ попробовал хотя бы примерно \"Отрулить\" клубный звук (известный как клуб с очень плохим звуком) в одном,\
                    \ довольно известном клубе. Получил кучу благодарностей от музыкантов и людей с ними пришедших послушать\
                    \ музыку. И - запрет на работу в этом клубе от местной администрации. Типа, вместо того, чтобы пить, жевать\
                    \ и переваривать пищу, люди стали слушать музыку, и тем нарушили концепт \"фоновости\" музыкального формата\
                    \ клуба. :-(\nХорошие звукорежисеры в клуб не пойдут. А если и пойдут - то на немалую зарплату и скорее\
                    \ всего частичной занятостью. \nГрустно это - рулить звук для жующих людей, которым это совсем не надо.\n\
                    А жаль...."
