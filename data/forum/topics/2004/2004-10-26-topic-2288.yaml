  text: 'По последней информации мастер-класс Рика Эстрина и Чарли Бейти состоится в воскресенье, 31-го октября в Клубе на
    Брестской в 18:00. Напомню, что в 20:00 там же и в тот же день состоится blues.ru-minifest и мой ДР ;) Приходите!

