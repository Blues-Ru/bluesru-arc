            subject: Целевая аудитория
            deleted: false
            text: "Целевая аудитория может быть разной. Заметьте, на Эфесе было полно людей, пришедших попить пива, а потом радовались, что такая классная, оказывается, музыка - этот блюз. Многие новички подсаживались на блюз, если им нравилась АТМОСФЕРА вокруг музыки. Поверьте на слово, я в свое время столько народу переводил на блюзы. Так вот, наша субкультура будет расти, если ее развивать, популяризовывать среди людей. Большая часть аудитории пассивна, она слушает, что дают, так давайте ей побольше блюза. Хороший он, плохой - они на первом этапе могут и не заметить, если весь антураж покажется привлекательным.\nА многие тут ругают всех и вся на чем свет стоит. Ругают тусовщиков и ценителей, музыкантов. Но блюз - это не только музыка, это именно субкультура, так мне кажется. И если не будет куда ходить и с кем вживую общаться, то и настоящего блюза не будет. А для многих живое общение со знатоками и ценителями блюза пошло бы ох как на пользу. И интерес бы к блюзу повысился, я думаю, в том числе. В какой-то степени многое держится на персоналиях, на личностях. \nТак, может быть, стоит поискать что-то объединяющее, а не поводы для разногласий? И почаще обсуждать это живым порядком."
