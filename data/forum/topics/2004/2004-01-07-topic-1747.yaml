                  text: "А, я понял почему у нас не может быть блюза. Нормальный музыкант корневой музыки - волосатый (лысый) подонок, ничего не умеющий кроме как пить, матюгаться, пырять ножичком из за 25и центов или косого взгляда, плохообразованный и вонючий. За счет такого \"просветления\" и полнейшего освобождения от заморочек \"исскуства\", на концертах он подцепляется членом к \"небесам\" (или, откуда там блюз, так сказать к другой епархии) и является проводником между игрегором и слушателями.\nА у нас (увы) блюзом занимаются сплошь \"интелигенты\", и уж совсем увы - хорошие приятные люди. \nУж какой тут блюз возможен. Сплошное эстетство, гадость и подражание.\nНадо бы занятся корневым блатняком. Одна проблема - старый уже, зону тянуть...."
