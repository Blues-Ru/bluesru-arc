  text: Как известно, Little Charlie & The Nightcats приедут на Эфес. Группа товарищей с гармоники.ру очень хочет поучиться
    у Рика Эстрина в рамках воркшопа (мастер-класса). Подобные мероприятия с большой пользой уже проводились, когда приезжали
    разные блюзовые музыканты. Другая группа товарищей очень хочет послушать полноценный клубный концерт, раз уж они в Москве.
    По этим причинам были затеяны переговоры со всеми заинтересованными сторонами о том, чтобы расширить пребывание LC & NCats
    в России клубным концертом и мастер-классами. Мнение блюзовой общественности по этому поводу является очень важным фактором
    при принятии окончательного решения ;) В связи с этим на сайте www.bluescats.ru сделали петицию, под которой все неравнодушные
    могут подписаться ;)
