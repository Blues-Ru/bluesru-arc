  text: "Из новостей на bluesnews.ru: \nВ США опубликована книга о блюзе в России\n\nПолитолог Michael Urban опубликовал книгу «Russia Gets the Blues: Music, Culture, and Community in Unsettled Times». Несколько лет назад Урбан приезжал в нашу страну для сбора материала, встречался с музыкантами, журналистами, политиками, выясняя корни и нынешнее состояния сугубо американского жанра, прижившегося в городской культуре СССР и сегодняшней России. «Русские восприняли блюз, поскольку он созвучен с их опытом», - сказал писатель в интервью журналисту Интернет-издания UC Sanat Cruz- Currents online.\n      После крушения коммунизма в 1991 русские стояли перед проблемой гигантского переворота и нестабильности, отмечает Урбан, подобно чернокожим в Америке они оказались со своими надеждами и личными стремлениями в условиях оставлявших мало места для оптимизма. «Заключенный в сердце блюза оптимизм, тронул русскую душу», - считает писатель. \n     В информации Майкла Урбана представляют, как «эксперта по политической системе России» и гитариста-любителя. Книга, написанная при содействии московского радиожурналиста Андрея Евдокимова, выпушена нью-йоркским издательством Cornell University Press в начале 2004.\n      ОМ 29.06.04 \n\nАндрей, поздравляю!"
