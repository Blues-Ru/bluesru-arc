    text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDCASS70402062203262725&sql=A88q6g4jttv2z\n\nВторой альбом Кудера - это работа гения! Все песни звучат очень убедительно, диск слушается как одно целое произведение. Фолк, блюзы и баллады, кантри-рок, южный рут-рок; уже слышно влияние текс-мекса и островных культур. Шикарная игра на гитарах и мандолинах, яркий и стильный вокал. Ван Дайк Паркс и Ленни Варонкер остались с Кудером и на этом альбоме. \n\nОценка 5 баллов! Шикарный диск, один из лучших у Рая. F.D.R. In Trinidad и Teardrops Will Fall - лучшие треки на альбоме. Абсолютно необходимая пластинка в любой коллекции."
