  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70402101939513310&sql=A5u9yxdgb8old\n\nЭтот альбом 70-го года на фирме Вангард вполне музыкален! Бадди не увлекается угаром и криком, играет интересные гитарные ходы, есть даже необычные аранжировки! Звук не самый лучший, но все же это можно слушать. Духовая секция играет скромно, джазмен-пианист Джуниор Морис играет много, но по блюзу, Фил Гай аккомпанирует на второй гитаре. \n\nОценка 3 балла. Почти все треки неоправданно затянуты; их всего 7 на почти 40-минутном диске. После интересной обработки Watermelon Man (это первый трек) остальные треки звучат довольно бледно; еще можно выделить I'm Ready и You Don't Love Me. Этот диск должен понравится любителям традиционного Чикаго-блюза, но не ждите от него чудес - их тут просто нет."
