    Где и с кем.. ну,типа музыкант, сочувствующий и так далее, да и любые подробности биографии, база у нас резиновая!


    Обещаем, как софт напишем и базу в него имплантируем:

    - за два дня до ДР извещать общественность о кануне радостного события;

    - в сам ДР - шарики и панегирики на соответствующей странице сайта!


    Пишите, пожалуйста, от себя лично и за того парня, у которого интернета нету! И за ту девушку тоже!'
