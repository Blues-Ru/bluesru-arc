  text: 'В 1992 г., после фестиваля “Блюз в России”, по ТВ ВИД (Взгляд) показывали
    ТВ версию фестиваля. И там в заставке (по зимней, вечерней Москве едет старенький
    автомобиль), всегда играла ”Hey, Good Looking”. Вот я хочу спросить (вопрос, наверное,
    для Евдокимова): в чьём исполнении она там звучала?

    И ещё один вопрос (извиняйте за оффтопик): тогда же была такая советская хард-роковая
    группа Jimmy. Они даже на “Мелодии” выпустили диск (последние деньки “Мелодии”
    :-) Их, помню, в программе “А” показывали. Добрая песенка у них была, You Gonna
    Love Me, Baby называлась. В общем, понравились мне они. Но с тех пор они больше
    не появлялись в поле зрения. Не знаете ли что с ними?'
