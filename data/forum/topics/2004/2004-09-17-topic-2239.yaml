    text: 'Что-то типа: Hey, Good Lookin. What You''ve Got Cookin''...

      И, кажись, Hank Williams он же и автор её.

      Но тогда по ящику было другое её исполнение. Может и ошибусь: было чем-то похоже
      на Howlin'' Wolf (давно это было, уж плохо помню), такой "бандитский" голос.

      Я с тех пор её, в том исполнении, и ищу. Попадались Carl Lee Perkins, Dwight
      Yoakam and Buckwheat Zydeco, The Mavericks (Leon Russell). Но так и не узнал
      кто ж там её пел...'
