            deleted: false
            text: "Товарищ сержант!\nОбъясняю популярно. Многие, если не все подряд, начинающие музыканты приступают к освоению блюза именно с SRV. И это само по себе неплохо, учитывая, что я тоже через увлечение проходил, и потратил на освоение оного лет пять (а всего я слушаю SRV лет 15), причём я осваивал преимущественно технику исполнения быстрых композиций типа Pride and Joy, Rude Mood, Scuttle Buttin, Mary Had.., при этом я неоднократно пробовал, но убеждался в том, что не могу играть достаточно точно \"в стиле\" медленные композиции SRV. И до сих пор не могу и поэтому не играю. \nПричём признаюсь, что ко многим композициям SRV я равнодушен,  например Lenny. Ну уж такие у меня вкусы, предлагаю о них даже не спорить, поскольку мои вкусы никого, кроме меня, не касаются. По большому счёту.\n(Я тут параллельно процессу написания сего ответа, веду дискуссию с уважаемым VR, так мы пришли практически синхронно к мысли, что:\n1) Сам по себе SRV безусловно велик и уникален, сие не оспаривается\n2) Но учиться на нём вредно, потому что блюзовый стиль SRV, по выражению VR, является \"концентратом блюзового наследия\", поэтому употребление неразбавленным вредно для растущего организма.\n3) Я считаю, что переходить к освоению стиля SRV стоит после изучения стилей больших чёрных парней, от которых он многое позаимствовал, а именно - Albert King в части стиля тяжёлых медленных блюзов, интонирования бендов, T-Bone Walker - в части мелодических вариаций в боксах, Albert Collins - в части экспрессии звукоизвлечения (хотя от последнего SRV взял меньше всего) и конечно Buddy Guy, после которого SRV переиграл добрую половину своих \"вечнозелёнок\". \nУважаемый VR ещё указывает на Jimi Hendrix как на основной источник, и я с ним полностью согласен. Jimi - это наше всё. Он даже на Пушкина кисти Кипренского похож слегка на Are You Experienced, если внимательно приглядеться.\nВот. Так что ежели какой юноша с энтузиазмом неофита берётся сразу за SRV, моя естесвенная первая реакция именно такова - \"Не спеши, попробуй что полегче для начала\". А то у меня есть ряд примеров, что люди просто обламываются в бесплодных попытках в течение многих лет сыграть как Stevie, а в конце концов вообще перестают играть на гитаре - а чего играть, всё равно так не сыграешь.. но это вопрос другой. Каждый музыкант развивается в системе координат относительно самого себя, и если задать неправильный масштаб, то свои успехи будут просто не видны. Jimi и Stevie - слишком крупные единицы измерения. Типа как миля. А в процессе обучения успехи многих месяцев труда иногда измеряются миллиметрами, и это нормально. У каждого свои способности к научению. Просто слушать, снимать и играть надо много, часто и с удовольствиям, думая постоянно о том, что постепенно(!) всё получится."
