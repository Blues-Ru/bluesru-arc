            deleted: false
            text: "Товарищ сержант!\n\nДык я ж тоже за многообразие! Я всех перечисленных тобой господ хорошо знаю и постоянно слушаю! Пусть расцветут сто цветов, как говорят братья китайцы, которые изобрели, кстати, пентатонику, ещё 6000 лет назад. (Ну разве только Лаки Петерсена давненько не слышал, виноват, исправлюсь!)\nЯ просто про то, чтобы знания, а особенно процесс обучения юношей, обладали свойством системности. Если брать двух заведомых не-гениев, то хорошо обученный ремеслу музыкант почти в любом случае сыграет лучше талантливого самоучки, уж ежели первого вдохновение не посетит, то моторный навык сам вырулит куда надо. Это я уж который раз говорю, а мысль не моя, а умных людей-психологов, которые изучали и моделировали \"гениев\" из различных областей человеческой деятельности. \"Гении\" взяты в кавычки не в знак иронии, а как обозначение особого класса людей, достигших наивысших ступеней мастерства. Ну дык научным путём были заново открыты старые истины:\n1) \"Гении\" обладают чертовски хорошей и избирательной памятью в своей предметной области - про то, чем они занимаются, они знают всё.\n2) Но это \"всё\" они забывают так же быстро, как и изучают, но забывают не методом выбрасывания из головы ненужного, как студент после экзамена, а методом быстрого переноса из области сознательного внимания в область подсознательных, сиречь автоматических навыков.\n3) \"Гении\" обычно творят в некотором состоянии, которое называется \"незнанием\", то есть контроль сознания за их творчеством практически отсутствует, они действительно не знают, почему и как они это делают, и поэтому со стороны это выглядит чрезвычайно легко, просто и естественно. Ну как бы само собой получается.\n4) Тем не менее, стратегии \"гениальности\" эксплицитны, то есть изучаемы и переносимы, и являются объектом моделирования в специальных психологических дисциплинах. \nЯ не хочу сказать, что психологи набросятся на пока ещё живого Би Би Кинга, дай ему Бог сто лет жизни, а потом откроют экспресс-курсы по выпуску клонов Би Би, но: (прошу прочитать внимательно) для того, чтобы стать блюзменом, не надо проходить жизненный путь традиционного блюзмена старой формации, просто, владея методикой, можно изучить и понять, как блюзмен входит в состояние исполнения блюза, и применить это к себе. Шляпы и прочие аксессуары некоторым помогают именно поэтому =))\nЕщё раз прошу понять написанное правильно. Гения невозможно скопировать. Можно только понять его стратегию гениальности и попытаться применить в процессе своего личного профессионального роста. Вы не станете вторым SRV, просто сами станете играть лучше."
