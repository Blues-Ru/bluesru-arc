                    text: "могу и спеть - за мной не заржавеет. вот здесь:http://blues.ru/forum/?id=33290&page=1&body=1#33290 ты черным по белому написал, что форма выражения не имеет значения, если ты считаешь пост \"информативным\". а раз так, то чего стесняться?\nпросто один раз это уже было. привело к очень плачевным последствиям. сейчас история повторяется - ты позволяешь ругать нелюбимый тобой BBR в любых выражениях. Получишь в итоге то же самое.\nО чем я? о том, что правила должны быть общими для всех. Т.е., ругают или хвалят нелюбимый модератором блюзбэнд, нужно придерживаться формальных правил. не придерживаешься - реплика должна быть удалена. \nА нынешнему тону общения в форуме научили меня два чела: Казанцев, который посылал меня на фиг, и Федор, благодушно взиравший на это модератор. почему взирал? а потому что ему нравился казанцевский посыл борьбы с петровичем и всеми, кто в шляпах. Потом выяснилось, что казанцев посылает и всех, кто из северной европы. Вот тут модератор проснулся и начал объяснять казанцеву правила полемики в форуме. \nя не хочу повторений пройденного. \nВсегда ваш\nсомодератор-бBEEPга Евдокимов"
