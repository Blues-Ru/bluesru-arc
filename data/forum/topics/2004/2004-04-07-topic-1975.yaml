    text: 'Например, моя знает, что:

      1) Если ухо не слышит, то и табы не помогут. Ещё никто не научился играть блюз по табам. Ну разве только на кухне побренчать.

      2) И вообще, SRV на этом форуме - слово ругательное. Почему-то для абсолютного большинства вьюношей блюз начинается и заканчивается на SRV. Кроме него ничего больше знать и играть не хочут. Эта болезнь называется Vaughnism и очень заразна. Ограничивает кругозор, приводит к навязчивости, депрессии, фрустрации и так далее. Лечится исключительно строгой цензурой.

      3) Есть такая штука - поисковые системы. Очень помогает. За 1 минуту по запросу *SRV tabs* получишь всё что надо. Например, http://www.akkords.ru/band.php?2687'
