                      text: "То, как я модерирую, никак не зависит от любви или нелюбви к Петровичу, серверной Европе или BBR, тут ты заблуждаешься и делаешь неправильные выводы. Более того, меня вообще не выводит из себя, если кто-то со мной не согласен. Я могу ругаться с Казанцевым или кем-то еще в форуме, но никогда не буду ему хамить, и выступаю при этом как частное лицо. Твоя фраза \"проснулся, когда Казанцев послал всех, кто из северной Европы\" наталкивает на мысли о том, что я должен был проснуться раньше или вообще не засыпать, когда Казанцев начал ругать Петровича или кого-то еще, и нещадно его посты модерировать. Т.е. использовать модерирование в идеологической борьбе. А я говорю, что я категорически несогласен с таким подходом, если он или кто-то еще не хамит собеседникам, то пусть плохо отзывается хоть о мадди уотерзе, я модерировать не буду, хотя выскажу, например, свое осуждение и несогласие как частное лицо. \nИ, пожалуйста, не надо ни у кого ничего перенимать..."
