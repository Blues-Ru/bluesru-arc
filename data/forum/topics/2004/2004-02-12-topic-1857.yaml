  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70402112230521610&sql=A8jbsa9rgu23h


    Gee, it sounds amazing!


    Терри выпустил прекрасный дебют на лейбле Pointblank и после этого решил поработать
    для аудиофильского лейбла AudioQuest Music. Рай Кудер остался (они работают вместе
    с 1976 года и очень любят и ценят друг друга), сын Рая Джоаким играет на перкусии,
    Джим Келтнер тоже тут (Келтнер/Кудер - это актуально всегда), на тромбоне играет
    Джордж Бохэнон (он в представлении не нуждается, будучи одним из самых заметных
    тромбонистов в джазе/блюзе/фанке).


    На альбоме 10 композиций на 52 минуты. Шесть из них написал Терри. С самых первых
    нот невозможно оторватся от такого классного звука и музыки! Живая запись, прекрасные
    песни, классные аранжировки и соло. Тут мень ше госпел-влияния, чем на предыдущем
    альбоме, но появилось влияние фолка и южного соула. Одна классная вещь сменяется
    еще более интересной - кажется, что это нереально хорошо! Будто слушаешь чей-то
    The Best Of лет так за 10-15.


    Оценка 5 баллов! Невероятный альбом! Я даже не знаю какие треки выделить; тут
    нет слабых! Too Many Ups And Downs, Down In Mississippi, Rooftop Tomcat, A Lover
    Like You, Blues No More - всё это очень и очень сильно! Альбом из разряда "Must
    Have"! Обязателен для прослушивания, это классика 90-х (к сожалению немногочисленная).'
