  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70401120901142921&sql=A1sn20r3ac48n\n\nБезумие, блюз-рок, психоделия,\
    \ вуду-музыка, наркотики, новый орлеан, полифония, дурь, безумие...\n\nЭто второй альбом Доктора Джона на Atco Records.\
    \ Дури стало еще больше, музыки еще меньше, запись по-прежнему плохого качества. По безумию это сравнимо только с Капитаном\
    \ Бифхартом и Томом Уэйтсом. Конечно, гений Доктора уже тут, но пока он еще плохо оформлен и слишком много наркоты. \n\
    \nОценка 2 балла. Barefoot Lady, The Patriotic Flag-Waver и Twilight Zone вполне съедобны, но этого явно недостаточно.\
    \ Анти-поп-музыка на поп-альбоме? А зачем? А почему на этом поп-лэйбле? А где подпись на обложке, что это \"кино не для\
    \ всех\"?\n\nЕсли Вы не \"торчите\", то альбом Вам может не понравиться."
