      text: "музыканты :) И весть о приезде обнадеживающая. Да и анонс уже кто-то печатал в этом форуме..\nСоставов и проектов\
        \ у него было (и, дай Бог, будет) невообразимое количество, музыка из под его \"пера\" выходит разнообразная. Об этом\
        \ лучше Shkin'a едва ли кто расскажет. \nОт себя могу лишь предложить послушать несколько треков, дабы попытаться\
        \ заинтересовать творчеством (не музыкой, музыка будет другая) этих замечательных музыкантов. Послушайте, не пожалейте\
        \ мегабайтов, эта музыка того стоит. Две первые из представленных вещей -  саундтрек, одна - с Gift'a, как неоднократно\
        \ нарекли едкие критики, - \"музыка для супермаркетов\" (имелась ввиду, видимо, некая поп-ориентированность). Пьесы,\
        \ состоящие целиком и полностью из одного лишь Зорновского саунд-дизайна :) лучше слушать живьем или на пластинках.\
        \ Саксофон можно будет услышать в МДМ..\nElectric Masada - это другой проект, с другой концепцией, но ниже работы\
        \ с участием тех же музыкантов, что приедут к нам. О мастерстве судить можно, как мне кажется. Правда, Зорн на этих\
        \ треках по большей части в качестве композитора и продюсера, без саксофона. В скобках указываю только приезжающих,\
        \ в записи же принимало участие большее кол-во музыкантов.\n\"Houdini\" - Marc Ribot (guitars), Ikue Mori (drum machines),\
        \ John Zorn (sound effects)\nhttp://greta.bluesman.ru/mine/JZ/09-Houdini.mp3\n\"End Titles\" - Marc Ribot (guitars),\
        \ Cyro Baptista (percussion), John Zorn (composer & arranger) (плюс в этой вещи другой отличнейший басист Greg Cohen,\
        \ принимающий участие во многих проектах Зорна).\nhttp://greta.bluesman.ru/mine/JZ/04-End_Titles.mp3\n\"Snake Catcher\"\
        \ - Marc Ribot (guitar), Trevor Dunn (bass), Cyro Baptista (percussion), Jamie Saft (Wurlitzer piano), Joey Baron\
        \ (drums), John Zorn (composer & arranger)\nhttp://greta.bluesman.ru/mine/JZ/05-Snake_Catcher.mp3"
