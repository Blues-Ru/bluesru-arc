      deleted: false
      text: ';) Буду краток. На мой взгляд, концерт был великолепным, чему я очень рад! Я знал, что группа отличная, но не
        ожидал настолько мощного звука в сочетании с музыкальными пирогами. Безупречная ритм-секция, Хокон вне конкуренции
        - супер-блюзовый-гитарист, Эйрик играет на все 40, хотя ему только что исполнилось 20. Вокал у Эйрика гораздо сильнее
        и уверенней, чем на демо-записях, в любом случае, для 20 лет более чем хорошо и серьезно.

        Если сравнивать с концертом Примича во Владимире, а этот концерт, пожалуй, был лучшим из 4-х, вместе с концертом в
        Форте, то могу уверенно сказать, что норвеги сыграли сильнее, на мой взгляд. Концерт Примича мне безумно понравился,
        и у Примича есть свои вещи, за которые я его очень заценил - песни, соло, гитара Шорти и т.д. Но если сравнивать общее
        впечатление - блюз, эмоции, импровизации, настроение, раскачивание ритм-секции, то я отдам предпочтение норвегам.
        ;)'
