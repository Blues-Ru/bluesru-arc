    subject: Выступление во Владимире.
    deleted: false
    text: "Концерт был хорошим. Если хотите получить массу отличного настроения на целую неделю - обязательно сходите, потому\
      \ как ребята, несмотря на свою молодость, а может и благодаря ей вчера очень неслабо устроили приличный заколбас. \n\
      Пожалуй, только пара вещей не понравились: слабоватость барабанщика и какая-то общая зацикленность гитариста. Барабанщик,\
      \ конечно, умеет играть шаффл, и делает это довольно правильно, но не так здорово, как, скажем, драммер у Примича; какая-то\
      \ урезанность чувствовалась в его игре, недоигранность что ли. Разумеется, это все в сравнении с другими иностранными\
      \ бандами, у нас как Петтерсен все равно мало кто сыграет :) Гитарист Хойа не порадовал интересной музыкальной игрой,\
      \ с ходу ударившись в забой и запиливание с кучей фишек, выдранных из Холмстрома; хотя, судя по выложенным мп3, играть\
      \ он может и очень вдумчиво. Но это все мои придирки, забой это хорошо, по-любому: видимо, это такая специфика нашего\
      \ \"Z-клуба\" - все приезжие гости, включая шведов и американцев, играли здесь именно для танцующего народа, а не для\
      \ распивающих пиво любителей заковыристых фраз :) и это правильно. \nТеперь о том, что понравилось. Главный перец всей\
      \ банды Берген несомненно порадовал - очень симпатичное звукоизвлечение, грамотное цитирование и уверенная игра. Поет\
      \ он тоже хорошо, пусть и высоковато, но зато своим голосом и четко, без захрюкиваний и хрипов. Понравилась игра басиста,\
      \ несколько вытягивающего всю ритм-секцию на нужный уровень. Понравилось, как вся сыграна банда целиком.\nЕсли же сравнивать\
      \ банду Примича и банду Бергена, то я за американцев; там была гораздо интереснее выполненая гитарная работа и лучшая\
      \ ритм-секция и не было столько запиливаний - но это моё мнение, большинству же людей, с кем удалось поговорить после\
      \ концерта, норвеги понравились куда больше, чем американцы - как раз своим шоу, заколбасом, поведением на сцене и,\
      \ как говорят здесь некоторые личности, \"духовностью\" :) бергены давят именно на драйв и отрыв - а это уже дело каждого,\
      \ что кому больше нравится. \nКороче говоря, группа классная, играют отменно, шоу есть - по-любому приходите на концерт,\
      \ дело того стоит."
