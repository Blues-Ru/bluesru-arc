  text: "Небольшая стебная вещь на две с небольшим минуты; по жанру - что-то вроде поп-свинга или свингопопа :)\n.\nПросьба скачать, оценить и высказать свое мнение. Приветствуются крайне злобные и ругательные, но конкретные и по существу, высказывания. Надеюсь дождаться хотя бы пары комментариев :) по своему опыту знаю, что больше здесь не бывает почему-то. \n.\nОткуда качать\n.\nДля удобства скачивания сделал несколько версий:\nhttp://dedmorozzz.nightmail.ru/dm_ball_hq.mp3 - высокое качество, 192 kbps, 3.0 Мб\nhttp://dedmorozzz.nightmail.ru/dm_ball_mq.mp3 - среднее качество, 128 kbps, 2.0 Мб\nhttp://dedmorozzz.nightmail.ru/dm_ball_lq.mp3 - низкобюджетное качество, 64 kbps, 1.0 Мб\nhttp://dedmorozzz.nightmail.ru/dm_ball_vlq.ra - унитазное качество, Real Audio\n.\nУ кого не скачивается с ньюмейла есть зеркала на народе:\nhttp://dedmorozzz84.narod.ru/dm_ball_hq.mp3\nhttp://dedmorozzz84.narod.ru/dm_ball_mq.mp3\nhttp://dedmorozzz84.narod.ru/dm_ball_lq.mp3\nhttp://dedmorozzz84.narod.ru/dm_ball_vlq.ra"
