    text: '...в ни чем ни примечательных житейско-бытовых условиях родился человек с искренними и наивными глазами...

      слушая его музыку и просматривая видео с его участием я пытаюсь понять что такого было в нём, что   заставляет многих достойных людей вспоминать о нем с теплом в сердце...

      хьюберт самлин говорил о нём - there was something from a God inside him...

      у клиффорда антуан появлялись слезы в глазах, как только пайнтоп начинал наигрывать How Long Blues...

      другой не столь известный человек вспоминал спустя много лет, как он случайно застал пайнтопа за кулисами в одиночестве - их беседа продолжалась час - и в его воспоминаниях это был один из лучших проведенных часов в его жизни...

      от этих ребят - пайнтопа, хьюберта, вилли биг айс смита и других я узнал что такое искренняя любовь к музыке, к своему делу, друг к другу и к зрителю...

      спасибо им за это...

      и поразительно как на протяжении последнего года они ушли один за другим, как будто не могли друг без друга...


      http://www.youtube.com/watch?v=JW3Yq8fRWOY'
