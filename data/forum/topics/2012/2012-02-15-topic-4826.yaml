  text: 'Живое кино это просмотр фильма, при котором каждый зритель становится героем кино. На три часа зрительный зал становится одним из персонажей фильма, реагируя на развитие сюжета определёнными выкриками или действиями. Мы будем вместе петь песни из фильма, разучим движения "Shake a tail feather", будем танцевать, кричать легендарное "Наша миссия от Бога" и пить каждый раз, когда на экране будет переворачиваться полицейская машина.


