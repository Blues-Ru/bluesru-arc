    subject: Э, брат, полегче с Кассандрой
    deleted: false
    text: Выкрутасов там хватает, но, как писал рецезент оллмьюзик, "несмотря на вычурность и крайнюю эклектичность, альбом (имярек) пользовался огромным успехом". В частности, у мня пользовался... За что берется, получается клево. Мне очень нравятся её варианты "Death Letter" Сан Хауса и "Slow Down" Джей Би Ленора. И нот там сколько следует, не более. Конечно, допускаю, что многого не слышал, а оно как раз подходит под твои дефиниции.
