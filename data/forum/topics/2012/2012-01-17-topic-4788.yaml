  text: "news.tut.by голосом и ликом Евгения Долгих рассказывает о Кассандре Уилсон. К рассказу прилагается роскошная видеопрограмма на темы блюзовых стандартов. \n\nhttp://news.tut.by/culture/267662.html\n\nПо моему скромному разумению, музыка Уилсон  - блестящий пример такого распространенного явления, когда музыкальные выкрутасы полностью затмевают блюзовую суть. Количество нот никогда не переходит в качество. ну вот так вот, если коротенько..."
