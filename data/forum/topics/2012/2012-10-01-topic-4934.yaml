  text: 'В субботу в 6 вечера в ДуДе мы соберем мастер-класс с гастролерами для гитаристов
    и клавишников. Я думаю, 45+45 мин, гитара, потом орган.


    Гитаристам я крайне рекомендую, Алекс Шульц - один из первых людей, у кого нужно
    учиться таймингу, фразировке и стилю. Я сам думаю, что на меня он как гитарист
    повлиял больше других.


    Клавишники смогут пощупать живой Хаммонд, узнать, как он работает, и в чем нюансы.
    Но, вообще, я думаю, что это интересно всем.


    После мастер-класса, разумеется, концерт!'
