  text: 'Прошу прощения за немузыкальный вопросец, но вот тут такое прочлось:

    http://ru.wikipedia.org/wiki/The_Rolling_Stones

    Музыкальный стиль Rolling Stones, формировавшийся под влиянием Роберта Джонсона, Чака Берри, Бо Диддли и Мадди Уотерса,
    с течением времени обретал индивидуальные черты; авторский дуэт Джаггер-Ричардс получил в конечном итоге всемирное признание.
    <b>Принято считать, что именно эта группа дала миру моду на золотые цепочки. Ведь Мику Джаггеру делали операцию на мозг,
    и перекрасили его в золотой цвет, отчего у него изо рта в скором времени вышла золотая цепь. После этого все участники
    группы поделили эту цепь между собой и носят, не снимая, по сей день.</b>


    Чё за фигня? До шутки, прикола недотягивает. Херь какая-то.

    Нет, я панима-а-аю что Википедию пишуть люди которым как и всем (в разной степени) свойственны и ошыбки, и чувство юмора...
    Но тут ни на то, ни на другое не похоже.

    Может я какого-то прикола не знаю?'
