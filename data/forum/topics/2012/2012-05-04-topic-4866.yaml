  text: "http://73online.ru/readnews/17818 :\n\n13 мая в 19 00 на сцене концертного зала Областного Дворца творчества молодежи выступит настоящая звезда блюза.\n    Организаторы концерта Ульяновской областной филармонии советует поспешить приобрести билеты. Количество мест ограничено. Как прокомментировали организаторы уже сейчас идет оптовая продажа билетов.  У многих настольгия по настоящему блюзу уже много лет. Приезд в город Роберта Лайтхаусф настоящий подарок всем почитателям хорошей качественной музыки.\nСтоимость билетов от 350 до 500 рублей.\n    Гитара, вокал, губная гармошка — Роберт Лайтхаус на сегодняшний день является одним из самых ярких представителей ДЕЛЬТА БЛЮЗА на североатлантическом побережье океана.\n     ДЕЛЬТА БЛЮЗ — самый ранний стиль блюзовой музыки, появившийся в начале прошлого века в районе дельты реки Миссисипи. Первые записи Дельта блюза были созданы в конце 20-х годов. Постепенно этот стиль стал распространяться по всей стране и начали появляться его разновидности, как например, чикагский и детройтский блюз. Дельта блюз оказал большое влияние на британский блюз, который в конце концов стал родоначальником хард-рока и хэви-метал. А самые известные рок-исполнители (Led Zeppelin, J. Hendrix, Сreedance, E. Clapton, Doors и многие другие) всегда имели в своём репертуаре классические произведения MISSISSIPI DELTA блюзменов.\nСамые яркие и известные представителя — John Lee Hooker, Muddy Waters, Willi Dixon, Howlin Wolf, Robert Johnson, R. L. Burnside, Little Water и другие.\nРоберт Лайтхаус долгое время путешествовал по стране, посещал блюзовые Мекки Америки — Чикаго и Новый Орлеан, играл на улицах, в барах и клубах. Появившись в Вашингтоне, он попал в группу легендарного гармошечника Charlie Sayles и начались первые гастроли по США и Европе. А уже через год Роберт начал давать сольные концерты.\n    Его первая группа получила название «The Crawling Kingsnake», где играли опытные профессионалы-блюзмены Clark Mathews и John Perry. В конце концов Роберт Лайтхаус попал в поле зрения лидера музыкальной индустрии Вашингтона Wayne Kahn (Уэйн Канн), с помощью которого был записан первый альбом «Drive — Thru Love», получивший признание в стране и за рубежом. На униальный стиль Роберта повлияли такие исполнители как Мадди Уотерс, Dr. Ross, Элмор Джеймс, John Lee Hooker и Джимми Хендрикс. Многие критики отмечали, что манера игры и пения Роберта соответствует тому, как это бы исполнял в наши дни Хендрикс, если бы был жив."
