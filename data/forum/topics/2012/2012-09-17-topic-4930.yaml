    text: Думаю, перед нами яркий пример песни с двойным смыслом. Если в деревенских блюзах (или в стилизациях под таковые)
      речь идёт об "еде" или "урожае", почти всегда это не совсем то что слышится при переводе "в лоб". Потому и они воспринимаются
      как юмористические- свой слушатель -то понимает в чём дело. Словом, "мельница сломалась и урожай собирает другой"- это
      скорее о супружеской измене. А точнее даже о том, что когда у супруга "мельница сломалась" тут же находятся разные добровольные
      помошники. Отсюда и танцы- песня-то весёлая, юмористическая.
