  text: 'Жизнь есть путь, дорога. Бывает, идёшь под согревающим солнцем, бывает под безжалостным ливнем, иногда тропа поднимается в крутые горы, а иногда идёт через поле созревшей ржи, пейзаж меняется раз за разом, меняется погода. На своём пути мы много чего встречаем: люди, звери… Звероподобные человеки. Иной раз у нас появляются попутчики – наши дороги совпали, другой — пройдёт мимо и не взглянет. Никогда не знаешь, что ждёт тебя за тем поворотом. Как бы ты не уставал в пути, кого бы не повстречал, главное – периодически находить убежище, место для отдыха. В минувший четверг, 3 мая, нашим убежищем, где мы скрылись от будничных обязанностей и забот, стал «Дом у Дороги/Rhythm&Blues Cafe», здесь мы и переведём дух в компании улыбчивого блюзового музыканта Алексея Аграновского и команды de Blues Spinners.


    http://musecube.org/?p=42107'
