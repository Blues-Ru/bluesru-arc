  text: 'блюзовая величина из первой лиги Боб Марголин пишет о предстоящих гастролях в России, находя замечательные слова
    для поддерживающего его российского музыкального коллектива The Jumping Cats... Вот его слова...


    "It will be my honor and pleasure to play 4 shows in Russia with Vladimir and his fine band. I am glad that in such a
    challenging and restless world, Blues music brings people from everywhere together. I have seen Vladimir''s bands YouTube
    videos — by themselves and with Kirk Fletcher and John Nemeth — and they sound fantastic. I will play my very best music
    with and for my new friends in Russia."


    вот что я хочу сказать...

    В такой момент хочется остановиться и подумать...

    подумать о том долгом, более чем десятилетнем, пути, которое проделало Московское Блюзовое Сообщество...

    о долгом пути от бесприютных спонтанных джемов где придется и редких выступлений где попало в конце 90-ых - начале 2000-ых...

    о долгом пути до сегодняшнего замечательного состояния, когда уже новое поколения российских блюзовых энтузиастов удостаиваются
    таких лестных отзывов от признанных мэтров...

    о сегодняшнем дне, когда в Москве есть 100% блюзовое место с радушным хозяином...

    Владимир, Ксения, Михаил - это безусловные герои, без сомнения...

    но сегодня мне также думается о множестве замечательных блюзовых энтузиастов на постсоветском пространстве, которые своим
    вниманием к блюзу приближали этот момент на протяжении последних десятилетий...'
