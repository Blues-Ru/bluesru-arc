  text: "23-Декабря-2012 - Блюзовые посиделки\n\nhttp://www.karaganda-region.kz/rus/news/6411/\n\nСемья музыкантов Шакеновых\
    \ назвала это \"футбольным блюзом\" - когда на середине выступления они переоделись в кофты футбольных команд и продолжили\
    \ играть свои композиции. \"Блюз - это душа, а души у блюзменов хватает\", - утверждал ведущий Александр Мацынин на уютных,\
    \ почти домашних \"блюзовых посиделках\".\n \n- Это прекрасно, что у музыкантов, которые очень любят блюз, есть своя аудитория,\
    \ - поделились перед концертом Александр Мацынин и Сергей Владимиров - солист группы \"Паровоз SV\". - К нам пришла идея\
    \ собрать их вместе. До этого любителей блюза собирал Алексей Лебедев, а потом решили, что лучше проводить специализированные\
    \ фестивали блюзовой музыки. Первый такой фестиваль мы назвали посиделками. Само слово \"посиделки\" - очень уютное.\n\
    \nПервые карагандинские \"блюзовые посиделки\" состоялись 15 декабря прошлого года. Дата 12 декабря этого года - последняя\
    \ красивая цифра столетия. Именно в этот вечер концерт и состоялся.\nМотивы губных гармошек, гитар и спокойные вариации\
    \ сменялись шкодными и извивающимися нотками - группы играли собственные композиции и каверы, звучала знаменитая \"Crossroads\
    \ blues\" Роберта Джонсона.\n\nНа \"блюзовых посиделках\" зрители услышали семью Шакеновых - Владимира, его сына Андрея\
    \ и совсем еще юного внука Арсения: музыканты исполнили композиции в блюзовой тематике, а далее последовал архаичный блюз\
    \ от Сергея Владимирова и Марата Рысбекова - в стиле 50-60-х годов, когда еще не было синтезаторов и электронных инструментов.\
    \ Выступила и группа \"InSane\", которая играет в основном блюз-рок. Ее сменил коллектив \"Паровоз SV\" с традиционным\
    \ блюзом. После передышки для публики играла группа LBB с тремя блюзовыми композициями, за ними - коллектив \"Апрель\"\
    \ из Темиртау. В финале на сцену вышли все музыканты и исполнили песни в стиле \"джем\" без подготовки и репетиции: \"\
    Sweet home Chicago\" Роберта Джонсона и \"Hoochie coochie man\" Вилли Диксона.\n\n\nАвто: Анна СТРОКОВА"
