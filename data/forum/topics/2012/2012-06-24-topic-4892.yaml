    text: 'в документальном фильме Hugh Laurie: Let Them Talk -   A Celebration of
      New Orleans Blues...

      вполне нормальный дядька с осмысленным и взвешенным интересом к нью-орлинской
      музыке...

      видно что это его многолетний интерес к данной теме...

      на протяжении всего фильма все было достойно, взвешенно, в меру хорошо, без
      пошлых и пафосных голливудских ходов...

      видно что у человека есть вкус...

      а что до имен, то меня лично этим не удивишь - блюзовые подмостки видели и скачущего
      брюса виллиса и мучащего гитару стивена сигала...)

      так что не новость...

      и что их только привлекает в блюзовой музыке ? - неужто искренность и возможность
      побыть самим собой и наедине со своим увлечением на сцене?

      но вот по просмотру не заразил он меня - не пошел бы я его слушать...

      а вот сопровождающий его бэнд весьма интересен - пожалуй, бэнд достоин внимания...'
