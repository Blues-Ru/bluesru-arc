  text: 'нашел в новостях http://www.saratovnews.ru/newspaper/article/2012/01/25/luther-allison/


    от-радость: неслыханный еще концерт Лютера Эллисона... потом, гляжу на обложку - альбом-то называется несколько иначе. Ну и выясняется, что альбом-таки был "издавался при жизни Лютера", причем, если верить сайту http://www.luther-allison.com/ - в том же 1989 г. (хотя, и там могли напутать). Но уж определенно, в 1996 г. его переиздал Ruf http://www.rufrecords.de/catalogue/luther-allison-live-89.c1028.html .


    т.е., альбом определенно в радость. но радость уже знакомая.'
