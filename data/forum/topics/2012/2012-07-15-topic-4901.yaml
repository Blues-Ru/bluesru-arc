  text: 'южный диск, с характерной южной ленцой...

    с характерным репертуаром и соответствующим звучанием...

    никакого намека на пропахший выхлопными газами город и горожанами с их забитыми вечными стрессами головами...

    это - деревня, или если точнее - южный village...


    репертуар потрясающ...


    начиная с первой - Breaux Bridge Rag c её:


    Off the shrimpboat

    Boy, what a day!

    Venice just ain''t no place to play...


    так и представляется как трудяга, спрыгнув с креветочного кораблика, в поисках приключений в пятнично-субботний вечер, таки нашел себе этих приключений на свою в итоге cold dead ass...


    следующая Folks Back Home...


    saulty tales ''bout a steamboat pilot, life on the river when cotton was king...

    напоминает, что родина есть у всех, и бывает такая родина - как жизнь на берегу большой реки...


    следующая Loup-Garou - знакомит нас с луизианскими фольклорными персонажами, приходящими по ночам...

    Ooh! Ooh! Loup-Garou gonna get you, Loup-Garou gonna get you

    Better run to the river boy...


    особняком стоит Sweet Texas Rose - исполненная в необычном для Кларенса лиричном настроении, без всякого сарказма...


    She''s the darling of the dance-hall

    Downtown San Anton''

    Her mama was a hooker, Lord!

    Her daddy didn''t work at all

    She had a hard life

    And I''m sad to say it shows...


    She said she liked my music...

    Something in a soft song

    About a lonesome soul

    Remind her of a better time

    My sweet sweet Texas Rose, Texas Rose...


    лично меня эта песенка заставила вспомнить как иной раз посреди какого-то громкого и прокуренного бара встретишь милое и невинное лицо официантки, что так и хочется спросить - зачем ты здесь, в неподобающем для милой девушки месте...

    но тут же в голове скопом пронесутся мысли - что жизнь бывает жестока и все мысли и вопросы оставишь при себе...


    далее следуют

    Sheriff''s Barbeque...

    Bad Week For Old Fiddlers...

    Sunrise Cajun Style...

    Louisiana Woman...


    эх, хорошо на юге друзья, летним теплым вечером...

    альбом передает эту атмосферу...


    на компакте 2005-го года издания шикарные вкладыши...

    огромная куча шикарной информации...

    от истории создания диска до рассказа автора песен о подборе репертуара...

    все очень вкусно и информативно...

    Кларенс заиграл для меня новыми красками...



    также John D. Loudermilk пишет в 2005-ом в предисловии к этому альбому Кларенса...


    с первого же раза как я получил привилегию быть рядом с этим человеком - я узнал что он определенно является кем-то или чем-то совершенно особенным...


    "...Musicians play in licks like people talk in words.

    Gate has thousands of licks he can pull from to explain what he''s talking about.

    The instrument doesn''t matter.

    He can sing the lick as well as play it.

    He can play it fast  or slow or soft or loud.

    He''s in charge, but he doesn''t write the charts.

    He says he doesn''t  talk to God very often, but God sure talks to him a lot and that''s who you hear playing lots of times when Gate thinks he''s in charge and it''s him who''s cooking...yeah..."


