          text: 'Есть у меня этот диск.

            Не лучшее, что есть у Сэма. Хотя по своему небезынтересно.

            Что касается электрического блюза - разной степени изысканности.

            Дебют Хопкинса в грамзаписи - то, что он записывал для Алладин Рекордз с пианистом "по прозвищу Гром" - 1946-47-й
            - там он как раз играет на электрической гитаре. Полностью на акустику он перешёл уже после переоткрытия его "для
            белых фолк-студентов"  в 1959-м и кухонного альбома "Лайтнин Хопкинс", записанного Сэмом Чартерсом, впоследствии
            переизданного как "Корни Л.Х.".


            То есть, Хопкинс - и пионер блюзовой электрогитары, и мастер акустики.'
