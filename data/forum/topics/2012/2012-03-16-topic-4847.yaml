  text: 'В 1912 году (100 г. назад) в Сетервилле, Техас, родился Сэмюэль Хопкинс, по прозвищу «Зажигающий» (Sam Lightnin’
    HOPKINS). В Техасе он практиковал блюз деревенский виртуозный, акустический. В Калифорнии – более изысканный электрический.
    Он – один из гениев блюза.


    Мистер Хопкинс терпеть не мог дороги, особенно перелётов. В Калифорнии он побывал на заре своей карьеры, в начале 40-х,
    потом появлялся там на редких концертах уже после 60-х.Родной Техас он практически не покидал, несмотря на то, что под
    конец жизни он объездил с концертами почти все штаты, был два раза в Европе, и даже один раз в Японии, поборов свой страх
    перед самолётами.Записи на Prestige были сделаны путём наложения ритм-секции на присланные гитару и вокал Хопкинса.Эти
    "вылетания" и украшают украшают записи Хопкинса с группой.Да и в других сессиях Хопкинс не позволял музыкантам играть
    "ровно и как надо", считая, что так его музыка не звучит.О каком изысканном электрическом блюзе речь? Может не все записи
    Хопкинса до меня дошли?'
