  text: 'Билет в Малый концертный зал Филармонии - 200 р.!


    http://krsk.sibnovosti.ru/events/181620-festival-amerikanskoy-muzyki - сообщает:


    "8 марта в 17:00 в Малом концертном зале филармонии состоится Фестиваль американской музыки. Прозвучит живая американская народная музыка в исполнении прославленных музыкантов из Луизианы: Кристины Балфа и её трио «Балфа навсегда» и Джеффри Бруссара с друзьями.


    Невероятные ритмы, яркие мелодии – светлые и печальные одновременно, заполняющие всё концертное пространство – вот что ожидает красноярцев! Если точнее, то в этот вечер будет звучать американская танцевальная музыка непривычных пока нашему уху направлений зайдеко и каджун. Если подробнее - музыкальный стиль ЗАЙДЕКО возник из смешения французской народной музыки, ритмов Африки и Карибского региона, креольских мелодий; центральным музыкальным инструментом здесь является аккордеон. КАДЖУН - разновидность кантри-энд-вестерна, синтез кантри, рок-н-ролла и блюза.


    Есть уникальная возможность услышать и оценить, хотя … вы начнёте танцевать сразу же, как только услышите музыку зайдеко, тем более в исполнении неподражаемого Джеффри Бруссара — талантливейшего аккордеониста и певца, одного из самых динамичных исполнителей этого жанра. Несмотря на отсутствие соответствующего образования, музыкант получил самые высокие оценки критиков и слушателей за своё мастерство. Он создает музыку на слух, ориентируясь на ритм и импровизируя. Аккордеон — не единственный освоенный им инструмент: он в полной мере владеет игрой на гитаре, бас-гитаре, скрипке и ударных инструментах.


    Кристина Балфа и трио «Балфа навсегда» представит в Красноярске музыку каджун, которую отличает жизнерадостность и искренность. У себя на родине трио пользуется сногсшибательной популярностью и даёт до 180 концертов в год.


    Музыкантов из Луизианы объединяет схожая миссия: они успешно возрождают уникальные музыкальные жанры, которым грозило забвение. Красноярск приверженцы американского фольклора удостоили своим вниманием в рамках масштабного гастрольного тура по десяти городам России."


    Christina Balfa & Jeffrey Broussard в Петербурге: http://www.moozon.ru/node/3484'
