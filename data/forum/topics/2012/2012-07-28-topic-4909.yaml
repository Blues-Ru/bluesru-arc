  text: "Redwood City Police Activities League Blues Festival - название что надо! Фест состоится сегодня, причем прямо на Площади Суда (Courthouse Square) в этом самом городе Красного Дерева. \n\nСреди прочих, выступит харпер-гитарист с шикарными усами. Зовут Dave Earl, играет на гармонике с 14 лет, а на гитаре только с 20-ти, а уж в 40 лет взялся и за мандолину.  Сейчас ему 54 года – и выглядит он огурцом!\nБольшую часть жизни поработал строителем, но лет десять назад, решил: хватит. И стал уличным музыкантом. По заработкам – далеко не сахар, зато есть счастье заниматься только тем, что любишь\n\nДейв и так всю жизнь каждый день непременно играл и пел. И дома, и на работе, и вечером в клубах. Выступал и с группами, но решил, что одному больше свободы, не надо ни от кого зависеть... \n\nЗаписывается с 1983 года, а с 1993 начал выпускать СD – их уже 8. И каждый день – играет на улице. Ну вот тянет его.\n\n“<b>The blues chose me,” said Earl. “I heard it, I was inspired by it, I wanted to play it, so I played it. I’m grateful I can play music for a living. I’ve stayed passionate about it all my life.</b>” – «Блюз меня выбрал. Я его услышал, вдохновился, и захотел играть его. И я рад, что могу зарабатывать музыкой на жизнь. Меня к этому всю жизнь страстно влекло».\n\n<center><iframe width=\"420\" height=\"315\" src=\"http://www.youtube.com/embed/I8SSYrESfIE\" frameborder=\"0\" allowfullscreen></iframe></center>\n<br>\n<small><i>инфа отжата отсюда:</i> <a href=\"http://www.smdailyjournal.com/article_preview.php?type=lnews&title=A%20life%20with%20the%20blues&id=1751981\" target=\"_blank\">http://www.smdailyjournal.com/article_preview.php?type=lnews&title=A%20life%20with%20the%20blues&id=1751981</a> </small>"
