  text: "Людей, которые могут зайти в магазин и немножко по-другому, чем прочие девяносто\
    \ девять процентов, попросить бутылку водки и распрощаться так, чтобы тебе в ответ\
    \ улыбнулись, единицы. \nИ сыграть блюз в клубе или написать что-то незлое, могут\
    \ тоже единицы. \nА они, специалисты по формату, думают, что это просто. \nА это\
    \ непросто. \nЭтому надо учиться. \nЭто внутренняя работа. \nХороший джаз, хороший\
    \ блюз, хорошая народная музыка, хорошая семиструнная гитара, романсы, бардовская\
    \ песня да масса жанров, не надо на чем-то одном зацикливаться, все они -- это\
    \ космос, организация хаоса...\n\nhttp://www.ogoniok.com/archive/2003/4802/23-50-53/"
