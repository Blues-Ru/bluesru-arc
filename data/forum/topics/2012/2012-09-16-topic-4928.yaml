  text: "В связи с этим нелишним будет вспомнить как Мистер Марголин умеет делиться своими переживаниями...\nВ данном случае Мр. Марголин прощается с одним из своих ближайших друзей, прижизненной легендой блюза - Mr. Joe Willie \"Pinetop\" Perkins...\nи лучшей иллюстрации многодесятилетней любви и понимания между музыкантами вряд ли сыщешь...\nтекст написан Мр. Марголиным в конце марта 2011 года, через несколько дней после ухода Пайнтопа...\nс тех пор этот текст лежал у меня на рабочем столе, ожидая, когда у меня освободиться немного времени, чтобы поделиться этими замечательными словами с сообществом...\nлучшего момента, пожалуй, не найдется...\n\n\n\"Так много людей из музыкальной семьи Пайнтопа Перкинса позвонили мне на следующий день после того как он ушел и сказали то же самое: \"Я думал, что он будет жить вечно!\" \nЕго девяностосемилетнетняя жизнь была благословением для его музыки и его обаятельной личности, равно как и примером невероятного чуда жизнелюбия. \nПайнтоп курил с 1922 года и ел в Макдональдсе каждый день. \nОн зависал в блюз-барах каждую ночь. \nОн пил до восемьдесятипяти лет. \nЕсли он участвовал в дружеском джеме в домашнем клубе Antone's в Остине в понедельник ночью,то случайный слушатель получал от Пайнтопа шоу такого же высочайшего качества и экспрессии , как и слушатель на фестивале в Европе в ближайшие выходные, где Пайтоп выступал хедлайнером фестиваля за $ 10.000. \nОн выглядел великолепно в том пижонском костюме, что он называл \"Daniel Boone pimp\", смело флиртовал с пятью поколениями женщин, окружавших его на выступлениях и после, и был достаточно искусен, чтобы сделать смешной или умный каламбур или подтрунить над собой...\n\n\nЯ встретился с Пайнтопом, когда я присоединился к группе Мадди Уотерса в 1973 году. \nПайнтоп был в возрасте, что и я сейчас. \nЯ в курсе, что круг замкнулся. \nВ 1980 году я собрал свою собственную команду, Мадди получил новую группу, а Пайнтоп и большинство других членов команды остались вместе, как The Legendary Blues Band. \n30 апреля 1983 года я получил перед рассветом звонок от Джерри Портного, который был харпером в команде Мадди, когда я был там, а затем с The Legendary Blues Band. \nОн произнес в трубку - \"У меня плохие новости\".\nТак как Джерри в то время работал с Пайнтопом, я подумал, что мы потеряли его. \nПайнтопу в тот момент было семьдесят, глубокая древность для меня тех лет. \nВ тот раз это было известие о смерти Muddy Waters.\nНо я знал, что если я проживу достаточно долго, то когда-нибудь я получу такой звонок с \"плохими новостями\" о Пайнтопе.\nИ я благодарю Бога, что дал ему еще целых двадцать восемь лет жизни с того момента...\"\n\n\n\"Предпочитая чувствовать себя умиротверенно, Пайнтоп просто избегал иметь дело с неприятностями и беспокойством.\nОн просто жил и наслаждался каждым конкретным моментом. \nМожет быть, это покажется незрелым или безответственным, но многие ли из нас, \"взрослых\", проживут так долго, как сделал это Пайнтоп? \nМадди, наблюдая за Пайнтопом, говорил - \"Один раз взрослый, но дважды ребенок\". С сарказмом говорил он это, в то время как Пайнтоп наслаждался общением с поклонниками вместо того чтобы уже наконец покинуть место выступления и не задерживать всю команду в конце ночи. \nМадди был прав насчет Пайнтопа, но детская общительность Пайнтопа была его благословением. \nМадди часто был тяжелым в общении и имел намного более короткую продолжительность жизни...\"\n\n\n\n\"...Я заботился о нем, как внук заботится о живом деде (он был старше моего отца), и я надеюсь, что некоторая его благодать и просветление отразились и на мне. \nЛюди, которые видели меня помогающим Пайнтопу на протяжении многих лет - либо сопровождая его в наш отель на рассвете тридцать пять лет назад, или сопровождая его в прогулке в инвалидной коляске в Испании в прошлом году - признавали, я был добр к нему и любил его. \nКонечно, это правда, но и он был мил со мной. \nЯ чувствовал это каждый раз, когда мы были вместе или разговаривали по телефону, и особенно, когда мы играли блюз вместе. \nНо лучше всего я это почувствовал когда мы играли в Японии в 1998 году. В тот момент умер мой отец и я должен был вернуться домой. Когда я сказал об этом Пайнтопу, что я собираюсь покинуть тур и улететь домой сразу же, он обнял меня и сказал: «Я твой черный отец с этого момента...\"\n\n\nhttp://bluesrevue.com/2011/03/blues-beat-the-pinetop-perkins-tribute-3-25-11/#"
