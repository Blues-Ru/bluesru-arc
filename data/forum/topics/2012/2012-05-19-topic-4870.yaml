  text: "Пресловутый Уолт Дисней с началом цветного телевидения замутил сериал с рекламой «Диснейленда». В «Диснейленде» были\
    \ не только Белоснежки и карлики, но и маленькие уроки истории США. Правда, в этих уроках старина Уолт пользовался не\
    \ столько учебниками, сколько стереотипами. Одним из которых были «чудесные, шумные и милые развлечения на колесных пароходах\
    \ Миссиссиппи». Правда, в этих «милых развлечениях» неграм отводилась роль туповатых, но всегда веселых клоунов, благодарным\
    \ белым хозяевам буквально за все: и за хлеб, и за строгие рамки дозволенного. И песенка, которую выбрали для программы,\
    \ на самом деле относится к другой эпохе, другому образу жизни и, собственно, к другому городу. Кэнзас-сити, после разгрома\
    \ мафии в столицах, стал эдаким эдемом стареющих бетлегеров, спускавших последние накопления в клубах с превосходной музыкальной\
    \ программой: виски рекой, азартные игры, веселые девочки и джаз-блюз от полуночи до полудня. И все участники – черные!\
    \ Хотя сама песенка сочинена удивительным и парадоксальным еврейским дуэтом Лейбера-Столлера, у которого было потрясающее\
    \ чутье на самую суть блюзовой культуры. И все это происходило на рубеже 40-х- 50-х, на десятилетия позже последнего регулярного\
    \ рейса колесного парохода по Миссиссиппи.\n\n Ну и ладно. Зато благодаря глупому сериалу можно послушать и – что немаловажно\
    \ – посмотреть на Монетт Мур, певицу, которая начала записываться еще в годы первого блюзового бума начала 20-х, и здесь,\
    \ на этой съемке 40 лет спустя после дебюта, она столь же полна энергии, блюзового ритма и заразительной самоотдачи –\
    \ чем и прекрасна! \n\n<center>\n<iframe width=\"420\" height=\"315\" src=\"http://www.youtube.com/embed/gCErI_6pWA8\"\
    \ frameborder=\"0\" allowfullscreen></iframe></center>"
