  deleted: false
  text: "<i>Легенда нуждается в постоянной подпитке. И с определенной цикличностью вновь и вновь появляются материалы об \"\
    истинной судьбе Джонсона\".</i>\n\nНе стоит верить с порога, но и пройти мимо такой новости нельзя! Если исторические\
    \ блюзовые искатели (Historical blues researchers Jason Rewald and Flow Niloh) подтвердят истинность своих находок, это\
    \ будет номер!\n\nВ общем, \nпосле покушения, Роберт Джонсон выжил, слился в городок New Albany на севере штата Миссиссиппи,\
    \ где прожил тихую, ничем не примечательную жизнь (вот в это поверить сложней всего). Местные называли его Dusty Robert,\
    \ и, сказывают, что временами он \"отъезжал на запись\". \n\nЭтот <i>новообретенный</i> Джонсон, скончался 6 сентября\
    \ 1965 г. в возрасте 54 лет (печень отказала). То есть, умер спустя годы после триумфального переиздания его записей на\
    \ LP. Очень сомнительно, что его не могли найти - в те годы блюз-энтузиасты раскапывали блюзовых динозавров с каким-то\
    \ бойскаутским энтузиазмом.  \n\nЧто ж, если все окажется так, и, особенно, если сыщаться более поздние записи Джонсона\
    \ - я только возблагодарю судьбу и поименованных искателей (пока что мне даже имена их подозрительны). \n\nисточник информации:\
    \ http://www.americanbluesscene.com/2011/04/blues-legend-robert-johnson-found-to-have-lived-years-after-supposed-death/"
