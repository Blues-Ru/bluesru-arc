  text: 'Друзья, мне жутко интересно...

    как всегда, когда не обремененное морщинами лицо берется за буги-вужные переливы...

    и я совсем не имею ничего против морщин (совсем наоборот)...

    но дух захватывает от предвкушения того, что может быть сделано за отведенные многие десятилетия впереди...

    уже сейчас его называют - "a nationally emerging boogie-woogie master"...


    http://www.youtube.com/watch?v=K1QQYeJUPEg&feature=BFa&list=UUuQYjl2bGASfCw1HB--GK8g


    сам он про себя говорит - "I’m a former attorney, a children’s book author and founding editor of William Joseph K Publications,
    and a blues & boogie woogie performing artist under the stage name of The Boogie Woogie Kid"...


    вот тут под его переливы можно ознакомиться с биографией...

    http://www.boogiewoogiekid.com/cds_books.htm


    http://www.boogiewoogiekid.com/biography.htm'
