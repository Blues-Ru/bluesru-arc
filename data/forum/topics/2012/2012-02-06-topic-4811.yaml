  subject: 'собирателям записей Джэнис Джоплин на заметку:'
  deleted: false
  text: "<i>Контрабанда (http://kbanda.ru/index.php/muzyka/1301-na-mart-zaplanirovan-vypusk-neizdannogo-kontsertnogo-alboma-dzhenis-dzhoplin.html)\
    \ сообщает:</i>\n\nКомпания Sony Music собирается выпустить не издававшийся ранее\
    \ музыкальный диск с концертом легендарной американской блюзовой певицы Дженис\
    \ Джоплин, американской блюзовой певицы. Выход альбома запланирован на март 2012\
    \ года. Пластинка будет называться \"Live At The Carousel Ballroom 1968\". В аннотации\
    \ к релизу говорится, что этот концерт - один из важнейших символов эпохи шестидесятых\
    \ годов прошлого столетия, времени формирования новых музыкальных идей. \n\nНа\
    \ диске будут представлены 14 композиций, включая такие как \"Piece Of My Heart\"\
    , \"Light Is Faster Than Sound\" и \"Combination Of The Two\". В комплект издания\
    \ также войдет подборка малоизвестных фотографий певицы."
