    text: "итак, музыка умеет думать!\n\nдалее устами http://donbass.ua/news/culture/music/2012/01/02/bg-obljuzil-deda-moroza.html :\n\nБГ \"облюзил\" Деда Мороза\n02.01.2012 20:00\n    \n\nСразу несколько новогодних подарков получили поклонники «думающей» музыки. \n\nАлександр Розенбаум и Григорий Лепс наконец выпустили совместный альбом, который получил название «Берега чистого братства». И хоть у артистов совершенно разные тембры и манеры исполнения, зато харизмы и поклонников не занимать. Так что композиции «Последний рейс», «Золотая клетка», «Камикадзе», «Перевал любви», а особенно «Вечерняя застольная», записанная вместе с нашим земляком Иосифом Кобзоном, наверняка найдут своего слушателя. \n\nПорадовала и группа «Аквариум». В первую минуту нового года Борис Гребенщиков с компанией выложили на портале Kroogi.com, где издаются все последние диски коллектива, два новых сингла - «Дед Мороз Блюз» и «Бригадир». Приятных сюрпризов от «Аквариума», которому в 2012-м исполняется 40 лет, обещают еще немало.\n\n \nАндрей Питонов."
