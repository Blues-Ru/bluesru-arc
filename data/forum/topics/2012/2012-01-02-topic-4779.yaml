  text: "Есть люди, которые не могут не красть в супермаркете, хотя могут там купить всё. По своему это даже забавно. И есть люди, которые не могут не красть чужие идеи, поскольку своих взять негде. Это не смешно, но когда на это выстраивается многолетняя  успешная карьера и репутация безупречного творца - вот тогда это уже очень забавно....\n\nНо сейчас не об этом...\n\nРунет сообщает: \"Группа \"Аквариум\" выпустила сингл в честь наступившего 2012 года. Новое творение коллектива Бориса Гребенщикова было опубликовано в 00:01 1 января на портале Kroogi.com.\n\t \n\n \nГруппа \"Аквариум\" выпустила сингл в честь наступившего 2012 года. Новое творение коллектива Бориса Гребенщикова было опубликовано в 00:01 1 января на портале Kroogi.com, где издаются все последние диски \"Аквариума\".\n\nСингл состоит из двух песен - \"Дед Мороз Блюз\" и \"Бригадир\". По традиции на \"Кругах\" сингл можно не только послушать, но и \"... к сожаление, на этом сообщение обрывается."
