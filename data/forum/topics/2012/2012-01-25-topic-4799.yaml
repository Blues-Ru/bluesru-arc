  text: 'Девушки любят помолвки... Но не все помолвки кончаются свадебкой. Вчера мировая пресса обсуждала объявление о том,
    что Арета Фрэнклин решила отложить свадьбу с Уилли Уилкерсоном. http://latimesblogs.latimes.com/gossip/2012/01/aretha-franklin-calls-off-wedding-to-willie-wilkerson.html?sksk


    Пояснения от первого лица не трбуют и перевода: "Will and I have decided we were moving a little too fast, and there were
    a number of things that had not been thought through thoroughly. There will be no wedding at this time. We will not comment
    on it any further because of the very personal and sensitive nature of it. We appreciate all of the many well wishes from
    friends."


    "События развиваются слишком быстро"... Учитывая, что жених и невеста знакомы 27 лет... мдаа.


    А всего три недели назад были разговоры о свадьбе на яхте или на вилле в Майями, о модных портнихах...


