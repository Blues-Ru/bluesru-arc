  text: "Блюз был всегда музыкой человека слабого, который тем не менее сильный. И гордый. \nА сейчас в моде музыка человека сильного, который на самом деле слабый. \nГангста-рэп: «Я типа пошел, бритву достал, всех чувачков пописал на этой баскетбольной площадке, и все чувихи мои!» \nМне не хотелось бы называть рэп тупым, но, по моему скромному мнению, это шаг назад. \nВедь что за лица были на старых фотографиях блюзменов! \nУдивительное достоинство, хорошие костюмы, начищенные ботинки. \nОни одевались под белых, старались выглядеть как люди, которые хорошо зарабатывают. \nСлипи Джон Эстес приезжал на сеансы звукозаписи со своим другом Хэмми Никсоном, губным гармонистом, они заработали за несколько дней фантастическую по тем временам — 30-е годы! — сумму, триста долларов. \nОни их прогуляли за четыре дня и домой возвращались на товарняке. \nВсе было пропито до нитки. \nНо все было очень по-доброму. \nВедь в блюзе нет воспевания силы, бандитизма, своей черной особости, мусульманства. \nЭто музыка людей, которые учились петь в церквях методистов. \nХотя рэп и несет в себе некоторые черты блюза. Есть такая пластинка — «Рэп в блюзе». \nТам примеры того рэпа, который существовал в блюзе, но еще не был рэпом. \nА вообще, слово «рэп» на старом «черном английском» означает «быстрая лживая речь».\n\nhttp://www.politjournal.ru/index.php?action=Articles&dirid=55&tek=1844&issue=49"
