  text: "Hello!\n\nI am hoping to find Blues fans in Russia that would like to listen\
    \ to my radio show - \n\nBlues Train episode 27 is available to listen again right\
    \ here! \n\nhttp://fromefm.co.uk/pcasts/media/120617-bluestrain-bluestrain2.mp3\
    \ \n\nFeaturing a 60 minute mix of some of the very best new blues and roots tunes\
    \ from right around the globe, just for you. Something for everyone! Please have\
    \ a listen and support these fab artists and then maybe you can share the link\
    \ with some people that you know :-) Thank you!\n\nPLAYLIST:\nThe Idle Hands -\
    \ Come Share The Blues [ CD: Ready For Business ]\nCee Cee James - Let's All Get\
    \ Loose [ Red Hot Blues ]\nSandi Thom - Stormy Weather [ Flesh and Blood ]\nBlackie\
    \ and the Rodeo Kings with Janiva Magness - How Come You Treat Me So Bad [ Kings\
    \ and Queens ]\nDonna Greene and Her Roadhouse Daddies - Same Old Blues [ A Girls\
    \ Gotta Have A Little Pleasure ]\nTrevor Sewell - Talked To The Devil [ Calling\
    \ Your Name special edition ]\nThe Andy Drudy Disorder - St. Salutious [ The Blues\
    \ Civilization ]\n*John Oates voice tag*\nEddie Martin Big Band - I Want That\
    \ Girl [ Looking Forward Looking Back ]\nCarolina Chocolate Drops - Light In The\
    \ Valley [ Mercyland - Hymns For The Rest Of Us ]\nSam Hare - Stealing From The\
    \ Queen [ Down To The Sea ]\nMarc O'Reilly - Lord Of War [ My Friend Marx ]\n\
    J.D McPherson - I Can't Complain [ Signs and Signifiers ]\nKatie Bradley / Dudley\
    \ Ross - I Don't Believe [ excerpt ]\nNext live show is July 1st 4.30pm UK time,\
    \ set your clocks!\nhttps://www.facebook.com/BluesTrainRadio\n\nI hope someone\
    \ can have a listen!\n\nThank you!"
