  text: 'http://mmdm.ru/afishaDescription//4727


    "Если бы только мог, я отдал бы тебе свои глаза", – так однажды сказал Дайан Шур легендарный Фрэнк Синатра. Великолепная певица и пианистка, которая сегодня занимает одно из самых видных мест среди джазовых звезд, в детстве потеряла зрение, что, однако, не помешало ей не только получить музыкальное образование, но и максимально ярко проявить свой талант. Дайан выросла в пригороде Сиэтла (штат Вашингтон). Первый раз перед публикой она появилась в возрасте 10 лет как исполнительница кантри. Но вскоре появилось новое увлечение и новые кумиры – Сара Воэн и Дина Вашингтон. Так что шестнадцатилетней Дайан уже вовсю пела джаз.

    В 1979-м ее впервые пригласили на Monterey Jazz Festival, спустя пять лет вышел первый альбом Deedles (дружеское прозвище певицы), а вскоре она одну за другой получила две премии Grammy (Timeless– 1986, Diane Schuur & the Count Basie Orchestra– 1987). Запись с оркестром Каунта Бэйси в течение 33 недель занимала первое место в списках самых раскупаемых, не уступал ему и совместный альбом с Би Би Кингом Heart To Heart. Дайяна Шур подкупает не только исключительной красотой и мощью своего голоса, но исключительным артистизмом и экспрессивной силой. В выражении отношения к публике она предельно откровенна: «Мне кажется, что люди, которые не любят джаз, боятся собственных эмоций. Я надеюсь, что своим пением помогаю людям достичь мира внутри себя. Я люблю московскую аудиторию, она очень благодарная. Здесь живут люди, которые гораздо более в ладах со своими чувствами по сравнению со многими американцами».'
