    text: "В 90-х русским роком называли андеграунд. И всем известная группа \"Х.. забей\" ещё недавно обсуждалась на форуме\
      \ сайта издательства \"Союз писателей\" в теме \"О значимости и незначимости поэтов для русской Википедии\". Приведу\
      \ только своё высказывание: \n85 vasa7771962   (14.08.2011 11:26) \n\"Группу ХЗ не запрещали определённые круги, отвечавшие\
      \ за цензуру. Цензуре на тот период времени было, наверное, выгодно показать пагубное (тлетворное) влияние Запада на\
      \ нашу молодёжь, поэтому и появились такие вот группы, исполнявшие андеграунд. Андеграунд трудно отнести к категории\
      \ искусства и, тем не менее, для поколения страны он имел значение. \n Следствием этого, например, является то, что\
      \ в России до сих пор считают, что в стране нет «приличных», в смысле хорошо исполняющих музыку, рок-музыкантов.\"\n\
      Сама по себе трактовка русский рок идёт от андеграунда поэтому сами понимаете, что это такое.\nА вот и моё сугубо личное\
      \ отношение к русскому року 90-х, т.е. андеграунду, опять-таки это моё высказывание на вышеуказанном форуме (ссылка\
      \ на форум будет приведена ниже текста)\n \"97 vasa7771962   (14.08.2011 12:11) \nНа мой взгляд, ХЗ - это \"фольклор\"\
      \ пьяной толпы, независимо от того \"приносит\" это деньги или нет. Я, в общем-то, и не удивлена: каковы реалии, таково\
      \ и отражение. Просто меня слегка шокировали тексты, помните поговорку: \"Что можно Юпитеру -нельзя быку.\"\nК русскому\
      \ року в настоящее время я отношусь, как к российскому фольклору. Играющих настоящий рок музыкантов единицы (из них\
      \ многие на сцене не выступают), Шевчука и ему подобных я к рокерам не отношу.\nА ВОТ ПО ВТОРОМУ ВОПРОСУ: КОГОСЧИТАТЬ\
      \ РУССКИМ МОЙ ЛИЧНЫЙ ОТВЕТ (АВТОР Я):\n \tСлова смешные...\nПод впечатлением просмотра телепередачи \n(сообщение Тишкову\
      \ Валерию).\nСлова смешные:\nэтнос, самобытность.\nЗвучит почти как первобытность!\n(А разве нет смешения кровей?)\n\
      Чистопородных много ль в мире?\nИ кто медали выдаёт?\nУ кошек, лошадей медали есть,\nони породу подтверждают.\nНеравенство\
      \ - то где!\nВ паспортах нас уравняли,\nно у животных больше преимуществ!\nДискуссия назрела господа!\nФевраль 2011г.\n\
      \nhttp://soyuz-pisatelei.ru/news/o_znachimosti_i_neznachimosti_poehtov_dlja_russkoj_vikipedii/2011-08-13-17"
