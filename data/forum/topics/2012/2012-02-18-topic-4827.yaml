  text: "Blues Brothers породили свой культ, со своими атрибутами и «святыми местами»\
    \ для паломничества. Поэтому в свое время ликвидация легендарно чикагского рынка\
    \ на Максвелл стрит, где в фильме играет на улице Джон Ли Хукер, а Рэй Чарлз держит\
    \ свой магазин (и под прилавком всегда наготове хранит пистолет) вызвала недовольство\
    \ не только у патриотов старого доброго Города ветров, но и фанатов фильма по\
    \ всему миру. Но вот объявленный на этой неделе снос торгового центра Dixie Square\
    \ никого не возмутил. А ведь это тот самый, про который братья сказали: «Здесь\
    \ есть всё!», раскатывая по нему на списанной полицейской машине. \n\nBlues Brothers,\
    \ по сценарию Дэна Эйкройда снятые Джоном Лэндисом, были воистину «созданы с любовью»\
    \ (labour of love): весь антураж, от выбора мест действия до мельчайших деталей,\
    \ там неспроста. И если на Максвелл-стрит братья ходили ножками, то гламурный\
    \ шопинг-пассаж раскатали вдребезги. \n\nБуквально все, что связано с фильмом,\
    \ по своему примечательно и курьезно. К примеру, Dixie Square простоял 45 лет,\
    \ из которых работал только 15. Владельцы и управляющие менялись с такой частотой,\
    \ что трудно не заподозрить их в «зиц-председательстве» (одесский термин, предложенный\
    \ Ильфом и Петровым). Вернуть ТЦ к жизни пытались неоднократно, но втуне, и заброшенное\
    \ здание продолжало портит вид на подъезде к Чикаго. Тем временем «защитники природы»\
    \ азартно судились по поводу асбестовых отходов, а одна фирма, получившая городские\
    \ средства на снос пришедшего в негодность здания, растворилась без следа.  Так\
    \ что Эйкрод и Лэнддис знали, какую именно «ярмарку» выбрать.\n\nК моменту съемок\
    \ фильма огромная торговая площадка в пригороде Чикаго была уже год как закрыта.\
    \ Под съемки она была арендована за 12 500$ (!), и приведена в соответствующий\
    \ вид. И все… С тех пор там вообще больше ничего не происходило целых 30 лет.\
    \ Во что превратился «пассаж», можно посмотреть тут:   http://deadmalls.com/malls/dixie_square_mall.html."
