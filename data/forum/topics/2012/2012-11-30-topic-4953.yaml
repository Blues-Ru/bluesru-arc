  text: 'Сердечно поздравляем главного блюзоведа нашего сайта и нашей страны - Андрея Евдокимова! Я думаю, что значительная часть наших друзей обязаны Андрею и его передачам возникновением первого интереса к блюзу, после - расширением музыкального кругозора, познанием истории и лучшим пониманием блюза.


