        text: "я так и не понял, почему отрицательная рецензия, да еще написанная\
          \ лет сто тому назад, как-то закрывает мне возможность публиковать некролог,\
          \ в котором довольно четко написано, почему и за что я уважаю этого музыканта.\
          \ И наличие непонравившегося мне альбома никак не исключает уважение и к\
          \ таланту, и даже к образу жизни этого музыканта. Более того, я бы хотел\
          \ посоветовать тем, кто не знаком с еще с записями Багза Хендерсона, начинать\
          \ свое знакомство только не с этого сборника - с записями разных лет, сомнительного\
          \ качества с чисто технической точки зрения. И что в этом нечестного?  Если\
          \ вы придерживаете противоположной точки зрения - изложите ее. Мы опубликуем\
          \ ее рядом, пусть читающий сам выбирает, чья точка зрения ему ближе... В\
          \ блюзе, вообще-то, нет верховной комиссии, и единомыслия, надеюсь, тоже\
          \ никогда не будет. \n\nЕсли вам кажется, что ныне моя рецензия \"оскорбительна\
          \ для памяти\" и т.д, и т.п. - то я с этим категорически не согласен. Багз\
          \ - вполне самодостаточная сильная личность; и не нуждается ни в моем снисхождении,\
          \ ни в вашей защите.\n\nЛуизиана Ред - лично мне - один из самых-самых близких\
          \ блюзменов. И что? я не могу сказать - не слушайте его альбом Live At 55,\
          \ потому что это халтура, записанная наспех с полупрофессиональными музыкантами?\
          \ да фигушки!.. По вашему, блюзмены - это такие ангелы, что топают по грязи,\
          \ не пачкая пяток? не делают ошибок и всегда безупречны и непорочны? в таком\
          \ случае мы с вами каких-то совсем разных блюзменов знаем, разный блюз слушаем.\n\
          \nPS. что касается, кому кого просить - я не могу обзванивать потенциальных\
          \ авторов с предложением что-то написать. О принципах деятельности сайта\
          \ написан специальный раздел - почитайте. Это сайт не мой, и не Федора.\
          \ Это сайт о блюзе во всем многообразии его проявлений, в том числе и в\
          \ многообразии мнений о об этих \"проявлениях\". И я не припомню случая,\
          \ чтобы кто-то предложил нам материал для публикации и получил отказ. \n\
          \nпо поводу \"несерьезности\": сайт всегда заинтересован в новых рецензиях,\
          \ в любых новостях и пр. Под рецензией будет стоять ваша подпись, вы, стало\
          \ бы, за нее и отвечаете. Вот так просто. хотите писать серьезней, чем сейчас\
          \ - это же ваша рецензия, вам и решать, какой она будет."
