  subject: Поиск музыкантов в блюзовый трибьют-проект (Дженис Джоплин)
  deleted: false
  text: "Не уверена, что тут можно об этом писать, но я нахожусь в таком положении, когда все средства хороши. Я ищу музыкантов\
    \ в трибьют-проект. Тема - творчество Дженис Джоплин. \nДорогие музыканты, я точно знаю что я хочу от проекта, какие у\
    \ него перспективы, что я ожидаю в итоге получить. Очень надеюсь, что участники форума поймут меня правильно - этот пост\
    \ не тема для обсуждений! Это всего лишь поиск. Обсуждать стоит тогда, когда проект уже заиграет. А пока...\nТребования\
    \ к желающим присоединиться: \nмастерство игры на своём инструменте - на пять с плюсом. Отсутствие вредных привычек, ооочень\
    \ вредных привычек тоесть. \nНе приемлимы люди, обожающие вступать в \"прения\" по любому поводу - мне это до лампочки,\
    \ так что не тратьте моё время и время остальных участников группы. \nПрисутствие здорового чувства юмора, любовь к наследию\
    \ Дженис, а так же смелость и кураж на сцене - это приветствуется! Не приветствуются музыканты, отрабатывающие свою смену\
    \ за бабло и с серьёзными минами во время концерта, а так же не видящие разницы в чём именно стоять перед благодарной\
    \ публикой. Расшифровка: наличие коцертного прикида, а также творческие фантазии, воплощённые в жизнь - это ХА-РА-ШО!\n\
    Коллеги-муыканты, вы знаете меня. Я за словом в карман не полезу и если сказала - так тому и быть! Я жду вас! Давайте\
    \ поиграем то, что будет просто, как взрыв бомбы!!! Хочется сделать не просто трибьют-проект, а реальное событые в московской\
    \ застоявшейся алдовой трёх-аккордовой блюзне!"
