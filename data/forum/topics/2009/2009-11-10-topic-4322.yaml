    subject: Ответ одного из организаторов фестиваля "Мистерия блюза"
    deleted: false
    text: 'Уважаемые Господа! Гнусный пасквиль Вована Казьмина - вдохновителя и идейного "фронтмена" группы "Юкон", говорит
      сам за себя. Эти амбициозные высказывания о фестивале "Мистерия блюза" написаны слабым и несостоявшимся человеком. Я
      и мои друзья: Борис Булкин, Леонид Истомин, Светлана Руденко и теперь уже Николай Арутюнов, Алексей Вайт Белов, Михаил
      Соколов Петрович, Андрей Евдокимов, группа Plumbum Dreams, Илья Алехин("Соленые орешки"), а также Префектура и Молодежный
      комитет ЮЗАО, Департамент семейной и молодежной политики, Департамент культуры г. Москвы и Правительство Москвы в лице
      Л.Д.Швецовой приложили не мало усилий для организации праздника блюза. Принимая во внимание положительные отзывы о фестивале
      "Мистерия блюза" всем понятно, что праздник удался. Московскому зрителю предоставилась возможность увидеть звезд Российского
      блюза на одной сцене с такими группами, как "Юкон".  И всем стало понятно какая глубокая пропасть лежит между творчеством
      Бориса Булкина, Вайт Белова, Арутюнова, Петровича, Plumbum Dreams, Солеными орешками с одной стороны, и "Юкона" с другой.
      Отсюда и пренебрежительные высказывания в адрес оппонентов, ибо находясь как свинья в грязи, испачкать этой грязью всё
      и вся. Я понимаю, что творческие люди очень ранимы, но истинное искусство выше всяких псевдокритиков, глупых и недалеких,
      с параноидальной психикой больных людей. Реакцию  на фестиваль со стороны "Юкона" никто предсказать не мог, ибо нельзя
      предсказать действия обезьяны с гранатой. Мы, организаторы фестиваля впредь будем более разборчивы при отборе коллективов,
      достойных представить своё творчество на втором фестивале "Мистерия блюза". От лица организаторов фестиваля приношу
      извинения за бестактное поведение Владимира Казьмина. Время и Бог нас рассудит.

      Владимир Баскаков ("Дорога на Миссисипи")'
