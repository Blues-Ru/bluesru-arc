  deleted: false
  text: '<i>тоже ведь про блюз,а?... </i>


    В <a href="http://www.kursiv.kz/culture/1195202771-silvestr-stallone.html" target="_blank">интервью казахскому "Курсиву"</a>
    Сильвестр Сталоне вспоминает свои первые сценарии:


    "Я начал писать сценарии после того, как посмотрел «Беспечного ездока». Я купил две книги: одну о написании сценариев,
    что-то типа «Пишите для удовольствия и для денег», а другую – сценарий «Беспечного ездока». Я прочел его и подумал: «Ничего
    себе! Это же просто диалоги из жизни, а людям за них платят деньги. Я могу не хуже». Так что я сел и написал свой первый
    сценарий. Он назывался «Плачь в голос и шепчи, как ветер, одним дыханием». Это был апофеоз помпезности. Я в то время,
    видимо, слушал слишком много Дилана. Разумеется, никто не стал даже читать сценария с таким названием. Я дал его какому-то
    алкоголику, и даже он сказал, что сценарий говно. Тогда я написал другой, под названием «<b>Печальный блюз</b>». Это был
    дурацкий сюжет про рок-певца, больного сердечным недугом, который можно было вылечить только веществом, содержащимся в
    бананах. Да, у меня слабость к бананам… Короче, рокер влюбляется в девчонку, а затем она его бросает. Певец так расстроен,
    что выходит на сцену, не съев своей ежедневной дозы бананов, и посреди песни падает без чувств. Тут прибегает девчонка
    со связкой бананов, но уже поздно: он умер. Та-дааа."'
