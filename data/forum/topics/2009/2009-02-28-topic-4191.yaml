        date: 2009-03-02 01:08
        poster: Федор Романенко (fedor)
        email: fedor@blues.ru
        subject: Как можно учиться?
        deleted: false
        text: "Как мне кажется, нужно действовать в нескольких направлениях. \nВо-первых, учиться играть на инструменте. При этом, разумеется, с близкой к блюзу направленностью, например, джазовой, а не фламенко. Нужно выяснить основу джазовой гармонии, лады и что такое свинг. \nВо-вторых, нужно начать разбираться с блюзовой музыкой. Послушать много разного - это вообще самый главный момент. Хороший музыкант должен послушать ну минимум 500-1000 пластинок и 100-200 исполнителей.\nНу и параллельно нужно начать разбираться с тем, как блюз играют, скажем, на гитаре, подбирать то, как играть стандартные блюзовые элементы. Тут могут помочь блюзовые школы, где можно быстрее узнать, как сыграть какую-то конкретную вещь.\nИ с самого начала заниматься импровизацией. Играть с записями - это самый стандартный способ самообучения. Но не нужно в будущим им ограничиваться, ибо он настраивает на пассивный подход к музицированию. Если остановился, то за тебя доиграет пластинка. А нужно учиться самостоятельно от начала и до конца производить муз.продукт."
