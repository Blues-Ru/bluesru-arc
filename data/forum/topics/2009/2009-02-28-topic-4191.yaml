        Я понимаю, что блюз приходит во время игры - но чтобы играть и ипровизировать, нужно все-таки владеть инструментом. А большинство преподавателей сейчас обещают научить "любому стилю", а также теппингам и прочим приемам из арсенала металлистов... или технарей.

        Я закончил муз.школу по классу фортепиано, и, пусть даже уже года 4ре не играю (очччень редко), по инструментов я более-менее "владею" - клавиатура как родная, знакомая... а с гитарой тяжелее...'
