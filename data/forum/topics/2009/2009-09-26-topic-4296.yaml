  text: "<a href=”http://kp.by/daily/24366.4/550574/” target=”_blanc”>Белорусская «Комсомольская правда»</a> сообщила:\n\nВ Гомеле бабуся зарабатывает на жизнь, исполняя на улице народные песни и песни советских композиторов. Делает она это с той же наивной простотой, что и тот темнокожий паренек, что впервые показал Дабл-Ю Си Хэнди, «отцу блюза», что такое этот самый блюз. Музыкальной грамоте не обучена, играет «как бог на душу положит» - по тому же принципу, что и тот паренек. Только вместо ножа в качестве слайда она использует «лампочку Ильича». \n\n«Я люблю тебя жизнь»"
