  deleted: false
  text: 'Дополнительно хочу обратить внимание музыкантов на то, что перед концертом в Доме у Дороги в среду будет два мастер-класса. Тэд Робинсон будет рассказывать про блюзовый и соул вокал, это довольно необычно и интересно по двум причинам. Во-первых, таких мастер-классов у нас почти не было, во-вторых вокалу, в отличие от гитары, музыканты у нас учатся редко, так что можно ждать для себя каких-то открытий.


    Шульц будет говорить про блюзовую и джазовую гитару. Вообще, его стиль максимально далек от гениального неразборчивого потока сознания, так что на его записях учиться - самое оно, я, по крайней мере, именно так и поступал в свое время ;). Он покажет, какие бывают выразительные средства, и как ими можно пользоваться. Вот ролики из его мастер-класса в Испании


