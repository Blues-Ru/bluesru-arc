    text: 'Звиняюсь, но есть интересующий меня вопрос. он не в тему, но уж очень меня
      интересует.

      Раньше, когда смотрел видео Джими Хендрикса, СРВ, Джэффа Хили у меня часто возникал
      вопрос: а кто ранее до них играл на гитаре за головой, за спиной, зубами, на
      локте, под ногой?... Мне кажется что это были чёрные и именно блюзовые гитаристы.

      Ну, так мне кажется...

      Очень мне интересно: откель Джими нахватался таковых приёмчиков? У кого подсмотрел?
      Кто таковое пользовал до него?

      И ещё (наимучительнейшЫй для миня вапрос): я, УБЕЙ МЕНЯ, но не могу понять:
      КАК ЖЕ ИГРАЮТ ОНИ НА ГИТАРЕ ЗУБАМИ???????????

      Медиатор ли в зубах? то ли это просто только эффектная иммитация (а на самом
      деле это игра по грифу с примоченным звуком)?

      Извиняюсь за не-самый-умной вапрос.'
