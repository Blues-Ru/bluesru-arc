  text: "Попался мне альбомчик, который ни другу, ни врагу не порекомендуешь \"Lay\
    \ My Demons Down\" - потому что ни хорошего, ни страшного ничего в нем нету.\n\
    \n А курьезного в нем есть то, что сперва вышел он как сольный альбом певца-гитариста\
    \ Tommy McCoy. (http://allmusic.com/cg/amg.dll?p=amg&sql=10:fvftxzygld6e) Но поскольку\
    \ единственное, что есть в нем интересного, это игра на Хэммонде Лаки Питерсона,\
    \ то нынешнее издание на обложке значится уже как Tommy McCoy & Lucky Peterson\
    \ (http://www.amazon.com/Lay-Demons-Down-Tommy-McCoy/dp/B001PK3LVO/ref=sr_1_1?ie=UTF8&s=music&qid=1246393364&sr=1-1).\
    \ \n\nВыводим: маркетинг он и в блюзе маркетинг! )))"
