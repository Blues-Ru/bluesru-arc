    deleted: false
    text: Лондон на поверку оказался совсем не блюзовым городом(((( Предложенный  выше Blues Bar в самом центре города, но увы, он - единственное по-настоящему специализированное место - и при этом крохотное, малосанитарное и т.п. Но практически каждый вечер где-нибудь да проводятся джемы. Нужно их-то и поискать в Гугле. Правда боюсь, что и на джемах Вас разочарует Лондон - блюз, увы, не коммерческая, совсем не коммерческая музыка, поэтому джемы проводятся в пабах, находящихся на грани рентабельности - отсюда более чем скромный звук и общий уровень. Новых молодых звезд в Лондоне практически не появляется, исключение составляет Matt Schofield, да и тот, похоже, не сильно заслуживает статуса звезды. Правда очень много джаза. Сами лондонцы очень рекомендовали за блюзом ехать в Ирландию. Удачи!
