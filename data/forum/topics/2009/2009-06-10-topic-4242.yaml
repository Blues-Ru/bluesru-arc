      deleted: false
      text: "На самом деле, это проблема по всему мира. Блюз - достаточно узкопопулярный вид музыки, в каждом городе максимум 1-2 блюзовых клуба (Москва - исключение), а музыканты стараются ездить, и чаще, чем раз в месяц в одном городе, не играть. Изредка бывают еженедельные концерты по рабочим дням в маленьких местах. \n\nЕсли хочется послушать хороший блюз, нужно выяснить, как зовут нескольких местных интересных музыкантов, а потом ловить их по их расписанию. В Англии я бы сам постарался послушать Paul Lamb, James Hunter и John Mayall, например."
