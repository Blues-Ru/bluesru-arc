  text: '«вы узнаете этот голос? Американец, негр, человек, способный понять любую
    песню, если в ней отображена душа народа!» - первые слова в документальном фильме
    о визите Пола Робсона в СССР (кажись, 1959 год). Звучит при этом «Широка страна
    моя родная» - в исполнении Пола Робсона, разумеется. Правда, больше впечатляет
    «От моря до моря, от края до края» - это та, где слова «народ струдовой» рифмуются
    с «готов на смертный бой» - в его же исполнении «под фортепиано».

    Картинка при этом – ну, всеобщее народное обожание в адрес этого «Американца,
    негра, человека». Дворец спорта набит битком под самую крышу – овация!..

    По «культуре» совершенно случайно наткнулся, вдова Катаняна рассказывает о своем
    муже, лауреате Ленинской премии….'
