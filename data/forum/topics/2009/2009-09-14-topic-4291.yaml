  deleted: false
  text: "<a href=\"http://kazan.kp.ru/online/news/541435/\" target=\"_blank\">\"Комсомольская правда\" докладывает о небывалой дружбе народов</a>.\n\nВ Татарстане под художественный свист куклы в третий раз станцуют блюз \nВ Выставочном зале ГМИИ РТ пройдет выставка Казанского отделения Профессионального союза художников СНГ \n\nПосетители смогут не только познакомиться с творчеством художниц, но и проникнуть в секреты технологий создания кукол\nФото: static.diary.ru Иван МИХАЛИК — 14.09.2009 17:13 \nТретья выставка «Куклы танцуют блюз» пройдет в рамках проекта «Мы можем…». Мероприятие начнется в 16.00 15 сентября.\n\nНа выставке будет представлено более 30 авторских кукол Зили Гизатуллиной, Светланы Маликовой, Юлии Токаренко и Елены Шмелёвой. В рамках презентации посетители смогут не только познакомиться с творчеством художниц, но и проникнуть в секреты технологий создания кукол. \n\nЖивописные работы и произведения декоративно-прикладного искусства современных казанских авторов будут представлены на выставке. Музыкальная тема экспозиции – блюз. Для гостей вечера выступит мастер художественного свиста Вильямс Ахмадуллин, сообщает Министерство Культуры. \n\nОсобенность проекта «Мы можем…» заключается в том, что каждому, кто занимается самодеятельным творчеством, музей предоставляет возможность показать свои работы широкой публике."
