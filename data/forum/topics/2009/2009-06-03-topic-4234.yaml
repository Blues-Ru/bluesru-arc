  deleted: false
  text: '5 июня в московском клубе "Союз Композиторов" с программой "Фестиваль Блюза" выступит легендарный отечественный музыкант Пётр Подгородецкий. Петру Подгородецкому чуть-чуть за пятьдесят, а успел он очень много, причем в самых разных творческих сферах. Конечно, больше всего он известен как великолепный музыкант, почти 30 лет выступающий на сцене, причем более 15 из них - в легендарной «Машине Времени». Как известно, лучшие годы группы связаны именно с его именем. Достаточно сказать, что самая известная и популярная песня «Машины» - «Поворот» - была придумана Подгородецким - композитором, причем еще за пару лет до его появления в коллективе. Наряду с этим хитом его перу принадлежат такие песни как «Скачки», «Этот вечный блюз», «Когда я был большим» и многие другие. Когда перед Подгородецким появляются клавиши, то начинает казаться, что он может и умеет все. Для него действительно нет никаких секретов в музыке, и он с привычным блеском играет и классический блюз, и зажигательный рок-н-ролл, и медленные баллады.


    Петр Подгородецкий (вокал, клавишные), Сергей Коньков (гитара), Евгений Мусатов (бас), Максим Олейник (ударные)


    Адрес клуба "Союз Композиторов": Брюсов пер. 8/10 стр. 2 (м. Охотный ряд), тел: +7 (495) 629 65 63, www.ucclub.ru'
