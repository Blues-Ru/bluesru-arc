      text: В 1970 году мой друг мне рассказал, что недавно вышел новый диск Битлз под названием "Лед Зеппелин". В том же
        году мы уже разобрались, что к чему, и вскладчину (там был еще третий человек) купили виниловый Led Zeppelin III.
        Чтобы меняться "пластами" и пополнять свои бобинные фонотеки. Первое впечатление от Лед Зеппелин, прослушанном на
        стереопроигрывателе "Аккорд", было фантастическим. Как и впечатление от конверта с крутящимися картинками.
