    subject: 'Офф-топик, ну хочется поделиться:'
    deleted: false
    text: "Очень хочется поделиться, понимаю что офф-топик. Сорри за это. Надеюсь что ААА не будет сильно сердиться что в\
      \ его теме запостил.\nПо разному и часто не сразу люди приходят к той или иной музыке. Но вот когда ту самую музыку\
      \ ты находишь, то тебя охватывает огромная радость и ощущение некоего счастья. Были и моменты разочарования от несовсем\
      \ оправданных ожиданий услышанного.\nК сожалению, эти эмоции в большей степени посещают в детстве и в юности (так сказать\
      \ по тинейджерству)... С годами я стал терять это чувство... \nНо я помню ту радость когда я впервые услышал Creedence,\
      \ и то как я прибалдел от Роберта Джонсона, и как меня зацепил SRV.\nСегодня набрёл на статью автор которой рассказывает\
      \ <a href=\"http://www.rocksimona.ru/book6.htm\">как он вперые услышал певый альбом LED ZEPPELIN</a>. У меня были похожие\
      \ впечатления: далеко не сразу я его принял...\nИ ещё, там же, очень меня позабавил рассказ о том как <a href=\"http://www.rocksimona.ru/book7.htm\"\
      >Элеонора Беляева комментировала фестиваль Сопот-1970</a>.\n<i>Ну, просто я захотел поделиться прочитанным...</i>"
