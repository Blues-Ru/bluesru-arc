  text: "Свинговый Бум\nПройдет 26 июля в Москве в парке СОКОЛЬНИКИ \nНачало в 13.00\n•\tФестиваль «Свинговый Бум» объединяет\
    \ лучших музыкантов, играющих джаз, блюз, свинг, рок-н-ролл, сёрф, кантри, ска и лучших танцоров буги-вуги, рок-н-ролла\
    \ и свинга.\n\n•\tМузыка и танцы, яркие костюмы и феерическое движение! \nСвинг – это весело и культурно! Свинг – это\
    \ всегда стильно и модно! \nФестиваль «Свинговый Бум» – это позитивный настрой и неиссякаемая энергия!\n\n•\t200 пар,\
    \ танцующих в стильных костюмах... 6 часов музыки, 10-15 музыкальных коллективов, одетых по моде 30-40-50-60-х годов,\
    \ сверкающих дудками и никогда не использовавших фонограмму – это незабываемой зрелище!\n\nВсегда в программе:\n•\tшоу-турнир\
    \ по танцам (буги-вуги, линди-хоп, чарльстон, степ, джаз) с участием танцоров Москвы, Петербурга, Калининграда, Н.Новгорода,\
    \ Ярославля, Иванова, Киева, Харькова\n•\tмастер-класс по буги-вуги проводят чемпионы России Владимир Ишимов и Ксения\
    \ Семенихина \n•\tшоу студии «Танцкласс». Rambler-Vision ведет прямую интернет-трансляцию \n•\tшоу школы акробатического\
    \ рок-н-ролла «Спартак»\n•\tвыставка ретро-автомобилей клуба «Авто-старина»\n•\tшоу номера Французкой школы танцев\n•\t\
    показ коллекции винтажной одежды Магазина «Сочный апельсин», конкурс  костюмов.\n•\tСписок музыкальных коллективов, участвовавших\
    \ и запланированных на ближайшие мероприятия  в рамках фестиваля:\n•\tМаксим Леонидов (экс-СЕКРЕТ) и «HIPPOBAND»\n•\t\
    Евгений Хавтан \n•\tWISE GUYS \n•\tMOSCOW RAGTIME BAND (диксиленд)\n•\tBILLY’s BAND, СТАРЫЙ ПРИЯТЕЛЬ\n•\tПИЖОНЫ (экс-МИСТЕР\
    \ ТВИСТЕР, буги/свинг/латина) \n•\tКарл Хламкин и ОГНЕОПАСНЫЙ ОРКЕСТР (ска/рэгги, Рига) \n•\tOFFBEAT (буги, экс-БРАВО)\
    \ \n•\tИлья Моисеенко и КОРОЛИ ТВИСТА (твист) \n•\tJUMPING CATS (блюз) \n•\tSKALALA (ска-джаз) \n•\tJulia Jostin & GROOVE\
    \ PARTY (кантри, Рига) \n•\tWISE GUYS (рокабилли, Харьков) \n•\tBLACKMAILERS (этно/блюз, Владимир) \n•\t\nПостоянные участники\
    \ и организаторы Фестиваля\n\nПостановщик фестиваля – известный музыкант Олег Усманов из легендарной группы МИСТЕР ТВИСТЕР\n\
    \n1.\tКомпания «Спидола»                                                      \n2.\tФедерация танцев в стиле свинг (ФТСС)\
    \                            \n3.\tКлуб акробатического рок-н-ролла «Спартак»\n4.\tРетро-клуб «Авто-cтарина»\n5.\tМагазин\
    \ винтажной одежды «Сочный апельсин»\n6.\tИнтернет-сайт www.rockabillyswing.ru\n7.\tИнтернет-сайт http://www.jazz.ru/\n\
    8.\tИнтернет-сайт http://www.blues.ru/\n\nС 2001 года Фестиваль регулярно проходит в клубе «Б2» при стечении 400-500 зрителей.\
    \ На открытом Фестивале в Саду Эрмитаж в 2005 году для 1500 зрителей пели 20 коллективов. В 2007 году Фестиваль состоялся\
    \ в крупнейшем в Европе клубе «Б1 Максимум» на 3500 мест. В 2008 году местом проведения  Фестиваля был  Горбушкин Двор,\
    \ число зрителей подсчитать не удалось.\n\n•\tМузыканты, играющие свинговую музыку – оптимисты, и публика, приходящая\
    \ на такие концерты, естественно, обладает тем же складом характера. Поэтому невозможно передать необыкновенную атмосферу\
    \ «Свингового Бума» сухими словами пресс-релиза. Попавший на мероприятие человек испытывает позитивный культурный шок.\
    \ Фестиваль уникален органичным соединением музыки и танца. Он дает редкую возможность с головой погрузиться в атмосферу\
    \ беззаботных 50-60-ых и зарядится  положительными эмоциями, так необходимыми в наше тяжелое «кризисное» время.\n•\t\n\
    •\tОфициальная страница Фестиваля: http://www.rockabillyswing.ru/swingboom/swingboom.htm\n•"
