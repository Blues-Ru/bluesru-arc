    subject: RIP!
    deleted: false
    text: Я два года назад гулял по славному Нью-Йорку, прошел мимо маленького бара,
      где было написано, что сегодня вечером и по вторникам там играет Лес Пол. Я
      сначала не поверил, очень удивился тому, что он еще жив, оказывается, и что
      выступает в таком странном скромном месте. Потом я прочитал об этих концертах
      где-то в википедии, и о том, что он кроме этих концертов очень давно нигде не
      играет. Почему-то вспомнил об этой истории неделю назад и подумал, что ему,
      наверное, много лет, что он может умереть, а я его живьем в этом баре так и
      не послушал. Как написал Арсен, он играл до 93-х или 94-х лет, ничего себе!
