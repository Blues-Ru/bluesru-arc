    text: "http://www.srvrocks.com/lyrics-willie_the_wimp.htm\n\nOn the south side of Chicago in more recent times, there\
      \ were a couple of dudes with very bad reputations; Flukey Stokes and his son Willie the Wimp. They beat people up.\
      \ They sold drugs. They became wealthy. Willie the Wimp was shot in 1984 and dad threw a funeral. Thousands were invited.\
      \ Even more invited themselves. People don't often see the recently departed sitting up and holding the steering wheel\
      \ of a coffin modeled after the Cadillac Seville. A coffin with flashing lights and flowers for wheels. Oh sure, there\
      \ were some other thoughtful touches, rings on his fingers and c-notes stuck like cigarettes in his hands.\n\nThe post-burial\
      \ birthday party for Willie the Wimp was held at the same motel where Willie was shot. So it was, Willie the Wimp became\
      \ more famous in his coffin than he had been in the street. It's a story that inspires song. Flukey Stokes was gunned\
      \ down last November as he sat in his car. We thought you'd like to know Stevie Ray isn't singing about some Mickey\
      \ Spillane fiction. He's singing about Chicago. \n\n<img width=\"400\" src=\"http://www.srvrocks.com/willie_the_wimp.jpg\"\
