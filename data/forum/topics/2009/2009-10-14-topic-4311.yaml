  subject: Lucky Peterson - 14.10.2009, Jazz Club Lionel Hampton
  deleted: false
  text: "Я только что вернулся с концерта. В группе было четыре человека - Лаки играл\
    \ на органе, гитаре и пел, также с ним был еще один гитарист и ритм-секция. Лаки\
    \ решил играть разную музыку без какой-либо системы. Там были Organ-combo номера,\
    \ были соул-баллады, чикагский блюз на гитаре, джазово-блюзовые импровизации.\
    \ \n\nОт концерта осталось очень приятное впечатление. Лаки чувствовал себя довольно\
    \ расслабленно и играл ту музыку, которая ему нравилась. Он не соблюдал форму,\
    \ заканчивал песни чуть раньше, сразу начинал следующие. Там почти не было длинных\
    \ соло. Такое ощущение, что он играл так, что у каждого квадрата или такта были\
    \ какие-то достоинства. Если было бы непонятно, что хорошего в этом куске песни,\
    \ он бы ее и не играл. Поэтому не было никакого творчества на тему или обыгрывания\
    \ в соло или скучных мест, Питерсон их просто вырезал.\n\nПри всем при этом у\
    \ Питерсона очень хороший вкус на звук Хаммонда и приглушенной гитары. Вполне\
    \ по-эстетски все звучит. Очень хороший выбор материала, сильный голос и бодрость\
    \ духа.\n\nЯ бы очень рекомендовал послушать в Москве, правда, совершенно не понимаю,\
    \ что из всего этого получится в огромном зале. ;) Будет что-то странное, я думаю.\n\
    \nP.S. На концерте Лаки продавал тройной диск записанной им органной очень разной\
    \ музыки. Я его не купил, ценник явно предназначался для богатых буратин, из которых\
    \ можно вытрясти много чего. Но комплект вызвал у меня живой интерес, нужно его\
    \ будет раздобыть..."
