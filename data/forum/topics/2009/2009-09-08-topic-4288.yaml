  text: "Минск Блюз 2009 – требуется помощь.\nУважаемые дамы и господа, представители\
    \ бизнес элиты Республики Беларусь,\n\n14 ноября 2009 года в Минске пройдет IV-й\
    \ международный фестиваль блюза «Минск Блюз 2009». Вот уже 3 года оргкомитет фестиваля\
    \ справлялся с организацией этого мероприятия собственными силами, однако в этом\
    \ году появилась уникальная возможность сделать фестиваль поистине историческим\
    \ для нашей страны! \n\nВсемирно известный блюзмен Сонни Ландрет (Sonny Landreth)\
    \ выразил согласие выступить на фестивале Минск Блюз 2009 и уже внес наш город\
    \ в расписание на своем сайте. Однако, к большому сожалению, собственных ресурсов\
    \ организаторам фестиваля пока не хватает. Для участия артиста мирового уровня\
    \ на нашем фестивале необходима сумма, которая заметно меньше гонораров большинства\
    \ российских звезд шоу-бизнеса, а ведь это для многих предприятий нашей страны\
    \ вполне по силам. Посольство США в Минске согласилось оказать техническую помощь\
    \ по размещению музыканта и оплатить его транспортные расходы.\n\nЕсли не упустить\
    \ этот шанс, то в нашей республике произойдет первый в истории блюзовый фестиваль\
    \ с участием артиста мирового уровня, которым восхищаются такие легендарные музыканты\
    \ как Эрик Клэптон, ББ Кинг, Марк Нопфлер, Эрик Джонсон и многие другие гиганты\
    \ блюза, приглашавшие Сонни на свои концерты и совместные записи.\n\nЭто поистине\
    \ историческое для нас событие поможет нашей республике стать заметнее на мировой\
    \ карте высокой культуры, неотъемлемой частью которой является Блюз. Ведь у нас\
    \ в Минске появится блюзовый фестиваль, уровнем которого сможет гордиться вся\
    \ Беларусь!\n\nИскренне надеемся найти единомышленников, которые помогут реализовать\
    \ мечту тысяч белорусских поклонников блюза.\n\nБолее подробную информацию можно\
    \ получить по телефонам: (029) 607-74-75, 656-08-01 или по адресам электронной\
    \ почты alexeyev.yaroslav@gmail.com, sergei.kurek@gmail.com.\n\nСергей Курек,\n\
    музыкант,\nчлен организационного комитета\nфестиваля «Минск Блюз»\n\nАлексеев\
    \ Ярослав,\nглава организационного комитета\nфестиваля «Минск Блюз»"
