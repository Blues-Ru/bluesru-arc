  text: "Три концерта в Москве: \n\n30 января пятница и 01 февраля,воскресенье- клуб\
    \ \"FORTE\", ст.м.Пушкинская, ул.Большая Бронная,д.18, тел.(495) 694-08-81; http://www.forteclub.com/index.html\n\
    \n31 января- клуб Игоря Бутмана,м. \"Чистые  Пруды\"/\"Тургеневская\", Уланский\
    \ переулок, д. 16 (в здании гостиницы \"Уланская\")\nЗаказ столиков: (495) 632-9264\n\
    \nСайт группы,можно смотреть видео и слушать аудио: http://www.mamasbadboys.com/\n\
    \nПодробности: \"MAMAS BAD BOYS\"- Блюзовые гиганты Ламар Чейс и Отис Рахим Хорнсби\
    \ не собираются пока стать легендами, хотя их карьера дает им полное право почивать\
    \ на лаврах. Калифорниец Чейс играл с Джоном Ли Хукером, Ловеллом Фолсоном, Тауэр\
    \ оф Пауэр, Слай энд Зе Фэмили Стоун и Сантаной, в то время как его земляк Хорнсби\
    \ гастролировал по Штатам с такимизвездами, как Филлис Хайман, Джимми Рид и Нэнси\
    \ Уилсон. В восьмидесятые они решили подперчить Амстердамскую Блюзовую сцену.\
    \ \nВсе, что этим горячим парням не хватало, так это надежного барабанщика, которого\
    \ они нашли в лице Толика Смирнова – Питерского музыканта, живущего в Амстердаме.\
    \ Funky rockin’ blues - результат этого кругосветного путешествия, и понятно,\
    \ что Амстердам не последняя остановка! \n\nПо свидетельству очевидцев,видевших\
    \ этот коллектив прошедшим летом на фестивале \"ДЕЛЬТА НЕВЫ\" в Питере- состав\
    \ умопомрачительный.\nВ концерте также будут принимать участие лидер питерского\
    \ культового коллектива Doo Bop Sound тенор-саксофонист Алексей Попов и певица\
    \ Лера Гехнер -\n- www.http://www.gehner.ru/ .\nЭто редкий для Москвы концерт.Вход\
    \ чрезвычайно демократичный,но надо звонить в клуб.\nhttp://www.forteclub.com/index.html"
