  subject: 'из обзора новоsтей: Колокола играют блюз'
  deleted: false
  text: 'Фестиваль музыки и колоколов "Преображение" завершился в Ярославле - sообщает <a href="http://yaroslavl.rfn.ru/rnews.html?id=29400&cid=7"
    target="_blank">http://yaroslavl.rfn.ru/rnews.html?id=29400&cid=7</a>: Заключительный ночной концерт удивил гостей экспериментом.
    Название шоу – колокола и джаз – еще в самом начале обещало зрителям необычное действо.


    "Колокола и джаз" – уже в названии концерта организаторы четко расставили приоритеты. Традиционные колокольные звоны стали
    главной и ведущей темой ночного праздника. Вначале перед гостями фестиваля выступили лучшие звонари из разных городов
    России и Беларуси.


    Необычное организаторы – что называется - припасли под конец. Ярославские джазмены из ансамбля "Плюс один" вышли к зрителям
    вместе со звонарями из Великого Новгорода.


    Стены древнего Спасо-Преображенского собора, конечно, многое видали. Ночной концерт "Преображения" не первый год удивляет
    гостей. На этой исторической площадке уже выступали звонари с солистами и даже с ди-джеями, но когда здесь звучит джаз
    – впечатление особенное.


    Настроение на концертной площадке постоянно менялось. Вначале музыканты исполнили грустные блюзовые мелодии. Продолжили
    веселым религиозным гимном афроамериканцев под названием – "Когда святые маршируют". И каждый раз перезвон колоколов удачно
    дополнял звуки саксофона и контрабаса.


    Музыканты после концерта признавались – им никогда еще не приходилось играть такой одухотворенный джаз. Концерт завершился
    перезвоном колоколов и фейерверком.'
