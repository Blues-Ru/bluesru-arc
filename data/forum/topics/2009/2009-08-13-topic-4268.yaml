  text: "www.vashdosug.ru сообщает: \"Для самых взыскательных гостей шеф-бармен Mon\
    \ caf&#233; приготовил авторские коктейли на основе свежевыжатых фруктовых и ягодных\
    \ соков: ... «Черничный блюз» из свежих голубики, , клубники, ананаса и лайма\
    \ ...\" (Голубичный блюз был бы уже перебор, наверно). \nsusanin.udm.ru радует:\
    \ \"Ижевчане и гости столицы Удмуртии посоревнуются в конкурсе-караоке «Весенний\
    \ блюз». (в августе в Ижевске блюз особенно актуальен).\nwww.vedomosti.ru в Зальбурге\
    \ обнаружила сверхвозможности реверберации: \"Реверберация то и дело продлевает\
    \ самые красивые арии, играют саксофоны и ударные, а блюз готов перевести историю\
    \ в жанр фильма-нуара.\" - воообще-то речь об оратории Вивальди \"Юдифь\"."
