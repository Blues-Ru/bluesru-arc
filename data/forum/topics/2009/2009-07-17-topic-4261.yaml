      poster: Михаил Переплеснин
      subject: Ответ
      deleted: false
      text: Да это первый такой случай когда на виниле издали такой первый сборник,
        первого блюзового фестиваля Блюз в России 1992, где отметились на виниле большинство
        именитых и начинающих блюзовых команд, начиная от Лиги Блюза и Удачного приобретения
        и заканчивая молодыми на тот момент командами такими как "Блюз Офис" из Ашхабада
        и "Дождь" из Харькова, которые отметились тогда на том виниле по одной песне
        - случай по тем временам уникальный. Интересные композиции прозвучали от таких
        команд как "Ультима Туле" из Эстонии - в Эстонии всегда были хорошие музыканты
        профессионально владеющие инструментами и грамотным подходом к своему творчеству.
