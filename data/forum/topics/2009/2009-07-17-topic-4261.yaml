  text: "<img src=\"http://blues-blues.narod.ru/Blues-92-CD.gif\" align=\"bottom\"\
    >\n\nФестиваль \"Блюз в России\" (Москва, январь 1992)\n<a href=\"http://blues-blues.narod.ru/AboutR.htm\"\
    >Заметки о фестивале \"Блюз в России'92\"</a>\n\"Десятилетиями блюз в России почитался\
    \ то как первобытный недоджаз, то за африканскую песню свободолюбивых американских\
    \ негров, то просто подстатейной пропагандой западного образа жизни. Клише по\
    \ осени опали, а блюз остался тем, чем был, - необъятной вселенной сложнейших\
    \ музыкальных взаимосвязей, отражающей реальность печалей и радостей обыкновенного\
    \ человека. В свое время блюз - простой и сложный по своей природе - в походе\
    \ на Восток покорил всю Европу, приостановившись у российских ее пределов. \n\
    Теперь он двинулся дальше - маршрутам триумфально о шествия советской власти.\
    \ И \"БЛЮЗ В РОССИИ\" знаменует успешное окончание этапа первого знакомства широкой\
    \ публики с музыкой блюз. Этот фестиваль во многих отношениях был первым - столь\
    \ представительным, хорошо телевизированным, первым спонсированным... - без рок-н-ролльной\
    \ приманки. За исключением рокабилльных \"Опасных соседей\" и тяжеловатых \"Ультима\
    \ Туле\" на сцене был действительно \"люди грусти\" (англ. bluesmen). И судите\
    \ их без скидок на российскую глубинку...\n<a href=\"http://letitbit.net/download/966f3ed0cd/bluesrus1.rar.html\"\
