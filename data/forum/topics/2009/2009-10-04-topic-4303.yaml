  text: "<b>I</b>\n\n<a href=\"http://www.etver.ru/lenta/index.php?newsid=45024\" target=\"_blank\">eTver.Ru</a> сообщает:\n\n23 сентября при полном аншлаге в Тверской академической филармонии прошел осенний фестиваль джазовой музыки «September jazz rain». В этом году на тверскую сцену вышли несколько ярких звезд, известных далеко за пределами своих стран. \nСреди них представители «черного джаза», афроамериканцы, - блистательный вокалист Деннис Роуленд и некоронованный король блюза Винни Сент Мартин. \nДеннис Роуленд родился в 1948 году. Первый крупный успех он приобрел в 1977 году, когда стал выступать в составе всемирно известного оркестра Каунта Бейси. С 1984 года Деннис начал сольную карьеру. Не раз он бывал и в России. А его исполнение захватывает разнообразием и живой импровизацией. В репертуаре музыканта есть песни и в классическом джазовом исполнении, и в стилизованных направлениях - ритм-энд-блюз, фанк и многое другое. В Твери Деннис Роуленд выступил в сопровождении известных российских джазовых музыкантов. \nСент Мартин ослеп еще в детстве. Он решил посвятить свою жизнь музыке, после того как услышал пение Рэя Чарльза - всемирно известного блюзмена, страдающего тем же недугом. Винни Сент Мартина называют последователем его традиций. По мнению музыканта, только блюз может передать все нюансы человеческой души. Его голос удивляет широтой диапазона и глубоким тембром. \nФилармонические джазовые фестивали в Твери - событие значительное. А постоянно растущий уровень исполнителей говорит о том, что у этого фестиваля большое будущее.\n\n<b>II</b>\n\n\n<a href=\"http://www.etver.ru/lenta/index.php?newsid=45024\" target=\"_blank\">газета \"Хрещатик\"</a> сообщает:\n\nК 4-летию Международного джазового абонемента на сцене Киевской консерватории выступила известная американская джазовая певица Синтия Скотт. <br>Информирует NEWSru.ua: \nОна является одной из самых значимых исполнительниц в мире, последовательницей и ученицей легенды джаза Рея Чарльза, в коллективе которого певица была бек-вокалисткой. Таким образом полуторачасовой концерт Скотт назывался \"Воспоминания о Рее Чарльзе\". \nГлубокий голос Синтии, ее сценический кураж и влюбленность в джаз не могли не растрогать, даже взбудоражить опытную киевскую публику. Рассказывая о своем творческом духовнике Рее Чарльзе, певице удалось наладить живой контакт с залом, вызвать неподдельные эмоции у киевских почитателей джаза. И хиты легендарного Рея Чарльза вскоре зал пел уже вместе с Синтией. А активнее всего - галерка с 12-ю киевскими студентками-музыкантками, которым накануне певица дала мастер-класс. \n\nВ Киев Синтия Скотт привезла двух других гуру мирового джаза: пианиста Марка Соскина (уроженца Нью-Йорка) и ударника Стива Вильямса. Вместе с украинским известным контрабасистом Аркадием Овруцким они и аккомпанировали певице. Демонстрируя виртуозный класс игры и заводные джазовые импровизации, музыканты постоянно срывали овации зала. \n<small>Справка:<br> \nДжазовая вокалистка Синтия Скотт получила степени бакалавра и магистра искусств по вокалу в Manhattan School of Music, пишет портал \"Международный джазовый абонемент\". \nВ начале своей профессиональной карьеры певица была одной из вокалисток Рэя Чарльза (Ray Charles Raelettes). Затем она выступала с такими знаменитыми американскими джазменами, как Лайонел Хэмптон, Кэб Каллоуэй, Джо Вильямс, Оскар Питерсон, Лу Дональдсон, Уинтон Марсалис и Гарри Конник-младший, а также с оркестром Каунта Бейси. \nВ течение 10 лет Синтия пела в составе биг-бэнда престижного Нью-Йоркского клуба Supper Club и гастролировала по Европе, Азии, Южной Америке и Канаде. Ее последний CD, получивший название Boom Boom, был записан в Японии совместно с трио Нормана Симмонса. \nВ 1998 году Синтия стала финалисткой международного конкурса джазовых вокалистов имени Телониуса Монка, а в 2002 году была номинирована на Грэмми за альбом A La Carte. Певица представляла свою страну в программе Jazz Ambassadors 2004. Она стала первой джазовой вокалисткой, отправившейся в рамках культурного обмена давать уроки и проводить мастер-классы в Южную Африку и Францию.<br> \n\nПианист (фортепиано) Марк Соскин родился в Нью-Йорке. В разное время он выступал с Сонни Роллинзом, Джо Хендерсоном, Рэнди Брекером, Билли Кобэмом, Гато Барбьери, Джо Локом и другими. \nМузыкальную карьеру начал как классический исполнитель, окончил Университет штата Колорадо (США), затем музыкальный колледж Беркли в Бостоне. \nПервый альбом пианиста, записанный на лейбле Prestige (дочерней компании Fantasy), попал в десятку лучших джазовых альбомов года по версии журнала Billboard. Марк много гастролирует, дает мастер-классы в разных странах. \n\n<b>III</b>\n\n\n<a href=\"http://www.day.az/news/culture/175077.html\" target=\"_blank\">Day.Az</a>\n\nВ Бакинском Джаз-Центре с концертом выступит известнейшая блюзовая команда из России Modern Blues Band.\n\nКонцерт будет проходить два дня – 10 и 11 октября. В первый день – непосредственно выступление коллектива. А во второй - джем-сейшн с нашими музыкантами.\n\nModern Blues Band некоторые критики называют первым блюзовым коллективом России, и при этом Modern Blues Band - одна из самых популярных блюзовых команд в России. За сравнительно недолгую историю своего существования группе удалось самое главное - завоевать сердца истинных ценителей блюза. \n\nРепертуар Modern Blues Band составляют оригинальные интерпретации блюзовых стандартов, классические произведения в стиле соула и рока, а также авторские композиции, созданные в лучших традициях джаз и рок-музыки. \n\nУзнаваемый стиль Modern Blues Band отличается энергичной манерой исполнения в сочетании с тонким пониманием нюансов блюза. Modern Blues Band, основанный 1995 году грузинским музыкантом Гией Дзагнидзе, объединил группу профессиональных музыкантов, в разное время выступавших в таких популярных коллективах, как биг-бэнд Георгия Гараняна, квинтет Алексея Козлова, оркестр Анатолия Кролла, группы Con Alma, Каданс. \n\nВ настоящее время в состав группы входят: Гия Дзагнидзе (гитара, вокал), Сергей Слободин (бас-гитара), Дмитрий Матюхин (ударные), Евгений Ревнюк (клавишные). \n\nГруппу одинаково хорошо принимают как на небольших клубных сценах, так и на стадионах крупных городов. В истории Modern Blues Band немало совместных выступлений с признанными мэтрами блюзовой и джазовой сцены. Так, знаменательным событием в творческой жизни группы стало ее выступление со всемирно известным биг-бэндом под управлением Уинтона Марсалеса, посвященное дню независимости Америки.\n\nАнсамбль постоянно выступает на самых престижных международных Джаз, блюз-, и рок-фестивалях. Например, на Международном музыкальном фестивале «Blues Summit», который собрал популярнейших блюзовых музыкантов из США, Великобритании, Ирландии, Польши, стран Балтии, где совместное выступление Дзагнидзе и Ко с ирландской группой «The Taste» было восторженно принято многотысячной аудиторией."
