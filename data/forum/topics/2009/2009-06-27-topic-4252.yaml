  text: "Этот пост я размещал на различных форумах, но, увы, безрезультатно. Последняя надежда на Андрея  Евдокимова\n\n\nЛет пятнадцать назад я случайно записал с какого-то, тогда ещё всесоюзного, \nрадиоканала этот блюз. Имя исполнителя было названо, но я его , увы, не запомнил.... Кассету года 3 назад потерял... и вдруг нашёл её в гараже. \nКое-как перенёс в комп (увы, звук ужасный) \nМожет быть кто-нибудь здесь знает имя исполнителя: \n\nссылка : \nhttp://www.sendspace.com/file/ok4wtg \n\nДиагноз с блюзфорума ))) : \"Muddy\":\nкак будто алжирцы-певцы \"Rai\" исполняют классический блюз \n\nОчень надеюсь на помощь."
