  deleted: false
  text: "Только что в Вестях показывали открытие 31-го ММКФ. Так вот, тамошний гость, обладатель «Оскара», актер Эдриан Броуди\
    \ сказал что то ли представит, то ли снялся в фильме о блюзе, о музыке 50-ых годов.\nВот что я поискал:\nhttp://kino-vsem.ucoz.ru/news/2008-01-24-28\n\
    Эдриан Броуди будет творить историю блюза\t16:02 \nЭдриан Броуди и Джеффри Райт в марте приступят к съемкам в ленте об\
    \ истории блюза и музыкального бизнеса — Cadillac Records. \nЭдриан сыграет знаменитого продюсера и главу лейбла звукозаписи\
    \ Chess Records Леонарда Чесса, который специализировался на блюзе и ритм-н-блюзе. Джеффри Райт станет на экране легендарным\
    \ блюзменом Мадди Уотерсом. Действие фильма будет развиваться в Чикаго 50-х годов прошлого столетия. Режиссер и сценарист\
    \ картины — Дарнелл Мартин. Для него Cadillac Records станет первым художественным фильмом с 1994 года. \nПрежде чем заняться\
    \ музыкой и музыкантами Леонард Чесс перепробовал много разных работ. Он продавал газеты, обувь, молоко, а затем надолго\
    \ застрял в «деле» своего отца, который зарабатывал на жизнь скупкой, сортировкой и перепродажей старья. В 1944 году Леонард\
    \ Чесс, которому только что исполнилось 26 лет, вышел из мусорного бизнеса и открыл собственное дело, открыв бар. Чесс\
    \ внимательно следил за тем, какую музыку выбирают его клиенты. Оказалось, что больше всего любят блюзы, но исполнителей\
    \ этой музыки в то время записывали очень мало. \nВ 1947 году Чесс вместе с братом стали партнерами звукозаписывающего\
    \ лэйбла Aristocrat Records. В том же году одним из музыкантов, пришедших на студию, оказался Мадди Уотерс. Частично его\
    \ успех помог братьям Чесс выкупить другие доли владельцев лэйбла и реорганизовать его, назвав Chess Records. В 50-е и\
    \ 60-е годы годы компания выпускала записи таких вошедших в историю музыки артистов, как Чак Бэрри, Вилли Диксон, Джон\
    \ Ли Хукер , Бо Дидли, Этта Джеймс и другие. Леонард Чесс умер в 1969 году. В 1987 году его емя было внесено в Зал Славы\
    \ рок-н-ролла. \nПроизводством фильма о Чессе займется студия Sony BMG Film, основанная в 2005 году, специально для съемок\
    \ картин, связанных с музыкальным бизнесом. Одной из первых работ компании был фильм «Почувствуй ритм», снятый совместно\
    \ с компанией Дженнифер Лопез Nuyorican Films.\n\nP.S. «Знаменитый американский актер, известный зрителям по «оскароносной»\
    \ картине «Пианист» Романа Полански, станет первым почетным гостем Московского кинофестиваля», - пояснили в пресс-службе."
