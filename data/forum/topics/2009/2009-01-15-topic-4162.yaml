  text: "\"15 января, в 1909 году  (100 г. назад) в Чикаго, Иллинойс, родился Жен Крапа (Gene KRUPA).\"\nВы что сговорились имена и названия коверкать? Его звали Джин Круппа (ударение на первый слог), точно так же как известного английского актёра зовут Шон Коннери а не Сеан Коннери. Того гляди Джонни Винтера переименуете в Жохнни Уайнтера и мне страшно подумать во что превратится Muddy Waters. \n\n\"В 1949 году (60 г. назад) в Джексонвилле, Флорида, родился Ронни Ван Зандт (Ronnie Van ZANDT). Певец и гитарист, он собрал развеселый странствующий рок-бэнд Lynyrd Skynyrd. В южном роке, который они исполняли, ясно заметны блюзовые корни.\" \n\nУБЬЮ!!! Ван ЗАНТ. Рональд Уэйн Ван ЗаНТ (Ronald Wayne Van Zant) если полностью. Никакого \"Д\" там отродясь не было, и гитаристом он НИКОГДА не был, ознакомьтесь с историей а потом пишите: только лидер-вокалист и сонграйтер. У Skynyrd единовременно было три гитрариста: Аллен Коллинз, Гэрри Россингтон, Эд Кинг, которого сменил Стив Гейнс (если рассматривать классический период). Ронни за гитару на сцене никогда не брался, только вокал и губная гармошка иногда. Если что не ясно милости прошу сюда (при написании статьи я консультировался с родными - для них - источниками: официальными биографиями и пару писем на головной сайт начеркал, с просьбой разъяснить несколько моментов (они мне ответили):\n\nhttp://old-rock.ru/monsters/lynyrd_skynyrd/lynyrd_skynyrd.html\n\nДа и на счет \"ясно заметны блюзовые корни\" я бы тоже поспорил... они там есть но - они не единственные."
