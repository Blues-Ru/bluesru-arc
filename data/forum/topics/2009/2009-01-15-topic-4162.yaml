    text: 'По сути: я проверил, вы правы насчет Gene, прокатился по всему календарю, и везде, где была ошибка в транскрипции, поправил на Джин. Насчет KRUPA вы меня не убедили, тем более, второе П вообще непонятно, откуда взялось. ЗаНДТ – всего-навсего опечатка. Если бы вы были знакомы с печатным делом на практике, или с теорией ошибок хотя бы в общих чертах, вам бы было известно, что при работе с большим объемом текста ошибки неизбежны. Именно поэтому в печатном деле существовали профессии редактора и корректора. Если бы вы читали Записные книжки Ильфа, вам бы запомнилась заметка: «Решено было не допустить  ни  одной  ошибки.  Держали  двадцать корректур.  И  все  равно  на  титульном  листе  было  напечатано: "Британская энциклопудия"»… На Blues.Ru редактировать было некому, потому столько ошибок… и я весьма признателен всем, кто указывает на допущенные ошибки.


      По форме: Охота изображать из себя последнего защитника истины от неучей? а если в общественном транспорте тебе на ногу наступят, ты вообще сразу кинжал вынимаешь? Если простая опечатка вызывает у тебя желание убивать – сходи к доктору, пока не поздно! А то ведь появятся скоро маленькие зеленые человечки и прикажут огнем и мечом очистить землю от скверны…'
