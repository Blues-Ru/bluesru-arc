    subject: Андрей, пройди по сцылочке за подробностями
    deleted: false
    text: 'http://www.phatmass.com/phorum/index.php?showtopic=14791


      1) In Aramaic, Cephas sounds more like KAY-fas, but the English transliteration often pronounces it SEE-phas. Hope this
      helps.


      2) In the Passion of Christ, Mary runs to Peter just outside of the Temple where they''ve taken Jesus to be judged by
      the Sanhedrin and she sees Peter and cries "Keefa."


      Короче, если тебе надо "как по правилам английской фонетики" - то [si:fez], а "по-церковному" - Кифа (русская традиция)
      или Kephas, что в сущности одно и то же, последнее -as может редуцироваться.


      * Petrus, от греческого слова &#959; &#960;&#941;&#964;&#961;&#959;&#962; = камень, скала, арамейское Kephas=Cephas)'
