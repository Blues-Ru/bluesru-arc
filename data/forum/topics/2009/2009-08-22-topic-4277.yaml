  deleted: false
  text: '"В Архангельском готовят праздник «На исходе лета». Обещают выставку-продажу
    ремесленных работ (оригами, кованые изделия, икебаны), мастер-классы, костюмированный
    «исторический променад», экскурсию «Дачные сезоны в Архангельском», шоу ловчих
    птиц и выступление ансамбля кельтской музыки «Волки и овцы». Впрочем, главное
    музыкальное мероприятие праздника — концерт, посвященный памяти знаменитого блюзового
    музыканта середины прошлого века Ти-Боун Уокера." - сообщает <a href="http://www.arhangelskoe.org/events/concerts/"
    target="_blank">arhangelskoe.org</a>.'
