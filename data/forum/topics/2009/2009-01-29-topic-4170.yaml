  text: "Из  \"блюзового календаря\":  \nВ 1928 году (81 г. назад) в Портсмуте, Вирджиния,\
    \ родилась Рут Браун (Ruth BROWN). (...) Сейчас голос погрубел, как и темы песен.\
    \ Но в блистательном созвездии блюз-джаз-свинговых Браунов она не теряется ни\
    \ голосом, ни статью, ни характером.\n(конец цитаты)\n\nНапоминаю, что Мисс Ритм\
    \ уже скончалась. Так что слово \"сейчас\" неуместно."
