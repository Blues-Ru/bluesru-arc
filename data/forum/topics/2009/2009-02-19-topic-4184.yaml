              deleted: false
              text: 'мне очень-преочень нравится Strong Persuader (1986г). это был
                первый альбом Крэя который я услышал. было то в 1993г. то что я слышал
                потом меня мало трогало: Muddy прав - Крэй разочаровывает.

                Right Next Door (Because Of Me) моя одна из самых любимых на этом
                альбоме. и содержание песни меня нисколько не коробит. всякое случается
                в жизни, было такое со мной: ну не пойду я говорить, мол, не ругай
                её, я жанюсь на ней. но и не сидел за тонкой стенкой и не сокрушался
                - было пофигу, но всё-таки неудобно как-то.

                А так ли важно о чём содержание песни??? <b>Для меня</b> много важней
                музыка, звук, владение инструментом и голосом и т.д. В этом смысле
                Strong Persuader ОЧЕНЬ интересен! мне только не нравятся там барабаны,
                ну и ляд с ними... А текст второстепенен (если не третьестепенен).

                По мне это очень заслуженно что это альбом есть в этом списке, но
                меня коробит что он ниже Гари Мора и Лонни Мака.

                Я вот никогда не слышал его 1983г. Только пару песен оттуда. Может
                кто выложит ссылку на скачивание этого альбома.'
