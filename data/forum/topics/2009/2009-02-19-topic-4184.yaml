        deleted: false
        text: 'Я бы крея вообще выкинул, как неоправдавшего надежды. Он хорош в редких
          случаях, как сайдмен у настоящих блюзменов.

          Still Got The Blues For You - Gary Moore - эту уступка вкусам слишком широкой
          публики. Хотя даже он лучше слюнявого Роберта Крея. (От его песни "It''s
          Becouse Of Me" меня конкретно тошнит. там такое содержание - Роберт Крэй
          трахнул свою соседку по лестничной площадке, и теперь сидит дома, слушает
          через стенку, как ругается сосед с оттраханной соседкой. И. мля, столько
          страдания в этом It''s Becouse Of Me!)

          Ну а в достоинстквах Strike Like Lightning я абсолютно уверен!'
