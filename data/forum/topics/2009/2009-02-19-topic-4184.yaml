          deleted: false
          text: "Помню, когда Роберт Крей переехал в мой родной край (Сан Франсиско-Оклэнд),\
            \ как еще малоизвестный артист в начале 1980-ых г. Его музыка, и особенно\
            \ его гитарная игра, звучала, как очень нужный свежий воздух в блюзе.\
            \  Появился еще один уникальный блюзовый голос, сильно похожий не на кого.\
            \  Примерно в такое же время пришел Stevie Ray Vaughan c похожим эффектом.\
            \  Мы стали по-настоящему верить в будущее блюза.  Я согласен, что Край\
            \ уже 20 лет разочаровывает - вдохновение куда-то ушло.  Но нет сомнения\
            \ у меня, что Край - настоящий блюзмен в полном смысле слова.   \n\nMuddy"
