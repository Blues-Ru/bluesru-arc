      text: "Кроме того, что ранних артистов не представлены, список более и менее\
        \ сопоставим с распостраненными оценками экспертов - за любопытным исключением\
        \ выбора альбомов Muddy Waters.   Мне нравятся Fathers and Sons и Can't Get\
        \ No Grindin,' но они далеко не лучшие диски Muddy Waters.  И мало экспертов\
        \ бы их предложили в таком качестве.  С одной стороны можно оправдать выбор\
        \ тем, что более ранние пластинки Muddy Waters являются лишь сборниками бывших\
        \ 78 и 45 (Я бы все равно выбрал другие). Но выбирают именно такие диски для\
        \ Elmore James, Howlin' Wolf, Sonny Boy Williamson, Robert Johnson, и т.д.\
        \  И если разрешить такие сборники, то не стоит исключать артистов 20-ых и\
        \ 30-ых годов кроме Robert Johnson.  \n\nMuddy"
