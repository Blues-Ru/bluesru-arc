      text: 'видать хороший список, жаль что многого я не слышал.

        смутило это:

        79. Strike Like Lightning - Lonnie Mack & Stevie Ray Vaughan

        80. Still Got The Blues For You - Gary Moore

        81. Strong Persuader - Robert Cray

        Strike Like Lightning малоинтересный альбом (IMHO), а Р.Крея я бы и повыше
        поставил бы, как минимум выше рокера Мора.'
