  text: 'Выигравшие билеты на  концерт Тынсли Эллиса


    Вам нужно за 40 минут до концерта подойти к входу в камерный зал Дома музыки (это
    ровно на этаж ниже входа в большой Светлановский зал (где и состоится концерт).
