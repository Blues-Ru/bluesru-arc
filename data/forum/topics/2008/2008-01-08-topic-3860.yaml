    text: В страте, кроме дерева еще и бывает разная выборка под звукосниматели. "Правильная выборка" - т.е. минимальная,
      и точно по форме и размеру звукоснимателей и проводов встречалась только на старых стратах времен Лео Фендера. Разные
      заводы и модификации делали дырку больше или меньше, вплоть до выборки целого корыта. Ну, плюс скос под правую ругу
      у всех разный, делали его вручную, и у "плохих" стратов он меньше. материалы корпуса, грифа, анкера - да блин, двух
      одинаковых стратов то не найти наверное :-)
