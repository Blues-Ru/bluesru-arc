  text: 'Есть вопросы по гитаре, поможете прояснить их?

    - как влияет вес гитары на её звук? очевидно, вес гитары, в первую очередь, зависит от дерева из которого она сделана?
    какое дерево лучше? я проверил 4 гитары и у всех разный вес:

    Fender Stratocaster (США) 4,5 кг

    Fender Stratocaster (Мексика) 5,0 кг

    Squier Stratocaster (Корея) 6,0 кг

    Squier Stratocaster (Япония) 7,0 кг

    на вид они все достаточно похожи. очень похожи. но почему же такая (большая) разница?

    - рычаг машинки. перед тем как положить гитару в чехол, мой товарищ не снимает рычажок, а я всегда снимаю дабы не повредить
    машинку (она у нас обычная, стандартная, не флойд роуз). как вы считаете, нужно ли его снимать?'
