  text: "Компания \"Спидола\", Федерация танцев в стиле свинг (ФТСС), Горбушкин Двор,\n\
    \  телеканал \"О2ТВ\", при поддержке интернет-сайта www.rockabillyswing.ru, www.gorbushkin.ru,\
    \ \nпредставляют танцевально-музыкальный фестиваль\nСвинговый Бум\n31 августа,\
    \ воскресенье, летняя сцена \"Горбушкиного Двора\", Багратионовский пр., д.7.\n\
    Начало в 14:00, вход свободный\n     В рамках фестиваля состоится:\n         \
    \     Презентация альбома оркестра ПИЖОНЫ «От саксофона до ножа» (Экстрафон, 2008).\n\
    мастер-класс по буги-вуги дадут чемпионы России В. Ишимов и К. Семенихина. \n\
    шоу студии «Танцкласс». \nработает парикмахер, делающий стильные прически и бутик\
    \ винтажной одежды.\n\nПредварительная программа:\nПИЖОНЫ (экс-МИСТЕР ТВИСТЕР,\
    \ буги/свинг/латина) \nJUMPING CATS (джамп-блюз/свинг) \nЛекс (Блохин) и КОМАНДА\
    \ (буги/ска) \nJAZZ DANCE ORCHESTRA (джаз)\nBLUES PARTY (римт-н-блюз)\nHULA HOOP\
    \ (сёрф)\nВ программе возможны изменения в сторону увеличения числа коллективов\n\
    \n                         при участии студии «Танцкласс»"
