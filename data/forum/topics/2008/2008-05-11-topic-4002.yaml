        text: Очень не хватает мнения интересных людей. Эта музыка написана вся в
          течении прошлого месяца и требует еще огромного труда чтобы довести до той
          планки, которую музыканты сами себе поставили. Это все авторское(Сергей
          Курек) и автор раздосадован, что не справился пока на 100% с творческой
          задачей. Вообще то, хотелось создать блюз на грувах для малого состава,
          но не заезженый и подражающий. Грувы,темы и приблизительные структуры постепенно
          выкристализовываются, но Сергей сейчас считает, что произошел сильный уход
          от класического блюзового колорита.  Надеемся, что через месяц когда все
          будет четко и плавно сыграно, сможем записать и представить на суд слушателей
          выполненую задачу. По сравнению с прошлым материалом (Кавера подражающие
          Хукеру, SRV и др) в новом слишком большое отклонение от блюза(в мучительном
          поиске своего музыкального языка). Решили соблюдать осторожность и не скатится
          в какой-нибудь пошлый массовый смусь-джаз. Еще раз спасибо за коментарий,
          так как творческий поиск иногда вводит в такие моменты депресии, что хочется
          просто выпрыгнуть в окно.
