  text: 'В аннотации к альбому Greatest Hits рассказывается о записи Стиви Рэй Воэном битловской песни Taxman.

    Хотелось бы узнать, а что то был за проект с записями песен Битлз? Кто были остальные артисты которые приняли участие в этом проекте? Был ли он выпущен? Когда это было? Ну, в общем, хочется побольше узнать об этом проекте... Может кто знает об этом?

    <i>The one previously unreleased track of this collection is of all things. George Harrison''s original from The Beatles’ Revolver LP. “Taxman”, which was never actually slated to be part Double Trouble album but was recorded for a separate project that was never realized. The session, just outside of Austin, marked the first time Stevie had entered a studio since getting clean and sober, and he delivered one of his most animated vocal performances.

    Chris: Michael Jackson owned the publishing on The Beatles catalog, and he was going to do some kind of animated feature, so someone at Epic suggested we do a Beatles song.

    Reese: I think ten different Beatles songs were picked, and ten different artists to do them, and that''s the one we drew. I don''t think we picked that: I think someone asked if we wanted to do it. We finally ended up completely turning the attitude of the song around and having a pretty good time with it. We were happy that it was something we could not only do justice to, but do it in our own way. I think we were all creatively satisfied with what we did on it.

    Chris: His singing and playing came from kind of a spirited emulation of his musical heroes. So this was kind of Howlin’ Wolf Sings The Beatles - as starting point - as opposed to just coming up with abstract characters.</i>'
