      text: 'Слишком сгущаете краски. Прежде всего, зал был на 70-75% заполнен. После перерыва (загадочно исчезли Воронов и Макаревич:-) осталось не меньше 2/3 от первоначального числа. Так что все нормально. Насчет звука. Профессионально я занимаюсь другим, но качественный звук люблю. Соглашусь с вами: гитара Криса звучала недостаточно четко и зачастую терялась в ударных и басе (по крайне мере так было в амфитеатре, где и был ваш покорный слуга).'
