  text: 'В связи с только что прошедшим днём рождения Кэптэна (15 января) вот здесь
    - /beefheart/sounds.htm#now - выложены некоторые фрагменты его
    официально изданых концертных выступлений ("London 1974", "I''m Going To Do What
    I Wanna Do (Live At My Father''s Place 1978)" и "Amsterdam ''80"). Кач-во весьма
    скромненькое, но может кому-то будет любопытно. На вс. случай - если кого заинтересует
    последний концерт ("Амстердам") - то он есть целиком (и в более высоком битрейте)
    вот тут: http://ifolder.ru/4935614'
