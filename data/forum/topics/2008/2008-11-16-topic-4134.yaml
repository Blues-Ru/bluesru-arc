    subject: В субботу в Roadhouse
    deleted: false
    text: 'Я сейчас приехал с концерта тоже с очень хорошими впечатлениями. T-Leino косит под William Clarke музыкально и внешним видом, мне понравилась его гармоника, еще в большем восторге я остался от его гитары, на которой он играл во втором отделении. Постоянный гитарист в группе - тоже большой молодец со вкусом. А Дима К., которого вытащили на джем, с хорошей группой, хорошую песню на хорошей гитаре - вообще доставил кучу удовольствия.

      На мой личный взгляд и вкус, концерт был гораздо интересней, чем год назад, когда группа подыгрывала американскому Стиву Гайгеру...'
