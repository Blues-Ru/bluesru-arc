  text: "Когда днём, посреди очередного рассёра с будущей бывшей женой, слышишь сигнал\
    \ СМСки, всегда внутри надеешься, что это либо какая-то шуточка от приятеля, или\
    \ смайлик от боевой подруги..  но никак не то, что пришлось прочитать.. как удар\
    \ клюшкой по затылку в хоккейной «куче-мале» в детстве – два слова: «Свет погиб»…\
    \ Ослепляющее чувство беспомощности, слова о неисповедимых Путях Господних… и\
    \ все мысли только о человеке, которого больше ты никогда не увидишь и не услышишь\
    \ …\n      \nПоложа руку на сердце, ни с одним другим коллективом, кроме как со\
    \ Светом и его друзьями, мы не работали так тесно, что называется «рука об руку»,\
    \ несмотря на почтенное расстояние (Минск – Владимир),  государственные границы,\
    \ и наверное, как многие узрят, диаметрально противоположный взгляд на рок-н-ролл\
    \ и блюз – Музыку, которой жил Свет и в которую верил… Последнее время, в разговорах\
    \ с ним его довольно сильно запаривал наш (и в общем-то его) уход от блюза. У\
    \ меня до сих пор в ушах стоит его «Брат, а как же Блюз? А как же Блюз?»,  сказанные\
    \ после нашего очередного концерта в B.B.King.. Свет мне тогда показался очень\
    \ запаренным, но не смотря на какие-то проблемы с дамами сердца, финансовыми траблами\
    \ и прочей бытовой неустроицей, он видел выход только в Музыке:  «Надо играть,\
    \ чувак!» - неустанно повторял он, в ответ на мои увещевания найти какую-то отвлеченную\
    \ от музыки работу, периодически варьировать круг общения с музыкального на немузыкальный,\
    \ ну или просто записаться в спортзал, и поберечь себя, не гореть так уж неистово…\n\
    \    \nСвет – эталонный блюзмен, думавший только о девках и музыке, что называется\
    \ - burned up stages своим особенным способом - делал это красиво и элегантно,\
    \ но при этом отмороженно весело! До сих пор помню такой огонь в глазах у девчонок,\
    \ смотрящих на него ночью на Пустых Холмах 2007,  честно сказать – до сих пор\
    \ завидно! Не смотря на всю его внутреннюю интеллегентность, именно Свет стал\
    \ продюсером наших двух «неинтеллегентных» альбомов, координировал процессы записи,\
    \ помогал нам с жильём в Минске, с поиском сессионных музыкантов, пел партии бэк-вокала,\
    \ играл в некоторых песнях на фортепиано, привёл RnB королеву - мулатку Алию с\
    \ татуировкой на попе, для участия в Peace in the Valley …Ах!!! Да что тут говорить\
    \ – во всём блакмайлеровском беспросветном свиноблюзе навсегда теперь есть лучик\
    \ Света. \n    \nПоследний раз Свет с ребятами нас несказанно выручили пару недель\
    \ назад на дне города в Калуге, когда мы играли очередной совместный концерт.\
    \ Блакмайлерс тогда  задержался на своё выступление на два с лишним часа, простояв\
    \ в традиционной пятничной пробке на выезде из Москвы… Всё это время Svet Boogie\
    \ Band удерживали многотысячную площадь на волне праздничного веселья и его, фирменного\
    \ световского, грува… Он даже какой-то там конкурс песенный устроил «А кто из\
    \ зрителей может спеть блюз?» - на что на сцену откуда то вышло несколько«!» француженок,\
    \ которые тут же начали петь. Ну настоящий, как говорит наш казахский друг Борат\
    \ Сагдиев, «бабий магнит»!\n    \nВчера, отправляясь к нему на похороны, я думал:\
    \ «а хочет ли того Свет?» Что б мы отменили моё выступление тут во Владимире,\
    \ наш совместный концерт с Вовкой Русиновым во второник в Доме у Дороги? В общем,\
    \ не знаю.. НО мой фольксваген, с которым редко что-то происходит, на выезде из\
    \ Владимира ни с того ни с сего изошёлся такой тосольной истерикой, выплеснув\
    \ через печку в салон весь запас кипящей охлаждающей жидкости, что ехать куда-то\
    \ за почти 1000 км не представлялось возможным… Мистика какая -то..  Видимо и\
    \ правда: «Надо играть, чувак!»…\n    \nСегодня Света проводили в последний путь.\
    \ Пока мы не знаем всех точных подробностей его ухода, но так ли это важно? По\
    \ моему, гораздо важнее  подробности его пути. Я искренне верю, что там, где он\
    \ сейчас, есть старенький белый Хаммонд и пара темнокожих ангелов, поющих Swing\
    \ Low Sweet Chariot, и есть дом у дороги среди серебряных облаков, куда праведники\
    \ заходят пропустить пару стаканчиков кагора под хорошую музыку…\nУдачно тебе\
    \ отыграть, Свет.\n\n\nТимофей. BLACKMAILERS\n14.09.2008\n\n\nP.S.\n\nI want to\
    \ wear the crown of glory\nWhen I get home to that bright land\nI want to shout\
    \ salvation's glory\nIn concert with the blood washed band\n\nI'm going there\
    \ to meet my savior\nTo sing his praise forever more\nI'm just going over Jordan"
