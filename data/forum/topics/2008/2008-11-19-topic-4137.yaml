      text: "Да в магазинах есть гитары, но на них просто смешно смотреть и плакать хочется, как будто зашел в Детский мир, и ребенку игрушку присматриваю, а есть и дорогие типа настоящий Страт или телекастер, лежит один в магазине , я спросил по чем, а мне ответили 1.650.000 сум, это типа 110 или 120 минимальных окладов, гдето 1200 или 1300 зелени,\nА сегодня был в магазине, продавец наверно покупателей никогда не видел, разговаривал так как будто я пришел унего милостыню просить, и когда спросил, есть ли у него кроме тех трех одинаковых стратов, еще что нибудь на выбор, он ответил, что я как будто бы пришел гитарную лавку открывать или мне нужно целый гитарный полк открыть, типа у нас и так такой ОГРОМНЫЙ ВЫБОР, и гордо поднял голову, короче говоря купил я у него последнюю пачку струн, более менее нормального качества и ушел восвояси. А нужно мне было совсем другое , иская я трости для саксофона, кстати если есть у кого возможность помочь с этим, ПОМОГИТЕ,...Здесь тростей наверно не видели лет двести, один местный продавец долго не мог раслашать и понять что такое трость для саксофона, так что давайте не бросайте меня в беде , сломал я последнюю трость случайно, вот и мыкаюсь...\nА еще прикол, зашел в магазин и прошу струны на гитару 10 или 9 номер, и продавец долго и тупо не может понять зачем я такой дотошный , еще номер какой то требую, какая разница, и что такое номер, он от меня узнал, что у струн есть номера, и не мог никак понять как номер влияет на игру и звучание гитары, я просто указал пальцем что мне нужно и быстро убежал от ЭТОГО ТУПИЗМА (простите)... \nВот и вылил, полдня потратил по походам в муз магазины СТОЛИЦЫ, БЛИН, все это сегодня было, честное слово, кто не верит...\nА потом пошел к местным гитарным \"мафиозо\", те что завозят сюда почти все продукцию в Ташкент, и занимаются реставрацией, и у которых полгорода снабжается, но они сказали только после Нового Года((((, вот буду сидеть и ждать((((\n\nА напоследок еще раз, если кто может помочь с тростями????? ПОМОГИТЕ!!!!\n\nБедолага Алексей....."
