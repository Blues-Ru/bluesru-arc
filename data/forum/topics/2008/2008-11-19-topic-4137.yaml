    text: 'В таком крупном и в меру цивильном городе как Ташкент должны быть музыкальные магазины в котором продаются как минимум гитары из юго-восточной Азии. Там можно и заказать ту марку и модель гитары что тебе нужна. Да и в городе наверняка есть у людей инструменты... Или тогда надо просто заказывать что бы привезли из-за кордона (например, из Москвы).

      Я сам живу в Ашхабаде (типо, соседи) и все мои знакомые и я тоже, заказывали что бы привезли. как правило это из Москвы.'
