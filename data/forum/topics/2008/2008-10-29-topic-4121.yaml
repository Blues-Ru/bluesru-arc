  text: "Уважаемые музыканты, исполняющие блюз, дорогие друзья, поклонники блюзовой музыки, приглашаю вас на блюзовые вечера, которые пройдут 28 и 29 ноября (пт, сб) в клубе \"Мастер и Фагот\".\nДа, это тот самый клуб, где, при полном зале, 25 октября с блеском прошел \"Бесконечный вечер бархатного блюза\"! Спасибо группам Wild Traffic, The Bible, Дед Пыхто, Iterum, Blues n' Road! Буду бесконечно рад видет вас снова.\n\n Почему концерт разбит на два дня? Объясню. На этот раз мы решили сделать 2 вечера подряд: для групп, которые играют исконно американский блюз - этот концерт пройдет 28 ноября; и для групп, которые исполняют авторский блюз на русском языке - этот концерт состоится 29 ноября. \n\n28 ноября концерт начнется в 7 вечера, 29 - в 6. (вызвано тем, что по будням клуб работает, как ресторан)\nЗаканчиваются концерты в 11 вечера.\n\nУсловия:\n\n-Каждой группе дается по 40 - 50 минут чистого времени (без учета настройки);\n-Мероприятние рекламируется: на официальном сайте клуба www.masterifagot.ru, на сайтах www.club.ru, www.restoran.ru, www.musicforums.ru, создается событие www.vkontakte.ru, готовится пресс-релиз в интернет газете www.gazeta-ov.ru. На сайте www.club.ru запускается постоянны баннер в правой нижней части сайта, а реклама события постоянно находится на главной странице;\n-На протяжении всего концерта работает приглашенный звукорежиссер;\n-Группы объявляет ведущий;\n-Фотоотчет с концерта выкладывается на официальном сайте клуба;\n-На концертах будут присутствовать 2 представителя прессы;\n-В зависимости от количества людей, пришедших на группы (определяется по флаерам, которые группы делают сами), музыканты получают вознаграждения (более 25 человек - 25%, более 30 человек - 40%);\n-желательно привести человек по 15 зрителей каждой группе.\n\nСтоимость входа не изменилась: 200р. по флаеру, 250р. без него.\n\nОфициальный сайт клуба: www.masterifagot.ru\n\nПишите сюда или на электронку: lukash_shaw@mail.ru\nЗвоните: 8-905-729-74-83"
