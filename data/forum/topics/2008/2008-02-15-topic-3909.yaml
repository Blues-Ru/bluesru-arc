    subject: почему же?
    deleted: false
    text: "Я ей сделал отличный пиар:\nтупейшай татуировка, сама наркоманка, муж в тюряге... то, что надо! если бы я еще написал, что у нее имидж \"обединяет лучшее от эмо и готик\" - то армия поклонников ее могла бы, взявшись за руки, выстроить цепочку от Земли до Венеры. \nЧто касается ее голоса и репертуара - тут мнения наши, Миша, \"сильно разняться\" (как сказал бы классик). Но объективной оценки в музыке не бывает. Я видел толпы баб в возрасте от 8 лет до 50 - все рыдали под песню \"белые розы\". думаю, они испытывали эмоциональные переживания посильнее, чем ты от Ами-Винодельни... и сказали бы они тебе хором именно в твоих выражениях, которые невозможно оспорить: \"Ласковый май\" - клевые и крутые, у них суперский голос, отличные песни и вообще музыка очень хорошая и настоящая.\" ГЫГЫГЫГЫ... \n\nИ еще - в ближайший год нам мозги будут компостировать рассказами о ее неорбыкновенном таланте и трудной судьбе. так что позволь уж насрать в букет гартензий... они, видишь ли, бумажные..."
