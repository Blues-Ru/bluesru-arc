              text: "где явно указываешь на свое более глубокое понимание музыки... это главный и решающий аргумент. \n\nтакие странные темы.. вроде я вот так живу - слушаю тысячи разных дисков, разной музыки... слушаю, читаю, снимаю от старых атлатнтик рекдорз до лейбла тсадик ... а потом бац - мне говорят - чувак ты не знаток :) ну хорошо я не знаток.... я не знаю как быть знатоком и мне можно сказать что я ничего не понимаю :))) потому что я не буду с этим спорить. \n\nЯ люблю музыку за те ощущения что она мне дает,  я не буду спорить с аргументами про ощущения девочек на концерте группы \"корни\". Понятное дело - если я скажу - меня проперла музыка (любая), всегда можно сказать \"да девочек на коцертах группы корни прет\"... видимо другое дело, когда к музыке подходят со знанием дела... видимо нет блин у меня этого знания дела... и что это такое - я тоже не понимаю. Я просто люблю музыку? Можно я хотя бы теперь пойду жрать кактусы с чистой совестью? :))))))"
