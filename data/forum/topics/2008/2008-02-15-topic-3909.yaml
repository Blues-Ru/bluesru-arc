                text: "в нашей стране это запрещено законом. \nПросто происходит нечто удивительное. \nЯ тебе говорю, что мне есть, с чем сравнивать сравнивать молодую даму. А ты мне указываешь на мое чванство. Сам тут же пишешь, что слушаешь тысячи дисков. А я давно уже не слушаю тысячи дисков. мне теперь заткнуться навсегда из почтения к такому продвинутому меломану? Так мне следует воспринимать твои слова?\n--- Минуточку. вов.... ты опять прочел \"не вникая\"? ты хотя бы вопросительные знаки увидел? или опять вместо них у тебя в глазах восклицательные?---\nМузыка - самое абстрактное из искусств. Как ее понимать - это каждый решает для себя. \nДля тебя 5 грэмми у ванхауз - признание ее неоспоримых достоинств. И ты видишь только мое желание их оспорить, когда я пишу, что 5 Грэмми у вайнхауз - признание некомпетентности Грэмми. но почему тебе свое мнение позволено высказывать, а мне мое - нельзя? потому что я \"явно указываешь на свое более глубокое понимание музыки... это главный и решающий аргумент\". Где я указываю? где я сказал, что понимаю музыку лучше, чем ты? да ее понимает каждый кто как хочет, и правильно делает! Это ты мне указываешь, что я не слушаюсь дона хуана и закрыл двери восприятия нового... Только в твоей ваунхаз все новое - это слегка подкрашенное старое. И не в лучшем исполнении. И не надо заниматься психоанализом моих текстов. Ты думаешь так, я - иначе. разошлись. \nобъясняю на конкретном примере:\nРусинов: меня прет неподецки!\nЕвдокимов: меня не вставляет ни разу...\nконец дискуссии! \nчто ты меня обвиняешь в претензиях на диктаторские полномочия? чтобы никого не задеть, я должен молчать в тряпочку? у тебя комплексы? и я должен быть особенно деликатен с тобой? Мне просто остонадоело, что я пишу про имярека, а отвечают мне анализом моей психики, моего характера и моей личной жизни. Других аргументов у защиты нет, остается только доказывать мою недееспособность?\n----\nвторое пример еще более конкретен. Твоя фраза: \"ну я пошел жрать кактусы....... :))))))) кстати кактусы это - искусственные стимуляторы? :)))))))\"\nгде здесь отражение моего \"лучшего понимания музыки\"? Ты ехидно ответил на один мой абзац в котором ни слова о музыке и не было! \nНЕ посылал я тебя есть кактусы - я сам собирался их \"жрать\". Кроме того, там четко указано, что искуственные стимуляторы - на Альбионе, а не в мексиканских кактусах...\nТы все перепутал, не замечаешь?\nу меня такое впечатление, что пишу я одно, а ты читаешь что-то такое, что уже сидит у тебя в мозгах готовым вердиктом на все, что бы я не написал. Вот поэтому ты и не хочешь вчитываться - тебе уже все ясно. Вот поэтому доброжелательная, но сдержанная рейцензия на сербов (с указанием нескольких конкретных минусов) становится в твоей восприятии \"восторженной\". \nНе ешь кактусы - они уведут тебя еще дальше от реальности."
