        deleted: false
        text: "Я и не предлагал ее не слушать.\n...дальше потребуется чувство юмора для адекватного восприятия...\nВселенского ничего не зрю. Отклики на мой ехидный пост уже поступают окольными путями. Поддержка от Kot Matraskin – пока единственная. Для меня она существенно важнее, чем ваше обвинение меня в неумении писать рецензии. \nчувство блюза, вещь, конечно, спорная и проштампованная. А играл ровно или неровно – это можно и измерить. Хотя, если вчитаться во фразу \"играл ровно, с хорошим чувством блюза\", и попытаться понять рецензента, то комплимент получается не слишком восторженный, а? Вам не приходило в голову, что это то самое, что древние называли Sapienti sat.\nНо \"она клевая и крутая, у неё суперский голос, отличные песни и вообще музыка очень хорошая и настоящая.\" – такая формулировка применима к любой лабуде. Думаю, для оценки масштаба явления знание предыстории оного было бы полезней, чем выискивание грешков у оппонента. На фоне того, что я слушал из истории «американских стандартов», достижения Ами выглядят очень скромно. И стилизация хромает, и новизна только в мелких деталях. Вот и все, что я хотел сказать. Для вас эти песни отличные, для меня – посредственные в том стилистическом ряду, на который они претендуют. Вот и все. И не надо запрашивать мой аттестат зрелости – он давно потерялся при переездах.\nчестно говоря, я не собирался готовить петицию с требованием отобрать у больного человека все ее пять Грэмми.: ) Так что и тревожиться не о чем.\nИ не стоит боятся, что теперь никто не захочет слушать тетку в картинках. Все то очевидное, что я перечислил, является отличным завлекаловом для «шырокой публики» - я это, впрочем, уже говорил. До музыки мало кому есть дело. Как коммерческий проект – вполне прибыльное мероприятие, жаль, я акций не прикупил – жил бы в Сочи. Как творческий проект – это эпигоны в поисках десятки. \nМеня ведь не Эми интересовала, а то, как Грэмми не устают терять профессиональный авторитет.\n(в попытках указать мне мое место под солнцем г-н Русинов проявил больше выдумки. Меня он обвинил в том, что я не следую заветам Дона Хуана, и именно потому не могу оценить масштабность Вайнярдовны. Чакры у меня позакрывались, что ли? Г-н Русинов, вам не кажется, что следуя заветам указанного дона, я бы темными мексиканскими ночами жрал бы сушеные кактусы, а потом разговаривал бы с небесным кайотом? И обдолбанные искусственными стимуляторами бледные тетки из суицидального Альбиона меня бы нисколько не волновали.) \nЖду обвинений меня в том, что я просто завидую и т.д., поскольку сам из себя ничего не представляю, и обругать настоящий талант – это единственное радость в моей никчемной жизни. Велком. Я хотя бы оттягивался на пятикратной грэмминосице. А вы – на человеке, никакими наградами не отмеченном. Ощущаетесь разность масштаба? )))"
