      text: "Я же просто всем предложил послушать :) а тут такой космический отпор... прямо таки планетарного масштаба, да еще и с ласковым маем на орбите. Воистину, лучшая защита мозга от компостирования.  \n<br>\np.s.  Неоспоримыми выражениями постараюсь впредь не пользоваться, буду писать \"играл ровно, с хорошим чувством блюза\" и т.д. ;-)"
