  deleted: false
  text: "Новость от 14.02.08 (http://blues.ru/news/?p=200802#386) определенно порадовала :) особенно про главную номинантку Amy Winehouse.\n\nНет, конечно, понятно, что не надо ничего курить и нюхать... но мне кажется, что после таких пассажей многие даже не попробуют послушать собственно альбом Эми... а ведь она клевая и крутая, у неё суперский голос, отличные песни и вообще музыка очень хорошая и настоящая. \n\nЛюбителям старой музыки точно должно прийтись по душе... несмотря на очевидные факты снимания штанов на концертах и обладания некрасивых татуировок."
  replies:
