      deleted: false
      text: "А.\nулица жестянок (скорее, консервов, чем кастрюль) - местечко в Нью-Йорке, где к началу ХХ века сосредоточились\
        \ поп-композиторы и издатели нот популярных песен. К примеру, начало карьеры Джорджа Гершвина прямо связано с этим\
        \ районом. tin pan alley была символом коммерческой музыки в начале, а не в середине века. А к 60-м от нее уже ничего\
        \ не осталось. \n\nБ.\nчто касается песни tin pan alley - она совсем о другом. \"Бульвар жестянок\" - примерьте это\
        \ название к старой Одессе, и станет понятно, о чем речь. \n\nВ.\nАвторство этой песни много разы пытались установить\
        \ в форуме на блюз-ре.\n\nГ.\nРоберт Геддинс часто указывается автором. Но он был в большей степени продюсером, чем\
        \ не музыкантом. В те времена продюсер записи частенько записывал себя в соавторы песни для получения авторских отчислений.\
        \ За Геддинсом числиться не мало отличных песен, ни одну из которых он не записал как исполнитель. Думайте сами...\n\
        \nД.\nБлюзовые архивариусы чаще всего называют автором песни пианиста Куртиса Джонса. И, вероятно, вот здесь <a href=\"\
        http://www.allmusic.com/cg/amg.dll?p=amg&token=ADFEAEE47F1ADB47AE7520C1843B4BC2BD7EFD1FFE41F69B1B330447C9A934499C1D62EF0ECC95CFAEFB71AB7BAFFF26E85305D0C9E453F4CC1740&sql=10:dnfixqtjldke\"\
        \ target=_blank\">http://www.allmusic.com/cg/amg.dll?p=amg&token=ADFEAEE47F1ADB47AE7520C1843B4BC2BD7EFD1FFE41F69B1B330447C9A934499C1D62EF0ECC95CFAEFB71AB7BAFFF26E85305D0C9E453F4CC1740&sql=10:dnfixqtjldke</a>\
        \ можно найти ее первоначальную запись, к которой Геддинс не имел отношения вообще: текст сильно отличается, но мелодия\
        \ и ключевые слова на мелодических \"крючках\" - те самые. К.Джонс проживал в Чикаго, вероятно, Tin Pan Alley был\
        \ стремным райончиком в Чикаго, егде жила его \"бейби\". Хотя бултварчик с таким названием мог быть и в любом другом\
        \ городе.\n\nДжимми Рида, как автора, первым указал SRV. Почему он это сделал, спросить уже не у кого. Мне неизвестна\
        \ ни одна запись, где бы Рид исполнял ее. Скорее всего, песня была в концертном репертуаре многих артистов, а о Куртисе\
        \ Джонсе уже забыли."
