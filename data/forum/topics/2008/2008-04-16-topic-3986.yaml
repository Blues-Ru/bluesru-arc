  text: "Уважаемый Андрей Евдокимов! \nза рулём авто, в котором ехали Кокрэйн (Кочрэйн, Кохрейн, как хотите), Винсент и Шили\
    \ - сидел молодой водитель по имени/фамилии Джордж Мартин (бывают в жизни и такие совпадения). Трое пассажиров сидели\
    \ на заднем сидении, Винсент и Шили - по бокам, Кокрейн - посредине. Именно поэтому во время многочисленных ударов авто\
    \ о заграждения и столбы - Винсент и Шили поударялись о передние сиденья и двери и отделались сильными ушибами и переломом\
    \ (Винсент), а Кокрейн вылетел между передних кресел и далее - через стекло. Ну, и потом - ещё катился по дороге, доломал\
    \ всё, что оставалось целым. \n\nс уважением, Андрей."
