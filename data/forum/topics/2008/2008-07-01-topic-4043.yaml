  text: 'Нашёл заметку о новом ресторане.. рыдал и плакал, начиная с заголовка...


    Отведайте с любимой «Вкус блюза»


    Послезавтра - 8 марта, всемирный женский праздник. Отпраздновать его вдвоем с Любимой можно по-разному: можно сходить
    в клуб, театр или кино, провести ночь в гостинице в Сочи, но если вы вдвоем обожаете джаз или блюз, то можно пригласить
    ее в стильный и недорогой ресторан.

    Рядом с гостиницей "Метрополь", по соседству с баром "Старая башня" расположился ресторан "Вкус блюза".

    Название говорит само за себя: несколько раз в неделю здесь можно услышать настоящий джаз, блюз и фокстрот в исполнении
    лучших музыкантов Москвы. Из окон ресторана открывается по-настоящему великолепный вид на Большой театр и Театральную
    площадь.


    В меню присутствуют блюда русской, европейской и французской кухни. Особого внимания заслуживают блюда, которые повар
    приготовит в Вашем присутствии: фондю (подается на огне с поджигом), фламбе (блюдо готовится прямо на столе, на открытом
    огне).

    Кроме того, в ресторане действует сигарный клуб. Постоянным посетителям предоставляется возможность хранить свои сигары
    тут же, на специально отведенной полочке.


    =====


    Срочно иду разучивать фокстрот...'
