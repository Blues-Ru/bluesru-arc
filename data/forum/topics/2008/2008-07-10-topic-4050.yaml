                                text: "1) То, что великие блюзмены грешные, как все - это абсолютно точно.  Никто здесь не выступает, что иначе. \n2) Все-таки народномузыкальная сторона блюза заставляет серьезно подумать, прежде чем обвинить артистов в воростве песен.  Если ты блюзовый музыакант, то ожидается от тебя большой запас известных песен.  Про авторство песен многие блюзмены думали очень мало.  Может быть это неправильно, но в большинстве случаев я бы это не назвал умышленным преступлением.\n3) Большие скадналы вокруг Эеплена, Крима, и других рокеров возникли не потому, что данные артисты белые, а потому что денег было много.  Эстес бы получил лишь копейки от признание авторства со стороны Фреда Макдоула. Однако когда рокеры стали зарабатывать миллионы за счет песен и музыки, вязтых у блюзменов, живущих в основонм в бедноте, ествественно стали возмущаться, что первоисточники тоже заслужены получить какую-то долю.  \n\nMuddy"
