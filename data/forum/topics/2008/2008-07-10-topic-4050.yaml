    text: "Обычно в разные времена в музыкальных тусовках в воздухе носится какая-нибудь мелодия, которую все играют и записывают, не очень задумываясь об авторстве. \nМне кажется, что Manhole vs Frog Hop - как раз такой случай.\nHideaway, как отмечают некоторые критики - очень грамотная компиляция из модных на конец 50-х - начало 60-х годов гитарных ликов, включая тему Peter Gunn by Henry Manchini, т.е. натаскано отовсюду понемножку.\nТелевизионная версия сериала про частного сыщика Peter Gunn как раз шла в 1957-60 гг.\nСсылки на Hound Dog Taylor как автора начальной фразы Hideaway встречаются часто, но надо внимательно послушать его записи, чтобы понять, мог ли он в принципе сочинить эту тему. Вообще-то, большая часть его тем и фраз похожа скорее на Elmore James, в ещё более прямолинейном варианте. А фраза b-c#-e-g# (V-VI-I-III) начинала десятки фраз разных гитаристов того времени."
