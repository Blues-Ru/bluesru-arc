    text: 'Одна и та же, конечно.  Происхождение таких рифов и песен иногда трудно установить в блюзе.  Например мы все привыкли считать, что Hideaway принадлежит Freddie King.  Но в Чикаго некоторые музыканты клянутся, что он взял риф и общий подход у Hound Dog Taylor, который ее никогда не записывал.


