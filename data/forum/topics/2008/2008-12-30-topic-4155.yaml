    subject: Blues on Moscow scene
    deleted: false
    text: 'Это первое официальное издание на видео трех московских блюзовых составов
      и белорусской группы, руководимой ныне покойным Святославом "Светом" Ходановичем.
      У белорусов это практически первое записанное видео, по крайней мере в Москве.
      Аграновский и Каверкин со своими музыкантами играют совместный концерт с приглашенными
      сербскими гостями - Пера Джо (гармоника) и Владан Станошевич (слайд-гитара.
      Четвертый диск - это запись двух выступлений Петровича в Москве (на фестивале
      губной гармошки с Bluesmakers и в клубе БиБиКинг с HotRodBand).

      Общая длительность программы - более 3 часов.

      Съемка - ЛюК Видео, Звук - КМ Студия, Издатель - Мастертейп.

      Тираж очень маленький - 500 штук.

      При наличии спроса возможен повторный тираж, но это маловероятно.'
