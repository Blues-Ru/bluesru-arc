  deleted: false
  text: "Я сегодня был на концерте моего приятеля Йоакима в Мьюзик Тауне с группой Вовы Русинова, получил немало удовольствия. Это редкий и приятный случай, когда солист не пытается быть гитарным героем, и очень хорошо поет. Благодаря этому удалось послушать много разных песен, в основном, блюзовая классика - T-Bone Walker, B.B.King, Jimmy Rogers, Bobby Bland, Freddie King. Сыграно не как на джеме, а очень четко, аранжированно и эмоционально, со всеми нужными акцентами. \n\nЙоаким играет на гитаре пальцами, сдержанно и отчасти скромно, но выразительно. Поет несдержанно. Еще он сказал, что старается не вставлять длинных соло, чтобы успеть сыграть больше разных красивых песен и грувов."
