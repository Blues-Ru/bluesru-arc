    subject: по теме "блюз в Киеве"
    deleted: false
    text: "12 октября в воскресенье в Бочке на Хмельницкого (2-й этаж) состоится блюзовая всенощная с участием киевских блюзменов, специальные гости джема- харьковский ДОЖДЬ с Александром Долговым.\nКлуб, неравнодушный к блюзу - \"Route 66\", киевские блюзбенды играют в основном там. Также периодически блюз можно услышать в \"Рэгтайме\". Иногда полезно заглянуть и на www.harmonica.org.ua/harpforum \nно объединяющего интернет-ресурса блюз в Украине по-прежнему не хватает. Хотя...кто ищет, тот всегда найдет."
