      \ с точкой зрения имярека. Тогда выясняется, что мнение об искусстве творца может высказывать только тот, чье имя творцу\
      \ известно. \nПример: да, я кристину агилеру в рот ебал. но она об этом не знает.\nВывод: пострадавших нет. И кристина\
      \ цела, и я жизнью доволен."
