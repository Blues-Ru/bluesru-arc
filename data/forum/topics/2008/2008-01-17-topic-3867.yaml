  text: 'Я как-то читал в Энциклопедии Blues Who''s Who что Джон Ли Хукер был женат на кузине Сонни Бой Уильямса. Да и к тому ж было 2 Сонни Бой Уильямсов, и оба известны и их вроде бы порой путают, и как я понял и они были родственниками (может я и не прав). А сколько Кингов в блюзе, но Би Би, Фредди, Алберт - не родственники (к тому ж настоящая фамилия БиБика - Райли). Но я как-то встречал Мадди Уотерс-мл. Уж и не знаю, кто он к семье Морганфилдов...

    Мне показалось что было немало родственников в блюзе. Есть ли ещё известные примеры?'
