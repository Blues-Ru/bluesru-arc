    text: "Два Sonny Boy Williamson не были родственники\n\nПервый - это John Lee Williamson\n\nВторой - это Alec \"Rice\" Miller  \n\nВ 1940-ых второй стал пользоваться именем тогда известного первого. Возможно идею придумала радиопрограмма King Buscuit Time, чтобы привлекать сушателей к передачам Миллера и продaвать муку \"Sonny Boy Williamson.\"\n\nВторой никгогда не признавалися в этом, и настаивал до конца жизни, что он первый и единственный настоящий Sonny Boy.  Первый возмущался и старался его остановить, но был убит в 1949-г.  Второй (по возрасту старьше) дожил до 1965-г.\n\nMuddy"
