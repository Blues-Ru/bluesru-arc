      text: "Уважаемый Jumpin' Jack Flash, по вашему, как часто ему мерили давление, учитывая, что родился он в 1899 году? Про способность спать стоя - пишет весьма уважаемый мной <a href=\"/artist/cub-coda/\">Cub Koda</a>. Но суть не в этом. К примеру, неизвестна точно причина смерти <a href=\"/artist/blind-lemon-jefferson/\">Блайнд Лимона Джефферсона</a>, а он был относительно зажиточным человеком, имел две машины, шофера на службе и счет в банке. И умер в Чикаго, а не в глухой деревушке, где кабак есть, а врача нет. \n\nИ вы действительно считаете, что можете точно определить, откуда всялось прозвище \"сонный\"? Из нескольких выринтов я выбрал самый нейтральный, который подтверждают имеющиеся фотографии. если бы я перечислил все возможные версии - это заняло бы слишком места в календаре, который по сути должен быть кратким."
