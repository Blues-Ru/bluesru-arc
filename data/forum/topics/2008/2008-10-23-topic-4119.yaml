  deleted: false
  text: 'Специально для любителей норвежского блюза.


    http://gazeta.ru/news/lenta/2008/10/23/n_1286761.shtml


    С 1 декабря вступит в силу упрощенный визовый режим между Россией и Норвегией, сообщил в прямом эфире радиостанции «Эхо
    Москвы» чрезвычайный и полномочный посол Норвегии в России Ойвинд Нордслеттен. «Буквально на днях мы получили ноту МИД
    России, что договор об упрощении визовых процедур, который мы подписали некоторое время назад, вступает в действие с 1
    декабря», – сказал посол.

    Он подчеркнул, что «все процедуры, имеющие отношение к проработке заявок от российских граждан, будут проще и быстрее».
    «Норма для проработки таких заявок – 10 дней», – сказал Нордслеттен, добавив, что в генеральных консульствах Норвегии
    в Санкт-Петербурге и Мурманске «мы уже делаем это за 5 дней». Планируется, по словам посла, введение «многократных виз
    на длительные периоды, вплоть до 5 лет». «Эхо Москвы»'
