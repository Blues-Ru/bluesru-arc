    deleted: false
    text: 'Спасибо за информацию! Подобные слухи давно ходят, но не совсем понятно, как это отзовется на простых норвежских
      музыкантах. Российские посольства в некотором смысле - гораздо более злобные, чем шенгенские в Москве. Они норовят содрать
      кучу денег, российские визы самые дорогие, 60$, если сильно заранее, если спешить, 100-200$. За изготовление липовых
      бумаг для посольства нужно заплатить еще 50$.


      По прибытии в Москву музыкантов ждут злобные менты, которые ловят за отсутствие регистрации. Оформление липовой регистрации
      стоит 30-50-100$. В результате не раз было, что музыканты прятались по квартирам, боялись выходить на улицу или гулять
      по Кремлю.


      Вот так у нас любят туристов....'
