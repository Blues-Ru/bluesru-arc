        text: "Приехать можно 1) по бизнес приглашению от организации 2) по частному приглашению. Чтобы его сделать, я должен\
          \ за 2-3 месяца подать бумаги в овир, отстояв очередь с утра, получив всякие выписки с лицевого счета про свою квартиру,\
          \ бумаги от сожителей и пр. 3) по липовому ваучеру из оплаченной гостиницы за 50$ и 15 мин времени.\n\nВ последнем\
          \ случае нужно регистрироваться в гостинице за 24 или 72 часа - правила меняются туда-сюда, сейчас цена такой регистрации\
          \ - 50-100$. Можно всего этого избежать, если снять настоящую гостиницу, но цены на них в Москве от 200$ в сутки.\n\
          \nНас ловили, к примеру, с Алексом Шульцом менты на Красной Площади. В другой раз одного нашего норвежца поймали\
          \ в метро, он от них откупался с моей помощью по телефону. \n\nТ.е. на \"визовую поддержку\" в нашу гостеприимную\
          \ страну нужно закладывать минимум 200$ на человека, плюс прятаться в страхе от нашей доблестной милиции."
