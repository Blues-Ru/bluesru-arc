      text: "Пойми пожалуйста, что большая часть блюза - не стадионная, а камерная, клубная форма музицирования, обращённая к каждому слушателю. \nБлюзмену нужен близкий контакт с небольшим количеством зрителей. Даже небольшой концертный зал с приподнятой сценой и креслами в партере \nотстраняет и отдаляет артиста от его аудитории, делает из действа, близкого к приятельским посиделкам - официальный концерт (с пышногрудой дамой, объявляющей номера, как в советском телевидении ))).\nКроме того, многие блюзмены были непрофессиональными музыкантами, а совмещали музицирование с разными профессиями.\nДля больших мероприятий есть другие, концертные жанры. В том числе и в более позднем блюзе - например, \"большой концертный блюз\" того же Би Би Кинга, когда на сцене артистов человек 20. \nДля загребания денех самосвалами на стадионах со всей помпезностью, пафосом и распальцовкой шире плеч и был придуман рок ))\nНо это не значит, что все должны его играть, или что рок, блюз-рок и прочие массовые мероприятия лучше, чем концерт в небольшом клубе. Иначе получается, что единственным критерием качества музыки является \"выполнение плана по валу денежных средств\". По такой логике Бритни Спирс с рекордным концертом в 220 тысяч зрителей безусловно в 100 тысяч раз талантливей, например, Скип Джеймса, который играл вообще перед случайными аудиториями в те самые 20 зрителей.\nДа, есть мастера играть на стадионах, но ещё раз говорю - это совсем другой жанр!"
