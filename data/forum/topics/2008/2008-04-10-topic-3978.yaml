    В Доме У Дороги с большим успехом прошли первые блюзовые посиделки в составе: Гия Дзагнидзе, Алексей Аграновский, Ольга
    Олейникова, Юрий Каверкин. Вечер прошел с большим успехом. Подобные встречи ожидаются регулярно по средам. <a href="/bluesnews/08Spring/Posidelki08/">Небольшой
    фоторепортаж (20 фотографий)</a>.'
