            subject: знатоки могли бы, но не эти (II)
            deleted: false
            text: "искать источники, достойные доверия, перепроверять - нудное дело!\n\nкуда приятнее и проще злорадствовать.\
              \ \n\nПоясняю по сути вопроса:\nвыкидывать эту дату мне было просто жалко из-за милого высказывания Бадди Гая\
              \ и замечательного чертежа.\nсаму дату я не с потолка взял, нашел где-то, но источник потерял. поэтому и настаиваю\
              \ на своей правоте. если бы за все прошедшие 11-е феврали я получил хотя бы одну точную ссылку на то, что именно\
              \ Лео сдел 10 февраля то ли в 1946, то ли в 54-м - я давно бы исправил. Я все ждал, когда же кто-то найдет точное\
              \ обоснование, по которому я смогу скорректировать ошибку.\n\nВместо этого фендороведы, фендоролюбы, фендерофаги\
              \ и фендеролисты устраивали для меня шикарный цирк бандерлогов, очень меня веселивший.\nВ этом году цирк не\
              \ удался, и я решил закончить этот ежегодный праздник. еще до того, как развернулась эта ветка, я тупо переправил\
              \ год, сделав точным год и, увы, ничем не доказанное число. \n\nКстати, cамо существование деда мороза - это\
              \ вранье для маленьких детей!"
