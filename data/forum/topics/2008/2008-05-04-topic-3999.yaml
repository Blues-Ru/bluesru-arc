  text: 'Литературная энциклопедия, в 11 томах

    М., 1929-1939

    Академическое издание


    «Блюз» - возникшие после «освобождения» среди только-что народившегося городского негритянского пролетариата на берегах Миссисипи короткие тоскливые песенки, преимущественно с мотивами грусти, уныния. В «блюз» часто поется о тяжелом положении негра-бедняка, но протеста против расового и социального гнета почти нет.'
