      subject: Ну, вроде все правильно.
      deleted: false
      text: "Блюз (англ. blues, сокр. от blue devils — уныние, меланхолия, грусть), сольная лирическая песня американских негров с берегов Миссисипи. Известна с конца 19 в.; обычно выражает тоску по утраченному счастью. В Б. начала 20 в. встречаются мотивы социального протеста. Музыкальные особенности Б. во многом унаследованы от музыки африканских народов; синкопы (смещения ритмических ударений), скользящие, не фиксированные понижения ступеней лада (т. н. «блюзовые» интонации), импровизационность исполнения (особенно в инструментальных интермедиях). Форма Б. — вариации. Б. исполнялся в сопровождении банджо, позднее — гитары. Широкому распространению Б. в негритянских городских кварталах положила начало песня негритянского профессионального музыканта У. Хэнди «Сен-Луи блюз» (1914). Ряд черт Б. был воспринят эстрадным джазом; в джазовой музыке Б. развивался как инструментальная танцевальная пьеса. Музыкальная форма и жанровые особенности Б. использовались многими композиторами 20 в. (Дж. Гершвин в США, М. Равель во Франции, Э. Кшенек в Австрии).\n\n  С. П. Панкратов"
