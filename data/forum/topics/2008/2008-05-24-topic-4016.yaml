      subject: 'я за эту бугивужную троицу:'
      deleted: false
      text: 'Pete Johnson, Albert Ammons, Meade Lux Lewis, и примкнувшего к ним Jimmy
        Yancey. Это классики!

        Из наших современников буги все еще играет Пайнтоп Перкинс (дай ему Бог здоровья)...
        Он сам жалуется на угасшую беглость пальцев, так что его нынешние записи позволяют
        послушать буги-вуги в несколько замедленном темпе.

        Еще классно играет буги Ann Rabson - играет так, что в рояле струны рвутся.

        В нынешнем году Blues Award лучшему клавишнику присужден Ханей Пьяцца, которая
        с мужем играет (Rod Piazza) - тоже горячие буги.

        на видео впечатлила меня веселая толстая тетка, которая выступает вместе с
        Кенди Кейн (Candye Kane). Записи ее меня не греют, а вот колнцертное видео
        порадовало. Кстати, их у нее несколько. Если она сама грудями играет по клавишам
        - это старое, музыкального смысла не имеет. Но есть бюолее свежая концертная
        съемка - вот там улетные буги!..'
