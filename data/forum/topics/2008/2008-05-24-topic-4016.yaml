              мне никогда не хватает).  Однако эти артисты сами не выускали альбомов,
              а 78.  Если послушать целый диск соло-пианино буги-вуги, ио лучше сборник
              разных аритстов.  К тому же Pete Johnson часто выступал с хорошими группами,
              и с Big Joe Turner.  Замечательная музыка.  Albert Ammons тоже имеел
              хорошую группу музыкантов.  Jay McShann играл потрясающее Boogie Woogie
