    text: "Мое мнение, как фаната блюз.ру.\nЕжедневно читаю блюзовый календарь полностью. Обожаю это!\nЧитаю с удовольствием блюзовые новости.\nЧитаю блюзовые обзоры, но не все, а только интересующих музыкантов.\nВ разделе музыканты, как-то все сложновато и, по-моему, слишком длинный список - не очень удобно.\nПо-моему, блок блюзовых блогов и ссылок уже не очень актуальный, а места они занимают порадочно. \nЕще мне кажется неудобным, что реклама разделяет новости блюза с календарем от новостей сайта и обзоров СД в центральном блоке.\nИ последний момент, в правом меню есть несколько \"мертвых\" пунктов или таких, которое можно вложить поглубже, например, ICQ список, Гостевая (это вообще сейчас, по-моему, нигде не используется). Вложить поглубже можно бы было и \"Желтые страницы\", \"Фестивали\" и \"Разделы\", т.е. я имею ввиду, что можно из этого сделать один пункт.\nВроде бы все, еще, что вспомню, тогда допишу."
