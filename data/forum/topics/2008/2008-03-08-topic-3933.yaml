    слово Филмор переведёте?.. Вудсток можно перевести как Склад Брёвен. Как вам такое:
    музыкальный фестиваль в Складе Брёвен... ладно, это я предираюсь, но честное слово,
    коряво звучит этот Филмор-восток и некрасиво. Так вопрос мой про Била Гэма. Имя
    этого человека я встречаю в связи с совершенно разными событиями, в основном,
    в связи с выступлениями: Jimi Hendrix, Lynyrd Skynyrd, вон ещё, акустический концерт
