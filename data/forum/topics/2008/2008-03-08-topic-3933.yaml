    deleted: false
    text: 'Graham, Bill (урожденный Wolfgang Gajonza; 8 января 1931 – 25 октября 1991)
      - гуру хипповых музыкальных концертов, наиболее влиятельный рок-промоутер эпохи.
      В середине 60-х начал ставить пьесы на собраниях (be-ins) в сан-францисском
      Golden Gate Park, затем открыл залы для живых рок-выступлений Fillmore Auditorium
      в Сан Франциско и Fillmore East в Нью-Йорке. Продюссировал тысячи концертов
      по всему миру (включая выступления Роллинг Стоунз, Дилана и Грейтфул Дэд) и
      благотворительные акции Live Aid и Amnesty International. Последовательно выступая
      против жадности шоу-бизнеса, он ставил шоу «для людей». Его концерты отличались
      хорошей организацией и безопасностью.

      (русский перевод на моем сайте: http://www.agranovsky.ru/blues_language/hippie.htm)'
