    text: "Обычная гитара (как электрическая так и акустическая) может использоваться для того, чтобы играть на ней слайдом. При этом струны подняты чуть выше от грифа, чем они были бы для обычной игры на гитаре. \nhttp://worldelectricguitar.ru/articles/Slide_Guitar.php"
