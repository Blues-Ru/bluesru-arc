  text: 'Скончался легендарный суол-музыкант Исаак Хэйес


    Легендарный американский исполнитель музыки в стиле соул, композитор и лауреат
    премии «Оскар» Исаак Хэйес скончался накануне в Мемфисе в возрасте 65 лет. Об
    этом сообщил журналистам друг и бывший менеджер музыканта Онзи Хорн.

    Хэйес был найден в воскресенье без сознания в своем доме. Он тут же был отправлен
    в больницу, однако спасти его не удалось.

    Хэйес известен своими работами в кинематографе. Он писал музыку для многих голливудских
    фильмов. Премии «Оскар» за лучший саундтрек он был удостоен за музыкальную тему
    к фильму «Шафт». Молодежи он известен в основном по мультипликационному сериалу
    «Южный парк», одного из героев которого (Шефа) Хэйес озвучивал.   // Reuters


    http://www.gazeta.ru/news/lenta/2008/08/11/n_1254840.shtml'
