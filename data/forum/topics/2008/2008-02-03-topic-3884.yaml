                  По какому принципу слушатели ранжируют исполнителей?


                  1) Они сами являются экспертами в музыке?

                  2) Они ретранслируют услышанное где-то мнение людей, мнение которых для них авторитетно?

                  3) В этом случае, почему одни люди считают других людей экспертами и делегируют им полномочия составлять
                  суждения, которые потом начинают считаться "общественным мнением"?

                  4) Или же независимо от происхождения мнения - своё оно или чужое, предпочтения людей складываются в некий
                  вектор, указывающий на конкретных исполнителей?

                  5) Можно ли (теоретически) составить такую форму опросника, чтобы чётко выделить, является ли артист N действительно
                  объектом народной любви, или любовь к артисту N инспирирована действиями "медиа-технологов", т.е. грамотным
