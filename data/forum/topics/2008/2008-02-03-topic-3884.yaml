                                      text: "\"Почему бы тем же масс-технологам не взять старое забытое имя и не начать раскручивать\
                                        \ post factum?\"  Такое бывает. Robert Johnson, например.  Но наверно выгоднее продовать\
                                        \ живого человека, который будет еще способен в будущем покорить сердца и заработать\
                                        \ дополнительные деньги.  \n\n\"Как любителю искусства (в том числе музыки), находясь\
                                        \ \"здесь и сейчас\", понять, с чем он имеет дело - с новым великим артистом или с\
                                        \ продуктом PR-технологий?\"  Мы не знаем, и бывает ошибаемся.  Но мнения людей, которые\
                                        \ много знают о музыке и серьезно подумали над этим вопросом, заслуживают уважения\
                                        \ (даже если они не правы). По этому поводу мне была интересна реакция экспертов на\
                                        \ недавнюю смерть пианиста Оскара Петерсона.  Сущесвтвуют разные мнения.  PR рекламировали\
                                        \ его, как одного из самых великих джазавых музыкантов за всю историю.  Но есть не\
                                        \ мало экспертов, которые далеко не согласны.  Конечно, все признают необычное техническое\
                                        \ мастерство Петерсона.  Но многие считают его очень ограниченным, как джазовым артистом.\
                                        \ Утверждают, что его игра похожа на машину-автомат, без глубокого чувства блюза или\
                                        \ особых творческих достижений. Кто прав и кто неправ?  Приходится самому приходить\
                                        \ к своему мнению.  Однако от наличия разногласия среди экспертов не следует, что\
