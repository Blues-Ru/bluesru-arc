                                        deleted: false
                                        text: '...чтобы быть субъективным. Словосочетание "объективное мнение" звучит как-то
                                          странно мягко скажем. Объективным может быть какой-то факт, математические формулы,
                                          законы точных наук- там действительно от чьего либо мнения ничего не зависит.

                                          А мнение как таковое в любом случае субъективно, так как имеет отношение к конкретным
                                          людям, это мнение можно кому-то навязать, пользуясь своим авторитетом- но объективным
                                          это мнение всёравно никогда не будет.'
