                            text: 'Я пытаюсь понять, кто и как мерял "объективные причины".

                              Повторяю, у меня простое предположение - может, все мы жертвы массового психоза, наведённого
                              медиа-технологами, в отношении музыкантов, которые считаются классиками.

                              Пока что я не прочитал ни одного довода в пользу того, что, допустим, T-Bone Walker действительно
                              объективно обладает мастерством, влияет на других музыкантов и тд.

                              Есть только субъективные мнения отдельных лиц, которые никак не тянут на объективность.

                              Вот, допустим, ты мне говоришь, "T-Bone Walker - великий музыкант".

                              Почему я должен с тобой соглашаться? Моё мнение и твоё мнение весят одинаково, если принять,
                              что все люди равны. Если я так не считаю, то твоё мнение для меня не значимо. Если Би Би Кинг
                              говорит "T-Bone Walker is a great musician", а я не считаю Би Би для себя авторитетным музыкантом,
                              то его мнение для меня тоже не значимо. (Для тех, кто в танке - моё мнение о T-Bone и Би Би
                              совсем другое, они взяты для примера)

                              В итоге, мы остаёмся с никак не складывающимися субъективными мнениями, откуда вывод: все рейтинги
                              - фуфло и манипуляция.


                              Не согласны? Попробуйте доказать обратное.'
