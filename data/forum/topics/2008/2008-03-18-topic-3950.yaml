        text: 'Во-первых я Чака люблю и уважаю и его вклада в мировую музыку не отрицаю- он действительно велик

          Во-вторых до 81 года далеко не все доживают. А у нас в стране так вообще средняя продолжительность жизни мужчин
          59 лет.

          В-третьих например тот же Лес Пол играл в 81 год, Би Би Кинг играл в 81 год и продолжает играть- и при этом попадают
          и в ноты, и в ритм.

          В-четвёртых- статус Чака настолько авторитетен, что ему в принципе вообще можно не играть, а просто выдти на сцену-
          и можно радоваться что хотя бы эта легенда ещё с нами- а их увы остаётся всё меньше и меньше... И если это принимаь
          во внимание, то становится грустно от необратимости природных процессов'
