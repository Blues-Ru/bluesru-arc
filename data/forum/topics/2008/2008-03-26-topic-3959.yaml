    text: Альбом записан для канадского лейбла Stony Plain (с которым активно сотрудничает Дюк Робиллард). Международной дистрибуцией
      альбома занимается Ruf Records (бывший германский блюзовый лейбл, уверенно вышедший на международную арену). Поэтому
      даты релиза альбома могут сильно разниться. В Канаде альбом, типа, уже вышел; США и Европа, вроде, еще ждут. Если заглянуть
      на amazon, то там уверяют, что альбом вышел еще 11 марта.
