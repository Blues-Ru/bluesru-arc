  text: "В декабре 2013 года , Россия , Санкт -Петербург пройдет III международный\
    \ вокальный фестиваль-конкурс \"Невероятный отбор\"\nhttp://vk.com/club44431365\n\
    Все подробности можно узнать в положении группы!\nhttp://vk.com/page-44431365_45173854\n\
    \nБолее точные даты и площадки туров и концертов появятся в Ноябре.\nПрием заявок\
    \ на участие с 1-го Октября 2013 г. до 30-го Ноября 2013 г\n\nЦели и задачи фестиваля-конкурса:\n\
    1. Поиск и открытие новых ярких и талантливых исполнителей. \n2. Создание профессионального\
    \ портфолио (фото, видео) всем участникам фестиваля-конкурса. \n3. Воспитание\
    \ патриотизма, уважения к родному языку, родной культуре, к родной Стране. \n\
    4. Отбор наиболее интересных исполнителей для сборных и сольных концертных выступлений.\
    \ \n5. Создание новых творческих тандемов с авторами песен. \n6. Отбор вокалистов\
    \ для участия в проектах продюсерского центра. \n\nНа Конкурсе исполняются песни:\n\
    1. Следующих вокальных направлений: \n___ а) народная или этническая песня; \n\
    ___ б) патриотическая песня; \n___ в) академическая песня, романс; \n___ г) современная\
    \ эстрадная песня. \n2. Соло (под минус или аккомпанемент). \n3. Только на родном\
    \ для вокалиста языке (на котором он думает и общается в семье).\n\nНа Фестиваль\
    \ приглашаются\nвокалисты и вокалистки в возрасте \nот 12 лет и старше, \nиз любых\
    \ стран, владеющие русским языком! \n\nНа Конкурс приглашаются\nвокалисты и вокалистки\
    \ в возрасте \nот 16 до 26 лет, \nиз любых стран, владеющие русским языком, но\
    \ поющие на своем родном языке ! \n\nУчастники Конкурса выступают в одной из выбранных\
    \ номинаций:\n1. Народная или этническая песня. \n2. Патриотическая песня. \n\
    3. Академическая песня, романс. \n4. Современная эстрадная песня. \n\nПорядок\
    \ отбора победителей на Фестивале\nНа каждом фестивальном концерте открытым зрительским\
    \ голосованием определяется самый лучший исполнитель (вокалист или группа) для\
    \ участия в Финальном концерте и награждения.\n\nПорядок отбора победителей на\
    \ Конкурсе\nКонкурсанты выступают только в одной из выбранной номинации. Во II-ом\
    \ туре участвует половина участников I-го тура, набравших наибольшее число балов.\
    \ В III-ем туре принимает участие половина участников II-го тура, набравших наибольшее\
    \ число балов. В Финальном туре принимает участие половина участников III-го тура,\
    \ набравших наибольшее число балов. \nПобедители конкурса определяются открытым\
    \ зрительским голосованием.\n\nУчастие в Фестивале платное.\n1. Участие в отборочном\
    \ туре - БЕСПЛАТНО. \n2. Участие в программе Фестиваля: \n- 1000р. - с каждого\
    \ солиста вокалиста; \n- 500р. - с каждого участника группы поддержки (бек-вокалиста,\
    \ аккомпаниатора, музыканта, танцора), за каждую исполняемую песню. \n3. Участие\
    \ в Финальном концерте: \n- 2000р. - с каждого солиста вокалиста; \n- 1000р. -\
    \ с каждого участника группы поддержки (бек-вокалиста, аккомпаниатора, музыканта,\
    \ танцора), за каждую исполняемую песню.\n\nУчастие в Конкурсе платное.\n1. Участие\
    \ в отборочном туре - БЕСПЛАТНО. \n2. Участие в 1-ом туре - 1000 руб. \n3. Участие\
    \ во 2-ом туре - 1500 руб. \n4. Участие в 3-ем туре - 2000 руб. \n5. Участие в\
    \ Финальном туре - 2500 руб. \n\nОплата производится поэтапно, по мере прохождения\
    \ на очередной тур. \n\nНаиболее интересные участники (с точки зрения организаторов\
    \ конкурса) \nмогут быть освобождены от дальнейшей оплаты своего участия в конкурсе!\n\
    \nВнимание! Оплата за участие дифференцированная! \nКонкурсанты, занявшие по количеству\
    \ набранных балов:\nВ I-ом туре: \n- 1-е место, участвуют во II-ом туре БЕСПЛАТНО;\
    \ \n- 2-е место, оплачивают за участие во II-ом туре - 50%, (т.е. 750 руб.); \n\
    - 3-е место, оплачивают за участие во II-ом туре - 75%, (т.е. 1125 руб.); \n\n\
    Во II-ом туре: \n- 1-е место, участвуют в III-ем туре БЕСПЛАТНО; \n- 2-е место,\
    \ оплачивают за участие в III-ем туре - 50%, (т.е. 1000 руб.); \n- 3-е место,\
    \ оплачивают за участие в III-ем туре - 75%, (т.е. 1500 руб.); \n\nВ III-ем туре:\
    \ \n- 1-е место, участвуют в Финальном туре БЕСПЛАТНО; \n- 2-е место, оплачивают\
    \ за участие в Финальном туре - 50%, (т.е. 1250 руб.); \n- 3-е место, оплачивают\
    \ за участие в Финальном туре - 75%, (т.е. 1875 руб.);\n\nЗарубежные и иногородние\
    \ участники:\n- Самостоятельно несут все расходы, связанные с участием в Фестивале\
    \ и в Конкурсе \n(проезд в Санкт-Петербург и обратно, проживание и питание). \n\
    - Самостоятельно оформляют паспорта, визы, медицинские страховки и иные \nдокументы,\
    \ необходимые для въезда и пребывания в Российской Федерации. \n\nДля участия\
    \ в Фестивале необходимо\nотправить в личном сообщении организаторам конкурса\
    \ \nhttp://vk.com/magsus \nhttp://vk.com/kulakovaalinasergeevna \nили по почте:\
    \ mail@magsus.net\n\nДля участия в Конкурсе необходимо\nотправить в личном сообщении\
    \ организаторам конкурса \nhttp://vk.com/magsus \nhttp://vk.com/kulakovaalinasergeevna\
    \ \nили по почте: mail@magsus.net\n\nВнимание!\nВ случае отказа участника Фестиваля\
    \ от участия в Фестивале \nиз-за возникших у него форс-мажорных обстоятельств,\
    \ \nвнесенные им за участие деньги не возвращаются! \n\nВ случае отказа участника\
    \ Конкурса от дальнейшего участия в Конкурсе \nиз-за возникших у него форс-мажорных\
    \ обстоятельств, \nвнесенные им за участие в очередном туре Конкурса деньги не\
    \ возвращаются! \n\nАдреса и контакты.\nМесто проведения конкурса: Россия, Санкт-Петербург.\
    \ \n\nКонтактная информация: \n\nПродюсер конкурса: Оганезов Армен Сергеевич \n\
    Страница в Контакте: http://vk.com/magsus \nЕmail: mail@magsus.net \nТелефон:\
    \ +7 (963) 313-55-88 \n\nАдминистратор конкурса: Кулакова Алина Сергеевна \nСтраница\
    \ в Контакте: http://vk.com/kulakovaalinasergeevna \nEmail: mail@magsus.net \n\
    Телефон: +7 (911) 287-19-02"
