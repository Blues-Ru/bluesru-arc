    text: 'http://murgab.net/blog/culture/1253.html

      И самый интересный факт при всем при этом: Лео Фендер никогда не умел играть на гитаре. Более того, до того как Лео занялся разработкой отменного инструмента, он был простым бухгалтером в калифорнийском дорожном управлении, оставшимся безработным из-за Великой Депрессии. Сначала Фендер подрабатывал ремонтом достаточно простых в те времена электроприборов, а потом стал изготавливать на заказ гитарные усилители. Тут и понеслась…

      Еще один интересный факт — несмотря на то, что Фендер вооружил высококлассным музыкальным инструментом многих знаменитейших рок-гитаристов (например — Джимми Хендрикса и Риччи Блэкмора), он терпеть не мог рок-музыку.

      К философскому вопросу о «создателе покера, который не обязательно должен быть лучшим игроком в покер».'
