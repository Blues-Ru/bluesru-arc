      deleted: false
      text: '...Мухин - это уж совсем easy listening. Да и уровень совсем не тот. Мухин - это как бы  советский вариант Les
        Paul''а


        С Wes''ом можно сравнивать, например, Владимира Молоткова или или Николая Громина. Хотя тоже без слёз их блюзовые
        экзерсисы слушать нельзя, настолько советское представление о блюзе и джазе в условиях информационной изоляции было
        надуманным. При всём уважении к сыгранному в 60х годах отечественными джазменами, многое действительно было весьма
        неплохо и по-русски аутентично, но бесконечно далеко от духа "первоисточников".


        Вот, например, чисто отечественный вариант "Down By The Riverside", преисполненный исконно-русской созерцательности
        пейзажей при катании на лодочке вдоль по воображаемой речке, полной купающихся негров и загорающих кракодилов:


        http://muzofon.com/search/%D0%92%D0%BB%D0%B0%D0%B4%D0%B8%D0%BC%D0%B8%D1%80%20%D0%9C%D0%BE%D0%BB%D0%BE%D1%82%D0%BA%D0%BE%D0%B2'
