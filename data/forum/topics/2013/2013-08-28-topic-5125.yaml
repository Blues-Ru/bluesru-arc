  text: '28 сентября 2013 года впервые в городе Губкин, который заслуженно именуют «жемчужиной Курской Магнитной Аномалии»,
    в рамках празднования 74-й годовщины со дня образования города состоится


    I Межрегиональный фестиваль джазовой музыки «Джаз-Магнит 2013».


    Это событие станет резонансным не только в истории нашего города, но и навсегда останется в сердцах любителей джаза. Для
    участников и гостей фестиваля предусмотрено посещение крупнейшего в мире карьера Лебединского горно-обогатительного комбината,
    занесенного в Книгу рекордов Гиннеса, единственного в России музея истории КМА, других достопримечательностей.

    На центральной площади города состоится обширная концертная программа фестиваля. Ждем вас, джазовые исполнители России,
    в городе Губкин! Положение и анкета-заявка на сайте www.stroiteldk.ru'
