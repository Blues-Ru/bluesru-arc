  text: 'Администрация и творческая группа Blues.Ru без колебаний поздравляет основоположника отечественного губногармонизма
    с днем рождения, а с юбилеем в особенности!!!


    Михаил Петрович шагал в авангарде лучшей отечественной музыки еще во времена дремучих и легендарных 60-х. Участвовал в
    самом факте зарождения российского блюза. Из его достижений (как та литература из той шинели) вышли все нынешние наши
    харперы. Он щедро талантлив, увлекательно артистичен, могуч, душевен и прозорлив... и еще чертовски обаятелен!


    Петрович, друг и учитель, удач тебе во всем, в работе и личной жизни, здоровья и все той же неукоснительной силы духа,
    без которой в нашем блюзовом мире никак не обойтись!'
