  text: "Чёрная сущность эта всегда кружит над людьми...\nНад всеми в целом и над\
    \ каждым в отдельности...\nНа данный момент в моей местности, на окраине мира,\
    \ развлечение у него такое... нехитрое...\nВысматривать в толпе молодых и цветущих\
    \ девушек...\nи соблазнять их обещаниями красочной жизни с далёкими заморскими\
    \ женихами...\nОбещает, что у них там, дескать, всё не так как здесь...\nНо ярко-красочней...\n\
    Интенсивней и перспективней...\nстол яств полон всегда и ключи от своей личной\
    \ (не мужниной) машины всегда в сумочке будут...\nЛёгкую добычу он себе выбрал,\
    \ обмануть которую не сложно... она сама обманываться рада...\nИбо экзотика и\
    \ фантазии кружат голову немедленно...\nкто-то скажет, что это всё-таки порхающий\
    \ Амур виноват...\nно когда на каждом углу истории о 22-ухлетней местной и 38-летним\
    \ заморским, уже изрядно тронутым молью, то...\nв голову приходят только проделки\
    \ Дьявола...\nистории эти - не редкость...\nорудие его - многочисленные сайты\
    \ интернет знакомств...\nперекрёсток, где сходятся алчущие и страствующие...\n\
    чем же расплачиваться предложит им он ?...\nразностью жизненных интересов, обусловленных\
    \ разницей в возрасте и в культурах воспитания ?...\nоторванностью от родных и\
    \ близких, участие в жизни которых ограничиться только редкими скайповыми общениями\
    \ ?...\nсчастьем своих родителей, которые будут вынуждены вместо счастья лицезрения\
