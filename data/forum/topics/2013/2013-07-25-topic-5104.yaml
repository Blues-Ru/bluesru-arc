  text: "Если вы являетесь зарегистрированным подписчиком Blues.Ru, сообщите нас о своем желании участвовать в розыгрыше билетов, отправив письмо на адрес www@blues.ru и указав в теме: \"Билет на 31 июля\". Если не являетесь - зарегистрируйтесь и участвуйте! Но - в четверг в полночь прием заявок закончится, и уже в пятницу будут объявлены результаты. \n\nНа сладкое - Тадж поет Боба Дилана. Этой песни нет в его сольных альбомах, это запись для проекта  \"Chimes of Freedom, THE SONGS OF BOB DYLAN\".\n\n<iframe width=\"420\" height=\"315\" src=\"//www.youtube.com/embed/Hyz9bNCqY_Q\" frameborder=\"0\" allowfullscreen></iframe>"
