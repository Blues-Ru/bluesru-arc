  text: "http://3.bp.blogspot.com/-vMp2udansNU/USNKKSySz9I/AAAAAAAABlw/MXFkNVFWjRo/s1600/The+Beat+Hoss+Allen.jpg\n\nВеликолепное\
    \ музыкальное ТВ шоу 1966 года...\nпосвященное черной музыке... \n26 серий по 25 минут... \n11 часов бесподобного удовольствия...\
    \ \nв шоу приняли учасcтие весь цвет тогдашней черной музыки Юга... \nLittle Milton, Etta James, Clarence \"Gatemouth\"\
    \ Brown, Joe Tex... \nэто только несколько имен, от которых пробегают приятные мураши по спине... ) \nдвигателем этого\
    \ ТВ проекта являлся замечательнейший энтузиаст и поклонник стилей R&B и соул, радио-диджей из Нэшвилла - Bill \"Hoss\"\
    \ Allen... \nбелый, умудренный и искушенный... \nкак же он вел это дело!... \nдержал все в своих руках и крепко за горло...\
    \ \nно с искренней любовью и уважением к музыкантам...\nон говорил с ними на одном языке, на их джайве...\nс их дружеско-подковыристо-задушевными\
    \ интонациями... \nзаписи этого шоу много десятилетий считались утерянными... \nно вот они, сэнк год... \nбыло разное...\
    \ \nснималось в Далласе, чтоб картинка была цветной...\nоднажды на Алабаме местный ККК поджигал радиотрансляционное оборудование,\
    \ чтобы не допустить трансляции передачи... \nтем не менее Bill \"Hoss\" Allen знакомил белую аудиторию с замечательной\
    \ черной музыкой... \nс черными сильными и чувственными голосами... \nс искренним весельем на выступлении... \nпусть ему\
    \ благодарственно икнется на том свете...\nон сделал то, для чего был рожден..."
