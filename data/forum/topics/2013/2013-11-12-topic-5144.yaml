    text: '<a href="http://en.wikipedia.org/wiki/Arlen_Roth">Roth wrote and performed most, and</a> coached all of Ralph Macchio''s guitar parts in the 1986 movie Crossroads and directed many of those scenes. He also served as the film''s official authenticator of any scenes involving music, and the performing of the music. On one day, the scene of Robert Johnson recording was halted because Roth noticed that the guitar''s tuning pegs were from the wrong era.

