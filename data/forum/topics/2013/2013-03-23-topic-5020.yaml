  text: 'http://blogs.suntimes.com/hoekstra/ptsteveazzato.jpg


    Joseph William "Pinetop" Perkins

    1913 - 2011


    два года назад ушел этот светлый человек с молодым сердцем и глазами, широко открытыми
    миру...

    человек, своим творчеством повлиявший на несколько поколений слушателей, музыкантов
    и, в конце концов, на блюз в целом, каким мы его знаем...

    для меня сложно представить хорошую блюзовую музыку без пиано или органа на сцене...

    есть своя особая магия в этих клавишных перекатах...

    если блюзовая гитара дает слушателям иногда страсть, выплеск эмоций, иногда -
    размышлизм, то блюзовые клавиши - это всегда музыкальная красота и мудрость...

    мудрость, подкрепленная личностью того кто сидит за клавишами...

    блюзовые пианисты совсем другие люди, нежели гитаристы...

    другие, гораздо более умиротворенные...

    умиротворенность, общительность и открытость собеседнику - это главные качества,
    которыми вспоминают нашего друга люди близко его знавшие...

    Jerry Portnoy, харпер, много лет участвовавший в Muddy Waters Blues Band вместе
    с Пайнтопом, вспоминал...

    представьте, южное побережье Франции...

    середина 70-ых прошлого века...

    предстоящее вечернее выступление на каком-то островке невдалеке от побережья...

    время отправки парома уже стремительно приближается...

    все участнки блюз бэнда собрались в холле...

    Пайнтопа не хватает...

    сбегали в его номер - нет его...

    оббегали гостиницу - тоже нет...

    натурально начинаются нервы - там же ждут, ведь написано большими буквами на афише
    - всемирно известный блюз бэнд, самого Muddy "Mississippi" Waters''a...

    а такие артисты не имеют права опаздывать и подводить публику...

    хотя сейчас вроде наоборот, чем громче артист - тем больше опоздания...

    такая мода...

    но вернемся...

    время уходит, нервозность увеличивается...

    настает время для суетливого осмотра окрестностей гостиницы...

    и что бы вы думали - в ближайшей кафешке под открытым небом сидит наш герой и
    добродушно улыбается сквозь прищуренные веки на заходящее солнце, со стаканом
    в руке (и как говорят злые языки - уже не первым)...

    в ответ на суетливый вопрос гонца - Pine, как так? - отвечает...

    понимаешь, дружище, вышел я из гостиничного номера после полудня промочить горло
    для настроения перед выступлением...

    заказал стаканчик, чего-то к нему...

    сижу улыбаюсь, думку думаю, где та Миссиссиппи, где я, под Ниццей щас, на девушек
    проходящих оборачиваюсь, хорошо так...

    но вот с трапезой окончено, подходит время рассчитываться - я хлопаю себя по карманам
    и понимаю, что вышел из номера без бумажника...

    и так мне, говорит, грустно стало, что бедным южным мальчишком не изучал я в школе
    французский язык (скажу тебе по секрету, я вообще в то время мало что изучал)...

    и не смогу внятно и доходчиво объяснить эту заминку персоналу кафе (да это было
    в те темные времена, когда еще не каждый персонал понимал английский-эсперанто)...

    и посчитал я, что самым лучшим в этой ситуации будет расслабиться, заказывать
    дальше, щурится на солнце и ждать - кто-нибудь, да отыщет меня...

    вот ты и нашел, давай рассчитаемся и пойдем транспортировать моё пиано на остров...
    дорога неблизкая...

    такое замечательное происшествие летним вечером на побережье...

    спешу уточнить, да, это было в то благословенное время, когда мобильный телефон
    был не у каждого школьника в кармане...

    что до выпивки, то уверен она не помешала показать Пайнтопу свое лучшее выступление
    этим вечером...

    более полувека тренировок в несметном количестве увеселительных заведений по всему
    миру...

    слушайте Блюз, друзья, он продлевает жизнь...'
