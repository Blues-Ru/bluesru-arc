  text: "http://www.pastblues.com/index.php?keyword=Mighty+Joe+Young\n\nэтот внушительный мужчина был гитарист...\nзамечательный блюзовый гитарист...\nутонченный, изощренный (без сверхмеры, что вредно) и искусный...\nи при этом глубоко блюзовый...\nуроженец Луизианы (кто в теме, понимают - оттуда растут самые чудесные корни)...\nтрудяга и пахарь блюзовой сцены...\nсделал для блюзового мира труднопереоценимое открытие - органично соединил в своей замечательной музыке гитарный блюз и чувственность соула в вокале...\nстолп чикагского блюза, Muddy Waters, тепло относился к нашему герою и когда они вдвоем, обнявшись распевали со сцены про долгие пять лет, счастливые улыбки светились на их лицах...\nмного десятилетий провел он с гитарой, она срослась с его руками, нарек он её - Bluesy Josefine (жозефин - помните про Луизиану?)...\nлюбил он её, и она отвечала ему тем же...\nбыл уважаем среди коллег...\nв 1986 году у нашего замечательного друга случилась страшная беда - отнялись руки...\nон прожил с этим долгих 13 лет, до 1999 года...\nумер в результате операции, которая, он надеялся, вернет ему его руки...\n\nJoseph \"Mighty\" Young \n1927 - 1999\n\nа Вы говорите, на работу рано вставать...\nвзлетайте с кровати пока Вас носят ноги и обнимайте своими руками тех, кто вам дорог..."
