  text: "Гитара и гармоника - образцовый блюзовый союз. Обе обладают ключевыми блюзовыми параметрами: жарить и ныть.\nСифас и Виггинс были лучшим блюзовым дуэтом за последние тридцать лет... Ну, можно сказать, что и конкуренция была, увы, невелика. Но и безотносительно времени - это был просто идеальный дуэт. Их диалектическое единство, полное взаимопонимание, умение подхватывать, вести две самостоятельные партии, сохраняя единство, знания, виртуозность и абсолютная естественность в  своем жанре сравнимы разве что только с лучшими годами Sonny Terry и Brownie McGhee (а у них не все годы были \"лучшими\").\n\nДжон Цифас покинул этот мир три года назад. Фил Виггинс продолжает в одиночку, или в дуэте с лидерами сегодняшней блюз-акустической гитары, часто выступает и с Guy Davis, с которым и приехал в Москву.  \n\n<iframe width=\"420\" height=\"315\" src=\"http://www.youtube.com/embed/qIf577IaD3Y\" frameborder=\"0\" allowfullscreen></iframe>"
