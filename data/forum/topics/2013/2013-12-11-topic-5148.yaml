  subject: В Киеве стартовал пятинедельный джаз-фестиваль
  deleted: false
  text: 'http://ru.golos.ua/ сообщает


    “Джаз Лаунж Фестиваль” – это арт-проект длительностью 5 уикендов, который смешает
    различные грани современного искусства: джаз и электронную музыку, уникальные
    экспозиции, театральные постановки и перфоманс. На фестивале будет представлена
    большая коллекция талантливых проектов и музыкальных стилей.

    В день открытия фестиваля украинский актер Остап Ступка представил 15-тиминутный
    перфоманс по роману Зигмунда Зюськинда «Контрабас».

    «В классической, джазовой и блюзовой музыке колоссальную роль играет басс: если
    нет баса, то нет джазбенда»,- пояснил он.

    Остап Ступка признался, что сам любит джаз и блюз.

    «У меня есть любимая голландская блюзовая группа «Leave in Blues», она малоизвестная
    в странах восточной Европы»,- сказал он.

    Также на протяжении всего вечера знаменитый украинский бандурист Роман Грынькив
    радовал гостей фестиваля академической, народной и импровизированной музыкой,
    а художник Юрий Ермоленко представил публике 206 портретов известных джазменов.

    «Киев, сейчас, к сожалению, совершенно не джазовый и не блюзовый город. Поэтому
    мы начинаем наш проект именно с того, что знакомим киевлян с портретами известных
    джазовых исполнителей, изображенных на виниловых пластинках. Тем самым мы хотим
    донести к публике мысль о том, что эта музыка будет существовать вечно»,- пояснили
    организаторы.



    Источник: http://ru.golos.ua/showbiz/13_12_01_v_kieve_startoval_pyatinedelnyiy_djazfestival

    Golos.ua © 2013


    PS. Поскольку все источники, перепечатавшие информацию, сохранили написание «Leave
    in Blues» - надо предположить, что по части посвящения и пропаганды предстоит
    еще много пройти.'
