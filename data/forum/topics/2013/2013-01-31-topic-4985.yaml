    text: "Теплоход Столичной Судоходной Компании рад приветствовать всех отдыхающих на своем борту и спешит сообщить, что каждую пятницу, субботу и воскресенье, начиная с 12.10, в октябре и ноябре, Вас С НЕТЕРПЕНИЕМ ждут:\nнезабываемые вечеринки \"Tequila party\" с участием латино-американских танцовщиц, бесплатный напиток на входе, Трио \"Мариачес\", интерактивная программа, конкурсная программа (с танцевальными конкурсами, конкурсами на дегустацию текилы, разнообразными викторинами), мастер-классы по бальным и латино-танцам и многое другое от продюсерского этно-центра Андрея Горбатова \"Живая коллекция\".\nА также будут разыгрываться множество разнообразных призов: самому активному участнику, самой активной паре, самой танцующей паре по итогам мастер класса. А в конце вечера вас ждет розыгрыш главного приза по итогам лотереи.\nВас ждет экзотическая Мексиканская кухня.\nМы сделаем так, что ступив на борт нашего теплохода с хорошим настроением, Вы получили незабываемое и позитивное впечатление!!!\nОтправление от причала \"Новоспасский мост\" (метро Пролетарская).\nЦена билета 2300 руб. От 18 лет.\nВечеринка на 4 часа.\nПри себе иметь улыбку, и хорошее настроение)\nУдачного вам отдыха!!!\nP.S. На теплоходе тепло\nДаты: 12 октября в 19.00 суббота\n13 октября в 16.00 воскресенье\nДалее, каждую пятницу в 20.00, субботу в 19.00, воскресенье в 16.00 - в октябре и ноябре.\n\nhttp://www.koncertagency.ru \nорганизация ваших праздников \"под ключ\" \nзвоните в Москву == 8(495)434-64-93 и 8(985)761-00-61 \nГорбатов Андрей \nэтно-продюсер"
