  text: 'что я вам скажу, друзья...

    есть такая страна - Румыния...

    а в ней есть город Cluj-Napoca...

    ближе к западной, венгерской границе страны...

    Трансильвания... Дракула там для туристов пробегал...

    интересная музыкальная румыно-венгерско-карпатская этнокультура...

    кто в юном отрочестве не прослушивал часами концерты национальных фольклорных ансамблей по одному из немногих доступных
    телеканалов, тот не сможет оценить всю её прелесть...

    в 90-ых в эти края неведомыми путями (скорее всего узкими и извилистыми карпатскими тропами) занесло блюзовые ритмы...

    так появилась местная ритм-н-блюзовая команда Nighlosers...

    легенда гласит, что впервые состав этой команды собрался вместе за несколько часов до торжественного открытия местного
    блюзового клуба в 1994-ом...

    и так у них неплохо получилось открыться, что решили они не расставаться...

    с тех пор свет увидели 3-и замечательных альбома, на века запечатлевших успехи этой талантливой группы музыкантов...

    о каждом из этих альбомов мы поговорим в дальнейшем, благо они того достойны...

    сегодня я бы хотел обратить Ваше светлое внимание на среднего сына этой команды, альбом 97-го года прошлого века - Plum
    Brandy Blues...

    смею отметить, что Plum Brandy - это местный горячительный напиток, в наших славянских краях более известный под именем
    "сливовка"...

    весьма взрослых 40 - 45 объёмных процентов (градусов) крепости...

    тем самым музыканты как бы подсказывают нам внимательно относиться к прослушиванию данного диска, ибо удовольствие получаемое
    от его прослушивания сравнимо с распитием горячительных напитков в дружеской компании...

    как бы не захмелеть...

    а захмелеть я вам доложу есть от чего...

    это волшебное сочетание ритм-н-блюзовых энергичных ритмов с прелестной трансильванской фольклорной музыкальной культурой
    разгоняет кровь, ударяет в голову и заставляет просить продолжения банкета...

    музыканты отлично знакомы, как с местной музыкальной традицией (это чувствуется по виртуозному использованию национальных
    инструментов), так и с заокеанской музыкальной блюзовой культурой (выбор тем и та внимательность, которую они проявляют
    при своём аутентичном осмыслении их не оставляет в этом сомнений)...

    более того, уважаемые музыканты, похоже поймали ту трудноуловимую суть блюза, которая не лежит на поверхности, но доступна
    при некотором внимательном и осмысленном погружении в материал...

    суть эта есть понимание того, что делать свое дело необходимо виртуозно, талантливо и с огоньком, нос при этом не задирая,
    оставаясь двумя ногами на земле и несколько подтрунивая над собой и своими может иногда смелыми мыслями о том насколько
    они круты и что дескать Albert Hall их заждался...

    убедиться в этом вы сможете всего лишь внимательно рассмотрев вкладыши от диска в приложении...

    но довольно слов, пусть блюзовые скрипки говорят сами за себя...

    прошу считать это моим официальным подарком в честь очередного новогоднего праздника всем моим хорошим друзьям и знакомым...'
