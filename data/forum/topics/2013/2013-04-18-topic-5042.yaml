  text: "http://www.nga.ch/img/Montreux%20JF%202004/Clarence%20G.%20Brown/Clarence%20Gatemouth%20Brown_0044.jpg\n\nClarence \"Gatemouth\" Brown\nApril 18, 1924 — 2005\n\nзамечательный дядька...\nодин из любимейших и замечательнейших...\nбездна музыкального таланта...\nнеиссякаемый колодец оптимизма и жизнелюбия...\nюжная хитреца в глазах...\nавтобиографичные песни, по которым жизнеописание и характер героя рисуются в мельчайших подробностях...\nвся жизнь в пути...\nоб этом и...\n\nTraveling Mood Blues...\n\nSomebody lend me some money\nI want to buy me a one way ticket home\nSomebody lend me some money\nI want to buy a one way ticket home\nI’ve been gone twelve years\nI swear that’s gotta be too long \n\nHelp me somebody\nHelp me to make a new start in life\nHelp, help, help me somebody\nJust to make a new start in life\nI had bad luck once, Darling\nOh and I sure won’t let it happen twice"
