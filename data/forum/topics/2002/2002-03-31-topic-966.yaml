        text: 'Он погиб как настоящий рокер (и дурак) - в мотоциклетной аварии. Через год погиб их басист Берри Оукли при тех же обстоятельствах. К 73-му году они лишились двух важных участников коллектива, но тем не менее записали их лучший Brothers & Sisters.

          Их стиль - это что-то типа Hard Southern Country-Rock, не более того. А вот на сольных записях Дюэйна я слышал много блюза - это правда.'
