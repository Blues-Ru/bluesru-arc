    subject: Инфа есть на этом сайте
    deleted: false
    text: А детали могу подсказать позже, если появятся конкретные вопросы. Группа нужная, но неоднозначная. У Грега Оллмана (Allman с двумя L кстати) есть обалденные хиты - Midnight Rider, Whipping Post, например. Он прекрасный вокалист и органист, его покойный брат был хорошим гитаристом. В группе много народу и все на своем месте. К блюзу в чистом виде имеют очень далекое отношение, а к американской музыке прямое. Советую альбомы Eat A Peach, Sisters & Brothers.
