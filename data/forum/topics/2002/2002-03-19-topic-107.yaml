      deleted: false
      text: 'Угадать нельзя, кто хорошо выступит из монстров, а кто плохо. Последние концерты Ярдбердз и Yes - были просто великолепными! Если говорить о Deep Purple, то году в 93м на концерте Гилана играли тот же Дип Перпл другие музыканты, и все было зашибись, гораздо лучше, чем вчера настоящие.

        Вообще, проверять периодически надо, а то пропустишь хороший концерт. Лучше разок сходить на плохой, чем пропустить хороший ;)

        Кстати, вроде Блекмор по-отдельности должен приехать, стоит ли проверять, не знаю? ;)


        P.S. И не подумайте, что я фанат Дип Перпл ;) Лет 10 не слушал ни одной их пластинки.'
