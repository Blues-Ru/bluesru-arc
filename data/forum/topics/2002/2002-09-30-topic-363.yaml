        subject: Чисто технически дело так обстоит
        deleted: false
        text: "Чем же, собственно отличается этот инструмент от \"стандартной 6-струнной гитары\"? Чисто внешне почти ничем, кроме того, что все 6 струн на нем спарены и настроены в унисон. Присмотревшись ближе видно, что начиная с третьей струны все пары не одинаковые - одна струна в паре толще (как на шестиструнке), а другая гораздо тоньше и без обмотки. Сделано это для того, что бы струны в парах настраивались одна на октаву выше другой. Другими словами - эти пары настроены хоть и в унисон, но одна из струн на октаву выше другой. \n\nА теперь представьте на секунду какой при этом получается звук?! Объемный, мощный, почти такой как-будто играют два инструмента. \n\nСтроится 12-струнка так же как и ее 6-тиструнная сестричка. Естественно, учитывая то, что описано выше. \n\n\n1 струна - E (ми) - обе струны одинаково \n2 струна - B (си) - обе струны одинаково \n3 струна - G (соль) - тонкая на октаву выше толстой \n4 струна - D (рэ) - тонкая на октаву выше толстой \n5 струна - A (ля) - тонкая на октаву выше толстой \n6 струна - E (ми) - тонкая на октаву выше толстой."
