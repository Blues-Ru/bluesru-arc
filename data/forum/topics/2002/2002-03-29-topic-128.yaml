        deleted: false
        text: "Дима как человек нормально-ленивый не стал изобретать сложных алгоритмов, а избрал самый простой путь - все джемующие выходят ровно на две песни (кто-то играл три? пусть покается :) вне зависимости от всяких-прочих привходящих обстоятельств. \nНекоторые могут пожаловаться, что спонтанности стало меньше, джем стал больше похож на некоторую концертную программу...ну это уж кому что больше нравится. Надеюсь, что более речистые ораторы нашего форума разовьют эту тему: «Что лучше - порядок или стихийность?»"
        replies:
        - id: 3006
          parent_id: 3004
          date: 2002-03-30 01:08
          poster: Дима Казанцев (Dr. Nick)
          email: dr.nick@blues.ru
          subject: Цель одна - музыка
          deleted: false
          text: 'Хорошее или хотя бы приемлемое исполнение невозможно при стихийности и бардаке. Поэтому я выбрал порядок (относительный). Не надо забывать, что на джемы приходят обычные люди (слушатели), которым совсем неинтересно слушать лажу - они ведь еще и деньги за вход платят!

            Практика показала, что большинство выходящих на сцену порой просто хотят пошуметь и показать себя, а не принять участие в создании хорошей музыки. Мало кто знает, что такое баланс и динамика игры вообще из-за того, что никогда не играли в группах (приличных).

            Еще одна проблема в том, что никто не знает музыки толком и играя простейшие блюзы на гитаре или на харпе умудряются играть мимо или пресно и неинтересно. Еще один момент в том, что все блюзы абсолютно разные: аккорды, риффы, ритм, последовательность, turn-around, вступление, кода и т.д. Вот у меня такое впечатление, что выходя на сцену многие играют одно и то же во всех вещах, и это плохо, конечно.

            Потом, никто не поет по-человечески! Ну как же так? Блюз - это же пение прежде всего! Вот Вы ругаете Вову Русинова, но он хотя бы пытается! Возможно он выбрал слишком сложную вещь для себя, поэтому не катит. Пока не катит.

            Мы с Ветераном знаем тысячи песен (без вокала) и сотни с вокалом, неужели нельзя выйти на сцену и сказать: Окей, а давайте сыграем Come on into my kitchen, например. Нет же, все просто выходят попилить что-то. Вот Казачков выходил и играл две вещи, но играл их правильно и со знанием дела.

            Рома мог бы быть молодцом, но алкоголь и его нервная система - вещи несовместимые, поэтому начинается хулиганство и бардак; а ведь он может классно играть!

            Надеюсь никого не обидел, я просто высказал свое мнение - жду Ваших пожеланий.

            Дима.'
