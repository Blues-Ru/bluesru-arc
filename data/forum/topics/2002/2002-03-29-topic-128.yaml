        text: "Дело не только в том, громко она была или нет? (А была она громче всех остальных инструментов вместе взятых).\n1) У Казанцева группа с сыгранным, отрепетированным и аранжированным репертуаром, они прекрасно знают, где и что надо играть, когда тихо, а когда громко.\n2) Музыканты, которые выступают на джеме - либо из группы Казанцева, либо выходят на две песни по его специальному приглашению. \n3) Кац на Вермоне играл более-менее неплохо, но играл он 8 песен подряд НЕПРЕРЫВНО (причем, без приглашения). Солировал не тогда, когда ему скажут, а постоянно. Так нельзя делать ни в группе, ни на джеме. К примеру, выступает солист на гармошке или на гитаре, выдает гениальное соло, а Кац в воодушевлении выдает мощные аккорды одновременно. В результате, либо не слышно гитару из-за громкости, либо мешанина из звука. Какие конкретно ноты играет солист при этом тоже не слышно. Вся разница - каша чуть получше или чуть похуже.\n4) Привычка валить на звукооператора - стандартная отмазка для плохих музыкантов. ;)) Что-то больно часто на него там ругаются, а ведь звукооператор работал более-менее. ;) Гораздо важнее бардачный фактор и все такое.\n5) И больше человеческое спасибо Казанцеву и Ко за качественную игру! ;)"
