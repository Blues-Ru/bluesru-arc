  text: "Внимание!\nВозможно, на концерты придет много народу, поэтому кто-то теоретически\
    \ может не попасть. Чтобы каждый по-отдельности не занимался утомительным резервированием\
    \ столиков, я предлагаю составить некоторые списки в каждый клуб, куда занести\
    \ фамилии желающих пойти. Эти списки я заранее передам в клубы, чтобы места были\
    \ зарезервированы. Итого, \n1) Присылайте мне свое имя и фамилию, если вы точно\
    \ знаете, что пойдете в конкретный день\n2) Своих спутников лучше тоже поименовать,\
    \ ибо если писать Вася+5 человек, из которых придет потом 2, возникнет путаница.\
    \ Лучше - поименно.\n3) Пишите, если вы точно знаете, что пойдете.\n4) Список\
    \ не для бесплатного прохода. Билеты в Форте и в ЛеКлуб будут стоить 300 рублей,\
    \ в БиБиКинг - 200 рублей. В БиБиКинге будет укороченный концерт, поэтому постарайтесь\
    \ сходить ТАКЖЕ в какой-нибудь из первых двух клубов, где будет специально кропотливо\
    \ настроен звук и все-такое. (Я, к примеру, пошел бы на все 10 концертов, если\
    \ бы их было 10).\n5) Сгруппируйте фамилии в компании, чтобы вас посадили рядом.\n\
    Посылайте все это мне на fedor@blues.ru."
