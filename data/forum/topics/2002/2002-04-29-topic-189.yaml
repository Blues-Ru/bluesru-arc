  text: 'Привет всем!


    Куча народу с этого форума продолжает жаловаться друг-другу на рассылку вирусов.
    Сейчас в интернете повальная эпидемия вируса Klez.h, он собирает по ходу адреса
    из адресных книг, выбирает пару собранных адресов и посылает себя по первому от
    имени второго. Если я получаю отлупы и сообщения о том, что с моего адреса был
    послан вирус, это может означать две вещи: либо я заражен, либо мой приятель,
    у которого я в адресной книге. В любом случае, абсолютно необходимо:

    1) еще раз провериться. Для этого можно использовать освеженный (!) антивирус
    или бесплатную утилиту от Касперского против Клеза.

    ftp://ftp.kaspersky.ru/utils/clrav.com

    У этой утилиты есть дополнительный ключик /scanfiles, чтобы проверять все исполняемые
    файлы.


    2) Поставьте патч от Микрософта, чтобы больше не заражаться через IFRAME дыру
    в OE5.0 и OE5.5.

    http://www.microsoft.com/windows/ie/downloads/critical/q290108/default.asp

    Пожалуйста, не поленитесь!'
