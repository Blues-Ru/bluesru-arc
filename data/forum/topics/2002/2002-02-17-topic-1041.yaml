    deleted: false
    text: 'Знаете, если Тадж Махал - блюз - то я, простите, трамвай в канаве... Сейчас, "ваще-та", блюза как такового нет. Из живых уже нет "блюзовиков" чистой воды. А из уже, к сожалению, не живых, были ведь и тот же "Муди Ватерс", и Вильямсы, Слепые Лимоны, и Калоши, и Воющие Волки с Молниями Хопкинсами... Это, может, ностальгия "Дедушки Бифа", но послушав My Starter Won`t Start `Dis Mornin` я уже не могу после этого сразу перескакивать "на как-бы блюз" Клэптона или, упаси бог, на какого-нить Болтона, или САМОГО-ВЕЛИКОГО-И-ЧЁРНОГО-БЛЮЗМЕНА-ROY-BUCHANAN. Кстати, на новом альбоме рок-н-ролльной группы Omar And The Howlers - Big Delta есть Linin` Track - это к теме об истоках блюза.

      Инфа об альбоме - Provogue Records, палёнка, лейбл - Moscot (c)2001'
