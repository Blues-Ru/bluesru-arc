    text: 'на нас как то в году 96 на концерте блюз ритм секшен в бедных людях наехали татарские бандюки какие-то, сидевшие в соседнем зале.

      подходит из зала какой то их шестера, говорит: я эти рокенролы ваши ..уйню-муйню сам могу, давай пой нам татарские песни.

      там был никольский константин - говорит: ребята, нормально, я щас "музыканта" спою - отстанут, но эти не удовлетворились музыкантом.

      на наше счастье в зале оказался какой то большой человек с женщиной, джазовой певицей вроде, которая нас попросила сыграть аккомпанимент,

      она села за рояль, начала играть и тут к ней этот браток подваливает и с понтами пальцует, а ты мол и петь могешь? она видно знает толк в таком общении, прошептала ему на ухо буквально два слова, крендель изменился в лице и сразу пропал, потом больше никто не отсвечивал.

      братецкий не даст соврать.


      хотел бы я знать эти слова.'
