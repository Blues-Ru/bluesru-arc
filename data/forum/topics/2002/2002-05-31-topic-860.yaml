            text: "Именно попсовинки-то в ней и не хватает. Есть у нее условно два блюзовых альбома: \nhttp://www.allmusic.com/cg/amg.dll?p=amg&sql=Aljhxlffegcqt\nhttp://www.allmusic.com/cg/amg.dll?p=amg&sql=A1rfqoalauijb\nВообще у нее все альбомы грустные, тяжелые, блюзово-джазовые, так что цепляния там не ищи - это из поп-музыки. У нее слишком трагичная позиция и подача и этим она отличается от попсовых джазовых певиц. У меня (и моей подруги) есть 5 ее альбомов, если тебе интересно. Они жутко дорогие, почему-то."
