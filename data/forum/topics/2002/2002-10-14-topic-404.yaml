            text: "...однозначно пора открывать еще и технический форум, Федь, переплюнем ixbt :)))\nУважаемый dz, Вы конечно\
              \ правы отчасти, ибо читали \"принципы записи на сиди\" (кстати где и какие?). Но хочется Вам заметить, что\
              \ обрисованная Вами ситуация отношений \"дырочки\" и \"ЦАПа\" за счет \"фронтов\" действительно не имеет актуальности,\
              \ и это в общем-то не обсуждалось. Актуальна погрешность считывания блока с носителя и неточное восстановление\
              \ кода, которое в итоге уже действительно влияет на ЦАП, т.к. произошла потеря информации. Причина этой погрешности\
              \ как и в качестве носителя, так и в качестве сделаной записи на носителе и в качестве оптической системы позиционирования/считывания.\
              \ В стандарте аудио-КД используется двухуровневый перекрестно-перемежающийся код Рида-Соломона, который имеет\
              \ избыточность около 25% и позволяет при этом корректировать до 2-х ошибочных байтов (в некоторых редких случаях\
              \ до 4-х, при том, что в блоке 24 байта полезной информации, т.е. по 6 отсчетов каждого канала), для этого в\
              \ коде применяется разное перемежение - С1 и C2 - для коррекции одиночных и групповых ошибок соответственно.\
              \ Так вот это о том, что код не идеален и не всегда происходит полное восстановление информации. Соотв. ошибка\
              \ попадает дальше, и как правило \"всплывает\" в виде реального нелинейного искажения.\nЛюбой радиогубитель..\
              \ простите - радиолюбитель, способный обращаться с осциллографом и паяльником и не побоявшийся разобрать свой\
              \ драгоценный си-ди транспорт, может пронаблюдать работу маааленькой микросхемки в транспорте, отвечающей за\
              \ коррекцию по коду (у неё есть сигнальная \"нога\" наличия ошибки). Уверяю, что будет масса удивлений и разочарований\
              \ при наблюдении процесса считывания \"идеального\" диска и наличия неисправимых потерь информации... А тут\
              \ еще, в случае компьютерного привода, надо учесть отсутствие у большинства транспортов метода коррекции C2.\
              \ \nА я вам еще \"подолью\" о cd-rom'ных неточностях при считывании аудио без встроенного механизма \"overlapping'а\"\
              \ (программного или хардварного) - это уже \"логический\" джиттер, по причине  неспособности четкого  позиционирования\
              \ на начало блока данных (все видели опцию \"Jitter Correction\" во многих программах-писалках аудио-дисков\
              \ - вот она и борется с этим \"недугом\" некоторых приводов).\nСвоим длинным постингом (уж извините) я хотел\
              \ лишь сказать о сложности проблемы и ее \"многоступенчатости\", которую полезно знать дабы не кричать голословно\
              \ \"что цифра и в Африке цифра\"... И последнее, о пользе \"чтения\" - начитавшись Красную Книгу еще невозможно\
              \ сконструировать граммотный аппарат, нужно еще многого прочесть, а главное поиметь опыт разработчика, который\
              \ открывает куда больше интересного, чем \"стандарты\" и \"книги\"...\nИзвините за оффтопик и прошу никого не\
              \ обижаться."
