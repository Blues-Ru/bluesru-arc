  text: 'Иногда переписываю (на CD-RW) музыкальные диски на болванки. Естесно, блюз, ничего другого уже скоро год просто не
    слушаю. (Не для тиражирования, конечно, а токма для себя и близких друзей).

    По рекомендации компьт. специалистов на работе, раньше всегда при перезаписи "пользовался" скоростью 4*1, т.е. диск 60
    мин. перекатывал за 15. Так быстрее. Но тут как-то сравнил оригинал и копию, и мне показалось, что копия чуть-чуть-чуть
    глуше что ли. (Может, только показалось). Музыкальным слухом не обладаю, но хорошее качество записи очень уважаю. И отношусь
    к нему трепетно.

    Хочу спросить у специалистов, теряется ли качество звука при копировании музыкального (не MPeg3) диска на CD-RW на скорости
    4*1 или 2*1? И если теряется, то чувствуется ли это "на музыкальный слух"?

    Благодарю за ответ.'
