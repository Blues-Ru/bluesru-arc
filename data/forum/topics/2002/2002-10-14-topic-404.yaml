      deleted: false
      text: 'А ты сам-то какую музыку любишь на виниле слушать?

        И на каком хаенде?

        Вот Стили Дэн, например, великолепно звучит! Кёртиса Мэйфилда надо только на виниле (но вот дорого и нет нигде). Блюз
        на виниле много лучше вообще; особенно ранние записи в акустику.

