                text: "Предлагаю эксперимент для слухачей. Берем несколько родных дисков, копируем на нормальную болванку.\
                  \ Сравниваем побайтно. Завязываем эксперту глаза, а дальше случайно вставляем вперемежку разные места из\
                  \ копий и оригиналов. Каждый раз спрашиваем, что это - копия и оригинал, а ответ, и то, что было на самом\
                  \ деле, записываем на бумажку. Делаем 30 тестов. Дальше считаем количество угадываний и ошибок. \nУверяю\
                  \ тебя, что количество правильных ответов будет 50% +- среднеквадратичное отклонение, которое можно прикинуть,\
                  \ открыв первую страницу учебника по теории вероятностей."
