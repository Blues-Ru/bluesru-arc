      replies:
      - id: 8275
        parent_id: 8252
        date: 2002-10-16 16:19
        poster: КотМатраскин
        email: kotmatrs@mail.ru
        subject: Ответ Кота
        deleted: false
        text: 'Увы, я после 8 переезда, даже не стал вынимать вертушку из ящика. Ну и кронштейны к стене где-то уже в обломках.
          Hi-End ом перестал заниматся году в 96, а до того, делал весь аппарат сам (ламповые усилители, ламповые же корректоры,
          даже алмазную иглу сам затачивал по необходимой кривой, благо технологии фирмы где я работал позволяли)

          Сейчас винил совсем не слушаю. Впрочем, и СиДи - тоже. Телевизор без антены и радио нет.

          Мониторы - заказные и доработанные. Не удовлетворяют. Усилитель сейчас самодельный, что-то на основе Quod 405, но
          сильно переработанного. Уши - Beerdinamic 990 - открытые, классика для сведения.

          Слушаю мало и редко. Даже в отпуск когда уезжал, искал место где не было бы ни одного радиоприемника и человека
          с гитарой.'
        replies:
        - id: 8290
          parent_id: 8275
          date: 2002-10-17 15:43
          poster: KotMatrs
          email: kotmatrs@mail.ru
          subject: Еще один ответ Кота
          deleted: false
          text: "Кстати, а вот почему я не слушаю...\nЯ считаю, что многоканальная запись сильно понизила класс музыкантов\
            \ и кайф от записей. Раньше как. Вот слушаю я Эллу Фитдеральд с Джо Пассом, слышу понятно дело все \"неровности\"\
            , думаю, эх блин, вот этот пассажик бы переписать, ну и т.д. А ведь как писали. Прямая запись на диск (восковую\
            \ матрицу), если лажали криминально - меняли всю матрицу (100 баков, по тем временам деньги немалые), если лажали\
            \ в 8 песне, переписывали все с начала. В результате, к студии - готовились, репетировали и форму отрабатывали,\
            \ а если и джемовали, так умели это делать абсолютно в кассу.\nА сейчас... Ну, не получилось - переписали, а то\
            \ еще хуже - подправили на компе. В результате - энергитическая несовместность участников записи (а еще хуже,\
            \ когда кто-нибудь играет сам с собой). \nСовременная звукозапись - сильно понизила класс музыкантов, современное\
            \ звукоусиление - класс вокалистов (безголосые поют, а микрофонами вытягивают), а следовательно и не надо ставить\
            \ правильно голос (на опору, чтобы залы пробивать), ну и т.д.\nКроме того, все современные пульты не умеют работать\
            \ с фазой звука, и делают панорамирование неправильно! И самое ужастное, что люди уже привыкли к этой самой, неправильной\
            \ сереобазе, и не желают слушать настоящий кайфовый, живой звук!\nПотому и предпочитаю я слушать старых мастеров.\
            \ А когда достает вся эта синтетика, иду на какой-нибудь кайфовый концерт (вот, к тому же Аграновскому на джем,\
            \ или еще к кому, а то и просто, забегает ко мне на чай какой-нибудь хороший гитарист поорать в микрофон...:-)),\
            \ и оттягиваюсь по полной программе, без всяких заморочек с вывешиванием вертушки и заточек иголок."
          replies:
          - id: 8293
            parent_id: 8290
            date: 2002-10-17 16:41
            poster: Дима Казанцев (Dr. Nick)
            email: dr.nick@blues.ru
            subject: Ну все верно
