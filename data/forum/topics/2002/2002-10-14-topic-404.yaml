                subject: открою тайну :)
                deleted: false
                text: 'Ошибки при считывании диска в транспорте есть ВСЕГДА! Но есть заложенные механизмы коррекции этих ошибок
                  (они называются по уровню сложности метода обнаружения и коррекции - С1, С2...) и как правило незначительное
                  количество ошибок легко корректируются. В эти механизмы коррекции заложено не только повторное считывание,
                  но и логические методы коррекции - восстановление по коду и, как самая крайность, интерполяция сигнала.
                  Для оценки степени "ошибочности" считывания существует такой параметр, как BLER (Block Error Rate) - это
                  средняя частота блочной ошибки, именно по нему оценивают качество транспорта (его способность "безошибочного"
                  считывания) и качество носителей. Кстати наличие специальных аудио-болванок отнюдь не профанация - действительно
                  в зависимости от транспорта (точности лазерной системы), болванки производятся с разным отражающим слоем,
                  который непосредственно влияет на BLER. Аудио-транспорт со своей считывающей системой отнюдь не универсален
                  в отличии от компьютерного привода, и четко ориентированная длина волна лазерной головки служит препятствием
                  порой для чтения разного рода болванок с ухудшенными показателями BLER. Вот откуда парадокс - дорогущий
                  транспорт, не читающий обычные CD-R, и наоборот - дешевка, читающая все подряд.

                  И наконец, любой специалист скажет, что необходимо подходить комплексно к вопросу организации звукового
                  тракта - даже при идеальном транспорте сигнал идет дальше по цепям, где с ним могут происходить разные вещи,
                  как Фёдор правильно заметил - в том числе и "джиттер" при передачи данных, поэтому разница в звуке естественно
                  будет - ведь так много переменнных составляющих еще после хай-энд транспорта, включая нелинейные мозги слушателя,
                  внимающего звуковым колебаниям, получившимся в итоге путешествия сигнала по цепям... :)'
