              email: fedor@blues.ru
              subject: Разница
              deleted: false
              text: 'В первую очередь, разница психологическая. Во-вторую, при переписи может возникнуть несколько ошибок
                в битах на грязных и плохо записанных местах. Если переписывать несколько раз, то такие ошибки будут накапливаться.
                Если постараться, то их не будет. В любом случае, они носят локальный характер, а не равномерное ухудшение
                звука. При записи плохой писалкой на плохую болванку дорожки будут неустойчивыми, что приведет вообще к невозможности
                прочитать блок, что может привести к подобию щелчок, которые должен пытаться сгладить транспорт. У меня пару
                раз было, что CD Changer в машине скакал на плохо записанной болванке, а односкоростной - вроде бы проигрывал,
                хотя, возможно, похуже.

                Качество транспорта выражается в сложности внутренней математики по восстановлению ошибок (если они есть!),
                стабилизации, чтобы избежать тряски, которая может привести к возникновению ошибок на нестабильной дорожке
                (если они есть!), качестве внутреннего ЦАП, качестве передачи цифры по оптоволокну, работе ЦАП на высоких
                частотах, отсутствие шумов на аналоговых схемах после ЦАП и пр. При цифровом чтении CD при копировании все
                эти достоинства не задействуются.'
