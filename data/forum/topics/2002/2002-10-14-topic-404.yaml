          text: "2Дима & Кот\nОх, приходится как Ленину бабушек отучать от предрассудков. \nЕсли повнимательней прочитать\
            \ про то, что такое джиттер, то таких идей не возникает. Джиттер - это непопадание аналогового фронта в цифровом\
            \ проводе (без параллельной синхры на каждый бит) на отсчеты тактового генератора частоты принимающей стороны.\
            \ Вполне понятное и неприятное явление. Оно проявляется только, если ты из своего хайэнд транспорта передаешь\
            \ цифру в свой хай энд ЦАП по оптоволокну. Или если ты используешь цифровой проводной интерфейс типа S/PDIF. А\
            \ если ты со своего говеного CD-рома за 40 баксов передаешь по IDE шине на свою говеную звуковую карту за 20,\
            \ то ни о каком джиттере не может быть и речи! Там другие принципы, информация передается блоками, как с винчестера.\
            \ А если у тебя был бы \"джиттер\" в цифровых данных на винчестере, то ты бы не писал со своего компьютера в этот\
            \ форум.\nГлавная проблема при копировании CD такая - из-за некачественной болванки или большой скорости биты\
            \ (в цифровом понимании - 0 или 1, а не смещение по времени, там такого понятия нет) копируются неточно (т.е.\
            \ если переписать на бумажку их значение, то будет отличие от оригинала), ибо нет ECC - контрольной восстанавливающей\
            \ суммы, как на CD-ROM, а надежность CDROM - не безумная. Но наличие таких ошибок как раз тривиально контролируется\
            \ упомянутым выше способом - грабим исходный диск и результат в wav файл, и проверяем - есть ли отличия с помощью\
            \ побайтового сравнения. Если писать не очень быстро, не царапать диск и использовать не самые плохие болванки,\
            \ то отличий, как правило, ни в одном бите не будет!!! Т.е. весь вопрос в количестве таких ошибок. Также бывает\
            \ на хреновых болванках невозможность считать нестабильный блок, что приводит к пропуску малой доли секунды и,\
            \ соответственно, к щелчку или чему-то еще (в зависимости от качества CD-привода). Но в нормальных современных\
            \ условиях такого не бывает.\nНу а теперь, если ты не очень знаком с цифровой техникой, то расскажу, как происходит\
            \ проигрывание. Сначала блок примерно на 2 килобайта зачитывается в буфер в памяти, а потом он совершенно независимым\
            \ от привода ЦАП со своим генератором частоты воспроизводится в аналоговый сигнал. Если при чтении оригинала и\
            \ копии в буфере оказались одинаковые байтики, то результат проигрывания будем идентичным! А тот же буфер используется\
            \ для DAE, поэтому, если сравнение wav файлов не дает разницы, то это означет, что в этом буфере именно были одинаковые\
            \ байтики, а результат воспроизведения будет идентичным для любого слухача с любым суперкачественным ухом.\nВот\
            \ такие дела... Многим аудиофилам нужно разбираться не со слухом, а со своей психологией. ;))\nПро винил по сравнению\
            \ с CD другая песня - на небольшой громкости теряется разрешение, а также происходит огрубление при оцифровке\
            \ высоких частот, вплоть до невозможности адекватно воспроизвести частоты выше некоторого предела. Эти проблемы\
            \ легко лечатся увеличением битности и частоты дискретизации в других форматах. У mp3 проблемы другого рода -\
            \ преобразование фурье + обрезание точности. Если не сжимать, то такой проблемы нет. Но для большинства нормальных\
            \ людей достаточно CD качества, если они слушают не звуки на частоте, а саму музыку. Я совершенно не отрицаю возможности\
            \ получения какого-то специального удовольствия от супер-качественного звука, но это удел небольшой части людей,\
            \ которых это интересует. И любовь к идеалу в звуке (за пределами 16 килогерц), как мне кажется, не безумно кореллирует\
            \ с пониманием и любовью к музыке. Это как марки собирать. Клево, но для всех - необязательно."
