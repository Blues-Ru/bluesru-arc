          text: 'Справка.


            Выдана любому желающему в том, что любой (ЛЮБОЙ! Даже за 30 баков!) проигрыватель компакт-дисков сначала зачитывает
            двоичный поток в память, потом его там раскодирует, а потом воспроизводит полученный "вав-файл" ИЗ ПА-МЯ-ТИ. Пользуясь
            для этого КВАР-ЦО-ВАН-НОЙ опорной частотой. И потому качество прожжённой дырочки ему ПО *У-Ю. АБ-СО-ЛЮТ-НО. Фронты
            сигнала считывания питов не достигают ЦАП-а ни при каких условиях, и джиттер этих фронтов - до балды.


            А описанное выше распространяют люди, не читавшие описание принципа записи на сиди. Или читавшие, но непонявшие.
            Или понявшие, но не так.


            Ежли кто не верит - то пусть сам прочтёт, найти несложно.


            О копировании компакт-дисков.


            Вопрос ровно один - правильно ли вы прочли оригинал. (Бит ли в бит, или с ошибками.) Если правильно - то копия
            будет (теоретически) неотличима.


            Есть, однако, интересная теория, которая непротиворечиво объясняет возможные отличия в звучании дисков, бит в
            бит совпадающих по двоичному содержанию. Теория эта гласит, что неровно (нечёткие питы, некруглая дорожка, etc)
            записанные или изготовленные диски (болванки) заставляют очень активно работать систему "наведения" считывающего
            лазера, и помехи от бурной активности "наводящих" схем через плохо сделанное питание проникают в сигнал. И - натурально
            - портят его тем больше, чем хуже диск.


            Вот это - ещё хоть сколько-то вероятно. А про джиттер от неровных питов - не верьте, гражданин Кот. Брешут-с сдуру.'
