      а новое, принципиально отличное в таком составе сделать трудно. Если МСО "все еще великолепен", то это значит, что они
      еще неплохо держатся. ;)

      Что касается степени оффтопичности - отдельные блюзы у них есть, правда, в соответствующей аранжировке. Ну и этого вполне
      достаточно, чтобы вешать на блюз.ру. Оффбит вполне на грани попадания на блюз.ру, если запишет несколько блюзов, а не
      только рок-н-роллов. Фонограф и Мэрилэнд я почти не слышал, но догадываюсь ;))

      Ну а так, Мишурис - очень хорошее музыкальное развлечение, особенно, если не в безумных количествах. Нельзя не отметить,
      что способности у отдельных музыкантов - вполне выдающиеся.'
