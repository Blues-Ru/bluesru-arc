                              \ Выбирай - сидеть в шорах и исходить желчью, или смотреть на вещи свободно и получать удовольствие\
                              \ от того, что есть? \nМне нравится эта наша (местного форума) стремление переходить на гамбурский\
                              \ счет. Успокойтесь, малыши, по гамбурскому (точнее, миссиссипскому) счету здесь воообще НИКТО\
                              \ блюз по-настоящему не играет. Зато может других поучить (а вот эта реплика, ребята, имеет\
                              \ вполне конкретных адресатов). И телега Жука про шляпы на фестивале Блюз-Ру была по духу самым\
                              \ блюзовым местом фестиваля. Вторым (по близости духу, а не качеству музыки, к сожалению) было\
                              \ выступление Серебряного рубля. а далее в реестре - сплошные гитарные запилы.\n\nмелким шрифтом:\
                              \ Федор, вот ты ДК попрекаешь, что он Регтайм не слышал, а судит. А я лично слышал замечательную\
                              \ полуакустическую программу Станции Мир на английском языке: это была очень хорошая программа!"
