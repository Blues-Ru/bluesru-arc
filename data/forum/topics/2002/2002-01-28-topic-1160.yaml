  text: '1. Абсолютно правильно написано в разделе ''Российский блюз / Mishouris & His Swinging Orchestra'' про "самоценность
    голоса в блюзе в противоположность обилию поющих гитаристов" применительно к М.Мишурису, ибо, действительно, на московской
    R&R-блюзовой сцене помимо него и Н.Арутюнова (временно(?) отсутствующего) качественных вокалистов нет. Вряд ли кто-либо,
    кроме них, рискнёт петь ''a capella'', да ещё и "гуляя" среди слушателей. Примерно такая же, если не хуже, картина и в
    женской половине.) Однако, ни в коем разе не желая принизить заслуги и талант Мишуриса & Co, на мой взгляд, в выступлении
    последних с каждым разом (Фестиваль "Блюз.Ру-2001"(апр.2001), "Толстый Мо"(окт.2001) и вот, теперь "Forte"(янв.2002))
    с каждым разом присутствует всё больше элементов ШОУ, какого-то элемента ресторанной балаганности. Конечно, стиль обязывает,
    но всё же... Как правило, (по моему личному слушательскому и не только опыту) именно это является предтечей ухудшения
    качества и уровня исполнения. Впрочем, пока что MSO просто великолепен!


    2. Фёдору и другим: Я прекрасно отношусь к тому смешению стилей, в котором играют М.Мишурис со своим свингующим оркестром,
    к джазу, рокабилли и т.п., однако, MSO - явно оффтопик на сайте Блюз.Ру. Блюза там меньше, чем чего-либо другого, а, скорее,
    практически нет... Почему бы в таком случае в список "Российских музыкантов" не включить "Офф Бит" Дениса Мажукова, "Фонограф"
    Сергея Жилина или "Marylend" Маши Кац? По-моему, вполне провокационный вопрос, а?! ;)))


    ЗЫ. Если это не делается из соображений авторских прав или каких-либо причин личного характера, то вопрос снимается.'
