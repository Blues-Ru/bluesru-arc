                  \ результата, но в весьма ограниченых пределах. Т.е. средний наш музыкант в столовой сыграет чуть похуже,\
                  \ а в музыкальном салоне - чуть получше. Но супер-пупер блюзовая точка из него гения не сделает. \nТак что\
                  \ разговоры, что блюз творится в одних стенах, а в других - только коммерция, меня не впечатляют. Играют\
