                              subject: Станция Мир
                              deleted: false
                              text: 'Напишу свое откровенное мнение по поводу этой группы, надеюсь, что они не прочитают.

                                Играть они умеют, а Жук, если захочет - может что-то нетривиальное выдать на своей гитаре.
                                Я его, помнится, и раньше хвалил за это дело. На фестивале гармошечников они играли почти
                                лучше всех остальных (хотя, тоже слабый комплимент, если честно). Совершенно допускаю наличие
                                хорошей программы на английском языке. Они могут, если захотят, конечно...

                                Но, по моему личному ощущению, весь этот балаган с русским языком и манерой выступления -
                                грубость в чистом виде. Меня, честно говоря, это коробит. Не в том высоком смысле, что блюзмен
                                отличается прямотой слога и часто у него песни про "это", к примеру, напрямую или иносказательно
                                (Wand Dang Doodle all night long). А в том смысле, в котором меня, например, коробит группа
                                Лесоповал, если я ее буду внимательно слушать. Это касается не только текста - время от времени
                                все начинает звучать очень криво, а им это по-фигу, их это заводит. Судя по всему, возведено
                                в принцип следующее утверждение - если мне (Жуку, например) нравится и катит, то трава не
                                расти, все по-фигу, в частности - эстетские претензии. Ритм секция лажает 5 песен подряд -
                                по-фигу, я сам круто на гитаре поиграю. Кому-то из зрителей это тоже нравится, поэтому имеет
                                право на существование (как и любая попса, к примеру). А вот мне без содрогания слушать трудно
                                - удар по моей трепетной эстетствующей натуре. Вот лично мое ощущение.

                                Не думаю, что стоит продолжать тему. Если кто-то из К&Ж прочитает, лучше сделайте вид, что
                                не читали. Все целее будут.


                                С приветом, Федор'
