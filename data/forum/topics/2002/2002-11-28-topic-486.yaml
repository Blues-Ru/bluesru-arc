  text: "Значит так: все собираемся в клубе БиБиКинг, в воскресенье, часов в 7, пьём, базарим, джемуем. Так вот, неожиданно захотелось мне отметить давно подкатывавший юбилей. Приглашаются все друзья и враги (и те и другие с условием беззлобствования), знакомые и незнакомые. Категорическое требование быть Бирюкову и Цыганкову, Пикейным жилетам и Старому майору - устроим, как было в школе, зараз день рождения всем ноябрьским! Не придете - обижусь. Понимаю, некоторым в понедельник на работу, ну так и собираемся не поздно. \nИграть будет Жук-Кожекин со товарищи. Желающие поджемуют, нежелающие выпьют и возжелают, я так думаю. :)\nПредложение касается всех блюзруевцев. Только чтобы не налететь на 100руб за вход, нужно послать мне письмо о своем намерении - тогда ваша фамилия (а хотите, ник или погоняло) окажется в гостевом списке."
