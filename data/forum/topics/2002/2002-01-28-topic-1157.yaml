  text: 'Друзья,

    обнаружил кассету у себя с записью Earl Hooker ''Two Bugs And A Roach'' 1968.
    Сто лет не слушал ее (вообще кассеты давно не слушал) и обрадовался Эрлу ужасно.
    Музыка великолепная и абсолютно самобытная. ''Anna Lee'' - выше всяких похвал!

    Есть ли у кого еще что-нибудь от этого Хукера? Какие годы? Напишите, а то очень
    хочу начать его покупать, но надо понять с чего начать.

    Дима.'
