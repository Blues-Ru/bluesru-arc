  text: Cидел вот и слушал радио - Эхо Москвы и Маяк и было так грустновато и тоскливо.Почему
    на католическое рождество так как-то романтично и не грустно,а на православное
    рождество как-то сухо-казенно и тоскливо,да и на Новый год немногим лучше.Люди
    в основном как-то бездарно наедаются и нажираются,при этом часто глупеют и тупеют.В
    Америке же играют оркестры Армии Спасения,уличные блюзмены и джазмены-негры с
    ними конкурируют.Cоздается такой романтичный флер вокруг вакханалии покупок.А
    ЧТО играют!Госпел и спиричуэлс,блюзы.Чего стоят хотя бы Когда святые марщируют  и
    т.д.А ведь это негры внесли такую земную теплоту и радость в холодно-отстраненные
    католические и протестантские белые религиозные мотивы.В православии же нет в
    отличие от протестантизма даже музыкального инструмента,как орган,что существенно
    обедняет музыкальную часть.Это отмечал и академик Раушенбах,немец по национальности,принявший
    православие.Знакомая из Германии,посмотрев сцену баптистского негритянского богослужения
    из моего любимого культового фильма Братья Блюз 2000 с Сэмом Мором и Джеймсом
    Брауном ,сказала - Так и хочется верить в Бога! Обидно и досадно,блин.Вот где
    хорошо-то на Рождество!Извините за оффтопик и ежели что нетак.Всех поздравляю
    с сейчашним Рождеством,желаю Удачи и Здоровья!
