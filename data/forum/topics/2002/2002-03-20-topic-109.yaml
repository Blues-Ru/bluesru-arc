    text: "Первое ИМХО - к реальному Томми Джонсону персонаж КТК в фильме отношение имеет никакое, скорее это Роберт Джонсон, а вообще-то просто собирательный образ блюзмена 20-30х гг.\n\nВторое ИМХО - фильм, как практически любой фильм братьев Коэнов, с весьма специфическим чувством юмора, и либо нравится, либо вызывает отторжение, третьего не дано. Совершенно согласен, что смотреть желательно в оригинале, язык там имеет первостепенное значение. Один дед на дрезине чего стоит. \nБрата не стоит рассматривать как блюзовый фильм, тем паче что в основном там звучит блю-грасс и проч. кантри. \n\nТретье ИМХО - новую пластинку пока не слышал, но опять-таки к реальному Т.Джонсону практически никакого отношения не имеет (за исключением Canned Heat Blues), поскольку большая часть песен там собственного сочинения (Есть еще один кавер Вилли ДЖонсона). Более того, на обложке КТК сидит в позе известного фото Р.Джонсона. Скорее всего пластинка представляет собой попытку осмысления всей истории блюза 20 века (подзаголовок недвусмысленный - Genesis. 1900-1990's).\nПрактически все партии исполнены самим КТК.\n\nЧетвертое ИМХО - два предыдущих сольника Red Mud & Me, My Guitar and the Blues слушаю частенько и с удовольствием. Нравится, как понравилось и выступление на Эфесе.\n\nДебютный диск 86 года не покатил. Больно все электрическое, стандартное и неинтересное."
