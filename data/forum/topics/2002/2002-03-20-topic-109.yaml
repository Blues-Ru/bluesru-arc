              text: знатоки творчества героя всё равно остнутся недовольны, а прочая публика мало что поймёт. Лучше уж как Cotton Club. Хорошее кино, а кто там на самом деле этот Дикси Дуайер - Беше, Тигарден или кто другой - не так уж важно
