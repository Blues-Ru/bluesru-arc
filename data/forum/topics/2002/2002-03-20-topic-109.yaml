              subject: Винегрет - верное определение
              deleted: false
              text: "Основной картошкой в нём послужил давний фильм Джармуша Down by Law а петрушкой Одиссея. Основная беда - слабая драматургия. Есть нарушения изобразительной стилистики, например девки в речке явно не из этого кина. Понятно, что не документальный, и не закос под документальность, а вовсе даже лубок. Если бы не девки и ещё пара моментов лубок довольно качественный (опять же с точки зрения изобразительной стилистики). \n\nНесмотря на это смотрел с удовольствием. Равно как и ещё более бестолковые Карты, деньги... потому что без перевода. Очень уж сильные\nу них dialog coaches (у нас то никаких нет). Эка заствали тормоза Клуни тараторить. Так что выходит не столько смотрел, сколько слушал.\n\nНу и диаболических металлистов в финале нет ;) большой плюс\n\nКрис Томас Кинг в том кине хорош по срвнению с собственными портретами на обложках дисков. Там рэппер какой-то что-ли и даже не очень колоритный.\n\nА постмодернизм тут на полную катушку. Как учат нас разделы о культуре журналов Деньги и Власть, постмодернизм - это искусство, предметом которого является искусство (за что купил, за то продаю. в энциклопедию не лазил). Так что если этот самый Крис представил себе, что он как бы Томми Джонсон и записал альбом, это вам не передвижники с импрессионистами замшелые, а самый что ни на есть постмодернизм.\n\nНе попортил хоть, кто-нибудь слышал?"
