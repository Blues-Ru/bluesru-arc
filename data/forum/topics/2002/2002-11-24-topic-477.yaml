                text: 'Субъективно (изнутри хуже видно) мне понравилось. Вернее, понравились некоторые выступления. Упоминаю: I Am a Man с переходом на Third Stone from the Sun (фамилию гитариста не называю, чтобы не навлечь хулителей его...) Bold As Love  исполнении Вани Жука (он принес ноты вещи, дал нашему басисту, и они сыграли ее с колес; Серегин потом сказал, что получилась "прелесть вещичка" - а он человек желчный). Версия Bleeding Heart с акустическим вступлением (гитариста опять не называю, дабы не навлечь обвинений во всем). Кораблин с Охтовым. Но им, конечно надо было бы побольше номеров исполнить, разыграться (что в тех условиях невозможно). Пишу в некоторой спешке (пора в Вудсток).

                  Спасибо всем, чуваки!

                  P.S. Кое-что не понравилось. Пример: За 20 минут до конца джема на сцену входит юноша и заявляет, что он здесь поставил свой комбик и будет на нем играть. Оказывается, он привез свой аппаратик за полчаса до начала и ушел куда-то. На джем не записался. Понять то, что в джеме участвуют не те, кто поставил на сцену оборудование, а кто записался и договорился с хаус-бэндом, он был явно не в состоянии. Некрасиво и смешно.'
