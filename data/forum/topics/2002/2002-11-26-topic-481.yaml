  text: "У нас есть раздел объявлений, который устроен по принципу пост-модерирования и отличается минимальной попыткой структуризовать информацию. У меня не всегда хватает времени, чтобы проверять и форматировать новые объявления, несмотря на то, что сделано много, чтобы информацию туда вводили в более-менее форматированном виде. Как показывает жизненный опыт, потеря структуры в информации принципиально снижает ее ценность, поэтому я не хочу отказываться от заложенного ранее принципа. \nКакое-то время назад я подкрутил объявления, чтобы можно было открывать доступ на их модерирование разным людям. Т.е. теперь мне нужно 3 минуты, чтобы дать кому-нибудь доступ. Если есть желающие хотя бы время от времени разгребать часть объявлений, я открою им доступ и буду премного благодарен... Спасибо!"
