    text: 'Неведомый части уважаемой публики хаус-бэнд Built For Comfort состоял из личностей, всем нам прекрасно известных:
      Рома Гегарт, Вовка Кораблин, Женя Санчилло, и два музыканта, мною неопознанных - надеюсь, что некто более просвещенный,
      раскроет их имена.


      В общем, играли всё как всегда, но г-н Воронов без экспериментов не может: на этот раз гвоздём программы был исполнитель
      на удде (арабская лютня)  г-н Кемаль Гуссейн в традиционном арабском облачении, сопровождаемый двумя гуриями неземной
      красоты в полупрозрачных одеяниях и усатым исполнителем на арабском же барабане.

      Трудно определить стиль, ими исполняемый... ну если тувинский рок мы уже послушали, то это, очевидно, был арабский блюз...но
      местами затянут..


      Как всегда, неподражаемы были Рост и Юра Каверкин, они были также замечены в коридоре поющими дуэтом в унисон и в терцию.


      Из новых, доселе невиданных гостей хочется отметить гостя из солнечного Ашхабада Сергея Бабаева, который весьма стильно
      и качественно исполнил Five Long Years в версии Eric Clapton. Надеюсь, что мы о нём (Сергее) ещё неоднократно услышим,
      и только хорошее.


      Ваш записной колумнист.'
