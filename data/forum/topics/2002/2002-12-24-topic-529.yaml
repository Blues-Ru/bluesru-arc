        deleted: false
        text: "Как архитип, ХДТ и обычен и неповторим одновременно. \nЧто касается\
          \ идеологии, то схожий блюз, т.е., безыскуссный и высокоэнергичный, играют\
          \ подопечные лейбла Fat Possum. R.L.Burnside - в первую голову. Paul Wine\
          \ Jones - еще ближе по звучанию, но сильно отстает по энергетике (во всяуком\
          \ случае, в своих студийных альбомах).\nКогда Thorogood мочит буги-вуги,\
          \ это напоминает не только JLH, но и HDT.\nПо слайдовому звучанию, Тейлор\
          \ ориентировался на J.B.Hutto. Однако по сравнению с анархизмом Тейлор,\
          \ Хьютто - слишком организован. \nЧто касается анархизма, то тут непривзойден\
          \ Hubert Sumlin. Его брейки в хаулинвулфовских песнях сколь нелогичны, столь\
          \ и абсолютно к месту. (сольные записи Самлина - это долгая история).\n\
          вообще, стоит просто повнимательней изучать современников и земляков: послушать\
          \ записи не самых известных чикагских артистов конца 60-х. Наверное, так\
          \ найдется кто-то \"типа\"."
