    \ такого академичного фьюжна - очень оригинальные и виртуозные. \nОни будут писаться\
    \ у Матраскина в среду и четверг, а в пятницу отыграют там квартирник с записью\
    \ и уедут. Увы, более достойного их класса концертного зала я им не смог организовать.\
    \ \nДело такое - у них очень плохие инструменты, у меня тоже акустика так себе,\
    \ и нужно найти им на эти три дня две достойные гитары (steel-string акустику)\n\
    ИзвЕните, чтО к вам Опять Обращаюсь - если кто может дать под мою полную ответственность,\
    \ напишите мне на мыло. \nИзвините  также за оффтопик.\nСами понимаете."
