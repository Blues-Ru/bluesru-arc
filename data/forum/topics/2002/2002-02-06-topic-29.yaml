    text: 'Paul Rishell "Sweer To Tell The Truth" - 93 - не слышал. Человека уважаю принципиально, как поддерживающегося фолк-акустик-man-to-man(глаза-в-глаза)-стиля... Но... был я на его концерте (а это лично для меня важнее записи), который не произвел впечатления иного, кроме как старательности исполнителя. Вполне допускаю, что это был не лучший его концерт (тем более, что это был утреник). но, увы... это мнение пока пребывает у меня. не отменяя противоположных мнений, разумеется.

      Просто опасаюсь, что эту тему больше вообще никто не поддержит. Для пескаря это новострой, для остальных - прошлый век... увы...


      Второй персонаж - настолько душою любим лично, что я боюсь высказывать свое мнение - бо, необъективен езмь. но именно он лично для меня - надежа, что блюз не кончился; что электрогитара - не конец, а продолжение (как это было у Мадди).


      ну а про глупые вопросы... я сам оставлял здесь постинги, которые вообще не повлекли никакой реакции.'
