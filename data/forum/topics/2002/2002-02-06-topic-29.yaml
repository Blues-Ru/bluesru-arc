  text: 'Во первых - благодарен всем человекам, кто задумал и сделал (и поддерживает) этот сайт в целом и конкретно этот форум!

    Во вторых - Господа (товарищи, братья по разуму [нужное подчеркнуть])

    Администраторы (энтузиасты своего дела!), - представьте себе такую ситуацию:

    Допустим, я полный лох в Инете, не знаю даже, как толком пользоваться поисковиком! (какой-то контекстный, расширенный, по сайтам ...и т.д.).

    Мне случайно (ха!) попалась запись (CD, VINYL)Paul Rishell "Sweer To Tell The Truth" - 93 (Tone-Cool), мне понравилась эта запись (а кому бы она не понравилась?). Далее, я захожу на blues.ru/forum, и задаю вопрос? "давайте поговорим". И вместо отзывов на предложенную тему (кроме как Сергея (VoID), я слышу: "...блин, грабли, швабры, ссылки, козлы..., и прочие шмылки. Я, конечно, понимаю, обидно, когда ты сделал какую-то работу (написал статью, например), а на нее ноль внимания.

    Но я и в мыслях не хотел никого задеть или обидеть, я просто хотел узнать, что по этому поводу (Junior K. например) думают другие, присутствующие на этом форуме, а вместо этого .....

    А списка всех имен (каталога) здесь нигде нет, или он далеко не полон,

    как быть? Может Вообще не задавать "глупых" вопросов? Аблисимов Вадим Анатольвич (46 лет. С-Петербург. Блюз слушаю и играю с 1970 года. Род занятий - несу музыку (в том числе блюз, рок, прог) в массы (продаю компакт диски, записи) (AvA). Покойной ночи!'
