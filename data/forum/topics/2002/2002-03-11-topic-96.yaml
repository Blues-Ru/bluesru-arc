  text: 'На <a href="/BlackCat/" target="_blank">Блюзовой архаике</a>, после долгого затишья, наконец-то изменения.

    Добавлен новый раздел <a href="/BlackCat/index7.htm" target="_blank">"CDs"</a>, в рамках которого планируется вести два подраздела: "Mean Black Cat Blues рекомендует" (где будут даваться рекомендации блюзоархаических дисков к прослушиванию) и "Обмен" (предполагается, что при его посредстве можно будет организовать некий круговорот дисков соответственной тематики между меломанами).

    Первый подраздел <a href="/BlackCat/cdrcmmnd.htm" target="_blank">уже запущен</a> и можно прочитать аннотации к пяти CD-релизам. Второй - <a href="/BlackCat/undercon.htm" target="_blank">пока нет</a>.

    Кроме того, учитывая некоторые пожелания, некардинально изменён фасад сайта.

    Все заинтересованные лица приглашаются заценить указанные обновления.'
