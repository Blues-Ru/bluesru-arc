    text: 'в Москве.

      И вопрос не о войне в Чечне, она там давно идет. Вопрос о том, как и кто их сюда пропустил, и сколько они денег за это получили. Об этом никто не говорит. А вот это уже страшно.

      А играть гиги или нет, каждый решает для себя сам. Вчера у нас отменили концерт, а завтра мы наверное сыграем, но настроение не то, хотя я сегодня даже выходил на улицу. Так, будно ничего не происходит. Пройдя два километра, я не заметил ни одного мента. Никакой охраны у магазинов и метро. Народ пьяный, рожи все те же, машин полно, вонь от бензина невыносимая.

      Так что жизнь продолжается. Пока продолжается.'
