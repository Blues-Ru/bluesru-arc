          deleted: false
          text: К сожалению,ситуация сложная и легкого и безболезненного выхода из нее нет.Несколько лет идет борьба в Чечне,льется кровь,гибнут тысячи людей.У нас же спохватились лишь когда это все докатилось до Москвы.До этого складывалось впечатление,что это происходит как-бы в другой стране.Всякую проблему надо пытаться решать по возможности быстро,иначе это чревато кризисом.Для этого же нужна хорошая обратная связь межу обществом и властью(государством).Общество же наше разобщено,пассивно и деморализовано,да и власть неповоротлива.Для формирования нормального гражданского общества нужны десятилетия,при том что давит старое имперское наследие.В Чечне же власть действовала как слон в посудной лавке,при том что и само чеченское общество ой как далеко от идеала.Если многие в Чечне хотят отделиться от России - это не здорово,но с другой стороны,отделилась же Словакия от Чехии при всей демократичности и наличии такого великолепного президента как Гавел.А к вопросу о развлечении - что же теперь,все время находиться в состоянии депрессии.А как же тогда живут люди в Израиле,где еще хуже - ты вошел в автобус и можешь из него уже не выйти.Кстати,насчет денег - здесь Дима не прав.Можно ведь тогда спросить,а сколько же денег дают израильским властям за то ,что они не могут прекратить теракты.Межнациональный вопрос очень сложен и простому решению не поддается,что видно на примере такой демократической страны как Великобритания.Извините за многословие,но уж слишком наболело.
