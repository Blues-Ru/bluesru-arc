  subject: Жизнь продолжается...
  deleted: false
  text: 'Дорогие друзья, меня косвенно задели осколком от дискуссии в предыдущей теме - дескать, как можно обсуждать звук, когда ТАМ творится такое...

    Можно. Я говорю за себя, что первую ночь я всю просидел у телевизора в надежде, что этот кошмар как-то разрешится. Но он затянулся. И именно для того, чтобы как-то отвлечься от состояния безысходности и фрустрации, я написал в форум.


    Разрешением конфликта занимаются профессиональные люди, компетентность которых я не подвергаю сомнению, поскольку знаком с их работой не понаслышке. Но они тоже не вольны в своих действиях.

    А нам ничего не остаётся делать, как жить и надеяться. И молиться, если кто искренне верует.'
