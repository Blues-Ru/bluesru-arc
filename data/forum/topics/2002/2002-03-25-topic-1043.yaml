    text: '1. А разве опоздание на 25 минут это много? По-моему, по меркам московских рок-концертов - это вообще ничего.

      2.Кто же всё-таки выскочил на сцену на Втором этаже?'
    replies:
    - id: 2719
      parent_id: 2664
      date: 2002-03-26 13:10
      poster: Игорь А.Г.
      email: sunny_city@mail.ru
      subject: Как сказать, как сказать
      deleted: false
      text: "во Втором этаже и так всю дорогу проблемы со временем то в 22 ,то в 22.30 стойкие призывы к завершению концерта поэтому  лишние, и причем вполне законные, полчаса только в плюс. Ну и к тому же это не опоздание, а задержка т.к. все было готово, а просто музыканты, которых я сильно уважаю,попивали пивко и мирно общались друг с другом.\nКстати,Мишурис начинает тик в тик,Аграновский больше 10-15 мин себе не позволяет даже когда на концерте в ДАСе (когда они с БББ выступали в январе)в зале было,по-началу, человек 10 всего и собачий холод (у меня аж ребенок задрыг,а А.А. в паузах одевал перчатки).Ну и Дима Казанцев в тот же вечер -15 мин и играл 3 часа. Вот так.Совсем другое дело если,как сейчас говорят,форс-мажорные обстоятельства. А \"техническая\" неорганизованность переходит в музыкальную.Это зараза.\n\nПаренька с гармошкой,выскочившего на сцену,я не знаю, но он очень неплох. А главное что он, похоже,очень увлечен процессом и играет все свободное время. Это хорошо. Будет толк. \nПерефразируя социалистический лозунг:\n-Больше харперов (гитаристов,клавишников и.т.д )хороших и разных :))).     НУ и конечно же блюза.\n\nБББ - Борис Булкин Бэнд\nА.А.- Алексей Анатольевич"
