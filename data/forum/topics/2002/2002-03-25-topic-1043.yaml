  subject: Возвращаясь к напечатанному или отчет о посещении
  deleted: false
  text: "В ночь (точнее с вечера до утра) с 22 на 23 чудесным образом оказались в двух точках пространства почти одновременно :)). А именно в клубе \"Второй этаж\" и \"Кафе на Бронной\". Есть что сравнить и к моему величайшему сожалению не в пользу \"Станции мир\". \n\nКонечно же \"Кафе на Бронной\" не станет никакой точкой, а тем более блюзовой. Но то, что я услышал там повергло в трепет. Дима собрал такой замечательный коллектив, играл такую замечательную музыку, что уйти, не дождавшись окончания концерта, было просто невозможно. А великолепнейшее исполнение \"Wish You We Here\" ( да, да Pink Floyd ) просто убило наповал. Да что там говорить все было сыграно настолько вкусно, что хотелось встать и снять шляпу :))). Очень рад, что удалось поддержать коллектив (морально и физически, жаль что не финансово :))), и кричу что есть силы  - НЕ УМИРАЙТЕ. Дима, хватит хандрить у тебя есть, что сказать людям !!! Играй музыку !!!\n\nИ вот на этой высокой ноте переношусь назад во времени во \"Второй этаж\". \n\nПри моем уважении к творчеству СМ не могу не отметить их величайшую неорганизованность и пох…зм. и совершенно неоправданная  задержка выступления на 25 мин это перебор. Отличные ребята, классные музыканты, но чего-то не хватает,а я так думаю,что Brian(а)Epstain(а) им не хватает (лучше с ремнем :))). Ну и репертуар который сейчас на 90 % заточен на хиповскую аудиторию нужно расширять и разнообразить. Хотя точно могу сказать, что прогресс по сравнению с концертом  от 18.01.02 определенно есть.  \n\n\nСпасибо ВСЕМ. За всех болею душой.  Благодарный слушатель.\n\np.s \nОчень порадовал своей игрой паренек который выскочил на сцену во Втором этаже перепутав концерт с джемом."
