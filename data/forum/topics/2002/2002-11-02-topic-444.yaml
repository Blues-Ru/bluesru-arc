          Но хрен со мной, я на слова не обидчивый. У нас многие говорят всякое, а делают добрые дела. Фёдор в том числе.
          Я просто хочу обратить внимание Фёдора на то, что есть разные способы отсчёта. Один- который Фёдор нам предлагает,
          это в некоторой абсолютной системе координат. Относительно звёзд мировой величины. Лучший способ развить комплекс
          неполноценности в нежных неокрепших душах (типа меня с Каверкиным). К тому же, а судьи кто? Где наши независимые
          блюзовые критики? Или они самопровозгласятся так же, как у нас самопровозглашаются блюзовые герои? Кстати, кто они,
          эти безвестные герои? Страна должна знать своих героев, а не представлять их аморфной массой с лица необщим выраженьем.

          Другой способ заключается в том, что система координат устанавливается исключительно относительно самого музыканта.
          Любой из нас безусловно хуже Би Би Кинга. Но лично мне было очень приятно, когда ко мне подошел Ваня Жук - вот уж
          кого трудно заподозрить в предвзятости - и сказал: "А ты знаешь, ты стал играть лучше, чем весной." Это лучше, чем
          цитировать одного классика "А вы друзья, как не садитесь..." Потому что другой классик говорил: "Поощрение так же
          необходимо таланту, как канифоль - смычку виртуоза". Наверное, стоит признать за каждым из нас наличие таланта в
          разной степени его проявления. Не совсем же у нас всё запущено.

          Поэтому мы стараемся относиться друг к другу как люди прежде всего, а не как абстрактный критик к абстрактному музыканту.

          Наверное, членам нашего общества надо встречаться и обмениваться мнениями тайно, а то возникает ощущение, что похвалить
          товарища - это грех, а вот сказать: "твоя музыка-говно" - это высшее проявление добродетели и гражданского мужества.
          Ну давайте все честно выйдем и скажем друг другу: "Брат, твоя музыка..." - и далее по тексту. И все будут счастливы?
          Наступит момент истины и мгновенное просветление? Дзэн, однако? Увы.. скорее всего, получим по морде. И это будет
          правильно. Потому что критика - такое же искусство, как и музыка. И критиковать можно по-разному. Лучше делать это
          так, чтобы людям действительно хотелось пойти послушать хорошую музыку, позаниматься на инструменте, а не воспринимать
          сказанное как наезд, сиречь инсинуацию. Называется сия метода Обратная Связь Высокого Качества, а обучают ей на
          специальных тренингах. Желающих направлю, обращайтесь.'
