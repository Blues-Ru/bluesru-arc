        \ не устраивает, когда после такого джема любительское и не всегда качественное выдается за образец. Также идея взаимообогащения\
        \ одного любителя за счет другого (в ущерб обогащению из музыки на компакт-дисках) мне совершенно претит. \nГитарист\
        \ с гитарз.ру вызывает у меня симпатию не тем, что он играет, а усердием. Ибо у нас есть очень много гитаристов, которые\
        \ виртуозно пилят Сатриани. И если начинающий после пары лет обучения выйдет и скажет - вот какой я крутой, ему тут\
        \ же утрут сопли те, кто пилит это в 10 раз быстрее. В результате - он пойдет дальше заниматься.\nС блюзом такого\
        \ не происходит - есть 10 человек, между ними распределили роли самого задушевного, самого техничного, самого знающего\
        \ и все. А на поверку их уровень очень низкий. Это-то и не имеет большого значения, каждый играет как может и как\
        \ хочет, но сделанные выводы совершенно отбивают желание заниматься, дизориентируют тех, кому бы надо позаниматься,\
        \ а также портят музыкальный вкус.\nP.S. Из моего текста выпирает как бы \"идея фикс\" - надо заниматься и пр. Любителям\
        \ - необязательно, совершенно, если они в жизни заняты другим делом. По собственному желанию, никто за это не осудит.\
        \ Но, если ты профессионал, и для тебя это главное дело жизни - будь добр, и за некачественный результат снисхождения\
        \ не жди. Если поднял блюзовое знамя - значит взял на себя ответственность, играй хорошо.\nP.P.S. В среде музыкантов\
        \ - как в среде писателей. Все такие трепетные, кому-нибудь скажешь: \"твоя музыка - говно\" или просто замечание\
        \ сделаешь, он на тебя обидится смертно до конца своих дней. А я, понимаешь, как слон в посудной лавке ранимых творческих\
        \ натур. Уж извините. Может быть иногда лучше быть отрезвленным заранее..."
