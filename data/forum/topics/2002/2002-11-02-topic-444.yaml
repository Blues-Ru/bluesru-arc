      text: "Я просто пытаюсь выразить свое необъективное отношение к нашим \"деревенским\" гитаристам в свете последней полемики.\
        \ При этом я их никак не классифицирую - ни по техническим или инным данных, ни по их \"выслуге лет\". Это ни в коей\
        \ мере не Top 10 или какой либо другой сравнительный вариант - это просто мое отношение к тем НАШИМ музыкантам которых\
        \ я довольно часто слушал и у которых я пытался и пытаюсь учиться. Я их не сравниваю ни с Стенли Джорданом,ни с Уесом\
        \ Монтгомери,ни с Джо Скофилдом, я таже не сравниваю их друг с другом - это было бы не самым умным ,хоть и весьма\
        \ популярным действием. \nПусть не обижаются те которых я не упомянул - просто я их мало слышал для того,что-бы говорить\
        \ о них.  \nОдно из самых сильных шестиструнных впечатлений последнего времени это -  Вадим Иващенко. Это не значит,что\
        \ другие мне не в кайф,просто этот музыкант - это музыкант. Импонирует несколько небрежная,но абсолютно филигранная\
        \ и легкая манера подачи, а так-же практически чистый звук (без жужжжжжжалок). All that Jazz (не в смысле\nчепухи)...в\
        \ смысле пальцами играет!\nГелюта.... неистовый и порой загружающий, но дай Бог каждому имея такой музыкальный багаж\
        \ так заводиться и так страстно желать свидания с гитарой (если-бы гитара могла зачать...).\nБоря Булкин.... гитарист\
        \ от Бога со своим звуком (а это по моему 99% успеха) и своей колоритностью...А уж драйва у него.... \nГия .... обладает\
        \ всеми качествами гитариста. Звук,техника - все на уровне. Вытягивает из гитары самые нужные по настроению звуки.\
        \ \nИнтересно,у него московская прописка? ;)\nСережа Воронов.... мало так тонко чувствующих на сцене людей. С ним\
        \ играть всегда в кайф. Мало того,что сам зажигает, но еще и тебя всегда старается вывести на лидирующую позицию.Он\
        \ (несмотря на опыт и обласканность)кайфует от действа...Многие так не могут, или уже не хотят.\nЖеня Немов - музыкант\
        \ импульсивный и не всегда стабильный, но уж если у него покатило, то многие курят...Вот вам и человек с Севера!!\n\
        Андрей Цыганков ... музыкант с великолепной техникой и,что важно всегда находящийся в состоянии некоторой неуверенности\
        \ в себе и поиска\nсамовыражения.Слава Богу стал, тянуть струны (лопнут - фигня!!!)\nСережа Бабаев - это отдельная\
        \ ветвь произрастающая на южных музыкальных деревьях. Это музыкант который еще удивит всех...Восток дело тонкое.\n\
        Арсен - один из самых тонко чувствующих гитаристов играющих настолько надрывно и ярко,что положительных эмоций хватает\
        \ и на начинающих гитаристов и на волков дранных. Это важно....\nВаня Жук... Удивительное сочетание таланта,техники\
        \ и полного отрицания канонов. Короче ,он стебется (стебается) над всем и вся. Ему скучно в рамках и он их ломает\
        \ (Негодяй!:). При этом он делает это так,что сломанные рамки ему аплодируют.И я аплодирую (Негодяй!!!)\nВолодя Русинов...\
        \ Вкус,звук,техника - все при нем. Что еще надо гитаристу,что-бы достойно встретить СВОЮ музыку.Меня лично поразила\
        \ его игра после того как он послушал в живую Бадди Гая. Может это лишь мои домыслы,но он зазвучал по другому (Володя,поправь\
        \ меня если это не так)\nСережа Виноградов - наверное сыграет все что надо и ,что важно так как надо.Иногда (надо\
        \ чаще) такие пенки выдает,что мама не горюй! И еще - у него всегда есть тюнер:)\nВолодя Кораблин - по моему это музыкант\
        \ который не стоит на месте,он все время пытается трансформироваться в различных блюзовых потоках и это ему довольно\
        \ успешно удается. Сегодня он с Робертом Джонсоном перемигивается,а завтра у него сейшн с Джими Хендриксом и при этом\
        \ все довольны. \nНадеюсь,что не упомянутые мной лид-гитаристы не воспримут это как личное оскорбление , просто я\
        \ их мало слышал или увы (каюсь) не слышал....\nИ еще... давайте воздержимся от \"не вижю ваши рюки\" и от размера\
        \ шляп,усов, черных очков и прочих атрибутов анатомического характера."
