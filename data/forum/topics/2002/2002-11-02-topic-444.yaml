  text: "Ох, не могу я сдержаться. Не политкорректно это, но уж политкорректность за последние года три, что была, та вышла\
    \ вся. Простите заранее.\nМне кажется, что у нас бардак полный происходит последнее время. Да простят меня за то, что\
    \ сею разобщенность, и наношу вред ОБЩЕМУ БЛЮЗОВОМУ ДЕЛУ (если кто-то знает, что это такое?).\nАтмосфэра всеобщей любви\
    \ и \"взаимопонимания в форуме и вааще\" после проходящих джемов несомненно способствует укреплению взаимопонимания между\
    \ людьми, налаживанию добрососедских отношений и смягчению нравов, что, разумеется, очень хорошо в общегуманитарном плане.\
    \ Но занозой в зад меня беспокоит факт, что это очень вредит более конкретному блюзовому делу. Да простят меня за пасквильный\
    \ стиль, приношу извинения, но на полное снисхождение не расчитываю...\nНа мой скромный взгляд регулярно творится полное\
    \ безобразие в музыкальном плане, после чего его участники раздают друг другу лавры (не себе, разумеется, - ибо беспредельная\
    \ скромность не позволяет), а друг - другу. Аграновский хвалит Цыганкова, Цыганков Каверкина, ухватившего \"blue feeling\"\
    , Каверкин - Роста, на этот раз \"давшего\", Рост - Гелюту, который вааще - главный блюзовый гитарист советского союза,\
    \ а последний - Аграновского за вибрато в вокале. Разумеется, я перепутал последовательность, она, я знаю, не верна. Кроме\
    \ того, большинство перечисленных - скромнейшие люди, в большей или меньшей степени, я их очень люблю и уважаю, да простят\
    \ они меня. Но в результате, укрепляются какие-то странные стандарты блюзового качества. Типа - \"криво, но задушевно\"\
    .\n(Потом приходит чувак с гитарз.ру, который всю жизнь честно пилил и тренировался, а потом оказалось, что по части подачи\
    \ и \"blue feeling\" он - слабак последний.)\nЧеловек, которому только что поклонились как \"истинно чуйствующему\", на\
    \ мой взгляд, играет полный отстой, а его приятели говорят \"да, чувак понимает и пр.\". Примерно такие вещи происходят\
    \ на разных уровнях $$, в том числе и на верхних. Леван выпускает еще один отстойнейший диск, у него толпы поклонников.\
    \ Гия на его фоне считается интеллектуалом (его уважают, и он это знает), тоже играет хрень какую-то. При этом считает,\
    \ что может показать залетным птицам, типа - у нас тоже блюз играть умеют.\nРезультат - куча уверенных в себе, а также\
    \ - полууверененных, но из числа бодрящихся, блюзовых музыкантов, определяющих \"лицо местного блюза\". А их музыка -\
    \ на деревенском уровне. Им бы еще 10 раз по столько позаниматься, двум трятям - сменить занятие, тогда, может, что-то\
    \ путное и выйдет.\nУметь круто играть блюз - это совершенно необязательная вещь, у всех разные способности и т.д. Человек,\
    \ который умеет хуже, совершенно не заслуживает какого-либо неуважения и пр. Если он играть не умеет, но слышит хорошо,\
    \ мы уважаем его музыкальные наклонности и вкус. Это ценится в кругу любителей блюза, которые здесь привалируют. Если\
    \ человек не слушает музыку вааще, занимается в жизни чем-нибудь другим, он по-прежнему имеет все права на существование,\
    \ и даже заслужить кучу уважения по другим поводам. Если Газманов играет качественную попсу, и сам в этом признается,\
    \ то поуважаем его за это. Но! Если человек остановился в своем музыкальном развитии на уровне детского сада, назвался\
    \ блюзовым героем, и НЕАДЕКВАТНО воспринимает свои способности, то хочется сказать ему - \"Shame on you.\"\nЕсть два измерения\
    \ - иметь способности к музицированию (их имеет не так много людей), а также иметь разумное направление мыслей. Первое\
    \ дано не всем, это - совершенно необязательно. Второе понятие - многогранное, и для музыкантов - абсолютно необходимое,\
    \ на мой взгляд. \nЧто, на мой взгляд, примерно означает: \n1) Постоянно слушать правильные пластинки, не ограничившись\
    \ первой сотней (или парой)\n2) Любить музыку\n3) Адекватно воспринимать свои способности!!!!! Это - самое главное. Большинство\
    \ наших музыкантов уверены, что они почти умеют. Хотя находятся на уровне второй группы детского сада...\n4) Если ты хорошо\
    \ поймешь, что еще ничего не умеешь, но у тебя есть амбиции, то ты будешь заниматься очень много. А даже когда что-то\
    \ получится, сообразишь, что нужно было круче.\n5) Комплекс неполноценности согласно п.4 адекватным людям не грозит, они\
    \ хорошо понимают, что они могут, а чего - нет...\n6) Музыканты, которые достигли вершины человеческого самосовершенствования,\
    \ которым не грозит нескромность и т.п. в виду стойкости натуры, могут просто не слышать разницы между собственным и настоящим\
    \ в виду отсутствия музыкального таланта и опыта. Тут ничего не поделаешь. В этих случаях может лучше завязать с исполнением...\n\
    И еще одна вещь, не такой очевидный вывод из личного опыта - я видел кучу козлов, которые храбрятся, но играют в высшей\
    \ степени средне. А вот большинство хороших, даже гениальных музыкантов, которых я встечал, - очень скромные люди, которые\
    \ оооооооочччччччееееееенььььььь любят и слушают очень много музыки. Из этого я делаю вывод - для того, чтобы стать крутым,\
    \ нужно правильное направление мыслей и талант. А качество музыки поправляется только (!) после выправления мозгов, само\
    \ не получается.\nПочему-то наш музыкант (возьмем Гию, к примеру) после концерта скажет: \"вот я какой\", а также постарается\
    \ показать фирмачу, что я тоже могу. При этом подумает, он, конечно, круче, но я - тоже. А если спросить фирмача (играющего\
    \ несравненно круче), он тебе скажет: \"ну я играю средне-нормально, а тут есть другой чувак, он гораздо круче меня!\"\
    .\nПодобное отличие в установке напрямую влияет на побуждение к действию. Крутой будет слушать, снимать и заниматься,\
    \ а местный - стричь купоны...\nP.S. Итого, я не за то, чтобы кого-нибудь обидеть, а чтобы установились новые стандарты\
    \ качества. От них многое зависит. Может кому-то нужно и оставить занятия музыкой, а кому-то еще позаниматься... Все будет\
    \ лучше..."
