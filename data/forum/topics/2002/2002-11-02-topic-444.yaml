        text: 'А нетрезвым Романенко - стыд и срам! Ты это специально написал, дескать, пьяный был, себя не помню?


          Фёдор, ну ты прям как Лев Толстой - "Не могу молчать"!

          Что лично меня беспокоит в твоём сообщении - так это уровень обобщения. Гигантское у тебя обобщение. Огромного масштаба.
