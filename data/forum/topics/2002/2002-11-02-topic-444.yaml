    deleted: false
    text: "В свое время меня удивила статья Федора, в которой низкая оценка Петровичу, Воронову, Вайту сочеталась с высокомерными\
      \ поучениями в их адрес. В другой раз он мимоходом ставит двойку Алексею Козлову, который играет попсу (Боже мой...)\
      \ А уж Леван Ломидзе вообще любимая мишень. То, что моя фамилия упомянута в ругательном контексте на сей раз, обязывает\
      \ и тревожит. Как бы не зазнаться.\n    Уверен, что создателю сайта Блюз в России не к лицу писать слова, призванные\
      \ научить дедушку кашлять. Не бывает общего блюзового дела. Но бывает клуб, круг людей, которые уважительно общаются\
      \ друг с другом. Его надо поддерживать. \n    Понятно, что не со зла все это Федором написано и от неравнодушия исходит.\
      \ Но, трезвый бред или нетрезвый, нехорошо так."
    replies:
    - id: 8665
      parent_id: 8664
      date: 2002-11-04 14:24
      poster: Федор Романенко (fedor)
      email: fedor@blues.ru
      subject: Алексей!
      deleted: false
      text: "Высокомерие и склонность к поучению можно смело валить на качества моего дурного характера. Я не обижусь, разумеется.\
        \ ;) Каждый раз, когда я чью-то музыку низко оценивал, у меня были (и есть) на то веские основания. Скажем так, степень\
        \ моего критического внимания к кому-либо определяется не тем, насколько хорошо или ужасно он играет, а именно разницей\
        \ между \"общественной\" оценкой и тем, что я слышу. Это все - жуткий субъективизм, разумеется. И, я думаю, все были\
        \ бы рады почитать какие-нибудь отличающиеся от моих комментарии по затронутым вопросам, жаль, что их мало.\nФорма\
        \ высказывания, возможно, выбрана неадекватная, но только лишь для усиления художественного эффекта. Если мне кто-то\
        \ скажет, что упомянутые вообще играть не умеют, я буду спорить и доказывать обратное. Можно было бы вообще выкинуть\
        \ из моих рассуждений упоминание личностей. Может даже и нужно, но тогда каждый подумает - \"ну да, точно, все - козлы,\
        \ а это не про меня\". Причем, именно в самых тяжелых случаях (Леван, к примеру). \nДурной и определяющей в данной\
        \ ситуации особенностью моего характера, проистекающей от неравнодушия, является желание влезть, если на мой взгляд\
        \ что-то происходит не так. Мудрый на моем месте ради сохранения человеческих отношений и по другим причинам - промолчит.\
        \ Но факт состоит в том, что одни и те же вещи публично и за глаза получают диаметрально противоположные оценки. Стоит\
        \ ли поднимать это на поверхность? С точки зрения душевного спокойствия - нет. Но когда публично и регулярно одни\
        \ плохое называют хорошим, а те, кто хочет назвать плохое плохим -  молчат, человеческие отношения выигрывают, а музыка,\
        \ вероятно, что-то проигрывает. Ведь у нас же, все-таки, blues.ru, а не клуб знакомств? Значит, критика не запрещена?\
        \ Только я боюсь, что если начать критиковать по конкретным пунктам, а не огульно в моей излюбленной манере, то труднее\
        \ будет списать это на недостойные качества автора, а будет тем обиднее для музыканта."
