        subject: Фёдор, главное всё же - человеческие отношения.
        deleted: false
        text: 'Фёдор, я не буду сильно повторяться - в предыдущем постинге я свою позицию обозначил. Но скажу вот о чём: когда
          выигрывают человеческие отношения, когда возникает атмосфера взаимной приязни, то в неё легче вплетать дружественную
          и конструктивную критику, скорее даже не критику, а обратную связь, выслушав которую человек, возможно (!) не уйдёт
          в глухую защиту от ударов по "конкретным пунктам" с контратаками на личность критикующего, а поймёт, что у него
          с критиком (ох, не люблю я это слово) одна цель. В глобальном плане - вырастить российских Кингов, самых королевских
          Кингов в мире. В локальном - помочь каждому взглянуть на себя со стороны и вырасти как музыканту. Я предлагаю исходить
          из предположения, что мы общаемся с доброжелательными, здравомыслящими людьми, благожелательно воспринимающими дружеские
          советы, а не с истероидными пафосными эгоистами, забронзовевшими в собственной косности :))


          А почему критика подразумевается как травмирующее орудие? Откуда такое мнение?'
