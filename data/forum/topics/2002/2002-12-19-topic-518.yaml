  subject: Блюз на гитаре и блюзовая гитара (эссе)
  deleted: false
  text: "А вот мне что интересно поделиться, а вы мне скажите, что вы считаете! Будет у нас такой форум! Мне кажется, неплодотворные споры все от неопределённых терминов - вот давайте определим, вот как вы думаете, что такое \"блюзовая гитара\" и что такое \"блюз на гитаре\"?\n\nЯ вот так это чувствую - что \"блюзовая гитара\" это такой стиль игры - бенды, характерные фразы. Не побоюсь этого слова, такой отдельный язык сольной импровизации, широко употребляемый как в современном блюзе, так и в прочих стилях музыки, и почти окончательно сформировавшийся, на мой взгляд, в 60х годах.\n\nА вот блюз - это такая музыка, ну такое народное искусство и под него стилизации, которая, на гитаре, в частности, может исполняться. (Заметьте: определение блюзу, я слава Богу, не пытаюсь давать или предлагать обсуждать, как человек в своём уме, смотри имэйл) И вот что выходит, если подходить к вопросу таким образом - хоть всякая гитара, на которой играют блюз - блюзовая гитара (иначе было бы глупо), но не всякая блюзовая гитара играет блюз!\n\nВот например Клэптон или Гари Мур (изгои в среде любителей красоты) на мой взгляд, даже когда играют 12титактовые каверы, блюзовую некую ауру создают (не побоюсь такое сказать) обычно может даже и похуже чем, скажем, наш, менее признанный в мире, друг Каверкин! То есть Юрий, по-моему,получше! (хочу я уточнить для нелюбителей длинных периодов). Говорю своё субъективное искреннее мнение, как человек, Каверкина и Клэптона слышавший вживую и обоих очень уважающий. \nНо вот как блюзовые гитаристы, люди, способные захватить слушателя осмысленным эмоциональным высказыванием при помощи минимального количества нот, мне кажется оба они настоящие молодцы! А звукоизвлечение? Да что говорить! \n\nЯ считаю (субъективное определение), блюз очень часто (каким я, например, его люблю) примитивистская такая музыка, чем грубее, тем лучше. В том числе блюз на гитаре. А вот пресловутая блюзовая гитара - уже некое отдельное искусство, позволяющее перфекционизм. Может быть, очень многие (почти все) современные записи блюза, если пользоваться таким разграничением, можно гораздо точнее назвать не блюзом, а блюзовой гитарой, и, например, блюзовым вокалом, под качественный аккомпанемент ритм-секции в стиле блюз.\n\nВот такие мысли - а вы как думаете?\n\nВо избежание заслуженной грубости хочу подчеркнуть, что предлагаю не выяснять объективную истину, а поделиться собственным взглядом на вопрос и вежливыми мнениями по поводу слабых мест моего подхода."
