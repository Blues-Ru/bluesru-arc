    subject: Не самый лучий сборник Слима.
    deleted: false
    text: 'А если по-порядку, то:

      1-6. С альбома 61 года (с House Rockers feat. Matt "Guitar" Murphy и др.); изначально вышел на лейбле Strand. Оригинальное
      название не знаю. На CD выходил неоднократно на разных мелких лейблах: Lonesome (Drive Archive), Soul Blues (Ember),
      Ambassador Of The Blues (TKO), I''ll Just Keep On Singin'' The Blues (32 Records) - те издания, которые до сих пор в
      продаже. Рулезный альбом, несмотра на не самое лучшее качество записи.


      7-10. С раннего альбома на Сhess, год эдак 50-51. Целиком на СD издавался пару раз, последний раз - под названием Real
      Folk Blues (Chess/MCA) в серии юбиленых дигипаков к 50-летию Chess. Содержание противоположно названию, т.к. аранжировки
      - максимально опопсенные (большой состав, "заунывные" духовые а-ля Nat King Cole или там Сидней Беше), и никаким фолком
      даже не пахнет.


      11-14. С альбома Tribute To Big Bill Broonzy etc. (Candid, 1961). Акустическое фолковое трио с Arbee Stidham и Jazz
      Gillum. С одной сессии было нарезано 2 лонгплея - этот (сотоящий исключительно из каверов) и Memphis Slim U.S.A. (свои
      вещи). В принципе, по содержанию оба этих альбома трудно считать полноценными сольниками Слима, т.к. лидируют на разных
      вещах все трое поочередно.


      Последние треки - не знаю,что-то из раннего, хотя с таким качеством у Слима были записи и в 60-70-е...


      Thanx Dr.Nick за вдохновение :)'
