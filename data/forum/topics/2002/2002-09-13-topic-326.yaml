                      text: "у меня двухскоростной. Я же написал \"плюс время звучания альбома\". Федь, ты не забывай, что\
                        \ у меня дома куча аппаратуры (включая профессиональную), и то, что кому-то может показаться гемором,\
                        \ мне довольно просто.\nА потом, разве вопрос в скорости? Вопрос в качестве и правильном переносе\
                        \ инфы с одного носителя на другой. Ведь переписывать стОит в основном то, чего просто нет (и не будет)\
