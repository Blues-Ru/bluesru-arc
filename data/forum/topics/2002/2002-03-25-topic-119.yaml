      text: "Эстонский портал DELFI сообщает:Пол Маккартни и Том Джонс споют историю блюза \n\nDELFI, MusicNews\n25 марта\
        \ 2002 12:01\n\nВэн Моррисон, Том Джонс, Пол Маккартни, Джефф Бек и Джорджи Фэйм приняли участие в съемках нового\
        \ документального фильма \"The Blues\", который расскажет об истории блюза. Картина состоит из пяти серий.\nСпециально\
        \ для этой ленты Вэн Моррисон и Том Джонс записали \"джем-сейшн\", а Пол Маккартни исполнил одну из новых песен. \n\
        Продюсером картины стал Мартин Скорсезе, а режиссером — Майк Фиггис, хорошо известный по фильму \"Leaving Las Vegas\"\
        \ (Покидая Лас-Вегас) с Николасом Кейджем в главной роли. \nОдну из серий Фиггис посвятил британской блюзовой сцене.\
        \ \"В этой части вы увидите Вэна Моррисона, который \"джемует\" с Томом Джонсом, а также Джеффа Бека, Пола Маккартни\
        \ и одну блюзовую команду, которую мы совместно организовали\", — рассказал Фиггис, который является не только режиссером,\
        \ но и музыкантом. В 60-ые годы Майк выступал в составе ритм-н-блюзовой группы Gas Board вместе с Брайаном Ферри и\
        \ записал музыкальное сопровождение к нескольким фильмам.\n\n\"Я всегда считал, что Том Джонс — потрясающий блюзовый\
        \ исполнитель, а Вэн Моррисон — не менее фантастический певец. И на съемках это подтвердилось. В общем, картина удалась\
        \ на славу\", — без ложной скромности заявил Фиггис. \n\nОн также высказал надежду, что после показа фильма в США\
        \ его смогут увидеть и поклонники блюза в остальных странах мира."
