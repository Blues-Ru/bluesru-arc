        text: "В Британии 60-х увлечение блюза было повальным. Соответственно, и Том Джонс пел что-то блюзовое. Среди прочего\
          \ исполнят баладку \"Oh Danny boy\" в блюзовой аранжировке, что уж совсем потешно. \nИ что ж теперь делать? столько\
          \ радости было: сам Скорсезе снимает, вспомнили \"последний вальс\"... Такой авторитет, гарантированная публичная\
          \ засветка (то есть, если бы yazoo или document с помощью своих коллекционеров-исследователей сняли бы фильм об\
          \ истории блюза - ну, разве это вызвало бы хоть какой-то общественный резонанс). А в результате? Нам будут рассказывать\
          \ о блюзе 5 белых британцев, из которых двое весьма далеки от блюза, а трое - имеют к нему весьма опосредованное\
          \ отношение. И все это будет представлено публике с максимальной помпой, какую обеспечат эти имена. \nПогодите,\
          \ Говорухин снимет фильм о блюзе с участием Буйнова, Меладзе и, ну например, Игоря Бутмана (в данном наборе он аналог\
          \ Бека)."
