        в летний студенческий лагерь под Звенигородом. Градский надел на пальцы презерватив и показывал фильм "Мудрые руки
        хирурга". Буйнов достал из кармана свою армейскую фотографию 3 на 4 см и выбросил ее за борт со словами "Поклонницам!"
        Вот тот Буйнов мог бы сыграть блюз. А сейчас врядли.'
