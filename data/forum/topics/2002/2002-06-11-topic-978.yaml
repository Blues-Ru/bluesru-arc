    text: "dark was the night - какая то магическая вещь, во первых в ней нет четкого размера, во вторых она не вписывается\
      \ в привычную европейскую мелодику, ухо сразу цепляет что то непривычное, да еще эти его подвывания. Будучи переигранной\
      \ Раем Кудером на саундтреке \"Париж Техас\", она уже гораздо ближе европейскому менталитету.\n\nЕще одна вещь, которая\
      \ мне очень нравится - это: hey god, god don't never change. \n\nНе правильно называть \"грязью\", характерные моменты\
      \ его исполнения. Просто такая манера не очень вписывается в привычную нам эстетику, но точно так же может не вписываться\
      \ в современное понимание какой нибудь нетемперированный строй на основе натурального звукоряда, но, к примеру, квинты\
      \ и терции звучат в нем гораздо слитнее и плотнее чем в принятом в посл время темперированном, да и использовали его\
      \ на протяжении многих веков."
