  text: "Ну я смотрю, что внес этой темой некоторый резонанс( смотрите здесь\nмои дискуссионные вопросы).Хотя я не собираюсь вести полемику,-это даже унизительно.О чем можно говорить,если \"знатоки блюза\"( типа\nФ.Романенко ) путают размер ( 4/4 ) с ритмом Если он же , взглянув на состав инструментов(тенор-труба-тромбон), считает , что это диксиленд.\nА ведь не удосужился посмотреть сайт www.kimtyrist.boom.ru до конца.\nТам был бы виден репертуар секстета -обычный классический джазовый стандарт (К.Терри,З.Симс,С.Гетц,М.Дейвис и пр. корифеи).Был бы кларнет.......это уже чем-то диксилендовским пахнет.\nО чем можно говорить, если вы \"Осенние листья\"причисляете к блюзу.\nЕсли вспоминаете Б.Смит - старую вокальную школу,хотя я речь вел о инструментальном блюзе.\nНо что интересно - ни один мыслитель ничего не сказал ПО СУЩЕСТВУ.\nЯсно - потому что ничего не знает об этом существе (суть блюза).У нас\nкроме Валентины Джозефовны(последняя работа 20-ней давности,да и речь о вокальном  блюзе) ничего не написано.Вот я и хотел кое-что уточнить.\nПоказать, что Блюз-это прежде всего определенная гармоническая структура(и показал какая).Потому что у нас что ни попадя причисляют к блюзу или вообще к джазу.Модное словечко.\nТак вот по существу никто ничего и не мог сказать - одни эмоции.\nЕще раз говорю-\"Все беды - от бедности \".То же совковое мышление, в головах сумбур,все перепутано......\nСмотреть бы вам по ящику НТВ-плюс 47 канал -джазовые фестивали или \nслушать по Spinner-приемнику интернет-радио.Между прочим,там есть\nJAZZ и все его разделы-блюз,свинг,боп,вокал и пр. прелести.Да жаль -\nденег нет.Повторюсь,все беды от бедности.\nЭто я к тому,что вы играете не блюз, да и разговор на форуме ведете \nНЕ О БЛЮЗЕ.\nПохоже, мне здесь делать нечего.Желаю всем вырасти ЭКОНОМИЧЕСКИ\nа там и духовное (иное музыкальное мышление) придет.\nКто хочет со мной пообщаться - милости просим на kimich@online.ru\nхотя я ни в ком не нуждаюсь."
