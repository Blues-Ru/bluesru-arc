      deleted: false
      text: Уважаемый Ким! Понимая, что вы ни в ком не нуждаетесь, и вряд ли прочтете мой комментарий, все-таки позволю себе высказать несколько слов. Суть блюза (используя ваше высокопарное выражение) все-таки не в двенадцатитактовой схеме, которую вы изволили здесь привести, хотя это и очень важный признак, но все же признак формальный. Суть блюза - все-таки в содержании, которое может быть выражено не только в песенных текстах (как следует из вашего первого высказывания), но и в инструментальных композициях (и не обязательно с помощью 12-тактовой схемы). Описывать блюзовое содержание я не буду даже пытаться - "still I've got the blues", и этим все сказано. Что же касается ладового своеобразия блюза, то здесь прежде всего следует обратить внимание на  1) наличие так называемых "блюзовых зон" (для характеристики которых уважаемая Валентина Джозефовна справедливо использует термин "грязь"), возникающих вокруг III, V и VII ступеней за счет их микроальтерации (и которые вовсе не являются признаком мажоро-минора, как толкует тот же самый Музэнц словарь); 2) на то, что в третьем (кадансовом) предложении блюзового квадрата субдоминанта очень часто следует за доминантой, что абсолютно невозможно в европейской традиции, так как нарушает "классические" законы ладогармонических тяготений (доминанта в европейской традиции считается гораздо более "сильной" и может разрешаться только в тонику), как бы размывает эти самые тяготения. Вот о чем следует говорить, если уж понимать блюз как схему.
