        deleted: false
        text: "Дима К., вот и не \"сливаются\" блюзы с европейскими песнями. именно по причине архи-характерного обратного, т.с., порядка следования доминанты и субдоминанты. (что я и пытался от тебя услышать в другой ветке, пока ты мне коротко, не утруждая себя аргументами (как тебе это обычно свойственно), не велел мне оставить тебя впокое, поскольку ты и без книжек все лучше всех знаешь:)). \nСамо название \"доминанта\" указывает на ее роль в европейской мелодике. В блюзе она лишается \"господствующей\" позиции. И это важнее, чем попытка изобразить блюзовый звукоряд знаками из мажорного или минорного лада, имеющего к блюзу очень отдаленное отношение (точнее - за неимением лучшего). \nМультиритмичность, блюзовый лад, блюзовые ноты, и обратная последовательность доминанты и субдоминанты - суть указания на самобытность блюза. В.Дж.Конен, которую тут, к счастью, начали цитировать, указывает что \"идейное\" (смысловое) наполнение блюза не менее самобытно и \"антиевропеично\", чем его музыкальные особенности. \nИменно поэтому никто из серьезных исследователей не пытался объявить блюз - инструментальной музыкой. \ncall & responce (диалог голоса и инструмента) - был обязательным элементом блюза. Именно диалог, поскольку, как пишет В.Дж.К., инструментальную партию в блюзе нельзя назвать аккомпанементом. она равноправна с голосом."
