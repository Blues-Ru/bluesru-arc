  text: 'Вчера в рамках питерского блюз-фестиваля "Дельта Невы" было выступление  группы из Израиля "Southbound Train" (http://www.sobo.co.il/). Надо сказать, что группа заслуживает пристального внимания, имеет хорошую подачу и разнообразный материал, не ограниченный только рамками блюза. Думаю московской публике эта группа уже знакома. При возможности рекомендую посетить их концерт. Да - вчера с ними выступал другой ударник (не тот, что заявлен на сайте в составе группы), очень веселый (даже сказал бы - куражистый) ударник, зовут кажется Elimelach "FISH" Grundmaan.

    Отдельное спасибо хочу сказать нашей команде "Forrest Gump" за прекрасное выступление в первом отделении, что было признано коллегами из Израиля.'
