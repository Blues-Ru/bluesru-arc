      - облом, но еще больший облом - если придут люди, друзья, и ничего не увидят,
      кроме объявления на запертой двери. Что они после этого сделают? Правильно.
      Именно перепьются и именно простудятся. Поэтому я написал именно такое объявление
      и пришел ко Второму этажу. Потом появился арт-директор Тимофей и другие клубные
      люди. Никто из них не стремался (а никто как они в курсе ситуации), просили
      только в 10 вечера закончить. А до десяти нам было хорошо. Все улыбались. Менты
      не приехали. Зато подошли ребята лет 8-11 из этого двора и тусовались с нами.


      Спасибо всем, ребята.

      Спасибо - Славе Капорину, Андрею, Юре Каверкину, Саше, Бандерасу, Росту (гитары,
