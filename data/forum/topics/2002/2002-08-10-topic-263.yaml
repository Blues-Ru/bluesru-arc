    deleted: false
    text: 'Если окажется действительно очень круто, с удовольствием помогли бы чем-нибудь.
      Ну а в любом случае можно рассчитывать на оценку уровня группы, исходя из нашего
      знания, кто, что и как умеет играть, чтобы не было иллюзий или излишней скромности.
      Дело в том, что у каждой группы всегда есть три основные дороги - пробиваться,
      учиться дальше или забросить это дело. Далеко не всегда люди делают правильный
      выбор. Мне не кажется, что в нашем блюзе главная проблема - отсутствие возможности
      выбиться "наверх" для гениев. Скорее - мало, кто играть действительно хорошо
      умеет.

      P.S. Одним словом - присылайте записи, будем рады откомментировать или повесить
      какую-нибудь информацию...'
