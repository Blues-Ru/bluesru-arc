  text: "Только что читала материал о том, как прошел фестиваль Blues.ru-2001. Оказывается,\
    \ музыканты приезжали из многих российских городов.  \nЕсть в Новом Уренгое (далеко\
    \ на Севере) группа, которая отлично играет блюз. Это не просто \"перепев\", ребята\
    \ сами сочиняют музыку и тексты на русском. И надо Вам сказать, что звучит это\
    \ ни чуть не хуже чем у известных русских блюзменов. \nНо ребята прозябают в глуши.\
    \ Были подвижки, они договаривались о выступлениях в питерских и московских клубах,\
    \ но дальше переговоров дело не пошло, так как у лидера группы - вокалиста и гитариста,\
    \ есть жена и дети, которых он просто не может на несколько месяцев оставить одних\
    \ (хотя ситуация меняется).\nМожет быть кто-то знает, как попасть на один из таких\
    \ фестивалей? Ведь музыка, которую ребята играют, достойна того!\nВот телефончик\
    \ Игоря, который возглавляет (читай как - пишет музыку, тексты, поет и играет\
    \ на гитаре)группу \"Blues Condition\". Может кто-то рискнет позвонить и пообщаться.\
    \ Тогда сделать это нужно вечером после 20 часов (московское время). 8-(34949)\
    \ 5-88-29.\nДело в том, что у парней нет выхода в инет, и я рискнула помочь.\n\
    Можете написать мне на мыло.\nПосоветуйте, как быть."
