        text: 'Дмитрий, я, конечно, понимаю, что в Блюзе ты разбираешся огого как, а я- лишь начинающий, но я не слышал толком не одного альбома, кроме, разве что Ppilgrim( мне он не понравился, как-то... не так), From the Cradle и Ridin'' With The King( эти мне понравились, причём второй больше), Всё остальное, что у меня есть из Клептона: обычные, пиратские и самопальные( по сути- тоже пиратские) а слайдовые его вещи мне просто нравятся... ну потому, что мне нравится как звучит слайд'
