      subject: Ты меня прости, конечно
      deleted: false
      text: "Но ты назвал самые \"ненужные\" альбомы Эрика. К ним относится и August, и Behind The Sun, и Pilgrim. Хорошие альбомы: Eric Clapton (1970), Ocean Boulevard, There Is One In Every Crowd, No Reason To Cry, Slowhand, Backless, Another Ticket, Money And Cigarettes, From The Cradle, Riding With The King, Riptide. Концерты: E.C. Was Here, Just One Night, Unplugged. Остальное либо слабее, либо вообще не нужно. Derek & The Dominos нормально, но это не совсем Эрик (концертник совсем слабый), Rainbow Concert плох, Journeyman слушать можно, 24 Nights длинный и местами пафосный и попсовый. Про три кошмарных альбома я уже написал. Behind The Sun можно слушать только треть, Август пару вещей, Пилигрим вообще нельзя. \nВот мое мнение на вскидку.\nCream хорош весь, Blind Faith тоже, Эрик с Мейаллом мне не нравится, хотя альбом ровный и грамотный. Просто когда пришел Грин, стало гораздо лучше."
