      deleted: false
      text: "просто мусор, пустая трата денег, лучше бы они в дворники пошли.\nКак объяснить, что что-то хорошо? ну конечно, обругав что-то другое. Кажется, понравилось человеку слушать Доктора Ника. как ему это внятно выразить? Легко - опустив станцию мир. \nРебята, если похвалить А невозможно без того, чтобы опустить В, значит, А на самом деле не высок и сам по себе недорого стоит, а только в сравнении с чем-то уж совсем хреновым. \nPS. Мы эту тему жуем со времен сотворения форума: бег по кругу  Примите мои уверения и прочее."
      replies:
      - id: 2627
        parent_id: 2622
        date: 2002-03-25 15:45
        poster: Дмитрий
        email: acblues@chat.ru
        subject: Кто-то когда-то сказал (+)
        deleted: false
        text: "- все познается в сравнении. \nАбсолютных критериев, особенно в восприятии искусства быть не может. Только сравнительные характеристики, причем верные только для данного субъекта в данный момент времени, поскольку другой субъект или тот же самый, но в другом душевном настроении, может поменять эти характеристики на полярные. \nЕжели Вам известны объективные критерии оценки любого произведения искусства, то Вы скорее всего искусствовед. Все остальное человечество, не обремененное высшим искусствоведческим образованием, спокойно может оперировать понятиями \"цепляет/не цепляет/цепляет сильней, чем то-то\". При этом само собой разумеющимся принимается тот факт, что сосед дядя Вася придерживается абсолютно противоположного мнения.\n\nПоэтому споры о вкусах будут всегда, именно для этого существуют в том числе и интернетовские форумы = дискуссии. \n\nИскренне и пр."
        replies:
        - id: 2640
          parent_id: 2627
          date: 2002-03-25 19:31
          poster: Andrei V. Evdokimov (evdokimov)
          email: evdokimov@blues.ru
          subject: получи, фашист, гранату. имхо, конечно
          deleted: false
          text: "так вот, в сравнении с мастерски сыгранным задушевным легким джемом Гая и Уэллса, альбом Эллисона - жалкая дистиллированная водичка, слишком чистенькая, слишком старательно сыгранная. Сама по себе ничего. но как раз в сравнении с Г&У она становится \"камерной\" (chamber music). Где у одних все естественно, там у другого все отрепетировано до состояния, когда на вдохновение места уже не остается. С точки зрения чистоты исполнения (читай: музыковедения), кон, выигрывает Муншайн. с точки блюза как филинга - бесспорная победа А&А.\nЯ немножко \"заискуствоведился\" - будем считать, что я сказал только: \"жалкая дистиллированная водичка\". \n--------\nи сразу о целях и причинах поста. если заменить \"бледную тень\" и \"дистиллят\" на какие-то менее категоричные формулировки - получился бы нормальный обмен мнениями о двух весьма достойных, в чем-то близких, в чем-то полярных альбомах. Но если переходить на \"А еще в шляпе!\" - то и обременять себя искуствоведческим образованием, разумеется, пустое. Ведь как раз о вкусах я не спорил."
