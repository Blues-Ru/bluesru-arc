  text: 'Недавно прибомбил два альбома Лютера: " Hand Me Down My Moonshine" 1994 и " Love Me Papa" 1977. Для тех,кто привык к неистовому Лютеру конца 80-х и 90-х это будет сюрпризом. Первый альбом-акустический,одно из лучших,что довелось слышать из современной акустики.Второй-для тех ,кто любит тягучий продолжительный блюз с экспрессивным вокалом и виртуозной изобретательной гитарой. Если бы топ-списки любимых блюзменов составлялись сейчас, Лютер был бы у меня там обязательно.'
