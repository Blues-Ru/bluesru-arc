          email: peregnoy@mail.ru
          subject: По информации Звуков-Ру
          deleted: false
          text: "Вот как это будет выглядеть: три вечера - 5, 6 и 7 ноября пиво и\
            \ блюз будут царить в Москве (в этом году решено проводить фестиваль в\
            \ УСЗ \"Дружба\" в \"Лужниках\", поскольку в прошлые годы зал МДМ не мог\
            \ вместить всех желающих). 9 ноября музыканты отправятся знакомиться с\
            \ Ростовом-на-Дону (ЗСК 'Спорт-Дон'), а 11 ноября - Санкт-Петербург, порадуют\
            \ поклонников в Санкт-Петербурге (Большой Зал ДС \"Юбилейный\").\n\nНемного\
            \ об участниках фестиваля 2002 года: \n\nLouisiana Red - музыкальная легенда,\
            \ царящая на блюзовой сцене вот уже полвека, автор двадцати двух альбомов,\
            \ из тех, кого называют \"живой блюз\". По отзывам прессы, он не просто\
            \ играет музыку, он дышит ей, говорит ей, а, оказавшись на сцене, затягивает\
            \ слушателя в водоворот своих эмоций. Противиться этому невозможно, нужно\
            \ слушать, сопереживать и наслаждаться.\n\nLil Ed & The Blues Imperials.\
            \ Удивительно, как человек ростом в полтора метра умудряется повелевать\
            \ залом. Но таков \"Малыш Эд\" Уильямс: ему подчиняются самые крупные\
            \ площадки, уступая той неукротимой энергии, которая руководит им с детства\
            \ - ведь Эд играет блюз с тех пор, как ему исполнилось двенадцать лет.\
            \ \n\nC.J.Chenier & the Red Hot Louisiana Band предложат оттянуться под\
            \ зажигательную музыку, основанную на неповторимой смеси блюза и фанка,\
            \ нечто похожее но то, что в 2000 году исполняли Lil' Brian and The Zydeco\
            \ Travellers. Си Джей не привык устанавливать границы для своей музыки,\
            \ предпочитая давать ей выплеснуться наружу до самой последней капли,\
            \ переполнить зрителя, и уступить место новой волне, которая придет следом."
