                подлежать не может (не должен), что, как правило в форуме, и происходит. Но правильно ли это?


                Приведу пример совершенно с другой полянки: замечательный французский пианист Jacoues Louisser пришёл в джаз
                их классической музыки. Только из классики то он ушёл, а до джаза так и не добрался - играет теперь джазовые
