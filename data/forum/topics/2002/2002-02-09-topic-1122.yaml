                    text: "Голубушка Грета, а Van Hallen пели Ice Man Джона Брима. И что теперь? ну, давайте в блюзовом форуме\
                      \ ВанГалленов обсуждать. Половина песен на альбомах Blue Cheer - блюзовые стандарты. А Том Джонс сколько\
                      \ блюзов спел? Элвис Пресли вполне забавно пел Got My Mojo Working... В 90-х у Kiss был аольбом (название\
                      \ не помню), где каждая песня начиналась с блюзовых подслайдованных перекатов со звуком нэшинал стил...\
                      \ Что с того?! Радостно получать подтверждение влияния блюза на всё и вся. Не более!\nЕсли блюзы поет\
                      \ Энгельберт Хампердинг - мы его не любим. Если Филипп Киркоров - мы его не уважаем. Если Ака-Дака -\
                      \ всё! наши люди! Да не фига! все трое имеют к блюзу одинаково далееееекое отношение, хоть и с разных\
                      \ сторон к нему идут. \nМожно я вам скажу то, что вы и без меня знаете, но почему-то не берете в учет?\n\
                      До недавнего времени (до моды на уорлд мьюзик) вся поп-рок музыка базировалась на блюзе. Понимаете?\
                      \ Если не вся, то 90%! Поэтому ни пепл, ни зеп, ни заппа, ни назарет, ни прочие - не могли обойтись\
                      \ без блюзовой формы. Но на этом их связь с блюзом и заканчивалась. \nГЛАВНОЕ: Эти музыканты находятся\
                      \ вне блюза, поскольку не понимают или не принимают принципов \"блюзования\". Они лишь берут у блюза\
                      \ отдельные исполнительские, композиционные и гармонические - очень удобные, кстати - приемы. Это много,\
                      \ но это лишь внешние средства. А принцип блюза как истории жизни ими отметается напрочь. особую мультиритмичную\
                      \ основу блюза они просто не воспринимают - и громыхают по четырем четвертям, как будто гвозди заколачивают.\
                      \ Послушайте блюзбэнд Мадди и сравните с вашими имяреками - неужто разницы в ритмике не слышите? Принцип\
                      \ блюза - меньше нот, больше коммуникативности. Принцип рока - больше нот, круче диктат. Блюз - разговор.\
                      \ Рок - лозунг. Блюз - личность. Рок - толпа. \nВот и разница!\nИ аську-даську я вполне даже ничего,\
                      \ дык при чем тут блюз?!"
