  subject: One more great BB's album
  deleted: false
  text: 'появился в моей виниловой коллекции - B.B.King "To Know You Is To Love You" (1973 ABC Records).

    Великолепный альбом (как и большинство его работ 70-х). На этот раз неожиданность - на клавишах Стиви Уандер! Он же автор
    одной вещи.

    Два явных "хита" - Respect Yourself (также большой хит у Staple Singers) и вещь Стиви To Know You Is To Love You.

    Мне досталась PROMOTION COPY (запись удивительной красоты и качества).

    Альбом довольно длинный (для БиБи).

    Всем советую, если найдете на СиДи.'
