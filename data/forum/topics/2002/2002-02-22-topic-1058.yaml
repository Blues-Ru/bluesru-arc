      text: "6ти тактовый блюз существует только в больном воображении. \nслова: \"Темп и ритм значения не имеют.Вот что такое\
        \ блюз.\" - выдают выдающуюся (шутка) ограниченность музыкальных знаний гриценки. В то время, как темп в блюзе может\
        \ быть любым, ритм в блюзе строго специфичен! приблизительно размер в 4/4 походит для описания блюза, но (настоящий)\
        \ блюз имеет ярковыраженную мультиритмичную (а не полиритимическую) основу. \nВпрочем, похоже, что Гриценко просто\
        \ не понимает разницы между терминами темп и ритм. \nевропейский мажорный и минорный лад, по мнению специалистов,\
        \ не в состоянии точно передать блюзовый лад. поэтому, если говорить не о прикладном блюзе (типа, ребята, играем в\
        \ ля), цепь \nC / F7 / C / C7 /F7 / F7 / C / A7 / D7 / G7 / C / C/\nпросто не имеет смысла по отношению к блюзу, поскольку\
        \ полностью пропускает специфику блюзового звукоряда. \nВ.Дж.Конен (которую необходимо прочесть прежде чем хоть слово\
        \ публично высказать о блюзе!) указывает, что термин доминанта не годится для блюза, в связи с тем, что блюзовый лад\
        \ не соответствует европейскому. пытаясь привязать описание блюза к сложийвшейся европейской системе, В.Дж.Конен прибегает\
        \ к термину \"доминантасептаккорд\". \nЛюбая европейская музыка, со времен  арс-нова (ХIV век), \"опирается на Тонику,Доминанту\
        \ и Субдоминанту\" - так что эта реплика тоже наукообразна, но абсолютно ничего не определяет. \n\nГриценко - малознающий\
        \ хам. но он прав в одном. в этом форуме меньше всего говорят о блюзе."
