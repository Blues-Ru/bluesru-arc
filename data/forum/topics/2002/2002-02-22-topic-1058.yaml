  text: "Уважаемые господа !\nЯ заглянул в ФОРУМ и диву дался вашему ДИЛЕНТАЛИЗМУ.Вы разговариваете о чем угодно , но НЕ О\
    \ БЛЮЗЕ.Давно уже пора определиться, ЧТО ЖЕ ТАКОЕ\n- блюз.Или вы все ориентируетесь на советский муз. словарь или энциклопедию\
    \ ? Так там написано - \" блюз\"- песни американских негров и\nпрочие аргументы.Но НЕ СОДЕРЖАНИЕ ( которое заложено, естественно\
    \ в словах песни)определяет этот жанр,потому что есть и инструментальный\nблюз(как разновидность вокального ). А определенная\
    \ ГАРМОНИЧЕСКАЯ СТРУКТУРА(определенная последовательность аккордов.Вот типичная\nструктура 12 тактового блюза ( 6 и 16\
    \ тактовые считаются архаичными,\nдревними.\nC / F7 / C / C7 /F7 / F7 / C / A7 / D7 / G7 / C / C/\nНетрудно заметить,\
    \ что блюз опирается на Тонику,Доминанту и Субдоминанту.Особенно в этом, втором варианте гармонической СТРУКТУРЫ\n\n C\
    \ / C/ C  / C / F7 / F7/ C / C/ G7 / G7 / C / C /\n\n Темп и ритм значения не имеют.Вот что такое блюз.\nУ вас же \"корифеи\
    \ блюза\" , \" боги\" и прочие регалии ОДНА БОЛТОВНЯ.\nВы все рассуждаете о блюзе, а в действительности говорите не о\
    \ блюзе.\n\" ВСЕ БЕДЫ - ОТ БЕДНОСТИ \". Ходить вам в лаптях !"
