    deleted: false
    text: 'Это классический пример заблуждения по незнанию. Термин "блюз" имеет два, а то и три значения.

      1) Музыкальная форма в джазе - тут Вы правы.

      2) Музыкальный стиль, который имеет очень МАЛО ОБЩЕГО с первым пунктом. Знатоку практически невозможно перепутать "Блюз
      в Блюзе" и "Блюз в Джазе" - абсолютно разные выразительные средства и т.д.

      3) Некий культурный феномен, связанный с пунктом вторым.


      Ким! Я гораздо лучше разбираюсь в джазе, чем Вы в блюзе. И я видел очень много крутых знатоков и любителей джаза, которые
      блюз сводят к первому пункту, будучи уверенными, что блюз - это некая древняя разновидность или ответвление или муз.форма
      джаза, причем, по блюзовыми исполнителями понимают "Бесси Смит", "W.C.Handy" и практически все... Это глубокое заблуждение.
      Мы интересуемся огромным количеством ДРУГИХ исполнителей, которые играют совсем другую музыку и пр.'
