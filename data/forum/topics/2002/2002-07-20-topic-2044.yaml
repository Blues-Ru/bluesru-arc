            Похожая история и с промо дисками. Крупные компании могут себе позволить поставить печать или даже сделать отдельный обычно урезанный дизайн для таких альбомов. Мелкие же и ленивые не парятся - сделал дырку и послал. Опять же, поверь на слово. У меня таких дисков предостаточно, в том числе и честно полученных от фирм и музыкантов. Все они с дырками, прорезями или испорченными штрихкодами.'
