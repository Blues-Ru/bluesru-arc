        text: 'Я никогда не был в США, но у меня очень много пластинок и друзей из США. Так вот, прорезь стоит не на штрих-коде, а просто сбоку. Это традиция идет еще со времен винила. Порча коробки (или обложки) - это последняя степень скидки - распродажа. Цена никогда не будет в 5 или 10 долларов за такое издание. Гораздо меньше.

