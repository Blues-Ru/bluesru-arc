    text: Дело в том, что все эти диски новые и пробитые. Это говорит о том, что они уже были в штатах в последней распродаже и кто-то (может и сам ПЛ) ими торгует. Я думаю, что это ПЛ занимается такой порнографией, ибо появляются они там постоянно. Такого рода дисков там много. Я уже знаю 4-х людей, которые купили Слепцов. Постоянно там лежит концертник Невиллз, будлег Джони Митчелл и многое другое. Если они этим сами занимаются, то это страшный позор. Прорезь (или дырка) на коробке дика говорит о том, что в США их уже ставили по 1-2 доллара. А нам, конечно, по 10. Но я доволен, один фиг.
