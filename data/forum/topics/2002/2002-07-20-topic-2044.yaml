      text: Прорезь или дырка в коробке (а иногда только в штрихкоде или даже просто большое на нем пятно) означает, что диск этот не для продажи. Ридер такой код прочесть не может, а продавец не может диск нормально продать. Диски же на сейле обычно имеют какой-либо стикер, а иногда (например когда магазин закрывается) вообще никаких специальных признаков. Тем не менее, мелкие магазинчики и частники вовсю торгуют дисками, которые продавать никто формальных прав не имеет. В зависимости от количества загатовленных для промоушена копий и популярности цены на эти нелегальные альбомы колеблются обычно от $0.5 до $10 за штуку. Так что пурпурная цена вполне адекватна мировой. :)
