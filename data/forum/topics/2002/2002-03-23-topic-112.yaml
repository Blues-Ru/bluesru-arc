  text: 'Вот вчера узнал что "I shot the sheriff" написал Piter Tosh. Почему то мне всегда казалось что это был Боб Марли.
    Вот как бывает. В связи с этим вспомнил больной вопрос, а кто автор "No womanm no cry" ? И кто же все таки написал "Wild
    Thing" ? Есть сомнения что это был Jeff Beck или Roy Orbison?


    P.S. Спасибо еще раз Dr.Nick! "На Бронной" было здорово! Хотя конечно фонтанчик немного отвлекал :) Но ей-богу не ожидал
    "Wish you were here" и "I shot the sheriff"! Супер!'
