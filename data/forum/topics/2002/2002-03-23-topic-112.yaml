    subject: Авторы
    deleted: false
    text: 'I Shot The Sheriff написал Тош, хотя на альбоме написано Марли. То же самое с Get Up Stand Up. Тош изначально был
      более острым и даже радикальным черным патриотом. Боб же был наполовину белый англичанин, в чем его даже обвинял Питер!
      Есть фильм про Тоша, где все это описано подробно. Не надо забывать, что сначала они были просто The Wailers, а имя
      Боб Марли в названии появилось только после ухода Тоша, да еще иногда на переизданиях на компакте.

      No Woman No Cry написана вообще третьим лицом. Некто V. Ford. Слова там вроде о Ямайке, но не думаю, что это был регги
      изначально. Скорее соул-баллада. Но это мои догадки.

      Про Wild Thing - это шутка? При чем тут Орбисон и Бэк?

      Спасибо за похвалу ;)'
