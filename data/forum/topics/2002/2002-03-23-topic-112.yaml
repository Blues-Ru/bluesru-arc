      text: 'Вообще с авторством у них там проблема.

        Считается (по надписям на альбомах, к-рые у меня были) что Нет Баба Не Плачь написал, кажется В.Форд, и его же перу
        принадлежат ещё где-то 5 песен. Я читал очень давно чуть ли не в Ровеснике, что этот Форд или как там его, безногий
        инвалид, и Робин Гуд Марли написал песню (со словами "кроме ног - нет у меня машины") и отдал ему права, чтобы его
        материально поддержать.

        Кроме того можно увидеть в одном источнике на разных песнях и Б. Марли и Р. Марли - что уже начинает попахивать Ритой,
        его женой. Попахивает Ритой, чёрт возьми!!!

        Самую гадкую песню про то, что следует проверять своих друзей (Кому Подходит Шапочка) сочинили басист и барабанщик.

        Я думаю что регги (ска, рок-стэди) это музыка Ямайских негров, которые попытались научиться играть ритм-н-блюз, но
        у них не покатило.'
