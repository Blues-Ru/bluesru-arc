    subject: пианисты...
    deleted: false
    text: '... появились в блюзе одними из первых, особенно если говорить о записях. Уже на записи первого в истории блюза
      Crazy Blues (1920) в исполнении Mamie Smith в составе аккомпанирующего оркестра Jazz Hounds имелся пианист Willie "The
      Lion" Smith. Все прочие исполнительницы классического женского блюза 20-х гг. также в 75% случаев выступали под аккомпанемент
      пианиста.

      О собственно блюзменах-пианистах см.:

      http://www.blues.ru/BlackCat/lc&sb.htm

      http://www.blues.ru/BlackCat/dc.htm

      http://www.blues.ru/BlackCat/ccd.htm

      http://www.blues.ru/BlackCat/gtd.htm

      http://www.blues.ru/BlackCat/luj.htm

      http://www.blues.ru/BlackCat/ccl.htm

      http://www.blues.ru/BlackCat/ps.htm

      http://www.blues.ru/BlackCat/chs.htm

      http://www.blues.ru/BlackCat/sr.htm

      http://www.blues.ru/BlackCat/rs.htm

      http://www.blues.ru/BlackCat/jy.htm

      Кроме этого, пианино и гитарой в равной степени владели такие великие блюзмены, как Лонни Джонсон, Скип Джеймс, Ледбелли,
      Тампа Ред, Пити Уэтстроу, Букка Уайт, и живой доныне Генри Таунзенд.'
