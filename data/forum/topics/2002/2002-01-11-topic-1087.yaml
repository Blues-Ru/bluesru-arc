  text: 'Нравится мне сей клуб отсутствием пафоса и удобством расположения сцены.

    Вот 6-го числа тут справлялся день рождения небезызвестного гитариста Ивана Жука...Народу привалило  - немеренно.

    Отыграли ребята в своей привычной маненре - отвязно , с оттягом , обстебав все что поддавалось стебу.

    На сцену был приглашен Д.Казанцев , но по причине его отсутствия  , интригующего совместного звукоизвлечения не последовало,
    и посему последнему был посвящен red house Хендрикса..

    Помимо сего грустного момента остальное удалось на все сто.


    Вчерашний джэм с А.Аграновским отличился плотностью - музыкантов было весьма не мало , и в то же время все прошло  без
    бардака и очень ровно.

    Дай бог что б продолжалось и впредь так же.'
