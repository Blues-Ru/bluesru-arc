    немного смутило ;)

    А сегодня впервые наткнулась на перечень ваших пластинок, где выяснилось, что
    она есть у Вас. Хотелось бы услышать Ваше, а также тех, кто слышал, мнение о Rusty
    Zinn и The Chill в частности.'
