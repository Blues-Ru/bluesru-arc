      subject: Спасибо, Вадим, помогли :)
      deleted: false
      text: 'Скорее всего, пластинка вполне может мне понравится - я тоже люблю разнообразный
        взгляд на блюз. Но в союзе она стоила 18-20, что и показалось странным для
        такого музыканта.

        Чуть-чуть о белых. Концертные записи John''a Hammond''a - очень понравились,
        желание попасть на концерт только усилилось. Диксоновская "Pretty Thing" и
        "Nadine" Берри звучат едва ли не лучше и живее, чем на номерной пластинке
        Хаммонда! И акустический - отлично! Акустическая "Drop Down Mama" просто супер!
        Записавшему - отдельное спасибо :)

        На днях купила последнюю пластинку белого Duke Robillard "Living With the
        Blues". Очень порадовала и привела в чувство в такую жаркую погоду! Если кто-то
        надумает кричать, что Robillard "отстой", напомню, что он играл, к примеру,
        у Дилана на "Time Out of Mind" и много у кого и где ещё ;) И замечательный
        скрипуче-хриплый голос..'
