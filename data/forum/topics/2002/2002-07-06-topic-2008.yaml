    subject: Rusty Zinn "The Chill"....
    deleted: false
    text: '....с участием Elvin Bishop(slide guitar),Jimmy Pugh (organ) & John Firman
      (tenor sax). Гитара без "наворотов", чистый звук, крепкая ритм-секция, вокал
      - не очень выразительный (но этим, по-моему стадают половина белых исполнителей),
      пластинка (CD) несколько разностильная,

      от R''n''Blues и R''n''Roll до "классического" через рокабилли (здорово об''яснил???).
      Вообщем, если попросят за диск 14$ или больше, я бы призадумался сейчас (хотя
      на момент выхода диска купил - и не жалею, т.к. слушаю блюз во всем его мнообразии
      - и стараюсь "ни в чем себе не отказывать"). Буду рад, если хоть как-то помог
      этим постингом.

      Вадим.'
