    text: С ним ситуация такая - сам-то играет на гитаре он действительно хорошо,
      особенно, если в хорошей компании. Но не хватает какого-то внутреннего чего-та,
      чтобы подобрать репертуар и пр. Его сольная пластинка не так впечатлила (хотя
      там есть пара хороших песен), его действительно бросает, возможно - благодаря
      внешности, на музыку типа Била Хейли или слюнявых баллад под 50-е. Одним словом,
      я бы вместо этой пластинки порекомендовал купить какую-нибудь другую...
