  text: 'Мне подарили ОСТ к фильму Leaving Las Vegas, который я долго искал (фильм
    люблю очень).

    Так вот, очень советую. Там и блюз и джаз и настроение особое. Конечно надо и
    фильм знать. Там три редкие вещи Стинга (блюз/джаз), отличная вещь в исполнении
    Дона Хенли (Come Rain Or Come Shine) и много красивых джазово-блюзовых тем. Они
    прекрасно подобраны и составлены.'
