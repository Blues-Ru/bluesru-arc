  text: 'На этот раз попались и были преобретены: Freddie King "Ultimate Collection
    1960-1975" 2001, Carole King "Rhymes & Reasons" 1972, Johnny Cash "Hymns By JC"
    & "Sings Precious Memories" 1959/1974. По джазу попался правильный альбом Joe
    Sample "Carmel" 1979.

    Там еще есть Мадди концертный 77-го года, Lowell Fulson (уже забыл название, но
    издание оригинальное с винила), много чего другого, что знаю только по именам.

    В отстое есть и Слепые Алабамцы, и Бесси, и Питер Грин. Так что вперед!'
