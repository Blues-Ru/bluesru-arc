      subject: ляпсусы от группы MAGIC
      deleted: false
      text: "из новогодней жизни \"MAGIC\": **Прикольные моменты за период с 31 по 2-е**:\n\"В ресторане \"Рис и Рыба\" быстро решалось по ходу, какую песню играть следующей. Илья сразу давал счет палочками и группа успевала вступить. Но получился момент, когда песню не успели наметить и начали совещаться. В это время Илья каждый раз нервно стучал палочками счет. Клавишница Соня и гитаристка Наталья должны были перекрутить свои ручки и кнопки на звук для очередной песни, а так как песня всё ещё не определялась, то они не знали какой звук нужно крутить. А Илья снова и снова тюкал счёт палочками. Тогда Наталья не вынесла и ляпнула: \n\"- Слушай, не стучи!, это у тебя барабан, а у нас инструменты, музыкальные...\" \n\n************\n\"В конно-спортивном комплексе: MAGIC вышли к месту своего прелюдодействия. Публика закричала:- Здравствуйте, музыканты!!! Соня ответила:- Здравствуйте, зрители.\"\n\n************\n\"Играет минидиск, под который Галина Куприянова исполняет песни на родном языке \"ребят\". Наталья-гитаристка стоит около пульта в относительно неподвижном состоянии и смотрит в потолок. Галина безнадёжно приглашает потанцевать тупо сидящий пипл и призывает: - \"ну что ж вы сидите, просили не по-английски, а сами сидите?\" Все бесполезно.\nТогда Наталья поворачивется к залу и говорит:\n- Ну. И для кого мы тут играем?\" \n************\n- Анекдот - * про Новый Год:\n\"- Не ем прошлогоднего, - сказал он и вышел из-за стола после двенадцати...\"\n\n************\nMAGIC работали на открытой площадке. \nПеред выходом группы на сцену к ведущему программы подбежал организатор концерта и быстро сказал:\n- Значит так. Объявишь: - \n- \"А сейчас девчонки исполнят мировые хиты - \n   жемчужины последних тридцати-сорока лет!\" - Понял?\n- Угу... - Конферасье с уверенностью выходит на сцену и объявляет:\n\" - А сейчас жемчужины тридцати-сорока лет исполнят мировые хиты !!!!...\" \n************\nДнём директору группы MAGIC срочно позвонили и пригласили на концерт. В экстренном порядке Наталья Терехова обзвонила коллектив, продиктовала всем адрес клуба и выехала на стрелку. Мероприятие прошло нормально, все вечером вернулись по домам. Звонит Соня и хохочет. На вопрос, что так её развеселило, она поведала:\n- Когда ты позвонила, я в такой спешке записала адрес \"бульвар Ушакова, 15\", что мой муж, придя домой и не зная где я, прочитал мою записку так: \"бульвар Ужасов, 15\". \n************\nСоня и Наташечка Терехова отдыхали в Анапе. Соня пыталась научить Наталью плавать. Поместила её в надувной круг. Но сколько Наталья не размахивала ручонками - с места не двигалась, лишь слегка относило её течением. Тогда Соня предложила выбрать какую-нибудь цель и попытаться до неё доплыть. Оглядевшись по горизонту, Наталья заприметила из нескольких светящихся вдали фонариков самый крупный и начала на него грести. Через некоторое время Соня подплыла к слегка утомившейся гитаристке и поинтересовалась:\n\n- \"Ну, как?\"\n- \"На месте\", - грустно ответила Наталья\n- \"Ну ты себе цель-то выбрала?\"\n- \"Да\"\n- \"Ну и куда ты плывёшь?\"\n- \"На ТОТ свет\" (имея ввиду тот самый фонарик вдaли)\n- \"Куда?????\"\n************\nНа день рождения гитаристки Соня решила подарить зонтик. Но возник вопрос - Наталья согласна была на зонтик только с черепами!...\n... И как-то понадобилось Софье вместе с мамой на рынок пойти по хозяйственной части. Она и говорит маме: \n\"- Вот хочу Наташке зонтик подарить\"\n\"- А какой она хочет?\"- спрашивает мама \n\"- С черепами\"\nМама подходит к палатке, торгующей зонтиками и совершенно искренне спрашивает продавщицу: \n\"- Скажите, пожалуйста, у Вас есть зонтики с черепами?\".....\n\"- ?!?!?!?!?!?\""
