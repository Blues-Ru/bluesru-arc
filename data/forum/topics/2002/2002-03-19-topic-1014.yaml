    deleted: false
    text: 'У меня есть один КД - совсем его поздний альбом 91-го года, что-то вроде Forever & Ever... Очень нравится! Он тоже не чужд тематике Нового Орлеана и индейских песнопений, что мне еще больше нравится в нем. Клевое пение и игра на пианино. Боксер он был тоже неплохой говорят ;)

      Я слышал ранние его дела и они мне нравятся меньше. Бирюков меня убьет сейчас, я знаю.

