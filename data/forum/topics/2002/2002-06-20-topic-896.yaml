          poster: Андрей Цыганков
          email: gypsy@mail.ru
          subject: Свобода как осознанная необходимость, или немножко гносеологии
          deleted: false
          text: "Володя, а свобода - это осознанная необходимость играть по правилам, кстати. Это даже древние говорили.\n\n\"...многие теряют волю начиная его играть. и им кажется что если отступить от его фраз и техники игры, то уже будет не то :)...\" - \n\nПризнаю, что я в своё время был парализован SRV как удав кроликом, но есть и положительные моменты - отрабатывая его приёмы под присмотром мудрых наставников, я поставил себе определённое звукоизвлечение - не скажу, что правильное (из скромности), но уж по крайней мере не вялое.\n\nЯ считаю, что поиграть SRV - правильный этап в развитии гитариста, но зацикливаться на нём не стоит. Просто SRV с технической точки зрения - это универсальный справочник правильных приёмов игры, то, что по науке называется эксплицитная методология, т.е. такая, которую можно пересадить из одной головы в другую, безусловно, с некоторой потерей качества, но сохраняя набор формальных признаков, по которым узнаётся стиль.\n\nНо: блюз ценен как раз имплицитностью, и Фредди Кинг как раз пример такого музыканта, стиль которого наиболее сильно привязан к личности исполнителя. По моему сугубому мнению, повторяю. Т.е. приёмы игры Фредди Кинга, несмотря на его личную массу и экспрессивность, на самом деле тоньше, чем у SRV, особенно для слуха среднего слушателя блюза. SRV быстрее опознаётся, однозначно.\n\nКстати, г-да профессиональные критики, приведите мне, пожалуйста, пример его композиции, в которой он узнаётся буквально с первых тактов, а то у меня личная фонотека по нему хиловата.. так уж сложилось исторически (( Только, пожалуйста, не говорите, что Фредди Кинг узнаётся всегда с первых тактов - при первом знакомстве с ним, мне это не показалось, я достаточно долго вслушивался в его манеру, но и сейчас не уверен, что распознаю его в 10 случаях из 10 предъявленных отрывков гитарных соло без вокала, и отличу, например от Luther Allison.\n\nПросьба регламентного характера к г-дам критикам: как бы вам не хотелось запустить в меня чем-нибудь тяжелым из благих побуждений экспресс-обучения в стиле дзэн, я ожидаю поступления полезной для меня информации в стиле академической полемики :)"
          replies:
