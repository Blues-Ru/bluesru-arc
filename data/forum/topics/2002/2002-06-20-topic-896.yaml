            subject: свобода :)
            deleted: false
            text: "то что ты написал - это один из вариантов. :) тебе не повезло - в процессе получения канд. минимума по философии, я написал большой тракт исследующий представления о свободе с глубокой древности по наши дни.. :) забавная игра разума - к делу отношения не имеет :)\n\nприемы не бывают правильные и не правильные. :) бывают те что звучат и не звучат. :) а это уже не от примема зависит. если проще взять заготовку от Вона, это не значит что это лучше :) \n\nФредди Кинг обладает уникальным звукоизвлечением и фразировкой - я любую его вещь угдаю сразу. :) даже если раньше не слышал... про вокал и говорить нечего.... играет он кстати железными когтями на полуакустике и фразировка его очень специфическая и интересная. :) \nНа Лютера Эллисона никаким боком не похож вообще. :) Лютер в этом плане менее уникален, но тоже уникален как исполнитель разумеется :))\n\nа средней слушатель с двух нот распознает композицию Гари Мур \"is Стил god зеблюз?\"  но это говорит о другом :)\n\n\"про пересадить, но стиль можно узнать\" - да так и есть :) у Вона такая музыка. а что это дает? тем что ты себе имлантируешь чужую фразировку и даже ощущения при игре.. ужас :)"
