              subject: Я благодарю моего учёного коллегу за столь быстрый ответ ))
              deleted: false
              text: 'Поскольку я тоже не лыком шит, и состоял в свое время в Философском общества АН СССР, то категории бытования свободы в нашем микросоциуме мы обсудим при личной встрече, дабы не сотрясать мудрёными словесами своды сего скромного собрания :)


                Вот Вы, мой учёный коллега, рассматриваете конечную стадию процесса, которую категоризируете как "звучит", а я рассматриваю как само состояние, так и процесс, ему предшествующий, то есть становление состояние, которое достигается во-первых, технически правильным исполнением соответствующего приёма, во-вторых, эмоциональным состоянием, которое этому приёму приличествует. Не могу в этом контексте не упомянуть нашего уважаемого коллегу, профессора Жука, который в момент исполнения отдельных музыкальных фраз очень искренне изображает мимически соответствующую эмоцию, что благоприятно воспринимается аудиторией.


