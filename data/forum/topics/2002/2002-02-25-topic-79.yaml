    deleted: false
    text: 'У меня на виниле есть "Концерт для блюзбэнда с оркестром" с ними в качестве солистов. Дирижер Озава, Бостонский
      симф-оркестр – все по-взрослому. Смурь. (не путать с дурью).

      есть тоже смурной а-ля мьюзик-классик сольник Siegel с камерным ансамблем (струнные, ф-но, немного перкашн), записанный
      Эллигейтором.

      Все это далеко не пошло. хотя и не сказал бы, что рекомендую. Примерно так: неплохо для эксперимента, невозможно слушать
      всерьез. Имхо, разумеется.

      PS. Вообще-то, ансамбль на свой манер авторитетный и известный. был. Siegel считался большим мастером губ-гар.'
