  text: "2 сентября день абитуриента был. Позвали сыграть в ДК МГУ. Это зал, сделанный\
    \ в виде уменьшенного Большого театра. С кем играть? Проблема, однако. \"Черный\
    \ хлеб\" по ряду причин отпал - один болеет, второй не может, третий может пахать,\
    \ а может и не пахать. Собрались в таком виде: Братецкий, Юра Каверкин, Кузнецов\
    \ (бас) и Саша Половинкин (ударные). И я пошел.\n     Конечно организация всего\
    \ этого была сложна. Лестницы, двери, переходы. Таски барабанов и комбиков. МГУ\
    \ доверху заполнено начальством, толку добиться невозможно. Акустика зала сложная,\
    \ с отдачей (а графиня, как известно, при отдаче хохотала). Ну, холл зверский.\
    \ Зал ничего для хоров и т.д., но любая громкая музыка - смерть. Решили играть\
    \ тихо. Ударник работал щетками, комбики включены на еле-еле и не подзвучены.\
    \ Голосовая линия была местная. За 45 минут мы все выстроили (покуда кругом вертелись\
    \ танцоры, балерины и хор мальчиков), а потом убрали за тюль. Включились за 3\
    \ минуты, и пошло-поехало. Честно, лучшего звука на сцене давно у меня не было.\
    \ Потом сказали, что и в зале был порядок. \n    Конечно, сцена, кулисы, свет,\
    \ гримерки - это реальное. Не клуб: разница. Полный зал молодых ребят, которые\
    \ хлопали, а  первом ряду сидел ректор с проректорами и гремели брильянтами. \n\
    Дай Бог здоровья всем Bluesspinners."
