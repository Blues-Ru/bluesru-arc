  text: "Добрых всевох, товарищи и друзья!)\n\nВопрос о замечательном нью-йоркском белом дельта-техасце Джоне Кэмпбэлле.\n\
    \nК сожалению, совсем почти не представлен он в Интернете -кроме ссылки с его странички на блюз.ру -мало что можно обнаружить.\
    \ В частности -текстов его я, после долгих поисков с самыми разными поисковиками -не нашёл. Что странно, ибо даже в ругательных\
    \ рецензиях бурчат на его речитативный вокал, монотонность, но отмечают, что лирика как раз интересна. \n\nни у кого текстов\
    \ его нету, а?\n\n\nи второе и главное....\n\nНа той же страничке, написанной-переведённой АЕ, есть упоминание о коллекцт=ионном\
    \ акустическом техасском концертнике Кэмпбэлла \"Тайлер Сейшн\". И даже выложен фрагмент Моджо Хэнд оттуда в реал-аудио....\n\
    \nУ кого-то есть этот диск?\n\nКаким - нибудь образом можно его  \"обреалить\"?\n\nГотов..не знаю... ханты-мансийской\
    \ мзды внести и прочь)\n\nИли этот фрагмент иными путями дошёл до реал-аудио?\n\n\nПросто самый удивительный альбом у\
