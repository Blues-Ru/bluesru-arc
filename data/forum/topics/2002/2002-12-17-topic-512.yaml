        subject: ну и что ж я там перевел?
        deleted: false
        text: "Разумеется, факты взяты из справочников. Формулировки, включая те, с которыми я теперь не очень согласен, я\
          \ сам родил. \nД.Уокер - не член бэнда Р.Крея. Композитор и продюсер, он работал со многими блюзменами. Если он\
          \ \"сделал\" Крея, это не значит, что он только деньгу закалачивать умеет. Насколько я догадываюсь, Уокер ставит\
          \ своей задачей некую \"коммерческую состоятельность\" блюза; и часто берет подлинных блюзменов, аранжируя их музыку\
          \ под приемлимый для нью-йорка радио-формат. Между прочим, пока Уокер был продюсером альбомов Крея, там звучало\
          \ больше блюзов (по форме), чем теперь. Но Крей - не единственный подопечный Уокера. К примеру, Уокер продюсировал\
          \ мемфисского блюзмена-таксиста Мема Шэннона. Вот уж точно - не ради денег. \nTyler... - это, вроде бы, \"домашние\
          \ посиделки\". Точнее не знаю, музычка была скачена откуда-то из нета три года назад - кто ж теперь вспомнит, откуда\
          \ именно. \nС горбушки этим летом мне принесли редчайший благотворительный альбом Blues Guitar For The Homeless,\
          \  инициатором которого был все тот же Ронни Ирл. Дж.Кэмбэлл там изображен на back-cover. Поет он там мало, но много\
          \ играет: с Доктором Джоном и Одеттой. Другие треки записаны: Tab Benoit, Clarence \"Gatemouth\" Brown, Johnny Copeland\
          \ и Sue Foley. Замечательный составчик!\n\nPS к возбудившемуся спору могу сказать только одно: крайности (хвалебные\
          \ или ругательные) не могут отражать реальную действительность по причине своей однобокости."
