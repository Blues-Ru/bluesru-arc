        Ответ Ильи:

        ================================================

        если дана такая формулировка, Дима, - видимо у тебя были два последних альбома ЕДИНСТВЕННЫЙ, КТО ВЕРИТ и МОЛЯ О ПОЩАДЕ.


        (к слову - почти также отреагировал  некий рецензент, который о лирике отозвался хорошо))) об остальном - твоими словами.
        Я эту рецензию по Гугглю отыскал. в не-рунете)


        Сделаны они были в современном саунде с Деннисом Уокером из группы нелюбимого, признаться, мною тов. Роберта Крэя...


        Я - пристрастен, потому всё, что хорошо и на этих альбомах -странный, чуть заторможенный драйв, полузвериный хриплый
        рык, пронзительная и одновременно мягкая слайд-гитара -отношу на счёт Кэмпбэлла. Всё, что не очень хорошо -в частности,
        общий саунд, усредняющий уникальные кэмпбэловские черты до ..коммерческого звучания -на счёт Уокера..


        А первый альбом A Man and his blues - вот уж не поднимется язык ни у кого сказать, что он от блюза далёк. Большинство
        песен сделаны в две гитары - Кэмпбелл и Ронни Ирл. Поётся техасская "хопкинсовская" классика - ГОНЮ В ДАЛЛАС, СИНЯЯ
        ПТИЦА)... Превосхожднейшая рэговая инструменталка Deep river rag (или Red river?)....


        в общем и целом - непохоже на два последующих альбома, но впечатление сильнейшее. Он именно за этот альбом и Грэмми
        получил...


        а то, что странный - да... Там биография вполне ...как  судьба романоязычных поэтов в фильме ПОКРОВСКИЕ ВОРОТА)


        ================================================'
