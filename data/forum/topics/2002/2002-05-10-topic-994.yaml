      subject: Диспозиция
      deleted: false
      text: Там небольшой зал, 100 мест. Очень прикольный, душевный такой зал. Стоит голосовой Фендер (4 по 300 W, оконечник, пульт), монитор, микрофоны и стойки. Будет пара гитарных комбиков (Блюз Джуниор + некий), ударная установка. В принципе, бери инструмент, который тебе будет удобнее. Что взыграете, выбирать вам. Полная свобода. Мы с Юрой займемся общей подключкой часов с 6, будем там все время и постараемся помочь по всем вопросам.
