  text: "Ходил на Регтайм. На улице встретил Бека (ударника), очень славный парень. Потом подошел Юра Каверкин. Зашли в Форте. Народу было немного, что нормально для теплого сезона, отягощенного \"майскими\". Сейчас везде так. Импрессарио хватаются за сердце, удивляясь малолюдству в клубах. Точно также городские власти удивляются первым снегопадам... \n\nРегтайм - это очень здорово. Даже и рассусоливать тут нечего. Послушал дома их пластинку Heavy Steppin' и укрепился в этом мнении. Свои вещи интереснее каверов (что большой плюс). Чуть, может быть, поменьше надо было бы гитарных нот на кв. сантиметр... По крайней мере, редкие места \"с воздухом\" были очень выигрышны. Ну да мелочи это. Толчок бы Регтайму хороший. Где вы, Хэммонды. Ломаксы, на худой конец. Собиратели и меценаты. \n\nСегодня будем выступать в ... (рекламная пауза), а завтра в новом прикольном клубе ... (пропущено самоцензурой). Готовность номер один. Курс прежний, ход задний. В среду джем в клубе ..Кинг, в четверг - в Зоо... \n\nБыл записан (через электретный микрофон на ноутбук) опен-эйр ЧХ + Братецкого + Тамары & Вовы Кожекина + Жука на ступенях Биофака 27 апреля. В конце очень чувствуется дух. Без комментариев."
