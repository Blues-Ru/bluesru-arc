        text: "Из личного опыта. Записал одну девушку поющую блюз на анг. Девушка с инязовским образованием. Отдал послушать натуральным англоязычным канадцам. Они - очень хвалили именно произношение. А вот несколько \"наших\" метров и пока еще не метров, к моему удивлению, всячески хаяли ее произношение, говорили что ужастный язык, твердый акцент, ну и т.п.\nСам я владею плохо, хотя и жил там несколько лет, но говорить увы так и не выучился. Не способен к языкам, но я и не пою. Потому, я думаю, что не страшно. \nТак и американцы русскую народную споют иногда очень даже прилично. Только мало кто сможет это сделать. А основная масса - будет кошмарно коверкать слова, и уж точно, телеги на сцене толкать не смогут, разве что только заранее заготовленные. Короче - имитаторы и пародисты они и есть, имитаторы и пародисты, и не более того."
