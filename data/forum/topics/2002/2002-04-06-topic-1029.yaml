          subject: Объясняю
          deleted: false
          text: "Майк и Чистяков - двойной оффтопик на этом сайте. Они не блюз и поют по-русски ;)\nТы правда не знаешь Dr.\
            \ John? The Night Tripper? Mac Rebennack? Года такие: альбомы с 67-го по сей день, а играет он и пишется с конца\
            \ 60-х. Играл он все: психоделию, шаманскую музыку индейцев с блюзом, новоорлеанские дела свои (у них там есть\
            \ и своя музыка), кейджун, фанк (вот его стихия), джаз, блюз. Он пианист/органист, гитарист и вокалист. Был абсолютно\
            \ безумен на первых 4-х альбомах, потом полегче стало ему ;) Сейчас он в лучшей форме! Все альбомы с 94-го года\
            \ заслуживают особого внимания (особенно Anutha Zona & Creole Moon). Первый альбом должен иметь каждый - Gris\
            \ Gris. Gumbo - самый его популярный альбом в стилях блюз/ритмнблюз. In The Right Place & Desitively Bonaroo -\
            \ два альбома с The Meters - убойный фанк, обязательный для прослушивания и коллекционирования. In A Sentimental\
            \ Mood - интересный диск в стиле поп-джаза и блюза; его исполнение Black Night Is Falling - мое любимое (на всем\
            \ альбоме играет Marcus Miller на басу). \nУ него было много хитрых проектов типа Bluesiana Triangle (Art Blackey,\
            \ Dr. John, David Newman) и он очень известный session man.\nhttp://www.allmusic.com/cg/amg.dll?p=amg&sql=Bcx5ibkr96akx\n\
            Вот почитай тут, но прежде чем что-то купить, спрашивай, можно напороться на полный бред; дело в том, что его\
            \ ранние записи до первого альбома не имеют копирайта и их в разных вариантах выпускают мелкие левые фирмы. У\
            \ меня уже есть два таких ;)\nНу вот как-то так кратко и сумбурно ;)"
