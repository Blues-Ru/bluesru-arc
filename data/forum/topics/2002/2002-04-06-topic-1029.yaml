              с Диксоном сотрудничал... Классный, классный мужик.

              Как гитарист(!) Вэйтс и на "Wicked Grin" фигурирует (кстати, в "Новостях" на блюз.ру было же об этом альбоме).
              А Хэммонд в записи вэйтсовского "Mule Variations" участвовал. Кроме одной народной (кажись, это последняя, где
              они вдвоём поют), "Fannin Street" - эта песня не Ледбелли часом? Насчёт лучше или хуже чем в оригинале, спорить
              не буду - кому как. Но здорово, несомненно. Скажем "Shore Leave", которая здесь, на МОЙ взгляд, лучше, чем у
              Тома на "Swordfishtrombone", но послабее, чем у него же на "Big Time" (видео). А "Jockey Full of Bourbon" и
              в оригинале будьте-нате.

