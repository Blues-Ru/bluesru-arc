                text: 'Да я ж не отстаивал вэйтсовские достоинства (чёрт, чушь какая-то получилась). Активно присоединяюсь
                  к словам Алекса IV: видео Big Time посмотреть (и иметь) просто необходимо. Там в плюс к CD варианту есть
                  Shore Leave, More Than Rain (издевательская версия) и эта, как её... ну, первая песня с Franks Wild Years
                  (очень мощно). А как они Raindogs исполняют... Можно без звука смотреть - всё равно станцуешь.

                  Действительно, там мегафон присутствует. Что-то подобное и Бифхарт (пардон) устраивал - пел, например, в
                  гитарный звукосниматель.

                  Про Хикса сам ничего не знаю (но диск сей имею), Знаю только, что первый альбом у него вышел году в 69-м.
                  Диск может и ничего, но с этими тремя (Джон, Чак, Хоукинс)рядом - по-моему, слабоват.

                  За симпатию к Скримин Джею - мои комплименты.'
