                  deleted: false
                  text: Был такой альбом - "Step Right Up" назывался. Типа трибьюта. Разные артисты и группы записали песни
                    Вэйтса. В середине 90-х гг примерно...  Я его не слышал. А кто-нибудь слышал? какие есть мнения?
                  replies:
                  - id: 3660
                    parent_id: 3644
                    date: 2002-04-12 16:26
                    poster: shkin
                    email: shkin
                    subject: Каверы, Big Time и не только
                    deleted: false
                    text: "С этим альбомом связана довольно неприятная история. Легко заметить, что на нем, так же, как и\
                      \ на втором сборнике-трибьюте фирмы Manifesto Records \"New Coat of Paint\", представлены песни только\
                      \ первого периода Тома Уэйтса. Период этот закончился переходом с лейбла Elektra на Island Records,\
                      \ довольной резкой сменой стиля и выпуском по дороге саундтрека к фильму \"One from the Heart\" Френсиса\
                      \ Форда Копполы. Часто бывает что, подписывая контракт, молодые артисты не задумываются, кому будут\
                      \ в дальнейшем принадлежать права на их произведения. Так случилось и с Уэйтсом. Как следствие мы имеем\
                      \ два сборника ранних вещей \"The Early Years\" и два трибьюта, выпущенные по собственной инициативе\
                      \ бывшего менеджера Тома. Все четыре альбома, кстати, получились весьма неплохо, однако отношение Уэйтса\
                      \ к проблемам копирайта теперь оставляют желать лучшего.\n\nКроме упомянутых здесь каверов, я бы отметил\
                      \ очень интересный альбом \"Temptation\" канадской джазовой, а в последние годы, скорее, поп-джазовой\
                      \ певицы Holly Cole. Он полностью состоит из кавер-версий песен Тома и записан, по большей части, в\
                      \ составе трио с фортепиано и контрабсом. \n\nКроме того, не забудем и о альбоме \"Strange Weather\"\
                      \ Marianne Faithfull, заглавная песня которого была специально для него и написана и лишь потом исполнена\
                      \ самим Уэйтсом.\n\nНу, и на закуску несколько альбомов с Томом в качестве гостя: Tin Hat Trio \"Helium\"\
                      , Teddy Edwards \"Mississippi Lad\", Gavin Bryars \"Jesus' Blood Never Failed Me Yet\" и сборник-трибьют\
                      \ \"Lost in the Stars: The Music of Kurt Weill\". Каждый из них заслуживает отдельного рассказа.\n____\n\
                      \n\"Big Time\" выходил в четырех разных вариантах: на видео, на CD, на виниле и на кассете. Весьма удачный\
                      \ коммерческий ход. Сейчас ходят слухи, что в обозримом будущем его наконец выпустят на DVD.\n____\n\
                      \nИ еще. Любителям бутлегов и прочих редкостей я бы рекомендовал наведаться вот сюда: ftp://raindog.myftpsite.net/.\
                      \ Подробности тут: http://www.raindogftp.com/."
                  person_id: 82
