    text: "Холмстром сам заявил, что будет беспардонно нарушать границы музыкальных жанров, и заранее пригнулся, чтобы не\
      \ сильно били по голове. Блюза там доля есть, но все остальное я бы блюзом называть не пытался. Но, конечно, результат\
      \ очень крутой и веселый получился. Отношение может быть неоднозначным, но по этой пластинке совершенно ясно, каким\
      \ монстром в музыкальном плане является Холмстром. Там такие аранжировки! Совершенно новые и незаезженные. \nДля Греты\
      \ - там три трека с Медески записаны ;)"
