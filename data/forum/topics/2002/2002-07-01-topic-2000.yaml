    text: "иногда в околобьюзье забегает :) Замечен в связях с Чаком Уайсом, который, в свою очередь, играл с блюзовыми музыкантами. Пластинка Extremely Cool. \nПосмотрела ниже упомянутый \"Circus\" Rolling Stones Rock and Roll(1968). Приятно видеть и слышать юных тогда ещё музыкантов: Taj Mahal, RS (Джаггер просто лучезарен :), John Lennon, Eric Clapton.. \nДаже нелюбимый мною ранее Jethro Tall здесь очень порадовал! \nСупер коллектив :) \"The Dirty Mac\" сыграли Yer Blues - Леннон отлично спел блюз в сопровождении молодого и ярко одетого :)Эрика Клэптона. У Мика Джаггера получился чудный блюз \"Parachute Woman\" :) \nТаж превосходно использует \"инструмент\" clap hands :)\nКстати, у Джаггера есть брат - Cris Jagger - блюзовый музыкант, если я ничего не путаю. На пластинке Knights of the Blues Table(1996) есть вещь Racketeer Blues, записанная Крисом Джаггером и Миком Джаггером. Мик там играет на губной гармошке.\n\nPS: вышла пластинка \"Circus\" The Young Person's Guide To King Crimson (double live album 1969-1998). Может кто-нибудь её уже посмотрел? Поделитесь впечатлениями от увиденного :)\n\nPPS: ещё Ричард Гир известный музыкант :) Вот только не знаю, в каком стиле - не слышала ни разу :("
