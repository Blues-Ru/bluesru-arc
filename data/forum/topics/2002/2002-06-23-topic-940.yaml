  text: "Я часто хожу в БиБи Кинг (где-то с яянваря) и ни разу не был разочарован\
    \ так как в этот раз...Да раньше тоже были не очень хорошие концерты, например\
    \ Ragtime и джем С Борисом Булкиным. Но в этот раз... Слов не хватает...Никогда\
    \ еще на моей памяти группа так мало и так коряво не играла. \n   Начали они концерт\
    \ в девять вечера, потом с 9:40 до 10:10 был перерыв, а потом еще до 10:40, итого\
    \ 1 час 20 мин. странных песен: Роллинги, Моррисон, Ленном +Боуи + вообще какой-то\
    \ брит-поп,и все это в страных аранжировках Ничего не понимаю. Ребята определитесь!!!!\
    \ \n  Отвратительное исполнение, невнятный вокал, совершенно странные проигрыши\
    \ во многих песнях, нелепые концовки + постоянное издевательство над менеджерами\
    \ клуба.\n  А ведь ребят просто попросили играть потише. Просто потому что это\
    \ жилой дом, да еще и новое постановление мэрии о тишине. Но нет их это видите\
    \ ли обидело и они решили оторваться и доказать какие они этакие все из себя.\
    \ А свист в два пальца на последней песне это вобще кошмар и глупость!!!!\n  А\
    \ публика? Никогда такого не было, чтобы во время исполнения песни зал шумел,\
    \ мало того было слышно как люди говорят. Позор ( в первую очередь для группы)!!!\n\
    \ Впервые за пол-года мне жалко тех денег которые я отдал, и жалко 3-х часов жизни\
    \ испорченных этим концертом."
