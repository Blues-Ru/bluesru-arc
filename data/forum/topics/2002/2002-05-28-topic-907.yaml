        poster: Андрей Цыганков
        email: gypsy@mail.ru
        subject: Ты знаешь, я эту статью воспринял почему-то совсем без чувства юмора...
        deleted: false
        text: "Древние говорили: суть сообщения не в намерениях автора, а в том, какой\
          \ эффект оно произвело на получателя сообщения.\n\nВот мне очень интересно,\
          \ что г-н Тынку хотел добиться публикацией сего опуса? Что его блюзмены\
          \ за это пивком угостят, похлопают по плечу и скажут: \"Ну, брат, ты это...позабавил,\
          \ мы без претензий, мы ж понимаем - ничего личного, и вообще это не про\
          \ нас, а про америкозов типа\"? \n\nПолучился у г-на Тынку очень грубый\
          \ и провокационный опус, достойный скорее опубликования в газетке \"Русский\
          \ Патриот\", чем на музыкальном сайте.\n\nЯ только удивляюсь: уж коли блюзменов\
          \ г-н Тынку объявил прародителями гомосексуалистов, то  надо ему было для\
          \ логической стройности своей концепции произвести самих блюзменов от жидомасонов,\
          \ так и  онтогенезис страдать не будет, да и семантический ряд будет соблюдён.\n\
          \nМоё личное мнение таково, что г-н Тынку страдает графоманией и нарциссизмом\
          \ в крайне извращенной форме, к тому же пользуется своим служебным положением\
          \ для публикации этого и ему подобных опусов на своих же сайтах, нисколько\
          \ не задумываясь о таких простых вешах, как честь, достоинство, порядочность\
          \ и уважение по отношению к коллегам-музыкантам.\n\nИзвините, я старомоден.\
          \ Наверное, ничего не понимаю в современной музыкальной публицистике."
