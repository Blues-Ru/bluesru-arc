  subject: Вопрос специалистам
  deleted: false
  text: "Господа блюзмены!\nПозвольте задать вам следующий вопрос. На альбомах блюзовых (и не только) музыкантов обычно указывают, кто из исполнителей на каком инструменте играет. Бывает, указано, Charles Brown - organ. А чаще, например, Lucky Peterson - organ (Hammond). \nОбъяснте, пожалуйста, чайнику в инструментах, орган \"Hammond\" - это какой-то особенный орган? Чем он отличается от просто органа (если отличется)? И если был такой человек - Hammond, то кто он - музыкант, мастер по изготовлению музыкальных инструментов или кто-то еще.\nБлагодарю за ответ"
  replies:
  - id: 1715
    parent_id: 1713
    date: 2002-03-02 17:11
    poster: Федор Романенко (fedor)
    email: fedor@blues.ru
    subject: Hammond
    deleted: false
    text: 'модель B-3, к примеру. Это большой деревянный ящик с кучей проводов внутри  и потрясающим звуком. Полностью аналоговый электрический инструмент - повторить его в электронном исполнении никому не удалось, а сам звук стал эталоном электроорганного звучания. Поэтому играют уже лет 60 лет на тех самых хаммондах с той же самой схемой. К нему обязательно прилагается усилитель-колонка Лесли - внутри два вращающихся динамика - чисто электромеханическая примочка, которая дают специальный неповторимый звук.

      В России есть один Хаммонд у Арутюнова, и его привозят на все концерты знаменитостей.'
    replies:
    - id: 1721
      parent_id: 1715
      date: 2002-03-02 18:37
      poster: Sergei  Kiritchenko (VoID)
      email: skvoid@yahoo.com
      subject: о Хаммонде (органе)
      deleted: false
      text: 'Хаммонд-орган был изобретен и построен бывшим часовым мастером Лауренсом Хаммондом в 1935 году в США. Автор основал компанию по этой теме. Сам орган построен по принципам сходными с Телгармонией Кэхилла, изобретенной в 1900, посему и звучит он слегка похоже. Генератор тона собран на синхронных двигателях переменного тока, которые были приспособлены к передаточному механизму как-бы, управляющему серией "тональных" колесиков, которые вращались между магнитом и катушкой. Характер и кол-во ударов по каждому "колесику" в комбинации со скоростью вращения определяли высоту тона и окрас звука. Всё это приблизительно выглядело как хорошо-темперированая настройка. В общем, весь этот агрегат выделялся уникальным тембром и стабильной интонацией, что было не просто для электронного инструмента. Нота содержит много обертонов, что и слышно в богатстве звука.


        Хороший музыкант Джон Хаммонд к созданию органа вроде не имеет никакого отношения.


        В смысле исполнительского мастерства я бы выделил, в контексте нашей общей темы форума, таких музыкантов, как Джимми Смит, ну и конечно Отис Спэнн, который иногда весьма неплохо аккомпанировал на Хаммонде в множестве известных блюзов.'
