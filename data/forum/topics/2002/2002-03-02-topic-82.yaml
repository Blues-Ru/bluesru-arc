        deleted: false
        text: 'целью изобретателя-инженера было сделать общедоступный церковный(!) орган. Это было вполне коммерчески осмысленным заказом. Маленькие церкви не могли позволить себе дорогой классический орган, и потенциально заказов на его более дешевый заменитель должно было бы быть много. Исторический казус в том, что в церквях Хэммонд Би-3 так и не прижился. Его почти сразу после изобретения стали пробовать в джазе, однако по настоящему распробовали только лет 15 спустя после изобретения.

          Сергею: можно указать источник информации? хотелось бы почитать поподробнее о "Телгармонии Кэхилла".'
