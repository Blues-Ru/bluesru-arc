        subject: коммунизм не за горами
        deleted: false
        text: "Я уже предлагал способ, как сделать так, чтобы деньги не доставались жадной администрации клубов. Приятно,\
          \ что почин подхвачен. Действительно, обидно, что посредники при продаже компактов, слишком много себе гребут. Вывод:\
          \ не платить вообще. Пусть музыкантам ничего не достанется, пусть энтузиасты-продюсеры пролетят и наймутся работать\
          \ клерками в Sony/CBS – зато мы накажем жадных посредников….\nНачихать, что больше не будут записываться малотиражные\
          \ блюзовые альбомы. Плевать, что блюзмены будут играть только до свадьбы-женитьбы, а потом займутся работой на прокорм\
          \ семьи и останутся при убеждении, что народ только попсу слушает. Не важно, что те же самые посредники займутся\
          \ торговлей джинсов или чупачупсов и продолжат жить на спекулятивные доходы. Главное – мы проявили принципиальность\
          \ и дали по рукам алчным делягами… Погодите, вроде, деляги-то как раз остались при своем бизнесе, только профиль\
          \ поменяли?.. Ну, это детали…Все-таки мы молодцы, нас на мякине не проведешь!\nДля тех, кто понимает все только\
          \ в лоб. Нет, я не за коммерцию на музыке. Для музыкальной коммерции есть совсем иные плодородные почвы, а на блюзе\
          \ много капусты не срубить.J В другом форуме мне уже приходилось спорить именно о ценах на компакт-диски. С точки\
          \ зрения торговли, это предмет массового потребления. И, как таковой, попадает в категорию карандашей и тетрадок,\
          \ кухонных мочалок и прочего ширпотреба. Цена таких товаров определяется не стоимостью их производства (по той причине,\
          \ что собственно стоимость составляет лишь малую часть их продажной цены), а в соотношении с уровнем доходов населения.\
          \ Поэтому в богатой Европе СД стоят от 30баксов и выше, в Японии – и того больше. Тот факт, что их можно купить\
          \ и дешевле, если знать, где, – как раз доказывает, что цена на СД – понятие относительное. И транснациональные\
          \ компании выпускают специальные тиражи для стран победнее – с соответственно меньшей ценой. Практика эта дошла\
          \ уже и до России. Многие в этом форуме, наверное, обладают диском ТаджМахала, купленным за 5-6уе. Это из серии\
          \ BMG – For Russia only (оно и радует, и ставит нас в один ряд со Средней Азией, где распространяется аналогичная\
          \ серия «для бедных»). Но с Тадж Махалом это допустимо – он достаточно «многотиражный» человек. А вот Аллигатор,\
          \ Блэк Топ, Блайнд Пиг не смогут себе позволить такие поблажки. Тиражи их альбомов невелики. Дальше начинается уж\
          \ совсем экономическое занудство, так что лучше остановиться здесь. Но пора понять, что бесплатного – не бывает.\
          \ \n(Как уже верно было замечено, если тебе что-то досталось бесплатно – это потому, что кто-то за это уже заплатил.\
          \ Пример из личной жизни: все, пришедшие бесплатно на фестиваль губной гармоники, сидели там за счет тех, кто заплатил\
          \ за билет. Если бы все были «друзья и знакомые», то этот фестиваль в ЦДХ стал бы последним… Забавно, что богатые\
          \ люди в кабаках готовы пропить или проесть суммы в 10 раз большие, чем плата за вход. Но на музыкантах они хотят\
          \ сэкономить.) \nВернемся к теме… Не надо говорить, что, покупая пиратский компакт – ты наказываешь не музыканта,\
          \ а жадных посредников. Ты просто отдаешь свои деньги другим, таким же жадным, делягам. Одни от других отличаются\
          \ только тем, что пираты уж точно ни цента блюзменам не отдадут! И тем, что ни цента из доходов собственно в музыку\
          \ они не вложат! Так зачем же обрубать хотя бы малый ручеек, который достается музыкантам, композиторам, продюсерам,\
          \ звуковикам, художникам? А затем, что денег жалко. Ну так не надо свою жадность прикрывать рассуждениями о справедливости,\
          \ или экономической идиологией новых «экономных» русских, которые покупают ролекс, потому что он выглядит как ролекс\
          \ и время показывает, а где собран – не важно.\nВ общем и целом, я согласен с тем, что блюзменам платить не надо\
          \ – пусть питаются на то, что бросят в шляпу! Но вот блюзовые альбомы, увы, исчезнут. Блюз может и свалиться на\
          \ тебя ниоткуда, когда ты проснешься рано утром. А вот студия и завод по производству СД – не свалятся. \nИ уж если\
          \ кто дочитал этот длинющий пост до конца… Не могу и не хочу утерпеть и не сказать вот что: иметь возможность покупать\
          \ фирму без ограничений, и при этом покупать пиратские диски – это такая дешЁвка… такое паскудство… и, если человек\
          \ этим еще и кичится, то, видать, свою совесть он тоже по дешевке купил."
