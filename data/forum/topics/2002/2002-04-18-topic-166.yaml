      text: 'Скажу два комментария:

        1) Пиратские диски в большинстве случаев по содержимому не отличаются от оригинала. Только полиграфия, буклет и пр.
        Если цифру записать без ошибок, то она будет идентична. Мне тут начнут возражать, но я даже в разговор вступать не
        буду ;))

        2) Как сейчас делают пиратские диски: пират заключает договор с РАО о том, что РАО передает ему права (которые по
        утверждению РАО у него есть) на издание диска за определенные отчисления. Само РАО - полуподпольная нелегальная, но
        зарегистрированная организация, если начнут искать, то главного бухгалтера не найдут. Если начнут наезжать юридически
        на пирата, он прикроется договором - я не виноват, идите с обыском к РАО.


        Я бы выбрал пункт 1. Ибо 100000 хороших блюзовых дисков не существует. Пираты выпустили не более 100-200-300 хороших
        блюзовых дисков.'
