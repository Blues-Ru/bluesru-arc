  text: 'Расслушал я наконец концерт в Ронни Скотт 99 года и должен сказать, что я
    просто в восторге! Это еще более удивительно потому, что я не люблю концертники.
    Этот же великолепен по настроению и подбору материала - истинно блюзовая запись.
    Даже Green Manalishi и Rattlesnake Shake звучат как глубокие блюзы. Все арранжировки
    приблюзованы.

    Как я понял никто так и не поехал в СОЮЗ? А зря. Все разберут и будем опять глядеть
    на ценники по 18-20 долларов. Грин этот там тоже есть, кстати.'
