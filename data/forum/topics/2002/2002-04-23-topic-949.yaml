        text: 'реклама? = 0,5. то есть некоторые деньги потрачены на то, чтобы некоммерчесткая организация своими силами изготовила и расклеила по МОскве 500 афиш формата обычного а4. если повезет, Эхо М. окажет небольшую поддержку. На этом реклама и кончается.

          Тут вот о чем нельзя не думать... В Москве определенно есть 600 человек, которым музыка "Регтайма" придется по сердцу. Есди бы они пришли и купили билеты, то Регтайм приехали бы снова, и записали бы еще второй альбом.. процесс бы пошел... у нас здесь тот случай, когда все зависит о нас... есть разные планы по разным направлениям... но нужно доказать самоокупаемость... блин... у меня же был незачет по политэкономии МГУ?'
