  subject: '"Ragtime" в ЦДХ'
  deleted: false
  text: "Только что вернулся из ЦДХ с билетом на \"Ragtime\" (03.05). Билетов там - просто завались! И, похоже, их действительно не хватают, потому что на просьбу продать билетик, кассирша полезла куда-то в нижний ящик стола и, сдувая слой пыли, извлекла оттуда практически непочатую тетрадку билетов. \n\nДрузья! Надо поддержать гастролёров!\n\nПро цены: как совершенно верно писал Андрей, от 200 руб и выше билеты стоят с 1 по 5 ряд включительно. Начиная с 6 ряда - 150 руб. И заканчивается всё 80-ю рублями.\n\nВот такая диспозиция на сегодня 23 апреля."
  replies:
