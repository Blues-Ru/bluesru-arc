    subject: Регтайм & Blues Mobil
    deleted: false
    text: "Там еще будет выступать Blues Mobil из Тбилиси - группа довольно высокого уровня, они давно ездят по европам с концертами, в прошлом году, в частности, были в Нотоддене. Послушать стоит, поскольку в Москве они бывают очень редко (по крайней мере, до нынешнего момента). \nНаличие большого количества билетов в кассе - это нормально, ибо большинство людей будут пробовать их покупать непосредственно перед концертом, правда, теоретически, может не хватить.\nИ главное: сегодня из типографии пришла пластинка Регтайма, - очень хорошая запись и, к тому же, замечательно оформленная. К ее выходу, в некотором смысле, будут приурочены эти гастроли. Пластинку можно будет купить (за недорого) на любом из концертов Регтайма."
