      text: "В таком случае надо упомянуть ещё одного участника концерта в ЦДХ 3 мая. Это Леван Ломидзе. Никогда не слышал \"BM\", но думаю, что даже дуэт Арсена и Левана поставит зал на уши, а с BM - тем более. \n\nФедь, а почему ты считаешь, что билетов может не хватить? Реклама то практически на нуле!\n\nОчень рад пластинке. Это замечательно, что они всё-таки сумели издаться. Обязательно её приобрету. :)"
