  text: 'Около месяца назад решил я что надо купить плеер и смотреть концерты.

    Купил плеер, купил кучу дисков. Все очень нравится.

    Радует то, что есть МАССА музыки по блюзу, фанку, соулу и джазу. То есть то, что мы любим или вроде как должны любить.

    Даже в Легионе есть масса блюзовых ДВД. Цены нормальные - от 17 до 27 долларов. Я не стал торопиться и начал с того, о
    чем мечтал.


    Купил A Tribute To SRV. Отличный живой концерт, где все дурачатся и вспоминают Стива. Эрик, Крэй, Бадди, Доктор Джон,
    Арт Невилл, Бонни Рэйт, БиБи и Джимми Вон. Отличная атмосфера и запись. Много вставок из концерта самого СРВ. Вообще его
    много на ДВД, но Вы знаете, что я его не очень-то и жалую. А вот ребята с трибьюта о нем много говорят хорошего.


    Купил BBKing Sweet 16 - фильм-концерт 74 года в Киншасе в поддержку Мохаммеда Али против Формана. Супер-гиг! Молодой БиБи
    - это динамит! Запись великолепная, ибо это фильм.


    Купил Allman Brothers Band Live At Great Woods 1991. Великолепно и по блюзу. И электро и акустика.


    Etta James Burnin'' Down The House 2002. Концерт в House Of The Blues. Блюза там немного, да и поет она не так как раньше,
    - все больше говорит типа Хукера. Но как играет банда! Просто изумительно. Самое смешное, что она поет Born To Be Wild
    (by Steppenwolf).


    The Band Last Waltz. Ну это просто чума - фильм Скорсезе о последнем гиге великой группы. Там столько гостей, что крыша
    едет. Концерт можно смотреть и слушать бесконечно - там магия Бэнд и Мартина.


    Два ДВД Кёртиса Мэйфилда - в Ронни Скоттс и в Германии. Это обязательно для всех. Малый состав, великолепная игра, Кёртис
    просто доносит до тебя свои слова и эмоции.


    Концерт Литл Фит 77-го года в Германии. Улет вообще. Лоуэлл уже плох, но поет и играет великолепно. Запись там правда
    не очень.


    Приятный во всех отношениях концерт AWB в House of the Blues 2000.


    Ну пока хватит. Могу лишт еще добавить, что обязателен для просмотра последний концертник Гилмора 2002. Он собрал необычный
    состав. Много акустики, блюзит, контрабас, восемь вокалистов, необычные для него песни и арранжировки. Просто порадовал.


    Ну и наконец оффтопик. Купите посмертный альбом Харрисона, он очень хорош. Музыка очень простая и прикантрованная, иногда
    приблюзованная. Больше напоминает Traveling Wilburys, чем Битлз. Играют там с ним "все ребята". Жаль что он умер.


    Ну вот как-то так. Слушайте и смотрите музыку ;)'
