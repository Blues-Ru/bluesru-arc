      text: "есть две школы... Одна - настаивать на исключительном обладании истиной в последней инстанции. Тогда просто не следует слушать и читать. Вторая - расширять свои знания, понимая, что истина - многогранна. В таком случае лучше больше слушать и читать... Те, кто не брезгуют чужим мнением, знают, что термин \"панк\" к Бернсайду применен не впервые... и не только мной... Впрочем, определение \"панк\" не былоиспользовано, как научный термин. Видите ли, чувство юмора тоже важно при восприятии как блюза, так и блюзовый р-передачи. не все так однозначно, как у тех, кто смотрит на людей, а видит \"стадо баранов\" (прошу простить мне этот мелкий выпад, приношу глубокие извинения всем, кого он задел лично). Например, у слова \"настоящее\" - два значения. У прилагательного - одно, у существительного - несколько другое... Не замечали, Грета? \nА что в нашем сегодняшнем настоящем действительно является чем-то настоящим - покажет будущее. Коламбур не блеск, но имеет право на существование, не правда ли?\nPS... Ернический ваш тон читать очень неудобно на письме... в удаленном мною посте не содержалось ни фактов, ни доводов. Там было написано, что по ночам Евдокимов занимается Диланом... не тем же, чем Дилан, а самим Диланом... Вы уверены, что этот пост украсит наш и так довольно склочный форум? Вы уверены, что я не смог бы подловить постующего на этой ошибке и открыть новый позорный флейм в форуме? я уверен, что я смог бы. И дабы это не доказывать, я просто удалил \"заразу\" под корень. Уверяю Вас, как главный редактор сайта Блюз-Ру, что эксперимент главного модератора сайта по установлению коллективного разума - закончен. И все личные выпады, и неаргументированные оценки, являющиеся по сути бранью, - будут удаляться из форума. Хотите дискутировать - учитесь уважению к оппоненту.\nPSS - Сим клятвенно подтверждаю, что этот пост не служит рекламой деятельности Д.Казанцева, но и не бросает на нее тень. Мнение Д.Казанцева по любым вопросам мною нисколько не оспаривается. Пр