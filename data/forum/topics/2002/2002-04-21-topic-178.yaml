                subject: West Coast House Party
                deleted: false
                text: "У Рамоса есть три сольных пластинки, в первую очередь, конечно, нужно послушать West Coast House Party. Рамос собрал туда главных исполнителей West Coast и поставил задачу продемонстрировать стиль на данный момент в чистом виде. Главным столпом в направлении  является T-Bone Walker, пара песен которого есть на альбоме. Большая часть остальных современных \"столпов\" записаны на этой пластинке, ибо west coast - довольно живое сейчас направление в блюзе, и оно активно развивалось в Калифорнии в 70-80-90е годы. Изначально стиль отпочковался от техасского, потом в него попало определенное количество джазовых элементов.\nНа диске WC House Party очень качественно сделаны аранжировки с дудками, расписаны партии, а многие песни построены с элементом гитарной дуэли между солирующими 2-3 гитаристами. Дуэль означает, что все играют по-очереди, кто круче, а не кто - громче. Каждый солист раскрывает свой оттенок музыкального настроения. \nВообще, если говорить об этой музыке, то в голову приходит эпитет \"тонкий\", а не \"глубокий\" как у Высоцкого (Парус, порвали парус). Эти слова не являются антонимами, и их не надо противопоставлять, просто эта музыка, скорей, для муз.эстетов,  блюзовое чувство выражается через тонкие оттенки, а не через силу сюжета или мрачные интонации.\nНа пластинке записаны техасский, и при этом, свингующий, Gatemouth Brown; Duke Robillard - исполняющий блюз с джазовыми элементами, Little Charly Baty - гениальный и бодрейший гитарист, эстет Rick Holstrom, сам Kid Ramos. Также, известные люди, которые сейчас в строю - Kim Wilson, пианист-ветеран Fred Kaplan, James Harman, Rusty Zinn и другие чуваки.\nВообще, музыка эта - одновременно очень бодрая и интересная в музыкальном отношении, послушать нужно обязательно. Однако, в больших количествах лучше слушать ее у конкретных музыкантов, которые разбавляют ее другими стилистическими вещами: к примеру, Little Charly & The Nightcats со всем муз.юмором или Duke Robillard, который чрезвычайно интересен и разнообразен в блюзовых альбомах."
