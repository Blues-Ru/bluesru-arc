        text: "Жаль, что не удалось послушать передачу, а писалка засбоила и записала тишину... \nНе к Андрею, а вообще соображение: мне кажется, что пытаться сталкивать лбами двух музыкантов разных стилей - неправильное занятие. Как и выяснять: кто, на самом деле, играет настоящий-подлинный, а кто - бездуховный блюз. Я думаю, что Андрей, как раз, этого и не имел в виду. \nКаждый музыкант копает в своем направлении, выясняя, что там есть интересного. Рамосу в заслугу можно поставить то, что он обнажил и зашлифовал музыкальные идеи, заложенные в West Coast. Как гитарист - он крайне интересен. Особенно удалась ему пластинка West Coast House Party, где он пригласил самых реальных чуваков. Там играет человек 10 приглашенных звезд-гитаристов, нигде никакой каши, несмотря на то, что в каждой песне 2-3 гитары играют друг с другом."
