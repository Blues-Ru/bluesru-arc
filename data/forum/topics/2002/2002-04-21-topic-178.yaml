          text: "В сегодняшней передаче противопоставлялись два диаметрально противоположных подхода к исполнению блюза... если мне не удалось изложить мои мысли по этому поводу достаточно внятно, право, очень жаль.\nбеда в том, что слово опубликованное (транслируемое) обретает большую тяжеловестность... разумеется, \"vs\" (как и \"панк\" применительно к РЛ) - не надо понимать буквально. Ни RL, ни Kid - не собираются выкидывать друг друга с \"музыкального ринга\". Я это в передаче подчеркивал более одного раза. Если допустить, что оппонент способен на иронию, все сразу становится на свои места.\n---\nКомпакты Кида, действительно, предоставлены Федором... Собственно, по его рекомендации включены в передачу. И так не в первый раз. Потому что: не разделяя полностью пристрастий Федора в блюзе, я искрене уважаю его вкус. Это просто: музыка, которую он слушает, обладает неоспоримыми достоинствами. \nМихаил ака Пескарь так же участвовал и участвует в радио-ВЭБе. Together we stand, devided we don't. (это была ирония, между прочим, как сказал бы Гомер Симпсон:)."
