                            subject: ох уж эти альбомы
                            deleted: false
                            text: "Чего уж такого отличного? чуток сведений из буклета\
                              \ к юбилейному (50 лет Чесс) переизданию.\nА дизайн\
                              \ и порядок винила Door To Door на компакте сохранен\
                              \ полностью. \nХотя именно юбилейное издание имеет унифицированный\
                              \ для всей серии дизайн. Но и не жалко, далеко не лучший\
                              \ дизайн был у оригинала: черно-белые, маловыразительные\
                              \ фотографии, у АК - зернистая, у ОР - размазанная.\
                              \ На что это нужно?\nмузыка говорит сама за себя, остальное\
                              \ - аксесуары. Приятно, когда они приятные. Но можно\
                              \ и скипнуть. Мне в юбилейном издании нравится конкретная\
                              \ информация - что где и когда и с кем - а ее на оригинале\
                              \ не было. \n---\nНе новость конечно... про японцев.\n\
                              Я на прошлой неделе слушал японское переиздание альбома\
                              \ Веса Монтгомери. Ух! картонный конвертик, как у пластинки,\
                              \ сидюк во вложенном белом пакетике, тоже оформлен,\
                              \ как граммпластинка. Да и всё оформление - только с\
                              \ оригинала. Вложен еще плакатик, воспроизводящий в\
                              \ натуральную величину дизайн LP, с cover notes и все\
                              \ такое. Сувенир, мля... Но надо отдать должное - оцифрован\
                              \ источник гениально. Звучание - настолько близкое к\
                              \ аналогу, насколько это возможно (для японцев :)!"
