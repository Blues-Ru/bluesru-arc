                \ помню. Я уже понял, что интересуясь старыми записями, надо переходить\
                \ на винил, но ср-ва не позволяют.\nКстати, вот есть CD B.B.King/Bobby\
                \ Blue Bland - \"Live'. Альбом классный, но на CD качество - полнейшее\
                \ дерьмо. Слушать невозможно. А вот пару песен с этого диска я слышал\
                \ на диске \"Forever Gold - B.B.King\", все наверное, эту серию видели\
                \ - левак. А качество этих песен на нем гораздо лучше, чем на якобы\
                \ лицензионном \"Live\".\n\nИ еще, диск \"Door To Door\" - полностью\
                \ соответствует тому, что написано на Allmusic, 14 песен без бонусов.\
                \ А кстати, чем бонусы-то плохи? Вот, например, у Luther Allison на\
                \ диске \"Bad News Is Coming\" мне бонусы даже больше нравятся, да\
                \ и диск длиннее получается. 60мин лучше, чем 35. \nМэджик Слим, да,\
                \ по-моему, однообразен и скучноват, хотя стиль- сыроватый, грязноватый,\
