    Mighty Sam McClain - "Joy And Pain" (Live In Europe)

    Kenny "Blues Boss" Wayne - "Blues Boss Boogie"

    Albert King/Otis Rush -"Door To Door"/


    Особенно понравился последний диск, хотя обычно старые записи не очень нравятся
    - и качество не то, и голос не так звучит, ну, чего-то не хватает... А тут и звук
