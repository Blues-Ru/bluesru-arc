    text: "...докричался значит, Дмитрий, ща тебе прокомментируем.. :)\n  \"Дверь\
      \ в дверь\" мне показался странным альбомом, купив его около 2-х лет назад,\
      \ долго не мог слушать из-за очень плохого качества записи... Потом вроде распробовал,\
      \ для начального ознакомления он неплох, но в фавориты его явно не поставишь,\
      \ во-первых, из-за записей, и во-вторых, из-за странной компиляции материала.\n\
      \  Последний Мэджик Слим весьма неплох для своего стиля музыки, особенно учитывая\
      \ присутствие на альбоме такого музыканта со звучным именем как Popa Chubby.\
      \ Но вот честно скажу - я уже стал уставать от Мэджика, уж больно ровное \"\
      чикаго\" он выдаёт... Ранние его альбомы я слушал с большим интересом, может\
      \ не Мэджик тут виноват, а моё отношение к этому стилю.\n  Майти хорош, но вот\
      \ в моём осмыслении он тоже не фаворит. Не могу вспомнить ни одной его пластинки,\
      \ впечатлившей меня сильно, может от того, что я и не имею много его работ.\
      \ Ну вот студийная Blues For the Soul еще неплоха. \n  Про Уэйна вообще ничего\
      \ не скажу, ибо не слышал. Поначалу чуть не совершил досадную ошибку, желая\
      \ обозвать нехорошо эту покупку, увидев имя очередного молодого гитарного \"\
      героя\". Потом задумался над его \"титулом\" и решил, что врядли \"молодой\"\
      \ наберется наглости на такую кликуху :) Перепроверил - так и есть, это другой\
      \ Уэйн, не \"Пастух\". Сразу стало легче :) \nПослушай этот альбом и обязательно\
      \ сообщи нам о твоих впечатлениях, потому как непонятно что ждать от чёрного\
      \ дядьки в возрасте, умеющим играть круто буги (по утверждению АМГ) и получившего\
      \ на АМГ за этот  альбом \"5 звёзд\"."
