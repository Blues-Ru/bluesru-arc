    subject: Door To Door
    deleted: false
    text: "Конечно, альбом, на котором часть треков собрана из записей Clash, a другая\
      \ - из Pogues, был бы странен. \nНо фирма \"Чесс\", выпустившая в 1969 Door\
      \ To Door, частенько делала компиляции из своих старых записей. Закончив с серией\
      \ Folk Blues, они продолжали копаться в своих архивах. Алберт Кинг в те времена\
      \ был более, чем просто известным музыкантом. Отис Раш - менее, чем известным\
      \ определенному кругу любитейлей жанра. Кинг записывался для Чесс очень мало\
      \ - на альбом никак не наскрести. Раш - тоже не много, но главное, выпускать\
      \ альбом его записей в 1970м было для Чесс не слишком коммерчески оправданным\
      \ шагом.  Поставьте себя на место менаджера фирмы и, исходя из всего этого...\n\
      \"Surely it made sense for Chess to release an album containing the handful\
      \ of songs recorded by AK and OR during their short-lived tenures with the label\
      \ - так говорится в юбилейном перииздании.\nКонечно, альбомная концепция здесь\
      \ никак не выдерживается - записи 1953года, первый опыта Алберта Кинга в роли\
      \ лидера в студии, и 1961г. - это две большие разницы. Записи Отиса Раша тоже\
      \ от разных сессии 1960го года... Но если помнить, что эти записи и планировались\
      \ для сорокопяток, они длинной-то все около 3 минут! Кстати, некоторые песни\
      \ Раша здесь - это ремейки его собственным записей, ранее уже выпущенных на\
      \ конкурирующем чикагском лейбле Cobra, включая All Your Love. \nну а в конце\
      \ десятилетия, когда альбомный формат победил, почему бы Чесс и не собрать всё\
      \ это \"в одно место\", чтобы продавать под каким-нибудь благовидным предлогом?\
      \ :) ведь вышел альбом в серии Chess Vintage Series."
