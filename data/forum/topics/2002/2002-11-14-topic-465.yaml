            email: kotmatrs@mail.ru
            subject: Про наезды
            deleted: false
            text: 'О, эта тема достойна всяческого о(б)суждения. Я ее как нибудь опубликую
              (со всей перепиской). Первый наезд был со стороны агенства по охране
              авторских прав, в вежливой форме попросили моего провайдера дать полные
              координаты К.Матраскина и предьявили свои права на песни Грина, и еще
              кого-то (в исполнениях Аграновского, Green Square и Кожекина с Жуком.)
              Пришлось снять 5 песен с сайта, и принести извинения за "дереваты".

              Второй наезд с агенства представляющего Франгоферский институт. Предлажили
              платить по 1.7 бакса за каждую песню в МП3 !!! :-)

              Очень смешно. Но ogg оказался действительно качественнее. Так что -
              большое спасибо им, за то, что сподвигнули на переход в другой формат.

              Хотя не исключено, что можно было бы просто забить.

              Только вот я не знаю как быть с видео. Там же аудио дорожка в мп3. Возможна
              ли альтернатива?'
