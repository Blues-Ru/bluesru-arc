                date: 2002-11-19 15:52
                poster: КотМатрс
                email: kotmatrs@mail.ru
                subject: Надо более корректно
                deleted: false
                text: 'В самом деле если и проводить сравнение, то с более поздним
                  форматом mp3Pro Они как-бы ровестники, а mp3 просто уже сильно устарел.

                  ogg исходя из принципов кодирования должен лучше справлятся с нормальным
                  стереосигналом (кодирует один канал, и разницу со вторым), т.е.
                  лучшее качество на сильно коррелированном стереосигнале, и хуже,
                  если сигналы чисто в левом или чисто в правом канале (хотя я такое
                  в музыке почти не слышал)

                  По моим наблюдениям, в классике, в блюзе и в любых живых записаях
                  - ogg звучит музыкальнее, в попсе, мидийках, в техно музыке - mp3Pro
                  лучше, но все это субъективщина.'
