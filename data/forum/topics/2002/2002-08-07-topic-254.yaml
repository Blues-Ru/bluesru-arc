    subject: Альбомы Koko Taylor...
    deleted: false
    text: 'Очень рекомедую последний номерной альбом "Royal Blue" - в Питере он много где есть (якобы)лицензионный  (по 60-80 рэ.), в Москве, я думаю, тем более. Еще оччень классный "Force Of Nature" (Там в том числе просто улетная песня дуэтом с Baddy Guy), но я его в продаже не видел в СПб. В Москве при желании, я думаю, найдете.

      А сборник "Deluxe Edition" (тоже много где видел) на мой взгляд уступает номерным альбомам. Хотя конечно, представление о творчестве Koko Taylor дает.

      А еще из "женского вокалу" (естественно, блюзового)весьма рекомендую Shemekia Copeland - диск "Turn The Haet Up!". Купите, не пожалеете!

      Тем более, что он не редкость.

      Желаю приятного прослушивания. И слушайте блюз.'
