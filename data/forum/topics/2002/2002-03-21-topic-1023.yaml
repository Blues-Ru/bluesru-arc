    text: "Здасьте! :)\nПоскольку очень люблю музыку Вэйтса не могу не поитересоваться об этой пластинке более подробно.\nКакую роль играет на записи Том? \nМожно где в инете послушать этот альбом? \nКак он называется-то? :)"
