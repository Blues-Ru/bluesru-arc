                                      text: Действительно, "Live" и студийные записи, как правило, ярко контрастируют друг с другом. И те, и лругие по-своему интересны. Но можно ли сказать, что если то или иное произведение нравится какой-то определённой прослойке поклонников как в живом, так и в студийном исполнении, то лишь тогда оно воистину гениально?
