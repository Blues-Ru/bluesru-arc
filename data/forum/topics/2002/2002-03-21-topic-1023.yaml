                                        deleted: false
                                        text: Некоторые музыканты умудряются "снимать в ноль" свои студийные работы, нигде не лажают, как впрочем, не занимаются и импровизацией, что может, порой, являться определенным минусом. Многое зависит от настроения, умения играть, жажды к переменам. Кому-то нравится, когда одна и та же вещь каждый раз сыграна по-разному, а кто-то любит подтверждать свое студийное мастерство вживую. Мне интересно и студийное и концертное. Некоторые вещи на концерте осмысливаешь и воспринимаешь совершенно иначе, а посему видеть и слышать вживую - очень важно! Не для того, чтобы определить, гениально это или нет в принципе; а для того, чтобы понять, гениально ли это для Вас :)
