                                          deleted: false
                                          text: '... процентах в 70-ти всё-таки, пожалуй, контрастируют. Для меня тоже чрезвычайно важна и интересна, как живая музыка, так и запись. Однако ж, нельзя говорить, что Live + In studio = Masterpiece. Бывает и так, бывает и наоборот ... А гениальность именно для меня может определяться лишь одним: если есть какое-то ощущение полёта, отрешения от действительности. Когда хочется забыть обо всём и всех и просто плыть, наслаждаясь. Когда где-то под рубашкой начинает свербить позвоночник и что-то томится внутри. Когда сердце не просто выпрыгивает наружу, а вылетает из тебя и ты этого даже не замечаешь, потому что тебе не до этого. Ты весь здесь и в то же время тебя нет, потому что ты уже далеко. Где-то там, где нотка догоняет нотку, гармония гармонию, бемоль сменяет бекар, где ты уже не в состоянии воспринимать музыку, как набор звуков, аккордов, мелодических ходов, фальшивых нот ... .  Вот где-то там и таится гениальность. Только так ли уж часто она подходит к нам так близко, чтобы к ней можно было прикоснуться?... К сожалению, в большинстве случаев всё же дальше, чем на расстояние вытянутой руки.'
