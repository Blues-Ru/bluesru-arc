                  text: У Боба просто потрясающий мощный и драйвовый вокал! Он может просто петь и играть на гитаре, а это уже звучит как РОК, в сочетании с его великолепной поэзией! Я думаю, АЕ погорячился на этот раз. Я собрал все альбомы Дилана и недоволен только несколькими. Для периода в 40 лет - это абсолютно лучшая работа музыканта во всех жанрах. Даже Саймон и Маккартни не могли создать столько и такого же масштаба, качества и значения для последующих поколений музыкантов всех направлений! Дилан - просто лучший! Он больше чем Кэш в кантри, он лучший в фолке/блюзе, он больше чем Леннон в музыке протеста/роке. И опять же, это не только мое мнение!
