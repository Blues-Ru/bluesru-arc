                      subject: про компетентность
                      deleted: false
                      text: "ну могу еще раз устало повторить: до Джони Уинтера в блюзе не было понятия альбома как священной коровы. \nпластиночки-сорокопяточки записывались для музавтоматов и для радио. Потом, когда пришла эпоха лонг-плеев, эти пластиночки стали собирать в альбомы. \nдля меня странно, когда блюзовый альбом не приобретается, потому что он - \"сборник\". по мне многие блюзовые сборники интересней, чем \"номерные\" альбомы. \nНе говоря о том, что \"альбомность\" - выдумки белых парней, вроде Битлз. Эти только в студии и жили в свои лучшие годы. А блюз - он живая музыка. Т.е., в принципе - по ходу истории, по механике творчества и контакта - блюз на пластинке остается лишь бледным отражением себя живого."
