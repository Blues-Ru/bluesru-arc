      subject: '"Extremely Cool",'
      deleted: false
      text: "так называется пластинка Чака. Tom Waits, да не обидятся присутствующие, его не любящие, за то, что это имя вновь звучит здесь, принял самое непосредственное участие в записи этой пластинки. Часть песен написана совместно Томом и Чаком. Где-то Вэйтс душевно(;) \"подпевает\" Чаку. Вокальные данные Chuck E. Weiss, если так можно выразиться, находятся примерно в том же диапазоне, что и Вэйтса ;)) Быть может, порой голос Вэйтса звучит более \"прочувствованно\"( многое зависит от количества выпитого? ;). Часть песен написана Weiss and Tony Gilkyson (guitar). Спродюсировали эту пластинку Kathleen Brennan and Tom Waits. \"Devil With Blue Suede Shues\"(1) - Executive Produced by Johnny Depp.\nОписать это мне не представляется возможным, ибо все слышат и чувствуют по-разному, но я бы порекомендовала Вам ее отслушать обязательно. Пластинка идеальна. Если Вы любите Вэйтса. \nО нахождении или отсутствии в сети ничего не могу сказать, так как не знаю. Не тратьте время напрасно на поиски mp3 - могу лишь искренне посоветовать :) Лучше сразу купите пластинку - не прогадаете.\nP.S.: А еще песни Вэйтса любит исполнять John Hammond, а также John Campbell был замечен за этим занятием ;)"
