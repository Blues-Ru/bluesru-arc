                        deleted: false
                        text: "А как же Мадди \"Folk Singer\"? Хукеры номерные 60-х годов? БиБи? Junior Wells? Дизайны этих альбомов также великолепны как и музыка на тех рекордах. \nКультура LP пришла из джаза, конечно, а не от Битлз. Мне всегда приятнее слушать пластинку, записанную в одно время и в одной студии, с одним составом, хорошо спродюсированную. И не важно рок это, блюз или джаз. И опять же, я далеко не одинок в этом мнении. Важность АЛЬБОМа в поп-музыки нельзя недооценивать! А блюз - это лишь пласт поп-музыки и Джонни Уинтер тут, конечно, вообще не при чем. Да и его блюзовость мне не близка, если честно."
