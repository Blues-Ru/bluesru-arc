  text: "Давно смотрел и спрашивал \"в магазинах города\" этот диск. Увидел - сразу купил. Послушал - и так протащился, такой\
    \ кайф - ну просто нет слов. Вери-вери бест! \nИ предыдущий диск \"7936 SouthRhodes\" тоже хорош, но этот - просто фантастика.\
    \ Какие люди, как играют!\nВот мне интересно, такая личность - этот Boyd - так много \"своих\" вещей (одна Third Degree\
    \ чего стоит!), но так мало альбомов? А ведь он вроде еще и друг детства Muddy Waters-а?\nДиск лицензионный, выпустила\
    \ ООО \"Азия Рекордс\". Раньше лицензионного не встречал. Вот.\n\nЕще приобрел \"Sir\" Oliver Mally's Blues Distillery\
    \ - диск \"Wild Streak\". Я так понимаю, это какие-то европейцы - записывались в Вене, на Allmusic я их не нашел, а диск\
    \ мне показался достаточно интересным!\nКто-нибудь про них что-то знает? А выпущено каким-то \"Time Blues\" - левак видимо,\
    \ нет ссылки на лицензионное соглашение. Какая-то новая \"фирма\", видел еще несколько дисков с блюзовыми и блюз-роковыми\
    \ новинками."
