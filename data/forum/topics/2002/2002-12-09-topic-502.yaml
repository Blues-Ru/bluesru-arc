          poster: Andrei V. Evdokimov (evdokimov)
          email: evdokimov@blues.ru
          subject: от автора
          deleted: false
          text: "Диксон пишет в автобиографии про 3rd Degree\nI did it with Eddie Boyd. Eddie didn't want it at first, but\
            \ after he was saying \"Dixon, give me a part of yourself. I don't mind playing it but hell, I don't wan't to\
            \ take chances. I had to change it back but it turned out to be a very big song for him.\nя специально не стал\
            \ переводить. В диксоновском сленге все слишком неоднозначно. Но, похоже, Бойд попросил переделать уже готовую\
            \ песню под него лично, и получился хит. \nа следующие два абзаца ясней:\n\"Эдди Бойд никогда не был особенно\
            \ выдающимся пианистом, но он мог петь довольно хорошо. Эдди был одним из тех,кто попадал в блюз, потому что когда\
            \ он пел блюзовые номера, они напоминали ему разные моменты его собственной жизни. Он напивался, приходил (в студию)\
            \ в слезах и садился за фортепиано. Все приходили в волнение, и Леонард (Чесс) говорил: \"Чувак, звони по музыкантам.\
            \ Это надо брать.\"\nЯ начинал звонить разным парням, и иногда мы получали что-то полуприличное, а иногда совсем\
            \ ничего. Когда стало известно, что он за человек, я думаю, целая туча (продюсеров) пыталась специально его напоить,\
            \ просто чтобы заполучить его на запись.\"\nиз \"I'm the Blues\" 1989, стр.86"
