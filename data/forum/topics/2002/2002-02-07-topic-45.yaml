        text: 'Но, Дим, почему ты так категоричен: "Не спорь со мной о Кейле" ? ;-))

          Вот список музыкантов, участвовавших на записи "#8": Harold Bradley, J.J. Cale, Tim Drummond, Ray Edenton, Glen
          D. Hardin, Buddy Harmon, Karl Himmel, Jim Karstein, Jim Keltner, Christine Lakeland, Tony Migliore, Bob Moore, Weldon
          Myrick, Spooner Oldham, Steve Ripley, Richard Thompson, David Waddel. Марка среди них нет. ;-)

          А вот список работ, где Марк принимал участие: <a href="http://www.allmusic.com/cg/amg.dll?p=amg&sql=R94636#APPEAR">на
          любимом тобой AMG</a>  И там нет Кейла. Чем бушь крыть? ;-))

          И всё равно я не согласен, что манера Клэптона "полностью позаимствована у Кейла". А то, что Кейл повлиял на Клэптона
          - несомненно. :-)

          А про ошибки в дискографии я так и написал: "Федя, исправь" :-)'
