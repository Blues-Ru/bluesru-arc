    text: 'Прочитал тут Димину статью... Всё здорово, и Дима - молодец. :-)) Но позволю себе несколько замечаний. Цитата:
      "Без него вряд ли бы мы заметили Эрика Клэптона (Eric Clapton) и Марка Нопфлера (Mark Knopfler)" Позволю себе не согласиться.
      Скорее без Эрика вряд ли бы заметили Дж.Дж. Кейла. А Эрика заметили-то еще в 1964-1965. :-) А Mark Knopfler разве исполнял
      вещи Дж.Дж. Кейла? я че-то не в курсе... Или не так понял? Дим, просвети, плиз.

      Теперь по поводу дискографии. Был еще такой альбом <a href="http://perso.magic.fr/aramis/ten.htm">Ten 1992</a> Так что
      исправь, Федь, а то два раза "8" указан. Кстати, на том сайте, на который я ссылку дал, действительно полное собрание
      текстов, а на блюз-ру пока не полное. ;-)) А в остальном, всё ОК!

      Спасибо!'
