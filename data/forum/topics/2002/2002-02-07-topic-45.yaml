      text: 'Можно я тебе в частной беседе докажу свою правоту?

        Клэптона мы бы не знали без его slowhand manner, а она полность позаимствована у Кейла, Эрик этого и не скрывает.
        Марк тоже, он подыгрывает Кейлу на 8-ом альбоме. Не спорь со мной о Кейле. И еще, для мировой музыки Кейл сделал намного
        больше, чем любимый мной Клэптон. Просто первый так и остался хипарем, а второй стал супер-звездой (да и то, только
        в 80-х).

        А ошибки в альбомах - это к Феде ;)))'
