  subject: Что было 7-го марта на Втором этаже
  deleted: false
  text: "Был джем, всем участникам которого (начинающим и заканчивающим музыкантам и слушателям) - традиционное большое спасибо.\
    \ У нас произошли некоторые перестановки в хаус-бэнде. Валера Гилюта теперь будет, видимо, работать в составе постоянно.\
    \ \n    Пришли поиграть Геннадий Хащенко (барабаны) и Игорь Дегтярюк (гитара). Бас взял Юра Иванов. И вот этот стариковский\
    \ состав исполнял Хендрикса, вещи с The Band of Gypsies. Ваня Жук очень по делу играл с ними на ламповом органе \"Вермона\"\
    \ (клавишная заливка была в духе, в жанре - они сами, старики, говорили потом). К чему я это рассказываю? Тут интересно.\
    \ По крайней мере, не все знают. В 70-е группа Дегтярюка \"Второе дыхание\" была знаменита в подпольном мире и играла\
    \ на высоком уровне. Ну, скажем \"Машину времени\" тогда серьезно рядом с ними не ставили. Другое дело, то \"легендарными\"\
    , \"культовыми\" и просто успешными через 30 лет стали именно Машина и Воскресение, которые делали собственные вещи на\
    \ родном языке (это без подкола в их адрес - у всех своя дорога). Дегтярюка подзабыли. А он играет своего Хендрикса и\
    \ свой блюз. Мы слушали и кайфовали. \n    У нас там не хватает времени на джем, как всегда. В следующий раз будем стараться\
    \ предоставить слово всем, хотя это непросто. Просьба к гг.джемующим записываться заранее по е-мейлу - как оно и было\
    \ до этого. Будьте здоровы - и до встречи."
