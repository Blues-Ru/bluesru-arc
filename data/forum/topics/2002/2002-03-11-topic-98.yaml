        быть, по технике он до Братецкого и несколько не дотягивает, однако же по выразительности, IMHO, оставляет его далеко
        позади...


        Вышесказанное, само собой, является лишь моим личным мнением не имеет целью обидеть ни одного из вышеупомянутых персонажей
        -- исполнительское мастерство их обоих я очень ценю; только, согласитесь, это самое мастерство у них несколько разного
