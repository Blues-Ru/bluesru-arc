  text: "Друзья (если не возражаете против такого обращения), предлагаю:\nЯ готов записать и сжать в MP3 несколько композиций таких мастеров, как - Paul Rishell (with Ronnie Earl) -93, Henry Benson - 61, \nR.L. Burnside \"Mississippi hill country blues\" - 84, и что-нибудь\nиз современных \"электрических\" исполнителей - редких!, далее - предлагаю выставить их на Вашем сайте для всеобщего обозрения (прослушивания), и дальнейшего обсуждения на страницах данного форума.\n                           Вадим. (AvA)\nP.S: композиции предлагаю выставить не по 30 сек., а хотя-бы минуты по 3 - 4. Не целиком, чтобы не было проблем \"c правами\", но не меньше, чтобы можно было \"прочувствовать тему\". \n                          C уважением. Вадим."
