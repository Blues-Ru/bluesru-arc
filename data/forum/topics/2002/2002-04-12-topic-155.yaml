  deleted: false
  text: 'Вчера вечером где-то в 21.15 оказался в районе заведения под названием "Второй этаж". Времени свободного у меня было мало минут

    10-15 и я решил зайти хлопнуть рюмашку водочки, посмотреть на добрых людей и… в путь.Ха,не тут то было.Мне сказали что т.к сегодня концерт с меня за  вход 100р или подождите 45 мин до окончания.10 минут и 100р это хорошая пропорция, достойная настоящих блюзовых монстров.Рюмку-то я конечно же откушал, но без всякого удовольствия и в другом месте.А может правда какую-нибудь звезду блюза черная дыра второго этажа затянула и там народу было по головам али еще чего? А может заведение просто перестало любить своих гостей? Поведайте.


    p.s

    На самом деле "Второй этаж" мне нравится,а в особенности люди которые там собираются,очень не нравятся их закидоны.'
