    text: "Было читать эти горькие заметки Греты. Я не совладелец клуба Би Би Кинг, но мне очень жаль, что так вышло. Я понял,\
      \ о чем пишет Грета, и ничто меня не отвлекло и не обломало в ее письме. Ребята, полноте, и про телефоны понятно. Это\
      \ гнев, полемика, утрирование.\nТеперь, если позволите, несколько советов (выдержка из фундаментального труда \"КАК\
      \ ХОДИТЬ В БИ БИ Кинг\" Штейнметцера):\n\nа. ББК - маленький; столик там лучше заказать по телефону (оговорив - столик\
      \ у сцены). Они хорошие места наверняка в этот день держали для таких вот \"заказников\". Вообще же там угар, суета\
      \ - и никто не фильтрует посетителей.\nб. Если вас с друзьями хорошо и правильно усадили, вы уже меньше обращаете внимание\
      \ на частоту смены пепельниц, ловкость официантов и даже качество блюд - внимание отвлечено на сцену.\nв. Желательно\
      \ первый раз сходить с проводником, знающим места и людей. Во второй раз он не понадобится.\nг. В любой день недели\
      \ можно не попасть на хороший гиг. Это рулетка, Юра прав. Чтобы выиграть, надо чаще ставить. Чем чаще ходишь, тем больше\
      \ нравится.\nд. Не защищая ББК, замечу, что видел клубы гораздо хуже. И даже играл в них. В ББК ходить - можно. Только\
      \ см. пп. а-в.\n\nА если вы меня спросите, чего я раскипятился, отвечу - чтобы на выступления с моим скромным участием\
      \ ходили такие квалифицированные слушатели и интересные собеседники, как Грета. Уж извините старого солдата за прямоту.\
      \ Для этого всё делается. Иначе не интересно. \nЖаль, если ББК потерял трех людей - мы там иногда выступаем и хотим\
      \ их видеть."
