                            такие люди постоянно приходят и в Би Би Кинг и сидят за барной стойкой, или стоят за столами напротив
                            сцены, когда им не хватает места. Их много там бывает во время удачных джемов и концертов, и они
                            не кричат о своих правах и не размахивают дорогими камерами и телефонами. Они слушают музыку,
                            танцуют, радуются происходящему на сцене. Если кто-то может сказать, что это не так, пожалуйста,
