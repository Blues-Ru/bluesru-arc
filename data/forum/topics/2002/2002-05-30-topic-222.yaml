        \ должно быть.\n \nО телефонах. Объяснюсь, ладно. Это была лишь маленькая часть текста, которую вырывать из контекста\
        \ не пристало. Вас, судя по всему, именно это и зацепило отчего-то, хотя я писала не об этом.\nПростите, я забыла,\
        \ что мущщины воспринимают многие вещи иначе. Например, что и машины, и телефоны выполняют для них зачастую роль фаллических\
        \ символов. Для женщин телефоны, честное слово, - всего лишь средства связи. Моя фраза с упоминанием слов \"телефон\"\
        \ и \"камера\" значила буквально следующее - отношение к нам персонала Би-Би я воспринимаю как некомпетентное.\n\n\
        Я о музыке писала и пишу. При таких делах она и будет там, где сейчас находится - в заднице.\nЯ ЛЮБЛЮ МУЗЫКУ. Я БЕЗ\
        \ НЕЕ НЕ МОГУ. \nМне интересно видеть, кто играет, как играет и на чем играет. Сидя вдали от сцены (при пустом зале,\
