    \ пепельницу три(!) раза. Это что, компенсация за стол у двери?? Да не фига! Официант должен передвигаться по залу так,\
    \ чтобы его было не видно и не слышно! У меня же перед носом постоянно сновали чьи-то неумелые руки, меняющие пепельницу.\
