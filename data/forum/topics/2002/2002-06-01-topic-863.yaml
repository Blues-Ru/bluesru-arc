          text: "От того и кричу! С Казанцевым мы обсуждали не Литтл Чарли, а отношение к музыке и другим людям, причем буквально\
            \ позавчера. \nЕсли честно, то мне надоело вместо того, чтобы говорить о том, что интересно мне и кому-то еще\
            \ в музыке, с кем-то сражаться. У Казанцева есть свои любимые исполнители (а их набор, кстати, очень сильно отличается\
            \ от того, что слушает большая часть \"любителей блюза\", среди которых есть много более уважаемых людей), а там,\
            \ где я вырос, если сказать, что в блюзе я в первую очередь люблю Дилана, Нопфлера, Тома Вейтса и Дж.Дж.Кейла\
            \ - тебя на смех поднимут... По мне - ладно, ради Бога, Дима слушает очень много хорошей (но порой - скучноватой,\
            \ на мой взгляд) музыки, пусть ее слушает, все довольны и пр... Но Дима так не может - он пропускает, так сказать,\
            \ все, о чем говорят люди, через призму своего персонального восприятия, отождествляя его с общемировой истиной\
            \ в последней инстанции. И раскидывает одной левой направо и налево... \nЯ могу пригласить сюда металлиста покомментировать\
            \ местные темы. Он тебе сразу скажет, что Альберт Кинг - слюнявый слабак, который ничего в гитарном звуке и сустейне\
            \ не понимает... Здорово будет? По-моему, бессмысленно! Ровно по той же причине, обсуждать с Димой блюзовые темы\
            \ стало невозможно, ибо пересечений практически нет. Если сходить на hi-fi.ru в форум и почитать, что Диму неподдельно\
            \ волнует, то возьмет оторопь (Марвин Гей и все последние альбомы Супертрэмпа). Нам здесь достается часть этой\
            \ музыки в той части, что у Димы называется \"по-блюзу\". Типа, самый по-блюзовый альбом Боба Дилана (при всем\
            \ к нему уважении). При этом, Дима не задумываясь в изъявительном наклонении вычеркивает и из блюза и из музыки\
            \ какие-то вещи, которые большинство знающих людей называет блюзом, а другая часть очень любит в этом качестве.\n\
            Ну и в результате у меня возникает два вопроса: 1) Интересно ли мне или кому-нибудь еще Димино мнение в той области,\
            \ которую он абсолютно не понимает??? 2) Приятно ли здесь говорить о музыке?\nВообще, у меня после всего этого\
            \ дерьма возникло три взаимозаменяемых решения: 1) Сделать сайт po.blues.ru (По-блюзу) и предложить Диме переехать\
            \ туда 2) Закрыть blues.ru нахрен, ибо эти сражения мне страшно надоели, если люди, которые меня понимают и очень\
            \ хорошо слушают музыку и даже ее играют. Я лучше с ними так поговорю. 3) Самому переселиться в другое место,\
            \ где я мог бы спокойно обсудить какой-нибудь альбом Ронни Эрла с теми, кто его слышал и понимает, о чем речь...\n\
            Вот такие дела...."
