    subject: все мечтаю перестать быть занудой...
    deleted: false
    text: "но все не получается... Люди не дают :)\n----------\nговорят, у нас на сайте запутанная навигация... хрен с ней - запутанная. Если лень проверить алфавитный список, пойдем другим путем...\nнабиваю в поисковое окошечко слово bloomfield. и получаю результат, где первой строчкой - биография, а второй - вот эта рецензия: /ww/ww_Bloomf-d1.htm . А в ней вот эти слова: \"Треки из акустического альбома 1977г. блистают филигранной точностью и тонкостью исполнения, и уникальною мягкостью гитарного \"туше\" Блумфилда.\" \n...Значит, альбом есть, вот названия альбома нет. Пошел на AllMusic Guide, без труда  нашел альбом 1977 года \"Analine\": http://www.allmusic.com/cg/amg.dll?p=amg&sql=Awzarqj4yojsa . В рецензии написано: \"For Analine, he worked in an acoustic, often single-handed mode\"... Вот и все. ответ получен.\n........\nЯ прошу товарища Сивакова не принимать это слишком серьезно... Дело не в конкретном вопросе об аккустике у Блумфилда. Дило у тынденцыи... если бы он (вопрос) один был такой, то не было б труда ответить... но ведь раз за разом задаются вопросы, ответы на которые уже есть на сайте - надо только воспользоваться простейшим поисковичком... Так а на хрена же мы все это делали, а, Миш? Раньше форум был безжизненный, а теперь вся жизнь без остатка переместилась сюда. Федор, пора форум делать главной страницей, а все остальное складывать в архив... а в форуме можно и гилану порадоваться, и длинному клинку (т.е., шворц обсудить). :)\n........\nсие послание посвящается М\"П\"Б, который меня на него и подбил..."
