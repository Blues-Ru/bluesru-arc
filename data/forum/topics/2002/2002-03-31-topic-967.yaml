  text: 'Товарищи!

    Наверное, большинству из вас известно имя Майка Блумфилда и его, так сказать, электрическая ипостась.

    Не подскажете ли, были ли у него акустические произведения или целые альбомы?

    Заранее спасибо!'
  replies:
