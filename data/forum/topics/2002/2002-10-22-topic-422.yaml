  deleted: false
  text: "В театральных кассах города появились билеты на блюзовый фестиваль. 11 ноября\
    \ в ДС Юбилейный. На той неделе билетов еще не было, и в кассах ничего про фестиваль\
    \ не знали (по крайней мере в те, куда я обращался).\nБилеты входные без мест\
    \ по 220 рэ (это в кассе на Елизаровской). Сказали, приходите и садитесь, куда\
    \ хотите. Кто знает - а есть ли где с местами? Или с местами просто нет билетов?\
    \ \nИ самое интересное, никакой рекламы на афишах. Всякие спейсы, арлазоровы,\
    \ театры эстрады есть, а БЛЮЗА нет. Вот суки. А потом скажут, - невыгодно блюзовые\
    \ фестивали устраивать...\nЕсли бы не Блюз.Ру, сам бы ничего не узнал. Спасибо,\
    \ ребята!\nВСЕ НА БЛЮЗОВЫЙ ФЕСТИВАЛЬ!!!"
