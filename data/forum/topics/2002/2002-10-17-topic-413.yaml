              text: О коммерциализации и прочем. На мой взгляд,обрушиваться на тупых,этаких бездуховных белых неверно.Блюз
                возник именно в Америке с ее первоначальным угнетением негров.Уж в родной Африке он точно не зародился,даже
                любимый Димин Таж говорит об изменении восприятия неграми уже во время перевозки их на кораблях вАмерику,соответсткенно,менялась
                и их музыкальная культура.Насчет коммерции - может,капитализм и несовершенен,но деньги делаются там на всем,в
                том числе и на потребности человека в музыке.Если у людей возникает потребность в блюзе - индустрия раскручивает
                и его.Блюз - очень красивая музыка и в какой-то момент ею прониклись эти тупые и глупые белые а дальше в него
                уже были вложены деньги и пошло-поехало.Более того,сделали себе имена и вполне заслуженно такие физически
                неполноценные люди как Рэй Чарльз,что в нашем так называемом духовном обществе просто невозможно.На самом
                деле главное не деньги,а удовлетворение потребностей человека - духовных и материальных.Ведь Роллинг Стоунз
                играют  сейчас явно не для денег - они уже давно миллионеры.Если кто интересуется нынешним состоянием бизнеса
                - советую прочитать книги Шведской школы экономики.Извините за оффтопик.Насчет  Элвиса - он после скажем Биг
                Мамы Торнтон мне показался примитивным.Наверное быстрый блюз и рокабилли это все-таки не одно и тоже.Джаз
                же во много вырос за счет мафиозных денег в 20-х и 30-х годах опять же тупых белых.Альтернатива же деньгам
                - пока лишь тоталитарное общество и навязывание правящей кучкой людей своих вкусов,как в Советском Союзе.Насчет
                же акустической и электрической музыки - элетро пошло уже в30-х годах из-за того,что простая гитара не выдерживала
                состязания с джазовыми инструментами,в частности,саксофоном и ничего неполноценного в ней я не вижу.
