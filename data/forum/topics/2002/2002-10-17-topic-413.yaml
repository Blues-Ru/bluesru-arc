  text: 'В первую очередь к музыкантам и знатокам, а также ко всем ценителям.

    А вопрос в следующем, существуют ли критерии, по которым можно (и нужно)отличить классический рок-н-ролл от "энергичного"  блюза.
    Если да, то какие? А то слушаю порой современных (и не только современных)блюзовых исполнителей (например, Long John Hunter,
    W.S. Clark, Liz Mandville Greeson), вроде у них и рок-н-роллы на пластинках "звучат" наравне c блюзами, а может и не рок-н-роллы?

    И как вы считаете, является ли рок-н-ролл одним из "продолжений" блюза, в смысле - "ответвлением", если блюз считать "древом"
    (Это я по анологиии - видел в Джаз-Клубе на большой картинке "древо" джаза). Или рок-н-ролл - это уже "самостоятельный"
    стиль музыки,- как джаз, блюз или рок-музыка (рок - в западном понимании)? Извиняюсь за терминологию.'
