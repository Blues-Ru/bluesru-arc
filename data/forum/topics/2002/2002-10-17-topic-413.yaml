    text: "но в общих чертах - именно так. Однако, на самом деле, вспоминая вопросы novice, думается, что, коли уж тот человек\
      \ так четко сформулировал <i>проблематику</i>, то пусть не ленится и ответы серьезные поискать, а не затевать обычную\
      \ бучу.\nа здесь с вопросом все попроще и поочевидней. Для меня хороший рок-н-ролл - это блюз, а плохой блюз - это рок-н-ролл.\
      \ понимаю неудовлетворенность музыкантов таким ответом, но, увы, это самое точное, что могу сформулировать. дело в нюансах\
      \ исполнения, а не в структуре.\nКстати, звукорежиссер, с которым я последние 10 лет записываю ВЭБ, имеет тот же вопрос:\
      \ как отличить блюз (иной раз) от рок-н-ролла. так что вопрос не праздный, им и взрослые опытные дяди, которые не совсем\
      \ в теме, могут интересоваться... но инструкцию я не напишу. Так что, служивый, я тебе так скажу: дважды в месяц я в\
      \ библиотеку не посылаю.\n\nPS\n\n\"Быстро избавлю бурратино от глистов. Подпись: Опытный дятел.\" - это про дерево.\
      \ Блюз, в общем-то, не дерево. Скорее Blues had a baby, and they called it rock'n'roll - как спел Мадди по наводке Брауни\
      \ МакГи. \n\"Большую картинку\" я однажды видел. Деревом там изображен джаз, и в самом низу от него растет такой толстый\
      \ и корявый сук. растет не вверх (куда ему!), а как-то в бок, горизонтально так растет. на суке написано: блюз. Поясняю,\
      \ как понимать: вырос на радость людям такой мощный ствол с буйной кроной - это джаз! а там, в самом начале отросло\
      \ от него нечто, что вверх не поднимается и не развивается - это блюз был, первенец-неудачник... авторитетное и, главное,\
      \ строго научное изображение. Основывается на том, что джазовые пластинки появились в продаже раньше блюзовых. \nибо\
      \ на \"валики\" блюз записывали, разумеется, еще до того, как \"джазом\" стали называть музыку. прежде так обозначали\
      \ посещение борделя с выпивкой, танцами и мордобоем и бегством от полиции. Вот это и был \"полный джаз\", о чем теперь\
      \ строгие джазоведы во фраках предпочитают не вспоминать, как лощеные аристократы не любят вспоминать, на чем основывается\
      \ семейное благосостояние).\n--- прошу прощения, что понесло.... видать, давно накипело :)"
