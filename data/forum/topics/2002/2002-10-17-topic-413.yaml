                text: "что в современном черном (и белом тем более) блюзе есть здоровая доля (в смысле, не большая, а положительная)\
                  \ коммерции. А где сейчас нет коммерции-то? Может быть, только в каком-нибудь джаз- или рок- андеграунде.\
