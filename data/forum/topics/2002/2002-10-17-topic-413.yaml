          Дык вот. Коммерческий рок-н-ролл с музыкальной точки зрения - очищенная от эмоции и от стилистических и интонационных
          щероховатостей, которыми отличается спонтанный, и от того настоящий блюз, некоторая последовательность популярных
          блюзовых ходов, которая воздействует на уровне мозжечка посредством ритмоинтонационного комплекса (есть учёные труды
          об особенностях музыкального восприятия, не буду их цитировать) и приводит субъекта в субтрансовое состояние, выражающееся
          в ритмичном подёргивании нижних конечностей. То есть голая технология. Кульминация рок-н-ролла - акробатический
          рок-н-ролл. Торжество тренированных мускулов. Это не есть плохая музыка. Это просто специальная музыка для здоровых,
          тренированных организмов, которые хотят весело двигаться, а не просветлённо грустить за пивом. Как марш есть специальная
          музыка для моего майорского организма. В наше время функции его же (рок-н-ролла) выполняют трип-хоп, хип-хоп и прочие
          танцевальные ритмы.

          Формально рок-н-ролл выделился в самостоятельное направление из блюза, поскольку все критерии наследования (inheriting)
          налицо.


