                  \ что люди играют хороший modern electric blues? Мне очень нравится, и я только из-за увлечения им стал\
                  \ интересоваться всем блюзом в целом, начинаю слушать классиков блюза и интересоваться корнями. И мне это\
                  \ интересно. \nИ это говорит о том, что блюз не умер (вместе со старичками - их мало уже осталось), развивается,\
                  \ живет полной жизнью и дарит людям радость. А когда я когда-то услышал (очень немного) Muddy Waters-а и\
                  \ Howlin' Wolf-а, меня это не завело. А теперь от современных исполнителей я к ним возвращаюсь. И открываю\
                  \ для себя.\nА Clapton-у (в блюзе), Воэну, Dave Hole, William Clark-у, Long John Hunter-у и другим- низкий\
