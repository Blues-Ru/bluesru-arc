    text: "Ну и правильно, что написали отдельно и откровенно. И при том по делу!\n\nПро первую вещь (которая называется Shining\
      \ Shoes) см. персональную почту. Немотствуют уста... \n\nПесня с подвывом, наверное, была Bring It On Home. \n\nБандерас\
      \ - хороший музыкант с редкими вокальными данными. Жаль, что он так неудачно спел про жену. Многих в тот день подвело\
      \ ожидание Большого Праздника. В том числе и щуплого бородача с потерянным взглядом. Но звукорежиссер - другой персонаж,\
      \ он вылез один раз петь хард-рок...\n\nАтмосфера - это хорошие люди. Они придут снова, забыв о минусах и помня плюсы.\
      \ Надеюсь на это. А мы будем помнить минусы. Чтобы их не было на следующем джеме."
