  deleted: false
  text: "Позвольте, я отдельным пунктом, дабы не затеряться в ваших спорах ;о) \nДжем.. Это был мой первый джем. Ожидала большего..\
    \ не ругайте меня за то что я скажу и не обижайтесь, please, но я дама откровенная и лгать не умею :) \nНачало повергло\
    \ меня в недоумение, ибо несыгранность первой вещи, что открывала джем, отдавала школьными вечеринками. Ритм-секция была\
    \ занята своими мыслями..? Или только звукооператор виноват..?\n\nПочему-то сейчас всплывают в памяти впечатления, далекие\
    \ от музыки - например, что Юрий Каверкин - очень колоритная фигура, что для сьемок идеально.. На сцене держится легко,\
    \ как рыба в воде, чего нельзя сказать о многих.. С прошедшим днем рождения, Юрий! Спасибо за игру.\nДок. Аграновский\
    \ ценральный шоу-мен, без его контакта с музыкантами и публикой было бы скучно.\nТамару слышала до этого на mp3 - мне\
    \ нравилось. Откуда на джеме взялось раскатистое \"р\" а-ля Mademoiselle Chante Le Blues, для меня тайна за семью печатями\
    \ - maybe это от стеснения, да и выключенный микрофон еще никому настроения не поднимал..\n\nА звукооператор - это бородатый\
    \ щуплый дядька с потерянным взглядом? :) Микрофон как-то выборочно не дружил - то с Джэмпин Джеком, то с Тамарой..\n\n\
    Наиболее проникновенным и душевным, на мой взгляд, получилось раскатистое исполнение Док. Аграновским песни (что это за\
    \ пьеса, подскажите??) в манере близкой к исполненной Джимом Кэри \"Somebody To Love\"(Jefferson Airplane), где звучат\
    \ раскатом окончания строк:\n\n\"When the truth is found to beeeee liiieeeesss\nand all the joys within yooouuuu diiieeeesss\n\
    don't you want somebody to llooove...\"\n\nSorry, но более подробно никак намекнуть-объяснить не могу, что за песня мне\
    \ понравилась, ибо названия не знаю :) Ну вот ещё только если.. была она где-то в районе 10-ти часов вечера и исполняли\
    \ Вы её сидя. Да и пианист-клавишник к тому времени уже, похоже, поменялся. Алексей, что это была за пьеса, чья? Подскажите\
    \ :)\n\nОтличалась игра С.Бабаева, но опять проблемы со звуком - зачем такое эхо..?\nАндрея Цыганкова почти не слышно\
    \ было :( \n\nСудя по всему, Михаил Владимиров испытывает кайф от того, что делает. Зажигает, как здесь любят говорить.\
    \ Уже хорошо!\nБлэки было мало. Братецкого много.\nХотелось услышать игру VR и Alex'a IV, но, судя по всему, не судьба\
    \ была :)\n\nА дядечка с песней \"От меня ушла жена\" напугал настолько, что мы ретировались, захватив ноги в руки..\n\
    \nPS: я не музыкант, а слушатель, и если мои суждения покажутся вам дилетантскими - простите. Я плаваю в муз-терминах..\
    \ Но уши - их не обманешь..\n\nА в целом, Всем спасибо! Тигр будет жить! Плюс очень добрая, приятная атмосфера."
