                text: "Есть несколько аспектов. \nНеприятно напоминать о своих заслугах, но я-то как раз постарался на этой\
                  \ ниве и сделал тираж блюзового сборника в 40.000 экз. Пластинка распространялась как приложение к журналу\
                  \ автозвук. раскупили. для покрытия издержек было сделано \"сувенирное\" издание. Продать надо было 500экз.!\
                  \ Два года не могу их продать. Вот вам пример поддержки потребителем отечественного производителя блюза.\
                  \ А поддержка музыкантов? ууу, это вопрос особенный. Умки мне эти пуристы-академики не простили! Оказывается,\
                  \ на блюзовом сборнике и пошутить нельзя! Почти все спешили поделиться со мной мыслями о том, что вот этот,\
                  \ и еще вот этот, и вот тот, и вон тот (в общем, почти все, кроме собственных) треков в сборник включать\
                  \ не стоило. Единицы искренне радовались появлению сборника, который, теоретически, позволял бы и музыкантам\
                  \ чувствовать себя \"сборной командой\".\nДалее.\nМажоры (это термин) выпускали альбомы \"Лиги блюза\",\
                  \ \"кроссроадз\", \"Удачного приобретения\" - одни убытки. Блюз-Казенз выпускали свои альбомы только на\
                  \ спонсорские деньги. Продвинутый лейбл \"Богема\", двигающий отечественный джаз, отказался двигать такой\
                  \ же блюз. \nВыпуская сидюк, музыкант волей-неволей вступает на поле шоу-бизнеса. И ему там приходится иметь\
                  \ дело с \"потребителем\". А потребитель не желает иметь дело с отечественным блюзменом. Обидно слышать?..\
                  \ Я в этом не виноват. Это просто факт. \nЧто делать? Записываться и выпускать диски! Только не расчитывать,\
                  \ что после выпуска диска и его презентации в программе \"ВЭБ\" начнется звездная жизнь. Ничего не изменится.\
                  \ Единственным вознаграждением может быть удовлетворение от проделанной работы, приобретение опыта и рост\
                  \ мастерства. Плюс уважение несольких товарищей по цеху. Если этого мало - нечего и браться. А то потом\
                  \ начинаются \"обидки\": \"не ценят\", \"все казлы\" и т.д. \nА почему я мрачен? история показывает, что\
                  \ блюз развивается там, где есть \"котел\", в котором дружно вариться большое сообщество музыкантов. \n\
                  А \"котел\", в котором это сообщество злобно грызется - никакой каши не сварит."
