                  text: "Вот видите, оказывается был выпущен сборник, а я об этом впервые слышу (думаю, я не одна такая),\
                    \ возможно оттого, что аудитория была выбрана не совсем верно.\nАндрей, у меня несколько иные мысли на\
                    \ этот счет. В целом я с Вами согласна, конечно, но. Не совсем я в курсе, но, простите, журнал \"Автозвук\"\
                    \ для кого издается..? Не для тех ли красавцев, которые обклеивают свой \"транспорт\" стикерами типа \"\
                    Русское радио\", \"Радио Шансон\", \"Радио Максимум\" и пр? В тех машинах и музыка играет соответствующая,\
                    \ если не хуже. А Вы хотели, чтобы от прослушивания ими блюзовой пластинки была бы какая-то отдача. Может\
                    \ я ошибаюсь, поскольку данный журнал мне не попадал в руки ни разу. Хотя нет, один раз попадался. Почему\
                    \ Вами не был выбран журнал Stereo&Video, к примеру..? Есть еще издания, но два года назад их, похоже,\
                    \ еще не выпускали. Но это так, всего лишь вариации.\nО музыкантах. \"Дружно вариться\" - возможно не\
                    \ совсем искреннее заявление, поскольку конкуренция всегда присутствует в отношениях между музыкантами.\
                    \ Вопрос в том, насколько они способны или не способны в принципе идти на контакт с себе подобными музыкантами\
                    \ (или \"сочувствующими\"). Случаев множество, когда люди собираются вместе только на запись пластинки,\
                    \ а всё остальное время поливают друг друга помоями, либо просто избегают друг друга. С таким же успехом\
                    \ можно и не \"грызться\", а просто делать общее дело, а потом мирно расходиться в разные стороны, если\
                    \ это им самим нужно, конечно же. Порой не могут спокойно договориться между собой два братца, чтобы выпустить\
                    \ очередную пластинку (не буду уточнять какие, благо не в тему - хотя, если судить по ругани, очень даже\
                    \ в тему ;-), тем не менее, пластинки выходят не смотря ни на что! Суть моих речей в том, что отношения\
                    \ между музыкантами никак не сказываются на качестве выпускаемого ими материала. Проблема в том, что человек,\
                    \ который займется (занимался) подобным делом (в данном случае это были Вы, Андрей), редко может рассчитывать\
                    \ на какую-либо благодарность со стороны музыкантов. Поскольку, звёздная жизнь не начнется, по крайней\
                    \ мере сразу, так как блюз - не та музыка; а если даже и начнется, то о Вас, будьте уверены, обязательно\
                    \ забудут, поскольку звездная жизнь зачастую сопровождается звездными болезнями (опять же, не всегда ;-).\
                    \ А значит, как Вы совершенно точно заметили, вознаграждением здесь является удовлетворение от проделанной\
                    \ работы, приобретение опыта и рост мастерства. По-моему, это уже немало. \n Вопрос тогда уж к нашим музыкантам,\
                    \ что движет ими в попытках играть и создавать музыку? Если sex&drugs, то это к рок-н-роллу. А блюз, как\
                    \ нам здесь пытались объяснить, это музыка выстраданная, с печалью, скорбью и, отчасти, мудростью. Значит\
                    \ публика будет другая, и дивиденды от проделанной работы меньшие, не идущие в сравнение с рок-н-роллом.\
                    \ \n Да.. и музыка должна цеплять, обязательно. Какой бы некоммерческой она ни была."
