  deleted: false
  text: "По большому счету в нашей стране любят музыку в основном небогатые люди. Это факт. Попробуйте найти хотя бы в одном богатом доме больше 20-ти компактов.. Этим людям не нужна музыка. Так сложилось в основном, что если у человека есть хороший дом, то он слушает дерьмо, как правило. Или одевается на рынке.. Или одевается в дорогих магазинах, но безвкусно. А если у человека есть хорошая аппаратура дома по цене с большим количеством нулей и он при этом любит музыку, то это совсем не значит, что у него хотя-бы есть какая-нить машина. А если человек коллекционирует блюз на родных пластинках, то зачастую у него нет ни машины, ни даже мобильного телефона.. ни компьютера и  интернета. А кто-то за питанием своим не следит, на музыку все тратит. Статистически \"нормальному\" человеку всего \"должно быть в меру\". А мы с вами уже \"статистически ненормальны\", потому, что нам надо _много музыки_. \nВот вам красноречивая выдержка из \"Play\" для тех, кто не читал:\n\"Как считается по сию пору, взрослому (старше 18 лет) человеку с деньгами неприлично слушать музыку и коллекционировать звуковые носители - большая часть \"традиционно мыслящего\" населения считает, что серьезные меломаны гораздо хуже алкоголиков и наркоманов, поскольку \"они не соответствуют своему возрасту\" и \"тратят семейные деньги на ерунду\". Словом, оказывается, что фирменными CD гордиться - по-прежнему ни-ни. Зато можно похваляться в кругу друзей: \"Я на музыку денег не трачу..\"\nТакая вот ситуация - вы и сами все прекрасно знаете, но почему-то это не учитываете.. \nИтог: пластинки _надо покупать \"родные\"_, обязательно. \nНо.. если у кого-то ну _нет_ на это денег при всем желании(где мы живем, вы знаете - я о доходах), не перегрызайте плешь ему.. Он сам знает, что фирменные лучше и, надеюсь, ждет лучшего периода в своей жизни. \nНо если человек хронически не любит музыку и не осознает ее прелести, не осознает прелести _настоящих_ пластинок, то будь у него хоть целое состояние, он пойдет и купит пластинку mp3..\nИ так все ясно.. не спорьте здесь до дурноты, пожалуйста. А для начала давайте перестанем гордиться покупкой пиратских дисков, так как пластинки лучше фирменные. Всегда. А также перестанем унижать тех, кто покупает по _финансовой_ причине нелицензионные..\nА брак везде бывает."
