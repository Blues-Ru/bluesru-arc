      text: "Андрей, я к тебе отношусь с большим уважением, но ты дал мне повод подколоть\
        \ тебя :-)\n1) Вот выдержка из интервью, ссылку на которое ты сам давал:\n\
        Звуки.Ru:- Вы будете играть на своей знаменитой гитаре, купленной за 20 долларов?\n\
        Marc Ribot:- Это не я ее купил, а Марк Энтони Томпсон (он же \"Шоколадный\
        \ гений\"). Действительно ровно за двадцать долларов. Я у него как-то взял\
        \ ее на денек, и с тех пор она находится у меня в постоянной аренде. Мне нравится\
        \ эта электрогитара. Этот мир электрогитар... Я думаю, что лучшие электрогитары\
        \ вовсе не те, что самые дорогие. Когда появились первые электрические \"\
        фендеры\", все \"настоящие\" музыканты, гитаристы над ними потешались, называли\
        \ их \"досками\". Однако, именно на этих досках, первом поколении электрогитар,\
        \ и сыграна лучшая рок-музыка. Мне нравится, что моя гитара звучит как самодельная.\
        \ Знаете, раньше мои концерты были гораздо более аскетичными, чем сегодня.\
        \ Какое-то время я играл только на этой самой гитаре. Помню концерт в польском\
        \ городе Быдгощ. Многие были недовольны, и кто-то все время спрашивал - зачем\
        \ это вы нам здесь играете на этой паршивой чехословацкой гитаре?. А она никакая\
        \ не чехословацкая. В Москву я привезу еще одну гитару - это акустический\
        \ \"Гибсон\" 30-х годов. /конец цитаты/ \nРезюме: никакая она не чехословацкая\
        \ и купил её не Марк.  :-)\n2) \"Регтайм на блюз-ру - offtopic!\" А Marc Ribot\
        \ - не offtopic? У Марка был блюзовый концерт? Расскажи, плиз, тогда поподробнее\
        \ - какие блюзовые стандарты были им исполнены. :-)\n3) Ты пишешь, что абс.\
        \ согласен с Андреем PRG, но чуть выше с ним же не соглашаешься, утверждая,\
        \ что \"До воистинности блюзовой им как от марса до меркурия\" (то бишь Регтайму).\
        \ Косячок! :-)\n4) Если Регтайм - по-твоему не блюз, то как же ты определяешь\
        \ их для Джазофрении? Как джаз? Просто я всё еще плохо разбираюсь в блюзе\
        \ и в джазе (видимо сморкаюсь неправильно, хотя и от литра пива как девка\
        \ не пьянею и к программерам не отношусь :-)\n5) Не пойму, чем тебе не угодил\
        \ мой стиль. Вроде форум называется \"разговоры о блюзе\", а не высокохудожественные\
        \ опусы,  и я в разговорной форме, но без откровенной нецензурщины, попытался\
        \ изложить своё мнение. Но если тебя это больно задело - приношу свои извинения.\
        \ I'm really sorry! Можешь тот мой постинг грохнуть. (Хотя некоторые тут про\
        \ пидров говорят - и ничего :-)\nP.S. В заключение хочу чтоб ты еще раз прочитал\
        \ первую строчку (т.е. это дружеский подкол :-)\nА вообще спасибо тебе за\
        \ то, что ты сделал и делаешь для нас и для блюза (и для Рэгтайма :-)"
