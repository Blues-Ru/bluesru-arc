    text: 'Федь-дим, может, про политез вспомним? Я-то в четверг был на концерте не
      слабже регов. я же никого не опускаю по этой причине! Играл Марк так, что вам
      и не снилось, долбанные программеры с буЁвыми гитарами. Он играл мудро, остроумно,
      мудрено, прикольно, с сердцем, с умом, нежданно, душевно - и вотзапп?! там был
      в полный рост. Кстати, Марк для самых крутых обработок использовал чехословацкую
      гитару, кот. он купил за 20$. звучало - на все времена. Кито не верит - к К.Мошкову
      на джаз-ру!


      Давно пора, гребена мать, уж понимать, где блюз, а где лихая гитарная игра.
      Регтайм на блюз-ру - offtopic! Им место - на гитарз-ру.


      И все пидры, кто возопят обратное. До воистинности блюзовой им как от марса
      до  меркурия: т.е., система одна, а путь далек, на световые годы. (хотя, мерещится
      мне, есть надежда).


      Теперь оппонентам - кое-что - заранее:

      Просто для суббординации.

      Я Регтаймам сделал два концерта, я им сделал публикацию в Итогах, я им сделал
      съемки для джазофрении!!! пусть только тот, кто реально сделал для них больше,
      возразит мне! Прочим - для начала - научитесь не только клаву долбить (и пьянеть,
      как девки, от литра пива), но и сморкаться одним пальцем! Это реальный шаг к
      понимаю блюуза.

      Всем сорри - только стиль Алекса и ненормальная лексика лже-ФьЁдора - причина
      сего постинга.


      А в Форте я буду. Два дня кряду.


      ЗЫ. Андрей PRG - абс. солгласен. только случайность послужила причиной, что
      мой пост кажется ответом на Ваш. (хотя блюз не числом, а уменьем!:)'
