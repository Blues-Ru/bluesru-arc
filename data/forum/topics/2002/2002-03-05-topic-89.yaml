                    poster: Sergei  Kiritchenko (VoID)
                    email: skvoid@yahoo.com
                    subject: оффтопик (форматы, продолжение)
                    deleted: false
                    text: "Разница в алгоритмах кодирования (способе кодирования), что влияет на выбор кодируемого материала\
                      \ (видео или звук), это в общих словах. Само-собой разные алгоритмы кодирования подразумевают разные\
                      \ качественные результаты, а также разные для них необходимые ресурсы  (аппаратные = вычислительные).\n\
                      VCD (VideoCD) есть алгоритм МПЕГ-1 с ограниченной пропускной способностью потока, а значит ограниченным\
                      \ качеством. Есть расширения VCD - SuperVCD и XVCD, все они расширяют возможность получить чуть более\
                      \ качественный материал.\nDVD есть МПЕГ-2, обладающим самыми качественными характеристиками получаемого\
                      \ результата, при само-собой большом потоке данных (для чего и нужен был вместительный носитель).\n\
                      МПЕГ-4 так и не получивший официальной сертификации (сейчас только сертифицируется вроде) альтернативный\
                      \ способ кодирования видео, приближающийся по качественным характеристикам к МПЕГ-2. Его разновидность,\
                      \ в свое время типа выкраденная из стана Мелкософта, называется DivX. DivX в плане доработанных кодов\
                      \ алгоритма ушел уже далеко от официального МПЕГ-4 и получает сейчас своё \"узаконенное\" место (что\
                      \ можно наблюдать с коммерческим выходом DivX 5.0, который кстати выходит и под платформу MAC). \nНа\
                      \ данный момент существует полная аппаратная поддержка только для МПЕГ-1 и МПЕГ-2 (VCD и DVD плейера),\
                      \ поддержка МПЕГ-4 только планируется и связана с его сертификацией, я думаю мы не увидим нормальной\
                      \ реализации МПЕГ-4 - кто-же даст резать курицу, несущую золотые яйца (МПЕГ-2).\nmp3-формат выпадает\
                      \ из этого оффтопика, так как является вариантом-доработкой формата МПЕГ-1 для аудио (так называемый\
                      \ layer 3 - откуда и название МП3).\nНадеюсь этот оффтопик мне в очередной раз простят ;)"
