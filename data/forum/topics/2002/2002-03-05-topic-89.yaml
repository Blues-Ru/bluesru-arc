                          text: 'Нужно преобразовать аналоговый сигнал в цифру. Если Мак новый, то вместо PCI типа Miro DC30
                            лучше использовать Analog to DV конвертер. В этом качестве вполне может выступать какая-нибудь
                            дивишная мыльница - видеомагнитофон или камера вроде Sony TRV-120. Несмотря на то, что она под
                            восьмёрочную кассету, сигнал у неё дивишный. Собственно конвертеров существует немало, но за исключением
                            профессиональных и соответственно дорогих все они очень ненадёжны.


                            Из софта понадобится капчурилка: iMovie или BTV Pro. Нужно будет забить в преференсах КвикТайма
                            номерок, чтобы он стал Pro. Ну и поставить соответствующие кодеки MPEG1 для VCD, MPEG2 для DVD
                            и Divx для Divx. Тогда из любой программы понимающей видео можно будет экспортить в любой из имеющихся
                            кодеков. Для нарезки болванок - Toast. Это вполне работающий минимум. Правда DVD требует оглавления,
                            но для этого есть iDVD.


                            Правда кодеки, предназначенные для просмотра - distribution, в отличии от  aquisition, очень капризные.
                            Если в материале много движения качество падает, серьёзные проблемы с lip-synch. Настройки компрессии
                            необходимо подбирать для каждой сцены. Работа муторная. Профессиональные программы для компрессии
                            - Cleaner и Astarte M.Pack. Cleaner использует кодеки, установленные в системе, а M.Pack - свои
                            встроенные. Лучшие MPEG кодеки делает Heuris, но их практически невозможно найти (если честно
                            не купить).


                            MPEG4 и Divx - отдельная история. И очень печальная.'
