                            deleted: false
                            text: 'КвикТайм давно уже Про ;) АйМуви есть, есть даже Final Cut Pro!

                              А что за печальная история с МПЕГ4?'
                            replies:
                            - id: 2059
                              parent_id: 2054
                              date: 2002-03-13 00:44
                              poster: мишка
                              email: aranysh@mac.com
                              subject: печальная история
                              deleted: false
                              text: 'не играет


                                То есть отдельные диски, на отдельных компьютерах, у отдельных товарищей...


                                А особенно печальна она потому, что диски на лотках продаются, и пресса пишет, и народ волнуется,
                                и даже Эпплу приходится бодаться с patent-holder''ами. Похоже MPEG-4 не станет "Video MP3".
                                Для пользователей слишком много головной боли, а для вещателей никакого интереса. Видео-индустрия
                                достаточна затратна и довольно инерционна. Не так уж и давно MPEG2 был принят в качестве вещательного
                                стандарта. Внедрение его ещё идёт полным ходом а уже нужно апгрейдить железо для High Definition.
                                MPEG2 HD в отличии от MPEG4 уже реально существует. Для стриминга же препятствием служит позиция
                                MPEG LA, требующей отчислений с каждого показа. К тому времени, когда эта организация образумится
                                пропускная способность сетей позволит стримить в MPEG2.


                                Такое у меня ощущение. Хотя глупостей в истории вещания хватает, например NTSC, так что...


                                -------


                                Если есть FCP, iMovie лучше убрать - развращает.'
