  text: 'Глаза разбежались у полки блюза в СОЮЗе, так что я выбрал лишь то, в чем уверен на 100%.

    Послушав старика Евдокима, решил ударить по Мадди. Купил: "Trouble No More", "The Real Folk Blues / More Real Folk Blues".
    Там есть The Real Folk Blues и отдельно, стоит он всего 264 рубля. Есть и другие номерные дела и концертники по небольшой
    цене, но я не стал брать Brass...

    Еще купил: Taj Mahal "Hanapepe Dream" 2001, B.B. King "In London" 1971; Buddy Guy "This Is Buddy Guy" 1968; Reverend Gary
    Davis "Say No To The Devil" 1961; Peter Green "Little Dreamer" 1980.

    Видел там и двойник Грина "Soho Sessions". На сайте заявлено 19 треков, у меня пиратский (один) - 17 треков, на оригинальном
    2 и тоже 17 треков. Тут я немного запутался.

    Стоит там "In The Skies" в отличном издании! Надо брать!

    Куча всего там есть. Много Тажа, но было все то, что у меня уже есть, вот и купил новый.

    Сходите, не пожалеете.'
