                                          text: '"смотреть" DivX и MPEG4 с лотков на маке можно. Люди этой дурью маются уже
                                            пару лет. И DivX 5 уже есть - качай на здоровье. Однако количество глюков при
                                            просмотре со старым DivX просто непотребное, да и с пятым не всё гладко. Проблема
                                            как в хитром или неумелом кодировании самих дисков, так и в том, что всерьёз вкладываться
                                            в разработку MPEG4/DivX плеера под Мак подобно самоубийству. Рано или поздно Apple
                                            договорится с держателями патентов  и публике будет позволено скачать QuickTime
                                            6 а там есть MPEG4. И как тогда отбивать вложенные средства если каждая QT aware
                                            программа на Маке будет играть эти мувики?


                                            --------


                                            На Маке много чего нет. Нет DirectX, нет LPT, нет флоповода. На мышке нет ни одной
                                            кнопки. Раньше на маковских мышках была одна кнопка но писюковцы смеялись им пальцем
                                            показывали. Тогда Apple кнопку с мышки убрал.


                                            ----------



                                            Учитывая то, что как основной разработчик IEEE1394 (iLink, FireWire) Apple получает
                                            лицензионные отчисления с каждого произведённого IEEE1394 устройства, аналоговый
                                            видеовход с Маков убрали окончательно и бесповоротно. Поэтому, кстати на PowerMac''ах
                                            всего одно посадочное место под 5.25" устройство. Хочешь второе - покупай IEEE1394
                                            коробку. В отличие от отвёрточников модельная линейка у Эппла небольшая (у IBM
                                            тоже, да и у HP). Свою роль играет и то, что Эппл не особенно прислушивается к
                                            рынку, а просто выбрасывает концепты и потом с удивлением наблюдает за тем как
                                            пользователи приспосабливают их под свои нужды. Так в своё время получилось с
                                            desktop publishing, примерно то же происходит сейчас с видео благодаря FCP. Просто
                                            огромные деньги, которые Apple вбухивает в research&development приносят иногда
                                            такие результаты, что отсутствие кнопок на мышке просто меркнет.'
