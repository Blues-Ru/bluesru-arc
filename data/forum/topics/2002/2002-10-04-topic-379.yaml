  deleted: false
  text: "Нельзя не написать пару строк. Это вот где картинки Андрей Евдокимов снял. Кстати, и а-натюрели клевые, и эффекты,\
    \ например, \"портрет маслом\" (новая камера, ишь ты).\nДжем получился интересный. Даже менеджер клуба, дама приятная\
    \ во всех отношениях, чуть не рыдала от счастья. А эти люди редко рыдают, поверьте. Ну ладно, я не про менеджеров. Джем.\
    \ Во-первых, было здоровое разнообразие и много нового. Скрипач А.Шовган сыграл с бэндом Shirley May. Ваня Жук и Андрюша\
    \ Цыганков солировали на электрогитарах (ты удивлен, читатель). Гия Дзагнидзе и Юра Каверкин дали такой Чикаго, что у\
    \ меня пиджак завернулся. С ними и с другими фронтменами играли ребята из Scolder Blues - Саша Бородин (саксофон) и Сережа\
    \ Капшин (тромбон). Бородин еще и спел пару вещей. Им - отдельные и заслуженные дифирамбические хвалы. Отлично сыгранный\
    \ дуэт, ребята с чувством звука и баланса. Без репетиций, первый опыт такого взаимодействия у нас был - и все очень легко.\n\
    \       Потом была джазовая часть - Гена Хащенко привел своих друзей-ветеранов (трубач Леонид Янков, басист Владимир Смоляницкий\
    \ и гитарист Вадим Ополев). В нынешние времена они не работают три концерта в день, и порой слышались расстыковки, но\
    \ не тем будь помянуто - было интересно и клево. Миша Владимиров с ними играл на гармонике и спел даже. Таня Михеева пела\
    \ свои удивительные джазовые вокализы на темы Nobody Knows и Leavin' Blues. Чем порадовала.\n      О звуке ни звука. Единственно,\
    \ монитор иногда начинал орать. Братецкий его обходил, как гремучую змею. А потом вроде унялось все и пошло нормально.\n\
    Всем спасибо, ребята! До встречи 17-го. Она произойдет не в Ехрате, а в ВУДСТОКЕ-Покровском."
