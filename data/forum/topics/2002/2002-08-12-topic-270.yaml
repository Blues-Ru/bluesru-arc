              email: thunderlips@hotbox.ru
              subject: он самый :)
              deleted: false
              text: 'Те комки, которые заслуживают внимания, расположены на улице Odengatan и отходящих от нее улицах и переулках.
                Адресов не назову, но на карте звездочки проставить смогу. Мой любимый называется Marquee Records, там помимо
                б/у продают еще найс-прайсовские диски (Sony, Universal, Warner и т.п.) по 79 SEK - кстати, эта цена держится
                вот уже как минимум 6 лет.


                В старом городе (островок, на котором стоит королевский дворец - Gamlastan) тоже есть музыкальные магазинчики,
                но они в основном с уклоном в тяжеленькое. Единственный на островке магазин, заслуживающий внимания - Got
                To Hurry Records - специализируется на бутлегах (классика рока). Правда, цены на бутлеги - как в Москве в
                R''N''B на Арбате.


                Заслуживает внимания большой магазин MEGA на центральной площади города Sergelstorg. Ценники там поначалу
                пугающие (как в Союзе или в Легионе),но с расчетом на TaxFree цены на многие вещи становятся привлекательными.


                Тот магазин, в котором ты был, тоже неплох, вот только там классификация у них "хромает" (т.е. перерывать
                надо все подряд) и TaxFree не делают.'
