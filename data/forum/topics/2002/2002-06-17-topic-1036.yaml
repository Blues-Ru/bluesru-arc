          subject: One Night In America
          deleted: false
          text: "замечательнейший: душевный и мастерский - альбом, вышедший нынешней\
            \ весной на глубокоуважаемом Теларке. Не без ностальгии по настроению.\
            \ среди музыкантов: барабанщик Per Hanson, гитарист G.E. Smith, и уж совсем\
            \ небезызвестный Robben Ford. Появление последнего не должно удивлять,\
            \ поскольку они выступали вместе еще в начале фордового пути, на заре\
            \ 70-х. \n(Новости отечетсвенного пиратства)\nНа горбушке есть концерт\
            \ Чарли Масселвайта 1971 года в Сан-Франциско: CD Taking care Of Business.\
            \ Аккомпанируют ему братья Форд (включая Роббена). Бешенный драйв, качественная\
            \ игра. но временами заметно, что кто-то \"под шафе\"). Бутлег, скопированный\
            \ пиратами - это пикантно само по себе... \n-----\nВ нынешнем году м-р\
            \ Масселвайт получил W.C.Handy не только в привычной для него гармошечной\
            \ номинации, но и за блюз года: песня Charlies Old Highway 51 Blues в\
            \ альбоме Кида Рамоса."
