  text: "Постоянно действующая акция \nДень рождения рок-звезды \n\n30 марта 2002 года\n\nотмечает 57-й день рождения\nвеликого\
    \ гитариста \nЭрика Клэптона\n\nПриглашаются для участия знатоки и поклонники творчества музыканта, почитатели блюза,\
    \ любители настоящей музыки и просто достойные люди.\n\nТоржества пройдут в ресторане Бамбук по адресу:\nг. Москва, 2-я\
    \ Брестская ул., дом 24 (м. Маяковская, м. Белорусская кольцевая).\n\nНачало мероприятия в 16 часов.\n\nВходной билет\
    \ стоит 600 рублей и включает в себя:\n100 гр. виски Jim Beam \n1 горячее блюдо по Вашему выбору \n20% скидку на меню\
    \ \nСпециальную цену на Jim Beam \nкомплект сувениров \n\nБилеты будут продаваться по указанному адресу. \nКоличество\
    \ мест ограничено.\n\nТелефоны: \nдля информации: 214-61-01 с 10 до 18 часов в рабочие дни \nпо вопросам приобретения\
    \ билетов: 251-68-98 \n\nЖдите дополнительной информации на сайте http://blues.hobi.ru!"
