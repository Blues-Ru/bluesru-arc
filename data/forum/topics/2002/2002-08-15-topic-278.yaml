    text: 'После вчерашнего джема в BB King я понял, что я на Стенлес больше не ходок.

      Все последние разы, что я был на Стенлесах, мне было почти скучно.

      Хожу то я из-за Гегарта, а не на Булкина, а Ромка в Стенлесах зажат. Ходит как на работу, да и поет мало. Лидер в команде
      другой.

      Другое дело, вчерашний джем!

      И музыканты в Buld for Comfort классные, и играли задорно, и Рому я такого драйвового давно не видел.

      Джем был суперский!

      Не могу объяснить как так получается, но я когда играл вчера, у меня за спиной словно была надежная стенка из музыкантов.
      Ноты сами собой игрались - группа меня просто несла, игралось, как будто само!

      Жалко, что рано пришлось уйти.'
