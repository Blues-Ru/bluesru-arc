              deleted: false
              text: 'Что касается "ленты новостей", то, по моему мнению, это не очень хорошая идея. Глаз замыливается на этих
                картинках. Мое предложение: новости и картинки должны убираться в архив через неделю. Если новостей нет, пусть
                на этом месте висит картинка King Biscuit Boys и стоит расписание текущих концертов (примерно как сейчас).
                Это действительно текущие новости! А уже под ними могут быть новости Калачева и ссылки.

                Кстати, о картинке. Ее стоило бы дать полностью, без урезки головы и ног. Это весьма достойное фото Криса
                Страхвица, изображающее Хьюстона Стакхауса, Сонни Боя Виллимсона и Джеймса "Пека" Куртиса. То, что Федор в
                свое время выбрал это фото для своего сайта - очень здорово.'
