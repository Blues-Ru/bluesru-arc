  text: "И всё это в Москве, на набережной Москва-реки, напротив Парка Культуры, по\
    \ соседству с прелестнейшим Парком городской скульптуры.\n\nНе доехала группа\
    \ «Mobile Blues Band». Её заменили другой – «Modern Blues Band». Я всегда знал,\
    \ что акустика ЦДХ не годится для громкой музыки (to Фёдор), но чтоб настолько!\
    \ Ударные глушили всё: и гитары, и вокал. Прикольно было слышать в heavy-blues-fank-version\
    \  «I’ve Got My Mojo Working». И это, пожалуй, всё. Зато после 25-минутного сета\
    \ MBB на сцене появился «Ragtime» и воистину неистовый Арсен Шомахов. И сразу\
    \ почему то ударные перестали всех забивать, да и гитара стала слышна ...  ;)\
    \ Видимо, дело всё-таки не только в кривой акустике ЦДХ. Ребята были в потрясающей\
    \ форме. Совершенно обалденная, можно сказать, филигранная гитара, замечательный\
    \ вокал. Вокал очень напористый, но при всём при том – интеллигентный, в отличие\
    \ от излишне брутально-грубого вокала Г.Дзагнидзе. Очень техничные инструменталки\
    \ и необычные каверы. Клёво! Жаль, что народу было немного. Видимо, дачи затянули.\n\
    \nА Леван почему не приехал?…  Гм… Обиделся на столь прямолинейно-некорректное\
    \ обсуждение его творчества?… \n\nTo VR: напиши, плиз, что-нибудь про гитару Арсена."
