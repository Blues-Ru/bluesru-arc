  text: 'Я так понимаю, книг о блюзе на русском нет. А в сети есть интересные материалы. Но часть ресурсов умирает, часть
    периодически недоступна, часть написана белым по белому :-)

    В связи с этим, не пробовал ли кто собрать эти перлы, конвертнуть, к примеру в pdf и читать с толком и расстановкой оффлайн?

    И вообще может замахнуться на создание энциклопедии или сборника - договориться с авторами материалов о свободном некоммерческом
    использовании, предложить присылать свои материалы энтузиастам сверстать и выложить в сеть?

    Хотя  владельцы многих живых ресурсов будут против - побоятся уменьшения посещаемости.

    Ну а для себя лично такую книгу постараюсь сделать.'
