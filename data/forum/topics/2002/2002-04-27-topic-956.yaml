          text: '... с Джоном посетили концерт "Регтайма" в R&B Cafe и остались очень довольны. Было приятно вновь увидеть и услышать замечательную группу. Концерт был потрясающий, как уже сказал Федор. Звук хороший. Настроение у музыкантов было вроде бы тоже хорошее. Даже обычно спокойный Аслан Жантуев (басист) иногда пританцовывал :-) Бек за ударными как всегда был улыбчив и создавал драйв, а Арсен как всегда был неподражаем по части гитары и вокала. В зале были замечены зрители, просидевшие весь концерт (натурально) с отвисшими челюстями :-) Также была компашка каких-то иностранцев (распевавшая хором в перерыве между "Ragtime" и "Blues Cousins" песню "Everybody Need Somebody" из "Blues Brothers"), один из которых купил компакт "Регтайма"... за двойную цену и расплатился зеленью :-)) Мы с Джоном тоже купили по диску. И уже послушали раза по три :-) В общем спасибо большое группе "Ragtime" за отличный концерт и за отличный диск! Обязательно придем еще!'
