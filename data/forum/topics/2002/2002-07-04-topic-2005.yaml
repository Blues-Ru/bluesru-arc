    text: Бенды на синтетике действительно возможны. И даже на тон. Но когда играешь соло с использованием мизинца левой руки
      на фоне собственного аккомпанимента, то, дай Бог, полтона получить. Однако, бенды вообще, и на тон, в частности, --
      не самоцель;-)
