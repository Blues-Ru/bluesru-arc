      бронзовые, ту же девятку, у них характерный минус это то что они подтягиваются ещё хуже нейлона, больше чем на 1/2 тона
      мне подтянуть не удавалось и ещё они очень не прочные, опдётка начинает ломаться буквально через месяц. Но усть у них
