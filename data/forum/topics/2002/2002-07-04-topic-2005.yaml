          subject: 8ки и 9ки
          deleted: false
          text: 'ставят на электро-гитары (в основном на Фендер). Ставят те, кто играет с большим количеством обработки и
            использует бенды более чем на тон. При этом струны эти плохо строят априори, имеют плохой сустейн и быстро выходят
            из строя. Обычно металлисты пользуются этими струнами.

            Для блюза же 10ка это минимум, а для полного кайфа стоит ставить гибридный комплект Slinky, где толстые струны
            толще, чем обычно. То есть 1-ая 9ка, например, а шестая 52 вместо 46. У моего гитариста Славы стоит именно такой
            комплект. Тонкие высокие для техничной и облегченной игры и толстые низкие для мяса и хорошей аккордной игры.'
          replies:
