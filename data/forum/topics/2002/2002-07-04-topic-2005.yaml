    subject: Струны
    deleted: false
    text: 'Если ты играешь пальцами, да еще на классической модели, то тебе нужны приличные нейлоновые струны, без всяких
      чудных навивок. Ставить лучше более жесткие струны (толстые). Не знаю твоего бюджета, но советую брать что-то приличное.
      Струны на классике стоят долго, а хорошие будут стоять еще дольше. И строить будут дольше и лучше.

      А металл нельза ставить потому, что в классических моделях обычно не стоит АНКЕР в грифе. К тому же, железо просто не
      звучит на таких гитарах, и не строит вообще. Тут столько шибко грамотных собралось, а объяснить не могут ;)

      Так что бери рублей 500 (на всякий случай) и дуй в магазин ЯМАХА на Садовом Кольце близ Маяковки.

      Успеха!'
