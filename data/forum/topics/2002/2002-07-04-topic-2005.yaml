    text: 'Резюме.

      На классическую гитару металл ставить все-таки противопоказано. По двум причинам: 1) тонкий металл на акустике --- нонсенс
      (Дима Казанцев все очень правильно сказал), а толстый убьет инструмент на хрен, и 2) все равно НИ НА КАКОЙ классике
      НИКАКОЙ металл строить не будет.


      Так что нужно брать хороший нейлон, и только High Tension. Вот здесь я излагаю свое мнение по поводу разных нейлоновых
      струн: http://groups.google.com/groups?hl=en&lr=&ie=UTF-8&oe=KOI8-R&selm=1024676328%40p183.f968.n5020.z2.ftn


      А бенды на нейлоне все-таки возможны. Я на тон вытягиваю без проблем.'
