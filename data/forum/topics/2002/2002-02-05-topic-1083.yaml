      subject: Очень сложно
      deleted: false
      text: 'Особенно на этом сайте. Щас оффтопиками обзывать начнут.

        Самый лучший альбом у Вэна - ''Astral Weeks'' 1968. Это признают все, тут
        не может быть и спора.

        По блюзу хорош альбом ''Too Long In Exile'' 1993. Там пара вещей с Хукером
        и вообще пол-альбома по блюзу.

        Мне очень нравится ''Period Of Transition''. Там Dr. John везде!

        ''St. Dominic''s Preview'' отличный.

        Очень сложно дальше...'
