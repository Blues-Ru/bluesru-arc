    text: 'Астрал Викс Астрал Виксом, а вот то, что Моррисон записывал с Джоном Ли
      Хукером меня совершенно не впечатлило. Причём именно таким образом: пока темой
      владеет Хукер - всё нормально, его музыка; как только она переходит к Моррисону,
      градус блюзовости тут же падает. При этом отдаю себе отчёт, что множественность
      подобных опытов явно указывает на то, что Хукер был не прочь сотрудничать с
      Моррисоном, а Моррисон, в свою очередь, блюз очень любит и работает с ним всерьёз.
      Но результат лично меня так и не прошиб.'
