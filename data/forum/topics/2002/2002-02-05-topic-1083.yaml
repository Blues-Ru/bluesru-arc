  text: "Звучит странно для многих, не так ли? Может быть, но не для меня. \nСобрав\
    \ почти все его пластинки, я понимаю, что Van The Man всю свою жизнь обожал именно\
    \ Блюз, независимо от того, что он играл.\nЕсли сделать сборник блюзовых вещей\
    \ со всех его альбомов плюс с альбомов Them и гостевых участий у Хукера итд, то\
    \ получится добольно длинная подборка обалденного и качественного блюзового наследия.\
    \ Слушая вещь T.B. Sheets с его первого альбома, поражаюсь понимаю темы этим коренастым\
    \ ирландцем.\nКто что думает по этому поводу?"
