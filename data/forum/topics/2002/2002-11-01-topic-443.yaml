  text: 'Только что вернулся с концерта в БиБиКинге. Было круто, программа у них изменилась
    на половину. В частности, они играют еще две новые убойные песни собственного
    сочинения, а также несколько вещей Ронни Эрла - Фредди Кинга, которые звучат ооооочень
    интересно. Публика была в восторге. ;)

    Приходите завтра в НЭО!'
