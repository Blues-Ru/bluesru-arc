      text: "И Регтайм хорошая группа, и многие \"любители поджемовать\" умеют играть\
        \ на инструментах. Кому что нравится, тот то и кушает - любимые острые, пестрые,\
        \ постные или калорийные блюда. Одному подавай героя, а другому попову дочку.\
        \ Один ищет раздвинуть горизонты, другой - что-то иное. Вывод мой - ничего\
        \ в обязательном порядке не бывает.\n   Пользуясь случаем хочу выразить признательность\
        \ участникам вчерашнего джема в Вудстоке: Мише Владимирову, Леше Блохину (игравшему\
        \ на фоно Красный Октябрь), Ване Жуку, Андрею Цыганкову, Юре Каверкину, Саше\
        \ Половинкину, офигительному негритянскому дуэту Мао - Грей Вульф. Отдельное\
        \ спасибо - Ане за мужество при пенье и звукорежиссеру Игорю - за качественный\
        \ звук. Народу было - не протолкнуться. А как слушали-то хорошо. Всем спасибо.\n\
        \   Пользуясь тем же случаем, хочу выразить глубокую скорбь по поводу того,\
        \ что по казенной надобности был в другом месте и не смог послушать Арсена,\
        \ Бека и Аслана. Печаль моя тем глубже, что сегодня вместо Нео придется опять\
        \ идти в обрыдший Вудсток и играть с группой Черный Хлеб."
