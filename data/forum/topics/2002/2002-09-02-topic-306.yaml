    text: 'Я рекомендовал не "Отчет эксгуматора" а "Плохо темперированный клавир" как почти блюзовый рускоязычный альбом послушать. С "Отчетом", это уже совсем другая история...

      А по поводу КСП... Вот чего в Волгине нет, так КСП точно. Можно много плеваться жеванной морковкой и брызгать слюной, но давайте глупостей то не говорить! Ярлыки развешивать совсем не трудно, сложнее не прослыть после этого дураком.

      Может быть более уместен термин - "самодеятельность" ? Или Вы еще что-то хотели придать особенное этому выражению?

