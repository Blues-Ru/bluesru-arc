  text: 'Всем привет!!!


    Внимание, внимание!!! Всем (в первую очередь питерцам) сообщаю.

    Открылся новый БЛЮЗОВЫЙ клуб на Мытнинской 12. Называется он "Gandharva".

    Клуб действует под руководством Сергея Некрасова (Стива). Это как раз тот хороший дядька, который организовывал первый блюзовый фестиваль "Дельта Невы" (www.nevadelta.spb.ru).

    Милости просим! ;)))


    Об открытии можно прочитать здесь:

    http://www.rock-n-roll.ru/details.php?mode=show&id=190


    Всем всего самого хорошего и доброго.'
