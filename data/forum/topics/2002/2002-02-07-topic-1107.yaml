                              text: '... предрассудок. Конечно, звукозаписывающие компании наживаются на артистах, но нельзя считать их работу бесплатной. Вообще, идея по справедливости разделить заработанные деньги - не работает в рыночной экономике. А другие формы экономики (коммунизм, к примеру) - сами по себе не работают. Это марксистский тезис - отобрать деньги у предпринимателя и отдать деньги рабочему, который их заработал, на самом деле.

