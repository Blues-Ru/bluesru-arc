        deleted: false
        text: 'Был я там один раз году этак в 1997-м. Тогда ещё это место называлось "Mooshead Canadian Bar": тесное дорогое заведение с крайне неудачной для концертов планировкой. Про акустику сказать ничего не могу - так что-то невразумительное. Среди посетителей процентов 60 иностранцев, а из остальных много папиков с голдами на шеях и малолетками, а также клерки из близлежащих офисов, но последних явное меньшинство. К сожалению, впечатления очень старые. Может, там всё и изменилось к лучшему.


          Да, вот ещё что, ещё одна описочка: "Лиги блюза"-то уже года четыре как не существует, так что Арутюнов вернее всего будет петь под аккомпанимент "Blues Cousins" или приведёт молодёжь из "Чер-Ты", что, впрочем, может быть тоже весьма интересно.'
