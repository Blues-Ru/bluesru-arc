      text: "Му.. му.. мужчинки, кто-нить может описать, что из себя представляет Crazy Milk..? \nА то клуб находится в принципе рядом, но очень не хочется попасть в пэтэушное место, каких много. Тока много баб не предлагайте, плиииз :) \nМожет, есть где-нибудь местечко, похожее на Churchill's Pub, но чуточку ближе? \nЛюди, опишите свои любимые клубы, места и местечки, где на ваш взгляд лучше всего звучит что-то приближенное к блюзу, фанку или джазу.\nПомечу мои маленькие ориентирчики:\nнам понравился \"китайский летчик\", когда он полупуст, \n\"бибик\" без пьяного воронова :)(падарите ему габаритные огни :)) и того толстого дядьки из компании макара, который всё время что-то интенсивно жрал :Р, \n\"б2\", когда он переполнен, обожаю! жаль, с блюзом там недружба :( \nну и \"ле клуб\" вполне, если там не пить красное вино :D\n\nУ меня, к сожалению, нет времени исследовать все клубы, а потому буду признательна за любой рассказ. Список на страничке http://www.blues.ru/gigs.asp  достаточно большой, но мертвый, без впечатлений.\n\nКто был в Вудстоке?"
