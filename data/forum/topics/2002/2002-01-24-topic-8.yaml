          text: Перевод слова hardcore именно таков. С семантикой и историей термина сложнее. Сначала (в применении к рок-музыке)
            было слово hardkor, та самая аббревиатура "тяжелого рока, ориентированного на подростков". Поскольку звучат эти
            слова одинаково, произошло слияние, и термин (в обоих написаниях) стали применять для обозначения "честного (бескомпромиссного,
