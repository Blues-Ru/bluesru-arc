                  subject: Про Брауна
                  deleted: false
                  text: "Ну не так, Андрей!\nЧарльз - mellow blues приджазованный. Я же уже писал, что многие были под огромным впечатлением от Нэт Кинг Коула и его трио и создавали подобные банды. Обычно это были пианисты, они были лучше музыкально образованны и денег у них было побольше, ведь они могли работать таперами в кабаках. \nНа сегодняшний день это прекрасная музыка, но она в корне отличается от гитарного и гармошечного блюза юга и чикаго. \nЕсть ведь еще ребята из Нового Орлеана, которые с начала века не пойми что играют, и как хочешь это так и называй.\nМы с тобой как-то о Джей МакШонне говорили. Он тоже старой школы пианист, но может играть и блюз и джаз, но опять же, его блюз слишком сладок и чист, чтобы войти в основные блюзовые школы. Есть же еще и West Coast Style.\nВ прочем, ты это все знаешь лучше меня, это я так для всех написал..."
