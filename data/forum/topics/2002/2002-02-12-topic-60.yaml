                      deleted: false
                      text: "здесь была метафора (во как! :)), предыдущий автор писал про софт, хард и \"если отформатировать\"\
                        \ - ну это знаешь как у нас компьютерщиков в жизни: есть софт (программы), который ставится на хард\
                        \ (аппаратную часть) и если все это \"глючит\", то просто все \"сносим\", т.е. переформатируем винчестер\
                        \ (жесткий диск), НО есть такая беда - бывает \"глючит\" все от появления сбойных участков на винчестере\
                        \ (\"бэдов\") и если они физические, то тут уж никуда не деться :))) \nА вообще это просто проф. заболевание\
                        \ такое - так что выражаться яснее не получится :))) В общем ОФФТОПИК, соррри!\nЗЫ - а Маккартни я\
