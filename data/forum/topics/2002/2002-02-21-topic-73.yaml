    deleted: false
    text: 'Проводят Аграновский и Bluesspinners по очереди со "Станцией Мир" -- по
      крайней мере, как было обещано. Во всяком случае, джемы от Доктора Аграновского
      были раз в две недели по четвергам, а "Станция Мир" запланирована первый раз
      на будущий четверг.


      Начало в восемь вечера. Ну, реально, может, пять-десять минут девятого :) Поскольку
      шуметь там, к сожалению, разрешают только до десяти, стараются с началом не
      затягивать :)


      Сегодня вот очередной джем был. Доктора Аграновского, увы, по причине болезни
      там не было, однако было немало других замечательных людей :) Даже Рома Гегарт
      в кои-то веки появился -- по-моему, впервые за всю историю второэтажных джемов,
      если не считать его (Роминого) дня рождения :)'
