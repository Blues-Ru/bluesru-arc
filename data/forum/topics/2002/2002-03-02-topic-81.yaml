        subject: Ну так привозите!
        deleted: false
        text: Каюсь, ни на концерте Ярдбердз, ни на пивном празднике Эфесса я не был. Более того, я по детской глупости пропустил концерт Би Би Кинга в 1979. Но если речь зайдет о Тадж Махале или о Бадди Гае, например, то я готов внести предоплату и за год и за полтора.
