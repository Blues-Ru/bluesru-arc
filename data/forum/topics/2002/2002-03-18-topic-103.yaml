    text: "если бы собрались мы трое, поставленных с @ на обложке данного сайта, да и проголосовали бы, оставлять тут этот топик, боюсь, ты бы в меньшинстве остался. Так что демократия с голосованием - не на твоей стороне.\nПонимаешь, у тебя, Федор, ведь находятся аргументы, когда ты вычищаешь (и не лень же!) два неблюзовых концерта из расписания блюзового (хотя бы декларацией и названия) клуба. И какие аргументы: помойку, мол не надо устраивать! У нас сайт блюзовый! а то будет как на афише! \nНо когда дело доходит до демократиии в форуме, твое отношение меняется от категоричного минуса на категоричный плюс. Не  по математически это, не програмистски, однако! :).\nТо что происходит на форуме - это и есть помойка в чистом виде, и коллективный разум здесь не причем. \nПотому что:\nхотелось бы:\nчтобы этот форум был не для любителей музыкальных форумов, а для любителей блюза. \nвот и все. так просто. \nответствуй, Федор, чистильщик ты наш, что это за ветка такая?\nЗЫ. Поскольку буду неприменно истолкован превратно, заранее могу сказать: \"Дип Пепл\" - не табу. Но \"блюзовость\" Дип Пепл можно обсуждать здесь только в контексте влияния блюза на поп-музыку. В противном случае - это не блюзовый форум, а происходящее смакование истории смен личного состава и обсуждения альбомов на уровне: мне нравится этот, а другие два могут только лохи слушать. (Я лично уже смаковал тоже самое больше четверти века назад, и вступать в те же воды снова мне просто страшно; как будто время для меня кончилось, и я вечно осужден крутиться между ЛедЗеп и ДипПеп, изредко задевая Наз и прочий пронафталиненный комплект). \nЗЫЗЫ. Мне кажется вполне допустимым позвать участников форума на любой концерт или место встречи. Но после этого все - только мусор с точки зрения темы нашего сайта. \nили уж давайте переименуемся в www.inogda.blues.ru\nЗЫЗЫЗЫ. Бог свидетель, я долго терпел в надежде, что тема заткнется сама."
