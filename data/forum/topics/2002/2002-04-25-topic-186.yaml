  subject: Зоопарк
  deleted: false
  text: "Мы с Юрой Каверкиным ходили в зоопарк и смотрели, что там можно сделать в\
    \ плане блюзовых джемов и прочих акций. Выяснилось следующее -сделать можно многое.\
    \ Зоопарк (в лице замдиректора и других людей) к этому относится очень хорошо.\
    \ Там есть зал примерно на сто мест (в отдельном здании), в котором стоит приличная\
    \ голосовая и пульт, и есть открытая площадка прямо на территории. \n\nДоговорились\
    \ так: в мае проводим первую акцию-джем в зале. Хаус-бэнд будет как на Втором\
    \ этаже, мы же обеспечим недостающее (ударные и пр.)\n\nВопрос ко всем: когда\
    \ это лучше сделать. Я бы предложил 16 мая, это первый четверг после выходных.\
    \ Давайте обсудим."
  replies:
  - id: 4104
    parent_id: 4102
    date: 2002-04-25 13:55
    poster: Юрий Каверкин
    email: kaverkin@rol.ru
    subject: Moscow Zoo Jam
    deleted: false
    text: "16 мая это круто (BTW мой день рождения)!\nПроблема - в зале нельзя курить!!!\
      \ Пиво и прочие напитки пить можно,но крайне желательно унести по окончании\
      \ пустую посуду. \nАкустика в зале видимо хорошая и все звуконепроницаемо вне\
      \ зала.\nАппаратура \"Fender\" - довольно мощная, но тем не менее ,как мне кажется\
      \ акустический jam был бы предпочтительнее...\nОткрытая площадка совершенно\
      \ блюзовая . Это небольшая эстрада вокруг которой проходит небольшая железная\
      \ дорога (кто скажет,что это не блюз?), а в некотором отдалении находится вольера\
      \ с черным котом (это для любителей MOJO?, но кота желательно оставить в живых).\
      \ Док предложил провести на этой площадке открытый jam с природохранной направленностью.\
      \ В зоопарке все - ЗА!!!"
