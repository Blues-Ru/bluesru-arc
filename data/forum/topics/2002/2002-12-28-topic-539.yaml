  text: 'Есть софтверная контора, которая вместе с софтом своим распространяет диск
    в формате ogg с записями т.н. некоммерческой музыки - Openmusic ( om.lrn.ru ).
    В качестве рекомендации: на прошлом диске были Док и Черный Хлеб, Станция Мир
    ,Умка и другие люди записанные на студии Матроскина.

    Сейчас они обсуждают выход нового сборника. Кому интересно - можете подписаться
    на список рассылки - http://www.altlinux.ru/mailman/listinfo/music предварительно
    посмотрев его архив за декабрь.

    Денег не заплатят, но есть возможность широко прославиться в узких кругах программистов
    и админов.'
