    text: "очень интересная статья :) и никто тебя федор не будет убивать - ты не понял :) концерты могут быть разными - там где я слышал Бадди было и со звуком гитары все ок и настроение у него было все дорогу просто великолепное. второй гитарист вообще ниодного соло не играл :) зато саксофонист был просто убийсвенный :) клавишник - всегда был просто супер. ну может тебе меньше повезло, а может твое восприятие музыки и блюза совсем иное. \nмне например совсем не интересен Вест Коаст. мне скучно, хотя я могу признать что люди играют очень хорошо и от души и начитанные и так далее :) мне уж тогда больше интересен соврменный NYC blues в таком раскладе :) \nда и про программу - в белгии она отличалась процентов на 70 от того что я слышал раньше - ко всему прочему бадди сыграл вещи 3 на акустике :) у него большой набор - и он уже соеднияет как захочет - тебе может просто меньше повезло ;)\n\nа про то что там все бегут за полуакустикой и хотят дудок - это все враки :) все они поразному везде бегут :)) а просто там есть много музыки которую можно слушать и так и живьем, а тут нет ... вот и вся проблема... недостаток информации исключительно. \n:)"
