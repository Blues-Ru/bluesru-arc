    text: 'Федь, сноска на сайт Доктора не работает, ибо сайт еще не сделан ;(


      Я понял одну простую вещь; мы с тобой ждем отмузыки совершенно разной реакции. Тебе нужны танцы и веселье, а я музыку слушаю и думаю и чувствую в этот момент. Так что понятно, что Доктор не для тебя. Разве что его бодрые альбомы в стиле Марди Гра. Я же не могу слушать вест-коаст, рокабилли, поп-джаз - для меня это попса и однообразие, вот и все. А для тебя наоборот.


      А статья вышла хорошая, молодец!'
