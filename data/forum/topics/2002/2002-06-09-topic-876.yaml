  text: '"Трансильвания" - в ассортименте замечены сборники мастеров довоенного блюза,
    выпущенные хорошим лейблом Indigo. Имена: Блайнд Лемон Джефферсон, Чарли Паттон,
    Слипи Джон Эстес, Мемфис Минни, Ледбелли, Роберт Джонсон. Может статься, это ещё
    и не все. Вообще раздел чёрного блюза заметно обогатился.

    "Пурпурка" - учинён сейл. В блюзовом разделе замечены диски Мадди Уотерса, Джона
    Ли Хукера, Би Би Кинга и др., в общем, есть в чём порыться. Учитывая сниженные
    цены, интересующимся предлагается поспешать.'
