      subject: Dirty Blues...Clean Blues...
      deleted: false
      text: 'Дима, а я и остаюсь приверженцем блюза в чистом виде, но иногда слушаю и другую музыку. Был там и блюз (мало!!!),
        было и другое. Фанковатость была услышана при выступлении музыкантов из Туниса. Чуваки конкретно барабанили ,наши
        подтянулись и кой чего замутили. Вообще, смешно получается,прошлый раз Воронов с монголами,в этот раз тунисцы с Гилютой
        ;)Интересно, что получится у Аграновского с непальцами.

        А чистый блюз я играю дома с очень старыми музыкантами, благо записей хватает. И вот ведь, что! Недавно играл с Big
        Joe Turner, говорю ему:

        Лажаешь,говорю Joe ! А он в ответ: За собой следи! Ну я его и вырубил! Наверное теперь буду с Memphis Slim-ом тусоваться,
        он вчера мне звонил, но я в БИБИКинге был - латинский фанк с монголами слушал:)'
