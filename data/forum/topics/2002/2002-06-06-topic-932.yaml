  subject: '"Рокобилье" в БиБиКинге'
  deleted: false
  text: "Когда играют профессионалы это всегда приятно. Да, это был не совсем блюзовый (может и совсем неблюзовый) джем, но\
    \ музыканты home band во главе с Валерием Гилютой играли на очень высоком уровне.Какой же классный гитарист Гилюта!!!Про\
    \ Дениса Мажукова чего говорить? Отлично они со вторым пианистом (имя забыл,sorry)на двух клавиатурах изображали!\n Из\
    \ джемующих выделить кого нибудь сложно,все были довольно хороши, но на фоне перцев из \"Ruby Stars\" несколько терялись.Хотя,Братецкий\
    \ с Аграновским да и Владимиров с Бандерасом дали шороху. А гитару Андрея Циганкова было слышно слабо,хоть ты тресни!\
    \ Я ему и так и сяк руками махал,мол прибавь звуку... У меня та же проблема - на сцене вроде нормально, а в зал не пробивает.\
    \ А Сергей Виноградов ситуацию просек и звук прибавил и зазвучал как надо.Sorry если кого забыл.\n Короче,было все,от\
    \ латинской музыки и регги до фанка и рок'н'ролла и всем было весело.\nP.S. Блюз - музыка грустная даже когда она веселая...."
