  text: "Выпустить CD можно помочь....\nи попытаться устроить дистрибьюцию небольшую...\n\
    только это пока денег не принесет\nа насколько я знаю - музыканты денег хотят...\n\
    и думают что на них денег рубят... рубят но не сколько они думают \n\nвыпуск CD\
    \ сам по себе не затратен - 1000 штук вместе\nс полиграфией стоит центов 50-60,\
    \ правда плюс оригинал-макет обложки\nвот только писаться надо где-то\nхотя если\
    \ для начала с пульта в хорошем клубе... \nпри хорошем звукаче, не фонтан - но\
    \ покатит.."
