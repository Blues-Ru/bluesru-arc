  subject: А давайте вот такой опрос
  deleted: false
  text: 'Чтобы окончательно понять кто мы и что мы, попробуем ответить на такой вопрос: какое десятилетие 20-го века Вы больше
    всего любите в блюзе?

    a. 1921-1930

    b. 1931-1940

    c. 1941-1950

    d. 1951-1960

    e. 1961-1970

    f. 1971-1980

    g. 1981-1990

    h. 1991-2000

    Напишите почему и выделите пяток основных артистов. Это будет и интересно и полезно.'
  replies:
  - id: 1428
    parent_id: 1426
    date: 2002-02-20 01:58
    poster: Михаил Бирюков (nECKAPb)
    email: blackcat@blues.ru
    subject: в угол загоняешь ;)
    deleted: false
    text: 'А напрасно. Логичнее предположить, что если человек любит блюз, то он найдёт достойные блюзовые записи в любом
      десятилетии существования блюза.

      Далее. В рамках 1920-1943 гг.. я, как ты знаешь, выделил на данный момент 110 человек, и это ещё не все. Каждый индивидуален
      и интересен, каждый внёс свой вклад в историю и формирование блюза. А ты мне предлагаешь пятерых оставить, а остальных
      куда?

      Или вот тов. Сон Хаус. Записывался - в 1930, 1941-1942, 1965-1970 гг. - куда его девать?

      Ещё раз повторю - я люблю блюз вообще. Если я буду слушать блюз и у меня мурашки побегут по спине - мне будет всё равно,
      в каком десятилетии он записывался. И кстати, какое десятилетие в данный момент будет на дворе, тоже.'
