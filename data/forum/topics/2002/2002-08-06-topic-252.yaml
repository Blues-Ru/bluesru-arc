    deleted: false
    text: "самый заводной и крутой рок-н-ролльщик. \nПресли же быстро перешел в разряд\
      \ поп-певцов: балладки и проч. И Chuck Berry по энергетике не не дотягивает\
      \ до уровня Little Richard.\nНу разве что еще Jerry Lee Lewis.\nКстати, время\
      \ рок-н-ролльщиков достаточно быстро прошло. Мало кто о них сейчас вспоминает.\
      \ Разве что когда пишут историю музыки или ностальгируют по далеким 50-м - время\
      \ расцвета и буйства рок-н-ролла.\nА блюзмены-то молодцы! И сегодня мэтры и\
      \ диски активно записыывают, и гастролируют много. Хотя некоторые и постарше\
      \ будут...\nLong live Blues!!"
