  text: '"69-летний музыкант заявил, что уходит со сцены. Сейчас он отправляется в
    последний гастрольный тур, в котором обещает показать все, на что способен. После
    этого он собирается удалиться на покой в свой родной штат Джорджия, и, по его
    словам, даже звонок президента не заставит его вернуться на сцену." (Звуки-Ру)

    Полная версия: http://www.zvuki.ru/R/P/7810/'
