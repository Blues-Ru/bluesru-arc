                subject: Про аудио - это правда, к счастью очень нечасто.
                deleted: false
                text: "Да и защита \"кроется\" в разных местах. Цытай высэ :)\nА драгэнддропом :) я пластинки не переписываю.\
                  \ Им надо пользоваться, чтобы сделать сборник, наверное? И при записи любого диска с данными(Data CD), конечно.\
                  \ Аудио-сборники мне составлять не приходилось, максимум, что я делаю - переписываю аудио-диск полностью\
                  \ в один заход. Здесь нет никаких проблем.\nВидео ещё не пробовала копировать.. \nА про сжатие mp3 файлов\
                  \ большего объема в меньший (именно mp3-> в mp3 - иногда такое очень нужно), объясните, пожалуйста, кто-нибудь\
                  \ поподробней. Лучше в почту, наверное. Или здесь, если Федор не возражает ;)\nА то все такие компьютерно-умные\
                  \ и знающие - измываются :) над девушкой - типа не умеет, а сами объяснить не могут :( \nПрограммы нашла\
                  \ только для преобразования из WAV в mp3 и наоборот. А для mp3 в меньший mp3 не могу найти - ни в интернете,\
                  \ ни в журналах.\nЛибо я просто не могу отыскать эту функцию и заставить её работать :( \nА мне надо! ;)\
                  \ Это не праздное любопытство. Заранее спасибо за помощь."
