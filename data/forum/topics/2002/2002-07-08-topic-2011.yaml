              subject: Что за защищенные диски?
              deleted: false
              text: 'Аудио таких не бывает. Я столкнулся с такой проблемой с родными VideoCD дисками. Максимум, что можно
                сделать, - это Save Disc As Image, но тогда его плеер не читает, а делать Export в QuickTime тоже не получается,
                - звука нет ;( Надо работать, короче.

                А аудио диски все защищены уже, но есть миллион прог для их копирования. Защита в том, что ты не можешь взять
                и "drag&drop" себе на диск, тебе нужно пользоваться экстракторами.'
