    text: "без слюней восторога, и без доставшего ехидства а-ля МК. \nИ упоминание \"некоторых участников\" было очень кстати\
      \ и очень, замечу, приятно. Радостно, что хотя Петрович, Ворон и Ломидзе, перекрыли кислород \"молодежи\", сами \"душители\"\
      \ относятся к молодежи с симпатией и находят повод упоминуть их фамилии в публикации. Не так ли?\nТипичный образец ехидства\
      \ - это рассказ о поисках на АМГ с дальнейшим анализом. Могу сказать, что АМГ, при всем уважении, не безгрешен. Так\
      \ вот, я держал эту пластинку в руках и своими глазами видел там на конверте имя Воронова. (оно, кстати, есть и на конверте\
      \ концертной записи Blues Bros 2k). Пластинки у меня нет, но не спешите ехидствовать - есть ксерокопия! могу предъявить,\
      \ но уж за базарчик придется ответить. \nкороче: давай помажем баков на 50, что имя Воронова есть на пластинке Кита\
      \ Ричардса Talk Is Cheap. Слабо?\nА за адресок статьи - спасибо."
