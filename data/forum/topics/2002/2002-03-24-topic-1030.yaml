  text: На http://www.drugoy.ru/april/voronov.html прочитал статью о Сергее Воронове,где меня особенно заинтересовали два
    момента.Первое,это участие Сергея в записи альбома Кита Ричардса Talk Is Cheap .Посмотрев кредиты по АМГ и не обнаружив
    среди десятков фамилий искомой,понял что на то есть какие-то веские причины,связанные с тогдашней политической обстановкой.Аналогичный,очевидно
    ,случай имел место с композитором В.Мигулей,песню которого по сообщениям советской прессы роллинги исполнили на одном
    из альбомов(до сих пор не знаю какую).Второй момент-это упоминание некоторых участников нашего форума в качестве положительных
    примеров,с чем я их горячо поздравляю .
