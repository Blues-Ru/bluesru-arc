            subject: Извините, что я встреваю...
            deleted: false
            text: "Дим, а не кажется ли тебе странным вот что. Люди послушали тебя на концерте, им понравилось. Причем настолько, что они захотели написать об этом и рассказать всем. Но что они пишут! \n\"Мне всё понравилось 100%! Просто я знаю, что эти музыканты могут большее.\"\n\"Вашу бы музыкальную деятельность, да в другое бы русло.. и с большим выбором(набором) музыкантов и инструментов.\"\nЭто что? Пережиток Страны Советов?\nВам бы гармошечника, дудок, перкуссионистов, рояль с Доктором Джоном, своих песен побольше, Нопфлера поменьше... (хотя Нопфлера итак не было:)\nИ вот я уже начинаю сомневаться, что зрителю понравилось на \"100%\".\nГрете персонально. Я всегда с интересом читаю Ваши постинги и часто Ваша позиция совпадала с моей. Но в этот раз я Вас не узнаЮ. \nА потом... если все эти советы реализовать, то это будет уже другая группа, другая музыка. И концертные площадки тогда должны быть другие, и аппаратура соответственно... И возникает еще один больной вопрос. Кто за всё это будет платить? (за аппарат, за организацию, за реп базу и з/п всем музыкантам)\nКо мне тоже, не часто, но подходят после наших концертов \"благодарные\" зрители: Старик, всё клёво! Спасибо! Нам так понравилось! Мы раньше даже и не знали, что у нас тут в России такую музыку могут так играть! Но знаешь, вам бы побольше своих песен, да на русском языке... Да вообще бы репертуарчик несколько изменить... Пригласить хорошего клавишника... И певцу вашему двигаться нужно немного по-другому...  Ну и т.д. :-))\nИ еще. Грете. Какой смысл Вы вкладываете в понятия \"каверы\" и \"исполнение старых хитов рок-музыкантов\", противопоставляя их друг другу?\nВы случайно не Весы по гороскопу? ;-)"
            replies:
            - id: 5472
              parent_id: 5470
              date: 2002-06-18 15:25
              poster: Greta
              email: morehemp@mail.ru
              subject: Алексу :)
              deleted: false
              text: "\"Я всегда с интересом читаю Ваши постинги и часто Ваша позиция совпадала с моей. Но в этот раз я Вас не узнаЮ.\"\n\nНадеюсь, и в этот раз Вы меня поймете :) Я не призываю найти Доктора Джона с роялем - это было лишь развитие темы.. мечты, так сказать..\nМне действительно понравилось. Я не могу понять одного - почему человек не поет свои песни и прячет их? Часть песен я слышала - мне понравилось, а потому не вижу смысла скрывать их. Или должна быть тонна человек, доказывающая ему, что это нужно делать вслух, а не тайком для себя? Другой вопрос в том, если ему этого не надо - если его устраивает написание песен и \"складывание их в ящик\", как пишут стихи многие молодые поэты и не очень. Тогда конечно всё ok, всё замечательно - и я больше НИКОГДА не подниму этот вопрос. Но мне показалось, что он ищет слушателя, что ему всё же нужно, чтобы его слушали и слышали.. Именно ЕГО песни, а не идеальное исполнение чужих. Я ошиблась? Sorry.\nЯ не выступаю в роли тех самых \"благодарных зрителей\". Я ни в коем случае не хочу влиять на чей-то репертуар - это их личное дело. Но когда человек сам не очень доволен тем, что происходит, сложившейся ситуацией, то мне казалось, что ему нужна поддержка. Мне, во всяком случае, чья-то поддержка очень помогает в жизни.. Если я опять ошиблась - sorry, играйте, что играется.\nА насчет состава коллектива - так в музыкальном мире всегда что-то происходит - меняются составы, создаются новые коллективы и т.д.. Но это опять всего лишь развитие темы \"мечта\"..\n\nДалее - о \"каверах\" :) Тот же смысл, что и все. Я имела ввиду блюзовые каверы - кавер-версии блюзовых стандартов. Оригинально сыгранные, спетые, порой и с переделанным текстом они звучат просто превосходно. У Димы есть отличные варианты. В блюзе люди ТАК перепевают Роберта Джонсона, что многие потом считают эти версии просто лучшими.\n\nРок-стандарты тоже могут быть перепеты превосходно. Дима знает и любит массу музыки, но исполняет исключительно определенное количество вещей - достаточно незначительное для его кругозора. \nКак-то давно в форуме, помнится, кто-то спрашивал у Федора, что он за вещь играл на каком-то джеме.. Так я хочу сказать то, что найти незаезженную вещь и при этом офигительную, просто случайно забытый народом шедевр - можно! В рок-поп-музыке масса таких примеров.\nКобейн нашел в свое время такую песню. А вот группа Степ(или как там они называются?) выбрала легче путь - перепевает песни АББЫ(или кого-то там ещё) ну вы понимаете, о чем я..? \nМоя основная мысль - если искать яркие вещи, то не на ближних полках с музыкой, а на дальних и самых запыленных..\n\nНет, я не Весы по гороскопу. Забавно, раньше мне приписывали Рыб :) \nНа самом деле, я не менее упертая по гороскопу, чем многие из присутствующих здесь в форуме ;о)) Что поделать, дату рождения не выбирают ;)\n\nЯ просто хочу, чтобы человек раскрылся в музыкальном плане. Если ему это надо, конечно. А если не надо, то не вижу смысла ныть, что вокруг всё дерьмово..\nНа сим откланяюсь и больше эту тему не поднимаю."
