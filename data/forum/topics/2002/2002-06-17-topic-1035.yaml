        text: "Дима, любишь Марка Нопфлера и собираешь все его альбомы, знают, наверное, даже австралийские аборигены ;)\nБлин!!!!! :)) Я не об этом :) Люби его и слушай на здоровье, и собирай все его пластинки - это твоё личное дело, твоя жизнь, твои пристрастия. То же самое и с ПФ. \nЯ ничего не имею против ПФ и ДС. Они мне абсолютно понятны и нравятся. В разумных пределах. PF даже есть несколько пластинок. DS были в детстве. Беда в том, что у нас в стране их любят НЕ в разумных пределах! ИМХО - и имею на него полное право :)\nНО! Кем ты хочешь быть, признайся сам для себя?! Ты хочешь быть музыкантом, играющим музыку - свою или оригинально сыгранные каверы - без разницы в данном случае, или ты всю жизнь собрался прозябать за проигрыванием старых хитов рок-музыкантов, связывающих тебя с твоим детством или юношеством? Хороших музыкантов, но не нетленных.\nПрости за достаточно грубую форму, но пока мне учительница физики однажды не влепила пару за какую-то главную контрольную, я так и не понимала, чего она от меня хочет. И только после этого я физику знала идеально - без обид на неё кстати :)\n\nPS: и пожалуйста, не подбивай тока молодых музыкантов ступать на те же грабли и играть Марка ;о) У них ещё всё впереди.\n\nPPS: я ничего не сказала против Марка, как такового. Если не понял, плиз, перечитай ещё раз :)"
