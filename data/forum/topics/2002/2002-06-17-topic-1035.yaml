  deleted: false
  text: "Извините, напишу здесь, чтобы не видеть той ругани внизу вновь.. хотя тема старая.\nКонцерт в БиБиКинге в субботу очень понравился, как и нравились все предыдущие, что я видела до этого. Отличная качественная игра. Атмосфера в клубе была вполне располагающая, настроение, люди - всё замечательно! Согласна во многом с Сашей Мальчевским.\nЧто касается репертуара - то мне больше понравился репертуар Dr.Nick в Черчилле. Sky Stranger играют превосходно, но.. я люблю, конечно, и DS, и PF, и RS, и массу всего другого.. но если я не кричу и не свищу на концертах: Давай еще Нопфлера!, то я не делаю это по нескольким причинам: я не умею и не люблю свистеть :), я хочу слышать ЧТО-ТО ЕЩЁ кроме Нопфлера.. Я, конечно же, утрирую немного.. Но суть понятна, надеюсь..\nА в ответ, как всегда: это никому здесь не нужно, никому не нужна англоязычная музыка и т.д. - старая песня, и уже совсем не смешная.. Нас - тех, кому НУЖНА и своя музыка, и англоязычная, и блюз, и рок-н-ролл, и рокабилли, и свинг, и фанк, и т.д. - лишь бы качественно, здорово, с драйвом и от души сыгранная - в БиБи в субботу было как минимум пятеро! Остальные присутствующие в зале, я думаю, тоже не отказались бы. Я даже уверена в этом.\nCлушаю сейчас \"Sacred Island\" Taj Mahal & The Hula Blues Band. Отличная пластинка! Совершенно восхитительная(!)\"The Calypsonians\" - те, кто слышал, надеюсь поймут меня и согласятся.. Замечательная версия \"Mailbox Blues\"! \"Betty and Dupree\" превосходна! И, хотя эта пластинка в общем почти также далека от блюза, как PF - она не набила оскомину, её не крутят по радио, она не вые..а все мозги, как вышеозначенные группы PF, DS и иже с ними.. при всём хорошем отношении ко всяким Classic rock.\nЕсли не играть блюз, то можно ведь играть свои вещи, или, в конце концов, ещё что-нибудь не менее нетленное.. но менее заезженное..\n\nЖаль, что не пришел гармошечник.. Просто люблю я очень дудки, губную гармошку, перкуссии, стукалки всякие.. А зачастую и в одиночку сыгранное на гитаре звучит офигительно..\nВсем спасибо, концерт был славный!!! Хотелось бы только чуть-чуть немного больше искренности :)\n\nPS: для непонятливых объясню: цель сего поста не в том, чтобы кого-нибудь обидеть, а как раз в обратном. Мне всё понравилось 100%! Просто я знаю, что эти музыканты могут большее. \nПросьба воздержаться от наездов и разборок как в форуме, так и в почте."
