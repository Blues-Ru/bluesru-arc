  text: 'Всем доброго времени суток,


    Вот, начался мой последний год обучения на звукорежиссёра, а посему снова требуются
    добровольцы – теперь уже для дипломной работы. Итак, кто хочет поиметь демо-запись
    на халяву? Есть студия с профессиональной аппаратурой. В студии есть рояль, но
    нет барабанов, которые придётся везти, причём, коль скоро ударные обычно доставляют
    больше всего хлопот, сразу скажу, что не возьмусь за что попало (уж сколько раз
    привозили такие кастрюли и картонные коробки, что просто руки опускались) – либо
    привозите человеческие барабаны и железо, либо тогда уж лучше совсем без них.


    Да, ну и, разумеется, коллектив должен быть профессиональным, и музицировать «на
    ура»...


    Пишите мне на nickrussel@mail.ru



    С уважением,


    Nick'
