  deleted: false
  text: "Часть первая. \"Слава героям которые не смотря ни на что...\"\nДжем в ББКинге не заладился с самого начала - у Жени Санчило развалился контрбас (и такое бывает). Тем не менее Женя мужественно отыграл басовые партии на шестиструнной гитаре. Далее, полетел пульт и со звуком происходили невероятные иллюзии (в смысле того,что он местами был весьма иллюзорен). Но тем не менее Рома Гегарт не менее мужественно вытягивал действие и под завершение практически вытянул его при своевременной поддержке Сережи Воронова , Гии Дзагнидзе, Вадима Иващенко и г-на Мишуриса. Но поверьте играть и петь в таких условиях это действительно геройство. Но как сказал классик -\"Геройство одних ,это довольно часто ,преступление других\" Думаю,что другие это люди отвечающие за пульт (но не за контрбас;))\nЧасть вторая. \"Если поперло - то поперло...\" \nДжем в EXPAT - е. Док Аграновский человек в некоторм отношении не уживчивый и занудный. Ну такой он - пока звук не выставит ,играть не начнет. Это многих раздражает и по этому саунд-чеки у Дока начинаются за час до представления. Лучше всех это знает Саша Братецкий, который еще накануне,отведя меня в сторону с таинственным видом сказал,что в ЭКСПАТ надо прийти за час и выставить звук. При этом ,он держал меня под руку и заглядывая в глаз (левый)выяснял мое отношение к саунд-чеку. Он говорил мне ,как это важно и спрашивал - как я отношусь к этому. Я естественно ответил ему,что ничего важнее в моей жизни (ни мое собственное рождение,две женитьбы,рождение моих детей,смерть близких,Октябрьская революция и т.д. и т.п.)чем саунд-чек не было и я буду вовремя.Ну не мог я иначе отреагировать....  \nЯ и был вовремя (за полтора часа) , а борец за саунд-чеки Братецкий пришел за 20 минут до начала.Вот и верь харперу. К чему я это... А, да ... Короче джем был очень хорош по звуку и по джемующим. Порадовали и сам Док с со-товарищи ,и Володя Кораблин с гигантом саунд чеков Братецким,и Сергей Виноградов успешно взаимодействовавший (ничего себе словечко) с Валерой Гилютой, и Бандерас и Алексей Плющ который завершил все мероприятие. Короче,все были на разогреве у Alex IV-го !!!\nНадеюсь,что завтра в зоопарке (сегодня мы с Доком чуть по инфаркту не заработали из за этого)все будет нормально и все получат немного блюза и много пива (или наоборот - кому, что нравится...)"
