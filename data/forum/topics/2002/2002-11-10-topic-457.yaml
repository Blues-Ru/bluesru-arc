  text: "Приглащенные музыканты: Бандерас, Бородин и Капшин (Сколдеры), Владимиров-мл., Каверкин, Татьяна Михеева, Коля Садиков. Под вопросом Гия и Тамара Кожекина. Если кто-то здесь не упомянут, а договоренность с ним (ней) была, то она остается в силе.\n   В прошлый раз не удалось наиграться или вообще сыграть ударникам. Чтобы все шло по-человечески, сделайте две вещи: приносите свое железо и извещайте о намерении участвовать (это можно сделать через любого члена Де Блюзспиннерс или любых знакомых, имеющих е-мыло). \n   Если есть предложения, пишите. Я приглашаю тех, с кем хорошо знаком. Те, с кем только предстоит познакомиться и подружиться, безусловно интересны и их заявки на следующий джем приветствуются."
