            text: "Пора уж всем понять ЧТО ТАКОЕ блюз.Это определенная ГАРМОНИЧЕСКАЯ СТРУКТУРА,базирующая на Т,D и S.Темп и ритм не имеют значения.У нас,да и на западе часто, любую лажу причисляют к блюзу.6,16 и 12-тактовые блюзы. Сейчас ( с 70 годов) - чаще 12 тактовые.Причем есть два варианта гармонической структуры.Вот один из них -\n C /  F7 / C  /C7  /  F7 / F7  / C  / A7  /  D 7 ? G 7 ? C / C /\nЭто в тональности С-dur ( до мажор).\nИтак, блюз - это определенная последовательность АККОРДОВ.Если этого нет- то это НЕ БЛЮЗ, а что-то иное.\nВ этом форуме одни дилетанты, как и везде в жизни. Поэтому все нищие.Это от уБОГОСТИ ( скудости ) ума. \nВСЕ БЕДЫ -  ОТ БЕДНОСТИ !!!!!"
