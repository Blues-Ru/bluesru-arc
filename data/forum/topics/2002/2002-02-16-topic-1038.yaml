              text: 'Баптистская церковь пыталась провести своего рода реформу богослужения, уйти от старых спиричуэлсов к более прогрессивной и доступной, как они считали, музыке, созданной профессиональными [джазовыми] композиторами, заменить прихожан, руководивших хорами, на музыкально образованных дирижеров. Многие старые спиричуэлсы появились в нотных сборниках госпел хорошо по-джазовому аранжированными, но все же в общепринятых европейских традициях. Это уже слабо было похоже на ту спонтанную многоголосную импровизацию spirituals and shouts, которая царила на богослужениях раньше.


