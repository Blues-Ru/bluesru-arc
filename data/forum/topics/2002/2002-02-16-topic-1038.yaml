                subject: и спиричуэлс и госпел
                deleted: false
                text: "пришли из ХIX века.\nЛомакс пишет о попытках перейти к пению по официальным нотным сборникам. Странно, что из слов Ломакса можно понять, что он впервые слышит термин \"госпел\" и считает его новинкой. Кроме того, на соседней странице он пишет о Махалии Джексон и \"Блайнд Бойз оф Алабама\" в самых восторженных выражениях, называя их выдающемися представителями госпел. Понятно, что ни та, ни другие не слишком полагались на ноты и готовые аранжировки в своем творчестве. Кстати, Махалия Джексон практически сводит на нет различия госпел и спиричуэлсов - в ее записях их едва ли возможно разграничить. \nА спиричуэлс, слава-те-оспади, пережил тот кризис и благополучно существует бок о бок с госпелом. Нынешние хоры включают в свой репертуар и то, и то - только н апользу разнообразию звучания."
