        text: 'Ник, а как ты думаешь, что является отправной точкой в блюзе (то-есть в фанатстве)? Большая часть людей начала с рок-н-ролла, а потом, "созрев", перешли к блюзу. Многие, слушая блюз лет эдак сорок, переходит на black gospel... из которого блюз и вырос! Блюз - это часть "чёрной религии" - религии, когда рабы в рабовладельческой Америке сказали христианству "нет", ибо не согласились с тезисом о том, что главное в жизни - смирение, а потом ты СДОХНЕШЬ И ВСЁ БУДЕТ КРУТО! Они хотели жить хорошо, как ы все мы - люди...

          Про Дверей - извини-ошибся-только-не-бейте-плиз. На вудстоке был соул (гибрид блюза и ритм-энд-блюза, как сказал Уилсон Пикетт), РНБ и приблюзованный рок (как у Джими - там аккордов, там драмфилл блюзовый, там вдруг вообще блюз типа Hear My Train A Comin''.'
