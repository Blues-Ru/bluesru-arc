          subject: скорее, спиричуэлс
          deleted: false
          text: это то из чего вырос блюз, если так можно выразится. Ломакс, например, рассказывает, что госпел насаждался в начале ХХ века в качестве официального песнопения чуть ли не силой, что-то вроде реформы у них случилось. И рядовые миссиссипские крестьяне-прихожане долго не врубались, зачем это им петь по каким-то там нотам. И даже оставались после службы и отрывались импровизируя на много голосов в своих старых спиричуэлсах. И когда позднее появился соул, было уже ясно, что без импровизации по бумажке люди петь не желают. Но основа у этих песнопений, и у блюза, все же христианская, а всякая бесовщина - это всего лишь языческие пережитки. У нас ведь страна тоже христианская, а люди бывает и на картах гадают и через костер на Купалу голышом прыгают - совсем не по-христиански.
