  text: 'В четверг после концерта Гарбарека знакомые журналюги потащили меня в какой
    то клуб со словами "тебе надо обязательно туда, там будет играть какой то американский
    блюзмен". Я подумал - ни фига себе! Поехал. Приезжаю в клуб, который раньше звался
    BG Blues на пролетарке. При входе висит афиша, что то типа: Рок-н ролльный альянс
    и наш гость из Америки Алексей Блохин (Нью Йорк). Очень порадовала меня афиша.
    Но концерт был клевый и понравился больше чем гарбарек.

    Алексей Блохин (экс. гавайские острова, крейзи мен крейзи, рубиновые звезды, недавно
