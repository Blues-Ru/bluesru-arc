                  subject: это целая история
                  deleted: false
                  text: 'Фёдор, в таком деле необходим сурьёзный подход, а энтузиасты не всегда к нему склонны. Это, если
                    угодно, подкреплено личным примером.

                    Иногда люди предлагают свои услуги - перевести материал, написать статью, отсканить фоты и т.д. и т.п.
                    Это, конечно, очень ценно и весьма приветствуется. Но вот приходят результаты трудов, и всё становится
                    не столь радужно. Ибо переводы приходится проверять с карандашом в руках, авторские статьи - корректировать,
                    поскольку они отличаются корявостью языка, а отсканированные фотографии нуждаются в ретушировании, обрезывании,
                    конвертировании в более экономичные форматы, короче, всё нужно доводить до ума своими ручками. Что порой
                    отнимает больше времени и сил, чем собственно порождение нового контента.

                    Так что вопрос очень тонкий. Как не отпугнуть энтузиаста, готового потрудиться за идею, и в то же время
                    как его заставить потрудиться за неё с полной отдачей, выдал на выходе законченный продукт - как если
                    б он не за идею работал, а за деньги? Думаю, что AMG попросту платит своим авторам и сотрудникам наживу;
                    полагаю, что блюз.ру этого делать не сможет.

                    Отсюда и вердикт - либо ты взвалишь создание подобной энциклопедии на свои собственные плечи, либо, увы,
                    ничего у тебя не выйдет. А вариант первый чреват ещё и такими издержками, что база твоя будет страдать
                    безмерной однобокостью (посмотри хоть на мою, но я хитрее поступил - сразу заложил оную однобокость в
                    концепцию), ибо нельзя объять необъятное, и своё личное бесценное время ты, естественно, отдашь тому,
                    что ближе тебе лично, а не тому, что, по логике вещей, должно быть в этой базе отражено.

                    А такая база на блюз.ру уже имеется.'
