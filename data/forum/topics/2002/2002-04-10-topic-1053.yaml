    text: Да, является! Альбом 1996 года, в котором участвуют такие "белые кадры" как Bob Margolin (гитара), Duke Robillard
      (гитара), Calvin Jones (басс), Willie Smith (ударные), также присутствует духовая секция в лице саксофониста и гармошечника
      Mark'a "Kaz" Kazanoff'a и саксофониста Gordon'a Beadle. Альбом посвящен памяти Joe Lopes, как написано в буклете...
      Ну очень неплохой для старика Перкинса альбом!
