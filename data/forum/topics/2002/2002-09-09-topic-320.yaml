  text: "http://www.inout.ru/pv.phtml?id=200183\n\nИван Жук (гитара) и Вовка Кожекин\
    \ (вокал, губная гармоника) – люди в своей среде весьма известные и уважаемые.\
    \ Причем своя среда для них – и \"новые хиппи\", и блюзовые папы. Первые ценят\
    \ за собственное творчество \"Станции \"Мир\", где причудливо переплетаются хипповые\
    \ реалии, психоделические миры и едкие (нередко – нецензурные) комментарии о современной\
    \ жизни. Вторые – умение великолепно играть на вверенных инструментах, чувство\
    \ стиля и безотказное музыкальное чувство юмора, позволяющее музыкантам периодически\
    \ сруливать из собственных вещей в классику мирового ритм-н-блюза, да так, что\
    \ никто перехода-то не замечает. Есть мнение, что подобное ощущение музыки досталось\
    \ \"Станции\" от дяди Федора Чистякова, с которым активно работал Вовка Кожекин.\
    \ \nА драйв – по-видимому, от Джимми Хендрикса, который, если вы не в курсе, очень\
    \ хорошо звучит при переложении на губную гармонику.\n\n** Последняя фраза меня\
    \ особенно потрясла..Хендрикса на гармошке..чё-то я не понимаю ничё ваще..."
