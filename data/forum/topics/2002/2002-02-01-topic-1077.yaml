  text: "Alan Price ушел, конечно же, после второго альбома 'Animal Tracks'. \nТо есть тот неповторимый звук есть только на двух альбомах и синглах: Baby Let Me Take You Home/Gonna Send You Back To Walker, House Of The Rising Sun/Talking About You, I'm Crying/Take It Easy, Boom Boom/Blue Feeling, Don't Let Me Be Misunderstood/Club A-Go-Go, Bring It On Home To Me/For Miss Caulker, We've Gotta Get Out Of This Place/I can't Believe It, It's My Life/I'm Gonna Change The World. \nГениальное наследие за два года работы! Абсолютно блюзово-ритм-н-блюзовые альбомы и ох какая отличная попса на синглах! Есть ли сборник, где содержатся все эти ранние вещи? Их всего 16 должно быть, ну и два альбома, конечно; но они у меня есть."
