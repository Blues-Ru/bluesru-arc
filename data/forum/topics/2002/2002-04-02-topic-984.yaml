      text: 'По порядку: Ковбой - потому что зовут так (а зовут потому что в шляпе:) Пастухом бы - с удовольствием, лучше
        - ганфайтером. Во-вторых-не почесунчики, а "Цап-царапычи" (Почти весь коллектив - большие любители Симпсонов, там
        есть такой мультсериал (в самих Симпсонах)- "ITCHY-SCRATCHY", ЧТО переводчики представили как "Щекотки-царапки":),
        ну мы и решили подурачиться. На самом деле, как в пословице - хоть горшком назови.... И, наконец - Иствуд, потому
        что очень он мне нравится (по-крайней мере его герои), а ник "ковбой", и еще куча ему подобных (пробовал много), уже
        есть оказывается в чате на блюз.ру. Так что пришлось присобачить цифры, фантазия на тот момент иссякла;))) Вообще,
        вот посмотрел тут недавно фильму (вестерн, естессно), с вышеупомянутым Иствудом "Джози Уэйлс, человек вне закона",
        захотел опять ник сменить, а этих Джози Уэйлзов, а тем более, "Outlaws", везде - как собак нерезаных. Много нас, психов%)))))'
