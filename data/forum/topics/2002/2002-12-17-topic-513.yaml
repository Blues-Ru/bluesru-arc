    deleted: false
    text: "Мне они тоже нравились. Фишка там клевая - звучание кларнета и губной гармоники.\
      \ А когда Тамарка с ними стала петь, совсем стало все хорошо. Как поет Миша\
      \ Владимиров я перевариваю трудно, уж очень напоминает \"Фабрику звезд\" что\
      \ идет сейчас по ТиВи, я у меня уши не принимают подобных \"гармоний\".\nСтудийника\
      \ у них нет. \"Sing-Sing-Sing\" - это демка для клубов, которую мы записали\
      \ за два дня в Московском офисе у Леши Приймы (в субботу и воскресенье, когда\
      \ у всех офисных выходной. Потом насколько я понимаю планировалась запись, но\
      \ что-то не сложилось. \nСейчас Шитов играет у Мишуриса. Миша Владимиров - страшно\
      \ произнести до каких высот докатился. Тамарка - раз в год поет по одной песне.\
      \ Гочуа (на контрабасе) - видел его по телеку в группе Паперного. Если честно\
      \ - мне очень жалко именно этого проекта."
