  deleted: false
  text: 'Скачал с этого сайта несколько мп3 ранее к сожалению мне неизвестной (простите
    мне мою необразованность) группы Green Square. Очень уж мне понравилось. А есть
    ли студийные диски этого замечательного коллектива? И можно ли их где-нибудь в
    Москве найти?

    Кстати, если я не ошибаюсь, в этих мп3 голос Тамары Кожекиной?'
  replies:
  - id: 9421
    parent_id: 9403
    date: 2002-12-18 01:06
    poster: Andrei V. Evdokimov (evdokimov)
    email: evdokimov@blues.ru
    subject: мера студийности
    deleted: false
    text: "единственный альбом их студиен. он же - демонстрационен. официальный тираж\
      \ то ли тысяча, то ли половина ее. Боюсь, в магазинах их не сыскать. но где-то\
      \ могут и встретиться. \nТамарка с ними действительно пела. Я являюсь обладателем\
      \ (весьма счастливым, в данном случае) записью их концертного выступление в\
      \ каком-то КСПшном клубе, вроде бы \"Гнездо глухаря\". Публики было человек\
      \ 12, из них 5 халявщиков привел я. Но это цветочки, потому что Владимиров вообще\
      \ этот концерт не удостоил посещением (ну, еще по одной!). В результате подменял\
      \ его Кожекин. перед каждой песней, разумеется, мучительные выяснения тональности.\
      \ но вот \"атмосфера\"... что-то в этом есть - слушаю с большим удовольствием."
