        text: "Европейскую халтуру получалось играть не только у Бастера. Черные вообще часто находили прибежище в Европе, когда в Штатах не было блюзовой работы. Выступали в клубах. Альбомы часто записывались по просьбе кладельцев кабаков, где они выступали (так и было в этом случае с Бентоном). С соответствующим (маленьким) бюджетом. Иногда получалось восхитительно. Иногда никак. Таких альбомов не слишком много, но они есть - как достаточно типическое явление. Не плохое, но на скорую руку качество работы звукорежиссера отличает их всех. По качеству музыки: есть безобразная халтура, вроде Louisiana Red at studio 55 (или что-то в этом роде). Есть почти шедевры, вроде акустического дуэта Гай и Вэллса \"A&A\" (поминавшегося здесь в принятой у нас манере зубоскальства со смертоубийством). На мой имхо, альбом Бастера \"Blues at the Top\" - хорош. Слово \"халтура\" в старые добрые времена означало быструю безответственную работу. Как получится - так и ладно. в этом смысле я и использовал это слово...\nя нашел свою старинную рецензию на этот альбом: /bluesnews/BluesTop.txt \nPS. Диксон умер десять лет назад. Что значит - \"с последней пластинки Chuck E.Weiss'a\"?"
