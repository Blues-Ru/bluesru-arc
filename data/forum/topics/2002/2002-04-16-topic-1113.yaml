        text: 'Вы имеете ввиду пластинку "Blues at the Top"? На AMG я нашла только эту..

          И разъясните, пожалуйста, неопытному человеку :) как у Бастера получилось играть европейскую халтуру..? (это серьезный вопрос). Потому, что это европейский альбом? Или год выпуска сказывается..?

          Чернокожий блюзмен, родившийся в Арканзасе(?) и игравший с Willie Dixon''om (bass) на пластинке "Spider in My Stew"(очень душевно сыгранная песенка!). А как же Modern Electric Chicago Blues..? Или за время муз.карьеры блюзменов стиль игры может очень сильно меняться? Ответьте, пожалуйста, если можно без стеба :)

          PS to all: кстати, Buster Benton поучаствовал (guitar) в записи той самой песни "Down the Road a Piece" с последней пластинки Chuck E.Weiss''a, где vocals & bass принадлежат Willie Dixon''у. Мир тесен :)'
