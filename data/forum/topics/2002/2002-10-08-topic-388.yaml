        text: "Администрация блюз-ру ведет планомерную и неторопливую работу. Вся информация о гастролях зарубежных исполнителей предоставляется посетителям сайта именно в тот момент, когда <i>слухи, планы, варианты</i> переходят из этого своего первичного состояния на следующую ступень эволюции - а именно, становятся собственно ею, <i>информацией</i>. Дело в том, что не все <i>слухи, планы и варианты</i> преодолевают эту ступень, чаще случаются тупиковые ветви. Да и собственно опубликованная информация еще должна постараться, чтобы стать <i>окончательной</i> информацией. \nНа настоящий момент, Пол Лэмб не собирается выступать в БиБиКинге (и пока даже не собирался). А информация на сайте - результат удивительной деятельности одного иностранного, но все равно удивительного менаджера (признаться, если он менаджер, то я промоутер, как минимум). \nпока что есть <i>предварительные планы</i> на выступления Пола Лэмба в клубе NEO и в неизвестном мне клубе, расположенном на Садовом кольце (нет, это не намек на БиБиКинг). <i>Вариант</i> c выступлением в Форте тоже все еще возможен (хотя там концерт уже ставился и отменялся, благодаря удивительному иностранному менаджеру)."
