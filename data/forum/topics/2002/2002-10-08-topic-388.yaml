  text: '... для тех, кто ходит на прямо на форум мимо стартовой страницы.

    Paul Lamb будет в Москве в МХАТе 23, 24 октября, может будет еще и клубный концерт.

    Со своей стороны добавлю, что это безумно крууууууууууууууууууууууууууууууууууууто. У них есть куча замечательнейших пластинок, но концерты почему-то бывают еще лучше. Это подтвердят те, кто слышал их в 2000 году. Это событие нельзя пропускать, для многих из нас это интересней Эфесовского фестиваля этого года, который тоже нельзя пропускать.

    Для справки - Пол Лэмб и Кинг Снейкс - ведущая британская блюзовая группа на данный момент, они несколько последних лет подряд получали награду с похожим примерным названием "Лучшая британская блюзовая группа". А достоинства этой ГРУППЫ не исчерпываются одним только умением самого Лэм(б)а играть на гармонике.'
