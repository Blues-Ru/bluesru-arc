  text: "Под таким девизом мы раньше проводили с Борей Булкиным и его ребятами двойные концерты в Доме аспиранта и студента (ДАС) МГУ. А вот в ближайшее воскресение (21 апреля, 19:00) собираемся выступить в ДАСе одни, вернее, несколькими родственными составами: \n     А. The Blues Spinners (Аграновский - Братецкий - Немов).\n     Б. Те же плюс ритм-секция Кузнецов-Половинкин (со Второго этажа).\n     В. Те же плюс Гелюта (у Валеры отдельная программа - буги, рок-н-ролл, блюз).\n     С. В конце - джем. Только не открытый, а с приглашенными (заранее и в небольшом количестве) музыкантами. Дело планируется так: А+Б, первое отделение; В, второе, С, третье. Всего часа три с половиной. Сверхзадача этого театра (по Станиславскому) - показать материал, который не успеваем сыграть на второэтажных джемах.\n\n     Очередной открытый джем будет на Втором этаже в четверг 18 апреля. К сожалению, статуэтка рогатого Оскара, служившая мистическим символом джема, была похищена из стола Тимофея Сахно. Но настроение у нас все равно хорошее, и испортить его непросто.\n\n     Слышатся ламентации, что на Этаже дорого войти. Что ж, справедливо. Отдать вот так вот 100 рублей России за прослушивание музыки; ишь ты. Но одной правды на свете не бывает. Один взыскует дружбы, а другой - питания. В ДАСе вход будет 30 рублей, а пиво и прочее все свободно несут в зал из магазина (дистанция - 85 м). Выбирайте, и до скорой встречи."
