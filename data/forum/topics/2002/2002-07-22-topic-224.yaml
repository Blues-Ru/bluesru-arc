  text: "pomnitsya tut kto galovalsya chto Buddy Guy napugal ego detey ;)\nnado bolshe udelyat ih vospitaniyu ;)\n\nvchera ego slushal - eto bilo prosto neveroyatno zdorovo. on bil v otlichnom nastroyenie - sigral vse luchshie veschi - igral na akustike, igral hendrixa, claptona, john lee hookera... neveroyatniy drayv i energiya - komanda prosto super _ osobenno pianist/organist.\n\nvihodil v zal  - igral v metre ot menya ;) \nigral dve veschi so sweet tea  - razumeyetsya prosto zdorovo - kak i voobsche vsegda vse zvuchit na poryadok luchshe albomnih zapisey...\nvse kak vsegda bilo originalno - znayu potomichto slushal mnogo zapisey live poslednih let...\n\nvoobschem neveroyatno silno. escho na feste ochen ponravilis duke robillard i marcia ball - ochen zdorovo. escho bili interesniye personagi - no eto kak nit potom...\n\n\nvoobschem vsem privet."
