  text: 'был отмечен подавляющим большинством пьяных музыкантов, что однако не помешало
    сыграть хоршо, не смотря на неизвестно откуда взявшихся металлистов певших асдс
    на русском, борьбу гитаристов за комбик и проделки звукорежисера упрямо убиравшего
    гитару Гилюты.

    Народу было много .Стульев не хватало. Но все прошло на уровне.

    Как бы то ни было , спасибо А.Аграновскому за джем , Саше Мао за голос (ведь как
    поет сукин сын!) и г-ну Гилюте за школу игры на гитаре.'
