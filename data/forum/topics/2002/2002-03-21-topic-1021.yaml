  deleted: false
  text: 'Друзья!

    Открывается новое кафе где-то на Малой Бронной недалеко от "Форте". Завтра у них первая проба живой музыки. Играть будет
    Dr. Nick. Вход будет бесплатный. Водку обещают всего по 15 рублей и недорогое пиво. В последствии это место будет еще
    одной музыкальной точкой Москвы для блюз/кантри/фолк музыки.

    Приходите поддержать кафе и умирающий коллектив!

    Концерт из трех отделений с 22:00 до 01:00.

    Точный адрес сообщю сегодня же, но чуть позже.

    Ждем Вас!'
