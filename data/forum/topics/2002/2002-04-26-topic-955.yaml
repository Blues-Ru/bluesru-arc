    subject: Notodden Blues Festival - концерты
    deleted: false
    text: Каждый исполнитель выступает 2-3 раза. Многие вечерние концерты сдвоенные - т.е. за 4.5 часа выступают два исполнителя.
      Концерт идут 4 дня, вечером одновременно несколько концертов, так что приходится составлять собственную программу -
      когда на кого идти, а кого и вообще - пропустить. Если в один вечер сходить на Бадди Гая, второй - на Dr.John с кем-нибудь,
      третий - на Tony Joe White с кем-нибудь, то 100% вечеров будут заняты. В 19:00, а также днем можно ходить на остальных
      артистов... Нам удавалось послушать за фестиваль 10-15 разных исполнителей.
