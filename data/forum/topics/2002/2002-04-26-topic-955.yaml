    subject: Notodden Blues Festival - деньги
    deleted: false
    text: "Финансовые обстоятельства примерно такие.\nБилеты на самолет: 400-450$\nБилеты на концерты 25-35$ (они, как правило,\
      \ сдвоенные). Т.е. можно потратить, к примеру, 300$ на билеты. К журналистам это не относится.\nЖилье - либо в палатке\
      \ (немного заплатить тоже придется...). Либо в соседнем городке в хостеле, к примеру (30-35$ в сутки - 150-200$, к примеру).\
      \ На автобусы немного придется потратиться тоже - 40$ до Осло и обратно. Плюс, возможно, придется ездить в хостел (15$\
      \ в день). \nНу и, пропитание и пиво, как получится. Итого - штука с лишним по-максимуму. \nКроме того, потребуется\
      \ выносливость и желание."
