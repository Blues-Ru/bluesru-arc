        date: 2002-04-26 17:33
        poster: Федор Романенко (fedor)
        email: fedor@blues.ru
        subject: Журналисты и выносливость
        deleted: false
        text: 'Им нужна не формальная бумажка или корочка, а объяснение, где и чего ты собираешься писать и пр. о фестивале.
          Тогда они примут решение об аккредитации. Журналистам там удобнее, ибо можно на месте решить, на какой концерт идти,
          а не заранее покупать билеты. Ну или, к примеру, пойти на один концерт, а если не понравится, отправиться оттуда
          на другой.

          В палатке - как в лесу. За 4 дня успевает надоесть. К тому же, там дожди бывают. Ну и хочется пойти куда-нибудь
          отмыться хорошенько... А так - ничего.

          Выносливость нужна затем, чтобы весь день ходить по городу вверх-вниз, а отдохнуть особенно негде. Потом, если пива
          выпить, а за день его можно выпить много, то утомляешься сильнее.'
