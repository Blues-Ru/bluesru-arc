  text: "Занимаясь поиском хорошего блюза в Интернете, набрел на презамечательную команду \"Knife in the Water\". \nЧем эти ребята замечательны?\nТем что они\nа) молоды\nб) замечательно играют\nВ) Сочиняют свои песни :)\nг) Они ни на кого не похожи и слушаются так что уши вянут, а руки тянутся к гитаре, дабы подбирать столь интересные произведения.\n\nТак что рекомендую.\n\nИ еще если кто ищет песни и не может найти, есть такой сайт: audiogalaxy.com там есть все: редкое и популярное, и то чего вообще нигде нет. Мне перепала запись с концерта Missisipi Jhon Hurt песня  Candy man  и еще много чего такого плана...."
