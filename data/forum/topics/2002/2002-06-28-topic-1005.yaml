                Каждая спела по одному блюзу. Ну это что-то, я тебе скажу. С Тиной
                все ясно, там есть Айк, который великолепно солирует на гитаре и все
                сам планирует, но вот чтобы Флэк так играла на рояле и пела по блюзу,
