      text: "что касается азов джамп-блюза, то в весьма уважаемой серии Rhino - Blues\
        \ Masters есть два альбома посвященные этому стилю, которые так и называются\
        \ Jump Blues и More Jump Blues. Альбомы можно найти и на cdnow, и на allmusic.com\
        \ - и посмотреть хотя бы список исполнителей. \nджамп требует настолько органичного\
        \ чувства ритма, настолько естественного умения свинговать, что вряд ли гитаристам\
        \ из прилагаемого форума стоит беспокоится, а не играют ли они джамп-блюз.\
        \ нет, не играют, и в массе даже не знают, что это такое (из москвичей разве\
        \ что Рома Гегарт был близко, но ушел с этой стези). Это бы не беда, но они\
        \ и не стремятся узнать! вообще, глубина знания истории блюза московскими\
        \ гитаристами редко достигает времен до первого альбома СРВ, и практически\
        \ никогда - 50-х годов, когда джамп-блюз достиг расцвета и угас. (кстати,\
        \ Этта Джеймс, которую, как выясняется в прилагаемом форуме, не стоит считать\
        \ блюзовой певицей, прекрасно чувствует, что такое джамп-блюз. Она вообще\
        \ великий полистилист, огромный голосина и дар от неба) Кроме того, это радостная\
        \ танцевальная музыка, открытая к увесилению слушателя, а московские гитаристы\
        \ предпочитают держаться позиции \"народ - быдло, что он понимает, не станем\
        \ мы его развлекать\". \n(тут бы написать, что я даю обобщающую картину моего\
        \ видения событий... но Юра и так меня поймет, а остальные, дюже запальчивые,\
        \ просто не обратят на эту фразу внимания. так что, вперед ребята, выпускайте\
        \ пар!)"
