    text: "Федор, пластинку, всё же, стоит послушать :) Она включает в себя самые известные вещи из фильмов. Это ни в коем\
      \ случае не гранж. \nПублика шла не только на одну вещь, транслирующуюся по ТВ, их было как минимум четыре, что, в общем,\
      \ тоже не много. Это в первую очередь блюзроковая Strange Face из \"Desperado\", публикой принятая очень горячо. Затем\
      \ общеизвестные After Dark из \"От заката до рассвета\", Angry Cockroaches оттуда же, кажется. \"Back To The House\"\
      \ из \"Desperado\" просто отличная. \nЭнто не гранж ни по какому :)\nА клэшовской \"Should I Stay Or Should I Go\" они\
      \ завершили концерт.\nЗвук был никакой, да простят меня те, кому он понравился. Ибо я не считаю, что когда раздается\
      \ свист и перегрузы с завидной регулярностью - это хорошо отстроенный звук. Да и сами музыканты регулярно на это намекали.\
      \ Если учесть, что это первый блин - то всё в порядке.\nА о клубе НЭО - уже приятен тот факт, что блюз движется от центра\
      \ к окраине. Надеюсь, все согласятся, что это что-то неожиданное и непостижимое, что на Варшавке открылось такое заведение.\
      \ Само по себе наличие Tito & Tarantula на Варшавке - уже сюрное явление, невозможное дажу пару лет назад. Это здорово.\
      \ Главное, чтобы клуб не скурвился.\nНа первом этаже я не была. Надо будет проверить в ближайшем будущем."
