  deleted: false
  text: 'Я тоже ходил на этот концерт, хотя я и не ожидал услышать чего-нибудь особенно интересное в музыкальном плане, скорее
    я ходил посмотреть на фирмачей (хотя, курица - не птица, а мексика - не заграница) и на новый клуб. Мне было заранее более-менее
    ясно, что интерес к группе носит чисто коньюнктурный характер, и что на муз.олимп они попали из гаража совершенно случайно.
    И также заранее было понятно, что туда придут "папики" в большом количестве послушать модную группу из модного фильма.
    Я, конечно, не слышал их альбома 97 года, но что-то мне подсказывало, что кроме их доступно-увлекательного хита (именно
    на который все пришли) про закат и рассвет, возможно, ничего выделяющегося они не сочинили. Примерно так и оказалось,
    рок-группа средне-мтв-ишного уровня с легким уклоном в гранж и все такое. Наиболее зажигательной для публики песней была
    песня "Should I Stay Or Should I Go" другой мтв-группы Clash. Одним словом, все нормально, ничего сильно не понравившегося
    там не было, но ничего интересного - тоже. К их чести стоит сказать, что хоть они играли относительно примитивно, звучание
    было почти мтв-качества, и свою публику они зажигали.

    Клуб НЭО, на который я ходил смотреть со своим интересом, мне понравился. Там есть зал на 500 человек на втором этаже,
    который может использоваться для дискотеки или больших концертов. А также что-то типа ресторана на 60 мест на первом со
    своей сценой. Наверху концерты у них будут редко, а внизу - каждый день блюзовые концерты, судя по расписанию. В большом
    зале вчера у них был вообще первый концерт. Звук мне вполне понравился. Несмотря на то, что было громко как на рок-концерте,
    все было слышно. Меня поразила гора аппаратуры за бешеные бабки, которая там стоит, и серьезность подхода к вопросу звука.
    Мне почему-то кажется, что на хорошем концерте другой стилистики звук там можно отстроить очень качественно, ибо все для
    этого есть. Цены на пиво и водку там чуть ниже нынешнего средне-клубного уровня. Кажется, можно купить какую-то разливную
    балтику за полтинник. Главная проблема у клуба, как я понимаю, на данный момент, это - маленький гардероб ;) Но она распространяется
    только на большие концерты на втором этаже. На первом этаже на клубном концерте я еще не был, но скоро схожу на разведку.
    Общее впечатление от клуба у меня осталось положительное, а особенно приятен тот факт, что начальство в клубе на данный
    момент хорошо расположено к блюзовой тусовке, что приведет к положительным последствиям для местного блюза.'
