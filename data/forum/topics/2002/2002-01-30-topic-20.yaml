  text: "Вот читал сейчас список блюзовых концертов. Группа \"Бласт\" и \"Мистер Твистер\". При всем моем уважении к Нэшу и Усманову, я не могу понять, что они делают в БиБиКинге - Доме Россейскаго Блюза??? Ну хоть кто-нибудь может мне объяснить, что в этом гребаном городе происходит? Здесь пишут про огромную армию подпольных блюзменов, а из восьми коцертов в месяц в Доме Блюза половина вообще не понятно что. \nТолько не надо говорить, что это коммерческий ход - ББК - это ресторан, а не концертный зал; бар должен деньги приносить."
