  text: "Итого, на 6 марта запланирован запуск деструктивной функции вируса Klez,\
    \ который протрет все файлы на вашем диске. Конечно, можно подождать того, кто\
    \ из нас вырубится, но лучше выяснить вопрос о том, кто заражен за сегодня, завтра,\
    \ чтобы не было обидно за потерянную информацию. Я, например, проверился несколько\
    \ раз, несмотря на то, что всегда строго и грамотно соблюдаю правила безопасности.\
    \ \nСкачать бесплатную утилиту на 60k для проверки можно по адресу\nftp://ftp.kaspersky.ru/utils/clrav.com\n\
    Информацию о вирусе можно получить по адресу\nhttp://www.compulenta.ru/news/2002/3/4/26309/"
