                          на внимание искушённого меломана. Пурпурка берет объёмом
                          ассортимента, Трансильвания диверсификацией. В Пурпурке
                          вы купите Зе Бест ов Лайтнин Хопкинс за 12 долларов, но
                          за тем же Слипи Джоном или даже Паттоном туда даже соваться
                          не стоит; зато Вы их без труда найдёте в  Трансильвании,
                          правда заплатите за них по 18. Кстати, и за того же Хопкинса
                          - столько же.

