        text: "Две недели тому назад сижу я в своей машине, слушаю Professor Longhair\n\"Mardi Gras in New Orleans\" и жду зеленую стрелку,что-бы ехать дальше.\nВнезапно раздается страшный грохот и мою машину (почти две тонны) отбрасывает вперед метра на полтора, прямо на стоящую впереди \"Волгу\". Хорошо,что челюсти у меня не вставные, точно бы выскочили!!! Вылезаю из машины и вижу ,что в зад моей машины с полной дури врезалась -естессснно \"ГАЗЕЛЬ\"!!! Подхожу к кабине,внутри чувачек сидит в испуганно-боевой стойке. Догодайтесь,что звучало в его долбанной \"Газели\" - естессснно -\"Убили негра\"!!! Я даже разозлиться как следует не смог - прошептал только:\"Замочили,суки...\"\nТак-что,сограждане, бешенство коров в Европе это полная фигня по сравнению с бешенством газелей в столице нашей Родины. \nДа и еще... зовут этого чувака Эдуард, а в мобильнике у меня он записан под именем Edward ,что тоже красиво....."
