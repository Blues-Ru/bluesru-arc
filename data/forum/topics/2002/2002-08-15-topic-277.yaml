  text: К разговору о взаимопомощи друг другу.Когда я попал под автобус в Турции и был весьма нетрудоспособен, мне,весьма чужому этой стране человеку, две блюзовые команды передали что-то около 500 у.е для возвращения на работу.Когда не хватает денег на хату,а напарник отдает тебе половину своего и обратно брать не хочет.Когда нет денег на дорогу домой, а твоя девушка,ничего не спрашивая(!),ладно,это другая тема.Вобщем,дружба есть,когда прежде всего ты отношисья к людям хорошо.И менталитет как раз тут совсем ни причем.
