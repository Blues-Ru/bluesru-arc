    text: "В 1993 году я передвигался автостопом в районе Центрального Французкого Массива. Как правило останавливались только недорогие машины и за рулем были простые люди. Поздним вечером я стоял на дороге в горах а до нужной мне точки - города Ле ПЮИ было еще километров 80 по горам - надо сказать в горах летом ночью не жарко - плюс полиция и т.п.\nКороче голосовал минут 65 и ни одна машина не остановилась - хотя был август и с юга сплошным потоком шли машины с отпускниками обратно в Париж и далее\nТак вот остановилась маленькая машинка Renault 5, за рулем сидел мужик лет 40 \nКороче поехали и он врубает что бы вы думали - John Mayall альбом Sence of place -  у меня на лице  дурацкая улыбка - я достаю из своего плейра кассету и показываю мужику- тот же альбом\nКороче он довез меня до дома и мы еще по дороге с ним пивка за его счет выпили ибо с деньгами у меня тогда было очень негусто.\nВот такая правдивая история\nкак говорят поляки\nБратерство блюза бендже трвать допоки бендже блюза грать ( переводите дорогие мои)"
