            text: "это была приятная работа: интересная, интенсивная и, по обещаниям,\
              \ высокооплачиваемая. остались неприятные воспоминания, поскольку оплатили-то\
              \ не все. То, что эти справки вывешены в интернет - нарушение нашего\
              \ с ними договора, поскольку справки предназначались только для энциклопедии,только\
              \ для CDrom. \nЗабавно то, что эти справки не закончены. Меня попросили\
              \ написать побольше и побыстрей, чтобы прикинуть макет. потом предполагалась\
              \ правка, да тут-то дружба и закончилась. МК предпочел не писать свою\
              \ энциклопедию, а тупо перевести какой-то музыкальный справочник. \n\
              Я не виноват, что так акккуратно написал справки, что их можно вывесить\
              \ в интернет и они производят впечатление законченной работы. Однако\
              \ там могут быть неточности. Некоторые из этих справок я доработал и\
              \ поместил на блюз-ру в раздел Who's Who. Надеюсь, доделать когда-то\
              \ и остальные... но для этого нужно иметь... много что нужно иметь:\
              \ деньги, свободное время, энтузиазм."
