        text: 'Как-то стало трудно. Винить тут, наверное, некого, кроме самого себя,
          возможностей моего организма, наличия свободного времени, энтузиястического
          порыва и прочая. Были такие времена, что лепил по пять страниц в день, а
          теперь не получается. Теперь надо вести довольно рутинную, кропотливую работу
          по поиску и отбору материалов, обновлению, поддержанию и прочая, и руки
          уже не доходят - после работы, которая остаётся работой, семьи, которая
          остаётся семьёй, друзей, которые остаются друзьями, есть также другие интересы
          (а почему бы нет?) и т.д. и т.п. При этом я вовсе не оставил надежд интенсифицировать
          работу над сайтом, и по-прежнему думаю, что вот-вот соберусь с силами и
          что-то такое забабахаю. Но время идёт, а воз пока что - нет.

          Был бы рад любой квалифицированной помощи, но энтузиасты как-то не шибко
          ломятся поработать в досужий час на совесть за бесплатную идею - при этом,
          разумеется, с гарантией качества на выходе. Переделывать чужие недоделки
          - занятие много более муторное, чем делать всё самому (пробовали). Дело
          должно делаться хорошо либо не делаться вовсе (достаточно и того, что я
          горький дилетант в области собственно веб-мастергинга, вот Фёдор в курсе).
          Вот, может поэтому оно в настоящий момент и стоит.

          Кстати, спасибо за вопрос. Давно уже назрела необходимость высказаться на
          эту тему, объяснить, так сказать, своё поведение - или его отсутствие. Вообще,
          единственная мотивация в описанных условиях - это уверенность, что то, что
          ты делаешь, кому-то нужно и интересно. Каждое проявление интереса к освещаемой
          теме очень сильно подпитывает, так сказать, творческий ресурс к продолжению
          работы. Однако, тема моя довольно маргинальная, "узок их круг, страшно далеки
          они от народа" и т.д., так что сами понимаете.

          Вот таким вот макаром. Возможно, я излишне ищу самооправданий, но тем не
          менее я постарался быть искренним в оценке невесёлой этой ситуации.


          P.S. Всё вышесказанное относится к разделу "Mean Black Cat Blues - Блюзовая
          архаика", за поддержание которого я несу самую непосредственную личную ответственность.'
