      \ времена. Миша Бирюков выписал ее на Амазоне. Пейпербак стоит недорого. \n\
      раз уж разговор зашел... справочники от Гинесса полны ошибок. Мьюзикхаунд -\
      \ субъективен. Справочник Харриса Blues Who's Who (который можно увидеть на\
      \ столе у мальчика из кино \"Кроссроадз) - слишком скуп и подражает  справочнику\
      \ британской аристократии, что в блюзе - нужно ли? Однако по фактам эта книга\
      \ безупречна. Самым полезным, обширным и оъективным мне показался All Music\
      \ Guide To The Blues. Стоит баксов 30 + пересылка. Считаю эту книгу необходимой\
      \ для каждого серьезного любителя блюза. \nКак ни странно, но автобиография\
      \ Уилли Диксона мне не показалась информативной. Забавно только, что он, побывав\
      \ в Польше, считал, что был в России. Но для понимая места блюзмена в американском\
      \ обществе необходимо знать, как Диксон в суде доказал, что не является американским\
