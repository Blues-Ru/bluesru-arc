                      \ (не ко мне) где-то в 0:30 с предложением забухАть. Прошла уйма времени, а человек живет всё тем же.\n\
                      Если речь идет о неохиппи - выбираешь клуб подороже и помажорней, заходишь внутрь - и сможешь увидеть\
