      text: 'Так вот, о пластинке. Она "несколько" отличается от того, что мы слышали в Летчике. Голос для 74 старца - просто
        "я вас умоляю". Голос такой же, но звучит как-бы чуть-чуть моложе. Мамочки нет, как я уже подметила.. Но бэнд присутствует
        полностью и играет очень слаженно. Два харпера. Гитара по-прежнему глухая - и это хорошо! Вообще, пластинка слышится
        более приглаженной по сравнению с концертом - нет этих похлопываний ладошкой, котелком по струнам не стучит, слова
        все помнит :) Уличность потерялась.. но появилось другое качество игры - нет той спонтанности. И концерт, и пластинка
        - всё хорошо по своему, но это немного разные вещи. Слушать в кайф по-любому! Все вещи исполнены здорово.

        PS: Что примечательно - она нарезана на CD-R :)'
