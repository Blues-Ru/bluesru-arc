      text: 'Деда Флойд был что надо. Главный кайф в том, что он никакой не титан, не живая легенда и не гений. Просто старый
        разгильдяй третьей гильдии, поющий все вплоть до "Хорошо, что может быть лучше!" И все равно блюз получается. Классный!

        Мы с Юрой пришли к 12, думали, хоть коду послушаем - а концерт еще не начинался. Грета, разве пусто было в летчицком
        зале? Вроде немало людей. Богемного такого вида, в стиле этого клуба. Танцевали. И на сцене было плотно - по словам
        Кожекина, группа Маркшейдер Кунст - из которых хорошо ловил дедушку только сам Вова. Кстати, он забавно рассказывал,
        как познакомился с Флойдом - искал какой-то велосипед приятеля на Болотной площади и так далее...

        Дай Бог ему здоровья, Флойду Ли.'
