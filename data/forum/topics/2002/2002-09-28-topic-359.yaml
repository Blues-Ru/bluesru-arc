        subject: Ууу.. Ларрива :)
        deleted: false
        text: "Раздолбаи из LA Тито энд Тарантула, поменявшие свой состав в энный раз - это шоу не для человека с температурой\
          \ :))\nФром даск тилл даун не получилось, хотя, смотря с какой стороны :) Тито Ларрива - оно, конечно, натуральный\
          \ черт :) Наармальный такой, обсаженный черт :) Басистка упала, всем, включая барабанщика, было весело. Вся сцена\
          \ и зал в дыму like AC fucking DC :) \nА, ну да, Фром даск тилл даун. Началось оно у входа, когда упырь охранник\
          \ многозначительно спросил: ВЫ В СПИСКЕ? Жутко было интересно: А в каком? Входящим вновь с перекура: А где ваш ЧЕК?\
          \ :) Но упыри тока начинались. Бармен в майке 05, сильно уважающий, судя по всему, тренажерные залы, с успехом открывал\
          \ бутылки зубами, так же успешно обвешивал и обсчитывал, полагаясь, видимо, на свою ох.енную неотразимость. Спички\
          \ об одежду никто так и не зажег :(\nАрмянский разогрев перед концертом - атличная находка. Нигде ещё не видела\
          \ такого огромного количества бритых голов на единицу площади - вполне себе площадка получилась чиста для пацанвы\
          \ - на сельский клуб похоже. Юноши с \"козой\" у сцены \"блистали\" знанием \"родного\" языка музыканта. \nТаперь\
          \ о музыке. Играли громко. Хотя, всего лишь этажем ниже эта музыка слушается проще и не так уж сильно бьет по желудку.\
          \ Сальмы Хайек, как сами понимаете, не оказалось :) Да и превращений особых не было.  \nТакая офигительная легенда\
          \ вокруг Ларривы, созданная Родригесом, в один миг на глазах рассыпалась. Не, легенды должны оставаться на компакт\
          \ дисках, умело спродюсированных и записанных. И на кинопленке. Их концерт живьем - как серпом сами знаете по чему.\
          \ И уже никакая Angry Cockroaches не спасет. Это как если бы Клуни вдруг пальцем в носу поковырялся, и как в том\
          \ старом анекдоте, отстреливая этой соплей в сторону: \"Деушка, патанцуем?\" - Нет. - \"А чё так?\"\nХотя, болею\
          \ я. Может, потому и не понравилось. Да и избалованная я. Надо реже ходить на концерты - тада всё будет нравицца\
          \ и всё будет зашибись :)"
