            deleted: false
            text: У меня дома есть большая цыганская семиструнка 1927 года. Мастер неизвестен, но гриф, похоже, сделан в мастерской
              Климова. Строй семиструнки, как известно, D-H-G-D-A-E-D. Что суть распространенный негритянский слайдовый строй
              (для квинт). Экгм... надо попробовать...
