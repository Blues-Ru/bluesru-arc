                subject: Соколовская гитара до сих пор в ушах звенит
                deleted: false
                text: 'Ты, Андрюша, прав - я ошибся. Но суть в том, что это строй, позволяющий брать мажорные аккорды прямым
                  барэ - для слайда один из вариантов.

                  Что-то мне вспомнилась одна давняя история, напрямую не связанная с темой строя. Еще студентом я бывал в
                  одном доме, куда приходил старый цыган, дядя Коля Маштаков. Он играл на семиструнке и приговаривал: "Вот
                  смотри, смотри - и ничего не поймешь. У меня ни один аккорд цыгане не могли украсть. Я ж закрытыми акордами
                  играю." Во как! Другая его история про то, как он держал во время НЭПа хор в одном из лучших ресторанов
                  Москвы ("Арбатский подвал", кажется). Дела шли хорошо, и дядя Коля вставил себе золотой зуб с брильянтом.
                  "Выхожу перед хором, запеваю - а у меня солнце во рту горит!" Вот такие семиструнные истории.'
            person_id: 458
