  text: "Тут фестиваль гармошки и все такое.  Не до джемов. Но вот о чем надо подумать, гг.: 27-го в БиБиКинге джем в честь\
    \ дня рождения Хендрикса (60 ему было бы). Хотелось бы сделать все по-человечески. Прошу потенциальных участников написать,\
    \ что они бы хотели сыграть (или сыграть и спеть).\nС Каверкиным, Кораблиным, Гелютой и Вороновым ясность уже есть. \"\
    Ред Хаус\", \"Фокси леди\" и \"Хей Джо\" уже названы на \"сыграть и спеть\". Но можно в них и других вещах сыграть на\
    \ гитаре, гармонике, клавишах... \nПишите."
