                    subject: On Friday, November 17th 2000,
                    deleted: false
                    text: the news of Bim Sherman's death - one of the true unsung
                      heroes of roots music as well as reggae's most enduring cult
                      figures - reached the reggae massive worldwide. After he got
                      injured as a result of a fall, Bim Sherman was admitted to hospital
                      where, on examination, he was found to have cancer. Then health
                      matters didn't go well and within one week he passed away. It
                      is obvious that his unexpected sudden death is a great lost
                      for his family and friends. But be convinced that Bim Sherman's
                      many committed fans, who supported the artist and his music
                      for two and a half decades by now, are also mourning for the
                      lost of this truly very underrated, extremely talented and diverse
                      artist.
