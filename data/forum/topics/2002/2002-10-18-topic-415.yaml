  text: 'Вчера в BBKing(e)был концерт замечательнейшего коллектива Blackmailers Blues
    Band.Очень жаль, что это мероприятие было омрачено практически полным отсутствием
    народа к назначенному времени. Я уж даже и не знаю что думать по этому поводу.
    Вроде бы и положительный резонанс в обществе приезд этой группы вызвал и отзывы
    о ней хорошие, а народа нет. А если учесть (как мне рассказали), что и на Ragtime,
    в прошлый их приезд,в BBK реакция была такой же, то я  просто развожу руками.
    В итоге концерт начался с задержкой примерно на час. Ребята отыграли просто здорово
    и пришедшие, которых в итоге набралось  не так уж и мало, остались очень довольны.

    Из известных мне людей на концерте присутствовали (в порядке появления):Д.Казачков,
    Е.Майоров, Г.Дзагнидзе, Н.Арутюнов.


    p.s

    Так как у меня с собой было … Я имею ввиду фотоаппарат и прочую технику,то как
    минимум фотки будут представлены на всеобщее обозрение ,как максимум -всё.Ну а
    место встречи изменить нельзя – bluesmAn.ru'
