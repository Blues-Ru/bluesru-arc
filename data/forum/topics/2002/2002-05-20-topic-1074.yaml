        subject: RE Так вот ведь
        deleted: false
        text: 'Тут еще и не только в этом дело. Я вот - считаю звукозапись крайне вредным занятием, и почти бесполезным, и годным только на то, что кто-нибудь прослушав, оторвал свою задницу от дивана, и пришел-бы на концерт за настоящим кайфом. Ну, это сравнимо с расматриванием красоток (пусть и длинноногих и дорогих) в журналах, или клевую девушку к себе в койку. Пусть и не такую длинноногую, пусть и не такую заретушированную, зато - настоящую, а не журнально-глянцевую.

          Я же понаблюдал за Доком немного. Он выбирает девицу из публики, и начинает на нее работать, получается такой взаимозавод. Море драйва, обаяния, взаимных телег (дождешся Док от меня, выложу компромат про эрогенные зоны :-)). А запись - как плоская фотография, ну песня, ну хорошо исполнили, ну наверное, в контексте вызывает приятные эмоции. Кстати, я прав или нет, но на тех больших концертах, где я присутствовал - ЧХ в больших залах - нЕ ЗВУЧАл. Т.е. в больших залах не было того доверия, интима, которое возникает в маленьких и уютных клубах. Или мне просто не везло?'
