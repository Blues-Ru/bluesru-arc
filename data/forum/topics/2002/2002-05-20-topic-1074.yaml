      subject: Так вот ведь
      deleted: false
      text: "Это интересная тема. Я сам это раздолбайство люблю. На Тике его немного. Такие были условия работы (хорошие), такие были мы сами (серьезные), такие были звукорежи. Тем не менее, мне по-прежнему не чужие не только концепция ритмического подергивания, но и детали: гитара Коломейцева в последней вещи (как и гитара Каверкина в первой). А пианино Лушникова! Там в студии стояло фоно, выбранное из шести или семи инструментов в соседнем ДК \"Пищевик\" - это был самый лучший Красный Октябрь из всех! И его ни разу за время функционирования студии ММС никто не использовал для записи. До Ильи нашего, 22-летнего гения, полуглухого. Вот ведь. Про этот год в студии много чего можно вспомнить в стиле блюз. И Мишу Владимирова с банкой сидра в руке, и приход Рыженко, равноценный приходу кайфа... \nА что отгладили - ничего, ничего. Я доволен этой работой. Сделаем более рас..ким следующее изделие, если Бог даст. \n\nНасчет клубов - ох - вчера такое было в Алабаме! Красивые женщины, блестящие танцы, текила рекой... Редко такое видишь. В одной частной фонотеке в конце 60-х я видел записи латиноамерики на бобинах Тип-2. Они были помечены машинописью, приклеенной к картонной коробке. Одна песня называлась \"Сами ходят бедра\". Редко видишь такое! \nКстати, на другой ветке в этом форуме есть заметка Греты о Джаггере и туфельках. Талантливо."
