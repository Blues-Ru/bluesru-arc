    text: 'Хоть бы кто старым хреном назвал побыстрее (Ал. Агр)

      Да нет проблем. Мне например, не понравилась излишняя гладкость альбома (ТИК). Я больше люблю разнузданное раздолбайство, но при этом - с высочайшем классом игры. А тут? Вот вступил бас. Вот вступили клавиши. Все ровненько, все закомпрессированно, ничего не выступает, никаких тебе неожиданностей. А Миша Владимиров на губной гармошке вступает так "нежно", как будто играет не черный и корявый блюз, а нежную сюиту на вечеринке высшего света. Одно радует - голос Дока. Блюзовый и в доску свой.

      Хотя такая ровность - дань моде современных звукрежев. Чтобы ухо не дай бог, ничего не ломало. А в блюзе (мне) хочется какой-то что-ли грязной гитары. И тупой бочки, плюхающей как полиэтиленовый пакет в который налили воды. Хотя, блюз, он же разный...

      КотМатраскин.

      PS А вообще то классно, что можно пойти в клубешник, пива попить, послушать ЧХ или там Мишуриса, правда, стало лучше.'
