          deleted: false
          text: "Эта Ливин Блюз далека от оригинала Лидбелли. Основой для нее была скорее версия Рори Галахера (Taste, 1969). Но и оттуда мало что осталось. \nТеперешний состав нашей группы есть в \"Российских музыкантах\" на этом сайте. Клавишника зовут Михаил Ольшаницкий. Он был раньше в группе А.Белова, работал в джазовых коллективах. С Братецким мы играем вместе на джемах (есть еще у нас трио Де Блюзспиннерс, да работы для него нет). А куда он делся, вопрос мучительный."
