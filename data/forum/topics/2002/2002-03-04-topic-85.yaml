    subject: Virus Alert!
    deleted: false
    text: 'Ребята, будьте бдительны! За последнее время я получил несколько писем с вирусом Klez, отправителями которых типа являются участники этого форума (в том числе и от тебя, Владимир). Это может происходить по разным причинам, самая простая - вирус на компьютере отправителя или на компьютере других лиц, имеющих wab-адресную книжку с адресами участников форума. Конечно возможна и умышленная рассылка с "подставой" адресов членов форума. Так как мне реальные IP-адреса участников неизвестны, то определить точную причину невозможно. Посему просьба, каждый пусть не поленится проверить свой компьютер новыми версиями антивирусников, и особенно утилитой против Klez''а, которую можно скачать с сайта www.viruslist.com (поискать там в поиске). Дело в том, что Klez не определяется некоторыми  антивирусниками.


      Спасибо за внимание и извините за оффтопик.

      /Сергей.'
