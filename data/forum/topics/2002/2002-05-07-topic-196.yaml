    text: 'Я вот был с Регтаймом во Владимире. Там был концерт с Blackmailers Blues Band и Алексеем Барышевым. Макарка привел в клуб очень много народу, и на концерте была полная, стопроцентная веселуха, несмотря на то, что под Регтайм танцевать ооооооочень трудно. Барышев же наоборот сейчас играет на 90% исключительно шаффлы, что очень приятно для присутствующих. Какая, все-таки, приятная публика во Владимире! В Москве я такое видел в последний раз в Беляево лет 5 назад. Причем, там были все, кому блюз хоть немного интересен и не очень. А у нас в столице народ тухлый.......

