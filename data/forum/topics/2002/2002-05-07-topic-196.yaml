  text: Друзья! Мы (Scolder Blues) вернулись из поездки в Киев. Эмоции переполняют, главное, что хочется сказать - там очень хорошо! И живую музыку там любят, и на концерты ходят. Мы играли в замечательном клубе "Buddy Guy" с очень хорошей аппаратурой (на сцене даже Хаммонд установлен) и прекрасным звуком (заслуга одного из самых известных на Украине звукорежиссеров Олега Ступки, за что ему огромное спасибо!). Еще раз хочется поблагодарить всех, приложивших руку к нашей поездке и выступлению за отличную организацию, теплое отношение и хороший звук. (Личная благодарность - ведшему с нами переговоры Алексею, арт-директорам клуба Валерии и Константину). А публику - за прекрасную поддержку!
