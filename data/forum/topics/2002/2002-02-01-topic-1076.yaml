        приблюзованный вариант A Day In The Life Леннона - это просто фантастика! Плюс масса блюзов и просто хороших песен
        иногда в прилатинистых ритмах и всегда с гармошкой Ли Оскара! Да, да, это его группа. После этого Animals второго
        состава не очень хочется слушать, если честно.
