        subject: Animalisms - Tracklist
        deleted: false
        text: "Itak, poehali:-)) Zaranee proshu proscheniya za translit:-)))\nWo-perwih, kak i u mnogih komand togo wremeni,\
          \ u Animals razlichayutsya nazwaniya UK i US releasow, da i pesni zachastuyu neskolko ranie whodyat w eti izdaniya.\
          \ US-versiya etoi plastinki naziwaetsya Animalization, to zhe, chto w US bilo wipuscheno pod nazwaniem Animalisms\
          \ - woobsche absolyutno drugaya plastinka, dowolno bolshoi raritet, w Ewrope i Australii ona wishla tolko w 90-h\
          \ i naziwalas sootwetstwenno Blues Years i Roadrunners (hotya, poslednij wkluchaet w sebya i bolee pozdnie zapisi).\n\
          U menya w rukah sejchas Animalisms izdaniya 99 goda Repertoire, prekrasnoe kollekcionnoe pereizdanie s bonus-trackami.\
          \ Itak:\nBand: razumeetsya, Burdon, Chandler, Valentine, Rowberry, Steel i Jenkins (otmechenno otdelno). release\
          \ - June 66'\nTracklist:\n1.One Monkey Don't Stop No Show (Tex) Dowolno neobichnii mid-tempo opener dlya Animals.\
          \ Ochen priyatno i ubeditelno.\n2. Maudie (Hooker) - mid-tempo nomer, neskolko skuchnowataya wersiya, ma moj wzglyad.\n\
          3. Outcast (Cambell-Johnson)Dominiruet gitara Hiltona s izryadnoj dolej fuzz-a i tremolo. Ochen dinamichnij nomer.\
          \ Oshushaetsya wliyanie Stax. Eric horosh, kak wsegda.\n4. Sweet Little Sixteen - (Berry) ostaetsya oschuschenie\
          \ nekotoroj nezawershennosti posle proslushiwaniya etoj pesni. Wpolne weroyatno, chto eto perwij i edinstwennij\
          \ take. Eric w ocherednoj raz, kak i w Maudie , swobodno interpretiruet text, na etot raz upominaya Beatles w odnoj\
          \ iz strochek.\n5. You're on my mind(Burdon - Rowberry) - pop-ballada, Eric poet neobichno nizko, John igraetochen\
          \ ubeditelno, organ i piano, gitari prakticheski ne slishno.\n6. Clapping (Rowberry) - dowolno smelij dlya togo\
          \ wremeni experiment - 1,5 minuti - kollazh iz hlopkow s priwkusom flamenco.\n7. Gin House Blues (Troy-Henderso)-\
          \ ne samaya luchshaya zapis Animals, s moei tochki zreniya. Nekotoraya neprodumannost aranzhirowki.  ZA udarnimi\
          \ - Barry Jenkins. \n8. Squezze Her Tease Her (Tucker-Wilson) - priyatnij nomer up-tempo.\nEric kak wsegda na wisote.\
          \ Slegka napominaet \"Talkin' 'bout you\".  Za udarnimi - Jenkins.\n9. What Am I Liing For (Jay -Harris) - priyatnaya\
          \ pop-balada. Horosh organ i Eric, kak obichno. \n10. I Put a Spell On You (Hawkins) - dowolno udachnaya wersiya\
          \ etogo standarta. Wesma dinamichno. Gitarnoe solo wesma zabawno.  Eric richit prostrelennim zwerem. Smeni tempa\
          \ tozhe wpechatlyayut. Organ sweden do minimuma.\n11. That's All I Am To You (Blackwell-Scott) - up-tempo nomer\
          \ s fuzz-gitaroj Hiltona i welikolepnoj tarelkoj Barry. Piano igraet nadezhnuyu podkladku. Eric - nuzhno li kommentirowat?:-)\n\
          12. She'll return It (Burdon - Rowberry) moshnij zawershayuschij nomer. Snowa Barry Jenkins za udarnimi.  W celom\
          \ - ot wsej plastinki ostaetsya oschuschenie rosta Animals kak banda. Dalee - bonus -tracks\n\n13. Inside Looking\
          \ Out (J and A Lomax Burdon Chandler) klassicheskij single pozdnih Animals. Pererabotka pesni Rosie. Pod etim nazwaniem\
          \ w repertuare komandi - s leta 65 goda.\n14. Don't Bring Me Down (Goffin-King) ne menee izwestnij single Animals.\
          \ Snowa fuzz-tremolo gitara, slilnij nalet soul. Klassika\n15. Cheating (Burdon - Chandler) gipnotiziruyuschij nomer,\
          \ postroennij na 2-h akkordah. Welikolepnaya dinamika. Snowa fuzz i tremolo na gitare. Partii instrumentow swedeni\
          \ k minimumu. Eric - welikolepen.\n16. Help Me Girl - (English-Weiss) - woobsche-to, perwij solnij single Burdona,\
          \ ostalnie Animals w zapisi uchastiya ne prinimali, po prichine rospuska anda. Odnako, izdan kak \"Eric Burdon and\
          \ the New Animals\".\n17. See See Rider (trad, arr Rowberry) - Animals w nailuchshej forme. Hronologicheski - poslednij\
          \ single banda. S moei tochki zreniya - luchshaya obrabotka etoj pesni. Riff, dinamika, breaks - wse na swoem meste.\
          \  Energiya wipleskiwatesya cherez kraj. Odna iz moih samih lyubimih pesen Animals.\n18. I Just Wanna Make Love\
          \ To You (Dixon) - s peroi EP, izdannoi \"Graphic Sound Studio\" za dengi samih Animals, esche do kontrakta s Decca.\
          \ Release - October 63'.  Wposledstwii (w 66') pereizdano Decca na EP. Klassicheskij sostaw - s Steel-om i Price-om.\
          \  Ochen energichno, wersiya bolee blizka k Muddy, chem beshennogo tempa wersiya Stones.\n20. Boom Boom (Hooker)\
          \ odna iz , po-moemu, 3-h wersij etoi pesni. S togo zhe EP. Wmesto priwichnogo organa iz single-release - electro\
          \ piano. Eric poet gorazdo bolee \"po-chernomu\", chem w drugih wersiyah. W nekotorih mestah parodiruet golos John-a\
          \ Lee. Ochen horoshaya wersiya. Po-moemu, gorazdo bolee luchshaya, chem na posleduyuschem single.\n21. Big Boss\
          \ Man (Dixon -Smith) ta zhe EP. Price igraet na melodike, pitayas imitirowat harp. Zwuchit zabawno, no ne ochen\
          \ ubeditelno.\n22. Pretty Thing (McDaniels) s togo zhe EP. Snowa melodica. Na etot raz bolee ubeditelno, no na 2-h\
          \ iz 4-h pesnyah? Nuzhno li dejstwitelno bilo brat ee wmesto signature-klawish? Eric snowa parodiruet vocal originala.\
          \ Wsya wersiya ochen blizka k originalu.\n23. Don't Bring Me Down\n24.See See Rider\n24 Help Me Girl\n25. Cheating\n\
          Stereo - versii wisheopisannih trackow. S Amerikanskogo alboma Animalization. \nW celom - ochen horoshij disk, odin\
          \ iz naibolee slushaemih mnoj na protyazhenii poslednego goda."
