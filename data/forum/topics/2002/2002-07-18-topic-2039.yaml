  text: 'На дверь Рая стучаться три души. Архангел открывает дверь и задает каждому вопрос - "сколько вы заработывали за год?"


    Первая душа - три милиона баксов.

    Архангел - а что вы делали?

    Первая душа - торговал антиквариатом.


    Вторая душа - сто тысяч баксов.

    Архангел - а что вы делали?

    Вторая душа - был юристом.


    Последняя душа - девять тысяч баксов в год.

    Архангел - а на каком инструменте вы играли?'
