        deleted: false
        text: 'По мнению г-на N, через руки которого проходит большое количество инструментов
          категории Vintage, он не ощутил большую разницу в звучании между Thinline''72
          и укомплектованным аналогичными датчиками Custom''72, разве только Thinline
          выдаёт чуть-чуть больше "песка" при включении через Overdrive. А вот "бочковатость",
          присущая истинным hollow-body инструментам, ощущается недостаточно полно,
          если не сказать, что вообще незаметна, т.к. объём резонатора незначителен
          за счёт малой толщины.

          Что касается инструментов более поздних годов выпусков, особенно после 1976-го,
          то по его мнению у них очень неровное качество и весьма разный звук.

          Резюме: надо послушать.. ))'
