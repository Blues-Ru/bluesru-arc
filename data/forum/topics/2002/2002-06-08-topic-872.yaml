        text: 'Гринбаум стараеться имитировать молодого Грина и это у него получаеться плохо. Эрик (хвала ему) на альбоме
          с Б.Б. отлично симитировал более молодого Б.Б. а на "Рэптаил" порадовал более

          богатой гармонической палитрой и даже легким Латино-Американизмом. А в группе "Леджендс", с Дэвидом Сэнборном и
          Маркусом Миллером, довольно прилично шпарил фюжн-блюз,и произошло это не так давно - 2, 3 года тому назад. Так что
