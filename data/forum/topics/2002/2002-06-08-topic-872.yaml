  subject: Черным по белому
  deleted: false
  text: Часто по звучанию блюзового гитариста можно определить его цвет кожи - манера игры черных и белых музыкантов существенно
    отличается. Я предлагаю поговорить о белых блюзовых гитаристах, которые могут достаточно достоверно имитировать "черную"
    манеру. Таковым я считаю, например, Джимми Воэна (Jimmie Vaughan).
