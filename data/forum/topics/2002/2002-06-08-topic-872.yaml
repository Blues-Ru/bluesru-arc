                      text: 'в каком-нибудь магазине? Если видели, то где? Очень интересно, что это за пластинка.

                        В рэп-музыке и хип-хоп культуре встречается достаточно много достойных музыкантов, а потому мне немного
                        странно, что тут все часто наезжают на этот стиль, как таковой. Я молча за этим давно уже наблюдаю
                        :)

                        Причем неприятие бывает двустороннее. Эверлэсту, например, поклонники и "братья по цеху" поставили
                        в вину его участие в записи пластинки Santana "Supernatural". Типа "смотри, с кем и что играть". Помнится,
                        даже морду набили на концерте.. А я Сантану обожаю, и Everlast является одним из моих любимых музыкантов
                        (мои вкусы не только блюзом ограничиваются). К сожалению, любое отступление от рамок прежде выбранного
                        стиля, поклонниками и коллегами зачастую воспринимается в штыки.. Ну был Everlast  в составе "House
                        of Pain" - играл одну музыку. Теперь у него сольная карьера - музыка изменилась - много гитары, дудок,
                        появилась легкая приджазованность - ну и прекрасно! У меня есть и House of Pain, и сольники Everlast''a..
                        (желающим, для ознакомления могу переписать). Всё не так далеко друг от друга, как может показаться..
                        И родства во всем гораздо больше.

                        Ненорматива в рэпе много - это да.. Но по мне, так пусть лучше гангста-подобные подростки будут по
                        улицам ходить и граффити на стенах рисовать, чем упитые пивом "любители футбола" с их разгромами после
                        неудачных футбольных матчей..

                        Прошу прощения за "неблюзовую телегу" :)'
