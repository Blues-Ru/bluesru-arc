        subject: Насчет "моей теории"
        deleted: false
        text: 'Я же не сказал: "всегда" можно определить! В заглавном сообщении было сказано: "часто" можно определить, что
          предполагает исключения.

          Критериями приближенности к "черной" блюзовой музыке я считаю, (в частности) - тонкое чувство свинга, лаконичную
          фразировку, мастерское умение работать со звуком - зачастую на слабом "дистошн" а то и на совершенно "чистом" звуке,  умение
          "в тему" сыграть "грязно", и др.

          А насчет исключений - Джимми Хендрикса можно считать одним из родоначальников белого блюза, несмотря на цвет его
          кожи... :)

          Я согласен с тем, что все это достаточно субъективно, но расизм здесь ни при чем.'
