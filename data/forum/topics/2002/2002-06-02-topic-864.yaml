      text: 'Зачастую они просто копировали блюзменов, рокнролльщиков, кантрименов и людей типа Дилана, согласись.

        Вчера посмотрел фильм о записи альбома The Band, там Харрисон рассказывает о своем отношении к игре на гитаре, технике
        и американской музыке вообще. Он очень сильно прислушивался к игре именно странных блюзменов и людей типа Робби Робертсона
        с необычной неторопливой игрой.

        Это как раз то, что наш Федор называет скучной унылой музыкой.

        А потом, видя успех Стоунз с почти блюзовыми номерами и абсолютное поклонение перед Диланом, они не могли не играть
        по блюзу на репетициях и в студиях. Леннон и Харрисон были пропитаны этим. Их вариант Money очень серьезен для этой
        поп-песни (вспомни вариант Хукера).

        Ринго любил кантри, как известно; Пол был в восторге от соула и сам выдавал шедевры на этом фоне, а вот Джон и Джордж
        как гитаристы играли по блюзу, чтобы они не исполняли.

        Вещи типа Taxman появились уже под влиянием развитого черного блюза, я не говорю о примитиве чигакского стиля.

        Другой разговор, что они никогда не копали то, что любим мы с тобой - дельту и акустику вообще, но это отдельная история.'
