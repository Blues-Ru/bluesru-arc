      text: 'У меня есть этот диск.

        Грета: Дэвид Ханибой Эдвардс, действительно, легенда блюза. Он играл ещё с Робертом Джонсоном, Томми МакКленнаном и Робертом Петуэем; таких, или сходно заслуженных, людей ныне осталось человека три в мире. И с точки зрения аутентичности и значения для современного блюза он вне критики. Другой вопрос, что если его мерять мерками его же современников, то это наверное будет не самый выдающийся представитель "того" блюза, а сегодня, в силу возраста, он и тем более не в лучшей своей форме, что вполне естественно (см. хотя бы его номер на Hell Hounds on My Trail, прошлогоднем трибьюте Р. Джонсону - более преклоняешься перед самим фактом живой связи времён, нежели перед красотой и мощью исполнения). Но как верно заметил Андрей, просто даже из уважения к самой личности почётного ветерана старого блюза не стоит быть к нему придирчиву. В конце концов, в блюзе все играют, как могут, лишь бы старались и могли выразить и донести до слушателя то, что хотят.'
