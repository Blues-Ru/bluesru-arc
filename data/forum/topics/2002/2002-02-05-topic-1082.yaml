              subject: отвечайте, профэссор!
              deleted: false
              text: 'Андрей, эту лепёху надо парировать, дело чести! ;))

                А вот как выйду из положения я: как известно, первые 11 записей Ханибоя Эдвардса относятся к лету 1942 года, что есть почти на грани, за которую я в "Архаике" стараюсь не заступать (Petrillo ban, 1943), основной же массив наследия Эдвардса был записан уже после отмены запрета, т.е. за рамками моего, т-скэть, исследования. Фактически та же история, что с Мадди Уотерсом, Мемфис Слимом и Чемпионом Дюпри; на мой взгляд, это уже не архаики как таковые, хотя и плоть от плоти оных; это новая формация блюзменов, которой - в отличие, допустим, от их современников Томми МакКленнана и Роберта Петуэя, в том же 1942 году записываться и закончивших, или Сона Хауса и ему подобных, целиком и полностью состоявшихся как артисты в 1930-е годы, как бы обильно они потом ни записывались в 60-е, - ещё предстояло прогрессировать, активно участвовать в формировании послевоенной блюзовой школы. Он просто персонаж из другой, следующей серии.

                Вот почему Ханибой Эдвардс отсутствует на Архаике, если не считать пары упоминаний о нём как о партнёре-дуэтисте.

                А кстати, Грета, на каком сайте Вы его видели?'
