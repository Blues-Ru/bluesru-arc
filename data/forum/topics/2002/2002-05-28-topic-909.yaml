          deleted: false
          text: "у нас вердикт выносится раз и навсегда. интересно, почему? Плохих\
            \ шоу не бывает у мадонны - там машина работает четко во всех мелочах,\
            \ и каждый винтик смазан маслом \"премиум\". Блюз, извините, зависит от\
            \ настроения блюзмена, его пищеварения (и не всегда хорошее пещеварение\
            \ способствует блюзу:), погоды, контакта с залом... \nчерт, опять о Бюске...\
            \ у него глаза становятся теплыми, когда он говорит, как любит Бадди Гая,\
            \ Чарли Масселвайта... как приятно было встретить мезыканта, который ничего\
            \ плохого не сказал о других музыкантах. а как он аккомпанировал на джеме,\
            \ вытаскивая иващенко?! потому что, как я полагаю, любит бюск музыку,\
            \ а не себя единственного... что удивительным образом нисколько не мешает\
            \ ему оставаться эгоцентристом и абсолютным диктатором в группе."
      - id: 4820
        parent_id: 4773
        date: 2002-05-30 16:23
        poster: Andrei V. Evdokimov (evdokimov)
        email: evdokimov@blues.ru
        subject: первое, что я открыл
        deleted: false
        text: "Those that know me know that I am a huge fan of Buddy and have seen\
          \ him at least once a year since 1989 - but the last time I saw him he was\
          \ terrible. In fact, the show I attended last year was perhaps the worst\
          \ show I've ever seen out of anybody - it lasted only about 40 minutes and\
          \ Buddy barely touched the guitar. He looked tired, worn down and didn't\
          \ appear to want to be on stage. It was so poor that another showing like\
          \ that this year and I probably wouldn't go back next year. I shouldn't\
          \ have worried.....\n\nThis year's show was one of the best performances\
          \ I've seen by any musician ever. As far as Buddy's shows that I've seen\
          \ it ranks second only to his perfomance on the third aniversary of Legends\
          \ - right before the release of Damn Right I've Got the Blues (the single\
          \ best musical experience I've ever had). \n\n---\n\nчто еще раз доказывает.\
          \ Блюз - не машина, обслуживаемая дюжиной механников. И даже у Бадди раз\
          \ на раз не приходится. Два подряд его концерта, виденные мной в нутоддене,\
          \ были хороши каждый по-своему и абсолютно блюзово-гениальны. Что не значит,\
          \ что бадди работает без сбоев. даже бюск (тссс, только чтоб федор не слышал:)\
          \ не каждый раз блестает.\n\nЧто мне понравилось в вышеприведенном мнении:\
          \ музыку нужно слушать, а не имена. А то у нас одних положено ругать, других\
          \ - не тронь, прослывешь ретроградом (это в дитературной формулировке)."
