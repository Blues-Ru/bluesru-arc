    deleted: false
    text: "Ну что ж, попробую воспроизвести один достаточно красивый вариант объяснения.\n\nИдея вот в чем. Самый простой способ импровизации, построения соло --- это обыгрывание аккордов. То есть смотрим на гармонию произведения, и в зависимости от звучащего аккорда выбираем набор нот, по которым мы можем играть. Вопрос только в том, как именно этот набор нот выбирать. Рассмотрим варианты в порядке усложнения. (Заметим также, что каждый следующий вариант включает в себя предыдущий как подмножество)\n\n0) Тривиальный случай --- только одна нота, основной тон аккорда.\n1) Ноты, входящие в состав трезвучия. Это называется арпеджио.\n2) Ноты какого-либо ЛАДА, соответствующего аккорду.\n3)... более сложные случаи нам пока не интересны.\n\nВопрос только в том, какой взять лад. Посмотрим для этого на то, какие они вообще бывают. Для этого, например, возьмем звукоряд, соответствующий До мажору (то есть до-ре-ми-фа-соль-ля-си-до), и будем стоить лад от каждой его ступени. Таким образом, мы получим семь ладов (они имеют свои названия, но речь не об этом). Посмотрим на них. Три из них имеют мажорное трезвучие I ступени, и поэтому их считаем \"примерно мажорными\", три --- минорное, считаем их \"примерно минорными\". А теперь посмотрим ПЕРЕСЕЧЕНИЕ трех \"примерно мажорных ладов\", если построить их от одной тоники. Это будут I-II-III-V-VI ступени мажора. Аналогично, посмотрим пересечение трех \"примерно минорных\" ладов --- I-III-IV-V-VII ступени минора. \n\nПолучается эдакая \"рафинированная мажорная\" и \"рафинированная минорная\" гаммы, \"нечто среднее\" между трезвучием (арпеджио, если говорить о построени соло) и полной семиступенной гаммой.\n\nЭто и есть (соответственно, мажорная/минорная) пентатоника!"
