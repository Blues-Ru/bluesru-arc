    text: 'Пентатоника - это пятизвучие. Есть мажорная и минорная. Многие думают, что в блюзе при импровизации толькоо ее и используют. Это неверно. Она лишь лежит в основе некоторых ходов. На самом же деле блюз и интересен тем, что мешает в себе и мажорную и минорную терцию, и кварту и повышенную кварту, и квинту, и сексту, и обе малую и большую септимы. Некоторые ноты берутся с подтяжкой, тем самым добавляя еще и четверть-тона, которые вообще не записываются в европейской музыке. Нот гораздо больше, как видишь.

      Я вот тут посмотрел школу БиБиКинга, большое удовольствие и польза. Он толком ничего объяснить не может (за него это делает ведущий), но играет он блестяще и совсем не так как другие.'
