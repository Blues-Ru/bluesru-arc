  deleted: false
  text: "Давненько мы не выезжали за пределы родной БиБиКингщины, в кои-то веки вырвались:\
    \ воскресенье, вечер, делать нечер.. ну, в общем, ты понял, уважаемый читатель.\n\
    Лёгкие поиски по www.afisha.ru принесли нам небогатый улов, а именно: традиционный\
    \ Ломидзе в LeClub (называется сие действо почему-то \"Блюзовый джем\", но менеджеры\
    \ клуба по телефону от сего открестились всеми четырьмя конечностями, поведав\
    \ нам приятным девичьим голосом: \"Леванчик всегда один играет и никого на сцену\
    \ не пускает\"), а на второе - Scolder Blues в R&B Cafe, что в Староваганьковском\
    \ переулке. Благо, нам идти недалеко.\nДавно нас озадачивало сие необычное название\
    \ коллектива, и с полки был торжественно снят Webster Dictionary...\n\nScolder\n\
    \\Scold\"er\\, n. \n1. One who scolds. \n2. The oyster catcher; -- so called from\
    \ its shrill cries. (b) The old squaw. [Local U.S.]\n3. Someone (especially a\
    \ woman) who annoys people by constantly finding fault...\n\nМдя.. хорошее начало..\
    \ ловцы устриц, старые индейские скво.. злобные ворчуны.. делать нечего, полезли\
    \ в GOOGLE.. быстренький такой поиск принёс нам ссылки на здесь (www.blues.ru)\
    \ плюс уникальный ресурс, который смеем рекомендовать для внимательного изучения,\
    \ особенно тем, кто любит традиционные семейные ценности: http://zhab.narod.ru/\n\
    \nКороче, вдохновлённые прочитанным, отправились мы на концерт, и услышанное описываем.\n\
    \nЖаль, что не были мы ранее в столь славном заведении, простите нам наши провинциальные\
    \ домоседские привычки.. но услышанное потрясло. Всё было правильным: зал, сцена,\
    \ аппарат, звукооператор... такого качества саунд не слыхивали мы ранее. Полная\
    \ читаемость каждого инструмента, каждый инструмент по тембру выстроенный так,\
    \ что не перекрывается другим, отличная звуковая панормам, плотный и однородный\
    \ звук по всему залу.. просто сказка!\n\nЧто сказать о музыкантах.. порядок бьёт\
    \ класс, как древние говорили. Группа играет именно как одна команда, музыканты\
    \ слушают друг друга, и играют именно те правильные ноты, которые нужны в данном\
    \ такте, а не пытаются вывалить на слушателя \"всё выпитое и съеденное в ближайшем\
    \ баре\", как говорил покойный Томми Болин. Духовая группа выше всяческих похвал.\
    \ Шестиструнный бас пробирал до самых печёнок. Гитарные дуэты мастерского Стратокастера\
    \ и выдержанного 10-летнего Телекастера были не столько виртуозны, сколько добротны\
    \ и вкусны по звуку. Губная гармоника в дуэте с саксофоном звучали необычно и\
    \ свежо.\n\nСтиль группы - это всё-таки r&b или фанк, рутовость не про этих ребят.\
    \ I feel good, вполне аутентично исполняемый на бис, это всё-таки некоторый показатель\
    \ и стиля, и класса.\n\nВ общем, с этими ребятами мы бы в разведку пошли, учитывая\
    \ общие военные корни...\n\nКомментарий a-la Грета: в зале накурено и душно, вентиляция\
    \ не работает, пиво тёплое и дорогое, на входе никто не встречает, в туалете фото\
    \ Мерилин Монро... Грета, не обижайся, мы тебя любим! :))"
