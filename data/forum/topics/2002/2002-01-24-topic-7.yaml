              text: А 96Kh на 24 бита тебе тоже не покатят, когда они будут в ходу? Я тут ради интереса посчитал. Разрешение
                между двумя значениями цифровой 24-битовой амплитуды примерно соответствует размеру одной молекулы на виниловой
                пластинке. А за одну стотысячную секунды (т.е. за временной интервал между двумя сэмплами) виниловая головка
                проходит путь примерно в 1000 молекул. А снимаешь ты звук "грубой" пьезо головкой за 200$, кончик которой
                состоит из миллионов 5 молекул. Ну и у кого больше разрешающая способность? Так что разговоры про то, где
                точнее -звук на качественной виниловой аппаратуре или на качественной цифровой 96k/24b имеют мало смысла.
                Выходные усилители-то не различаются. К тому же, всегда можно, считав информацию с цифрового диска, сгенерировать
                аналоговый сигнал как от головки, но с гораздо большей точностью.
