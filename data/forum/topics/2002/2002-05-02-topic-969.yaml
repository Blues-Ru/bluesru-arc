  text: Вчера наконец-то дождались ТВ-репортажа (иначе и не назовешь ролик на 20 минут)
    фестиваля 2001 года "Дельта Невы" в Санкт-Петербурге. Показывали по питерскому
    Региональному ТВ ночью(иногда оно вещает передачи Рен-ТВ, поэтому сложно сказать
    на каком канале точно вышло сиё чудо). Как обычно, для передачи на ТВ, я увидел
    это случайно, репортаж корявый и смазанный. Возникает вопрос - а есть ли более
    полная видеозапись оного действа? Фёдор и Андрей, вопрос в общем-то к вам как
    к участвующим в процессе организации ;) Ведь в сущности по исполнителям и атмосфере
    "фестиваль" был неплохим, питерцы тогда узнали много интересных московких и других
    (Ragtime :) ) артистов...
