  text: "Джем и одновременно акция в защиту уссурийского тигра. Видим улыбки. Ничего,\
    \ это наша работа - видеть улыбки. Как и утирать слезы.\n\n16 мая, четверг, 19:30\
    \ -- Зоопарк, ул. Красная Пресня дом 4А (м.Краснопресненская). \n\nНайти легко.\
    \ Идти (ехать) по Красной Пресне (Садовое кольцо сзади), пройти главный вход в\
    \ зоопарк, искать железные ворота \"4А\" и войти в них. Вахтеры предупреждены\
    \ и стрелять не будут. Дом 4А - во дворе. Поднимайтесь на 4-й этаж пешком и поворачивайте\
    \ направо (театр \"Тик-так\"). Курить можно только на лестнице. Пиво и прочее\
    \ будет продаваться в зале. Вход 100 рублей. Для тех, кого интересует, куда будут\
    \ потрачены собранные деньги, отвечаем - этот вопрос совершенно не заслуживает\
    \ внимания. Джемующий + подруга, естественно, не платят за вход. Джемующим постараемся\
    \ выставить пиво, как было принято на Втором. \n\nВопрос, который уже не раз возникал\
    \ - что значит \"джемующий\". Есть хорошие музыканты, с которыми мы уже знакомы\
    \ или пока не знакомы. Первых ждем на все наши дела. Со вторыми готовы и хотим\
    \ познакомиться.  Давайте поясним на примерах. \n1. Мне написал Сергей Бабаев\
    \ из Ашхабада - дескать, приеду в Москву и хотел бы поиграть вместе. Недавно мы\
    \ его послушали в БиБиКинге. Ждем 16-го. \n\n2. Есть такой американский гитарист\
    \ Би Би Кинг. Ждем 16-го. Можно с группой, но не больше 30 минут.\n\n3. Из сети\
    \ я узнал про группу \"Х\". Интересно. Приходите, познакомимся, поиграете с хаус-бендом.\
    \ А может, вашей группе выделим слот минут на 15 - смотря по времени и составленному\
    \ списку.\n\n4. На Втором этаже появлялся бронеподросток \"У\". Играть не может,\
    \ просто любит попить пивка и выставиться в свете рампы. Приходи, брат, снова.\
    \ Но ты же все понимаешь сам. Не всем же играть, нужны и слушатели...\n\nНекоторые\
    \ люди могут принять сказанное это на свой счет, попытаться себя отнести к какой-то\
    \ категории, обидеться, не дай Бог. Ладно, не берите в голову - приходите все,\
    \ защитим тигров от истребления. \n\nИ еще одно - про ВТОРОЙ ЭТАЖ. Клуб пока закрыт.\
    \ Есть вероятность, что 9-го джем (Ст.Мир) все-таки состоится. 16-го, по понятным\
    \ причинам, нет."
