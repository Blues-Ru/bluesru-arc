  text: "Как все уже заметили, 3-го числа будет выступать James Brown. Не все собрались на него идти, поэтому считаю своим долгом рассказать. Кто-то думает, что Джеймс Браун - старый, не хочет расстраиваться и т.д.\nДж.Браун уже приезжал в ГКЗ 2-3 года назад и мы с чуваками были на этом концерте, хотя после кризиса там была заполнена треть зала. Поэтому мы замечательно уселись в партере звенеть бруликами с дешевыми билетами в кармане.\nЯ не знаю, какой концерт будет 3-го числа и пр., но тогда он приехал с \"Шоу Лос-анжелеса\" - это тридцать великолепнейших музыкантов, включая группу совершенно черных бигмам-вокалисток, оркестр, группу с потрясающим гитаристом и т.д. Все они - совершенно молодые и в музыку врубаются так, что мало не покажется. Сам Дж.Браун - постарше, но голос, энергия и эмоция у него на месте. Они исполняли великолепно аранжированный фанк, соул, рок и даже блюз. Меня, помню, особенно проперло, когда после великолепно отлаженного в звуковом плане (это положительная характеристика) шоу, гитарист врубил какую-то специальную примочку, изображающую 50-герцовый шум, и сыграл громко на весь этот государственный fucking-концертный зал Хендрикса и еще кое-что так, что уши закладывало! \nТот концерт был праздником музыки, в натуре! Не знаю, что будет сейчас, может James Brown кардинально постарел за 2 года, но что-то мне подсказывает, что очень возможно будет круто! Это вам не старенький Чак Берри с концертом на шару в Москве (было за 2 месяца до Брауна). Так что, очень советую проверить! Есть огромный шанс получить эстетическое и эмоционально удовольствие!"
