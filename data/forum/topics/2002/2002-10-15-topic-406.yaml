    subject: О том как двигают горы
    deleted: false
    text: 'Представь себе город с населением - 300 тыщ, практически полное отсутствие музыкальной системы в целом, 2 университета, из каждого окна "блокбастеры" от хрен поймеешь какого-то очередного "русскогорадио". Но вот среди всего этого то тут,то там до твоего уха доносится обрывки Ли Хукера или Во(э)на. Ты оборачиваешся и остолбеваешь. Песню напевает бритенький, крепкосложенный паренек в рибаковском спортивном костюме. Что произошло с этим миром? Он сдвинулся? Еще бы. Black Mailers отыграли очередной концерт.


      Вот тебе мой ответ: сила давления восприятия мэйлеров на публику такова, что если конечно ты с нуля и не станешь адептом блюза, то приборетешь хороший вкус в музыке точно.

      p.s. "ты", я конечно говорю не о тебе конкретно, а вообще в пример о силе их живых выступлений.

      p.p.s. гитарист понравится даже завзятому гитарному снобу (потверждено неоднократно)

      Все в целом "вкусно", "грамотно", с традицией

      Вот'
