      subject: Это классные ребята
      deleted: false
      text: 'Нельзя не согласиться с оценками, которые прозвучали выше. Мы однажды играли в одном из владимирских клубов вместе с Blackmailers. Такое не забудешь. Они очень клево сыграли. Во Владимире зрительская среда, возникшая вокруг этой группы - славная и настоящая.

        Несколько горестно, что мы все редко общаемся. Не только с Лешей Барышевым, Костей, и ребятами, но и с ребятами из Питера и других мест. И в этот четверг не получится у меня зайти в ББК... Вот какое предложение - а что бы ребятам (если они ночуют в Москве) не заехать на джем в Вудсток? В ББК кода в 23:00, а мы в Вудстоке уж заполночь там будем точно. По бульварам ехать минут 15. Леша, Костя, Олег, Тимофей - приходите! С меня 4 стакана.'
      inferred_person_id: 458
