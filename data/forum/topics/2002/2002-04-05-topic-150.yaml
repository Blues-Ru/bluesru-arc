  subject: Про джем
  deleted: false
  text: "Видать, к лету дело идет, хоть градусник и показывает иное. На Втором этаже вчера битка не случилось, хотя и пусто не было. Про звук... Видать, идеальный баланс мы услышим в той стране, где опоссум сам слезает к охотнику с дерева. Но все же более или менее. \"Вермона\" звучала по делу, и Кирилл с Ваней молодцы. В качестве второго гитарного комбика использовался привозной басовый Трейс Элиот (так получилось). Мы его с Каверкиным еле подняли наверх. Силы-то не те. А звучал он как говно. \n\nИграли хорошие люди. Вроде упомянуть одних - неправильно. А другие как же. И все-таки, из молодых ребят назову одного - Юру Новгородского (гитара-вокал). Crossroads и Mean Old World - это было клево! А из ребят постарше - Николая Ширяева (бас) и Славу Капорина (гитара).  \n\nВ 22:30 кино не завели. Акустический джем начался. Самая лучшая часть. \n\nСпасибо всем! И до встречи."
