    text: "Начиная со среды на прошлой неделе - Би Би Кинг, Пупер, ЦДХ, Запасник. Энергетика офигительная. Музыканты порадовали. Наблюдалось почти полное согласие с элементами понимания. Бардак практически отсутствовал, в грим-уборной курили только самые упертые, упитых не было. ЦДХовским бабулям, знаменитым своей злобностью, практически нечего было сказать артистам. Ну, разве что погасили свет, когда все выходили из гримерки. Любимый их номер. Дескать, и увидели, что это хорошо, так нате вам.\n      Кожекин оказался неплохим организатором. С ним просто иметь дело. Вчера вот было забавно. В Запаснике не оказалось хаус-бенда (договор был с группой Садикова). Выяснилось это за час до джема. Стали мы с Вовой думать и звонить. За полчаса до начала удалось договориться с Игорем Карташевым (ударные). С ним сел играть Роман Гринев (басист со Станции). Аппарат там престранный. Мониторы установлены как бы у кинотеатра Новороссийск. Гитарный комбик один и совсем гадкий. Ну и ничего, почти без опоздания начали и все хорошо прошло.\n      Впечатлений много, и все хорошие. Спасибо всем, кто приходил, слушал и хлопал."
