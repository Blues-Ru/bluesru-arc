          subject: Дополнения к вышесказанному
          deleted: false
          text: "На первый постинг: Гия и Петрович собрались впервые, рояль остался стоять в кустах в смазке и полной боеготовности; у Петровича новый проект, в нем участвует гитарист Е. Немов, духовая секция из Сколдер + некий трубач, новая ритм-секция. Сами понимаете, взлететь со всей этой командой (не только Петровичу, но и каждому гармонисту) в гала-концерте было трудно. Приоткроем кулисы: организаторы решили взять в дело две ритм-секции и устроить спевки с ними харперов, вокалистов, гитаристов и т.д. Репетиции шли и предварительные, и прямо в ЦДХ (например, Чистяков приехал из Питера под самый фестиваль). Все это сработало. Может, кто-то из харпёров обиделся на Кожекина (мало дали сыграть и т.д.). Но попробуйте встать на его место и (мысленно) сделать такой фест - все поймете. Тут без некоторой жесткости обойтись не легче, чем, скажем... \n   Про Гелюту и звук его ничего на форуме писать не буду, дабы не привлекать хулителей его.\n   Братецкий заглотил гармошку в Запаснике 24 ноября 2002 года в 11:15 р.м.\n   Теперь про Юлю Смолянин. Она репетировала с Балакиревым, Серегиным и Гией сначала I Just Want to Make Love to You. Но заменили вещь, хватило ума. Можно себе представить, что бы творилось в переполненном ЦДХ под такой высоковольтный мессадж! Где можно послушать Юлю, не знаю. Наверное, на носителях ее на руках и можно.\n   Всем привет, спасибо за вопросы и комментарии."
