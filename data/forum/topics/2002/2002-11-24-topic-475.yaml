    text: "Ох, ребята, как вы все здорово пишете, я так не умею.\nНо мне сильно поперло на фестивале. Было, клева, суперски, здорово!\nНо я провел половину концерта за кулисами.\nЗдорово, что в этом году повезло со спонсорами, и с рекламой. Потому наверное и был полный зал. \nКонцерт, надо отдать должное Кожекину и Ко был отлично организован. По времени уложились точно по расписанию. Все сыграли то, что должны были и все успели (в том году был небольшой облом с этим). Организационный уровень заметно растет, не говоря уже про испольнительский :-)\nА играл я вещь из репертуара Пола Лэмба - I'm goin'g down. Они когда приезжали на гастроли, я понял, что я тоже хочу это сыграть. Спасибо Роме Гегарту, за то, что помог разобраться с нюансами этого произведения, и Алексею Плющу, за то что Исполнил со мной эту вещь.\nБыло всё супер.\n\n(Нет, не могу не похвастаться - нас таки показали по телевизору в пятницу вечером на канале ТВЦ в программе \"Свободне время\", как мы с Лешой Плющом в БиБике в среду играли, этот самый I'm goin' down, в контексте, типа что будет Харп-Фестиваль. Русинов смотрел по телеку)"
