  deleted: false
  text: 'Спасибо всем! Организаторам - за организацию, участникам – за участие, зрителям – за переаншлаг!!! И с каждым годом всё лучше и лучше. Вот уже и молодое поколение на пятки старикам наступает ;) (мальчугана, похоже, покажут во всех репортажах про 5 харп-фест) Наконец-то приехал дядя Фёдор Чистяков из Питера (у нас и свои Chenier есть ;)), не добравшийся до белокаменной в прошлом году. Правда, после его выступления стул под Доком опасно шатался, а Петрович и вовсе под конец рисковал пристроить на него только лишь гармошку, но ни в коем случае не себя ;) Но ведь фигня всё это! Весело было, забойно и т.д. Да, впрочем, чего говорить, там, где Кожекин с Жуком по определению не может быть не забойно. А тут ещё и Тамара пожаловала. Сразу почему то вспомнился фестиваль BLUES.RU-2001: «Точка», Владимиров в шапочке, Мишурис с боцманской трубкой, Вовка Кожекин, колбасящийся перед сценой и прекрасная Тамара… Порадовал Blacky (здравствуй, Paul Lamb ;)). Кстати, что это была за вещь? А вот Макс Некрасов, по-моему, в том году выступил ярче. Братецкий & Гегарт: разные, но, блин, какие шикарные! Однако, Братецкий что-то гармошку не заглатывал (как ту самую ром-бабу 1972-года издания ;)), а вот John пытался. Миша Владимиров честно говоря разочаровал: как гармонист – супер, но как вокалист – гмм… Не всегда мне нравится Дзагнидзе, но в этот раз – класс! А «Шуга мама» в дуэте с Петровичем – это и есть новый проект МПС или рояль из кустов так и не был выкачен?

    Да, чего там говорить. Все молодцы!!! Извините, коль кого-то забыл упомянуть :)


    PS Хочется особо отметить Гилюту: вот есть у его гитары свой неповторимый голос! В чём здесь секрет? Гитаристы, ау-у!'
