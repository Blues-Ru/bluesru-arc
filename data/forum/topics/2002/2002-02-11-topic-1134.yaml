        deleted: false
        text: 'А я бы сказал, что его главный хит "Mustang Sally" :-))

          А на счет Blues Brothers, Дим, ты загнул, конечно. Или перепутал... Потому что на его музыке (а также Отиса Реддинга)
          построен фильм "The Commitments" (1991) Алана Паркера. А Wilson Pickett участвует эпизодически только в Blues Brothers
          2000.

          И в заключение хотел добавить для Малколма. Wilson Pickett к акустическому блюзу имеет весьма условное отношение.
          :-)'
