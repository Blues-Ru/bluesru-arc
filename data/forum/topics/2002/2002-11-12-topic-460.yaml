      text: 'В принципе АЕ уже обозначил принципиальную позицию по отношению к сабжу: "нет слов, Михаил, нашел ты продолжателя дела сонахаузова".

        Оно и понятно. Все мы знаем Криса Ри очень давно, наслышаны и примерно представляем что от него можно ожидать. Очень хорошо представляем. Джозефин, На бичу, Дорога к аду и пр.

        Я ведь и сам, кстати, неоднократно повторенную одним знакомцем (музжурналистом, кстати) мысль, что на новом диске Крис Ри играет "корневой блюз", откомментировал в том духе, что этого не может быть, оттого что не может быть никогда. Но ведь я диска к тому времени не слышал. А теперь вот послушал. И вот что хочу сказать.

        Мнение своё я круто изменил с первыми звуками вступления первой песни.

        А ко второй половине альбома вернулся к нему снова.

        Там ведь вот что происходит. Крис Ри действительно пытается играть корневой блюз, старательно и изобретательно воссоздаёт его звуковую картину. И тут на его стороне многое. Он большой профессионал, он всю жизнь практически играет на слайд гитаре, он - это чувствуется - знает и любит жанр, до которого ныне дорвался. В частности, будто бы в подтверждение широты своей эрудиции он использует не только лежащий на поверхности гитарный кантри-блюзовый арсенал, но и фортепианный аккомпанемент будто б из традиции классического блюза а ля Бесси Смит, и банджо в духе Гаса Кэннона, задействует интересные шаффлы и т.д. и т.п.

        Но чем дальше, тем более скучно становится это слушать. Не то чтоб имеет место быть провал или неудача - вот и музжурналисты выносят вполне почтенный вердикт. Просто это диск Криса Ри, и всё тут. Любителям творчества Криса Ри его можно только рекоммендовать; далёким от блюза, скажем так, меломанам - рекоммендовать его можно и, мне кажется, нужно, авось появится интерес к той музыке, которой Крис Ри здесь подражает. И приятно им будет, и полезно. А мне вот, за себя скажу, не очень-то понравилось. Слайд-гитара, которую Ри здесь с таким упоением использует, к четвертой песне начинает раздражать, поскольку и меры и вкуса в её использовании не хватает; гармонии вроде б и под блюз, а всё же что-то в них слышится чужеродное. Вроде б и есть драйв, а вот уж он и потух. И чем дальше, тем более эти подробности становятся явны. В итоге получается как-то уныло, смурно и не то чтобы блюз, а именно подражание. Очень профессиональное, с большой любовью к предмету, не без интересных моментов, но тем не менее всё же подражание.

        Так что со всей душой, видимо, рад бы Крис Ри в блюзовый рай, но нечто нажитое за всю предыдущую карьеру - не пускает. Что жаль, конечно. Ведь хороших блюзовых дисков, сыгранных хорошими музыкантами, знающими и любящими блюз, - много не бывает.


        Вот такие мысли праздного слушателя по поводу.'
