  text: "Спасибо те дружище и за это , просто у нас музыка не совсем блюзовая.\nМы играем \"соул\"60х годов типа Отиса Реддинга,Уилсона\
    \ Пиккета,\nСэм&Дэйв.Можа знаешь таких.... Слушай если знаешь какие-нибудь группы в Москве играющие такую музыку подскажи\
    \ их сайты если есть такие.\nА на счёт нета, то там много всякого дерьма,и пока это всё дерьмо перероеш.....\nP.S.А фамилии\
    \ у нас почти одинаковые , можа мы и родственники где то \nтам.Цыганов."
