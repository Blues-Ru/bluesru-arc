    text: "Знаю, знаю старину Пиккета.. первое моё потрясение было году в 77-м, када я услышал, что Sunny не тока Бони М играют,\
      \ а ещё и Вильсон тот самый Пиккет, причем на гармонию Am-C7-Fmaj-E7... )) \n\nВот меня всегда интересует, почему люди\
      \ сидят-сидят, а потом начинают играть именно соул, а не попсу сладенькую? Ну я старый, я блюз и рок всякий играю, потому\
      \ что у меня ничего другого не получается - я даже када «В траве сидел кузнечик» играю, всё равно блюз получаеЦЦа...\
      \ но вот молодёжь чего туда же? Тем более, что девушки блюз не любят, за редким исключением...\n\nА сайтов и групп не\
      \ знаю..увы.."
