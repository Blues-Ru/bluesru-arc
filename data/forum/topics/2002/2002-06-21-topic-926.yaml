                            deleted: false
                            text: "NB: полный офтопик, и адресован исключительно тем,\
                              \ кто в танке, но дал мне приятную тему :) итак:\n---\n\
                              \nзачем о музыке? вопрос был о напитках...\nитак, чего\
                              \ избегать, чтобы не получить мою голову.\nводку пью,\
                              \ начиная с 80 руб, предпочтение \"старой москве\" и\
                              \ \"посольской\". если бабки захрустели, можно \"Иван\
                              \ Калита\". \"Парламент\" тоже очень хорош. \"nemiroff\"\
                              \ весьма симпатичен. Но а дальше уже почти вне пределов\
                              \ моей финансовой досягаемости и разумности цен вообще.\
                              \ Однако тестировался и \"русский стандарт\" - достойно\
                              \ похвалы качество, ценообразование являет собой отражение\
                              \ узкой маркетинговой направленности (это я вам как\
                              \ доктор говорю :). У меня был период увлечения \"absolut\"\
                              , но это ушло без следа вместе с периодом раннего обуржуазивания\
                              \ всей страны. очень хороша \"finlandia\". А вот иностранный\
                              \ smirnoff с его неизменно парфюмерным привкусом - вызывает\
                              \ недоумение; видимо, напиток для алкоголичек из богатых\
                              \ семей. лучше уж наш \"арсентич\". Ни в коем случае\
                              \ никакой водки от довганя. вообще, когда вам под сорок,\
                              \ вы предпочитаете не рисковать с дешевыми водками.\
                              \ помню, что \"исток\" во фляжке\" был приемлем, однако\
                              \ требовал очистки настойкой...\n...Если есть время,\
                              \ водушку всегда стоит настоять хотя бы на лимонных\
                              \ корочках (2-3 дня). а к празднику, к компании, с которой\
                              \ хочется подольше посидеть благостным, и с ясной головой,\
                              \ следует настаивать родимую на перемычках от грецких\
                              \ орехов; увы, чтобы получить такую настойку качественной,\
                              \ требуется не меньше трех недель; несколько месяцев\
                              \ на грецких перемычках дадут вам отличный бренди -\
                              \ правда, вкус жестковат (и даже как-то суховат), но\
                              \ лично мне масляные бренди не нравятся. \nРазумеется,\
                              \ есть еще прекрасные вина, портвейны, вермуты, даже\
                              \ и коньяки... но для моей головы это уже экзотика.\
                              \ а водушка - милое дело, частый друг. \nправда, тот\
                              \ пост с упоминанием ДжДж, писан в трезвом состоянии\
                              \ и без похмелья. Он даже посвящен был совсем другой\
