  text: Дали отслушать и переписать два винила БиБи. The Electric B.B. King - His
    Best (1969) и Lucille Talks Back (1975). Великолепные пластинки. На второй Кинг
    играет с квакушкой весь альбом и это очень прикольно. Сборник 69-го года очень
    хорош именно подбором песен. Если увидите, покупайте! Очень советую.
