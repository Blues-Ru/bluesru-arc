  text: "walking a road of a man who's gone down...\nЯ тут задался вопросом, а ведь у старины Вудди тоже блюзы были (Вудди\
    \ Гатри т.е.). Я, правда маловато его слышал, но его версия House of Risin' Sun - это что-то. Кстати, дилановская версия\
    \ той же песни мне понравилась намного больше, чем Бёрдоновско-анималическая - как-то больше соответствует по настроению.\
    \ \nА вообще я хотел поговорить о стилях, которые вроде как ( если верить Алену Роту) похожи- блюз и кантри, хотя по происхождению\
    \ они- чёрное и белое (поправьте, если я ошибаюсь), но кантри исполняли в основном белые переселенцы, а блюз для опять-же\
    \ этих белых стал известен только в начале прошлого века, так ведь? Но вот раздобыв сборник \" легенды музыки кантри\"\
    \ я был неколько удивлён, когда среди откровенных country-western и подобных попался инструментал который на мой непросвещённый\
    \ взгляд является блюзом и ничем другим. Каким- то боком они в этот сборник впихнули даже Рея Чарльза, вещи, которые я\
    \ кантри уж никак не назвал бы."
