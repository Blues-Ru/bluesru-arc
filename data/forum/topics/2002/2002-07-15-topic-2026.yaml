  text: "Вот хочу рассказать что купил в эти выходные. Был в Легионе и у Паши на Шаболовке. В ПЛ распродажа и отстойник. В\
    \ распродаже был замечен блюз в большом количестве, да и в отстойнике немало всего интересного.\nКупил:\nBlind Boys Of\
    \ Alabama - Spirit Of The Century - 2001 (в отстое)\nSnooks Eaglin - The Crescent Collection - 2001 (sale)\nAllman Brothers\
    \ Band - Idlewild South - 1970 (в отстое)\nB.B. King - His Best (The Electric B.B. King) - 1969 (sale)\nИ близкая к блюзу\
    \ музыка:\nOtis Redding - Pain In My Heart - 1965 (sale)\nFour Tops - Still Waters Run Deep - 1970 (в отстое)\nParliament\
    \ - Trombipulation - 1980 (sale)\nJohnny Cash - God - 2000 (sale)\nJohnny Cash - 16 Biggest Hits Volume II - 2001 (sale)\n\
    Grover Washington, Jr. - Inner City Blues - 1972 (sale)\nGrover Washington, Jr. - Mister Magic - 1975 (sale)\nПлюс еще\
    \ по року, но это оффтоп.\nТеперь о виниле:\nJohn Henry Barbee - I Ain't Gonna Pick No More Cotton - 1964\nMemphis Slim\
    \ - I'm So Alone - 1961\nSpeckled Red - The Dirty Dozen - 1960\nНу и кому интересна настоящая музыка:\nWar - The Music\
    \ Band - 1979\nLee Oskar - 1976\nОчень рад всем покупкам. Помимо этого еще много рока и ролла купил ;) Можно пообсуждать\
    \ сабжы, если хотите.\nА Вам совет, сходите в ПЛ пока там еще есть эта распродажа. Цены от 6 до 10 за новые диски. Плюс\
    \ в отстойнике было много чего. \nМоя подруга увела у меня последний диск Этты Джеймс. Очень хорош! Исполняет Дилана,\
    \ Стоунз, Чарльза, Фогерти, Эла Грина и много блюза. Тот кто обвиняет ее в неблюзовости, неправ в корне. Музыку она играет\
    \ разнообразную, но голос, фил и подача у нее абсолютно блюзовые. Это не соул и не джаз-вокал, это именно блюзовая певица!\
    \ Альбом называется \"Matriarch Of The Blues\". Советую!\nСпасибо за внимание."
