      text: 'Фирма Storyville. Треки: El Capitan, This Is A Good Time To Write A Song, I''m So All Alone, True Love, Two Of
        A Kind, Big City Girl, Three And One Boogie, Bertha Mae, Celeste Boogie, Three Women Blues. MS - piano, vocal, celeste;
        Erik Molbach - bass, Jorn Elniff - drums. Записано в 1960/61 в Копенгагене. Великолепный звук! На второй стороне он
        один (четыре последних трека), на первой с датчанами. Все вещи его.'
