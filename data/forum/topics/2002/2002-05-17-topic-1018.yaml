      text: 'Детали на http://om.lrn.ru

        Все исполнители с этого сайта есть на диске, лежащем в коробке дистрибутива AltLinux Master 2.0. (www.altlinux.ru)

        Диск - подарок, а сам дистрибутив стоит 1300 руб (это кстати о якобы любителях халявы :-) )

        Насколько я знаю, все исполнители дали официальное разрешение на размещение своих песен на этом сборнике. Сборник - не audio-cd, а в формате .ogg

