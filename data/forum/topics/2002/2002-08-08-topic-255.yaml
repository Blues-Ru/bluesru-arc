          text: "Ха - действительно классный вопрос !\nЛично для меня - а мы все живем в свободной стране и имеем право высказывать свое мнение ( постоянно ) блюз это\nстиль моей жизни\nпофигизм и филосовское отношение к трудностям\nбесконечный источник ироничного отношения ко всему происходящему\nа когда я играю - сложно сказать.....\nнечто похожее на длительный неутомительный секс с любимой женщиной\n по состоянию души...\nгармония с самим собой и идиотское чувство что все люди  в мире братья\nИ для меня в мире существуют три пола - мужчины, женщины и гитары.\nи  - народ - я давно ужде начал верить в реинкарнацию\nфакт что моя душа раньше была знакома если не сдельтой то с Лайтнингом Хопкинсом точно - может быть не лично а на концертах\nвот такое пространное обьяснение но очень искреннее"
