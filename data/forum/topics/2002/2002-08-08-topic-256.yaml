  text: "Журнал Total Guitar опубликовал список ста лучших гитаристов планеты.\n\nЕсли первое место Хендрикса второе Пейджа и третье Клептона не вызывают сомнений, то 4-ое место Брайна Мея, гитариста группы Queen, выглядит по меньшей мере странно. Никогда ранее столь высоко этот гитарист не поднимался (исключая юбилей Елизаветы второй. Пятое место досталось Эдди Ван Халену... \nК разочарованию С. Тынку в первую пятерку не попал и Джо Сатриани :)"
