              subject: Это как у нас в стране
              deleted: false
              text: "Все всё ругают, а кто, прости, голосует? \nТаких списков можно миллион составить. Насколько я помню критики ставят Хендрикса, Клэптона и Кроппера в первую тройку. Нельзя мешать металлюг, рокеров и блюзрокеров. Это отдельные жанры и мало кто умеет играть все. По блюзу, так по блюзу. Но тут уже будет совсем другая тема. Техника в сторону. Важно только понимание, чувство и звук. Эрик нашел свой звук, за что его и любят. СРВ тоже. Многие, кого мы знаем, имеют свою неповторимую манеру, и в этом есть ценность гитариста в американской музыке. Я бы выше всех поставил Кудера, ибо он умеет играть по-разному, на разных инструментах, с разным звуком и техникой.\nОтдельная история джазмены и джазрокеры. Послушай как играет Матини, он уникален. Но и Эрик Гейл тоже. И так далее.\nЕсть конечно универсалы типа Сантаны, но это редкость."
