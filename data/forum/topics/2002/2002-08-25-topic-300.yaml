            subject: Я думаю, это связано с платежами в РАО. Т.е., вероятно, до 500 - некая фиксированная ставка,
            deleted: false
            text: "а дальше - плата растет от тиража.\nСлова 500 экз на дисках писала только арс нова, далеко не на всех. На раскупаемость никак не влияло. Хотя, если ты трудоустроен в этой отрасли, тебя имеет смысл послушать. :^)\nНо. Я говорю отнюдь не о БонЖови. (вообще-то, на блюзовом форуме можно и другие имена привдить :^)). \nГде-то зимой 99-00 я разговорился на горбушке с неким Валерой, э-э, Валерой, блин, забыл фамилию. В общем, владельцем торговой марки Формула Радости, заказывавшим свои тиражи Арс Нове. Жаловались друг другу на риаа. Он тогда сказал, что могут быть приняты правила игры, при которых придется честно платить за лицензию и станет возможным издавать только попсню (только если дешево лицензию предложат) тиражом не менее 3х-5ти тыщ и ценой баксов в 5-6. Я был очень удивлен цифрами тиража и спросил -\"так что, арс нова не врет, когда пишет - 500 экз.?\" -\"Не врет.\" Я не видел причин не верить. Мой четырехлетний практически ежедвухнедельный блюзовый мониторинг горбушки не дает поводов не верить.\nMemphis Slim & Willie Dixon Aux Trois Mailletz появился на горбушке примерно в январе этого года и тогда же был мной куплен. До того его не было. Ни о каких двух годах и нескольких тиражах говорить не приходится. В разное время на горбушке были по 2 диска каждого из этих артистов. Тоже разошлись не сразу.\nЧто за допечатки на болванках? Такого не видел. Видел, что сначала альбом выходит сам по себе (напр. Маддин Мадди, Брасс энд тхе Блюз), а потом в составе 2 в 1м (напр. назв. выше вместе с Фолк Сингером).\nА неск. болванок я купил. Никогда не выходивших на \"лицензии\". Последняя - документовский Скип Джеймс Лайв (64/66). На вопрос - чего так дорого за сидиэр последовал ответ -\"да, дорого!? Так ты первый, кто его купил!\"\n:^)"
