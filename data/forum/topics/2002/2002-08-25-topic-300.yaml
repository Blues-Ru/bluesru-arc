      text: "извращенное представление об некой нездоровой элитарности.\nот увеличения популярности блюза в нашей стране  хуже никогда не будет. \n\nпро 40-50 человеок это ернуда - посмотри какими тиражами издаются у нас блюзовые диски под \"местной лицензией\". \n\nбыла б больше популярность  - былоб больше хороших клубов, проводилось бы больше фестивалей. больше музыкантов стали бы больше и лучше играть эту музыку...  больше бы приезжало. вообще приблизительно на эти мысли могла бы натолкнуть статья федора, а совсем не на оборот. или что - в норвегии можно блюз чтоб все любили, а у нас нет? типа как полюбят - так прийдут и разрушат нашу елитарность на три с половиной человека знатоков популярнейшего мирового музыкального направления в рамках локальной песочницы?\n\nсоздавать вокруг тусовки атмосферу - мы тут супер блюзмены, а все остальные просто толстые мужики с проститутками - вот это прямой путь в задницу."
