    text: "И я читал эту статью, и я согласен с последним абзацом, но кое-что сказать хотелось бы...\n\nПочва есть и сейчас, но на ней ничего стоящего уже много лет не растет...Я надеюсь, что что-нибудь вырастет но...\nДа был в Ноттодене блюзовый фест, был... но кто о нем знает...КТО? В России мы перечислим их имена сами (они здесь на форуме все есть) + еще человек 40-50 энтузиастов, коллекционеров и т.п... \nНадо ли расширять этот круг? Да нет, не надо...Ни в коем случае, иначе все это перерастет в сами знаете что... Каждый должен сам приходить и находить, иначе блюз или что угодно другое становится всего лишь элементом масс-культуры...\nВам хочется что бы Би Би и еще пара -тройка мест стали попсовыми точками на карте ночной Москвы, приперались бы примодненые мужики с моделями (а на самом деле девушками другой профессии) и швыряли на столы пачки денег...\nЛюди сами найдут дорогу к блюзу и не надо провоцировать лишную популярность, но и игнорировать тоже нельзя...\nА где наши Флойды? Да не обидеться на меня Д. Казанцев, но наши Флойды сидят по подвалам и пишут песни и учатся играть совсем не на блюзе, а на Майке, Цое , Шевчуке и т.п.\nМожет и есть 5-10 команд, которые пытаются играть блюз, но имена их покрыты тайной... А имя прочим легион...\nВот так примерно я думаю..."
