          deleted: false
          text: "...отмазки лишь, от органов, (от налоговой например), и еше это самая что ни-на-есть банальная реклама!!! (Как же - 500 экз - нужно брать обязательно!). Мемфис Слим с Диксоном уж по второму (если не по третьему) кругу пошел! (За последние два года).\nВедь нужно учесть еще тот факт, что самые известные группы и исполнители выпускаются сначала на \"левых\" дисках (я имею ввиду чисто пиратскую продукцию, затем, если тираж растпродан, заявляется \"РАО\" лицензия - и вперед с песнями, еще 1000 как минимум). \nBon Jovi - например, к нам в Питер первый раз пришел в кол-ве по 200 шт. каждого диска (и это только на один из складов - был сметён перекупщиками в течении часа - сам наблюдал эту весьма поучительную картину).\nЕсть, конечно, позиции, которые \"зависают\" напрочь на складах и в магазинах, но это касается, в основном, групп 3-го и 4-го эшелонов. Кстати, Вы заметили, что все допечатки выпускаются теперь на болванках!?"
