      deleted: false
      text: 'Саша! Мне кажется, что совершенно не нужно бояться излишней популярности блюза. В Норвегии на фестиваль приехало 40000 человек. Они на 99% - не меломаны, а простые работяги, которые вылезли из забоя, чтобы оттянуться и получить удовольствие. Есть, конечно, там излишний, но совершенно доброжелательный пьяный угар, и это не проблема. Молодежи там очень мало, в основном люди 35-40 лет, которые в начале 70-х слушали только что вышедшие классические пластинки Хендрикса и Лед Зеппелин. Ибо в Норвегии-то свобода началась не в 90м году, там музыку слушают давно. И без этой публики блюз не имел бы такого развития, которое они в Норвегии имеют на данный момент. Кстати, в черных кабаках в Америке никому в голову не приходило превращать блюз в элитарное искусство, туда люди приходили выпить после работы.

        Про почву для развития блюза мне приходит в голову простое соображение: отсчитай примерно от года 95-го, когда появились записи в свободном доступе, лет 15 - примерно столько нужно, чтобы научиться прилично играть, тогда будет у нас много хороших музыкантов. Только сколько их будет - меньше или больше, а также раньше или позже это произойдет - зависит, в частности, от того, станет ли сегодня блюз популярным в определенных кругах. А также от количества выступающих хороших музыкантов, которые могли бы кого-то на что-то вдохновить...'
