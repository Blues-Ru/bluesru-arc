  text: "Федор, прочла Вашу статью, ругаться вовсе не намерена :)), ни по поводу Др.Джона, ни по какому любому другому :) Ибо каждому свое, и вкусы у всех разные. Статья вышла отличная! Я ожидала какого-то рассказа о фестивале от Вас, благо сама очень хотела поехать, но не вышло. В следующем году надеюсь всё же вырваться.\nСпасибо! И за информацию, и за фото. Жаль, Доктора нет ни одной :) Но уличный музыкант - очень достойный :)\nНасчет последнего абзаца - всё верно. Чем больше будут качественно и разнообразно играть здешние музыканты и заезжие - _не важно_ какого ранга звездности и популярности, тем больше шансов, что юное поколение музыкантов что-то сделает стоящее. Должна быть какая-то почва, на которой что-то может вырасти. \nСлышали Вы или нет, но даже на концерте Бюска в Ле-Клубе были юноши, искренне восторгающиеся услышанным-увиденным, чуть ли не прыгающие до потолка от радости и вдохновения со словами что-то вроде: \"Мы тоже будем так играть, мы тоже так научимся!\" \nЗабавно, но восторг их не покидал даже в уборной :) (для незнающих - она там одна на всех). Моете руки перед зеркалом - а вам в это время кто-то выдает взахлеб свои эмоции от концерта :) Вот это называется \"пропёрло\" :)) \nТак что зовите всех, кто согласен ехать - всё это очень интересно определенному кругу людей. Смысел в том, чтобы его расширить, этот круг. Зачем? Не знаю. Просто так. Не так уж важно, в какую сторону в данном случае будет уклон - в рокабили, свинг, или панк-блюз :) Хуже не будет точно.\nСлушаю сейчас уличного Флойда Ли и думаю - Эх, где же наши Флойды..\nИ дело не только в цвете кожи."
