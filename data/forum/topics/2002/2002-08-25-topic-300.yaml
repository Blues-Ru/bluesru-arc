              subject: пример...
              deleted: false
              text: '...болванок (доп. тираж) Coco Montoya, кроме последнего - выходили на болванках - по обычной цене РАО. А главное - один и тот же диск выпускается разными конторами!!! Дорой, Арс Новой, и др. (и каждая как минимум по 500 шт....) У нас в Питере если встает вопрос о выпуске тиража какой-нибудь позиции - реальные обсуждения рассматриваются от 1000 и больше, иначе загибают такую цену, что лучше покупать фирменные и ими торговать, поэтому-то "саморезы" и стоят дороже (при условии, если такой диск не выходил на "Москве").

                У нас такие болванки (изготовленные дома на компе или копире, с цветной полиграфией) стоят от 90 р и выше (тут уж как кто загнет),

                я напр. "отдаю" по 90 (много - дешевле) (ха!)

