          text: "Саш, ты чуть-чуть не понял, точнее совсем не понял :)\nНе может быть и речи об узком круге людей и каком-то намеке на элитарность. Что за чушь. \nПожалуйста, не тешь себя иллюзиями насчет публики - она и сейчас бывает аховая - как повезет :) Я уже, кажется, говорила, что в Б2 на концерте одного из присутствующих здесь коллективов были только бабы (сорри, но в данном случае это единственно верно характеризующий термин), сидящие задом к артистам, или, как сказали бы Бивис и Баттхед: \"кул, телки, хе-хе, хе-хе\" :) А среди них, не взирая на играющую музыку absolutely, прогуливался престарелый \"папик\", почесывая я.ца, выбирал себе добычу :)) А после концерта дэнс-мьюзик, и весь блюз (или околоблюз) псу под хвост, простите :) \nЭто всего лишь зарисовки со стороны слушателя. А выше я описала совершенно другую реакцию публики. Чувствуешь разницу? :) Она очень существенная.\nВот потому и нужно, чтобы была почва!!! И чтобы кто-то знал из тех, кому правда интересно!!! :)\nЭто _не_ принудительное увиличение популярности - всё достаточно логично и произойдет само собой.\nУ одной из моих сотрудниц семнадцатилетний сын посещает колледж джазовой импровизации. Вот чем он будет заниматься дальше - в этом и есть смысл. Это другие люди и выросли они на другом. Хочется в это верить :)"
