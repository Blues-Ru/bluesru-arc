          text: 'На рассвете, буквально на днях, по музТВ показывали металлюжный концерт Г.Мура (т.е., записанный в его металлический период). консультантом показа был Алексей вайт Белов. При этом все называли Мура "блюзовым", только сам Белов использовал дипломатичную формулировку, что Мур, мол, "занимается блюзовым исполнительством" (почувствуйте разницу!:). В студию звонили "телезрители". Сердце мое дрогнуло от народной любви, когда один из звонивших почти процитировал эту вот фразу (о впечатлениях мура от концерта БлюзБрейкерз"): "Муру показалось, что пол под ногами стал каучуковым, и он подпрыгивал на нем как на батуте". Фразу легко найти в неприметной статейке в разделе "музыканты", на букву "М", разумеется. Статейка нескромно подписана КРУПНЫМ шрифтом и даже имеет пояснение: "Домыслы в этой статье являются домыслами, а факты - фактами, и их трудно спутать." Тем не менее, звонивший гражданин перевел домысел - в факт. Стыдно ли мне, что я ввел в заблуждение "малых сих"? не фига! Звонивший сказал, что эти сведения он почерпнул в одном журнале из переведенной (sic!) статьи. ну, раз ему переводили... видимо, с русского на русский... значит, я не при чем.

