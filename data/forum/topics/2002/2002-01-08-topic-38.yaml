                        deleted: false
                        text: "это тож не секрет. поминавшийся здесь СРВ замучил свой единственный официальный концертник дополнениями и пересведениями. \nПоэтому нормальный концертник, записанный как есть (и сыгранный в пределах допустимых огрех), сильно отличается от писанного-переписанного. Live Wire/Blues Power Алберта Кинга - архиклассический позитивный пример концертника. Этот же материал, сыгранный в студии, не прозвучал бы.\nPS\nЭто ни к кому лично не относится. Это к слову о примеченной общей тенденции уверять \"мы не так уж любим SRV\". У нас в обществе это обычное дело - сначала все хором обожают, потом так же хором хают. Правило общее и для блюзперсоналий, и для генсеков. Достоинства SRV и его \"всепоглощающая\" (в свое время) популярность - это разные вещи. Не стоит принижать его достоинства только чтобы расквитаться с ним теперь за его уже меркнущую популярность."
