                  text: 'Вообще удивляет и даже раздражает, что у нас на ТВ, радио и в газетах очень часто люди занимаются не своим делом. А если и своим, то зачастую непрофессионально (видимо по блату). То при переводе какой-нибудь статьи или фильма кучу ошибок наделают, то возьмутся делать передачу или статью про то, о чем плохо осведомлены... А потом у тех, кто всё это хавает, получается, что Gary Moore и Челобанов с Киркоровым - блюзмены.

