              deleted: false
              text: 'Блюз не имеет прямой связи именно с "гитарной" музыкой.

                Человек поигравший джаз, фьюжн или металл уже никогда не сможет вернуться к простоте и точности блюзовой формы.

                Джеф Бэк не начинал с блюза! Ну о чем Вы? Он же белый! Я слышал массу его сольников и работы с Джаггером или Уотерсом. Ну там вообще ничего от блюзовой игры не осталось. Не надо путать его с Клаптоном или даже Пейджен! Бэк - инноватор, и всегда что-то придумывал, порою отрицая старое.

                Blues For Greeny - симпатичная, коммерческая, но нечестная и неоткровенная пародия на откровенного и больного Гринбаума. Тут прошу без обсуждений, Грин - это мой любимый музыкант, и нет смысла мне рассказывать о возможности влезть в его музыкальное восприятие музыки.'
              replies:
              - id: 72
                parent_id: 67
                date: 2002-01-10 00:33
                poster: Andrei V. Evdokimov (evdokimov)
                email: evdokimov@blues.ru
                subject: опаньки-II
                deleted: false
                text: "1.Бэк - белый. А Грин что? Зеленый?\nBlues For Greeny - симпатичная, но неубедительная для меня работа. По моим прикидкам, легенда о Грине была уже основательно подзабыта к моменту выхода альбома. Скорее, Мур сделал доброе дело, напомнив публике о силе и власти легенды о Грине. А коммерчески это был, скорее, просчет - для Мура это был наименее успешный альбом его блюзовой карьеры (заметьте, у него есть блюзовая и неблюзовая карьера, что курьезно для блюзмена, не так ли?:). Я почти уверен, это было нормальным желанием поиграть музыку, которая поразла его воображение в детстве. А не склалось больше всего из-за формально поставленного условия: непременно на \"той гитаре\". А \"та гитара\" уже не звучит. То ли вообще, то ли в руках Мура... не так важно, в альбоме она не звучит. \n2.И, дичная просьба (была \"личная\", но я решил оставить очепятку:). Можешь прокомментировать это: \" Человек поигравший джаз, фьюжн или металл уже никогда не сможет вернуться к простоте и точности блюзовой формы.\" сначала вообще, а потом, если можно, на личном примере. И это не подъ-ка! правда, любопытно."
                replies:
                - id: 74
                  parent_id: 72
                  date: 2002-01-10 01:00
                  poster: Дима Казанцев (Dr. Nick)
                  email: dr.nick@blues.ru
                  subject: Гринбаум и его корни
                  deleted: false
                  text: "1. Грин в отличие от Бэка начинал сразу в блюзовых командах, да и ранний Мэк (учитывая пластинку The Original Fleetwood Mac 1967) звучал довольно убедительно блюзово. А что и как играл Бэк в Птичках и до них?...\n2. Пример: Робэн Форд в начале своей карьеры старался играть блюз, и у него это получалось весьма лихо. Манера эта была заметна и в игре с L.A. Express и в других сессионных работах. Потом наоборот, он стал записывать \"блюзовые\" альбомы, но не по манере, не по подаче - это не блюз. Джазмены рады - научился парень играть, ушел от пентатоники. Для меня это совсем бесхребетная музыка. \nПримеров много: Пейдж ассоциируется только с его тяжелой игрой, Ерик Гейл в конце карьеры стал совсем другим, да тот же Рэй Вон начал с живой традиции, а закончил чем? Личных примеров у меня не много, но знаю много хороших музыкантов, которые отказываются играть блюзы, поиграв всякие джазы и прочее, а жаль."
