        text: "Единственно, с чем рискну поспорить - именно эта запись, именно Флойда Ли, именно что понравилась мне. Интересные вещи. Остальное спишем не то, что это первый диск в 70! \nИстория: мама одного нашего знакомого стояла на кухне в коммунальной квартире, слушала радио и хмыкала. А там говорили следующее: \"На обеде в честь товарища Иосипа Броз Тито с ответной речью выступил член...\" Кремль, тов.Сталин... \"Затем слово взял...\" Она хмыкала. \n\"Мама, в чем дело?\"\n\"Я не знаю всех ваших цирлих-манирлих, но я знаю, что вкусно - когда с плиты!\"\nЭто, безусловно, есть, и никуда от этого не денешься. Не обуешься, не оденешься..."
