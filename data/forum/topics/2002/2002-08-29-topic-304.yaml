      text: "или как-будто бы все экспромты и шероховатости побриты-пострижены триммером, я же сразу об этом написала :) И звучит там несколько моложаво. Ведь невозможно _шоу_ изобразить \"аудиоакустически\" :) и получить те же эмоции, что при живом прослушивании. А часто именно шоу добавляет (либо отнимает - у кого как получится) что-то неуловимо-неповторимое. Особенно эта разница заметна у таких вот уличных музыкантов, самородков или каких-то нестандартно мыслящих и играющих музыкантов.  Судя по всему, не очень в кайф стучать котелком по струнам, сидя в студии - нападает некая официальность и \"ответственность\", подобно той, как люди, живые и общительные за кадром, перед камерой становятся неузнаваемыми.. \nВсе посещенные мною в последнее время концерты (не носителей русского языка) звучали сногсшибательно - эмоций было через край. А запись - да.. запись хорошо, но _так_ не цепляет, не вставляет, хоть убейся..\nНо вряд ли это повод не слушать запись :)"
