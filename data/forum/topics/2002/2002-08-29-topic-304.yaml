  deleted: false
  text: "(непоучительная история)\nмне нехватало хорошего диска Санни Боя I. Был блюбердовский сборник, но он что-то не очень впечатлял. (Bluebird - довоенный чикагский блюзовый лейбл).\nа Санни Бой II собран основательно и обширно, включая дочессовские записи и европейские гастроли. Однако еще не помешает. \nВ пражском магазинчике вижу за 10уе двойник его записей. Good Morning School Girl присутствует, а название большинства остальных песен не знакомы. Открываю, смотрю даты записей: 1937-1945. Такого у Второго СБВ быть не может! Снова смотрю на обложку - там известная фотография СБВ-2, с бородкой, образца 60-х годов. Тут обращаю внимание на имя (не посмотрел сразу, поскольку фотография не оставляла сомнений, кто это). Написано: John Lee \"Sonny Boy\" Williamson. Это значит Первый СБВ. Потому что Второй был Райс Миллер. читаю статью - она про Первого. Иду к девушке за прилавком, прошу поставить CD, слушаю. Тут уж сомнений нет: именно первый (спутать их музыку невозможно, хотя бы по самому явному признаку: первый никогда не играл с электричеством). Радостно покупаю.\nмузыка оказалась великолепна: просто истинная отрада. Аккомпанируют ему чудо-люди: Преп.Гари Дэвис на фоно, бесподобный Биг Билл Брунзи на гитаре, а так же CharlieMcCoy (g) и Ransom Knowling (bass). Статья в буклете коротенькая, но толковая. Упоминается там и СБВ-2, присвоивший себе чужое имя. \nИтог: по дешевку купил два компакта желанной классики в хорошем качестве. А на обложке сидюка под надписью John Lee \"Sonny Boy\" Williamson красуется портрет СБВ-2. \nо, сколько нам открытий чудных..."
