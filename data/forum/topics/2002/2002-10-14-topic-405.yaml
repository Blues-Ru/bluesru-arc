    subject: Бонни хорошая..
    deleted: false
    text: "Хотя я слышала всего пару пластинок, а есть у меня только одна. Последняя. Silver Lining. Она понравилась как-то\
      \ вкрадчиво, не сразу.. но надолго.\nТак что если тоже кому-то интересно, и если вдруг кто-то этого ещё не слышал -\
      \ позвольте поделиться моей маленькой радостью.. :)\nНа днях купила John'a Hammond'a Big City Blues(1964) и Country\
      \ Blues(1965). Увидев в магазине, обрадовалась как ребенок. Отлично, просто отлично! На Country Blues он поет песни\
      \ известных старичков-классиков блюза (R.Johnson, Sleepy John Estes, Willie Harris, Blind Willie McTell, Willie Dixon\
      \ и др.)- просто превосходно! Для мальчика в возрасте 20 с небольшим (а именно столько ему тогда было) - это очень серьёзно.\
      \ Эта пластинка записана им полностью - только голос, гармоника и гитара. Иногда рука сбивается, но это даже придает\
      \ некую живость музыке. Очень прозрачно. Очень красиво. И этот голос.. Харрисовская Bull Frog Blues - просто нимазможна\
      \ хараша!\nBig City Blues - уже записана с двумя гитаристами, басистом и драммером. Гитары тут, ясное дело, уже электрические.\
      \ Одна песня собственного(Джона) сочинительства, а остальные, как водится - других отличных, всем известных авторов.\
      \ У Джона есть поразительная способность - многое, к чему он прикасается, обретает новую жизнь. Его версии самодостаточны.\
      \ Такое ощущение, что что-то испортить он в принципе не может. Очень рекомендовала бы послушать. Я, правда, эти пластинки\
      \ встретила впервые за последний год.\nА ещё (не в тему) сегодняшний Solomon Burke - просто отличный! Хоть и The Very\
      \ Best на сей раз. Вновь порадовал несказанно. И как всегда, разнообразный и разносторонний. От медленных и вкрадчивых,\
      \ до азарта а-ля Джеймс Браун (или Джеймс Браун а-ля Соломон Берк..) \nЦелый вечер радуюсь :) Любимая мною Soul Meeting\
      \ (Don Covay) тоже есть на этом сборнике. (Её, кажется, пели многие..?) Здесь это - коллективное творение (Solomon Burke,\
      \ Arthur Conley, Don Covay, Ben E.King, Joe Tex). Фантастически!\nИ ещё (на сей раз по теме) The Early Roots Of Bob\
      \ Dylan - очень приличный, милый сборник. Мне понравился. И на нем впервые услышала вещь в исполнении Blind Boy Fuller\
      \ - Step It Up And Go - прэкрасно..\nТам и Sleepy John Estes, и Mississippi John Hurt, и Blind Lemon Jefferson, Bukka\
      \ White и много кто ишчо.."
