  text: Я купил много альбомов Бонни Рэйтт и они мне нравятся. На ранних (особенно на первом) сильное блюзовое влияние и прекрасные
    составы. С ней играют Junior Wells, A.C.Reed и много других классных музыкантов. Исполняет она и традиционные блюзы; очень
    здОрово, правда. Ее игра на гитаре тоже восхитительно. Если есть возможность, послушайте ее альбомы. Удачи!
  replies:
