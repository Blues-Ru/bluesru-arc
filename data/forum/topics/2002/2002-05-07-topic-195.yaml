        subject: История с РБК
        deleted: false
        text: 'Ничего не имею против клуба, там приятный интерьер, хороший звук, живая музыка и душевная атмосфера. Совершенно
          не отрицаю, что там могут быть хорошие концерты и все такое. Дима Казанцев тут совершенно не причем, никто из музыкантов
          совершенно не обязан проявлять солидарность или от чего-то отказываться. Это личное дело blues.ru.

          Ситуация примерно такая: они нам практически сорвали очень крутые гастроли, которые мы готовили в течении полугода.
          Концерт, который стоял у них за 3 с половиной месяца сняли за три недели, когда уже поздно что-то менять или переделывать.
          Заменили на частную вечеринку, на которой собираются заработать на 300$ больше. Только потому, что ее было удобно
          устроить в тот же день. При этом, у них был единственный способ выйти из положения, сдвинув концерт Гии и Воронова,
          чего они сделать "не смогли" (а скорее не пожелали). Немного подумали и решили, что могут просто "послать нас на
          х..й". Причем, им хорошо было известно про последствия, наши материальные потери и все такое. Все хорошо взвесили.

          Теперь вы должны понимать нашу реакцию, а также эмоциональную реакцию Андрея. Тут дело даже не в обиде, а в том,
          что они "должны понять" (если это вообще возможно), что так делать дела нельзя. Соответственно, мы со своей стороны
          сделаем все, чтобы им помочь это понять. Все-таки, с blues.ru и другими нужно считаться, а такие вещи с рук не сходят.
          Соответственно, все что мы постараемся сделать, это байкотировать этот клуб в будущем, а также постараемся распространить
          эту информацию в соотв. кругах. В этом нет ничего специально для интересного и приятного, но что делать...

          А так - ничего личного, мы с ними поступим так же, как и они с нами.'
