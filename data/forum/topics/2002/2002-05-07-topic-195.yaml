  text: 'И все же там будут играть "блюзовые" группы. Нас позвали выступить там в пятницу и создать атмосферу нормального
    концерта без ощущения столовой. Столики будут частично убраны и интерьер вроде изменится.

    Вход будет бесплатным и наша задача собрать побольше друзей и подруг, тем самым показав, что еще есть возможность сделать
    клуб, подобный "Кризису жанра".

    Так что приходите в пятницу на Sky Stranger в Ритм-н-блюз кафе и там посмотрим что будет. Играть будем одно длинное отделение,
    ну а потом дискотека, естесственно. Начало в 10:30. Мы Вас ждем!'
