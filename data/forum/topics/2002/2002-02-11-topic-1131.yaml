  text: 'Попался мне пиратский диск Clarence "Gatemouth" Brown "Back to Bogalusa". Пластинка - отличная, пожалуй, лучшая на мой вкус у CGB. Там дудки, аккордеон и слайд гитаристы. В частности, Sonny Landreth, который помогал Джуниору Уэллсу на другой моей любимой пластинке Come On In This House.

    Интересно, кто-нибудь что-нибудь слышал еще хорошее у этого гитариста? Может у него какие-нибудь крутые сольные пластинки есть?

    Спасибо.'
