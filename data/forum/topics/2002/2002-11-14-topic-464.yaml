  - id: 8825
    parent_id: 8823
    date: 2002-11-14 12:09
    poster: Дмитрий(fan)
    email: leondmitr@freemail.ru
    subject: Да, C.J. был очень хорош.
    deleted: false
    text: 'Своей энергией и музыкой он зал просто "наэлектризовал". У него бедра и
      плечи так ходуном и ходили. А как он на аккордеоне-та! И группа у него в кайф,
      меня только белый лидергитарист не впечатлил. А как там пацан играл на стиральной
      доске! Вауууу.

      И кстати, кто-то говорил, что народ танцевал "невпопад". Не знаю, в Юбилейном
      в партере публика очень хорошо пританцовывала. А некоторые юные особы ну просто
      очень здорово танцевали. Причем было видно, что они пришли не просто под какую-то
      там музыку подергаться, что модерн блюз и "зайдеко" они хорошо чувствуют и просто
      кайфуют от нее.

      А потом вышел Малыш Ed и выдал настоящий драйв. Вот это мой блюз! А какой он
      шоумен! И второй лидергитарист (белый) мне понравился. А публика от них просто
      протащилась. Рядом со мной в партере стоял один парень, так он очень долго вообще
      ни танцевал, ни хлопал, в общем никаких эмоций большую часть кончцерта, а под
      Эда выдал такой вопль тарзана, что все вокруг чуть не попадали. Как говорят,
      кач пошел.

      Народу было много, партер полный, трибуны прилично заполнены, но обстановка
      была очень доброжелательная, в общем публика понравилась. Ни распальцовок, ни
      гопоты. А молодежи было много. Что очнь здорово.

      Это так, запоздалые впечатления о концерте в Питере.'
