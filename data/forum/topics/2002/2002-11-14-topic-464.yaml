    subject: Alabama Train
    deleted: false
    text: "У меня эта песня есть только в одном варианте:\nhttp://www.allmusic.com/cg/amg.dll?p=amg&uid=SEARCH&sql=A1adovwdya92k\n\
      21. Alabama Train  performed by Louisiana Red \nВходила в репертуар нашей группы\
      \ \"The Evergreens\" в 1996-1999гг. Но я вроде бы её еще помню. :-)\n\n(E) (G)\
      \ (A) (E)\nAlabama Train\nAlabama Train\nTake me home\nAlabama Train\n\nWake\
      \ up here in New Jersey\nI'm a long way from home\nAin't got nobody to love\
      \ me\nYes, I better go back home\n\nAlabama Train\nAlabama Train\nWhy don't\
      \ you take me home\nAlabama Train\n\n(solo)\n\nWay up here in New Jersey\nI'm\
      \ a long way from home\nAin't got nobody to love me\nYes, I better go back home\n\
      \nAlabama Train\nAlabama Train\nTake me home\nBack where I belong\n\nБыли у\
      \ нас сомнения по поводу первого слова в куплете. То ли это \"Wake\", то ли\
      \ \"Way\", то ли \"Wait\"... но мы решили, что в нашем исполнении это будет\
      \ не принципиальным. \n:-)\nКстати, эта песня почему-то очень понравилась военным.\
      \ :-) С этим связан один забавный эпизод (во время службы Эвергринов в армии),\
      \ но об этом пусть лучше Джон расскажет, тем более что именно он в этой песне\
      \ солировал. :-)"
