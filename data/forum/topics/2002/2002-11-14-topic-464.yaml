        трейн и Хучикучимен. Хучикучи любили, потому что им было сказано, что песня
        про настоящего полковника. Алабаму трейн - за железнодорожную тематику. Но
        старшему и среднему комсоставу было очень сложно запомнить название Алабама
        трейн, поэтому каждый раз, наливая нам по полстакана (меньше там не пьют),
        они говорили так: "Сделай, как там этта - "Экспресс на Лондон". Ура!"'
