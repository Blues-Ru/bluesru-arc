    text: 'мне рассказал немного другую историю...


      Точнее, он просто филосовствовал на тему того, а что собственно публике нужно.

      Жук - прекрасный клоун, кому-то это нравится, тебе нет. Взял да заиграл на клавишах; а что делать, нет у нас клавишников-то.

      Саша Никишин - клевый чувак, но не певец и не "блюзмен", тебе опять не нравится, а многие его именно за это и любят.

      Юра (басист) - звезда из группы "Детский Панадолл", но типа играл не в кассу, а где она касса-то?

      На барабанах великолепный Севастьянов - истинный хард-рокер, но вынужден играть всякую "пафну" типа джаза и блюза, чтобы выжить.

      Выходит кто попало на сцену на всех джемах, и это нельзя контролировать. По этой причине я не хожу на джемы.

      Вот все очень любят как поет Юля, но она же просто не умеет петь! Неужели этого не слышно? Но НАРОДУ-то нравится, Андрей. Так что не ищи на джемах того, чего там быть и не может.


      У каждого тут свое понятие о том, что есть хороший клубный блюз и как он должен петься и звучать. Смысл в том, что большинство групп и исполнителей не имеют никакого отношения к блюзу вообще, и занимаются этим лишь потому, что за это платят хоть какие-то деньги. Ну нравится в наших кабаках слово БЛЮЗ, а знать что это такое никто и не знает. Попробый выйди с акустикой и поиграй народу Джонсона или Мадди, сразу помидорами закидают и из клуба выгонят. Не так что ли? Так что Никишин и Ко. делают то, что нравится им самим и иногда нравится НАРОДУ. А иногда и не нравится.'
