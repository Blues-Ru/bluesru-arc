                        text: "Андрей, я слово \"мэтр\" употребил безо всякого подтекста и левого контекста. Мы тебя знаем и уважаем именно как авторитетного музыкального критика и журналиста. Но ты всё больше специализировался на обозрении того, что \"у них\", а нашей песочнице ой как нужна профессиональная журналистика разных уровней - событийная, аналитическая, персональная. (Какие ещё виды бывают?) \nМы же, находясь внутри процесса, в соответствии с известной теоремой Гёделя о неполноте, не можем определить тенденции, куда движется наша бодрая комьюнити. Всегда нужен некто, кто наблюдает за этим со стороны и немного сверху. Чтобы лучше видно было."
