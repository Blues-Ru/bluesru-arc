                  subject: А я поддерживаю Дмитрия, хотя и против Юрия выступать не намерен.
                  deleted: false
                  text: "И про Грушу, и про Гелюту - все правда. Жаль, что Груша так редко джемует - он и сам классный, и аккомпаниатор чуткий. Жаль, что Гелюта так часто теперь джемует (Алексей, вот тут я тебя не поддерживаю). Мне доводилось слышать и отличные соло Гелюты, но аккомпанировать он не умеет напрочь. И самое худшее: в тот вечере, когда его расколбасит, джем можно считать законченным. Джем в Экспате (с которого фотки), он портил больше, чем подсирающий усилок. Когда ему пришлось уступить гитару - полез блякать (а не играть) на клавишах. Остановить его было невозможно, на прямые просьбы отдохнуть он не реагировал, влезал в довольно деликатные песни, подолгу угадывая(!) тональность; а уж в стиль он никак не мог попасть, поскольку стиль у него один: Гелюта, называется. \nПроблема московских джемов самая примитивная: толпа солистов при отсутствии действительно профессиональной ритм-секции. Изображать соло на гитаре умеют многие, играть ритм на той же гитаре умеют единицы. \nНу и, я не согласен, что джемующий может выйти и \"заказать\" хаусбэнду стиль... Лучшие джемы, которые я слышал, \"дирижировались» лидером хаусбэнда. Звезды калибра БиБиКинга умеют слушать безвестных молодых музыкантов, которые выходят с ними на одну сцену, стремятся поддержать разволновавшегося гостя и руководить бэндом так, чтобы организовать общую ансамблевую игру. Напротив, по частному моему разумению, солисты наших хаусбэндов считают чужое соло чем-то вроде законного повода to have a break. Мало кто слушает друг друга на джемах, и, за исключением Братецкого и Жука, никто даже не пытается наладить какое-то взаимодействие между участниками джема (ведь interplay между солистами разных бэндов и есть самое интересное в джеме). \nPS. А вообще, приятно ругаться на джемы… Потому, что есть на что… раньше-то не было. :)"
