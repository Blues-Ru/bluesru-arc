    subject: А вот у меня вопрос
    deleted: false
    text: Док, а почему все время проблемы со звуком? Я ни разу не слышал, чтобы ты
      сказал, что звук был приличным. Это что, рок такой? Или блюз такой? ;)
    replies:
    - id: 6417
      parent_id: 6402
      date: 2002-07-29 13:44
      poster: Алексей Аграновский (Док)
      email: aaa@genebee.msu.su
      subject: А вот у меня ответ
      deleted: false
      text: "К \"блюзу\" и \"року\" это отношения не имеет. Скорее к психологии. Когда\
        \ я честно замечаю, что звук был проблемный, или что на джем пришли громкие\
        \ музыканты - это откладывается у тебя в памяти как минус. А когда не пишу\
        \ про звук (норма и есть норма, чего тут), то впечатления не откладывается\
        \ никакого. Что побеждает в воображении при сложении? Правильно. Вернее, ерунда\
        \ это все. Ведь \"норма\" и \"проблема\" - часто составляющие одного гига.\
        \ В Экспате, если уж все говорить как есть, звук выровняли, и были моменты\
        \ и выступления, ради которых все и делается. \n    Тут если и есть проблема,\
        \ то более общая. Нужно ли вообще описывать словами происходящее на джемах\
        \ и концертах? Нужно ли это обсуждать в сети? Может статься, что и не надо."
