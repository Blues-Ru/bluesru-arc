        text: "Мне показалось, что местный звукооператор просто не имеет навыка выставлять\
          \ звук для живого музицирования. Все инструменты были включены в комбики,\
          \ которые потом транслировались через портал. \nКроме того, проблема большого\
          \ зала, разделённого лестницей, ведущей вниз, куда сваливались клиенты заведения\
          \ и низкие частоты.\n\nЗвук был вялый и неплотный, баса не слышно, гитара\
          \ вместо приятных нашему блюзменскому уху плотных, но мягких средних частот\
          \ с чистыми верхами, выдавала \"звук струи кислого молока, падающей с высоты\
          \ одной мили в жестяную кастрюльку\" (вроде по О\"Генри, за точность цитаты\
          \ не ручаюсь), драйв в результате не получался.. только под конец джема,\
          \ когда пользуясь попустительством оператора, музыканты выкрутили ручки\
          \ комбиков до отметки 10, стало хоть что-то слышно.. в трех метрах от сцены,\
          \ не более.. \n\nАлексей, а обсуждать нужно и надо, потому что форум - среда\
          \ профессионального общения. Иначе превратимся в Общество Взаимного Восхищения.\
          \ Или наоборот. Но в любом случае я против фигур умолчания. Извини меня,\
          \ любителя."
