  subject: Хотели ревью? Вот Вам... Leadbelly!!!
  deleted: false
  text: "Впервые пишу альбомное ревью, которое будет опубликовано, поэтому страшно волнуюсь. Хочу написать о диске человека,\
    \ известного под именем Лэдбелли. Все детали у Пескаря на сайте.\n\nLeadbelly (Includes Legendary Performances Never Before\
    \ Released) (Columbia CK 30035) 1990\nВыходил на Capitol в 1962 и на Columbia в 1970.\n\nAlbum cover \nhttp://image.allmusic.com/00/amg/cov200/drc500/c584/c58465vg73k.jpg\n\
    \n01. Roberta, Pt. 1 (Leadbelly/Ledbetter/Lomax/Lomax) - 2:57\n02. Roberta, Pt. 2 (Leadbelly/Ledbetter/Lomax/Lomax) -\
    \ 3:02\n03. Packin' Trunk Blues (Leadbelly/Ledbetter) - 2:53\n04. C.C. Rider (Leadbelly/Ledbetter/Lomax/Lomax) - 2:57\n\
    05. You Can't Lose Me, Charlie (Leadbelly/Ledbetter/Lomax/Lomax) - 2:57\n06. Black Snake Moan (Leadbelly/Ledbetter) -\
    \ 3:10\n07. Alberta (Leadbelly/Ledbetter) - 3:05\n08. Baby, Don't You Love Me No More (Leadbelly/Ledbetter) - 2:50\n09.\
    \ Death Letter Blues, Pt. 1 (Leadbelly/Ledbetter/Lomax/Lomax) - 2:59\n10. Death Letter Blues, Pt. 2 (Leadbelly/Ledbetter/Lomax/Lomax)\
    \ - 2:59\n11. Kansas City Papa (Leadbelly/Ledbetter) - 2:48\n12. Red Rover (Ledbetter) - 2:59\n13. Blind Lemon (Ledbetter/Lomax/Lomax)\
    \ - 3:03\n14. Mister Tom Hughes' Town (Leadbelly/Ledbetter/Lomax/Lomax) - 3:02\n15. Match Box Blues (Leadbelly/Ledbetter/Lomax/Lomax)\
    \ - 3:02\n16. Bull Cow (Leadbelly/Ledbetter) - 2:43\n\nНачать надо, пожалуй, с того, что этот альбом составлен из первых\
    \ коммерческих записей Лэдбелли. Все треки на альбоме записаны в 1935 году с помощью и под продюсированием знаменитых\
    \ братьев-фолклористов Алана и Джона Ломмаксов. Они записывали его и раньше, когда он находился в тюрьме \"Ангола\", но\
    \ это были некоммерческие работы для Библиотеки Конгресса США.\n\nСтоит отметить отличное качество звука на диске. Видимо\
    \ и изначальные пластинки были прекрасно записаны, а также был сделан отличный цифровой ремастеринг и чистка. Вообще,\
    \ альбом звучит ровно, будто составляли его как концептуальную пластинку. Длина диска около 48 минут, слушается это очень\
    \ динамично и неутомительно.\n\nИ так, к музыке. \nАльбом начинается с двух частей яркого и динамичного блюза Roberta.\
    \ Сразу чувствуется сильное влияние Блайнд Лемон Джефферсона на Лэдбелли. Четкая риффовая игра на гитаре и резкий вокал\
    \ сразу оставляют яркое впечатление. Roberta - это \"родная сестра\" таких вещей как Alberta или Corrina, Corrina; женское\
    \ имя и вопрос о том, куда же она подевалась.\nPackin' Trunk Blues - еще один блюз, соджержащий в себе рэповый запев и\
    \ припев, похожий на Match Box Blues. К третьей вещи на альбоме кажется, что Лэдбелли являлся чистой воды блюзменом; мы\
    \ же знаем, что мир запомнил его, скорее, как фолк музыканта или сонгстера.\nC.C.Rider - одна из самых исполняемых вещей\
    \ среди блюзовых, джазовых и даже рокабилльных музыкантов! Заметьте, это уже третий блюз на альбоме, и как не странно\
    \ все они абсолютно разные по форме. Многие недолюбливают блюз, особенно ранний, за его однообразие и отсутствие развития.\
    \ Здесь же видно, что Лэдбелли старался исполнять композиции в разных стилях, используя шести- и двенадцати-струнные гитары,\
    \ импровизируя в разных стилях и применяя различную вокальную технику.\nYou Can't Lose Me, Charlie - наконец-то \"неблюзовая\"\
    \ композиция. Шикарная вещь во всех отношениях. Видна связь через стиль с Миссиссиппи Джон Хертом и Блайнд Гари Дэвисом.\
    \ Отличная мелодия и ритмика, просто хит тех лет! \nBlack Snake Moan - опять по блюзу! Снова рифовая игра, длинная первая\
    \ нота в вокале, но совсем другое впечатление, чем от Роберты. Фраза 'Ooh, I ain't got my mammie now!' пробирает меня\
    \ до костей! \nAlberta - блюз в том же стиле, что и Роберта, но другая игра и совсем другое пение. Существует несколько\
    \ вещей с этим названием и все они разные. Эта, пожалуй, самая драматичная из всех.\nBaby, Don't You Love Me No More -\
    \ начало напоминает Sweet Home Chicago, но потом хитрые повторы и много рэпового пения. Заглавная же мелодия великолепна\
    \ без изъяна. Опять блюз, как это не удивительно.\nDeath Letter Part 1&2 - две части повествовательного и достаточно трагичного\
    \ блюза. Возможно, одну часть можно бы было опустить. Уже тут фраза 'You don't miss you water til' your well runs dry'\
    \ - позже появилось несколько вещей с таким названием.\nKansas City Papa - еще один блюз про знаменитый город. Не путать\
    \ с Kansas City Blues, исполняемый практически всеми блюзменами.\nRed Rover - не самая яркая блюзовая вещь у Лэдбелли,\
    \ но масса драйва в вокале.\nBlind Lemon - блюз-посвящение его другу и кумиру Лемону Джефферсону. История с огромным количеством\
    \ текста и рассказов о личной жизни Блайнда. Слышно интересное цитирование Лемона на гитаре на протяжении этого трека.\n\
    Mister Tom Hughes' Town - прекрасный блюз в быстром темпе. Здесь рассказ о Щревепорте, Луизиана, где Лэд провел свою юность\
    \ и успел завоевать дурную репутацию, бросая своих девушек, зачастую уже беременных.\nMatch Box Blues - настоящий хит!\
    \ На ряду с C.C. Rider, один из самых исполняемых блюзов в истории музыки. Здесь прекрасно все!\nBull Cow - еще один яркий\
    \ и интересно сыгранный блюз; и вокальная и гитарная партии сильно отличаются от остального материала на этом альбоме.\n\
    \nЧто же у нас получается? Из 16 вещей 15 блюзов! И это Лэдбелли, спросите Вы? Да, это он. Может быть в своей не самой\
    \ лучшей форме, только что вышедший из тюрьмы, рэпующий слишком часто из-зи огромного желания донести до слушателя все,\
    \ что он пережил. Тем не менее, я бы поставил этой пластике 9 баллов из десяти. Можно бы было обойтись и без двух частей\
    \ в двух вещах, альбом бы был короче и еще более ярче. \n\nЛучшие песни: You Can't Lose Me, Charlie и Baby, Don't You\
    \ Love Me No More.\n\nСпасибо за внимание.\nПрошу высказывать мнение."
