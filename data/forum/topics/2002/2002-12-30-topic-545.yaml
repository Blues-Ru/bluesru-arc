  text: 'Выхожу из эфира (т.к.Инет только на работе) числа до 5-го января.

    Поэтому заранее хочу всех поздравить с наступающим Новым Годом!

    И пожелать в первую очередь Здоровья и Мира.

    С миром понятно. Будет война, ничего не будет. Сказать тут больше нечего.

    А здоровья. Тут тоже понятно.Даже дело не в том, что "будэт здоровье, - осталное
    купым", а при отсутствии оного ничего другого просто не хочется... Так вот, чтобы
    оно у всех вас было.

    Ну и всем удачи, счиястия, любви.

    Спасибо всем за общение на Форуме. Хочется, конечно, вживую, но не получается.
    О блюзе кроме как с вами говорить не с кем да и некогда...

    И еще всем хороших джемов, концертов, инструментов, новых дисков своих и чужих!

    С Новым Годом!'
