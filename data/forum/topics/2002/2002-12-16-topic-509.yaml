  text: "Зашел как-то в Хельсинки в гамазин, увидел там интересный сидюк - http://www.amazon.co.uk/exec/obidos/ASIN/B00000K1KS/qid%3D1010771945/sr%3D1-5/ref%3Dsr%5Fsp%5Fre/202-1806984-9573432\n\n - довольно интересная \"заблюзованная\" перепевка зеппелиновских вещей, что называется с душой.\n\nНо к сожалению, меня почему-то задушила жаба его купить, о чем я неоднократно пожалел, однако в следующий раз сидюка в магазине не было.\n\nСамое интересное - оно якобы есть и на пурпурном легионе, и на озоне, однако же они тянут кота за хвост вот уже 3 месяца - по всей видимости, есть он у них только номинально - по этой же причине стремно заказывать на амазоне.\n\nМожет быть, кто-то видел его живьем где-то в Питере, ну или на худой конец, даст его списать? :)\n\nсенькс ин адванс,\nГарик"
