  text: 'Я тут задался вопросом...

    Вот в чём фишка: как-то Хендрикс взял да и записал альбом под названием ''Blues" и там он сыгал " Hear my train a''comin''"
    и сдаётся мне, что это был единственный раз, когда он записал его в аккустическом варианте. А не кисло знаете ли получилось,
    электрический вориант этого дела мне нравится гораздо меньше. Так вот мне интересно: это действительно единственная запись
    аккустического варианта этой песни? И ещё, здесь есть кто-нибудь, кто слышал, как Джими исполняет Knockin'' on Heavens''
    Door Дилана?'
