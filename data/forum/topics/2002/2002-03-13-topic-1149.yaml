                deleted: false
                text: 'Не то, что надо платить - это-то ясно, а то, что цена бывает очень разной. Говоришь им о цене трафика в России - у них волосы дыбом встают. Для них сеть, действительно,- как телефон или водопровод. Тридцать (или сорок - с арендой оборудования) баксов абонентской платы - и все богатства мира у твоих ног. Трафик - не лимитирован. Когда-то провайдеры пытались вводить ограничения (смешно - только _на_аплод_!) - кто-то запрещал запускать сервера (но быстро прекратил эту практику, получив несколько проигрышей в судах), кто-то ограничивал исходящий трафик пятьюстами мегабайтами _в_день_ (повторяю, входящий - никогда не лимитировался), но сейчас все провайдеры просто зажали аплод на 128kbps и более ничего не лимитируют.

