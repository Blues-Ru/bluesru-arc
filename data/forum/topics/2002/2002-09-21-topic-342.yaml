  deleted: false
  text: 'Прошу прощения у уважаемого собрания, но вынужден пойти на нарушение правил и использовать возможности форума в личных целях. Правда, надеюсь при этом на Ваше понимание - произошла неприятность.

    Вчера поздно вечером, возвращаясь домой, оставил в подвозившей меня машине портфель. В нём - помимо всего того, с потерей чего можно смириться - ряд бумажек, представляющих некоторую личную ценность (и, кстати, несущих информацию обо мне - вплоть до адреса и телефона и других подробностей), а самое главное - аккумулятор для ноутбука, который я сегодня должен был передать в Питер одному хорошему человеку. Чужой, по сути дела. Да и сам портфель жалко - это подарок близкого человека.

    Водитель пока не звонит.

    Так что, уважаемые жители Москвы и области, если у кого есть знакомый лет сорока - сорока пяти, владелец или водитель красных Жигулей какой-то не новой модели, внезапно обзаведшийся в эти дни большим не новым чёрным портфелем Ferre - спросите у него, а не найденный ли он. Может быть, он ещё не потерял надежду вернуть его и содержимое владельцу, т.е. мне.

    Всем заранее спасибо.'
