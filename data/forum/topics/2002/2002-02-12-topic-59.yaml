    text: "и достаточно долго. с конца пятидесятых Мадди приглашал группу Баффорда \"Savage Boys\" подменять его концерты,\
      \ когда сам Мадди уезжал из Чикаго. Баффорд подражал манере пения Мадди, и как-то так случилось, что он приобрел прозвище\
      \ Muddy Waters Junior, а \"Savage Boys\" стали именоваться \"Muddy Waters Junior Band\" (siс!). Как к этому относился\
      \ сам Мадди? я не знаю. В книге Deep Blues этот феномен даже не упоминается. но есть книга о Мадди The Tooze - там говоится,\
      \ что Мадди поддерживал группу Баффорда, рекламируя их концерты в своих радиопрограммах. \nКогда Коттон покинул блюзбэнд\
      \ Мадди, его место занял Баффорд. Однако, расхваливая таланты Баффорда в своих интервью, Мадди почему-то :) избегал\
      \ записываться с ним в студии, приглашая с гармоникой своих старых товарищей: Коттона чаще всего, или Уэллса. Игру Баффорда\
      \ в блюзбэнде Мадди можно послушать на парижском концертнике Мадди 1972 года. А еще в 1967 году бесподобный Мадди записал\
      \ альбом, на котором он акомпанирует(!) своим сайдменам: Mud In Your ear. Там Баффорд солирует довольнго много. С некоторыми\
      \ антрактами, Баффорд проиграл в блюзбэнде до кончины Мадди (хотя в последние годы Мадди чаще работал с Джерри Портным).\
      \ \nТак как баффордовский сольник-то??"
