            text: "- это как раз прозорливый блюзовед, блестящий журналист, ученый музыковед... Умер от цирроза печени. или\
              \ что-то из этого рода, увы.\n    Человек, который любит блюз и знает английский в объеме, достаточном для чтения,\
              \ перечитывает Deep Blues как минимум раз в год. Если не перечитывает, но любит блюз - значит, не знает английского.\
              \ Если знает английского и не перечитывает - значит, не любит блюз. :)\nну а певец - это его тезка и однофамилец.\
              \ \nДискографии Мадди Уотерса у меня имеются - во всех умопомрачительных подробностях. \nЗаписи до первого альбома\
              \ считаются классикой. Хотя среди самых первых записей были очень смешные. :)\nНомерные альбомы-шедевры? sings\
              \ Big Bill Broonzy, At NewPort и Folk Singer. Но для Мадди формат альбома не был фетишем. Он всегда записывал\
              \ песни. а песни по воле обстоятельств потом складывались в альбомы, сборники, или \"номерные\".\nHoochie Coocjie\
              \ Man и Blue Sky - адекватные, практически, исчерпывающие сборники по четырм последним альбомам (с Винтером).\
              \ \n\nСборникам несть числа. Я заглянул на CDnow: только в прошлом году вышло 9 новых альбомов. ни к одному\
              \ из них нет комментариев, что внутри? Бог весть. \n\nПоследний сборник, получивший хороший рецензии: Rollin\
              \ Stone-Golden Anniversar.\nГде остановится? это уж каждый сам себе решит."
