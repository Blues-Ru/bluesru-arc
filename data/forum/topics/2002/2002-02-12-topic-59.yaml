        \ Mud'). Вот чего у меня нет:\n\"Unk\" In Funk - 1974\nCan't Get No Grinding - 1974\nFathers And Sons - 1969\nAfter\
        \ The Rain - 1969\nThe Super Blues Band - 1968\nSuperblues - 1967\nMuddy, Brass And The Blues - 1967\nThe Real Folk\
        \ Blues - 1966\nMuddy Waters - 1964\nThe Best Of Muddy Waters - 1959\nНе мог бы ты в двух словах описать и посоветовать\
        \ из этих альбомов. \nЗаранее спасибо!"
