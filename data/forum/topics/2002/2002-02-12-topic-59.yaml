    text: "вроде написано что играл... хотя я ни разу не видел его фамилии в альбомах тех периодов, когда он с ним играл типа\
      \ - тогда самые \"громкие\" записи делались с такими харперами как Коттон, Ошер, Бэлл... Может то были действительно\
      \ туры, записи которых до нас не дошли. Вообще обожаю Мадди за то, что он открыл столько именитых харперов ;)\nА краткую\
      \ историю Buford'а читай сам:\n============\nBest known for having played with Muddy Waters, Mojo Buford was born in\
      \ 1929 in Hernando, Mississippi. He learned the harmonica from his father and also sang in the church choir when he\
      \ was young. At 14, he moved to Memphis, where he met B.B. King and other blues players, and started soaking up the\
      \ music in the local blues scene. \nAfter a decade in Memphis, his ambitions shifted to playing in Chicago, and in 1954\
      \ he arrived in the Windy City. He formed a band with drummer Sam\n\nBurden and guitarist Dave Members and the trio\
      \ called themselves \"The Savage Boys\". They eventually got to know Muddy Waters, who began booking them as \"The Muddy\
      \ Waters, Jr. Band\" at local venues when he was playing out-of-town gigs.\n\nBuford played with Muddy in 1962, 1967-68,\
      \ and 1971-72. During the 67-68 period he toured the U.S., Canada, Australia, England, and Europe with Waters, and also\
      \ recorded live with him.\n\nAfter his stints with Muddy, he moved to the Minnesota’s Twin Cities area, where he got\
      \ the name \"Mojo\" - the fans at a St. Paul barbecue bar couldn’t get enough of his playing on \"I Got My Mojo Working\"\
      - and the moniker stuck. Buford currently divides his time in between Minneapolis and Memphis and has been singing for\
      \ James Cotton of late.\n============\nПо этой ссылке много чего о сабже найдешь:  http://www.google.com.ru/search?q=MOJO+BUFORD+&hl=ru&btnG=%CF%EE%E8%F1%EA+%E2+Google\n\
      И самое главное - ну и как альбом то?"
    person_id: 26
