        subject: авек плезир
        deleted: false
        text: "только я не принимаю слова \"отстой\" по отношению к записям Мадди. Для меня это просто не лучшие его работы.\
          \ :) надо понимать, что под руководством Маршалла Чесса все на фирме развалилось стремительно. А маршалл уверял\
          \ артистов, что это их вина, что они отстали от времени и навязывал им аранжировки, которые, по его мнению, соответствовали\
          \ моде. Так появился Отис Спэнн, играющий на клавесине! и прочие чудеса, вроде электрического мада и психоделического\
          \ вулфа.\n \"Unk\" In Funk - 1974 Can't Get No Grinding - 1972! я бы не стал рекомендовать. Да и никто, кажется,\
          \ не станет. Последний - это на 80%напрасное перепевание старых песен в новых противных аранжировках.\nFathers And\
          \ Sons - обычная история: белые звезды и черный пра-отец. Недурно, любопытно. но не мое.\nAfter The Rain записан\
          \ подряд (кажется через месяц после) 'Electric Mud' - тот же принцип и тот же результат.\nThe Super Blues - великолепный\
          \ бардак, устроеный в студии Мадди, Бо Дидлли и Литл Уолтером. Все сыграно криво, типичная халтура. Мне очень нравится\
          \ :) Заметно, что Литл Уолтер отстает от сотоварищей, и это грустно. Ни в коем случае не для начинающих. Но кто\
          \ уже проникся маддиевским блюзом, получит массу веселья.\nMuddy, Brass And The Blues - название говорит само за\
          \ себя. Не лучшая, но и далеко не плохая работа.\nThe Real Folk Blues - сборник, разумеется. В нынешнем году выходит\
          \ на одном компакте спаренный вариант The Real Folk Blues и More Real Folk Blues, отремастированный. \nЧто такое\
          \ Muddy Waters - 1964 - я не знаю. В чессовской дискографии такого альбома нет.\nThe Best Of Muddy Waters - 1959\
          \ - первый LP Мадди, собранный из первых синглов. Классика.\n\nСборников полно. у меня есть чессовская коробка из\
          \ трех сидюков. Она дает полное представление о классическом периоде мадди, плюс сносные образцы времен заката Чесс.\
          \ Это и есть лучший сборник. И либо, послушав это, кто-то решит, что ему хватит, достаточно - так тому и быть. Либо\
          \ решит, что нет, давай еще все, что есть - и тогда начнет собирать все альбомы подряд! \n\nДима, с твоим мнением\
          \ о последних альбомах Мадди (с Уинтером) я не согласен. Там есть настоящие шедевры. \n\nИ, поскольку тут вроде\
          \ как не рекомендуются работы Мадди начала 70-х, я хочу указать на недавно опубликованные Lost Tapes - концертные\
          \ записи 1971го года. Великолепная работа самого Мадди, без чессовских советников. рекомендую от души: это мощно,\
          \ выразительно! И никаких следов \"кризисности\" . а тем более, что там и видео прилагается."
