          text: "Да мнение мое скорее о звуке и тяжести, нежели о филе. Все три альбома на Blue Sky у меня есть и я доволен.\
            \ Woodstock Album и London Sessions тоже есть. Есть и отличное издание The Folk Singer. И еще совковый винил с\
            \ неплохой подборкой.\nКак я понял мне нужен тот сидюк где 2 в одном и еще пару номерных, и будет достаточно?\
            \ \nА вот тебе инфа об альбоме Muddy Waters 64 (Pye International - Chess).\n1. I got my brand on you; 2. Baby,\
            \ please don't go; 3. Tiger in your tank; 4. I've got my mojo working (part 1); 5. Goodbye Newport blues; 6. The\
            \ same thing; 7. Sittin' and thinkin'; 8. 19 years old; 9. I'm your hoochie coochie man; 10. Soon forgotten; 11.\
            \ I feel so good; 12. I've got my mojo working (part 2); 13. Long distance call; 14. Wee wee baby; 15. Clouds\
            \ in my heart.\nВот что это за альбом?\nУ меня ведь есть книга, в которой выписаны все его синглы, начиная с Gypsy\
            \ Woman/Little Anna Mae 48 года на 78 оборотов еще. Их там тьма до его первого лонгплея. Это все вышло на сборниках\
            \ или опять забыли что-то? Если надо не поленюсь все выпишу.\nСпасибо, хочу разобраться и все купить ;)))"
