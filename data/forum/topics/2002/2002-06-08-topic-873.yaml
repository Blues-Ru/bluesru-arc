              text: "Вы обиделись, не поняв абсолютно, что я имела ввиду :) Честное слово, не стоило. Я тогда говорила не\
                \ о клезе - я достаточно большая девочка, чтобы не открывать такие письма. Я вела речь о взломке. И понять,\
                \ о чем я говорю, могут только следующие люди: 1)тот, кто это сделал, 2)я сама, и 3)тот человек, что помогал\
                \ мне потом это разгребать. Без обид и подозрений, плиз :) Просто я не могу пока вычислить того, кто это делает,\
                \ а иного места общения с ним (некто \"оно\")  у меня, к сожалению, не было - адрес зацеплен был с форума.\
                \ \nВот такие дела.. \nА про адресную книгу - так письма с клезом приходили ко мне от имени разных адресатов\
                \ с форума, с кем я никогда не переписывалась. А, соответственно, их нет в адресной книге. Равно как и адресной\
                \ книги у меня нет :) И я никого никогда не подозревала из них, конечно же. Так что вопрос действительно к\
                \ специалистам - каким образом это рассылается. И если всех это - рассылка писем с клезом - так достало и\
                \ измучило, то может, найдем уже какое-нить общее средство - какой-нить \"комбат\" :)\nИ вот что забавно -\
                \ темы писем иногда ну очень в кассу бывают :)) Значит, у машины появился интеллект :) Люди, не ставьте систему\
                \ \"умный дом\", а то ваш холодильник однажды за вас всё решит раз и навсегда :))"
