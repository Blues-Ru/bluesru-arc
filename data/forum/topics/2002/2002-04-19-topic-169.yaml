  text: "никто ничего не написал про джем в БиБи. \nА было там очень даже хорошо в этот раз. Ваня блистал и не хулиганил, Кожекин дул ярко и интересно. Бардака почти не было и была теплая и веселая атмосфера. Я еще раз пожалел, что забыл вызвать Виноградова на джем с Др. Ником - он очень здорово сыграл.\nСтильно, но без эмоций пела Тамара. Мне кажется ей нужна другая публика и атмосфера.\nВова Русинов играл на чистом звуке без всяких обработок и это было интересно и как бы правильно. Мне понравилось. Цыганков играл очень здорово, но его было плохо слышно. Мажуков - это не просто хороший рок-н-ролльный пианист, он прекрасно владеет и другими \"звуками\" в другой музыке. Hats off to Denis (только рожа у него всегда недовольная).\nЯ не знаю как я сыграл сам, но мне пришлось вызвать на сцену странных парней из Африки, которые бодро и громко играли на перкуссии. Потом, со стороны мне понравилось, хотя, конечно, это были не Пераза и Реков.\nМиша Владимиров играл тонко, но как всегда тихо и нединамично, он сам так хочет оказывается. Видимо, не хочет быть похожим на остальных московских харперов.\nОчень понравился Гия своей энергией и драйвом. Хоть динамикой там и не пахнет, но все остальное на месте. Драйв и понимание делают свое дело. Воронина играл интересно и вкусно, хотя и была лажа со звуком (ну это как всегда).\nКороче, мне джем понравился и я буду ходить еще (это был мой второй раз).\nС ритм-секцией у Жука по-прежнему проблемы. Драммер играет как по п.... ладошкой, а басист просто не читается и неритмичен, но все же это лучше, чем было раньше.\nУра таким джемам, ибо там была музыка. Жаль только они сыграли Help Me и I'm Ready в самом начале, я очень хотел попеть и поиграть в них (но сыграли здорово).\nПишите свои мнения, там же было полно народу.\nПривет Yodes! Rock'n'roll isn't dead, it's just dying."
