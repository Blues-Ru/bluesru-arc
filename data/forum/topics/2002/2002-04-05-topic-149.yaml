            text: "Во всяком случае, В ЦДХ не надо будет сетовать, что кто-то пьет, а кто-то жует - настоящий концерт. А вот в Таксмэн идти незачем: учитывая специфику заведения, это будет \"танцевальная программа\" на 45 минут. (администрация просила не более одной медленной вещи и никаких инструменталов :) \nMobile Blues Band, действительно, \"звезды из Тбилиси\". Но между нами, Федор, я думал, ты в крусе, что они давно уже вписались в европейский клубный блюзовый круг (участники прошлогоднего Нутодденского блюз-фестиваля, на минуточку) - такого не удавалось никому из \"постсоветсткого пространства), и хотя бы из любопытства их послушать можно. Они энтузиасты того \"чисто\" белого блюза, который мне лично не близок. Однако бесспорно это очень высокий класс игры - иначе в Европе не выжить. Что касается энтузиазма - это они приволзили в Москву на свой страх и риск Элвина Ли... тоже на мой взгляд говорит само за себя."
