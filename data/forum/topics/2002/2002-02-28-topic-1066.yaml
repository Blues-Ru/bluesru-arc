        text: 'Все что здесь будет написано - исключительно моя точка зрения. :)))

          Александр Ляпин - отличный гитарист. Не закомплексован ни на одном стиле музыки. :) Может великолепно сыграть и
          блюз, и рок, и джаз.

          Сейчас у него собственный сольный проект "Lyapin''s Blues", в котором играет ритм-секция В.Белинова. Играют они
          сейчас произведения Хендрикса, Клэптона и ессно А.Ляпина. :))) По поводу его мастерства могу заметить только то,
          что на концерте памяти Джими, в С-Петербурге, кроме него никто по НАСТОЯЩЕМУ и не сыграл, хотя было достаточно групп...
          Не так давно (не знаю как в Москве) он выходил на сцену вместе с "Аквариумом" на пару песен.

          Увидеть и услышать его можно во Дворце Молодежи в С-Петербурге.

          ПыСы: его гитарное соло из "Рок-н-ролл мертв" преподают во многих музыкальных гитарных школах наряду с "Smoke On
          The Water". :))) Информация со слов знакомых, но, мне кажется, вполне достоверна. :)))'
