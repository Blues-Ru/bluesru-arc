  text: "Вот держу в руках первый альбом Майти Джо Янга \"Blues With A Touch Of Soul\" (Delmark 1970). \nНаверное он слабее его второго альбома из серии \"Legacy Of The Blues\", но присутствие на нем атмосферы блюза 50-х/60-х очень приятно.\nЯ не согласен с рецензией на Allmusic: \nhttp://www.allmusic.com/cg/amg.dll?p=amg&uid=12:40:00|AM&sql=A96rsa9cgy23u\nТам все гораздо лучше.\nИнтересно послушать его работы 70-х с высоким рейтингом на AMG. Есть что-нибудь у форумчан?"
