  text: "Случайно обнаружил ссылки на двойной альбом Corey Harris \"Live At Starr Hill\", выпущенный на лейбле Njumba. \n\n\
    Вот инетная ссылка: http://www.baddogblues.com/archives/4.02/reviews.htm. Www.allmusic.com пока молчит. А вот, что по\
    \ этому поводу пишет \"Jazz-квадрат\" №4 сентябрь 2002 г.: \"Она (вторая часть альбома)представляет собой дикую помесь\
    \ собственно электрического блюза, рэгги африканской музыки, психоделики, жутких гитарных искажений и полиритмической\
    \ перкуссии. ... Зато первая часть - просто акустическая гитара, слайд и вокал\" Что же это: логическое продолжение линии\
    \ специфического \"Downhome Sophisticate\"?. \n\nНе сомневаюсь, что альбом не менее интересный, чем предыдущие работы\
    \ Harris'а. И всё же... может, кто-нибудь слышал его вживую?"
  replies:
  - id: 9020
    parent_id: 9017
    date: 2002-11-27 00:35
    poster: Михаил Бирюков (nECKAPb)
    email: blackcat@blues.ru
    subject: что значит вживую?
    deleted: false
    text: 'Альбом слышали, это двойной концертник. Первый диск акустический (если слышали первые два альбома, представляете,
      какой примерно - на мой взгляд, очень сильный), второй - электрический, в манере Greens from the Garden. Вышел Live
      at the Star Hill до Downhome Sophisticate, записан соответственно ещё раньше. Посему Ваше логическое построение касательно
      преемственности между работами Харриса - неверно.

      Распространяется альбом только через вебсайт Харриса, но всячески заслуживает приобретения.'
