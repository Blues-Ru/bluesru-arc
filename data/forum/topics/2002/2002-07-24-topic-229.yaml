    text: "о ком мы там еще не оффтопили... :) \nа ну да, о... Питере Гэбриэле... так вот, прикупил я тут значит альбом его\
      \ новый, являющийся саундтреком к одному австралийскому фильму, \"Long Walk Home\", открываю буклет и читаю credits..\
      \ и среди прочих вижу The Blind Boys Of Alabama (C.Fountain, J.Carter, Eric McKinnie, etc)... Слушая альбом, пытался\
      \ понять где же они там \"участвуют\", так и не понял.. Вообще Гэбриэль молодчина по части составления \"звездных\"\
      \ списков на развороте обложек дисков, выпускаемых его лэйблом - в частности на этом альбоме участвуют столько разного\
      \ народу, что создается впечатление о четком понимании единения всей музыки всех времен в сознании Питера и посему полного\
      \ отсутствия жанровых оффтопиков для него, что даёт повод простить и мне эту оффтопичную заметку в нашем строгом форуме\
      \ ;)\n\nЗ.Ы. а альбом рекомендую всем ценителям этно-инструментальной-рок-гэбриэльской музыки, после него жутко захотелось\
      \ посмотреть и сам фильм - напряженный саундтрек говорит о нетривиальности фильма, несмотря на банальный сюжет (инфу\
      \ о фильме можно поглядеть тут - http://www.rabbitprooffence.com.au, а о саундтреке тут - http://www.allmusic.com/cg/amg.dll?p=amg&sql=Akhngtq9zpu46)"
