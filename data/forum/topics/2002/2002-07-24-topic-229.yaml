            \ исполнение \"Wade In The Water\" и \"Go Down, Moses\". А её умению исполнять \"Nobody Knows The Trouble I've\
            \ Seen\" позавидовал бы Джеймс Браун где-то с четвертой минуты этого праздника песни :) \nРекомендации к обязательному\
            \ прослушиванию не робкие, скорее настойчивые :)\nА ещё, наверное, всё же необходимо обратиться к творчеству самой\
