    text: 'Кстати, через месяц у BBA выходит новый альбом "Higher Ground". На нем им помогает играть слайд-гитарист Роберт
      Рандольф, который в частности записал замечательный альбом в суперсоставе John Medeski, North Mississippi Allstars &
      Robert Randolph. Играют и там, и там, конечно, госпелс.

      А еще на днях примечательный альбом под названием "Don''t Give Up On Me" выпустил Solomon Burke. В качестве гостей на
      нем отметитились BBA, а в качестве авторов: Bob Dylan, Van Morrison, Tom Waits, Elvis Costello, Barry Mann & Cynthia
      Weil, Nick Lowe, Brian Wilson, Joe Henry and Dan Penn. Желающие могут услышать его целиком в RA: http://content.epitaph.com/Anti/Solomon_Burke-Stream/solomon.smil.

      И, последнее, тем, кто сидит на широком интернет канале без учета трафика или хотя бы на неограниченном дайл-апе, есть
      смысл обратить внимание на http://furthurnet.com. Это абсолютно легальная сеть обмена концертными записями, где в первую
      очередь привествуются качественные несжатые альбомы, но проскакивают и MP3. BBA в этой сети тоже есть.'
