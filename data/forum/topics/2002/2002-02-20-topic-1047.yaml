  text: 'Вот держу в руках винил Оскара Бентона "My Kind Of Blues" 1983. Тут была
    дискуссия по его поводу. Продолжим.

    Во-первых, никакого отношения к нашему любимому стилю он не имеет. Голимая попса
    и песенки типа "Today Is Only Yesterday''s Tomorrow". Слушать можно, но удовольствия
    не ждите.'
