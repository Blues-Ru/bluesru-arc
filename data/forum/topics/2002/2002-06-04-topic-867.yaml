    text: 'Если Михаил - это я, то лично мне концерт очень понравился. А раз понравился концерт, значит понравились все, кто
      его делал. Я не готов сейчас возвышать одного гитариста в ущерб другому и т.п. Все молодцы, а особенно сам Браун. В
      его годы давать такое шоу - это из области сверхчеловеческих возможностей.

      Я даже не слишком расстроился оттого, что он не спел "Think" и "It''s a Man''s Man''s Man''s World", и лишь символично
      обозначил знаменитый гиммик с сердечным припадком.

      И очень отрадно было видеть, как после концерта народ осаждал столик с аудиопродукцией Брауна, в то время как перед
      концертом явно его своим вниманием обделял.

      Джеймс Браун рулез.'
