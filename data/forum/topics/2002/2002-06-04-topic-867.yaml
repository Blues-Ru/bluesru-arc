        text: 'это и ежу понятно. Я подобное видел у кого-то уже.

          Кордебалетную диву, которая спела, похоже, звали Сэра. Вторую, которая петь отказалась - Дайана.

          Мне не понравилось солирование белой бэк-вокалистки. Напрягало, что она самостоятельно не попадала в тональность,
          а попадала только когда Джеймс акомпанировал ей на клавишных, или подпевал... имхо - это неудача концерта. А может
          так и задумано. Хотя голос у нее - классный. Вполне возможно на сцене была так себе подзвучка и она не слышала себя
          или музыкантов.

          А вот черная вокалистка - это просто сладость.'
