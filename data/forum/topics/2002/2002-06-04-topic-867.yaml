      text: 'как на первых рядах был звук? на последних рядах балкона звук был отвратительно плоский, как в телевизоре, без
        малейших признаков баса.

        особенно порадовала непринужденность музыкантов, что, в общем-то, вполне обычное дело для подобных оркестров и то,
        что было давольно много белых, хотя разница в манере исполнения ощутима. Солировали почти все, даже одна из спортсменок-танцовщиц,
        которая спела что-то такое рэп-хип-хоповое (я не очень в этом понимаю). Белая бэк-вокалистка удивила меня вполне черным
        вокалом, а сын Брауна - скромным, но очень стильно фразированным соло, что было особенно заметно после искрометного
        fusion-like поливалова от белого гитариста, игравшего на чем-то типа PRS. Восхитительные соло на ударных (Dr.Nick?
        I said this!), особенно от того перкуссиониста, который то ли специально, то ли случайно уронил все свои конго и там-тамы,
        залез на них и продолжал играть. Про Хаммонд уже сказали.'
