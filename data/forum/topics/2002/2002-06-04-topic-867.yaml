    subject: браун
    deleted: false
    text: "я был, в первом ряду сидел\nвидел в зале много знакомых с этого форума\n\nвсю эту музыку, без каких либо существенных\
      \ изменений нынче именуют эйсид джазом.\nисполнил несколько своих фанковых житов, пару блюзов, штуки 3 инструментальные\
      \ пьесы.\n\nдрайв был неимоверный, поскольку зал дворца съездов довольно помпезен, толстомордые коренастые охранники\
      \ половину концерта пресекали попытки танцевать и скакать, но на вещи \"get up\" вскочили наверное все.\n\nочень сильный\
      \ оркестр\n3 гитариста (один из них сын - джордж браун), 2 ударных установки + перкуссионист с конго и литаврами, 2\
      \ басиста, медная группа духовых, включая гипертргофированный бас кларнет.\n\nодну вещь браун играл на хаммонде - было\
      \ похоже на баптистский спиричуэлс, как звучит хаммонд!!\n\nеще меня приколол джемовый номер, где он пел со своей белой,\
      \ высокой, красивой и голосистой бэк вокалисткой, в джеме из известных мне вещей были по моему you send me и stand by\
      \ me сэма кука. \nв конце солировать вылезла чернокожая биг мама, пела она гораздо зажигательнее чем ее белая коллега.\n\
      \nа вообще большую часть времени дирижировал собственным оркестром, манера дирижирования далека от классической, ритмические\
      \ акценты он выделял прыжками, пританцовыванием. был так же знаменитый номер с накидыванием халата. очень порадовал\
      \ манерный конферансье."
