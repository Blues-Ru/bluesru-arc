      text: "Мы тоже с Джоном и с нашим драммером Андреем Филипповым посетили этот концерт и остались очень довольны. Старик\
        \ Браун всё еще очень крут, и это не может не радовать. Музыканты, конечно, все - перцы. Но всё-таки мы сошлись во\
        \ мнении, что гитарист, который был слева и иногда дирижировал оркестром, и звук его гитары нам понравились чуть больше.\
        \ Очень понравилось четырехголосье бэк-вокалисток. И Андрей еще отметил ритм-секцию, которая была слева (если смотреть\
        \ на сцену). А вообще было неожиданным услышать столько гитарного звучания у Брауна. И неожиданным увидеть, как он\
        \ (в свои 69 лет, если не ошибаюсь) подхватил на руки одну из бэк-вокалисток (которая на голову выше его :-) и, перешагивая\
        \ через провода и монитор, унёс её за кулисы :-)) \nНу а звук для КДС был не самый плохой - на Клэптоне был чуть получше,\
        \ на Рэе Чарльзе чуть похуже.\nА конфесранье этот меня порядком достал, многократно растягивая: \"Дже-эээээээааааоооуууииии-ймс\
        \ Браун!\" :-))\nКароче:\nДжеймс Браун - он и в России Джеймс Браун :-)"
