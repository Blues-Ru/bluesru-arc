          text: "по-моему, я и тут о Брауне писал. \nчто касается \"других мест\" - то это была заказная статья (т.е. я взял подряд за бабки написать две страницы о концерте для \"общей\", а не специализированной аудитории). На мой взгляд, та статья просто не достаточно информативна для этого форума. \nК вечному вопросу \"блюз - не блюз\". Браун вполне он-топик - в этом ни у кого сомнений нет. Да и не велика беда, если тут будут обсуждаться нопфлеры (копирайт - Greta [ух, как я страаашно злопамятен]). беда, если нопфлеров называть блюзменами. и совсем велика беда, что обсуждение нопфлеров занимает 90% постов.\nPS. Браун - это вечное, что он делом доказывает. Но разборки у нас уже давно превысили всякий допустимый уровень. \nсвежий пример. почему я не могу пошутить над песней РолСтоунз без того, чтобы моментально получить личное оскорбление? Это нормально? не обращать внимания? И когда я убираю и свою шутку, и эти оскорбления - моментально раздается плач поруганной демократии и проклятия ретроградам, правда выраженные более конкретно, с переходом на личности? \nпо-моему это бред в такой запущенной форме, что приходится лечить его хирургическим путем. Никакой радости от этого я не испытываю."
