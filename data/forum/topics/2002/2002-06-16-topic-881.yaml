            text: 'У нас с Ветераном есть свой материал. Он не блюзовый, естесственно, но в нем много чего от этой музыки.

              Писать альбом за свои деньги в пустоту мы не собираемся. Дело в том, что в этой стране группа с англоязычным
              материалом обречена на игнор. Другое дело, что мы собираемся вводить эти вещи в репертуар группы на концертах.
              Но мы лишь недавно сыгрались, и нам нужно еще немного времени для создания своего стиля и подачи. В конце концов
              нам нужны нормальные клубы для выступления с этой программой. Атмосфера в БиБи сегодня была великолепной, но
              это такое редкое явление в Москве, что иногда руки опускаются.'
