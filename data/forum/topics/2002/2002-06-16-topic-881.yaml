  text: 'Yes,yes,yes - небеса плачут по блюзу... Что происходит? Я услышу этот долбанный (долбанный, кстати с двумя "н" пишется?)блюз
    где нибудь и когда нибудь???? Классный состав, музыканты от Бога ,фронтмен на высоте, подвал вроде блюзовый (Дом Блюза!!!)!!!
    Norwegian Wood, Wild Horses и т.д.Все, что было исполнено , было на высоком уровне и с кайфом и за это я искренне благодарен
    и Диме Казанцеву и Sky Strangers Не...я не против, я с народом, но блюзу хочется. Дима, ты прав - блюз у нас умирает,
    но не мы ли сами его "умираем"? Блюз - это скучно??? Может просто отвыкаем потихоньку? Может попробуешь сделать блюзовую
    программу (и не только ты, но и многие другие ), может прокатит? Без обид,ради Бога...

    Андрей Евдокимов сетовал на то,что на последнем сейшене с Доком Аграновским было все, но не было блюза (хотя он и там
    был в определенном количестве)и он прав в чем-то.  Если сами музыканты не будут его культивировать , то и народ отвыкнет.

    Народу блюз не интересен? Те кому не интересен пойдет не на блюзовые, а на другие концерты,а уж тот кому надо,никуда не
    денется. Не знаю, но еще пару лет назад в различных (поверьте в некоторых бывал)блюзовых клубах и в Нью-Йорке,и в Далласе,
    и в Чикаго, блюз (в смысле - BLUES!)исполняли с таким кайфом и публика все это слушала и была в восторге (поверьте на
    слово!) . И играли-то, всем известные стандарты и некое количество своих вещей, но блюзовых!!! И нормально! И клубы эти
    не закрылись и блюз там живет...

    Сегодня я послушал очень классный rock"n"roll и в очень хорошем исполнении, я даже послушал несколько блюзовых вещей (и
    главное,ведь можете,когда хотите ;), за что отдельное СПАСИБО!!!

    P.S. И не спрашивайте меня, что я подразумеваю под словом BLUES - не знаю!!!!!'
