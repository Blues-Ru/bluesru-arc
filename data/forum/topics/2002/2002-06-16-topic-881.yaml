          deleted: false
          text: 'На самом деле, это вполне закономерно. Очень многие блюзовые музыканты играют чужое, многие даже очень хорошо.
            Собственная музыка, в отличие от русского рока, - не есть абсолютно необходимый элемент. Если речь идет о большой
            банде, к примеру, то имеют значения аранжировки, подбор репертуара, умение играть на инструменте, любовь к музыке
            и пр. Поскольку в блюзе очень много импровизации, то понятие свое/чужое несколько размывается, ибо от исходной
            песни может остаться не очень много.

            Ну и, главная мысль, если говорить схематично. Я слышал разные неотечественные блюзовые группы "клубного уровня",
            их полно в Норвегии, Англии, Америке и пр. Они очень хорошо исполняют, играют, солируют. На их концертах публика
            получает огромное удовольствие, там играют прекрасные музыканты и пр. Они даже ничего сами не сочиняют, отчасти
            поэтому неизвестны в мировом масштабе. Но то, что они делают, они делают - великолепно! А есть "классики", которые
            ИНОГДА сами  исполняют свой материал даже хуже тех исполнителей, но вносят в музыку что-то новое и пр. Ну вот,
            команде из "первой категории" пытаться насильно попасть во "вторую" только потому, что нужно сочинять собственные
            песни, - занятие пустое, на мой взгляд. Может получиться плохо, есть тому примеры. Хорошими сочинителями становятся
            немногие, и совершенно необязательно искать их в Москве. Лучше по-честному хорошо исполнять чужую музыку, а не
            лезть в поэты, если от рождения этим не одарен. Ну, а к тем, кто одарен, мой пост не относится.'
