            text: 'Все немножко сложнее. Проблема в том, что Дима методично "выживает" отсюда участников форума. Начинается
              с грубого неприятия позиции, которая отличается от его собственной, после этого следует серия вызывающих постов,
              ответный флейм и пр. После этого Дима записывает несогласного с ним в говно и упыри (АЕ в списке уже давно,
              я - недавно, насчет остального быдла - есть вариации). Или я вру??? После этого разговора совсем не получается,
              ибо отсутствует главный элемент нормальной дискуссии: уважение к позиции собеседника.

              По этой причине, единственная возможность сохранить мир в форуме и оградить остальных от выяснения личных отношений
              - это жесткое модерирование (которое я начал практиковать в самом начале войны Димы и АЕ). Вопрос не в отношении
              Андрея к участникам форума, а в отношении Димы к ним... Наталья, если бы я ввел строгие правила и ставил плюсы
              за оскорбление собеседника, то Димы с 10 плюсами здесь уже не было бы полтора года назад...

              А теперь отвлекусь от выяснения отношений... Про Sky Stranger - великолепно сыгранная замечательная музыка.
              И в составе Dr.Nick - у меня та же оценка, очень нравится. Сожаление и недоумение про не очень большой процент
              блюза давно высказывал Андрей (в нестандартной и непонятной всем форме), сейчас вот Юра Каверкин. Я об этом
              написал в статье про фестиваль BLUES.RU-2001, когда послушал Диму в первый раз и еще не был с ним знаком. Замечания
              по делу, на мой взгляд. Хотя, если сменить заголовок, и не называть блюзом, а фанком, роком, ритм-н-блюзом и
              пр., тогда подобных вопросов не будет, а все будут просто счастливы и довольны качеством музыки.'
