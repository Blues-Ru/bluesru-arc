    text: 'У меня она в исполнении Снукса Иглина. Слова такие:


      Mama don''t you tear my clothes

      Mama don''t you tear my clothes

      Well you can push and pull, baby, all night long

      But mama don''t you tear my clothes


      Baby turn your dampers down

      Baby turn your dampers down

      You turn your dampers down, mama, all night long

      But mama don''t you tear my clothes


      Очень неприличная песня.'
