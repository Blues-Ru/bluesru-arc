            text: Я думаю, может быть, сделать lyrics.blues.ru и закрыть туда доступ через персонализацию нашего сайта. Иначе будут проблемы с траффиком, а также с автором ресурса. Ибо просто воровать его страницы - нехорошо. Т.е. сделать ресурс исключительно для собственного внутреннего потребления...
