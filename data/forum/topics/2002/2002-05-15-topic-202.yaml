              subject: а у меня мысли другие :-)
              deleted: false
              text: 'Опять ты про воровство. Гарри что-ли эти песни написал :-)


                Я-то хотел по другому - выдрать все тексты, загнать в базу и сделать движок для желающих дополнять базу онлайн. Ну еще конечно ряд сервисов - поиск по исполнителю, автору, новости о появившихся на сайте новых текстах и т.д.

                Уже две недели штурмую PHP-Apache-MySQL. Пока тяжело :-(


                Ну скачанное (около 12 мег) конечно дам всем, кто попросит'
              replies:
              - id: 4450
                parent_id: 4448
                date: 2002-05-17 19:51
                poster: Федор Романенко (fedor)
                email: fedor@blues.ru
                subject: Я уж об этом давно думаю...
                deleted: false
                text: 'Тут главная проблема не в базе или веб-страницах, а в том, чтобы отпарсить статический html и грамотно загнать в базу. База сама по себе простая... Ну и, разумеется, такие вещи должны быть на базе данных, а не на статических страницах, как у Гарри. Иначе возможности по обновлению сильно сокращаются.

                  И последнее: просто так высосать все у Гарри и положить к себе в открытый доступ - это очень нехорошо... Гарри спасибо не скажет и будет совершенно прав.

                  Поэтому: 1) Я бы сделал поначалу без базы, ибо задача непростая. 2) Выкладывать нужно в закрытый доступ, если не будет договоренности с Гарри 3) Такой открытый крупный ресурс на blues.ru, наверное, держать я бы не стал из-за траффика.'
                replies:
                - id: 4452
                  parent_id: 4450
                  date: 2002-05-17 20:39
                  poster: Andrei V. Evdokimov (evdokimov)
                  email: evdokimov@blues.ru
                  subject: но ведь
                  deleted: false
                  text: 'а) гари можно написать и предложить

                    б) спасибо Ринету, мы всегда можем воспользоваться их ресурсами

                    ц) в любом случае, я всегда боялся, вдруг что-то случится, и больше блюзлириксов не видать. надо дублировать, хотя бы и архивом для своих.'
                  replies:
                  - id: 4453
                    parent_id: 4452
                    date: 2002-05-17 20:52
                    poster: Федор Романенко (fedor)
                    email: fedor@blues.ru
                    subject: Гарри
                    deleted: false
                    text: "Если бы у Гарри дела шли замечательно, он бы точно отказал и правильно бы сделал. Ибо этот архив - плод его многолетней работы, и просто отдавать он его не станет. Ну и с точки общечеловеческой выгоды - иметь два архива чуть-чуть различающихся - это очень плохо. Ибо их потом будет нереально слить при желании и пр. Такие вещи должны быть централизованными.\nЕсли учесть тот факт, что его архив не работает, можно сделать центральным его зеркало в Ринете предварительно договорившись. И тогда, если что, считать это место основным и копировать последующие зеркала именно с него. Но тогда на владельца зеркала ложится обязанность его пополнять и пр. \nТретий вариант в том, чтобы предложить Гарри хостинг на Ринете и, возможно, увязать это с переделкой технологической базы и интеграцией с другими нашими блюзовыми делами.\nВ любом случае, нужно учитывать, что траффик там большой, если учесть большое количество чуваков с телепортом..."
