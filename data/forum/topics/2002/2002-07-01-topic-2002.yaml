    subject: День первый. 28 июня.
    deleted: false
    text: "ДЕНЬ №1\n\nБи Би Кинг, вечер. Пришел чуть раньше чем обычно, где-то в 19:00, никого из традиционных завсегдатаев нет и впомине. Какие-то абсолютно новые люди, словно попал в другое место. Ущипнул себя. Нет, это все таки Би Би, персонал улыбается, узнают , здороваются (кстати вы знаете какой там персонал? Какие они все милые и красивые. Да, конечно вы знаете!!!).\n Взял, как обычно, Гинесс. Но по прежнему никого из завсегдатаев кроме персонала.:) Разговорился с сосдедом за стойкой, оказалось, что почти все, кто был в клубе представляют журнал \"Другой\", поговорил с ним пол-часа, хоть время убил. Ощущения праздника нет, наверное, потому что нет ни одного знакомого лица...Жду концерта...Девушка предлагает новые сигареты со вкусом конъяка (рекламная пауза), взял попробовать, но вкуса конъяка не почувствовал...\n    Концерта все нет, в конце зала празднуют чей-то день варения:), уже ходят по столам, уже порядком пъяны ( как мне кажется)...\nНаконец-то приехали музыканты, на вид вполне нормальные люди...\nНастроились, приехал Воронов...но ощущения праздника как не было так и нет...приехал Миша Владимиров и стоял с потерянным видом...вместе с ним приехал бассист Кроссроудз (имени не знаю). \nУра! Ура! Наконец-то хоть одно знакомое лицо - пришел Слава (тот который такой волосатый и из Питера), за ним пришел Егор ( тот который на последнем джеме был проездом из Чикаго). \nНачался концерт..А ведь и правда группа хорошая, мощная такая, хорошая концертная группа, шоу знатное. Они и матерные частушки попели,  и  поиграли оч.громко и народ повеселили  ... Одно \"но\"...впервые на моей памяти из Би Би Кинга вывели человека  за непристойное поведение, конечно можно не любить Рэд Элвисес, но кричать, что музыканты есть придурки, не стоит, и  не стоит обижаться если тебе не разрешили подуть в гармошку, так вот впервые одного человека вывели из Би Би...Музыканты доиграли концерт...Но играли без этузиазма, было видно, что им плевать Би Би Кинг это или Урюпинская рюмочная №3 (лишь бы денег дали)... Воронов уже уехал...Народ разошелся...Я сел попить кофейку, народ доотмечал день рождения, но не Би Би, а какого-то мужчины...\nПраздника не получилось...или мне так показалось...\nПросто какая-то корпоративная попойка журнала \"Другой\" и еще каких -то людей...Почему-то не одного человека, из тех кто там играет по средам на джемах там не оказалось, там не оказалось музыкантов ради которых люди туда ходят...В общем первый день был оч.странным и совсем не праздничным....\nПРОДОЛЖЕНИЕ СЛЕДУЕТ...."
