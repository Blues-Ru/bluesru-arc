  text: "ну коли нам вчера тут милостиво было позволено заняться оффтопиком - позвольте оторваться на целый год вперёд ;)))\nВоспользуюсь стилем изложения ведущего рубрики музыкального обзора журналов типа ОМ пятилетней давности:\nЕсли вы все еще не подарили своей даме сердца(жене, подруге) волшебную пластинку Джона Зорна \"The Gift\", записанную в сотрудничестве с магом и волшебником Mark(om) Ribot, то скорее бегите в легион и исправляйте эту непростительную оплошность! Тут и exotica, и surf, и easy listening, и world beat, и чУдные иллюстрации Heung-Heung Chin. Любимый мной Mike Patton также поучаствовал. Не забудьте прикупить к ней бутылку красного сухого чилийского вина(почему чилийского? - оно замечено в чудодейственном воздействии на слабую женскую психику - но не всякое, тут главное - не ошибаться в выборе), и поствосьмомартовский week-end вам обеспечен без ругани и каверзных вопросов насчет утерянной зарплаты ;)) \nИ Robert Allen Zimmerman прекрасен в своем последнем творческом порыве!\nИ хочется сказать гигантское человеческое спасибо дядечке из маленького муз.магазинчика на Арбате за присоветованного Chuck E. Weiss \"Extremely Cool\"'99! Вот где скрывалось истинное наслаждение!!\n\nP.S.: прошу прощенья за гигантский offtopic - просто у меня наипрекраснейшее настроение и захотелось этим с вами поделиться. Впредь обязуюсь - только лишь о блюзе ;)\n\nИ напоследок: когда же маг-волшебник-чародей Ribot заявится в обещанном составе Los cubanos postizos? :) Нигде нет абсолютно никакой информации."
