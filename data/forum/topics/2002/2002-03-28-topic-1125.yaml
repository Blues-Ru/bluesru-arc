  text: "будет джем с Dr. Nick. На басу - Ветеран, на ударных - Игорь, поет и играет на Фендере - Доктор Ник.\nМне Док Аграновский рассказал что надо делать, и главное чего не надо. Я возьму с собой комб и мак. Как я понял там есть еще один комб и майки, куда и будут играть и петь участники джема.\nПросьба одна: в одной вещи на сцене только 2 джемующих - гитарист и/или харпер/вокалист. Есть еще пианист вроде из ребят, но это отдельная история.\nБлэки, ты собери своих харперов в кучу и решайте кто и что играет. Ты мою программу знаешь, так что проблем не будет.\nНадеемся увидеть Вову, Красивова и Федора. Остальных я просто не знаю пока, но завтра и разберемся. \nПосле 22:00 шум заканчиваем и кочумаем. Примочки выключить, барабанщику щетки, вокалистам не орать, но петь и шептать вразумительно.\nГлядишь, что-нибудь дельное и выйдет."
