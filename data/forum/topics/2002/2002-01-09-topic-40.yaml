      deleted: false
      text: "Понимаю справедливость вопроса. ценю дипломатичность формулировки.\nОтветить точно трудно потому, что причин больше, чем одна.\nПервое. я был на его концерте, пришел с большими ожиданиями, увидел позорище такое, что трудно поверить. К классу игры это отношение не имеет. играл классно. но пусто, как, пшенка без соли, без сахара, даже без масла. Дело было в Монтре...Не знаю, как счас, а когда я там бывал, я видел такую публику (именно в первую голову публику!), что такое только в сказке бывает! Я видел, как средне-хорошие артисты выступали выше головы, встречая такой прием. И вот Кеб... Лабуда! больше всего мне запомнился искательный взгляд в публику: \"ну как же вам лучше сыграть? я ведь по всякому могу!\" А в том блаженном месте как раз это и не хиляет. Там можно сыграть на ложках и  криво: если душу вложишь, тебя лавром увенчают... А этот - не вкладывал. Готов был смастерить все, что угодно... Я бывал в Монтре... пусть давно, но не раз. я там видел всего 3! провальных концерта... Там публика в таких случаях просто уходит, никто не свистит (было одно исключение, но оно к музыке не имеет отношения). Так вот. не веришь моему вкусу - ок, я субъективен. Но публика джаз-феста в Монтре приняла его в начале овациями, был аншлаг, а к окончанию  его выступления в зале осталось ПОЛОВИНА слушателей - остальные ушли. Так паскудно-подобострастно никто из музыкантов там себя не ведет. И этого ему не простили, и класс игры не спас.\n2. на одном его компакте (единственном, который я у себя держу), есть mpeg, где, после интервью и саундчека, он соло играет блюз. И какой блюз!!! Там все - и мастерство, и вдохновенье, и life, и tears, и love, и смерть, и полный кайф до параксизма катарсиса... а гули он такой блюз в альбомы не записывает??? а потому, что контракт с Эпиком дорого стоит, а Epicу нужна от него музычка строго определенная: мастерская, сладкая, душещипательная. Чтобы средний класс афро-американцев и прогрессивно мыслящих ypie мог послушать, не спотыкаясь о подлинные чувства. Ну так он и так может: исполняет заказ. Его альбомы - позор! Сладко сыгранная, картинно слезоточивая, абс.неблюзовая по сути, по содержанию, по исполнительским приемам и по структуре музычка!  Блюзовые алименты - вот все, что там есть (не даром его заедает тема разведенного папаши: маньяк: на каждом альбоме по паре песен на эту тему) Сыграно все - блеск. Не даром так уважают его музыканты. Да только меня кремом-суфле не проведешь! Это musak. \nдалее... список номинантов на грэмми составляют вполне компитентные люди. Но голосуют две с половиной тысячи человек. Из них блюз любят и понимают сотня-полторы... сколько это в процентах?.. Прямого подкупа в Грэммях нет. но Epic обладает возможностью пресс-конференций, презентаций, бесплатных выступлений, буклетиков, халявных копий, клипов, публикаций: \"приезжайте! Мо' очень милый человек, вам понравится с ним беседовать, и интервью выйдет отличное (парень тренирован)... Да, конечно, за вами пришлют машину. Кстати, там в баре много интересного.\" - так обрабатывают журналюг. что может противопоставить независимый блюзовый лейбл?.. Исход схватки очевиден: блюзовые грэмми достаются Кебу-миломупарню-МО. Да пусть он их всех своей одинокой маме подарит - я не против, пусть радуется семейство МО. Однако ж, их радость лишает действительных блюзменов - важного знака отличия. Им - и их лейблам - эта грэммиевая бирюлька жизненно важна. но - фиг! - Кеб Мо утащил фентифлюшку, которая могла бы быть спасательным кругом для выживания действительного блюза.\nРезюме: много людей не могут, но пытаются играть блюз. вред, наносимый ими, не сравнить с тем вредом, который наносит один уникум, который может, но не играет блюз.\nКабачок \"У МО\"  это к Симпсонам!"
