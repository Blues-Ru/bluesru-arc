      deleted: false
      text: 'Первый вопрос принят к "задаванию" г. Бюску.

        Ответ на второй вопрос предлагается безотлагательно Вашему вниманию:

        в августе 2001 г. у Бюска вышел альбом Venus, Texas, за который он номинирован
        Норвежской музыкальной Академией на Spellemannprisen по графе "best rock-album".
        Вот отсюда сейчас он всё и играет (сезон август - декабрь 2001 г.).'
