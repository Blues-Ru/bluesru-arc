  text: 'Возле моего дома на Ленинском проспекте, в бывшем помещении магазина "МЕЛОДИЯ", открылся новый магазин "СОЮЗ". Аж
    на двух этажах! Выглядит все прилично. Цены конечно мрачные, но нашел Роя Харпера (это редкость, потому и выделил) и не
    мог не взять два альбома Fleetwood Mac всего по 198 рублей (код 1.2). Надо там порыбачить еще. Есть стойка с блюзом, довольно
    большая, но бестолково организованная, как и все в "СОЮЗАХ". Но советую зайти. Есть услуга новая (только со смеху не мрите
    сразу): за 3 рублю можно послушать любую пластинку! Вот до чего докатились.'
