                        deleted: false
                        text: 'Сложно ответить, Владимир.

                          Скорее так; Мэйалл для меня больше легенда-исключение, чем Poet&Prophet. У меня больше 20 его альбомов, но я так и не могу сказать, что я его сильно люблю. Просто собираю; как собираю Элтона Джона, например. Тут это не понять многим, но я все равно собираю...

                          Мне больше всего нравится его период с Грином - я слышу там Грина и мне хорошо. У меня есть сборник ''Looking Back'', там синглы и ауттэйки ранних записей Джона. Так вот, там половина вещей с Питером - очень хорошо. ''My Blues For Jenny'' заставляет меня радоваться как в 15 лет.

                          Поздние его записи лучше, чем 80-е годы, но их слишком много и мне уже неинтересно. Любимый альбом у него - ''A Sense Of Place''. Даже не знаю почему. Видимо так: альбом записан на Island - это уже хорошо (я слышу разницу); там есть ''Congo Square'' & ''Sensitive Kind'' - этого уже достаточно для меня для приобретения этого альбома. Остальные вещи тоже приятны.

                          Еще запомнился ''Wake Up Call''. Он там еще поет ''Undercover Agent For The Blues''. Мама моя эту песню любит в исполнении Тины Тёрнер. Вот мне там что-то сильно нравится на том альбоме, но у меня его нет (пока нет).

                          В общем не считаю Мэйалла гением вовсе. Слышу его английские корни... и не верю его блюзу, ну что поделать.

                          А электо-гитарно-бестолковый мэйнстрим я не люблю ни в какой музыке. Обажаю эклектику. Steely Dan люблю, короче ;)))'
