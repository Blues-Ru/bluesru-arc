    subject: Junior Kimbrough !!!
    deleted: false
    text: "Буквально вчера я получил сильнейшее впечатление/потрясение от прослушивания пластинки Junior'а Kimbrough (за что отдельное спасибо уважаемому \"AvA ()\" ). Пластинка 1997 года \"MOST THINGS HAVEN'T WORKED OUT\". Подобные ощущения я получал разве что от блюзов раннего Хукера. Самое интересное, что потом я прочитал мнение об этой пластинке  Игги Попа и оно абсолютно совпало с моим ощущением: \"The first time I heard Junior, I just went crazy.\"  \nСовершено резкая, прямая манера игры вкупе с пробирающим вокалом очень здорово передает blues feeling. Думаю неуместно писать здесь биографию этого исполнителя, хотя она воистину \"блюзовая\" (кому надо тот почитает здесь: http://www.fatpossum.com/junior.html), отмечу главные факты: годы жизни 1931-1998, сам родом из северо-восточных окрестностей Мисиссипи, свой первый альбом выпустил только в 1992.\nТеперь собственно вопрос и повод для обсуждения: кто слышал оного человека и каковы впечатления от услышанного? Какие ассоциативные сравнения могли бы привести? Я уже отметил, что Junior мне напомнил раннего Хукера, не из-за музыкального стиля (и тот и другой играли дельта-блюз), а именно \"подачей\" - я не слышал ни от кого еще блюзов, длящихся 8-10 минут с незатейливым текстом и ритмикой, но которые было-бы так _нескучно_ слушать до конца! Исполнение завораживает и напоминает древний ритуал, который непременно надо исполнить до конца... Могли бы Вы еще привести примеры подобных исполнителей, неважно какой блюзовой эпохи и стилевой направлености?\nСпасибо за внимание.\n\nЗЫ: ссылки по теме - \nhttp://www.allmusic.com/cg/amg.dll?p=amg&sql=1JUNIOR|KIMBROUGH\nhttp://www.fatpossum.com/mp3.html (здесь можно послухать мпеги исполнителей замечательного лэйбла FatPossum - в их числе R.L. Burnside, Paul Jones и др.)"
