              text: "отдельные недостатки:\nСколько раз я писал - на сайте нет должностный лиц, не с кого спрашивать, если чего-то не хватает. кто чего может - тот то и делает. неужто это не заметно? что Макарке было близко, то он сам и написал - про Джими Воэна и про Ирла (кажется). Бирюков архаикой занялся. у меня сейчас элементарно нет времени, потому и не пишу давно. наладятся отношения с \"домом блюза\" - может, и положение изменится. \nА если кто ругается на контент - это он сам на себя ругается. \nСей сайт - плод наших совместных усилий и федорова героизма и самоотречения. \n\nпро мура:\n весьма информативная статья и по феномену Мура, и по людям, с которыми он работал (для меня его рассказ про запись с Албертом Кингом, или воспоминания о концерте блюзбрейкерз в 60-х - драгоценности). Статья про Мура ОБЯЗАНА быть на блюзовом сайте, как и статья про СРВ. По одной простой причине: большинство новичков заходят на блюзовый сайт именно за информацией о них. Встречать заносчивым: иди отсюда, лох - просто некрасиво и напоминает обыкновеное чванство. Я не с Мадди Уотерса и даже не с Джонни Уинтера начал открытие блюза. Да и сами персонажи ничего плохого блюзу не сделали. Беда не в них, а в тех музыкантах, которые за этими двумя деревами блюзового леса и не видят. Но тут уж не Мура вина. И не нашего сайта - муровская страница занимает долю процента от его общего объема. (К тому же, показывает зарубежный опыт :), Мур имеется во всех блюз-энциклопедиях.)\n\nпро поиск.\nЯ вспомнил, что что-то все-таки писал про Кимброу. Набрал его имя в строке \"поиск\". нажал на кнопку и получил точный результат. С помощью Яндекса, но именно поиск был проведен по материалам сайта. так что, поиск сработал четко. \nИ претензий тут моих, что кто-то в старинных новостях не помнит заметки о Кимброу - нет никаких. Но есть грусть-тоска, что с трудом найденное время и затраченный труд валяется невостребованным. На хера же я старался? ни денег, ни славы, ни толка... вот и задумаешься в другой раз, стоит ли этим вообще заниматься. \nБлюз вообще - музыка архииндивидуальная. стало быть, люди, в нее погруженные, должны быть индивидуалистами. вот, стало быть, они и сидят по домам, сами разыскивают информацию. и в сражениях этого форума участия не принимают. \nэто в лучшем случае. а, может, их просто больше нет. только 10-15 человек на всю страну?.."
