  deleted: false
  text: 'На мой взгляд, последний концерт в Форте - это было лучшее, что наши блюзовые музыканты когда-либо исполняли. Причем, значительно лучше... Звук был замечательный, публика внимательная, в результате Арсен завелся на полную катушку. Сюдя по всему, он сможет сыграть еще круче в будущем. Ибо, концерты лучшают раз от раза.

    В четверг покажут в джазофрении песню - полторы. Но они, возможно, дадут не совсем полное представление, ибо записывались по спец. заказу до концерта ;)'
