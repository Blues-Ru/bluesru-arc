        subject: Спасибо за добрые слова
        deleted: false
        text: 'Народу было мало, но слушали очень внимательно, зато. ;) Кстати, в Форте было битком, и, к тому же, концерт был ну совсем замечательный - Арсена проперло на полную катушку. Я думаю, что в этом смысле со временем все будет Ок. ;)

          По поводу "старого козла" - это звукорежиссер из БиБиКинга. Дело в том, что у них есть жесткое правило, - в будние дни заканчивать в 11. Ибо над ними квартира, а шуметь в жилом доме в будни после 11 нельзя. Иначе это поставит под угрозу существование самого клуба. Кстати, тот самый режиссер поступил нетривиально: "разрешил-предложил" в микрофон сообщить о концерте в конкурирующем клубе Форте. Обычно музыкантов за подобные упоминания выгоняли.

          Про то, что концерт быстро кончился (хотя по времени - честных 2x45) - это наблюдение я делал несколько раз. Если музыка хорошая, то ее не хватает. С этим надо смириться. ;) Или сходить на еще один концерт.

          По поводу репертуара - у них раньше был SRV+Хендрикс больше, чем наполовину. Сейчас, кажется, остался только один Angel. И это хорошо, на мой взгляд. Мне, например, интереснее всего у них песни собственного сочинения, (плюс некоторые классические супер-эмоциональные блюзы). Арсен говорит, что есть еще несколько своих в запасе, глядишь они их сделают к следующему разу.

          2All: Вы видели когда-нибудь в этом форуме, чтобы о концерте какого-нибудь нашего блюзового исполнителя так много, с подробностями и эмоционально писали? ;)'
