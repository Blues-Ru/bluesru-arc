    subject: И мой комментарий...
    deleted: false
    text: 'Еще раз расшифрую мой комментарий, который я дал в лаконичной форме после предыдущего концерта. У меня много знакомых, которые пропускают музыкальные события по разным предлогам. В разговоре "я музыку очень люблю", а слушать идут именно тогда, когда это надо сделать абсолютно обязательно, по разным причинам не идут. А если бы Хендрикс, к примеру, выступил с единственным концертом, его можно было бы пропустить под каким-нибудь предлогом? (условный пример для тех, кто любит Хендрикса). Ну вот, а ближе к делу выясняется - "я иду на другой концерт X, близкого мне стилистически", "у меня, увы, баннер не дорисован на работе именно сегодня вечером", "я люблю, когда на гибсоне играют, а не на фендере", "люблю, чтобы тетя пела, а не дядя". Причин может быть много, не в этом суть. Просто почему-то одним удается с ними разобраться, а другим - нет, тут дело в наличии стремления.

      Другой вопрос, надо как-то понять, что именно этот конкретный концерт нельзя пропустить. Тут весь вопрос в доверии к тем, кто об это сообщает (долго, нудно и по-многу раз). Наверное, доверие убывает по мере того, как тебе долбят одно и то же - сходи и послушай. Может все-таки превозмочь себя, самому проверить? Вписать в плотный бизнес-график дату концерта, известную за месяц? Найти два часа среди своих важных дел?

      Ну а теперь, представьте. Прихожу я, к примеру, с такого концерта после эмоционального потрясения. И вспоминаю о тех людях, которые в те два часа баннеры рисовали или были на другом концерте, на котором г. играли. Или даже не г., а нечто несравнимое. Или что-то приличное, но ничто, по сравнению с глубоким музыкальным переживанием. Какое мне слово в голову приходит в первую очередь? Правильно, пидры!

      P.S. Не принимайте близко к сердцу, ни к кому лично это не относится.'
