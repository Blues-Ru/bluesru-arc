  text: "В четверг 17 октября джем с группой Де Блюз Спиннерс произойдет в клубе Вудсток-Покровский. Планировали следующий в Ехрате 24-го - но он отменен. Зачеркните его. Далее должно быть чередование Вудсток-Ехрат. \nВ Вудстоке джемы будут с приглашенными заранее участниками (\"полуоткрытые\"). Иначе единообразно. На завтра приглашены Плющ, Каверкин, Виноградов, Мао, Грей Вульф, Хащенко, Ополев, Михеева, Бородин, Капшин. Список - не догма (возможны изменения), а выбор имен не означает нашего непочтения к другим постоянным и непостоянным участникам джемов. Нет! Другие люди будут приглашены 31-го и, надеюсь, найдут время с нами поиграть. Мы постараемся провести в клуб по списку всех музыкантов, которые захотят посмотреть и послушать. \nПишите мылом, если есть какие-либо предложения. Удачи всем."
