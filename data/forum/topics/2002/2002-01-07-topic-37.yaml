    deleted: false
    text: "подготовь саму гитару. Струны должны быть толстые (минимум 12) и должны высоко отстоять от ладов. \nСтроить можно на открытый соль, ре или ми. Сам понимаешь, пальцы надо тренировать, вибрато тоже. В каждой позиции можно сыграть лишь один-два вида композиций. Перестраиваться все время - гемор, так что лучше сразу несколько гитар иметь. И еще одну с нормальным строем и тонкими (относительно) струнами.\nВсе это очень сложное дело, даже если знаешь куда \"нажимать\". Я, похоже, сдался. В студии могу что-то прописать, но получить от этого удовольствие на концерте мне трудно - чувствую себя несвободно."
