  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-07-06'
  text: 'Один из моих любимых альбомов английского "короля римейков" :-)


    Джо Кокер прославился тем, что всегда грамотно выбирал материал и аранжировки
    для записи, и часто его кавер не уступал оригиналу. На этом диске он представил
    в основном материал, который он уже записывал ранее на других пластинках, плюс
    несколько новых треков, но привел старые хиты в новых аранжировках. Аранжировки
    в основном упрощенные, инструменты акустические, звук мягкий - своего рода студийный
    unplugged.


    А кавер Ван Моррисоновской Into the Mystic так и просто шедевр (пожалуй, моя любимая
    вещь у Кокера)'
