- id: 1942
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-07-06'
  text: 'Новый альбом легендарного вокалиста выдержан в лучших традициях - это классический
    Кокер: слегка коммерческий неспешный рок с блюзовым привкусом, красивыми балладами
    и отличными аранжировками. Девять новых треков, один кавер песни Дикси Чикс (I
    Hope). Тем, кому творчество Кокера нравится, новый альбом однозначно придется
    по душе: тут нет ничего принципиально нового, никаких экспериментов со звуком
    - только лучшее из того, что уже было неоднократно проверено временем.


    Альбом практически без проходных треков, который мне понравился почти полностью
    (в отличие от двух его предыдущих сольников, которые почти полностью не понравились).'
