  author: Дмитрий Казанцев
  mark: 9
  date: '2005-05-21'
  text: 'Кевину Муру уже 50 лет на этом диске (это его пятая пластинка), но его бодрости
    хватило бы и на двоих 20-летних. С самых первых нот первой песни все очень и очень
    хорошо на этом альбоме. Отличные песни Кевина и прекрасные каверы: "Love Train"
    (Gamble/Huff), "Grandma''s Hands" (Bill Withers), "Family Affair" (Sly Stone),
    "Big Yellow Taxi" (Joni Mitchell), "Isn''t She''s Lovely" (Stevie Wonder)...


    Хороший подбор песен и исполнение. Кеб почти ушел от блюза, но та смесь фолка,
    кантри-соула и ритм-н-блюза, которая записана на этом диске, звучит очень музыкально
    и чарующе.'
