- id: 540
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-02'
  text: 'Ну что ж, на этом альбоме нет Портера, Кеб продюсирует сам с помощью Джона Люиса Паркера, и звук стал поживее. Поживее
    стал и его вокал (или это кажется из-за другого саунда?)


    Кэб все дальше уходит от традиционного блюза в сторону кантри-соула и ритм-н-блюза. Почти белая и выверенная музыка на
    очень высоком уровне. Кому-то может показаться скучной, но в ней есть много чего интересного. Схожесть с Таж Махалом,
    Дугом МакЛаудом и Терри Эвансом остается, но это же прекрасно, не так ли?


    Все песни свои, но Love In Vain Роберта Джонсона все же есть!'
