- id: 656
  author: Дмитрий Казанцев
  mark: 7
  date: '2005-05-21'
  text: 'Четвертый альбом Кеба Мо. Он все дальше уходит от традиционного фолк-блюза
    в сторону поп-музыки и кантри-соула. Это совсем неплохо, но программинг клавиш
    и баса в песне "It Hurts Me Too" может напугать многих. Удивительно, но две вещи
    на альбоме написаны совместно с Бобби МакФеррином.


    Звук и игра на высоте, конечно. Очень радуют слайд-гитары, Джим Келтнер на барабанах
    и Грег Филлингейнс на клавишных. Рафинированный саунд не мешает, а вот ярких песен
    могло бы быть и побольше, тут их маловато. Неплохой, но не великий альбом Кевина.'
