- id: 660
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-05-21'
  text: 'Это шестой альбом Кевина за 10 лет. На этом диске снова много блюза, как и на ранних его работах. "Традиции" нет,
    но все треки в духе современного акустического блюза с элементами фолка и соула, конечно. Очень приятную песни он посвятил
    Би Би Кингу, она называтся "Riley B. King".


    На этом диске все песни написаны Кебом в сотрудничестве со своими друзьями и коллегами. Симпатичный и ровный альбом.'
