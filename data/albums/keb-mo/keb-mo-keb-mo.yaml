- id: 541
  author: Дмитрий Казанцев
  mark: 7
  date: '2005-04-02'
  text: 'Поздний дебют Кеба; еут ему уже 43 года. Очень белая музыка от такого черного человека. Сухой и малоэмоциональный
    вокал мне напомнил Дуга МакЛауда (Doug MacLeod). Великолепная игра и звук, но продюсер Джон Портер всегда делает очень
    сухой и чистенький звук, а это подходит не для всех стилей. К фолку и блюзу Кеба это точно не очень подходит.


    Все вещи написаны Кэбом кроме двух нетленок Джонсона - Come On In My Kitchen и Kindhearted Woman.'
