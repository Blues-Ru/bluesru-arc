  author: Дмитрий Казанцев
  mark: 8
  date: '2005-05-21'
  text: 'На своем седьмом альбоме Кевин решил записать 10 песен протеста о мире и справедливости. Одну он написал сам, а другие
    9 - это известные композиции белых и черных авторов из разных жанров. Тут есть: "For What It''s Worth" (Stephen Stills),
    "What''s Happening Brother" (Marvin Gaye), "The Times They Are A-Changin''" (Bob Dylan), "Imagine" (John Lennon)...


    Интересные, порой неожиданные аранжировки - все это очень интересно. Стоит ли говорить, что звук и исполнение на самом
    высоком уровне.'
