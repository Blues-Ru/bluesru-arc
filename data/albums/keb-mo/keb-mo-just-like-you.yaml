- id: 539
  author: Дмитрий Казанцев
  mark: 7
  date: '2005-04-02'
  text: 'Это второй диск Кеба. Он очень похож на дебют по звуку, тут тот же продюсер - Джон Портер. Но если на первом альбоме
    было много блюза/фолка и лишь чуть-чуть соула, то тут соула и р-н-б стало больше, появились и кусочки с "островной" культурой.
    Все это похоже на Таж Махала (продюсер тот же), но Таж гораздо живее и материал у него много сильнее.


    Надо отметить отличный вариант знаменитой Last Fair Deal Gone Done Роберта Джонсона.'
