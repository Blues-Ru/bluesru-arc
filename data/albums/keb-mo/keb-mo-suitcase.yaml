- id: 1440
  author: Андрей Евдокимов
  mark: 4
  date: '2009-02-05'
  text: Его выдают за блюзмена... При случае он и блюз сыграет как профи. Он даже обладает парочкой Грэмми в соответствующей
    категории (что является заслугой его мейджор-лейбла, который легко побеждает независимые фирмы в борьбе за престижный
    титул). Блюзовые нотки прорываются в приятный поп-рок Кеба – и не более того. Абсолютно самодовольная музыка, с легкой
    приправой любовной жизнерадостной лирики. Собственно, после всяких песен "про чувства-с", он и весь альбом завершает милейшей
    песней "Жизнь прекрасна".... Хотелось бы знать, где Кеб черпает оптимизм большой ложкой?.. Не станем отрицать, что он
    является великолепным виртуозом, превосходно владеющим звукоизвлечением в игре на акустических струнных. Альбом абсолютно
    незаменим как сопровождение к утреннему кофе на уютной вилле – товар сертифицирован! Нервным городским фанатам блюза он
    тоже пригодится – в качестве снотворного.
