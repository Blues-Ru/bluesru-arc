  author: Дмитрий Казанцев
  mark: 8
  date: '2006-01-08'
  text: 'Ритм-н-блюз, госпел-соул, латин-джаз, блюз, кантри, рок-н-ролл, кантри-блюз,
    фолк - все эти стили есть на этом диске. Бромберг шикарно играет на различных
    гитарах, особенно хорош на слайде. Его пение душевно, но многие не любят подобные
    слабые голоса. На этом диске есть обалденные гости: Jessy Dixon Singers, Dr. John,
    David Lindley, Jackson Browne, John Sebastian, Jorma Kaukonen. Есть тут и известные
    песни: "Midnight Hour Blues", "Save The Last Dance For Me", "Long Tall Mama",
    "Come All You Fair And Tender Maidens".


    Вторая сторона под названием Country Side гораздо сильнее первой City Side. Музыка
    разнообразная, но звук 80-х тут, и он портит те треки, где есть ударные. Это последний
    альбом Дэвида, с тех пор он ничего не записывал.'
