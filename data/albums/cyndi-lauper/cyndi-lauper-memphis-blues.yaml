- id: 1630
  author: Андрей Евдокимов
  mark: 5
  date: '2010-07-20'
  text: 'Время от времени какая-нибудь стареющая поп-рок-звезда громко заявляет, что
    с детства и на всю жизнь влюблена в блюз. И теперь наконец-то готова осуществить
    мечту всей жизни: записать блюзовый альбом. И тут не знаешь, что и думать. Вроде
    бы, все делается из лучших намерений. К тому же, подобные альбомы утыканы гостевыми
    выступления блюзовых работяг, как еж иголками. У Синди Лопер лишь три песни в
    альбомы записаны без приглашенных блюзовых знаменитостей. И послушать дуэт короля
    блюза БиБиКинга с блестящим новоорлеанским клавишником Аланом Тюссо было очень
    приятно. (Среди прочих гостей – Чарли Масселвайт и Джонни Лэнг). В альбоме лишь
    классика блюза и соул, от заезженных "Перекрестков" к редчайшему "Мать сыра земля"
    Отиса Спэнна. Однако если вы не в восторге от кокетливого девичьего попискивания
    в исполнении гранд-дамы, дебютировавший еще раньше Мадонны, то заскучаете вы задолго
    до конца альбома.'
