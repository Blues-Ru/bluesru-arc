  author: Дмитрий Казанцев
  mark: 9
  date: '2005-06-17'
  text: 'Этот концертник вышел после двух альбомов третьего периода Оллманов (1990-1994).
    В группе 8 человек: Gregg Allman - keys/vocals; Dickey Betts & Warren Haynes -
    guitars/vocals; Allen Woody - bass, Butch Trucks & Jaimoe - drums, Marc Quinones
    - percussion, Thom Doucette - harmonica.


    Интересный момент - на альбоме нет чужих песен, все 9 композиций написаны группой.
    Есть тут два акустических номера (Грегг тоже играет на гитаре) - "Midnight Blues"
    и "Melissa". Звук на диске великолепен, новые аранжировки радуют слух, а игра
    Беттса и Хейнза на гитарах - это что-то невероятное. Не стоит также забывать,
    что здесь есть три вокалиста (а не один Грегг, как в начале их карьеры).


    Можно сказать, что этот концертник сильнее их студийных работ этого периода.'
