reviews:
- id: 286
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-11-28'
  text: 'Дюэйн Оллман погиб, но группа не развалилась. В конце концов пением и сочинением песен занимались Грегг и Дики, так
    что потеря Дюэйна отразилась лишь на звучании и настроении группы.


    Eat A Peach - это двойной альбом группы, состоящий из новых записей, старых записей с Дюэйном и концертных треков с Филлмора.
    На альбоме всего 9 композиций, но Дюэйна нет лишь на первых трех треках. Эти новые треки показывают нам, что группа в
    полном порядке, и Грегг с Дики пишут отличные песни по-прежнему. Дюэйна никто не заменил, так что группа осталась с одним
    гитаристом.


    Альбом начинается с шикарного номера Грегга Ain''t Wastin'' Time No More. Затем идет девятиминутный инструментал Дики
    - смесь джаза, психоделии и музыки Сантаны - отличный трек! Третий трек Melissa считается одним из лучших сочинений Грегга;
    красота да и только!


    Потом следует страшная вещь - 34-минутный концертный трек Mountain Jam! 34 минуты - это длина звучания приличного альбома,
    но не трека. Конечно, это трибьют Дюэйну, но это явный перебор для пластинки. Пятый трек One Way Out - тоже концертная
    запись с Дюэйном; классный блюз! Trouble No More - шестой трек с того же концерта - классический блюз Мадди в классном
    исполнении.


    Третья часть альбома состоит из трех студийных треков с Дюэйном. Очень хорошие песни Stand Back и Blue Sky, а в качестве
    эпилога великая инструменталка Дюэйна Little Martha!


    Оценка 4 балла. Три "средние" композиции вставлены как-то искусственно и плохо вяжутся с остальными треками. Многие считают
    этот альбом лучшим, но именно за студийные треки. Закончилась эра Дюэйна - два студийных альбома, двойной концертник и
    вот этот замечательный компот из трех частей.'
