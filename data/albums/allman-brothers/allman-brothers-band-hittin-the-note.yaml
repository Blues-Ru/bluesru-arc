reviews:
- id: 120
  author: Алексей Калачев
  mark: 9
  date: '2003-05-29'
  text: Группа не делала студийных альбомов 8 с лишним лет. Кроме того, она рассталась
    с одним из ключевых музыкантов, определявшим стиль и звук группы в течение всей
    ее истории, гитаристом Ричардом Бэтсом. Два этих обстоятельства дают повод предъявить
    к альбому повышенные требования. Такие ситуации случались в истории братьев Оллманов
    не единожды. Например, в середине 70-х или в начале 80-х. И не всегда им удавалось
    пройти успешно этот "эйсид-тест". Новый альбом – отменный! В нем заметно в гораздо
    большей степени присутствие – в качестве солиста и композитора – вновь вернувшегося
    в ансамбль Уоррена Хейнза. Он здорово раскрутился со своим проектом "Гафт Мьюл"
    и превратился в поистине культового виртуоза, звезду блюз-рока за годы отсутствия
    в "Оллман Брадерс". Все, что было присуще ансамблю в периоды расцвета, вы найдете
    на новой пластинке в чуть более жестком варианте. Имеются в виду два солирующих
    гитариста, две ударные установки с очень разными музыкантами, теперь еще и два
    солиста-певца. Характерная черта этого альбома – более плотный звук и жанровое
    разнообразие. Хотя продолжительный инструментал – фирменное блюдо "Оллманов" -
    как всегда, на месте (в 70-х группа получила "Грэмми" за лучший рок-инструментал).
