reviews:
- id: 519
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-02'
  text: 'Как и первая Антология Дюэйна, эта состоит из его редких записей с разными
    составами плюс песни с альбомов и синглов других исполниетелей. Здесь очень интересная
    подборка - две песни Дюэйн поет сам и записаны они на него, а также: Aretha Franklin,
    King Curtis, Otis Rush, Ronnie Hawkins (2 песни), Wilson Pickett, Hourglass, Arthur
    Conley, Lulu, Herbie Mann, Johnny Jenkins, Boz Scaggs, Sam Samudio, Delaney and
    Bonnie, The Duck and the Bear и 4 редких трека Allman Brothers Band.


    Отличное качество записей и оформление! Я не очень люблю различные сборники, но
    этот слушается на одном дыхании.'
