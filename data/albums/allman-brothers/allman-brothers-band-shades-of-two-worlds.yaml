reviews:
- id: 428
  author: Дмитрий Казанцев
  mark: 8
  date: '2004-01-16'
  text: 'Прошел лишь год после отличного камбэка Seven Turns, а Оллманы снова записали
    альбом! Снова для лейбла Epic, опять с Томом Даудом в качестве продюсера. Ребята
    были на подъеме и в хорошем настроении, все это прекрасно слышно на альбоме.


    На диске 8 песен аж на 52 минуты! Длинные, порой чуть затянутые, композиции в
    стиле блюз-фолк-южный-рок. В стилистике и звучании мало что изменилось. Жива и
    формула: две ударных установки с перкуссией, два отличных соло-гитариста, длинные
    супер-импровизации, Грегг Оллман во главе всего этого.


    Оценка 4 балла. Альбом хороший, но все же он слабее предыдущего. Не хватает яркости
    композиции, и некоторые треки слишком уж длинные и тяжелые. В качестве приджазованного
    длинного инструментала тут выступает Kind Of Bird - подобные композиции стали
    традицией Оллманов. Есть на альбоме и "конфетка" - это любимая песня из репертуара
    Роберта Джонсона Come On In My Kitchen - классная акустическая версия! Из остальных
    шести вещей сложно что-либо выделить, песни очень ровные.'
