reviews:
- id: 597
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-28'
  text: 'Очень хороший и разнообразный альбом Грегга. Блюзы, южный рок и соул. Целая когорта великолепных музыкантов, особенно
    много тут делает гитарист Jack Pearson - виртуоз игры слайдом и не только. Оллман снова исполнил свой знаменитый хит "Whippin''
    Post" в интересной обработке. Он также исполнил еще две знаменитые вещи: "Dark End of the Street" и "Memphis in the Meantime".
    Много акустических гитар, орган Хаммонда, отличная ритм-секция - в итоге отличная южная музыка.'
- id: 740
  author: Александр Панин
  mark: 8
  date: '2005-06-27'
  text: Последний на настоящий момент сольный диск Грега Оллмана получился похожим на номерные альбомы Allman Brothers. Южный
    рок, всю дорогу отличный слайд (Джек Пирсон и Дерек Тракс), а также немного дудок на избранных треках. Ряд очень хороших
    вещей - переделка раннего хита оллманов Whipping Post, кавер Memphis In The Meantime (John Hiatt), Starting' Over. Побольше
    бы такой "простоты"!
