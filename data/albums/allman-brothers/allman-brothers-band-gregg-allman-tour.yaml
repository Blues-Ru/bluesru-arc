  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-02'
  text: 'Грандиозный был тур у Грегга после выпуска его первого сольника в 1973 году.
    На обложке красуется: The Gregg Allman Tour with his special guests Cowboy / Boyer
    & Talton and accompanied by a 24 piece orchestra! Cowboy - это такая группа с
    Каприкорн Рекордс, они входят в состав банды Оллмана и играют на этом концертнике
    две вещи (хорошие две вещи). Тур был с размахом, все песни записаны в Карнеги
    Холле в Нью-Йорке и Театре Капитолий в Нью-Джерси! Ребята неплохо жили и были
    популярны в то золотое для музыки время.


    На диске всего 12 композиций, кое-что с его первого альбома, но есть песни, которых
    нет нигде, и в этом дополнительная ценность этого двойника. Все очень замечательно
    и хорошо сыграно, но диск коротковат для двойного концертника - чуть больше 60
    минут. И простите, где моя любимая песня Midnight Rider - визитная карточка Грегга
    и Оллманов вообще?'
