- id: 175
  author: Дмитрий Казанцев
  mark: 6
  date: '2003-08-22'
  text: 'Какие у нас ассоциации при имени Оллманз? Два барабанщика, два шикарных гитариста,
    которые играют и по-разному, и в унисон, шикарный орган Грегга и его необычный
    вокал, тягучие блюзовые рок-песни, длинные импровизации, всегда хорошая игра на
    инструментах. Так ведь? Но все это было давно, в конце 60-х, начале 70-х, а потом
    были очень слабые 70-е и развал в 81 году. Я никогда не верил в камбэки подобных
    групп, но увидел их видео 2000 года и решил попробовать. Так получилось, что начал
    я именно с этого, третьего альбома после воссоединения.


    И что же тут? Есть два драммера, да еще одного перкуссиониста добавили; гитаристы
    на месте и на высоте; Грегг прекрасен; есть и музыка и импровизации - короче,
    звучит как в 70-е! Я сначала не поверил, но потом расслышал и уже позже вычитал,
    что это ЖИВАЯ запись в студии.


    Сразу скажу, что альбом ХОРОШ, но это, конечно, не ранние Оллманы. Все, вроде
    бы, тут, но дух уже не ТОТ. Кому-то это может и понравится, но я все же люблю
    старую музыку, и мне тяжело до конца любить записи 80-х и 90-х.


    Играют тут и по блюзу местами, но в основном это тяжелый, тягучий, классный, довольно
    серьезный блюз-рок. Есть немного фолк-баллад. Я бы выделил тайтл-трек Back Where
    It All Begins и Everybody''s Got A Mountain To Climb (обе вещи Дики Беттса). Вообще,
    все вещи, кроме одной, написаны группой - это похвально. Продюсер альбома - знаменитый
    Том Дауд - он сделал все, чтобы альбом был и живым и классно записанным.'
