- id: 521
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-04-02'
  text: 'На этом компакте записаны оба альбома группы The Hour Glass (1967 & 1968). В этой группе начинали играть братья Оллманы.


    Удивляет то, что это почти вообще не похоже на Allman Brothers, хотя оба брата тут, а Грегг поет! Музыка в жанре ритм-н-блюза
    и соула, без тяжести и почти без блюза (это очень удивительно). Дудки, госпел и соул, много разных звуков (просто Мотаун
    какой-то). Странно, что парни ТАК РЕЗКО сменили стиль. Влияние госпел-музыки тут есть, а это уже общее с ABB. Дюэйн гениально
    играет на гитаре. Очень забавный инструментальный вариант Norwegian Wood (The Bestles).


    Приятная музыка, которую стоит знать для общего развития.'
