reviews:
- id: 538
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-02'
  text: 'Двойная антология Дюэйна. Оллман-старший был гениальным слайд-гитаристом и погиб в октябре 1971 года в мотоциклетной
    аварии. Он почти никогда не пел и у него не было своей группы; Дюэйн был известным сессионным музыкантом на Атлантике,
    играл в Allman Brothers, а до этого в Hourglass.


    И так, на этом диске подборка его работ с разными исполнителями. Тут есть вот что: Hourglass, Wilson Pickett, Clarence
    Carter, Aretha Franklin, King Curtis, John Hammond, Boz Scaggs, Johnny Jenkins, Delaney Bonnie Friends, Cowboy, Eric Clapton
    & Duane, Derek & The Dominoes, Allman Brothers Band и лишь одну вещь он поет сам и она "записана" на него.


    Как видите, тут много редкого и классного, но лично у меня есть половина этих вещей на оригинальных альбомах, к счастью
    или сожалению. Для тех, у кого этого всего нет, это обязательная подборка!'
