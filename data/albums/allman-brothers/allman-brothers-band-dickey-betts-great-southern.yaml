  date: '2005-04-02'
  text: 'Группа Братья Оллманы развалилась и Беттс решил собрать свою команду. Он
    сменил лейбл (на Аристу) и видя, что Грегг Оллман отошел от южного рока, решил,
    что он теперь и есть фигура номер 1 в этом направлении (ну и Линирд Скинирд, конечно...)


    На этом альбоме записан южный рок и блюз-рок высшего класса. Группа Great Southern
    - это: Dan Toler - guitars & vocals, Ken Tibbets - bass, Tom Broome - keys & vocals,
    Jerry Thompson - drums, Doni Sharbono - drums. Два драммера, как видите.


    Шикарная музыка. Отличное продолжение дела Allman Brothers!'
