reviews:
- id: 271
  author: Дмитрий Казанцев
  mark: 10
  date: '2003-11-20'
  text: 'Один из самых удачных камбэков в рок-музыке, на мой взгляд. Был десятилетний перерыв, до этого пять лет не очень
    хороших альбомов, сольные проекты, 80-е годы... Сами все понимаете. И тем не менее они вернулись, вернулись с очень хорошим
    альбомом! Он хорош и как рок-альбом и как южно-блюз-рок альбом. Странно, но это так. Никаких уродств 80-х годов, все в
    стиле и в звуке (Том Дауд всегда знал свое дело, но все же...), песенки просто замечательные!


    Велосипед они не изобретают, все как обычно - два солирующих гитариста, два драммера, роскошный вокал и оргАн Грегга,
    гений Дикки Беттса, немного хард-блюза, фолка, кантри и южного рока... И все же стоит отметить, что вокал Грегга - это
    уникальная вещь; именно он не дает нам никакого права обозвать эту музыку хард-глэм-трэш-смэш-роком (а они могут втопить
    неслабо). Вокал его именно что корневой, и это супер!


    Отличный альбом! Трудно поверить, что спустя 15 лет группа снова в творческой форме, но это так.'
