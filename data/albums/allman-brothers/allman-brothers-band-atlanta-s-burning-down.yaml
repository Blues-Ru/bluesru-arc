  date: '2005-04-02'
  text: 'Это третий сольник Беттса. Он вышел за год до того, как группа Allman Brothers
    снова собралась.


    Очень хорошая музыка в ключе предыдущего альбома (и даже лучше) - блюз-рок и южный
    рок (или наоборот).


    Хороший звук, классные песни и музыканты - что еще надо чтобы спокойно слушать
    музыку?'
