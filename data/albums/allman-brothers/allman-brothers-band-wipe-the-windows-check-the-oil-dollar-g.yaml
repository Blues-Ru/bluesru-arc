reviews:
- id: 504
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-02'
  text: 'Еще один официальный двойник Оллманов. Вышел он в 1976 году, когда группы
    уже не существовало (они собрались снова только в 1979).


    На этих двух дисках записаны песни и композиции с их концертов 1972, 1973 и 1975
    годов. Качество отличное, играют великолепно. Это тот самый состав Оллманов, когда
    в группе уже играл клавишник Чак Ливелл, и Грегг чередовал игру на органе с игрой
    на гитарах. Это очень интересно, ведь Дики Беттс тут солирует один, но что творит
    Чак на пианино и Грегг на органе!


    Обязательный концертник для любителей этого формата. Особо стоит отметить дизайн
    обложки и внутреннего разворота с фото и инфой - КЛАСС!'
