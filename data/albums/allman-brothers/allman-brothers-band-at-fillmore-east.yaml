reviews:
- id: 284
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-11-26'
  text: 'Двойной концертный альбом группы. Своего рода отчет о работе группы за 3 года. Очень много импровизации, эмоций,
    джаза, блюза, гитар, шума, психоделии, Грегга и Дики. Две песни занимают аж по целой стороне виниловой пластинки! 22 минуты
    Уиппин Поуста! Даже Заппа играл короче. А You Don''t Love Me на 20 минут? Перебор. Мы и так знаем, что они супер-инструменталисты
    и монстры импровизации и погружения в состояние джаз-блюзового угара. Хотелось больше новых коротких песен, но они решили
    по-другому.


    Это последний альбом где Дюэйн играет во всех треках; скоро он погибнет и мир потеряет одного из лучших слайд-гитаристов
    планеты. Он и Лоуэлл Джордж - это жемчужины, которые очень рано покинули этот мир.


    Я поставлю этому альбому лишь 4 балла. Тяжеловато слушать такие длинные версии на альбоме. При этом я считаю, что это
    один из ЛУЧШИХ концертников в рок-музыке вообще!


    Если Вы любите ЛАЙВы и много-много классной импровизации на ВСЕМ, обязательно купите этот диск. Он бывает на одном и на
    двух компакт-дисках. Виниловое издание очень красивое.'
