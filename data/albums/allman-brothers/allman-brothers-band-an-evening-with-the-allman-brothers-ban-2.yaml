reviews:
- id: 731
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-06-17'
  text: 'А вот и вторая часть "Вечера с Оллманами"; на ней 8 концертных композиций группы, они были записаны в 1994 году.
    Из ранних хитов нет ни одной вещи Грегга, только песни Беттса ("Jessica", "Elisabeth Reed") - это необычно. Есть тут два
    отличных блюзовых стандарта: "You Don''t Love Me" и "The Same Thing". Состав тот же, что и на Первом Сете, но нет гармониста
    Тома. Звук (как и на концертнике 1992 года) на высоте, исполнение тоже.


    Волшебная атмосфера южного блюз-рока, виртуозная игра на гитарах, три барабанщика - невероятно хорошо для 90-х.'
