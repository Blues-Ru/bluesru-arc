  author: Дмитрий Казанцев
  mark: 6
  date: '2005-04-02'
  text: 'В 70-х у Грегга были два классных полноценных студийных альбома, двойной концертник и гадкий диск с его женой Шер
    (да, да, с той самой армянской американкой).


    Потом, в 1986, вышел альбом I''m No Angel, который принес Греггу неожиданный успех. Успех успехом, а вот звук на том диске
    совсем не для рока и ролла (продакшн 80-х а-ля "ДЫЩЩЩ" и т.д.) На этом диске 1988 года звук стал лучше, материал более
    конкретный и главное - музыка снова похожа на Allman Brothers! И действительно - через год после этой пластинки группа
    снова собралась.


    Совсем необязательный альбом, но музыка очень клевая для 80-х годов.'
