- id: 288
  author: Дмитрий Казанцев
  mark: 6
  date: '2003-11-28'
  text: 'Последний альбом перед первым развалом группы. Тот же состав, что и на Brothers And Sisters, та же музыка, но все
    гораздо слабее. Такое ощущение, что потерян интерес к музицированию. На альбоме есть интересные треки, но нет ощущения
    альбома. Хороший кавер Мадди Can''t Lose What You Never Had, как обычно длинный приджазованный инструментал Дики, тут
    это High Falls.


    Оценка лишь три балла. Этот альбом стоит иметь для коллекции и ради нескольких ярких моментов, но это уже не те Оллманы.
    В таком составе они записали лишь два альбома и тут четко слышно влияние Чака Ливелла на группу - он превосходный клавишник!
    Очень советую его группу Sea Level!'
