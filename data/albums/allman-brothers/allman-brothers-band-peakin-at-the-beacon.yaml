  author: Дмитрий Казанцев
  mark: 6
  date: '2010-06-06'
  text: 'Первый (концертный) диск Оллманов 21 века. Редкий состав - тут уже есть 21-летний Дерек Тракс и еще есть Дики Беттс
    (основатель группы). Дики будет уволен из группы именно после этого тура! Грегг был недоволен его игрой и отношением.
    Можно сказать, что это был необычный состав и очередное трудное время для группы.


    Очень блюзовая пластинка - почти все вещи тут - с первых трех дисков.'
