- id: 287
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-11-28'
  text: 'Новый альбом, новый состав, новый звук и настроение. В составе появился пианист Чак Ливелл, в большинстве треков
    басист Ламар Уиллиамс заменил погибшего Берри Оукли - еще одна смерть в группе. Дики Беттс стал больше писать и петь,
    Грегг стал играть на акустической гитаре. Чак внес новое звучание, а стиль группы стал уходить в сторону фолка, кантри
    и южного рока.


    Ramblin'' Man и Jessica - два хита и оба написаны Дики! Отличная кантри-роковая песня и шикарный инструментал! Альбом
    очень ровный, спокойный и мелодичный. Из гитарного блюз-рока группа ушла в клавишный южный рок. Кому-то это нравится,
    кто-то не может слушать Оллманов после смерти Дюэйна.


    Оценка 4 балла. Очень сильный материал и подача, но все же нет тут блеска и драйва первых двух альбомов, и дело не в Дюэйне
    или не только в нем.'
