  author: Дмитрий Казанцев
  mark: 7
  date: '2005-04-02'
  text: 'Это первый сольник Dickey Betts-а (я его называю Диким Беттсом). Ричард -
    это его полное имя, конечно. Альбом записан когда группа Allman Brothers функционировала,
    а он стал ее вторым главным лицом и сонграйтером.


    Дики - такой типичный южный американский парень от сохи, небольшого роста, с деревенской
    физиономией и грубыми руками (у нас в пост-совке особенно ненавидят таких типажей),
    но когда он берет гитару все становится на свои места - парень прост, но очень
    талантлив.


    На этом первом альбоме больше кантри-рока и кантри, чем южного рока и блюза, но
    какой класс игры и пения! Ему помогают группы: The Poindexters (добро, банджо,
    гитара, мандолина и вокальная группа The Rambos (Rebo, Dottie and Buck), а также:
    Chuck Leavell - keys!, John Hughey - pedal steel, David Walshaw - drums, Jeff
    Hanna - guitar, Vassar Clements - fiddle, Stray Straton - bass, Tommy Talton -
    guitar, Johnny Sandlin - percussion... Сам Беттс играет на гитаре и поет, естесственно.


    Отличный дебют; музыка светлая и добрая (можно сказать, что он как бы отдыхает
    от звука Оллманов). Но есть тут один фирменный "ход" Беттса из группы Оллманов
    - на второй стороне альбома 14-минутная инструменталка; правда и она на этот раз
    с стиле кантри.'
