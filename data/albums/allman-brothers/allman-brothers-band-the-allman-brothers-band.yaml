reviews:
- id: 282
  author: Дмитрий Казанцев
  mark: 10
  date: '2003-11-26'
  text: 'Вот это дебют так дебют! Так играть тогда умели не многие, а большинство так и не научились. Я не о технике, но об
    отношении, драйве и желании. Что на этом альбоме? Блюз, рок, немного психоделии, волшебные инструментальные моменты, южная
    атмосфера, два драммера, Дюэйн, Грегг, Дики Бэттс, молодость, злость. 7 песен на 33 минуты. С самой первой инструментальной
    композиции и до великой Whipping Post - это образец классного блюз-рока и южного блюза. Все вещи классные, но нельзя не
    выделить Black Hearted Woman и, конечно, Whipping Post.


    Оценка 5 баллов. Один из лучших дебютов в поп-музыке! В Англии так умели играть разве что Флитвуды, так что любителям
    британского блюза этот альбом необходим хотя бы для сравнения. Обязательно послушайте этот альбом!'
