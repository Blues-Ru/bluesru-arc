  author: Дмитрий Казанцев
  mark: 7
  date: '2005-06-10'
  text: 'Этот двойник длится почти 160 минут, и на нем записаны 15 композиций группы образца 1970 года. Брат Дюэйн был еще
    жив и поражал всех своей виртуозной игрой на слайд-соло-гитаре. Концерт очень живой, но запись и игра музыкантов великолепны
    (особенно если сравнить с концертными записями других групп тех лет). И все же расстроенные гитары немного достают.


    Альбом очень блюзовый и импровизационный, ведь к тому времени у них было всего 2 студийных альбома и мало своих песен.
    Удивительно, насколько музыкально, точно и классно играют члены коллектива даже в такой фестивальной и пьяной обстановке.
    Из известных блюзовых стандартов здесь есть: "Statesboro Blues", "Trouble No More", "Hoochie Coochie Man", "Stormy Monday".


    На первом диске - концерт 3 июля. 9 композиций, а почти 20-минутный "Mountain Jam" разделен на две части ИЗ-ЗА ДОЖДЯ.
    На втором диске (5 июля) - всего 6 композиций, 5 из них повторяют первый диск, но на этот раз "Mountain Jam" идет без
    разрыва - 28 минут (с Джонни Винтером на гитаре)!


    Вот времена были...'
