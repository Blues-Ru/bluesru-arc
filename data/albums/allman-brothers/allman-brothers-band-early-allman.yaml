  text: '<img src="http://www.ljplus.ru/img/d/r/dr_nick/aj1.jpg" width=300 height=300 alt=''32,36 КБ''> <img src="http://www.ljplus.ru/img/d/r/dr_nick/aj2.jpg"
    width=300 height=300 alt=''30,23 КБ''>


    До Allman Brothers Band была группа Hour Glass, а до нее Allman Joys. Gregg Allman - organ/vocal, Duane Allman - guitar/vocal,
    Bobby Dennis - guitar, Jack Jackson - guitar, Ralph Ballinger - bass, Tommy Amato - drums, Ronnie Wilkins - piano. Большой
    состав, как видите; хорошие и очень зрелые аранжировки для тех лет. Записи сделаны в 1966 году под руководством композитора
    и продюсера Джона Лаудермилка (именно он нашел эту группу в маленьком клубе и увидел в них звезд).


    Ранние Оллманы играют южный ритм-н-блюз и блюз-рок на свой манер. И знаете на что это похоже из известного? На Them &
    The Animals! Только запись лучше и играют уже более грамотно. Тинейджер Грегг Оллман уже писал классные песни (тут их
    7 из 12) и искал свою манеру пения (здесь его вокал не похож на то, что было позднее в ABB). Дюэйн чуть постарше, но уже
    лихо играет на соло-гитаре.


    Удивительно, что этот АЛЬБОМ (это не сборник) выпустили лишь через 7 лет после его записи. Прекрасная музыка и качество
    звука; это что-то невероятное. Южный рок родился вовсе не в 1969 году, а еще в 1966, ибо он уже есть на этой пластинке.
    Она обязательна для всех любителей блюза, ритм-н-блюза, южного рока и всего движения British Invasion.'
