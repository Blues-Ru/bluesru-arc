- id: 719
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-06-11'
  text: 'И еще один двойной концертник, на этот раз в последнем составе без Дики Беттса - на гитаре играет племянник ударника
    группы Дерек Тракс (молодой виртуоз). Вместе с Уорреном Хейнзом (гитара/вокал) они создают мощный дуэт техничных гитаристов
    - оба играют пальцами и слайдом, между прочим. На бас-гитаре тоже новый человек - умершего Аллена Вуди сменил чернокожий
    джаз-роковый "монстр" Отейл Бербридж. Короче, состав и звучание как на их великолепном альбоме "Hittin'' The Note" (2003).


    На двух компакт-дисках 18 композиций - тут есть старые хиты Оллманов, блюзы, а также вещи с нового альбома, конечно. Звучание
    группы порой напоминает классный джаз-рок, настолько четко и разнообразно играют они в своих длинных импровизационных
    кусках. И все же, здесь по-прежнему много блюзовых номеров: "Statesboro Blues", "Trouble No More", "Good Morning Little
    Schoolgirl", "Woman Across The River".


    Концерт прекрасно записан (в марте 2003 года), группа точно и энергично играет, импровизации великолепны. Можно сказать,
    что на этом фоне немного теряется голос Грегга Оллмана, но это совсем не страшно в целом. Еще один небольшой минус - трудно
    прослушать подряд два концертных диска Оллманом почти по 80 минут (даже когда музыка хороша) - много драйва, энергии и
    информации. По "старым понятиям" это 4 пластинки, как Вы понимаете.'
