- id: 713
  author: Дмитрий Казанцев
  mark: 7
  date: '2005-06-09'
  text: 'Биг Твист (Larry Nolan) - это черный певец весом килограм под 150, который поет хриплым и сиплым голосом, а Меллоу
    Феллоуз - его группа из 9 человек (2 гитары, клавиши, три сакса, труба, бас и барабаны). Оркестр исполняет блюз и ритм-н-блюз
    с богатыми аранжировками и большим акцентом на духовых. Музыка веселая и с юмором, что напоминает Blues Brothers, естесственно.


    На диске всего 8 вещей, все они записаны на концерте в Чикаго (в клубе Biddy Mulligan''s). Есть тут "Steamroller Blues"
    Джеймса Тейлора, знаменитые "I Live The Life I Love" (Willie Dixon - blues hit), "Turning Point" (Buckwheat Zydeco, Mighty
    Joe Young, etc.) и "300 Pounds Of Heavenly Joy" (Willie Dixon; хит у Хаулина Вулфа). Симпатичная соул-музыка в целом,
    но концертный звук 80-х - это не самое приятное "блюдо" для уха, конечно. Очень хочется послушать их студийные работы
    1980-1983 (у них всего 3 диска кроме этого, если я не ошибаюсь).'
