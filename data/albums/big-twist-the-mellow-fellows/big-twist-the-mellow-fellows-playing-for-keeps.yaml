reviews:
- id: 898
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-11-27'
  text: Классический южный ритм-н-блюз и соул-блюз. Большой состав (это было модно
    после Blues Brothers) с духовыми. Ларри Нолан (он же Биг Твист) поет неярким хриплым
    голосом и играет на гармошке. Можно сказать, что его пение - это не самое главное
    тут. В программе в основном соул-песни (в меру приблюзованные и прифанкованные),
    они скорее развлекательные, чем глубокие. Главный номер - "300 Pounds of Joy"
    (Willie Dixon), конечно. Проблема еще и в том, что это 80-е годы, так что звук
    уже не "тот", но аранжировки и подача очень хороши - все это делает этот диск
    хорошим и приятным почти во всех отношениях.
- id: 1517
  author: Константин Колесниченко
  mark: 9
  date: '2009-04-06'
  text: 'В 80-х, в не самое лучше время для музыки и для блюза в частности, некоторые
    музыканты все-таки умудрялись записывать отличные альбомы. Одним из таких альбом
    является "Playing For Keeps" от вокалиста Big Twist и его группы Mellow Fellows.
    Larry Nolan (настоящее имя музыканта) не известен большинству любителей блюза,
    до начала восьмидесятых он был исключительно клубным музыкантом в южной части
    Чикаго, где он играл на барабанах и пел. Исполнял Биг Твист любую музыку, которую
    требовали посетители – от соул до блюза. В 80-х, когда Лари начал записываться,
    блюз не пользовался популярностью, а в 1990 году Биг Твиста не стало, потому он
    так и остался неизвестным музыкантом, оставив после себя очень мало записей.


    Альбом "Playing For Keeps" - первая сольная запись Big Twist''a, к этому времени
    он уже был опытным музыкантом, закаленным многочисленными живыми выступлениями
    и длинными турами по городам Америки, потому он знал, какая музыка должна быть
    на его альбоме и как ее исполнять. Соул, ритм-н-блюз, блюз, фанк, баллады – вот
    коктейль жанров на альбоме. Мощный вокал Нолана (нечто среднее между Howlin''
    Wolf, Wille Dixon и Bobby Blue Bland) украшен игрой довольно большой группы с
    мощной духовой секцией. Продюсировал запись знаменитый духовик и аранжировщик
    блюза – Gene Barge, он же и соавтор нескольких композиций, но на альбоме есть
    и 3 известных песни-хита: "300 Pounds Of Joy", "Polk Salad Annie", "We''re Gonna
    Make It". Альбом короткий – всего 9 композиций на 35 минут, идеальный формат,
    обойма, выстреливающая в слушателя отличной музыкой.'
