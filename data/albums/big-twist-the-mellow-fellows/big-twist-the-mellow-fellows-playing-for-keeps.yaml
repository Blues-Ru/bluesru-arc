- id: 898
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-11-27'
  text: Классический южный ритм-н-блюз и соул-блюз. Большой состав (это было модно после Blues Brothers) с духовыми. Ларри
    Нолан (он же Биг Твист) поет неярким хриплым голосом и играет на гармошке. Можно сказать, что его пение - это не самое
    главное тут. В программе в основном соул-песни (в меру приблюзованные и прифанкованные), они скорее развлекательные, чем
    глубокие. Главный номер - "300 Pounds of Joy" (Willie Dixon), конечно. Проблема еще и в том, что это 80-е годы, так что
    звук уже не "тот", но аранжировки и подача очень хороши - все это делает этот диск хорошим и приятным почти во всех отношениях.
