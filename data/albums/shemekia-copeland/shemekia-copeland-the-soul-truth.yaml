- id: 1294
  author: Евгений Долгих
  mark: null
  date: '2008-06-05'
  text: Шемекия Коупленд наконец-то запела почти чистый соул. Почему наконец-то? Да к этому как-то все и шло с самого первого
    ее альбома, Turn The Heat Up, вышедшего еще в 1997 году. Ее новый альбом не лишен и отзвуков нео-свинга, рока, и, разумеется,
    блюза – послушав его, становится ясно, почему Роберт Плант недавно назвал Шемекию "следующей, современной Тиной Тернер"…
    Коупленд еще с 2000 года вышла на общенациональный американский уровень популярности. Ее номинировали на Грэмми, она появляется
    в таких передачах, как Late Night With Conan O'Brien и CBS Saturday Early Show, выступает на одной сцене с Rolling Stones
    и Би Би Кингом, ее приглашают на все самые крупные блюзовые, джазовые и фолк-фестивали. Короче говоря, Шемекия Коупленд
    стремительно превращается уже в мировую звезду… вот только чего? Блюза? Формально да, но, положа руку на сердце и особенно
    после этого альбома, лучше всего причислить ее творчество к соул и ритм-энд-блюзу. Голос у певицы и правда шикарный. И
    пользуется она им все более профессионально от альбома к альбому. Красивая, яркая, душевная музыка… изумительный вокал…
    но все же немного жаль, что корневая блюзовая сырость и эдакая расхристанность, что были заметны у Шемекии в начале ее
    карьеры, потихоньку уступили место приглаженным и популярным гармониям. Но, впрочем, у двадцатишестилетней вокалистки
    все еще может быть впереди.
- id: 1295
  author: Разные авторы
  mark: null
  date: '2008-06-05'
  text: Если 70-летняя Коко Тейлор уже несколько десятилетий по праву носит титул "королевы блюза", Шемика выглядит "принцессой",
    про нее часто говорят как о достойной преемнице хворающей обладательницы трона (в конце прошлого года Коко Тейлор 4 месяца
    пролежала в больнице после серьезной операции на сердце). Soul Truth – применительно к материалу диска эти слова можно
    понимать и как "правда души", и как "правда музыки соул". По сути гиперактивный, порой даже агрессивный ритм-блюз Шемики
    все прежний. Просто от одного к другому – на протяжении уже 4-х дисков – она как бы "примеряет" разные гардеробы, использует
    для своей музыки разные "упаковки". На этот раз мы наблюдаем, как выглядит наша черная чикагская принцесса в обрамлении
    СОУЛ. С эмоциональной точки зрения Шемика явно дочь своего отца, знаменитого техасского блюзмена Джонни Копленда по прозвищу
    "Смерч", умершего в 1997 году. Чтобы сделать такой диск, в качестве продюсера пригласили Стива Кропера - гитариста, композитора,
    аранжировщика, одного из создателей стиля соул в начале 60-х годов. Здесь мало гитар, много меди, много бытовых сюжетов
    в песнях. Лирика их замешана на столь симпатичных современным американкам темах - феминизме, независимости и иронии в
    отношении к мужчинам. Отсюда вторая часть смысла в игре слов "The Soul Truth" как "правда (женской) души".
- id: 1377
  author: Константин Колесниченко
  mark: 7
  date: '2008-12-01'
  text: 'Shemekia все дальше уходит от того современного блюза, который она исполняла на предыдущих своих альбомах. В принципе
    движется она в правильном направлении – соул-музыка. Качество альбома подтверждает присутствие такого легендарного музыканта
    для этого жанра как Steve Cropper.


    Альбом "The soul truth" получился цельным и выстреливает на слушателя мощным зарядом упругих композиций в сопровождении
    духовой секции и сильного голоса Shemekia. На мой вкус, молодая исполнительница немного переусердствовала в подражании,
    например, Aretha Franklin – слишком уж много вибрато и прочих фирменных приемов великой певицы. Но Copeland находится
    только в начале творческого пути и если она не свернет с выбранного направления, то со временем у нее есть все шансы стать
    новой королевой соул-музыки, в самом хорошем смысле этого слова.'
- id: 1853
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-07'
  text: 'Четвертый сольный альбом дочери известного блюзового гитариста Донни Копланда, на котором она поет не только (и,
    пожалуй, точнее сказать даже не столько) блюз, но и соул, немножко фанка, а также коммерческий хард-рок, напоминая изредка
    Тину Тернер. Выдающиеся вокальные возможности певицы несколько сглаживаются коммерческой разноплановостью альбома и отсутствием
    ярких запоминающихся треков, в результате чего впечатление от прослушивания остается двойственное.


    Тем не менее работа, бесспорно, добротная, о чем лишний раз свидетельствует 3 место в блюзовом чарте альбомов Биллборда.
    Продюсировал знаменитый аранжировщик Стив Кроппер, который также записал гитарные партии и выступил в качестве соавтора
    ряда треков.


    One of the best singers in modern blues, if not all of pop music" - CHICAGO TRIBUNE


    "Volcanic delivery and straight-from-the-gut realism...a masterful blend of fiery blues, ballsy ballads and electrifying
    rockers" - VIBE'
