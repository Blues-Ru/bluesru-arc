- id: 42
  author: Алексей Калачев
  mark: 8
  date: '2002-11-05'
  text: Вероятно, наиболее ожидавшийся серьезными коллекционерами релиз осени. Шемика – что называется, ведущая исполнительница,
    прима нового поколения блюза, да и просто певица, записавшая пару лет назад отменный диск "Wicked!". Он был сделан на
    стыке contemporary blues и блюз-рока (хотя где между ними грань?). Многим хотелось продолжения в том же духе. Однако на
    новом диске нет блюз-рока, нет неистовых гитар и даже быстрых вещей там относительно не так много. Это "тихий" альбом,
    с прозрачным, пульсирующим мелодическим рисунком, в котором голос не является лишь частью гитарного альбома. Данный альбом
    записан, чтобы мы услышали певицу. Продюсер диска – Доктор Джон, он же играет на клавишах, и вклад его в этом, последнем
    качестве невозможно переоценить. Блюз 21-го века.
- id: 1849
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-06-07'
  text: 'Shemekia Copeland - Talking to Strangers - 2002


    Третий сольник ведущей блюзовой певицы 21 века. Альбом занял первое место в топе блюзовых альбомов Биллборда, а также
    получил ежегодную награду за лучший альбом современного блюза. В качестве продюсера и соавтора выступил знаменитый Доктор
    Джон, который также играет на клавишах и поет дуэт The Push I need.


    Высокопрофессиональный качественный альбом современного блюза - не столь неистовый по сравнению с предыдущим, но более
    зрелый и более полно раскрывающий вокальные таланты Шимекии. Один из лучших в ее карьере.'
