  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2022-12-20'
  text: 'Done Come Too Far - десятый студийник гарлемской дивы, вышедший 19 августа
    2022 года на привычном для нее лейбле Аллигатор Рекордз. Альбом записывался в
    Нэшвилле под руководством продюсера и гитариста Уилла Кимбро, который продюсировал
    и два предыдущих диска певицы. Ей аккомпанирует первоклассный состав музыкантов,
    включая гостевое участие самого Сонни Ландрета (слайд на первом треке) и Седрика
    Бернсайда (дуэт и гитара на титульном треке).


    С таким аккомпанирующим составом работа певицы такого уровня просто обречена на
    успех - и альбом действительно получился отменный (да и качество записи вполне
    на уровне). В музыкальном отношении это не только традиционная американа - тут
    есть и мощные блюз-роковые треки, и энергичные соул-номера, и блюзовые баллады,
    и заводное кантри - одним словом, диск достаточно разнообразный. Злободневная
    лирика и мощная вокальная подача Шимекии заслуживают отдельной похвалы - это несомненно
    одна из лучших ее работ. Шимекия искренне поет о проблемах современной Америки
    (расизм, ксенофобия, вседозволенность с оружием и многое другое), о жизни таких
    же чернокожих матерей, как и она сама. Альбом очень хорош и настоятельно рекомендуется
    всем любителям современного блюза.


    В 2022 году критики журнала Living Blues признали Шимекию лучшей артисткой года,
    тогда как по опросу критиков журнала Downbeat она была признана "Блюзовой исполнительницей
    года". А пятнадцатого ноября 2022 года альбом Шимекии Коуплэнд Done Come Too Far
    получил номинацию на Грэмми 2023 года в категории "Лучший альбом современного
    блюза". Это уже пятая номинация певицы на престижную премию Грэмми.


    "Shemekia Copeland is the greatest blues singer of her generation." -The Washington
    Post


    "Powerful, ferocious, clear-eyed and hopeful...She''s in such control of her voice
    that she can scream at injustices before she soothes with loving hope. It sends
    shivers up your spine." -Living Blues


    "She is a commanding presence, a powerhouse vocalist delivering the truth." -The
    Philadelphia Inquirer


    "Shemekia Copeland is the greatest female blues vocalist working today. She pushes
    the genre forward, confronting racism, hate, xenophobia and other perils of our
    time. Regardless of subject matter, though, there''s no mistaking the majesty
    of Copeland''s instrument, nor the ferocity of her delivery. Copeland reaffirms
    the relevance of the blues." - Chicago Tribune, jazz critic Howard Reich'
