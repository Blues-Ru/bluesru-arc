- id: 69
  author: Леонид Аускерн
  mark: null
  date: '2002-12-17'
  text: 'С легкой руки Майкла Джексона мы привыкли в последнее время к выбеленным с помощью хитроумных воздействий на организм,
    приведенным с подмогой косметических ухищрений к некоему европеизированному стандарту лицам певцов и музыкантов, манекенщиц
    и моделей негритянского происхождения. На этом фоне лицо певицы с обложки CD "Turn The Heat Up" выглядит просто вызывающим
    в своей естественности, отсутствии малейших попыток воздействовать на слушателя не музыкальными средствами, в своей, если
    хотите, откровенной некрасивости, если судить по канонам белой культуры.


    <p>Несть числа случаям, когда за броским внешним имиджем кроется пустота. Слово "имидж" звучит почти кощунственно по отношению
    к Шемекии Копленд, но натуральность - это тоже имидж. И за имиджем Шемекии стоит столь же естественная, мощная и, что
    самое удивительное, виртуозна техника вокала. Просто не верится, что этой певице только девятнадцать лет. Как коньяк с
    годами только набирает крепость и аромат, так джазовые и блюзовые вокалисты с годами все более совершенствуют свое мастерство.
    А тут - уже в девятнадцать удивительно гибкий, сильный голос, и не только голос, но и вложенные в него без остатка душа,
    страсть, боль, неведомо как передаваемые этой юной девушкой. Впору вспомнить и Бесси Смит, и Билли Холидэй, и Арету, и
    Махалию, и единственную сравнимую с ними белую певицу - великую Дженис Джоплин.


    <p>Шемекия Копленд дебютирует данным диском. Она поет и соул, и ритм-энд-блюз, но особенно ярко у нее получаются медленные,
    тягучие, длинные блюзы. На этом альбоме их несколько: "Salt In My Mind", "Married To The Blues" (самая большая композиция
    на диске - семь минут) и, пожалуй, наиболее удачный трек - "Ghetto Child". Эта вещь написана отцом Шемекии, блюзовым гитаристом
    Джонни Клайдом Коплендом (Johnny Clyde Copeland), и, может быть, именно этот факт, а также то, что и сама певица выросла
    в нью-йоркском Гарлеме, придает ее исполнению особый блеск. Но ничуть не слабее и люба другая из 14 композиций альбома.
    Здесь просто нет слабых мест. Не боюсь повториться, но этот диск и эта певица стали для меня просто ошеломляющим открытием.
    Полностью согласен с мнением автора "liner notes" критика "Blues Revue" Арта Типалди, видящего в Шемекии Копленд восходящую
    звезду, котора засияет во всю мощь уже в ХХI столетии.


    <p>Сознательно ничего не пишу о музыкантах, работавших с певицей над диском. Они - отличные профессионалы и сделали свое
    дело здорово, но мне хочется, чтобы читатель и потенциальный слушатель не потерял в перечне имен главное в этом диске
    имя - Шемекия Копленд.


    <p>А вот фирму, издавшую CD, упомяну с удовольствием. Логотип "Аллигатора" - это настоящий знак качества, если речь идет
    о блюзе. Диски этой фирмы не часто попадают к нам, но каждый раз это очень сильные работы. Почаще бы! See you later, "Alligator"!'
- id: 1851
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-07'
  text: 'Мощь, сила, естественность и искренность в сочетании с удивительным для молодой певицы профессионализмом. Свой дебютный
    альбом Шимекия посвятила своему отцу - известному блюзмену Джону Клайду Копланду. И, надо сказать, честь фамилии не была
    посрамлена ни в коей мере - блестящий дебют и абсолютно заслуженное одиннадцатое место в блюзовом топе альбомов Биллборда.


    В качестве гостей из блюзовых звезд отметились Джо Луис Уолкер (гитара и вокал на треке 6), Майкл Хилл (гитара трек 2)
    и Майк Уэлч (блестящее гитарное соло на треке 7). На трех треках также присутствует медная группа Uptown Horns. Рекомендуется
    в первую очередь любителям чикагского блюза и особенно Коко Тэйлор.'
