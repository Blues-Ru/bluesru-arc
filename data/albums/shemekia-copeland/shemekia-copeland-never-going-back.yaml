- id: 1540
  author: Андрей Евдокимов
  mark: 8
  date: '2009-05-18'
  text: Увы, большие ожидание часто не оправдываются. В студии аудиофильского лейбла собрались клавишник Джон Медески, басист
    Крис Вуд и вокалистка Шемека Коплэнд. Не хватало, конечно, ударника Билли Мартина, зато пришел гитарист Марк Рибо. Союз
    наиболее самобытных музыкантов современного джаза с самым мощным голосом современного блюза обещал быть взрывоопасным…
    А вышло очень гладко и четко выверено. Ни одного яркого инструментального соло, ни одного грозного вопля. К авангарду
    в любом понимании альбом не имеет отношения, к блюзу он относится примерно наполовину. При таком сдержанном музыкальном
    исполнении на первый план выходит содержание. И тут есть, что послушать. Заглавный рассказ о том, почему героиня больше
    не вернется в Мемфис имеет почти гипнотическую ауру. Как всегда, в альбоме есть песня сочинения отца певицы. На этот раз
    это по-домашнему трогательный акустический блюз "Circumstances".
- id: 1543
  author: Федор Романенко
  mark: 10
  date: '2009-05-19'
  text: 'Предыдущие пластинки Шемекии были чем-то похожи друг на друга - мощный вокал, драйвовая слайд-гитара, забойный ритм,
    во многих вещах - игра в накачивание напряжения, которое разрешалось с достойной экспрессией. Такая качественная фирменная
    музыка ведущей блюзовой вокалистки, которая определила современную женскую блюзовую традицию и в соответствии с ней очень
    традиционно все пела и аранжировала.


    Пластинка "Never Going Back" была полной неожиданностью и поразила меня в процессе первого прослушивания. Дюжина песен,
    ритмов и аранжировок, музыкальных идей, которых я вообще ни разу до этого не слышал, (обычный улов - одна необычная песня
    на нескольких пластинках). Каждая вещь - эксперимент, не похожий на остальные и вообще ни на что либо еще. Такое ощущение,
    что Шемекия откладывала странные песни всю жизнь, чтобы записать на одной (главной?) своей пластинке.


    Музыка на диске - сплошное новаторство. Однако, не думаю, что из нее может что-то вырасти, какое-то направление, например,
    ибо больше 4-х минут одну такую идею ни во что не разовьешь.


    Отдельные песни, которые стоит отметить, - нежная соул-баллада Broken World, напоминающая о Snooks Eaglin - Never Going
    Back To Memphis, забойнейшая The Truth is the Light, "джазовая" нежная Black Crow с какими-то изумительными гармониями,
    фанковая и абсолютно разнузданная Limousine, еще фанк с отличными клавишами River''s Invitation, забой с шаффлом в Rise
    Up.


    Ни в одной песне Шемекия не надрывается, играет в очень разные эмоции. Она исключительно хорошо поет, с ней супер-музыканты,
    самое главное - материал поражает воображение. Одна из самых впечатливших меня пластинок за последнее время.'
- id: 1850
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-06-07'
  text: 'Чрезвычайно любопытная пластинка от блестящей блюзовой вокалистки, которую не без основания называют сегодняшней
    претенденткой на трон королевы блюза. Возможно, повлияла смена звукозаписывающего лейбла (это уже не привычный Аллигатор,
    а Теларк), а также смена продюсера (теперь это Оливер Вуд, который также записал гитарные партии). Тут нет надрыва и яростного
    напора ранних работ, зато есть высочайший профессионализм, разнообразие музыкальных идей и прекрасная вокальная подача
    материала. Диск из категории таких, которые переслушиваешь, и находишь что-то новое. Бесспорно, в полном соответствии
    с названием диска Шимекиа не стоит на месте и не оглядывается назад - диск и разноплановый, и новаторский, и одновременно
    очень качественный.


    Сопровождающий состав музыкантов тоже заслуживает отдельного упоминания, ибо на диске отметились такие гранды современной
    музыки, как клавишник Джон Медески, его партнер по основной группе басист Крис Вуд, а также гитарист Марк Рибо.'
