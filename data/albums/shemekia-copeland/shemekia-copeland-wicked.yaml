- id: 1852
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-06-07'
  text: 'Второй альбом Шимекии, принесший ей мировую славу: она получила ряд номинаций на самую престижную блюзовую премию
    W.C. Handy, три из которых она в итоге получила: песня года (It''s 2:00 A.M.), блюзовый альбом года и современная блюзовая
    артистка года. Более того - сам альбом был также номинирован на Грэмми и добрался до 8 места в блюзовом топе альбомов
    Биллборда.


    Хочу заметить, что на мой взгляд эти награды вполне заслужены: альбом достойный и в музыкальном, и в вокальном плане.
    За исключением кавера Staemy Windows, который недотягивает до блестящего исполнения Тины 1991 года, остальные треки заслуживают
    только похвалы. Отдельно стоит отметить дуэт с Рут Браун If He Moves His Lips.'
