  author: Андрей Евдокимов
  mark: 5
  date: '2003-12-06'
  text: 'Концерт, записанный c группой ANIMAL MIND в небольшом калифорнийском клубе
    15 января 1994г. Поет и играет на гитаре человек, чьи песни на заре белого блюз-рока
    блистали в репертуаре Джэнис Джоплин, Пола Баттерфилда и многих-многих других.
    Стало быть, это ветеранский блюз, только белый. Имеется расслабленная атмосфера
    и севший голос. Знаменитейшая песня Гравенитез "Buried Alive In The Blues" - в
    авторском (не лучшем) исполнении. Рекомендуется ностальгирующим блюз-рок-меломанам.


    Состав: <br> Nick GRAVENITES - v,g<br> Doug KILLMER - b<br> Mark ADAMS - h<br>
    Roy BLUMENFELD - d'
