- id: 1408
  author: Сергей Исправников
  mark: 8
  date: '2009-01-09'
  text: 'На диске собраны архивные записи британского блюзового гитариста Энтони Топхэма 1963-69 гг. Как ни странно, долгое
    время это был единственный CD этого неординарного музыканта, дававший определенное представление о его творчестве, но
    при этом не включавший ни одного официально изданного ранее трека. Начинал Топхэм в первом составе "Yardbirds", однако
    записей этой группы с его участием не сохранилось. Тогда ему было 15 лет, а как он пел и играл в этом возрасте можно услышать
    на этом диске. Здесь представлен исполненный им блюз Mance Lipscombe – "Sugar Baby", записанный у него дома на портативный
    магнитофон Grunding в 1963 г. Доносящиеся звуки губной гармоники, скорее всего, принадлежат его другу – Дастеру Беннету,
    с которым он периодически вместе выступал и записывался. На диске представлены четыре трека 1965-66 гг., демонстрирующие
    пример их совместного музицирования, включая фолк-блюзовый репертуар Дастера и инструментальную композицию Топхэма – "Tryin''
    Hard". Необходимо отметить, что исходное качество записи трех треков 1965 г. крайне низкое, и их издание здесь можно объяснить
    только причинами исторического характера. Гитарные вариации Топхэма еще более-менее слышны, а Дастер Беннет скорее угадывается.
    Что касается Дастера, то его первые студийные записи относятся только к 1968 г., а Топхэм впервые переступил порог профессиональной
    студии годом позже – в 1969 г. До этого времени они периодически давали концерты, часто просто собирались дома друг у
    друга, вместе играли, слушали записи, обменивались музыкальными идеями.


    В мае 1969 г. Дастер Беннет решил попробовать свои силы в качестве продюсера, организовав на независимом британском лейбле
    Blue Horizon сессию звукозаписи блюзового певца и гитариста Ллойда Уотсона. Тогда было записано четыре трека, открывающие
    данный диск, на которых Топхэм выступил в роли сессионного гитариста. Мало того, что ни один трек так и не был тогда издан,
    но это оказалась вообще единственная сольная запись Уотсона. В 1972 г. этот музыкант выиграл конкурс, проводимый журналом
    "Melody Maker" в категории "фолк-рок", затем играл на разогреве у таких звезд, как Дэвид Боуи, "King Crimson" и "Roxy
    Music" и, как ни странно, продолжает выступать до сих пор. А осенью 1969 г. Топхэм записал свой первый и единственный
    альбом "Ascension Heights" (Blue Horizon, 1970 г.). Демо-запись девяти инстурментальных композиций Топхэма для этого диска,
    сыгранных дуэтом с гитаристом Rick Hayward, является подлинной жемчужиной настоящего издания. Если на диске эти вещи исполнены
    с расширенной духовой секцией, практически, биг-бэндом, то здесь в полной мере раскрывается их изначальные красота и очарование.
    Фанковая составляющая, доминирующая на альбоме, здесь не так заметна, скорее это гитарный прогрессив-рок. В заключении
    стоит отметить, что данный диск, в основном, предназначен для любителей и коллекционеров британского блюза. Для первого
    знакомства с творчеством Топхэма я порекомендовал бы изданный в сентябре 2008 г. CD "The Complete Blue Horizon Sessions",
    на котором представлен его студийный альбом и в лучшем качестве переиздана сессия с Ллойдом Уотсоном.'
