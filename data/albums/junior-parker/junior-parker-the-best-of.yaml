  date: '2006-04-27'
  text: '<img src=http://www.platterpus.com/images/92386.jpg>


    Этот сборник состоит из ранних записей Паркера для лейбла Duke Records. MCA переиздала этот сборник в 1973 году. На диске
    12 блюзов и песен, среди них много известных хитов и стандартов: "Sweet Home Chicago", "That''s All Right", "Five Long
    Years", "Yonders Wall", "Things I Used To Do". Джуниор интересно поет, а иногда сам играет на гармошке. Музыка в стиле
    Мемфис-блюз и ритм-н-блюз, с духовыми и без. К сожалению, некоторые записи здесь почти ужасного качества - трудно получить
    удовольствие по полной. Игра группы тоже оставляет желать лучшего, на самом деле.'
