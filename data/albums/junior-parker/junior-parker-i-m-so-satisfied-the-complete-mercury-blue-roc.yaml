- id: 912
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-11-27'
  text: 'На этом сборнике записаны два номерных альбома Паркера ("Like It Is" 1967 и "Honey Drippin''" Blues 1969) + 7 бонусов
    (синглы и редкости) периода 1967-1968. Джуниор умер в 1971 году, так что можно считать, что это его поздние записи. Паркер
    - вокалист, он поет блюз (Мемфис-блюз), соул и ритм-н-блюз (есть даже несколько фанковых номеров). Его голос скорее красивый
    и "сладкий", чем мощный и глубокий. Это создает ощущение попсовости, струнные, подпевки и духовые добавляют элемент поп-соула,
    конечно (некоторые треки совсем трудно слушать из-за этого).


    Есть тут что послушать, но в целом, это материал не годится для любителей блюза, а до соул-фанка это все тоже не дотягивает.
    Можно сказать, что этот период Паркера - это легкий и довольно пресный ритм-н-блюз.'
