- id: 748
  author: Александр Панин
  mark: 6
  date: '2005-07-01'
  text: Малоизвестный сент-луисский гитарист первого блюзового поколения. На диске записи середины шестидесятых, первая половина
    соло, а вторая с товарищами (Биг Джо Уильямс и харпер Джордж Робертсон). К сожалению, совместные вещи записаны совсем
    плохо. Но первые одиннадцать сольных треков звучат очень прилично, Уэстон играет довольно примитивно и ритмично (можно
    сравнить с Томми Маккленнаном) и немного надрывно поет. В копилку старых блюзменов.
