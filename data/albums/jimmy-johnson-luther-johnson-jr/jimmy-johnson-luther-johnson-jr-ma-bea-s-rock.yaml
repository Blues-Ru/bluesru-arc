  author: Дмитрий Казанцев
  mark: 5
  date: '2005-08-09'
  text: 'В 2001 году датская фирма Сторивилл выпустила этот необычный диск. На нем - записи с концерта 1975 года в клубе Ma
    Bea''s в Нью-Йорке. 14 песен, 7 исполняет Джимми, а другие 7 - Лютер. У каждого своя группа, среди сайдменов есть известные
    люди: Big Voice Odom (vocal), Willie Lyons (guitar), Willie Kent (bass). Оба брата исполняют классику блюза и соул-блюза:
    "So Many Roads", "Crosscut Saw", "I Believe My Time Ain''t Long", "All Your Love", "Same Old Blues". Пение на высоте,
    а вот игра музыкантов оставляет желать лучшего - много грязи, каши, игры мимо ритма и нот, инструменты кое-как настроены.
    Еще одна больщая проблема - почти ужасное качество записи и плохой баланс; трудно получать удовольствие от такого концерта.'
