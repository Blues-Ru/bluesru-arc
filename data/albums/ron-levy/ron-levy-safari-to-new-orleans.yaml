- id: 520
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-04-02'
  text: 'Этот винил я взял домой из магазина даже не отслушивая. Во-первых, радует
    название альбома. Во-вторых, радует стикер: INDEPENDENT LABELS MAKE GOOD MUSIC
    (да, были и такие времена). В-третьих, на альбоме играют: Ronnie Earl, Darryll
    Johnson, Willie Green, Willie Tee, The Gokden Eagles и... KAZ KAZANOFF - такое
    я не мог не взять.


    Рон (настоящее имя Reuvin Zev ben Yehoshua Ha Levi) играет на клавишах - делает
    это классно! Поет так себе, но слушается приятно. Первая вещь на альбоме отличная
    (шаманство в стиле swamp soul), а потом идет традиция по блюзу, р-н-б и рок-н-роллу.
    Когда шаманят и фанкуют - очень клево! Классная запись и СУПЕР-музыканты. Может
    тут не так много ярких вещей, но это ОЧЕНЬ хорошая музыка для 1987 года (записались
    именно тогда).


    Рон - мастер по соул-джазу, блюзу и вообще... хорошее имя у него. В 70-е годы
    он также играл в группе Би Би Кинга.'
