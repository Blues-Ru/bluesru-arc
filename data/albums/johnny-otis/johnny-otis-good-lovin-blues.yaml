- id: 915
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-11-27'
  text: Ритм-н-блюз жив, при чем у Отиса он жив именно в классическом стиле 60-х. Соул, фанки и блюз; блюза тут много. Сам
    Джонни Отис играет на рояле, вибрафоне и немного поет. Его сын Шагги ОБАЛДЕННО играет соло на электрогитаре. Тут две вокалистки
    - Ramona & La Dee Streeter и еще вокалист Jackie Payne. Духовая секция на высоте, даже удивительно, что в 1990 году люди
    играют аранжировки а-ля 60-е. И еще один хороший альбом Джонни и Ко.
