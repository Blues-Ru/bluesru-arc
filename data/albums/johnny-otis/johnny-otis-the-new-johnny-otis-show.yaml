  author: Дмитрий Казанцев
  mark: 8
  date: '2005-11-27'
  text: Классический ритм-н-блюз. Что-то соул, где-то чистый блюз, иногда фанки. Главная красота тут - это вокалисты (Linda
    Dorsey, Delmar Evans, Vera Hamilton, Wendell Perry, David Pridgen, Charles Williams и сам Джонни Отис, конечно. Еще один
    акцент - это великолепная игра на гитаре Шагги Отиса (сына Джонни). Большой состав, классная игра, хорошие песни. Приятный
    альбом.
