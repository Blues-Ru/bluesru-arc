  date: '2005-08-13'
  text: 'Джонни Отис поет, говорит, шутит и играет на клавишах. Его юный сын Шагги
    прекрасно играет на гитаре. На этом альбоме 10 песен, а длится он всего 30 минут.
    Здесь - блюзы, соул, ритм-н-блюз; в основном вещи Отиса, но есть и известные треки
    - "High Heel Sneakers", "C.C. Rider", "Goin'' Back To L.A."


    Интересный, жизнерадостный диск с хорошим чувством юмора. Надо отметить, что Don
    "Sugarcane" Harris играет на скрипке на этой пластинке.'
