  text: Классный альбом Хопкинса. Он вышел на довольно редком блюзо-джазовом лейбле Barnaby/Candid (еще одно подразделение
    CBS) в 1970 году. Диск длинный (более 40 минут) и интересный - Лайтнин играет на гитаре и поет, рассказывает нам свои
    истории и ИГРАЕТ НА ПИАНИНО в нескольких треках! Прекрасное качество записи.
