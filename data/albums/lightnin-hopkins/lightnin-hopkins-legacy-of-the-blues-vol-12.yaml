  author: Дмитрий Казанцев
  mark: 6
  date: '2003-09-10'
  text: 'Это один из поздних альбомов Хопкинса. Это не сборник, но один из 12 альбомов в серии The Legacy Of The Blues на
    лейбле GNP Crescendo. Вместе с Лайтнином тут играют: Айра Джеймс - гармошка; Лэрри Боунз МакКолл - барабаны; Расти Майерс
    и Оузелл Робертс - бас. Малый состав, но это совсем непохоже на раннего Хопкинса 50-х и 60-х годов. Он тут играет на электрогитаре,
    ритм-секция впереди по звуку и подаче.


    На альбоме 10 треков и все они звучат как традиционный блюз, от старого стиля ЛХ тут только его вокал и манеры. Звук и
    игра довольно однообразны и трудно что либо выделить. Можно лишь отметить первый трек "Please Help Poor Me".


    Оценка 3 балла. Ничего нового или особо интересного. В этой серии есть очень классные альбомы, но это не относится к этому.
    Много гитарного ковыряния, не его это дело - электрогитара, он был мастером на акустике. Мало ярких песен, почти нет,
    ритм-секция играет вяло и однообразно.


    Довольно редкий и дорогой альбом, но абсолютно необязательный для обычной коллекции.'
