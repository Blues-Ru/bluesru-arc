- id: 472
  author: Дмитрий Казанцев
  mark: 8
  date: '2004-03-03'
  text: 'По музыке и подбору блюзов это один из сильнейших альбомов Хопкинса. 11 песен
    на 41 минуту. Он играет один, без группы. Вещи настолько сильны, что трудно выбрать
    лучшие. Я бы выделил Sail On Little Girl Sail On, Goin To Dallas, Blues In The
    Bottle, Catfish Blues.


    Оценка 4 балла. По музыке все супер и пятерка, но есть "проблемы". Гитара довольно
    сильно не строит, и это мешает. Стерео-разделение "голос слева" - "гитара справа"
    может быстро достать, хочется сделать грамотный моно-микс. И еще одно, гитара
    у Хопкинса не ахти и порой издает странные звуки разломанной деки, это не очень
    приятно. На хорошем аппарате слышен весь кайф записи, но слышны и эти проблемы
    со строем и звукоизвлечением. Любителям мп3 и глухим это не помешает...'
