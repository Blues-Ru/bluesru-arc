  author: Дмитрий Казанцев
  mark: 7
  date: '2005-08-25'
  text: 'Это записи Хопкинса 1967-1968 годов, они были сделаны для маленького лейбла Little Darlin'' в Хьюстоне. Здесь собраны
    5 сессий - три в студии и два концерта в местных барах. Лайтнин играет на электрогитаре, он совершенно расслаблен и свободен,
    на концертных записях общается с посетителями и даже джемует с ними. Все это больше похоже на домашние записи или репетиции.
    При этом качество записей отменное, если не считать некоторых шумов и брака пленки (это происходит не часто).


    На двух дисках 38 песен - это очень большой объем, а ведь тут Хопкинс не отличается разнообразием. Его игра на электрогитаре
    - это не всегда хорошо, иногда он просто бренчит и ковыряет. Здесь много известных нам песен, но ВСЕ ОНИ записаны как
    вещи Лайтнина (впрочем, это не очень-то и важно). Этот двойник сильно понравится фанатам Хопкинса, но все же это далеко
    не самые лучшие его записи.'
