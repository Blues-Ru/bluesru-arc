- id: 203
  author: Дмитрий Казанцев
  mark: 10
  date: '2003-09-02'
  text: 'Это второй альбом Хопкинса на Prestige/Bluesville. Он числится как Lightnin''
    Hopkins with Sonny Terry. Да, здесь с ним на гармошке играет великолепный Сонни
    Терри. Играет скромно, не мешая Хопкинсу рассказывать свои истории. Мы знаем,
    как хорош Лайтнин соло, как он прекрасен в трио, а тут еще и Сонни Терри - отличная
    кобинация. На басу играет Леонард Гаскин, на ударных Белтон Эванс.


    Альбом состоит из 8 блюзов и длится 37 минут. Записан в октябре 1960 года и звучит
    очень здорово для тех лет.


    Надо отметить виртуозную игру ЛХ на гитаре и его своеобразный вокал. Кто-то сравнивает
    его с Хукером, кто-то с Мадди, но Хопкинс - это отдельная личность и есть немного
    гитаристов, которые так умело владеют акустической гитарой. Все 8 композиций прекрасны,
    но хочется выделить первую вещь Rocky Mountain и последнюю беседу с Сонни Conversation
    Blues, где они оба поют и разговаривают, и Сонни по-отцовски называет Хопкинса
    джуниором, хотя сам лишь на год его старше.


    Оценка 5 баллов. Тут нет слабых мест или звуков.'
