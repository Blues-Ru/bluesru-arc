  author: Дмитрий Казанцев
  mark: 9
  date: '2006-07-13'
  text: 'Два альбома 1967 года на одном КД! Дизайн ужасен, но музыка на высоте! Хопкинс
    играет на электрогитаре, но тут у него это отлично выходит. Настроение волшебное!
    Он не один, ему помогают ударные, бас, пианино и гармошка (но не во всех песнях).


    Очень советую! Настоящий блюз.'
