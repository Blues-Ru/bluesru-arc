- id: 275
  author: Дмитрий Казанцев
  mark: 10
  date: '2003-11-21'
  text: 'Классический альбом Хопкинса. 9 треков на 37 минут. Играет он и один, и с
    группой. Тут вместе с ним на трех треках гармошечник Билли Байзор, пианист Бастер
    Пикенс, басист Доналд Кукс и драммер Спайдер Килпатрик. Но все же это соло-альбом
    Лайтнина. Его вокал и акустическая гитара. Его рассказы и волшебные аккорды и
    ноты. Есть в этом что-то интимное и психоделическое.


    Запись великолепная, и можно с головой погрузиться в мир Хопкинса, нужно лишь
    чуть-чуть понимать, о чем он поет и где он шутит – это высшее удовольствие. Эта
    музыка не для коллективного прослушивания и не для танцев – это способ задуматься
    и отдохнуть. Если умеешь играть на гитаре, хочется даже подыграть иногда, и это
    нормальное желание – Хопкинс оставляет много воздуха и пауз, он не забивает уши
    грязью и лишними нотами.


    Невозможно выделить лучшие песни на этом альбоме – это одно целое творение с одним
    звуком и настроением. Never Miss Your Water – шедевр. Лишь три трека выделяются
    по инструменталу, но они не ломают формы повествования. Я не могу поставить этому
    диску оценку ниже 5 – здесь все просто хорошо.'
