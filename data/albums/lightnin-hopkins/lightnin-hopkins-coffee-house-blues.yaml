  author: Дмитрий Казанцев
  mark: 8
  date: '2007-07-16'
  text: 'Записи Хопкинса начала 60-х для фирмы Vee-Jay. 5 концертных номеров, 8 студийных треков соло и 2 блюза с группой.
    Записи очень приличного качества, местами Лайтнин - просто виртуоз на акустике!


    Прекрасное пение и песни. Редкий и нужный материал для любителей настоящего блюза.'
