- id: 276
  author: Дмитрий Казанцев
  mark: 10
  date: '2003-11-21'
  text: 'Мощный альбом! Тут Хопкинс с басистом Леонардом Гаскином и барабанщиком Херби Ловеллом. С первых нот нешуточный напор
    и хорошая блюзовая злость и цинизм. Это уже не совсем интимный и нежный акустический Лайтнин; здесь рождается то, что
    потом будут называть роком.


    Альбом длится 42 минуты и состоит из десяти треков. Отличная по качеству запись и очень специальное настроение у этой
    сессии. Я, конечно, не слышал всех пластинок Хопкинса, но считаю этот альбом лучшим (пока лучшим). Здесь много известных
    тем: My Babe, I''m A Crawling Black Snake, Black Ghost Blues. Все вещи настолько интересные и яркие, что трудно выделить
    даже один (так всегда на альбомах Лайтнина – они почти концептуальны). Rocky Mountain Blues – моя любимая вещь тут, но
    я уверен, что Вам может понравиться и другая.


    Оценка 5 баллов и пока это лучший Хопкинс в моей коллекции.'
