- id: 174
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-08-22'
  text: 'У этого альбома несколько недостатков. Во-первых, это сборник. Во-вторых, это концертник. В третьих, он очень длинный.
    Но если копнуть глубже, то почти все концертники - это нарезка из разных залов, и точно всегда не целый и подчищенный
    гиг, так что это почти оправдание. А если еще глубже, то концертная подборка всего за пару лет выступлений - это уже почти
    концептуальный альбом (если записи на одном уровне качества, конечно). А если учесть, что все хорошие концертники почти
    всегда были двойными, то это оправдывает и длину этого альбома (почти 70 минут). Вообще, мне кажется, что концертник должен
    быть длинный - минут так на 80-90.


    На этой компиляции живых номеров 11 треков, все очень известные, прославленные и яркие. Радует тот факт, что записи ОЧЕНЬ
    приличные, и на приличном аппарате на хорошей громкости создается впечатление присутствия в клубе с приличным звуком.
    А это редкость, согласитесь.


    Половина материала совпадает с его теларковским концертником Live at Buddy Guy''s Legends 97 года, но исполнения тут все
    же другие. Очень много юмора, шутовства (такое лицедейство я люблю), интимных разговоров и подробностей, много эмоций
    и драйва от пожилого bad motherfucker-a Джуниора. Видимо, он так и умер юниором, не успев помудреть и состариться. 40
    лет на сцене в образе молодого мода и повесы - это тяжелая жизнь, на самом деле.


    Что можно выделить на альбоме? Сложный вопрос, тут много импровизации и хулиганства, но мы-то хотим судить о самой музыке.
    Я бы отметил Hoo Doo Man (это его конек еще с середины 60-х), очень здорово сделана Sweet Sixteen Эла Грина, забавное
    исполнение Little Red Rooster, здорово играют в Waitin'' On The Night Train, ну и под конец все сливки в Help Me.


    Оценка 4 балла, несмотря на все минусы. Очень много драйва, эмоций, хулиганства и ПРАВДЫ - это нельзя не оценить.'
