reviews:
- id: 469
  author: Дмитрий Казанцев
  mark: 6
  date: '2004-03-03'
  text: 'Надо сразу отметить, что этот дебют Джуниора на Telarc Blues - самый слабый
    из трех альбомов на этом лейбле. Тут Бадди Гай на гитаре, Лаки Питерсон на клавишах,
    но материал слабый, а подача очень холодная. Это просто удивительно! Можно выделить
    лишь интересные обработки Oh, Pretty Woman и The Train (Ray Charles).


    Оценка 3 балла. Хороший живой звук, классные музыканты, неяркие композиции, что-то
    слишком затянуто, холодно и бездушно местами. 10 треков на 60 минут - это слишком
    долго для такого диска.'
