- id: 471
  author: Дмитрий Казанцев
  mark: 6
  date: '2004-03-03'
  text: 'Это второй альбом Джуниора и его первый диск на Vanguard. Пластинка состоит
    из двенадцати блюзов и длится аж 49 минут! Проблема в том, что половина треков
    записаны в студии, а другая половина на концерте в Pepper''s Lounge на юге Чикаго.
    Эти две разные записи плохо сочетаются друг с другом и сильно отличаются по качеству
    записи и исполнения; лажа еще и в том, что лайв и студия идут вперемешку.


    На концерте играют: Бадди Гай на гитаре, Фредди Билоу на ударных, Лерой Стюарт
    на басу; в студии добавлен гитарист Уолтер Бизли, а Литтл Эл заменил Фредди за
    ударной установкой. Игра Бадди Гая не может оставить равнодушной никого; он великолепен.
    Пение и гармошка Уэллса великолепны, как и игра Бадди. А вот материал значительно
    слабее, чем на дебютном диске Hoodoo Man.


    Оценка 3 балла. Очень похабно звучит такое сочетание живых грязных записей с приличной
    игрой в студии; могли бы сделать два альбома или хотя бы разделить на две части
    и разместить на разные стороны. И все же на диске много классных номеров, я бы
    выделил отличные Country Girl, Shake It Baby, Checking On My Baby, I Got A Stomach
    Ache, Everything''s Going To Be Alright. Можно сказать, что половина диска на
    высшем уровне, а другая вовсе необязательна. Но диск длинный и получается, что
    он просто необходим в любой коллекции, несмотря на низкую и среднюю оценку разных
    критиков.'
