  date: '2007-12-12'
  text: 'На четвертом DVD из серии "Легенды блюза" представлен концерт действительно легендарного дуэта исполнителя на губной
    гармонике Junior Wells и гитариста Buddy Guy. Впервые два этих незаурядных музыканта послевоенного электрического блюза
    встретились, а затем и подружились еще в 1958 г. на совместных джемах в чикагском "708 Club". Впоследствии Джуниор Уэллс
    привлек Бадди Гая к работе над своим знаковым альбомом 1965 г. "Hoodoo Man Blues", а с 1967 г. их дуэт выступал на постоянной
    основе. Несмотря на успех у аудитории по обе стороны Атлантики, выпуск пластинок и участие в престижных международных
    фестивалях, в 80-е гг. они оказались без контракта с звукозаписывающей компанией и каких-либо определенных перспектив
    на будущее. Своего рода, блюзмены-чужаки в эпоху рэпа и хип-хопа. В это время и произошла съемка одного из их клубных
    выступлений, включенная в этот DVD.


    Концерт состоялся 15 июня 1986 г. в "Nightstage" в Кембридже. На сцене Бадди Гай и Джуниор Уэллс зажигали по полной программе,
    не только наглядно показав, что хоронить блюз было, мягко говоря, рановато, но и дав фору многим поп-идолам. Помимо виртуозного
    владения инструментами они продемонстрировали яркое шоу, полное искрометного юмора и драйва. Кроме авторского материала
    на концерте была сыграна классика жанра: "Juke" Литтл Уолтера, "My Younger Day" Сонни Боя Уильямсона, "Trouble No More"
    и "Got My Mojo Working" Мадди Уотерса. Сама запись велась в надежде показать ее по телевидению. Однако конъюнктура музыкального
    рынка в то время была другая, и кроме короткого ролика, использовавшегося для поддержки их гастролей в Южной Америке в
    следующем году, весь отснятый материал был положен на полку. Соответственно, впервые он представлен широкой аудитории
    только в настоящем издании.


    В качестве бонуса на диске записан фрагмент их выступления в Бостоне 11 марта 1989 г. вместе с интервью. К этому времени
    дела обоих музыкантов пошли в гору, но вскоре их дороги разошлись – каждый занялся сольной карьерой. Джуниор Уэллс перешел
    на Telarc, где он записывал альбомы до своей преждевременной кончины в январе 1998 г. Что касается Бадди Гая, то его звездный
    час пробил, когда в 1991 г. он выпустил ставший международным бестселлером альбом "Damn Right, I''ve Got The Blues" на
    британском лейбле Silvertone, а в 2005 г. был внесен в Зал славы рок-н-ролла. Что касается данного DVD, то это хорошая
    возможность посмотреть совместное выступление двух мастеров, наглядно демонстрирующее, что настоящий талант может выстоять
    вопреки неблагоприятным внешним обстоятельствам и рано или поздно получит надлежащее признание.'
