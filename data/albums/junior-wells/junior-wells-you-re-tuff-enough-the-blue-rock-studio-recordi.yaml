reviews:
- id: 1405
  author: Константин Колесниченко
  mark: 7
  date: '2009-01-08'
  text: 'Четвертый сольный альбом Джуниора и на нем он продолжает развивать направление, выбранное на предыдущем "Coming At
    You" - побольше фанка, богатая духовая секция, новый материал. Нельзя сказать, что у него не получается такая музыка -
    Веллс звучит очень убедительно: он отлично поет в этом жанре, да и его игра на гармонике хорошо вписывается в такую концепцию.
    Но альбом довольно длинный и где-то в середине начинаешь уставать от довольно агрессивной игры музыкантов, да и все композиции
    выдержаны приблизительно в одном темпе, что почти не дает продыха слушателю.


    Джуниор мог бы стать еще одним Джеймсом Брауном, что очень наглядно показывает этот альбом, но блюз все-таки оказался
    ему ближе этой музыки, хотя всю свою карьеру он успешно совмещал фанк и блюз на своих альбомах и выступлениях.'
