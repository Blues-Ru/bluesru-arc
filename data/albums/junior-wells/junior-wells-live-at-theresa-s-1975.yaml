- id: 1041
  author: Александр Панин
  mark: 9
  date: '2006-10-30'
  text: 'Январь 1975-го года. Город Чикаго, маленький, человек на сорок зрителей,
    клуб Theresa''s Lounge. Играет Джуниор Уэллс с бэндом, за вход просят один доллар.
    Два из этих январских выступлений были записаны на профессиональном оборудовании
    для последующей трансляции на местной радиостанции. В один день не уложились,
    так как гитарист Sammy Lawhorn в течение первого концерта сильно набрался, и во
    время второго его заменял Byther Smith. Оба вечера в составе бэнда отыграл Фил
    Гай, брат Бадди Гая. В итоге на диске двенадцать композиций, среди которых ряд
    хорошо известных: Juke, Help The Poor, Key To The Highway, Goin'' Down Slow, Messin''
    With The Kid. В паузах между ними – разговоры Джуниора с публикой. Среди зрителей
    явно есть знакомые, в честь одного из них даже играется импровизация на тему Happy
    Birthday. Весь исполняемый материал звучит очень кайфово, это чикагский фанки-электроблюз
    высшего качества. Отличные гитарные ходы, впечатляющая игра Джуниора на гармошке,
    яркий и запоминающийся вокал, хорошие песни и аранжировки. Качество записи приличное,
    хотя и уступает студийному, конечно. Лейбл Delmark ранее выпустил концерт Отиса
    Раша <a href="http://www.allmusic.com/cg/amg.dll?p=amg&sql=10:38q6g40ctv5z">All
    Your Love I Miss Loving: Live at the Wise Fools Pub</a>, теперь издана эта запись
    Джуниора Уэллса. Надеюсь, что у них в загашниках осталось еще много интересного!'
