- id: 2094
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2012-08-16'
  text: 'Джуниор Уэллс (настоящее имя Эймос Блэкмор) - одна из блюзовых легенд 20-го
    века, певец, композитор и мастер губной гармоники, прославившийся игрой в группе
    Мадди Уотерса, а также долговременным сотрудничеством с Бадди Гаем.


    Come On In This House - третий альбом Джуниора для фирмы Теларк, записанный практически
    полностью unplugged с привлечением таких приглашенных звезд блюзовой слайд-гитары,
    как Сони Ландрет, Боб Марголин, Дерек Тракс, Кори Харрис, Джон Муни, а также сопровождающего
    состава с участием Тэба Бенуа на акустической гитаре и знаменитого ударника из
    Нью-Орлеана Германа Ернеста III. Джуниор исполняет классику чикагского и дельта
    блюза, а также несколько собственных композиций. В итоге получился отличный альбом
    традиционного акустического блюза с великолепной гармоникой и пением от Уэллса
    и высокопрофессиональной игрой всех остальных музыкантов - своего рода современное
    прочтение традиционного дельта блюза.


    Одна из лучших работ музыканта, номинация на Грэмми за лучший традиционный блюзовый
    альбом, 13 место в блюзовом чарте Биллборда и лучший блюзовый альбом 1996 года
    по мнению читателей журнала Living Blues.'
