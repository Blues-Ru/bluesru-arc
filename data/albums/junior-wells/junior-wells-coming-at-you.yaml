reviews:
- id: 557
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-04-02'
  text: 'Четвертый альбом Джуниора и второй на лейбле Vanguard (записан в марте 1969
    года). На этот раз группа большая и с духовой секцией (очень надуманные аранжировки);
    я не могу сказать, что это очень интересно в контексте подачи Уэллса и при наличии
    Бадди Гая на гитаре. Слишком много звуков порой, а это не совсем блюзовая концепция.
    Запись очень плохого качества и баланс инструментов оставляет желать лучшего.


    На диске 11 песен, но диск коротенький. Блюз и ритм-н-блюз без особой глубины
    и вдохновения; такое впечатление, что записывались наспех и все были без настроения.
    Удивляет и набор банальных тем типа Worried Life Blues или Hoochie Coochie Man.
    Слабый альбом; мне непонятно как Уэллс дошел до такого после своего ВЕЛИКОГО дебюта
    1965 года.'
