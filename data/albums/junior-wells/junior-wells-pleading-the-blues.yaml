- id: 724
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-06-15'
  text: 'И снова они вместе - Джуниор и Бадди. На этот раз гитарно-гармошечный блюз с группой Фила Гая (брата Бадди). Прекрасный,
    живой звук, море эмоций и энергии. Красота минорных блюзов "Pleading The Blues", "Take Your Time Baby" и "I''ll Take Of
    You" (by Brook Benton), традиция в виде "It Hurts Me To" (Elmore James), фанки в "Cut Out The Lights", "I Smell Something"
    и "Just For My Baby" - все это есть на этом диске.


    В оригинале было всего 7 треков, но один добавили, и мы имеем почти 50 минут настоящего блюзового джема в студии. 6 вещей
    написал Уэллс, он также поет все песни. Бадди Гай "отрывается" на соло-гитаре, а Фил Гай играет интересные ритмические
    риффы - это создает уникальный саунд этого состава и альбома.


    Один из лучших дисков Уэллса (да и Бадди Гая тоже).'
