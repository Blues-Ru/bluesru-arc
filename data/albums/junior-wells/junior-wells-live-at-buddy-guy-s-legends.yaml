  author: Дмитрий Казанцев
  mark: 8
  date: '2003-12-12'
  text: 'Так получилось, что этот концертник стал последним диском Уэллса и как бы подвел итог его жизни как музыканта. Диск
    записан в ноябре 1996 года в знаменитом клубе Buddy Guy''s Legend в Чикаго и издан фирмой Telark. Бадди записал 4 альбома
    для Теларка - 3 студийных и один лайв.


    На этом диске 11 композиций, и длится он 58 минут. Запись отличная, почти фанковый состав, прекрасный набор песен, Джуниор
    шутит и безумствует как обычно. Оценка - 4 балла; концерт хорош, но студийные работы Уэллса на Теларке звучат намного
    солиднее. Я не стану выделять лучшие треки, весь концерт звучит как одно целое шоу; так оно почти и есть, альбом записан
    с двух гигов.'
