- id: 536
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-02'
  text: 'Очень серьезный блюзовый "замес". Уэллс хорош как всегда, но тут у него еще и отличные помощники - друг Бадди Гай
    на гитаре, очень серьезный пианист Отис Спэнн, Ирнест Джонсон на басу и Фред Билоу на ударных. Луис Майерс играет на гитаре
    в четырех треках, в двух вместе с Бадди Гаем. Последнюю песню поет Бадди Гай.


    Песен всего 8, но подборка очень грамотная. Мы знаем, что с самого начала Джуниор играл в разных стилях, включая фанк
    и р-н-б, но здесь он находится в состоянии deep blues и очень старается быть похожим на своего старшего друга Мадди Уотерса
    (состав-то тоже близок к Мадди). Бадди и Отис творят чудеса! Никаких танцев и шаффла, все очень мощно и в блюзе. Сразу
    надо отметить сногсшибательные треки - I Could Have Had Religion, I Just Wanna Make Love To You, Blues For Mayor Daley,
    I Wish I Knew What I Know Now.'
