  date: '2002-12-17'
  text: 'Не найдется такой, пусть даже самой краткой энциклопедии блюза, где не упоминался
    бы Джуниор Уэллс. Я специально подчеркиваю этот факт, чтобы читатель получил представление
    об уровне музыканта, с которым он встречается, приобретая этот диск. Это классик.
    Живой классик блюза, и дай Бог ему долгих лет жизни и активного творчества.


    <p>Джуниор Уэллс (он же Амос Блэйкмор, р. 1934 г.) появился на свет в Мемфисе,
    а большая часть его творческой жизни связана с Чикаго. Роль обоих этих городов
    в музыкальной культуре Штатов можно не комментировать. "Старик Державин" в лице
    самого Мадди Уотерса заметил Джуниора еще в 1950 г. и двумя годами позже, еще
    отнюдь не "в гроб сходя, благословил", взяв в свой ансамбль. Помимо Уотерса, главными
    учителями Уэллса стали Сонни Бой Уильямсон, Элмор Джеймс, Уилли Диксон. Со второй
    половины 60-х и до наших дней Джуниор Уэллс, великолепный певец и исполнитель
    на губной гармонике, в дуэте с Бадди Гаем (Buddy Guy) или в сольных проектах остается
    одним из самых ярких представителей чикагского блюза, незаменимым звеном в цепочке,
    связывающей сегодняшнюю блюзовую сцену с традицией, представленной славными учителями
    и кумирами Уэллса. Два последних альбома Уэллса, студийный "Come On In This House"
    (96 г.) и концертный "Live At Buddy Guy''s Legends" (97 г.), включались в номинацию
    "лучший альбом традиционного блюза" на премию "Грэмми".


    <p>Я потому позволил себе столь много места уделить этой пунктирной биографической
    справке, что свежий CD Уэллса принадлежит к категории "The Best Of...", изначально
    предполагающей принцип обзорности и подведения итогов некоего творческого этапа.
    В данном случае речь идет о компиляции из четырех дисков, записанных им в период
    сотрудничества с "Telarc" (начиная с 1993 г.), — трех студийных и одного, вышеупомянутого,
    концертного.


    <p>Лишь три композиции диска написаны самим Уэллсом. Он все-таки исполнитель par
    excellence. Но какой! Скудость собственной лексики и бедность слов в целом особенно
    остро ощущаешь, когда сталкиваешься с необходимостью передать мощь, отчаяние,
    страсть и ярость, заключенные в этой музыке. Недоверчивых настоятельно приглашаю
    убедиться в этом самостоятельно. При обнаружении этот CD надо "брать" просто немедленно!


    <p>Помимо прочего, вы сможете услышать и именитых гостей Джуниора Уэллса. В стартовой
    "Oh, Pretty Woman" на "Хэммонд"-органе и в "The Train" на фортепиано играет молодой
    блюзовый "дофин" Лаки Питерсон (см. "JAZZ-квадрат" #1/98), а в "Get Down" чрезвычайно
    интересно слушать, как бьется о рамки блюзовой "клетки" трепещущая гитара самого
    Карлоса Сантаны. Но лично мне больше всего понравилась другая композиция — сделанный
    только с двумя, и не столь знаменитыми партнерами — Джон Муни (John Mooney) —
    слайд-гитара и Боб Сунда (Bob Sunda) — бас — медленный, прозрачный, беззащитно
    являющий миру свою внешне столь незамысловатую структуру и безжалостно пронзающий
    ваше сердце "King Fish Blues". Слушайте Джуниора Уэллса!'
