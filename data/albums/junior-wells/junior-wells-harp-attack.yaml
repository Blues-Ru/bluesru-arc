  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-11-16'
  text: 'Классика чикагского блюза от четырех виртуозов губной гармоники в сопровождении отличного аккомпанирующего состава,
    который выбирали лично Джеймс и Джуниор: Майкл Колман на гитаре, Лаки Петерсон за клавишами, Джонни Гайден на басу и Рэй
    Эллисон за ударными.


    Джуниор Уэллс, Кэрри Белл и Джеймс Коттон в разное время занимали почетное место солиста в группе Мадди Уотерса, что является
    высшим отличием в блюзовом мире. Билли Брэнч моложе своих именитых коллег, но он учился у лучших, и результат не замедлил
    сказаться - Уилли Диксон пригасил его вместе с Кэрри Беллом в свою группу Chicago Blues All Stars. Все четверо джемовали
    друг с другом в разных комбинациях во время концертов, но до этого никогда не записывались вместе.


    Данным альбомом фирма Аллигатор и ее основатель и продюсер данного диска Брюс Иглауэр дарят настоящий подарок всем любителям
    традиционной блюзовой гармоники.


    Line-Up:


    James Cotton, Harmonica and Vocals


    Junior Wells, Harmonica and Vocals


    Carey Bell, Harmonica and Vocals


    Billy Branch, Harmonica and Vocals


    Michael Coleman - Guitar, Lucky Peterson - Piano, Johnny B. Gayden - Bass, Ray "Killer" Allison - Drums'
