- id: 359
  author: Дмитрий Казанцев
  mark: 10
  date: '2003-12-12'
  text: 'Джуниор записал три студийных альбома для аудиофильской фирмы Telark, этот альбом второй из трех. Надо сказать, что
    Уэллс закончил свою жизнь на "высокой" ноте, и все его последние альбомы очень хорошие, хоть и разные. Этот диск самый
    ритм-н-блюзовый и соуловый. Кто-то видит в этом огромный минус, но как можно пропустить пластинку, на которой записаны
    шикарные версии таких песен, как Sweet Sixteen (Al Green), Get Down (War) и Use Me (Bill Withers)?


    Альбом длинный (56 минут) и состоит из 12 композиций. Тут есть очень известные гости: Бонни Рэйтт, Сонни Лэндрэт и даже
    Карлос Сантана. Звук, продакшн и аранжировки на самом высшем уровне, без всяких сомнений. В конце своей жизни Уэллс все
    больше становился певцом и шоуменом, отсюда меньше игры на гармошке и более прифанкованный набор вещей на альбоме. Я бы
    отметил несколько лучших треков, это Sweet Sixteen, Get Down, Shaky Ground. Оценка - 5 баллов; тут немного блюза, но очень
    много КЛАССНОЙ МУЗЫКИ!'
- id: 1087
  author: Константин Колесниченко
  mark: 10
  date: '2007-06-06'
  text: 'По-моему, это лучший альбом Джуниора Веллса и мне совсем не понятно, почему Bill Dahl с Олмьюзика поставил ему всего
    1,5 балла. Вроде бы он адекватный рецензент, хоть и склонен к старым записям.


    Этот альбом - апофеоз в смешивании соула и фанка для Джуниора Веллса, а также (пожалуй, за исключением "Come On In This
    House") на нем максимальное количество приглашенных гостей: Carlos Santana, Bonnie Raitt, David Torkanovsky, Wille Weeks,Rico
    McFarland, Sonny Landreth и т.д.


    Гармоники Джуниора на альбоме меньше, чем хотелось, но когда он играет - это настоящий подарок - она мелодична и по-веллсовски
    перкуссивна. Вывод: отличный, разнообразный альбом, на котором есть все от акустических вещей, до Use Me Билла Визерса.'
