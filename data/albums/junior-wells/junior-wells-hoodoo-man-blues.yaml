- id: 150
  author: Дмитрий Казанцев
  mark: 10
  date: '2003-08-18'
  text: 'Да, это лучший альбом Джуниора. Да, это 1965-ый год (а не 1969-й, например). Да, тут играет Бадди Гай.


    Но дело даже не в этом. Дело в том, что лично для меня этот альбом перевернул само понятие БЛЮЗ. Было это давно, но чувства
    остались. Этот альбом не похож на однообразную продукцию Чесса, хотя и записан, и рожден в Чикаго. Этот альбом настолько
    разнообразен, что диву даешься. Мощная энергетика, бескомпромиссный жесткий звук, синкопированный прифанкованные ритмы
    (это лишь 65 год!), игра по мажору в миноре и наоборот, абсолютно нестандартная игра на гармошке (многие харписты ее так
    и не поняли), невероятное пение для блюзового харпера (Джеймс Браун уже отдыхал), прекрасный выбор материала.


    Как сделаны тут Good Morning Little Schoolgirl, Hound Dog, Lawdy Mama, You Don''t Love Me, Chitlin Con Carne и Yonders
    Wall - это великолепно! Все по-новому, все по-другому. Тут и твист, и южный фанк, и рок (который еще и не родился), и
    соул высшего класса (который родится на несколько лет позже). И все это на дебюте известного кутилы и модника из чикагской
    тусовки. Невероятно!


    Обратите внимание на Wee Wee Hours - столько эмоций и любви умел передавать только один человек в музыке - Al Green, но
    он только начинал, и о нем никто не знал.


    Стоит лишь добавить, что на гитаре играет сам Бадди Гай (может, это его лучший альбом вместе с Muddy Waters Folk Singer?),
    на барабанах - Билли Уоррен, на басу - Джек Майерс, на харпе и вокале - великолепный, молодой, бодрый, чувственный, обаятельный,
    сексуальный, дурной, хитрый, редкий человек - Джуниор Уэллс.


    Я бы сказал, что этот альбом один из лучших в блюзе вообще; может быть и лучший.'
