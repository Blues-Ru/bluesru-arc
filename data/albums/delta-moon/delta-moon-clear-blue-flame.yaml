  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-09'
  text: 'Пятый альбом группы, где впервые отсутствует женский вокал, и основную вокальную
    нагрузку берет на себя Том Грэй. Такая потеря в вокальной палитре отчасти искупается
    более жестким звуком группы. Пластинка более однородная стилистически и преимущественно
    блюз-роковая с примесью кантри и, конечно же, с одновременной игрой двух слайд-гитаристов,
    ставшей визитной карточкой коллектива.


    Обратите внимание на Money Changes Everything - эта песня была хитом Сидни Лопер
    в начале 80-х, так вот, оказывается, ее написал Том Грэй! И версия этой вещи на
    альбоме просто отпадная!


    В 2008 году Том Грэй был назван блюзовым композитором года по версии The American
    Roots Music Association.'
