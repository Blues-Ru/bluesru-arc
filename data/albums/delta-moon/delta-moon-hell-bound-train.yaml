reviews:
- id: 1861
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-06-09'
  text: 'Пятый студийный (а всего седьмой) альбом от мастеров свамп-блюза и слайд-гитарных рифов из Атланты. В принципе вроде
    все "фишки" коллектива на месте - и сплав блюза, кантри и софт-рока, и сдвоенные слайдовые соло, и почти полностью авторский
    материал (только один кавер), и мастерское исполнение, а как-то не цепляет.


    Принципиальных отличий от предыдущего альбома вроде нет, но вот чего-то нехватает - то ли драйва, то ли энергетики. В
    целом, конечно, неплохо, но как-то скучновато вышло.'
