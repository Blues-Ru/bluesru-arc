- id: 1207
  author: Артем Липатов
  mark: null
  date: '2008-01-30'
  text: 'Собственно говоря, с творчеством Тома Грея читатель наверняка уже знаком - вспомните песенку Синди Лаупер Money Changes
    Everything, это как раз он ее написал. Но не сочинение песенок чужим дядям и тетям является основным занятием Тома, а
    лидерство в новой блюзовой сенсации - атлантской группе Delta Moon. Это их третий альбом, и первый, вызвавший бурную реакцию
    отечественных блюзовых фэнов.


    Чем же так хороша эта группа? Двумя факторами: во-первых, харизматичной и талантливой вокалисткой Джиной Ли (она на этом
    диске сдержанна не в пример концертам, обзоры которых повествуют о каком-то невероятном взрыве эмоций) и двумя солирующими
    слайд-гитарами, играющими, как правило, то в унисон, то раздельно. Собственно говоря, группа не играет блюз как таковой
    - скорее, упругий и драйвовый ритм-н-блюз (не r''n''b!), клонящийся в сторону рока (южного буги в основном), но роком
    не становящийся. Впрочем, кавер-версии старых вещей Джей Би Ленуара и Р.Л. Бернсайда звучат очень убедительно и современно,
    сохраняя при этом преемственность по отношению к мастерам прошлого. Если суммировать впечатления, то, похоже, Delta Moon
    является связующим звеном между, скажем, Джоном Ли Хукером и ZZ Top. И только слушая этот диск, понимаешь, как этого звена
    недоставало.'
- id: 1859
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-09'
  text: 'Группа из Атланты базируется на отличной совместной игре двух слайд-гитаристов Тома Грэя и Марка Джонсона и играет
    коктейль из традиционного блюза, музыки кантри и южного буги, сохраняя при этом некоторую элегантность звучания. Красивый
    сильный голос певицы Джины Ли оттеняет профессиональную игру музыкантов, включения скрипки добавляют дополнительную долю
    фолк-рока. В целом - очень интересное смешение стилей, поданное с элегантностью профессионалов.


    Не могу не согласиться с одним из рецензентов, который написал о музыке группы: True blues deeply rooted in the tradition
    but modern at the same time with a touch of rock and pop, played with feeling, excellent skills and plenty of soul.


    Кроме собственных номеров, исполняются каверы классиков блюза, и даже на удивление Nightclubbing Давида Боуи и Игги Попа
    (но, естественно, в аранжировке, свойственной современной традиционной музыке юга США).'
