reviews:
- id: 685
  author: Дмитрий Казанцев
  mark: 5
  date: '2005-05-27'
  text: 'Настоящий, сумасшедший блюзовый джем. Всего 7 блюзов длятся аж 44 минуты.
    Бо Диддли на электрогитаре и использует wah-wah-pedal, Хаулин Вулф играет на акустике
    и гармошке, Мадди Уотерс на электро-гитаре. Все трое поют и кричат. Им помогают:
    Отис Спэнн - пианино, Хьюберт Самлин - гитара, Бадди Гай - бас (басист из него
    совсем слабый, к сожалению), Клифтон Джеймс - барабаны, Куки Ви - голос и тамбурит
    (вот эта дама постоянно орет и визжит, что очень сильно портит и так сырой джем).


    Почти все песни тут известные, но они исполнены в таком "психоделическом" ключе,
    что их можно с трудом узнать. Иногда кажется, что они просто хулиганят.'
- id: 2031
  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2012-02-03'
  text: 'Записанный в сентябре 1967 года в студии джем трех грандов блюза, которым
    аккомпанирует не менее звездный состав музыкантов (вплоть до того, что Бадди Гаю
    достался только бас - ну прямо по аналогии с Китом Ричардсом в Dirty Mac во время
    съемок Rock-n-Roll Circus).


    Очень сырой традиционный блюзовый джем с перекличками и диалогами исполнителей,
    непопаданием в такт, затянутыми кимпозициями и общей психоделической атмосферой.
    Куки Ви, которая, если не ошибаюсь, обычно выступала на подпевках у Бо Диддли,
    стоило бы слегка приглушить, а трем грандам хоть изредка прислушиваться к остальным
    музыкантам (хотя, возможно, в этом есть какая-то особая "фишка"). Я бы не стал
    рассматривать данную запись в качестве иллюстрации творчества каждого из исполнителей,
    а скорее как блюзовый документ той психоделической эпохи.'
