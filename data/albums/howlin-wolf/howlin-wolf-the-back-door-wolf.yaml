  text: 'Это последний альбом Великого Волка, он записан для фирмы Чесс с группой
    The Wolf Gang - это концертная команда Хаулина в те годы: Hubert Sumlin (guitar),
    Eddie Shaw (sax), Andrew McMahon & James Green (bass), Willie Harris (guitar),
    Detroit Junior (keys), S.P. Leary (drums), сам Вулф играет на гармошке и гитаре.


    10 отличных блюзовых композиций, прекрасно записанные и сыгранные. Хаулин Вулф
    умер через три года после записи этого диска.'
