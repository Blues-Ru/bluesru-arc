  author: Сергей Исправников
  mark: 9
  date: '2009-12-08'
  text: 'Несмотря на то, что данная коллекция вышла уже двадцать лет назад в 1989
    г., до настоящего времени она остается наиболее полным изданием ранних записей
    Хаулин Вулфа на студии Sun Сэма Филипса в Мемфисе в 1951-52 гг. Сэм Филипс прославился
    во второй половине 50-х гг., как человек открывший миру Элвиса Пресли, Карла Перкинса,
    Джерри Ли Льюиса и ряд других героев рок-н-ролла, а в начале своей карьеры он
    записывал ритм-энд-блюз – Би-Би Кинга и Уолтера Хортона. Делая записи, он продавал
    их для выпуска на пластинках другим лэйблам – лос-анджелесским RPM и Modern братьев
    Бихари и чикагской Chess. Не избежали подобной участи и треки Хаулин Вулфа, при
    этом Филипс на всякий случай отослал их обеим фирмам, и обе заинтересовались Вулфом,
    начав издавать его песни параллельно. Разразился скандал и, в конечном итоге,
    между двумя фирмами было достигнуто соглашение, согласно которому Хаулин Вулф
    стал эксклюзивным исполнителем фирмы Chess, а к RPM перешел контракт с ритм-энд-блюзовым
    певцом и пианистом Rosco Gordon.


    Хаулин Вулф появился в Западном Мемфисе, штат Арканзас, после войны в 1948 г.,
    когда он решил оставить сельское хозяйство и зарабатывать на жизнь музыкой. Мемфис
    был одним из центров по пути переселения американских негров с аграрного юга на
    индустриальный север в поисках лучшей доли, в нем еще до войны сформировалась
    уникальная музыкальная культура, сочетающая как городское джазовое, так и сельское
    блюзовое начало. Вулф, безусловно, тяготел ко второму и был известен в локальных
    кругах еще с 30-х гг. В Мемфисе он получил работу на радиостанции KWEM, как радио-ведущий
    и живой исполнитель, и в сорок лет стал звездой местного масштаба. Тут-то на него
    и обратил внимание Сэм Филипс, пораженный сначала мощью его исполнения, а потом
    при личной встрече – самим внешним видом Вулфа, его крайне экспрессивной манерой
    живых выступлений. В то время с ним играли Willie Johnson (гитара), Willie Steele
    (ударные) и William "Strutcher" Johnson (фортепьяно).


    Первые сессии звукозаписи Вулфа у Филипса прошли в мае-июне 1951 г., когда были
    записаны две ставшие этапными вещи – "Moanin'' at Midnight" и "How Many More Years"
    – определившие все дальнейшее направление его музыкальной карьеры. Всего на Sun
    состоялись восемь сессий Вулфа, при этом в разное время к его аккомпанирующей
    группе присоединялись Айк Тернер, гармошечник Джеймс Коттон, саксофонист Чарльз
    Тэйлор и тромбонист Уолтер Смит. На записи все гитарные партии блестяще исполнил
    Уилли Джонсон, а Вулф только пел и играл на губной гармонике. И если его техника
    игры на инструменте не отличалась виртуозностью, то вокал поражал глубиной и первозданной
    мощью. На данном диске собраны мемфисские записи Вулфа, продюссированные Сэмом
    Филипсом, не издававшиеся на синглах фирмой Chess. Помимо собственно блюза здесь
    присутствуют буги и отдельные более легкие танцевальные номера, входившие в клубный
    репертуар Вулфа того периода. Как говорил о себе сам Вулф, "может, я и необразованный
    мужчина, зато настоящий мужик". Это чувствуется в каждом из представленных здесь
    треков.'
