  author: Константин Колесниченко
  mark: 10
  date: '2007-11-13'
  text: 'На мой взгляд, Howlin'' Wolf - лучший певец блюза, из всех, что были, будут или есть сейчас. Волк - квинтэссенция
    блюзмена, эталон.


    Этот чессовский сборник синглов Howlin'' Wolf с 1951 по 1964 - пожалуй, лучшая компиляция творчества этого музыканта.
    "His Best" начинается с "Moanin'' at Midnight" и "How Many More Years", сыгранными малым составом, и заканчивается игрой
    довольно большого ансамбля, с саксофонами, двумя гитаристами и пр. Видно, что материал подобран таким образом, чтобы показать
    эволюцию Волка, как музыканта в Чикаго.


    Я часто читал о всяких противопоставлениях Мадди Wolf''у, так вот, у Волка для меня есть одно преимущество - это гораздо
    более интересные аранжировки его музыки. Взять хотя бы "Who''s Been Talkin" - замечательный блюз, с привкусом румбы.


    Большая доля успеха Волка в Чикаго - это конечно же песни Вилли Диксона, этот неменьший по размерам, во всех смыслах,
    музыкант присутствует на этих синглах со своим контрабасом (как и огромное количество других отличных, культовых и известных
    музыкантов).'
