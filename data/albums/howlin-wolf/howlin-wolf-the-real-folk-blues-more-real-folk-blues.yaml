  date: '2005-08-11'
  text: 'Два лучших сборника Вулфа на одном компакте. Здесь лучшие записи Мастера Блюза 50-х и 60-х годов - всего 24 композиции
    (все на фирме Чесс, конечно). Если Вам надо купить всего один компакт Хаулина, то возьмите этот - не прогадаете.


    "Killing Floor", "Sittin'' On Top Of The World", "300 Pounds Of Joy", "Built For Comfort" - все эти шедевры тут в лучших
    исполнениях.'
