  author: Сергей Исправников
  mark: 9
  date: '2009-12-09'
  text: 'На втором выпуске мемфисских записей Хаулин Вулфа собраны треки, издававшиеся на синглах фирмой Chess, а также нереализованные
    дубли. На первых двух сессиях Вулфа, ориентировочно прошедших в мае 1951 г., были записаны многочисленные дубли двух композиций
    – "Ridin'' In Moonlight" и "How Many More Years". Эти записи оказались сыроватыми, характеризуя скорее процесс адаптации
    Вулфа к условиям звукозаписывающей студии. Запись, пригодная для издания на пластинке, была сделана только с третьей попытки
    – в июле 1951 г., когда на пленку оказался зафиксирован ставший каноническим вариант "How Many More Years" и "Moanin''
    At Midnight" с фирменными "завываниями" Вулфа, оправдывающими его прозвище. Обе композиции были изданы 15 августа 1951
    г. на дебютном чессовском сингле Вулфа, принесшем ему национальную известность. Вдохновленный успехом, Сэм Филипс организует
    следующую сессию в декабре 1951 г., добавляя духовые к жесткому саунду Вулфа, чтобы придать ему определенный лоск и большую
    коммерческую привлекательность. Из шести записанных тогда композиций Chess на сингле издали две – динамичную "Howlin''
    Wolf Boogie" и медленный блюз "The Wolf Is At Your Door".


    В 1952 г. на студии Sun в Мемфисе проходят четыре сессии звукозаписи Вулфа. На первой, состоявшейся в январе, было записано
    пять композиций, две из которых – стремительный буги-блюз "Mr. Highway Man" и украшенная роскошной партией фортепьяно
    задумчивая "Gettin'' Old And Grey" – были отобраны для издания на третьем сингле. В апреле в студии к бэнду Вулфа присоединился
    харпер Джеймс Коттон, но из восьми записанных тогда треков на следующем сингле был издан только один – среднетемповая
    композиция с элементами кантри-блюза "Saddle My Pony" – c записанным позднее "Worried All The Time" на обороте. Последняя
    сессия Вулфа у Сэма Филипса состоялась 7 октября 1952 г., на ней группа была усилена тромбонистом Уолтером Смитом и саксофонистом
    Чарльзом Тейлором. Из четырех треков изданы была два – танцевальный "Oh! Red" и берущий за душу "My Last Affair". Видя
    недюжинный творческий и коммерческий потенциал Вулфа, Леонард Чесс пригласил его перебраться в Чикаго, чтобы на постоянной
    основе записываться на фирме Chess. Вулф принял приглашение и в конце 1952 г. – начале 1953 г. переехал в Чикаго. По его
    словам, "у меня была своя машина и еще 3 900 долларов в кармане. Я единственный, кто приехал с Юга, как джентльмен".'
