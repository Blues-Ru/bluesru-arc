  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2016-08-02'
  text: 'Честер Артур Бернетт (более известный как Хаулин Вулф) - знаменитый американский
    блюзмен, один из основателей чикагской школы, оказавший существенное влияние на
    многих английских музыкантов, включая Rolling Stones, Yardbirds, Animals и многих
    других. Данные записи были сделаны во время его визита в Лондон со 2 по 7 мая
    1970 года в сотрудничестве с такими грандами английской сцены как Эрик Клэптон,
    Стив Уинвуд, Билл Уайман, Чарли Уоттс и Ринго Старр.


    Идея этих записей принадлежит продюсеру Chess records (ведущая блюзовая фирма
    грамзаписи Чикаго, на которой записывался в том числе и Хаулин Вулф) Норману Дэйрону,
    который предложил Клэптону записать альбом с Вулфом. Клэптон согласился, Дэйрон
    организовал визит Вулфа в Лондон, Клэптон пригласил ритм-секцию Rolling Stones
    и Яна Стюарта, а Дэйрон подобрал остальных музыкантов, включая талантливого 19-летнего
    харпера Джеффри Карпа. По слухам, руководство студии Chess вначале не хотело оплачивать
    проезд в Англию штатному гитаристу Вулфа знаменитому Хуберту Самлину, но Клэптон
    настоял, и Самлин приехал.


    Записи проходили в студии Олимпик студиоз, были записаны классические треки из
    репертуара Chess records. Однако в первый день - 2 мая - Уайман и Уоттс не могли
    присутствовать, и пришлось срочно искать замену. В этот день на басу играл Клаус
    Вурман, а на ударных - Ринго Старр, которого в буклете для конспирации назвали
    просто "Ричи". Атмосфера при записи была нервозная, музыканты не были сыграны
    заранее, и позднее Клэптон не раз не слишком лестно отзывался об этом альбоме
    и своей игре на нем. Тем не менее Хаулин Вулф отработал на все 100, и время все
    расставило по местам - диск получился довольно интересный.


    Следует также отметить, что окончательная доработка музыкального материала была
    сделана на студии Chess в Чикаго, где были наложены некоторые другие инструменты,
    включая духовые. Например, Стив Уинвуд во время Лондонский сессий находился с
    гастролями в Америке, и в Лондоне не присутствовал, однако его партии в 5 песнях
    были наложены позже.


    Альбом неоднократно переиздавался, а в 2002 году было выпущено двухдисковое делюкс-издание
    с альтернативными версиями и репетиционным материалом. Да, это не лучший диск
    ни у Вульфа, ни у аккомпанирующих ему суперзвезд, но это своего рода документ
    эпохи, который всегда найдет своего слушателя.'
