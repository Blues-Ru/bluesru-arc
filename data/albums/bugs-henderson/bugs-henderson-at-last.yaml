- id: 340
  author: Андрей Евдокимов
  mark: 5
  date: '2003-12-06'
  text: Все лучшее, что есть на этом CD, гораздо лучше и гораздо раньше делал Джонни
    Уинтер... "Предупреждение! Эта музыка не содержит никаких переналожений, никаких
    электронных безделушек, никакого надувательства и никакого буйволого дерьма."
    - Напомнимает древние пластинки "Queen" - "И никто не играл на синтезаторах"...
    Возожно под пивко с виски в одном стакане это и напоминает праздник честного рок-н-ролла.
    На трезвую голову оно же производит угнетающее впечатление концерта "Дип Перпл"
    "Live In Texas", причем в усеченном варианте - для бедных. На фоне замшелого застоя
    идей пафосный посыл гитариста "умру, мол, за рок-н-ролл" вызывает ассоциации с
    Неуловимым Джо, которого поймать нельзя по той причине, что он никому не нужен"
    Неуловимый Багз Хендерсон?.. малозаметное "p1978" позволяет предположить, что
    записан концерт не в 90-х, а в 70-х, что значительно оправдывает и затяжные сольные
    терзания гитары, и идейные декларации, и хард-роковый энтузиазм гитариста. Если
    это так, то эта запись обретает немалую историческую ценность, особенно для исследователя
    остинского блюза, пытающегося узнать, в какой окружающей среде формировался юный
    гений SRV. "Boppin' The Blues/Blue Suede Shoes", рок-н-ролл по-техасски, вполне
    сносен. Скучища, устроенная на останках великолепной Hound Dog Лейбера и Столлера,
    и каша-размазня из Honest I Do Джимми Рида - непростительны. Так совестливый блюзмэн
    с классикой жанра не поступает.
