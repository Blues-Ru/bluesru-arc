- id: 1079
  author: Константин Колесниченко
  mark: 9
  date: '2007-05-31'
  text: 'Название альбома обманчиво, ДиЛэй не играет тут кучу шаффлов, не копирует чикагских мастеров. Он просто записался
    с ансамблем из Чикаго и с двумя гостями-звездами - Jimmy Dawkins, Zora Young.


    Пол продолжает развивать свой собственный стиль, в аранжировках, звуке гармоники, звучании всего ансамбля. ДиЛей - музыкант
    с идеальным вкусом. Он удивительно быстро играет на гармонике, но это не та скорость, что, скажем, у Sugar Blue, у диЛэя
    - это потрясающе изобретательные и мелодичные соло.


    Этот альбом чуть слабее предыдущего "Nice and Strong", но все равно образчик мастерства. Очень жаль, что Пола уже нет
    среди нас. Весь материал Пол написал сам или в соавторстве.'
