- id: 1498
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: 'Судьба вмешивается в блюзовую музыку навязчиво. В начале марта в возрасте 55 лет скончался лидер игры на губной (в
    стиле Западного побережья) гармонике Пол деЛэй. И ровно неделю спустя вышел в свет его лучший альбом, озаглавленный настолько
    символично, что мурашки бегут по коже. Записан альбом на нескольких концертах, начиная с 2004 года.15 треков включают
    в себя несколько блюзовых стандартов. В отличие от студийных альбомов, большинство песен собственного сочинения. Голос
    и гармоника звучат истинно по-блюзовому. И не возможно решить, что лучше: стандартно блюзовая жалостливая история, расписанная
    по квадрату, о жизни в дороге Life''s Highway или синкопированная ироничная All Cried Out. Но невозможно спорить с тем,
    что это лучший из альбомов Пола деЛея... Вот только поздравить музыканта уже невозможно.'
