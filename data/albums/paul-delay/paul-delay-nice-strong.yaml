reviews:
- id: 1078
  author: Константин Колесниченко
  mark: 10
  date: '2007-05-31'
  text: 'Какой же отличный альбом! Таким должен быть современный блюз! На альбоме нет тривиальных шаффлов, все выдержано в
    разных аранжировках: джаз, фанк, соул - и все на классной блюзовой основе с потрясающим резким вокалом Пола. Теперь о
    его игре на гармонике - она уникальна, я не слышал ни одного такого музыканта! У Paul deLay такой довольно перкуссивный
    подход в игре, он много прыгает по регистрам. Похоже играл Джуниор Уеллс, но Пол делает это гораздо более эффектно, виртуозно,
    не теряя при этом души. Примерно в половине композиций deLay играет на хроматической гармонике с потрясающим звуком, подходом
    и мелодизмом, смело заявляю - в блюзе он лучший во владении хроматической гармоникой. Все песни на альбоме написаны Полом
    самим или в соавторстве. Рекомендую этот сд всем без исключения - тут нет ни одного слабого места!'
