- id: 966
  author: Константин Колесниченко
  mark: 10
  date: '2006-01-31'
  text: 'На этом сборнике помещены композиции всего с двух альбомов Пола: "Other One" и "Paulzilla", причем, помещены практически
    полностью и последовательно.


    Многие, в том числе, и аллмьюзик, относят Paul DeLay к представителям стиля Уэст-Коуст. Я считаю это не совсем верным,
    по нескольким причинам. Пол играет не в характерной для харперов этого стиля манере – его соло очень мелодичны и коротки,
    он практически не играет заезженных фраз. Его вокал (а Пол очень крупный человек) тяготеет к соул-блюзовым исполнителям.
    И в третьих, его аранжировки похожи больше на то, что делали в 60-х Jack Mcduff, Jimmy Mcgriff и пр., в его музыке много
    фанка и соул элементов. В качестве своих учителей Пол называет: своего тезку Пола Баттерфилда, Литтл Уолтера и Чарли Масселвайта.


    Практически весь материал на диске авторский, музыканты играют очень виртуозно, разнообразно и интересно. Сборник сделан
    очень хорошо и нетривиально, составители взяли действительно лучшее из этих альбомов Пола. Знаменитый Cube Koda сказал:
    "DeLay blows with authenticity and a full command of his instrument and way more than a hint of reckless abandon."'
