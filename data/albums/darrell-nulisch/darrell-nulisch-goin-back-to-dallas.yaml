- id: 1245
  author: Андрей Евдокимов
  mark: 7
  date: '2008-04-09'
  text: '55-летний Нолиш пишет в буклете: "Я давно намеревался сделать чисто блюзовый альбом. К записи мы относились так же,
    как к концертному выступлению. Пусть все будет просто и честно, нужно создать настроение и просто повеселиться". Все действительно
    просто. Нолиш великолепно играет на гармонике, но не демонстрирует виртуозность. Главное – эмоциональность. Все звучит
    очень сдержанно и не очень весело. Это такая привычная тоска, а не "депрессуха" напоказ. Блюз для переживающих кризис
    среднего возраста и для тех, кто благополучно его миновал. Есть две замечательные песенки для танцев: быстрая и медленная.
    Все остальное – музыка интровертная, чтобы погрустить наедине со старыми друзьями, вроде Джонни Уокера или Бадди Вайзера.'
