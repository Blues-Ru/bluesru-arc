- id: 1689
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-18'
  text: 'Имя Джимми Тэкери хорошо известно любителям современного блюз-рока, а Дэвид Райат является не только братом знаменитой
    Бонни Райат, но и старым другом Джимми: за 30 лет до выхода данной пластинки тинейджер Дэвид Райат дал своему приятелю
    Джимми Тэкери пластинку Бадди Гая. Они играли вместе в школьной группе, но затем музыкальные пути друзей разошлись.


    Дэвид играл в различных локальных группах, аккомпанировал на контрабасе своей знаменитой сестре, выступал в концертах
    с братьями Форд и другими музыкантами. Он мультиинструменталист (гитара, гармоника, бас) и вокалист, первый сольный альбом
    которого вышел в 1996 году.


    Диск 2000 года записан двумя старыми друзьями (Дэвид выступает в качестве вокалиста) в сопровождении группы музыкантов,
    включая участие Бонни Райатт (бэк-вокал на паре треков). Продюсировал Патрик Форд. Записаны песни Джимми, Дэвида и ряд
    блюзовых стандартов. Получился альбом классического современного электрического блюза, исполненный с присущим данным музыкантам
    профессионализмом. Мне, правда, не очень понравилась пара коммерческих фанковых треков в начале альбома, но зато остальное
    - очень и очень прилично.'
