reviews:
- id: 1604
  author: Андрей Евдокимов
  mark: 6
  date: '2010-01-18'
  text: "Джимми Текерри выпустил в свет очередной альбом. Было бы удивительно, если\
    \ бы он это не сделал – Певец-гитарист выпускает альбомы ежегодно (почти) с начала\
    \ своей сольной карьеры. Первую известность ему принесла группа The Nighthawks,\
    \ которую он собрал в 1972 году на пару с Марком Веннером. Причем, Веннер не только\
    \ играл на губной гармонике, но и пел в большинстве песен, и публика именно его\
    \ и воспринимала как фронтмена, Текери откололся от Найтхоукс и приступил к сольной\
    \ деятельности в 1986 году. К тому времени вместе с Найтхоукс он за 14 лет записал\
    \ 12 альбомов. Так что, можно сказать, это у него привычка такая – выпускать альбомы.\
    \ Альбом нынешнего года вышел на престижном лейбле Теларк-Блюз, и нацелен он на\
    \ аудиторию, влюбленную в гитару: все песни исполнены с пролонгированной гитарной\
    \ импровизацией. \t\t\t\t\t\t\t Стараясь не слишком удаляться от блюза, Джимми\
    \ Текери пробовал свои силы и в смежных стилях – от блюз-рока до просто тяжелого\
    \ рока, от серф-музыки 50-х до древней кантри-музыки. Все песни в новом альбоме\
    \ - сочинения самого Джимми Текери, аккомпанирует ему Марк Стутсоу – ударные и\
    \ Марк Бамгарнер – бас-гитара. Все вместе – Джимми Такери энд зе Драйверз. Альбом\
    \ с десятью песнями идет 62 минуты. Способность Текери растягивать песни так,\
    \ чтобы они в среднем длились более 6 минут впечатляет, особенно, если учитывать,\
    \ что песни идут без какого бы то ни было развития – от и до – куплет-припев-гитарный\
    \ проигрыш. Но вот чего нельзя отрицать – так это легкость, вольность и виртуозность\
    \ в инструментальной импровизации."
