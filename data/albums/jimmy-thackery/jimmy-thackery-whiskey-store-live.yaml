  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-18'
  text: 'Когда в 2002 году Джимми Тэкери и Тэб Бенуа записали совместный студийный
    альбом, такая комбинация двух признанных лидеров собственных групп могла показаться
    довольно необычной. Тем не менее оказалось, что луизианский блюз Бенуа с относительно
    мягким телекастером прекрасно уживается с более жестким блюз-роковым стратокастером
    Тэкери. Музыканты отправились на совместные гастроли в поддержку альбома, которые
    оказались очень успешными, и по итогам был выпущен данный диск, записанный во
    время концерта в марте 2003 года.


    В концертной версии шесть лучших треков с совместного альбома дополнены еще тремя,
    включая кавер Отиса Реддинга These Arms of Mine. Естественно, в концертной атмосфере
    все треки сыграны более жестко и технично, не говоря уже о существенно более длинных
    версиях, изобилующих гитарными соло. Оба гитариста демонстрируют блестящую технику,
    но и сопровождающие музыканты не отстают - саксофонист Джимми Карпентер и мастер
    Хаммонда Кен Фольтинсон срывают свою долю вполне заслуженных апплодисментов, ритм-секция
    также на уровне. Редкий случай, когда звезды не затмевают, а естественно дополняют
    друг друга.


    В итоге имеем семьдесят с лишним минут раскошного блюз-рока с сумасшедшим драйвом
    и один из лучших концертных блюзовых альбомов, когда-либо слышанных мной.


    На мой взгляд, концертник на голову выше студийного альбома. Пятое место в топе
    блюзовых альбомов Биллборда.


    Настоятельно рекомендую всем любителям современного блюза и блюз-рока.'
