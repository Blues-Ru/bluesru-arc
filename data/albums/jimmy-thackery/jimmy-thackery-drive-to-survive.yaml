  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-18'
  text: 'Джимми Тэкери - певец, композитор и гитарист-виртуоз из Питтсбурга, попал
    под влияние блюза, увидев выступления Бадди Гая и Джимми Хендрикса. В 1974 году
    он стал гитаристом Nighthawks, а в конце 80-х уже гастролировал под собственным
    именем.


    Создав в начале 90-х трио Jimmy Thackery & The Drivers, он подписал контракт с
    фирмой Blind Pig Records на выпуск сольных альбомов, четвертым из которых стал
    Drive to Survive, один из лучших его релизов. (Точнее, это пятый сольный альбом
    Джимми, но акустическая пластинка Sideways in Paradise была записана совместно
    с Джоном Муни, а не под именем the Drivers.)


    Продюсировал диск знаменитый Джим Гэйнс. Джимми Тэкери прекрасно владеет различными
    музыкальными стилями - на альбоме слышны отголоски и рокабилли, и джаза, и блюза,
    и рока. Однако в целом это мощный и мастерски сыгранный блюз-рок. Восемь треков
    собственного сочинения плюс три кавера. Отдельного внимания заслуживает кавер
    классического трека Shadows и Venturers - Apache, который после этого прочно вошел
    в сет-лист концертных выступлений гитариста.


    14 место в блюзовом чарте Биллборда и 8 место среди самых продаваемых релизов
    независимых блюзовых фирм 1996 года.'
