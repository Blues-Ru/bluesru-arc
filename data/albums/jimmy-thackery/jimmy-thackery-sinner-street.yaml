- id: 1687
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-18'
  text: 'Восьмой сольный альбом (шестой на Blind Pig Records) американского блюз-рокера записан с помощью знаменитого продюсера
    Джима Гэйнса. Мощный энергичный блюз-рок Джимми украшен игрой саксофониста Джимми Карпентера, придающего музыке дополнительные
    краски. Как обычно, лучшие треки на диске - инструментальные: заглавный с дуэлью гитары и саксофона, а также последний
    роскошный приджазованный номер. Вокал никогда не был сильным местом Джимми, но его игра на гитаре достойна всяческих похвал.


    Приятный диск техничного блюз-рока (с легкой примесью фанка, джаза и хард-рока) и один из лучших у Джимми Тэкери.'
