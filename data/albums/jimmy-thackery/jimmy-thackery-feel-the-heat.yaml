- id: 1656
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-11'
  text: 'Новый студийный альбом от ветерана блюз-рокера, вышедщий через 3 года после предыдущего. Джимми выступил в качестве
    продюсера и написал 9 из 12 треков лично да плюс последний трек в соавторстве с Эрни Кэйтом, который присутствует на нем
    в качестве гостя.


    Диск записан в формате power trio и сделан в ключе последних пластинок Тэкери: тут есть и блюз-рок, и блюз, и рок-н-ролл,
    и фирменные инструменталы (все-таки вокалист Джимми - не самый выдающийся), и серф, и кантри, но все-таки блюз превалирует.
    Крепкая профессиональная работа с филигранным владением гитарой и приятными развернутыми соло. Диск не лучший у Джимми,
    но вполне приличный. Возможно, не все треки одинаково хороши с точки зрения композиции и аранжировок, но в части техники
    исполнения никаких претензий нет, да и быть не может - Тэкери профессионал высшего класса.'
