  author: Алексей Калачев
  mark: 5
  date: '2002-10-26'
  text: 'Если вы думаете, это диск дуэтов, ошибаетесь. 2/3 песен записал Теб, всего 4 –Джимми. Перефразируя нашего президента:
    котлеты отдельно, сосиски отдельно. Мух тут нет, поскольку оба достаточно хороши. Зачем составили тогда такой диск? Могу
    предположить - маркетинговый ход. Совместные проекты хорошо продаются, хотя и включают уже знакомый публике материал.'
