- id: 1686
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-18'
  text: Джимми Тэкери всегда славился мощной гитарной техникой, будучи при этом среднестатистическим
    вокалистом. Грамотный ход от владельцев фирмы BlindPig Records, с которыми Джимми
    сотрудничал с 1992 по 2000 год, записав там 6 альбомов, - они собрали на одном
    диске его инструментальные композиции, наглядно демонстрирующие мастерство игры
    гитариста. Семь треков написаны самим Джимми (или в соавторстве), остальные -
    каверы блюзовой и серф-классики. Для привлечения тех, кто уже купил предыдущие
    диски Джимми, на сборник добавлены 3 неизданные ранее концертные композиции. Несмотря
    на некоторую стилистическую разноплановость (что неудивительно для сборника),
    диск чрезвычайно добротный, а талант Джимми раскрывается во всей красе.
