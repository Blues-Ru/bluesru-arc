- id: 1489
  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: 'В названии альбома прячется каламбур, но правильней воспринимать его буквально.
    Это музыка для тех, кто не хочет перемен: все тот же блюз-роковый Джонни Уинтер,
    застывший в дремучих 70-х. Слушая Hobart''s Blues, вы никогда не догадаетесь,
    что это запись нового, а не прошлого века. Daze in May унесет вас во времена расцвета
    серф-музыки. Прежде Теккери предпочитал более жесткий звук, а в нынешнем альбоме
    он скатывается в ретро-саунд, пародируя звучания гавайской гитары, а к финальным
    трекам альбома буквально начинает ностальгировать по дням славы группы Shadows.
    Почитатели "тонкой" гитарной игры найдут много интересного в этом альбоме – гитарист
    искусный. Но любителей блюза и рок-музыки оттолкнет именно его ровный профессионализм
    и какая-то принципиальная эмоциональная бесстрастность.'
- id: 1688
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-05-18'
  text: 'Устроив себе шестимесячный перерыв в гастрольной деятельности, Джимми посвятил
    это время сочинению музыки для нового альбома. Он подключил домашнюю портативную
    студию и старался каждый день написать что-то. При этом он не стремился сочинять
    песни в уже традиционном для него мощном блюз-роковом ключе. Наоборот, ему хотелось
    записать альбом той музыки, которая пришла ему в голову в данный момент - вне
    зависимости от стиля. Главное - чтобы эта музыка шла от сердца и была искренней.


    В результате получился более спокойный и легкий альбом, характеризующийся стилистическим
    разнообразием - от блюз-рока первых треков до приджазованных серф-инструменталов.
    Десять треков написаны самим Джимми, да плюс один кавер Джими Хендрикса, инструментальных
    треков пять. Возможно, не все старые поклонники блюз-рокового Тэкери воспримут
    данный альбом должным образом, но чего уж тут точно не отнять, так это мастерства
    гитариста. Послушайте, например, заглавный трек, или роскошный инструментал Daze
    in May.


    Седьмое место в блюзовом топе альбомов Биллборда.'
