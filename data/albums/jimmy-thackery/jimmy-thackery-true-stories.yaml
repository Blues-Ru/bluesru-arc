  author: Алексей Калачев
  mark: 5
  date: '2003-05-29'
  text: 'Самый эклектичный альбом в дискографии Текери. Блюзовая поп-музыка – так,
    вероятно, можно назвать альбом, не лишенный приятности и характерного звука гитары
    Джимми. Да, о саунде диска. Он весьма далек от того жесткого саунда, что мы слышим
    на его ранних – наиболее любимых в России – альбомах. С другой стороны, он несравнимо
    более качественный, утонченный и многослойный. Примерно также следует охарактеризовать
    и аранжировки. Чего нет: 1) чистого блюза 2) блюз-рока 3) soul'
