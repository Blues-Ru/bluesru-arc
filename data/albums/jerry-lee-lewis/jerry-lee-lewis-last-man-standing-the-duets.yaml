- id: 1434
  author: Андрей Евдокимов
  mark: 9
  date: '2009-02-05'
  text: 'Вы не узнаете цеппелиновский "Рок-н-ролл" в этой интерпретации. Теперь это типичный рок-н-ролл Джерри Ли. Потому
    что он узнаваем с первой ноты. Вот титан, над которым веяния времени не властны! Все тот же рояль-дробительная техника
    и гортанные приказы как основа вокальной техники, что и 50 лет назад. Правда, есть и кантри-баллады – для маниакального
    маэстро это тоже давно изведанная территория. Альбом перенасыщен: 21 трек, 22 звездных гостя калибра: Mick Jagger, Keith
    Richards, John Fogerty, Bruce Springsteen, Jimmy Page, B.B.King и Buddy Guy, Willie Nelson, Little Richard, Eric Clapton....
    И все делают то, что Джерри Ли велит. Недаром его прозвали "убийцей" - он и в 70 лет записал альбом убийственной силы.'
