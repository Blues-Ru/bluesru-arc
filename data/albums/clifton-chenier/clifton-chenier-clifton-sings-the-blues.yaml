- id: 827
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-24'
  text: 'На диске написано, что треки 1-12 - это альбом 1969 года, а 13-19 - 1977-го. Странность в том, что у первого номер
    LP 1097, а у второго LP 1078 - такого не может быть (оба диска выходили на фирме Arhoolie).


    И так, на первом диске мастер музыки зайдеко исполняет блюзы. Клифтон на аккордеоне и поет, есть ударник, гитарист, человек
    на стиральной доске и басист, которые играет не во всех песнях. 3 трека из 10 инструментальные; есть тут и известные блюзы:
    "Trouble In Mind", "Worried Life Blues", "Be My Chauffeur"; почти все остальные темы написал сам Клифтон (одна на французском
    языке). Очень хорош вокал Шенье - мелодичный и уверенный, он поет блюзы, но слышно, что это по-своему, а не "под кого-то
    еще". Аккордеон - волшебный инструмент для такой музыки, от него много звука и нот, но он не резкий.


    Второй альбом еще интереснее. Гитара играет больше, используется квакушка; появился сакс - Джон Харт; на клавишах - сам
    Buckwheat Zydeco (тут он еще молод). Музыка богаче и бодрее, чем на первом диске, в песнях больше драйва и энергии. На
    этой пластинке все вещи написал сам Клифтон.


    Интересное издание для любителей блюза и ритм-н-блюза. Блюзменам будет интересно, как можно исполнять блюзы чуть иначе
    и с "другими" инструментами.'
