- id: 1193
  author: Константин Колесниченко
  mark: 10
  date: '2008-01-23'
  text: 'У этого альбома один недостаток - обложка, такое ощущение, что на этом фоне должен был сниматься какой-то фильм с
    компьютерными спецэффектами. Но даже этот минус не помешал мне поставить ему наивысшую оценку!


    Путь к хорошей музыке лежит не через пассивное ее изучение, а через активное! Для этого необязательно быть музыкантом,
    достаточно просто внимательно слушать, искать связи, т.е. интересоваться! Альбомы этого дуэта - это всегда "пазл" из жанров
    и стилей американской корневой музыки. Потому для тех, для кого музыка не фон - это настоящее удовольствие. Нортон Буффало
    для меня настоящий герой губной гармоники, его игра - это мастеркласс, но при этом все сыграно с душой и теплом. А Рой
    Роджерс, на мой взгляд, наиболее хорош как раз в амплуа акустического гитариста - он волшебник слайда.


    До чего же красива смесь блюза и фолка, которую выбрали музыканты, особенно хороши такие песни: "You''re Gone (With The
    Wind)", "When They Talk Like That", "Song For Jessica", "Tender Heart" - это все очень проникновенная музыка.'
