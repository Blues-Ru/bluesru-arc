reviews:
- id: 289
  author: Дмитрий Казанцев
  mark: 10
  date: '2003-12-01'
  text: 'Очень интересный альбом этого замечательного дуэта! Пластинка в стиле "современный акустический фолк-блюз". Рой отлично
    играет на различных гитарах, включая добро и слайд-гитару, Нортон прекрасно поддерживает его на гармошке - ничего лишнего
    и грязного. Они оба приятно и расслабленно поют. На диске отличная ритм-секция и много интересных перкуссионных и струнных!!!
    звуков. Контрабас звучит очень убедительно в большинстве треков, очень здорово играет перкуссионист!


    Море блюза, фолка, кантри-блюза, отличные песни, очень бодро и индивидуально. Альбом обязателен для любителей акустики,
    харпа и фолка вообще.'
- id: 1031
  author: Константин Колесниченко
  mark: 10
  date: '2006-09-27'
  text: 'Потрясающий альбом - праздник акустической американской музыки - блюз, фолк. Музыка очень мелодична и современна!


    К диску ничего не прибавить и не убавить. Игра музыкантов на высоте: Рой Роджерс потрясающий гитарист, классно играет
    слайдом; игра Нортона выше всяких похвал, есть вещи в миноре, на хроматической гармонике. Исключительно подобраны песни:
    разнообразны ритмически, мелодически, музыканты искренне поют, без лишних эмоций. Особенно хочется отметить: "All I Want",
    "If I Were a King", потрясающий инструментал "Ritmo De Las Almas", "Trinity","Seven Hearts" (скрипка!) и "Highway Bound".
    Хотя, в случае данного альбома, выделять что-то лучшее бессмысленно - все песни потрясяющи. Рекомендуется к прослушиванию
    всем, без исключения!'
