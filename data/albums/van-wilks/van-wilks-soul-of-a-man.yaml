- id: 1923
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-05'
  text: 'Второй сольный альбом техасского гитареро из Остина, который вышел с заметным перерывом после выпуска дебютного сольника.
    Кстати, исходно диск издавался с другой обложкой


    На удивление приятный альбом - немного блюза, немного фанка, в основном блюз-рок и хард-рок. Песни мелодичные и запоминающиеся,
    сыграно красиво, технично и профессионально, без чрезмерного увлечения нотоизвлечением в единицу времени. Яркий образец
    техасского блюз-рока, рекомендуется всем любителям жанра. Предпоследний трек - посвящение другу и соратнику Билли Гиббонсу,
    сделан в стилистике ZZ Top.'
