  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-05'
  text: 'Четвертый сольный диск одного из лучших гитаристов Остина и мастера техасского
    блюз-рока. Диск в традиционном для Уилкса ключе: техничный блюз-рок вперемешку
    с хард-роком и вкраплениями красивых инструменталов. Весь материал авторский,
    сыгран профессионально и качественно.


    Данным диском Ван не открыл ничего принципиально нового в техасском блюзе, но
    альбом вполне достойный.


    Любителям блюз-роковых power-trio и техасского блюза посвящается :-)'
