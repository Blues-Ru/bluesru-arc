  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-05'
  text: 'Ван Уилкс - блюзовый гитарист из Остина, штат Техас, и этого в принципе достаточно,
    чтобы иметь представление о музыканте, в честь которого мэр города объявил 6 ноября
    "днем Ван Уилкса". Остин всегда славился отменными гитаристами, и Ван один из
    лучших, причем он получил признание не только от слушателей и критиков, но и от
    коллег по цеху, среди которых другой знаменитый техасец Билли Гиббонс (ZZ Top).
    Ван - обладатель ежегодных музыкальных премий газеты Остин Кроникл в номинациях
    "лучший электрический гитарист" и "лучший акустический гитарист".


    Творчество Уилкса представляет собой энергичный блюз-рок с мощными рифами, включающий
    в себя как элементы психоделии начала 70-х, так и хард-роковые нотки. Ван одинаково
    хорошо обращается и со старым верным Гибсоном, и с акустикой. На альбоме представлен
    практически полностью авторский материал. К базовому трио музыкантов при записи
    альбома присоединился ряд гостей, среди которых Эрик Джонсон, Томми Шэннон и Крис
    Лэйтон. За исключением моментов, когда Уилкс переигрывает, диск вполне слушабельный.


    Рекомендуется к ознакомлению любителям техасского блюз-рока и мощных power-trio.'
