  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-09'
  text: 'Два почти неизвестных англичанина - John Pearson (6 and 12 string guitar, vocals) и Roger Hubbard (National steel
    slide guitar, vocals) играют Дельта-блюз, кантри-блюз и фолк-блюз на гитарном фестивале (1991 год, Англия). Среди известных
    тем тут есть "Jesus On The Mainline", "Jitterbug Swing", "Stealin''", "Walkin'' Blues". Надо отметить, что оба гитаристо
    довольно виртуозно играют и неплохо поют, хотя сразу слышно, что это это британцы, а не американцы.


    Этот диск очень редкий, издан в 1993 году в Германии. Вот его обложка: http://www.wirz.de/music/resonat/busy4.jpg'
