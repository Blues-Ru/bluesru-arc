- id: 1349
  author: Константин Колесниченко
  mark: 9
  date: '2008-10-28'
  text: 'Помните канадскую группу "Crash Test Dummies" с ее знаменитой "mmmm"? В этом коллективе Benjamin Darvill играл на
    гитаре, мандолине и ... гармонике. В 2000 году он организовал свой собственный проект, иначе это и не назовешь, "Son Of
    Dave". Benjamin единственный музыкант этого проекта, потому позволяет он себе все. В данном случае я имею ввиду полное
    музыкальное хулиганство. С помощью loop педали он зацикливает свой битбокс, играет поверх этого на гармонике, стучит в
    барабаны ногами, трещит всевозможными перкуссиями, создавая тем самым довольно интересное и объемное музыкальное полотно.
    К тому же, он часто пропускает свой вокал через какие-то компрессоры, заставляя его звучать словно старое радио, словившее
    волну с "King Biscuit Time". Весь этот музыкальный беспредел разбавила трип-хоп певица Martina Topley-Bird на "Devil Take
    My Soul" - результат получился немного нежнее всего остального.


    Это второй альбом "Son Of Dave", всего у него их 3 (угадайте их названия) - блюз, фолк, джаз, хип-хоп варятся в одном
    котле - это может не понравится блюзовым пуристам, но это, как минимум, интересно.'
