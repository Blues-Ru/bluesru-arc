  text: 'Музыкант, "подаривший" свое прозвище Сиду Баррету для первой половины названия
    его группы. В связи с этим я почему-то был уверен, что Пинк страшно популярный
    блюзмен, сделавший кучу записей. Оказалось, что это далеко не так. Фактически
    выходит, что у него была одна единственная сольная пластинка-тройник, составленная
    из записей одного периода и выпущенная тремя частями в 61-63 г.г. - Carolina Blues
    Man Vol.1, Medicine Show Man, Vol. 2, Ballad & Folksinger Vol. 3. Все другие его
    пластинки - совместные записи с другими музыкантами или сборники.


    На Medicine Show Man Pink играет на акустике и поет в одиночестве. Очень энергично
    и жизнерадостно - аж нога устала притоптывать:-) Все песни - вечнозеленые стандарты,
    происхождение которых теряется в глубине веков. Это не совсем блюз. Пинка большинство
    критиков относят к Piedmont style - музыке, в которой очень сильно влияние рэгтайма
    и фолка белых. На этой пластинке это влияние особенно заметно.


    Жизнерадостная музыка, рекомендуемая для прослушивания людям, слегка перегрузившими
    себя депрессией Дельты :-)


    <p align="right"><i>Сергей Иванов</i>'
