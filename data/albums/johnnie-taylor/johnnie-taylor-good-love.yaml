  date: '2002-12-17'
  text: 'Продукция фирмы Malaco - soul и soul-blues. То, что Тейлор, за плечами которого десятки лет пения именно в стиле
    soul, известно. Но почему он попал на первое место в блюзовый Тор 15? Объяснение простое: компания SoundScan на основе
    данных которой составляется таблица Billboard, выводит показатель популярности из количества проданных альбомов по смешанной
    категории - soul/blues. Тейлор стал в 1996 году буквально кумиром чернокожих "дам за 50" в южных штатах. В результате
    они купили его "Хорошую Любовь" в количестве, превысившем 400 000 копий и водрузили "своего мальчика" на чемпионское место
    в Тор 15. В России вкусы другие, конечно, и нужно будет привыкнуть к тому, что Malaco будет поставлять "фальшивый" блюз
    для этой таблицы. Путаница в терминах...'
