- id: 1545
  author: Андрей Евдокимов
  mark: 8
  date: '2009-05-27'
  text: 'Чарли Бэйти решил, что ему достаточно просто играть джаз в местном клубе, а блюз уже ни к чему. Ядро лучшей белой
    блюзовой команды распалось, и теперь один Рик Эстрин (весь в малиновом костюме с малиновыми ботинками и темно-лиловыми
    носками и галстуком) продолжает начатое более тридцати лет назад. Один из лучших на сегодня сочинителей, он по-прежнему
    вкрадчиво лукав в своих песнях, немного циник, но в душе романтик. Гармоника его великолепно не похожа ни на кого другого.
    (Хотя в инструментальных номерах напоминает стремления Литл Уолтера). На должность гитариста пришел Кид Андерсон – и общее
    звучание сразу обрело увесистый размах. Он автор двух номеров, остальное – сочинения Рика Эстрина. Звучит бодро, неглупо
    и совсем без намеков на "все это мы уже пробовали": хороший азартный блюз.'
- id: 1949
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-06'
  text: 'После того, как основатель группы Little Charlie and the Nightcats гитарист Чарли Бэти в 2007 году ушел из группы,
    устав от активной гастрольной деятельности, второй из долгожителей коллектива - певец, харпер и композитор Рик Естрин
    по-праву занял не только место фронтмена группы (которое он и так занимал более 30 лет), но и заменил имя Чарли на свое
    в названии коллектива.


    Ритм-секция Nightcats сохранилась, на место Чарли взяли талантливого блюзового гитариста из Норвегии (!!!) Криса Кида
    Андерсена (не путать с американским блюзовым мастером Крисом Андерсоном!), до этого Кид играл с Чарли Масселуайтом.


    Twisted - первый студийный альбом новой группы, записанный на родном уже для них Аллигаторе. Стилистически музыка группы
    практически не изменилась - это по-прежнему танцевальная смесь блюз-рока, рок-н-ролла и блюза с солирующей гармоникой
    Естрина (ну разве что джамп-блюза стало чуть меньше, а рока чуть больше). Профессионализм исполнителей остался на прежнем
    высоком уровне, зато драйва, пожалуй, прибавилось. Основную часть материала для альбома написал Естрин, остальные музыканты
    также поучаствовали.


    Десятое место в блюзовом чарте альбомов Биллборда.'
