- id: 1394
  author: Андрей Евдокимов
  mark: 6
  date: '2008-12-29'
  text: 'Разудалые блюзовые там-тамы a-la Bo Diddley, задушевные соул-баллады и резкий
    фанк разнообразят общий концертный пейзаж современного гитарного блюза в альбоме.
    "Слишком много женщин" - это спето от души! А "Говорящая гитара" - и правда разговаривает,
    напевая то старинные гимны, то сегодняшние анекдоты. Проникновенные медленные
    блюзы чередуются с танцевальными быстрыми песнями про то, как не смотря ни на
    что весело жить с блюзом в душе... А настоящий блюзмен всегда в дорога. У Бернарда
    это буквально в крови: колесить без устали по дорогам Европы его лично учил отец,
    легендарный теперь Лютер Эллисон. Студийные работы Эллисона-младшего всегда несли
    в себе оттенок скованности. А здесь, в концертной записи он раскрылся полностью.
    Пусть звезд с неба не хватает, но к своему делу относится честно, ни сил, ни души
    не жалея. Как и свежий концертник Omar & The Howlers, этот альбом выходит одновременно
    и на DVD.'
