  author: Кирилл Мошков
  mark: 6
  date: '2003-12-01'
  text: 'Еще один эпигон Стиви Рэя! - воскликнет слушатель после первых двух-трех
    треков (а особенно после четвертого), и будет не совсем прав. То есть да, Джонни
    Лэнг, конечно, подражает Стиви Рэю Воэну, равно как и брату его Джимми. Точнее,
    подражать (в части игры на гитаре) он пытается именно Стиви Рэю, но получается
    как у Джимми - потому что достичь ясности и четкости звукоизвлечения покойного
    Стиви Рэя при такой же, как у него, скорости практически невозможно, а вот игра
    ныне здравствующего Джимми куда легче поддается копированию.


    Неправота слушателя обнаруживается при первых нотах пения: что за притча? Голосок-то
    детский!


    Все правильно. Джонни Лэнг - один из нескольких новых гитарных героев белого американского
    блюза, ворвавшихся в музыку задолго до своего совершеннолетия. Это - переиздание
    его дебютного (1995) альбома, который был записан тогда, когда мальчику из Фарго
    (Северная Дакота) было всего четырнадцать лет. Проблема альбома в том, что продюсер-звукорежиссер
    (Майк Буллок) именно что пожелал воспроизвести прозрачное и одновременно ураганное
    звучание белого техасского гитарного блюза а-ля братья Воэны. Но и Ланг (в те
    годы прозвище у него было "Kid") не техасец, и ураганность звучания достигается
    не только несомненным прирожденным талантом, но и - в первую очередь - многолетним
    опытом, в том числе - и даже в первую очередь - внемузыкальным (которого в 14
    лет, по понятным причинам, не может быть). А главное - The Big Bang, группа Джонни
    Ланга (хотя и неплохо играет) - это вовсе не Fabulous Thunderbirds Джимми Воэна,
    и тем более не Double Trouble Стиви Рэя.


    Поэтому общее ощущение - отлично выученный и выразительно отвеченный билет на
    вступительном экзамене. Впереди еще долгий курс обучения, диплом и аспирантура.'
