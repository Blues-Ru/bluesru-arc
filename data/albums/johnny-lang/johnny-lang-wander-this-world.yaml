- id: 2114
  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2013-04-18'
  text: На следующий год вышел второй диск Лэнга - Wander This World, который принес гитаристу еще большую популярность, и
    вновь достиг первого места в Биллборде. Однако на нем Джонни слегка отошел от блюза в сторону соул, фанка и традиционного
    рока, что и привлекло новых слушателей и обеспечило дополнительный успех альбома. Стилистически альбом очень разнородный,
    доля блюза в музыке сократилась, доля коммерции, наоборот, выросла. На мой взгляд, второй альбом заметно хуже дебютного,
    однако его еще можно выборочно слушать. А вот следующие 2 альбома, записанные Джонни с большим временным интервалом (что
    дополнительно свидетельствует о творческом кризисе), представляют интерес только для преданных поклонников музыканта.
    Классический пример того, что виртуозной техники игры далеко недостаточно для того, чтобы записывать хорошую музыку. По
    большому счету все творчество Джонни вполне вписывается в рамки его дебютного альбома.
