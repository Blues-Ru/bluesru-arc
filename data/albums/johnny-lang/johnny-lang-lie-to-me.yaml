- id: 2115
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2013-04-18'
  text: Блюзовая сцена в 90-е годы характеризовалась наплывом молодых гитаристов-вундеркиндов,
    добившихся успеха по итогам выхода первого альбома. Кульминацией этой тенденции
    стал Джонни Лэнг, записавший свой первый сольный альбом в 15 лет. Хотя, надо отметить,
    еще за 2 года до этого он успел выпустить пластинку Smokin под именем Kid Jonny
    Lang & the Big Bang на небольшом региональном лейбле, и именно успех этой пластинки
    помог Джонни подписать контракт с крупной звукозаписывающей фирмой A&M, которая
    и выпустила Lie to Me. Пластинка удивляла хорошей гитарной техникой и взрослым
    блюзовым вокалом Джонни, и стилистически представляла собой слегка коммерческий
    блюз с долей соул. Однако молодому музыканту, который успел прилично овладеть
    формой, в силу недостатка опыта еще не очень удавалось передать содержание. Тем
    не менее пластинка достигла первого места среди блюзовых альбомов Биллборда, и
    до сих пор является наиболее популярной среди поклонников работой Джонни.
