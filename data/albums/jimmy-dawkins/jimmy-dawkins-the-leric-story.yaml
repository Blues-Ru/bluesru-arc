  author: Андрей Евдокимов
  mark: 8
  date: '2010-07-21'
  text: 'Ориентировано, вроде бы, на архивариусов, но напористая энергичность этих песен покорит кого угодно. Джимми Докинс
    – автор нескольких гениальных блюзовых записей, удивительным образом избегший признания публики и критиков. С записью
    альбомов ему тоже не везло. Поэтому в 80-х он руководил собственной студией и лейблом The Leric. Здесь он записывал и
    выпускал пластинки таких же "везунчиков" как сам. Семеро из них и представлены в этом переиздании более успешного традиционалистского
    лейбла. Стоит подчеркнуть, что сам Докинс – блестящий гитарист – в этих записях участвует только как аккомпаниатор. Среди
    солистов Тейл Дреггер, который ныне выступает и записывается более успешно, чем прежде. Остальных (за исключением Vance
    Kelly) мало кто помнит, но все они по своему хороши: Little Johnny Christian, Queen Sylvia, Nora Jean, Big Mojo Elem.
    Звучит не собственно блюз, а ритм-энд-блюз в традиционном понимании этого термина. Плюс два госпела в финале в исполнении
    Sister Margo and Healing Center Choir. Сей сборник доказывает, что и в истории блюза не было периодов затишья, даже если
    были долгие десятилетия, когда музыкальная публика предпочитала на блюз внимания не обращать.'
