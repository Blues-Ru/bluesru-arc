  author: Андрей Евдокимов
  mark: 9
  date: '2009-02-05'
  text: Аллигаторовская серия "Deluxe" как всегда оправдывает свое название. Звездой маленького женского акустического трио
    "Saffire-…" является певица и пианиста Энн Рэбсон. Она обладает классической манерой исполнения буги-вуги и блюза. Голос
    у нее очень теплый и с характерной блюзовой хрипотцой. Гей Адегбалола играет на гитаре и поет слишком аккуратно для блюза.
    Но вполне компенсирует это "перчеными" текстами в своих песнях с названиями типа "Сука с дурным характером" или строчками
    "Зачем мне мужчина с опытом, если я предпочитаю потенциал? Мне нужен молодой человек, чтобы прогнать мой блюз среднего
    возраста". Интересно, что дамы в ансамбле сначала составили себе успешную карьеру в научной области, и лишь затем перешли
    к профессиональному музицированию... В основе звучания ансамбля – акустическая гитара, контрабас и рояль. Скрипка, губная
    гармоника или слайд вносят приятное разнообразие. Большая часть из 20 песен – собственного сочинения, а несколько блюзовых
    стандартов исполнены особенно трогательно и проникновенно.
