  author: Андрей Евдокимов
  mark: 9
  date: '2005-04-11'
  text: 'Элмор Джеймс обладал главным достоинством блюзмена – уникальностью. Его песни представляли собой попевки, похожие
    одна на другую; чуть гнусавый голос явно пытался дать больше, чем мог. Но никто не играл слайдом на электро-гитаре так,
    как Элмор Джеймс. В этой области он был первооткрывателем, обеспечив себе место в истории. Для общего знакомства не найти
    лучшего сборника записей, чем The Sky Is Crying: The History of Elmore James от Rhino. Но для тех, кто хочет углубиться
    в историю этого неповторимого слайда, Blue Note подобрали из своих архивов 19 песен, записанных с 1952 по 1956 года. Джеймс,
    ремонтник радиоаппаратуры по немузыкальной профессии, здесь еще только начал свои эксперименты с гитарными усилителями,
    и не выкручивает ручки по часовой до упора. В результате – звук мягче, чем на его более поздних и более знаменитых записях.
    И поиски своего стиля тоже еще только продолжаются. И программа звучит более разнообразно: Early in the Morning – Дельта-блюз,
    с типичным диалогом голоса и гитары; Baby, What''s Wrong – просто рок-н-ролл с сильным блюзовым акцентом. А Hawaiian Boogie
    обычно включают в сборники по истории блюза в качестве иллюстрации к гавайским истокам электрослайда. По аранжировкам
    чувствуется, что музыка Джеймса идет в сторону продукции чикагского лейбла Chess. Но вдруг в аранжировках появляются попытки
    играть джамп-блюз, который был абсолютно далек от Джеймса последующих лет. "Не нужна мне жена, которая всегда пьяна" -
    не только в музыке, но и в текстах еще заметны "деревенские" корни. Ведь, как и большинство титанов городского электрического
    блюза 50-х годов, Джеймс – родом с сельского юга Миссиссиппи.


    На тему раннего блюзового электрослайда: Earl Hooker "Simply the Best" На тему другого чикагского электрослайда: J.B.
    Hutto "Masters of Modern Blues" (Testament, 1995)


    (впервые опубликовано с сокращениями в журнале Play)'
