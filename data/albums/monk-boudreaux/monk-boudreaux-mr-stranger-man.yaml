- id: 896
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-11-23'
  text: 'Это единственный сольный альбом Монка. Он настоящий вождь племени индейцев Марди-Гра "Золотые Орлы". Он знает ритуалы,
    песни, ритмы и шаманство. Он поет свои чанты и мантры в духе новоорлеанского ритм-н-блюза и фанка, а иногда просто шаманит
    под перкуссию. На первой же песне сразу слышен голос Доктора Джон - он один из "Орлов", конечно. Кирилл Невилл тоже тут,
    ясное дело; сливки новоорлеанского фанка и шаманства собрались на этом альбоме (гитарист Таб Бенуа тоже тут).


    Музыка не отличается гармоническим разнообразием, но ритмы и хоровое пение завораживает. Блюзовые корни тут и там, фанк
    и гамбо, ритуалы и заклинания.'
