  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-11'
  text: 'Группа из Южной Флориды состоит из опытных музыкантов, до этого хорошо зарекомендовавших себя в других составах.
    Объединенные общей любовью к блюзу и "корневой" народной музыке, в группе Blues Dragon под руководством поющего басиста
    Марка Телеска они начали с интерпретаций музыки начала 20 века (преимущественно до 40-х годов), затем расширив репертуар
    с включением в него музыки 50-х, 60-х и далее.


    Первый альбом (концертник Alive at the Bamboo Room) группа записала и выпустила самостоятельно в 2006 году, на нем были
    представлены в основном каверы. Свой второй альбом 2009 года группа также выпустила самостоятельно, но тут уже 11 авторских
    треков из 12. В феврале 2011 года альбом был переиздан лейблом Blue Skunk Music, что сделало его более доступным для широких
    слоев любителей современного блюза.


    Группа интересна не только музыкальным подходом и профессионализмом исполнения, но и используемым инструментарием: кроме
    традиционных гитары, баса и ударных в арсенале есть и клавиши (что не столь редко в блюзе), но кроме них присутствуют
    также гармоника, саксофон, флейта, мощная перкуссия, и даже две скрипки на последнем треке Livin'' On Death Row (который
    стал "песней 2009 года" по мнению сайта Mary4Music.com). В результате у группы очень сочный насыщенный саунд и интересные
    аранжировки с перекличкой различных инструментов, да и сильный вокал Марка также заслуживает только похвал. Послушайте
    Bottle of Gin, The Kiss That Said Goodbye, Don''t Get Me Wrong или Livin'' On Death Row, и этого будет вполне достаточно,
    чтобы полюбить Blues Dragon.


    Интересная группа, заметно отличающаяся в лучшую сторону от множества современных блюз-роковых составов, и приятный "вкусный"
    альбом современного блюз-рока с роскошными аранжировками и высокопрофессиональным исполнением. Рекомендую всем без исключения.'
