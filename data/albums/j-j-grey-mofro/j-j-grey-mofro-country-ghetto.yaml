- id: 1292
  author: Алексей Калачев
  mark: null
  date: '2008-06-05'
  text: 'Постепенно у меня скопилась стопочка озадачивающих меня дисков: я не могу отнести их ни к одному из направлений,
    не могу подобрать для них простого "ярлыка". Бесспорно, без блюза тут не обошлось. Во всех этих дисках сильная музыка,
    фокусирующаяся на одаренных певцах. Таков был, например, Эрик Линдел, диск которого сделал в прошлом году "Аллигатор".
    Хотя прямого отношения к блюзу он не имел, филофонисты его моментально расхватали. Этот же лейбл заставляет меня ломать
    голову над "Country Ghetto". Тут все, что я уже перечислил. На стикере альбома упоминаются соул, блюз, фанк и рок. Последнего
    я не обнаружил, зато остальные в наличие и, как говорится, в ассортименте. В центре действия – певец на фоне тяжеловатого,
    притушенного звука ритм-секции и несколько ленивой меди. Солирует иногда гармошка, иногда орган, иногда дудки, однако
    в целом это грув-музыка, то есть музыка, работающая как коллективная ритм-машина. Общий тон альбома минорный, печальный.
    Время от времени в его ткани неожиданно возникает струнная секция. Все это занятно и необычно. От диска остается ощущение
    незавершенности, дескать, тлело-тлело, однако до открытого огня почему-то не дошло. Судя по первой вещи, JJ Grey может
    быть вокалистом не хуже Джони Лэнга. Если захочет. "Country Ghetto" я оставил в своей коллекции: интересный диск.'
- id: 1354
  author: Константин Колесниченко
  mark: 8
  date: '2008-11-05'
  text: 'Мне сложно охарактеризовать, к какому жанру относится музыка JJ Grey & Mofro – тут и южный рок, и фанк, и соул, и
    swamp rock (очень в духе Tony Joe White), и песня "Circles", которая бы вполне успешно смогла бы стать хитом на каком-нибудь
    музыкальном канале. Музыка этой группы рассчитана исключительно на молодую аудиторию, но по сути своей, это будет такие
    же ребята, как те, что слушали The Allman Brothers Band, Little Feat, Lynyrd Skynyrd и другие подобные группы в 70-х.
    Это музыка юга Америки, это чувствуется в ее ритмах, духовой секции, бэк-вокале.


    JJ Grey – лидер группы, он же ее вокалист, а так же играет на гармонике и гитаре, басу. Группу же составляют Daryl Hance
    – гитары, Adam Scone – электроорган, George Sluppick – барабаны. К этому еще добавить несколько вокальных групп, струнные
    и духовые секции и получится саунд альбома - немного приглушенный и вязкий.


    Материал "Country Ghetto" – это недлинные композиции, содержащие совсем минимальные соло на инструментах, которые служат
    скорее обрамлением простому, но упругому ритму, создаваемому ритм-секцией. Настроение у композиций минорное и несколько
    безысходное, чего стоит одна "On Palestine" со словами "One Sunday day they all came home all that they had was burned
    and gone ". У меня осталось несколько смешанное впечатление после прослушивание этого альбома, но, пожалуй, это одно из
    самых интересных и многообещающих приобретений "Аллигатора" за последнее время.'
