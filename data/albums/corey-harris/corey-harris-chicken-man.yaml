  author: Александр Панин
  mark: 8
  date: '2024-05-30'
  text: Новый студийный альбом Кори Харриса, вышедший на итальянском лейбле Bloos Records. Открывается классным заглавным
    треком, это новоорлеанский блюз с отменными партиями органа и саксофона, посвященный известному оккультисту из Big Easy.
    Ain't Going Back No More радует регги-оттенками, да и поет Харрис здорово. Звучание в целом очень достойное, много приятных
    моментов. Третьей песней записи оказывается добротный акустический блюз Money Hungry, наконец-то! На диске есть еще парочка
    таких, Since You Gone собственного сочинения Кори и традиционный номер Blues Came to Texas. Очень люблю эти дела у Харриса!
    Исключительно хорош замес африканщины и регги под названием Jahtigui, это трибьют Али Фарка Туре, здесь также играет Cheick
    Hamala Diabat&#233; на этническом инструменте нгони. Хватает на диске карибских мотивов, запоминаются привязчивая тема
    Fafo и практически сингер-сонграйтерская Four Wings. Остра композиция Red Man, хотя саксофон в ней, на мой взгляд, звучит
    слишком уж попсово, социально-политические вопросы поднимаются в песне Jim Crow Joe. Понравилась фанки-соуловая City Boys.
    Завершается альбом традиционным госпелом Great Change, исполненным Кори a cappella. Весьма разношерстная и приятная запись!
