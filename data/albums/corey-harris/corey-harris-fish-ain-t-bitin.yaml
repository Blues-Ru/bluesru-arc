- id: 83
  author: Разные авторы
  mark: 10
  date: '2002-12-17'
  text: Великолепный диск для тех, кто интересуется Country Blues. Харрис молод, ему нет и 30-ти, но его пример очень важен.
    Он повергает квази-теорию, по которой молодые афро-америкнцы не хотят блюза. Это его второй релиз, прошлый получил чрезвычайно
    хорошую для дебютанта прессу. Он сделан не без доли прагматизма и может понравиться не только фольклористам. Оригинальна
    духовая группа - пара тромбонов и туба. Более трети альбома - песни великих дельта-блюзменов довоенной поры Сан Хауса,
    Мемфис Мини, Слепого Джефферсона т др. Ни единого электрического звука - только гитара и голос.
- id: 822
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-08-20'
  text: 'Это второй альбом Кори, ему тут всего 28 лет! А ведь так и хочется сказать - это же совсем в духе Тажа Махала! Так
    оно и есть. Харрис играет акустическую смесь Дельта-блюза, госпела, фолк-блюза и ньюорлеанского блюза. Его игра на стил-гитаре
    - это виртуозное мастерство и красота. Пение Харриса тоже на высоте - сильный, эмоциональный голос, очень в стиле и духе
    Южной музыки США. Где-то Кори играет и поет совсем один, а где-то с ним играют туба, тромбоны и бас. Празднично звучит
    и то, и другое.


    На диске 17 блюзов, 9 из них написал сам Харрис. Из известных каверов тут есть "Frankie And Johnny", "Take Me Back", "Bumble
    Bee Blues", "Worried Life Blues", "You Got To Move". Этот альбом можно смело назвать словом Masterpiece и поставить ему
    высшую оценку.'
