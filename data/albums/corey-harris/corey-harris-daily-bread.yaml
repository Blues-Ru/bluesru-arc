reviews:
- id: 747
  author: Александр Панин
  mark: 7
  date: '2005-07-01'
  text: Новый диск Кори Харриса получился совсем неблюзовым. После малийских экспериментов
    предыдущего альбома он увлекся карибской музыкой, в основном регги и ска. Вместо
    пронизывающих блюзовых аккордов здесь легкие и гармоничные мелодии и звуки. Акустической
    гитары на диске не очень много, но отрадно, что на нескольких треках играет новоорлеанский
    пианист Генри Батлер, с которым у Харриса была отличная коллаборация Vu-Du Menz.
    В итоге получился довольно любопытный и приятный на слух альбом, хотя любители
    блюза, пожалуй, останутся разочарованными. Весьма интересно, в какую еще музыку
    занесет Кори Харриса в дальнейшем.
- id: 1446
  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: 'Есть музыканты, чьи новые альбомы необходимы для прослушивания, иначе картина
    жанра не будет полной. В блюзе Харрис устанавливает тенденции. Ровно десять лет
    спустя после выпуска дебютной пластинки, Хэррис наслаждается заслуженной репутацией
    экстремально последовательного музыканты. То есть стили он меняет, как перчатки,
    и каждый раз решительно готов дойти до края. Если Дельта-блюз – то архаика, а
    не симуляция. Если африканская музыка – то и альбом пишется в Мали. Если эксперименты
    – то традиции смешивается с гранжем. А в нынешнем году удивил отсутствием сюрпризов.
    Есть одна песня на злобу дня: "The Bush Is Burning" - но в целом это добродушный
    альбом, с хорошим вкусом выдержанный на смеси стилей, составляющий "американскую
    музыку". Джазовых веяний чуть поменьше, чем могло бы быть, а ска и реггей – побольше.
    Африканская доля участия в записи альбома певца и гитариста Олу Дара компенсируется
    новоорлеанским фортепиано Генри Батлера. Для любителей традиций на финал припасена
    10-минутная распевная "The Peach": хороший пример блюза с малийскими корнями.
    Хорошо сбалансированный мастерский альбом. Без крайностей!'
