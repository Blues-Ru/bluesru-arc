reviews:
- id: 820
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-20'
  text: 'Харрис решил быть эклектичным и концептуальным. На этом диске есть блюзы, фанк, латина, поп, госпел, ритм-н-блюз,
    фолковые мотивы. Треков 18, 16 из них являются песнями - много разнообразных коротких кусочков музыки. Кори играет и на
    акустических, и на электрогитарах. Его манера игры слайдом очень интересна и самобытна.


    Альбом слушается на одном дыхании, но порой трудно понять, что хочет сказать Кори той или иной песней. Я бы назвал эту
    музыку современной и неожиданной, хотя она имеет полное право называться Roots Music.'
