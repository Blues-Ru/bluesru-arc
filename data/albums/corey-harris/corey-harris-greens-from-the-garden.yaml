- id: 804
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-10'
  text: 'Весело, смешно, красиво, странно, эклектично. Кори Харрис играет блюзы, госпел, а также регги, разную островную музыку,
    текс-мекс, кейджн и другие новоорлеанские ритмы и традиции. Все это с юмором и очень задорно, кое-что он поет на французском
    (это звучит забавно). Голос его чем-то похож на Таж Махала, а вот на стил-гитарах он играет покруче Мастера, пожалуй.
    Альбом длинный, около часа, но он разбит на песни и речевые вставки, так, что слушается на одном дыхании.


    Удивительно, что такая музыка выходит именно на Аллигаторе - это новость для меня.'
