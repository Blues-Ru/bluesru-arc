  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-20'
  text: 'Это дебютный альбом блюзмена Кори Харриса, он вышел на фирме Alligator в конце 1995 года, когда исполнителю было
    всего 26 лет - совсем мало для блюзового человека со стил-гитарой. На диске только гитара Кори и его вокал. Виртуозная
    игра на гитаре в стиле Дельта-блюз (но на современный манер, конечно), очень мощный и яркий вокал (хотя местами кажется,
    что Харрис переигрывает и утрирует эмоции).


    На диске - 16 блюзов, только 3 из них принадлежат перу Кори, остальные - классика блюза: "Keep Your Lamp...", "Early In
    The Morning", "Going To Brownsville", "She Moves Me", "Catfish Blues" и т.д. Можно сказать, что Харрис творит невозможное
    в свои годы, но тут есть и обратная сторона медали - программа длинная и звучит слишком одинаково и предсказуемо (несмотря
    на виртуозную игру и прекрасное пение).


    Я бы поставил диску 3,5, но это дебют, так что будет 4 в итоге.'
