reviews:
- id: 821
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-20'
  text: 'Кори и Хенри собрались в Новом Орлеане и записали блюзовый альбом, не забывая про госпел и ритм-н-блюз. Группы тут
    нет, только Батлер на пианино + вокал и Харрис - стил-гитара, вокал. Некоторые вещи записаны просто по одиночке, не дуэтом.
    Пение Харриса поинтереснее, конечно, но и Батлер здесь делает несколько очень приятных блюзов.


    Нельзя сказать, что материал очень интересный или разнообразный (а все вещи написаны Кори и Хенри), но последние 4 трека
    великолепны! Среди них два традиционных госпела: "Didn''t My Lord Deliver Daniel?" и "Why Don''t You Live So God Can Use
    You".


    Лично мне все же не хватает в этой музыке ударных и баса, но кому-то может сильно понравиться такой "минимализм" и эта
    акустическая прозрачность.'
