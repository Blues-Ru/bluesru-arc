- id: 1091
  author: Сергей Исправников
  mark: 9
  date: '2007-06-09'
  text: 'На диске издан второй американский альбом "Роллинг Стоунз", первоначально
    выпущенный в октябре 1964 г. (London LL 3402 mono; PS 402 stereo). Фактически,
    диск является скорее сборником нового студийного материала, записанного группой
    к тому времени. Прямого британского аналога он не имеет. Ближе всего к нему второй
    английский миньон "роллингов" "5 x 5" (Decca DFE 8590), изданный в августе 1964
    г. EP "5 x 5", полностью включенный в этот диск, содержал материал, записанный
    10 – 11 июня 1964 г. в легендарной чикагской студии "Чесс", своего рода "блюзовой
    Мекке". Порядок песен на миньоне, по сравнению с данным диском, был следующий:
    треки 11, 3, 7, 2, 1. Тогда же на "Чесс" была записана еще одна песня (трек 6),
    изданная в Великобритании на сингле в июне 1964 г. Остальной материал данного
    альбома был записан в лондонской студии "Риджент Саунд" в феврале (треки 5, 12),
    в мае (треки 4, 9, 10) и сентябре (трек 8) 1964 г. Четыре из этих песен (треки
    4, 8, 10, 12) позже войдут во второй британский альбом группы "Rolling Stones
    #2" (январь 1965 г.), хотя одна – трек 4 – в другом, более позднем исполнении.
    Песня "Good Times, Bad Times" (трек 5) была издана на обороте английского сингла
    в июне 1964 г. Что касается композиции "Congratulations" (трек 9), то в Великобритании
    до 1973 г. она вообще не издавалась. Фото, помещенное на обложку данного диска,
    также было использовано при оформлении британской пластинки "Rolling Stones #2".
    В американских чартах диск "12 x 5" занял третью позицию.


    После выхода первого альбома скандальная слава "Роллинг Стоунз" только выросла.
    Проходившие с апреля по июнь концерты группы становились все короче и безумнее:
    оголтелые толпы фанатов рвались на сцену и срывали выступления. Тогда же началась
    атака на "роллингов" в британской прессе, где их с завидным постоянством поливали
    грязью. 1 июня 1964 г. группа отправилась в свое первое американское турне. Прилетев
    в Нью-Йорк, им пришлось скрываться от толп перевозбужденных девиц, многие из которых
    прихватили с собой ножницы в надежде отрезать локон волос у любимых музыкантов.
    3 июня в Лос-Анджелесе группа снялась в телевизионном шоу, где подверглась издевательским
    нападкам ведущего. Затем прошли концерты в Сан-Бернардино и и Сан-Антонио, в последнем
    "роллинги" встретили откровенно враждебную реакцию публики: из-за их длинных для
    того времени волос их приняли чуть ли не за "голубых". После этого Кейт Ричардс
    приобрел себе пистолет и никогда больше не ездил в американские гастроли безоружным.
    9 июня "Стоунз" прилетели в Чикаго, а на следующий день направились в знаменитую
    студию "Чесс", где записывались такие знаменитые блюзмены, как Мадди Уотерс, Хаулин
    Вулф, Сонни Бой Уильямсон и другие. Войдя в студию, "роллинги" сильно удивились,
    обнаружив там легендарного Мадди Уотерса, красившего потолок. По сравнению с большинством
    лондонских студий того периода "Чесс" была оборудована лучшей звукозаписывающей
    аппаратурой. Сделанные там за два дня записи составили половину данного диска.
    На одной из песен к группе спонтанно присоединился Мадди Уотерс, однако его гитарную
    партию по контрактным соображениям пришлось вырезать. Дальше последовали выступления
    в Омахе, Детройте, Питсбурге, Кливленде, Гаррисбурге. Тур закончился концертом
    в нью-йоркском Карнеги-холле. После первого отделения полиция настояла на том,
    чтобы концерт закончила другая группа, иначе "роллинги" не ушли бы живыми от рвавшихся
    на сцену разгоряченных фанатов. На английских концертах в июле и августе продолжалось
    то же самое, выступления срывались, возникали массовые драки. На концерте в Уэльсе
    Чарли Уоттс вообще получил в голову пулю из пневматического пистолета и доиграл
    выступление с залитым кровью лицом.


    На диске "12 x 5" имеются уже три композиции авторства Джаггера/Ричардса (треки
    5, 9, 10), а также два студийных джема, опять же приписанных Нанкеру Фелджу (треки
    3 и 7), причем название одного из них – "2120 South Michigan Avenue" – не что
    иное, как адрес студии "Чесс" в Чикаго. Что касается исполнения "роллингами" чужих
    вещей, то традиционно не остался без внимания Чак Берри: из его репертуара на
    диск перекочевали "Around And Around" (трек 1) и "Confessin'' The Blues" (трек
    2). Рок-н-ролльная составляющая альбома была дополнена авторским хитом 1957 г.
    американского гитариста Дейла Хокинса "Susie Q" (трек 12). Не остался без внимания
    и чрезвычайно популярный в Америке соул, представленный первоначально исполненной
    Соломоном Берком "If You Need Me" (трек 11) и "Time Is On My Side" (трек 4) Ирмы
    Томас. Еще два трека были взяты из репертуара черных ритм-энд-блюзовых групп:
    "It''s All Over Now" (трек 6) была свежим хитом "Валентиноуз", а "Under The Boardwalk"
    (трек 8) – легендарных "Дрифтерс".'
