reviews:
- id: 1090
  author: Сергей Исправников
  mark: 10
  date: '2007-06-07'
  text: 'На диске представлен дебютный альбом "Роллинг Стоунз", первоначально изданный
    в Великобритании в апреле 1964 г. (Decca LK 4605), а затем месяцем позже в США
    (London LL3375 mono; PS 375 stereo). Для издания на компакт-диске была использована
    именно американская версия. В британский оригинал не вошла имеющаяся здесь песня
    "Not Fade Away" (трек 1), в Англии она была издана на сингле еще в феврале 1964
    г. Вместо нее была отсутствующая здесь "I Need You Baby (Mona)". Порядок треков
    на английской пластинке по сравнению с американской был следующим: 2 – 4, "Mona",
    5 – 12. Запись всех песен, представленных как на английской, так и на американской
    версиях альбома, была осуществлена в январе – начале февраля 1964 г. в лондонской
    студии "Regent Sound". Что касается художественного оформления, то британский
    и американский варианты были идентичны за исключением того, что в Америке на обложке
    альбома появился подзаголовок: "England''s Newest Hit Makers". Это не было пустой
    рекламой, поскольку диск имел феноменальный успех. Уже через неделю после появления
    в продаже он потеснил на второе место в английских чартах альбом "With The Beatles"
    и продержался на первом месте целых двенадцать недель, откуда его вытеснил только
    следующий альбом "Битлз" "A Hard Day''s Night".


    К началу записи данного альбома у группы уже был определенный студийный опыт:
    в 1963 г. "роллинги" записали два сингла и один миньон. Что касается данного диска,
    то он был скорее попыткой чуть ли не с первого дубля зафиксировать в студийных
    условиях концертную программу того периода. Запись осуществлялась на двухдорожечный
    магнитофон "Revox" с минимальными техническими ухищрениями, что придало саунду
    сыроватый, где-то даже брутальный оттенок. В этом отношении альбом резко отличается
    от технически идеальных, тщательно выверенных по звучанию дисков "Битлз". Собственно
    говоря, также отличались друг от друга и сами эти группы.


    Первоначально, "Роллинг Стоунз" были одной из групп первой волны британского блюза.
    Фактически, музыкальная карьера четырех из пяти участников "Роллинг Стоунз" –
    Мика Джаггера, Кейта Ричардса, Брайана Джонса и Чарли Уоттса – началась в 1962
    г. в группе Алексиса Корнера "Blues Incorporated", первом блюзовом бэнде Великобритании.
    В июле того же года состоялось дебютное выступление группы, первоначально названной
    "Rollin'' Stones" в честь знаменитого дельта-блюза Мадди Уотерса, в лондонском
    клубе "Marquee". В конце 1962 г. к "роллингам" присоединился басист Билл Уаймен
    и классический состав группы был собран. В течение 1963 г. группа периодически
    выступала в лондонских клубах, заключила контракт с гигантом британской звукоиндустрии
    Decca Records, сделала несколько студийных записей, летом приняла участие в Первом
    британском национальном джазовом фестивале в Ричмонде, а осенью сопровождала Бо
    Диддли и братьев Эверли в британском туре. К концу гастролей публика стала скандировать
    "Мы хотим "Стоунз" и устраивать беспорядки. На концертах "роллинги" вели себя
    нарочито эпатажно, исполняя агрессивную смесь из ритм-энд-блюзов и рок-н-роллов.
    Это отразилось и на материале их дебютного альбома.


    На диске присутствует только одна авторская песня Джаггера/Ричардса – "Tell Me"
    (трек 9). Это была одна из первых песен написанных "роллингами". Как видно на
    ее примере, их собственное творчество того времени коренным образом отличалось
    от музыки, которую они пропагандировали, и тяготело к сентиментальным балладам
    вместо жесткого бита и R''n''B. Кроме того, в написании двух композиций – "Now
    I''ve Got A Witness" (трек 5) и "Little By Little" (трек 6) – принимали участие
    все члены группы. По сути, они являются полуимпровизационными студийными джемами.
    Все вещи подобного рода, время от времени появлявшиеся в каталоге "Роллинг Стоунз",
    были приписаны авторству мифического г-на Фелджа.


    На диске исполнены два рок-н-ролльных боевика из репертуара кумира Кейта Ричардса
    – Чака Берри "Route 66" (трек 2) и "Carol" (трек 8), к ним примыкает сыгранный
    в стиле Бо Диддли хит Бадди Холли 1957 г. "Not Fade Away" (трек 1). Блюзовая составляющая
    альбома представлена композициями "I Just Want To Make Love To You" (трек 3) Уилли
    Диксона, "Honest I Do" (трек 4) Джимми Рида и "I''m King Bee" (трек 7) Слима Харпо.
    Не остался без внимания входящий в моду, в первую очередь, благодаря усилиям детройтской
    фирмы Motown и мемфисской Stax, стиль соул. Он представлен композициями "Can I
    Get A Witness" (трек 10) Марвина Гэя, "You Can Make It If You Try" (трек 11) Джина
    Эллисона и "Walking The Dog" (трек 12) Руфуса Томаса.'
