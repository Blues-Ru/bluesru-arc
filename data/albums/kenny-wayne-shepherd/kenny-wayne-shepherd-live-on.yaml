  author: Дмитрий Подберезский
  mark: null
  date: '2003-12-02'
  text: 'Издание недавнего проекта молодого белого музыканта, в которого явно вселился
    некий необузданный блюзовый дух. Третий в своей биографии альбом Кенни Уэйн Шеферд
    записал, пригласив многих не очень широко, как мне показалось, известных музыкантов,
    но при этом умудрился создать действительно запоминающуюся работу.


    Во всяком случае, давненько мне не приходилось, учитывая возраст музыканта и (простите)
    цвет его кожи, слышать столь впечатляющий и запоминающийся блюз-рок. Музыка агрессивна
    и остра, потому что создана молодым лидером бэнда, она впитала в себя все лучшие
    достижения мировой рок-культуры, но при этом все равно осталась в цепких объятиях
    блюза. Из 14 композиций альбома всего лишь две написаны вне окружения бэнда.


    Это "Them Changes" Майлса (из репертуара Хендрикса) и "Oh Well" Питера Грина.
    Все остальное - отражение чувств и эмоций лидера группы. Эмоции эти, следует признать,
    красочные, резкие и в то же время очень убедительные в художественном плане.


    И поэтому я ничуть не удивлюсь, если уже через несколько лет о Кенни Уэйне Шеферде
    заговорят во всем мире как о новой звезде гитарной музыки. Он пока не такой революционер,
    как Хендрикс, не настолько эффектен, как Стиви Рэй Воэн, но он, извините, молод.


    И уже поэтому способен на многое. Об этом музыканте мы, безусловно, услышим еще
    не раз.'
