- id: 1994
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-08-26'
  text: 'Свой первый альбом молодой талантливый гитарист выпустил в возрасте 18 лет
    и добился сумасшедшего успеха - диск поднялся до первого места среди блюзовых
    альбомов Биллборда. Однако с учетом того, что Кенни начал играть на гитаре с 7
    лет, к моменту выхода альбома он уже был далеко не новичок. Дебютный альбом Шепперда
    состоит по большей части из оригинального материала, есть лишь два блюзовых стандарта.
    Стилистически это преимущественно тяжелый блюз-рок, который пришелся к месту в
    плейлистах многих радиостанций, что и обеспечило диску продажу более 500.000 копий
    к началу 1996 года.


    Следующий альбом Шеперда был уже менее блюзовым и более коммерческим, он получил
    номинацию на Грэмми, а затем последовало еще два менее удачных альбома. К сожалению,
    на всех следующих его сольных альбомах Шеперду не удалось добиться успеха дебютной
    пластинки, которая, пожалуй, является лучшей его работой.


    Проект 2007 года, записанный с ветеранами блюза, вряд ли можно рассматривать как
    сольную работу Шеперда - на ней он выступает в роли аккомпаниатора и, если угодно,
    катализатора, а солируют там блюзовые ветераны.


    И все же уже одного дебютного альбома достаточно, чтобы имя Шеперда хорошо запомнилось
    любителям блюз-рока. Очень приличная пластинка!'
