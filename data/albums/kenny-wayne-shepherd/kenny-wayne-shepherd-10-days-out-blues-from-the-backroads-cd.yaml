- id: 1389
  author: Андрей Евдокимов
  mark: 7
  date: '2008-12-29'
  text: 'Легче верблюду пройти сквозь игольное ушко, чем симпатичному блондину-гитаристу получить признание у любителей традиционного
    блюза. Спустя 12 лет после выпуска дебютного альбома Кенни Уэйн понял, что не обязательно идти напролом. И записал альбом
    из дуэтов и трио с подлинно блюзовыми ветеранами. Есть совсем редкие имена. Как не печально, за два года, прошедших с
    начала работы над альбомом, шестеро из них ушли к праотцам. Но жизнь продолжается. Главное достоинство альбома в том,
    что теперь есть ответ на вопрос: "Что порекомендовать начинающему любителю блюза?". Именно это! Тут есть и оргазмическая
    пулеметная стрельба из электро-гитар, и домашние посиделки с акустикой на кухне (буквально!), и все, что существует в
    блюзе меж этих границ. А БиБиКинг доблестно записал еще один вариант "The Thrill Is Gone", слушать который не скучно ни
    знатокам, ни неофитам.'
- id: 1993
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-08-26'
  text: 'Несколько лет назад Кенни Уэйн Шеперд прихватил с собой ритм секцию Стиви Рэя Double Trouble, передвижную записывающую
    студию и кинодокументалистов, и отправился на 10 дней в путешествие по американскому Югу для записи легендарных блюзовых
    музыкантов, которые уже состарились и перестали выступать самостоятельно. Результатом стал комплект из КД и ДВД, на которых
    Шеперд и ритм-секция создают фон для игры знаменитых блюзменов, которых записывали в тех местах, где это было можно сделать
    - на концертах в небольших клубах, на кухне, на пороге их дома и тп. Этот интереснейший проект позволил донести до широких
    масс уникальную игру блюзовых мастеров, пятеро из которых к моменту выхода альбома в 2007 году, к сожалению, уже покинули
    этот мир. Хотя диск вышел под именем Кенни Уэйн Шеперда, настоящими звездами на нем являются блюзовые ветераны. Сам Шеперд
    на этом диске выступает большей частью как простой аккомпаниатор.


    Номинация на ряд блюзовых премий и 1 место среди блюзовых альбомов Биллборда.'
