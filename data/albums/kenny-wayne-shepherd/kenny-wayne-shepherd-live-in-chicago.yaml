- id: 1648
  author: Андрей Евдокимов
  mark: 7
  date: '2010-10-13'
  text: 'Вообще, частенько словосочетание "блюз-рок" навевает зевоту всем, кто не купается в ностальгии по 60-м. Но у Шепарда
    это дело получается вполне с огоньком. Он более не вундеркинд, ему 33 – солидный возраст первого подведения итогов. Его
    балансирование на грани блюза и тяжелого рока по мнению многих любителей чистоты жанра склоняло его более на сторону рока.
    Но три года назад он выпустил альбом и докуменально-музыкальный фильм10 Days Out (Blues from the Backroads), в котором
    он общался и джемовал как со знаменитыми, так и с полузабытыми великими блюзменами. И явно делал это не напоказ, а искренне,
    с любовью и желанием познакомить как можно больше людей с именами тех, кто для него самого были воплощением блюза. За
    эту работу он был удостоен Blues Award – For Keeping The Blues Alive (у нас звучало бы примерно как "За пропаганду блюза!").
    Кстати, и на Grammy номинанировался. Нынешний альбом в какой-то мере – продолжение того проекта. Хотя бы потому, что в
    концерте в Чикагском "Доме блюза" принимали участие "Живые легенды": Хьюберт Самлин (Hubert Sumlin - гитарист, правая
    рука и названный сын Хаулин Вулфа) и Уилли "Биг Айз" Смит (Willie "Big Eyes" Smith - барабанщик блюзбэнда Мадди Уотерса
    последнего созыва). Участвовали и "белые блюзмены" старшего по отношению к Шеппарду поколения: Брайан Ли (Bryan Lee),
    Бадди Флэтт (Buddy Flett), а так же ритм-секция группы Double Trouble: Chris Layton и Tommy Shannon.


    Обретенный опыт пошел KWS весьма на пользу. Там, где прежде на слушателя обрушивалась гитарная скоростная пиротехника,
    теперь звучит вполне осознанное и прочувствованное соло. Его по-прежнему тянет в рок, но превосходная игра Hammond B-3
    обеспечивает нужный баланс, добавляя чисто блюзове краски; в нынешнем альбоме впервые блюзовая составляющая стала основой,
    а не приправой. Кстати, игра Riley Osburn на клавишнх – Хэммонде, электрооргане и фортепиано – просто превосходна. Хорошо
    повзрослел и штатный вокалист KWS - Noah Hunt, он тоже распрощался с роковой прямолинейностью. Хотя окончательно с роком
    тут никто не прощался. Тяжелые рифы a-la Cream прокатываются всей мощью в большинстве треков. Dance For Me Girl Бадди
    Флэтта – если бы не было этой песни, пришлось бы взяться за стандартного Хучи-Кучи. Ее мощный риф как раз из серии тяжких
    белых интерпретаций знаменитой песни Диксона-Уотерса. Слайд-гитара скрашивает тяжкое впечатление, песня пафосна (но и
    чувственна тоже) и рекомендуется скучающим по временам тяжелых гитарных героев. Ну а от шаловливой Honey Bee ничего игривого
    не осталось – жесткий рок. Предыдущий альбом плодом сотрудничества и данью уважения блюзовым патриархам. А нынешний, при
    обилии гостей, является несомненно альбомом шеппардовским – его идеология и воплощение его музыкальных взглядов. Есть
    коллективные неудачи: в Eye To Eye , где запевает Смит, группа пытается сыграть оттяжный чикагский блюз "как у Мадди Уотерса",
    но получается малоубедительно – изобразить "оттянутый назад" ритм как-то плохо получается. А вот сам KWS импровизирует
    как раз строго по чикагским рецептам: дожимая простую фигуру раз за разом, прежде чем сорваться в тремоло и вытянуть жалобную
    высокую ноту. А в целом альбом очень удачный, звукорежиссер "ухватил" атмосферу живого контакта с залом. И в дискографии
    KWS это самый блюзовый по общему направлению альбом.'
