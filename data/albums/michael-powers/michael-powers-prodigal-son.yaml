- id: 1471
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: Ему за пятьдесят, это его второй сольный альбом, и широкая известность еще пока что где-то впереди – нормальная блюзовая
    история. Играет песни Cream, Led Zeppelin, Bob Dylan, Arthur Lee – все блюз-рок 60-х. Его заторможенная версия Voodoo
    Chile звучит у слишком "психоделично" - но это единственный нудный трек. А в целом альбом звучит очень бодро и неожиданно
    свежо для такого заезженного материала. Выручает замечательное чередование электрики и акустики... А так же очень удачные
    песни собственного сочинения, лучшая из которых о блудном сыне, призрачная и подвижная, дала название всему альбому. На
    концертах Пауэрз предпочитает более традиционный блюз, а альбом в большей степени обращен к любителям "взрослого рока"
    (AOR), которые в равной степени оценят и суровый электрогитарный драйв Goin' Down, и изящный акустический дуэт гитары
    и добро Compassion, и луизианский ту-степ You Got To Go Down под треск стиральной доски. И уж для знатоков истории – необычная
    версия Train Kept-A-Rolling, которую Led Zeppelin играли на своих самых первых концертах..
