- id: 760
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-07-15'
  text: 'И еще один блюзовый альбом Руфуса (первый по блюзу был записан в 1988 году для Alligator Records), он вышел в продажу
    когда Томасу было уже 79 лет. Удивительная музыка на диске для такого возраста и поколения - Руфус и его группа исполняют
    мощный блюз, блюз-рок и соул-блюз. С духовыми, "примоченными" гитарами и современными ударными. Более того, Руфус сам
    написал 6 песен из 13 для этого диска - невероятная работоспособность и вменяемость для такого возраста. Этот диск интереснее
    и сильнее по материалу, чем альбом 1988 года; звук тоже намного лучше, конечно.


    Я ставлю этой пластинке 5 баллов - тут нет слабых мест.'
