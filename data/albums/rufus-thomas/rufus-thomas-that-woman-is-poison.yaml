reviews:
- id: 470
  author: Дмитрий Казанцев
  mark: 8
  date: '2004-03-03'
  text: 'После 11-летнего перерыва Руфус записывает этот приличный альбом для блюзового
    лэйбла Alligator. Lucky Peterson играет на клавишах на всем диске, и это хорошо.
    Дудки и подпевки приятны, вокал 71-летнего Томаса на высоте, а вот со звуком есть
    проблемы - 80-е годы убивают весь кайф. 8 песенок на 37 минут - не длинный, ровный
    альбом в стиле соул-блюз. Можно сказать, что материал на альбоме не так уж интересен
    и нов, но вокал Руфуса создает классное настроение и спасает пластинку от скучного
    прослушивания.


    Звук на двойку, материал на тройку, но играют здорово, а Руфус - просто отличный!
    Это, конечно, не его период на Стаксе, но все же этот диск очень хорош для 1988
    года. Альбом понравится любителям "веселого" блюза с дудками, шутками и прибаутками.'
