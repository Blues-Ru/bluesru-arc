reviews:
- id: 897
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-11-23'
  text: 'Первый альбом этого патриарха блюза и соула из Мемфиса. Руфус вел передачи
    на радио, шоуменил, пел и сочинял отличные песни. На этом диске 12 песен, а длится
    он всего 31 минуту. Надо сказать, что Томас написал аж 7 композиций из 12 и все
    они хороши. Лучшие люди лейбла Stax Records играют здесь вместе с Руфусом, создавая
    очень приличный саунд и драйв. Музыка в стиле ритм-н-блюза, конечно, танцевальные
    притвистованные песни, но с очень явным блюзовым и черным началом. Кое-какие песни
    - чистой воды блюзы. Все сделано с кайфом и юмором, голос Томаса силен и обаятелен.
    Здесь немало хитов: "Ooh Poo Pah Doo", "Walking The Dog", "Ya Ya", "Boom Boom",
    "Land Of 1000 Dances". Просто великолепная пластинка вообще, а для 1964 года особенно!'
