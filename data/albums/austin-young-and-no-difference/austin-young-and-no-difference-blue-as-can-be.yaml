- id: 2142
  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2013-07-23'
  text: 'Остин Янг из Колорадо в определенной мере продолжает традицию гитаристов-вундеркиндов, заявивших о себе в блюзе еще
    в тинейджерстве (вспомним Шеперда, Лэнга, Бонамассу). Он получил первую гитару в 12 лет, и с тех пор играет блюз, учась
    на записях грандов жанра - от Роберта Джонсона и Мадди Уотерса до Стиви Рэя и Эрика Клэптона. Огромную поддержку юному
    дарованию оказал отец - Тим Янг, который с детства играл на ударных в разных составах, и создал аккомпанирующую группу
    No Difference для своего сына, пригласив молодого таланливого басиста Ноа Маста.


    Трио много гастролировало, участвовало в различных блюзовых фестивалях, а в 2012 году записало альбом полностью авторского
    материала. В музыкальном плане это коктейль всевозможных разновидностей современного блюз-рока, сыгранный вполне прилично
    безо всякой скидки на возраст музыкантов. И если к исполнительскому мастерству Остина особых претензий нет (гитарную технику
    он освоил на "отлично"), то вокал и композиторские навыки вполне можно улучшить. Принимая во внимание возраст музыканта,
    времени для совершенствования у него навалом, и следующий альбом покажет, как ему удалось воспользоваться этим временем.
    А пока имеется приличная техническая база, хороший потенциал для развития и серьезная заявка на то, чтобы перейти из категории
    "прилично" в "хорошо" и "отлично". Думаю, будет небезынтересно проследить за следующими работами колорадского блюзового
    вундеркинда.'
