  date: '2011-05-19'
  text: 'Блюзмен мексиканского происхождения, рожденный в Чикаго - это уже необычно!
    Тино начал сольную карьеру в 1985 году, сплетая в своей музыке всевозможные стили
    и направления, на которых он вырос: блюз, латино, соул, джаз, фанк. Уникальность
    музыканта не только в его филигранной технике, но в первую очередь в умении свободно
    сочетать всевозможные музыкальные стили (причем зачастую в рамках одной песни),
    создавая в результате органичное музыкальное полотно, звучащее как глоток свежего
    воздуха.


    На определенном моменте жизненного пути Гонзалес устал от гастролей по одним и
    тем же клубам Америки и Канады, и подался в Европу. Игра в различных странах Старого
    света добавила местный колорит в его музыкальную палитру, расширив ее за счет
    цыганских, арабских и африканских мелодий. В результате диапазон музыки Тино стал
    еще богаче, образуя своеобразный блюзовый world-fusion.


    На данном альбоме Тино раскрывается во всей красе, пытаясь передать своей музыкой
    все разнообразие современных блюзовых стилей. За исключением одного трека, весь
    материал написан самим музыкантом. Среди приглашенных гостей - Джимми Тэкери,
    Попа Чабби и Дэвид Максуэлл. И хотя Тино-вокалист заметно уступает Тино гитаристу
    и композитору, результирующая музыка бесспорно заслуживает внимания всех любителей
    современного блюза: диск звучит свежо и оригинально, а исполнение технично и профессионально.
    Рекомендую всем любителям современного блюза, которые не ограничиваются традиционными
    канонами жанра: Гонзалес один из тех исполнителей, которые действительно создают
    оригинальную современную музыку.'
