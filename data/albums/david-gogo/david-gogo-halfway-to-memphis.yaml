  text: '"Gogo distinguishes himself as not only a fiery guitarist, but also as a world-class slide player.....he is as soulful
    a singer as he is guitarist." Art Tipaldi Senior Writer Blues Revue/BluesWax


    Канадский блюзовый гитарист Дэвид Гого получил свою первую гитару в возрасти пяти лет, а к 16 годам уже начал получать
    предложения о работе в качестве профессионального музыканта. Личная встреча с его кумиром - Стиви Рэем - придала дальнейший
    импульс его карьере, заставив создать собственную группу - The Persuaders, с которой он вскоре уже открывал концерты для
    таких блюзовых грандов, как Джонни Уинтер, Бадди Гай и Алберт Коллинз.


    В 1994 году вышел первый сольник Дэвида, за котороый он получил премию Джуно. Альбом "На полпути к Мемфису" - пятый сольник
    талантливого гитариста, певца и композитора, выпущенный в конце 2000 года на лейбле DixieFrog, и переизданный в 2001 году
    лейблом Cordova Bay. На нем он представил профессионально исполненный блюз-рок с обилием слайд-гитары. Четыре трека написал
    сам Дэвид, остальное - каверы, включая заключительное почти десятиминутное блюзовое попурри.


    Относительная неизвестность Дэвида объясняется отсутствием дистрибюции его дисков в мировом масштабе - они выходят в основном
    только в Канаде. У себя на родине талантливый музыкант уже завоевал целый ряд престижных музыкальных блюзовых премий.
    Рекомендую обратить на него внимание - интересный исполнитель, у которого еще многое впереди.'
