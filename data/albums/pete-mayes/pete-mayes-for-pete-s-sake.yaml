- id: 1547
  author: Константин Колесниченко
  mark: 8
  date: '2009-06-11'
  text: 'В Техасе, помимо Стиви Рея Вона, есть еще один культовый гитарист – T-Bone Walker. Старшее поколение блюзменов из
    Штата Одинокой Звезды так или иначе - это ученики великого блюзмена. Его классические записи – учебник, который изучили
    все, от Сlarence Gatemouth Brown до Anson Funderburgh. Pete Mayes слеплен из этого же теста.


    Не могу сказать, что этот альбом - уникальная, ни на что не похожая музыка (некоторые темы просто сыграны 1 в 1, как у
    Ти-Бона). Но это, все же, не проходной блюзовый альбом, а запись высокого качества, сыгранная с настоящей блюзовой подачей
    и свингом. Возможно Пит не стал известен, как Albert Collins или Johny Clyde Copeland, но стоять с ними в одном ряду он
    достоин. Pete Mayes – это музыкант поколения 30-х, который высоко держит марку техасского блюзового свинга.'
