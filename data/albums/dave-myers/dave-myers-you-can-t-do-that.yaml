- id: 1538
  author: Андрей Евдокимов
  mark: 7
  date: '2009-05-18'
  text: Новоорлеанская фирма, роясь в своих архивах, решила, что пора этой записи зазвучать в формате CD. Слушать невозможно
    без предыстории – это правда. В 50-х Майерс был одним из чикагских тузов – басист группы The Aces. На записи он просто
    вспоминает, как легко игрался блюз тогда. Альбом – не для неофитов. В нем нет былой энергетики, нет попыток удивить. Басист,
    переключившийся на гитару, играет очень скромно. Но это обаятельная, студийная, почти домашняя музыка, и голос звучит
    тепло и проникновенно. В новых песнях собственного сочинения он больше ностальгирует по прошлым временам. Зато, исполняя
    песни Фэтса Доминоу, он зажигает так, как это было когда-то. Скромное обаяние ветеранов чикагского блюза делает эту неяркую
    музыку одухотворенной и красивой. "Ноги вверх" - это так смешно, а звучащая следом "Завтра домой" бросает в слезы. От
    смеха до уныния - так и должно быть в блюзе по определению.
