  date: '2008-01-29'
  text: 'Тем временем приехал двойной альбом Jon Lord & The Hoochie Coochie Men -
    Live At The Basement.


    Мм-да.... какой же это все-таки п...ц, старая гвардия! Никакого тебе диппапла
    (почти). Натуральный белый блуууз. Да такой мощи и живости внутри, что дух захватывает.
    И орган марки Хаммонд, скорей всего, настолько на месте, насколько только можно,
    чтоб он был на месте.


    Играют Литтл Уолтера, Кертиса Джонса, "Грин Онионс" знаменитые - с феноменальной
    бахианской вставкой (Бах & блюз, блин!), кримовскую "Стрендж Брю", Джонни Винтера,
    Вилли Диксона, Честера - будь-земля-ему-пухом - Бернетта, Элмора Джеймса, Джимми,
    еб...ть, Смита!


    Ну и When A Blindman Cries - чтоб пепловцев порадовать.


    УУУУУУУУх какая пластинка!


    Да, и конферанс, конечно, на месте. Конферанс феерицкий.


    Почему в России почти никто не умеет так красиво и достойно стареть?!!!


    short note for english-speakin'' friends:


    new double CD by ex-DeepPurple keyb man Jon Lord is amazing


    Jon Lord & The Hoochie Coochie Men - Live At The Basement (recorded in Sydney
    last year)


    strong and lively blue-eyed blues


    songs by Willie Dixon, Chester Burnett, Muddy Waters, Booker T. & The MGs, Jimmy
    Smith, Cream etc.


    He''s a very charismatic person, this Mr. Lord


    Why didn''t they can grow old beautifully here in Russia?!'
