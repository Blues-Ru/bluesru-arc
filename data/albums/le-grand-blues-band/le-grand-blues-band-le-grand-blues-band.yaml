  author: Константин Колесниченко
  mark: 6
  date: '2007-05-08'
  text: 'Альбом французской блюз-рок группы Le grand blues band, в составе которой играл Мильто. Жан Жак тут не единственный
    солист, много внимания уделено гитаристу, а также клавишнику. Жанрово этот альбом довольно традиционен: "Walking By Myself"
    (ужасно сыграная на гитаре или гармонике с какой-то примочкой - не разобрать), "Tobacco Road", а также различные блюзовые
    номера. Мильто играет вещи, которые есть на других его альбомах (гораздо лучше сыгранные), только тут они исполнены с
    перегрузом и соло поделено на 3-х - харп, гитара и клавиши. Записано более-менее терпимо, а для альбомов начала 90-х еще
    и достаточно неплохо подобран материал. Но все равно, эта работа не дотягивает до его альбомов конца 90-х, начала 21 века.'
