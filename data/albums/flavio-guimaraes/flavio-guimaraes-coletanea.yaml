  text: '<img src="http://2.bp.blogspot.com/_IWqfvyO_nw8/R1Klbfz8lpI/AAAAAAAAC18/scYwXDROmoM/s400/FGfgfront.jpg">


    Fl&#225;vio Guimar&#227;es - очень серьезный бразильский харпер и по-своему уникальный. Вообще, Бразилия - гармошечная
    страна. В свое время один из заводов Hohner (номер 1 по производству гармоник в мире), находящийся в Бразилии, откололся
    от компании - так появилась фирма Hering, производящая отличные гармоники в Южной Америке. Но это так, лирическое отступление.У
    Fl&#225;vio - очень интересная и разносторонняя манера игры - он может звучать совсем как Биг Уолтер, а может, как Вильям
    Кларк или Карлос Дель Хунко, но в его музыке всегда доминирует латиноамериканский почерк. Помимо уникальной манеры игры,
    альбом примечателен еще тем, что на нем можно услышать таких грандов губной гармоники как Sugar Blue, Charlie Musselwhite
    и Howard Levy - они гостят на 3 треках записи, что лишь подтверждает авторитет Fl&#225;vio и его умение играть любую музыку
    - от блюза, до джаза, фанка и латины.'
