- id: 112
  author: Алексей Калачев
  mark: 6
  date: '2003-02-24'
  text: Прозрачная фактура этой работы, его легкая, почти "невесомая" для ритм-энд-блюза ритм-секция заставляют вспомнить
    музыку кантри. Странная и комфортная для слушания пластинка. Кажется, современный белый гитарист из Нешвила пришел в одну
    из студий Нешвила, где умеют записывать лишь "звук Нешвила" - столицы кантри. Однако по каким-то причинам этот господин
    (Холловей) умеет исполнять только блюзовую музыку. Получилась небольшая путаница. Но делать нечего. "Ладно, играй и пой
    свой блюз", - сказали ему ребята из студии города Нешвил. – "А уж мы тут не подкачаем!" Я вовсе не хочу сказать, что диск
    не получился. Наоборот. Майкл, похоже, одаренный композитор, приятный певец и гитарист. А что диск с необычным саундом..
    Так не все ж слушать клонов SRV. Честь и хвала тем, у кого своя колея. Я его, диск, просто погромче включаю – эффект исключительный,
    особенно песня "Sure Could Play the Blues".
