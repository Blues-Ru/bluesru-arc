  author: Сергей Исправников
  mark: null
  date: '2008-02-24'
  text: 'В этом трехдисковом издании представлены концертные записи "Fleetwood Mac",
    сделанные во время выступления группы 5 – 7 февраля 1970г. в "Boston Tea Party".
    В процессе работы использовалась мобильная студия, позволившая осуществить профессиональную
    многоканальную запись. По итогам концертов предполагалось выпустить "живой" альбом,
    призванный поддержать культовый статус группы среди рок-сообщества. Однако из-за
    ухода Питера Грина в мае того же года и последовавших за этим проблем как с составом
    музыкантов, так и с репертуаром, данный проект был благополучно забыт. Пленки
    лежали на полках вплоть до середины 80-х гг., когда из них были скомпилированы
    два альбома – "Live In Boston" и "Cerulean". По сравнению с ними, в данное издание
    были добавлены девять ранее не издававшихся бонус-треков, а сами композиции были
    приведены в соответствие с их фактической очередностью исполнения на концертах.


    Выбор для записи диска именно "Boston Tea Party" оказался не случаен. Дело в том,
    что в 1969 г. "Fleetwood Mac" трижды гастролировали в США, причем особенно популярна
    группа была именно на Восточном побережье, одним из крупнейших городов которого
    и является Бостон. "Boston Tea Party" была одной из трех основных концертных площадок
    города. Функционировавшая с начала 1967 г. расположенная в здании бывшей синагоги,
    "Boston Tea Party" обладала прекрасной акустикой, поэтому лучшего места для записи
    концертного альбома было не найти. Кроме "Fleetwood Mac", там неоднократно выступали
    такие рок-легенды, как "Velvet Underground", "MC5" и "Led Zeppelin".


    Что касается самой концертной программы "Fleetwood Mac", то она разительно отличалась
    от двух первых студийных альбомов, в которых группа выступила своего рода блюзовыми
    ортодоксами. Обычно концерты состояли из двух отделений, в первом из которых Питер
    Грин и Дэнни Кирвэн играли преимущественно авторские композиции, зачастую превращая
    их в психоделические гитарные джемы, причем обозначившееся между ними соперничество
    до поры до времени только подхлестывало творчество обоих. Как показывает программа
    данных концертов, к тому времени "Fleetwood Mac" фактически перешли от блюза к
    рок-мейнстриму, причем скорее в американском, чем в британском варианте. Во втором
    отделении "зажигал" Джереми Спенсер, весьма эксцентрично, на грани истерии, исполнявший
    классику Элмора Джеймса и пародии на рок-н-ролл 50-х гг. Кроме того, он мог прикрепить
    к грифу гитары наполненные пивом презервативы и размахивать ими над головами шокированной
    публики. В дополнение к этому он любил появляться на сцене с шестнадцатидюймовым
    фалоимитатором, вылезавшим из его расстегнутой ширинки. В Британии такие вещи
    обычно заканчивались скандалом, были случаи, когда группу просто удаляли со сцены,
    зато в США это проходило на ура.


    Первый диск открывает "Black Magic Woman" Питера Грина, великолепная композиция,
    двумя годами ранее изданная на сингле и явно недооцененная современниками именно
    в авторском исполнении. Ее продолжает неальбомная вещь –"Jumping At Shadows" Дастера
    Беннетта, блистательно исполненная Питером Грином и являющаяся одной из лучших
    композиций этого диска. Далее идут две вещи Кирвэна, причем на одной из них –
    "Like It This Train" – Грин с Кирвэном устроили настоящую гитарную дуэль. Середину
    диска занимает эпическое двадцатипятиминутное исполнение "Rattlesnake Shake",
    одной из центральных композиций их последнего альбома "Then Play On" (1969 г.).
    Впоследствии, Мик Флитвуд назвал ее "протометаллической одой мастурбации". Далее
    идут две кавер-версии Элмора Джеймса в исполнении Джереми Спенсера, а завершает
    диск тринадцатиминутный вариант "The Green Manalishi". Это был последний хит Грина,
    написанный им в рамках "Fleetwood Mac", студийно записанный только в апреле 1970
    г. и изданный на сингле месяцем позже. Композиция была посвящена деньгам, которые
    Грин к тому временем считал дьявольским соблазном и призывал остальных участников
    группы избавляться от них, жертвуя на благотворительность. Однако, несмотря на
    идеологическую направленность, эта песня является настоящим произведением гитарного
    искусства, отсылки к ней можно встретить у части классиков хард-рока.


    Второй диск открывается также новой композицией Грина/Кирвэна – гитарной балладой
    "World In Harmony" с сильным влиянием американского эйсид-рока, в первую очередь,
    "Grateful Dead". Далее тему психоделии продолжают хит-сингл "Oh Well" c последнего
    альбома группы и масштабная "Rattlesnake Shake". Что касается последней композиции,
    то по сравнению с первым диском, данное исполнение более уверенное, возможно,
    это вообще лучший пример гитарного джема Питера Грина из когда-либо записанных
    на пленку. Следом идет блок из пяти композиций в исполнении Спенсера: два блюза
    Элмора Джеймса, авторская "Teenage Darling" – издевательская пародия на ду-уоп
    балладу и два классических рок-н-ролла Литтл Ричарда, исполненных на грани истерики.
    Диск завершает ранее не издававшийся гитарный джем с участием всех музыкантов
    "Fleetwood Mac", а также Джо Уолша, лидер-гитариста американской хард-роковой
    группы "James Gang", бывшей тогда у "Fleetwood Mac" на разогреве, и неожиданно
    появившегося на сцене Эрика Клэптона.


    Третий диск начинается ранее не выпускавшейся версией "Jumping At Shadows", более
    жесткой, по сравнению с включенной в первый диск данного издания. Следом идет
    рок-н-ролл Грина "Sandy Mary", написанный под влиянием Чака Берри, а затем десятиминутная
    кавер-версия "If You Let Me Love You" Би Би Кинга. Необходимо отметить, что Би
    Би Кинг был одним из кумиров Питера Грина, и это исполнение в полной мере отражает,
    как исполнительскую технику, так и глубокое чувствование блюза Питером. Затем
    идут две авторские вещи Кирвэна, вторая из которых – инструментал "Coming Your
    Way" – продолжала линию знаменитого "Albatross" Грина. Продолжает диск большой
    сет из блюзов Элмора Джеймса и классических рок-н-роллов, в исполнении Спенсера,
    а завершается выступление общим джемом. Что касается рок-н-ролльной составляющей
    этих концертов, то в студийных условиях она не записывалась, и это издание – отличная
    возможность послушать в расширенном объеме этот неальбомный аспект творчества
    группы.


    При оформлении обложки использовался сюжет исторического "бостонского чаепития",
    имевшего место 16 декабря 1773 г., когда переодевшиеся индейцами американские
    колонисты в знак протеста против увеличения Британией таможенных пошлин проникли
    на корабли с чаем и выкинули его за борт. Данный бокс-сет был выпущен ограниченным
    тиражом в количестве 10 000 нумерованных экземпляров, однако сами диски были изданы
    и по отдельности ("Live In Boston" vol. 1 – 3).'
