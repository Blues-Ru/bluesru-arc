  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2016-08-23'
  text: 'В свое время у меня был двойной винил с названием "The Original Fleetwood Mac/English Rose", а на этом CD представлена
    первая пластинка того самого двойного диска. По сути это своего рода "номерной сборник", поскольку на нем представлен
    неизданный до того времени материал исходного английского блюзового квартета выходцев Блюзбрейкеров Джона Мэйолла (Питер
    Грин, Джон МакВи, Мик Флитвуд и Джереми Спенсер), усиленного будущей супругой Джона Кристиной Перфект. В продюсерском
    кресле - Майк Вернон.


    Диск был выпущен в 1971 году уже после ухода Грина из группы, но записи на нем сделаны в конце 60-х. Несмотря на то, что
    на диске собраны Б-сайды, он определенно представляет интерес для всех любителей классического английского блюза того
    периода. Поскольку упомянутый винил был мною заслушан что называется до дыр, то как только этот материал впервые был издан
    на CD в 1994 году фирмой Castle, я его и прикупил.


    1. Drifting (Peter Green song recorded 1967) [3:33 minutes]


    2. Leaving Town Blues (Peter Green song recorded December 1967) [2:56 minutes]


    3. Watch Out (Peter Green song recorded November 1967) [4:38 minutes]


    4. A Fool No More (Peter Green song recorded November 1967) [4:37 minutes)


    5. Mean Old Fireman (Arthur "Big Boy" Crudup cover recorded November 1967) [3:49 minutes]


    6. Can''t Afford To Do It ("Homesick" James Williamson cover recorded 1967) [2:05 minutes]


    7. Fleetwood Mac (Mono, Peter Green instrumental recorded 1967) [3:57 minutes]


    8. Worried Dream (B.B. King cover recorded April 1968) [5:24 minutes]


    9. Love That Woman (Lafayette Leake cover recorded 1968) [2:32 minutes]


    10. Allow Me One More Show (Jeremy Spencer song recorded 1967) [3:01 minute]


    11. First Train Home (Peter Green song recorded 1967) [4:06 minutes]


    12. Rambling Pony No. 2 (Peter Green song recorded 1967) [2:55 minutes]'
