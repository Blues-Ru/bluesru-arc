- id: 480
  author: Дмитрий Казанцев
  mark: 6
  date: '2004-03-08'
  text: 'Это издание на двух компакт-дисках содержит оба виниловых альбома с записями джемов в студии Чесс в Чикаго. Альбомы
    выходили на лэйбле Blue Horizon и являются редкостью и дорогими раритетами. Оба диска очень длинные, каждый более 50 минут
    (12 треков на первом и 10 на втором). Помимо квинтета в записи принимают участие: Отис Спэнн, Уилли Диксон, Шэйки Нортон,
    Джэй Ти Браун, Гитар Бадди, Ханибой Эдуардс и Эс Пи Лири. Записи живые и отличного качества, но не вырезанная болтовня
    и настройка между треками сильно мешает. Более того, слышно, что ребята просто работают, а Спенсер еще и нервничает; слушателю
    не очень-то нужны такие подробности о внутренней жизни в студии.


    Материал очень однообразный и архаичный. Когда поет Грин - все хорошо, когда поет Джереми - почти ужасно - его резкий
    искусственный вокал и однообразная игра на слайд-гитаре достают сразу. Тем более, что, как обычно, он играет абсолютно
    одинаковые по темпу и мелодии песни. На втором диске еще поет Дэнни Кирван (вполне сносно), Отис Спэнн (отлично) и Джэй
    Ти Браун (интересно); последний трек на первом диске поет Шэйки, и это тоже забавно. Надо отметить, что на обоих дисках
    есть и инструментальные треки; не могу сказать, что это очень интересно. Вообще, когда Диксон играет на басу есть странное
    ощущение какой-то лажи и непонимания внутри группы. Все же ФМ - это классная блюз-роковая группа, а не архаичные черные
    тусовщики. Единственный, кто все делает тут очень здорово, это Питер Грин...


    Очень длинные диски, очень занудный местами материал, очень явное несочетание между британцами и американцами. Всем понятно,
    что это просто джемы, но это же издано альбомами. Очень хорош Грин и Спэнн, ритм-секция рулит, но далеко не везде. Есть
    желание сделать из этого двойника сборник минут на 40, вот тогда будет оценка 5!'
