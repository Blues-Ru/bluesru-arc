  date: '2007-12-09'
  text: "Окончание\n\nНа четвертом и пятом дисках данного издания содержится расширенный вариант двойного альбома \"Blues\
    \ Jam At Chess\", изданного в декабре 1969 г. В то время альбом оказался наименее коммерчески удачным релизом группы и\
    \ был почти полностью проигнорирован поклонниками. Тем не менее, запись была уникальная. Идея записаться в одной из культовых\
    \ студий чикагского блюза возникала в конце 1968 г., когда группа находилась в Америке в рамках клубного тура, приуроченного\
    \ к Новому году. К тому времени Майк Вернон уже имел контакты с руководством Chess Records и договорился о записи на 4\
    \ января 1969 г. В ней приняли участие ряд звезд чикагского блюза, находящихся в это время в городе. Это были гитаристы\
    \ Buddy Guy и David \"Honey Boy\" Edwards, пианист Otis Spann, гармошечник Walter \"Shakey\" Horton, саксофонист J.T.\
    \ Brown, ударник S.P. Leary, а также басист и продюсер Willie Dixon. Сама запись проходила достаточно спонтанно, вопросы\
    \ о том, какая композиция будет исполняться следующей и кто на ней будет играть решались по ходу дела. Чтобы сохранить\
    \ атмосферу аутентичности как при первоначальном издании на виниле, так и в рамках данного бокс-сета были оставлены все\
    \ разговоры музыкантом между треками и фальш-старты.\n\nИсходя из условий записи, в альбоме оказалось \tмало авторских\
    \ композиций самих \"Fleetwood Mac\", в основном это были кавер-версии. Так на диске было всего две вещи Питера Грина,\
    \ причем одна из них – \"Red Hot Jam\" – была инструментальной импровизацией. Также были записаны две композиции Кирвэна\
    \ и одна – Спенсера. По количеству кавер-версий на первом месте шел материал Элмора Джеймса, его традиционно исполнял\
    \ Джереми Спенсер. Кроме этого он сыграл классику Мемфис Слима \"Every Day I Have The Blues\". Питер Грин солировал на\
    \ блюзах Хаулин Вулфа, Литтл Уолтера, \"Homesick\" Джеймса и Отиса Раша. Что касается Дэнни Кирвэна, то он выбрал навеянную\
    \ Холодной войной \"World's In A Tangle\" Джимми Роджерса.\n\nИз приглашенных музыкантов больше всего материала записал\
    \ Walter Horton, основная часть которого в оригинальный альбом не вошла и представлена здесь впервые. Тому были свои причины.\
    \ По словам Майка Вернона, на записи Хортон был наименее адекватен. Он обращал мало внимания на окружающих, мог начать\
    \ или остановиться играть без предупреждения, оборвать одну композицию и тут же без паузы перейти к другой, один куплет\
    \ спеть в вокальный микрофон, а другой – мимо. Что-либо объяснять ему было невозможно, за весь день он так и не запомнил\
    \ как зовут Майка Вернона и вряд ли вообще понимал, кто он такой. Скорее всего, виной тому было многолетнее пьянство,\
    \ поскольку из всех чикагских блюзменов по количеству выпитого спиртного с Хортоном мог сравниться только покойный Сонни\
    \ Бой Уильямсон. На двух собственных треках солировал лучший пианист послевоенного Чикаго – Отис Спэнн. Так как Питер\
    \ Грин был большим поклонником его таланта, \"Fleetwood Mac\" аккомпанировали на записи его сольного альбома для Blue\
    \ Horizon, состоявшейся через пять дней после этой сессии уже в Нью-Йорке. По одной авторской композиции исполнили также\
    \ J.T. Brown, на которого снизу вверх смотрел Спенсер, поскольку тот в свое время много играл с его кумиром – Элмором\
    \ Джеймсом, а также David Edwards. До войны он одно время путешествовал и играл вместе с легендарным Робертом Джонсоном.\
    \ К сожалению его инструментал \"Honey Boy Blues\" оказался неоконченным, поэтому на пластинку не попал и представлен\
    \ здесь впервые.\n\nПоследний диск \"Fleetwood Mac\", изданный Майком Верноном, появился на полках музыкальных магазинов\
    \ в ноябре 1971 г. и был озаглавлен \"The Original Fleetwood Mac\". Пластинка представляла собой сборник неизданного студийного\
    \ материала группы и являлась своего рода реквиемом по классическому составу \"Fleetwood Mac\". Дело в том, что к свалившимся\
    \ на них большим деньгам группа была психологически не готова. Каждый из участников решал свои проблемы по-разному, кто\
    \ с помощью алкоголя, кто – с LSD. Начиная с конца 1969 г. у Грина под влиянием употребления психоактивных веществ стремительно\
    \ развивались личностные изменения, причем далеко не в лучшую сторону. Он терял контакт с окружающим миром, вдруг вспомнив\
    \ о своей национальной принадлежности, резко ударился в иудаизм и в мае 1970 г. внезапно покинул группу. Не менее трагичный\
    \ случай произошел и с Джереми Спенсером, когда во время американских гастролей группы 1971 г. он пошел в книжный магазин\
    \ и не вернулся. Когда его через несколько дней нашли, он оказался в секте Дети Бога, приняв новое имя, полностью отказавшись\
    \ от своей прошлой жизни.\n\nЧто касается самой пластинки, то большая часть вошедшего в нее материала была записана еще\
    \ в 1967 г. во время сессий дебютного диска группы. В основном, это были собственные композиции Питера Грина, исполненные\
    \ им, когда его талант как автора и исполнителя находился на пике своего развития. Отдельно стоит отметить записанный\
    \ в августе 1967 г. еще на студии Decca гриновский инструментал \"Fleetwood Mac\", давший название самой группе. На диске\
    \ присутствуют и три композиции Джереми Спенсера данного периода: исполненные им сольно слайдом на акустической гитаре\
    \ собственная \"Allow Me One More Show\" и \"Mean Old Fireman\" Артура Крадапа, а также сыгранная с группой \"Can't Afford\
    \ To Do It\" Homesick Джеймса. 1968 год представлен исполненной Грином пронзительной балладой Би Би Кинга \"Worried Dream\"\
    \ и боевиком Отиса Раша \"Love That Woman\", сыгранного Спенсером. Сама пластинка вошла в шестой диск данного издания,\
    \ который был дополнен четырьмя композициями Дэнни Кирвэна, записанными в октябре 1968 г. Три из них первоначально были\
    \ выпущены на компилятивном диске \"English Rose\", изданным в 1969 г. для американского рынка.\n\nВ заключение остается\
    \ добавить, что данный бокс-сет является примером для подражания, как по полноте представленного материала, так и по его\
    \ качеству. Можно только поблагодарить Майка Вернона и всех людей, которые месте с ним работали над этим изданием за настоящий\
    \ подарок всем любителям британского блюза."
