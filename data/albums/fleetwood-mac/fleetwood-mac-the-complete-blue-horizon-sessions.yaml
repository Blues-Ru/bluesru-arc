- id: 1169
  author: Сергей Исправников
  mark: null
  date: '2007-12-09'
  text: 'Данное шестидисковое издание "Fleetwood Mac" включает все записи группы на лейбле Blue Horizon 1967 – 1969 гг., эпохи
    когда британский блюз как музыкальный жанр находился на пике своего развития. Что касается альбомов "Fleetwood Mac", то
    здесь совместились таланты Питера Грина, одного из лучших блюзовых гитаристов Великобритании, так и Майка Вернона, выдающегося
    продюсера блюзовых пластинок. Первоначально, планировалось издать четырехдисковый бокс-сет "Fleetwood Mac", куда можно
    было поместить все ранее издавшиеся треки группы указанного периода времени, однако в процессе работы в архивах фирмы
    Sony было обнаружены не пострадавшие от времени оригиналы мастер-лент, на которых присутствовало много не изданного материала.
    В результате бокс разросся до шести дисков, включающих пять оригинальных альбомов (один из них двойной), наряду с дублями
    и ранее не реализованными композициями.


    Сама группа была образована в 1967 г. из состава музыкантов "Bluesbreakers" Джона Мэйэлла: гитариста Питера Грина, басиста
    Джона МакВи и ударника Мика Флитвуда. Грин ушел от Мэйэлла в мае месяце из-за творческих разногласий: Джон хотел расширить
    звучание "Bluesbreakers" за счет использования духовой секции, а Питер стремился играть ортодоксальный гитарный блюз.
    Кроме того, Мэйэлл был достаточно авторитарным лидером: с одной стороны, он помогал раскрыться творческому потенциалу
    игравших у него музыкантов, с другой, был сторонником жесткой дисциплины. Собственно говоря, инициатором создания "Fleetwood
    Mac" оказался не кто иной, как Майк Вернон, работавший с Грином на записи альбома "A Hard Road" группы Джона Мэйэлла.
    Уйдя из "Bluesbreakers", Питер хотел уехать в Америку и играть блюз на улицах Чикаго, однако эта утопия не осуществилась.
    Ни о какой группе речь не шла, и Вернону стоило труда убедить Грина собрать собственный бэнд. Фактически, первоначально
    группа была создана под один из проектов Вернона – британский независимый блюзовый лейбл Blue Horizon. Поначалу она была
    своего рода "домашним составом" Blue Horizon, не только записываясь сольно, но и аккомпанируя другим исполнителям, например,
    Эдди Бойду и Дастеру Беннетту.


    Большая часть материала дебютного альбома группы, озаглавленного "Peter''s Green Fleetwood Mac", была записана при минимальном
    бюджете всего за два дня –22 ноября и 11 декабря 1967 г. – в лондонской студии компании CBS, с которой у Blue Horizon
    был дистрибьюторский контракт. Дело в том, что после своего триумфального дебюта 13 августа 1967 г. на Виндзорском джазовом
    и блюзовом фестивале группа много гастролировала, что не способствовало кропотливой и целенаправленной студийной работе.
    Поэтому Майк Вернон записывал их при любой возможности, сначала полуподпольно в ночные часы на студии "Decca", где он
    тогда работал, а потом уже и на CBS.


    На первый альбом вошло 12 из записанных в то время треков, причем преобладали авторские композиции Питера Грина и Джереми
    Спенсера. Спенсер появился в группе благодаря тому же Майку Вернону, которому он прислал свою демо-запись. В то время
    работавший продюсером Decca, Вернон съездил в Бирмингем, послушать новую группу. По его словам, ударник с басистом совсем
    играть не умели, а вот гитарист, которым оказался Джереми, был просто выдающимся. Когда обсуждался вопрос о формировании
    "Fleetwood Mac", Вернон посоветовал Грину обратить внимание на талантливого юношу. Сам Спенсер увлекался, с одной сторону,
    рок-н-роллом, а с другой, Элмором Джеймсом. Поэтому его собственные композиции написаны либо в духе послевоенного агрессивного
    электрического блюза, либо представляют собой стилизации и пародии на рокабилли. Что касается кавер-версий, то учитывая
    личные пристрастия участников группы, они были предсказуемы: Спенсер с большим энтузиазмом исполнил два боевика Элмора
    Джеймса – "Shake Your Moneymaker" и "Got To Move", а Грин – "No Place To Go" Хаулин Вулфа, отличить который от оригинала
    можно только по вокалу. Впрочем, Спенсер в полной мере проявил свою оригинальность, сделав переложение для фортепьяно
    классики легендарного довоенного блюзового гитариста Роберта Джонсона – "Hellhound On My Trail" – и исполнив его сольно
    на альбоме.


    Изданный в конце февраля 1968 г. диск произвел настоящую сенсацию. Уже 2-го марта он достиг четвертого места в британских
    альбомных чартах и оставался в них целых тридцать семь недель. Группа выбилась в хэдлайнеры блюзовой сцены, записав действительно
    эпохальную работу, которая наряду с диском Мэйэлла "Bluesbreakers with Eric Clapton" (1966 г.) определила лицо британского
    блюза и позволила ему самоидентифицироваться как самостоятельному музыкальному жанру. Сам альбом представлен на первом
    диске данного издания, наряду с рядом дублей, позволяющих проследить процесс студийной работы музыкантов, и двумя ранее
    не издававшимися композициями Джереми Спенсера, одна из которых – "You''re So Evil" – была записана им сольно под фортепьяно,
    а другая – "I''m Coming Home To Stay" – с группой.


    Необходимо отметить, что по стандартам звукоиндустрии средний срок между выходом двух альбомов одного исполнителя составляет
    18 месяцев. Однако в конце 60-х гг. энтузиазм был так велик, что запись второго альбома "Fleetwood Mac" осуществили уже
    в апреле 1968 г. На этот раз, несмотря на технические сложности, было решено записать в студии максимально "живой" альбом,
    отражающий ауру концертных выступлений группы. С помощью использования в студии характерной для клубов "Public Address
    system" на диске было зафиксировано намеренно сырое звучание с естественными искажениями звука. С учетом того, что запись
    проходила практически без наложений, то в случае ошибки одного из музыкантов группа была вынуждена останавливаться и играть
    заново.


    На диске, как и раньше, присутствовали композиции Питера Грина и Джереми Спенсера, а также хит любимого группой Элмора
    Джеймса – "Dust My Broom". С одной стороны, стилистически диск продолжает дебютный альбом, он решен в том же блюз-роковом
    ключе, но с другой стороны, само звучание группы здесь было расширено за счет использования духовой секции – видимо, Грин
    взял пример со своего кумира Би Би Кинга. К слову сказать, исполнявшийся группой блюз не стал от этого менее жестким,
    что не удивительно, поскольку один из четырех участвовавших в записи саксофонистов – Steve Gregory – играл в то время
    с британскими "The Amboy Dukes", другой – Johnny Almond – со звездой британского R''n''B, пианистом и шоуменом Zoot Money.
    Кроме того, на четырех треках фортепьянные партии исполнила Кристина Перфект – подруга, а впоследствии супруга Джона МакВи
    и участница группы "Chicken Shack". Список гостей, принимавших участие в работе над альбомом, завершает Дастер Беннетт,
    исполнивший дуэтом с Питером Грином заключительную композицию диска – печальный акустический блюз "Trying So Hard To Forget".


    Вышедший в сентябре 1968 г., альбом был озаглавлен "Mr. Wonderful" и содержал на обложке фотографию голого Мика Флитвуда
    с чуть прикрытым листьями причинным местом с совершенно безумным выражением лица. По воспоминаниям первого басиста "Fleetwood
    Mac" Боба Браннинга, название альбома появилось, когда они вместе с Грином смотрели какое-то телевизионное шоу, в котором
    каждого нового участника представляли как "просто удивительного". Альбом неплохо продавался, но успеха дебютной пластинки
    не повторил. Здесь сказалось общее настроение публики и критиков, предрекавших скорый конец "британскому блюзовому буму",
    который, к счастью, не наступил. Альбом включен во второй диск данного издания, вместе с пятью дополнительными дублями
    его дебютного трека – гриновского "Stop Messin'' Round", а также двумя не издавшимися композициями, исполненными Джереми
    Спенсером – "I Held My Baby Last Night" Элмора Джеймса и собственного инструментала "Mystery Boogie".


    Третий диск группы на Blue Horizon – "The Pious Bird Of Good Omen" – был издан в августе 1969 г., когда "Fleetwood Mac"
    уже перешли на куда более крупную звукозаписывающую компанию – Warner. Произошло это из-за того, что Майк Вернон просто
    забыл вовремя пролонгировать контракт с группой, а менеджер "Fleetwood Mac" Клиффорд Дейвис вовремя подсуетился перейти
    с независимого лейбла на мэйджор. Вопрос был не в творческих разногласиях, а банально заключался в размере гонораров.
    Спохватившись, Вернон выпустил этот диск на опережение новому номерному альбому группы на Warner. Фактически, пластинка
    явилась сборником ранее издававшегося материала – четырех синглов, двух треков с первых двух альбомов группы и двух номеров,
    записанных вместе с чикагским блюзовым певцом и пианистом Эдди Бойдом.


    На диске представлен первый сингл "Fleetwood Mac", записанный еще в сентябре 1967 г. На нем содержались "I Believe My
    Time Ain''t Long" Роберта Джонсона и авторская "Rambling Pony" Питера Грина. На данных треках зафиксирован самый первый
    состав "Fleetwood Mac", когда на бас-гитаре вместо Джона МакВи играл Боб Браннинг. В отличие от своего предшественника,
    не имевшего успеха в ротациях, второй сингл группы с "Black Magic Woman" Грина и "The Sun Is Shining" Элмора Джеймса к
    10 апреля 1968 г. дошел до 37-ой позиции в чартах. Как ни странно, "Black Magic Woman" в оригинальном исполнении Питера
    Грина публикой первоначально оценена не была, зато позже стала хитом №1 для Карлоса Сантаны. Тем не менее, трек носит
    знаковый характер, являясь ярким проявлением талантов Грина одновременно как автора, гитариста и вокалиста. Третий сингл
    группы с записью хита звезды послевоенного ритм-энд-блюза Little Willie John – "Need Your Love So Bad" – был издан в июле
    того же года и к 17-му числу поднялся до 31-го места в хит-параде. Собственно говоря, данную композицию записывали дважды
    – 11 и 28 апреля – причем, в разных аранжировках: в первом варианте Кристина Перфект исполнила партию фортепьяно, а во
    втором сыграла на электрооргане Hammond B3. Для издания на сингле был выбран последний вариант, однако Майк Вернон решил
    добавить на запись струнную секцию. Для этого он обратился к участнику первоначальной записи этой песни 1955 г. – гитаристу
    Mickey Baker, к тому времени перебравшемуся в Париж. Baker заинтересовался проектом и написал аранжировку для струнного
    ансамбля, однако приехать в Лондон не смог. Поэтому 15 мая дополнительную запись струнных и духовых для этого трека провели
    под руководством трубача и аранжировщика Terry Noonan. В результате, получилась нежная лирическая композиция, совершенно
    не характерная для исполняемого группой репертуара.


    Однако подлинный успех пришел только к четвертому синглу группы, на котором были записаны два инструментала: роскошный
    гриновский "Albatross" и "Jigsaw Puzzle Blues" нового гитариста группы, восемнадцатилетнего Дэнни Кирвэна. Кирвэн присоединился
    к группе летом 1968 г., до этого он играл в локальном блюзовом бэнде "The Boilerhouse", одно время выступавшим у "Fleetwood
    Mac" на разогреве. Блюзом Кирвэн заинтересовался под влиянием Эрика Клэптона, другим его кумиром был джазовый цыганский
    гитарист Джанго Рейнхарт. Не имеющий никакого отношения к блюзу, прогрессив-роковый "Albatross" имел просто феноменальный
    успех: впервые появившись в чартах 4 декабря 1968 г., уже в начале следующего года достигнув первого места, он стал визитной
    карточкой группы по обе стороны Атлантики. Что касается самого альбома "The Pious Bird Of Good Omen", то он вошел на третий
    диск данной коллекции и для издания в рамках этого проекта был отредактирован. Из него исключили все повторы, добавив
    ранее не издававшуюся "Like Crying", исполненную дуэтом Грином и Кирвэном, а также все имеющиеся дубли и альтернативные
    варианты "Need Your Love So Bad" общей продолжительностью почти сорок минут.


    Окончание см. ниже'
- id: 1168
  author: Сергей Исправников
