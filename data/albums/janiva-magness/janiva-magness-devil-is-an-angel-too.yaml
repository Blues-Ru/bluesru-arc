- id: 1863
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-09'
  text: 'Девятый студийный альбом (и второй для лейбла Аллигатор) одной из ведущих современных блюзовых вокалисток Джанивы
    Магнесс, обладательницы целого ряда престижных премий: премии Б.Б. Кинга исполнителю года в 2009 году (до этого такую
    премию у прекрасного пола получала только великая Коко Тэйлор), современной блюзовой артистке года в 2006, 2007 и 2009
    году, а также 11 номинаций на блюзовые премии до этого.


    Мощный чувственный и эмоциональный голос, блестящая энергичная подача, прекрасные аранжировки, разнообразный подбор материала,
    и вполне заслуженное третье место в топе блюзовых альбомов Биллборда. Качественный альбом от интересной певицы, рекомендуется
    всем любителям современного блюза с примесью соул.


    "A superb, powerhouse R&B singer who delivers blues and soul with show-stopping authority" - Los Angeles Daily News


    "Janiva Magness slow-burns and romps heart-first...she never injects contrived emotion, never puts a tear in her voice
    where one doesn''t belong. She simply sings heartbreak, hunger and humor-sings ‘em with equally great chops and feeling-and
    lets that speak for itself." - No Depression


    "Stunningly sung...Magness is a blues star" - USA Today'
