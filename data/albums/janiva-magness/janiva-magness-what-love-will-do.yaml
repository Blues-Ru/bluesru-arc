- id: 1548
  author: Константин Колесниченко
  mark: 9
  date: '2009-06-11'
  text: 'Признаюсь, до этого альбома творчество этой певицы было мне безразлично. Ее вокальные партии попадались мне на записях
    других музыкантов (преимущественно Вест-Коаст блюза), ее супруг, Джефф Термс, участвовал в каждой второй записи калифорнийского
    свинга, но познакомиться с альбомами Джанивы ближе у меня не возникало желания. Потому с первых нот "What Love Will Do"
    я был очень приятно удивлен содержанием альбома. Вокальные данные у Магнесс скромные, но как же красиво и умно она ими
    пользуется. Завидное умение.


    Альбом "What Love Will Do" - это не набор свингующих баллад, как я опасался перед прослушиванием, а замечательная подборка
    соул, фанк, блюз, джаз и прочей музыки, сыгранная без выпендрежа и показухи. Это запись мне напомнила "Zinfidelity vol
    1" Расти Зина. Как и следовало ожидать, в создании "What Love Will Do" приняло участие много звезд вест-коаст блюза: Jumior
    Watson, Zack Zunis, Jeff Turmes, Stephen Hodges и др. Думаю этим музыкантам было очень интересно поучаствовать в записи
    такого замечательного альбома.'
- id: 1862
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-09'
  text: 'Дебютный альбом на лейбле Аллигатор известной блюзовой дивы из Детройта (а всего по счету восьмой сольник в карьере
    Джанивы Магнесс), по итогам которого в 2009 году она была удостоена премии Б.Б. Кинга лучшему исполнителю года. Премию
    Джаниве вручил лично Б.Б. Кинг, которому ассистировала Бонни Райатт.


    Качественный альбом современного блюза с примесью соул, исполненный профессионально, эмоционально и искренне. Лишнее доказательство
    того, что многочисленные блюзовые награды присуждены Джаниве Мэгнесс вполне заслуженно. Достойное третье место в топе
    блюзовых альбомов Биллборда.


    "Her songs run the gamut of emotions from sorrow to joy. A master of the lowdown blues who is equally at ease surrounded
    by funk or soul sounds, Magness invigorates every song with a brutal honesty" - Chicago Sun-Times'
