  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2018-03-02'
  text: 'В отличие от предыдущего альбома, за который Джанива получила кучу премий
    (в частности, номинацию на Грэмми за лучший альбом современного блюза), и который
    при этом мне совсем не показался интересным, этот вполне себе симпатичный. Правда,
    как раз собственно блюза тут немного - больше влияние соул, а еще больше - кантри
    и фолк, но ведь это тоже традиционная американская корневая музыка, не так ли?
    Продюсировал и микшировал альбом Дэйв Дарлинг, с которым певица работала и на
    предыдущем альбоме. В итоге получился качественный коммерческий продукт (в хорошем
    смысле этого слова).


    Кстати, из гостей хороши Чарли Масселуайт (а когда он вообще не был хорош?) и
    Расти Янг на слайде.'
