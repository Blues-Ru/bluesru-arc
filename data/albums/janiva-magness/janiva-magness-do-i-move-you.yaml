  date: '2017-03-03'
  text: 'Замечательная блюзовая певица, уроженка Детройта, Джанива Мэгнесс, после
    выпуска этого альбома была признана лучшей блюзовой певицей 2006 года. Альбом
    вышел в марте на высокоуважаемой в мире блюза канадской фирме NorthernBlues Music.


    Джанива всегда очень спокойно поет свои блюзы, немного хрипловатым вокалом,никуда
    не торопясь, лирично, с отличными аранжировками Рика Хольстрома Rick Holstrom
    - (гитара), Jeff Big Dad Turmes- бас гитарист,саксофонист, композитор - автор
    трех песен на этом альбоме. остальные музыканты : Richard Bell (фортепиано, Hammond
    b-3 орган); Stephen Taylor Hodges (ударные); Jessie Alexander (бэк вокал); Colin
    Linden (гитара, бэк вокал); John Whynot (Wurlitzer орган, бэк вокал).


    Ее голос небольшого диапазона, напоминает и Bonnie Raitt, и Susan Tedeschi, и
    даже Bessie Smith,но все равно ее можно узнать и отличить от других.Блюз она поет
    уже без малого 25 лет, выпустила несколько дисков. За отточенностью ее певческой
    техники при небольшом диапазоне голоса читается гигантский труд и невероятное
    желание совершенствоваться. Это надо уважать.


    Коллеги оценили стремление и успехи Джанивы Мэгнесс по достоинству. Недаром тяжеловесы
    жанра, такие, например, как Джуниор Уотсон или Кид Рамос с готовностью участвовали
    в записи ее пластинок и в концертах. Певица сформировала свою первую группу в
    Фениксе. Ансамбль был достаточно популярен, чтобы музыкальные журналисты в итоге
    назвали его лучшей блюзовой командой города. Далее целеустремленная Джанива совершила
    скачок в Лос-Анжелес. Это произошло в 1986.


    Год спустя она уже пела сначала в формате акустический дуэт и блюзовое трио, а
    в начале 90-х познакомилась с сильным музыкантом-мультиинструменталистом и аранжировщиком
    Джеффом Тормсом, который стал не только ее музыкальным партнером, но и супругом.
    У Джеффа были разветвленные связи в Лос-Анжелесе, а у Джанивы - бешеное желание
    петь и любой ценой пробиться в профессии.


    Одно помножилось на другое и дало в 1997 первый их альбом. Все песни для него
    написал Тормс. Возможно, Джанива не выбилась бы в большие звезды, поскольку ее
    диски, выходившие затем последовательно в 1999, 2001 и 2003, издавались, к сожалению,
    небольшими фирмами, не способными на общенациональную дистрибьюцию альбомов своих
    артистов. Но с NorthernBlues Music дела пошли на лад.'
