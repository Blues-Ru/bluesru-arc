- id: 711
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-06-05'
  text: 'Сольник Джеймса отличается от его работ с группой James Montgomery Band.
    Тут появились элементы диско и, одновременно, стеб над всем этим течением. Продакшн
    совсем другой, скорее ритм-н-блюзовый, чем блюз-роковый. Много фанка и ритм-н-блюза,
    есть неожиданные каверы: "For Your Love" (Yardbirds), "Fire On The Bayou" (Meters).
    Джеймс немного играет на гармошке на этой пластинке, хотя он по-прежнему числится
    как вокалист/гармонист.


    Редкий и симпатичный диск. Несколько песен великолепны.'
