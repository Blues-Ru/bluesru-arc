- id: 1030
  author: Александр Панин
  mark: 4
  date: '2006-09-10'
  text: Странные дела нынче происходят в блюзовом шоу-бизнесе. Два года назад сын
    Джона Ли Хукера записал первый альбом, получивший Грэмми в номинации "лучший дебют".
    На оллмьюзике пишут, что до этого около четверти века он только и делал, что пил
    и потреблял наркотики. Теперь младший Хукер весь в белом и с новым альбомом уже
    на лейбле Telarc. Ни на каких инструментах он не играет (по крайней мере на записях),
    а только поет, причем сильным и примечательным его голос назвать не представляется
    возможным. Никаких связей с музыкой отца на дисках Джуниора не прослеживается,
    кроме того, что он исполняет некоторые вещи покойного Джона Ли. Последнее творение
    содержит абсолютно незапоминающуюся версию песни I'm In The Mood и еще одиннадцать
    пресных номеров собственного сочинения, варьирующихся от стандартного электроблюза
    до современного варианта джамп-блюза, временами совершенно неотличимого от эстрады.
    Стопроцентно коммерческий продукт, сделанный на удачном имени исполнителя.
