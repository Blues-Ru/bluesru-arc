reviews:
- id: 652
  author: Александр Панин
  mark: 10
  date: '2005-05-20'
  text: 'Мадди Уотерс сделал свой послевоенный хит Rollin'' Stone, перепев известную
    песню Catfish Blues, а преподобный Роберт Уилкинс записал две части другой одноименной
    композиции еще в 1928 году. На этом история о камнях не заканчивается, ибо на
    альбоме Beggars Banquet 1968 года Роллинг Стоунз исполнили песню Prodigal Son,
    являющуюся по существу версией уилкинсовской вещи That''s No Way To Get Along.


    Кроме перечисленных песен, на диске еще 11 треков, записанных Робертом в 1928-1935
    годах. Уилкинс не являлся выдающимся гитарным исполнителем, не играл слайдом,
    не демонстрировал какой-то исключительной техники. Однако он четко играл ритм,
    и каждая его песня была отлично композиционно выстроена. Все треки слушать интересно,
    они разные, кроме Rollin'' Stone и That''s No Way To Get Along особо отмечу еще
    Jailhouse Blues и Police Sergeant Blues.


    Качество неважное, конечно. Но это абсолютная классика!'
