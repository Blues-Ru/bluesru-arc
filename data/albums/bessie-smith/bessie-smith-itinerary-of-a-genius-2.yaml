- id: 1250
  author: Андрей Евдокимов
  mark: 10
  date: '2008-04-09'
  text: Влияние Императрицы блюза выходит далеко за границы собственно блюза. Выдающаяся певица обладала великолепным голосом
    и прекрасными артистическими способностями. Яркая личность в жизни, она записывала свои песни, как художник пишет автопортреты.
    И за десять лет, которые она работала в студии, успела записать более полутора сотен песен. И выбрать из этого наследия
    материал, чтобы заполнить всего 70 минут компакт-диска, задача очень непростая. Просто по той причине, что Бесси Смит
    не записывала плохих песен. И слово "Гений" в названии нового сборника не будет преувеличением. Здесь представлены и самые
    знаменитые ее записи, и относительно малоизвестные. Участие в записи таких великих джазовых мастеров, как Луи Армстронг
    или Бенни Гудмен служит дополнительным бонусом.
