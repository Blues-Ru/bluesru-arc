- id: 1173
  author: Дмитрий Казанцев
  mark: 7
  date: '2007-12-10'
  text: 'Двойной сборник Бесси; здесь - 31 песня 1925-1927 годов. Все записи сделаны в Нью-Йорке для Коламбии. Записи очень
    приличного качества для тех лет, но в цифре это совсем не звучит.


    Бесси исполняет кабаре-блюз, джаз и регтаймы тех лет. У нее мощный и довольно монотонный голос - это может показаться
    занудным в таком объеме. Смит поет под рояль + духовые и иногда банджо.


    Очень однообразная музыка и манера пения, к сожалению. Но голос и атмосфера - волшебно!'
