- id: 1481
  author: Андрей Евдокимов
  mark: 10
  date: '2009-02-05'
  text: 'Блюз начинается с Бесси Смит. В хронике звукозаписи это так, хотя фактически это далеко от истины. И все-таки, "Судья,
    мое место на электрическом стуле" и "Дай мне виски, косячок и свиную рульку" - это все она.: удивительная женщина с огромным
    голосом и бездной эмоций. Для коллекционера прежде выбор был не велик: либо "Complete", либо "Best Of". К сожалению, "Императрица
    блюза" никогда не отказывалась от работы в студии, записав сотни композиций, из которых так много было просто "проходимых".
    А вот выборка из них "Лучших" всегда зависела от вкуса составляющих. "JSP", будучи британской фирмой, давно уже зарекомендовала
    себя знатоком в "блюзе со смыслом". Теперь, обращаясь к истории, компания только утверждает свое высокое реноме. Действительно,
    выбор песен сделан с большим вкусом. Здесь нет однобокости предыдущих "best of", а буклет более чем доказывает серьезность
    работы, проделанной в архивах. Пожалуй, именно эта коробочка должна стоять в основе каждой блюзовой коллекции.'
