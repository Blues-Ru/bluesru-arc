  author: Дмитрий Казанцев
  mark: 7
  date: '2005-08-19'
  text: 'Джон - британский фолковый гитарист-виртуоз. Его ранние альбомы - это фолк
    и фолк-блюз, часто инструментальный (как на этом альбоме).


    Этот диск очень короткий - 28 минут, на нем записаны 12 коротких песен. Половина
    композиций написана Джоном, другая половина - блюзово-фолковая традиция. Есть
    здесь две очень известные вещи: "Can''t Keep From Cryin''" и "Nobody''s Fault
    But Mine". Джон играет на акустических гитарах и поет, кое-где ему подпевает Джэки
    МакШи (потом они соберут вместе группу Pentangle).


    Жаль, что диск такой короткий и так мало вокальных номеров. Джон - не великий
    певец, но его песни все же интереснее его инструменталов (хотя они сложны и виртуозны,
    конечно).'
