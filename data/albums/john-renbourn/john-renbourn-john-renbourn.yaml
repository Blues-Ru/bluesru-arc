  author: Дмитрий Казанцев
  mark: 10
  date: '2005-07-07'
  text: 'Джон Ренбурн родился в Англии, но всю свою жизнь он занимался англо-американским
    блюзом и фолком. Это его дебютный альбом, и на нем очень много известных блюзов,
    со словами и без. Джон - виртуоз игры на акустической гитаре, его кумирами учителями
    были такие блюзмены и сонгстеры, как Биг Билл Брунзи и Гари Дэвис. Конечно, он
    играет много лучших их, используя различные техники и строи, но вот пение Джона
    совсем не такое, как у его черных учителей - скромнее и более холодное (это его
    единственный полу-минус).


    На этом диске: блюзы, фолк-песни, песни и инструменталы Джона, госпел, игра слайдом
    - все лучшее, что может сыграть и спеть настоящий фолкер-виртуоз. Тут он играет:
    "Beth''s Blues", "John Henry", "Louisiana Blues", "Candy Man", "Winter Is Gone",
    "Blues Run The Game".


    Надо отметить, что его соотечественник Ник Дрейк много взял у Джона, но оказался
    более успешным и талантливым автором.


    Этот альбом великолепен. 1965 год, прекрасное исполнение и качество записи. К
    15 оригинальным трекам на компакт добавили еще 3 бонуса.'
