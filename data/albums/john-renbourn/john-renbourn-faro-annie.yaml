- id: 759
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-07-12'
  text: 'На этом альбоме Джон играет не один - ему помогают друзья: Terry Cox - drums, Danny Thompson - drums, Sue Draheim
    - fiddle, Doris Henderson - vocals, Pete Dyer - harmonica. Музыка Ренборна по-прежнему в "рутовом" традиционном ключе
    - фолк-блюз, кантри-блюз, английский фолк. Его игра на гитаре великолепна, а спокойный голос не дает оторваться от прослушивания
    этой пластинки.


    На диске 11 песен, Джон написал только 3 из них, остальные - традиционные и авторские песни и блюзы, из них много известнейших:
    "Kokomo Blues", "The Cuckoo", "Come On In My Kitchen". Прекрасная работа Джона и его коллег, обязательный диск в любой
    коллекции фолка и блюза.'
