  text: 'Lee Jackson родился 18 августа в 1921 году в Джексоне (Миссиссиппи)- скромный,
    и блестящий деятель чикагской блюзовой сцены. Как басист или второй гитарист,
    он записывался со многими выдающимися музыкантами. 100%-ный блюзмен, он умел играть
    и с такими своеобразными блюзменами, как Саннилэнд Слим или Джей Би Хьютто, записывался
    и с Лейси Гибсоном.


    Музыкальную деятельность начинал на юге, в юном возрасте уже вел жизнь бродяги,
    которая занесла его в Сент Луис. Много выступая, исколесил весь юг от Флориды
    до Оклахомы. В 1950 году осел в Чикаго и продолжил выступать в местных клубах.
    В начале 50х работал с John Ned ''Johnny'' Shines (aka Shoe Shine Johnny и Little
    Wolf, прозванным так возможно, из-за копирования Howlin'' Wolf). В середине 50х
    работал с группой Elmore James в Fort Worth, штат Texas и с Big Walter Horton
    в Чикаго в конце 50х.


    Там же записывался для лэйблов Chess, Bluebird. А начало было положено в 40е в
    Мемфисе, но эти записи не были выпущены. В 60х записался с J.B. Hutto and the
    Hawks для лэйбла Delmark. В начале 70х ездил в туры по Европе и Великобритании
    с группой Chicago Blues All Stars. Затем вернулся в Чикаго, выступал и записывался
    в течении двух лет, до того как 1 июля 1979 года был убит в семейной ссоре..


    На данном альбоме звучит сырой классический чикагский блюз. C составом участников
    записи даже в аннотации к диску(на обложке) небольшая путаница - написано:


    This LP was recorded in Chicago in 1973 and I used some of the greatest musicians
    available to make Lee feel comfortable and in a mood reality play. The musician
    were his old pal-a living legend-


    Sunnyland Slim on piano, (он тут точно есть - в Lee Jackson''s Boogy перед соло
    пианино мы слышим Ли Джексона кричащего - Sunnyland Slim! One more time, baby!)
    the greatest young harmonica artist playing today... Carey Bell, the driving Willie
    Williams on drums, and a fine young bass player known as Bombay. (c) Al Smith,
    Produсer and Friend.


    а чуть ниже - Organ - Bradfield (органа то тут вообще нет) Drums - Brian Grice,
    Bass - Philip Upchurch, Guitar - Gerald Sims


    Послушать можно тут http://vk.com/wall-13370755_3266'
