  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-06-01'
  text: 'Группа Roomful of Blues была создана в далеком 1967 году гитаристом Дюком Робиллардом и пианистом Элом Копли. С тех
    пор это имя стало своего рода брендом качества и эталоном американского джамп-блюза. Несмотря на более чем 45 лет с даты
    основания, группа по-прежнему выступает и периодически выпускает классные диски, продолжая радовать уже не одно поколение
    своих поклонников. Dance All Night - восьмой студийный альбом в дискографии знаменитой блюзовой формации, он был записан
    после довольно длительного перерыва (предыдущим был концертник 1987 года и затем совместная работа с Пэт Бенатар Ture
    Love в 1991 году).


    Очень приличный альбом от мастеров джамп-блюза, состоящий преимущественно из каверов (авторских треков только три - два
    написал харпер и вокалист Шугар Рэй Норсия, и заключительный инструментал принадлежит перу гитариста Криса Вачона). Однако
    каверы сделаны настолько мощно, что они звучат в классическом стиле Roomful of Blues. Альбом записан в Бостоне всего за
    три дня - с 13 по 15 сентября 1993 года. Диск очень "заводной" и полностью оправдывает свое название.


    Этим диском данная реинкарнация Roomful of Blues еще раз доказала, какой это сильный коллектив, что наглядно проявилось
    на следующем диске 1995 года, который стал одним из наиболее успешных в истории группы.'
