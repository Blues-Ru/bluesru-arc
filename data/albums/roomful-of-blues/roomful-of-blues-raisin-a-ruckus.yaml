- id: 1249
  author: Андрей Евдокимов
  mark: 7
  date: '2008-04-09'
  text: Кто сказал, что блюз по старым рецептам - это блюз без огонька и фантазии?
    40 лет спустя после основания группы, RoB выдают все тот же пламенный джамп-свинг-блюз,
    корни которого уходят еще глубже в историю. Шаловливая румба по-луизиански "Каждый
    пес получит свою кость" и ритмэндблюзовый марш "Я скольжу вниз в твоем списке
    приоритетов" наполнены юмором и оптимизмом в текстах, изобретательными аранжировками,
    великолепными короткими инструментальными соло и неотразимым драйвом. Для любителей
    драматического блюза есть классическая "Темная ночь" с шикарным гитарным соло
    на фоне мощных аккордов духовых. В нынешнем году группа приняла очередного вокалиста
    Дейва Ховарда, чьи певческие возможности поскромнее его предшествеников. Альбому
    это только на пользу. В предыдущем саунд был перенасыщенным – слишком много всего.
    В нынешнем он более прозрачный, и Ховард поет без тяжеловесного пафоса предыдущего
    вокалиста.
- id: 1828
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-06-01'
  text: 'Roomful of Blues has spent more that 35 years keeping jump blues, horn-driven
    swing, and house rockin'' jive alive." - Village Voice


    "Masterful combination of jumping, hard-edged blues and R&B...deeply rooted, horn-driven
    blend of swing, rock ‘n'' roll, jump, blues and soul...Great musicianship featuring
    a stellar horn section....utterly hip-shaking." - Boston Magazine


    "A tour de force of horn-fired blues. There isn''t a slack moment anywhere...slammin''
    jump blues, slow burners, fine grooves...it will be very difficult for any blues
    act to surpass the overall level of excellence displayed throught. Roomful is
    so tight and so right." - Billboard


    Третий альбом знаменитой группы для лэйбла Аллигатор был записан в 2007 году,
    вышел на CD в январе 2008 года и добрался до 6 места в топе блюзовых альбомов
    Биллборда. Восемь треков написано участниками группы, остальное - каверы. Продюсировал
    Крис Вачон. К сожалению, радость от выхода альбома была омрачена скоропостижной
    кончиной трубача группы Боба Эноса.


    Отличный альбом энергичного джамп-блюза в лучших традициях коллектива, рекомендую
    всем.'
