- id: 68
  author: Леонид Аускерн
  mark: null
  date: '2002-12-17'
  text: 'Long Live Blues! Ни джаз, ни рок-музыка не мыслимы без мощной блюзовой подпитки.
    Очередной побег этого крепкого вечнозеленого дерева представлен CD группы ROOMFUL
    OF BLUES. Численностью и набором инструментов этот коллектив напоминает BLOOD,
    SWEAT & TEARS: солирующая и бас-гитары, фортепьяно, ударные, вокалист, играющий
    также на губной гармони, и духова секция (труба, тромбон, саксофоны). Но этим
    сходство, пожалуй, и ограничивается. Если BST играл еще несколько прямолинейный
    джаз-рок, то в музыке состава из Новой Англии царит, в соответствии с названием
    группы, блюз. Судя по информации, приведенной на обложке CD и в буклете, ансамбль
    постоянно разъезжает с концертами, да и записывается немало. Альбом 1995 года
    "Turn It On! Turn It Up!" назван одним из блюзовых бестселлеров года в США. С
    фотографий на нас глядят люди, скажем так, зрелого возраста и явно не новички.
    "Под одной крышей" (так можно перевести название их шестого альбома) собрано почти
    полтора десятка очень разнообразных, но неизменно связанных с блюзовой традицией
    композиций.


    <p>Энергичные, жесткие номера ("She''ll Be So Fine") сменяютс почти классическим
    по структуре текста медленным блюзом ("Still Livin'' In Prison"). Духовая секция
    то превращает ансамбль в небольшой джазовый биг-бэнд, разражаясь каскадом отточенных
    хорусов, то скромно оттеняет гитарную или фортепьянную основную тему. Весьма привлекательно
    выглядят обе инструментальные пьесы - "We B 3" гитариста Криса Вэчона и "Q''s
    Blues" тромбониста Карла Кверфурта. Вокалист Шюгар Рэй Норсиа заставляет подчас
    вспоминать Клэптона и Брюса времен великого трио CREAM.


    <p>При этом в музыке белых блюзменов из ROOMFUL OF BLUES связь с "настоящим" черным
    блюзом не столь очевидна, как у первых представителей нового белого блюза в США
    и Англии (Корнер, Баттерфилд, Мэйолл). Здесь ощутимее привкус джаза и заметнее
    оглядка на потребности рынка. Тем, кто ищет корни блюза, лучше начинать, конечно,
    с черных гигантов вроде Мадди Уотерса или Би Би Кинга. Зато "Under One Roof" -
    прекрасный альбом дл пытливых адептов рока, желающих несколько раздвинуть для
    себя музыкальные горизонты, а также для "продвинутых" поклонников блюза, которым
    наверняка будет интересно "по нотке" разобрать все нюансы этой столь многоликой
    и столь неизменной музыки.'
- id: 1826
  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2011-06-01'
  text: "\"The swingingest boppingest outfit in the land\" -\tHouston Post\n\nС момента\
    \ основания группы Roomful of Blues в далеком 1967 году ее музыкальный коктейль\
    \ из свинга, рок-н-ролла, джамп-блюза, буги и соул был отмечен пятью номинациями\
    \ на Грэмми и множеством других наград, включая 7 блюзовых наград (в том числе\
    \ лучшей блюзовой группе года в 2005 году).\n\nUnder One Roof - последний альбом\
    \ легендарной группы, записанный с вокалистом Шугар Рэем Норсиа, и добравшийся\
    \ до 8 места в блюзовых чартах Биллборда.\n\nВ полном соответствии с названием,\
    \ на диске \"под одной крышей\" разместился широкий ряд блюзовых и около-блюзовых\
    \ жанров, объединенных мастерством исполнителей: плотный бит ритм секции, элегантные\
    \ гитарные соло Криса Вашона, мощные свингующие духовые - и на фоне этого эффектный\
    \ и глубокий соул-вокал Норсии. При этом я совершенно не согласен прохладной английской\
    \ рецензией Скотта Яноу из AMG - на мой взгляд, это один из лучших альбомов группы,\
    \ хорошо сбалансированный (проходных треков нет вообще!), отлично сыгранный (а\
    \ какие два роскошных инструментала!), прекрасно аранжированный.\n\nОтличный драйв,\
    \ свинг и джамп-блюз в лучших проявлениях - ноги сами пускаются впляс :-)\n\n\
    Альбом посвящен памяти Марка Пескателло"
