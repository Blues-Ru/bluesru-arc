  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-06-01'
  text: 'Hot Little Mama - третий альбом группы, записанный в Нью-Йорке 9 сентября
    и 7 октября 1980-го и изданный в 1981 году, где на смену начавшему сольную карьеру
    Дюку Робилларду пришел Ронни Эрл (тогда еще выступавший под полным именем - Ронни
    Хорват).


    Несмотря на то, что диск практически полностью состоит из каверов, звучит он вполне
    в традиции Румфулов - динамичная смесь блюза и джаза (ну разве что Эллингтоновский
    "Караван" слегка затянут). Поет тенор-саксофонист Грег Пикколо. Продюсировали
    сами румфульцы, и первое издание диска вышло на собственном лейбле Blue Flame
    Records /Ace (позднее диск был переиздан фирмой Varrick/Rounder). Пожалуй, один
    из лучших дисков коллектива.'
