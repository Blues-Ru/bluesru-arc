reviews:
- id: 857
  author: Андрей Евдокимов
  mark: 7
  date: '2005-09-10'
  text: 'Точное название: сидя это не выслушать! Непонятно лишь, для чего такой веселой
    подвижной музыке – обложка с лицами каменными, как у президентов США, выбитых
    в скале? Захватывающие танцевальные ритмы – не препона демонстрации виртуозности
    солистов и умелой изобретательности ансамблевых аранжировок. Попробуйте быть оригинальными
    в стиле, который уходит корнями в 40-е годы прошлого столетия. Конечно, джамп-блюз
    продолжал развиваться, а с началом ХХI века просто переживает второе рождение.
    И "Румфул..." всегда боролись за его современное звучание. Но как приятно среди
    насыщенного модерн-свинга получить, как передышку, два трека, вчистую стилизованных
    под 50-е. Группа избегает однообразия. Вокалист Майк ДюФресне демонстрирует баритон
    с шикарным диапазоном. Но 13 треков перенасыщенной музыкальной энергетики - это
    чуть-чуть через чур!.. Последняя песня – чуть попроще, музыкальный директор, гитарист
    Крис Вэчон, поет ее хриплым голосом шансонье. Близкий к "Ленинграду" и "Биллиз
    бэнд", этот трек убирает этих наших соотечественников туда, где им и место – в
    вульгарный неумелый кабак.'
- id: 1829
  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2011-06-01'
  text: 'A sheer joy...contagious, finger-popping, head-bopping grooves...the horns
    blast loud and proud...explosive and electrifying" - BLUES REVUE


    "A pulsating joy that captures the energy of the band''s jumpin'', swingin'' live
    performances. No way you can stay in your seat with grooves like this" - BOSTON
    HERALD


    Второй альбом группы для фирмы Аллигатор рекордз, добравшийся до 5 позиции в топе
    блюзовых альбомов Биллборда. Продюсировал гитарист группы Крис Вачон, который
    также поет на последнем треке диска.


    Альбом посвящен памяти ушедшего в мир иной тромбониста Порки Коэна, который выступал
    с Roomful of Blues с 1981 по 1987 год.


    Отличный диск для тех, кто любит качественный блюз с духовыми, свинг, и просто
    хорошую музыку.'
