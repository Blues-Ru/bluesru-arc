  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-06-01'
  text: 'После альбома Under One Roof 1997 года половина музыкантов Roomful of Blues покинула группу, включая вокалиста Sugar
    Ray Norcia. Однако это не остановило оставшихся участников коллектива Боба Эноса, Рича Латалля, Криса Вачона и Джона Росси
    - они поговорили с друзьями, полистали свои записные книжки, позвонили кому надо - и вскоре были найдены новые музыканты,
    а состав группы был укомплектован. Пришедшие на замену новые музыканты, включая вокалиста Мака Одома с его глубоким соул-вокалом,
    оказались более чем эквивалентной заменой. Мак Одом сочинил первый трек на альбоме, Крис Вачон выступил автором двух комплозиций,
    группа также записала две песни современников (Дойла Брэмхолла и братьев Кэйт), да плюс каверы из репертуара Дюка Эллинглона,
    Перси Мэйфилда, Мемфис Слима и др. Продюсировал Крис Вачон совместно с Филом Грини, который также руководил записью альбома.
    Аранжировки для духовых выполнены Ричем Латаллем и духовой секцией румфульцев.


    Альбом получился очень и очень приличный (10 место среди блюзовых альбомов Биллборда).'
