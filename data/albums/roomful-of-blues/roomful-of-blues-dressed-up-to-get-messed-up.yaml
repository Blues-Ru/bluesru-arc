- id: 1819
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-01'
  text: 'Dressed Up to get Messed Up - шестой альбом в дискографии знаменитой блюзовой формации. На данном альбоме, как пожалуй
    больше нигде, видно влияние на музыку группы тенор-саксофониста и певца Грега Пикколо, который также выступил в роли продюсера
    и композитора (он написал 7 треков из 10, на альбоме всего два кавера). Все остальные музыканты также не подкачали, а
    Ронни Эрл добавил свои узнаваемые соло.


    Из гостей группе помогли Ким Уилсон (вокал на одном треке), вокальная группа 14 Karat Soul и Рори МакЛеод (басовая скрипка
    на паре треков). Альбом очень заводной, рок-н-рольно свингующий. Пусть данный диск и не относится к лучшим дискам Румфулов,
    он тем не менее вполне приличный и наглядно иллюстрирует музыкальную концепцию коллектива в середине 80-х, ибо содержит
    80 процентов авторского материала.'
