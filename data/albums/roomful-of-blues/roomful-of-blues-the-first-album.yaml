  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-06-01'
  text: 'Группа Roomful of Blues была создана в далеком 1967 году и исходно играла жесткий чикагский блюз. Однако с течением
    времени музыканты добавили духовую секцию и начали включать в свою музыку элементы свинга, джаза и джамп-блюза. За долгую
    карьеру группа 5 раз номинировалась на Грэмми и завоевала множество других премий, включая семь блюзовых наград (в том
    числе лучшей блюзовой группе года в 2005).


    Официальная дискография замечательной американской группы Roomful of Blues началась в 1977 году с первого альбома, выпущенного
    под руководством Дюка Робилларда и Эла Копли на лейбле Island с помощью продюсера Дока Помуса. Альбом стилизован в ключе
    свинга и джаза 50-х и 60-х, однако включает в себя также блюз-роковые элементы.


    Диск в основном состоит из интерпретаций чужих песен, но сделаны они с хорошим вкусом, и исполнены мастерски. Дюк Робиллард
    поет и выдает гитарные соло, ритм-секция цементирует всю группу, духовые свингуют, саксофоны солируют - одним словом,
    мы имеем дело с образцом классического джамп-блюза от группы, которая впоследствии сама стала эталоном жанра.'
