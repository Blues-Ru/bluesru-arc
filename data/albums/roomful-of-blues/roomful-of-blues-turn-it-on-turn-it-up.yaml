  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-01'
  text: 'Группа Roomful of Blues была создана в далеком 1967 году гитаристом Дюком
    Робиллардом и пианистом Элом Копли. С тех пор это имя стало своего рода брендом
    качества и эталоном американского джамп-блюза. За эти годы коллектив получил множество
    наград, включая 5 номинаций на Грэмми и семь блюзовых премий, и в том числе премию
    блюзовой группе 2005 года.


    Джаз, блюз, свинг - и все это с хорошим драйвом под мощную рОковую ритм-секцию
    в сопровождении роскошных духовых. Одним словом, классические Румфулы в своем
    репертуаре - самый танцевальный из блюзовых коллективов. На альбоме присутствуют
    переработки классических песен Б.Б. Кинга, Каунта Бэйси, Перси Мэйфилда и других,
    а также оригинальные сочинения участников группы.


    Один из бестселлеров группы, занявший 5 место в топе блюзовых альбомов Биллборда.
    Не скажу, что это лучший альбом группы, и даже не один из лучших, но диск весьма
    и весьма приличный.


    Диск вышел в 1995 году и затем переиздавался в 1996 году в виде CD с мультимедийным
    контентом.'
