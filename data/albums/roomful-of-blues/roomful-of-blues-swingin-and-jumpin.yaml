  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2019-03-13'
  text: 'Группа Roomful of Blues была создана в далеком 1967 году и исходно играла жесткий чикагский блюз. Однако с течением
    времени музыканты добавили духовую секцию и начали включать в свою музыку элементы свинга, джаза и джамп-блюза. За долгую
    карьеру группа 5 раз номинировалась на Грэмми и завоевала множество других премий, включая семь блюзовых наград (в том
    числе лучшей блюзовой группе года в 2005).


    Официальная дискография Roomful of Blues началась в 1977 году с первого альбома, выпущенного под руководством Дюка Робилларда
    и Эла Копли на лейбле Island с помощью продюсера Дока Помуса. Альбом стилизован в ключе свинга и джаза 50-х и 60-х, однако
    включает в себя также блюз-роковые элементы.


    Данный сборник из раннего творчества Roomful of Blues был выпущен в 1999 году нью-йоркским лейблом 32 Blues. На нем представлены
    треки с первых дисков группы: треки 1, 3, 6, 7, 9 и 12 - с первого альбома коллектива, треки 2 и 11 - с альбома Big Joe
    Turner and Roomful of Blues "Blues Train" 1983 года, треки 4, 5, 8 и 10 - с альбома Eddie "Cleanhead" Vinson and Roomful
    of Blues 1982 года. Два последних альбома также издавались лейблом 32 Blues под именем Roomful of Blues "Two Classic Albums".'
