  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-01'
  text: 'Вот что написано на задней обложке этого альбома:


    "Коронованные лидеры стиля, Roomful of Blues гордо вступили в новое тысячелетие с одним из наиболее сильных и разнообразных
    в музыкальном отношении альбомов, записанных группой за долгую 30-летнюю карьеру."


    В дополнение к свингующему пропитанному духовыми блюзу, который принес им бесчисленное количество наград, похвал от критиков
    и завоевал множество преданных поклонников, на альбоме Watch You When You Go присутствуют также добавки фанка, классического
    соул, а также виртуозная игра Рика Латалля, одного из ведущих саксофонистов нашего поколения. Руководитель группы - талантливый
    гитарист Крис Вачон - отменно соединяет различные достоинства музыкантов группы в единое целое - прославивший группу мощный
    джамп-блюз, подкрепленный сильным вокалом Мэка Одома. На данном альбоме Roomful of Blues продолжает использовать основные
    блюзовые формы для создания новых выдающихся и уникальных музыкальных полотен. Авторского материала больше половины. Продюсировал
    и руководил записью альбома Крис Вачон.


    Тринадцатое место в блюзовом топе альбомов Биллборда.


    Не лучший альбом румфулцев, но вполне достойный.'
