- id: 1817
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-06-01'
  text: 'Новый альбом Roomful of Blues - это всегда праздник. Правда, в этот раз праздник оказался омрачен смертью одного
    из давних членов группы - трубача Боба Еноса, которому и посвящен данный диск. На место Еноса пришел Дуг Вулвертон, сменился
    и вокалист - место у микрофона занял Фил Пембертон, да плюс новый басист Джон Тернер. Трое новичков пополнили ряды Румфуловцев,
    которые под предводительством Криса Вачона и ветерана саксофониста Рича Латалля выдали очередной альбом заводного джамп-блюза
    на Alligator records.


    В этот раз весь альбом состоит из каверов, исполненных с мастерством и тактом настоящих профессионалов. Собственно, мастера
    такого уровня всегда выдают качественный продукт, хотя по сравнению с парой предыдущих дисков этот, на мой взгляд, послабее.
    Но даже не самый сильный диск Румфуловцев всегда гарантирует удовольствие любителям танцевального блюза со свингующими
    духовыми.


    Шестое место в топе блюзовых альбомов Биллборда.'
