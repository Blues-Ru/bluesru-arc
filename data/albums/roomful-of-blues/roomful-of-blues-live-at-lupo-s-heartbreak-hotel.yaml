- id: 1818
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-06-01'
  text: 'Первый официальный концертный альбом Roomful of Blues был записан за три вечера 17 - 19 апреля 1986 года во время
    концертов в отеле Lupo''s Heartbreak Hotel города Провиденс, Род Айленд. Группа под руководством Грега Пикколо и Ронни
    Эрла выдала традиционный энергичный сет заводного джамп-блюза с мощными духовыми. Музыканты также выступили и в роли продюсеров
    альбома.


    Исполняемый материал почти на девяносто процентов состоит из каверов классики блюза и свинга, поданной под фирменным румфуловским
    соусом. Музыканты демонстрируют хорошее владение инструментами и выдают ряд приличных соло. Альбом достойный, но не выдающийся,
    хотя любителям джамп-блюза, думаю, придется по душе. А с учетом того, что после данного диска у группы был заметный перерыв
    в выпуске альбомов, связанный в немалой степени с уходом из коллектива на сольные хлеба Ронни Эрла и Грега Пикколо (который
    впоследствии вернется к старым коллегам), диск знаменует своего рода конец определенной эпохи.'
