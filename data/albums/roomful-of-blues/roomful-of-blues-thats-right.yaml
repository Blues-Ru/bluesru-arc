- id: 119
  author: Алексей Калачев
  mark: 6
  date: '2003-05-29'
  text: Если считать терпимыми 3-4 джазовых и свинговых номера, диск вышел удачным. Даже хорошим. Группа опять, как и в 1998,
    на 3/4 обновила состав и не только осталась на устойчивом плаву, но и шагнула далеко вперед в сравнении с предыдущим альбомом.
    Отменный новый певец, все те же сумасшедшие медные.
- id: 1830
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-01'
  text: '"Crackling with energy, Roomful swagger, swan and most of all, swing. Let the party begin!" - CHICAGO SUN-TIMES


    "Fourteen-in-the-pocket tunes, powered by a new rhythm section and Roomful''s legendary horn section. From elegant swing
    to hard boogie, Roomful Of Blues has tracked another winner" - BILLBOARD


    Одна из самых самобытных и интересных блюзовых групп последних более чем 45 (!) лет, которая, увы, у нас крайне мало известна
    - Roomful of Blues, чей уникальный коктейль танцевального джамп-блюза под свингующую духовую секцию не даст устоять на
    месте никому! Они лет на 15 - 20 опередили время, играя блюзовый свинг намного раньше признанных сегодня корифеев этого
    жанра (например, Брайана Зетцера с его оркестром). Наиболее известные музыканты, вышедшие из этой группы - это гитаристы
    Дюк Робиллард и Ронни Эрл.


    Записанный для фирмы Аллигатор рекордз (до этого группа сотрудничала с другими лейблами), данный альбом добрался до 6
    места в блюзовом топе Биллборда и был номинирован на Грэмми.'
