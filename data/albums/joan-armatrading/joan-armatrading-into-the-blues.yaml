- id: 1314
  author: Андрей Евдокимов
  mark: 8
  date: '2008-07-19'
  text: 'Джоан Арматрейдинг (Joan Armatrading) родилась на маленьком острове Сейнт-Киттс в большой семье (мама, папа, семеро
    детей). Когда ей было восемь, семейство переехало в Лондон, жили на папину зарплату, ютились в одной комнате без отопления.
    Воспоминания легли в основу песни Mama Papa, и никаких горьких упреков судьбе и Всевышнему. Рефрен: "Нужно пользоваться
    с наибольшим толком теми способностями возможностями, которые посылает тебе Бог".


    Джоан многого достигла тем, что отпустил ей Творец. Темнокожая девочка-иммигрант оказалась талантливым анлийской поэтессой
    и композитором-мелодистом. А еще певицей и гитаристкой. Не став мега-звездой, создала клан преданных поклонников. А признанием
    ее достижений в области интеллектуального балладного поп-рока служат три премии Grammy.


    Через 35 лет после дебюта, свой 19й по счету альбом она решила сделать "по-настоящему блюзовым". Воплощение идеи тоже
    выдвигалось на Grammy – в категории "Лучший альбом современного блюза в 2007 году", но до премии не дотянуло. Blues Awards
    этот альбом и не рассматривали даже как номинанта. Что понятно: с формальной точки зрения песни альбома слишком далеки
    от блюзовых канонов как по композиции, так и по манере исполнения.


    Но все-таки, и любителям блюза он может быть интересен. Арматрейдинг не мимикрирует под блюз. Она искренне исполняет песни,
    которые для нее являются блюзом. Не обращая внимания на последовательность гармоний, структуру запев-припев и прочие "формальности".


    В результате раскованный взгляд Арматрейдинг на блюз представляется очень свежим. Пусть в двух песнях весь текст сводится
    к повторению заклинаний "В глубине души я люблю тебя", или "Мой малыш ушел" - под ритм тамтамов. Но остальные песни заставляют
    позавидовать: не часто тексты современных блюзов столь поэтичны и выразительны. Арматрейдинг играет замечательные, неторопливые,
    нестандартные и очень выразительные гитарные соло. Это необычный взгляд на блюз, в звучании проглядывают аллюзии на Хедрикса,
    барабаны Бонэма и прочую арт-рок-хеви-сайкоделику конца 60-х… Но есть и замечательно блюзовые рок-н-роллы под Чака Берри,
    и даже неподдельная блюзовая тоска-кручина.


    Play the Blues – "Сыграй мне блюз, и я разденусь для тебя" - припев не может не греть сердце блюзмена, но звучание слишком
    близко к нейтральному r''n''b. Заглавная Into the Blues тоже вроде бы и не плоха, но припев в ней слишком выдает эстрадно-балладное
    прошлое певицы. А когда зазвучит Liza - пойдет чикагски-тяжелый риф, почти I''m A Man или Mannish Boy, да еще со старинным
    блюзовым заклинанием Let The Good Times Roll - начинается блюз. Baby Blue Eyes – самая милая песня альбома. Фолк-баллада
    под три мандолины, с хлипкой губной гармоникой, по-дилановски напоминающей еще одно название "карманного органа": jew
    harp. Песня трогательно лирична ("Любят за недостатки, но если при недостатках есть еще и голубые глаза, и ангельская
    улыбка, то…"), торжественно возвышенна, с прекрасной невымученной аранжировкой и необычной мелодией… Шуточная заводная
    песенка There Ain''t a Girl Alive (Who Likes to Look in the Mirror Like You Do) балует под занавес шикарным и далеко нешутийным
    гитарным соло. Empty Highway - тема странствий по дороге в никуда – старинный блюзовый сюжет. С музыкальной точки зрения,
    подается сюжет в манере, близкой модерн-блюзу, но пронзительно-тоскливое лаконичное гитарное соло и общая сумрачная атмосфера
    - абсолютно не в ключе комфорта модерн-блюза. И завершающая восьмиминутная Somethings Gotta Blow – ощущение неминуемой
    катастрофы, взрыва создается безысходным напряжением музыки. И тема какая-то негламурная и немодная среди офисных программеров:
    слишком тяжелая работа за слишком маленькие деньги. Арматрейдинг подает ее с пафосом Working Class Hero, делом доказывая,
    что как дула против ветра, так и будет дуть всегда, когда сочтет нужным.


    Ну и немалым подтверждением множественности талантов удивительной бард-рок-певицы служит множество ее ролей в работе над
    этим альбомом. Она не только сочинила и аранжировала все песни. Она спела все вокальные партии - на три голоса в разных
    диапазонах и разными тембрами. Она сыграла на всех инструментах (кроме ударных): на гитаре, мандолине, рояле, электрооргане
    и синтезаторе, губной гармонике и бас-гитаре... Выгнав техперсонал из студии, она была звукорежисером на записи, продюсером
    на сведении и продюсером выпуска альбома. Все сама!'
- id: 2060
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2012-08-07'
  text: 'Это, конечно, не традиционный блюза, а, скорее, приблюзованная версия традиционного авторского рока Джоан Арматрейдинг.


    Тем не менее альбом добрался до первого места в топе блюзовых альбомов Биллборда - хотя, на мой взгляд, это достижение
    из категории "за выслугу лет". Однако Джоан уже давно может себе позволить записать ту музыку, которую считает нужным,
    и уже за одно это она достойна уважения.'
