  date: '2009-08-06'
  text: '<img src="http://image.allmusic.com/00/amg/cov200/drg000/g036/g03663wr7xh.jpg">
    Если вам по душе музыка, сделанная в Соединенных Штатах Америки, основанная на
    блюзе и соул-музыке – то этот альбом то, что вам нужно. Не смотря на свой преклонный
    возраст, музыка, исполняемая Lavelle звучит очень молодо и свежо. Да и ее вокал
    – это совсем не голос пожилой женщины. Проводя параллели с более молодыми ее коллегами
    я могу сказать, что эта запись в духе альбомов Eric Bibb, Keb Mo, Ruthie Foster
    и других подобных музыкантов.


    Не смотря на эклектичность материала ("Livin For The City", "At Last", "Today
    I Started Lovin'' You") и самой музыки (блюз, соул, акустика, спиричуэлс), альбом
    звучит очень цельно от начала до конца – что уже практически необходимое условие
    для того, чтобы он был в коллекции.


    Отдельно нужно обратить внимание на то, что в записи альбома принимали участие
    все сливки лейбла "Antone''s": Derek O''Brien, Steve James, Guy Forsyth, Roscoe
    Beck, George Rains, Mark "Kaz" Kazanoff и др.'
