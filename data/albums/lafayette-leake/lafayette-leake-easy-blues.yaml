- id: 1407
  author: Константин Колесниченко
  mark: 10
  date: '2009-01-09'
  text: 'Lafayette Leake - это, наверное, одна из самых важных фигур в истории лейбла "Чесс". Ведь историю этого лейбла делали
    не только звезды вроде Мадди, Литтл Уолтера, Хаулин Вульфа, Чака Берри и пр. Фортепианную игру Lafayette можно услышать
    на огромном количестве записей этого лейбла. На "Чесс" он попал благодаря Вилли Диксону, с которым играл в Big Three Trio
    и до конца существования компании был ее сессионным пианистом (он обладал редким для блюзмена умением - спокойно читал
    музыку по нотам). Для меня игра Lafayette Leake на классических записях этого лейбла зачастую не менее интересна, чем
    работа солиста.


    У Lafayette Leake очень мало сольных альбомов, они уже все out of print. У меня есть только этот, хотя вроде бы есть еще
    два. "Easy Blues" - это редкая возможность услышать блестящую, очень легкую и как бы парящую игру Lafayette на первом
    плане блюз бэнда. Поддерживающий ансамбль - это тоже ветераны жанра: John LittleJohn - guitar, Nick Holt - bass, Fred
    Below - drums.


    Замечательный альбом, если бы мне нужно было составить список блюзовых записей, которые я бы взял с собой на необитаемый
    остров - этот альбом был бы в этом списке.'
- id: 1544
  author: Алексей Калачев
  mark: 6
  date: '2009-05-20'
  text: 'Три альбома, три чернокожих пианиста-классика, которые должны быть одинаково близки сердцу поклонников чикагского
    фортепиано. Их объединяет: место создания (Франция), первоклассные музыкальный уровень и составы музыкантов, отменный
    звук и фирма-создатель "Black & Blue". Слим играет и поет сам, без сопровождения, Мэбон и Лик с типичными чикагскими ансамблями.'
