- id: 1743
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-20'
  text: 'Medicine - седьмой сольник мастера луизианского блюза, записанный им для лейбла Telarc после довольно долгого перерыва,
    представляет собой своего рода блюзовое лекарство для поклонников Тэба Бенуа. Альбом создан в творческом партнерстве со
    старым другом и композитором Андерсом Осборном, который не только выступил соавтором 7 треков альбома, но и сыграл бОльшую
    часть партий ритм-гитары (используя при этом знаменитую гитару "Лусиль" Б.Б. Кинга), а также поучаствовал в продюсировании
    диска.


    Среди сопрoвождающих высокопрофессиональных музыкантов выделяется скрипка Майкла Дусе, треки с которым, на мой взгляд,
    наиболее удачные на диске. Большинство материала было записано вживую с первого дубля - возможно, это объясняет относительно
    сырое и жесткое звучание группы. В музыкальном отношении Бенуа предлагает слушателю коктейль из блюза, рока, соул и креольской
    музыки, традиционный для его свамп-блюза, но в этот раз музыка вышла чуть более жесткой - с экскурсами в блюз-рок. На
    мой взгляд, при микшировании слегка провалены клавиши, а гитары, наоборот, череcчур выдвинуты вперед, но это уже дело
    вкуса.


    По мнению ряда критиков, альбом получился очень удачным и едва ли не лучшим у музыканта. Как бы то ни было, он в любом
    случае более чем достоин внимания любителей современного блюза.'
