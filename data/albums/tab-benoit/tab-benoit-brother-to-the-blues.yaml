- id: 1396
  author: Андрей Евдокимов
  mark: 6
  date: '2008-12-29'
  text: 'За 15 лет, прошедшие после выпуска его дебютного альбома, Бенуа приобрел репутацию виртуозного блюзового гитариста,
    с хорошим вкусом, но вполне предсказуемого. На этот раз он удивил, выпустив альбом кантри-музыки. Но этот альбом понравится
    поклонникам и блюза и кантри, а свое мнение о родственных отношениях этих жанров он вынес в его заглавие. Голос Бенуа
    наконец-то обрел индивидуальность, а долгие гитарные соло он поменял на более цельное представление песни, где сюжет и
    настроение важнее эффектных пассажей. Настоящими перлами альбома являются меланхоличная баллада Somehow и прекрасный медленный
    вальс I Heard Some Whistle Blow под скрипку и гавайскую гитару. Но уместно расставленные задорные песенку не дадут загрустить,
    а завершает альбом развеселый луизианский ту-степ, который называется, разумеется, наоборот: Can''t Do One More Two Step.
    Скрипка Waylon Thibodeaux выписывает такие музыкальные кренделя, что без улыбки это слушать невозможно.'
