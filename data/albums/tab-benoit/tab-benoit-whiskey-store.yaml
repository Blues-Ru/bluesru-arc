  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Совместный труд двух популярных нынче блюзменов. Оба успели отметиться в этом году сольниками - пластинки Thackery
    "You Got It" и Benoit "Wetlands" вышли также на Telarc. Теперь гитаристы решили поработать в связке. Времени на создание
    новых песен у них, судя по всему, не было. Поэтому на "Whiskey Store" всего два блюза - "Nice And Worm" и "Bone Pickin''"
    - написаны Benoit, и только один, да и тот инструментальный - "Freddy''s Combo" сочинен Thackery. Остальные произведения
    принадлежат перу других авторов. В первую очередь это "The Last Time" из репертуара Rolling Stones, исполненная очень
    близко к оригиналу. "Unknown Legend" написана Neil Young, автор "Leopard - Skin Pill - Box Hat" - Bob Dylan, а "Strange
    Thing Happen" в свое время звучала в исполнении Percy Mayfield.


    Говоря об этой пластинке, невозможно не упомянуть прочих участников сессии. Компанию Jimmy Thackery и Tab Benoit составили
    известнейший исполнитель на губной гармонике Charlie Musselwhite, а также бас-гитарист Tommy Shannon и барабанщик Chris
    Layton, ранее сопровождавшие самого Stevie Ray Vaughan, и известные как Double Trouble. Кроме них на альбоме поработал
    пианист и органист Reese Wynans, ранее игравший с Allman Brothers Band, Buddy Guy и, конечно, с уже упомянутым Stevie
    Ray Vaughan.'
