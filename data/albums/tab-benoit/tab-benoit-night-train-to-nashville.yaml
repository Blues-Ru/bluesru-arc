  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-23'
  text: 'Гитарист, певец и композитор из Нового Орлеана получил в 2006 году сразу две престижные блюзовые премии: премию Б.Б.
    Кинга артисту года и лучшему современному исполнителю 2006 года. Таб Бенуа записал данный концерт 9 мая 2007 года с помощью
    своего обычного сопровождающего состава Luisiana LeRoux и ряда приглашенных звезд традиционной музыки (блюза и кантри):
    вокалиста и харпера Jimmy Hall, гитариста и вокалиста Jim Lauderdale, харпера и аккордеониста Johnny Sansone, скрипача
    Waylon Thibodeaux (на этом концерте он играет на стиральной доске), а также вокалиста и харпера Kim Wilson.


    В результате получился довольно разнородный продукт: есть треки, где все идет достаточно гладко (например, мощный Night
    Train или изумительная Stackolina), а есть и такие, где музыканты не всегда понимают, кто из них должен сейчас солировать,
    не попадают в тональность и тп. Довольно типичная вещь для живого концерта с приглашенными звездами, тем более что играются
    не традиционные стандарты, а почти на 80 процентов музыка самого Бенуа. В целом - вполне прилично, но местами сыровато
    и затянуто. Тем не менее второе место в блюзовом топе Биллборда.'
