  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-23'
  text: 'Tab Benoit, Debbie Davies, Kenny Neal - Homesick for the Road - 1999


    Совместная работа от трех относительно молодых, но уже хорошо зарекомендовавших себя звезд блюза, которые в последующие
    годы только укрепили свою репутацию. Аккомпанирует "золотой" состав the Broadcasters с кудесником Хаммонда В3 Брюсом Кацем.
    Репертуар состоит как из собственного материала участников, так и из каверов блюзовой классики, причем на 7 треке поет
    и играет на гармонике и сам его автор - знаменитый Рафул Нил (отец Кенни Нила). Диск качественного традиционного блюза
    с современным звучанием, инструменты прописаны четко и мягко, сыграно все профессионально. Но чего-то нехватает для того,
    чтобы действительно хорошая пластинка превратилась в пластинку отличную - видимо, у музыкантов не было времени хорошенько
    порепетировать и сыграться. Тем не менее пластинка однозначно рекомендуется к прослушиванию не только поклонникам трех
    звезд, но и всем любителям качественного блюза :-)'
