- id: 749
  author: Александр Панин
  mark: 6
  date: '2005-07-01'
  text: Еще один неизвестный блюзмен и его чикагские записи шестидесятых. На диске сборная солянка разных лет - акустика перемежается
    с электричеством, постоянно добавляются и исчезают другие инструменты. Качество записи местами довольно среднее. Много
    своего материала, хотя выдающимся его назвать трудно, это просто приличный чикагский и дельта-блюз.
