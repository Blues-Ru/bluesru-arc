- id: 1569
  author: Константин Колесниченко
  mark: 8
  date: '2009-08-06'
  text: 'Мне сложно отнести Тедди Моргана к какому-либо из блюзовых стилей – тут намешано
    всего понемногу: современный луизианский блюза в стиле Tab Benoit, блюз-рок, свинг.
    Но весь материал подобран очень разумно и со знанием дела, что удивительно для
    достаточно молодого музыканта. То, что Тедди Морган - молодой блюзмен, понятно
    не только потому, что на обложке изображен розовощекий парень, так же это чувствуется
    в песнях, которые он написал для этого альбома и в его игре на гитаре. Но к счастью,
    Морган не обделен музыкальным вкусом, как некоторые его ровесники в этой музыке.
    Все сыграно очень профессионально, музыка очень разнообразная, думаю, что лейбл
    "Antone''s" не стал бы записывать бездарного музыканта. Может и не самая блюзовая
    запись в каталоге этой техасской фирмы, но безусловно хорошая.'
