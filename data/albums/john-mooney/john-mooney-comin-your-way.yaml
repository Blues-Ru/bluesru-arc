  author: Дмитрий Казанцев
  mark: 9
  date: '2007-08-26'
  text: 'Это первый альбом Джона, он исполняет акустический блюз и дикси-блюз. Муни
    поет, пишет песни, играет пальцами и слайдом на железной гитаре. Он также играет
    на мандолине, стиральной доске и конгах. Написано, что стучит ногой! Ему помогают:
    контрабасист, ударник, пианист и два гармошечника. В одной песне играют трое духовиков
    из группы ROOMFUL OF BLUES.


    На диске 13 песен, 4 - традиция, 1 - Лерой Карр, 1 - Артут Крадап, остальные Джон
    написал сам. Он хорошо звучит с группой, но и один с гитарой и ногой тоже - PONY
    BLUES (Son House & traditional - просто отлично!) Хочется отдельно отметить качество
    записи и полное отсутствие всякого занудства на диске. Все звучит очень душевно
    и аутентично для 79 года. Акустика в таком виде просто прекрасна!


    Давно не слушал такого хорошего и нового (для меня) блюза.'
