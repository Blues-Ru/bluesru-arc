- id: 834
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-24'
  text: Симпатичный и разнообразный фолк-кантри-блюз. На альбоме 13 песен, 7 написал
    Пол, а еще 6 - не самые известные каверы Лэдбелли, МакТелла, Фуллера, Паттона
    и Карра. Пол Джеремия - отличный певец и превосходный гитарист, ему помогают в
    разных песнях басист, драммер, пианист, скрипач и виолончелист. Все темы разные
    и в разных составах - это делает диск еще более интересным. Чего здесь не хватает,
    так это импровизации - маловато инструментально играют музыканты. Но зато песни
    до чего хороши!
