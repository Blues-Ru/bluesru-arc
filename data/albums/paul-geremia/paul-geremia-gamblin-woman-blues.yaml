- id: 943
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-12-30'
  text: 'Первый альбом Пола вышел еще в 1968 году. Потом был долгий перерыв и два альбома в 1982 и 1986 годах на Flying Fish
    Records. Затем снова пауза, и вот этот диск отметил собой третью попытку Пола сделать нормальную карьеру с постоянными
    записями.


    Джеремия - виртуоз игры на различных гитарах, а также он прекрасный певец. Его музыка - это фолк-блюз, блюз и фолк. Он
    пишет сам, но играет и песни старых мастеров. На этом диске Пол написал 4 песни, остальные 8 - это вещи Блайнд Лемона
    Джефферсона, Барбекью Боба, Блайнд Уилли МакТелла и Скипа Джеймса. Полу помогает небольшая акустическая группа, а некоторые
    песни записаны просто соло.


    Великолепная фолк-музыка и исполнение. Душевно и гипер-профессионально!'
