- id: 907
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-11-27'
  text: 'Два альбома на одном КД, которые Пол записал для независимой фирмы Flying Fish в 1982 и 1986 годах. Джеремиа - белый,
    акустический гитарист-виртуоз. Он также интересно поет и пишет отличные песни. Музыка Пола - это акустический фолк-блюз,
    с интересными гармониями и аккордами. Его звук всегда на высоте, как и игра музыкантов, которые помогают ему. На этих
    дисках с Полом играет контрабасист, ударник, пианист и гармонист - звучит богато и сочно. Кроме собственных блюзов, Джеремиа
    также исполняет вещи Лэдбелли, Блайнд Лемона, Уилли МакТелла и традицию.


    Очень хорошая музыка, понравится блюзменам и любителям фолка одновременно.'
