  date: '2006-01-01'
  text: На этом диске Пола записаны 18 песен, но только 4 написал он сам. Другие 14 - это традиционные фолк-кантри-блюзы +
    песни Чарли Пэттона, Блайнд Лемона Джефферсона, Тампа Рэда, Джона Херта, Биг Билла Брунзи и т.д. Пол играет еще интереснее,
    чем в 80-х, его вокал прекрасен. Многие песни здесь исполнены соло, но слушаются они очень богато и наполнено. Ему также,
    как и обычно, помогает небольшая акустическая группа; все вместе они создают настоящий праздник фолк-музыки.
