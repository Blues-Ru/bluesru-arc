  author: Дмитрий Казанцев
  mark: 10
  date: '2005-08-09'
  text: 'Красота да и только! Этот альбом записан в далеком 1971 году. Ларри Джонсон поет и играет на гитаре, Джон Хаммонд
    играет на гармошке, стил-гитаре и поет дуэтом с Ларри в одном треке. Прекрасный акустический фолк-блюз, Ларри - волшебный
    певец, а Джон классно аккомпанирует. На диске 11 песен, длится он 45 минут. Из хитов тут есть: "One Room Country Shack",
    "Walking Blues", "Nobody''s Business", "Tell Me Mama".


    Редкий и очень нужный диск.'
