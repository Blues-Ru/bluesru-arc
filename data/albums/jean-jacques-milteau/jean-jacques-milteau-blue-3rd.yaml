- id: 1065
  author: Константин Колесниченко
  mark: 10
  date: '2007-05-08'
  text: 'Один из лучших альбомов Мильто, он творит что-то невероятное на гармонике,
    с самого первого номера! Материал подобран так, что диск абсолютно не утомляет,
    его можно слушать до бесконечности - номера с вокалом перемежаются с инструменталами.
    Как всегда, жанры разнообразны: блюз, фанк, соул, джаз.С Жан Жаком играет его
    ансамбль и гости-вокалисты, он не поет. Но, что это за гости - Gil Scott Heron,
    N''Dambi, Terry Callier. Также с Мильто играет Howard Johnson - потрясающий черный
    духовик, который берется то за тубу, то за баритон саксофон. Молодец, отличный
    диск! Слабых мест на диске нет.'
