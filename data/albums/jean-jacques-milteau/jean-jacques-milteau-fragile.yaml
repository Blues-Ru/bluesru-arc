- id: 1064
  author: Константин Колесниченко
  mark: 9
  date: '2007-05-08'
  text: 'Оличительной чертой Жан Жака Мильто, помимо виртуозной техники в игре на гармонике, всегда было его умение поразительно
    талантливо смешивать жанры музыки, хотя большей частью он играет блюз. Так и на этом, последнем альбоме Мильто - блюз,
    фанк, соул, латина, джаз, народные песни и даже "Интернационал". С Мильто играет его постоянный состав плюс две отличные
    вокалистки Demi Evans и Michelle Shocked. Особенно хочется выделить известнейшую песню Джеймса Брауна "THIS IS A MAN''S
    WORLD" в исполнении Мишель, латиноамериканский джаз "Coyoacan" и две композиции, на которых поет Деми: соул "YOU''RE NO
    GOOD" и классный блюз "JACK THE MAN". Как видно из названия альбома, музыка хрупка, прозрачна и искуссно сделана. Отличный,
    разнообразный и мелодичный альбом!'
