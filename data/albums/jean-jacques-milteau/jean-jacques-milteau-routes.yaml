  author: Константин Колесниченко
  mark: 8
  date: '2007-05-08'
  text: 'Альбом 1995 года "Routes" уже выдержан в том привычном для Мильто ключе -
    легкие, комфортные композиции с прозрачно-звучащей акустической гармоникой, хотя
    некоторые вещи выдрежаны в довольно жестком блюз-роковом ключе. Материал альбома,
    ориентирован на Америку,так же аранжированы композиции, но все-таки чувствуется
    некая французская изысканность и утонченность, но она не мешает, Мильто не перегибает
    палку. Хочу выделить следующие композиции: "Blue hop" с басовой гармоникой, ведущей
    свою линию, милый вальс "Marcelle & marcel", расслабленную "Randy and Ry", приджазованный
    блюз "Hometown", виртуозно-быстро сыгранную ирландскую "The sailor & the maid",
    и венец всего альбома - балаганно-веселый шансон "Bordighera". Хороший альбом,
    пожалуй, если собирать его альбомы, коллекция должна начинаться с этого и заканчиваться
    более поздними.'
