- id: 1066
  author: Константин Колесниченко
  mark: 8
  date: '2007-05-08'
  text: 'Один из самых лиричных и мелодичных альбомов Мильто. На диске нет вокальных композиций, только инструменталы. Но
    Мильто и не нужны певцы - он отлично выражает мысли, настроение и идеи на гармонике. Альбом выполнен в традиционном, для
    Мильто, жанровом формате: блюз, блюз-рок, джаз и регги. На одной из композиций на хроматической гармонике ему подыгрывает
    другой известный французский харпер Oliver Ker Ourio. Это не музыка для гармоники, это просто отличная музыка с солирующим
    харпом. В каком-то смысле Мильто уникальный музыкант. Этот альбом был удостоей премии Django d''Or.'
