- id: 1063
  author: Константин Колесниченко
  mark: 10
  date: '2007-05-08'
  text: 'Жан Жак Мильто один из тех музыкантов, у которых потрясающий музыкальный вкус. К тому же, он виртуозно играет на
    гармонике, мне очень нравится его подход к инструменту - он очень редко использует перегруз, у него очень сочный акустический
    звук. Мильто очень мелодично играет, пожалуй, для меня он вообще самый большой мелодист в игре на гармонике. Альбом 2003
    "Memphis" года нельзя назвать блюзовым, хотя на 60-70 процентов творчество Мильто - это именно блюз. Это соул, соул-блюз
    и инструментальный соул. Для записи этого диска Жан Жак в 2001 году поехал как раз в Мемфис и записал его со сливками
    среди музыкантов этого города (своих музыкантов, в частности, отличного гитариста Manu Galvin, он взял с собой). Среди
    гостей есть такие знаменитости как: Mighty Mo Rodgers, Little Milton, и Mighty Sam McClain. Мильто не поет, но это отлично
    делают за него вышеназванные гости. А какие потрясающие бэк-вокал и духовая секция на альбоме! На диске сложно выделить
    лучшие песни, все они, как на подбор, отличные. Ставлю этому альбому 5!'
