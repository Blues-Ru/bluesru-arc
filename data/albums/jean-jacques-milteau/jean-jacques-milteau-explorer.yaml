- id: 1069
  author: Константин Колесниченко
  mark: 6
  date: '2007-05-08'
  text: 'Ранний альбом Мильто, но тут есть уже все те приемы, идеи, которые получат
    развитие в следующих альбомах Жан Жака. Но все же он получился более традиционный
    и менее интересный, чем поздние альбомы мастера. Некоторые композиции аранжированы,
    все еще с налетом 80-х, и звук у гармоники Мильто какой-то плоский, иногда ужасно
    звучат клавиши. Жанрово это: блюз, блюз-рок и smooth-jazz. Блюзовые вещи звучат
    все же лучше. Выделяю: "Freddie", "Tin Bisciut Boy", "Blues Harp Saga", на которой
    Мильто потрясающе похоже изображает поезд на гармонике в стиле Sonny Terry.Вокалом
    украшена всего одна композиция - "I Can''t Hold Out". Этому альбому не хватает
    вкуса и стиля более поздних работ, но виртуозная игра уже имеется.'
