- id: 862
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-09-14'
  text: 'На этом диске гитарист Харви использует вокалистов (Ричард Мартин и Марк Скайер - он же ритм-гитарист); 5 песен из
    8 - вокальные. Музыка в стиле тяжелого блюз-рока, но элементы фанка и джаз-рока тоже очень сильны. Мэндел все дальше разрабатывает
    свой гитарный стиль, используя разные звуки и техники (тэппинг, например). Можно сказать точно, что вокал явно мешает
    в некоторых вещах - они не состоялись как песни. Хард-роковый звук тоже не к лицу, он замазывает яркость соло-гитары и
    создает атмосферу тяжести и отсутствие грува в почти половине вещей.


    Тут есть что слушать и чем наслаждаться, но это не лучший диск Харви, в любом случае.'
