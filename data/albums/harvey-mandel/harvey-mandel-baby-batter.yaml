  author: Дмитрий Казанцев
  mark: 8
  date: '2005-09-14'
  text: 'Харви много где играл, но главные достижения - это Canned Heat и John Mayall Band. Его игра на гитаре (солирование)
    - смесь блюза, джаза и чего-то очень своего личного, что делает его интересным гитаристом.


    На этом альбоме 1971 года Харви играет блюз-рок и фанк с симпатичным джаз-роковым "акцентом". Все вещи инструментальные
    (написаны самим Мэнделом), с богатыми аранжировками (клавиши, струнные, перкуссия) и все в хорошем груве. "El Stinger"
    - очень в духе Джими Хендрикса, но Харви играет лучше и интереснее.


    Этот диск считается лучшим у Мэндела. На басу играет еще один коллега Джона Мэйолла - Лэрри Тэйлор.'
