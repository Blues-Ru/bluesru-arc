  author: Александр Панин
  mark: 9
  date: '2006-10-23'
  text: Вот так просто и незатейливо называется этот диск Билли Гудмена. На нем ряд каверов блюзовых вещей двадцатых-тридцатых
    годов, среди которых четыре песни Роберта Джонсона, известнейшие старые композиции Jitterbug Swing, Pallet On The Floor,
    Easy Rider Blues, Hesitation Blues, Keep Your Lamp Trimmed And Burning и другие, а также пара инструменталов собственного
    сочинения Билли. Трек-лист просто замечательный! Песни записаны в разное время, как правило, с минимумом технических приспособлений,
    дома в студии, а то и просто в спальне. В основном это сольный диск, только на нескольких треках наложена еще одна гитара
    и губная гармошка. Не все вещи сделаны в акустике, есть и электрические фрагменты. Билли довольно хорошо владеет фингерпикингом
    и слайдом, но по вокалу и подаче он скорее не блюзмен, а фолк- и рутс-роковый исполнитель. Пожалуй, музыкально Гудмен
    похож на Йорму Кауконена (они даже играли вместе одно время). Билли родился в Нью-Йорке, но уже давно живет в немецком
    Гейдельберге, где организовал собственный лейбл Goodman Records, на котором и вышел этот очень приличный диск.
