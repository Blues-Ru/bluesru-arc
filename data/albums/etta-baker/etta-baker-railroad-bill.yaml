- id: 778
  author: Андрей Евдокимов
  mark: 8
  date: '2005-08-05'
  text: У альбома два адреса. Во-первых, это небольшой круг знатоков корневого блюза; а именно тех, кто особо ценит не знаменитый
    бесшабашный Дельта-блюз, а утонченно-сдержанный виртуозный Пидмонтский стиль. Во-вторых, это все, кто жаждет свидетельства
    возможности долгой плодотворной творческой жизни. Альбом восхитителен в обоих отношениях. Сольные гитарные пьесы на перекрестье
    блюза и рэг-тайма Бейкер наполняет лирикой и юмором, обращается к классике жанра и сочиняет сама. Она играет с изящность,
    свойственно пидмонтским классикам, в чистой пальцевой манере - безошибочно и обаятельно. Ее первые записи появились еще
    в 60-х годах. Однако профессиональным музыкантом она стала, лишь выйдя на пенсию. А до этого более 40 лет отработала на
    местной фабрике, вырастила 9 детей и не считанное количество внуков, всю жизнь прожив в одном городе. Как эти довольно
    сложные гитарные пассажи свидетельствуют, жизнь ее состоялась, была счастливой и наполненной. Это второй ее студийный
    альбом, который Бейкер записала в 1999 г., в возрасте 87 лет, когда делила свой досуг между гитарой для домашних и уходом
    за любимым садом. Среди почитателей ее подлинно народного таланта - Тадж Махал. Он выступил продюсером записи и под его
    патронажем подготовлено новое переиздание.
