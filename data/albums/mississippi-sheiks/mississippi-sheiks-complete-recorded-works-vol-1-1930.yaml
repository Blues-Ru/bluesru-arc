  date: '2002-10-26'
  text: 'Классика, на которой учились классики. Мадди Вотерс, Вульф и Би Би в юности
    были фанатами группы. Диск не может, несмотря на его явную ценность для серьезного
    коллекционера, считаться "портретом". Он представляет только малую толику созданного
    "Шейхами", состав которых и репертуар, менялись непрестанно на протяжении лет.
    Сильная сторона альбома: лучшие вещи, включая мировой хит, классический и лучший
    состав, золотой период их карьеры.'
