- id: 1570
  author: Константин Колесниченко
  mark: 5
  date: '2009-08-06'
  text: Есть особая категория любителей блюза – фанаты Johnny Winter, SRV и прочих гитарных героев жанра. Так вот, этот альбом
    будет интересен, пожалуй, только таким слушателям. И это не смотря на то, что все 3 аллигаторовских альбома Винтера были
    довольно тепло встречены критикой, а 2 из них (включая этот) были номинированы на Грэмми. На этом альбоме мало интересной
    музыки, а виртуозных соло Джонни мало для того, чтобы получать удовольствие от прослушивания. Тут нет свежих идей, интересных
    аранжировок, которые были на ранних альбомах Винтера. Музыка этого альбома очень проста и незамысловата настолько, что
    все потуги Джонни навесить на эту блеклую основу свои фирменные соло звучат неинтересно. Наверное, этот альбом из тех
    блюзовых записей, которые хороши только в свое время, а середина 80-х – не самое лучшее время для нашего любимого жанра.
