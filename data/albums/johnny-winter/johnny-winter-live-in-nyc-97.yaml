- id: 60
  author: Леонид Аускерн
  mark: null
  date: '2002-12-17'
  text: 'Небезынтересный диск для тех, кто хочет знать, как же сложились взаимоотношения
    у Сивки с крутыми горками. Двадцать пять-тридцать лет назад рослый длинноволосый
    альбинос из Техаса Джонни Уинтер был весьма колоритной фигурой на американской
    рок-сцене. Иных кумиров тех лет уже нет на свете, иные ушли в тень, а вот Джонни
    Уинтер удачно преодолел все алкогольно-героиново-суицидные западни и до сих пор
    остается в строю. Так что в поединке с горками верх пока за вышеуказанным героем.
    В концертном альбоме, записанном в Нью-Йорке в 1997 году, 53-летний Уинтер демонстрирует
    завидную форму.


    <p>Он практически не изменил своему репертуару с тех достопамятных лет. Может
    быть, эта верность избранному направлению и способствовала его творческому долголетию.
    Джонни Уинтер с детства "сидел" на блюзе, играл эту музыку еще в школьном ансамбле
    со своим братом Эдгаром, а в начале 60-х работал, к примеру, с таким грандом,
    как Би Би Кинг. Поэтому он вполне логично вписался в волну белого рок-блюза, поднявшуюся
    в конце шестидесятых. Был ли он самым лучшим тогда? На мой взгляд — нет. Рассуждения
    о "втором Хендриксе" и тогда мне казались преувеличением, а уж сегодня их несостоятельность
    вполне очевидна. Наименее убедительно, на мой взгляд, выглядит у Уинтера вокал.
    При мощной энергетике в нем маловато чувства. У Джонни очень "белый" и не очень
    блюзовый голос. Но в чем ему не откажешь, так это в стабильности. Альбом "Live
    In NYC''97" ничуть не слабее ранних дисков.


    <p>В стартовой "Hideaway" Фредди Кинга Уинтер еще несколько вяловат, несмотря
    на жесткий роковой ритм композиции. Но затем ветеран разыгрался, очень неплохо
    исполнил "Black Jack" Рэя Чарльза, а перевалив за экватор программы, просто лихо,
    с виртуозными "хендриксовскими" гитарными переливами, сыграл "The Sun Is Shining"
    и медленный блюз Элмора Джеймса "The Sky Is Crying", где и вокал его выглядел
    интереснее обычного. С Джонни Уинтером на этом концерте работало только двое партнеров
    — бас-гитарист Марк Эпстайн (Mark Epstein) и барабанщик Том Комптон (Tom Compton),
    скромно державшиеся в тени лидера. Ну а лидер порадовал своих поклонников не только
    блюзами, но и буги, и рок-н-роллом. Так что, если в блюз-роковом коктейле вам
    больше нравится динамика и жесткость, этот диск — для вас.'
- id: 2117
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2013-04-25'
  text: 'Один из лучших концертников Джонни - записанный в Нью-Йорке в составе power-trio
    (только Джонни и ритм секция из Тома Комптона на ударных и Марка Эпстайна на басу),
    он демонстрирует разностороннюю блестящую технику музыканта и колоссальную энергетику.
    Интересен также подбор репертуара для шоу: он был выбран с помощью фан-клуба из
    наиболее любимых и часто запрашиваемых на концертах композиций, включая каверы.


    Альбом добрался до 7 места в топе блюзовых альбомов Биллборда.'
