  text: '"Unparalleled fired-up energy...marvelous acoustic guitar... gutsy, churning
    blues" - BLUES & RHYTHM


    Это последний альбом Джонни, записанный им на фирме Аллигатор. Сам музыкант признается,
    что ему по-настоящему нравится этот альбом, который включает в себя различные
    блюзовые стили.


    На нем Джонни на двух акустических треках играет на National Steel - гитаре, которую
    до этого последний раз он использовал для записи в 1977 году.


    При записи ему помогает ряд известных блюзовых музыкантов, с которыми он уже записывался
    много лет назад, и которые получают удовольствие от совместного творчества. Как
    верно подметил Джонни, "Когда тебе нравятся парни, с которыми ты играешь - это
    совсем другое дело, это просто обязано сказаться на музыке."'
