- id: 478
  author: Сергей Колобашкин
  mark: 10
  date: '2004-03-07'
  text: 'Johnny Winter "Still Alive And Well" - это супер-альбом супер-музыканта! Джонни Уинтер для меня является легендой,
    хотя я знаю людей, которыe готовы оспорить крутость этого музыканта. Пластинка начинается с клевой песни "Rock Me Baby",
    где гитара и вокал Уинтера отлично звучат и дополняют друг друга. Все остальные треки не хуже первого и поэтому, я думаю,
    стоит остановиться только на нескольких. "All Tore Down" - это отличная песня, где ритм-секция выдает максимум возможного.
    Песня "Rock & Roll" - еще один пример клевого исполнения клевой песни! "Silver Train" - это кавер на песню группы Rolling
    Stones, который звучит не хуже, а может быть и лучше оригинала. Песня "Ain''t Nothing To Me" представляет собой кантри-балладу,
    которая стоит целого альбома. "Let It Bleed" - это еще один кавер на Rolling Stones, где история повторяет "Silver Train".
    На сегодняшний день редко встречаются диски с двумя бонус треками, которых не было в первом составе альбома, а именно:
    "Lucille" и кавер на песню Боба Дилана "From Buick Six", которые тоже стоят всего альбома. Моя оценка - это пять с огромным
    плюсом, сейчас такого уже никто не запишет!'
- id: 2113
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2013-04-18'
  text: 'Восьмой студийный альбом Джонни, на котором ему помогали такие гранды, как Рик Деррингер (гитара, слайд-гитара, а
    также продюсирование альбома), Тодд Рандгрен (эпизодические клавиши и меллотрон), Джереми Штейг (флейта на одном из треков).
    В музыкальном плане это набор блюзовых, рок-н-ролльных и хард-роковых треков, испольненных со свойственным Джонни напором
    и виртуозностью. Интересна трактовка Silver Rain и Let it Bleed пера Джаггера с Ричардсом.


    Очень приличный альбом для своего времени - добрался до 22 места в топе популярных альбомов Биллборда.'
