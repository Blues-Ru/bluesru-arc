- id: 1144
  author: Константин Колесниченко
  mark: 8
  date: '2007-10-20'
  text: 'Очень хороший альбом, яркий и разнообразный. Джонни развивает свой стиль
    - крутой замес блюза, рока и прочих дел. Этот альбом должен быть отправной точкой
    в изучении творчества этого музыканта. Джонни немного резко и жеманно поет, но
    спишем это на роковою составляющую альбома, равно как и затянутую до семи минут
    "Fast Life Rider" и некоторые длинные гитарные соло. К счастью, альбом очень гармоничен
    по музыке и материалу - от авторских композиций до песен пера Bob Dylan, Chuck
    Berry, Little Richard. С Джонни играет его талантливый брат Edgar, а также его
    неизменная ритм-секция: "Uncle" John Turner и Tommy Shannon.'
