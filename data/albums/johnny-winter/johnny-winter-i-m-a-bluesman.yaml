- id: 1390
  author: Андрей Евдокимов
  mark: 7
  date: '2008-12-29'
  text: '"Я – блюзмэн" - долгожданный альбом Джонни Уинтера. Со дня выхода предыдущего прошло семь лет, а последняя его бесспорно
    удачная работа датируется 1991 годом. Обложку нового альбома представляет черно-белая фотография сидящего на крылечке
    старика с клюкой, в черной шляпе и с волосами цвета льна – персонаж и антураж словно взят из фильма Джармуша "Мертвец".
    А "старику" всего 60 лет – по блюзовым меркам (жанра, где зрелость наступает в поздние годы) он еще только вступает в
    самый расцвет. В голосе появились нотки философичной усталости. Зато ушел неестественный сдавленный хрип, бывший прежде
    его характерной чертой. Голос, зазвучав естественно, сразу обрел выразительность тонких нюансов. В его манере пения теперь
    есть что-то общее с поздними записями Питера Грина: может быть, потому что оба знают цену и славе, и отчаянью. Интенсивный
    гитарный блюз, одним из основоположников которого был Уинтер, доминировал несколько десятилетий. Теперь же блюз-рок оказался
    на обочине, вытесненный более утонченным и разнообразным стилем модерн-уэст-коаст. Хотя идти против течения непросто,
    Уинтер не изменил своей блюзовой манере, определившейся в основном еще к концу 60-х. Лишь несколько смягчил звучание.
    Он по-прежнему изобретателен, разнообразен и виртуозен в гитарных соло. Усталость в голосе не противоречит энергичности
    заглавной песни. "Блюз я буду играть и блюзом буду жить, пока не умру" - звучало бы как приговор, если бы не великолепная
    гитарная импровизация. Альбом состоит из новых песен за двумя исключениями. Это песни "Любовь в сахаре" Лейзи Лестера
    и "Этого не хватит" Хопа Уилсона – двух техасских музыкантов, вдохновлявших Уинтера в самом начале его пути. Эти песни
    стали самой теплой точкой альбома. "Этого не хватит" исполнена Уинтером сольно и в акустике. Акустический слайд Уинтера
    – пример того всестороннего владения техникой, что позволяет абсолютно свободную и естественную игру.'
