  author: Андрей Евдокимов
  mark: null
  date: '2005-10-18'
  text: '"Покажи мне, крошка, свои, а я покажу тебе свои!" Спокойно: речь о татуировках. Хотя увидеть предстоит многое, поскольку
    разноцветными татуировками покрыто все тщедушное тело виртуозного гитариста, основателя блюз-рока, одного из главных "гитарных
    героев" 60-х. 25 пять лет спустя после дебюта он уже в зрелых годах, разумеется. Но от первой автобиографичной песни "Человек
    в картинках" (Illustrated Man) он переходит к еще более озорной и юморной песенке "Босичком" (Barefootin''), сочинения
    ритмэндблюзового классика Роберта Паркера. И тут после веселья как холодный душ обрушивается на слушателя "полный блюз":
    "Жизнь трудна, а после – смерть" (Life Is Hard). Но несмотря на эту бесспорную, в общем-то, сентенцию, в целом альбом
    весел, оптимистичен и перенасыщен гитарными выдумками. Это первая новая студийная запись Уинтера после пятилетнего перерыва.
    И он предстает здесь музыкантом, полным творческих сил. На протяжении 70-х и большей части 80-х годов он пользовался теми
    же гитарными приемами, которые прославили его в конце 60-х. А здесь в его игре появляется что-то новое. Даже тембр его
    голоса зазвучал более естественно по сравнению со сдавленным и скрипучим вокалом прежних лет. Гитарная же игра звучит
    необыкновенно свежо, остроумно и очень разнообразно. Здесь и электрика во всех ее оттенках, и нежная джазовая акустика
    (Blue Mood) и великолепный слайд в заглавной песне "Впусти меня" (Let Me In). В альбоме много осталось от его рок-н-ролльного
    прошлого, но Уинтер стал соблюдать главное блюзовое требование к певцу-гитаристу: гитара комментирует вокальные строчки
    так, чтобы возникало ощущение диалога голоса и инструмента. Растянутые и пафосные гитарные соло почти ушли, зато появились
    остроумные и выразительные брейки. Песни звучат разнообразно и подобраны словно по контрасту. Среди них есть и авторские,
    и современные, и блюзовая классика – всем известная или забытая – в оригинальных обработках. По содержанию "Эй, ты!" (Hey
    You) представляет собой повторение все того же "вопрос-ответ": "Эй ты! – Кто, я?" только чтобы завершиться: "О, простите,
    я принял Вас за другого". Зато по музыке это просто феерическая дуэль гитары Уинтера и губной гармоники Билли Бранча (Billy
    Branch) – они то взрываются виртуозными соло, то сливаются в скоростной унисон. А в подарок любителям традиционного блюзового
    стиля "хонки-тонк" - участие пианиста Доктора Джона (Dr.John) в записи четырех треков, включая одну песню его сочинения:
    "Ты врешь слишком много" (You Lie Too Much).


    Дуплетом к этому отличному альбому Джонни Уинтер выпустил в следующем году "Где же брат твой?" (Hey, Where Is Your Brother?),
    записанный при участии его брата Эдгара Уинтера. А после 1992г. следующую работу Уинтера, достойную внимания, пришлось
    ждать 12 лет. Но это уже другая эпоха и другой стиль. Действительно, за последнюю декаду главное блюзовое течение переменилось
    разительно, и сегодня этот альбом 1991 года записи звучит старомодно. Но для блюза соответствие сиюминутным стандартам
    никогда не было главным. Энергетика и умопомрачительная игра Джонни Уинтера в этом альбоме ценна вне контекста моды.'
