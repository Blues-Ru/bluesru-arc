- id: 310
  author: Кирилл Мошков
  mark: 10
  date: '2003-12-02'
  text: 'Роскошная серия "Высококлассных изданий" одного из самых значимых лейблов
    в истории блюза - Alligator - пополнилась достойным сборником одного из самых
    значимых белых блюзменов. Даже очень белых - гитарист и вокалист Джонни Уинтер,
    как известно, альбинос. Треки из трех его альбомов середины 80-х годов, вышедших
    на "Аллигаторе" и знаменовавших тогда его возвращение к корневым формам электрического
    чикагского блюза после десятилетия работы в стадионном блюз-роке, дополнены двумя
    треками тех же лет, не вошедших в оригинальные альбомы и даже не сводившихся тогда.
    При этом в одном из этих бонусов на клавишах играет не кто иной, как Мак Ребеннэк,
    то есть сам Доктор Джон, а в другом на гармонике - еще одна блюзовая легенда,
    Джеймс Коттон.


    Уинтер записал не так много: героин сопровождал его долгие годы, то и дело вынуждая
    покидать музыку, иногда надолго. Однако три его "аллигаторовских" альбома 80-х
    - бриллианты его дискографии, и сделанная с них выборка представляет его весьма
    достойно, если не исчерпывающе. Главный герой альбома - даже не голос Уинтера,
    а его яростная гитара: по напору, технической свободе и выразительности игры он
    знает мало равных, и в этом жанре из белых музыкантов выше его стоит разве что
    покойный Стиви Рэй Воэн (да и из черных немногие дотягивают до его уровня).'
