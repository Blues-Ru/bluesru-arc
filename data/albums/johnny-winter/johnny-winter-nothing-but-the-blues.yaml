  text: '"I''d like to dedicate this album to all the people who enjoy my kind of blues and especially to Muddy Waters for
    giving me the inspiration to do it and for giving the world a lifetime of great blues." - JOHNNY WINTER


    Классический блюзовый альбом Джонни (подчеркиваю - именно блюзовый), записанный с группой Мадди Уотерса и самим Мадди
    на последнем треке. Тут и Пинетоп Перкинс, и Боб Марголин, и Джеймс Коттон, и Уилли Смит.


    Последний трек - дуэт с Мадди Уотерсом, остальные треки написаны самим Джонни. Прекрасные блюзмены из группы Мадди Уотерса
    удерживают Джонни в блюзовой колее, не давая ему уйти в рок.


    Добротный альбом традиционного блюза с отменным мастерством исполнения.'
