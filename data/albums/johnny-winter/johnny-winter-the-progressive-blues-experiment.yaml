reviews:
- id: 1143
  author: Константин Колесниченко
  mark: 6
  date: '2007-10-20'
  text: В чем состоит прогрессивный блюзовый эксперимент этого альбома мне непонятно.
    Да, Винтер ОЧЕНЬ круто играет на гитаре, но это не оживляет классические блюзовые
    композиции. Мадди, Сонни, Вульф и пр. звучат круче и убедительнее. Честно говоря,
    куча белых блюз-рокеров и блюзменов к тому времени записывали действительно прогрессивные
    альбомы.
- id: 1312
  author: Дмитрий Казанцев
  mark: 8
  date: '2008-07-07'
  text: 'Самый первый диск Джонни, он вышел в начале 1969-го года, до его альбомов
    на Коламбии. На диске - довольно тяжелый блюз и блюз-рок, все песни нам известны:
    "Rollin'' and Tumblin''," "I Got Love if You Want It," "Forty-Four," "It''s My
    Own Fault," "Help Me" и т.д. Хрипатый, рычащий голос Уинтера и его уже тогда виртуозная
    игра на гитаре. Странно, что в конце 60-х была такая мода на британских гитаристов;
    Джонни играет "круче" всех их, без всякого сомнения.


    Диск совсем не в духе поп-музыки, фактически, это - тяжело и шумно сыгранный блюз
    в своих обработках. Голос Джона - на любителя, конечно.'
