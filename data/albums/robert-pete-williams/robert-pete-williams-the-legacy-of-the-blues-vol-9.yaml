- id: 796
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-09'
  text: 'Роберт Пит - один из самых необычных блюзменов за всю историю жанра. Его
    игра на гитаре - это уникальная вещь: он ни на кого не похож, играет со слайдом
    и без, порой играет в миноре и различных настройках, иногда кажется, что он все
    время импровизирует. Его пение - это необычные шаманские выкрики, похожие на что-то
    дикое и религиозное, тем не менее, его голос приятен и понятен. Роберта "нашли"
    в одной из тюрем Луизианы в начале 60-х, так что его блюзы часто описывают жизнь
    за решеткой.


    Этот альбом записан в 1973 году в городе Батон Руж (Луизиана), на нем записаны
    9 блюзов Уилльямса (все они довольно длинные). Качество записи просто прекрасное,
    слышно каждое движение его руки и все тонкие вокальные интонации. Можно сказать,
    что музыка Роберта похожа на Джона Ли Хукера, тот же один аккорд почти всегда,
    шаманской настроение транса, но все же, это звучит как что-то особенное и интересное.
    Я бы назвал это "Блюз не для всех".'
