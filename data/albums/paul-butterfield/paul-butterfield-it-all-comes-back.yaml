reviews:
- id: 592
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-04-24'
  text: 'Второй альбом Пола с составом Better Days вышел сразу после их первой работы.
    С самых первых нот слышно, что это еще одна хорошая и сильная работа Пола. Интересный
    факт, 4 песни на альбоме написаны Бобби Чарльзом (известный автор и певец из Луизианы),
    он также поет одну песню. Еще одна вещь написана Доктором Джоном; все говорит
    о том, что Пол решил записать диск в стиле "болотного" блюза, а это всегда очень
    хорошо и интересно. На альбоме всего 9 песен, но каждая по своему хороша. Блюзы,
    соул и фанки - все очень классно на этой пластинке. Есть тут и два известных кавера:
    "Too Many Drivers" и "Poor Boy".'
