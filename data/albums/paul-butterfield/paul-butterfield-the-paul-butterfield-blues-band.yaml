reviews:
- id: 593
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-24'
  text: 'Дебютный альбом группы. Пол до этого играл с Мадди Уотерсом, Майк Блумфилд с Бобом Диланом, а ритм-секция с Хаулин
    Вулфон. И все, что они делают на этом диске - это играют черные блюзы, никакого блюз-рока, соула или фанка. Есть одна
    проблема - они слишком шустро и быстро все это делают (молодость и желание показать, как хорошо они умеют играть). Блумфилд
    и Элвин Бишоп отлично играют на гитарах, сам Пол прекрасно солирует на харпе. На альбоме есть инструменталы - это смелый
    ход для белой команды в 1965 году. На альбоме много известных песен: Shake Your Money-Maker, Blues With A Feeling, I Got
    My Mojo Working (просто копирование Мадди!), Mellow Down Easy, Mystery Train, Last Night, Look Over Yonders Wall. Хороший
    дебют, но не самая лучшая работа Пола.'
