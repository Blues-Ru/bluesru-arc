  author: Дмитрий Казанцев
  mark: 7
  date: '2005-04-02'
  text: 'Пятый альбом группы. Элвин Бишоп ушел и его место гитариста занял Баззи Фейтен. В группе по-прежнему 8 человек, но
    в записи приняли участие 12! Paul - vocals/harmonica, David Sanborn - sax, Buzzy Feiten - guitar, Gene Dinwiddie - guitar/keys/vocals,
    Ted Harris - piano, Fred Beckmeier - bass, Rod Hicks - bass/vocals, Trevor Lawrence - sax, Steve Madaio - trumpet, Philip
    Wilson - drums, Keith Johnson - trumpet, Jerry Ragovoy - piano/producer.


    Традиционных блюзов почти не осталось, стиль группы все дальше уходит в сложный фьюжн блюза, рока, джаза и соула. Появляются
    первые элементы фанка. Очень радует Пол - он почти не играет на гармошке, но когда играет - полный кайф!


    Этот диск длинный, на нем 12 композиций.'
