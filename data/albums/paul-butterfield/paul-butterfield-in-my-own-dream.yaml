- id: 513
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-04-02'
  text: 'Четвертый диск группы. На первых двух акцент был сделан на гитаристе Майке
    Блумфилде, на третьем Элвин Бишоп "отдувался" за него, так как Майк ушел, а вот
    на этом альбоме рулят духовые - Дэвид Сэнборн, Джин Динуидди и Кит Джонсон. Музыка
    стала сложнее и более эклектичной, много элементов рока, джаза и соула. Более
    того, на органе в двух песнях играет сам Эл Купер - один из родоначальников прог-блюза
    и джаз-рока.


    На диске всего семь песен, а песни поют четверо: Paul Butterfield, Bugsy Maugh,
    Phillip Wilson и Elvin Bishop. Приятно слушать группу из восьми человек, где все
    отлично играют.'
