reviews:
- id: 591
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-04-24'
  text: 'Это шестой и последний альбом группы. Очень хороший альбом; все 9 композиций просто прекрасны. Вместе с вокальными
    номерами есть два отличных инструментала. Почти все вещи на альбоме написаны группой, но есть и пара каверов: "Oh Pretty
    Woman" и "Drowned In My Own Tears". Стиль группы еще дальше ушел от традиционного блюза, но на этот раз звучание очень
    мощное, с использованием элементов госпела, соула и фанка. Один из лучших дисков Пола.'
