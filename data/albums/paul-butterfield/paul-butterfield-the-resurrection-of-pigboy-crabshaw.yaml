- id: 571
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-04-07'
  text: 'Третий альбом Пола и Ко. Майк Блумфилд ушел из группы и Элвин Бишоп (он же
    Pigboy Crabshaw) стал лид-гитаристом группы. А еще в ансамбле появились духовые:
    Gene Dinwiddie (tenor sax), Dave Sanborn (alto sax), Keith Johnson (trumpet).


    Музыка группы стала богаче и разнообразнее - появилось много элементов джаза и
    ритм-н-блюза, и все это было до появления джаз-рока и групп типа Blood Sweat &
    Tears и Chicago. Таким образом, Пол и его группа стали пионерами прогрессивного
    блюза и блюз-рока (как я это называю).


    На этом диске много известных блюзов в новых аранжировках: Driftin And Driftin,
    Pity The Fool, Born Under The Bad Sign, Double Trouble. Это одна из лучших работ
    группы (и Пола).'
