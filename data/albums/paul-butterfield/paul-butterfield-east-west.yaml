- id: 277
  author: Дмитрий Казанцев
  mark: 10
  date: '2003-11-21'
  text: 'Это второй альбом Баттерфилда и компании. Еврейско-негритянский блюз-роковый
    проект из Чикаго середины 60-х - звучит интересно, не так ли? На ранних альбомах
    одни будущие "звезды": Майк Блумфилд, Пол Баттерфилд, Элвин Бишоп, Джером Арнолд,
    Марк Нафталин, Билли Дэйвенпорт.


    Звучит диск гораздо серьезнее и убедительнее, чем любой альбом их британских коллег
    по блюзовому цеху; видимо Чикаго помогает и черные делают свое черное дело. Пожалуй,
    это лучший альбом группы и лучшая блюз-роковая пластинка 66 года. Уж больно хорош
    материал и исполнение. Гитарные соло очень интересны, гармошка тоже не оставляет
    слушателя равнодушным. Классная ритм-секция, молодость, блюз-роковые корни - все
    это очень здорово, но длилось это буквально три-четыре года, к концу 60-х с этим
    было покончено и именно поэтому такие альбомы очень ценны. Тут нет хард-рока,
    психоделии, джаз-рока, фанка, здесь только блюз и рок (ритм-н-блюз).


    Оценка 5 баллов. Лучшие песни: Get Out Of My Life Woman и Work Song. Нужно отметить
    последний тайтл-трек, он длится более 13 минут! Потом это стало нормой у Allman
    Brothers, например, но в 66-ом на студийном альбоме это было почти дикостью.'
