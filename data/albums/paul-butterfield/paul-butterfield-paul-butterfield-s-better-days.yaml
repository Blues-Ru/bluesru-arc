  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-22'
  text: 'Первая группа Пола развалилась еще в 1971 году, а в 1973 вышел альбом его
    нового проекта Better Days. В состав группы вошли: Geoff Muldaur - guitars; Amos
    Garrett - guitars; Ronnie Barron - organ; Billy Rich - bass; Christopher Parker
    - drums. Духовая секция иногда тоже подключается, но официально они не в составе.
    Удивительно, но группа зазвучала более живо и свежо, чем некоторые диски Butterfield
    Blues Band. Еще приятный момент - в некоторых песнях появились акустические гитары.


    На этом альбоме 9 композиций в духе блюза, блюз-рока и ритм-н-блюза. Есть тут
    известные всем стандарты в новых аранжировках: "New Walking Blues", "Baby Please
    Don''t Go", "Nobody''s Fault But Mine".


    Очень хорошая пластинка, если не сказать прекрасная.'
