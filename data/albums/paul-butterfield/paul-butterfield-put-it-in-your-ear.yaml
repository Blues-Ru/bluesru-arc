  author: Дмитрий Казанцев
  mark: 6
  date: '2005-04-02'
  text: 'Интересный альбом Пола. Почти совсем не блюзовый. Тут сделаны акценты на соул и фанк, но иногда вылезают какие-то
    странные поп-номера со струнными - это почти напрягает. Диск неровный, но несколько композиций очень хороши. Да, и посмотрите
    на состав; тут Гарт Хадсон, Чак Рэйни, Тим Драммонд, Джеймс Джемисон, Гордон Эдвардс, Левон Хелм, Бернард Перди, Ерик
    Гейл и многие другие классные музыканты.


    Я не знаю за что альбому поставили 1 балл на Оллмьюзике, но я ставлю твердую тройку за музыку и 5 за исполнителей.'
