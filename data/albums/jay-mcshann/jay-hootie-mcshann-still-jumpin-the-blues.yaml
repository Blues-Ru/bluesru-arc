  author: Константин Колесниченко
  mark: 10
  date: '2008-11-11'
  text: 'Слушая альбом, складывается впечатление, что свинг живет в пальцах Jay Mcshann,
    а ведь на момент записи ему было 82 года. Джаз и блюз что только не пережили на
    глазах этого музыканта - в его ансамбле начинали играть молодые Charlie Parker
    и Jimmy Witherspoon, в общем, "иных уж нет, а те уже далече". Музыка Макшенна
    - это тот свингующий сплав блюза с джазом, который играли Count Basie, Buck Clayton,
    T-Bone Walker, Charles Brown, пели Jimmy Rushing, Big Joe Turner, Joe Williams,
    Jimmy Witherspoon и др.


    Сам Макшенн - это энциклопедия жанра, но и материал альбома он подобрал исключительно
    классический и показательный: "Going To Chicago", "Moten Swing", "Ain''t Nobody''s
    Business", "On the Sunny Side of the Street", "On the Sunny Side of the Street",
    "Trouble In Mind" и др. Как вы думаете, кто помогал Джею воссоздать магию прошлых
    лет? Конечно, никто иной, как "универсальный солдат" Дюк Робиллард и его группа
    (Doug James на саксофоне - это очень хорошо!). Я в очередной раз был сражен умением
    Дюка играть практически любую музыку с душой, знанием, мастерством и чувством.
    Среди других известных почитателей таланта Джея на альбоме можно услышать Maria
    Muldaur.


    Музыка Макшена душевна и искренна, и мне нравится, что запись сделана в виде диалога
    с музыкантом - он часто сопровождает песню каким-нибудь комментарием: "This is
    the first blues I''ve ever heard. It was done by Bessie Smith in 1928", просит
    группу начать сначала. Заканчивается диск хорошим и содержательным интервью с
    классиком жанра.'
