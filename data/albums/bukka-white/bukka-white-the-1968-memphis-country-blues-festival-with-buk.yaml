  author: Сергей Исправников
  mark: null
  date: '2007-05-29'
  text: 'В данное двухдисковое издание включен материал двух пластинок, изданных независимым
    британским блюзовым лейблом Blue Horizon в 1968 г.: "The 1968 Memphis Country
    Blues Festival" (диск 1) и студийный альбом Букки Уайта "Memphis Hot Shots" (диск
    2). К последнему были добавлены два бонус-трека, первоначально вышедшие в 1970
    г. на сборнике "Stars of the 1969-1970 Memphis Country Blues Festival" (Sire Records).


    Фестиваль 1968 г. был уже третьим, ежегодно проводимым Мемфисским кантри-блюзовым
    обществом, некоммерческой организацией, основанной в середине 60-х г.г. гитаристом
    и любителем блюза Биллом Бартом, незадолго до этого открывшим широкой публике
    такого незаурядного блюзмена, как Скип Джеймс. Общество ставило своей целью поддержку
    и пропаганду традиционного блюза Дельты Миссисипи. Фестиваль проходил в г. Мемфисе
    (штат Теннеси) под открытым небом 20 июля 1968 г. Для записи концерта специально
    прилетел основатель фирмы Blue Horizon – Майк Вернон. Проект был осуществлен при
    поддержке его американского партнера – компании Sire Records (Нью-Йорк).


    Диск открывают два трека, исполненные уникальным блюзменом – Nathan Beauregard.
    Ко времени записи этого концерта Натану было уже 102 года. Начинал он еще в XIX
    веке, как исполнитель на банджо, затем перешел на шестиструнную гитару. Он был
    слеп от рождения, что не помешало ему, несмотря на очень преклонный возраст, блестяще
    выступить на фестивале, являя образец беспрецедентного творческого долголетия.
    Через два года он умер, оставив после себя всего шесть записанных песен (включая
    две на этом альбоме).


    Также на диске записан один трек другого патриарха – Furry Lewis (р. между 1893
    и 1900 г.г.). Льюис был "аборигеном" мемфисской блюзовой сцены. Потеряв в 1917
    г. на железной дороге одну ногу, Льюис вернулся в Мемфис, где регулярно выступал,
    одновременно работая дворником. Его первые записи были сделаны в 1927 г., но с
    началом Великой Депрессии его карьера в звукозаписи прервалась. В 1959 г. он был
    открыт заново и с тех пор часто выступал на фолк-блюзовых концертах, снимался
    на телевидении, в кино и даже для журнала "Плэйбой". Наполненный юмором "Furry''s
    Blues", исполненный им на концерте, был с большим энтузиазмом встречен аудиторией.


    В концерте принял участие, впервые выступив перед такой большой аудиторией, один
    из невоспетых героев дельта-блюза Joe Callicott. Родившись в 1900 г. в DeSoto
    (Миссиссиппи), он большую часть своей жизни не покидал родных мест, занимаясь
    фермерством и выступая дуэтом в две гитары со своим земляком – Garfield Arkers,
    с которым записался в 1929 г. На данном диске им исполнены две композиции: впервые
    записанная Virginia Liston в 1923 г. "You Don''t Know My Mind" и своя собственная
    "Great Long Ways From Home". Продемонстрированный здесь гитарный аккомпанемент
    Калликотта отличается простотой и устойчивостью ритмической структуры, сдержанностью
    и отсутствием технических украшений.


    Кроме того, на диске был записан и преподобный Robert Wilkins (р. 1896 г.), признанный
    в 1964 г. одним из самых выдающихся фолк-исполнителей журналом "Blues Unlimited".
    Сделав несколько записей с 1928 по 1935 г.г. и даже первым из черных блюзменов
    выступив в то время на радио, Уилкинс принял сан баптистского священника и фактически
    перестал исполнять блюз. Новый виток его музыкальной карьеры начался в 1964 г.,
    когда он вернулся на сцену и вновь стал делать записи. Исполненные им на диске
    две композиции на религиозную тематику характеризуют его как прекрасного слайд-гитариста
    и незаурядного вокалиста.


    Хэдлайнером фестиваля был Bukka White (р. 1906 г.), один из выдающихся исполнителей
    кантри-блюза, игравший на национальной стальной гитаре. Сделав ряд записей еще
    до войны, успев выступить боксером на профессиональном ринге, нападающим в бейсбольной
    команде и отсидев в тюрьме, Букка Уайт получил признание современной аудитории
    после того, как одну из его композиций в 1961 г. записал на свой первый альбом
    Боб Дилан. После этого Букка Уайт достаточно много записывался, активно выступал
    по обеим сторонам Атлантики. В 1968 г. он даже выступил на Олимпийских играх в
    Мехико. На фестивале он исполнил три композиции: написанную Big Joe Williams –
    "Baby Please Don''t Go", традиционную "Hello Central, Give Me 49" и специально
    сочиненную для этого выступления собственную "My Mother Died". Несмотря на некоторые
    проблемы с микрофонами, не выдерживавшими экспрессию исполнения, на диск были
    записаны все три песни, отражающие подлинный концертный драйв Букки Уайта.


    На следующий день 21 июля 1968 г. в местной студии был записан сольный альбома
    Букки Уайта. Майк Вернон решил пойти на эксперимент и впервые записать Букку Уайта
    с аккомпанирующим составом. В записи приняли участие члены группы Билла Барта
    "The Insect Trust", а также выступавший вместе с Уайтом исполнитель на стиральной
    доске – Jimmy Crosthwait. В результате, на половине треков играет вся группа,
    на оставшихся Букка Уайт сольно или в сопровождении одного-двух музыкантов. Запись
    прошла ударными темпами – за три-четыре часа. Тем не менее, результат оказался
    удачным, и что немаловажно, удовлетворившим самого Букку Уайта. Несмотря на неоднозначную
    реакцию критики, получился очень интересный и уникальный в своем роде альбом,
    демонстрирующий как традиционное исполнение Буккой Уайтом своего материала, так
    и ряд его вещей в блюз-роковых аранжировках.'
