  author: Сергей Исправников
  mark: null
  date: '2008-07-04'
  text: 'На диске переиздан последний альбом Букки Уайта, записанный в июле 1973 г. в "CMC Studios" в Западном Мемфисе, штат
    Арканзас, для американского лейбла Biograph. Данная звукозаписывающая компания была основана в 1967 г. и специализировалась
    на издании американской корневой музыки – регтайма, раннего джаза, фолк-блюза и т.п. Букка Уайт был записан максимально
    аутентично под аккомпанемент своей национальной стальной гитары, изготовленной еще в 30-х гг. Из двенадцати вошедших в
    альбом треков, половина были авторскими песнями Уайта, а остальные – традиционным американским фольклором. Среди записанных
    здесь стандартов Букки Уайта стоит выделить неизменный "Aberdeen Mississippi Blues", сначала записанный в 1940 г., а затем
    присутствующий чуть ли не на всех его поздних альбомах. Кроме того, сюда попала "Sic ‘Em Dogs On Me", первоначально записанная
    еще Аланом Ломаксом для Библиотеки Конгресса в мае 1939 г. прямо в исправительной колонии "Parchman Farm", где Букка Уайт
    в то время отбывал срок.


    Блюзы Уайта, как правило, рассказывают конкретные истории, когда вымышленные, когда правдивые. К последним относится записанный
    здесь "Shake My Hand Blues", рассказывающей о смерти от желтухи близкой подруги Уайта – Мэри Джонсон. Помимо собственно
    блюзов на альбоме содержатся как танцевальные мелодии, так и религиозные композиции. Среди первых – авторский "1936 Trigger
    Toe", типичный довоенный джиттербаг, и народный "Mama Don'' Low", исполнявшийся не только блюзменами, но и джаз-бэндами
    и белыми кантри-музыкантами. Из религиозного репертуара здесь присутствуют фольклорные "Cryin'' Holy Unto The Lord" и
    "Glory Bound Train", популярные как и у черных исполнителей госпел, так и у белых блюграсс-бэндов.


    Конечно, на записи сказывается возраст – Букке Уайту было тогда уже 67 лет. Игра на гитаре чуть более медленная, голос
    чуть более хриплый… Тем не менее диск не производит впечатления старческой немощи – умудренный годами ветеран исполняет
    свой такой же умудренный опытом блюз. Запись была тщательно подготовлена, с репетициями, настройкой звука – все как положено.
    Компания Shout! Factory, в наши дни восстановившая из забвенья лейбл Biograph и переиздавшая его каталог, выпустила данный
    диск с не вошедшим в оригинальное издание пластинки 1974 г. бонус-треком "Hobo Blues", записанным на той же сессии.'
