  author: Михаил Бирюков
  mark: null
  date: '2006-04-04'
  text: 'Если в двух словах - это <a href="http://www.blues.ru/BlackCat/bw.htm" target="_blank">Букка Уайт</a> на седьмом
    десятке. Далее комментировать было бы, наверное, излишне, но я все же попробую.


    Записано в студии Union в Мюнхене, 27 октября 1972 года. Видимо, старик колесил в это время по Европе с гастролями (в
    Штатах традиционный блюз переживал не лучшие времена), и его на денек затащили в студию записаться. Артисты того поколения
    были не слишком капризны по части студийных условий - они <i>всегда</i> писались за один-два прогона, и заготовить материала
    на лонгплей за один день никогда не представляло для них проблемы. На добрый, заметим, лонгплей, - примером какового и
    служит данный диск (переиздан на лейбле Blues Beacon при Enja Records в 1992 году).


    Букка Уайт здесь - как впрочем, и везде - верен себе, своей манере и своему звуку: приземленный, скрежещущий дельта-блюзовый
    вокал под клокочущий и лязгающий аккомпанемент "национальной стальной" гитары. Самую малость разговора. Возможно, в силу
    возраста, Букка Уайт здесь более расслаблен и спокоен, чем на других записях, плюс чуть больше скрежета в вокале и чуть
    больше лязгает гитара. Композиции длинные - ни одной короче пяти с половиной минут. Иногда подключается губная гармоника;
    впрочем, кто исполнитель на ней - буклет держит в секрете, он вообще не слишком информативен. С учетом общей атмосферы
    диска, впрочем, это кажется не имеющим особого значения. Понравится ли Вам эта запись - зависит от того, что для Вас Букка
    Уайт, и что для Вас седьмой десяток. Старый, заслуженный ветеран без спешки и суеты поет и играет свой старый, заслуженный
    блюз. Так, как это мог делать только он. Мне понравилось.'
