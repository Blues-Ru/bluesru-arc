  date: '2005-05-28'
  text: '"I just reach up and pull them out of the sky - call them sky songs - they
    just come to me." Так сам Букка описывал процесс сочинения своих песен. Брал прямо
    из воздуха, оттого и такое название диска.


    Эти записи ноября 1963 года первоначально вышли на двух пластинках лейбла Arhoolie.
    Переиздание на компакте включает в себя всю музыку с этих пластинок, опущен лишь
    монолог Mixed Water. Всего семь очень длинных треков. Букка играет на гитаре или
    рояле, на двух вещах ему помогает некто Big Willie Wayne на стиральной доске.
    Любопытно, что многие (если не все) песни действительно придуманы на ходу. Крис
    Страквиц, записывавший этот альбом, вспоминает, что спрашивал Букку, знает ли
    тот хорошую песню про азартные игры (gambling), и получал ответ, что нет, но сейчас
    придумает! Тот же ответ был по поводу песни с определенной мелодией. Воображение
    и импровизация у Букера Уайта были что надо!


    Альбом уникальный, но не могу сказать, что абсолютно все на нем интересно. Пара
    рояльных вещей звучит совсем вяло и монотонно, да и гитарные композиции чересчур
    затянуты. Единственный трек, про который можно сожалеть, что он таки закончился,
    это песня My Baby. Хоть она и длится почти 15 минут, ее повторяющийся рифф просто
    удивителен! По ходу этой марафонской композиции слышны вставки из других песен,
    как то, например, из Goodnight Irene.


    А вот что сам Букка говорит о своей стальной подруге-гитаре: "It is loud - I don''t
    need no mike and also I play so rough I would have busted many guitars. This one
    can stand rain and punishment, I stomp them, I don''t peddle them!"'
