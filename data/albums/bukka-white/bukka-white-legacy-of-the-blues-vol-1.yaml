reviews:
- id: 555
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-02'
  text: 'Бакка Уайт - это дядя БиБиКинга. Он настоящий кантри-блюз гений. Написал много известных блюзов, повлиял на всех
    подряд. Этот альбом записан в 1963 году в Мемфисе во время периода Фолк-Возрождения, а выпущен фирмой GNP Crescendo в
    1976 году в серии The Legacy Of The Blues. Бакка рассказывает свои истории. Тут он еще не стар, ему нет и 60 лет, так
    что бодрость присутствует и все просто супер.


    Если Вы любите настоящий блюз (кантри-блюз, фолк-блюз, Дельта, акустика, сонгстерз, архаика...), то купите этот альбом
    и получите удовольствие (запилов тут нет, так что любителям хард-рока можно не беспокоиться вообще).'
