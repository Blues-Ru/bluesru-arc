  author: Сергей Исправников
  mark: null
  date: '2008-06-29'
  text: 'Несмотря на то, что имя Букки Уайта стоит в одном ряду с такими ключевыми
    фигурами фолк-блюза, как Роберт Джонсон, Сон Хауз, Чарли Пэттон, Скип Джеймс и
    сегодня известно любому серьезному любителю блюза, у себя на родине после второй
    мировой войны он был практически забыт. В 1963 г. на волне "блюзового возрождения"
    о нем вспомнили два энтузиаста – John Fahey и Ed Denson. Зная по песням Уайта,
    что Абердин – его родной город, они послали ему письмо, практически "на деревню
    дедушке", и что удивительно, получили ответ. После чего в том же году была сделана
    запись для лейбла Takoma, основанного John Fahey. Джон сам был незаурядным гитаристом,
    однако в то время ни одна компания не заинтересовалась его творчеством, поэтому
    он решил создать собственную фирму Takoma Records, названную в честь его родного
    города, для издания своих работ. Выпущенный в 1964 г. диск Букки Уайта "Mississippi
    Blues" был первым альбомом стороннего исполнителя в его каталоге.


    На диск вошли десять песен и один устный рассказ Букки Уайта о Чарли Пэттоне.
    На девяти треках Уайт аккомпанирует себе на национальной стальной гитаре, а на
    одном – "Drunk Man Blues" – демонстрирует свои таланты пианиста. За исключением
    хита Big Joe Williamson – "Baby Please Don''t Go" – и традиционного блюза "Poor
    Boy Long Way From Home" на диске был записан авторский материал самого Уайта.
    Альбом содержит ряд стандартов Букки Уайта, первоначально записанных в 1937-40
    гг. для чикагских лейблов Vocalion и OKeh: "Aberdeen Mississippi Blues", "Parchman
    Farm Blues", "Shake ‘em On Down". Нужно сказать, что для Уайта было нехарактерно
    раз написать песню, а потом всю жизнь исполнять ее в неизменном виде. Текст мог
    меняться от исполнения к исполнению, тем более что многие вещи были написаны им
    спонтанно по конкретным поводам. В частности, присутствующий здесь блюз "Atlanta
    Special" был написан в перерыве сессий звукозаписи для этого альбома. Записанный
    в моно и задумывавшийся как некоммерческий проект, ориентированный на узкий круг
    любителей и знатоков блюза, альбом неожиданно стал хорошо продаваться, ознаменовав
    возвращение Букки Уайта на большую сцену. С этого момента он стал желанным гостем
    фолк-блюзовых фестивалей и университетских аудиторий как в Америке, так и за океаном.


    Альбом неоднократно переиздавался и на виниловых пластинках, и на компакт-дисках
    разными фирмами под разными названиями и с разным оформлением. Помимо качественного
    ремастеринга и информативного буклета данное издание выигрывает наличием трех
    бонус-треков, также записанных для лейбла Takoma, но уже в 1964 г. Два из них
    – "World Boogie" и "Midnight Blue" – были в том же году изданы на сингле, а блестящий
    "Old Man Walking Blues" – на сборнике "Contemporary Guitar" 1966 г.'
