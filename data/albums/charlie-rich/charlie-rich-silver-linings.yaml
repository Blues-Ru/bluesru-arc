  date: '2002-10-26'
  text: 'Хорошее начало для тех, кто решил познакомиться с госпел. Изумительный диск
    с главными церковными "стандартами". Его парадокс: "звезда" кантри музыки вдруг
    запел как стопроцентный негр и сделал альбом, обаянию и комфорту которого не в
    силах сопротивляться даже люди, далёкие от негритянской культуры.'
