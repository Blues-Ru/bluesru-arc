reviews:
- id: 1534
  author: Андрей Евдокимов
  mark: 7
  date: '2009-05-18'
  text: 'Эта концертная запись дожидалась издания всего лишь пять лет. Один очень
    стандартный блюз-рок, зато длинной почти в 10 минут. Остальное – фанк, фьюжин,
    немного фри-джаза и дружно свингующая группа медных на фоне плывущего звука электрооргана
    в формате биг-бэнда. Этот компот прекрасно объединяет блистательная гитара недооцененного
    мастера Хайрама Баллока. Он поразительно виртуозен в технике и одновременно нисколько
    не боится быть порой небрежным в исполнении – так что кому, как не ему, переигрывать
    репертуар Хендрикса. В импровизации он слегка безумен – и это тоже кстати. Временами
    музыка звучит почти навязчиво, общий саунд какой-то плоский, а барабанный гений
    Билли Кобэм тут играет без огонька. Но лучшие моменты концерта полностью перевешивают
    его недостатки. Происходит то же, что было и на московском концерте Баллока в
    московском "Ле клубе": половина дежурных блюд, половина просто фейерверк… Увы,
    в дискографии Хайрома Баллока альбом стал последним. Баллок ушел из жизни в июле
    прошлого года, не дожив до 53 лет.'
