- id: 2005
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-11-16'
  text: 'Певица и композитор Анжела Стрели уже на протяжении нескольких десятилетий является одной из ведущих фигур блюзовой
    сцены Остина (наряду с братьями Воэн, Ким Уилсон, Лу Энн Бертон, W.C. Clark и другими), причем ее творчество не ограничивается
    только блюзом, но затрагивает и фолк, и соул, и кантри, и госпел, и поп.


    Несмотря на шестидесятилетний возраст на момент записи данного альбома, голос ее силен и выразителен, а подача материала
    высокопрофессиональна. Шесть треков авторских, четыре кавера, стилистика разнообразна - от блюз-рока до госпел, аранжировки
    с некоторой долей коммерции, но не чрезмерной. Помогают такие блюзовые гранды, как Марша Болл и Мария Малдор (бэк вокал
    на заглавном треке) и Пол Торн (дуэт). Но особенно интересен последний трек, записанный в 1985 году в Карнеги Холл со
    Стиви Рэйем (SRV - посвящение ему) и его составом Double Trouble, включая гостевое участие Доктора Джона и Джимми Воэна,
    а также духовой секции Roomful of Blues.


    Приятный качественный альбом, хотя и без особых откровений (хотя последний трек, пожалуй , исключение).'
