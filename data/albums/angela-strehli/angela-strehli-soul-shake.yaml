reviews:
- id: 1561
  author: Константин Колесниченко
  mark: 6
  date: '2009-07-08'
  text: 'Братья Vaughan, Kim Wilson, W.C. Clark, Doyle Bramhall, Lou Ann Burton и
    Angela Strehli – вот список музыкантов, которые строили молодую остинскую блюзовую
    сцену, развивающуюся вокруг клуба Клиффорда Энтона.


    80-е - это неудачное время для того, чтобы записать настоящий блюзовый альбом,
    единицам это удалось. "Soul Shake" - не из этих альбомов. Скорее, это хорошая
    подборка для того, чтобы звучать на радио в то время – несколько песен, которые
    гарантируют место в техасских хит-парадах и несколько блюзов, правда звучание
    записи не всегда позволяет получить от них удовольствие. И тут проблема не в подборе
    материала, потому что тут есть и классические песни, и не в игре музыкантов, и
    не в самой певице. Просто время такое – 80-е. Не скажу, что альбом получился плохой,
    просто не совсем блюзовый.'
