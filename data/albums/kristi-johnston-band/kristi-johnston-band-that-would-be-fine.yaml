- id: 1284
  author: Леонид Аускерн
  mark: null
  date: '2008-06-03'
  text: К моменту записи этого альбома, изданного в России по лицензии, Кристи Джонстон
    было 28 лет. Для блюза возраст совсем молодой. И слушая That Would Be Fine, работу
    вполне зрелую и цельную, трудно поверить, что Кристи впервые взяла в руки гитару
    всего лишь за десять лет до этого события. В восемнадцать студентка из Виннипега
    "заболела" гитарой и практически с нуля за два месяца достигла довольно приличного
    уровня игры. Образцом для Кристи стали знаменитые американские блюзмены – Мадди
    Уотерс, Ронни Эрл, Лайтнин Хопкинс и другие. В течение пяти лет она играла на
    гитаре в ансамбле местного музыканта Терри Мура и с этим коллективом разъезжала
    по всей Британской Колумбии. С 1996 года она выступает в родном городе с собственным
    трио. С ним же при участии ряда сессионных музыкантов Кристи Джонстон в течение
    четырех дней записала That Would Be Fine – дебютный альбом для известного канадского
    блюзового лейбла Stony Plain, выйдя, таким образом, с регионального на общенациональный
    уровень. И дебют, на мой взгляд, удался, во всяком случае, в творческом отношении.
    Ансамбль Кристи Джонстон играет откровенный, стилистически чистый блюз-рок. Кристи
    - безусловный лидер своего небольшого ансамбля, ее гитара и ее голос постоянно
    на авансцене. При этом, как мне показалось, гитара у Кристи больше блюзовая, а
    вокал скорее роковый, но цельности впечатления это совсем не нарушает. Драйв и
    чувство здесь слиты весьма органично. Программа из тринадцати композиций тоже
    весьма ровная, без провалов и "проходных" треков. Нельзя не отметить, что большую
    ее часть составили песни, написанные самой Кристи, так что она еще и незаурядный
    мастер и по этой части. Хороши и кавер-версии, особенно Eyesight to the Blind
    Сонни Бой Уильямсона. Ричард Флохилл, автор liner notes к альбому, называет Кристи
    "дуновением свежего ветра из прерий". Но даже без этих "литературных красивостей",
    прослушав That Would Be Fine, вы не сможете не запомнить это новое имя на блюзовой
    карте Канады.
- id: 1363
  author: Константин Колесниченко
  mark: 6
  date: '2008-11-05'
  text: 'В истории блюза не так уж много дам, совмещающих с пением еще и довольно
    уверенную и качественную игру на каком-либо инструменте. Это относительно новое
    приобретение блюза и, в большей степени, это различные степени подражания и развитие
    той манеры пения, да и исполнения вообще, что зародила Bonnie Raitt. Самые яркие
    примеры – это американская звезда Susan Tedeschi или канадская Sue Foley. Kristi
    Johnston – не исключение. Возможно, если бы этот альбом записал мужчина, это была
    бы совершенно незаметная и "серая" запись, но девушка с электрогитарой всегда
    привлекает внимание. Пусть вокальные и инструментальные способности Кристи довольно
    скромные и порой, на альбоме слышны самоповторы, но женщины довольно редкие гостьи
    в чисто мужском блюзовом коллективе, что обязывает нас относится к ним снисходительно.


    По записи слышно, что у Кристи есть некий музыкальный потенциал, но куда его направить
    она еще для себя не решила, потому на протяжении альбома ее бросает то в откровенный
    блюз-рок, то в свинг, то в некое подобие фанкового грува, то в рок-музыку. Мне
    кажется, что последний вариант для Кристи наиболее предпочтителен, потому что
    именно такая композиция – "Outta Love" получилась у нее наиболее убедительно.'
