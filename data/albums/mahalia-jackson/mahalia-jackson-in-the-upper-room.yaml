  author: Алексей Калачев
  mark: 8
  date: '2002-11-26'
  text: Мэхелия – ГЛАВНАЯ певица госпел всех времен. Давать оценки её пению – глупо,
    поэтому стоит говорить, насколько данная компиляция характеризует ее творчество
    в целом, то есть о качестве пластинки как сборника. Ценность его высока. На нем
    заключено "обозрение" лучших записей певицы на фирме Apollo едва ли не за три
    десятилетия. То торжественная, в сопровождении органа и рояля, то "хорошо темперированная"
    церковная музыка, плюс дивные голоса хористов, особенно мужского квартета. Классика.
