reviews:
- id: 104
  author: Алексей Калачев
  mark: 6
  date: '2003-02-24'
  text: За этот альбом Роберт получил премию Уильяма Хэнди. Целый компакт-диск, заполненный
    песнями Роберта Джонсона, стандартами дельта-блюза. 80-летний Локвуд напел их
    своим надтреснутым старческим тенорком, подыгрывая себе на 12-струнной гитаре.
    Никаких изысков на альбоме нет. Немножко забавно слышать, как почтенный старец
    исполняет песни о сумасшедших красотках, которые уходят от него пачками, о разбитых
    сердцах, изменах и т.д. В своем роде альбом действительно исторический, учитывая
    то обстоятельство, что он сделан одним из тех, кто лично соприкасался с истоками
    блюза, с одним из его главных демонов, с Робертом Джонсоном, с которым и вовсе
    был едва ли не в приятельских отношениях. Вероятно, альбом полагается иметь поклонникам
    дельта-блюза.
