- id: 493
  author: Сергей Колобашкин
  mark: 10
  date: '2004-03-12'
  text: 'Humble Pie "King Biscuit Flower Hour" стал мои первым альбомом этой замечательной английской группы. Весь альбом
    держал меня в напряжении: Стив Мариот отличный вокалист, а также еще и отличный гитарист, что можно сразу услышать на
    первых звуках концерта. Очень клевая ритм-секция, которая является локомотивом всего концертного состава. Стив Мариот
    рулит по полной программе от первой "Up Your Sleeves", до последней "Hot N'' Nasty"! Сет-лист рок-н-рольного концерта
    приятно разбавлен блюзовой композицией "Blues I Believe My Soul", которая стремительно сменяется "30 Days In The Hole"
    - это великолепное исполнения их старого хита. Стоит отметить песенку Рэя Чарлза "Hallelujah I Love You So", которую Humble
    Pie превращает в стремительный и ровный блюз-рок с отличным ритмом и мелодией + замечательная работа группы бэк-вокал,
    эти тетки там очень клево пели! Очень хорошо звучит "Honky Tonk Women", честно говоря, мне эта версия понравилась больше,
    чем у Rolling Stones. Да вот, вообщем, и все! Эта пластинка получает пять балов из пяти, ребята клево зажгли!'
