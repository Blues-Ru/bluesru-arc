- id: 960
  author: Дмитрий Казанцев
  mark: 9
  date: '2006-01-17'
  text: 'Это четвертый альбом Эрика; он записан в Англии, а не в США. Большинство
    песен написал сам Бибб, но есть тут интересные каверы и традиция: "Bring It On
    Home To Me" (Sam Cooke), "Come Back Baby" (trad.), "No More Cane On The Brazos"
    (trad.)


    На альбоме только акустические инструменты и голоса; надо выделить аккордеон -
    он создает новое звучание во многих песнях. Фолк-блюз-соул-госпел Эрика очень
    хорош, какой бы жанр или стиль он не вводил в свои песни и обработки. Волшебный
    голос, прекрасная игра на гитаре.'
