reviews:
- id: 959
  author: Дмитрий Казанцев
  mark: 9
  date: '2006-01-15'
  text: 'Эрик продолжает сочинять и исполнять свою волшебную музыку на основе госпела,
    блюза, фолка и соула. Духовно и душевно одновременно. На этом альбоме есть много
    электрических звуков, которые отлично сочетаются с его акустической гитарой (он
    большой мастер игры на ней). Слова Бибба понятны, просты и неожиданны. Его сравнения
    типа "I love you baby, like Aretha (Franklin) loves to sing" (одна из лучших вещей
    на альбоме) - это всегда приятно слушать. "The Way You Are" - еще один шедевр
    любовной соул-песни. Голос Эрика настолько хорош, что он свободно передает все
    нюансы в различных жанрах и стилях. В песне "Troubadour" он называет себя трубадуром
    и описывают свою музыку как "...hear some blues... gospel, soul & some basic rock
    and roll..." - еще одна гениальная вещь на альбоме.


    Бибб снова хорош, очень хорош. Светлая и глубокая музыка.'
- id: 1226
  author: Константин Колесниченко
  mark: 9
  date: '2008-03-18'
  text: 'На этом альбоме нет ни одной композиции, которую с уверенностью можно отнести
    к блюзу. Фолк, соул, госпел есть, а вот блюза почти нет. Плохо это или хорошо
    - сказать сложно. Блюз на альбомах Эрика всегда был не из разряда шаффл; его музыка
    в этом плане уходит корнями, скорее, к Mississippi John Hurt, чем к Robert Johnson.
    Бибб правильно называет себя трубадуром, его основное достоинство - это замечательные
    песни, которые он не менее замечательно исполняет.


    Бибб - просто потрясающий певец, удивительно проникновенный, но кроме него на
    альбоме можно услышать еще и Ruthie Foster, которая впервые засветилась на его
    "Friends", большой госпел хор и, судя по имени, ребенка Эрика. После прослушивания
    такой музыки создается удивительное радостное настроение, потому что все песни
    насыщены романтизмом ("Long as I can''t sleep at night without my hand on you
    shoulder") и вот той улыбкой, которую можно увидеть на обложке его альбома.'
