reviews:
- id: 624
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-05-19'
  text: 'Эрик и две дамы поют вместе и по очереди. Блюзы, госпел и фолк. Есть тут две известнейшие вещи: "Lean On Me" (Bill
    Withers) и "Gotta Serve Somebody" (Bob Dylan).


    Дамы хорошо поют, но уж очень они академичны - используют школу и манеру (я им "не верю!). Эрик - молодец, в его искренности
    не приходится сомневаться.'
