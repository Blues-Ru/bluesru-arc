- id: 1266
  author: Константин Колесниченко
  mark: 7
  date: '2008-05-12'
  text: 'Я бы дал этому альбому оценку 5, только за одну заглавную песню "Spirit I Am", но я попробую быть объективным, хотя
    в случае с Эриком Биббом мне это очень сложно.


    Мне показалось, что Бибб немного зачастил с альбомами. Нет, он не выдохся музыкально, не стал писать глупые песни или
    хуже петь. Просто создается какое-то ощущение, что он не может найти для себя какую-то концепцию, которая бы заставила
    этот альбом звучать свежее и гораздо ярче. В этом плане мне показателен его альбом "Friends", на котором каждая отдельная
    песня выражала отдельную музыкальную идею, а все вместе они создавали интересную картину - материал Эрика при подаче его
    разными музыкантами. Этот же альбом - набор прекрасных, умных, тонких и красивых песен, но к сожалению (за исключением
    открывающей альбом "Spirit I Am"), звучащих как самоповтор.


    У Бибба уже стало традицией приглашать на альбом замечательную певицу Ruthie Foster, кроме нее из гостей отмечу еще Bonnie
    Raitt.'
