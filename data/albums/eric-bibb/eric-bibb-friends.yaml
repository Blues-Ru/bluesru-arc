reviews:
- id: 619
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-05-17'
  text: 'Блюз, фолк, этника и госпел с друзьями и коллегами. Бибб - великолепный певец и гитарист, а с ним отличные люди:
    Таж Махал, Чарли Масселуайт, Гай Дэвис. На диске 15 композиций - свои вещи и известные темы: "99 1/2", "Goin'' Down Slow",
    "Lovin'' In My Baby''s Eyes". Очень красивый, музыкальный и разнообразный альбом.'
- id: 633
  author: Александр Панин
  mark: 10
  date: '2005-05-20'
  text: 'Новый альбом Эрика Бибба получился очень интересным и разноплановым. Блюз, фолк, этника - здесь есть все. Список
    гостей впечатляет: Тадж Махал, Чарли Маззлвайт, Гай Дэвис, Одетта! Плюс к этому еще перец с индийской гитарой, гаваец,
    африканцы. Половина треков просто превосходны, остальные тоже неплохи, хотя временами фолковые вещи сменяются характерными
    для нынешнего Бибба поп-балладами, что лично меня несколько раздражает.


    Из неожиданностей отмечу исполнение Lovin'' In My Baby''s Eyes с Mamadou Diabate на инструменте кора (но без Таджа).'
