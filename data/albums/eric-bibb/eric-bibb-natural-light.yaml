- id: 620
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-05-18'
  text: 'Эрик выпустил свой первый диск лишь в 1997 году, когда ему было уже 46 лет, а в 2003 вышел Natural Light - уже седьмой
    в его дискографии!


    Эрик Бибб прекрасно поет, создавая волшебную атмосферу, его игра на гитаре в духе классического fingerpickin'', но в ней
    ей свои "фишки" и ходы. Как автор Эрик тоже хорош - интересные тексты с сильным влиянием госпел-тематики. Его стиль в
    целом - это современный фолк-блюз с элементами госпела и ритм-н-блюза. Группа Бибба - отдельное дополнительное удовольствие,
    особенно когда солирует слайд-гитарист Робби Макинтош. На этом альбоме также играет на гитаре и подпевает Хьюберт Самлин,
    а на ударных отметился известный Хенри Спинетти.


    На диске 13 композиций, Эрик написал 9 из них. Очень хорошая, светлая музыка с мощной положительной энергией.'
