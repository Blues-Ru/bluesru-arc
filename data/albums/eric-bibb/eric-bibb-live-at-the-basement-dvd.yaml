  text: Концерт в Сиднее (Австралия). Обычный паб где играют музыку. Народ в восторге.
    На сцене только Эрик и басист Дэйв Бронз. Бибб - ученик Таж Махала, а также других
    блюзменов и фолкеров (он не скрывает этого). Его музыка - это смесь блюза, фолка,
    госпела и соула. Он очень хорошо поет и играет на гитаре. Все его песни яркие
    и классные. А главное - никаких барабанов, шума, шаффла и свинга. Только МУЗЫКА.
