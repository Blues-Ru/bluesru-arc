  author: Константин Колесниченко
  mark: 10
  date: '2008-05-12'
  text: Это концерт 2002 года, который уже выходил в формате dvd под названием "Live
    at the Basement". Эрик Бибб - это настоящее явление в музыке - сладкоголосый вариант
    Боба Дилана! Раньше на альбомах частенько гитарная игра Эрика терялась на композициях
    - он очень редко солирует, часто приглашает других гитаристов. А тут, в формате
    дуэта (с ним играет замечательный Dave Bronze на бас гитаре), все его качества,
    как гитариста, проступили очень четко. К альбому у меня нет ни одного нарекания,
    за исключением того, что он закончился. Потому что такую музыку хочется слушать
    дольше и дольше - она очень плавно течет, она очень мудрая и мелодичная. Эрик
    давно ушел в сторону от блюза, добавив в свою музыку очень сильное влияние госпел
    и фолка!
