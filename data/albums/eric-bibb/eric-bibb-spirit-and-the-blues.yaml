- id: 932
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-12-07'
  text: 'Третий альбом Эрика - великолепного певца, гитариста и автора. Бибб работает в стиле фолк-госпел-блюз, делает он
    это виртуозно и от всего сердца. С ним классная группа под названием Needed Time (различные акустические гитары, голоса,
    бас, барабаны, аккордеон, губная гармошка). Все сыграно со вкусом и безумно интересно по звуку и аранжировкам. Здесь много
    традиционных госпелов и песен, есть очень известные вещи: "You''re Gonna Need Somebody On Your Bond", "Satisfied Mind".


    Невероятное обаяние, духовность, душевность и профессионализм одновременно.'
