  text: 17 песен на этом диске Эрике, но длится он всего 55 минут - много коротких
    зарисовок здесь. Как и обычно, стиль Бибба - микс блюза, фолка и госпела. Волшебный
    вокал и фингерпикин-гитара. Этот диск - не самое яркое творение Эрика, но он очень
    и очень хорош.
