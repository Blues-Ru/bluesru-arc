  author: Андрей Евдокимов
  mark: null
  date: '2003-12-04'
  text: 'Два великолепных альбома модерн-блюза объединила на одном компакте "EVIDENCE"! Оригинальные альбомы записаны в Париже
    для фирмы "BLACK & BLUE", не упускавшей случая затащить в студию блюзмэна, оказавшегося в Европе (по какому поводу - свежий
    блюз: "Побывал в Китае, приехал в Европу - всюду пел блюз. Но дождаться не могу, когда увижу дома лицо моей бейби"-#9).
    Честь и хвала "B&B", что Бастера Бентона они в 1983 не обошли вниманием. Это был первый приезд Бентона в Европу, а имя
    его оставалось малоизвестным даже в Чикаго, где он жил и работал. Характерно для позднего модерн-блюза стилистическое
    разнообразие этого альбома. Несколько номеров "горячего фанка", традиция, баллады, плюс немного "соул"... Но - никакого
    блюз-венегрета! Яркая индивидуальность Бентона все обращает в один уникальный стиль. В медленных - Бентон поэтичен, в
    быстрых - ритмичен, в "хитах" - цепляет мелодическими "хуками-крючками"! (Бентон умеет сочинить такой цепкий "хук", какой
    украсил бы любую рекламную компанию.)


    С ним в студии - отличная компания. В 1983 году это были блюзовые ветераны. Гитарист Джон Литтлджон записывался в конце
    60-х для "ARHOOLIE", он - мастер, столь же незаслуженно обойденный международным признанием, как и Бентон. Имена пианитса
    Лафайетта Лика и барабанщика Одди Пейна не нуждаются в представлении любителям чикагского блюза золотой поры - достаточно
    сказать, что они были участниками блюзбэндов Мадди Уотерса и Хаулин Вулфа. Джо Берд в этой компании представляет следующие
    поколение блюза, очень самобытный музыкант, чьи альбомы в 90-х демонстрируют равную склонность к глубокой традиции и к
    гладкому полуджазово-менйнстрмовому звучанию. В 1985 г. Бентона сопровождали участники второй редакции чикагской группы
    "SONS OF BLUES": бассисит Джи-ДаблЮ Уилльямс, харпист Билли Брэнч и гитарист Карл Уизерсбай, двое последних с тех пор
    вполне утвердились в роли солистов. И оба - блеснули талантами на этой записи.


    Бесспорный шедевр в альбоме - сомнамбулически-медленный заключительный блюз "Деньги - имя этой игры", спетый с горькой
    и гордой завистью блюзмэна, понимающего, что в этой игре ему никогда не выиграть, хотя бы потому, что понять правила игры
    - он не может. (Вообще-то N14 - это блюз J.Brim''a "Ice Cream Man" в легкой переработке и названный на конверте по второй
    строчке песни)'
