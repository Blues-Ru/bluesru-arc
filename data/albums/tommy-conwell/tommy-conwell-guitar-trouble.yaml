  author: Сергей Колобашкин
  mark: 8
  date: '2004-03-12'
  text: Tommy Conwell "Guitar Trouble" - это зажигательный коктейль из блюза и жесткого рок-н-ролла, который может понравиться
    многим. Все песни похожи как две капли воды, мне трудно сказать, какая из них лучшая, но нельзя не отметить клевый заглавный
    трек "Guitar Trouble", где Томми демонстрирует отличную игру на гитаре. В общих чертах, эта пластинка не заслуживает пятерки,
    так как альбом мне показался очень сырым, его тяжело дослушать от начала и до конца - надо делать перекуры, так как однообразие
    песен очень действует на нервы. Короче говоря, этот альбом заслуживает слабенькую четверку, правда, нашлись бы люди, которые
    завысили бы оценку, но я с ними не соглашусь.
