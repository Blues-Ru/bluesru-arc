  author: Александр Сомов
  mark: null
  date: '2014-07-25'
  text: 'Искушенный музыкант электрического блюза, в арсенале которого как и классические
    стандарты, так и свои песни, пропитанные духом тех самых 50-60х.


    Еще подростком, Джонсон, начал учиться играть на гитаре, слушая записи. И вскоре
    уже играл в разных аккомпанирующих составах Атланты - в турах таких музыкантов,
    как Johnny Winter. После нескольких лет игры в барах сформировал свою группу -
    Houserockers. С этой группой несколько лет играл в барах вокруг Джорджии, а затем,
    в 1989 году подписал контракт со звукозаписывающей компанией Ichiban. На следующий
    год, Джонсон выпустил свой дебютный альбом - Takin'' A Bite Outta the Blues.


    Альбом не принес большой славы, но дал шанс быть услышанным в среде любителей
    блюза Атланты. Запись не сильно выделяющаяся, но зато приятная и искренняя, явно
    дает понять, что Джонсон(кстати не путать с Luther "Guitar Junior" Johnson) очень
    во многом был продолжателем игры чикагского мастера - Jimmy Reed. Это влияние
    особенно видно в классических вещах "What''d I Say"(Рэя Чарльза), "Rock Me, Baby"
    (Би Би Кинга) и в нескольких, что написал сам Рид - "Hush, Hush", "Where Can My
    Baby Be" или "Pretty Thing"(Уилли Диксона).


    Через два года появился его следующий альбом - Houserockin'' Daddy. А в 90х Джонсон
    продолжил гастролировать по Америке. Судя по записям с youtube, в 2012 все еще
    играет в своем любимом клубе - Blind Willie''s в Атланте.


    Послушать альбом можно тут http://vk.com/wall-13370755_3030'
