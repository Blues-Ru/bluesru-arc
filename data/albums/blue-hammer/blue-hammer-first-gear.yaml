  author: Федор Романенко
  mark: 10
  date: '2010-02-15'
  text: 'Шведская группа гитариста Томаса Хаммарлюнда играет современную блюзово-свинговую
    музыку в стиле "раннего Roomful Of Blues" - характерный репертуар, вокал, гитара,
    дудки и хаммонд. На пластинке есть даже песни с первых альбомов типа "Hot Little
    Mama", однако в целом - это не трибьют и не копирование.


    Я бы даже сказал, что на записи они играют лучший румфул оф блюз, чем это делает
    сам румфул оф блюз. Когда-то давно мне одновременно в плеер попали две новые пластинки,
    я их слушал время от времени в течении месяца, не имея возможности прочитать надписи.
    Про шведов я думал: "ну ладно, это - отличный диск румфулов. А тот, другой? Вроде,
    тоже похоже, хотя и не дотягивает..." ;)


    Очень качественно аранжированный и сыгранный современный свинговый блюз, можно
    слушать много раз.'
