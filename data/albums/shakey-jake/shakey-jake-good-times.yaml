  text: 'Первый альбом Джейка. Он играет на гармошке и поет в стиле Мадди Уотерза.
    Всего двое помогают ему: Brother Jack McDuff (organ) & Bill Jennings (guitar).
    Совершенно необычное и уникальное звучание! Ритм-секции нет, и она тут не нужна
    - здесь все и так прекрасно!'
