reviews:
- id: 831
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-08-24'
  text: 'Не самый интересный вариант блюза предлагает нам Shakey Jake Harris. Я не могу сказать, что он великий певец, гармонист
    или автор. И дело не только в этом; альбом звучит монотонно, как плохо подготовленный джем-бэнд. Большинство блюзов тут
    одинаковые, без риффов, тем и мелодий. Сильно отличается лишь "Jake''s Cha Cha" и еще пара песен. Треть альбома вообще
    без слов, ребята просто импровизируют на три аккорда. Мне очень понравилось как играет гитарист Jimmy Lee (Robinson);
    его необычная "рваная" манера игры - это самое интересное на этом диске. Джейку и Джимми помогают люди с фирмы Prestige:
    Robert Banks - piano; Leonard Gaskin - bass; Junior Blackmon - drums.


    Скучновато и однообразно. Средненький такой альбом, хотя местами парни классно импровизирует, но не это же делает Блюз
    великой музыкой и формой.'
