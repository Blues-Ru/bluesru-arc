  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-07-06'
  text: 'Итальянский мастер Фендера виртуозный гитарист Руди Ротта вырос на музыке
    Битлз, часто играл их музыку по клубам в 60-е и 70-е, и наконец осуществил свою
    мечту и записал музыку своих кумиров, представив ее в своей блюзовой интерпретации.


    Что из этого вышло - каждый может услышать сам. На мой взгляд, некоторые треки
    удались (например, Norwegian wood), другие не очень, но в целом любопытно. Тем
    более принимая во внимание тот факт, что Руди добился признания не только в Италии,
    но и в Англии, а сцену с ним делили такие блюзовые мэтры, как Джон Мэйолл, Питер
    Грин, Би Би Кинг и многие многие другие.'
