- id: 1920
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-05'
  text: 'Данный сборник - прекрасная возможность ознакомиться с творчеством музыканта,
    талант которого породил такие хиты музыки 20-го века, как Call me the Breeze,
    After Midnight, Cocaine, Sensitive Kind и другие.


    Американский композитор, оказавший огромное влияние на творчество таких грандов,
    как Эрик Клэптон, Марк Нопфлер и многих многих других. Двадцать треков классического
    неспешного Жан-Жака Кэйла, который всегда находился как-бы между музыкальных стилей,
    одновременно создавая свой собственный, комбинируя различные элементы блюза, кантри,
    рокабилли и софт-рока.'
