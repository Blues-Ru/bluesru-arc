- id: 572
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-04-07'
  text: 'Это сборник концертных записей Кейла 1990-1996 годов. Диск вышел через 5 лет после альбома Guitar Man, так что поклонники
    Джея ждали эту подборку и встретили ее с радостью. Приятно было узнать, что Кейл играл концерты в 90-х и даже записывал
    их периодически.


    На пластинке 14 композиций, 13 из них с альбомов, а вот одна новая - Old Man. Интересно еще и то, что большинство песен
    сыграно совсем по-другому, не так как в оригинале. Все хиты тут: After Midnight, Call Me The Breeze, Sensitive Kind, Cocaine.


    Обязательный диск для поклонников Кейла и любителей концертных записей.'
