- id: 1196
  author: Артем Липатов
  mark: null
  date: '2008-01-28'
  text: 'Эрик Клэптон впервые спел After Midnight в 1970-м, в одночасье прославив
    малоизвестного блюз-рокера из Талсы, Оклахома – ему посоветовали обратить внимание
    на эту песню друзья, Делани и Бонни Брамлетт, с которыми Жан-Жак Кейл (так звали
    автора песни) некоторое время назад выступал. Джей Джей (так вскорости Жан-Жак
    сократил свое имя – видимо, не желая ассоциаций с известным вольнодумцем Руссо)
    отплатил ему сдержанной благодарностью – авторские за эту песню, а также за Cocaine,
    спетый в 1977 году на суперхитовом альбоме Slowhand, поступали исправно. Оба музыканта
    меж тем шли не пересекающимися путями: Клэптон стал одним из самых знаменитых
    белых блюзменов, в последние годы исполняющим гладкую, ровную, сверхпрофессиональную
    и напрочь лишенную признаков жизни музыку, Кейл получил статус культового музыканта,
    альбомы выпускал нерегулярно, предпочитая спокойную жизнь полуотшельника – но
    плохих среди них не было.


    И вот наконец две параллельных встретились.


    Началась эта история в 2004-м, когда Клэптон организовал в Далласе, Техас фестиваль
    Crossroads, пригласив на него самых знаменитых гитаристов мира (среди которых
    были Джон МакЛафлин, Стив Вэй, Джефф Бек) и,естественно, не забыв о Кейле. На
    его выступлении Эрик появился на сцене безо всякого объявления, как один из музыкантов
    кейловской группы, и публика не сразу узнала в седоватом очкарике суперзвезду
    и организатора мероприятия. Оказалось, им безумно комфортно вместе; более того,
    К и К настолько легко понимали друг друга, что решение о совместном проекте возникло
    само собой.


    Два с небольшим года спустя альбом поступает в подажу. Традиционно-блюзовое название,
    стандартная фотография, полное отсутствие какого бы то ни было дизайна – даже
    такого стилизованного под "простоту", как на последнем альбоме того же Клэптона.
    Материал написан в основном Кейлом (Клэптон написал одну вещь, еще одну – очередной
    блюзовый вундеркинд Джон Майер, а последюю, Sporting Life Blues написал Бог весть
    когда Брауни МакГи) – и это очень хорошо: теплая, интонационно очень искренняя
    авторская интонация Кейла не дает отстраненности и почти что безразличию Клэптона
    проявить себя. Впрочем, он себя проявляет на удивление с приятной стороны. Помнится,
    на недавнем DVD, приложенном к диску с песнями Роберта Джонсона, было отчетливо
    видно: несмотря на все стремления и на все старания, не получается у него корневой
    блюз, the thrill, говоря по-нашему, is gone away. А здесь – все на месте: и грув,
    и уверенная подача… Правда, голос Клэптона почти не слышен, но оно и к лучшему,
    зато дуэт гитар получается очень интересным: чуть небрежная, мягкая и отрывистая,
    с тонким привкусом джаза и кантри у Кейла – и полированная, отточенная, но неожиданно
    расслабленная у Клэптона. Вместе получается отлично.


    С одной стороны, конечно, этого момента фэны ждали давно, с другой – хорошо, что
    альбом получился именно сейчас, а не раньше, что успокоившийся и побитый жизнью
    Клэптон так спокойно идет на поводу у Джей Джея, а не наоборот. Время проявило
    достоинства и недостатки обоих, сгладило острые углы у одного и проявило всю красоту
    музыки другого, и, добавив к этому дуэту таких музыкантов, как Тадж Махал, Джон
    Майер, Элберт Ли, Стив Джордан, Пино Палладино, Натан Ист и ныне, увы, покойный
    Билли Престон (альбом посвящен, в частности, его памяти), мы имеем на выходе альбом
    вневременной ценности. Пусть песенки посвящены сиюминутным случаям, проблемам,
    ситуациям, именно из таких мелочей складывается вечность. Два седых гитариста,
    что сидят у поломанного грузовика на обложке диска, отлично об этом знают.'
- id: 1392
  author: Андрей Евдокимов
  mark: 7
  date: '2008-12-29'
  text: Ожидаемый всем миром альбом может и не понравиться "русскому уху". Вместо
    "героических" гитарных соло – тонкий отыгрыш к вокальным линиям. Пение напоминает
    добродушное бормотание под нос. Да и ценность песен – наполовину в стихах... Исторические
    корни альбома уходят к началу 70-х. Мега звезда и автор его знаменитейших хитов
    не раз выступали вместе, так что идея записать дуэт в студии просто перезрела.
    Изначально она состояла в том, что Кейл спродюсирует альбом Клэптона... А обернулась
    так, что за пульт сел человек из свиты Клэптона. И Кейл записал свой типичный
    альбом, в котором Клэптон сыграл отведенную ему роль. Из 14 песен две написаны
    Клэптоном, плюс один блюзовый стандарт Б.МакГи. Остальное – Кейл. Такова информация.
    А мастерская умная взрослая сдержанная ироничная лиричная музыка – в альбоме.
    (Взгляните на обложку повнимательней – снова Клэптона подставили).
- id: 2124
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2013-04-25'
  text: 'Поскольку Кэйл в течение долгого времени оказывал влияние на творчество Клэптона
    (не говоря уже о том, что два известнейших хита Эрика принадлежат перу Кэйла -
    After Midnight и Cocaine), подобное сотрудничество двух музыкантов уже давно находилось
    в "листе ожидания".


    Получившийся диск все-таки скорее диск Кэйла, нежели Клэптона (Кэйл написал 11
    из 14 треков), тем не менее это бесспорно совместная работа - музыканты и поют,
    и солируют, сменяя друг друга. Пластинка "неспешная" и расслабленная, причем отличить
    где Кэйл, а где Клэптон, непросто. Добротная работа, на которой музыканты получают
    удовольствие от музыки, которую они создают.


    Номинация на Грэмми в категории "лучший альбом современного блюза" в 2007 году.'
