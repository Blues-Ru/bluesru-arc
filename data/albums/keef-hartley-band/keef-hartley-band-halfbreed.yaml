  date: '2017-07-27'
  text: 'Киф Хартли - знаменитый английский ударник, в свое время заменивший Ринго
    Старра в группе Rory Storm and the Hurricanes. Впоследствии он почти три года
    играл и записывался с The Artwoods (где числился также небезызвестный клавишник
    Джон Лорд), а затем вошел в состав Блюзбрейкеров Джона Мэйолла. С Джоном Киф сотрудничал
    на альбомах Crusade, Diary Of A Band и Blues Alone. Затем по рекомендации Мэйолла
    Хартли создал собственную группу "The Keef Hartley (Big) Band", игравшую смесь
    рока, блюза и джаза. Keef Hartley Band выступала на Вудстоке в 1969 году и выпустила
    4 довольно интересных альбома. На дебютном альбоме Halfbreed компанию Хартли составили
    такие известные в музыкальном мире Англии персоны, как поющий блюзовый гитарист-виртуоз
    и аранжировщик Миллер Андерсон, басист Гэри Зейн и саксофонист Крис Мерсер.


    Альбом начинается с телефонного звонка, которым Джон Мэйолл официально увольняет
    Хартли из Блюзбрейкеров. В музыкальном плане на диске представлен коктейль из
    блюза и рока с изрядной примесью джаза, виртуозно исполненный группой под руководством
    Хартли. Приблизительно в этом же направлении джаз-блюзового фьюжена двигался в
    то время и сам Джон Мэйолл. Кроме базового квинтета музыкантов, имеется также
    мощная духовая секция (а аранжировщик духовых трубач Генри Лоутер играл также
    и на скрипке). Альбом был записан в октябре и декабре 1968 года в лондонских студиях
    Декка, продюсировал Ник Слэвен.


    Альбом, ставший классикой, является наглядным свидетельством того, что в то время
    в Англии создавалась крайне интересная музыка на стыке жанров.'
