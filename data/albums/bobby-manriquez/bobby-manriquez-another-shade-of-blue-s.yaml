- id: 114
  author: Алексей Калачев
  mark: 6
  date: '2003-03-18'
  text: Еще один странноватый поющий гитарист с испанской фамилией. А последняя деталь может посеять надежду на то, что диск
    будет нести в себе заряд иберийской или латиноамериканской мелодичности. Но вы будете разочарованы! Скорее этот нестандартный
    диск нужен тем, кто поклоняется блюзовым упражнениям Скотта Хендерсона. Альбом раздвигает представления о том, что может
    делать ученик школы Стиви Рэя Вона с современным гитарным блюзом. Жесткий, почти скрежещущий звук на фоне необычных гармоний.
    Хотя альбом точно не отпугнет и не вызовет аллергии у любителей блюз-роковой традиции.
