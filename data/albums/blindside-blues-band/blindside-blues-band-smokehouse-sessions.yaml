  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-08-12'
  text: 'Для тех, кто помнит одноименный диск Майка Онешко, записанный в 2004 году под именем Mike Onesko Blues Band, данная
    работа не будет откровением. Зачем Майк решил через пять лет записать аналогичную пластинку под другим именем (на этот
    раз это Blindside Blues Band - напомню, что так называлась первая профессиональная группа Майка, созданная с помощью президента
    Shrapnel Records Майка Варни), сохранив при этом половину треков и почти не изменив обложку, знает только он сам.


    В итоге поклонники получили еще один диск тяжелого энергичного блюз-рока с мощными рифами и довольно жестким обращением
    с блюзовой классикой (на диске только три собственных композиции, остальное каверы). Блюзовым пуристам результат вряд
    ли придется по душе, тогда как поклонники тяжелого блюз-рока наоборот наверняка оценят очередную работу Майка, ибо она
    характеризуется профессионализмом, хорошей техникой игры и изрядной смелостью в подходе к материалу.'
