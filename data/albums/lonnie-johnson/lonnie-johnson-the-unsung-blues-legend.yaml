reviews:
- id: 673
  author: Александр Панин
  mark: 6
  date: '2005-05-24'
  text: Очень странный диск. Он был записан в 1965 году дома у некого Берни Страссберга
    на непрофессиональном оборудовании. Хоть сам Берни пишет, что "I think the sound
    is really good", это, конечно же, совсем не так. Высокие частоты звучат глухо,
    гитара Лонни - железно, хлопки присутствующих при записи - деревянно. Настоящий
    бутлег, одним словом. Джонсон исполняет много не очень вдохновляющих поп-джазовых
    песен, однако есть и ряд блюзовых, приблюзованных и просто интересных вещей, как
    то St.Louis Blues c изумительным гитарным соло в концовке, столь же эффектные
    New Orleans Blues и There's Been Some Changes Made, композиция Бесси Смит Back
    Water Blues. Отмечу и неплохую версию Summertime. Но качество записи временами
    очень напрягает.
