  author: Дмитрий Казанцев
  mark: 10
  date: '2005-08-01'
  text: Фолк, блюз, кантри, roots rock, singer/songwriter, акустические гитары, перестроенные
    гитары, добро, мандолины, воздух, мелодии и кайф. Есть песни вообще без барабанов
    и баса. Самый красивый и спокойный альбом Джона на тот период. Настоящая мудрая
    "сельская" музыка. Голос Хайатта очень силен и убедителен, мелодии льются и нет
    им конца. Супер!
