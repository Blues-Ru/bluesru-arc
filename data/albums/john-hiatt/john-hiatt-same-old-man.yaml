- id: 1319
  author: Андрей Евдокимов
  mark: 7
  date: '2008-07-20'
  text: 'Давайте, с самого начала признаем: голос у него довольно противный. И диапазон
    крохотный, и поет в нос. Зато его песни делают хитами артисты, которых именуют
    "яркими индивидуальностями" - от вежливой рыжей Бонни Рэйт до сухопарого старого
    хулигана Игги Попа.. Сам Хитт представляет собой удивительно нетипичное явление
    на американской музыкальной сцене. Он не входит в обойму героев желтой прессы
    и не выступает на стадионах. Однако вот уже несколько десятилетий незримо постоянно
    присутствует и пользуется большим уважением. Его песни сочетают разум и чувственность,
    именно поэтому они и цепляют надолго. В песне Cherry Red он бьет Брюса Спрингстина
    по чести торжествующей печали. Для понимания альбома стоит знать, что записан
    он с группой the North Mississippi Allstars, а название перекликается с древней
    песней Хитта Angry Young Man. Все звучит очень по домашнему, с верным драйвом.
    Хорошие умные песни стоит послушать, чтобы убедиться, что американцы не такие
    тупые, как об это рассказывает лысый российский завсегдатай Брайтон-бич.'
