- id: 789
  author: Дмитрий Казанцев
  mark: 7
  date: '2005-08-07'
  text: 'Фирма Fuel 2000 решила издать концертные записи Алберта из Монтре 1975 года на двух дисках. Каждый диск длится около
    45 минут, так что это не полный концертный двойник в компакт-дисковом понимании.


    На двух дисках всего 12 песен (по 6 на каждом), почти все они через чур затянуты, хотя некоторые джемы довольно интересны.
    Рори Галлахе играет соло в "As The Years Go Passing By", Луизиана Рэд подыгрывает на гитаре в "Jam In A Flat", в ней же
    поет Лоуэлл Фулсон. С Кингом тут играет малый состав: клавиши, трое духовиков, бас и барабаны.


    Записи хорошего качества, а вот играют музыканты не всегда точно и качественно. Можно бы было убрать пару треков и сделать
    хороший одинарный альбом. В любом случае, это интересные записи, особенно для тех, кто любит концертники.'
