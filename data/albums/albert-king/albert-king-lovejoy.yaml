- id: 151
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-08-18'
  text: 'Это шестой альбом Алберта на фирме Стакс. Можно считать, что это вообще его шестой альбом, ибо до этого были только
    сборники и непонятное издание на Чесс вместе с Отисом Рашем.


    Это уже шестой альбом, но это лишь начало его звездной карьеры на Стаксе. Born Under A Bad Sign был великолепен, Live
    Wire/Blues Power - не самый лучший концертник по записи и исполнению, Blues For Elvis - это почти шутка - все песни Элвиса!!!,
    Years Gone By - необходимая компиляция, но не более того, Jammed Together записан на троих + Стив Кроппер и Попс Стейпл,
    был еще Lost Session под руководством Мэйолла, но он вышел гораздо позже.


    Так что получается, что это лишь второй НОРМАЛЬНЫЙ номерной, продуманный альбом. Неплохо продуман. Продюсер и автор многих
    вещей - Дон Никс, этот плохо не делает никогда.


    Странно, но по хитам (не путать с хитовостью самого альбома) - это самый мощный альбом Алберта! Тут не обошлось без сильного
    влияния Таж Махала - сразу две вещи с его второго альбома (обе хиты до него и после) - Corrina, Corrina и She Caught The
    Katy And Left Me A Mule To Ride. Во как! Но самое удивительное - это начало альбома - Honky Tonk Women Роллингов!


    И что же мы имеем тут? Надо помнить, что сам диск писали в 70-м, а вышел он в 71. Есть тут и РОК (вот странно-то), есть
    кантри-блюз, есть соул, фанк, блюз и даже неблюзовая баллада (последний трек Like A Road Leading Home). Все вместе очень
    интересно.


    Альбом не длинный - 36 минут, всего 9 треков, все разные. Это здорово! Ну а где же минусы? Да их почти нет. Разве что
    немного странный состав для Стакса - из "букеров" только Дональд Данн (бас), да еще каким-то странным образом затесался
    не менее великий Джим Келтнер на барабанах. Может еще немного не совсем сформированный стиль блюз-фанка, который Кинг
    довел до совершенства в 70-х. Тут же еще блюзовый по звуку альбом. То есть он хорош и по музыке, и по игре, и записи -
    Стакс, все-таки.


    Отличное начало великого великана! Но сливки дальше. Я бы дал этому альбому твердые 4 балла. Почему не 5? Ну не знаю.
    Считайте, что баллада в конце не нравится ;)


    Эту пластинку должен иметь каждый, кто называет себя поклонником блюзов (для любителей фанка и соула - тоже "маст", рокеры
    могут отдыхать - Хонки Тонк в этом испонении им врядли понравится).


    Стакс рулез - как говорят наши сисадмины или как их там...'
- id: 2339
  author: Олег Пчелкин (oleg_spb)
  mark: 8
  date: '2019-10-02'
  text: 'Альберт Кинг имел самый большой успех в своей карьере тогда, когда ему удалось использовать госпел-соул специализацию
    фирмы Stax и ее сессионных исполнителей и выпустить отличный продукт Born Under A Bad Sign в 1972 (сборник синглов, выпущенных
    этой фирмой, говоря прямо). Альбом Lovejoy, который был выпущен годом ранее, обходится без духовой секции и знаменит обилием
    авторских вещей продюсера Дона Никса, которые можно изощренно квалифицировать , как " прифанкованный американа-соул-блюз".
    Но можно этого и не делать, дело вкуса.


    Название альбома - дань уважения приютившему Кинга в середине 1950х городку Лавджой, что в Иллинойсе. Во времена записи
    альбома Лавджой был его местом жительства.


    Самой интересной вещью на этом альбоме, вероятно, является кавер-версия The Rolling Stones "Honky Tonk Woman". Альберт
    Кинг был известен своим бурным публичным негодованием в адрес белых британских рок-звезд, которые заработали миллионы
    долларов, тупо копируя его технику. Cream''s "Strange Brew", например, печально известен тем, что Эрик Клэптон играет
    одно из гитарных соло Кинга почти нота в ноту. Может быть, "Honky Tonk Woman" ему навязал Stax, а может он просто хотел
    показать британским "детям", как такое играется правильно.


    Помимо еще одного кавера, симпатичной версии хита Тадж-Махала ""She Caught The Katy (And Left Me A Mule To Ride)", остальная
    часть альбома заполнена оригинальными песнями продюсера Дона Никса. "Everybody Wants To Go To Heaven демонстрирует, как
    Альберт Кинг использует свой грубый баритон в противовес капризному давлению органной партии. "Bay Area Blues" - узловатый,
    фанковый ритм вокруг рассказа о соблазнах гастролирующего музыканта. "For the Love Of A Woman" - обязательная блюзовая
    песня о мучительной любви.'
