  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-07'
  text: 'Алберт Кинг умер в 1992 году, а уже в 1993 фирма Рино выпускает это огромную коллекцию его записей 1953-1983. На
    двух компакт-дисках записано 39 песен разных периодов, с различными составами, концертные и студийные, альбомные и с синглов.
    Есть тут несколько довольно редких треков, как из раннего периода до Стакса, так и 70-х годов.


    Отличный сборник для тех, кто только начинает изучать Блюз и Алберта Кинга.'
