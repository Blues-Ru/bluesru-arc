  author: Дмитрий Казанцев
  mark: 9
  date: '2003-08-19'
  text: 'Есть компиляции ненужные, а есть хорошие. Вот эта - супернужная!


    Вышла под лейблом Stax в 94 году, содержит редкие и неизданные вещи АК за период 1970-1974 - лучшие годы Кинга, пожалуй.


    Тут 9 вещей на 52 минуты! Отличные вещи! Фанк и блюз, блюз и фанк.


    Играют с ним стаксовские люди - Дональд Данн, Эл Джексон, Уилли Холл и т.д. Записи отлично сохранились и прекразно звучат.


    Начинается альбом с инструментала Cold Sweat - это огромный хит Джеймса Брауна. Кинг очень здорово солирует в этом номере.


    Can''t You See What You''re Doing To Me - отличный блюз с интересным ритмом.


    Funky London - тайтл-трек и лучший номер здесь! Великолепный инструментал в стиле фанки.


    Lonesome - настоящий минорный блюз Кинга аж на 9 минут - это очень интересно в таком исполнении и с такими дудками.


    Bad Luck - опять жесткий фанк-блюз с вокалом! Звучит очень убедительно! Басовая линия выше всяких похвал, так умеют играть
    только на Стаксе и Митерз!


    Sweet Fingers - очень интересный трек с хитрыми амбиентными звуками - инструментальный соул-фанк.


    Finger On The Trigger - неприличное название, но какая же классная песня - Got my finger on your trigger, baby, I''m gonna
    shoot you down! Первоклассный фанк-блюз!


    Drivin'' Wheel - классический среднетемповый шаффл с вокалом в отличном исполнении.


    Lovingest Woman In Town - а теперь классический блюзовый номер с вокалом аж на 11 минут!


    Что же ставить? 4 балла! Мало? Но ведь это компиляция с заваленной концовкой - там два стандартных номера аж на 16 минут
    длиной! Могли бы по-другому составить что ли. Первые 7 песен - 5 баллов - отличные!


    Кинг умер, да здравствует Стакс и его период на нем!'
