- id: 686
  author: Дмитрий Казанцев
  mark: 5
  date: '2005-05-27'
  text: 'Это второй альбом Кинга на лейбле Stax. Нарезка с концерта - всего 6 треков на 40 минут. Совсем мало пения, но много
    игры на гитаре. Нельзя сказать, что игра это очень интересная и разнообразная. Группа играет неплохо, но это не идет ни
    в какое сравнение со студийными работами на Стаксе. Звука на диске тоже нет; совсем неинтересно слушать подобное.


    Самый слабый альбом Алберта. Если не хотите разочароваться в величайшем артисте, не покупайте этот альбом первым. Я его
    купил исключительно для полноты коллекции.'
