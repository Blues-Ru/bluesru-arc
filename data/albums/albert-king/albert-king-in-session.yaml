- id: 790
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-07'
  text: 'В 1999 году фирма Стакс решила издать совместные живые записи Алберта Кинга и Стиви Рэй Вона, сделанные еще в 1983
    году, когда вышел лишь дебютный альбом Стива и он только что покинул группу Дэвида Боуи.


    На диске 11 треков, но лишь 7 из них - песни; 4 трека - это разговоры Кинга и Вона о жизни и о блюзе. Записи великолепного
    качества, игра и пение тоже. Единственный минус этого издание - это то, что на пластинке записаны известные и заигранные
    темы: "Stormy Monday", "Pride And Joy", "Blues At Sunrise", "Don''t Lie To Me".'
