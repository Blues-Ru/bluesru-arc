reviews:
- id: 279
  author: Дмитрий Казанцев
  mark: 10
  date: '2003-11-24'
  text: 'Это седьмой студийный альбом Кинга на Стаксе. Как и на предыдущем с ним играют
    Bar-Kays, (Isaac Hayes) Movement; добавились еще и великолепные Memphis Horns.


    Альбом очень длинный - 9 треков на 46 минут. Много импровизации, грува, соула,
    фанка и блюза. Можно и не говорить о том, что игра и аранжировки на топовом уровне.
    Альбом похож на предыдущий, но тут уже немного другой саунд и следующий шаг в
    развитии аранжировок. Хочу отметить несколько лучших треков: Playing On Me; Flat
    Tire; I Can''t Hear Nothing But The Blues; Travelin'' Man; Crosscut Saw (тут она
    просто неотразима!).


    Оценка 5 баллов и полное восхищение музыкой Алберта! Как и предыдущий, этот альбом
    из ТОП-5 альбомов Алберта!


    I wanna get funky, I wanna get down...'
