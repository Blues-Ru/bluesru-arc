  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-07'
  text: Хороший, длинный сборник двух великих соул-блюз-артистов на Стаксе. 6 песен Алберта Кинга и 7 песен Литтл Милтона.
    Шикарные записи 70-х годов, изданные на оригинальном лейбле в 1979 году (КД издан в 1991 году). Ценность этого сборника
    еще и в том, что на нем есть вещи, которые не выходили на альбомах. Обложка тоже радует - посмотрите на лица Кинга и Милтона.
