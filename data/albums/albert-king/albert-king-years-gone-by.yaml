- id: 202
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-09-02'
  text: 'Это третий альбом Алберта на Стаксе. Первым был знаменитый Born Under A Bad Sign в 67 году, потом шел не самый лучший
    лайв Live Wire / Blues Power (1968). Можно сказать, что на третьем альбоме все стало еще лучше: Кинг играет восхитительно,
    ритм-секция стала еще четче, добавилось драйва, и запись сильно улучшилась.


    Здесь 11 треков на 34 минуты, альбом слушается легко, и есть желание еще раз его прослушать. Все треки очень хороши записаны
    и спродюсированы, нет никакой каши, и каждый инструмент четко звучит и "стоит" на своем месте.


    Wrapped Up In Love - очень красивый блюз в бите!


    You Don''t Love Me (Instrumental) - инструментальная версия этой знаменитой композиции. Мы знаем много ее версий, но эта
    очень интересна и воспринимается очень новой.


    Cockroach - классный блюз в бите!


    Killing Floor - версия знаменитого хита Хаулин Вулфа. Отличный темп, смягчен рифф, и из-за этого вещь слушается очень
    солидно и в груве.


    Lonely Man - буги-блюз в темпе и с классными духовыми и соул-настроением.


    If The Washing Don''t Get You, The Rinsing Will - прекрасный блюз с интересным текстом и ритмическим рисунком.


    Drowning On Dry Land - классический блюз в стиле Кинга.


    Drowning On Dry Land (Instrumental) - тут звучит инструментальная версия этой вещи; Кинг импровизирует и делает это отлично
    (как и на всем альбоме, впрочем).


    Heart Fixing Business - еще один классический блюз.


    You Threw Your Love On Me Too Strong - опять классический блюз.


    Sky Is Crying - классика Кинга, эту вещь знают и любят почти все поклонники блюза.


    Оценка 4 балла. Все отлично, но слишком уж однообразна вторая сторона пластинки. Если первые 6 вещей все яркие и оригинальные,
    то последние 5 - традиционные блюзы без какого-то новаторства и изюминки. В любом случае, этот альбом - классика Алберта
    и необходим в каждой блюзовой коллекции. Его игра и пение бесподобны, группа играет великолепно!'
