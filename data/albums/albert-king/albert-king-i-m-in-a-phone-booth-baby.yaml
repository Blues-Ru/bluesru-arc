  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-02'
  text: 'Это последний (14-ый) студийный диск Алберта. Умрет он только через 8 лет после этого альбома, но в студию больше
    не вернется. Можно сказать, что этот диск - логичное продолжение предыдущего альбома 1983 года, но тут добавились духовые
    и чуть сменилось настроение. Тони Ллоренс на клавишах (на диске написано только пианино, но на записи отчетливо слышен
    Хаммонд-орган), Гас Торнтон на бас-гитаре, Майкл Ллоренс на ударных, Кэл Люистон на трубе и Стив Дуглас на тенор- и баритон-саксофоне.
    Нельзя сказать, что духовые много добавили (где-то их просто нет), а вот отсутствие ритм-гитариста сразу слышно: звук
    стал еще более "прозрачный" и традиционный. Все же ритм-гитара добавляет определенный ритмический паттерн и перкуссионный
    призвук; тут этого нет.


    На альбоме всего 9 песен, а длится он около 39 минут. Название альбом получил по песне Роберта Крэя Phone Booth; это минорный
    соул-блюз, открывающий эту пластинку. Дальше исполняется знаменитая (и надоедливая) Dust My Broom; непонятно зачем, но
    Алберт делает это лучше многих. Неожиданно интересно звучит МИНОРНОЕ исполнение нетленки The Sky Is Crying; хорошая идея,
    да и сыграно с грувом! Brother, Go Ahead And Take Her - обычный среднетемповый нудный блюз с духовыми "пачками". А вот
    Your Bread Ain''t Done заставляет снова порадоваться; тут есть и грув, и звуки южного соула и блюза (вот уж где дудки
    и звук Хаммонда точно на своем месте). Firing Line - очень классный и известный блюз в бите с интересным риффом и темой!
    The Game Goes On - groovy, minor, funky, great (need I say more?) Truck Load Of Lovin'' - у Алберта в 1976 году был целый
    альбом с таким названием, а на нем была эта роскошная блюзовая вещь! Отличный грув и басовый рисунок; Хаммонд-орган тоже
    на месте. Последний трек альбома - You Gotta Sacrifice - блюзовое наставление женщинам и вполне съедобный трек.


    Алберт в свои 60 лет был в отличной форме. Он прекрасно пел, играл и шутил. У него остался ТОТ фил соул-блюза, который
    он сам нашел и культивировал еще в середине 60-х (не без помощи Stax Records). Для меня Алберт гораздо интереснее и больше
    БиБи и даже Фредди, но все они довольно разные, так что всегда есть что послушать. Кинг записал 14 отличных студийных
    альбомов и оставил огромное музыкальное наследие для блюз- и соул-музыки. Его манеру копировали многие, взять хоть того
    же Стиви Рэя.'
