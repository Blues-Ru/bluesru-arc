- id: 273
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-11-21'
  text: 'Один из "редких" альбомов Алберта. Он выходил на КД, но уже давно out-of-print, так что если попадется, берите!


    Пластинка в духе АК 70-х, но есть свой своеобразный саунд. Будто бы еще больше дудок и женских подпевок. Играет большой
    джаз-фанковый коллектив, и среди них великие: Джо Сэмпл, Уа Уа Уотсон, Чак Рэйни, Джеймс Гадсон. С такими музыкантами
    трудно записать плохой альбом; Алберт и не собирался этого делать. Его пение и игра на гитаре как всегда на высоте. Аранжировки
    очень интересные, но слегка попсовые - дань эпохе диско, ничего не поделаешь. Тем не менее, здесь больше блюзов, чем на
    его почти чисто "фанковых" альбомах 70-х.


    На альбоме 8 композиций и длится он около 40 минут.


    Cold Women With Warm Hearts - очень бодрый блюз со всей атрибутикой соула - подпевки, дудки...


    Gonna Make It Somehow - веселый танцевальный фанк-блюз.


    Sensation. Communication Together - интересный блюз с классной поддержкой струнных. Звучит как соул, но Кинг делает свое
    блюзовое дело.


    I''m Your Mate - с первых нот идет полный кайф по фанку!


    Truckload Of Loving - тайтл-трек отличный! Шикарный блюз с интересным риффом и гитарами. Не забывайте, что Wa Wa Watson
    все время на второй гитаре!


    Hold Hands With One Another - тут есть проблемы. Это уже откровенное диско и даже Алберт не может выручить на дурацком
    припеве. Жаль.


    Cadillac Assembly Line - а вот это уже отлично! Прифанкованный грувовый блюз в миноре с восхитительной аранжировкой!


    Nobody Wants A Loser - традиционный блюз с классными дудками!


    Я бы поставил этому альбому 4 балла. Есть пара слабых треков, и мы знаем, что у АК есть десяток шикарных альбомов в 70-х,
    за которые он получил свои 5 баллов. Странно, что здесь больше блюза, но и больше попсовых аранжировок. Играть блюз-фанк
    с жестким звучанием у АК получалось лучше!'
