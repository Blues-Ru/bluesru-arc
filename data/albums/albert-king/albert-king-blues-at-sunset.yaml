- id: 792
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-08'
  text: 'Концертный номерной альбом Кинга на Стаксе. 1973 год - лучшее время для Алберта и для фанки-соул-блюза вообще.


    Гитара Алберта Кинга звучит с перегрузом, это больше похоже на блюз-рок - интересно и забавно одновременно. Стиви Рэй
    говорил, что он увидел Кинга и познакомился с ним именно в 1973 году, и с тех пор только и делал, что копировал его игру
    (похоже, что он был на подобном концерте).


    На диске 9 композиций, все они известные и популярные. Алберт отлично поет и немного рассказывает; где-то он говорит опасную
    фразу: "Если вы не врубаетесь в блюз, то у вас в душе дыра!..."


    Концерт живой, но сыграно все не совсем точно и идеально. Кого-то это испугает, а кому-то это понравится. В любом случае,
    это очень хороший лайв, он гораздо интереснее его первого концертника 1968 года.'
