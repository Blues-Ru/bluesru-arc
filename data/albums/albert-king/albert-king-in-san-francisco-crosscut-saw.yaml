  author: Дмитрий Казанцев
  mark: 7
  date: '2005-04-02'
  text: 'Это предпоследний студийный альбом Алберта. Он выпущен на лейбле Stax. 1983 год больше ассоциируется с музыкой Duran
    Duran, чем с музыкой блюз/соул, но тем не менее, Алберт продолжал работать в студии и на концертах, и делал это довольно
    успешно.


    С его последнего студийного диска прошло целых 5 лет, и очень много изменилось в музыке и моде за эти годы. Даже у Алберта
    на Стаксе появился этот дурацкий призвук "дыщ-дыщ" на барабанах, грув и фанк пропал почти полностью, есть ощущение нехватки
    звука органа Хаммонда. Кинг вернулся к старому доброму блюзу и к малому составу (слава Богу; не хватало нам еще и пластиковых
    клавиш).


    На диске вместе с Кингом играют: Лэрри Бертон на ритм-гитаре, Тони Ллоренс на пианино, Гас Торнтон на ударных и Майкл
    Ллоренс на басу. Играют они все очень классно и весело. Пианист просто умница. Но сам Алберт тоже молодец. Его вокал по-прежнему
    однообразен и глубок, а его гитара стала будто еще лучше с годами. Заметьте, на альбоме вообще нет дудок, - это редкость
    для Алберта!


    Альбом когда-то состоял из 7 треков и назывался San Francisco ''83, но на КД изменили название и добавили аж два бонус-трека
    на 9 минут. Самое интересное то, что на диске записаны 4 песни самого Алберта! Надо отметить классное исполнение отличной
    песни Мадди Honey Bee, обработку вещи БиБи Ask Me No Questions и знаменитую I''m Gonna Move To The Outskirts Of Town.
    Но лучшие треки на альбомы все же написаны самим Албертом. Это почти грувовая Floodin'' In California и музыкально-речетативная
    история Match Box Blues. Кинг был явно в форме в эти годы; его игра и пение is second to none да еще и песни пишет!


    Надо отметить еще, что бонусы очень хорошие! Crosscut Saw в новом исполнение звучит сухо, но с грувом и кайфом; слышно,
    что Алберту приятно вспоминать середину 60-х и начало своего восхождения к звездам. В этом треке появился звук Хаммонда,
    что вдвойне приятно! Второй бонус - Why You So Mean To Me - симпатичный бодрый блюз с риффовой бас-гитарой и обвинительным
    текстом.


    Просто хороший альбом Кинга с необычно сухим, простоватым звуком. Зато можно разобрать each and every sound на альбоме.
    Ребята-музыканты - молодцы! Алберт в форме. Ничего нового, но это музыка, а разе это не самое главное?'
