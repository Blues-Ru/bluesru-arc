- id: 281
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-11-24'
  text: 'Блюз развивался в разных направлениях, как мы знаем; так вот Алберт, записав
    этот альбом на Стаксе, стал развивать блюз еще в одном очень интересном направлении.
    Можно назвать это соул-блюзом, фанк-блюзом, Мемфис-блюзом, южным-блюзом, блюз-роком.
    В любом случае, стиль Кинга - один из самых интересных в блюзе вообще.


    До этого альбома у Алберта были только синглы и два сборника. Синглы не плохие,
    но никого они не удивили; сборники редкие и не очень интересные. Именно поэтому
    мы будем считать этот альбом на Стаксе первым нормальным диском Алберта.


    На всем альбоме играют великолепные Booker T. & The MGs и духовая секция Стакса.
    Это не могло не стать хитом. Но дело не только в этом. На альбоме великолепный
    материал и много новых ритмов и риффов для того времени. Более половины композиции
    с альбома потом успешно переигрывалось блюз-рокерами и рокерами вообще. Я выделю
    основные "сливки" этого великолепного диска: Born Under A Bad Sign; Crosscut Saw;
    Oh, Pretty Woman; The Hunter; As The Years Go Passing By.


    Несмотря на все великолепие основных треков, я бы поставил альбому только 4 балла.
    На альбоме есть провальные треки типа Kansas City, I Almost Lost My Mind, The
    Very Thought Of You. Позднее выяснится, что Кинг любит попсовые блюз-соул-баллады,
    но на этом диске они слушаются странно и неорганично. Еще один недостаток - это
    очень плохое качество записи альбома.


    Для полного представления о работе Кинга 66-67 я советую сборник King Of The Blues
    Guitar (Atlantic 1969) - на нем полностью первый альбом Алберта плюс 6 отличных
    синглов и ауттэйков.'
