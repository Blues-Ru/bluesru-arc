  author: Дмитрий Казанцев
  mark: 2
  date: '2005-08-08'
  text: 'Полупиратский итальянский сборник на фирме Blues Encore. Не путайте это издание с концертником 1988 года на Стаксе.


    На диске 16 песен Кинга, что-то с ранних синглов, а что-то уже с периода на Стаксе. Запись плохая, как и все на этом лейбле.
    Первые 7 треков редкие, но все они есть на дисках типа Big Blues, Travelin'' To California, Door To Door и других американских
    сборниках.


    Этот диск стоит купить разве что за доллар, да и то только тогда, когда нет других записей Алберта.'
