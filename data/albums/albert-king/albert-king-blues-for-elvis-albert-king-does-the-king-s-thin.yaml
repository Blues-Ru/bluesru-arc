- id: 152
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-08-18'
  text: 'Название на КД - Blues For Elvis.


    Обложка отличается от варианта на AMG - здесь Digipack 1991 копирайт Fantasy - в оригинале Stax!


    Ну что же, надо с чего-то начать.


    Во-первых, я не считаю Элвиса Королем (да простят меня его фанаты и прочие ракабильщики). Во-вторых, я не считаю БиБи
    королем блюза (да простит меня мой любимый сладкий попсовый ББК ;) и АЕ тоже). Я считаю АЛБЕРТА КИНГА королем блюзовой
    гитары и вообще королем блюза! Да, да! Огромный рост и вес, искренняя игра на гитаре, непопсовый интересный вокал, почтенный
    возраст - все мне это очень напоминает короля ;) Фредди был слишком молод и моден, чтобы вообще думать о нем, как о короле,
    - так себе прынц ;)


    Короче, мне нравится второе название альбома больше. Король Алберт записал блюзы для Элвиса.


    Теперь о музыке. 9 треков - 37 минут - мой любимый формат!


    Какие песни? Да все известные! Знаю их с детства (сам не знаю, откуда) и могу спеть и сыграть. Да, вы тоже их знаете,
    конечно.


    Альбом отлично записан. Продюсеры - Дональд Данн и Эл Джексон (это их я называю "букерами"). На диске заявлен лишь малый
    состав, но играют тут и дудки вовсю - КЛАССНЫЕ дудки.


    Что за музыка? Не рок-н-ролл. Не блюз. Не фанк (хотя местами их уже "тянет" на mother for ya...)


    Отличное сочетание хот-соула, блюза, южного соула, мемфис-соула, джаза и ритм-н-блюза. Соул это, короче.


    Аранжировки отличные, игра и пение тоже. Вот если бы Элвис и его охламоны так умели. А ведь из одного города люди.


    Можно ли считать это альбом в стиле "МУЗЫКАНТЫ ШУТЯТ"? Да, можно, но я бы был рад, если бы все так шутили. Это не клоунада,
    не пародия, не самодеятельность - это хорошо сделанная пластинка в шуточном стиле.


    Тут трудно говорить о минусах. Скорее всего, это ИЗВЕСТНОСТЬ всего материала - его так заиграли все подряд, что даже в
    исполнении Реального Короля это уже не 100%-ное попадание. А потому ставлю этой пластинке всего 4 балла. А вот за качество
    записи - твердую 5! Не забывайте про год - писали в 68-ом, а первый альбом Алберта ведь плохо прописан.


    Лучшая песня? Мне кажется That''s All Right Mama - это ведь корневой блюз Крудупа, и АК его отлично чувствует. А еще очень
    сильна аранжировка и БАС в Don''t Be Cruel - hats off to Donald Duck Dunn!


    Необходимый диск для любителей блюза, рок-н-ролла и южного соула (фанкерам и рокерам отдыхать - не их это блин).


    Стакс - рулез 2 раза!'
