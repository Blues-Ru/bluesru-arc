- id: 646
  author: Александр Панин
  mark: 9
  date: '2005-05-20'
  text: 'Второй альбом Ти-Модел Форда на Фэт Поссуме. Здесь обычная для фэтпоссумовцев простая риффово-гипнотическая музыка,
    преимущественно на диске только электрическая гитара Форда и ударные. Начало почти что a cappella, но оно очень эффектно
    переходит в клевый рифф, задавая настроение всему альбому. Настроение немного портит седьмая вещь, представляющая собой
    современный ремикс, но восьмая сразу же заставляет забыть о предыдущей: под названием The Old Number скрывается отличный
    кавер Catfish Blues! А заключительным десятым треком идет очень неплохой акустический номер.


    Задорный и дикий блюз.'
