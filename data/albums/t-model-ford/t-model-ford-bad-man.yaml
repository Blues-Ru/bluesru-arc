  date: '2002-10-26'
  text: Блюзовый примитивист, в "стиле Северной Миссиссипи" - электрогитара + барабаны,
    бесконечное повторение одной и той же музфразы или конструкции бессчётное количество
    раз. Бренчание и подвывание, бренчание и подпевание. Если вы не насытились разновидностью
    блюза, которую культивирует фирма "Фэт Поссум", вот – ещё. Диск записан действительно
    двумя фолкперсонажами на "кухне", в бытовых условиях.
