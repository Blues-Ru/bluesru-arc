- id: 2074
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2012-08-15'
  text: 'Первый альбом Лютер Аллисон выпустил в 1968 году, и затем до 1979 года записывался на родине, но к этому моменту
    интерес американской публики к блюзу был крайне низким, и Лютер переехал в Париж, поскольку в европейских музыкальных
    клубах он всегда был востребован. За следующие 10 с лишним лет Лютер стал довольно популярен в Европе, но был практически
    забыт на родине. Возвращение его в США состоялось в 1994 году благодаря контракту с фирмой Аллигатор и выпуску альбома
    Soul Fixin'' Man (также выпущенного в Европе фирмой Provogue под именем Bad Love), и возвращение это было поистине триумфальным,
    а популярность в США росла экспоненциально.


    "Soul Fixin'' Man - это альбом, который я всегда хотел записать"- говорил Лютер. "У нас было достаточно времени для записи,
    нужный продюсер, подходящие музыканты, а также отличная атмосфера в студии." Продюсером был знаменитый Джим Гэйнс, а аранжировки
    выполнены самим Лютером и его верным другом Джеймсом Солбергом.


    1995 год принес ему награды имени У.К.Хэнди по 5 основным категориям и 10 итоговых за год премий ведущего блюзового журнала
    Livin'' Blues.


    Лютер продолжал интенсивно гастролировать и записываться до июля 1997 года, когда ему был поставлен страшный диагноз -
    неоперабельный рак легких. И всего через месяц после этого знаменитого блюзмена не стало, но его музыка по-прежнему с
    нами. Все альбомы Лютера, записанные на фирме Аллигатор, очень и очень хороши - мощный, исключительно профессионально
    сыгранный сырой и жесткий гитарный блюз, время от времени украшенный духовой секцией.'
