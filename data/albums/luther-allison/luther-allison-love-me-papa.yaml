- id: 715
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-06-10'
  text: 'Пятый альбом Лютера; он был записан в Париже и вышел на французском лейбле
    Black & Blue. В оригинале было 6 треков, но на компакт-диске добавлено еще три.
    Могу сказать сразу, что эти 3 бонуса сильно усиливают диск. Дело в том, что на
    первых шести треках Лютер играет традиционный блюз с почти одинаковым темпом и
    ритмом, и только "Feelin'' So Good" отличается. Мы же знаем Эллисона как музыканта,
    который любил смешивать блюз, соул, фанк и рок; тут этого вообще не происходит.
    Более того, несколько вещей сильно затянуты, а та энергия и эклектика, которая
    была на его ранних дисках, почти отсутствует.


    Тем не менее, это хорошая блюзовая работа Мастера, но не более того.'
