  author: Дмитрий Казанцев
  mark: 8
  date: '2005-06-05'
  text: 'Третий альбом Эллисона снова вышел на Gordy (подразделение Motown), как и
    второй его диск. Лютер продолжает развивать свой стиль на стыке блюза, рока и
    соула. На альбоме по-прежнему малый состав, тем не менее (бас, барабаны, ритм-гитара,
    клавиши + Лютер на гитаре и гармошке). "Разговаривающая" гитара и высокий вокал
    постепенно становятся его фирменным стилем.


    В оригинале на альбоме было 9 песен, но в издание 2001 года добавили еще три трека
    (эти бонусы длятся 30 минут!) Лютер написал 5 песен, а еще 4 вещи - каверы. Тут
    нет таких известных тем, как были на его первых альбомах (хотя среди бонусов есть
    "San-Ho-Zay" (Freddie King) и "The Thrill Is Gone" (B.B. King - hit). Соло на
    гитаре стали длиннее, в них слышно, что игра Эллисона развивается.


    Симпатичный, классный альбом, но более однообразный, чем предыдущий. Здесь бы
    я отметил два лучших трека: "Part Time Love" и "Into My Life". Очень хороши два
    инструментальных бонуса: "San-Ho-Zay" и "Bloomington Closing (Early Version)".'
