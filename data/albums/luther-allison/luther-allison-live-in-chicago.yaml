  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2012-08-15'
  text: 'На первом диске содержится полный часовой сет Лютера Аллисона на 12-м ежегодном
    фестивале блюза в Чикаго 3 июня 1995 года. Отыгравший накануне на блюзовом фестивале
    во Франции Лютер прилетел в Чикаго и буквально с первых аккордов завоевал 150-тысячную
    аудиторию.


    Аккомпанировала ему группа старого верного друга - Джеймса Солберга, на пяти песнях
    подключались духовики Memphis Horns. Под занавес Лютер играет джем на две песни
    ББ Кинга с Отисом Рашем и другими участниками фестиваля. Мощное эмоциональное
    и техничное выступление! После этого триумфального концерта Лютер стал национальным
    блюзовым героем - и надо сказать, вполне заслуженно.


    На втором диске представлены концертные записи 1995 года в клубе Бадди Гая в Чикаго
    и одни из последних выступлений Лютера 7 мая 1997 года. Данный двойник - наглядное
    свидетельство таланта безвременно ушедшего от нас лидера чикагского блюза конца
    20 века.'
