  author: Дмитрий Казанцев
  mark: 9
  date: '2005-06-03'
  text: 'Второй альбом Лютера вышел только через 4 года после дебюта, и удивил он многих. Во-первых, диск вышел на лейбле
    Gordy (подразделение Motown), где никогда не записывались блюзовые артисты, а во-вторых, на этом альбоме мы слышим жесткий
    соул-блюз и даже блюз-рок, что вообще странно для черного музыканта на черном ритм-н-блюзовом лейбле.


    На оригинальном альбоме было всего 7 песен, но на переиздании 2001 года туда добавили еще 4 трека. Лютер исполнил снова
    "Little Red Rooster" и "Dust My Broom", хотя они уже были на его первой пластинке. Сам Эллисон написал три вещи к этому
    альбому, а среди каверов надо еще отметить "The Stumble" (Freddie King) и "Sweet Home Chicago" (Robert Johnson).


    На диске много классных блюзов, но особо хочется отметить "Evil Is Going On", "Raggedy And Dirty", "Bad News Is Coming".
    Эллисон поет и играет с малым составом: ритм-гитара, клавиши, бас и барабаны - это очень приятно и интересно. Никакой
    сырости и игры "мимо денег" с первого альбома вообще не осталось. Лютер мощно и эмоционально поет высоким и пронзительным
    голосом, а его гитара словно разговаривает с нами на всем альбоме - очень интересная манера игры.'
