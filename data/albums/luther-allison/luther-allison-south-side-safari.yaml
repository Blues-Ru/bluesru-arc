- id: 716
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-06-10'
  text: 'Очень энергичный концертный альбом Лютера. Он длится 44 минуты и состоит из 7 длинных треков. Есть тут очень известные
    номера: "You Upset Me Baby", "The Thrill Is Gone", "Messin'' With The Kid". Звук приличный, но сведение очень странное
    - барабаны сильно лезут вперед и забивают остальные инструменты (это тяжело слушать). С Лютером играет приличная "банда":
    драммер, басист, органист и духовые.


    Много энергии, угара и импровизации, иногда в ущерб музыкальности, к сожалению (но это почти всегда так на концертах).
    Лютер очень хорош на гитаре и здОрово поет, тем не менее.'
