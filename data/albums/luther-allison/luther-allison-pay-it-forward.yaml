  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2012-08-15'
  text: Изданный в 2002 году, через пять лет после смерти Лютера, данный сборник содержит
    студийные и концертные записи Лютера с другими музыкантами (гостевое участие на
    альбомах других музыкантов или в концертах), сделанные за период с 1985 по март
    1996 года. Многие из этих записей ранее не были изданы. Тут и записи с верным
    другом Джеймсом Солбергом, и с сыном Бернардом, с Джоанной Коннор, а также многими
    другими исполнителями. В первую очередь пластинка предназначена для поклонников
    таланта лидера чикагского гитарного блюза 90-х годов прошлого века.
