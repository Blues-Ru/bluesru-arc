  date: '2003-12-02'
  text: 'Переиздание одного из лучших альбомов классика чикагского блюза Лютера Эллисона.


    Он возглавлял группу под названием "Rolling Stones" еще в 50-х. Черных "Rolling Stones" из города Чикаго. В то время,
    как будущие лондонские "Stones" еще бегали в школу. Лютер Эллисон - классик блюза. И писать рецензию на его альбом - все
    равно, что хвалить слог Пушкина. В техническом и творческом смысле он выполнен мастерски - громадное эмоциональное содержание
    выражено с экспрессией и в каждом треке донесено с нюансами, в которых, видимо, закодирован весь его артистический путь.
    В основном доминирует жесткий блюз чикагского образца. И это закономерно. Эллисон из Чикаго.


    Временами здесь проскальзывает и чистейший соул. И это также часть биографии его детства (Эллисон пел в семейной госпел
    бэнд) и более поздних лет - ведь он был первым блюзменом, кто подписал контракт с империей соул - "Tamla-Motown". А иногда
    слышен здесь и рок британского образца - известно, что Эллисон являл собой в лучшие годы определенный катализатор европейской
    рок-сцены. Но, в целом, именно в этом его альбоме недостает только некоторой реальной сырости жизни, что так присуща "живым"
    концертным дискам Лютера Эллисона. В студийном варианте слишком уж все начищено до блеска - и не единого, такого сладкого
    для уха блюзмена настоящего чессовского искажения. <p align="right">Александр Чечетт'
