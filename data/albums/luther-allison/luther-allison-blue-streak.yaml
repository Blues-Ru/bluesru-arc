  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2012-08-15'
  text: Это второй альбом Лютера на фирме Аллигатор, записанный по итогам успешного альбома 1994 года. Альбом интесивного
    чикагского блюза, хотя и несколько более разноплановый, чем его предшественник. Альбом, получивший в 1995 году титул "лучшего
    современного блюзового альбома года", и занявший 9 место среди блюзовых альбомов Биллборда. Тем не менее, на мой взгляд,
    он все же слегка уступает предыдущему диску Soul Fixin' Man.
