  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2016-10-18'
  text: 'Новый студийный альбом легендарного коллектива, который в начале 70-х называли американским лед зеппелин. Кроме 8
    новых треков, на диск также попали два неизданных ранее трека оригинального состава с Тимом Богертом и Расти Дэем.


    Два оригинальных участника легендарного состава (Кармин Эппайс и Джим МакКарти) вместе с вокалистом Джимми Кунесом и Питом
    Бреми на басу при участии харпера Рэнди Пратта записали новый альбом авторского материала в традиционном для группы ключе
    - это мощный коктейль из хард рока и блюз-рока, исполненный с присущим группе мастерством. Продюсировали сами музыканты.
    Последние два трека - неизданные ранее записи оригинального состава.


    Получилось очень достойно: мощно и современно, но семидесятнические корни проглядывают.'
