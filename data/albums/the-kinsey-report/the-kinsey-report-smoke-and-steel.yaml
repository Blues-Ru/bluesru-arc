  author: Константин Колесниченко
  mark: 6
  date: '2009-04-13'
  text: 'В блюзе не так много семейных групп, музыкантов из поколение в поколение
    играющих эту музыку. Kinsey Report - один из таких ансамблей во главе группы –
    Donald Kinsey (вокал, гитара), наиболее титулованный и известный из братьев –
    играл и с Бобом Марли и с Альбертом Кингом; Kenneth Kinsey – бас гитара и Ralph
    Kinsey – барабаны. Их детство прошло в окружении музыки – отец Big Daddy Kinsey
    – известный блюзмен, игравший в манере Мадди Уотерса, а дед был пастором в церкви
    – очень важная школа пения для любого, уважающего себя, блюзмена.


    После двух откровенно роковых альбомов для Pointblank, братья записали "Smoke
    and Steel" - гораздо более выдержанный в блюзовом ключе, но не исключающий продолжительные
    гитарные соло, характерные ритмы и истинно роковую подачу. Не могу сказать, что
    такая музыка мне наиболее близка, но блюз-рок, исполняемый со вкусом и настоящим
    черным грувом зацепил и меня.'
