- id: 1956
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-07-06'
  text: 'Коллектив современного блюза из Нью-Йорка был создан в начале этого века уже давно сложившимися музыкантами, обладавшими
    обширным опытом работы в других составах. На своем втором альбоме группа исповедует традиционный блюз с современным звучанием,
    а также с примесью джаза и кантри. На некоторых треках присутствуют приглашенные музыканты духовой группы, а в основном
    играет базовый квартет с Галахером на ударных, который фактически является пятым членом группы.


    Материал в основном авторский - 10 треков из 12 написаны членами группы. Любители блюза наверняка оценят предпоследний
    трек - Bleeding. Альбом любопытный, но не выдающийся.'
