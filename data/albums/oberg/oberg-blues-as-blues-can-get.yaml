  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2012-08-13'
  text: 'Записанный в 2008 году и изданный в 2009, новый альбом бывшего гитариста легендарных голландских блюз-рокеров Livin''
    Blues Теда Оберга покоряет с первых же нот: мы слышим классический мелодичный блюз-рок вперемешку с хард роком, исполненный
    на самом высшем уровне.


    Правда, в отличие от оригинального коллектива, у микрофона в группе Оберга дама - но зато какой мощный выразительный голос!
    Мне кажется, в этом сочетании сильного вокала и блюз-рокового аккомпанимента заключается особая "фишка" нового состава.
    Отличный диск, который, бесспорно, понравится всем любителям как Livin'' Blues, так и просто мелодичного качественного
    блюз-рока.'
