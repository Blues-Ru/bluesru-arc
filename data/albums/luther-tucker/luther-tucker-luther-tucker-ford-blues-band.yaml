  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-06'
  text: 'Знаменитого блюзового гитариста и композитора из Мемфиса Лютера Такера и Патрика Форда связывает многолетняя дружба
    - впервые они играли вместе аж в 1971 году, и с тех пор у Патрика была мечта записать совместный альбом. Эта мечта была
    близка к осуществлению к 1993 году - весной группа Патрика и Лютер провели две базовые сессии в студии, собираясь позднее
    наложить вокал Лютера и его соло, однако неважное самочувствие Такера заставило отложить эти записи. Тем не менее Лютер
    смог приехать на блюзовый фестиваль в Бремене и выступить с группой. Увы, буквально через неделю он скончался от сердечного
    приступа.


    В результате на диске представлен студийный материал в "сыром" виде - без тех наложений, которые планировалось сделать
    позднее. Недостающие вокальные партии записал Энди Джаст. Кроме того, студийные треки дополнены концертными с того самого
    фестиваля в Бремене в мае 1993 года, где состоялось фактически последнее выступление блюзового мастера. В конце диска
    добавлено 17-минутное радиоинтервью Лютера Такера.


    Большая часть материала - авторская. Несмотря на некоторые недостатки, связанные с незаконченностью песен, диск оставляет
    очень приятное впечатление: это настоящий сырой техничный блюз с изрядной долей импровизации, основанный на традиции,
    но звучащий современно.'
