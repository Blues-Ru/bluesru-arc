  author: Константин Колесниченко
  mark: 10
  date: '2009-06-11'
  text: 'Большая часть наследия Литтл Уолтера сыграна и звучит так, как она звучит,
    благодаря этому замечательному гитаристу. Но его работа не ограничивается лишь
    сотрудничеством с этим мастером губной гармоники, на счету у Лютера Такера огромное
    количество работ с Muddy Waters, James Cotton, John Lee Hooker, Otis Rush, Jimmy
    Rogers и др. На протяжении всей своей карьеры Лютер Такер справлялся с любой поставленной
    перед ним задачей – классический чикагский блюз, свингующие темы Литтл Уолтера,
    смесь блюза, фанка и соула (основательно этой музыкой занялся Джеймс Коттон в
    60-х и Такер играл в его группе). Сольная дискография Такера очень скудна – всего
    2 альбома, но оба они - настоящие жемчужины блюза. "Sad hours" (скорее всего альбом
    так назван в честь инструментала Литтл Уолтера, хотя Такер на этой записи не играл)
    - первый из них. Он вышел в 90 году на техасском лейбле "Antones" и на этот момент
    мастеру было уже 54 года. Запись демонстрирует все возможности Такера – классика
    вроде "Sweet Home Chicago" "Five Long Years" и "Mean Old World", джазовая "Canadian
    Sunset", соул и фанки "Can''t Live Without It"и "Person To Person" и др. У Лютера
    очень деликатная, мягкая, почти джазовая подача, недаром он брал уроки у самого
    Robert Jr. Lockwood – одного из первых электрогитаристов блюза и мастера изысканного
    аккомпанимента.


    Альбом совсем не скучный и я бы сказал, что блюз у Luther Tucker получается очень
    красивый и обаятельный, если по отношению к этой музыке вообще правомерно употреблять
    подобные слова.'
