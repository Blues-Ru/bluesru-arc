- id: 1638
  author: Андрей Евдокимов
  mark: 7
  date: '2010-07-20'
  text: Начать с песни Default Boogie – спровоцировать подозрения, что будет политэкономически актуально. По счастью, не тот
    случай. Звучание времен, когда "музыкальный автомат" в баре был символом технического прогресса; а традиции блюза не висят
    веригами на этих музыкантах, просто буги для них – естественная форма музыкальной жизни. Звучит нормальный, не грешный
    и не святой, добросердечный блюз, а в нем понамешаны чикагские доэлектрические и электрофицированные блюзы, приправленные
    то импровизациями в стиле уэст-коаст, то раздолбайством кабацкого хонки-тонк-пиано. Губная гармоника не стремится поразить
    тонкостью техники исполнения, а напористо требует танцевать и приставать. Легкость, с которой акустический рэг чередуется
    с вязким и гнетущим рифом, столь естественна, что душа не нарадуется. И главное - именно радостность этой музыки.
