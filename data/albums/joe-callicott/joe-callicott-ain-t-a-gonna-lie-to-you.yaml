- id: 690
  author: Александр Панин
  mark: 7
  date: '2005-05-28'
  text: 'Миссисипи Джо Кэлликотт прожил почти семьдесят лет, однако записывался крайне мало. К самому концу 20-х годов у него
    в активе было несколько вещей с Гарфилдом Эйкерсом и Джимом Джексоном, но следующей возможности записаться ему пришлось
    ждать до 60-х годов. В 1967-м известный блюзовый историк Джордж Митчелл заехал в его родной городок Несбит, и вот эти
    митчелловские записи теперь изданы на Фэт Поссуме.


    На диске традиционный акустический блюз, Джо играет и поет один, делает это в стиле Джона Харта, но медленнее и как-то
    труднее, видимо, сказывается возраст и отсутствие серьезной практики выступлений. Но все составляющие настоящего и подлинного
    блюза на месте.'
