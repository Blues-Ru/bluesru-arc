  author: Дмитрий Казанцев
  mark: 9
  date: '2005-11-27'
  text: 'Bob Hodge - певец, автор, гитарист и пианист. На этом диске он написал 8 песен из 10, две другие - известные хиты
    "It''s All Over Now" (Bobby Womack) и "For Free" (Joni Mitchell). Музыка в духе блюз-рока, соула и южного рока, но есть
    и акустические фолк-рок-песни. Состав группы большой и интересный, есть тут известные люди и звезды: Dr. John - piano;
    Sneaky Pete Kleinow - pedal steel guitar; James Montgomery - harmonica; Bonnie Raitt - guitar & vocals.


    Замечательный звук, музыка и атмосфера.'
