  author: Дмитрий Казанцев
  mark: 9
  date: '2005-11-27'
  text: На этом диске Ходжа больше ритм-н-блюза и соула, чем на его ранних работах. Местами есть даже фанк, но блюзовые треки
    присутствуют по-прежнему. Песни хороши, группа прекрасно играет, Кэтфиш классно поет и играет на гитаре. На гармошке здесь
    отметился сам James Cotton, продюсер альбом - Freebo - знаменитый басист и большой друг Бонни Рэйтт (он также подпевает
    на этом альбоме).
