  author: Дмитрий Казанцев
  mark: 9
  date: '2007-06-14'
  text: 'Пятый студийный альбом группы. Дерек - племянник барабанщика Allman Brothers,
    он не так давно заменил (основателя) Дики Беттса в этой группе. Молодой гитарист-виртуоз,
    особенно при игре слайдом (своя техника и манера). Тракс прекрасно играет блюз
    и блюз-рок, джаз и фьюжн, любит побаловаться восточной музыкой (а вот это уже
    перебор в его репертуаре).


    О музыке: большинство песен - это фьюжн соула, фанка и рока. Чернокожий, хрипатый
    вокалист прекрасно справляется с разными стилями и жанрами. Есть блюз-роковые
    моменты, психоделические зарисовки и одна длинная восточная "байда" на 10 минут.
    Если бы не эти 10 минут Индо-Пакистана, я бы поставил альбому 5 баллов.


    Прекрасный диск, друзья мои! А если Вы еще и любитель восточных дел, то для Вас
    это шедевр.'
