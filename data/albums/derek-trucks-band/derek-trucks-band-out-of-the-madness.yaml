  author: Дмитрий Казанцев
  mark: 8
  date: '2007-07-12'
  text: 'Второй альбом молодого Дерека и его группы. Тут 12 вещей, половина - вокальные с приглашенными певцами (Warren Haynes,
    Larry McCray, Matt Tutor, Jimmy Herring). 4 инструментала в джаз-роковом ключе, есть фанковая тема LOOK-KA PY PY (The
    Meters) и акустическая блюзовая рага в конце альбома. Вокальные вещи все в блюзовом и блюз-роковом ключе.


    Хороший диск, но 4 фьюжн-инструментала - это явный перебор.'
