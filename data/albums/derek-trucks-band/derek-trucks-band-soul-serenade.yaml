- id: 1094
  author: Дмитрий Казанцев
  mark: 5
  date: '2007-06-14'
  text: 'Четвертый альбом Тракса. Он почти целиком джазовый! Только на четвертой песне
    появляется блюз, и поет его сам Грегг Оллман. В пятой композиции идет жесткий
    латин-фьюжн в духе 70-х. Далее снова джаз, и лишь в конце - акустическая зарисовка
    типа Дельта и Африка идут вместе.


    Проблема не в том, что это джазовый, инструментальный диск, а в том, что ты не
    ждешь этого от Дерека. Постоянная игра слайдом (да еще и по джазу) может утомить
    любого, флейта как-то выручает (но далеко не везде), хаотичные джазовые ударные
    ломают всякий грув, а клавиши с аккордными заменами - это на любителя.


    Все как бы совсем неплохо до 4 трека с вокалом Оллмана (тема Боба Марли и Уэса
    Монтгомери), а потом идет тоска, честное слово.'
