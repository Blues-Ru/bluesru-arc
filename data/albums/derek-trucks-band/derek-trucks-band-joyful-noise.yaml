  author: Дмитрий Казанцев
  mark: 7
  date: '2007-06-14'
  text: 'Очень интересный третий альбом группы. Тут 4 песни и 6 инструменталов. Две вещи поет великолепный Solomon Burke,
    одну латинистую - Ruben Blades, хит Джеймса Брауна BABY YOU''RE RIGHT поет певица Susan Tedeschi. Есть два гадких трека
    - MAKI MANDI (афро-арабская мудянка на 8 минут) и LOOKOUT 31 (угарный джаз-рок без темы и смысла). Все остальные вещи
    хороши - фанк, приджазованные инструменталы и психоделия.


    Ясно, что Дерек любит и то, и се, но странно это слушается на одном диске - когда после фанка типа Meters и Соломона Берка
    начинается восточный "бишбармак", да еще на 8 минут с вокалом Rahat Fateh Ali Khan...'
