  author: Андрей Евдокимов
  mark: 4
  date: '2009-04-15'
  text: 'Катастрофический дефицит женских голосов в современном блюзе потихоньку восполняется,
    и так приятно иметь возможность "щи поперебирать", критикуя вполне достойную вокалистку.
    Фостер начала записываться 12 лет назад, и к нынешнему 7-му альбому в дискографии
    пришла столь же безвестной, какой была в начале пути. Она потрясающе естественна
    в "черной" музыкальности голоса, ей нет нужды включать этот голос на полную мощь
    - она и не включает. превращая поток песен в ровную ничем не взволнованную гладь.
    Главные радости альбома: беззаботная регги-песенка I Really Love You и собственного
    сочинения акустический кантри-блюз Joy on the Other Side. Кстати, именно авторские
    песни производят наиболее яркое впечатление. В частности, Truth!, которая наводит
    на ассоциацию с Respect! и Think!, и заодно поясняет, почему доброжелатели пытаются
    сравнивать Фостер с Аретой Фрэнклин. Вероятно, в концертах она более пламенна,
    но в альбоме все искренне и мастерски, однако так беззубо, что уши сворачиваются
    в трубочку - годится только для фона. Обилие ровненьких и неактуальненьких модерн-блюзов
    можно отнести на счет гитариста Роббена Форда, бывшего музруком группы сопровождения.
    Прочие музыканты весьма опытны, дабы всех не перечислять, ограничемся упоминанием
    Memphis Horns.'
