- id: 2058
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2012-08-07'
  text: 'Четвертый сольный диск одаренного гитариста Марка Риза, который начал играть еще в раннем детстве под влиянием Джими
    Хэндрикса, Рори Галлахера и Стиви Рэя, а в 1996 году собрал собственную группу и начал профессиональную карьеру.


    Хотя творчество Марка обычно относят к блюз-року, данный альбом скорее хард роковый. Диск для любителей виртуозных power-trio,
    тяжелых мощных гитарных рифов и длинных импровизаций. Все композиции написаны самим Рисом, причем инструментальные пассажи
    составляют изрядную долю материала. Обратите внимание также на игру басиста Гуидо Людвига - поверьте, она того стоит!


    Блюзовым пуристам диск однозначно не понравится, зато любители тяжелого гитарного блюз-рока и хард рока найдут для себя
    много интересного.'
