- id: 1017
  author: Константин Колесниченко
  mark: 10
  date: '2006-07-07'
  text: 'Поздний альбом Большого Уолтера (1979 год). Один из лучших в его дискографии и вообще, среди альбомов с губной гармоникой.
    Биг Уолтеру уже 62, в спину дышат ученики и последователи, а он все равно среди них - настоящий маэстро. Потрясающий звук
    и интонирование. Обратите внимание на то, как гармоника перекликается с саксофоном - не уступает по глубине звука и разнообразию
    ходов.


    Альбом состоит из нескольких номеров чикагского блюза, некоторые композиции носят приджазованный характер (на альбоме
    есть "Don''t Get Around Much Anymore" Дюка Эллингтона), можно даже услышать версию "La Cuсaracha" для губной гармоники.'
