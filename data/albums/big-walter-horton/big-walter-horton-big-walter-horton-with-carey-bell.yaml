  author: Константин Колесниченко
  mark: 8
  date: '2009-03-17'
  text: 'Биг Уолтер Хортон, пожалуй, одна из самых ключевых фигур в исполнении блюза
    на губной гармонике, его стиль моментально узнаваемый – уникальное звукоизвлечение,
    сочетание ритмической и мелодической игры. Не зря он был одним из самых востребованных
    сайдменов для просто поразительно огромного количества звездных блюз-бендов Чикаго:
    Muddy Waters, Jimmy Rogers, Willie Dixon, Johnny Shines, J.B. Hutto, Johnny Young,
    Big Mama Thornton, Koko Taylor, Robert Nighthawk, Sunnyland Slim. Еще при жизни
    у него было много учеников, хотя обучение носило чаще всего характер советов,
    затрещин и просто нужно было внимательно слушать и смотреть, как Биг Уолтер делает
    свою магию. Среди самых известных его последователей Charlie Musselwhite, James
    Harman, Peter "Madcat" Ruth и Carey Bell. Именно с последним харпером и записан
    этот альбом.


    Биг Уолтер мог играть любую музыку, которою он хотел "La Cucaracha" или джазовая
    "Don''t Get Around Much Anymore" - все было ему по плечу, но этот альбом выдержан
    в стилистике классического чикагского блюза и демонстрирует очень интересное музыкальное
    общение двух харперов, ученика и учителя. Наиболее показательная в этом плане,
    да и вообще апофеоз всего альбома – это потрясающая свингующая инструментальная
    композиция "Have Mercy". Две губные гармоники перекликаются, поддерживают друг
    друга, подстегивают друг друга – умение, доступное лишь по-настоящему великим
    музыкантам.


    Аккомпанируют харперам отличные музыканты – старый друг Биг Уолтера, с которым
    он играл еще с конца 40-х годов – гитарист Eddie Taylor, басист (иногда за бас-гитару
    берется и сам Carey Bell) группы Белла Joe Harper (третий Харпер на альбоме, имеется
    ввиду его "говорящая" фамилия), а так же барабанщик Аллстар блюз бенда Вилли Диксона
    Frank Swan.'
