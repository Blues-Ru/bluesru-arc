  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-11-16'
  text: 'Уолтер Хорнтон был одним из наиболее влиятельных и цитируемых мастеров губной гармоники всех времен и народов, новаторство
    которого особенно проявилось в сфере игры на гармонике, сигнал которой пропускался через усилитель (что характерно для
    чикагского блюза).


    Такие мастера, как Чарли Масселуайт и Кэри Белл, считают себя официальными учениками Уолтера, а уж неофициальными являются
    практически все, кто в последние 40 - 50 лет пытался играть блюз на гармонике. Хорнтон записывался практически со всеми
    звездами блюза - Мадди Уотерсом, Уилли Диксоном, Джимми Роджерсом, Отисом Рашем, Коко Тэйлор, Бадди Гаем, Джо Ли Хукером,
    Джонни Уинтером и даже оригинальным составом Флитвуд Мэк. Уолтер умер от сердечного приступа 8 декабря 1981 года и на
    следующий год был зачислен в Зал славы блюза.


    На данном концертном выступлении Уолтеру подыгрывают музыканты, многие из которых сами стали звездами в последующие годы:
    Шугар Рэй, Ронни Эрл (тогда еще Ронни Эрл Ховарт, впоследствии он сократит свое имя) и Майкл Уорд. Первые три трека группа
    разогревает публику до прихода Уолтера, а остальные треки он ведет группу за собой. Отличная пластинка традиционного чикагского
    блюза и одна из последних записей великого харпера.'
