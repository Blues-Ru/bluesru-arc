- id: 1048
  author: Константин Колесниченко
  mark: 10
  date: '2006-12-19'
  text: 'Один из самых поздних альбомов Биг Уолтера (конец 70-х). Он уже немолод,
    болен. Но его игра - это что-то удивительное, показательное и глубокое.


    Пожалуй, у гармоники Биг Уолтера одно из самых лучших звучаний за всю историю
    этого инструмента в блюзе.


    Альбом начинается классным минорным инструменталом "Skip It", далее сплошные хиты
    "Hard Hearted Woman", "Tin Pan Alley", "Walter''s Boogie", "Sugar Mama" и другие
    менее известные композиции. Показательно еще то, что он не зануден, как многие
    альбомы чикагского блюза престарелых корифеев жанра.


    Среди аккомпаниаторов известный Ron Levy.'
