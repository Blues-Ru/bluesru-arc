- id: 562
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-02'
  text: 'Название почти соответствует содержанию. Больше половины альбома - соул и
    ритм-н-блюз а ля 60-е. К сожалению, это не очень хорошо сочетается с традиционными
    "обычными" блюзами, которые он вставляет между соул-номерами. Но не будем забывать,
    что Лютер - блюзмен прежде всего. Он отлично поет и играет на гитаре. Группа великолепна,
    духовые в стиле Blues Brothers (Tom Malone тут играет) очень хороши.


    И все же просто соул в 2001 первом году слушается довольно пресно, даже если он
    ОЧЕНЬ хорошо записан (Теларк постарался) и сыгран. Обратите внимание на каверы,
    которые исполняет Лютер - они очень "выручают" этот диск.'
