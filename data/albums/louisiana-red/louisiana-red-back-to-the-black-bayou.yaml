- id: 1583
  author: Андрей Евдокимов
  mark: 9
  date: '2009-11-12'
  text: Среди невоспетых гениев блюза – Луизиана Ред. Сам виноват – слишком много халтурил в Европе. Но чепуха забывается,
    гениальные блюзы остаются. В норвежской студии с миссиссипским названием Ред перепевает заново свои лучшие песни с новой
    свежей силой. Никаких "а раньше мы делали это вот так". Абсолютно актуальный альбом от завывающей басами слайд-гитары
    до легкой чечетки. Все песни – от первого лица, и ничего для вашего личного спокойствия. На редкость беспардонный альбом,
    суровый ритм, резкий голос, саркастический слайд. Песни выстраиваются в альбом воспоминаний от прошлого в Луизиане до
    будущего разговора с дьяволом. И бесконечные дороги и перекрестки… Блюз давно выдохся, песни похожи одна на другую и поэзии
    в блюзе не существует?.. Послушайте-ка лучше старину Луизиана Реда.
