  text: 'Рецензионные потуги с лирическими отступлениями . Или весь день с Rags Blues and Barrelhouse music Vol.1.


    Уважаемые братья и сестры, разрешите поделиться впечатлениями о прослушивании и да не судите строго, многогрешного, ибо
    пишу как могу – много и часто не по делу. Альбом Вадима Иващенко "Рэгз Блюз и Баррелхауз мьюзик Вол.1" был получен мной
    в результате сложного, затянувшегося на недели обмена на новый диск Зе Блакмайлерс блюз (?) банд "Парадайз Фанфарэ Блюз"
    ( REKLAMU!) , вышедший буквально след в след диску Вадима. Признаюсь честно, послушал внимательно не сразу, ибо выжидал
    настроения подобающего дабы оценить заявленное в предыдущих рецензиях тонкое и прозрачное звучание достойно и объективно.
    Надысь, как раз, чую : снизошли на меня лучи семиринда небесного и отразившись в зеркалах скрестились на выменянном у
    Вадика диске в виде причудливого знака , кричащего своей ясностью – надо брать и слушать.


    В автомобиле из колонок фирмы "PukPuk-Volkswagen" на меня полились незатейливые на первый взгляд рег-гитарные переливы
    в Вадикином исполнении, шумы мотоциклов, падающих монет, и шум улиц – все говорило об одном "Ты уже не в уездном городе
    V чувак, а в Асашай, в ней родимой, и если ты не негр, то приготовься им стать, ибо работать тебе придется и за негра
    и за белого, но при этом грустно не будет" .. что, вообщем то, радовало… Интро, переросшее в песню Black Tea Blues, несколько
    насторожило меня своими словами Май Бэйби лефт ми…Да, я все воспринимаю на свой счет, потому что наверное единственнй
    ребенок в семье и от того эгоист, и мне понятно, что это Вадика оставила бэйби, и что он готовит себе черный чай… но я
    все принимаю на свой счет, уж простите: Но мои Бэйби, когда я просыпался и валил на работу утром, всегда спали к верху
    носом и храпели во всю ивановскую, так что люстры колыхались, и не фига меня не "лефт"… разве что, чай приходилось самому
    себе делать. Ну никого во мне сопереживания Вадикиному герою, а музыка такая веселая раздолбистая получилась : "мурлык-мурлык"
    , да и еще.. Вадик посмотрел в окно, а там другие деушки ходят, а ему подавай его Бэйби, другая ему не нужна, видители
    … а у меня за окном – Узбеки копошаться вокруг соседнего строящегося коттеджа - хочешьне хочешь – но на любую Бэйби согласишься…
    Не понял я тут лирического героя. Это песня личная наверное.. и наверное не моя


    Едем дальше . А дальше замерзшие улицы, и валящий пар из под водопроводных люков, сонные колонны непроснувшихся автомобилистов
    плетущихся в левом, почему то, ряду , куда то снующие скукоженные пешеходы, перекрестки и Deep River Blues от которого
    так тепло, и не от того что у меня в машине печка , чудо-тосол , а наверное (BINGO!!!) сыграно очень тепло , по домашнему
    : минимум выкрутасов, инструментов, пара гитар, шкрякалка и Вадикин рассказик – вот он рецепт теплой атмосферы. Да – я
    за минимум затрат и за высокую теплоотдачу. В этом случае – Deep River Blues в Вадикином исполнении был как нельзя уместным
    и… уютным , что вообщем то сильно меня порадовало по сравнению с первой композицией, пестрящей нотами и спец. эффектами,
    вылазившими то там то сям , как вата из бабкиного лоскутного одеяла.


    Nine Pound Hammer – да да да! Петь рабочие песни – Три раза да да да! Слушать рабочие песни, заточенные под езду за рулем,
    и при этом работать- возить железяки и быть по локоть в машинном масле – Тысячекратное ДАДАДА. Nine Pound Hammer- как
    нельзя лучше всего под "баранку" и способствует производительности труда водительского состава , и хрен с ним с Джо Хенри,
    главное, что Найн Паунд Хаммер – не прихлопнет меня. – Радостно! Поэтому можно ехать спокойно и давить на любимые педали
    – благо дело тебе подыгрывают парни на банджо, слайд-гитаре, и барабаны-чух-чух-чух. Вывод: "Все правильно"


    Lonesome Road – моя самая любимая песня с альбома. Соло на Dobro – муражки при каждом прослушивании. Без базара.


    Lovetrain Girl … Случай у меня был. Поехал я как то в Питер, за редкостными шестеренками для коробки передач Scania GS
    771. Коробка эта так всех достала – что название GS тракторвалось уже не иначе как Gрупповой Seкс 771 раз – именно столько
    раз нужно собираться профессориату автобазы и устроить вокруг нее групповой секс, что бы ее собрать и она не ломалась.
    Суть да дело… Шетсеренки найдены, зубья пересчитаны, Питер исхожен, встречи встречены… Сажусь в поезд, открываю свое купе,
    а там какой то ботаник сидит толстый и из портфеля батон грызет – в крошках весь – сразу видно – пассажир позорище чепушное.
    Не проходит и минуты, как открывается дверь и проводница спрашивает у моего соседа, а не перепутал ли тот купе, "а то
    тут видимо ошибочка вышла" Сосед : так мол и сяк, "виноват-с, перепутал-с, .." и удаляется. Я тоже ухожу куда то по своим
    делам.. возвращаюсь в купе А ТАМ: ОНА! Рост ДВА (а может и три) метра , глаза чистый изумруд, сиськи звенящий силикон,
    волосы жгучий гидропирит! С-Т-Р-И-Т-И-З-Е-Р-Ш-А И-З Ч-И-Т-Ы ( как выяснилось позже ) смотрит так на меня ласково, как
    мама, и говорит : "вы не против, что я с вами поеду…" ААААААААААААААА! Баттофуко корнхолллио ай нид типпи фор май баннгххул!!!!
    Океаны тестостерона пробежались по мне многогрешному, то с севера на юг, то с запада на восток, то расступались, аки Червное
    море от Моисеева заклятия, то с треском сталкивались, как тектонические структуры древней Гондваны! Я помню все: ее рассказы,
    о том как она "держит за яйца" всех мужиков, танцуя у шеста, и все перистойные жесты при этом , и про то какая она богатая
    и что ей покоряются все олигархи от Читы до Черняховска и что она сделает наш захудалый оркестр знаменитым и денежным,
    и ,что Она – Королева Счастья ниспосланая свыше и что……АААА греейт корнхоллиио баттофуко … (пауза) …. ничего не помню…
    Поезд где то в 7 утра приехал ко мне на станцию и мне надо было выходить : песня Lovetrain girl.


    Me and my crazy self … ну да…. Все этим и кончилось… как обычно. Только одни гитары ноют , и говорят что ты не один такой…
    Хотя с другой стороны, кто то батон погрыз и уснул.. и приснился ему наверное, …крылатый батон, розовый. Розовый – потому
    что ночью все время всякая херня снится, потом просыпаешься , попрыгаешь – и отойдет :


    Southern Jump – что в переводе "Вадим Иващенко – Виртуоз"


    Sitting on Top of the World – ну вот что удивительно – я с этими словами не слышал этой песни: " – что не день – то открытие,
    наверное я счастливый человек", подумал я – и поехал дальше под прикантреванный блуз-стандарт.


    Another Bad Habbit – самобичевание со спецэффектами и крякалками. Вадик поет о чуждых мне плохих привычках, поэтому не
    мне судить. Я так и не понял ничего. Наверное когда напиваешься – то в голове что то какофонически крякает..


    Man of Constant Sorrow, у меня обозначилась зачетным зачином на томах и слайд гитарах от чего мне вот вот захотелось завыть
    голосами Blind Boys of Alabama : Nooo moooore Nooo mooore... ан нет.. песня другая &#61514; Звучит . Раскатисто так звучит.


    Да что тут говорить : Альбом реально целостный получился: я не смотрю на какие то недочеты по сведению ( я в них ничерта
    не понимаю) по не соотвествию форм и содержанию - с этим как раз все путем (хотя, я в этом ничерта не понимаю) . Целостный
    по чувству, проводящий плавно от настроения к настроению от трека к треку. Есть конечно и к чему придраться .


    Да, я говнюк и еще какой :


    1) Если играешь чужестранную корневую музыку , мало знать и обладать в совершенстве техникой и музыкальными формами той
    культуры, важны еще и твои лингвистические , а именно фонетические навыки: акцент, с которым ты поешь эти песни , и чем
    акцент слышится меньше – тем больше режут слух мелкие ошибки. У Вадика как раз такой случай, ну все идеально, но вот английские
    гласные... особенно долгое [ i: ] оно же не такое узкое как русское ИИИИИИ … поэтому в словах типа Me, Only , Deep – лучше
    редуцировать [И] на некое подобие [э].. лучший пример этому это… (Внимание, взрыв!!!): James Hetfield в песне Unforgiven
    , который в Never Free Never me поет free как freahhh а me как meaaah - русскому певцу – это более подходяще , ибо сложно
    уловить разницу между английскими и русскими гласными фонемами – пускай она будет нарочитой [ …EAhhh] , но не будет резать
    так слух. Надеюсь я ясно изъяснился… Мне самому с этим приходится бороться – это трудно, я знаю. И скорее, это бесит меня
    в себе, по этому я обращаю на это так много внимания. Может тут проще выбрать кого то из "на_себя_похожих_по_тембру" буржуинских
    певцов и тупо иммитировать его голос и артикуляцию ( как упражнение), потом начнет получаться само по себе? Работаем над
    гласными – "Нам воздастся , а они поплатятся!"


    2) Me and My Crazy Self 0.32 секунда !!! - фраза "Let a Woman make a ФУЛ…"… это мне слышится или там реально "кто то"
    мимо спел, или голос попал в слабую позицию и поплыл, по русски так поплыл…? Надеюсь мне послышалось?…


    Вот пожалуй и все две горошины ( или полторы) под 10 Перинами , которые Вадим и Иващенко и сотоварищи навзбивали. Без
    обид, но уж что услышал – о том не мог умолчать.


    Ах , да :


