  author: Сергей Исправников
  mark: null
  date: '2008-10-18'
  text: 'Данный диск является частью эксклюзивной серии независимой американской фирмы Fat Possum, посвященной изданию архивов
    фольклориста Джорджа Митчелла, в свое время сделавшего сотни часов полевых записей традиционного блюза. В этом выпуске
    представлено творчество Джо Калликотта – самобытного кантри-блюзового гитариста, мало известного широкой публике как тогда,
    так и сейчас. Это была первая послевоенная запись Калликотта, она проходила в августе 1967 г. в Несбите (штат Миссисипи).
    Собственно говоря, до этого о нем было известно крайне мало – единственная записанная им пластинка на 78 оборотов вышла
    на лейбле Brunswick в 1930 г. Обычно он аккомпанировал на гитаре своему близкому другу – певцу и гитаристу Garfield Arkers,
    со смертью которого в 1959 г. он вообще перестал выступать. Митчеллу пришлось поискать где он живет, но личная встреча
    с лихвой оправдала его ожидания. 67-летний Калликотт оказался приятным в общении человеком, и что самое главное, не утратившим
    своих исполнительских навыков.


    Из исполненного им материала одна песня – "Fare Thee Well Blues" – была записана Калликоттом еще в 1930 г. Остальные блюзы
    и баллады были записаны им впервые. Они демонстрируют достаточно архаичный стиль блюза 20-х гг. и не отличаются заметным
    разнообразием. Несмотря на то, что Калликотт всю жизнь провел в Дельте, его спокойная вокальная манера исполнения скорее
    характерна для Техаса и Джорджии. Часть из исполненных им вещей были вариациями на тему довоенных блюзовых стандартов.
    Например, в "Lonesome Katy" мелодия схожа с "Come Back Corinna", записанной Henry Sims в 1929 г. Первоначально часть треков
    была издана в 1969 г. на пластинке "Mississippi Delta Blues, Vol. II" лейбла Arhoolie, впоследствии эти записи в разных
    вариантах издавались на LP и CD, причем ни одно издание, включая настоящее, не является полным.'
