  date: '2015-08-17'
  text: 'Певец и композитор, Albert Washington, родился 17 августа в 1935 году в Риме, Джорджия и провел большую часть своей
    жизни играя в клубах Цинциннати, штата Огайо и у себя дома в Лонг-Айленде, Нью-Йорк. Один из четырех детей семейства Jerry
    и Helen Washington, Albert уже с раннего возраста полюбил блюз и госпел. Он вспоминает как еще в возрасте пяти лет его
    тянуло поиграть на гитаре своего дяди. А в семь Albert смастерил себе гитару используя канистру из-под бензина, а вместо
    струн - аптечные резинки (rubber bands) . В девять потерял отца и устроился после школы на работу - мыть посуду, чтобы
    хоть как-то помочь матери со счетами. После переезда в Ньюпорт, штат Кентуки мать настояла, чтобы Albert продолжил заниматься
    пением госпел, но не блюза.


    В 16 лет он присоединился к группе Gospelaires и записывался для лэйбла Don Robey - Duke and Peacock в Хьюстоне. Несколько
    лет спустя, Albert организовал собственную госпел группу - Washington Singers. В юности он также не упускал ни одного
    шанса прокрасться в блюзовые клубы Цинциннати, чтобы послушать выступавших там Sam Cooke, Big Maybelle, Charles Brown
    и Amos Milburn.


    Washington говорит что больше всего на его пение и стиль игры повлиял B.B. King, в манере которого весьма заметна музыка
    госпел. Кроме гитары осваивал кларнет и тенор-саксофон. Вскоре после смерти матери, Albert начал исполнять блюз настолько
    часто, насколько мог. В течении 16 лет он проработал в хаус-бэнде играя в Vet''s Inn в Цинциннати.


    В 1962 году он записал свой первый сингл для лэйбла Finch, который был позже переиздан на лэйбле Bluestown. Несколько
    песен для лэйбла VLM, включая песню собственного сочинения Haven''t Got a Friend, заметили и в Англии, что в свою очередь
    привело к заключению контракта с Fraternity Records в 1966 году. В 1969 году на нескольких записях для этой компании вместе
    с Washington''ом появляется Lonnie Mack. В 1970 Albert записывает пару песен для лэйбла Jewel и наконец в 1972 году выпускает
    свою дебютный альбом на детройтской студии Eastbound Records.


    Из-за осложнений от диабета, Washington потерял зрение и с середины 70х по начало 90х его карьера резко пошла на спад.
    Но несмотря на все трудности, которые выпали на его долю в жизни, Washington остается оптимистичным и не теряет духа.


    В январе 1993 года Iris Records выпустила его первую за два десятилетия запись - Step It Up and Go. И Albert стал снова
    выступать в местных заведениях и часто в клубах на Лонг Айленде. В 1994 последовал следующий альбом - A Brighter Day,
    который был назван одним из трех лучших блюзовых дисков 1994 года по версии France''s Academie Du Jazz.


    Albert Washington продолжал выступать в клубах Лонг Айленда до самой смерти 23 октября 1998 года.


    На этом диске собраны ранние записи конца 60х - начала 70х.


