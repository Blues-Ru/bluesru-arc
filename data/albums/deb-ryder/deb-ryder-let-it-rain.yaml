  date: '2015-04-26'
  text: 'Дебютным альбомом Деб Райдер стал Might Just Get Lucky, выпущенный в 2013 году, коллекция треков классического и
    современного блюза, от чикагского до новоорлеанского. А вторым стал вышедший совсем недавно, 21 апреля 2015 года альбом
    LET IT RAIN, состоящий из одиннадцати оригинальных песен, который весьма и весьма рекомендуется к прослушиванию. Оба альбома
    по праву завоевали признание критиков.


    По музыке LET IT RAIN- в целом соул-блюз, реже госпел-блюз , мощный вокал широкого диапазона с несомненным влиянием на
    творчество певицы таких именитых предшественниц, как Коко Тейлор, Биг Мама Торнтон, Этта Джеймс и Лиллиан Бригз. У нее
    прекрасно получается петь агрессивно: That''s Just How It Is, она легко справляется с госпел (Cry Another Tear) Деб очень
    неплохо поет и баллады (Kiss And Dream), духовая секция в духе ранних треков "Атлантик Рекордз" помогает ей в Can''t Go
    Back Again и в джамп номере Money Monsoon.


    Деб Райдер - полная крашеная большеглазая блондинка средних лет, родом из Пеории, (около 300 км от Чикаго, штат Иллинойс
    -на всякий случай, если кто не в курсе). Росла уже в Чикаго, в атмосфере, где царил джаз, блюз и госпел. Ее отец- певец
    Эллан Суонсон Allan Swanson, местная чикагская знаменитость в 1970х. Ныне семья и Деб проживают в Лос Анжелесе, там ее
    соседом, наставником и другом был Боб Хайт (Canned Heat) и главным клубом для общения стал рок-н-ролльный клуб ее отчима
    Topanga Corral с целым букетом исполнителей, у которых Деб в юности имела честь работать в первом отделении (Etta James,
    Neil Young and Crazy Horse, Taj Mahal, Big Joe Turner, Charlie MusselWhite)


    Деб получила музыкальное образование в UCLA (Калифорнийском Университете) и делала вполне успешную карьеру сессионного
    музыканта и певца, работая на телевидении и подрабатывая бэк-вокалисткой, где пригласят. Серьезное движение в сторону
    блюза началось около 20 лет назад после выхода замуж за басиста Рика Райдера, блюзового энтузиаста, уговорившего жену
    сформировать группу The Bluesryders, записывать собственные песни и выступать в клубах Западного берега.


    Инструменталисты альбома LET IT RAIN, известные и очень известные творческие личности, заслуживают того, чтобы сообщить
    более подробно о каждом несколько строк ниже :


    Tony Braunagel-Тони Брунагел, техасский барабанщик и продюсер, работал с Паулем Коссофф из Бэд Компани в Back Street Crawler,
    а также - с Бетти Мидлер, Эриком Бэрдоном, Бонни Райатт и Тадж Махалом


    Рик Райдер Ric W Ryder - бас-гитарист, муж певицы, ее идейный вдохновитель и блюзовый энтузиаст


    Mike Finnigan - Майк Финнигэн , клавишник-король органа Хэммонд B3 и политический активист-блогер левого толка, переиграл
    с чудовищным количеством знаменитостей : Jimi Hendrix, Joe Cocker, Etta James, Sam Moore, Crosby Stills and Nash, Dave
    Mason, Buddy Guy, Manhattan Transfer, Taj Mahal, Michael McDonald, Maria Muldaur, Peter Frampton, Cher, Ringo Starr, Leonard
    Cohen, Tower of Power, Rod Stewart, David Coverdale, Tracy Chapman, Los Lonely Boys и Bonnie Raitt.


    Johnny Lee Schell, Джонни Ли Шелл, гитарист и автор песен, работал в гастрольных турах и на записях у Бонни Райатт и Эрика
    Бэрдона


    Kirk Fletcher Кирк Флетчер - один из лучших блюзовых гитаристов мира, четыре года провел в The Fabulous Thunderbirds,
    туры с Janiva Magness и Charlie Musselwhite


    Albert Lee старина (1943) Элберт Ли - британский мастер игры на гитаре пальцами и не только, туры и записи с Эммилу Харрис,
    Крисом Фэрлоу, Биллом Уаймэном и Эриком Клэптоном, неоднократно признавался лучшим гитаристом в стиле "кантри" , "Мастер-Телекастер",
    успешен всегда, как сессионер-сайдмен и не очень - в продажах собственных альбомов. Грэмми-лауреат, в коллекции его гитар
    - инструменты Клэптона и Дона Эверли, на которых он играет.


    Kim Wilson Ким Уилсон - певец и харпист, еще один участник The Fabulous Thunderbirds, в настоящее время - лидер этого
    коллектива.


    James Hutchinson Джеймс "Хатч" Хатчинсон -постоянный бас гитарист у Бонни Райатт и крайне востребованный сессионер, список
    знаменитостей на чьих альбомах он играл слишком велик, его можно изучить в Вики.


    David Fraser Дэвид Фрезер - аккордеонист, работавший с Тэрри Эвансом.


    Lee Thornburg Ли Торнбург - трубач, известный по работам с Supertramp,Tom Petty, Aaron Neville, Ray Charles, Bonnie Raitt,
    Huey Lewis, Dwight Yoakam, Clint Black и Tower of Power


    Lon Price Лон Прайс - альт-саксофонист, работавший в турах у Joan Armatrading, Al Jarreau , Barbra Streisand, Manhattan
    Transfer , Elvis Presley, Alan Toussaint, Professor Longhair, Rod Stewart , Bonnie Raitt.'
