reviews:
- id: 63
  author: Денис Ковалев
  mark: null
  date: '2002-12-17'
  text: 'Экстраординарный синтез традиционного блюза, кантри, свинга, джазового ритм-н-блюза,
    популярной музыки 40-х годов, оригинально "разрисованный" в яркие, сочные тона
    духовой гармоникой. Мало кто может сделать это лучше, чем "Маленький Чарли и Ночные
    коты". Little Charlie Baty, "отвязывает" свою неистовую, непредсказуемую и постоянно
    свингующую гитару (Джон Ли Хукер называл его "опасным") и Rick Estrin, безукоризненно
    одетый (кто еще носит такие носки цвета гончарной глины, так идеально подходящие
    к ботинкам, невероятных расцветок костюмы и столь "экзотические" галстуки?), исполняет
    чувственные, пронизанные сильным драйвом песни, перед тем, как ввергнуть в общий
    поток свое невероятное соло. Все это звучит так, как если бы Louis Jordan и Little
    Walter играли джэм с Чарли Кристианом и ритм-секцией из "The Five Royales". Baty
    и Estrin играют вместе уже более двадцати лет. Их творческая жизнь начиналась
    в небольших клубах Сан-Франциско и Сакраменто. Являясь неплохим арфистом, Чарли
    взял в руки гитару только после знакомства с Риком, который в те времена, еще
    будучи тинейджером, совершенствовал свой вокал и навыки исполнения на духовой
    гармонике в клубах негритянского гетто Окленда. Перебравшись в Сакраменто в 70-х,
    они сменили в своем составе несколько барабанщиков, пока, наконец, не подобрали
    Dobie Strange. Dobie частично явился залогом успеха: его двенадцатилетнее сотрудничество
    с "Nightcats" и наличие рядом с ним отличного басиста позволили всему коллективу
    поднятьс куда выше, чем они могли предполагать. Baty постепенно и довольно быстро
    занял изначально предназначенное ему место одного из самых эксцентричных гитаристов
    жанра, самозабвенно исполняя свинг, некоторые иные стили джаза, блюз и иногда
    даже рок, возрождая почти ушедшие и создавая собственные темы. Estrin превратился
    настоящего "монстра" блюза, и как исполнитель, и как поэт-песенник (Robert Cray,
    John Hammond, Koko Taylor и "Saffire-The Uppity Blues Women" сделали записи его
    наиболее поздних по времени написани композиций). Estrin получил W. C. Handy Award
    в номинации "Песня года" за композицию "My Next Ex-Wife". Действительно, слушать
    Baty и Estrin''а очень приятно. Грамотные музыканты, хорошо, я бы даже сказал,
    добротно, и вместе с тем легко работающие в своем жанре, чем заметно отличаются
    от большинства подобных команд.


    <p>Помимо коммерческого, беспроигрышного веселящего подхода, есть в их музыке
    и что-то еще. Нечто, что трудно уловить, до конца осмыслить и выразить. Я это
    сделать так и не смог. Пусть читатель сам разберется, купив "Little Charlie and
    The Night Cats", что я без всякого скрытого умысла и рекомендую.'
