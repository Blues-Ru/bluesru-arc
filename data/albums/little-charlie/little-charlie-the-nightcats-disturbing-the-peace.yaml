reviews:
- id: 1947
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-07-06'
  text: 'Второй альбом группы, вышедший на Аллигатор Рекордз в 1988 году, закрепил
    успех дебютника и оказался более интересным. Группа по-прежнему играет взрывную
    танцевальную смесь джамп-блюза, рокабалли, свинга и кантри, опираясь на чикагский
    блюз с ведущей губной гармоникой.


    Диск заводной и техничный, Чарли Бэйти демонстрирует класс игры на гитаре и в
    скоростном рокабилли She''s Talking и в медленных блюзах V-8 Ford и If This is
    Love (на мой взгляд, лучшая вещь на диске). Рик Естрин является автором большинства
    песен, снабжая их изрядной долей юмора, а также периодически вставляет соло на
    гармонике. В целом - приятная работа, слушается с удовольствием.'
