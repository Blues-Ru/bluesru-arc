- id: 1519
  author: Константин Колесниченко
  mark: 9
  date: '2009-04-06'
  text: У меня есть все альбомы этой замечательной группы и, признаюсь вам, этот мой самый любимый. При постоянно меняющейся
    ритм-секции, костяк группы, а это - харпер, автор текстов и вокалист группы Rick Estrin и гитарист Charlie Baty, оставался
    неизменным. В настоящий момент, после более чем 30-летнего сотрудничества, Чарли ушел из группы, да и теперь она уже не
    носит названия в его честь. Потому этот альбом – последний в их дискографии, последняя глава в долгой истории. Но ценность
    записи не в этом, а в замечательной музыке, потрясающем профессионализме музыкантов и искрометных текстах от Rick Estrin.
    Девятый и последний альбом в их дискографии, "Nine Lives", является идеальным началом для знакомства с этой группой, почему
    бы и нет? Это укладывается в рамки бесшабашного и разухабистого West-Coast блюза.
- id: 1948
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-06'
  text: 'Группа была создана в 1976 году гитаристом Чарли Бэйти и певцом и исполнителем на губной гармонике Риком Эстрином,
    первые пластинки появились почти через 10 лет (дебютник в 1987). С тех пор музыка группы не претерпела существенных изменений
    - это все тот же городской чикагский блюз с включениями рок-н-ролла, соул, серфа, свинга и джамп блюза.


    На данном альбоме суховатый приджазованный звук квартета местами оттеняют приглашенные саксофоны, пианино и вокальная
    группа на подпевках, однако в целом, на мой взгляд, довольно вторично, не хватает изюминки и драйва их более ранних работ.


    Тем не менее шестое место в блюзовом чарте Биллборда.'
