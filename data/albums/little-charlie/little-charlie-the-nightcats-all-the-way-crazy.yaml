- id: 1946
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-07-06'
  text: 'Дебютный альбом мастеров блюза, свинга и джамп-блюза из Сакраменто. Искусный
    гитарист Чарли Бэйти и вокалист и харпер Рик Естрин играли вместе довольно долго,
    пока наконец не нашли подходящую ритм-секцию. Укомплектованный таким образом состав
    приобрел достаточный опыт клубных выступлений и в 1986 году искал возможность
    выпустить первый альбом. Президент фирмы Аллигатор Брюс Иглауэр буквально вырвал
    контракт с молодой группой у фирмы Blind Pig, прилетев домой к Чарли, и с тех
    пор группа выпустила на фирме Аллигатор около 10 альбомов.


    Несмотря на то, что альбом первый, музыканты на нем звучат вполне профессионально
    и уверенно, подкупая слушателя и качественным исполнением, и бешеной энергетикой,
    и молодым задором. Альбом динамичный и заводной, органично сочетающий традиционный
    блюз, рок-н-ролл и джаз, с добавлением изрядной доли юмора (например, в Suicide
    Blues). БОльшую часть треков написал Естрин, есть и каверы. На этом диске, в отличие
    от последующих, превуалирует техничная гитара Чарли Бэйти, а гармоника Естрина
    звучит довольно редко, но, как говорится, да метко (Poor Tarzan). Хороший качественный
    блюзовый альбом, а для дебюта так почти отличный!'
