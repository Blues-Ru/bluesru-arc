  author: Антон Ворожеев
  mark: 9
  date: '2008-10-30'
  text: 'A Better Way - диск норвежского музыканта Эйрика Бергене.


    На альбоме 12 песен, как Эйрика, так и других блюзменов вплоть до знаменитого тандема Lieber-Stoller - Fools Fall In Love
    In A Hurry (эта песня открывает диск) и Get Out Of My Life Woman Альберта Кинга.


    Более всего мне понравились инструментальная Cherry Pink - по свежим воспоминаниям прошедшего концерта, наименее блюзовая,
    но западающая в душу; баллада If I Thought You Needed Me; заглавный трек A Better Way - особенно вступление с голосом
    диспетчера аэропорта; Answering Machine и Get Out Of My Life Woman.


    Очень приятный альбом, песни исполнены в непринужденной манере; и, хоть Эйрик и позиционирован здесь как харпер, гармошкой
    альбом не изобилует - всего в меру, так что он не набьет оскомину даже там, кто не может долго слушать альбомы харперов.
    Словом, современный хороший блюз.'
