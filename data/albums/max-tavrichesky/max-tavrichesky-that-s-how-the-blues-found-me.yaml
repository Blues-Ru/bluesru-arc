  author: Константин Колесниченко
  mark: 10
  date: '2009-04-28'
  text: '<img src="http://s49.radikal.ru/i126/0904/4e/cc3054016d37.jpg"> Первый раз приходится писать о блюзовом альбоме,
    вышедшем в Украине, потому что блюз для Украины явление редкое, а Макс еще и сам по себе явление уникальное. Может быть
    вы можете представить себе концертирующего блюзмена в степях Украины, лично мне до недавнего времени было сложно это сделать.
    Но случилось так, что Макс стал довольно регулярно заезжать с концертами и к нам в город, so that''s how the blues found
    me". Познакомившись с Максом ближе, я был приятно удивлен тем, что Макс очень хорошо эрудирован в плане who is who в блюзе,
    что является огромным плюсом для любого музыканта.


    Max Tavrichesky - это украинский Paul Geremia или John Hammond - играет на гитаре и гармонике в холдере одновременно.
    Макс очень удачно справляется с поставленной задачей и, в отличие от большинства музыкантов играющих в таком формате,
    хорошо играет на гармонике. Такой формат делает его музыку еще более интересной, потому что большинство любителей и исполнителей
    блюза у нас склонны к музыке в духе Johnny Winter или SRV. Музыка, которую играет Макс - это набор композиций, известный
    любителям старого и классического блюза: "Hesitation Blues" (мой любимый номер на альбоме), "Just A Dream", "Bottle Up
    And Go" и т.д., а так же два авторских номера "Dniproboogie" и "Feels So Good To Be Back Home"; завершает альбом минорный
    блюз, знакомый многим по версии Альберта Кинга, "I''ll Play Tha Blues For You" (запись живого выступления). Да, вокал
    Макса, лично мне, напоминает Elmore James и поет он без акцента.


    Подытоживая все вышесказанное - альбом у Макса получился цельный, хороший и лаконичный и дает правильное представление
    о творчестве музыканта, но если Макс будет играть у вас в городе, сходите на концерт - вживую все гораздо интереснее,
    зажигательнее и колоритнее.


    P.S. ЖЖ Макса - http://maxtavrichesky.livejournal.com/'
