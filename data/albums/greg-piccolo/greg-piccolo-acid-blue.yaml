- id: 1832
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-01'
  text: 'Второй сольник Грега Пикколо - искусного тенор-саксофониста, певца и композитора, одного из основателей и лидеров
    Roomful of Blues. На этом диске Грег записал также и гитарные партии (и сделал это, кстати, очень прилично!), а помогает
    ему группа Heavy Juice, получившая название по имени его первого сольника. В составе группы на клавишах и нестареющем
    Хаммонде В3 старый соратник Грега виртуозный румфуловец Рон Леви.


    На втором сольнике больше вокальных треков - 7 из 12, пять треков авторских, остальные каверы. Аранжировки не столь насыщенные,
    поэтому игра Грега и Рона Леви выходит на первый план. Диск довольно разнообразный стилистически: блюз, джамп-блюз, фанк,
    джаз, реггей, мамбо, поп. Первая половина, пожалуй, поинтереснее (побольше джаза и блюза), во второй половине более выражена
    поп-составляющая. Сыграно профессионально, записано качественно, впечатление в целом хорошее.'
