  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-01'
  text: 'Будущий участник Roomful of Blues Грег Пикколо начал музыкальную карьеру
    в 13 лет, играя на саксофоне в рок-группе the Rejects. Через два года он присоединился
    к Дюку Робилларду в качестве вокалиста группы the Variations. В 1970 году пути
    Пикколо и Робилларда вновь пересеклись уже в рамках Roomful of Blues, где Грег
    играл на тенор-саксофоне. Группа много гастролировала и постепенно добилась популярности.
    В 1979 году Робиллард ушел из группы, а на смену ему пришел Ронни Эрл. К этому
    моменту Пикколо уже де факто являлся лидером группы. Однако в 1990 году Грег покинул
    Roomful of Blues и начал сольную карьеру.


    Первая сольная работа саксофониста и вокалиста Грега Пикколо, который вместе с
    Дюком Робиллардом стоял у истоков Roomful of Blues, а затем фактически возглавил
    группу в начале 80-х. Неудивительно, что сопровождающий состав состоит почти на
    100 процентов из музыкантов Roomful of Blues: Дюк Робиллард (гитара и вокал),
    Эл Копли (фортепиано), Джон Росси (ударные), Престон Хаббард (контрабас), да плюс
    вся духовая группа Румфулов. При таком составе профессионалов за качество исполнения
    можно быть спокойным.


    Альбом был записан с 9 по 13 мая 1990 года в Бостоне, и полностью состоит из каверов.
    В музыкальном отношении диск представляет собой набор преимущественно инструментальных
    номеров, хотя есть и вокальный дуэт с Робиллардом It''s Obdacious, а также еще
    пара вокальных треков. Стилистически это скорее свинг и джаз, хотя и джамп-блюз
    тоже присутствует. Особенно хороши Mushmouth, Bolo Blues, Count Your Blessings
    и совершенно убойный свингующий Hawk'' Barrelhouse. Любителям свингующего тенор-саксофона
    и ранних альбомов Roomful of Blues диск понравится наверняка, тогда как любители
    гитарного блюз-рока могут спокойно пройти мимо.'
