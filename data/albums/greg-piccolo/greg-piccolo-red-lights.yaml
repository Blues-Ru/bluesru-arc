  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-01'
  text: '"It''s not about blues, jazz or any style in particular. My thing is the song." - Greg Piccolo


    Третий сольник бывшего лидера Roomful of Blues начала 80-х прошлого века, певца и саксофониста (в дальнейшем вполне прилично
    освоившего также и гитару) Грега Пикколо. На этом альбоме Грег написал 7 треков из 11, а также добавил к палитре используемых
    им инструментов альт (его коронный саксофон - тенор). Про гитару он также не забыл, все партии записаны им. Альбом был
    записан в январе 1997 года в Бостоне, продюсировали Грег Пикколо и Бонни Толман.


    Грег отмечает, что он не замыкается на блюзе, джазе или любом другом конкретном стиле музыки. Для него главное - песня.
    Поэтому на альбоме представлен широкий диапазон музыкальных стилей: от эсид джаза и свинга до прифанкованного блюза, включая
    пару соул-баллад. Однако все это разнообразие объединяется в единое целое несомненным мастерством самого исполнителя и
    профессионализмом сопровождающего состава. Любопытный альбом, который не обязательно понравится целиком, но каждый наверняка
    найдет для себя пару-тройку треков по душе.'
