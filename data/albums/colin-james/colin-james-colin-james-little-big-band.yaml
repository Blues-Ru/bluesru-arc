- id: 2122
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2013-04-25'
  text: 'Канадский гитарист Колин Джеймс (настоящая его фамилия - Манн) - весьма уважаемая фигура на родине и обладатель множества
    блюзовых наград Канады. Путевку в жизнь гитарист-вундеркинд получил в 1984 году, когда ему удалось занять место разогревающего
    состава во время гастролей Стиви Рэя Воэна в Канаде. Стиви Рэй пригласил Колина и его группу открывать его шоу на постоянной
    основе, в том числе и в США. Дебютный альбом Колина вышел в 1988 году и стал самым продаваемым в истории канадской индустрии
    грамзаписи, а в 1993 году на волне возрождения свинга Джеймс выпустил свой третий альбом Colin James and the Little Big
    Band.


    На диске представлено современное джамп-блюзовое прочтение джазовых стандартов 40х - 50х годов, исполненных с привлечением
    полной духовой секции и ударника Roomful of Blues, а также клавишника группы Стиви Рэя Риза Уайнанса. На подпевках - хор
    мальчиков Rhode Island Boys Choir. В музыкальном отношении это коктейль из свинга, блюза, джайва и рокабилли, близкий
    к музыке Brian Setzer Orchestra и джамп-блюзу Roomful of Blues. Прекрасная пластинка для любителей рокабилли-свинга с
    ретро оттенком.


    Этот диск получил номинацию на звание лучшего блюзового/годспел альбома.'
