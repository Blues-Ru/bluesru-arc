  author: Олег Пчелкин (oleg_spb)
  mark: 10
  date: '2014-07-28'
  text: 'В мире блюза большой голос часто сопровождается большим эго, ну или средним по крайней мере. Но датский певец Торбьерн
    Рисагер (Thorbj&#248;rn Risager), высоко ценимый за сочный жестковато-хрипловатый мужественный вокал единогласным хором
    критиков из растущего числа стран, в поведении на сцене - просто джентльмен.


    Спокойно и тактично пресекая творческие недоразумения в своем относительно крупном сопровождающем ансамбле, состоящем
    из семи человек, Торбьерн пишет большинство музыкального материала и остается в центре внимания на сцене, позволяя время
    от времени солировать каждому коллеге.


    Альбом Too Many Roads - первая настоящая попытка завоевать признание не- европейских любителей блюза. Заглавное буги "If
    You Wanna Leave" своего рода демонстрация силы, мощи вокалиста и духовой секции. С другой стороны, номер Нат Кинг Кола
    "China Gate" создает атмосферу задумчивой и депрессивной южной глубинки. Старые времена в Новом Орлеане - это Drowning.
    Backseat Driver - уже вообще что-то от Джима Моррисона, медитативное и пугающее, но столь любимое многими, борьба доброго
    и злого начал в человеке. "Through The Tears," - песня - воспоминание об ушедших юношеских романах, эхо соул -музыки ''60х
    и гитарных линий а-ля B.B. King. High Rolling - чисто блюз-роковый номер с неотразимыми духовыми и гитарой, "Long Forgotten
    Track" переходящая в "Red Hot & Blue " заставляют вспомнить незабвенного J J Cale, игривый диксиленд Rich Man и финиш-
    рокабилли на фортепиано в духе Джерри Ли Луиса "Play On".


    Торбьерн учился в педагогическом колледже и даже работал некоторое время школьным учителем. Потом все же поступил в "Консерваторию
    Ритма" в Копенгагене, уникальный обучающий центр, где большинство учителей - действующие джаз и рок- музыканты и упор
    в обучении сделан на ритмичную музыку всех жанров.


    В 2003 создал свой коллектив Thorbj&#248;rn Risager Blue7 из музыкантов персонально и музыкально ему близких и факт, что
    за 10 лет только двое из них были заменены, говорит о том, что выбор был сделан почти безупречный.


    Музыкальные вкусы Торбьерна сформировались задолго до этого. Он родился 19 мая 1971 года в Гюндсо (Gunds&#248; ). С 12
    лет играл на саксофоне, затем осваивал гитару, но пел сначала нечасто. К блюзу его приохотил сосед, друг его родителей,
    его пластинки с записями Б Б Кинга и Рэя Чарльза стали любимыми и повлияли на подход к выбору репертуара в будущем.


    В 2005 он был признан музыкантом года, лучшим исполнителем блюза в Дании. Второй альбом From The Heart вышел в 2006 уже
    просто под его собственным именем. Артиста иногда упрекают в смешении жанров, часть критиков удручена отсутствием привычной
    для блюзового мира гомогенности в исполнении. Но это его осознанный выбор. Его богатый духовой секцией коллектив играет
    и шаффлы, и джамп-блюзы, и соул, и госпел, и блюз-рок, и джаз-блюз, что не дает скучать и больше радует большинство аудитории
    и в меньшей степени - критиков. С 2014 года его коллектив- октет называется Thorbj&#248;rn Risager & The Black Tornado.
    Все выпущенные им альбомы можно считать удачными, если закрыть глаза на имеющие место отдельные приблюзованные баллады,
    где он злоупотребляет рычанием и подражанием Майклу Болтону. Впрочем, допускаю, и на них есть устойчивый спрос.


    Музыканты :Торбьерн Рисагер - вокал, гитара, Эмил Балсгаард Emil Balsgaard - клавишные, пианино, Питер Сжеминг Peter Skjerning
    - гитара, бэк вокал, Каспер Вагнер Kasper Wagner - саксофон, Ханс Найбо Hans Nybo - саксофон, Питер Кель Peter Kehl -
    труба, бэк вокал, Сорен Бойгаард S&#248;ren B&#248;jgaard - бас, Мартин Сейделин Martin Seidelin - барабаны, бэк вокал.'
