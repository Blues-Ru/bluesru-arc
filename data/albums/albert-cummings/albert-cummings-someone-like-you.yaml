  author: Олег Пчелкин (oleg_spb)
  mark: 9
  date: '2015-08-08'
  text: 'Его предыдущий альбом No Regrets в 2012 году легко разобрался с конкурентами и шел первым в блюз списках iTunes в
    США, Франции и Канаде. В блюзовом списке Billboard , правда выше пятого места не поднялся, но многие, в том числе сам
    создатель, признали его "лучшим, что у него до сих пор было". Не исключено, что "лучшим, что у него до сих пор было" в
    ближайшее время многие назовут вышедший 24 июля 2015 (вновь на Blind Pig) его новый альбом, Someone Like You.


    Бывший строитель и бизнесмен, а ныне весьма востребованный блюз-рок исполнитель Элберт Кьюммингз (Albert Cummings) со
    времен своего дебютного The Long Way 1999 года, не перестает радовать своих почитателей, - предпочитателей мелодичного
    и в меру консервативного блюз-рока. В отличие от прежних работ мастер-строитель ныне не пренебрегает Хэммондом (орган
    ныне - неотъемлемая часть) и женскими подпевками.


    Из 12 треков стоит выделить медленный блюз Little Bird, акустическую кантри-блюз балладу, выполненную в манере Брюса Спрингстина
    So Strong, Movin'' On с клавишными а-ля Стиви Уандер и гитарой а-ля Бадди Уиттингтон, страстный шаффл Up Your Sleeve и
    кульминацию - отличный рок-н-ролл "Отвали от моей сестрицы" Stay Away from My Sister.'
