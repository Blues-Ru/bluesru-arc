  author: Дмитрий Казанцев
  mark: 6
  date: '2005-08-27'
  text: 'Удивительные вещи выходили на фирме Stax порой. Чернокожий Гас Кэннон родился
    еще в 1883 году и появился в студии когда ему было почти 80 лет (Вы удивитесь,
    но он прожил 96 лет!) Гас поет и играет на банджо, он также рассказывает забавные
    истории о музыке и жизни. Ему помогают два его друга - на стиральной доске, гитаре
    и джаге; они создают так много шума и звуков, что кажется, что играет целая группа.


    13 треков необычной музыки - это песни конца 19-го, начала 20-го века. Можно сказать,
    что эта музыка была предтечей блюза, джаза, регтайма и кантри. Как это назвать?
    Фолк, наверное. Музыка скорее забавная и веселая, чем красивая и глубокая.'
