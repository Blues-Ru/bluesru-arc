  author: Дмитрий Казанцев
  mark: 4
  date: '2005-08-19'
  text: 'На этом альбоме почти нет вокала, и совсем нет соула, блюза и фанка. Группа
    исполняет традиционные госпелы и ньюорлеанский ранний джаз. Все сыграно на трубах
    + ударные. Почти все темы тут знаменитые: "I Shall Not Be Moved", "Jesus On The
    Mainline", "John The Revelator", "Down By The Riverside", "Amazing Grace".


    Очень "прикладная" уличная музыка. Совсем не для всех, это надо любить.'
