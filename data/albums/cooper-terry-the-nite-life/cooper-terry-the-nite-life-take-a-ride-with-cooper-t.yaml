  text: '22 января в 1949 году (66 лет назад) в Сан-Антонио, Техас, родился Купер Терри (Cooper TERRY). В середине 70-х он
    перебрался на ПМЖ в Италию, где прожил 20 лет. Он записал несколько гладких альбомов, в которых всегда находилось место
    для антиамериканских политических песен. Но в Милане любили его сольные акустические выступления под гитару, в которых
    он был верным и страстным последователем традиций Дельта-блюза. (с) блюзовый календарь


    На другом его альбоме - Tribute To The Blues - 1992 среди прочего собрана отличная акустика. Многие песни на этом диске
    повторяются, видимо потому что издан он был уже после смерти.Последняя песня на альбоме - Me And The Devil ранее не издавалась.


    Записан Take A Ride With Cooper T при сопровождении группы. И практически все песни на альбоме авторского сочинения, кроме
    трех - Роберта Джонсона.


    Cooper Terry поет, играет на губной гармонике, добро-гитаре и двенадцатиструнке. Lillo Rogati играет на басу, Stefano
    Re и Davide Ravioli за ударными. Valentina Comi - пианино в Raggety And Dirty. Nicola Calgari - саксофон в California
    Shuffle. Marco Limido отвечает на электро-гитару. Его же слова мы видим в буклете:


    "Cooper Terry never sold his Soul to the Devil - he''d always given it to the ones who listened to his Blues"


    "I really think these Recordings prove the above. For my Friend and Mentor"


    Как Cooper Terry прекрасен в акустике, так же хорош он и с бэндом! Больше других запомнились гипнотическая Tribute To
    Willie Dixon и акустический блюз Raggety And Dirty в сопровождении губной гармоники и пианино, рифово-качающая Kinda Like
    Wolf, авторская My Daddy под аккомпанемент одной гитары, прекрасный вариант песни Reverend Gary Davis "Death Have No Mercy
    In This Land" с другим текстом - Ain''t No Justice. Да так и можно весь альбом до конца перечислять - одно слово - мастер!


    PS На амазоне альбома нет, соответственно ссылка с обложкой не прикрепляется - поэтому посмотреть картинки и послушать
