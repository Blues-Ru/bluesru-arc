reviews:
- id: 503
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-04-02'
  text: 'Это второй альбом группы. Альбом концертный, на нем всего 6 композиций, но длится он аж 56 минут! Много импровизации
    и игры на инструментах. Очень в духе Хендрикса, но сыграно и спето на очень высоком уровне. Четыре песни с их первого
    диска + две новые (Kind of Bird из программы Allman Brothers Band).


    Живая и виртуозная игра, очень хорошая запись, но все это для любителей именно концертных фишек, конечно (не каждый может
    выдержать хард-блюз-роковое трио с песнями по 10 минут). Всем гитаристам и ритм-секциям настоятельно рекомендуется!'
