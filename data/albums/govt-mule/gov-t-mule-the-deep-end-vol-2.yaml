reviews:
- id: 40
  author: Алексей Калачев
  mark: 4
  date: '2002-10-26'
  text: '100 минут музыки на двух дисках. В целом повторяет первый выпуск. Однако было бы легкомыслием, упростив, охарактеризовать
    альбом как южный рок или блюз-рок. Мне кажется здесь больше, чем в первом, например, фанка. Вообще, полтора с лишним часа
    слушания ЧЕГО-ТО ОДНОГО превратились бы в нелегкое испытание стойкости для приверженца любого стиля. Тем более, что слушать
    желательно погромче. Составляющие: упомянутые + джаз, фьюжн, госпел, эсид-джаз, кантри, тяжелый рок. Константы: 1) Темп.
    Тут  Gov’t Mule, как говорится, любят трудности. Фирменный темп - средний, ниже среднего, тяжеловатый, что многих и отталкивает.
    (Проще, когда просто медленно или, что еще лучше, быстро). 2) Общая тональность – минор. Альбом для блюзменов с музыкальным
    желудком повышенной прочности. Такое по плечу только им, либо фанатам  "Gov’t Mule".'
