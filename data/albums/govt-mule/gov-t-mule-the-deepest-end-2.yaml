- id: 601
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-05-01'
  text: 'В "комплект" Deepest End: Live In Concert входят два компакт-диска и один ДВД-видео-диск - всего более 6 часов музыки.
    Все это было записано и заснято 3 мая 2003 года в новоорлеанском театре Saenger. Здесь очень много гостей - 13 басистов
    (среди них Jack Casady, Roger Glover, Paul Jackson, Will Lee, George Porter Jr., Victor Wooten) и еще 8 других музыкантов
    (среди них Dirty Dozen Brass Band, Bela Fleck, Sonny Landreth, Ivan Neville, Fred Wesley, Bernie Worrell). Черные и белые,
    американцы и европейцы, рокеры и джазмены. Музыка тут очень разнообразная: блюз-рок, южный рок, хард-рок, джаз-рок, госпел.
    Все очень классно сыграно и записано, хочу отметить лишь несколько известных всем нам композиций, которые Мьюлы решили
    сыграть в тот день с разными басистами и другими гостями: "John The Revelator" (trad. gospel), "32/20 Blues" (Robert Johnson),
    "Goin'' Down" (Don Nix), "Chameleon" (Herbie Hancock with Headhunters), "On Your Way Down" (Allen Toussaint), "Maybe I''m
    A Leo" (Deep Purple), "Voodoo Chile" (Jimi Hendrix), "Politician" (Cream), "Sweat Leaf" + "War Pigs" (Black Sabbath),
    "Wasted Time" (Eagles). Как видите, программа очень разнообразная и интересная. У Мьюла есть много разных концертников
    и коллабораций в дискографии, но этот "тройник" - самый лучший из их живых записей. Волшебный вечер, гости и музыка. От
    видео-концерта просто невозможно оторваться местами. Уоррен и Ко играют ту, старую музыку на основе блюза, теми же "винтажными"
    звуками, без дурацкого выпендрежа и современных бездуховных технологий. Но при все при этом, каждый, кто выходит тут на
    сцену, настоящий профи и виртуоз.'
