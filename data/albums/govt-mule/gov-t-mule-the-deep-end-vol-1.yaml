- id: 505
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-04-02'
  text: 'Этот диск вышел вскоре после смерти басиста Аллена Вуди. Уоррен и Мэтт решили позвать много разных басистов-звезд,
    а также других музыкантов, и записать любимые песни в разных составах. Получилось интересно! Играются свои песни, а также:
    Effigy (Creedence Clearwater Revival), Maybe I''m A Leo (Deep Purple), Sin''s A Good Man''s Brother (Grand Funk). Кого
    тут только нет среди гостей: Jack Bruce, Larry Graham, John Entwistle, Flea, Bootsy Collins - это все басисты. А еще тут
    великий клавишник Берни Уоррелл и не менее великий Чак Ливелл.


    На диске 13 треков, а на бонус-диске еще 4. В итоге почти 2 часа отличной музыки. Студийные и концертные записи. Южный
    хард-блюз-рок. Очень искренний и мощный. Прекрасная работа!'
