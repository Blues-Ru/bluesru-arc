reviews:
- id: 501
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-02'
  text: 'Это второй студийный диск группы, но третий в общей сложности - в 1996 году выходил их концертник Live At Roseland
    Ballroom.


    Ребята продолжают играть свою музыку на основе блюз-хард-госпел-рока и можно сказать, что их второй диск - это отличное
    продолжение первого. На диске 11 песен: традиционный госпел John The Revelator, битловская She Said She Said, а все остальные
    треки написаны участниками группы (Уорреном, в основном).


    Группа тут по-прежнему трио: Уоррен Хейз - гитара, вокал; Аллен Вуди - бас; Мэтт Абтс - ударные. Играют они очень виртуозно
    и интересно, особенно мне нравится драммер Мэтт.'
