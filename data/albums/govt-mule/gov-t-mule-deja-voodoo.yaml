reviews:
- id: 502
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-04-02'
  text: 'Четвертый студийный альбом группы и их самый новый новый диск на сегодняшний
    момент. Бас-гитарист Аллен Вуди умер в конце 2000 года и после этого группа выпустила
    несколько концертников с приглашенными басистами-звездами чтобы отдать долг памяти
    отличному басисту (об этом будет отдельная история). Уоррен и Мэтт решили взять
    в группу нового постоянного басиста и еще клавишника. И так в составе появились
    басист Энди Хесс и клавишник Дэнни Луис. В конце 2004 вышел диск, но котором Мьюл
    играет новым составом - квартетом.


    Музыка стала еще богаче и интереснее. И это не только за счет клавиш (орган Хаммонда,
    в основном), но и потому, что изменилась и сама палитра группы - появилось больше
    соул-рока (можете называть это белым ритм-н-блюзом с Юга) и фанковых рисунков.
    Все 12 вещей на альбоме написаны Уорреном Хейнсом, две вместе с Дэнни и одна с
    Энди.


    Пожалуй, это самый интересный альбом группы!'
