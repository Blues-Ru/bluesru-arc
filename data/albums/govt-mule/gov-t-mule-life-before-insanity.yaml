- id: 246
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Я долго пытался подобрать определение музыке Gov''t Mule, пока, наконец,
    в голову не пришло: "угрюмый блюз". За исключением пары тоже не особо жизнерадостных
    баллад "Fallen Down" и "Tastes Like Wine", музыканты в течение часа, можно сказать,
    настойчиво сгущают тучи.


    Впрочем, мрачноватость всегда была отличительной чертой этой группы. Она появилась
    в 94-м году - Warren Haynes и Allen Woody, игравшие в Allman Brothers Band, решили
    собрать свой состав. Тогда им понадобилось лишь подыскать неплохого барабанщика,
    и выбор пал на Matt Abts. В таком вот виде трио существует уже семь лет, изредка
    приглашая на запись очередного альбома своих коллег, в случае "Life Before Insanity"
    - Ben Harper, Hook Herrera и Johnny Neel. Продюсером же стал Michael Barbiero,
    ранее работавший с Guns тN Roses и Blues Traveler.


    Да, чуть не забыл. Если вы все-таки хотите найти на "Life Before insanity" хоть
    одну в меру быструю вещь, не спешите снимать пластинку по окончании баллады "In
    My Life", - скоро начнется очень драйвовый трек "If I Had Possession Over Judgement
    Day" а-ля Johnny Winter.'
- id: 500
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-02'
  text: 'Это третий студийный альбом группы. На нем - 11 композиций собственного сочинения,
    большинство написаны Уорреном Хейнсом.


    На этом диске вместе с три играют и другие музыканты: Бен Харпер - вокал и стил-гитара,
    Хук Херрера - гармошка, Джонни Нил - орган и вокал. Музыка по-прежнему в духе
    начала 70-х - хард-блюз-рок с психоделическими моментами.


    Эту музыку можно назвать тяжелой, грустной и даже депрессивной, но от этого она
    не становится хуже, поверьте мне. Барабанщик творит чудеса; опять и снова!'
