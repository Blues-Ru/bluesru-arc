reviews:
- id: 494
  author: Сергей Колобашкин
  mark: null
  date: '2004-03-12'
  text: 'Gov''t Mule всегда мне нравились, а эта пластинка особенно, правда многие могут сказать, что она сильно затянута
    различными композициями, но при всем этом - это же их задумка! Они мне чем-то напомнили Allman Brothers, ребята явно находятся
    под влиянием, не удивительно, так как Уорен Хэйс долгое время работал у Грега Оллмана. В общем, альбом заслуживает похвалы,
    тут все на месте: ритм, блюз, отличные тексты, да и вроде бы все, что надо для того, чтобы записать тяжелый блюзовый альбом.'
- id: 499
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-02'
  text: 'Первый альбом этой потрясающей блюз-рок-группы. Да, они умеют играть настоящую музыку даже в 90-х годах.


    Надо сразу сказать, что в группе всего три человека, но все они ВИРТУОЗЫ, ПРОФИ и УМНИЦЫ. Уоррен Хейнс и Аллен Вуди (не
    путать с Вуди Алленом) играли в Allman Brothers Band, а драммер Мэтт Эбтс играл с Дики Беттсом и другими людьми Южного
    Рока. Даже втроем они способны создавать волшебную атмосферу и музыку. Надо отметить, что Уоррен очень хорошо поет, хотя
    его голос можно назвать "деланным".


    На альбоме 12 треков, из них 8 собственного сочинения, одна от Оллманов, а также песни Сона Хауса, Мемфиса Слима и группы
    Фри. Ребята играют очень классный сплав из блюз-рока, хард-рока, фьюжна, фанк-рока, южного рока и госпел-рока. Если Вам
    нравятся такие артисты, как Allman Brothers Band, Jimi Hendrix, Free, Funkadelic, Frank Zappa, Led Zeppelin, Black Sabbath,
    то Вам точно понравится и Gov''t Mule.


    (Мне тяжеловато слушать хард-рок и вокал Уоррена, но их игра - это особенное удовольствие. Это настоящий рок, тут нет
    и грамма поп-музыки. Сразу скажу - это не веселая и довольно депрессивная музыка.)'
