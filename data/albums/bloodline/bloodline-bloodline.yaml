  date: '2012-08-13'
  text: 'Для поклонников Джо Бонамассы - единственный диск коллектива, в котором молодой
    Бонамасса играл первую скрипку (а точнее, соло-гитару :-)). Группа интересна тем,
    что в ней участвуют сыновья трех знаменитых музыкантов: Уэйлон Кригер (сын гитариста
    Дорз), Эрин Дэвис (сын Майкла Дэвиса) и Берри Окли (сын покойного басиста Олман
    Бразерс). Еще один музыкант Олман Бразерс - Уоррен Хэйнс - присутствует в качестве
    гостя на слайд-гитаре на одном треке.


    В музыкальном отношении группа выносит на суд зрителя южный коктейль из хард рока,
    блюз-рока и фанка, исполненный на очень приличном уровне. Все музыканты играют
    очень хорошо, а игра молодого Джо заслуживает отдельной похвалы. Однако несмотря
    на то, что первый трек даже попал в Top 40 синглов, группа распалась. Зато уже
    через несколько лет Бонамасса начал радовать поклонников блюз-рока своми сольниками
    :-)'
