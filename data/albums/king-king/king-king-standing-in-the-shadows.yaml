  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2013-07-25'
  text: 'Группа King King из Глазго создана 4 года назад, когда уже довольно известный
    гитарист Алан Ниммо (выступавший со своим братом Стивом как Nimmo Brothers) начал
    писать песни со своим старым приятелем басистом Линдси Кулсоном. Такое творческое
    партнерство породило желание создать полновесную группу, и Алан пригласил ударника
    Уэйна Проктора и клавишника Беннетта Холланда. Первый концерт коллектива состоялся
    на блюзовом фестивале в Монахене в 2010 году. Вышедший в мае 2011 года дебютный
    альбом новой группы (Take My Hand) оказался хитом - в 2012 году он получил британскую
    блюзовую награду как лучший альбом, а King King стали обладателями аналогичной
    награды как лучшая группа.


    Группа много гастролировала, набиралась популярности и у любителей блюза, и у
    критиков, и, наконец, приступила к работе над вторым диском, который вышел в марте
    2013 года, и практически сразу завоевал признание музыкальной прессы (журнал Classic
    Rock Blues назвал его "стопроцентным хитом"). Хотя Алан как-то сказал: "Я никогда
    не пытался написать шлягер. Я могу писать только такие песни, в которые я верю...".
    В музыкальном плане альбом представляет собой довольно мелодичную смесь блюза,
    соул и классического рока, исполненную на самом высоком уровне. Альбом наверняка
    найдет своего слушателя и среди любителей современного электрического блюза, и
    среди любителей мелодичного хард рока.'
