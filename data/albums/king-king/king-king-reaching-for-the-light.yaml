- id: 2207
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2015-05-08'
  text: 'Третий альбом шотландских блюз-рокеров во главе с Аланом Ниммо. С момента выхода в 2013 году второго альбома Standing
    in the Shadows группа одержала победу в пяти номинациях British Blues Awards 2014, включая "лучшую группу" (третий год
    подряд) и "лучший альбом" (Standing in the Shadows). Кстати, дебютник коллектива Take my Hand также победил в номинации
    "лучший альбом" British Blues Awards.


    Однако группа не починает на лаврах и не сбавляет обороты - Reaching for the Light получился очень хорошим и вполне достойным
    разделить успех его предшественников, а сами музыканты доказали, что наградами их осыпали вполне заслуженно. Алан Ниммо
    так отозвался о последней работе: "Мы по-настоящему гордимся этим альбомом. Он быстрее, громче, более энергичный и более
    захватывающий. У него есть потенциал сорвать крышу".


    Если честно, то с фронтменом трудно не согласиться - альбом получился достойный и запоминающийся. На диске один кавер
    Поля Кэррака, остальные треки собственного сочинения. В музыкальном плане это современный динамичный мощный блюз-рок с
    изрядной долей хард-рока, примесью фанка и соул, с легкими реминисценциями в классику 70-х а-ля Free. Но главное, на мой
    взгляд, достоинство альбома состоит в том, что кроме техничности и мастерства исполнения он очень мелодичный и состоит
    из отличных песен (а с этим у современных исполнителей, в отличие от прекрасной техники игры, в настоящее время как-то
    плоховато). Другими словами, этот альбом проходит "на ура", сами песни запоминаются, и их хочется подпевать. "Проходных"
    треков нет, но особенно понравились You Stopped the Rain, Waking Up и замыкающие Take a Look и Stranger to Love. Определенно
    один из лучших альбомов 2015 года.'
