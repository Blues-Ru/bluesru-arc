reviews:
- id: 938
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-12-28'
  text: 'Это второй (из двух) альбом МакКлинтона для фирмы Кэпитол. Дэлберт продолжает исполнять свой белый ритм-н-блюз, в
    котором много элементов блюза, госпела, соула и кантри. Этот альбом записан в знаменитых Muscle Shoals Studios, играют
    лучшие люди этого объеденения. Богатый звук - гитары, клавиши, духовые - все это очень интересно и звучит прекрасно для
    1981 года. МакКлинтон "делает" здесь несколько известнейших песен: "I''ve Got Dreams To Remember", "Midnight Hour", "Lipstick
    Traces (On A Cigarette)".


    Разнообразный, живой, корневой звук; не может не понравиться ценителям настоящей американской музыки.'
