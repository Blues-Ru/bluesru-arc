reviews:
- id: 971
  author: Дмитрий Казанцев
  mark: 10
  date: '2006-02-18'
  text: 'Считается, что это лучший альбом Делберта. Здесь в равной степени блюз-рок, кантри-рок и соул-рок. Никакой попсы.
    Альбом записан в знаменитых студиях Muscle Shoals - настоящая южная музыка под продюсированием самого Барри Бекетта (клавиши).


    Здесь много известных музыкантов и песен. Стоит отметить такие хиты как: "The Jealous Kind" (Bobby Charles), "Bright Side
    Of The Road" (Van Morrison), "Take Me To The River" (Al Green), "Shakey Ground" (hit).


    Прекрасный альбом, отличный звук и настроение. Никакого тухляка 80-х годов.'
