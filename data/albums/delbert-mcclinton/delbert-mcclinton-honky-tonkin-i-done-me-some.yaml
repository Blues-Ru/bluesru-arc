  author: Дмитрий Казанцев
  mark: 9
  date: '2005-09-10'
  text: 'Интересное издание на Аллигаторе (это конец 80-х); на этом диске 12 песен с двух первых альбомов Дэлберта на фирме
    ABC (1975-1976). Обалденная смесь блюза, кантри-рока и ритм-н-блюза! МакКлинтон шикарно поет, он также играет на гармошке
    и гитарах. Его группа - супер, программа тоже. Обязательный период этого техасца для всех любителей южной музыки и ритм-н-блюза.


    На КД есть вот такое хорошее издание с этими двумя альбомами, покупайте его обязательно: http://www.allmusic.com/cg/amg.dll?p=amg&sql=10:2c4uak2k5m3n'
