- id: 1420
  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-03'
  text: 'Слышали истории, как ужасны кавер-блюз-бэнды, по всему миру играющие один и тот же набор блюзовых стандартов? Так
    вот, и эту работу можно выполнять качественно и с огоньком, в своему и всеобщему удовольствию! Питер МакГрэу и пятеро
    его сотоварищей – все белые мужчины в годах – набрасываются на классику с молодым азартом. Короткая двухминутная интродукция
    собственного сочинения – и 9 архистандартов. Играют необычайно энергично, а лидер поет с той правильной белоблюзовой хрипотцой,
    которая так интригует начинающих любителей блюза. В области блюзовых каверов это – шедевр: песни не переворачивают с ног
    на голову ради оригинальности трактовки, но и не копируют один в один. Верность духу традиций – и блюзовая классика, казалось
    бы, затертая до дыр, сверкает как новая. Ключевые треки: Follow Me To The Blues, I Got A Woman.'
