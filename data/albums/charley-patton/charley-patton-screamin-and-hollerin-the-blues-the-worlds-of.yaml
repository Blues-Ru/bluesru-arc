- id: 1497
  author: Андрей Евдокимов
  mark: 10
  date: '2009-02-05'
  text: 'Начало новой эры для коллекционеров - все включено! В коробке лежат: книга,
    7 CD и сувенирная пластинка на 78 об/мин. Книга представляет скрупулезную монографию.
    Пэттон был эпицентром блюзового круга Дельты Миссиссиппи. Оправдывая название
    комплекта, диски собрали абсолютно все записи, выходившие под его именем (и ряд
    прежде не публиковавшихся), а так же записи, в которых он аккомпанировал своим
    друзьям (как они зачастую аккомпанировали ему). Плюс полный CD интервью о нем.
    И заключительный штрих – его песни в исполнении других артистов в период с 1924
    по 1957... Тема Пэттона раскрыта полностью! Последним гвоздем пробивает "Неизвестный
    заключенный" в списке исполнителей. Компетентность компилятора не подлежат сомнению.
    Это знаменитый блюзолог Lawrence Cohn. В 1991г. он добился Grammy для переиздания
    записей Роберта Джонсона. В 2002г. Grammy удостоилось и это его грандиозное предприятие.
    Сейчас он готовит издание Blind Willie McTell по такой же схеме. Тут ни слова
    о самой музыке, поскольку издание предназначено для тех, кто знает: с Пэттона
    начинается блюз. Такого не каждый артист достоин... Можно иронизировать, что собрание
    записей, предназначавшихся для дешевого увеселения беднейшей публики в США, ныне
    по карману только весьма состоятельным господам.'
