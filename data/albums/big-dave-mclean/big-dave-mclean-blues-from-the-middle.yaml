- id: 1274
  author: Леонид Аускерн
  mark: null
  date: '2008-06-03'
  text: Было бы странно, если бы канадский лейбл, издавая альбомы отличных американских
    блюзменов, не обращал внимания на отечественную сцену. А в Канаде тоже немало
    интересных, самобытных исполнителей блюза. И альбом Биг Дэйва МакЛина, выпущенный
    по лицензии в России – наглядный тому пример. С обложки альбома на нас смотрит
    человек, скажем мягко, не самых юных лет. Так до конца и не понял, что имел ввиду
    Дэйв в названии своего проекта – то ли свой возраст, то ли географическое положение
    родного Виннипега. Во всяком случае, за долгие годы профессиональной карьеры в
    качестве концертирующего музыканта он исколесил множество дорог, выступал чуть
    ли не во всех, даже самых маленьких городках срединной Канады, а также на ряде
    крупных блюзовых фестивалей. На этом пути он собрал немало наград, среди которых,
    наверное, самая почетная – премия Джюно (канадский аналог Грэмми) за 1991 год
    в категории "лучший альбом блюз / госпел". Двух музыкантов Дэйв считает своими
    главными учителями. Это Джон Хэммонд-младший, в далеком 1969 году давший ему,
    тогда начинающему исполнителю на губной гармонике, первые уроки игры на гитаре
    на одном из фолк-фестивалей. И еще это Мадди Уотерс, с которым лет 20 назад МакЛину
    довелось вместе совершать концертный тур. Blues From The Middle – первый альбом,
    который МакЛин записывал в родном городе. Впервые и продюсер проекта (Рик Фентон),
    и ассистирующие музыканты тоже представляли Виннипег. Ну а в гости к Большому
    Дэйву в этом проекте пришли большие блюзовые люди, включая Сью Фоули и Дюка Робилларда.
    Большинство композиций для альбома – авторские, из которых центральное место занимает
    11-минутная песня с забавным названием Muddy Waters for President, посвященная
    главному блюзовому кумиру МакЛина. Не могу сказать, чтобы игра Дэйва на гитаре
    или губной гармонике поразила чем-то особенным – это просто достойный профессиональный
    уровень. Чуть ярче впечатление от его голоса – хрипловатого, резкого и действительно
    запоминающегося. А в целом альбом заслуживает внимания хотя бы ради знакомства
    с одним из ведущих канадских мастеров электрического блюза.
- id: 1376
  author: Константин Колесниченко
  mark: 7
  date: '2008-12-01'
  text: 'Не так много современных блюзовых музыкантов, которые пишут свои песни. А
    еще меньше тех, у кого эти самые блюзы получаются хорошо. Потому не смотря на
    то, что музыкально альбом Дейва – это старый добрый чикагский блюз, звучит он
    немного иначе и это уже замечательно.


    Дейв играет на гитаре, гармонике, возможно он не виртозный музыкант, но чувства
    в свою игру он вкладывает настоящие. Музыканты, помогающие Дейву, неизвестны слушателю,
    но парочка именитых гостей есть на альбоме – это гитарист Duke Robillard и канадская
    блюз-вумен Sue Foley.


    Хорошая, добротная и искренная блюзовая работа – так можно охарактеризовать альбом
    Дейва. В какой-то степени, он мне напоминает недавно покинувшего нас Роберта Лукаса.'
