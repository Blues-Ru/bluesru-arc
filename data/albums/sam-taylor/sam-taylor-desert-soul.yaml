  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-11'
  text: 'Ветеран блюзмен Сэм Тэйлор - сын знаменитого саксофониста Сэма Тэйлора по прозвищу the Man. Сэм младший родился в
    Лексингтоне, штат Теннесси, освоил гитару, стал сочинять свой материал и уже в 1959 году в возрасте 25 лет начал записываться.
    Его песни исполняли такие гранды, как Элвис, Фредди Кинг, Брук Бентон, Бич Бойз, а в качестве музыканта он сотрудничал
    с Албертом Коллинзом, Биг Джо Тернером, Отисом Реддингом и Айсли Бразерс.


    Все треки на данном альбоме написаны самим Сэмом, который также выступил в качестве продюсера. Материал сочинялся Сэмом
    начиная с 1988 года, когда он переехал в свой дом, расположенный в пустыне рядом с Таксоном, штат Аризона - отсюда и название
    диска.


    И надо сказать, диск получился очень любопытный - традиционный качественный блюз, да еще с роскошной скрипочкой (огромное
    спасибо Хитер Харди), а также с эпизодическими включениями духовых и приятными аранжировками. Музыка искренняя, исполнение
    профессиональное, мелодии запоминающиеся. Одним словом, диск, который звучит свежо и приятно выделяется среди многих других
    блюзовых пластинок. Рекомендую всем любителям блюза.


    Альбом был записан в 1995 году и переиздан в 2003-м.'
