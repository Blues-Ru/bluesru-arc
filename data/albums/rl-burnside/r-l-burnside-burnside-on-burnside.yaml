  date: '2011-06-24'
  text: '&#65279;Настоящий анархичный блюз с дельты Миссисипи. АрЭл Бернсайд с сыном
    и внуком качечат слух и лечат душу )) В эссе к альбому "Burnside on Burnside"
    Джей Бегкок пишет очень мудрено, но стоит послушать: "Музыка в бесконечном движении
    растягивает время, прессует его и снова растягивает. Музыка зависает над пропастью.
    Звучит тяжело и грубо, но через повторения становится постоянной лаской. Выскакивают
    из песни отдельные фразы: "Любовь - это дьявол, но она меня не достанет", "Пусть
    моя крошка скачет", "Будь моим осликом с длинной шерсткой". Но они не так много
    значат, слышать надо его голос, а не его слова. Это АрЭл Бернсайд и он знает,
    что делает. АрЭл, который умеет закрутить вечеринку с танцами "лучше не бывает".
    А он делает только то, что делал и всегда. Этому веселью радостно отдаваться,
    радостно вкладывать в него всего себя. Но АрЭл - старик, он двигается медленно,
    экономя движения, как делают старики. Он с радостью рассказывает шутки, байки,
    прибаутки - слушать их хватило бы на целую жизнь. Его глаза красны, слезятся,
    затуманены. Зубов нет. Поясница болит. Артерии закупориваются и рецидивы пазуховой
    инфекции затрудняют равновесие. Но его лекарство от кашля по запаху подозрительно
    напоминает Джек Дениэлс. Так он пьет его для удовольствия или чтобы избавиться
    от боли? А какая разница? Неужели между этими причинами есть разница? И все же,
    когда он заводит "Jumper on the Line" никто не скажет, что он звучит нездорОво.
    На самом деле он звучит угрожающе, упрямо, бешено, сурово. Как проповедник среди
    диких, он заставляет слушать себя зычным голосом. Он звучит круто, он звучит как
    надо. Он звучит так, словно готов делать это еще 74 года.'
