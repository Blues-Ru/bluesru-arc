  text: 13 акустических вещей Бернсайда, записанных в октябре 1969 года. Несколько
    песен со второй гитарой и гармошкой. В целом очень похоже на First Recordings
    (композиционные пересечения с этим изданием, конечно же, имеются) и почти так
    же здорово. Хороший буклет и фотографии.
