  author: Александр Панин
  mark: 9
  date: '2005-05-20'
  text: Один из трех самых нужных альбомов Бернсайда (остальные два - Acoustic Stories
    и First Recordings). Здесь 19 вещей, записанных задолго до того, как он стал "коммерческим"
    исполнителем, издавая на Фэт Поссуме альбом за альбомом и временами проявляя склонность
    к экспериментам с инди-роком и гнусными электронными звуками. Песни опять почти
    все знакомые, но диск действительно хорош, хотя и кажется чуть менее интересным,
    чем два указанных выше.
