- id: 2127
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2013-05-29'
  text: 'Второй совместный релиз от одной из лучших (а по мне таки и просто лучшей) современных роковых вокалисток и ведущего
    блюзового гитариста построен по той же схеме, что и его знаменитый предшественник: опять каверы классики блюза и соул,
    опять продюсирует Кевин Ширли, аккомпанирует практически тот же первоклассный состав музыкантов, усиленный в этот раз
    духовой секцией. Естественно, что такой уже проверенный рецепт закономерно дает ожидаемый результат - диск хорош, и мастерски
    сыгран. Пожалуй, этот диск чуть более разноплановый по отношению к предшественнику: есть и блюз, и джамп-блюз, и соул,
    и рок.


    Джо играет запоминающиеся техничные соло, а Бет "отжигает" по полной, демонстрируя не только мощь своего голоса, но и
    прекрасное владение динамикой и передачу чувственных оттенков. И все-таки мне кажется, что ее подача местами в некоторой
    степени прямолинейна. (Если уж помечтать, мне было бы любопытно, как на месте Бет записала бы с Джо некоторые из этих
    треков Дени Кляйн, которая легко сочетала в своем творчестве поп, джаз, блюз и многое другое.) Резюмирую: альбом хорош,
    и настоятельно рекомендуется к прослушиванию!


    Диск добрался до первого места в топе блюзовых альбомов Биллборда и в 2014 году был номинирован на Грэмми в категории
    "лучший блюзовый альбом".'
