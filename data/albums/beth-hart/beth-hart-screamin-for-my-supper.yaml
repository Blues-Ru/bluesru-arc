  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2013-05-29'
  text: Второй официальный сольник певицы принес ей заслуженный успех, добравшись до 143 позиции в топе альбомов Биллборда.
    В немалой степени этому способствовало наличие на альбоме наиболее известного сингла певицы LA Song. Это, конечно, не
    чистый блюз - рОка тут хватает, но подача и вокал заслуживают того чтобы на них обратили внимание.
