  text: 'Beth Hart - Live From New York - Front and Center CD/DVD (2018)


    Второй концертный альбом Бет Харт записан 7 марта 2017 года в Нью-Йорке в небольшом джазовом клубе Иридиум в рамках телепрограммы
    Front and Center. Эта телепрограмма уже не первый год делает 60-минутные музыкальные передачи с концертов различных исполнителей.
    В отличие от предыдущего концерта Бет, записанного в знаменитом амстердамском клубе Парадизо, данный концерт более камерный
    и охватывает не только блюз-роковую ипостась певицы, но в первую очередь раскрывает ее соул и джазовые возможности.


    Бет исполняет преимущественно собственный репертуар, половина треков - с двух последних ее сольников, но есть и песни
    из раннего творчества (Isolation, Delicious Surprise, Broken And Ugly, Leave The Light On). Часть песен певица исполняет
    только под собственный аккомпанемент на фортепиано, есть и акустический сет, и полномасштабное рОковое исполнение. В качестве
    особого гостя на двух треках Can''t Let Go и For My Friends к группе присоединяется знаменитый мастер-слайдер Сонни Ландрет.
    Исполнение заслуживает только похвал, звук очень приличный (видимо по причине записи в интимной атмосфере небольшого джазового
    клуба). Конечно, концерт лучше смотреть, тем более что на ДВД в качестве бонуса есть любопытное интервью с певицей.'
