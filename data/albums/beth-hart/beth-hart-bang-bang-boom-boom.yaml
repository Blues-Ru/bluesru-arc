- id: 2130
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2013-05-29'
  text: 'Bang Bang Boom Boom - шестой сольный студийный альбом певицы (а если считать альбом 1993 года Beth Hart and the Ocean
    of Souls, то седьмой), причем альбом состоящий полностью из авторского материала. Пожалуй, по сравнению с предыдущими
    работами это наиболее зрелый и интересный диск Бет, который на все 100 процентов демонстрирует ее обширные вокальные и
    композиторские возможности, и который вполне заслуженно добрался до 3 места в блюзовом топе альбомов (это высшее достижение
    для сольников певицы). Без Бонамассы, конечно, не обошлось - наиграл соло на одном из треков (There In Your Heart). С
    альбома было выпущено 3 сингла: "Baddest Blues", "Bang Bang Boom Boom" и "Thru the Window of My Mind".


    Продюсировал и микшировал альбом великий "пещерный человек" Кевин Ширли, работавший с Бет и Джо над их первым совместным
    альбомом Don''t Explain. Очень достойная получилась работа, а треки Baddest Blues и Caught Out In The Rain - просто шедевральны.


    Альбом в Америке вышел с опозданием - только в апреле 2013 года, хотя в Европе релиз был на полгода раньше - 5 октября
    2012 года. Зато на американском издании в качестве бонус-трека имеется концертная версия I''d Rather Go Blind, исполненная
    с самим Джеффом Беком 2 декабря 2012 года на шоу в честь Бадди Гая в Центре Кеннеди.'
