- id: 2126
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2013-05-29'
  text: 'Бет Харт и Джо Бонамасса неоднократно встречались во время своих турне по
    Европе, в результате чего Джо пригласил Бет записать вокал для одной из песен
    своего альбома Dust Bowl. Оба были настолько довольны полученным результатом,
    что с помощью знаменитого продюсера Кевина Ширли решили записать совместный альбом
    каверов классики блюза и соул (правда, затесался и трек от Тома Уэйтса) в современной
    интерпретации, подарив тем самым новую жизнь хорошо известным песням. И результат
    превзошел все ожидания: альбом получился столь хорош, что быстро добрался до 3
    места в топе блюзовых альбомов Биллборда. В 2012 году альбом получил номинацию
    в категории "лучший альбом современного блюза".


    Мощный чувственный голос Бет и блестящая гитарная техника Джо прекрасно дополняют
    друг друга, на одном треке они поют вместе. Возможно, не все треки вышли одинаково
    хорошо, но в целом диск получился, и получился очень хорошим! А за кавер I''d
    Rather Go Blind обоим можно памятник поставить. Бет лишний раз доказала, что среди
    современных певиц ей нет равных как в рОковом репертуаре, так и в блюзовом. А
    про Джо и так все известно - неоднократное присвоение звания "лучшего блюзового
    гитариста года" говорит само за себя. Слушать в обязательном порядке!'
