  date: '2015-04-16'
  text: '"She has a talent with no ceiling" - Huffington post


    "Often reminiscent of Etta James and Janis Joplin, Hart''s vocals mine emotions
    at levels so deep they would scare most singers" - Music Connection


    Долгожданный новый студийный альбом американской певицы и обладательницы номинации
    на Грэмми. Альбом у Бет вышел очень личный, лиричный, спокойный и неспешный.


    Несмотря на успех, достигнутый Бет за последние годы в результате сотрудничества
    с Джо Бонамассой и продюсером Кевином Ширли, певица решила на этом альбоме отказаться
    от услуг Кевина, пригласив для продюсирования Роба Мэтса и Майкла Стивенса, и
    сочинив самостоятельно все песни на диске. Это позволило ей слегка изменить направление
    и отойти от жесткого блюз-рока, вернувшись к истокам, когда она начинала в традиционной
    роли певицы/композитора/автора песен. Довольно смелое решение. Ирония заключается
    в том, что, отказавшись от услуг Ширли, Бет невольно оказалась под его косвенным
    влиянием, ибо с подачи Кевина на двух последних обласканных критикой студийниках
    с Бонамассой она записала классику музыки соул, а новый ее альбом по стилистике
    пожалуй ближе всего именно к этому направлению. Проблема в том, что классика соул
    и блюза, записанная ранее Бет и Джо на Don''t Explain и SeeSaw, по качеству музыкального
    материала заметно превосходит последний альбом певицы. Бет с лихвой компенсирует
    это искренностью и вокальной подачей, и тут она на высоте - к ее вокалу никаких
    претензий нет и быть не может.


    На мой взгляд, не лучший диск в ее дискографии, ожидал большего.'
