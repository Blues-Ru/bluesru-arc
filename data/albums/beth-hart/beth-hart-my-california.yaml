  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2022-09-14'
  text: 'My California - шестой (если считать и первые альбомы, записанные Бет с группами
    Ocean of Souls и Beth Hart Band) сольный альбом одной из интереснейших современных
    певиц, работающих на стыке традиционного американского рока и блюз-рока. Альбом
    записывался под руководством датского продюсера Руне Уэстберга (с которым певица
    работала на двух предыдущих альбомах), и вышел 4 октября 2010 года в Европе на
    лейбле Provogue/Mascot (и только через пару лет 31 июля 2012 года диск был издан
    в Америке). Уэстберг не только продюсировал диск и играл на нем, но и выступил
    соавтором Бет для большинства песен альбома.


    Влияние Уэстберга на диске довольно велико - он убедил Бет не полагаться на мощь
    голосовых связок, а отдать предпочтение выражению эмоций. Он настоял на том, что
    каждый трек записывался сразу после того, как был сочинен, чтобы сохранить новизну
    и некую спонтанность. В результате получился более мягкий очень личный и лиричный
    мелодичный альбом, состоящий в основном из баллад. Тут правит бал традиционный
    мелодичный рок, и поклонники блюза вряд ли найдут для себя что-либо интересное
    в этой работе. Нельзя не отметить тот факт, что диск получился достаточно однородным,
    чего нельзя сказать о других дисках певицы.


    Песня Sister Heroine посвящена сестре Бет, скончавшейся от овердоза. В этой песне
    на гитаре отметился Слэш, с которым Бет сотрудничала при записи его альбома Slash
    2010 года (но на мой взгляд ничего интересного он в этом треке не показал). Заглавная
    песня альбома прозвучала в последней серии шестого сезона знаменитого сериала
    "Калифорникэйшн". Песня "Take It Easy on Me" прозвучала 23 августа 2012 года в
    первой серии драмы "Дорога Ватерлоо" на телеканале ВВС.


    В целом альбом достаточно ровный и довольно интересный, но сделан в традиционном
    приглаженном ключе с упором на лирику. При его создании Бет в очередной раз показала
    себя не только отменной певицей, но и незаурядным автором песен. Однако под влиянием
    продюсера ей пришлось сдерживать себя, и тем самым была потеряна часть ее индивидуальности
    - та самая необузданная бешеная энергетика и экспрессия, которыми певица выгодно
    отличается от остальных.'
