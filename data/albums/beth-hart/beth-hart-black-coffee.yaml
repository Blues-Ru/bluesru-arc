  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2018-09-27'
  text: 'Black Coffee - третий студийный релиз от Бет, Джо и Кевина Ширли (а с учетом
    концертника в Амстердаме это четвертая совместная работа). Альбом сделан по шаблону
    предыдущих успешных студийников и полностью состоит из каверов мастеров блюза
    и соул (хотя пара-тройка блюз-рокеров среди оригинальных исполнителей тоже присутствуют).
    Альбом был записан в августе 2016 года, затем Кевин колдовал над ним еще больше
    года, и только 26 января 2018 года альбом поступил в продажу, добравшись до первого
    места в топе блюзовых альбомов Биллборда.


    Альбом был записан всего за пять дней с привлечением старых проверенных музыкантов
    экстра-класса, с которыми Джо выступает и записывается уже не один год: Антон
    Фиг на ударных, Риз Уайнанс на клавишных, Майкл Родес на басу, плюс духовая секция
    под руководством Ли Торнбурга и трио бэк-вокалисток во главе с Махалией Барнс.
    Музыканты записывали песни в процессе "живого" исполнения в студии, когда каждый
    исполнитель видел, слышал и чувствовал своих коллег, и старался изо всех сил.
    Возможно, за год, в течение которого Кевин Ширли готовил записи к изданию, он
    сделал какие-то изменения и наложения, но нам об этом не сообщается.


    Песни для альбома отбирал преимущественно Кевин, хотя и Джо тоже поучаствовал
    (Give It Everything You Got предложил именно он). Лучшие треки на альбоме - Damn
    Your Eyes, Lullaby of the Leaves, Why Don''t You Do Right и Addicted; треки, без
    которых вполне можно было бы обойтись - Saved и на удивление заглавный Black Coffee.
    Проверенный рецепт Ширли сработал и в третий раз, однако, на мой взгляд, на Black
    Coffee чуть меньше действительно классных треков, чем на двух предыдущих студийниках
    дуэта. Однако музыканты с одинаковой виртуозностью и полной отдачей исполнили
    все треки на альбоме - и действительно классные, и среднестатистические.


    В отличие от стандартного издания, в лимитированное издание альбома добавлен один
    бонусный трек - Baby, I Love You (который я бы тоже отнес к среднестатистическим).
    В общем и целом - вполне достойная работа, в особенности с точки зрения исполнительского
    мастерства и качества записи. Единственный недостаток - отсутствие чего-либо принципиально
    нового.'
