  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-11-16'
  text: 'Пятый (если считать и первые альбомы, записанные Бет с группами Ocean of Souls и Beth Hart Band) сольный альбом одной
    из интереснейших современных певиц, работающих на стыке традиционного американского рока и блюз-рока. Альбом записывался
    вживую на видеостудиях Center Staging, Бурбанк, Калифорния, под руководством продюсера Руне Уэстберга, и вышел в разных
    регионах Европы в течение 2007 года. Отснятый материал издавался на ДВД с тем же названием.


    У Бет Харт роскошный чувственный эмоциональный и сильный голос, что в наше время большая редкость. Она свободно чувствует
    себя и во время исполнения блюзовых баллад, и при исполнении жестких рОковых песен. Кроме того, блюз-рокерша из Лос-Анжелеса
    еще и неплохая пианистка, а также очень приличный композитор - только одна песня альбома написана без ее участия (Soul
    Shine - кавер Уоррена Хейнса). Собственно, название альбома отражает временной отрезок, за который он был записан. Да,
    это скорее рок, чем блюз, но некоторые параллели с Дженис бесспорно прослеживаются.


    Этот диск стал первым альбомом Бет, возглавившим национальный чарт - он продержался две недели на первом месте в топе
    альбомов Дании, и затем заработал там золотой сертификат.


    Европейское издание этого альбома, вышедшее в 2008 году на лейбле Provogue, дополнено тремя студийными бонус-треками -
    хитами с предыдущих альбомов Бет: LA Song, Learning to Live и Leave the Light On.'
