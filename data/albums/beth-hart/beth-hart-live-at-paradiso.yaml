- id: 2131
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2013-06-06'
  text: 'Бескомпромиссный концерт выдающейся блюз-роковой певицы записан в мае 2004 года в знаменитом театре Парадизо в Амстердаме
    - в зале, столь любимом многими выдающимися блюзовыми исполнителями (в частности, Вальтером Траутом). Кроме компакт-диска
    с данным концертом, он также был выпущен и в видеоверсии на одноименном ДВД.


    Бет прекрасно держит зал и полностью отдается своей музыке, подкупая публику искренностью, страстью и мощью исполнения.
    В сет-лист входят лучшие треки с трех ее первых сольных альбомов, а также под занавес кавер знаменитой Whole Lotta Love.
    Сопровождающие музыканты, возможно, не самого высокого класса; но тем не менее они прекрасно оттеняют возможности певицы
    и подают музыкальный материал должным образом. Концертные версии песен тяжелее и жестче альбомных, а певица демонстрирует
    широкий спектр своих возможностей. Данный концерт - отличная иллюстрация возможностей артистки, находящейся в пиковой
    форме, и, пожалуй, оптимальный диск для знакомства с творчеством Бет Харт. Но для того, чтобы составить себе полное впечатление,
    настоятельно рекомендую посмотреть ДВД.'
