  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2014-03-26'
  text: 'По итогам двух успешных студийных альбомов Бет и Джо в 2013 году отправились в турне в сопровождении тех же самых
    музыкантов, которые играли в студии, плюс трио духовиков. Кульминацией стали концерты в Амстердаме в историческом зале
    Koninklijk Theater Carr&#233;, которые и представлены на данных двух дисках (а также ДВД и Блю-Рее).


    Сыграно 10 песен с альбома Seesaw, 7 песен с первого альбома, Baddest Blues от Бет, хрестоматийная Someday After Awhile
    от Джо, плюс пара новых треков - посвящение Амстердаму в качестве "открывашки" и финальный Антверпенский джем. Концертное
    исполнение более раскованно, больше драйва, энергетики, мощи, есть сюрпризы и от Бет, и от Джо. Музыканты отлично чувствуют
    друг друга, в целом исполнение отменное, чего и следовало ожидать от находящихся в самом расцвете сил Артистов такого
    калибра.


    Продюсировал Кевин Ширли, обеспечив грамотное сведение и отличный мощный звук. Запись сделана на 100 процентов "вживую"
    - без наложений и исправлений, все как и слышали зрители.


    Вердикт: отличный концертник от двух ведущих мастеров современного блюза и блюз-рока, настоятельно рекомендуемый к прослушиванию
    всем без исключения.'
