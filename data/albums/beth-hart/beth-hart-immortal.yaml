- id: 2352
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2022-09-02'
  text: 'Immortal - первый альбом Бет Харт для крупного лейбла (Atlantic), записанный в составе Beth Hart Band (до этого в
    1993 году был диск первой группы Бет под названием Beth Hart and the Ocean of Souls, выпущенный маленьким лейблом Razz).
    Диск вышел 21 мая 1996 года тиражом 13 000 экземпляров и включал в себя авторский материал (за исключением последнего
    трека, написанного единолично Джеффри Тозером - музыкантом группы the Ocean of Souls, продюсером альбома 1993 года и первым
    менеджером Бет Харт). В качестве сингла с альбома был выпущен трек God Bless You.


    Разные треки альбома записывались в разных американских студиях (и даже в Лондоне успели поработать) с тремя продюсерами:
    знаменитым Хью Падгхэмом, Майком Клинком и Дэвидом Фостером (который также исполнил партию фортепиано на треке Hold Me
    Through the Night). Песня Am I the One впервые вышла на альбоме Beth Hart and the Ocean of Souls.


    В музыкальном плане получился достаточно приличный рОковый альбом с примесью блюза, поп и альтернативы, исполненный достаточно
    жестко с хорошим драйвом, а вокальная подача Бет характеризуется мощной энергетикой и неподдельной искренностью. Некоторые
    треки альбома надолго вошли в концертный сет певицы: заглавный трек и конечно Am I the One.


    После выхода альбома группа добилась известности и активно гастролировала, включая участие в фестивале Лоллапалуза 1996
    года и выступление на разогреве у Scorpions, однако усталость от гастролей и внутренние трения между музыкантами привели
    к ее распаду. Следующего альбома Бет Харт пришлось ждать 3 года, и этот диск (Screaming for my Supper) стал началом сольной
    карьеры певицы.'
