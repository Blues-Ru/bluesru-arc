  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2016-10-19'
  text: 'Для работы над своим очередным студийным альбомом Бет пригласила известного продюсера Оливера Лейбера, который собрал
    для записи команду первоклассных музыкантов: Майкл Ландау (гитара), Уодди Уачтел (гитара), Брайан Аллен (бас), Рик Маротта
    (ударные), Джим Кокс (пианино), Дин Паркс (акустическая гитара) и Иван Невилль (орган). По мнению Бет, работа с профессионалами
    такого класса являлась залогом получения качественного продукта.


    Запись материала в студиях Лос-Анджелеса прошла быстро - всего за 3 дня музыканты записали 16 песен. Но после этого был
    длительный скрупулезный процесс микширования под руководством Оливера Лейбера. В результате на диск попали 12 песен, написанных
    Бет в самых различных жанрах - от госпел и соул до рока, джаза и блюза. Сама Бет довольна полученным результатом, считая,
    что альбом "офигительно хорош!".


    Нет смысла спорить, диск действительно хороший, однако мне кажется, что сам подход к этой записи в результате не позволил
    хорошему диску стать отличным. Поясню: понятно, что Бет приехала в студию к приглашенным профессионалам со своими демо-записями,
    которые этим дорогостоящим музыкантам всего за 3 дня предстояло превратить в полноценные студийные записи. Для музыкантов
    материал был новый, и они постарались честно отыграть его, не привнося чего-то своего (да просто некогда было им придумывать
    новые ходы и аранжировки). В результате за исключением примерно половины треков, получивших дополнительную обработку и
    аранжировки (например, пожалуй, лучший трек диска Jazz Man), на выходе фактически остались те же демки, переигранные профессионалами
    с минимальным музыкальным сопровождением. Я вообще смутно понимаю смысл приглашать трех гитаристов, считающихся мастерами
    своего дела, и получить в итого три коротких маловразумительных гитарных соло за весь альбом. Однако что на альбоме присутствует
    в избытке (и это, в общем-то, хорошо) - это роскошный голос Бет и продуманные фортепианные партии (еще одно свидетельство
    в пользу моей гипотезы озвучивания демок). Думаю, если бы новый материал записывали неспешно с привлечением музыкантов
    концертной группы Бет, можно было бы найти и новые хуки, и риффы, и поработать над качественными аранжировками - и в результате
    музыка бы расцветилась целой палитрой новых красок.


    Резюмирую: песни интересные, мелодии хорошие, Бет поет отлично, качество записи на высоте, сыграно профессионально - однако
    за счет некоторого минимализма в аранжировках и используемом инструментарии альбом до отличного слегка не дотягивает.


    В мае 2018 года Бет получила за этот альбом блюзовую награду лучшей инструменталистке/вокалистке (2018 Blues Music Award
    for best instrumentalist/vocals)'
