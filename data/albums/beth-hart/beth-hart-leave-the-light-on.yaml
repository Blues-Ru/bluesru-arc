  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2020-02-27'
  text: "Leave the Light On - третий (а если считать альбом Beth Hart and the Ocean\
    \ of Souls 1993 года, то четвертый) альбом американской певицы, вышедший в 2003\
    \ году (первоначально в Новой Зеландии на лейбле Warner Music NZ, а затем по всему\
    \ миру осенью 2003 года на Koch Records). Отмечу, что некоторые пуристы относят\
    \ альбомы Beth Hart and the Ocean of Souls 1993 и Immortal 1996 к совместному\
    \ групповому творчеству, а первой настоящей сольной работой певицы считают соответственно\
    \ альбом Screaming for my Supper 1999 года. Бет выступила в качестве автора или\
    \ соавтора практически всех треков альбома (за исключением World Without You).\
    \ Альбом записывался в нескольких студиях по всему миру и сделан в рОковом ключе.\
    \ Партии гитар на ряде треков записал Джон Николс, с которым Бет связывает долгое\
    \ и плодотворное сотрудничество.\n\nДиск стал прорывом для певицы на европейском\
    \ рынке, сингл Learning to Live возглавил чарты в Дании, сам альбом по итогам\
    \ продаж получил в Дании двойную платину и пятое место в топе альбомов. В Голландии\
    \ альбом добрался до 17 позиции, в Норвегии - до 23. В том же году группа Deep\
    \ Purple пригласила Бет в качестве бэк-вокалистки на запись песни Haunted с альбома\
    \ Bananas.\n\nСуществует несколько вариантов данного альбома с разным оформлением\
    \ и разным количеством песен. Немецкое издание от лейбла Universal Music GmbH\
    \ вышло в 2006 году и содержит оригинальный материал 2003 года, три полностью\
    \ перезаписанные песни (Leave the Light On, World Without You и Learning to Live),\
    \ а также три новых песни (Easy, Over You и Missing You), которые в 2007 году\
    \ будут записаны по-новой для следующего альбома певицы 37 Days.\n\nTracklist:\
    \ 1 \tLifts You Up \t 2 \tLeave The Light On \t 3 \tBottle Of Jesus \t 4 \tWorld\
    \ Without You \t 5 \tLearning To Live \t 6 \tEasy \t 7 \tOver You \t 8 \tMissing\
    \ You \t 9 \tLay Your Hands On Me \t 10 \tBroken & Ugly \t 11 \tLifetime \t 12\
    \ \tMonkey Back \t 13 \tSky Full Of Clover"
