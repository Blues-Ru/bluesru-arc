- id: 1916
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-05'
  text: 'Блюзовый мультиинструменталист и певец Кенни Нил вырос в многодетной музыкальной семье, а друзьями его отца - знаменитого
    блюзмена Рафула Нила - были Бадди Гай и Слим Харпо. С 13 лет Кенни играл на басу в группе его отца, а в 17 лет его пригласил
    к себе в группу Бадди Гай, выступавший вместе с Джуниор Уэлсом!


    По итогам работы с блюзовыми грандами Кенни освоил и бас, и гармонику, и гитары, включая слайд, и в 1987 году записал
    свой первый сольник, за которым последовало 5 альбомов на фирме Аллигатор. Затем он подписал контракт с фирмой Telarc,
    на которой записал предлагаемый альбом, при записи которого ему помогали в том числе двое братьев. Получился мощный альбом
    традиционного блюза, включающий как каверы, так и авторский материал. Обратите внимание на голос Кенни - он прекрасный
    блюзовый вокалист.'
