- id: 1323
  author: Константин Колесниченко
  mark: 8
  date: '2008-07-23'
  text: 'Есть такой замечательный блюзмен Kenny Neal. Чем он замечательный? Отличным
    вокалом, игрой на гитаре и гармонике, хорошим музыкальным вкусом. Его блюз не
    пресный, а очень эмоциональный и искренний, он делает стилистически разные альбомы,
    в записи которых принимали участие и легенды блюза вроде Lazy Lester, Billy Branch,
    и люди из фанковой тусовки вроде Fred Wesley и Maceo Parker.


    В 2001 первом году 2 блюзмена для аудиофильского лейбла "Telarc" записали совсем
    не блюзовые альбомы - это Charlie Musselwhite "One Night In America" и Кенни Нил
    "One Step Closer". Оба альбома вышли потрясающие, но сейчас подробнее о втором.
    Кенни рос в Луизиане под присмотром отца - известного блюзмена Raful Neal. Потому
    ему очень близка эта музыка и если на предыдущих своих альбомах он искусно вплетал
    новоорлеанские штучки в свою музыку, то этот альбом получился полностью в стиле
    Americana: cajun, zydeco, blues и т.д. Причем, это сыграно настолько тепло и мастерски,
    что совсем забываешь о том, что Кенни - это прежде всего блюзмен.


    С умом и сердцем Кенни подошел и к выбору материала: "Walk out in the Rain" (Bob
    Dylan), "High on a Hilltop" (Nick Lowe), "Lover''s Will" (John Hiatt), "Hidden
    in Plain Sight" и "Remedy" (Colin Linden), но следует отметить, что и авторские
    песни Кенни звучат вполне на уровне с такими маститыми авторами! Замечательный
    и состав альбома: Kenny Neal (vocals, guitar, harmonica) - он отлично играет на
    всех инструментах, а его вокал - это очень и очень круто; Denny Breau (guitar);
    Mary Jo Carlsen (violin); T-Bone Wolk (mandolin, accordion, bass); Jason Ward
    (baritone saxophone); Darren Thiboutot (drums); Andrea Re (percussion, background
    vocals).


    В завершение хочу сказать пару слов о том, почему при всех достоинствах, описанных
    выше, я все же поставил альбому оценку в 4 балла. Ответ прост, мне кажется, что
    альбому не хватает немного яркости, живости, безусловно музыка безумно красива
    и хороша, но она слишком расслаблена.'
- id: 1918
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-05'
  text: 'Третий сольный альбом Кенни для фирмы Теларк (правда, на этой же фирме выходила
    и совместная его работа с Дэбби Дэвис и Тэбом Бенуа Homesick for the Road) является,
    пожалуй, самым разнообразным в музыкальном отношении из всех его предыдущих работ.
    Несмотря на то, что перу самого Кенни принадлежат только последние два трека,
    он привнес свое видение в разнообразные каверы, включенные в этот альбом. Тут
    есть песни Боба Дилана, Джона Хайта, Сонни Ландрета, Ника Лове и других авторов.


    Кенни соединяет различные современные тенденции и традиционные элементы в фирменный
    луизианский коктейль свамп-блюза и соул с примесью кантри - слегка коммерческий,
    но чрезвычайно профессиональный и приятный. Особый шарм отдельным композициям
    придает скрипка Мэри Джо Карлсен. Сам Кенни, как обычно, демонстрирует свой мощный
    эмоциональный вокал, а также мастерскую игру на гитаре и губной гармонике. Добротный
    диск отлично сыгранного современного коммерческого блюза.'
