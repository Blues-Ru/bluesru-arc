reviews:
- id: 668
  author: Александр Панин
  mark: 8
  date: '2005-05-24'
  text: 'Акустический альбом известных гитариста и харпера, записанный в 1998 году в Монпелье (Франция) и впервые выпущенный
    в 2003-м под названием Easy Meeting на лейбле Isabel. В начале 2004 года его переиздали на Аллигаторе как Double Take
    (так что будьте внимательны, если у кого вдруг есть первое издание).


    На диске хороший баланс каверов и оригинального материала - примерно пятьдесят на пятьдесят, все звучит солидно, но иногда
    чересчур гладко. В целом же это хороший и теплый альбом, сделанный несомненно не без современного влияния, но и с большим
    уважением к традиции.'
