  author: Леонид Аускерн
  mark: null
  date: '2002-12-17'
  text: 'Портретная серия альбомов фирмы "Alligator" представляет не только королей, но и принцев блюза. Я имею ввиду не класс
    игры, а возраст исполнителя. Кенни Нил еще сравнительно молод, но еще с детских лет, прошедших в южной Луизиане, буквально
    купался в блюзовой атмосфере. Его отец Рафул Нил — видный блюзмэн, создавший вместе с рядом коллег фирменный стиль блюза
    из Батон-Руж, по названию родного города. Кенни — достойный продолжатель отцовских традиций. Как и большинство блюзменов,
    он поет и играет на гитаре, а кроме того активно использует губную гармонику, с которой он впервые познакомился в возрасте
    трех лет.


    <p>Сегодня Нил-младший вырос в очень яркого мастера, которому есть что сказать в блюзе. "Большие новости из Батон-Руж"
    — так называлс его первый альбом 1988 года. С тех пор "новостей" было много. Кенни издал с помощью фирмы "Alligator" уже
    шесть альбомов. Он много гастролирует по всему миру и явно не зря удостоен своего персонального "портрета" в "галерее"
    фирмы. В музыке Нила, как и у большинства черных блюзмэнов, много перекличек гитары с группой духовых инструментов, а
    помимо "фирменных" трелей губной гармоники, очень рельефно выделяется звучание клавишных. Мои "фавориты" в этом альбоме
    Кенни Нила — композиция его отца "Change My Way Of Livin''" и традиционная тема "Evalina" с виртуозным "разговором" губной
    гармоники, тарелок и гитары на фоне инфернального (в этой пьесе) голоса Кенни.'
