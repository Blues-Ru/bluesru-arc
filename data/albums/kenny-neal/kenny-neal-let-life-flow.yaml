- id: 1336
  author: Андрей Евдокимов
  mark: 8
  date: '2008-10-01'
  text: 'Нет недостатков в сюжетах. Нервно, но не серьезно – о домашней ревности в Another Man''s Cologne. Полный восторг
    и безоблачное счастье в следующем гимнообразном блюзе. Расхваливая музыку, а заодно и кухню родной Луизианы, Нил предупреждает
    "В нашем бульоне плавать опасно – встречаются аллигаторы". Луизианские традиции мешаются с аранжировками модерн-блюза
    и мягкой подачей соул. Нил виртуозный гитарист и очень своеобразный мастер губной гармоники: дует нежно и вкрадчиво. Он
    очень повзрослел, перенеся в личной жизни за последние годы смерть близких и тяжелую болезнь. Новые его песни задают альбому
    светлый тон выстраданного примирения с жизнью (откуда и заглавная песня). Этот блюз глубокий: "Приходится вытерпеть боль,
    чтобы выжить". Но ступает этот блюз мягко, шуточками оттеняя грусть. Бонусом прилагается видеозапись концерта в Нью-Йорке:
    над большой высокой сценой в огромном городе летают чайки, не пугаясь шума и блюза.'
- id: 1919
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-07-05'
  text: 'Долгожданный новый альбом Кенни Нила с авторским материалом (половина треков, остальное - каверы). Кенни исполнилось
    50, и на альбоме ему помогают уже не только братья, но и сын. Альбом получился качественный, профессионально сыгранный
    и спетый, но какой-то я бы сказал вторичный: все чрезвычайно профессионально и гладенько, но нет изюминки, а есть чувство
    deja-vu: где-то я это уже все слышал, и слышал уже не раз.


    Тем не менее пластинка рекомендуется всем любителям коммерческого блюза и соул (с долей годспел и фанка): красивые мелодии,
    роскошные духовые, профессиональная игра всех музыкантов (включая гостевое участие Лаки Петерсона), прекрасный вокал -
    но почему-то не цепляет :-(


    И все же диск занял 9 место в блюзовом топе Биллборда, а песня Let Life Flow была названа блюзовой песней года.'
