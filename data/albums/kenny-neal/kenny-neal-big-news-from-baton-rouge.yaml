  date: '2011-07-05'
  text: Дебютный сольный альбом одного из ведущих исполнителей свамп-блюза - композитора, певца, харпера и гитариста Кенни
    Нила (до выпуска на Аллигатор рекордз в 1988 году этот материал издавался в 1987 году под именем Bio on the Bayou на небольшом
    лейбле King Snake Records). Материал почти полностью авторский. Добротный альбом современного блюза с примесью фанка с
    характерным соул-баритоном Кенни и неплохо аранжированными духовыми, при записи которого среди прочих помогал Лаки Петерсон.
