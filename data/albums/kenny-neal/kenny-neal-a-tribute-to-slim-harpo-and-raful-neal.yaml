  date: '2009-02-05'
  text: '"Я король пчел, я буду жужжать над тобою всю ночь" - блюз Слима Харпо "King
    Bee" с этими строчками сделался вечно зеленым блюзовым стандартом. Блюзовое семейство
    Нилов: папа Рафул и четверо сыновей – записали его плюс еще 9 менее известных
    песен Харпо. То ли семейный состав, то ли очень аккуратная звукорежиссерская стилизация
    придали альбому очень "домашнее" звучание. Мастерская расслабленная игра с вязким
    неторопливым ритмом очень соответствует ленивым амурным шуточкам в текстах. Все
    четко традиционно, под ранний чикагский электрозвук, но с мягким и комфортным
    современным саундом. Именно в самой грустной песне диска "Late Last Nite" отлично
    слушается дуэт голосов и губных гармоник Рафула и Кенни, отца и сына. Идиллическая
    картина! Вот только блюз не терпит идиллий. Рафул успел поработать над записью
    только половины альбома – его не стало в сентябре прошлого года. И альбом, задуманный
    как дань памяти Слиму Харпо, вышел с двойным посвящением.'
