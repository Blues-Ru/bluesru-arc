- id: 1122
  author: Константин Колесниченко
  mark: 8
  date: '2007-08-29'
  text: Кенни Нил - отпрыск большой блюзовой семьи, во главе которой стоял, недавно
    умерший, Рафул Нил - известный луизианский харпер. Кенни относительно молодой
    музыкант, родившийся в конце 50-х. Это блюз нового поколения, впитавшего много
    от старых музыкантов, правильная, в хорошем смысле, музыка. Свою гармонику он
    получил от Слима Харпо, играл с 17 лет не басу у Бадди Гая, на гитаре в группе
    отца. Отличная школа, неправда ли? Кенни замечательно играет на гармонике, с отличным
    сочным звуком и агрессивной подачей (неудивительно при таком отце) и хорошо владеет
    гитарой. Но основным достоинством Нила я бы назвал вокал - мощный, естественный
    и мужественный. Судя по тому, что основными лэйблами, выпускающими его альбомы
    являются Аллигатор и Теларк, Кенни довольно популярен и известен на родине. Альбом
    "Hoodoo Moon" - отличное сочетание блюза, соула, фанка и рока. Это современная
    подача блюза. К счастью Кенни не играет заезженных стандартов, хотя "It Hurts
    Me Too" он все же исполнил - единственный штамп на диске. Его песни интересны,
    например, в "Carryng The Torch" Нил поет о том, что он должен продолжать блюзовые
    традиции. В ансамбле Кенни играют его брат Ноель Нил (известный своим участием
    в ансамбле ДЖеймса Коттона) - бас, на клавишах Лаки Питерсон, King Snake Horns
    (при участии основателя, переставшего cуществовать, лейбла KingSnake) Bob Greenlle
    и др.
