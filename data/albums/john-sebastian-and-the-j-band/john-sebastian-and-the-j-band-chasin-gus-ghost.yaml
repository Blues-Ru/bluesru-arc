reviews:
- id: 103
  author: Алексей Калачев
  mark: 8
  date: '2003-02-24'
  text: 'Изумительный диск акустического блюза и фолк-песен, записанный белыми музыкантами.
    Да, нужно добавить, что Джон Себастиан и его друзья не просто музыканты – они
    супермузыканты, а некоторые – крупные звезды. Напомню, что сам Джон – звезда первой
    величины, сделавшая себе имя, сочиняя и исполняя песни легендарной группы Lovin''
    Spoonful. Но это было в 60-е годы, теперь же – что известно далеко не многим,
    - Себастиан основал фирму грамзаписи "Голливуд Рекордз", на которой занимается
    выпуском собственной музыки и пластинок "корневых" артистов. В создании диска
    1999 года участвовали, в частности, классик Янг Рэчел (мандолина и голос), гитарист
    Джимми Вивино, звезда фолк-музыки Джеуф Мюльдор, известнейший дуэт (голос, гитара,
    гармоника) Пол Райшел и Энни Рейнс. Одно лишь перечисление этих имен должно заставить
    приятно взволноваться любого поклонника кантри-блюза. Изюминка диска: здесь вы
    сможете услышать звучание джаг-бэнда, то есть небольшого ансамбля, в котором роль
    басового инструмента выполнял горшок или другая стеклотара. Участник такого ансамбля,
    которые процветали в Америке в 20-е годы, гудел в этот самый джаг, издавая глубокий,
    объемный звук, подобный звуку тубы.'
