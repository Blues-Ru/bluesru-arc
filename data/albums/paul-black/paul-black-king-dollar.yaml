- id: 1097
  author: Константин Колесниченко
  mark: 10
  date: '2007-06-16'
  text: 'О Paul Black практически ничего не знает Оллмьюзик и Гугл, но знает А.Евдокимов и блюз.ру. Там я когда-то давно и
    прочитал об этом музыканте, но альбом его непросто достать - музыкант малоизвестный. Абсолютно случайно попал ко мне этот
    диск года 2 назад и я был очень приятно удивлен.


    Пол - отличный гитарист, классно играет слайдом. Альбом я даже не знаю, к какому подстилю блюза отнести - это не свинг,
    не блюз-рок, это музыка Пола Блэка! Игре слайдом Пол научился у своего друга Sonny Landreth в 70-х, потому, поверьте,
    играет он отлично. Мне очень нравится вокал Блэка, для него тоже сложно выбрать категорию, но звучит он хулиганисто.Группа
    Блэка, Флипкингс, названа в честь игры в бейсбольные вкладыши. В этом что-то, есть не правда ли? Музыка на диске - авторские
    композиции в перемешку с хитами Роллинг Стоунз и Роберта Джонсона. Все исполнено в оригинальной манере Блэка - смесь дельта-блюза,
    чикаго-блюза, блюз-рока, акустика. Венец отношения Пола к блюзу и жизни является песня Pat Hare "I''m Gonna Murder My
    Baby"; и автору композиции и Блэку можно верить в данном случае.


    По обложке и фамилии Пола можно подумать, что это что-то из разряда хард-н-хеви, не пугайтесь, это не так. Это отличный
    блюз в духе 70-х от человека, что в то время тусовался с Элвином Бишопом, Блумфилдом и прочими.'
