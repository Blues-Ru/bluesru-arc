reviews:
- id: 634
  author: Александр Панин
  mark: 7
  date: '2005-05-20'
  text: 'Харпер-ветеран Джеймс Коттон после перенесенной операции на горле почти не может петь, поэтому для записи своих последних
    альбомов приглашает разных гостей. На этом диске 2004 года с ним выступают Марсия Болл, Рори Блок, Си Джей Шенье, Одетта
    и многие другие. Тринадцать треков, из которых четыре инструментальных. Не в первый раз Коттон обращается к архаике, тут
    такие вещи, как When You Got A Good Friend, Key To The Highway, How Long Blues, Mississippi Blues...


    Диск получился вполне адекватным и нормальным, но каких-либо откровений на нем нет. Самые впечатляющие композиции - инструментальные
    и, пожалуй, Mississippi Blues с участием Рори Блок. Послушать приятно, но в итоге три с половиной балла.'
- id: 1461
  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: 'Будет ли блюзмен продолжать петь блюз, если лишиться голоса? Опыт Джеймса Коттона дает положительный ответ. За почти
    десять лет после операции на горле, превратившей его голос в хрип, Коттон записал уже пятый альбом и продолжает успешно
    гастролировать. Поет его гармоника и приглашенные вокалисты. В новом альбоме, впрочем, как и в предыдущем, певческий состав
    - звездный. Одетта мурлычет комфортную вариацию бродяжного блюза "Пора в дорогу", Си-Джей Шеньер со своим аккордеоном
    добавляет новоорлеанские рулады, Бобби Раш игрив в заглавной песне: "Крошка, не рви на мне одежду"... Но это Джеймс Коттон
    выстраивает общее настроение неспешного блюза многолетней выдержки, уверенного и задушевного. Не с этого альбома стоит
    начинать слушать Коттона – в его обширной дискографии есть более яркие шедевры. Но старых друзей корифей порадовал: приближаясь
    к 70-летию, он полон сил.'
