  date: '2009-07-01'
  text: 'Свою сольную карьеру Джеймс Коттон начал в 60-х и сразу же взял за направление
    популярную тогда смесь блюза, фанка и соул музыки. В середине 80-х, он опять взялся
    за чикагский блюз, за ту музыку, которую он играл в блюзбенде Мадди Уотерса, дуя
    из-за всех сил в свои маленькие гармоники.


    Альбом 1991 года "Mighty Long Time" один из двух замечательных альбомов Джеймса
    для техасского лейбла "Antone''s", первый из них "Live at Antone''s" даже был
    номинирован на Грэмми как лучший альбом традиционного блюза. Возвращение к своим
    корням и истокам – вот как можно охарактеризовать этот альбом Коттона. Тут и песни
    из репертуара Мадди Уотерса "Blow Wind Blow", "Everything Gonna Be Alright", "Sugar
    Sweet", и Хаулин Вульфа (на которых ему аккомпанирует участник блюзбенда Волка
    - Хьюберт Самлин) "Moanin'' At Midnight" "Three Hundred Pounds Of Joy"; дань памяти
    своему учителю, Санни Бою Вильямсону, "Moghty Long Time", а также несколько своих
    коронных номеров вроде "Black Nights" и "Hold Me In Your Arms" и т.д.


    Отдельных слов заслуживает состав, участвовавший в записи альбома: Luther Tucker,
    Matt Guitar Murphy, Hubert Sumlin, Jimmy Vaughan, Pinetop Perkins, Calvin Jones,
    Willie Smith, Derek O''Brian, Mark Kazanoff и др.


    Альбом у Коттона получился показательным в том плане, что даже блюзовые стандарты
    могут быть уникальным в прочтении такого самобытного и интересного музыканта.
    Классика блюза от живой легенды этой музыки.'
