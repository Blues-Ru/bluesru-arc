reviews:
- id: 1170
  author: Дмитрий Казанцев
  mark: 7
  date: '2007-12-09'
  text: 'Возвращение Коттона в строй - он 8 лет не выпускал альбомы! Здесь он играет
    на гармошке и поет с двумя группами - "The James Cotton Chicago Blues All-Stars"
    (Magic Slim, Pinetop Perkins, Aron Burton, Robert Covington) & "The James Cotton
    Band". Разница по звуку велика, а песни идут вперемешку - 5 с одной группой и
    5 с другой.


    Мощный, хриплый голос и яркая игра на гармошке - все это хорошо, но вот звук/продакшн
    80-х почти ужасен местами. Дело в том, что голос и гармошка "торчат" в балансе
    и мешают слушать группу (особенно это слышно с All-Stars). Песни же разнообразные
    - классика блюза, шаффлы, фанк и традиция.'
- id: 1508
  author: Константин Колесниченко
  mark: 9
  date: '2009-03-10'
  text: 'Первый свой альбом Джеймс Коттон записал в 1967 году, это был "Cut Your Loose!",
    ему предшествовала работа с Магди Уотерс и синглы для "Sun". Именно на своем первом
    альбоме Джеймс начал экспериментировать с соул-музыкой, джазом ритм-н-блюзом.
    Записывать такие эклектичные альбомы Коттон продолжал до 1984 года, когда вышел
    его знаменитый "High Compression" на "Аллигаторе". Именно этим альбомом закончился
    самый интересный период в творчестве музыканта. Все последующие работы, в большинстве
    своем, были замечательные, мастерски сыгранные, но не такие яркие и интересные.


    Альбом "High Compression" условно можно разделить на две части – одна сыграна
    в довольно традиционном, для чикаского блюза, ключе с известными блюзменами Города
    Ветров: Magic Slim, Pinetop Perkins, Aron Burton, Robert Covington. Вторая часть
    исполнена в более фанковой и современной манере и сдобрена звучанием духовой секции.
    В записи нового материала участвовал тогдашний блюз-бенд Джеймса Коттона, в состав
    которого входил брат Кенни Нила басист Noel Neal, гитарист Michael Coleman, барабанщик
    (известный по работе с Бадди Гаем и другими звездами чикагского блюза) Ray Allison
    и др.


    Насколько я знаю, эта запись получилась одной из самых коммерчески успешных у
    музыканта и даже номинировалась на "Грэмми". Но и вправду, альбом получился замечательным,
    очень сильным по материалу и исполнению, действительно одна из самых сильных записей
    в дискографии музыканта!'
