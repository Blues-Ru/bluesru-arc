- id: 1029
  author: Александр Панин
  mark: 7
  date: '2006-09-10'
  text: На этом диске около часа акустического блюза. Вместе с Джеймсом Коттоном (губная гармошка, вокал) играют гитарист
    Джо Луис Уокер и джазовый басист Чарли Хейден. Состав любопытнейший, как видите. Музыка звучит отличная, здесь ряд удачных
    каверов старых известных вещей и хорошие новые композиции Коттона. На мой взгляд, единственное, что портит (и довольно
    серьезно) эту запись, это вокал самого Джеймса. В девяностых годах Коттон испытывал большие проблемы с горлом, приведшие
    к необходимости хирургических операций, после которых ему пришлось сконцентрироваться исключительно на игре на губной
    гармошке. Но здесь он все еще пытается петь, и явным контрастом по отношению к остальным номерам звучит композиция Мадди
    Уотерса Two Trains Runnin', исполняемая Уокером. Если бы последнему доверили вокал на всех остальных треках, диск получился
    бы просто шедевральным. Но и так он завоевал Грэмми и премию W.C.Handy как лучший альбом традиционного блюза 1996 года.
