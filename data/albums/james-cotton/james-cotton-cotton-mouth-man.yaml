  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2013-07-11'
  text: 'Легендарный харпер Джеймс Коттон выпустил этот альбом в возрасте 77 лет,
    но ничто в его музыке не выдает этот возраст. Альбом был записан в Нэшвилле, вышел
    на фирме Аллигатор рекордз и представляет собой своего рода музыкальное путешествие
    по итогам долгой и выдающейся блюзовой карьеры музыканта. Сам Джеймс выступил
    соавтором семи песен, многие из которых основаны на историях из его жизни.


    В записи помогали музыканты мирового класса, которые сотрудничают с Коттоном уже
    не один год, а также приглашенные звезды: Грег Олман, Джо Бонамасса, Руфь Фостер,
    Уоррен Хэйнс, Делберт МакКлинтон и Кеб Мо. Основную долю вокальных партий записал
    Дэррел Нулиш (6 песен), отметились и гости, а на последнем треке поет сам виновник
    торжества, который был вынужден отказаться от пения много лет назад в результате
    рака горла. Зато на гармонике Коттон играет так, что любому слушателю понятно,
    откуда берется вполне заслуженная слава великого харпера.


    Музыка диска - это энергичный и мощный традиционный блюз с современным звучанием,
    поднимающий настроение слушателя. Сам Коттон отметил: "Я так счастлив от музыки
    на этом диске. Надеюсь, что каждый, кто ее слушает, почувствует это. Я знаю, что
    со мной это определенно было именно так!"


    Джеймс Коттон записал один из лучших дисков за всю свою карьеру и лишний раз доказал,
    что на сегодняшний день вряд ли найдется равный ему мастер губной гармоники. Четвертое
    место в топе блюзовых альбомов и номинация на Грэмми. К сожалению, этот альбом
    оказался последним творением большого мастера.'
