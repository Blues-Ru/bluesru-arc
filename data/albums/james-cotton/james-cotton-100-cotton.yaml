  author: Александр Панин
  mark: 10
  date: '2005-05-20'
  text: Отличный диск Джеймса Коттона 1974 года. Чуть менее сорока минут очень бодрого и энергичного ритм-энд-блюза со значительными
    элементами фанка и соула. На гитаре играет Мэтт "Гитар" Мерфи, сам Коттон отменно дудит в гармонику и так же отменно поет.
    Слушается на одном дыхании! Пять баллов.
