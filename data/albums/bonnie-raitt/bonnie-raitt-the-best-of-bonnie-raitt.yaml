  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2013-04-25'
  text: 'The Best Of Bonnie Raitt On Capitol: 1989-2003


    Бонни Райт - певица, композитор и гитаристка (виртуозно владеющая в том числе и слайд-гитарой) - довольно известная фигура
    на блюзовой сцене Америки. (Кстати, она была одной из первых крупных мировых звезд, приезжавших в нашу страну в конце
    80-х вместе с Дуби Бразерс и Карлосом Сантаной). Первый ее сольный альбом вышел в 1971 году, а ее музыка всегда сочетала
    в себе элементы блюза, кантри и традиционного американского мелодичного рока в стиле Флитвуд Мэка середины - конца семидесятых.


    Данный сборник охватывает период ее сотрудничества с фирмой Капитол - с момента выхода ее блокбастера 1989 года Nick of
    Time (ее десятого сольного альбома). Тут и блюз, и кантри, и рок-н-ролл, и мелодичный рок. Включены все основные хиты
    этого периода: "Thing Called Love," "Nick of Time," "Something to Talk About," "Love Sneakin'' Up on You", "Time of Our
    Lives" и "Hear Me Lord". За Rock Steady с Брайаном Адамсом просто можно памятник поставить!'
