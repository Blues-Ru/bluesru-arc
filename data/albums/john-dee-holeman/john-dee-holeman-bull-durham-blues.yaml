  author: Андрей Евдокимов
  mark: 8
  date: '2003-12-06'
  text: 'Джон Ди Хоулмэн родился в Орандж Каунти, Северная Каролина, в 1929 году.
    Он - рассказчик, гитарист, танцор и художник. Его учителями были ученики Блайнд
    Боя Фуллера. И в его исполнительском почерке смешались элементы техасского и пьедмонтского
    стилей. Большую часть жизни музыка была только второй его профессией. Работал
    он мотористом. А на склоне лет стал получать зарплату в Государственном фонде
    национальных искусств, и за госсчет гастролировал по Штатам, Европе и Азии, демонстриру
    глубину народных традиций Нового Света. Альбом "Могучий Дарнхемский блюз" записал
    аудиофильской фирмой "Cello", и являет превосходно естественный акустический саунд.
    Народные темы, несколько блюзовых стандартов от Роберта Джонсона, Мадди Уотерса,
    Лайтнинг Хопкинса и Джимми Рида, а также собственные сочинения. В записи четырех
    трекаов принимал участие Тадж Махал, играя на различных инструментах: басс, фортепиано
    и гитаре, а так же экзотических блюзовых костаньетах - Хэмбоун. Диск - подарок
    любителю традиционного блюза.


    Состав: <br> J.D.Holeman - v, g<br> Taj Mahal - b #4, p # 8, hambone # 11, g #13'
