  date: '2005-08-24'
  text: 'Обложка тут - http://www.ljplus.ru/img2/d/r/dr_nick/ledet-1.jpg


    А вот это очень интересно - шедевральная музыка от неизвестной группы из Луизианы. Кори Леде играет на аккордеоне и поет
    (и то и другое он делает ПРЕКРАСНО); с ним группа - барабаны, бас, стиральная доска и гитара. Музыка зайдеко и кейджн,
    но есть блюзовые номера, а также ритм-н-блюз, соул и фанк. Почти все вещи написаны самим Кори, но до чего ж они хороши!
    Тут два известных хита: "My Babe" (в авторстве стоит ???? ?????) и "Way Back Home" - знаменитая тема The Jazz Crusaders
    (в авторстве - Jazz Crewsiders); ребята еще и с юмором, как видите.


    Классная музыка с разнообразными ритмами, в мажоре и миноре, иногда поют на голоса, а иногда просто инструменталы. Эти
    парни приезжали недавно в Москву на фестиваль "Танцы" в саду "Эрмитаж", у них и был куплен этот шедевр (А. Панин сделал
    это; спасибо ему).'
