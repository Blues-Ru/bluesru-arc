reviews:
- id: 218
  author: Алексей Калачев
  mark: 6
  date: '2003-09-18'
  text: 'На четвертом альбоме сын Мадди Вотерса проявил зачатки оригинальности в пении.
    Сила отцовского влияния настолько высока, что до сих пор о творческой самостоятельности
    его отпрыска говорить не приходилось. Впрочем, дело не только в этом. И возможно,
    не столько в этом, сколько в давлении менежмента: покупатели дисков ждут от Билла
    этой похожести на папу, а начальство настаивает на том, чтобы Билл не обманывал
    их надежды. Так или иначе, наш герой по-прежнему чертовски напоминает на новом
    альбоме отца, хотя несколько удалился в аранжировках от твердокаменных образцов
    чикагского золота 50-х. Лучший диск Биг Билла, комфортный и прекрасно записанный.'
