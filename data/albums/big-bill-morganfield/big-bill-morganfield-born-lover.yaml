- id: 1605
  author: Андрей Евдокимов
  mark: 7
  date: '2010-01-23'
  text: Ясно, что Мадди Уотерсу в голову бы не пришло записывать сопливую любовную
    песенку My Love Is Real. Сынок его не побрезговал, он вообще менее брутален, рычит
    не так грозно и его слайд-гитара не решается стенать с той же отчаянной тоской…
    И вырос Морганфилд-младший не в Чикаго, и университетское образование получил
    как положено… А все же, черт побери, временами чем-то очень похож. Дебютировал
    он всего 10 лет назад, сразу получил Блюзовую премию как "Лучший новый артист".
    Нынешний альбом по саунду легче дебютного, зато по вокалу и игре прибавилось уверенности
    в себе. Юмористичные блюзы ("Нервы у тебя как у медной обезьяны") получаются у
    него лучше всего, но в начале "Моя последняя любовь" его "Оh Yeah" пробирает до
    мурашек по спине – вылитый папаша! Гитарист Боб Марголин, гитарист блюз-бэнда
    Мадди Уотерса, здесь играет и работает сопродюсером в студии. Но особо стоит отметить
    харпера Стива Гайгера – вот кто органично вписался бы в ансамбль Отца чикагского
    электроблюза.
