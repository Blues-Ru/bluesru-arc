reviews:
- id: 389
  author: Дмитрий Казанцев
  mark: 4
  date: '2003-12-20'
  text: 'Сон Силз - довольно мрачный дядька со сдавленным голосом и довольно занудной
    манерой игры на гитаре. Его манера пения и игры на гитаре не раполагают слушателя
    к спокойному и долгому прослушиванию. Слава Богу, на этом диске довольно приличный
    звук для Alligator Records 1991 года. Альбом очень длинный - 11 песен на 55 минут.
    Это о плохом, а теперь о хорошем.


    На диске есть очень хорошие песни! Я бы выделил Frigidaire Woman, Woman In Black
    и The Danger Zone. Оба басиста великолепно играют на всем альбоме, клавишник тоже
    на высоте. Удачно звучат и духовые в нескольких треках.


    Оценка 2 балла. Местами очень занудная гитара (он никак не может остановиться
    пилить), иногда достает натужный и темный вокал (кажется, что он чем-то недоволен
    или просто зол). А вот материал довольно интересный; есть блюз, соул, фанк. Грува
    не получается из-за разницы в манере игры басиста и драммера; остается лишь грубый
    драйв, но многим только это и подавай. Если у Вас часто плохое настроение, не
    покупайте этот альбом.'
