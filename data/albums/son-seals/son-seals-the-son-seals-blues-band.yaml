  author: Константин Колесниченко
  mark: 8
  date: '2009-04-06'
  text: 'Son Seals - один из самых ярких черных блюзменов поколения 40-х годов, а его дебютный альбом "The Son Seals Blues
    Band" - одна из самых ярких записей чикагского West-Side блюза.


    Son Seals попал в Чикаго из Арканзаса. Его отец, в прошлом сам блюзмен, открыл в небольшом городке Osceola клуб. Таким
    образом, с детства Son имел возможность слушать, смотреть и играть со многими известными блюзменами, гастролирующими в
    этих краях. В те годы основными его инструментом были барабаны. В Чикаго он попал в 63 году, где почти сразу начал выступать,
    открывая концерты своего друга Ирла Хукера. В 66 году, он попадает в группу к другому известному блюзмену – Альберту Кингу,
    у которого он с гитары опять переключился на барабаны. В 1971 году его отец умирает и он окончательно перебирается к своей
    сестре в южную часть Чикаго, где много джемует и общается с Hound Dog Taylor. В одном из меcтных клубов он и становится
    резидентом, заменив на этой должности Тейлора.


    Прослушивание у Брюса Иглауэра, президента "Аллигатора", Son Seals прошел по телефону, тот просто слушал, как играет группа
    в одном из клубов. Дебютный альбом Seals''а сделан по всем правилам популярного тогда Вест-Сайд блюза – несколько блюзов,
    исполненных в более-менее классической манере, фанки-блюз и "All Your Love" - хит Меджик Сэма – тест, который должны пройти
    все музыканты, играющие в этом стиле.


    В каждой декаде 20-го века у блюза были свои ключевые альбомы, характеризующие развитие жанра на этот момент, вкусы публики
    и музыкантов. "The Son Seals Blues Band" – один из таких альбомов.'
