- id: 1682
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-05-18'
  text: 'Одна из ярких звезд современного чикагского блюза, гитарист и певец Шон Силс (настоящее имя - Фрэнк Силс) стал известен
    широкой публике благодаря главе фирмы Аллигатор рекордз Брюсу Иглауэру, который заключил контракт с молодым артистом и
    выпустил его первый сольный альбом в 1973 году. Несмотря на то, что первым инструментом Силса Были ударные, к 18 годам
    он уже освоил гитару, а дальнейшая работа с Альбертом Кингом только укрепило желание Шона стать настоящим блюзменом.


    Данный альбом - его седьмой сольник на фирме Аллигатор, содержащий всего 4 трека собственного сочинения и две трети каверов.
    Это типичный современный чикагский блюз в интерпретации Шона Силса - с его рычащим хриплым баритоном, сырыми гитарными
    рифами, изобилием гитарных соло и эпизодическими включениями духовых. Возможно, это не самый лучший диск Силса, но один
    из лучших, и вполне репрезентативный.'
