reviews:
- id: 1055
  author: Дмитрий Казанцев
  mark: 8
  date: '2007-03-31'
  text: 'Второй альбом Сона. Записан в Чикаго на студии Кертиса Мейфилда. Чикаго-блюз, фанк-блюз и ритм-н-блюз на одном альбоме.
    Отличные духовые и ритм-секция, пение прекрасное. Гитара грязноватая и громко выведена - это может не всем понравиться.


    Считается, что это его лучший диск. Из 9 песен Сон написал 7 - это хороший показатель.'
