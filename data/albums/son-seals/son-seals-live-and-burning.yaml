  text: Сорокапятиминутный концертный диск Силза и его команды. Довольно энергичное
    выступление 1978 года в небольшом чикагском клубе. Играют очень здорово, у меня
    есть претензии только к вокалу - поет Сон временами как-то надрывно. Все остальное
    в полном порядке, концертники Силза к прослушиванию рекомендуются.
