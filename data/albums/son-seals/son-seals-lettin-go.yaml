reviews:
- id: 241
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: В блюзовом мире явно настало время перемен. По крайней мере, в последнее время
    блюзмены меняют фирмы звукозаписи как перчатки. Вот и Son Seals, в течение 26
    лет хранивший верность открывшему его Alligator, ушел на богатенький аудиофильный
    Telarc. Переход оказался удачным. Пожалуй, "Letting Go" - самый сильный из последних
    блюзовых релизов Telarc, среди которых были работы таких звезд, как Pinetop Perkins,
    Ronnie Earl и James Cotton. Единственное - я бы поменял местами первый и второй
    треки. Забойная "Let It Go", по-моему, лучше бы открыла пластинку, нежели тягучая
    "Bad Blood". В остальном же "Letting Go" очень хорош. Хорош Seals с его густым
    вокалом и колоритными гитарными соло, хороша духовая секция... И отлично подобраны
    блюзы, написанные в основном лидером этой сессии. Нашлось место и небольшой шутке
    - на запись своей старенькой вещицы "Funky Bitch" Son Seals, к удивлению многих,
    пригласил гитариста из группы Phish Trey Anastasio, что, кстати, общей картины
    не испортило.
