- id: 1269
  author: Константин Колесниченко
  mark: 9
  date: '2008-05-20'
  text: 'На буклете к диску приведены цитаты о Поле, различных, довольно известные
    музыкантов, например Rick Estrin: "A legend… a musician''s musician." или James
    Cotton: "Paul Oscher''s a monster: harp, piano, and guitar-plays slide like Muddy".
    Правы ли они? Конечно правы, но чтобы оценить по достоинству альбом нужно самому
    быть или музыкантом, или серьезно увлекаться блюзом. Новичкам в блюзе этот альбом
    не будет интересным.


    Пол - мультиинструменталист: различные виды гармоник (диатоническая, басовая,
    хроматическая), мелодика (звук которой он пропустил через какой-то процессор и
    заставил звучать как Hammond), гитара, аккордеон, пианино. Возможно поэтому он
    записал альбом именно в формате "Alone With The Blues". Речь не идет о наложении
    инструментов, а о том, что он играет одновременно на нескольких. Сторонние музыканты
    попадаются на альбоме всего на нескольких композициях. Но какие это исполнители
    - Calvin "Fuzz" Jones, Willie "Big Eyes" Smith, David Maxwell!


    Музыка альбома - это чикагский или дельта блюз, разбавленный свингующей "Walkin''
    " или, например, госпелом "Glory, Glory". У Пола очень хороший вокал в духе John
    Lee Hooker!


    На протяжении всего альбома меня не покидало ощущение виртуозности Paul Oscher
    и это чувство появилось не столько от потрясающего владения им инструментами,
    на которых он играет, сколько от его подлинного понимания блюза, его настроения
    и истории!'
