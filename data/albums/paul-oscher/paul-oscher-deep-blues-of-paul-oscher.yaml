- id: 1531
  author: Константин Колесниченко
  mark: 10
  date: '2009-04-30'
  text: 'Если я скажу, что этот альбом - шедевр, я не преувеличу. У него есть все составляющие настоящего блюза - музыканты
    (половина из которых играли в блюз-бенде Мадди Уотерса), понимающие как играть эту музыку, подлинное блюзовое чувство
    и отлично подобранный материал.


    Я уже писал об одном альбоме Пола <a href="http://www.blues.ru/data/album.aspx?cdid=1248">тут</a>, потому за всякими биографическими
    подробностями идите туда.


    С первой композиции "Satan''s Woman" альбом цепляет и не отпускает до небольшой блюзовой байки и соло Пола на фортепиано
    в последней композиции "Summer Jam". Oscher играет очень лаконично и просто, но в каждой его ноте есть то, чего порой
    не хватает целым альбомам некоторых музыкантов. "Satan''s Woman"'
