  date: '2018-08-10'
  text: 'Группа The Hoochie Coochie Men была создана двумя австралийскими музыкантами
    - гитаристом и певцом Тимом Гэйзом и ударником Робом Гроссером - с привлечением
    знаменитого бас-гитариста Боба Дэйсли (который родом также из Австралии, хотя
    первую известность получил в составе английской блюзовой группы Chicken Shack).
    Такое же название группы по знаменитому блюзу Мадди Уотерса было в свое время
    у коллектива Лонг Джона Болдри, но это было почти 40 лет назад. С группой периодически
    играл великий клавишник Джон Лорд, а также ряд приглашенный харперов и вокалистов.
    Музыка группы оправдывает ее блюзовое название и представляет собой довольно жесткий
    блюз-рок в перемешку с хард-роком, сыгранный на высочайшем профессиональном уровне
    с обилием гитарных и органных соло.


    Альбом Danger: White Men Dancing был записан в Сиднее и содержит 4 кавера плюс
    авторский материал. Характерный тембр хаммонда Джона Лорда узнается с первых секунд.
    При записи помогали три именитых вокалиста: Иан Гиллан (4 и 7), Джимми Барнс,
    популярность которого в австралийском блюзовом сообществе никак не ниже, чем у
    его именитых коллег (6 и 10), а также еще один австралиец Джефф Дафф (3 и 11).
    На остальных треках поет гитарист Тим Гэйз. Продюсировал альбом Боб Дэйсли. Диск
    звучит мощно, мелодично и современно, а треки Over And Over и If This Ain''t The
    Blues с вокалом Гиллана наверняка не оставят равнодушным любого поклонника Deep
    Purple. Очень достойная работа от профессионалов своего дела.'
