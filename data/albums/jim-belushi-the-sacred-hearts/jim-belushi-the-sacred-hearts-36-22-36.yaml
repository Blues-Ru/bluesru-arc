  author: Константин Колесниченко
  mark: 8
  date: '2007-06-16'
  text: 'Джим продолжает традиции своего старшего брата Джона, основателя Blues Brothers. Вот и музыка на альбоме такая же
    по стилю, настроению, духу. С Джимом играет отличная, звездная группа, в которой, например, состоят: Darrell Leonard (trumpet),
    Joe Subblet (sax), Tony Braunagel (drums), JJ Holiday,Johnny Lee Schell (guitars) и т.д. Но гостями альбом удивить тоже
    может: Delbert mcClinton, Charlie Musselwhite, McCoy Tyner.


    В общем, ровная, качественная работа, сделанная с отличным знанием материала, юмором (хороша авторская песня про курение),
    снабженная отличной игрой музыкантов, духовой секцией, подпевками и многим другими приятными неожиданностями (например,
    Джим достаточно сносный певец). Самая сильная сторона альбома - это отличный набор композиций, а так же их прекрасные
    аранжировки, не добавить не убавить.'
