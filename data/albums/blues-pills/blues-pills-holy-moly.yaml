  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2022-10-31'
  text: 'Blues Pills - шведская рок-группа, созданная в городе Эребру в 2011 году. Музыканты черпают вдохновение в рок-музыке
    конца 60-х - начала 70-х прошлого века, играя олдскульный хард-рок на блюзовой основе с изрядной примесью психоделии.
    Группа записала три мини-альбома (EP) и несколько синглов на немецком лейбле звукозаписи Nuclear Blast, после чего 25
    июля 2014 года вышел дебютный студийник Blues Pills. Второй альбом Lady in Gold был выпущен 5 августа 2016 года и занял
    первое место в официальном хит-параде Германии.


    Holy Moly! - третий (и последний на данный момент) полноформатный студийник шведских ретро-рокеров во главе с голосистой
    Элин Ларссон, вышедший 21 августа 2020 года. К моменту создания альбома в группе произошли перемены: в ноябре 2018 года
    ушел гитарист оригинального состава Дориан Соррио, а игравший до этого на басу Зак Андерсон переключился на гитару. В
    октябре 2019 года вакантное место бас-гитариста занял Кристофер Шэндлер. Выходу альбома предшествовал выпуск трех синглов
    - "Proud Woman", "Low Road" и "Kiss By Past Goodbye", причем на каждый из этих треков было снято видео.


    Альбом полностью состоит из авторского материала, написанного тремя оригинальными участниками, причем тексты сочинили
    Элин и Зак. Продюсировала диск также эта троица - Андре Квартстрем, Элин Ларссон и Зак Андерсон. В качестве звукоинженера
    выступил Зак Андерсон. В музыкальном плане мы имеем дело с приблюзованным хард роком, сдобренным психоделией - в лучших
    традициях конца 60-х. Песни не слишком длинные, музыканты не козыряют особым мастерством исполнения, но создают особую
    ретро-атмосферу. Для диска характерен нарочито грязный и жесткий саунд в стиле live-in-the-studio. Альбом добрался до
    4 места в чартах Германии, тогда как на родине он занял только 11 место.'
