  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2015-04-01'
  text: 'Концертный альбом от интернационального квартета ретро блюз-рокеров, записанный по итогам гастролей в поддержку их
    прошлогоднего дебютника (который, кстати, добрался до 5 места в Германии). Группа молодых музыкантов играет смесь хард
    и блюз-рока в традиции 70-х с мощным вокалом Элин Ларссон. Концертник сделан в классическом ключе - более длинные версии
    треков, гитарные запилы и тп. К вокалу и владению инструментами особых претензий нет, да и изрядный драйв у команды присутствует,
    но главный недостаток такой-же, как и у всех современных молодых групп - отсутствие запоминающихся мелодий и риффов (пока
    песня играет, все вроде неплохо и даже хорошо, а как закончится, то вроде и вспомнить нечего).


    Тем не менее потенциал у ребят имеется, и потенциал неплохой.'
