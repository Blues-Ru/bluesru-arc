- id: 1636
  author: Андрей Евдокимов
  mark: 7
  date: '2010-07-20'
  text: 'Группа существует с 1972 года. И почти в оригинальном составе – только гитарист Джимми Текери покинул ее ради сольной
    карьеры. Но впервые группа обратилась к чисто акустическому альбому. Записан он был "по случаю": музыканты выступали в
    студии радиостанции B.B. King''s Bluesville, концерт прошел без помарок и альбом готов! В репертуаре – классика блюза.
    Но музыканты не мимикрируют под аутентичное звучание. Атмосфера сегодняшнего джема на любимые музыкальные темы – главное
    достоинство альбома. Четкий ритм "белого свинга", превосходные соло губной гармоники, акустические гитара и добро, деликатная
    и безупречная ритм-секция… Профессионалам будут интересны искусные нюансы. Харпер Майк Уэннер, основатель группы, обладает
    своим индивидуальным почерком в звукоизвлечении, в построении импровизации и в умелых "брейках". Альбом не яркий, избегающий
    столкновения сильных эмоций, очень ровный и надежный. "Ночные ястребы" знают свое дело.'
