- id: 1705
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-05-19'
  text: 'Группа Nighthawks была создана в 1972 году в Вашингтоне харпером и вокалистом Марком Уеннером и гитаристом Джимми
    Тэкери. С тех пор прошло уже почти 40 лет, а группа по-прежнему радует слушателей качественным блюзом. Джимми Тэкери покинул
    группу в 1986 году и начал успешную сольную карьеру.


    Альбом 1976 года - один из лучших у группы, а многие считают его просто лучшим. На нем группа играет жесткий блюз и паб-рок,
    опираясь на каверы блюзовой классики от Хаулин Вулфа, Сонни Бой Уиллиамсона, Уилли Диксона и других. Интерпретация группы
    по сравнению с оригиналами звучит более сыро, но одновременно искренне, и это подкупает. Музыканты играют от души и с
    хорошим драйвом, а сам альбом уже давно стал классикой современного блюза, заслужив тем самым переиздание на CD в "золотом"
    формате от Mobile Fidelity. На последнем треке, записанном "вживую", к группе присоединился знаменитый пианист Пинетоп
    Перкинс.'
