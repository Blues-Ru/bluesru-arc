  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-19'
  text: 'Американская группа The Nighthawks была основана аж в конце 60-х, начала выпускать альбомы в начале 70-х, играла
    блюз, блюз-рок, паб-рок, рок-н-ролл, успела послужить пристанищем множеству известных музыкантов (пожалуй, наиболее успешный
    из них гитарист Джимми Тэкери), и функционирует до сегодняшнего дня.


    Альбом "Американский ландшафт" был записан в 2008 году и издан в начале 2009. Чего ожидать от музыкантов с таким профессиональным
    опытом? Вопрос, скорее, риторический. Тут и профессиональная игра на губной гармонике одного из основателей коллектива
    харпера и вокалиста Марка Уэннера, и искусные соло и слайд-риффы гитариста Поля Белла, и слаженная ритм-секция из еще
    одного ветерана группы ударника Пита Рагуза и бас-гитариста Джонни Кэстла (который, кстати, внес свой вклад в написание
    материала для альбома). На диске много каверов - и Боб Дилан, и Том Уэйтс, и Айк Тернер, и Стив Кроппер, но сыграны они
    очень прилично. Завершает диск инструментальная тема из шоу Энди Гриффита. В целом достойная профессиональная работа,
    хотя и без особых откровений.'
