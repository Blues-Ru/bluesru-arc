  date: '2011-05-19'
  text: 'The Nighthawks - блюз-рокеры из Вашингтона, явно опирающиеся на чикагскую
    блюзовую традицию. Расставшись с оригинальным гитаристом Джимми Тэкери, который
    отправился искать счастье на сольном поприще, группа в конце 80-х была в поисках
    гитариста. Их внимание привлек молодой 24-летний Дэнни Моррис, который мог играть
    не только традиционный блюз, но и серф. Вместе с Моррисом в группе играл 19-летний
    пианист Майк Кован, который также пришелся ко двору при записи альбома. При записи
    диска в качестве гостя также отметился Боб Марголин, который до этого прославился
    в качестве соло-гитариста в группе Мадди Уотерса, а в 1991 году записывался соло.


    На альбоме пара собственных композиций, остальное - каверы. Все сыграно энергично,
    с хорошим драйвом, и профессионально. Стилистически тут и блюз, и блюз-рок, и
    рок-н-ролл, и рокабилли, и соул - все в стилистике конца 60-х, но в "транскрипции"
    90-х. Альбом посвящен памяти старого друга - Дока Помуса. Данный диск позволил
    группе наконец оправиться от потери оригинального гитариста и вновь вернуться
    в обойму, снова начав выпускать студийные альбомы с новым материалом (предыдущий
    был записан в 1986 году с Джимми Тэкери).'
