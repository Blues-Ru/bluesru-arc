reviews:
- id: 780
  author: Андрей Евдокимов
  mark: 8
  date: '2005-08-05'
  text: '"Когда настанет время надеть белый балахон, хочу я к этому прийти готовым"...
    Послужит ли альбом поднятию духа, если открыть его такими словами? Да, как и положено
    хорошей музыке госпел! Госпел – это ясный и радостный разговор с Создателем языком
    музыки. А госпел Харпера и "Блайнд Бойз оф Алабама" не напрасно отмечен столькими
    премиями Грэмми. Харпер сочиняет песни-госпел по-новому: в них больше боязни,
    что разговор не сложится. И житейский опыт глубоких голосов "Блайнд Бойз..." ему
    просто необходим для придания весомости тем простым житейско-теософским банальностям,
    к которым в сущности сводится суть госпел. "И все беды останутся позади, если
    мы вовремя успеем в церковь" - "Блайнд Бойз..." повторяют этот рефрен, пока он
    не превращается в заклинание. И верить всерьез можно, только полагаясь на надежность
    их опыта. Концерт полностью повторяет программу альбома See The Light, признанного
    лучшим в категории Грэмми, и дополнен еще 4 песнями. Почитатели могут теперь оценить
    и филигранную точность студийной работы и вдохновенность концерта в легендарном
    ньюйоркском зале. К ансамблю примкнул джаз-блюзовый гитарист Марк Форд, чьи соло
    в формате госпел обрели лаконичную яркую выразительность, сохранив своеобразие.
    Запись концерта на ДВД предлагает как съемки студийной работы, так и закулисные
    приготовления концерта с бесценными эпизодами спевок вокального ансамбля, просуществовавшего
    почти семь десятилетий.'
- id: 785
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-08-06'
  text: 'Хотите посмотреть антибездуховное видео? Вот оно: Бен Харпер и Слепые Парни
    из Алабамы выступают в Аполло (Гарлем, Нью-Йорк). В программе - авторская госпел-музыка
    высшего класса и высокой духовности (а также душевности). Ударные, живая перкуссия,
    толстый басист-виртуоз, клавишник со старинным органом и клавинетом, соло-гитарист
    на обычных винтажных гитарах, Бен Харпер поет и играет на различных акустиках,
    добро и резонаторах. Трое слепцов (им за 70) поют, пляшут и просветляются. Poets
    and the prophets. Мурашки по коже от этого концерта. И происходит это вовсе не
    а Англии, России или Европе, а в той самой "тупой" Америке, которую так любят
    ругать в нашей богоизбранной стране.'
