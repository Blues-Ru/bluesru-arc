  date: '2017-12-28'
  text: 'Очень хорошая исполнительница блюза и нео-кантри блюза со своим альбомом, вышедшим в Торонто на фирме Northern Blues
    в мае 2011 года, Breakfast at Midnight. В записи принимали такие важные гости, как бывший клавишник группы Band Ричард
    Белл Richard Bell и гитарист той же группы Колин Линден Colin Linden.


    "Завтрак в полночь" -четвертый компакт-диск этой певицы, сочинителя и гитаристки, первый для фирмы грамзаписи Northern
    Blues (предыдущие альбомы были со Стони-Плейн Stony Plain Records), совершенно замечательная работа, 11 песен ее авторства,
    которые поднимают Чиарелли до уровня таланта Крисси Хайнд, Бонни Райтт и , местами, может быть даже Дженис Джоплин.


    В разнообразное меню "Завтрака" вошли, среди прочих, - "Текс-Мекс" - каджун-блюдо Never Been Loved Before, своего рода
    острая копченость Memphis Has Got the Blues и джазовое легкое пиво Midnight in Berlin. Последнюю песню известный британец,
    переехавший в Канаду, Длинный Джон Балдри Long John Baldry включил в свой альбом 1996 года" Право петь блюз" Right To
    Sing The Blues.


    Светлый и оптимистичный трек Since I ve had you on my mind сгодиться для позитивной оценки съеденного и выпитого, а суровая,
    но крепко сбитая любовная история I can change for you (Смогу для тебя измениться) подходит для серьезного разговора с
    поваром, если завтрак оказался не по вкусу. Совсем прижмет к стене нерадивых кулинаров свирепая Loving you (is killing
    me), напоминающая лучшие опусы некогда размашистого Боба Сигера Bob Seger


    Лирическая и несколько пафосная гимн-баллада If you were crying over me применима ко всем сюжетным поворотам во время
    этого странного полночного завтрака, а финальная Eggs over easy дает ясный и недвусмысленный намек завтракавшим, что ,
    однако, "кончен бал, погасли свечи" и пора освободить помещение.


    Рита Чиарелли (или, скорее, Кьярелли) возможно самая мощная исполнительница блюза в Канаде, эдакая блюз -мама и даже "богиня"
    блюза. Ее преданная аудитория постоянно росла, начиная с тех времен, когда ей было 15. Родилась в Торонто в семье итальянцев,
    закончила школу в Гамильтоне, Онтарио и сформировала группу "Секира" Battleaxe, состоявшую из девяти участников, совершавших
    туры по Канаде и США с исполнением ритм-энд-блюза. Затем она появилась школьницей в школе рок-н-ролла Ронни Хокинса Ronnie
    Hawkins примерно на год, а в 1981 году покинула Канаду , отправившись экс-патриотом на родину предков в Италию, где оставалась
    шесть лет, гастролируя и работая в студиях.


    Еще в Канаде в конце 1980-х она выпустила серию синглов на мелких фирмах и заимела хит "Вы видели мои ботинки?" "Have
    You Seen My Shoes?", он был использован в саундтреке снятого в Канаде фильма Roadkill, который позже стал культовым.


    Успех первого альбома на Stony Plain "Дорожные ракеты" Road Rockets помогли Кьярелли завоевать прочную репутацию на клубной
    сцене, как яркой рок-блюз исполнительнице с характерным голосом в диапазоне 3 октавы, который удивлял аудиторию по Северной
    Америке и Европе.


    Ее второй альбом Just Getting Started был сделан совместно с продюсером Джоном Свитцером, при участии лауреата премии
    "Juno" гитариста и композитора Колина Линдена и членов кантри-рок группы Степные Устрицы Prairie Oyster . Все песни, за
    исключением хита Элвиса Пресли "Люби меня" были написаны Ритой, которая довела свои композиторские навыки до такой степени,
    что на них стали обращать внимание другие артисты.


    Последний полноценный студийный альбом Sweet Paradise вышел в 2009 году , в последние годы певица ограничивается концертной
    деятельностью и участием в фолк и блюзовых фестивалях и более альбомов не выпускает.


    Она - сравнима по таланту с Bonnie Raitt, Melissa Etheridge, и Susan Tedeschi. Признавалась лучшей блюзовой певицей Канады
    в 2000 году в стране , где интерес к блюзу всегда постоянный и значительный . Называлась богиней канадского блюза музыкальными
    обозревателями солидной CBS Radio One.


    Breakfast at Midnight претендовал на высшую канадскую музыкальную награду Juno, но не получил ее.


    Музыканты: Rita Chiarelli (вокал, акустическая гитара); John King (гитара); Danny Greenspoon (гитара); Colin Linden (электорогитара,добро);
    Kevin Breit (электрогитара, мандолина); Carlos Del Junco (гармоника); Richard Bell (аккордеон,фортепиано, орган); Pat
    Kilbride, George Koller (бас); Al Cross (ударные); Jackie Richardson, Shirley Richardson (бэк вокал).'
