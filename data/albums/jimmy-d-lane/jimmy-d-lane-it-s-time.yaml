- id: 1435
  author: Андрей Евдокимов
  mark: 6
  date: '2009-02-05'
  text: 'Квалифицированное, но вполне предсказуемое блюз-роковое течение альбома довольно неожиданно прерывают поп-роковые
    баллады. Унаследовавший чикагский блюз в крови от своего отца, легендарного гитариста Джимми Роджерса, Джимми Ди Лейн
    долгое время пребывал под влиянием хендриксовской манеры игры. Нынешний альбом – всего лишь третий в дискографии этого
    весьма опытного музыканта, и в нем Лейн решительно меняет звучание. Все песни его сочинения, за единственным исключением:
    тему классика слайд-гитары Элмора Джеймса Bleeding Heart Лейн превращает в 10-минутный опус на радость любителям развернутой
    гитарной импровизации. Поддержку в записи альбома ему оказала ритм-секция группы Double Trouble.'
