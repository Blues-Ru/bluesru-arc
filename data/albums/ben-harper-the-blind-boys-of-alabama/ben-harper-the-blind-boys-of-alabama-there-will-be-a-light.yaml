reviews:
- id: 664
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-05-21'
  text: Рок-музыкант Бен Харпер серьезно "подсел" на корневую музыку и решил выпустить целый альбом с госпел-группой Blind
    Boys Of Alabama. Диск получился яркий и лаконичный - 11 песен на 38 минут. Бен - молодчина, он написал 8 песен из 11,
    и надо отметить, что песни прекрасные! Глубокие композиции в стиле госпел/блюз/соул. Алабамцы отлично поют хором, а иногда
    и сольно, создавая волшебную атмосферу музыкально-духовного праздника. Голос Бена настолько открыт и естественнен, что
    кажется, что он всю жизнь пел блюзы и госпел (но это совсем не так). Игра на гитарах - еще одно удовольствие на этом альбоме.
