  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-06'
  text: 'Добротный альбом от мастера традиционного электрического чикагского блюза, записанный на фирме Blind Pig Records.
    На альбоме больше половины авторского материала, остальное - каверы блюзовой классики. На Young Man Blues отметился сын
    Слима - Шон Хольт, который и написал эту песню.


    Традиционный чикагский блюз с современным звучанием в лучших его проявлениях.'
