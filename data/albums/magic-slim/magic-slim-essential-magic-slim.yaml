  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-06'
  text: '15-трековый сборник лучшего из творчества ветерана блюзовой сцены с шести альбомов, выпущенных с 1990 по 2005 год
    включительно, скомпилированный фирмой Blind Pig Records. Классика электрического гитарного Чикагского блюза.


    Фирма Аллигатор сыграла в судьбе Слима (настоящее имя - Моррис Холт) важнейшую роль - Magic Slim & the Teardrops были
    любимой группой Hound Dog Taylor''a, который, отправляясь в турне, приводил Слима в те блюзовые клубы Чикаго, где должен
    был играть сам Тэйлор, и оставлял Слима в качестве своей замены. Создатель фирмы Аллигатор Брюс Иглауэр выпустил 4 песни
    Слима и его группы на аллигаторовском сборнике 1979 года, и в итоге музыка Слима стала доступна широким массам любителей
    блюза.


    Однако по иронии судьбы впоследствии Мэджик Слим записывался в основном на фирме Blind Pig Records.'
