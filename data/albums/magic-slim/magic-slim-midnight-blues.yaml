- id: 1952
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-07-06'
  text: 'Свежий альбом от ветерана чикагского блюза (настоящее имя - Моррис Холт), которому исполнился 71 год . На этом отличном
    альбоме традиционного электрического блюза (с небольшой примесью кантри и соул) в качестве гостей отметились такие звезды
    жанра, как James Cotton, Little Ed, Lonnie Brooks, Otis Clay, Gene Barge, Elvin Bishop, а также духовая группа Chicago
    Rhythm & Blues Kings.


    Классная музыка от классика жанра! Восьмое место в топе блюзовых альбомов Биллборда.'
