  text: '"Magic Slim consistently offers no-frills houserockin'' blues. He and his band are a national treasure." - Living
    Blues


    "Whoever the house band in blues heaven may be, they''re wearing out Magic Slim albums trying to get that Teardrops sound
    down cold. Slim fronts the most consistently excellent outfit around." - Blues Revue


    "Slim sings and plays at a level that makes this among the best albums in a career spanning over three decades." - Jazz
    & Blues Report


    Magic Slim (настоящее имя Моррис Холт) - ветеран традиционного чикагского блюза, который в возрасте 9 лет в результате
    несчастного случая потерял мизинец и был вынужден переключиться с фортепиано на гитару. В дальнейшем он и его группа The
    Teardrops добились заметного успеха на блюзовой сцене Чикаго и стали обладателями целого ряда блюзовых премий. В 2013
    году уже посмертно Мэджик Слим был признан лучшим исполнителем традиционного блюза, а в 2017 году он был принят в зал
    славы блюза.


    Фирма Аллигатор сыграла в судьбе Слима важнейшую роль - Magic Slim & the Teardrops были любимой группой Hound Dog Taylor''a,
    который, отправляясь в турне, приводил Слима в те блюзовые клубы Чикаго, где должен был играть сам Тэйлор, и оставлял
    Слима в качестве своей замены. Создатель фирмы Аллигатор Брюс Иглауэр выпустил 4 песни Слима и его группы на аллигаторовском
    сборнике 1979 года, и в итоге музыка Слима стала доступна широким массам любителей блюза. Впоследствии Мэджик Слим записывался
    в основном на фирме Blind Pig Records.


    Snakebite - один из лучших альбомов Слима и вообще всего традиционного чикагского блюза - группа играет прекрасно, а главное
    - чувствуется искренность исполнения: музыканты верят в то, о чем поют, и получают удовольствие от процесса. Материал
    преимущественно авторский, хотя есть и пара каверов. В составе аккомпанирующих музыкантов - брат Слима бас-гитарист Ник
    Холт.


    На диске нет ничего экстравагантного, это традиционный блюз с современный звучанием, но он сыгран профессионально, с хорошим
    драйвом, и пластинка слушается свежо и приятно. Классика электрического гитарного чикагского блюза.'
