- id: 1950
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-07-06'
  text: 'Новый альбом ветерана чикагской блюзовой сцены Морриса Хольта сотоварищи является лишним подтверждением поговорки
    "Старый конь борозды не портит". Уже почти два десятка лет Моррис стабильно выдает качественные альбомы современного электрического
    чикагского блюза, не сбавляя обороты.


    Подход Слима к музыке традиционен и абсолютно правилен: простота, искренность, энергичность и мастерство исполнения. В
    своем творчестве группа придерживается корней и не пытается открыть Америку. Это честная музыка - настоящий городской
    блюз безо всяких украшательств: две гитары, ритм-секция и низкий вокал Хольта. На диске только три трека собственного
    сочинения и восемь каверов блюзовой классики, которым Моррис дал свою собственную интерпретацию, исполнив их с энергичным
    рок-н-рольным драйвом.


    Название альбома также символично: "Поднимая планку". Новый альбом в очередной раз наглядно демонстрирует высокие стандарты,
    установленные блюзовыми ветеранами. Действительно стОящий альбом современного блюза - таких выходит немного!'
