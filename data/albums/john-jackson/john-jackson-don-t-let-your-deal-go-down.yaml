  date: '2005-05-28'
  text: Сборник с трех пластинок Arhoolie с записями 1965, 1967 и 1969 годов, всего 26 треков на 70 минут. Отличный пьемонтский
    блюз, много традиционного материала 20-30 годов. Слышно большое влияние Блайнд Боя Фуллера и Блайнд Блэйка, Джон исполняет
    несколько их песен, в частности, Rattlesnakin' Daddy и Police Dog Blues. Из своих композиций Джексона выделяются такие
    инструментальные рэги, как John's Rag и John's Ragtime, и исключительный слайдовый номер Knife Blues. Вокал Джона на диске
    довольно мягкий, а акустика звучит захватывающе - чисто, сочно и красиво!
