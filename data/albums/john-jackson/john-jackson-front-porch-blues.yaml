- id: 691
  author: Александр Панин
  mark: 7
  date: '2005-05-28'
  text: 'Хороший альбом замечательного блюзмена, работавшего в пьемонтском стиле.


    Диск вышел на Аллигаторе в 1999 году, когда Джексону было уже 75 лет. Возраст
    исполнителя, конечно, чувствуется, но мастерства и филинга еще изрядно, и все
    звучит очень хорошо. На диске много традиционного материала, вещи Блайнд Боя Фуллера,
    Гэри Дэвиса, Лироя Карра, Джоша Уайта, собственные композиции Джона. Работы Джексона
    60-х впечатляют больше, но этот диск тоже весьма хорош, он теплый и душевный.'
