  date: '2009-12-25'
  text: '<img src="http://2.bp.blogspot.com/_ky9IpUFT7DI/Snpjfcv8NfI/AAAAAAAACG0/UB7_XMWPYdc/s320/davidburgin.wildchild.jpg">
    Любимый харпер и альбом Карлоса Дель Хунко. И не зря - такой замечательный микс блюза, кантри и фолка звучит просто потрясающе!


    Насколько мне известно, это второй альбом, на котором участвует Burgin. Предыдущей его записью была пластинка, записанная
    совместно с известным слайд-гитаристом Roy Rogers. Учитывая схожесть манеры и стиля игры Дэвида и Нортона Баффало, вполне
    закономерно, что второй позже стал играть и записываться с Роем. У Burgin''а интересная и своеобразная манера игры, его
    композиции продуманы мелодически от начала до конца, он использует разные гармоники (хроматика, диатоника), усиленный
    и акустический звук одновременно в одной композиции - получается очень интересно. Приблизительно половину альбома составляют
    инструментальные темы, а на другой половине Дэвид поет (одну песню исполнил гитарист Brent Parkin).


    Из известных персон на альбоме замечены: Roy Rogers, Norton Buffalo (бэк-вокал), Amos Garrett и David Grisman.


    Известно (по информации от другого классного харпера - Michael Peloquin), что в настоящее время Дэвид изредка записывается
    с канадскими музыкантами (откуда он родом) и музыкой занимается периодически.'
