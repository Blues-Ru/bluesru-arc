- id: 1289
  author: Константин Колесниченко
  mark: 10
  date: '2008-06-04'
  text: 'Не ждите от этого альбома чикагского блюза. Билли решил показать все свои
    способности и выдал на-гора если не шедевральный, то просто отличный альбом в
    духе соул, рока и совсем немного современного блюза. Начинается все приджазованной
    "Crazy Mixed Up World" авторства Джона Ли Хукера. Далее блюз-рок "Pay Or Stay",
    а вот после него начинается вообще что-то невероятное - "Kissing My Love" Билла
    Визерса, на которой он выступает не только как потрясающий харпер, но и отличный
    соул-вокалист. Следующей идет расслабленная "Hey Baby" JJ Cale (как же хороша
    сопровождающая вокальная группа "CAB"!). Следующие две композиции "Satisfy Me"
    и "Highway Blues" - это замечательные образцы современного блюза, на них Билли
    раскрывает свои способности инструменталиста в полной мере, выдавая просто потрясающие
    соло на перегруженной гармонике, умело используя звуковые эффекты! Затем классика
    "One Chance With You" - это композиция его кумира Little Walter, исполнена в свингующей
    манере. "Hearts In Your Life" - опять Bill Withers и опять, красивейший шершавый
    вокал Бранча и пронзительное соло на гармонике! "Son Of Juke" - вариации на тему
    знаменитого хита Литтл Уолтера "Juke". "Same Thing" - один из самых моих любимых
    блюзов, я считаю, что исполнить его лучше, чем Мадди Уотерс невозможно, но Билли
    замечательно справился с этой песней. "Boogie Man" и "Goin'' Down" - блюз-рок,
    но сыгранный не глупо, а с интересными мелодическими ходами.


    Я бы хотел отдельно отметить игру отличного гитариста Carl Weathersby (с которым
    Билли играет со времен Sons Of The Blues), вокальной группы CAB, а также клавишника
    David Torkanowsky.'
