reviews:
- id: 626
  author: Александр Панин
  mark: 8
  date: '2005-05-20'
  text: Одни из ранних записей Джимми Джонсона (он родился в 1928 году, но первый
    альбом выпустил только в конце семидесятых). Здесь сорок минут хорошего прифанкованного
    соул-блюза. Вокал Джимми может показаться чуть высоким, но он довольно удачно
    сочетается с музыкой. В те годы в жанре соул-блюза зажигал Роберт Крэй, но Джонсон
    звучит гораздо лучше и интереснее его. Очень хорошо, что Джимми заключил тогда
    контракт с Delmark, а не с Аллигатором, "специалисты" которого могли бы легко
    испортить весь этот волшебный саунд.
- id: 1086
  author: Константин Колесниченко
  mark: 10
  date: '2007-06-05'
  text: 'Еще один альбом Джимми на лэйбле Делмарк, альбом отличный, как и предыдущий
    "Johnson''s Whacks". Олмьюзик пишет, что он посвящен блюз-рок гитаристу Майклу
    Блумфилду (диск "East-West" был записан с его участием группой Пола Баттерфилда).
    Альбом продолжает традиции прдыдущего и представляет собой набор отличных композиций
    в стиле соул-блюз, вестсайд-блюз, звук 80-х не чувствуется совсем. Джимми отличный
    гитарист и певец! С Джонсоном солирует отличный клавишник Eddie Lusk. Хочу выделить
    такие композиции: соул-ориентированную "Country Preacher", фанковую "Walking on
    Thin Ice", но, на самом деле, диск ровный и не нуждается в выделении лучших песен.'
