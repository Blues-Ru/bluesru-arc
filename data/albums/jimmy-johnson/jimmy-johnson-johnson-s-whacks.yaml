  author: Константин Колесниченко
  mark: 10
  date: '2007-06-05'
  text: 'С этим отличным музыкантом я был знаком только по его работе сайдмена у других
    исполнителей. Потому я был приятно удивлен его сольной работой - Джимми отличный
    гитарист, аранжировщик и неплохой певец (хотя такой высокий вокал не самый мой
    любимый).Альбом выдержан в стиле соул и вестсайд-блюза.


    Думаю, вы тоже будете удивлены, услышав на блюзовом альбоме классное исполнение
    "Take Five" Десмонда с гитарой Джимми, играющей соло-партию или кантри "Driving
    Nail in My Coffin"


    Альбом заслуживает высшей оценки!'
