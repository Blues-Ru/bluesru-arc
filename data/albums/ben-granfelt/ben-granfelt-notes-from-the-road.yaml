  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2012-08-16'
  text: 'Бен Гранфелт - блюз-роковый гитарист и композитор, который создал свою собственную
    группу еще в 1993 году, отыграв до этого 5 лет в группе Gringos Locos. Также был
    участником известных у нас Leningrad Cowboys. Однако наибольшую известность ему
    принесла игра в Wishbone Ash, к которой он присоединился в 2001 году.


    Предлагаемый альбом содержит 5 студийных треков, а также 6 концертных песен, записанных
    на гастролях в Англии на конвенции фанов Wishbone Ash в 2006 году (отсюда и название
    альбома).'
