- id: 467
  author: Дмитрий Казанцев
  mark: 4
  date: '2004-03-03'
  text: 'Оригинально этот диск Брауна вышел в 1964 году на лэйбле Mainstream Records
    и состоял из 10 песен. На компакте он вышел только в 1989 году на фирме DCC Compact
    Classics, Inc. с добавлением двух бонус-треков. Получилочь 12 песен на 42 минуты.


    Чарльз Браун играет на органе и поет, Рой Коулман на гитаре, Фредди Саймон на
    теноре и Чарльз Брэди на ударных. Баса нет вообще, Чарльз пытается играть его
    на органе, но выходит не очень убедительно. Сразу надо сказать, что самое интересное
    на этом альбоме, - это вокал Брауна. Квартет играет поп-джаз-лаунж-блюз в салонном
    стиле, а амбиентный орган с обычным звуком лишь добавляем атмосферу ресторанности
    тех лет. Хорошая была атмосфера...


    Странный, попсовый, бесхребетный альбом. Это как бы и не блюз вообще; скорее поп-джаз
    и ритм-н-блюз с блюзовым уклоном; что-то вокруг Рэя Чарльза, но с шикарным вокалом.
    Гитарист и саксофонист играют по джазу, и яркости ждать не приходится. Почти все
    вещи в одном темпе и размере. Трудно что-то выделить, может быть саму Driftin''
    и бонус Through The Courtesy Of Love. Слабая, необязательная работа Брауна, хотя
    вполне съедобная и звучащая.'
