  date: '2005-05-18'
  text: 'Моузес записал свой первый и единственный альбом в 1987 году, когда ему было уже 70 лет. И это не смотря на то, что
    он играет блюзы еще с 30-х годов. Спасибо независимому лейблу Flying Fish за издание подобных дисков.


    На этой пластинке записан концерт Моисея где он играет на гитаре и поет, а Кен Уэрнер помогает ему на гармошке. В программе
    12 песен, в основном традиционные фолк-госпел-блюзы + 2 вещи Джимми Рида ("Bright Light Big City", "Big Boss Man"). Простенькая
    игра на гитаре, душевный, но "обычный" вокал, хорошая атмосфера фолк-концерта. Тут есть очень известные песни, например
    "John Henry" и "Frankie And Johnny".'
