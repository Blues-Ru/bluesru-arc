reviews:
- id: 680
  author: Александр Панин
  mark: 4
  date: '2005-05-25'
  text: 'Подборка ранее неизданного Кимброу, примерно на сорок минут. Типичное выкачивание денег из коллекционеров.


    Первые четыре трека - домашние записи. Несмотря на то, что, как указано на обложке, "home tracks de-noised", качество
    их бутлежное, и слушать их часто не будешь. Пятая композиция вполне адекватно смотрелась бы на любом альбоме Джуниора.
    А лучшие вещи - три заключительные, живые записи с блюзового фестиваля в Кларксдейле 1993 года. Очень жаль, что Фэт Поссум
    выпустил такой диск, а не изыскал материала для полноценного концертника. Только для коллекционеров!'
