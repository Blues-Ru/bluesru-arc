- id: 678
  author: Александр Панин
  mark: 6
  date: '2005-05-25'
  text: 'Это второй альбом Джуниора на Фэт Поссуме, записанный в апреле 1993 года. Тут весь фирменный Кимброу - тягучий, густой,
    монотонно-заунывный и гипнотический, риффовый электроблюз. Однако, если сравнивать с его дебютным диском All Night Long,
    то здесь все более однообразно и менее интересно. Большая проблема - длительность альбома: 65 минут такого блюза выслушать
    трудно. Посоветую лучше найти диски All Night Long и Do The Rump (второй для сравнения со Sweet Tea Бадди Гая).'
