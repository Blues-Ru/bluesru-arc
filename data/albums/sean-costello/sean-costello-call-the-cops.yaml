- id: 1784
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-26'
  text: 'Молодой блюзовый талант Шон Костелло родился в 1979 году в Атланте, а в девять лет получил в подарок на день рождения
    свою первую гитару. Самоучка быстро прошел путь от хард рока к блюзу под влиянием Стиви Рэя Воэна, а затем обратился к
    творчеству традиционных блюзменов чикагской школы. В 14 лет он уже выиграл конкурс молодых талантов Beale Street Blues
    Society. Вместе с ним в конкурсе принимала участие восходящая блюзовая звезда Сьюзан Тедеши, и в течение следующих двух
    лет Шон играл в ее группе в качестве лидер-гитариста.


    Время пришло собрать свой состав - так появились Jivebombers, с которыми молодое дарование в свои 16 лет записало первый
    сольник: он вышел в 1996 году и был встречен доброжелательно, ибо содержал качественный музыкальный материал. Половина
    авторского материала, половина - каверы блюзовой классики, вполне приличный уровень исполнения, современное блюзовое звучание
    с явно выраженной традиционной базой. Ну вот вокал, пожалуй, слишком юношеский, а в остальном - вполне слушабельно. Затем
    были обширные гастроли, новые альбомы (всего студийных альбомов Шон записал 5). Однако накануне своего 29-го дня рождения
    в апреле 2008 года Шон был найден мертвым в номере отеля. Смерть наступила от приема ряда наркотиков, включая героин.'
