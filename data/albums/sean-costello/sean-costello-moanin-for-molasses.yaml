- id: 349
  author: Федор Романенко
  mark: 10
  date: '2003-12-10'
  text: 'Sean Costello – сверх-молодой гитарист из Атланты 1980 года рождения, который получил в подарок первую гитару на
    день рождения в 9 лет. Обучался играть на гитаре самостоятельно, быстро проскочив стадии от хард-рока к блюзу через Led
    Zeppelin, SRV и Howlin'' Wolf. В возрасте примерно 18 лет он стал гитаристом в группе Susan Tedeshi, записав с ней самый
    удачный ее альбом "Just Won''t Burn". После он собрал собственную группу, состоящую из опытных музыкантов постарше, включая
    гармониста и пианиста Paul Linden. Не переставая играть в блюзовой группе с ранних лет, Шон Костелло уже в 20 с лишним
    лет стал блюзовым ветераном.


    Первый сольный альбом "Call the Cops" вышел в 1996 году. Благодаря успеху предыдущего "Cuttin'' In" в 2000 он был номинирован
    на премию Хэнди по разряду лучшего блюзового дебюта. Moanin'' for Molasses – это третий альбом Шона 2001 года, единственный,
    который пока попал мне в руки.


    Первое впечатление от пластинки – супер-качественное звучание гитары, голоса и аранжировок, которого достигают обычно
    только очень опытные музыканты. Тягучий, мягкий стиль гитарных соло чем-то мне напоминает Альберта Кинга. Вокал молодого
    Костелло очень выразительный и "душевный" (soulful). Мне очень нравится эта "не-небрежная", немного "натянутая" манера
    петь с адекватным музыке количеством эмоций, без перебора или, наоборот, вялости и бледности.


    Репертуар в основном базируется на блюзовой классике, хотя записан с современным отточенным звуком. Список песен включает
    отлично сыгранный с органом и драйвовой гитарой "No Lie" Бадди Гая, известный номер Отиса Раша "It Takes Time", хорошую
    аранжировку "One Kiss" Диксона, драйвовую (в старом понимании) песню Блумфилда "You''re Killing My Love" с дудками. На
    альбоме 4 собственные песни, включая красивую соул-балладу "You''re a part of me", прифанкованную "Miles Away", классический
    блюз на 6 струнах "Low-life Blues", и исполненный с жестким ритмом чикагский номер с гармошкой Линдена "Don''t Be Reckless
    With My Life".


    Итого, мне чрезвычайно понравилось у Шона сочетание современных блюзовых идей и отточенного звучания с действительно мощной
    блюзовой базой с элементами соул, которая обычно встречается только у очень опытных музыкантов. Разумеется, Шон Костелло
    – очень интересный и талантливый исполнитель, от которого в будущем можно ждать супер-результата во всех музыкальных областях,
    за которые он возьмется.'
- id: 1786
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-26'
  text: Третий сольник Шона, пожалуй, наиболее качественный - тут и звук приличный, и техника игры на уровне, и подбор материала
    разнообразный (хотя своих треков только 4, остальное опять каверы). Есть и приличные соло на гармонике, гитарные соло
    само собой также имеются, есть и отдельные треки с духовыми. В результате имеем добротный альбом традиционного блюза с
    современным звучанием и изрядной примесью соул. Диск в первую очередь для любителей традиционного блюза с примесью коммерции
    (в отличие от предыдущего диска с его "сырым" звуком). На мой взгляд, до шедевра еще далековато, но в целом - вполне прилично.
