- id: 1785
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-05-26'
  text: 'С момента записи дебютного альбома прошло 4 года, Шону исполнилось двадцать, и блюзовый вундеркинд представил на
    суд слушателей вторую пластинку. Музыкант заметно повзрослел, он чувствует себя увереннее, что особо заметно в области
    вокала. При этом диск по многим параметрам отличается от дебютника: сменился продюсер, и эта перемена, на мой взгдяд,
    не в лучшую сторону. Также изменился репертуар - авторских треков только три, остальное каверы. Стоило ли ждать четыре
    года, чтобы записывать каверы? Вообще весь альбом звучит очень винтажно, с закосом "под старину", при одновременно сыром
    и местами даже "кашеобразном" звуке (см. мои слова о смене продюсера выше).


    В целом диск приличный, разнообразный, традиционный, неплохо сыгранный - но уж больно специфический саунд. На мой взгляд,
    для двухтысячного года это не самый лучший пример сведения и тп. Но традиционалисты с радостью восприняли этот своего
    рода "ретро"-альбом, да и критика отнеслась к работе благосклонно. По мне - так первый альбом был честнее, искреннее и
    интереснее, несмотря на все его мелкие недостатки, связанные с молодостью исполнителя. Однако повторюсь, диск вполне заслуживает
    внимания.'
