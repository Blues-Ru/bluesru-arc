  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-26'
  text: 'Четвертый сольник Шона Костелло, записанный им в возрасте 25 лет. К сожалению,
    выпускающая диск фирма Artemis Records вскоре после завершения записи обанкротилась,
    и поэтому альбом не получил должной раскрутки.


    Тем не менее диск вполне приличный, разнообразный (тут и блюз, и соул, и рок),
    профессионально сыгранный и спетый. Семь треков авторских, шесть каверов. Звук
    прекрасный, все инструменты слышны четко и ясно. Отдельные включения духовых только
    оттеняют музыку. Приличная работа зрелого мастера.'
