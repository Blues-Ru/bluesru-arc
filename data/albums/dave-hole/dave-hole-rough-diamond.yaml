  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-30'
  text: 'Последний релиз от Дэйва вышел не на уже привычном Аллигаторе, а на Blind
    Pig Records - второй после Аллигатора независимой записывающей компании, специализирующейся
    на блюзе и др. традиционной музыке.


    На мой взгляд, Дэйв слегка подустал и записал, так сказать, коммерческую пластинку
    (хотя с оговоркой на Дэйва Хоула, ибо его коммерческие версии могут просто снести
    крышу у привыкших к действительно коммерческой музыке слушателей). Я имею ввиду
    "коммерческий альбом" по сравнению с его ранними работами, где драйва было просто
    через край. Авторского материала тоже не слишком много, половина альбома - каверы.
    Но есть и жемчужины, как же без них: версии White Trash Girl, Yours for a Song
    и I''m a King Bee просто великолепны. В общем, получилась довольно качественная
    пластинка, но без откровений - твердая четверка.'
