  author: Алексей Калачев
  mark: 10
  date: '2003-05-29'
  text: Блестящий диск! Между прочим, голос Холла звучит здесь лучше, чем на любом
    из его студийных альбомов. Гитарная часть работы даже не обсуждается – Дейв достиг
    почти совершенства.
- id: 1799
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-27'
  text: '"Man, can Hole play the slide guitar! His new CD "The Live One" is a slash
    and burn rampage through old-school blues slide wailing. "CHICAGO TRIBUNE", U.S.A.
    (AUG. 2003)


    " Elmore James probably would be surprised to find out that someday the world''s
    best slide guitar player would hail not from Chicago but from Perth, Australia.
    The guitarist in question would be, for those who haven''t been paying attention,
    Dave Hole. ... the man can make his axe sing, cry, weep and wail, which is all
    that matters." "SAN FRANCISCO BAY GUARDIAN", U.S.A. (AUG. 2003)


    "The Live One" is one of the purest insights into this man''s truly awesome slide
    ability ever captured on tape. An amazing display of fluid blues gymnastics from
    beginning to end". "......heavenly slide playing that words couldn''t do justice
    to. For those times when too much guitar is never enough." "AUSTRALIAN GUITAR"
    MAGAZINE (MAY, 2003)


    Первый и единственный концертник авcтралийского виртуоза является последним альбомом,
    записанным Дэйвом для лейбла Аллигатор. Диск составлен из трех концертных выступлений
    - 26 и 27 июля 2002 года в Чикаго, и 18 декабря 2001 года на родине героя - в
    г. Перт в Австралии.


    Мощный техничный блюз-рок с непревзойденной техникой Дэйва делает этот диск поистине
    незабываемым и настоящим звуковым пиршеством для любителей блюзовой слайд-гитары.'
