- id: 1806
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-05-30'
  text: 'Пятый сольный альбом Дэйва для Аллигатор рекордз содержит в основном авторский материал. Он более спокойный и разноплановый
    - тут и акустика, и баллады, и быстрые мощные роковые треки в стиле предыдущих альбомов. Композиции более длинные и, на
    мой взгляд, местами слегка затянутые. Однако качество владения инструментом по-прежнему выше всяких похвал, а некоторое
    изменение музыкальной стилистики объясняется тем, что сам музыкант стал старше и опытнее, он уже не ограничивается только
    одним направлением.


    Диски, выпущенные в Европе на фирме Provogue и в Америке на лейбле Alligator, отличаются порядком и количеством песен
    (16 против 12 соответственно, из которых каверов 5 против 3).


    "No one on the current scene plays with the incendiary power he does" - Associated Press


    "Jaw-dropping slide work. Strong, smart songwriting and edgy, expressive vocals" - BLUES REVUE


    "Ferocious, adrenaline-charged electric slide. A one-way journey to sonic joy" - LIVING BLUES'
