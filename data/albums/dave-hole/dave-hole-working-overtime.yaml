- id: 1803
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-30'
  text: 'Альбом 1993 года Working Overtime дает отличное представление о музыке Дэйва. Это одна из лучших его работ - а может,
    и самая лучшая! Материал преимущественно авторский.


    Альбом существует в двух вариантах оформления - в Америке на фирме Аллигатор он оформлен в черных тонах, в Европе на фирме
    Provogue - золотистый с черным. В европейскорй версии имеется также бонусная песня. (И пусть одинаковое оформление альбомов
    Plumber и американской версии Working overtime не вводит Вас в заблуждение - это РАЗНЫЕ альбомы!)


    Альбом получил престижную американскую награду NAIRD.'
