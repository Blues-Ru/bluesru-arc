  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-30'
  text: 'Четвертый альбом, записанный Дэйвом для Аллигатор Рекордз. На нем музыкант
    осуществил свою давнюю мечту и записался со знаменитыми блюзовыми музыкантами
    из Чикаго - Johnny B. Gayden (Albert Collins), Tony Z (Larry McCray, Buddy Guy),
    и Ray "Killer" Allison (Buddy Guy), включая духовую секцию и губную гармонику
    от Billy Branch. Все треки собственного сочинения, кроме последнего, который посвящен
    памяти ушедшего Рори Галлахера.


    Получился мощный быстрый жесткий блюз-роковый альбом, который добрался до 15 места
    в чартах блюзовых альбомов Биллборда.


    Line-Up:


    Dave Hole, Guitars and Vocals


    Tony Z., Piano and Organ


    Johnny B. Gayden, Bass


    Ray "Killer" Allison, Drums


    WITH Billy Branch, Harmonica on Empty Train and Bermuda Triangle Gene Barge, Horn
    Arrangements on Phone Line, You Got The Blues, and Why Can''t You Be True? Ken
    Anderson, Trumpet Steve Eisen, Tenor Sax Brian Ripp, Baritone Sax AND Steve Eisen,
    Tenor Sax and Arrangement on You''re Too Young'
