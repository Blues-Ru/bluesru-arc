- id: 1802
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-30'
  text: 'Довольно редкий диск Дэйва Хоула - в Америке долгое время не издавался, выходил в 1992 году в Европе небольшим тиражом
    на фирме Provogue. Фактически это второй сольник австралийского слайдера, изданный по итогам триумфального дебютника Short
    Fuse Blues.


    Традиционный для Дэйва взрывной блюз-энд-ролл (или рок-энд-блюз :-)) с солирующей слайд-гитарой. Мощно, энергично, технично,
    профессионально. Продюсировал сам маэстро. Один из лучших альбомов в дискографии Дэйва Хоула.'
