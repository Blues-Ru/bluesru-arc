- id: 319
  author: Леонид Аускерн
  mark: null
  date: '2003-12-02'
  text: 'Хоул до 1992 г. двенадцать лет играл блюз у себя дома в Перте, Западная Австралия, и был совершенно неизвестен за
    пределами континента. Открытие для всего мира состоялось благодаря изданию именно этой, первой записи Хоула на чикагском
    "Аллигаторе".


    "Блюз короткого замыкания" свое название оправдывает на сто процентов. Хоул обрушивает на слушателя мощнейший по энергетике
    блюз-рок с акцентом на вторую часть этого термина. По напору эта музыка, кажется, вполне способна конкурировать со знаменитыми
    тихоокеанскими тайфунами. Партнеры Хоула играют без особых изысков, но сам он выше всяческих похвал. Хоул - слайд-гитарист
    и его отличает нестандартная техника (левой рукой с "закованным в металл" указательным пальцем он охватывает гриф гитары
    сверху, что хорошо заметно по фотографии на обложке), доведенная до совершенства. Дэйв выделывает на своей гитаре такое,
    что даже версия знаменитой "Purple Haze" Хендрикса выглядит чрезвычайно убедительно.


    Ну а его собственные композиции выдают неистовый темперамент и склонность к мощному, но основанному именно на блюзе, драйву.
    Блюз для Хоула, как и для многих белых музыкантов, начинался с дисков Мадди Уотерса, но его игру не спутаешь, скажем,
    с британской школой им. Алексиса Корнера и Джона Мэйолла или техасцем Уинтером. Дэйв Хоул - это имя нужно помнить всегда!'
- id: 1798
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-27'
  text: 'Dave Hole - уникальный слайд-гитарист из aвстралийской глубинки, где он играл блюз по клубам в течение почти 20 лет.
    Но наконец судьба улыбнулась ему, и его демо попали в руки основателю фирмы Аллигатор рекордс Брюсу Иглауэру, после чего
    в 1992 году состоялся дебют Дэйва на фирме Аллигатор.


    Дэйв обладает уникальной техникой игры на гитаре - сам он левша, но играет в "правой стойке", однако для компенсации давней
    травмы левой руки вынужден класть руку на гриф гитары сверху, а не снизу. Неистовый темперамент и взрывной блюз и рок-н-ролл
    - вот стихия музыки Дэйва Хоула (что слышно невооруженным ухом по крайней мере на первых альбомах музыканта).'
