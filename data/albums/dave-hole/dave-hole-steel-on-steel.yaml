  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-30'
  text: 'Steel on Steel - третий альбом австралийского слайдера на фирме Аллигатор, одна кавер-версия (Going Down), остальное
    - авторский материал. По-прежнему блестящая работа слайд-гитариста, но этот альбом уже заметно ближе к року, чем блюзу
    - если угодно, рок с блюзовым инструментарием, или блюз-рок с ударением на последнем слове :-)


    Продюсировал знаменитый Джим Гейнс. 13-е место в топе блюзовых альбомов Биллборда.


    "Blistering...relentless slide strafes and searing single-line solos...Dave Hole scorches the strings...comes at you so
    hard you''ll barely have time to catch your breath" - GUITAR PLAYER


    "Bruising power and bewildering invention will leave you slack-jawed with wonder" - MUSICIAN'
