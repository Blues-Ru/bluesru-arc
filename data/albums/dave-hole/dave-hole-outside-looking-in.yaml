  date: '2011-05-30'
  text: Шестой (и последний на сегодняшний день) студийный альбом австралийского блюзового
    виртуоза-слайдера, записанный для фирмы Аллигатор рекордс. Этот релиз заметно
    лучше предыдущей пластинки. Три кавера, остально авторский материал; пара симпатичных
    акустических треков, одна полувальсовая баллада, остальное - традиционные для
    Дэйва мощные блюз-роковые и рок-н-рольные номера в стилистике его ранних альбомов,
    исполненные с присущей ему мощью и виртуозностью.
