  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-02'
  text: 'Эта группа распалась еще в 1968 году после выпуска своего второго альбома,
    но в 1974 году ребята решили снова собраться. Все люди известные и "понятные":
    Майк Блумфилд на гитаре, Бадди Майлз барабанит и поет, Ник Грэйвнайтс - поет и
    играет на ритм-гитаре, Барри Голдберг на клавишах, Роджер Трой поет и играет на
    басу.


    Развитый и прогрессивный соул-рок и блюз-рок, но слишком мало влияния черной музыки.
    Группа головой еще в конце 60-х, но на дворе был уже 1974 год. Когда поет Бадди
    - все хорошо, голос Ника немного раздражает (так было всегда).


    Приятный альбом, но не более того. Слишком мало влияния Бадди.'
