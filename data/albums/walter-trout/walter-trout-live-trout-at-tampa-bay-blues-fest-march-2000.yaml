  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2011-05-20'
  text: 'Сумасшедший драйв и энергетика концертных выступлений Уолтера не всегда адекватно передавались на студийных записях,
    поэтому он решил полностью записать свой концерт 26 марта 2000 года на блюзовом фестивале Тампа Бэй. Была нанята специальная
    32-канальная студия, звукоинженер Джордж Кован и лучший блюзовый продюсер Джим Гэйнс прилетели на запись из Мемфиса. Однако
    сам Уолтер с трудом смог вовремя добраться до места проведения концерта из-за отложенных и отмененных авиарейсов. Ему
    пришлось провести 24 часа в ожидании в аэропортах практически без сна и почти без еды. За два часа до начала шоу он чуствовал
    себя настолько плохо, что был готов отменить концерт (хотя за 11 лет предшествующих гастролей число отмененных шоу Уолтера
    можно пересчитать по пальцам руки). Несмотря на плохое самочувствие, отсутствие сил и жуткий стресс из-за вызванного этим
    возможного провала концерта (а также тот факт, что задействованные для записи лучшие люди индустрии грамзаписи в результате
    провала могли бы прекратить сотрудничество с Траутом), мысль о тысячах поклонников, пришедших на его концерт, заставила
    Уолтера выйти на сцену. Восторженный прием аудитории придал музыканту силы, и он отыграл один из лучших концертов в своей
    жизни. Уолтер вспоминает: "Слава богу, что публика была отличной. Она дала мне силы и энергию для того, чтобы отыграть
    концерт. Это чистый адреналин. Я действительно жил блюзом во время этого концерта. Возможно, моя игра не была достаточно
    точной, но плохое самочувствие придало музыке дополнительную жесткость. И хотя я могу сыграть точнее, чем во время этого
    выступления, оно несет мощную эмоциональную окраску, которой не всегда удается добиться."


    Многие исполнители редактируют свои концертные записи, выбирая лучшие моменты, и даже проводят дополнительное наложение
    инструментов и/или вокала. Траут просто записывает концерт полностью, каким он был – никаких исправлений, никаких наложений,
    все честно.


    Отличный диск от великого музыканта и пятнадцатое место в блюзовых чартах Биллборда.'
