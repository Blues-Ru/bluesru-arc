  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2018-12-17'
  text: 'Новый альбом Уолтера Траута Survivor Blues выходит 25 января 2019 года на
    лейбле Provogue / Mascot. Это довольно необычный альбом в карьере именитого блюзмена,
    поскольку он полностью состоит из каверов. Идея Уолтера при создании альбома заключалась
    в том, чтобы записать не очередные версии хорошо известных и многократно перепетых
    блюзовых хитов, а дать свое прочтение полузабытым и малоизвестным блюзовым трекам.
    В процессе работы музыкант и его группа вовсе не старались воспроизвести эти песни
    нота в ноту; наоборот, Траут хотел аранжировать и исполнить эти композиции в своем
    собственном стиле.


    Вот как Уолтер вспоминает процесс работы с музыкантами его группы и старым проверенным
    продюсером Эриком Корном: "Я проигрывал им оригинальный трек, а потом говорил:
    ‘Вот как звучит эта песня, какие у вас есть идеи?'' Я давал этим ребятам максимальную
    свободу. Запись в основном проходила вживую, когда все мы сидели в кругу, что
    давало нам чувство совместной работы. И это, знаете ли, чувствуется."


    Среди выбранных для записи песен присутствует реверанс в адрес старого друга и
    наставника Джона Мэйолла, в группе которого Уолтер отыграл ряд лет до начала сольной
    карьеры. Желающие могут сравнить версию Nature''s Disappearing с гитарой Траута
    и оригинальный трек 1993 года, где солирует Коко Монтойя. Остальные треки также
    по-своему интересны, но бесспорный лидер - Me, My Guitar And The Blues из репертуара
    Джимми Доукинса.


    Среди гостей на альбоме присутствуют Шугарей Рэдфорд (на Woman Don''t Lie) и знаменитый
    гитарист The Doors Робби Кригер, который приходил в студию в процессе записи альбома,
    и Уолтер пригласил его записать соло на Goin'' Down To The River. Название альбома
    предложила супруга Уолтера - Мэри Траут.


    В итоге музыканты записали мощный альбом тяжелого гитарного блюза и блюз-рока,
    на котором Уолтеру удалось сохранить дух оригинальных треков, но при этом по исполнению
    это классический Траут с энергичной подачей, отменным мастерством исполнения и
    виртуозными гитарными запилами.'
