  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-20'
  text: 'Walter Trout Power Trio - Hardcore - 2007


    Уолтер Траут хорошо известен поклонникам мощного гитарного блюз-рока, однако на всем протяжении его долгой сольной карьеры
    музыкальные критики и некоторые музыканты никак не могли определить его стилевую принадлежность: блюзовые пуристы считали
    его рокером, тогда как рокеры не признавали в нем своего, относя к клану блюзменов. Сам Траут не придавал этому особого
    значения - он просто жил своей музыкой, которую играл для людей, не обращая внимания на стилевые границы.


    Довольно редкий и необычный диск как по музыке, так и по способу распространения (см. ниже). Записанный в апреле 2007
    года в Европе сборник концертных выступлений Уолтера с басистом и ударником включает ряд каверов и некоторые старые песни
    Уолтера в новой аранжировке. Идея выступать в составе трио пришла к Уолтеру в один из вечеров, когда старый добрый Hammond
    B3 клавишника внезапно сломался, и им пришлось играть без него. Этот вечер принес гитаристу массу новых ощущений, и он
    решил некоторое время поиграть в таком сокращенном составе. Фонограммы этих выступлений и собраны на данном диске, который
    был издан самим Уолтером без привлечения каких-либо студий записи и записывающих компаний. В магазинах этот диск не продается,
    поскольку предназначен только для самых преданных фанов (hardcore fans, отсюда и название диска). Диск распространяется
    среди членов фан-клуба, на концертах, а также в виде мр3-файлов.


    В музыкальном отношении это тяжелый энергичный блюз-рок с виртуознейшей гитарой - пожалуй, это самый тяжелый и жесткий
    диск Траута, который во время этих концертов отрывался по полной.'
