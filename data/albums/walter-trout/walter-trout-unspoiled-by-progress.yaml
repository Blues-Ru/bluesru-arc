  text: 'Walter Trout - Unspoiled By Progress (20 Years of Hardcore Blues) - 2009


    Ретроспектива 20-летнего сольного творчества одного из лучших блюз-роковых гитаристов
    нашего времени, включающая в себя неизданные ранее редкие студийные и концертные
    треки, а также 3 новые песни ("They Call US the Working Class," "Two Sides to
    Every Story" и "So Afraid of the Darkness"). Собственно, название на редкость
    точно отражает содержимое диска: "Неиспорченный прогрессом" Уолтер верен своим
    корням и по-прежнему играет бескомпромиссный жесткий блюз-рок с отменной техникой
    владения гитарой (отсюда и подзаголовок - 20 лет "упертого" блюза).


    Уолтер сам выбирал материал для включения на данный сборник, стараясь обеспечить
    разумный компромисс между качеством записей и качеством исполнения. И если на
    паре-тройке треков качество звука не самое лучшее (есть даже моно трек), то с
    качеством исполнения проблем никаких - все как обычно на недосягаемой высоте!


    Начиная с записей с первым составом Walter Trout Band в 1989 году и записей для
    ВВС в 1991 через ряд концертных выступлений на различных блюзовых фестивалях (обратите
    внимание на соло Уолтера на гармонике, на которой он периодически играл в начале
    90-х), и до последних студийных записей в марте 2009 года (заглавный трек They
    Call Us The Working Class, написанный в лучших традициях Уолтера, был выпущен
    также на сингле и на видео) - весь представленный материал представляет несомненный
    интерес для любителей "тяжелого" блюз-рока и отменных гитарных соло. Представленная
    на диске версия Sweet as a Flower - это последнее выступление с группой в Лас-Вегасе
    для оригинального и бессменного бас-гитариста Джимми Траппа, который через два
    дня был госпитализирован и скончался 24 августа 2005 года. Продюсировали сам маэстро
    и Эрик Корн. Хороший репрезентативный диск для еще незнакомых с творчеством Уолтера,
    и приятное дополнение к коллекции для его поклонников.'
