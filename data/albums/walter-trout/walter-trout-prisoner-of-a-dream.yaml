  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2011-05-20'
  text: 'Вторая сольная пластинка Уолтера Траута - Prisoner of a Dream - была записана
    в 1990 году, и оказалась ничем не хуже дебютной. По моему личному мнению, первые
    сольные альбомы являются наиболее целостными и интересными из всего его творчества.
    Как говорится, чем ближе к Мэйоллу, тем лучше :-)


    Тем не менее Уолтер на этом не остановился, и в дальнейшем записал много прекрасной
    и техничной музыки.


    Второй сольник Уолтера был записан в 1990 году в Дании и вышел в 1991 на фирме
    Provogue. В группе сменился ударник. На альбоме два кавера - Girl from the North
    Country Боба Дилана и Love in Vain Роберта Джонсона, остальные треки написаны
    самим Уолтером (или в соавторстве). В качестве бонус-трека - посвящение Мадди
    Уотерсу.


    Диск сделан в стилистике первого альбома - это мощный мелодичный техничный блюз-рок,
    но чуть с более коммерческим звучанием. На диске группа эпизодически использует
    духовую секцию, аранжировки для которой сделаны продюсером альбома Дэвидом Андерсоном
    и Уолтером Траутом.


    Один из лучших альбомов Уолтера Траута.'
