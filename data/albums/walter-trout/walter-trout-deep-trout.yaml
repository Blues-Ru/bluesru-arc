- id: 1492
  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: Собрание записей американского гитариста, популярного на европейских фестивалях,
    выполнено европейским же лейблом – что вполне логично. Траута часто и напрасно
    сравнивают со Стиви Реем Воэном. На самом деле тот стиль, которого придерживается
    Траут, сложился вполне еще лет 30 назад. Это очень хорошо иллюстрирует самая древняя
    запись в альбоме – 1972 года. Исполняется блюз Джуниора Уэллса "Так печально быть
    одиноким" - голос молодого певца жалостлив до слезливости, а вот гитара столь
    же сурова и напориста, как сегодня. Все остальные треки относятся к периоду 90-х.
    Вряд ли альбом открывает нечто новое. Но энергетика, которую генерирует Траут,
    внушает уважение. Любителям блюза покажется, что рок-н-роллов в альбоме больше,
    чем нужно. Лишь суровая поступить "Посвящения Мадди Уотерсу" (основанная на классическом
    "Catfish Blues") заставляет поверить, что Траут хорошо знаком с классикой жанра.
- id: 1740
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-20'
  text: 'Walter Trout - Deep Trout (The Early Years of Walter Trout) – 2005


    Сборник из ранних сольных работ Уолтера (альбомы со второго по пятый, причем второй
    представлен наиболее полно), а также три неизданных ранее трека: акустическая
    версия Life in the Jungle и два трека, где Траут выступает в качестве аккомпаниатора
    для других артистов: соло-гитара на пластинке Фрибо и, наконец, изюминка из прошлого
    - выступление Уолтера в 1972 году в составе группы Джуниор Уэллса (Трауту тогда
    был всего 21 год).


    Поскольку обо всех этих сольных альбомах Уолтера я уже рассказывал, повторяться
    не имеет смысла (кому интересно, найдет их выше). Сборник дает неплохое представление
    о начале сольной карьеры одного из лучших блюз-роковых музыкантов современности.
    Однако, если бы мне предложили выбрать наиболее репрезентативный диск того периода,
    это был бы концертник 1992 года (а из студийных Prisoner of a dream).


    Тринадцатое место в топе блюзовых альбомов Биллборда.'
