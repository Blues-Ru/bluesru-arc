- id: 1741
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-20'
  text: 'Девятнадцатый сольный альбом выдающегося современного гитариста и певца,
    который на момент выхода этого альбома уже более 30 лет (и более 20 лет сольно)
    радует поклонников качественным блюз-роком. Данный альбом сделан в лучших традициях:
    музыка качественная, исполнение великолепное, мелодизм и техника игры дополняют
    друг друга.


    Уолтер верен себе и корням - музыка мгновенно узнаваема! Есть и мощные энергичные
    блюз-роковые треки, есть мелодичные баллады, есть даже диксиленд (!). Пожалуй,
    баллады чуть более "сладкие" и коммерческие, чем обычно, да и вообще на ряде треков
    звук альбома чуть "полегчал" (видимо, сказалось влияние продюсера Джона Портера,
    который также микшировал альбом). Ну ничего, Уолтер наверстает на остальных треках
    и особенно во время концертов :-) Диск записан с 8 по 18 марта 2010 года, весь
    материал написан Уолтером, за исключением Hudson Had Help - в соавторстве с Тимом
    Джанигеном.


    В целом диск интересный и довольно разнообразный, но до лучших работ Траута, пожалуй,
    недотягивает.


    "In this modern world which seems to be so filled with polarization, disagreements,
    and cruelty, I feel that it is important that we try to find SOME place where
    we can bond and come together in our common humanity!" - Walter Trout'
