- id: 1729
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-20'
  text: 'Очередной сольный альбом был записан Уолтером после смены ударника весной 1997 года в Мемфисе на Beale Studios (см.
    название пластинки), и издан позднее в этом году в Европе на проверенной фирме Provogue, в качестве продюсера выступил
    знаменитый Джим Гэйнс.


    Альбом получился довольно удачным и по технике исполнения (а кто бы в этом сомневался!), и по материалу, и по качеству
    записи. Наконец период "разброда и шатаний" закончился, и Уолтер вернулся к тому электрическому гитарному блюз-року, в
    котором он корифей. Некоторая стилистическая разноплановость альбома (который длится аж за 70 минут) не позволяет поставить
    ему "пятерку", но уж "четверка" тут твердая (а то и 4+).'
