  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2016-10-20'
  text: 'Альбом Battle Scars - наглядное свидетельство того, что Уолтер Траут полностью поправился после пересадки печени
    и длительного периода реабилитации (кто сомневается - может послушать, например, Playin'' Hideaway). Его эмоции и переживания
    в течение того ужасного периода, когда он несколько раз был на волосок от смерти, послужили материалом для этого альбома.
    На диске Уолтер просто рассказывает о том, что ему пришлось пережить в процессе борьбы за жизнь, и как изменилось в результате
    его восприятие окружающего мира. Это, пожалуй, самый эмоциональный, искренний и личный альбом ветерана блюз-рокера, который
    в этом году отмечает 50 лет с того момента, как он начал играть на гитаре.


    Диск получился в традиционном для Траута ключе - мощный и техничный блюз-рок, материал полностью авторский. Сам Уолтер
    не только демонстрирует виртуозное владение гитарой, но и не забывает и гармонику. Помогали при записи музыканты группы
    Уолтера: клавишник Сэмми Авила, ударник Майкл Лиже и басист Джонни Грипарик (а также Скип Эдвардс на фортепиано на паре
    треков). Продюсировал Эрик Корн. Достойная работа настоящего мастера, который триумфально вернулся на сцену.


    Пятого мая 2016 года в Мемфисе на 37й ежегодной церемонии вручения Blues Music Awards Уолтер Траут получил две престижные
    блюзовые награды: за лучший блюз-роковый альбом года Battle Scars 2015 и песню года Gonna Live Again.'
