- id: 1726
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-20'
  text: 'А вот третий альбом Траута получился менее удачным. Уолтер попытался объединить
    в одном альбоме несколько разных музыкальных стилей, и не все из задуманного получилось
    одинаково хорошо. Тем не менее диск достоин прослушивания даже просто из-за техники
    игры, не говоря уже о наличии таких хитов, как Motivation of Love и Playing with
    your gloves on.


    Одним словом, это не лучшая пластинка Уолтера, но для многих других исполнителей
    записать подобную пластинку было бы честью.'
