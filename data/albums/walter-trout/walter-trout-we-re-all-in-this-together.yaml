  date: '2017-09-01'
  text: '"It was quite a piece of work to get this record together," Walter admits. "But I guess I have a lot of friends,
    y''know...?"


    Уолтер Траут играет блюз уже не один десяток лет - даже сольной карьере блюз-рокера скоро стукнет 30, а до этого было
    сотрудничество с Джоном Мэйоллом, Canned Heat и другими. Естественно, что за эти годы он приобрел множество друзей в мире
    блюза, и некоторых из них он пригласил принять участие в работе над очередным альбомом. Диск We''re All In This Together
    сделан по рецепту альбома Full Circle 2006 года - на каждом треке кроме Уолтера и его группы присутствует приглашенная
    блюзовая звезда, под стиль которой и написана соответствующая песня. Итого мы имеем 14 песен и 14 исполнителей высшего
    блюзового эшелона (ОК, сын Уолтера пока еще не достиг таких высот, но зато сам Уолтер бесспорно звезда первой величины).
    Авторских песен на диске 13, да плюс кавер на The Sky is Crying. Продюсировали Эрик Корн и сам маэстро.


    На диске представлен блюз во всем его разнообразии - это целый праздник блюза как путешествие по жизни Уолтера Траута
    и его друзей, хотя упор естественно сделан на основную стилистику Траута - гитарный блюз и блюз-рок. Все треки сделаны
    на высоком уровне с учетом стиля приглашенного музыканта, проходного материала нет. Но лучше всего получились песни, где
    инструмент гостя не сливается с гитарой Уолтера, а оттеняет ее: это либо гармоника Чарли Масселуайта или Джона Немета,
    либо саксофон Эдгара Уинтера, либо слайд Сонни Ландрета или Уоррена Хэйнса, либо гитара абсолютно другого тона (например,
    отличное соло Джо Луиса Уолкера в районе 2:00 - 2:30 Crash and Burn). На мой взгляд, лучший трек - идеально сбалансированный
    дуэт с Сонни Ландретом, хорош также следующий трек с Чарли Масселуайтом, затем роскошный дуэт с Уорреном Хэйнсом, а также
    довольно необычная песня с Майком Зито. Также интересны: первый блюз-роковый шаффл с Шепердом, прифанкованный блюз с Гэйлсом,
    дуэты с Эдгаром Уинтером и Джоном Неметом. Единственный акустический трек с гармоникой Джона Мэйолла посвящен памяти покойного
    Джимми Траппа, который был бас-гитаристом группы Траута более 15 лет до самой его безвременной кончины в 2005 году. Завершает
    диск заглавный трек - дуэт с Джо Бонамассой, который был записан музыкантами вживую в студии одним дублем по итогам трехчасовой
    сессии (на мой взгляд, тут оба гитариста слегка увлекаются скорострельностью нотоизвлечения в ущерб тому самому блюзовому
    "филингу", и результат сыроват).


    Несмотря на то, что только два трека были записаны с физическим присутствием гостя в студии с остальными музыкантами ("семейный
    подряд" Do You Still See Me At All и заглавный трек), все песни сыграны отменно и звучат вполне естественно. Уолтер с
    помощью друзей записал отличный блюзовый альбом и еще раз доказал, что полностью преодолел недуг и вернулся в строй.


    В мае 2018 года Уолтер Траут получил за этот альбом блюзовую награду за лучший блюз-роковый альбом (2018 Blues Music Award
    for best rock blues album)'
