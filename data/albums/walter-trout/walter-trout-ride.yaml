  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2022-11-01'
  text: 'Уолтер Траут, лицо классического американского блюз-рока конца прошлого и
    начало нашего века. Отменный гитарист, композитор и певец. Человек, фактически
    восставший из мертвых после пересадки печени. Настоящий блюзмен и наставник новых
    музыкантов. Музыкант, искренне преданный блюзу и своим поклонникам, которого не
    могут сломить никакие неприятности.


    19 августа 2022 года в Европе вышел ТРИДЦАТЫЙ сольный альбом блюзового ветерана
    - в свои 70 с небольшим Уолтер в очередной раз продемонстрировал класс и выпустил
    один из лучших альбомов в своем обширном каталоге. Во время пандемии Трауту по
    вполне понятным причинам пришлось самоизолироваться, и, несмотря на естественную
    депрессию от невозможности выступать с концертами, он потратил это время с пользой
    - написанные новые 12 песен отменно хороши! Материал естественно авторский, а
    продюсером по-традиции выступил Эрик Корн.


    Сам Уолтер считает так: "Вы можете интерпретировать название этого альбома по-разному.
    Да, данный диск действительно представляет собой музыкальное путешествие, и я
    правда пытался охватить множество стилей. Но, ведь по сути, сама жизнь тоже своего
    рода поездка, не так ли? И я хочу прожить свою жизнь по-максимуму." Приятно слышать
    такое заявление от человека, которому была дана вторая жизнь (и друзья и поклонники
    тут сыграли главную роль, собрав необходимую сумму на трансплантат). И данный
    альбом звучит в точном соответствии с заявлением его создателя - по-максимуму,
    так чтобы индикаторы зашкаливали!


    Альбом был записан без привлечения именитых гостей - только сам Уолтер и его группа.
    Единственный гость - это тур-менеджер Энтони Гришам, отыгравший партию ритм-гитары
    на треке "Leave It All Behind". Из-за сломанного мизинца на левой руке Траут уже
    не в состоянии играть требующий все четыре пальца ритм Чака Берри, и тут пришлось
    позвать на помощь Энтони.


    В начале альбома на треках присутствует достаточно много гармоники (если кто забыл,
    Уолтер сам играет на ней), а на десятом треке очень дозированно добавлены духовые.
    Но в целом это традиционный и классический гитарный блюз-рОковый Траут - предельно
    искренний, мелодичный, техничный, энергичный, блюзовый, рОковый - другими словами,
    мгновенно узнаваемый. Отличный альбом знаменитого музыканта, от которого поклонники
    гарантированно получат огромное удовольствие.'
