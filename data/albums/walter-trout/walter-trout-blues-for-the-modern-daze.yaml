  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2012-05-22'
  text: 'Двадцать первый альбом выдающегося блюз-рокера, гитариста, певца и композитора на вторую неделю после выпуска добрался
    до 4 места в блюзовом топе Биллборда. Уолтер сочинял его почти год, записывая демо на акустической гитаре, прежде чем
    пойти в студию в Калифорнии записывать новый материал со своей концертной группой. Траут признался, что при записи музыки
    он вдохновлялся творчеством легендарного блюзмена-новатора Блайнд Уилли Джонсона, вошедшего в историю в частности в качестве
    автора таких блюзов с влиянием госпел, как ''Soul of a Man'' и ''Nobody''s Fault But Mine". Наверняка последний акустический
    трек Уолтер сделал именно в традиции Джонсона.


    Музыкант также отметил: "Данный альбом отражает мой интерес к исследованию той стороны музыки, которая характеризует мою
    первую музыкальную привязанность, и это в частности рассказывает что-то тоже и обо мне самом. В нем суммируются мысли
    и взгляды человека, который становится старше, и слегка чувствует себя принадлежащим к другой эпохе, и его нравственные
    ценности и предпочтения отличаются от преобладающих в настоящее время. И я поддерживаю эти ценности - такие как сострадание,
    аутентичность и честность - также сильно, как я поддерживаю свою музыку."


    Диск получился очень блюзовым для Уолтера и, на мой взгляд, одним из лучших его альбомов (уж за последние 10 лет точно
    лучший). Конечно, Америки он тут не открыл, все сделано в традиционном ключе, но с каким талантом и мастерством, а главное
    - с чувством и искренностью! Да плюс разнообразие блюзовых стилей, хорошие мелодии, присущий Уолтеру юмор, мощный проникновенный
    вокал, роскошные соло - в общем, что еще нужно любителю традиционного блюз-рока с энергичным современным звучанием?


    Уолтер показал, что не забыл и гармонику (у Мэйолла и на своих первых альбомах он обращался и к этому инструменту), а
    уж на гитаре он отжигает как надо - например, в Brothers Keeper, Recovery или Lonely. Если честно, выбрать какие-либо
    треки затруднительно, ибо весь материал очень высокого уровня, и каждая песня по своему хороша, проходняка просто нет.


    Для любителей современного техничного бескомпромиссного блюз-рока, основанного на традиции - просто must-have, ибо диск
    на мой взгляд из категории instant classic, который становится только лучше от неоднократного прослушивания. Однозначно
    к приобретению! Отличная работа настоящего Мастера!'
