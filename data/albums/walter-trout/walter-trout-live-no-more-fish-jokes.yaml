  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2011-05-20'
  text: 'И вот наконец по итогам первых трех сольников Уолтера Траута выходит концертный
    альбом - и какой альбом! Записанный во время августовского фестиваля в Дании и
    декабрьского фестиваля в Голландии концертник содержал более 70 минут музыки (выходил
    также в виде двойного винила) и показал Траута и его группу в естественной среде,
    в процессе взаимодействия с публикой.


    Знакомые с творчеством Траута прекрасно знают, что на концерте он играет ничуть
    не хуже, чем в студии, а зачастую даже лучше. Поэтому первый концертник Уолтера
    представляет особый интерес. На диске представлен материал, записанный в течение
    двух блюзовых фестивалей: 9 треков с фестиваля в Скандерборге (Дания) записаны
    10 августа 1991 года (по итогам двух первых альбомов Life in the Jungle и Prisoner
    of a Dream) с ударником Фрэнком Котинолой, тогда как три трека (с 8 по 10-й) записаны
    уже после выхода третьего студийника (Transition) на концерте в де Ханехоф (Голландия)
    17 декабря 1992 года с новым ударником Берни Перши. За исключением эпизодической
    смены ударников, состав группы остался неизменным. Группа исполняет материал Уолтера,
    за исключением трех каверов: Dust My Broom Роберта Джонсона, Girl From the North
    Country Боба Дилана и Going Down Дона Никса.


    В качестве продюсера выступил сам Уолтер Траут. Диск назван с юмором - "больше
    никаких рыбных шуток": обыгрывается "рыбья" фамилия гитариста ("траут" по-английски
    - "форель"), что иллюстрирует задник буклета.


    На мой взгляд, это лучший концертник Траута. Искусные развернутые соло, блестящая
    техника, мощь и напор - в общем, слушать просто удовольствие.


    Лучшая пластинка для того, чтобы познакомиться с этим прекрасным музыкантом. Рекомендуется
    всем любителям качественной музыки.'
