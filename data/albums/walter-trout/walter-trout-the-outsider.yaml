  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-20'
  text: 'В 2008 году Уолтер записал очередной хороший альбом - если угодно, в традиции "Уолтера Траута". Отлично сыгранный
    и записанный, он сочетает в себе традиционные блюзовые баллады и мощный блюз-рок. Не скажу, что это лучшая его работа,
    но вот то, что одна из лучших - это несомненно!


    3 место в блюзовом топе Биллборда. Альбом был выдвинут на блюзовую номинацию 30th Blues Music Award'
