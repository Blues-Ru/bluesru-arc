- id: 1736
  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2011-05-20'
  text: 'Казалось бы, что могло соединить таких корифеев блюза, как John Mayall, Coco Montoya, Bernard Allison, Jeff Healey,
    Joe Bonamassa, Eric Sardinas, Guitar Shorty, Finis Tasby, Junior Watson, James Harman, Deacon Jones и еще с десяток музыкантов
    на одном альбоме? Ответ простой – это Уолтер Траут, который на протяжении своей 35-летней карьеры успел переиграть со
    всеми этими (и многими другими!) музыкантами.


    Для записи этого альбома Траут пригласил своих друзей, с которыми он хотел вновь записаться, и большинство треков записано
    без всяких репетиций вживую с первого дубля, чтобы сохранить спонтанность и энергетику. Кроме того, практически все музыканты
    одновременно реально присутствовали в студии во время записи (а не пересылали свои соло, наложенные уже на готовую записанную
    другими музыку, как это часто делается для подобных all-star проектов), и на запись попало живое взаимодействие мастеров
    блюза. Чувствуется, что музыканты получают удовольствие от совместной игры.


    В силу участия в проекте множества разных музыкантов альбом также получился довольно разнообразным и тем особенно интересным,
    хотя нельзя не отметить общую тенденцию к тяжелому гитарному блюз-року с изобилием интенсивных спонтанных но одновременно
    мастерски сыгранных соло и гитарных дуэлей. Траут тут старается держаться несколько в тени, чтобы дать место развернуться
    приглашенным музыкантам, но и про себя не забывает! Данный альбом не слишком характерен для творчества самого Уолтера
    в силу заметного влияния других участников, но это не делает его хуже – он просто другой.


    Данный проект представляет собой своего рода замкнутый круг (т.е. Full Circle) в пространстве и во времени, путешествие
    по множеству стилей, относящихся к блюзовому жанру – прославление того, чем блюз был, что он есть, и чем он станет в будущем.
    Сам Уолтер считает свой альбом способом отдать должное тем музыкантам и временным периодам, которые помогли ему определить
    свой путь в музыке, а также возможностью продемонстрировать, как множество стилей в едином блюзовом жанре могут спокойно
    сосуществовать и оказывать взаимное влияние друг на друга, не обращая внимания на бОльшую или меньшую аутентичность или
    техничность того или иного из этих стилей. Уолтер никогда не ограничивался рамками того или иного стиля, стремясь их раздвинуть,
    и в его музыке блюз продолжает жить и развиваться.


    Второе место в блюзовых чартах Биллборда.'
