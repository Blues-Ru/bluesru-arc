- id: 1728
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-05-20'
  text: 'Провал попытки завоевания Америки с помощью предыдущего сольника не остановил
    Уолтера, и он начал все сначала (см. название первого трека - To Begin Again)
    - вернулся на старую проверенную студию Provogue, на которой в том же составе
    группы записал очередной альбом весной 1995 года.


    Альбом получился неплохим, но и не выдающимся. В нем есть какая-то стилистическая
    сумбурность, меньше стало блюзовых моментов, больше хард-рока, включая даже radio-friendly
    коммерческие треки. Но не обошлось и без очередной жемчужины - The reason I''m
    Gone до сих пор входит в сет лист концертов Траута. С точки зрения техники исполнения
    все как обычно на самом высшем уровне, но нет цельности в музыкальном плане, и
    опять временами присутствуют мелкие погрешности с микшированием. Одним словом,
    как и Transition, Breaking the Rules своего рода переходный альбом.'
