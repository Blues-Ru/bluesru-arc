  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2014-06-11'
  text: 'Год 2014 знаменует 25 лет сольной карьеры одного из выдающихся блюз-рокеров
    современности Уолтера Траута. К сожалению, радость юбилея была омрачена - вмешалась
    тяжелая болезнь: последствия рок-н-рольного стиля жизни дали себя знать, и в прошлом
    году у Уолтера отказала печень. Поскольку у самого музыканта не было достаточно
    средств для оплаты дорогого лечения, его друзья и поклонники в течение короткого
    времени собрали необходимые средства на операцию (более 130 000 долларов), а в
    настоящий момент собрано уже более 240 000, которые помогут оплатить медицинские
    расходы. Долгое время Уолтер находился под непрестанным наблюдением врачей в ожидании
    трансплантанта, и наконец 26 мая 2014 года состоялась операция, которая прошла
    успешно. Траут стойко перенес все трудности, и намерен восстановиться и вернуться
    на сцену в течение года. Огромную помощь в борьбе с тяжелой болезнью оказала любимая
    жена Мари, семья, друзья и поклонники.


    Несмотря на тяжелую болезнь, почти весь прошлый год Уолтер до последнего продолжал
    гастролировать, и именно выступления перед поклонниками давали ему дополнительные
    силы для выживания, а его музыка была лучшей терапией. В течение 2013 года и начала
    2014 Уолтер записал 12 новых песен (одно буги от Джона Мэйолла, один блюзовый
    стандарт Линуара, остальные собственного авторства), которые и вошли в новый альбом
    маэстро.


    И как тут не вспомнить старую поговорку о том, что блюз - это когда хорошему человеку
    плохо. Болезнь и страдания обострили чувства артиста, и он смог записать отличный
    блюзовый диск - предельно искренний, честный и одновременно мощный и разнообразный.
    Уолтер осознавал, что этот диск может стать его последней работой, и поэтому вложил
    в него все без остатка. В композиторском и музыкальном плане - никаких поблажек
    и скидок на болезнь, все сделано мастерски, как и подобает артисту такого калибра.
    Уолтер записал гитарные партии, вокал и гармонику (старые поклонники артиста знают,
    что Траут вполне прилично владеет и этим блюзовым инструментом), на паре треков
    ему помог старый коллега и ментор Джон Мэйолл, плюс соратники Уолтера по группе
    Рик Нэп, Сэмми Авила и Майкл Лиже. Продюсировали сам Уолтер и Эрик Корн.


    Резюмируя, можно сказать, что 25-летие сольного творчества Уолтер отметил как
    надо, записав один из лучших сольных альбомов. Дай Бог здоровья Уолтеру Трауту!


    "To play my music for people has become even more important to me. When I think
    about looking out into the crowds of people and connecting with everyone on a
    soul level, and sharing the experience of music with them, this is what keeps
    me fighting to get back: My family and my music is my lifeline. These days, it
    means more to me than ever before." - Walter Trout'
