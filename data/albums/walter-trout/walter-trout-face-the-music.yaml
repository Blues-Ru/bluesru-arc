  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-20'
  text: 'Концертник Уолтера и его Свободных Радикалов, записанный во время мирового
    турне 1999 года. Жесткий чрезвычайно техничный гитарный блюз-рок, драйв сумасшедший,
    первые 5 треков просто ураган!


    Вот так играют вживую настоящие мастера. Кроме старых хитов в сет-листе две новые
    песни. Продюсировал сам Уолтер. Обложка нарисована известным английским художником
    Робином Элвиным.'
