reviews:
- id: 217
  author: Алексей Калачев
  mark: 5
  date: '2003-09-18'
  text: Грубый, громкий, сочный диск. Упрощенный и утяжеленный вариант его альбомов 90-х годов. Подарок любителям блюз-рока,
    записанный живьем в одном из голландских клубов, но полностью состоящий из нового материала.
- id: 1735
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-20'
  text: 'На этом альбоме Уолтер по совету его супруги записал совершенно новый материал, но в концертной версии, без длительной
    репетиционной подгонки, студийных наложений и т.п. - т.е. именно так, как он лучше всего звучит - вживую! Концерт состоялся
    14 мая 2003 года в клубе Парадизо в Амстердаме - одна из тех точек, в которой Трауту всегда нравилось играть. По итогам
    концерта был выпущен ДВД и 73-минутный CD (есть также версия на SACD).


    Продюсировали Джим Гэйнс (который также микшировал альбом) и Уолтер Траут. Почти все песни написал сам маэстро, за исключением
    Jericho Road (совместно с супругой Мари) и Talk to Ya (совместно с остальными членами группы). Получился альбом жесткого
    сырого блюз-рока, исполненного с присущей Уолтеру мощью, блестящей техникой и агрессивностью. Не лучший альбом для Уолтера-композитора
    (ибо новый материал все-таки сыроват, да и не весь он является первоклассным), но один из лучших для исполнителя.'
