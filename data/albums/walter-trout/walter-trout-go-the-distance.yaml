- id: 1733
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-20'
  text: 'Еще одна добротная работа от Уолтера Траута, который за счет участия в многочисленных блюзовых фестивалях и плотного
    гастрольного графика в начале 21-го века постепенно начинает завоевывать все бОльшую и бОльшую популярность в родных Соединенных
    Штатах. (Популярность в Европе он завоевал уже достаточно давно, и там ему уже ничего никому доказывать не надо - он желанный
    гость во всех блюзовых точках старого света.) Этот диск уже добрался до 12 места в блюзовом топе Биллборда.


    Диск записан в Мемфисе в феврале - марте 2001 года под руководством знаменитого продюсера Джима Гэйнса. Название сопровождающей
    группы сократилось ("свободные радикалы" стали просто "радикалами", произошла также замена клавишника), но на качество
    музыки это никак не повлияло. Как обычно у Траута, это не чистый блюз - скорее блюз-рок, хотя есть и баллады, и блюзы,
    и рок-н-ролльные номера, есть и акустика, местами на фоне присутствуют духовые, и даже привкус кантри с аккомпанирующим
    аккордеоном. Тем не менее все треки пропитаны искренностью музыканта и, если угодно, блюзовым чувством и настроением.
    И хотя каждый отдельный трек сам по себе вполне хорош (а некоторые из них так просто отличные), все таки в силу такого
    стилистического разнообразия диск не производит целостного впечатления, поэтому до пятерки недотягивает.'
