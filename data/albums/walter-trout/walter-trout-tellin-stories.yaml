  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-05-20'
  text: 'В Европе группа Уолтера завоевала популярность и была гостем большинства
    основных блюзовых фестивалей, тогда как в Америке известность гитариста по-прежнему
    стремилась к нулю. Естественно, Траут хотел добиться успеха на родине. Однако
    первая попытка Уолтера записать альбом не на европейской фирме, как это было ранее,
    а на фирме, имеющей дистрибюцию в Америке, окончилась провалом.


    Записанный осенью 1993 года в Лондоне на Battery Studios и выпущенный на фирме
    Silvertone альбом Tellin'' Stories включал в себя вполне приличную музыку (один
    On the Rise чего стоит!) и отличное владение инструментами, но был записан настолько
    плохо, что это даже трудно себе представить. Слушать его без слез на глазах просто
    невозможно. Кто там отвечал за звук во время записи, или кто испоганил фонограмму
    в процессе микширования - неизвестно, но факт остается фактом - прослушать эту
    пластинку (а она довольно длинная) до конца может только настоящий фанат Уолтера.
    (Причем это не только мое мнение - на Амазоне рецензенты также пишут о том, что
    без эквалайзера при прослушивании не обойтись.) По-хорошему надо бы исходную мастер
    ленту перемикшировать по-новой, но кто ж этим будет заниматься? В общем, вполне
    приличный альбом был безнадежно испохаблен специалистами по звуку.


    При записи помогали: Mickey Moody - слайд гитара на треке 6 The Tingewick Horns
    - духовые на треке 6 Monica Reed Price, Bernie Marsden, Wally Bass - бэк вокал'
