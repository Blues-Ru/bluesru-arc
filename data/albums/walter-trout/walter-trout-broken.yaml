- id: 2368
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2024-03-06'
  text: 'Очередной студийный альбом блюз-роковой легенды вышел 1 марта 2024 года на
    лейбле Provogue. 72-летний ветеран и гитарист-виртуоз подарил поклонникам 12 новых
    авторских треков (три из которых написаны в соавторстве с женой Мари), включая
    один роскошный инструментал Love Of My Life, посвященный супруге Уолтера. Среди
    именитых гостей на альбоме отметились Бет Харт (Broken), Ди Снайдер (I''ve Had
    Enough) и британский мастер гармоники Уилл Уайлд (Bleed), и все приглашенные артисты
    отработали на "отлично".


    Несмотря на свой возраст, Уолтер не желает почевать на лаврах: "Я должен расти.
    Я хочу быть исполнителем, который вносит жизненно важный вклад. Я чувствую себя
    молодым (хотя знаю, что это не так). Но в душе мне по прежнему 25, и я хочу стать
    лучше и сделать что-то новое. Я могу еще многое сказать."


    В ответ на сегодняшнюю напряженную экономическую и политическую ситуацию во всем
    мире Уолтер заявляет следующе:"Я всегда старался писать песни в позитивном ключе,
    но этот альбом не совсем такой. Однако я всегда сохраняю надежду. Именно поэтому
    я и записал этот диск. Несмотря на то, что сегодня творится в мире, я буду упрямо
    держаться за свой идеализм, и не терять надежду". Несмотря на название диска Broken,
    по сути этот альбом стал для Уолтера и его поклонников побегом от всего того,
    что в сегодняшнем мире разрушено. Приятно ощущать, что несмотря на очевидное недовольство
    сложившейся в мире ситуацией, Траут не выплескивает свой гнев, а вкладывает всю
    душу и сердце в свою музыку, тем самым стараясь не разрушать, а создавать. Уолтер
    верит, что музыка в состоянии восстановить разрушенное - хоть и медленно, но каждая
    нота дает свой вклад.


    Записывал диск и продюсировал его проверенный соратник Уолтера Эрик Корн (с которым
    Уолтер записывает уже 15-й альбом), а в качестве исполнительного продюсера выступила
    Мари Траут. Диск сделан в традиционном для Уолтера ключе - техничный разноплановый
    блюз-рок с примесью мэйн-стримовой американы (хотя на данном альбоме блюза поменьше,
    а коммерческой компоненты пожалуй побольше). К музыкальному исполнению и первым
    восьми трекам у меня никаких претензий нет, а вот дальше уже на любителя. В целом
    диск хороший, но не выдающийся, в тройку лучших у Траута не попадает, но слушается
    с удовольствием.'
