  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2013-06-17'
  text: 'Мастер тяжелого блюза и блюз-рока Уолтер Траут выпустил свой 23 сольный альбом - и впервые это альбом, практически
    полностью состоящий из каверов (11 треков из 13): альбом-трибьют и альбом-посвящение другому великому чикагскому блюзмену,
    который ушел от нас в 1997 году - Лютеру Аллисону.


    Лютер и Уолтер не раз встречались, но играть вместе им пришлось только однажды - в 1986 году на традиционном джазовом
    фестивале в Монтре, ежегодно проводимым Клодом Нобсом. Тем не менее их объединяло взаимное уважение, любовь к музыке и
    безграничное служение ей: каждый из этих музыкантов играл и пел, полностью вкладывая все силы и всю душу, искренне надеясь
    достучаться до аудитории и сделать каждое шоу незабываемым. Блестящая гитарная техника, искренность и яростный напор в
    подаче материала всегда объединяли этих музыкантов, и неудивительно, что идея такого альбома появилась у Уолтера в момент
    смерти Лютера еще более 15 лет назад. И надо сказать, такое долгое ожидание оказалось оправданным - альбом получился блестящим!


    Он сделан честно, он сделан искренне, он сделан с любовью и уважением - как к самому Лютеру, так и к его музыке (которая
    более чем заслуживает внимания, хотя, пожалуй, наиболее интересно творчество Аллисона уже в 90-е годы). По иронии судьбы
    Лютер получил первое признание именно в Европе, а родина оценила его только ненадолго до смерти от рака (у Уолтера с признанием
    в Америке была очень похожая ситуация - пока Европа рукоплескала его таланту, в Америке до 1998 года даже не выпускали
    его альбомы). Да, исполняется музыка Аллисона, но исполнение, подача и интерпретация определенно Уолтера Траута, подход
    которого узнается если не с первой ноты - то уж со второй или третьей определенно. Тут есть и мощь блюз-рока, и тяжелый
    тягучий блюз, и пара мягких баллад, и характерные для Уолтера техничные скорострельные соло, и слайд (на слайде на одном
    из треков, написанном им самим, играет сын Лютера - Бернард) - весь арсенал блюзмена задействован на полную катушку. Все
    треки записаны с первого или второго дубля - для сохранения спонтанности, которая только добавляет искренности исполнения.
    Уолтер не стал чрезмерно увлекаться техникой, но подошел к музыке Аллисона бережно, постаравшись передать чувства, эмоции
    и одновременно страсть и мощь, свойственные подходу Лютера. В результате получился прекрасный трибьют от одного великого
    блюзмена в честь другого великого музыканта, и одновременно один из лучших дисков Уолтера Траута. Возможно, кого-то из
    неофитов этот альбом сподвигнет к прослушиванию дисков Лютера Аллисона - и тогда цель Уолтера будет достигнута! Диск однозначно
    и безоговорочно рекомендуется всем поклонникам Лютера Аллисона, Уолтера Траута, современного блюза, рока и техничной гитары.


    "Leave your Ego, play the Music, love the people" - Luther Allison'
