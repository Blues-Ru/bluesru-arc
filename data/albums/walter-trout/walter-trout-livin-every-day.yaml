  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-20'
  text: 'Livin'' Every Day - сильнейший блюз-роковый альбом 1999 года, полный мощных гитарных риффов, блистательных соло,
    местами украшенный духовой секцией. Диск записан в Мемфисе в феврале 1999 года, продюсировал знаменитый Джим Гэйнс.


    Материал преимущественно написан самим Уолтером (плюс некоторая помощь жены Мари и трех "свободных радикалов"). Let Me
    Know - посвящение недавно ушедшему другу известному блюзмену Лютеру Аллисону (впоследствии Уолтер запишет целый диск-трибьют
    музыки Аллисона). В качестве бонус-треков Уолтер переиграл две песни со второго сольного альбома - Prisoner of a Dream
    и The Love That We Once Knew.


    Настоятельно рекомендую всем поклонникам тяжелого ритм-и-блюза и блюз-рока - это один из лучших дисков Траута.'
