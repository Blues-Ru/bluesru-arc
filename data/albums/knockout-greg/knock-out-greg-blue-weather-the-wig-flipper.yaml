reviews:
- id: 133
  author: Федор Романенко
  mark: 10
  date: '2003-07-09'
  text: 'Шведская группа - одно из самых неожиданных блюзовых открытий для меня за последнее время. 8 блюзовых фанатиков собрались
    15 лет назад в Стокгольме и в результате долгого и очень целеустремленного труда сделали самую стильную по звуку и внешнему
    виду блюзовую группу, исполняющую ретро-блюз и вест-коаст в сочетании с соул. Полуакустическая гитара, контрабас, хроматическая
    и обычная гармоника, деревянный рояль, три (!) дудки + ламповые усилители, Кадиллаки и граммофоны на обложке, прически,
    ботинки и удалое выражение лица солиста (не говоря о музыке) создают впечатление полного совершенства стиля. В музыкальном
    ключе Knockout Greg & BW отталкиваются от ретро-блюза, вест-коаста T-Bone Walker-а и чикаго Little Walter-а, но, однако,
    назвать это повторением, язык совершенно не поворачивается. Мне очевидно, что они вытащили основные музыкальные инновации
    того времени, прослушав абсолютно все, что было на тему, после чего в своей музыке усилили самые стильные, драйвовые и
    музыкально неустойчивые элементы, исполнили с безукоризненным звуком на современном уровне, перемешав с вещами, которые
    появились уже после. В этом смысле, эта музыка - совершенно новая, ничего такого в 50-х годах найти не получится.


    Ядро группы составляют гитарист Anders Lewen, который написал половину песен и вокалист-гармонист (и гитарист, по случаю)
    - Knockout Greg - самый стильный персонаж. Lewen - потрясающе талантливый гитарист, я видел в каком-то американском тексте
    на блюзовую тему примерно такую фразу: "В современном вест-коасте есть 5 основных гитаристов, определяющих жанр, - Кид
    Рамос, Джуниор Ватсон, Рик Холмстром, Алекс Шульц и Андерс Левен." Это - довольно сильная рекомендация, на мой взгляд
    ;)


    Пластика "The Wig Flipper" из пяти пластинок группы, которые все как на подбор хороши, пожалуй, нравится мне больше всего.
    Название пластинки является некоторой загадкой и совпадает с названием инструментала, сочиненного Anders Lewen в духе
    Рика Холмстрома. При этом, оно так же несерьезно, как и стильно, означает что-то вроде "переворачивателя париков". Стоит
    вспомнить, что в 1999 году пафосные блюз-рокеры, как правило, называли свои пластинки в стиле "Кровь и слезы" или что-то
    в этом роде. Название основано на игре слов и объясняется на последней странице буклета, вот частичный перевод абзаца
    оттуда: "В 1949 году была выпущена пластинка блюзового шаутера Jimmy Smith. Она содержала песни "Ma-Ma" и "Talking Boogie".
    В сентябре того года Биллбоард писал о ее обратной (flip) стороне: "Talking Boogie is not quite a wig-flipping as the
    reverse side - but a wig-flipper". Сегодня, более чем 50 лет спустя, мы постараемся поделиться some wig-flipping с вами.
    Итак, Леди и Джентльмены, пожалуйста, придерживайте свои парики".


    Альбом начинается с самой классной песни "Baby, baby blues". Она очень простая по форме, гитара играет басовый рифф из
    четырех нот, поддержанный дудками, который сразу заводит своей неустойчивостью, и весь день крутится в голове. Потом Грег
    поет куплет: "Baby, baby, can I-I-I be your man? If I can''t be your man, I-I-I wanna hold your hand." Идеальная лаконичность
    и простота, которая убивает наповал ;)


    Далее песни чередуются стилями, темпами, не утомляя слушателя. Арсеналом из дудок, губной гармоники и пианино они пользуются
    далеко не всегда, а только там, где они уместны. Многие песни сыграны в классическом малом блюзовом составе.


    Песни на этой пластике подобраны идеально, они все разные, если рассказывать, то нужно про все, но, разумеется, лучше
    послушать музыку, чем читать ее описание. Выборочно хочется отметить лирический минорный блюз You Can''t Undo (What''s
    Been Done) с великолепной хроматикой Грега и гитарой Андреса, которые своим лиризмом на пару убирают знатоков "блюзового
    чувства" традиционной школы. Немного соул делает эту песню отличающейся от других минорных блюзов.


    Tought Times исполнена в совершенном подражании Muddy Waters, ничем ему не уступая. Особый шедевр на пластинке - песня
    "She''s in Love With My Pocket Book" - блюз Свена Зеттерберга, очень известного шведского исполнителя соул-блюза, который
    написал ее в не совсем типичном для себя жестком "тугом" ритме, который великолепно подошел для Knockout Greg & BW. Песня
    про жену лирического героя-музыканта, которая, судя по всему, любит его кошелек больше его самого. "She says If can''t
    go shopping, It gives me the blues".


    Сразу после нее идет очень смешная, написанная какими-то рокабиллами, песня Get Out Of The Car про девушку, которую лирический
    герой катает за городом на новом Кадиллаке. В куплете, к примеру, поется – "когда он придвинулся к ней поближе, чтобы
    разглядеть получше звезды, девушка поняла его неправильно". И дальше припев - "Get out of the car!....... You gotta walk
    home, baby, ''cause you just don''t treat me right.".


    Заканчивается пластинка инструменталом Sonny Boy Williamson II "Horton''s Hot Foot" в хорошей обработке с классной гармоникой
    и гитарой через тремоло. Для меня эта пластинка стала одной из самых любимых. Неважно, где ты родился, в Швеции или в
    Америке, любовь к музыке делает свое дело.'
