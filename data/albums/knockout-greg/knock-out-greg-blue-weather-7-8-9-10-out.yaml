  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2012-02-03'
  text: 'Третий диск шведских блюзовиков, который также выходил исходно в 1998 году с другой обложкой. На этом диске традиционный
    для группы стилизованный под пятидесятые джамп-блюз украшен эпизодическими включениями саксофониста Пэра Гребакена. Диск
    заметно сильнее дебютника, группа играет более слаженно и профессионально.


    Авторских треков всего 3, остальное - каверы. Группа демонстрирует хороший средний уровень, компенсируя относительный
    недостаток исполнительского мастерства напором и энергетикой. Тем не менее, на отдельных треках (например, You''re Too
    Late) лидер группы Грег Андерссон в роли харпера очень хорош и ничем не уступает своим американским визави. В то же время,
    на мой взгляд, восторженные дифирамбы в адрес гитариста и всей группы в целом не слишком обоснованы. Да, группа очень
    приличная, но до таких европейских блюзовых грандов, как, скажем, Blues Company, им еще очень и очень далеко. Тем не менее
    диск приятный и рекомендуется к прослушиванию :-)'
