  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2012-02-03'
  text: 'Второй альбом шведской блюзовой формации под предводительством харпера, певца и гитариста Грегера Андерсона (он же
    Грег-нокаут). О данном коллективе я уже рассказывал ранее, желающие легко найдут эту информацию.


    Несмотря на свое европейское происхождение, группа придерживается традиций чикагской блюзовой школы, играя блюз и танцевальный
    джамп-блюз в лучших традициях города ветров. Более того, сам диск группа записала в Чикаго - на студиях Делмарк в декабре
    1996 года, осуществив тем самым свою давнюю мечту. Все сыграно достаточно профессионально, без затянутых соло, и с хорошим
    чувством юмора. Очевидно, что музыканты получают удовольствие от того, чем занимаются. Любители традиционного чикагского
    блюза несомненно получат удовольствие от прослушивания.'
