- id: 2034
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2012-02-03'
  text: 'Дебютный альбом блюзового квинтета из Швеции, созданного в 1987 году певцом и харпером Грегером Андерссоном (он же
    Грег-нокаут) и его братом ударником Маркусом. Группа исполняет блюз и джамп-блюз в чикагском стиле с легкой стилизацией
    под 50-е, добавляя в музыкальный коктейль немного джаза и свинга. Моя первая ассоциация - Little Charlie & the Nightcats.


    Группа исполняет как каверы 50-х, так и собственные композиции, написанные в том же стиле (на этом диске таких треков
    4). Не имеющий представления о национальности музыкантов на основе их музыки практически наверняка посчитает их американцами
    - настолько традиционно они звучат. Очень приличный дебют, хотя бесспорно есть простор для усовершенствования. Все-таки
    на этом альбоме музыкантам все еще не хватает класса, хотя желания и энтузиазма у них более чем достаточно. Данный диск
    исходно вышел на маленьком независимом лейбле Last Buzz Recods, а в 2001 он был этим же лейблом переиздан.'
