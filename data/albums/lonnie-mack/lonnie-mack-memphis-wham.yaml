  date: '2007-07-12'
  text: 'На этом сборнике собраны записи Лонни периода 1963-1967. Тут целиком есть
    номерной альбом 1964 года THE WHAM OF OF THAT MEMPHIS MAN! + еще 11 бонусов!


    Соул-блюз и ритм-н-блюз. Лонни классно играет на гитаре и отлично поет! Около
    половины вещей на альбоме - инструменталы. Этот 25-трековый сборник понравится
    и любителям блюза, и любителям соула.'
