- id: 1101
  author: Дмитрий Казанцев
  mark: 8
  date: '2007-06-23'
  text: 'Третий альбом Лонни. Он отлично поет и мощно играет на гитаре. Его музыка - это южные дела: ритм-н-блюз, соул, соул-блюз,
    фанк и даже есть одна кантри-песня. Большая группа играет с ним - дудки, гармошка, ритм-секция.


    Диск понравится и любителям блюза, и любителям соула!'
