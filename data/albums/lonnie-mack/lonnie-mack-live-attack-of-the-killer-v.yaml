  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2016-09-15'
  text: 'Обладатель знаменитой гитары Gibson Flying V (седьмой выпущенный экземпляр
    этой модели музыкант приобрел в далеком 1958 году), Лонни Мэк оказал заметное
    влияние на множество блюзовых гитаристов, включая Стиви Рэя Воэна, который восхищался
    игрой Лонни и способствовал его возвращению в большой бизнес, спродюсировав альбом
    Мэка 1985 года Strike Like Lightning для фирмы Аллигатор.


    Как совершенно справедливо написано в одном из отзывов на этот альбом, это "одна
    из лучших концертных записей всех времен". V в названии альбома относится к модели
    гитары, которую прославил Лонни.


    Запись концертов в Иллинойсе 14 - 16 декабря 1989 года, блюз-рок с сумасшедшим
    драйвом, представлен материал в основном с последних пластинок Мэка, записанных
    на фирме Аллигатор. Играют всего четверо музыкантов, при этом Лонни раскрывается
    во всей красе! Продюсировали Лонни Мэк и создатель фирмы Аллигатор Брюс Иглауэр.


    Настоящий подарок для любителей сырого мощного неистового блюз-рока и техничной
    гитарной игры.


    "Hear where Stevie got his stuff. Released in 1990. Awe-inspiring album...Mack''s
    tone can cut diamonds " - BILLBOARD


    "One of the greatest live recordings of all time" - CD REVIEW'
