  author: Дмитрий Казанцев
  mark: 8
  date: '2005-05-29'
  text: 'Еще один замечательный исполнитель блюза и соула. Сил начинал как блюзовый гитарист/гармонист и играл со многими
    известными блюзменами, но потом развился до соула и сам стал петь (и как!)


    На диске - два первых альбома Сила (1968 и 1970). Если на первом мы слышим довольно попсовый (но классный) северный соул
    и ритм-н-блюз, то второй альбом - это уже настоящая черная "музыка протеста". Радует и тот факт, что Сил играет на гитаре
    - это довольно редко для ритм-н-блюза. Аранжировки ориентированы на гитарную игру, а не на клавиши/дудки/струнные.


    Замечательная музыка и пение! Second to none!'
