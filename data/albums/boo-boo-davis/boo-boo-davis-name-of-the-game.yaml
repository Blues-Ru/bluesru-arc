reviews:
- id: 1423
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-04'
  text: 'Эти немолодые дядьки из вежливости улыбаться не станут: тертые калачи. Бу Бу Дэвис – из последних, кто знает, что
    такое ручной труд на хлопковых плантациях под палящим солнцем Миссиссиппи. С ним двое убеленных сединами белых, идеально
    разделяющих его понимание корневого блюза в электрическом отображении. Всего: голос и губная гармоника, плюс гитара и
    ударные. Звучит ансамбль его суше, чем представляется по составу. Доминируют одноаакордовые блюзы. Гортанный вопль вместо
    пения. Рубленные строчки вместо мелодии. Короткие инструментальные брейки вместо соло. Ритм пружинистый, но с места его
    не сдвинешь – неизменный. Жесткий гипнотический грув без прикрас. Храните в месте, недоступном для детей: Who Stole the
    Booty ("Кто булки свиснул?") может вызвать приступ истеричного веселья. И одна величавая баллада все-таки есть: про разбитое
    сердце (! Надо заметить, что не смотря на зарок обходится без бас-гитариста вообще, в нескольких треках гитара выполняет
    и ритм- и бас-партию. Ключевые треки: Tryin To Get Ahead (мрачная), It''s A Shame (плясовая), I''m So Tired (самогипноз
    и потеха в одном флаконе).'
