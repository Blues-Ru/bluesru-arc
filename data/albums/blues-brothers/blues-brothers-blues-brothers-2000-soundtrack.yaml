- id: 596
  author: Дмитрий Казанцев
  mark: 7
  date: '2005-04-28'
  text: Блюзов тут почти нет, разве что "How Blue Can You Get?" в исполнении Би Би
    Кинга, Эрика Клэптона и тусовки под названием Louisiana Gator Boys. Остальные
    17 композиций - это симпатичные песни в стилях соул, ритм-н-блюз, госпел, рок
    и вестерн. Очень хороша знаменитая "634-5789" в исполнении Эдди Флойда, "Riders
    In The Sky" - стебовый вестерн в духе "Raw Hide" с первого саундтрека, "John The
    Revelator" - прекрасный госпел в исполнении Тажа Махала и Сэма Мура, Доктор Джон
    сделал интересную обработку Доновановской "Season Of The Witch", "Funky Nassau"
    - знаменитый хит, тут в исполнении актеров Мортона, Эйкройда и Гудмана. Приятная
    подборка песен. Этот саундтрек гораздо интереснее самого фильма, который местами
    просто ужасен.
