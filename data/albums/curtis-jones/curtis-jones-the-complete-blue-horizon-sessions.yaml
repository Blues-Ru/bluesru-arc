  author: Сергей Исправников
  mark: null
  date: '2008-08-17'
  text: 'Фигура незаурядного техасского пианиста и гитариста Куртиса Джонса была не
    слишком известной даже при жизни, а сегодня к нему в полной мере относится определение
    "забытый блюзмен". Издавая данный сборник с материалом, записанным Джонсом для
    лейбла Blue Horizon, продюсер Майк Вернон хотел не только продолжить серию "The
    Complete Blue Horizon Sessions", но и привлечь внимание современной аудитории
    к этому исполнителю, а также отдать дань памяти первому американскому блюзмену,
    которого он записал в своей жизни. Дебютный британский альбом Джонса, записанный
    с участием Алексиса Корнера, "Curtis Jones In London" вышел в 1964 г. на фирме
    Decca, на которой одним из продюсеров и начинал свою карьеру в профессиональной
    звукозаписи Майк Вернон. Впоследствии, как и многих других исполнителей, с которыми
    он работал на Decca, Вернон пригласил Джонса записаться на своем собственном лейбле
    Blue Horizon. К этому времени Куртис Джонс уже несколько лет как обосновался в
    Париже, вслед за рядом американских блюзовых пианистов променяв нищету и расовую
    сегрегацию у себя на родине на востребованность и уважительное отношение со стороны
    европейской аудитории.


    Во время предварительных переговоров Джонс несколько раз менял свое мнение относительно
    того, что он будет записывать в студии. В конечном итоге, Майк Вернон настоял,
    чтобы записывались только те пьесы, которые раньше не выходили ни на одном лейбле.
    Нельзя сказать, что эта марафонская сессия легко далась Джонсу, однако результат
    оказался впечатляющим. Запись проходила 2 июля 1968 г. в лондонской Tony Pike
    Studios. В качестве сессионных музыкантов были рекрутированы ветераны лондонской
    джазовой сцены – контрабасист Brian Brocklehurst и ударник Dougie Wright. В озаглавленный
    "Now Resident In Europe" диск вошли как композиции, записанные в формате трио,
    так и сольные номера Джонса – фортепьянные и гитарные. Также был записан устный
    рассказ Джонса о его детстве. Несмотря на то, что Джонс не имел музыкального образования,
    его игра на фортепьяно отличалась богатством и разнообразием и была рассчитана
    скорее на элитные европейские джазовые клубы, чем на чикагскую сцену. Не менее
    интересны были и гитарные вещи, среди которых отдельно стоит отметить "Morocco
    Blues", названный в честь страны, в которой Джонс в середине 60-х провел около
    двух лет. Джонс возлагал на эту запись большие надежды, однако вышедший в том
    же 1968 г. диск не стал музыкальной сенсацией. Дело было не в качестве материала,
    а в отсутствии необходимого промоушена. Кроме того, по своему содержанию альбом
    не соответствовал массовым вкусам ни европейской, ни американской публики, став
    не бестселлером, а коллекционным раритетом. Собственно говоря, это оказалась последняя
    студийная запись Куртиса Джонса – 11 сентября 1971 г. он скончался в Мюнхене,
    не оправившись от сердечного приступа, и был похоронен на кладбище для бедных.
    Что касается данного издания, то кроме материала оригинального альбома, в него
    вошли несколько аут-тэйков и дубли. Диск, в целом, представляет безусловный интерес
    не только как документ эпохи, но и как произведение искусства, ценность которого
    не зависит от конкретного места и времени.'
