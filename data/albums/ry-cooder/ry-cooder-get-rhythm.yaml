- id: 457
  author: Дмитрий Казанцев
  mark: 6
  date: '2004-02-14'
  text: 'После этого альбома стало ясно, что Кудер уже никогда не будет играть ту
    гениальную музыку, которую он играл в начале 70-х. На этом диске звук 80-х настолько
    неприятен, что он портит впечатление даже от приличных треков. Гавайское звучание
    опять тут, но это не 76 год, к сожалению.


    Оценка 3 балла. "Get Rhythm" Джонни Кэша и "13 Question Method" Чака Берри - великолепны,
    хороши и некоторые другие треки, но целиком альбом слушать довольно скучно и даже
    тяжело из-за звука местами. Кудер ушел с головой в саундтреки и этно-музыку других
    культур, а для любителей блюза и рутс-рока это почти катастрофа.'
