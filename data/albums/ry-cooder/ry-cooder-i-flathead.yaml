reviews:
- id: 1335
  author: Андрей Евдокимов
  mark: 8
  date: '2008-10-01'
  text: 'Все для культа: это заключительная часть "Калифорнийской трилогии", начатой
    три года назад , и к де-люксовому изданию прилагается 100-страничный буклет-либретто.
    Не "Властелин колец", но будет, чем заполнить досуг: стареющие гонщики, взбалмошные
    красотки, философские диалоги в придорожных барах… Но музыка хороша тем, что сама
    рассказывает историю ясно и просто. И нужно быть таким мастаком, как Кудер, чтобы
    играть так просто и точно. "Корневой" рок для гитары и барабанов, с примесью текс-мекс.
    Мариачи играют аранжировки, расписанные Йезусом Гузманом. Звук создает тягучую
    и взрывную атмосферу соляной пустыни, идеальной для вечной гонки на сигарообразных
    машинах. Самоирония замешана на застарелой тоске. Аналогии с лучшими театральными
    работами Тома Уэйтса появятся непременно, зато Кудер умеет достигать цели минимумом
    средств. Получается сказка для самых взрослых.'
