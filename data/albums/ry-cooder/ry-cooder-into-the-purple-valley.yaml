reviews:
- id: 448
  author: Дмитрий Казанцев
  mark: 10
  date: '2004-02-14'
  text: 'Второй альбом Кудера - это работа гения! Все песни звучат очень убедительно, диск слушается как одно целое произведение.
    Фолк, блюзы и баллады, кантри-рок, южный рут-рок; уже слышно влияние текс-мекса и островных культур. Шикарная игра на
    гитарах и мандолинах, яркий и стильный вокал. Ван Дайк Паркс и Ленни Варонкер остались с Кудером и на этом альбоме.


    Оценка 5 баллов! Шикарный диск, один из лучших у Рая. F.D.R. In Trinidad и Teardrops Will Fall - лучшие треки на альбоме.
    Абсолютно необходимая пластинка в любой коллекции.'
