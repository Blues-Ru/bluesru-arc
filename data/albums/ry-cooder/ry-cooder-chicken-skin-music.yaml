reviews:
- id: 451
  author: Дмитрий Казанцев
  mark: 8
  date: '2004-02-14'
  text: 'К соулу и госпелу Рай добавил очень много гавайской музыки и мексиканского
    звучания. Фолк и кантри почти полностью ушли на задний план. На этом альбоме появился
    Терри Эванс, и теперь Кудер/Кинг/Эванс неразлучны. В записи альбома принимают
    участие музыканты с Гавайев, что делает его очень оригинальным; слышно, что это
    не подделка. Stand By Me, знаменитый хит Бена И. Кинга, Рай изменил очень сильно,
    и это интересно! Расс Тайтлмэн сменил Ленни Варонкера в качестве продюсера, но
    звук остался на очень высоком уровне.


    Оценка 4 балла. Наверное Рай немного перебрал с гавайским и мексиканским влиянием.
    Почти потерян местами его фолк-блюз стержень. Не смотря на это, альбом очень сильный,
    а The Bourgeois Blues и Smack Dab in the Middle шедевральны. Если Вас не смущает
    звук Гаваий/Мексика, то этот альбом из главных.'
