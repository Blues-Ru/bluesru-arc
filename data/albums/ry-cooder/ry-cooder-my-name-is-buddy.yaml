  author: Дмитрий Казанцев
  mark: 7
  date: '2007-04-11'
  text: 20 лет Кудер не выпускал нормальных альбомов. Он занимался музыкой к фильмам,
    дурацкой этникой и всякими латино-театрами. И вот он решил вернуться к корням
    (блюз, кантри, фолк), наконец. Но дело в том, что он опять придумал концепцию,
    роли, полит-фолк и т.д. Все это вместо хороших песен и игры на гитаре. Хорошие
    песни-то тут есть, но уж больно много сатиры, театра и политики. Старая гвардия
    тоже тут, но гениальных мелодий как в 70-е тут нет и в помине.
