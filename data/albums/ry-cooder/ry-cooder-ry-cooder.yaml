reviews:
- id: 447
  author: Дмитрий Казанцев
  mark: 8
  date: '2004-02-13'
  text: 'К моменту выхода этого дебютного альбома Райлэнда он сам уже был известным
    виртуозом гитары и мандолины. Он поиграл с Таж Махалом в группе Rising Sons, записался
    с ним на его дебюте, был он в студии с Роллинг Стоунз и Капитаном Бифхартом. Ни
    до него, ни после мир не слышал подобного виртуоза на слайд-гитаре. Его игра -
    это особенный дар, который невозможно изучить или приобрести.


    Альбом очень хорош. С самого первого трека Alimony и до последних блюзовых ноток.
    Тут есть блюз, фолк и кантри-рок. Все сделано со вкусом и сыграно на высшем уровне.
    Стоит отметить отличный вокал Рая; он поет просто, но с огромным обаянием. С ним
    играют лучшие люди южного рока и блюз-рока, участники групп Little Feat и The
    Mothers. Продюсер Ленни Варонкер уже в 1970 году делал отличные альбомы!


    Оценка 4 балла. Рай Кудер уже лучший, но он только начинает. Альбом немного неровный
    и сыроват, но это можно услышать, только зная его другие работы. One Meat Ball
    и How Can A Poor Man Stand Such Times And Live? - шедевры и лучшие песни на альбоме.
    Диск обязателен для любой приличной коллекции.'
