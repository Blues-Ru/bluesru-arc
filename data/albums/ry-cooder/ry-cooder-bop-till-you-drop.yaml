- id: 453
  author: Дмитрий Казанцев
  mark: 6
  date: '2004-02-14'
  text: 'Ну здрасьте пожалуста! На задней стороне обложки огромная статья про то, что это цифровая запись, и это круто. На
    самом же деле это кошмар! Цифра в 70-х была на очень примитивном уровне, и это не могло не сказаться на качестве записи.
    Сантана тоже свалял дурака на Коламбии, записав свой диск 80-го года в цифру, результат тоже кошмарный. Кудер же решил
    поиграться и с поп-музыкой (ну а как же может быть в конце 80-х?), и как результат - слабая подборка песен, почти полная
    потеря звука и атмосферы его ранних альбомов. На диске по-прежнему играют и поют только лучшие люди, но это не может спасти
    слабый материал.


    Оценка 3 балла. Половина диска слушается с трудом. Просто не очень интересно, хотя и без явного музыкального криминала.
    Хорошо еще, что есть отличные Little Sister и The Very Thing That Makes You Rich (Makes Me Poor) - отличные треки! Этот
    диск интересен лишь на половину, и нужен лишь тем, кто хочет собрать все диски великого Кудера.'
