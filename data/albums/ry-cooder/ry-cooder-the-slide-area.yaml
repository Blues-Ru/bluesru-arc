- id: 455
  author: Дмитрий Казанцев
  mark: 8
  date: '2004-02-14'
  text: 'После трех слабых альбомов Кудер записывает этот шикарный диск! Почти все вернулось, но на дворе были 80-е годы,
    а это почти катастрофа для музыки и звука. Это не сильно отразилось на вкусах Рая, но все же это витает в воздухе. Тут
    отличный материал; Мэйфилд, Дилан, Перкинс... Рай Кудер сам написал аж три великолепных трека! К сожалению, из диска выбиваются
    первый и последний треки, но остальные шесть номеров отличны!


    Оценка 4 балла. Твердые 4 балла. Почти камбэк. Gypsy Woman и Which Came First - лучшие треки на диске. Появилась надежда,
    что Рай вернулся с хорошими альбомами. Но это не так, Кудер почти полностью ушел в саундтреки, а это ведь совсем другой
    раздел на полке с коллекцией.'
