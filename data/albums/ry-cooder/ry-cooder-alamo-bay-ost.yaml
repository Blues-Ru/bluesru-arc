  text: '<img src=http://www.coolforever.com/temp/alamobay_motionpicture_coollp.jpg>


    Очень хороший саундтрек Кудера. 9 треков, 4 из них с вокалом (Кудер поет сам, Джон Хайатт поет с актрисой Эми Мэдиган,
    Сизар Розас поет с Давидом Хидалго (Лос Лобос), Ли Винг поет и играет на гармошке). Все песни в духе блюза, кантри и текс-мекса.
    Немного смазана концовка диска - идут две фоновые инструменталки подряд.'
