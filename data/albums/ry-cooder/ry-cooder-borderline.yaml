reviews:
- id: 454
  author: Дмитрий Казанцев
  mark: 6
  date: '2004-02-14'
  text: 'Опять не туда и не так. Почти повторение предыдущего альбома, но тут нормальная запись, и вместо поп-рока Кудер решил
    записать старые рок-н-роллы и боевики. Может это и не так плохо, но это же не его стиль и настроение. Много известных
    треков не спасают этот довольно слабый альбом. Кудер потерял свой стиль, несмотря на то, что с ним по-прежнему лучшие
    музыканты Америки. На этом альбоме появился друг и коллега Джон Хайатт.


    Оценка 3 балла. Все не так плохо, но могло быть гораздо интереснее. 634-5789 (Soulsville, U.S.A.) и Crazy ''Bout an Automobile
    - очень хороши, но это совсем не тот Рай, как в начале 70-х годов. Потеряна теплота и атмосфера тех записей и той музыки.
    Совсем необязательный диск Рая.'
