reviews:
- id: 450
  author: Дмитрий Казанцев
  mark: 10
  date: '2004-02-14'
  text: 'Четвертый великолепный альбом Кудера! С этого момента у Кудера стало больше соул и госпел звучания, появились серьезные
    влияния островной и мексиканской фолк-музыки. Тут шесть подпевающих вокалистов и среди них сам Бобби Кинг. Ленни Варонкер
    по-прежнему продюсирует и делает это прекрасно! Джим Келтнер и Милт Холланд делают невероятные вещи с ритмом и перкуссией.


    Оценка 5 баллов! Госпел-соул-фолк-блюз-рок высшей пробы. Jesus On The Mainline и Fool For Cigarette - лучшие вещи на альбоме.
    Рай Кудер не стоит на месте, каждый его альбом - это коллекция прекрасных песен, но немного в другом стиле. Эта коллекция
    - одна из основных!'
