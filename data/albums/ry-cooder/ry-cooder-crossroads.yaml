reviews:
- id: 456
  author: Дмитрий Казанцев
  mark: 6
  date: '2004-02-14'
  text: 'Это уже пятый саундтрек Кудера, но он специальный, ведь это звуковая дорожка
    к культовому фильму "Перекресток". Единственная странность - это впечатление,
    что эти песни будто и не звучат в фильме. Слава Богу, это просто подборка из 11
    отдельных блюзов, а не странные звуки и разговоры. Несмотря на то, что на диске
    сам Сонни Терри и другие великолепные музыканты, альбом слушается почти с трудом.
    Тут дурацкий звук 80-х и довольно примитивная блюзовая программа.


    Оценка 3 балла. Игра Кудера великолепна, но нет ощущения интересного альбома.
    Даже трудно выделить какой-либо трек. Все как-то ровно и порой бесцветно. Слабовато
    для диска с таким названием; будем считать, что это просто обычный саундтрек.'
