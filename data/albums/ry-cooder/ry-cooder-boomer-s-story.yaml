  author: Дмитрий Казанцев
  mark: 10
  date: '2004-02-14'
  text: 'Третий альбом Кудера - еще один шедевр блюз-фолк-музыки. В этот раз Рай подобрал
    интересный материал из довоенных блюзов и даже песен Гражданской Войны. Его кумир
    Слипи Джон Эстес исполняет на альбоме блюз про Президента Кеннеди. Есть тут и
    знаменитая Wing And A Prayer, у нас в стране известная как "Бомбардировщики" -
    песня летчиков США. Рай собрал великолепный материал к диску и целую дюжину супер-музыкантов:
    тут Рэнди Ньюман, Джордж Боханон, Джим Келтнер, Милт Холланд, Ленни Варонкер и
    другие мастера инструменталисты. Звук просто великолепен!


    Оценка 5 баллов! Еще один ЛУЧШИЙ диск Рая! Boomer''s Story и Crow Black Chicken
    - великолепны. Надо отметить наличие отличных инструменталов на диске и виртуозную
    игру Джима Келтнера. Необходимый альбом из кудеровского наследия.'
