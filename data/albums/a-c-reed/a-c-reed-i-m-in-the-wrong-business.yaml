  date: '2006-05-31'
  text: Второй альбом ветерана блюзового саксофона вышел на Аллигаторе когда Риду
    был уже 61 год. Типичный соул-блюз 80-х с дурацким звуком на ударных. Все остальное
    звучит очень хорошо, а песни прекрасные. В заглавной, построенной на басовом ходу
    из "Inner City Blues" Марвина Гей, Рид поет, что он занимается херней всю жизнь
    (что надо было плясать как Майкл Джексон с 5 лет и петь кантри как Джонни Пэйчек
    (почему именно Джонни?))
