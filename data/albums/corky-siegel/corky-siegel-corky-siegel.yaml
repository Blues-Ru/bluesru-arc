- id: 922
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-11-27'
  text: '<img src=http://www.ljplus.ru/img/d/r/dr_nick/siegel74.jpg> Корки Сигел - певец, гармонист и пианист из блюзовой
    группы Siegel-Schwall Band, которая начала разваливаться именно в 1974 году. Это его первый сольник, он очень редкий и
    интересный. На альбоме нет ритм-секции вообще, Корки играет на пианино в большинстве треков, а три песни здесь записаны
    просто под гармошку. И все же есть гости в некоторых номерах: Вассар Клементс играет на скрипке в двух песнях, Тони Браун
    подпевает в одном треке, Люис Росс тоже поет еще в одном, Шелли Плоткин на конгах и Эл Порт на флейтах в песне "She Makes
    Me Feel Good". Совсем минимальный состав и сопровождение, как видите. Тем не менее, это не звучит бедно - Сигел симпатично
    поет, классно играет на гармошке и пианино, а атмосфера на альбоме получилась совсем хорошая. Полноценный блюзовый альбом,
    записанный в Чикаго, где все песни написал сам Корки. Это будет особенно интересно послушать тем, кто сам играет на гармонике
    и пианино.'
