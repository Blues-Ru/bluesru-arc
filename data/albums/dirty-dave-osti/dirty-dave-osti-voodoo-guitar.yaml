  date: '2012-08-15'
  text: 'Дебютный сольный альбом молодого гитариста из Лос-Анжелеса, записанный на фирме GrooveYard Records (для этой фирмы
    гитара является главным музыкальным инструментом, и чем она тяжелее, тем лучше :-)). До этого Дэйв был замечен в формации
    под именем Gentlemen''s Blues Club.


    В полном соответствии с этим мы имеем альбом тяжелого блюз-рока, записанный в составе power trio, с жесткими рифами, быстрыми
    соло и хриплым вокалом. Рока побольше, блюза поменьше, но в целом все неплохо.'
