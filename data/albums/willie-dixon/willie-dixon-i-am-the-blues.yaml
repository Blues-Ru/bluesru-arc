reviews:
- id: 358
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-12-12'
  text: 'Это один из немногих номерных альбомов Диксона; мир знает его как великого
    сочинителя блюзов, продюсера, босса Чикаго-блюза, а вот сольные пластинки он писал
    редко. На диске 9 супер-известных блюзов Уилли в отличном исполнении и классных
    аранжировках. Диск вышел на Columbia Records, и к сожалению, на нем нет никакой
    информации о группе музыкантов.


    Оценка - 4 балла. Мне показался скучноватым вокал и манера пения Диксона в некоторых
    номерах. То есть слышно, что он классный творец, но он мало записывался и выступал
    как ПЕВЕЦ по сравнению со своими коллегами из Чикаго. Хотелось бы отметить лучшие
    треки, тут это Back Door Man, Spoonful, I Ain''t Superstitious и The Same Thing.
    Еще я должен признаться, что на этом диске записана ЛУЧШАЯ для меня версия Hoochie
    Coochie Man; она настолько заиграна, что уже вызывает отвращение у многих, здесь
    же отличное, непафосное исполнение "в ритме".


    Обязательно купите эту пластинку при случае, она уникальна по звуку и исполнению.'
