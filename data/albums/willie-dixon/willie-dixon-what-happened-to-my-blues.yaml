  date: '2005-08-09'
  text: 'Интереснейший альбом Уилли 1976 года. Здесь нет известных песен, но все 10
    треков просто очень хороши. Аранжировки и исполнение на высшем уровне. Диксону
    помогают: Lafayette Leake - piano, Carrie Bell - harmonica, Buster Benton - guitar,
    Dennis Miller - guitar, Freddie Dixon - bass, Clifton James - drums.


    Море энергии и положительных эмоций, Уилли и банда в отличной форме.'
