  author: Константин Колесниченко
  mark: 10
  date: '2005-10-13'
  text: 'Великий блюзовый композитор и автор Willie Dixon записывался очень много,
    в разное время,чаще как сайдмен,поэтому его альбомы - это часто что-то особенное.
    Это его поздний альбом и один из последних прижизненных. В чем-то по звуку и аранжировкам
    этот диск напоминает его альбомы 70-х: "I Think I Got The Blues" и "What Happened
    To My Blues". Вилли только поет на этом альбоме, но первоклассные сайдмены полностью
    воссоздают атмосферу прошлых лет, особенно хочется отметить игру его давнего партнера
    – пианиста Lafayette Leake и харпера Sugar Blue. Очень интересный диск, высшая
    оценка!'
