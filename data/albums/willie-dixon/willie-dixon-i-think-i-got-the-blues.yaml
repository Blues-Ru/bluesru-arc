- id: 798
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-08-09'
  text: 'Великолепный альбом Диксона! Разнообразные блюзы: в мажоре и миноре, с интересными ритмами и гармониями, с использованием
    различных звуков и аранжировок. Среди сайдменов много звезд: Lafayette Leake - piano, Carrie Bell - harmonica, Buster
    Benton - guitar, Mighty Joe Young - guitar, Phil Upchurch - guitar, Louis Satterfield - bass, Morris Jennings - drums.


    Есть тут и знаменитые хиты в новых, интереснейших аранжировках: "Bring It On Home", "My Baby", "Wang Dang Doodle", "I
    Just Wanna Make Love To You".'
