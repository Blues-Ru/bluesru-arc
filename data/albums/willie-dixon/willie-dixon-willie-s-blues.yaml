reviews:
- id: 433
  author: Дмитрий Казанцев
  mark: 8
  date: '2004-02-02'
  text: 'Willie Dixon - vocal & bass; Memphis Slim - piano; Wally Richardson - guitar; Al Ashby - tenor sax, Gus Johnson -
    drums.


    Дебютный лонгплэй Диксона записан не на Chess, но на Prestige/Bluesville. Альбом сделан самим Руди Ван Хелдером и звук
    на диске просто восхитительный для 1959 года. Все настолько качественно и "чисто", что есть ощущение джазовой пластинки.
    Ритм-секция и саксофонист только добавляют "джаза" в это ощущение. Все песни на альбоме поет сам Диксон, к его голосу
    надо привыкнуть - он не похож на голоса блюзовых вокалистов.


    "Nervous", "Sittin'' And Cryin'' The Blues" - шедевры. Немного портят картину номера, где Слим начинает играть танцевальные
    номера в стиле джаз и буги-вуги.'
