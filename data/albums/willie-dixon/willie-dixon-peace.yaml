- id: 1549
  author: Константин Колесниченко
  mark: 10
  date: '2009-06-18'
  text: '<img src="http://s60.radikal.ru/i168/0906/52/2b5ce9553771.jpg"> Самые классные свои записи Вилли Диксон сделал, начиная
    с "I Am The Blues" - это был нетривиально аранжированный блюз, сыгранный с особым смаком. В 70-х у него было несколько
    таких альбомов. Вилли Диксон не зря считается одним из самых лучших поэтов блюза, его песни словно росли и развивались
    вместе с блюзом. Потому Вилли, озабоченный проблемами мира во всем мире и роли США в этих процессах, записал вот такой
    альбом на котором есть песни вроде "It''s In The News" или "You Don''t Make Sense Or Peace". У меня всегда складывалось
    впечатление, что Вилли был одним из тех музыкантов, которые поднимали до своего уровня других музыкантов, играющих в его
    группе - ведь часто можно было слышать, как иные блюзовые старички на его записях играют более современный прифанкованный
    вариант блюза или чуть-ли не блюз-рок. Его Алл Стар блюз бенд и в этот раз состоит из проверенных ветеранов и из более
    молодого поколения: Big Walter Horton, Lafayette Leak, Clifton James, Joe Young, Frank Swan, Phil Upchurch и др.'
