- id: 863
  author: Федор Романенко
  mark: 10
  date: '2005-09-22'
  text: 'Алекс Шульц наиболее известен тем, что долгое время был основным гитаристом в группах у Вильяма Кларка и позже у
    Рода Пьяццы. Кроме работы у монстров вест-коаст блюза, Шульц как сессионный музыкант принял участие в записи чуть ли не
    50 альбомов. Записи Вильяма Кларка с гитарой Алекса Шульца были для меня одними из первых пластинок, повлиявших на мою
    сильную любовь к блюзу. Я и сегодня выделяю его как одного из наиболее интересных для меня современных гитаристов.


    Что же меня так привлекает? С одной стороны Шульц отлично владеет всеми нюансами свингового блюза. У него даже есть очень
    хорошая совсем джазовая пластинка органного трио с немецкими ребятами из Мюнхена. Однако в чистом виде в этом не было
    бы ничего исключительного. Дело в том, что Алекс – глубоко блюзовый музыкант. В звуке его гитары есть блюзовая мощь и
    некоторая грубость. Потрясающий звук, фразировка и блюзовый вкус делают его соло достойными для включения в учебники.
    Он никогда не загоняет, растянутое напряжение не отпускает слушателя, а каждая нота в соло может сшибить со стула. Плюс
    неустойчивое сочетание грубо блюзового и сладко свингового начала.


    Think About It – первая сольная пластинка Алекса, которая должна принести ему более широкую известность. Шульц, разумеется,
    никогда не хотел быть гитарным героем, поэтому его собственный диск – не набор гитарных инструменталов, а реализация его
    музыкального вкуса и представлений о том, как должен звучать свингово-блюзовый ансамбль. Пластинка делалась долго и тщательно,
    на ней две студийные сессии из разных лет. Трое отличных вокалиста поют в разных стилях – черный соул-голос Финиса Тэсби,
    лирический Тада Робинсона, и фирменный стильно-холодный Линвуда Слима. Почти все песни записаны с драйвовым хаммондом,
    с несколькими отлично аранжированными дудками. На басу по-очереди – ветераны вест-коаст блюза Ларри Тейлор и Билл Стьюв.


    Главные достоинства пластинки для меня – аранжировки, фантастическая гитара Шульца и подбор песен. Сейчас я уже попривык,
    но когда я слушал диск в первый раз, я всю дорогу удивлялся необычным и неочевидным песням и гармониям в них. Что-то совсем
    не заезженное. Еще местами мне этот диск напоминает лучшие поздние пластинки Би Би Кинга, ибо он выдержан в похожем стиле
    по части гитары и звучания ансамбля, только Шульц меня впечатляет, наверное, больше.


    В итоге скажу, что на мой взгляд, Think About It - великолепная пластинка! Я прослушал ее уже много раз и, наверное, не
    буду убирать ее далеко.'
- id: 1180
  author: Константин Колесниченко
  mark: 10
  date: '2007-12-16'
  text: 'Обложка альбома - немолодой музыкант со стильной бородкой, в полосатом костюме и полуакустикой. Какой это блюз? Правильно,
    Вест-Коаст. Тех, кто совсем не любит эту музыку, прошу дочитать до конца, попробую переубедить.


    Алекс Шульц - ветеран Вест-Коаст блюза, свои навыки он закалял и у Вильяма Кларка и у Рода Пиаццы. Школа в этом плане
    показательная и, наверное, обязательная, если ты хочешь стать звездой в этом стиле. Кид Рамос и Рик Холмстром, например,
    тоже прошли похожие университеты. Но музыкальная карьера Шульца не ограничилась только этими грандами, работал он много
    с кем, большей частью, конечно, в одинаковой стилистике. Он мастер и знаток, по-другому уже не могло быть. И по-моему,
    замечательно, что свой первый сольный альбом Алекс записал в 50 лет, потому что ему действительно есть что сказать и этот
    альбом не затеряется среди других пластинок этого жанра. Он сделан с высочайшим вкусом.


    О материале и музыкантах: композиции Шульц расположил следующим образом - 3 композиции с вокалом, затем инструментал.
    Всего их 13. Алекс пригласил трех абсолютно разных и замечательных вокалистов: шершавого и скрипучего черного Finis Tasby;
    ориентированного на соул в духе Отиса Реддинга Тэда Робинсона; и сАмого Вест-Коаст певца, что может быть - Lynwood Slim.
    Материал для каждого из певцов он тоже подобрал подходящий - расслабленные и грязноватые для Finis Tasby (Walkin'' and
    Talkin'' - очень хороша), сочные и насыщенные для Тэда и свингующие для Слима. Среди музыкантов хочу отметить двух известнейших
    басистов: Ларри Тейлор (вот у кого действительно ОГРОМНЫЙ послужной список!) и Билл Стьюв, да и духовая секция из "Royal
    Crown" (фильм "Маска", кто не помнит, с их музыкальным участием) - тоже весьма хороша. Остальные музыканты, половина из
    которых с итальянскими фамилями, мне неизвестны, но они замечательно делают свою работу.


    Теперь о гитаре самого Алекса. Основными достоинствами игры Шульца я бы назвал - отличную, точную, филигранную фразировку.
    То как его гитарные партии вписываются в ритмический рисунок композиции - вообще должно быть учебником для многих музыкантов,
    не только блюзовых.


    Хороший альбом, может быть слишком гладкий (не смотря на Finis Tasby), чтобы быть по-настоящему блюзовым, но от этого
    не менее красивый и интересный. Высшая оценка!'
- id: 1480
  author: Андрей Евдокимов
  mark: 6
  date: '2009-02-05'
  text: 'В культовом фильме о продаже души на перекрестке старик-блюзмен попрекает нью-йоркского горячего мальчика с гитарой:
    "Спой, как ты трудился на плантации, как мотал срок в тюряге". Шульц вырос в Гринвич Вилладж, в семье знаменитого дизайнера.
    Играл в группах Уилльяма Кларка и Рода Пьяццы. Многие считают, что с сольным дебютом он затянул. Но вот свершилось: небольшая
    секция медных, будоражащий звук органа "Хэммонд Би-Три", на контрабасе играет вездесущий Ларри Тейлор – и получился еще
    один бодрый альбом в модном нынче стиле West Coast Swing. От прочих он отличается весьма своеобразными аранжировками и
    великолепной изобретательной гитарной игрой. Три приглашенные вокалиста выводят белоголосые рулады, которые плохо вписываются
    в блюзовые традиции. А в целом альбом весьма рекомендуется именно любителям виртуозной игры, подуставшим от блюзовых шаблонов.
    Блюз уходит от своих корней: и музыкальных и социальных. Видимо, ценителям традиций придется привыкать, что в блюзе все
    реже будут встречаться фамилии вроде Джонсон, и все чаще – вроде Шультц. Играет он здорово – нет слов! Но душу за блюз
    не продаст – слишком образован и рационален.'
