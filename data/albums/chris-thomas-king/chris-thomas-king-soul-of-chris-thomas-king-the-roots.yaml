reviews:
- id: 315
  author: Алексей Калачев
  mark: 6
  date: '2003-12-02'
  text: 'Диск Кинга полностью состоит из акустического блюза – классики Дельты и сочиненных
    в том же стиле композиций, собранных с его дисков за последние 5 лет. На диске
    Крис Томас спел песни Роберта Джонсона, Скипа Джеймса, Сан Хауса, Лидбелли и Томми
    Джонсона. В интервью он не раз говорил, что сам поражен свалившейся славой, что
    он в неоплатном долгу у собственной культуры. После громкого успеха и трех Грэмми,
    что стало следствием его участия в "O Brother, Where Art Thou?" Кинг, похоже,
    не на шутку проникся ролью миссионера и, теперь являясь одним из самых известных
    артистов с черным цветом кожи, без устали делает паблисити своей культуре – негритянской
    культуре, "отдает долги", выпуская такой диск. Но это все морально-идеологические
    заморочки Криса, у диска "Корни" есть сугубо музыкальная составляющая, только
    она и интересна нам. Коротко: диск Кинга получился удачным.'
