reviews:
- id: 739
  author: Александр Панин
  mark: 6
  date: '2005-06-27'
  text: 'Последняя "сессия" Мактелла (он умрет спустя три года), состоявшаяся в музыкальной
    лавке в Атланте. Качество записи неплохое, но с исполнением имеются определенные
    проблемы: вокал Уилли уже слабоват, да и его 12-струнка звучит не так хорошо,
    как на довоенных синглах. Но сам по себе диск вполне адекватен, а временами и
    гитарная игра очень даже захватывает. Лучшие вещи - Don''t Forget It и Salty Dog.
    Бонусом идут две композиции, записанные в 1949 году, всего получается 15 треков
    на 36 минут. Серия Original Blues Classics.'
