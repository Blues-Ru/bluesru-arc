  text: '<img src=http://image.allmusic.com/00/amg/cov200/drd700/d711/d71182b478g.jpg>


    Rounder 1989


    Первый альбом этой группы из Чикаго (всего два у них). Рон Сорин - супер-гармонист! Кен Сэйдак отлично поет, играет на
    клавишах и аккордеоне. Группа исполняет классный блюз-рок и рутс-рок; есть обалденные инструменталы!


    Надо искать второй альбом.'
