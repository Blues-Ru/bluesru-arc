- id: 1627
  author: Дмитрий Казанцев
  mark: 10
  date: '2010-05-09'
  text: 'Прекрасный альбом великого гитариста, певца и автора! Его коллега по дуэту Сонни Терри помогает на гармошке (ну и
    покрикивает местами, конечно), а второй гитарист Бенни Фостер - отлично солирует.


    В программе - 9 композиций: 7 своих + "Trouble in mind" & "Every day I have the blues". Вокал Брауни - это та же манера
    и класс, что у его легендарного ровесника Мадди Уотерса. Гитара МакГи - довольно крутой грув и фингерпикинг; он явно был
    одним из лучших в блюзе за всю историю жанра.


    Одна из лучших пластинок акустического блюза 60-х!'
