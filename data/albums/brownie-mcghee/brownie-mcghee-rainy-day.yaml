  author: Дмитрий Казанцев
  mark: 8
  date: '2005-05-05'
  text: 'Брауни умер в 1996 в возрасте 80 лет, но как соло-артист он записал немного альбомов - большинство его работ были
    сделаны вместе с гармонистом/вокалистом Сонни Терри, конечно. Еще и поэтому его сольные работы - это особый интерес для
    любителей блюза и коллекционеров.


    Этот альбом 1976 года - довольно известный диск Брауни, записанный с друзьями в Нью-Йорке в 1976 году. Вместе с МакГи
    тут играют: Louisiana Red - guitar, Bobby Foster - guitar, Sugar Blue - harmonica, Sammy Price - piano, Alex Blake - bass,
    Brian Blake - drums, Jim Robinson - vocal (как видите, люди довольно известные).


    Музыка тут не похожа на тот Piedmont Blues, что они делали с Сонни, здесь то, что можно назвать традиционным электрическим
    блюзом со слайд и соло-гитарами, и гармошкой. 11 песен написаны Брауни, а одна - "Key To The Highway" - знаменитый блюз
    Биг Билла Брунзи.


    Пожалуй, этот альбом слабее лучших работ дуэта Сонни/Брауни, но это очень хорошая блюзовая пластинка, которая украсит
    любую серьезную коллекцию.'
