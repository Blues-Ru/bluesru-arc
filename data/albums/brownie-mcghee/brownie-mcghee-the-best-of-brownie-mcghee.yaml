  author: Дмитрий Казанцев
  mark: 9
  date: '2005-07-26'
  text: 'Начну с того, что сообщу, что это не сборник. В оригинале это был номерной альбом 1971 года. Все песни записаны в
    ноябре 1971 года в Копенгагене (Дания) для фирмы Storyville. Европейская обложка отличается от американской, а на виниле
    было всего 10 песен (на компакте добавили еще 5).


    Замечательный диск во всех отношениях. Сонни Терри помогает на гармошке в двух треках, а в паре треков на барабанах играет
    Svend-Erik Norregard. Почти все блюзы на альбоме написал сам Брауни, но тут также есть "Key To The Highway" (Big Bill
    Broonzy) и "In The Evening" (Leroy Carr). МакГи в прекрасной музыкальной форме - его вокал и игра на гитаре превосходны;
    хорошая запись передают всю мощь и музыкальность этого великого блюзмена. Очень душевно поет Брауни о друге в песне "Death
    of Blind Boy Fuller".


    Абсолютно необходимый диск в любой коллекции акустического блюза.'
