- id: 1398
  author: Андрей Евдокимов
  mark: 6
  date: '2008-12-29'
  text: Солидный джазовый лейбл взялся переиздавать архивы крохотной фирмы, руководимой блюзовыми энтузиастами из Швеции.
    Изданные в этом году 14 альбомом представляют отличное отражение периода успешных блюзовых гастролей в Европе от второй
    половины 60-х и до конца 70-х. Записи сделаны американскими блюзменами, как прославленными, вроде Мемфиса Слима и Лайтнинг
    Хопкинса, так и "известными в узких кругах" Джюком Боем Боннером и Джей-Ди Шортом. Классические чикагские записи Эдди
    Бойда отличает жесткая ирония. В стокгольмской студии в 1974 году он пребывал в благодушном настроении. Аккомпанируют
    ему молодые местные музыканты, не вполне профессиональные, но преисполненные уважения и симпатией к солисту. Сам Бойд
    играет расслабленно, с явным удовольствием, создавая и у слушателя ощущения легкой естественности течения веселого (а
    не мрачного) блюза.
