- id: 761
  author: Дмитрий Казанцев
  mark: 7
  date: '2005-07-15'
  text: 'Этот диск записан в Швеции со шведскими музыкантами. Сам Эдди Бойд поет и играет на пианино, а с ним такие люди:
    Christer Ecklund - sax, Rolf Alm - bass, Ed Thigpen - drums, Stockholm Slim - back-up vocals, Peps Persson - guitar, harmonica,
    back-up vocals.


    Надо сразу сказать, что Эдди отлично поет и играет на пианино, а программа хорошо отрепетирована с горячими скандинавскими
    парнями - так, что никакого левого джема или лажи тут нет (полноценный альбом с хорошей записью). Очень забавно звучит
    перегруженная гармошка Пепса в некоторых песнях, сакс играет почти постоянно, но не раздражает. По музыке - это типичный
    пиано-блюз а-ля Чикаго, есть буги и ритм-н-блюз, конечно.


    Все как бы хорошо, но я бы не назвал этот материал очень интересным и оригинальным. Слишком уж все однообразно и одинаково.'
