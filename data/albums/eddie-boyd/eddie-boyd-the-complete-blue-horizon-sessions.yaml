  author: Сергей Исправников
  mark: null
  date: '2007-06-04'
  text: 'Сотрудничество британского продюсера Майка Вернона и знаменитого чикагского блюзового пианиста и вокалиста Эдди Бойда
    началось в 1965 г., когда Вернон организовал в Лондоне запись первой долгоиграющей пластинки Бойда "Five Long Years".
    Еще подростком Вернон был его поклонником, соответственно, когда он создал свою фирму Blue Horizon, на повестке дня встал
    вопрос о включении Бойда в каталог издаваемых ею исполнителей. Первым в 1967 г. был выпушен сингл с двумя композициями
    Бойда, открывающими данное издание, – "It''s So Miserable To Be Alone" и "Empty Arms". Обе вещи были записаны 21 марта
    1967 г. во время сессий второго британского альбома Бойда, но на пластинку не попали. На записи Бойду аккомпанировал тогдашний
    состав "Bluesbreakers" Джона Мэйэлла: Питер Грин, Джон МакВи и Энсли Данбар.


    Однако Майку Вернону хотелось издать на собственной фирме полноценный альбом Бойда, который в то время перманентно приезжал
    на гастроли в Европу, где его принимали значительно лучше, чем у себя на родине. В конечном итоге, они договорились о
    записи альбома, когда Бойд в очередной раз будет в Великобритании. В качестве аккомпанирующей группы был выбран "Fleetwood
    Mac" Питера Грина. Сессия звукозаписи состоялась 25 января 1968 г. Время было выбрано не очень удачное – группа была максимально
    загружена концертами. Дебютный альбом "Fleetwood Mac" был закончен месяцем раньше, их первый сингл уже стал хитом на улицах
    Лондона. Поэтому пришлось обойтись без репетиций, большинство композиций писали с первого дубля. Спасало то, что у Питера
    Грина и Джона МакВи уже был опыт студийной работы с Бойдом, да и часть песен, прозвучавших на альбоме, были им знакомы
    по совместным выступлениям. Несмотря на трудности, альбом получился превосходным, одним из лучших в дискографии Бойда.
    Из двенадцати композиций, вошедших в диск, на двух Эдди и Питер играют дуэтом, на остальных группа представлена в полном
    составе. В первую очередь, это был альбом Эдди Бойда, поэтому участники "Fleetwood Mac" здесь именно аккомпанировали ему,
    но аккомпанировали бесподобно. На первом плане звучит фортепьяно Бойда, поддержанное суперпрофессиональной игрой Грина
    на гитаре. Озаглавленный "7936 South Rhodes", альбом вышел на Blue Horizon в том же 1968 г. Вскоре после его записи в
    интервью "Record Mirror" Бойд отметил, что "Питер Грин величайший блюзмен. Он лучший блюзовый гитарист в Европе и у него
    лучшая группа, которую я слышал по эту строну Атлантики".


    В заключение необходимо добавить, что в альбом не вошли две записанные тогда же композиции – "The Big Boat" и "Sent For
    You Yesterday". Первоначально они были изданы на сингле в 1968 г., а теперь представлены на данном диске. Кроме того,
    здесь имеются два ранее не издававшихся трека, записанных в Чикаго в 1960 г. Они были переданы Эдди Бойдом Майку Вернону
    в январе 1968 г. для возможного выпуска на Blue Horizon. Сейчас уже невозможно установить ни детали этой записи, ни полного
    состава музыкантов, хотя великолепная гитарная работа напоминает B.B. King. В любом случае, они органично заканчивают
    данное коллекционное издание, включившее все записи Эдди Бойда для Blue Horizon.'
