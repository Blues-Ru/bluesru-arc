- id: 1148
  author: Дмитрий Казанцев
  mark: 9
  date: '2007-11-02'
  text: 'Второй альбом пианиста и вокалиста Эдди, и его первый британский диск. Peter Green - guitar, John Mayall - harmonica,
    John McVie - bass, Aynsley Dunbar - drums - обалденный состав! 16 прекрасных блюзов. Дело в том, что у Бойда ну ооочень
    классный голос и манера игры на пианино. Грин - супер на гитаре, ритм-секция на высоте, Джон - класс на гармошке, запись
    отменная!


    Всем слушать и радоваться :)'
- id: 1190
  author: Сергей Исправников
  mark: null
  date: '2008-01-13'
  text: 'На диске представлено переиздание второго британского альбома Эдди Бойда, "Eddie Boyd and his Blues Band featuring
    Peter Green", первоначально выпущенного в сентябре 1967 г. фирмой Decca. Запись была организована Майком Верноном в марте
    1967 г. в лондонской Decca Studios #2. За пять дней до начала работы над этим проектом Бойд успел записать пластинку в
    Голландии с местными музыкантами, здесь же ему аккомпанировала лучшая блюз-роковая группа Великобритании – "Bluesbreakers"
    Джона Мэйэлла. Наряду с такими исполнителями, как Otis Rush и J.B.Lenoir, Бойд был одним из любимых блюзменов Мэйэлла,
    чем и было обусловлено его участие в этой записи. В это время, после издания двух топовых пластинок "Bluesbreakers with
    Eric Clapton" (1966 г.) и "Hard Road" (1967 г.), "Bluesbreakers" были на пике своей популярности, причем состав группы
    включал только звезд: помимо самого Мэйэлла там играли Питер Грин (гитара), Джон МакВи (бас), Энсли Данбар (ударные).


    Запись проходила три дня – 14, 17 и 21 марта. В результате на альбоме оказались 16 треков, причем два из них – "Dust My
    Broom" Элмора Джеймса и "Save Her, Doctor" самого Бойда – были украшены слайд-гитарой лидера "Groundhogs", Тони МакФи.
    Как и на предыдущих записях, большая часть материала была авторским. На этот раз Бойд отказался от использования органа,
    ограничившись фортепьяно, которым он владел несравнимо лучше. В основном был записан новый материал, американские хиты
    1947-61 гг. составляли только четверть альбома. Хотя впоследствии многие покупатели приобретали пластинку из-за участия
    в ней Питера Грина, диск безусловно отражал авторский стиль исполнения самого Бойда, ярко проявившийся как при игре с
    аккомпанирующей группой, так и на двух сольных композициях – "Unfair Lovers" 1947 г. и новой "Letter Missin'' Blues".


    Продажи альбома были стабильно высокими, и он оставался в каталоге фирмы Decca вплоть до середины 70-х гг. Отзывы критики
    также, в целом, были благожелательными, в отличие от резко негативного отношения к предыдущим записям американских блюзменов
    с английскими группами, в первую очередь, концертным альбомам Сонни Боя Уильямсона с "Yardbirds" и "Animals". Так обозреватель
    "Blues Unlimited" отметил, что "это единственная английская сессия, не испорченная игрой группы или самими условиями записи.
    Сопровождающая группа была адекватна… Питер Грин, действительно, умеет играть на гитаре". Однако сама запись, по его мнению,
    оказалась провальной, "поскольку Эдди Бойд не был и никогда не станет настоящей звездой". Известный обозреватель и исследователь
    блюза Пол Оливер в своей статье в "Jazz Monthly" придерживался схожей точки зрения. Основные претензии у него были к самому
    Бойду: на его взгляд, Бойд обладал куда меньшими артистическими способностями, чем другие исполнители, с которыми тот
    играл в 40-х – 50-х гг. Что касается группы, то аккомпанемент был "адекватным и абсолютно уместным… в целом, звучание
    было близко к поздним записям на лейблах Victor и Bluebird". Собственно говоря, сам Бойд, хотя и называл себя очень гордым
    человеком, никогда не переоценивал свой исполнительский уровень. В одном из поздних интервью он заметил: "Я не считаю
    себя выдающимся пианистом. Но я знаю как играть и я знаю что я играю".'
