  author: Сергей Исправников
  mark: null
  date: '2008-01-07'
  text: 'На диске представлена первая долгоиграющая пластинка Эдди Бойда "Five Long
    Years", первоначально изданная в Великобритании в 1965 г. на лейбле Fontana. К
    моменту записи 50-летний Бойд был признанным мастером чикагского фортепьянного
    блюза и периодически записывался на разных американских фирмах грамзаписи, начиная
    с 1947г., но выпускался исключительно на синглах. Впервые оказавшись в Европе
    в 1965 г. в рамках гастролей "American Folk Blues Festival", неожиданно для себя
    Бойд обнаружил, что стал настоящей звездой для европейских любителей блюза. Между
    тем в Америке интерес к фортепьянному блюзу был к тому времени невелик, и Бойд
    в последние годы зимой играл в чикагских клубах, а летом выращивал цыплят на своей
    ферме. Поэтому возвращаться на родину он не торопился. Что касается записи диска,
    то инициатива исходила от одного из организаторов тура – импресарио Хорста Липмана.
    Первоначально несколько треков были записаны в Гамбурге, но по условиям контракта
    Бойд должен был сделать целый альбом. В Лондоне Липман познакомил Бойда с продюсером
    и энтузиастом блюза – Майком Верноном, заодно предложив последнему организовать
    запись, на что тот охотно согласился.


    Запись пластинки состоялась 21 октября 1965 г. в Wessex Sound Studios, расположенной
    в лондонском Сохо. Альбом состоял из 12 авторских композиций Бойда, включающих
    как новый материал, так и хиты прошлых лет, отражающих работу Бойда с такими лейблами,
    как RCA Victor в конце 40-х гг. и Oriole, Bea & Baby, Key Hole в конце 50-х гг.
    Диск озаглавлен по дебютному треку, "Five Long Years". Первоначально выпущенная
    в 1952 г. на лейбле J.O.B., эта композиция в свое время возглавила национальный
    хит-парад в разделе R''n''B, став вершиной коммерческого успеха Бойда. На записи
    ему аккомпанировали коллеги по туру – звезды чикагского блюза: гитарист Buddy
    Guy, чья игра достойна отдельного упоминания, басист Jimmy Lee Robinson и ударник
    Fred Below. Сам Бойд в большинстве композиций играл на фортепьяно, а на трех использовал
    электроорган. На этом инструменте Бойд записывался второй раз в жизни, и скорее
    всего это было данью моде того времени. По словам Майка Вернона, хорошо, что в
    студии не оказалось большого органа Hammond B3, в котором Бойд просто бы запутался.


    Так или иначе, альбом был поддержан критикой и упрочил положение Бойда среди европейской
    аудитории, которая стала для него основной. В США он ненадолго вернулся только
    в 1967 г., а с начала 70-х гг. переехал жить в Финляндию.


    В качестве бонусов на диске содержатся 4 трека, записанные в том же составе в
    Гамбурге 7 октября 1965 г. Среди них "Five Long Years" (в огранном исполнении)
    и "The Big Question" самого Бойда, а также "Rosa Lee" Джимми Ли Робинсона и "Hound
    Dog" "Большой Мамы" Торнтон. На последних двух треках Бойд аккомпанировал на органе
    и фортепьяно.'
