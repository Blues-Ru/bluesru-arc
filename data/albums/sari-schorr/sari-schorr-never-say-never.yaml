  text: '"Sari Schorr''s voice has been likened to having the power of Tina Turner or Elkie Brooks with the raw emotion of
    Janis Joplin." - National Rock Review


    Never Say Never - долгожданный второй альбом блюз-рокерши из Нью-Йорка, вышедший 5 октября 2018 года. Обучавшаяся оперному
    вокалу обладательница мощного голоса с диапазоном в пять октав несколько лет назад настолько поразила знаменитого Майка
    Вернона, что он взялся продюсировать ее первый альбом А Force of Nature, который принес певице заслуженный международный
    успех в 2016 году. За два года с момента выхода дебютника Сари успела объехать почти весь свет и набраться впечатлений
    для сочинения новых песен, вошедших во второй альбом.


    Для сохранения сырой мощной энергетики ее концертных выступлений Сари настояла на том, чтобы второй альбом записывался
    вживую в студии. Большая часть песен была записана в Норфолке с участием Боба Фридзема (клавиши), Эша Уилсона (гитары),
    Мэта Библа (бас) и Роя Мартина (ударные). Треки "Beautiful", "Freedom" и "Never Say Never" были записаны в другой студии
    в Ноттингемшире составом из Нила Уилкинсона (ударные), Эша Уилсона (гитары), Мэта Библа (бас) и Беннета Холланда (хаммонд).
    Вместо Вернона продюсерские функции исполнил Хеннинг Герке, который также выступил соавтором большинства песен альбома.
    За исключением двух каверов (Ready for Love авторства Мика Ралфса из репертуара Bad Company и Never Say Never авторства
    клавишника Faces Иана МакЛэгана) все песни написаны самой Сари (в соавторстве).


    От первого трека - своего рода трибьюта Роберту Джонсону с упоминанием легенды о продаже души дьяволу на перекрестке -
    до завершающей песни, написанной МакЛэганом после трагической смерти его жены, альбом отменно спет и сыгран на очень хорошем
    уровне. Несмотря на смену продюсера и сопровождающего состава музыкантов, альбом у Сари удался - тут все тот-же энергичный
    коктейль из хард рока и блюз-рока, исполненный с мощной энергетикой и полной отдачей. Не скажу, что этот диск столь же
    хорош, что и дебютник, но он очень близко - и по духу, и по содержанию, и по качеству записи.'
