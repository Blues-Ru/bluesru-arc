  text: '"A deeply personal album for Schorr, Force of Nature is a hailstorm of an
    album sure to go down in blues history." - Blues Rock Review


    "The album previews released by Manhaton Records reveals one of the most exciting
    Blues rock singers of recent years." - Box Office Buz


    Сари Шорр - новая блюз-роковая сенсация из Нью-Йорка, дебютный альбом которой
    помог записать и продюсировал легендарный Майк Вернон. Талантливая певица, которую
    многие ценители блюза называют современным гибридом Джэнис и Тины Тернер.


    "Сила природы" - прекрасное название для альбома, иллюстрирующее вокальную мощь
    и эмоциональность молодой исполнительницы (случайно или нет, но такое же название
    носит один из лучших альбомов несравненной Коко Тэйлор). Сари, которая обучалась
    оперному вокалу, обладает несомненным талантом не только как вокалистка, но и
    автор/соавтор почти всех треков альбома (исключания - дуэт с Уолтером Траутом
    на его же песне Work No More и переработка классической Black Betty). Альбом большей
    частью записывался в Испании под чутким руководством Майка Вернона, который окружил
    Сари прекрасными музыкантами. Альбом бы не состоялся без отменной игры сопровождающих
    музыкантов, среди которых особенно хочется отметить приглашенных гитаристов -
    на бОльшей части треков отметился Иннес Сибун (который, кстати, сейчас входит
    в состав группы The Engine Room, сопровождающей Сари в турне по продвижению альбома),
    а также на трех треках Оли Браун и уже упомянутый Уолтер Траут.


    В итоге получился достойный блюз-роковый альбом с мощной энергетикой, отменным
    вокалом и прекрасным инструментальным сопровождением. Любители жанра - не пропустите,
    Сари Шорр - это имя, с которым теперь придется считаться и Дане Фукс, и Бет Харт,
    и всем другим блюзовым певицам нашего времени.'
