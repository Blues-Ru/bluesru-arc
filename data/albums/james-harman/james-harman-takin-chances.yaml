- id: 1072
  author: Константин Колесниченко
  mark: 8
  date: '2007-05-11'
  text: 'Выгодное отличие Джеймса Хармана от других West-Coast исполнителей - это то, что он не зацикливается на традиционном
    для этого жанра материале и аранжировках. В своей музыке он использует другие жанры - джаз, соул и много других элементов.Его
    альбомы всегда очень тщательно и хорошо записаны, они просто выверены до милиметра. Это не означает, что тут нет той самой
    блюзовой небрежности и души, просто звуку, который играет значительную роль, уделено много внимания, ровно столько, чтобы
    эти записи звучали, как живые. Весь материал на диске авторский, за исключением одной композиции Джимми Рида. Поддерживающие
    музыканты - молодцы, из известных музыкантов присутствует Bob Margolin и Jeff Turmas. Хочется выделить такие композиции:
    Decisions (композиции с интересным ритмом и классной гармоникой и вокалом), Frolictime - композиция с налетом джаза, интересными
    духовыми и перкуссией, Modern Numbers Game - опять интересный латиноамериканский ритм и перкуссия. На этом диске Харман
    мне впервые понравился как вокалист - тут у него получился скорее не привычный мяукающий калифорнийский вокал, а более
    госпел ориентирование пение.'
