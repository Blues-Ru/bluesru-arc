- id: 364
  author: Алексей Калачев
  mark: 9
  date: '2003-12-15'
  text: Диск не вызвал ни малейшего интереса у публики. Странно. Ведь Харман – один из лучших и самых обаятельных исполнителей
    вест-коуст блюза, прекрасный гармонист. Да и диск на фоне "унифицированных" исполнителей "для широкой публики" слушается
    как порыв свежего, нестандартного звука. При этом он ни сколечко не изменяет истинным ценностям блюза. Диск настоятельно
    рекомендуется поклонникам "электрифицированной" губной гармоники.
- id: 1032
  author: Константин Колесниченко
  mark: 8
  date: '2006-09-28'
  text: 'James Harman считается представителем West Coast Blues, свингующего, живого, танцевального блюза. Этот диск выгодно
    отличается от остальных его работ. Аранжировки очень разнообразны - "Piecework Polititians" - в классной джазовой манере
    с подпевками и потрясающей фортепианной работой, "Lowdown Grown-up Jive"- латина, "Alibi, Reason Why"и „My Secret Escapade"
    - звучат очень по-роковому, плюс, конечно же, классические шаффлы и характерные джампин-блюзы (полностью от них не избавиться).Вокальная
    манера Хармана мне не нравится (хотя он неплохой певец),но в некоторых песнях она очень уместна.Джеймс - очень классный
    харпер, лаконично и технично играет.


    Положительная отличительная черта записей Джеймса - это остроумные тексты песен, они по-блюзовому метки и искренни, но
    это современная лирика. Буклет снабжен интересными комментариями к каждой композиции.


    С Джеймсом играют звезды стиля West Coast и современного блюза:Bob Margolin, Kid Ramos, Kirk Fletcher,Junior Watson, Gene
    Taylor, Steve F''dor,Steve Mugalian, Jeff Turmes, Stephen Hodges и т.д.


    На мой вкус, такие записи этого стиля гораздо интереснее работ других музыкантов, даже уже ставших классиками жанра Willam
    Clarke, Rod Piazza, Johnny Dyer и др.'
