  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-18'
  text: 'Блюз-роковая группа из Лос-Анджелеса, возглавляемая талантливым гитаристом,
    певцом и композитором азиатского происхождения Аланом Мирикитани (получившим также
    прозвище B.B. Chung King), записала свой дебютный альбом в 1994 году. И, хочу
    заметить, дебют получился блестящим - тут и жесткий блюз-рок, и мелодичные хард-роковые
    баллады, и высокое исполнительское мастерство. Материал почти полностью авторский.


    Сам Алан начил играть на гитаре с 4-лет, и к моменту выпуска дебютника зарекомендовал
    себя настоящим мастером. Затем были другие диски группы, а также написание музыки
    к фильмам и для телевидения, создание своей собственной студии звукозаписи, на
    которой он записывал альбомы группы. При этом неизменным осталось высокое мастерство
    композитора и исполнителя. Настоятельно рекомендую к прослушиванию всем любителям
    Уолтера Траута, Стиви Рэя, Шеперда и др. тяжелых блюз-рокеров.!'
