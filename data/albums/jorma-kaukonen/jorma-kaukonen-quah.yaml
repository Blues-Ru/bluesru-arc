  author: Дмитрий Казанцев
  mark: 10
  date: '2005-09-13'
  text: 'Первый сольник Йормы, когда он еще был участником проекта Hot Tuna. Музыка
    здесь акустическая - гитары, вокал и немного струнных в некоторых вещах. В программе
    фолк и фолк-блюз. Есть очень известные вещи: "I''ll Be Alright" & "I''m The Light
    Of The World" (Gary Davis), "Another Man Done Gone" (Lomax, Lomax, Hall, Tartt),
    "Police Dog Blues" (Blind Blake). Песни самого Коконена тоже очень хороши, его
    игра на гитаре - большое удовольствие. На двух вещах с ним поет некто Tom Hobson
    - хорошие песни и вокал (надо искать и его записи).


    Это диск сильнее ВСЕХ альбомов Hot Tuna, как это не странно. Обязательный альбом
    для любителей фолка и акустического блюза!'
