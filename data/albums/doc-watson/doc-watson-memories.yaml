- id: 917
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-11-27'
  text: 'Док Уотсон - легенда фолк-музыки; он поет, пишет песни, играет на гитарах, банджо и других струнных инструментах.
    Этот двойной альбом (22 песни) концептуальный - на нем Док вспоминает старые песни: фолк, кантри, блюзы и песни. Акустический
    состав великолепно играет и импровизирует, Уотсон прекрасно поет. На этом альбоме много известных номеров: "Blues Stay
    Away From Me", "In The Jailhouse Now", "Mama Don''t Allow No Music" (у Джэй Джэй Кейла эта вещь называется "Mama Don''t").'
