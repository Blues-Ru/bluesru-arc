  author: Дмитрий Казанцев
  mark: 10
  date: '2005-12-29'
  text: 'Док поет и играет на гитаре, ему подыгрывают: Расс Савакус - контрабас, Джон
    Пилла - гитара, Мерл Уотсон (его сын) - гитара. Все четверо - виртуозы и мастера;
    это великое удовольствие - слушать их игру. Док исполняет песни, блюзы, фолк,
    кантри, блюграсс, всю палитру американской музыки первой половины 20-го века.
    Это тот самый случай, когда люди играют душевно и ПРОФЕССИОНАЛЬНО; мурашки идут
    от такой музыки.


    Просто ОБАЛДЕННЫЙ диск!'
