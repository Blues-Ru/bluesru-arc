  author: Дмитрий Казанцев
  mark: 9
  date: '2005-12-29'
  text: И в 70-х Док на высоте. На этот раз на лейбле United Artists с группой молодых
    музыкантов, среди которых есть и его сын Мерл. Невероятная игра на гитарах и банджо,
    отличное пение соло и на голоса. На этом диске Док работает в жанре кантри 70-х,
    но фолковые и блюзовые песни тоже есть. Очень мощно, бодро, душевно и профессионально.
    Акустическая рутс-музыка высшего качества!
