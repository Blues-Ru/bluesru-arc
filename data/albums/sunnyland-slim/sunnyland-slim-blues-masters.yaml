reviews:
- id: 605
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-05-03'
  text: Отличный пианист и певец, Санниленд прожил долгую и интересную жизнь блюзмена (он умер только в 1995 году в возрасте
    88 лет). 12 первых треков на этом диске - это альбом из серии Blues Roots (Storyville), а остальные 4 - это бонусы компакт-диск-издания.
    Все вещи записаны в Копенгагене (Дания) в 1964 году. Только Слим и его пианино; большинство вещей написаны самим Албертом
    (именно так его звали). Он не только поет и играет, он еще рассказывает свои истории (это было нормой в те годы на записях).
    Очень интересные блюзы, никаких буги-вуги и прочей мишуры. Слим является автором известной "Tin Pan Alley"; эта песня
    есть и на этом альбоме-сборнике.
