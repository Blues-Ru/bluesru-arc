  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-09'
  text: 'Классный блюзовый пианист, интересный автор и великолепный певец - все это Саннилэнд Слим. На этом диске середины
    70-х записаны 10 его блюзовых песен - одна другой лучше. Запись великолепного качества, сделана она в Швеции в Metronome
    Studio; продюсер - Сэм Чартерс (он продюсировал и другие альбомы из серии The Legacy Of The Blues).


    И так, только Слим, его пианино и голос, а музыка прекрасная; он умел создавать ее даже один.'
