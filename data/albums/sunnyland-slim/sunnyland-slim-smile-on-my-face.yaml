- id: 1412
  author: Сергей Исправников
  mark: 10
  date: '2009-01-18'
  text: 'Изданные на этом диске записи были сделаны в Чикаго в марте 1977 г. знаменитым блюзовым продюсером Ralph Bass для
    его проекта "Chicago Roots". Свою профессиональную карьеру Ральф начал в 1947 г. на лос-анджелесском лейбле Black&White.
    Затем последовала работа в компаниях Savoy, King, Federal, Chess, где он организовывал записи звезд джаза, блюза, r&b
    и соул. После развала Chess он предложил идею выпуска десяти пластинок современных звезд чикагского блюза лейблу T.K.
    Records, возглавляемому его приятелем. Однако кого было записывать в 1977 г.? Собственно говоря, "иных уж нет, а те далече".
    За консультациями обратились к Саннилэнд Слиму – не только патриарху чикагского фортепьянного блюза, но и постоянному
    резиденту местных блюзовых клубов. Дело в том, что несмотря на все его заслуги, общенациональной славы и звездного статуса
    у Слима никогда не было, поэтому и в 70 лет он был вынужден играть в клубах, чтобы иметь стабильный источник существования.
    В течение марта-апреля были записаны пять пластинок, включая диск самого Саннилэнда. Записи проекта проходили в чикагской
    P.S. Recording Studio по ночам, не более пары часов в сутки. Ральф хотел добиться максимально аутентичного клубного звучания,
    играли живьем, количество дублей было минимальным.


    Записанный на диске материал Слима представляет собой традиционные для него буги и "кабацкий" (barrelhouse) блюз. Музыкальных
    новаций от него никто не ожидал и не требовал, Слим исполнил то, что умел, но исполнил превосходно. Аккомпанировали ему
    два гитариста – Lacy Gibson и Lee Jackson, - чья игра здесь была выше всяких похвал. Оба были востребованными в Чикаго
    сайдменами, однако обычно оставались на вторых ролях. Ритм-секцию составили Willie Black (бас) и Fred Below (ударные).
    Что касается Гибсона, то в рамках этого проекта с теми же участниками был записан и его сольный диск "Crying For My Baby"
    (дубль титульной композиции этого альбома приведен в настоящем издании). Издавать отдельную пластинку Джексона не предполагалось,
    его треки разбросаны между альбомами Слима и Гибсона. На данном диске их четыре, из них более всего выделяется инструментал
    "Lee''s Boogie". Впоследствии Гибсон продолжил свою карьеру на Alligator Records, а Джексон скончался в результате каких-то
    домашних разборок в 1979 г., за всю свою жизнь успев записать только один сольный альбом. Возвращаясь к Слиму… После того,
    как он выполнил свои контрактные обязательства и получил деньги, он и думать забыл об этих записях. Судьба их оказалась
    непростой: на родине они изданы не были и в конечном итоге всплыли в Великобритании только в 1984-85 гг. Затем права на
    них выкупил Delmark и в 1999 г. впервые представил их американской публике. На мой взгляд, это один из лучших дисков Саннилэнд
    Слима, отражающий его место в пантеоне мастеров фортепьянного блюза, отлично сыгранный и адекватно записанный.'
