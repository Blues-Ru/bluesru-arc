  date: '2008-06-10'
  text: 'Mike Vernon & Blue Horizon представляют: Саннилэнд Слим (61 год) - пианино, вокал; Clifton James - drums; Willie
    Dixon - bass; Johnny Shines - guitar; Walter ''Shakey'' Horton - harmonica. Записи сделаны в Чикаго в 1968 году - классика
    блюза и звукозаписи. 35 минут классной музыки; Диксон зажигает на контрабасе.


    Рекомендуется всем, конечно.'
