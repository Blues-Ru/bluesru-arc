- id: 1346
  author: Константин Колесниченко
  mark: 10
  date: '2008-10-22'
  text: '<img src="http://s46.radikal.ru/i112/0810/8f/89304bd2c570.jpg"> Это не альбом - это настоящий праздник блюза, настоящего
    блюза, который пробирает до самой середины, заставляет сопереживать, плясать, внимательно слушать рассказываемые истории.
    Признаюсь, это одна из самых лучших блюзовых записей, что я слышал! А все благодаря маленькому и малоизвестному блюзовому
    лейблу "Earwig" (изучите весь его каталог - это настоящий клад для любителей чикагского блюза), который издал это волшебство
    на CD в 2005 году.


    Что мы имеем - пятерку ветеранов блюза, отличный звук, чикагский блюз, фанки West-Side блюз, свинг, оригинальные песни,а
    не перепевки всем известных стандартов. Иногда слышно, что сочинительство идет чуть ли не на ходу, но у таких мастеров
    это звучит так естественно, что придает только дополнительного шарма записи! Альбом длинный, целых 17 песен, но я не скучал
    ни секунды, он слушается на одном дыхании. Big Walter Horton играет на 7 композициях, играет очень интересно - это суть
    блюза на гармонике; Sunnyland Slim выдает просто потрясающую игру, он действительно один из самых сильных блюзовых пианистов;
    мне было интересно наблюдать Honey Boy Edwards в подобной записи, раньше он у меня не ассоциировался с электрическим чикагским
    блюзом; Floyd Jones - для меня новый блюзмен, но он из старых, проверенных временем гитаристов, в чем-то он мне схож с
    Джимми Роджерсом; Kansas City Red - более менее подробную информацию о нем я нашел только на сайте лейбла "Earwig" - это
    замечательный барабанщик старой школы.'
