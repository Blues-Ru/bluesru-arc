  author: Сергей Исправников
  mark: 8
  date: '2008-10-26'
  text: 'Диск издан в рамках предпринятого компанией Delmark проекта по переизданию
    архивов нью-йоркского лейбла Apollo. Это была одна из многочисленных независимых
    компаний грамзаписи, появившихся в 40-х гг. и специализировавшихся на "черной"
    музыке. Apollo Records возникла на базе магазина грампластинок рядом со знаменитым
    "Театром Аполлон" в Гарлеме и занималась изданием блюза и джаза (в ее каталоге
    были записи Coleman Hawkins, Willis Jackson, Pete Johnson, Guitar Slim и других).
    Представленная на этом диске запись происходила 26 августа 1949 г. Помимо собственно
    Саннилэнд Слима, она демонстрирует творчество таких блюзменов, как St. Louis Jimmy,
    Willie Mabon и Jimmy Rogers. Дело в том, что занимаемые Саннилэнд Слимом двухкомнатные
    апартаменты в Чикаго с 1947 по 1954 гг. были своеобразным клубом для местных музыкантов,
    туда приходили выпить, пообщаться, поиграть, просто поесть. По воспоминаниям современников,
    Слим не испытывал зависти к чужим успехам, у него можно было играть так, как хочешь,
    и его дом всегда был открыт для гостей. Соответственно, из совместных неформальных
    джемов рождались новые композиции, которые сначала обкатывались в чикагских блюзовых
    клубах, а затем попадали на синглы.


    Из двенадцати записанных на этой сессии композиций, не считая дублей, на синглах
    была издана только половина. Из треков самого Слима необходимо выделить его знаковые
    вещи – "I''m Just A Lonesome Man" и "Bad Times", а также неизданную "Hard Times
    (When Mother Gone)", имеющую ряд автобиографических черт – рано потеряв мать,
    Слим не нашел контакта с мачехой, которую из-за систематических побоев подростком
    чуть не застрелил. Из четырех записанных тогда треков St. Louis Jimmy с фортепьянным
    аккомпанементом Слима были изданы два – "Sad Old Sunday" и "Chicago Woman". Пик
    популярности этого певца пришелся на тридцатые годы, а здесь он записан скорее
    в знак уважения перед старшим поколением исполнителей довоенного городского блюза.
    Также на этом диске представлен дебютный сингл ученика Слима – 24-летнего блюзового
    пианиста из Теннеси, Willie Mabon, впоследствии сделавшего карьеру на знаменитой
    Chess Records. На одном из записанных им треков – "Boogie Man" – он не только
    поет и играет на фортепьяно, но и аккомпанирует себе на губной гармонике. Интересны
    оставшиеся неизданными два трека знаменитого чикагского гитариста Джимми Роджерса,
    причем один из них – ранняя версия его хита 1950 г. "That''s All Right". Большая
    часть представленных на диске треков взята с записанных на 78 оборотов ацетатных
    пластинок, поэтому несмотря на реставрацию звука с использованием разработок лабораторий
    Кембриджского университета, при прослушивании диска ощущается печать времени.
    Времени, когда послевоенный чикагский блюз только находился в стадии формирования,
    еще не приобретя благодаря студии Chess и бэнду Мадди Уотерса своего канонического
    звучания.'
