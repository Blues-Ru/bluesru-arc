  author: Сергей Исправников
  mark: 9
  date: '2010-02-09'
  text: 'Свою дебютную долгоиграющую пластинку, переизданную на данном компакт-диске, Саннилэнд Слим записал в 53 года. Перебравшись
    в Чикаго в 1939 г. и переиграв с массой исполнителей, включая первого Сонни Боя Уильямсона, Тампу Рэда и и Мадди Уотерса,
    к 1960 г. Слим был известным и уважаемым в блюзовых кругах музыкантом. Его записи выходили на синглах на независимых лейблах
    Hytone, Opera, Chance, Tempo-Tone, Mercury, Apollo, JOB, Regal, Blue Lake, Club 51, Cobra. Наконец, на него обратил внимание
    продюсер Esmond Edwards из известной американской джазовой рекорд-компании Prestige после того, как у нее открылся дочерний
    лэйбл Bluesville, для издания именно блюзовых записей. Что касается профессиональных джазовых критиков и обозревателей,
    то что тогда, что во многом и сейчас, блюз для них – разновидность фолк-музыки, ставшая одним из истоков собственно джаза.
    Соответственно, блюз в их понимании мог быть либо в виде аутентичной довоенной сельской архаики, либо максимально приближен
    к джазу по исполнению и аранжировкам. В связи с тем, что Слим играл именно городской блюз, на постоянной основе выступая
    в чикагских клубах, решено было записать его с джазменами.


    Сессия звукозаписи проходила 15 сентября 1960 г. в Нью-Йорке в Englewood Cliffs, оператором был знаменитый Rudy Van Gelder,
    записавший таких титанов джаза, как Майлз Дэйвис, Телониус Монк, Сонни Роллинз, Джон Колтрейн и многих других. Буквально
    накануне в той же студии делали запись другого блюзового пианиста, Roosevelt Sykes с сессионными музыкантами, поэтому,
    не мудрствуя лукаво, в качестве аккомпанирующего состава их использовали и для диска Слима. На тенор-саксофоне играл один
    из величайших ритм-энд-блюзовых музыкантов Кинг Куртис, фактически на диске он представлен наравне со Слимом. Альбом также
    интересен необычным для блюза дуэтом фортепьяно Слима и электрооргана Роберта Бэнкса. Среди записанных треков стоит выделить
    завораживающий медленный блюз "The Devil Is A Busy Man", танцевальную "Shake It" и динамичную "It''s You Baby", а также
    две интрументальные композиции – заглавную "Slim''s Shout" и имитирующую движение поезда "Sunnyland Special". Вышедшая
    пластинка имела положительные отклики в прессе и, что самое главное, понравилась самому Слиму. По его словам, "это лучшая
    сессия, которую я сделал в своей жизни. Я никогда не испытывал большего удовольствия".'
