- id: 1428
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: 'Мур бросается на блюзовые стандарты У.Диксона с тем же щенячьим азартом,
    с каким лет сорок назад это делали будущие супер-звезды белого рока. Только теперь
    в его музыке слышно такое знание своего ремесла, какое отличает и записи корифеев
    чикагских кабаков. Сколько копий было сломано в 1990г. вокруг его архипопулярного
    альбома: может ли Мур играть настоящий блюз?! Сейчас, похоже, это уже мало кого
    волнует. А напрасно. Играя в тяжелом гитарном трио, Мур дует против моды, но создает
    очень цельный образ. Всего одна слезливая тема на десять треков сурового белого
    блюза. Вокал обогатился истинно блюзовой фразировкой. Короткие песни и выразительны,
    и убедительны. П.Мэйфилд пел, как он "одинок и страдает", - и его поддерживало
    черное чувство юмора. У Г.Мура – гнетущая тяжелая тоска. Беды-злосчастья свалились
    и на него: из-за травмы руки пришлось отменить тур в поддержку нового альбома.'
- id: 2289
  author: Олег Пчелкин (oleg_spb)
  mark: 9
  date: '2017-10-11'
  text: 'Альбом 2004 года, "Мощь блюза" Power Of The Blues, барабаны - Даррин Муни,
    бас - Боб Дэйзли, гитара и вокал- Гэри Мур, клавишные на трех треках - Джим Уотсон
    (2,5,9) Альбом выпущен 22 июня 2004 года, компакт вышел на Sanctuary, фирме грамзаписи
    , базирующейся в Великобритании и до 2007 года считавшейся там одной из крупнейших
    независимых от Sony и Universal компаний. Фирма с 1980х предпочитала подписывать
    контракт с проверенными временем артистами, среди которых было много рокеров,
    однако это не дало позитивного финансового результата , что привело к поглощению
    ее монстром Universal в 2007


    Продюсером в паре с Муром выступил в очередной раз Крис Сангаридис (Christopher
    Andrew Tsangarides), он же был инженер звукозаписи. Сангаридис - специалист по
    работе в основном с представителями стиля "хэви-металл", впрочем поп-музыканты
    работой с ним тоже оставались довольны (Depeche Mode, Tom Jones), как и музыканты
    стиля "фьюжн". Сангаридис был приятелем Мура со времен Colosseum II и дебютировал,
    как продюсер сольного альбома Мура 1978 года Back on the Streets


    Бас гитарист австралиец Боб Дэйзли, судя по его послужному списку, - мужчина общительный,
    коммуникабельный и компанейский, ко времени выпуска альбома успевший поработать
    и с Ozzy Osbourne и с Black Sabbath, и с Rainbow, и с Uriah Heep. А после - и
    с клавишником Purple Джоном Лордом. Но с Муром он работал давно и много, с перерывами
    аж с 1983 года Барабанщик Даррин Муни работал с Муром с 1999 года, с 2001 - почти
    постоянно, до этого отметился на сольном альбоме лидера Jethro Tull Яна Андерсона,
    а в 2003 и у гитариста этой группы Мартина Барра. Но свою творческую жизнь в целом
    посвятил инди-гаражникам Primal Scream Британский и до сих пор весьма востребованный
    сессионный пианист и органист Джим Уотсон после участия в записи трех треков этого
    альбома более с Муром никогда вместе не работал.


    Большинство песен написано Муром, но есть и совместное творчество трио Дэйзли-
    Муни- Мур (собственно открывающая альбом Power of the Blues и Getaway Blues ),
    есть две вещи Вилли Диксона (кавер под "Отиса Раша"I Can''t Quit You Baby , кавер
    в стиле Хаулин Вулфа Evil и кавер Memory Pain Перси Мэйфилда (Percy Mayfield)


    Богатые на гитарные запилы 10 треков продолжаются сорок одну с половиной минуту
    и сменяют друг друга примерно следующим образом: 01 -Power of the Blues- квадрат,
    02 There''s a Hole - минорная баллада, 03 Tell Me Woman - шаффл с "квакушками",
    04 I Can''t Quit You Baby -медленный блюз с гитарным соло, 05 That''s Why I Play
    the Blues -минорная баллада, 06 Evil- медленный квадрат, 07 Getaway Blues -джэм-квадрат,
    08 Memory Pain - минорный соул-блюз, 09 Can''t Find My Baby - шаффл без квакушек,
    10 Torn Inside - нечто очень медленно блюзово-балладное в стиле вокала и гитары
    Питера Грина, предположу, что по плану Мура в конце этой песни на компакте слушатель
    должен сделать музыку потише и спокойно заснуть. Что бы такого еще добавить? Ну,
    I Can''t Quit You Baby близка к версии "Лед Зеппелин" почти до ноты, Заглавная
    песня Power of the Blues напоминает его работы в Thin Lizzy. Вот и все, пожалуй.'
