  author: Андрей Евдокимов
  mark: null
  date: '2002-12-17'
  text: "Переломный на блюз альбом в долгой дискографии GM. На запись Moore пригласил старых соратников по металлическим и\
    \ фьюжин группам плюс Nicky Hopkins, ветеран британского ритм-энд-блюза. Команда составила довольно плотное сопровождение\
    \ дл гитары Мура, козырного туза в этой колоде. Но плотность игры - не главное достоинство блюзбэнда. Альбом являет в\
    \ лучшем виде все древние недостатки европейского блюза. А недостает ему тонкости в ощущении ритма, недостает того, что\
    \ делает из ноты, вставленной в пятилинеечную клетку классической музыки, живую блюзовую ноту (blue note), довольно вольготно\
    \ чувствующую себя на нотном стане и непривязываясь к определенной высоте. Hopkins вытягивает этот экс-metal-бэнд из криминального\
    \ в блюзовом отношении уровня. Но общая игра остается слишком прямолинейной. Если уж 4/4, то, блин, их именно четыре и\
    \ именно четверти. А как же еще? \n\n<p>Поет GМ так же \"в лоб\" (что, собственно, и обеспечивает хит-парадную проходимость\
    \ его блюзовых записей), однако гитара его делает его альбомы вполне привлекательными даже дл блюзовых пуристов. То, что\
    \ он пришел с другого поля, позволяет GМ вносить в довольно истрепанный набор блюзовых гитарных клише - нечто новое, вполне\
    \ укадывающееся в рамки жанра, но звучащее более свежо.\n\n<p>На альбоме - песни из Золотого Блюзового Набора: \"Oh Pretty\
    \ Woman\" (О, Красотка) Williams'a из репертуара A.King'a, \"Walking By Myself\" (Гуляю сам по себе) J.Rodgers'a, \"Too\
    \ Tired\" (Слишком устал) Johnny Guitar Watson'a, \"As The Years Go Passing By\" (С течением лет) D.Malone, \"All Your\
    \ Love\" (Вс твоя любовь) O.Rush'a... Из наследия своего кумира - P.Green'a - GM выбрал в чикагском стиле написанную \"\
    Stop Messing Around\" (Хватить гулять). Более по-флитвудмаковски звучит собственный муровский \"Midnight Blues\" (Полуночный\
    \ блюз). Но в целом, за исключением ритмических нюансов, альбом ближе к современному горячему техасскому стилю. Из 12\
    \ лишь 4 песни сочинены самим GM. За исключением слюнявого заглавного трека, это вполне достойные произведения, особенно\
    \ горячий \"Texas Strut\"(Техасская походка) и величественное посвящение A.King'y \"King Of The Blues\" (Король блюза).\
    \ Оба обладают мелодией (нечастое качество в блюзе) и украшены блистательным соло. (Хотя, пусть приглашенное соло A.Collins'a\
    \ в \"Too Tired\" и не назовешь таким уж \"блистающим\", все равно оно блюзовей стократ любых муровских изощрений). Еще\
    \ один дорогой гость - Albert King, запечатлевший смачное соло из полуторадюжины (не больше) нот в \"Oh Pretty Woman\"\
    . Битломаны покупают этот альбом из-за участие G.Harrison'a в записи его песни \"That Kind Of Woman\" (Этот тип женщины).\
    \ \n\n<p>Итог: рекомендуется для любителей блюза младшего возраста."
