- id: 305
  author: Кирилл Мошков
  mark: 6
  date: '2003-12-01'
  text: 'Много лет назад довелось случайно услышать разговор в музыкальном магазине:
    "А Гэри Мура (говоривший произносил "Гарри") ты не трогай, у меня с него весь
    блюз начался". Ей-Богу, не лучшее начало для блюза. Впрочем, взглянув на название
    альбома, испытываешь некоторую надежду: а вдруг? И вроде бы первые звуки - нарочито
    плоский звук акустического "добро" и действительно по-блюзовому резкий и эмоциональный
    вокал... полноте, да Мур ли это? Но через полминуты все становится на места: грохает
    ритм-секция, голос обретает рокерскую прыть, пронзительным запилом обрушивается
    гитара - и понеслось. Нет, это, конечно, поинтереснее Shrapnel Records, в начале
    80-х штамповавшей "блюзовые альбомы", где блюз играли со скоростью и интенсивностью
    спид-метал. Но все равно это слишком рок - да, блюз-рок, но все-таки рок. Это
    и естественно: до 1990-го, когда он выпустил "Still Got The Blues" (альбом, как
    раз многим и спутавший представления о блюзе), Мур был чистым рокером и играл
    добротный хард, изобретательный арт и т.п. Однако парадоксальным образом именно
    блюз - в сильно подслащенной, обезжиренной и сдобренной рокерскими запилами версии
    - принес ему коммерческую популярность.


    Добротный блюз-рок нового альбома вряд ли сможет вновь принести Гэри Муру миллионы
    поклонников, но знатоков именно такой версии блюза не разочарует - сыграно и записано
    все очень добротно. Не более, но и не менее.'
