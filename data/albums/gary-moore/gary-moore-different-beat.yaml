reviews:
- id: 492
  author: Сергей Колобашкин
  mark: 2
  date: '2004-03-12'
  text: Gary Moore "Different Beat" попала ко мне не случайно, я прочитал хорошие отзывы, но даже не думал, что это будет
    такой мусор! Господин Мур на старости лет решил понравиться молодому поколению, за что заслуживает строго наказания. Это
    не блюз, и даже не рок, и даже не стандартная попса господина Мура - это его личная подборка танцевальной музыки. Я лично
    дослушать это не смог и отдал этот диск на растерзание своей кузине, которая по молодости лет тащится с такой музыки.
    Единственное, что может задержать слушателя - это "Fire" Джими Хендрикса, звучит также как и оригинал, из-за чего делает
    целый диск. Я не увидел тут ничего интересного! Этому альбому я ставлю единицу, и выбрасываю его в мусорное ведро.
