reviews:
- id: 93
  author: Андрей Евдокимов
  mark: null
  date: '2002-12-17'
  text: 'Альбом записан с самыми лучшими намерениями, но, опять продчеркну, на мой
    взгляд - скучен. I Loved Another Woman (Я любил другую) можно считать достаточно
    состоятельной модернизацией аранжировки классического флитвудмаковского варианта.
    С другой стороны - я вряд ли могу быть здесь быть объективен, даже очень расстаравшись.
    Мне эти песни знакомы были прежде по лучшим записям Peter Green''s Fleetwood Mac,
    и сравниваю я GM с теми своими давними впечатлениями. И для меня этот альбом -
    добротная работа. Я вполне разделяю уважение GM к Питеру Грину. Но слушать эти
    песни буду в авторском варианте, или, если уж захочетс интерпретаций, в альбме
    RATTLESNAKE GUITAR - The MUSIC OF PETER GREEN. Здесь подход к темам Грина отнюдь
    не школярский, и главное - живой и разнообразный. Участники (список неполный)
    этого двойного CD: бывшие Foghat, Savoy Brown, сподвижник Питера Грина Snowy White,
    Rory Gallagher, Harvey Mandel, Arthur Brown (да, тот самый), K.Hensley (экс Uriah
    Heep), бывшие Yardbirds, Ian Anderson (Jethro Tull), Stu Hamm (виртуоз бас-гитары),
    Zoot Money.


    Вывод: разбирайтесь сами, если денег не жалко.'
