- id: 92
  author: Андрей Евдокимов
  mark: null
  date: '2002-12-17'
  text: '(Японское издание вкючает еще и вторую пластиночку с четырьмя треками: Stop Messin'' Around / You Don''t Love Me
    / Since I Met You Baby (с участием B.B. King) / Key To Love.)


    На мой взгляд (т.е. в архисубъективной оценке) это самый "живой" из “блюзов” GM. По-европейски напористая гармоника F.Mead''a
    вовсе не по-европейски непрямолинейна, а гитарные соло самого Мура "живьем" звучат гораздо раскованней и, значит, ближе
    к блюзу. "Тяжелое" прошлое GM давлеет над несколькими номерами, вроде того же Cold Day In Hell, есть и попытки играть
    то, что металлюги называют "балладами": это и Still Got..., и старая муровска песня Parisienne Walkways (Парижские проулки),
    и хлипкая с красивенькой мелодией и изысканной импровизацией, неимеющей вовсе никакого отношения к блюзу, "Separate Ways"
    (Разными путями). Но это меньшая часть альбома. В остальном звучит действительно блюз, пусть и с типичными европейскими
    акцентами. Есть классика жанра, уже знакомая в интерпретации GM по предыдущим двум альбомам (хотя, еще раз повторюсь,
    на BLUES ALIVE эти интерпретации действительно звучат живее, в смысле, без кавычек.) Вновь на "Too Tired" гостит A.Collins,
    правда, гитара его записана так, что звучит "хлипче", чем хозяйский инструмент. Зато действительно хорош - в стиле позднего
    гриновского Флитвуд Мака и из его репертуара выбранного - сомнамбулический блюз британского харписта D.Bennet''a "Jumpin''
    At Shadows" (Бросаюсь на тени). И как всегда GM отлично играет в скоростном темпе. Он заряжает зал высокой энергией, и
    это заметно даже в записи. (Как очевидец выступлени GM на джаз-фестивале в MONTREUX-95, имею заявить, что то, что я видел,
    было на порядок менее энергитично и в основном просто скучно. Хотя с другой стороны, к примеру, Н.Арутюнов был в полном
    восторге от концерта GM, который он видел где-то в Европе.


    Вывод: я бы рекомендовал этот альбом как лучший у GM на блюзовой тропе.'
