  author: Андрей Евдокимов
  mark: null
  date: '2002-12-17'
  text: '(Японское издание включает на один трек больше: All Time Low.)

    <p>Продолжает Still Got The Blues по всем параметрам и по той же схеме. Открывается
    таким же боевым, как "Movin'' On" (Двигаюсь дальше), "Cold Day In Hell" (Холодный
    день в аду). Так же боевито в высоком темпе сыгран "Key To Love" (Ключ к любви)
    J.Mayall''a из альбома Bluesbreakers 1966г. Из гостей здесь снова A.Collins, а
    на "Since I Met You Baby" (С тех пор, как я теб встретил, крошка) впервые с GM
    играет B.B. King (Этот трек появляется на сборнике B.B. King''a "Lucille & Friends"(Люсиль
    и друзья).


    <p>Вывод: то же, что и раньше.'
