  author: Дмитрий Казанцев
  mark: 10
  date: '2003-12-20'
  text: 'Этот альбом был номинирован на Премию Хэнди и, пожалуй, лучшая работа Сэма.
    Альбом составлен из отличных композиций.


    Это третий диск Сэма на AudioQuest Music; аудиофильский звук и качество гарантированы.
    Прошло лишь четыре года после первого диска на AQ, но поменялся звук и музыка.
    Прежде всего надо отметить великолепные песни на альбоме, одна лучше другой! Поменялась
    и стилистика, композиции стали более конкретны, блюзовые номера очень хороши!
    Стоит выделить игру Брюса Катца на органе и Кевина Бэрри на гитаре.


    Оценка 5 баллов; великолепный соул-блюз и фанк! Единственный минус, пожалуй, это
    длина альбома - более 70 минут!'
