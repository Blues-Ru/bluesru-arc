  author: Дмитрий Казанцев
  mark: 6
  date: '2003-12-20'
  text: Сэм сменил AudioQuest на Telark (это второй диск на Теларке), но его группа
    почти не изменилась. Изменился звук и музыка. Звук стал просто другой, а вот музыка
    изменилась только в худшую сторону. Не знаю, как это связано с переходом на Теларк,
    но результат печальный. Исчез грув, соул и фанк; появились какие-то странные полуджазовые
    и свинговые аранжировки. Откуда это, зачем это, почему это делает Сэм? Появилось
    ощущение легковесности и попсовости; один трек вообще в стиле поп-кантри. В данном
    контексте исполнение великой Respect Youself кажется очень странным и выбивает
    из колеи. Оценка 3 балла с натягом. Тут есть, что послушать, и звук на высоте,
    но где же тот шикарный материал и грув двух последних дисков на АудиоКуесте?
