- id: 383
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-12-20'
  text: Это четвертый и последний альбом Сэма на лэйбле AudioQuest. Диск о трудной жизни Сэма и о его путешествии по этой
    жизни вместе с неудачами и верой в Бога. После успеха диска 1996 года, Сэм и Ко. пытаются работать в том же ключе, и это
    им почти удается. Материал интересный, но все не такой яркий, как на предыдущем альбоме. По-прежнему классно звучит орган
    Брюса Катца и духовая секция. Впервые Сэм записывает явный супер-хит на своем альбоме, это знаменитая A Change Is Gonna
    Come Сэма Кука. Очень хороши New Man In Town, No More Tears, Prove it to me и Somebody Help Me. Оценка 4 балла; очень
    хороший, но все же достаточно обычный альбом современного блюза и соула.
