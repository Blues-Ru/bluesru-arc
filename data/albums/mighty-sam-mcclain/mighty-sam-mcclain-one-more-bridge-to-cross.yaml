reviews:
- id: 1992
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-08-12'
  text: 'Первый альбом Сэма, который он самостоятельно продюсировал и выпустил на собственном звукозаписывающем лейбле Mighty
    Music. Альбом классического современного соул-блюза от мастера жанра, мастерски владеющего чувственным и мощным баритоном
    и легко сочетающего в своем творчестве чувственное и духовное начала. Диск слегка коммерческий и очень эмоциональный,
    на 3 четверти состоящий из авторского материала. Сэму аккомпанирует квартет профессиональных музыкантов, усиленный духовой
    секцией.


    Сам певец на момент выхода диска считал его своим лучшим альбомом.'
