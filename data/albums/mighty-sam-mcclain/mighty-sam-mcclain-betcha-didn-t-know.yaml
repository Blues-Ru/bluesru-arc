reviews:
- id: 1596
  author: Андрей Евдокимов
  mark: 8
  date: '2010-01-18'
  text: 'Типичный "Могучий Сэм": глубокий сильный голос, страстное исполнение, оркестр медных инструментов... Начинает с фанковых
    номеров, затем звучит очень лиричный блюз, давший название всему альбому. Для Майти Сэма проникновенный разговор важнее
    четких музыкальных рамок. Зная силу своего голоса, он частенько на благодушный шепот. А когда он становится лидером в
    большом хоре (Just Wanna Be), он в одной песне демонстрирует все свои вокальные возможности. Майти Сэм балансирует на
    стыке джаза, фанка и блюза. (Впрочем, для одно песенки с рэпом в альбоме тоже нашлось место. Майти Сэм поразительно стабилен:
    он не отходит от своего годами выстроенного стиля, и при этом - нисколько не скучен. В альбоме есть место и для песен
    удалых и любовного мурлыканья, и для безнадежного "Все уже не так, как раньше", и для "Стремись к мечте", чтобы завершить
    альбом госпелом с почти пионерским названием "Будь готов".'
