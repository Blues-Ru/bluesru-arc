  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-08-12'
  text: 'Следующий альбом после рецензированного мной ранее дебютника Сэм вновь записал
    на студиях AudioQuest, запись была сделана в августе 1994 года, а альбом вышел
    уже в 1995 году. Аккомпанирует ему практически тот же основной состав музыкантов,
    включая Брюса Каца, но духовая секция заметно расширена.


    За исключением двух треков (один из них авторства Ронни Эрла), все песни написаны
    самим Сэмом (самостоятельно либо в соавторстве). В музыкальном плане это все тот
    же коммерческий соул-блюз, разбавленный госпел, джазом и фанком, профессионально
    сыгранный и прекрасно записанный. И все же, на мой взгляд, этот диск будет послабже
    дебютника - некоторые треки пресноваты, а главное - большинство из них изрядно
    затянуты. Баритон Маклэйна по-прежнему на уровне, и музыканты играют хорошо, но
    вот что-то не сложилось, и конфетки не вышло. Тем не менее на диске есть несколько
    очень приличных треков, которые в случае некоторого редактирования длительности
    превратились бы просто в отличные.


    Очевидно, что Маклэйн не зря прошел долгий путь от успешного сингла Sweet Dreams
    (мощной госпел-версии кантри хита Пэтси Кляйн, записанной Сэмом в 1966 году) до
    своих сольных альбомов на фирме AudioQuest, наглядно демонстрирующих профессионализм
    и качество. Хороший альбом для поклонников соул-блюза, но не лучший у Сэма Маклейна.'
