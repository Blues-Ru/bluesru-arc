- id: 379
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-12-20'
  text: 'Так получилось, что Сэм выпустил свой первый нормальный диск только в 1993
    году, когда ему было уже 52 года. Он типичный представитель южной школы соул-блюза
    или блюзосоула, называйте это как угодно. Мощный, энергичный, чувствительный и
    немного грустный голос - вот его визитная карточка.


    Альбом вышел и записан на аудиофильской фирме AudioQuest и состоит из 11 композиций.
    Тут есть все от блюза до фанка; можно это просто назвать классной черной музыкой
    с сильным влиянием госпела. Можно сказать, что у него есть что-то общее с Соломоном
    Берком и Донни Хэтуэем. Классный звук, богатые аранжировки и разнообразные звуки
    - все это есть на этом диске. Особо стоит отметить органиста Брюса Катца; его
    орган великолепен. Что-то звучит очень мощно и тяжело, но есть и акустические
    номера. Нужно еще отметить, что Сэм написал 9 песен из 11, так что он еще и сонграйтер
    с большой буквы. Я бы отметил несколько ярких треков, это Give It Up To Love,
    Child Of Mighty Mighty, I Feel Good, Lonesome Road. Оценка 4 балла; лично мне
    не хватает яркости во многих композициях, иногда кажется, что наступила скука
    и пресность. В общем же этот альбом доставит удовольствие любителям соула, серьезного
    блюза и джаза. Любители гитарных запилов и белых настроений могут не беспокоиться,
    они могут сэкономить около 17 долларов.'
- id: 1990
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-08-12'
  text: 'Я наткнулся на этот диск неизвестного для меня в тот момент исполнителя лет
    15 назад, просматривая аудиофильские диски от фирмы AudioQuest. Кроме качества
    записи меня однозначно привлекло присутствие знаменитого маэстро блюзового Хаммонда
    Брюса Каца, и именно из-за него диск и был куплен. Впоследствии я нисколько не
    пожалел о покупке, хотя музыка немножко не совсем в моем ключе - слегка коммерчески-эстрадная.
    Однако качество записи и исполнения вполне оправдывает покупку.


    Сэм МакКлэйн - ветеран южного соул-блюза, который прославился еще в 60-е, однако
    первый студийный сольный диск записал только в конце 1992 года, а вышел диск уже
    в 1993 году. Естественно, что тут во всем чувствуется профессионал, а его мощный
    густой чувственный баритон мгновенно приковывает внимание. Сопровождающая группа
    также под стать вокалисту - все музыканты с большой буквы, а Брюс Кац, как обычно,
    на высоте.


    В музыкальном отношении это блюз с сильной долей соул и госпел и примесью джаза
    и фанка. Альбом наверняка понравится любителям Майкла Болтона и Джо Кокера, хотя
    он все-таки более элегантный и приджазованный.'
