  author: Андрей Евдокимов
  mark: 9
  date: '2005-04-11'
  text: 'С триумфальным возвращением уэст-коаст-стиля на роль магистрального направления современного блюза, такие переиздания
    особенно актуальны. Конечно, этим аранжировкам не поспорить с нынешними по степени изысканности и оригинальности. Тем
    более, электрогитара 50-х играла по совсем иным правилам, чем сегодня. И все же, техасские основы в Калифорнию переносились
    именно так и тогда. Сегодня о Ватсоне вспоминают редко. Мол, начинал эксперименты с гитарным звучанием, оказал влияние
    на юного Джими Хендрикса. Собрание записей 1955г. представляет его не экспериментатором, а одним из самых ярких артистов
    своего времени. Техасское происхождение Ватсона делает его записи более экспрессивными и не отполированными по сравнению
    с более поздними представителями вест-коаст. Яркий азартный вокалист, он отлично использовал гитару как свой "второй голос".
    Вокально-гитарный диалог в этих записях – просто образцовый. Баритонально густой звук его гитары отлично выделяется на
    фоне рифов медных инструментов. Большинство этих записей знакомы меломанам по дешевым переизданиям на компакт-дисках.
    Впервые они собраны вместе по четкому хронологическому принципу и отлично отремастерированы, обретя в цифре примерно то
    звучание, которое так впечатляло современников. На сегодняшний вкус они могут показаться скорее забавными при первом прослушивании.
    Но в тут полно сюрпризов даже для искушенного слушателя. Три альтернативных тейка в завершение альбома действительно интересны,
    но не как забытый музыкальный перл, а как образец работы в студии.


    Послушать в продолжение темы: T-Bone Walker ~ The Complete Imperial Recordings: 1950-1954 [BOX SET] Guitar Slim ~ Sufferin''
    Mind


