- id: 847
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-09-01'
  text: 'Один из редких альбомов Уотсона (еще более редкий диск 1982 года That''s What Time It Is). Он записан в Калифорнии,
    на записи только сам Джонни (вокал, гитара, клавиши, программинг) и три духовика (они сильно выручают и оживляют диск).
    Музыка здесь прекрасная (обычный для "Гитары" фанк и ритм-н-блюз с джазовым уклоном; есть 2 инструментала), но дешевый
    программинг середины 80-х - это почти ужасно. Радует то, что Уотсон - человек веселый и стебовый, с его музыкой это ПОЧТИ
    СОЧЕТАЕТСЯ! На этом диске есть ОЧЕНЬ хорошие песни: "You Do Me Bad So Good", "Let''s Get Together", "Strike On Computers".
    Все вещи (их 8 на пластинке) написал Джонни, кроме последней "Send Me Someone To Love" - by Percy Mayfield.'
