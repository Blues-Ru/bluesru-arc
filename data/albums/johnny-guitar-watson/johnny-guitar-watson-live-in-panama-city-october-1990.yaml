  author: Дмитрий Казанцев
  mark: 5
  date: '2005-09-01'
  text: 'Неплохой концертник, но два серьезных "НО" - запись почти бутлеговского качества и все песни сильно "загнаны" в темпе.
    С Джонни играет группа: ударные, бас, два клавишника, дудки. Сам Джонни редко играет на гитаре, но когда играет - это
    отлично. Много шуток и игры на публику, конечно.


    На диске 11 треков, его хиты 70-х, в основном. Фанки, диско, ритм-н-блюз с юмором и джазом. Такие вещи лучше смотреть
    на видео, в аудио такая запись звучит несколько странно.'
