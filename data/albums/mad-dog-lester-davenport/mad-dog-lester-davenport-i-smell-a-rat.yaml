- id: 1242
  author: Константин Колесниченко
  mark: 9
  date: '2008-04-03'
  text: 'В качестве предисловия к этому альбому, предлагаю прочитать мою рецензию на <a href="/artist/sam-myers/coming-from-the-old-school/#1211">альбом
    Sam Myers "Coming From The Old School"</a>. Заключительную ее часть.


    Lester Davenport - мультиинструменталист, но больше он известен все-таки как харпер. Он больше сайдмен, чем солист, в
    этом амплуа он известен своим участием в классических записях Bo Diddley и в Kinsey Report. Его сольная дискография очень
    бедна, это его вторая и последняя запись.


    Музыка альбома - это классический и практически идеальный West-Side blues, сыгранный правильно и в точку. Среди аккомпаниаторов:
    Jimmy Dawkins, Bob Stroger, Detroit Junior - старая и надежная гвардия! Возможно, альбом может показаться затянутым, но
    это простительно для блюзмена, записавшего всего два альбома за 76 лет, у него просто накопилось, что сказать слушателю.'
