  author: Дмитрий Казанцев
  mark: 9
  date: '2005-07-26'
  text: 'Его настоящее имя James Oden и это его единственный альбом, хотя он начал
    записываться еще в 30-е годы (существуют сборники с этим материалом). Джимми ни
    на чем не играет, он не очень хорошо поет, его профессия и призвание - это написание
    блюзов. Он так и говорил: "I write them blues..." Мы хорошо знаем этого человека
    (его фамилию) по знаменитой песне "Goin Down Slow" - именно он ее и написал.


    На диске 10 песен, все написаны Оденом, конечно. С ним играют: Джимми Ли - гитара,
    Роберт Бэнкс - пианино, Леонард Гаскин - контрабас, Бэлтон Эванс - ударные. Группа
    мало и сухо играет, оставляя все пространство для слабого голоса Джимми. Его пение
    похоже на рассказ, но как честно и душевно он это делает. Блюзы Одена не отличаются
    разнообразием и красотой, но в них ее свое гипнотическое свойство, которое заставляет
    радоваться при прослушивании этого альбома.'
