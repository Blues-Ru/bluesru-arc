  date: '2005-05-20'
  text: Второй диск Джоди, вышедший в 2004 году, тоже очень хорош! Он выстроен примерно так же, как и первый, который назывался
    Return Of A Legend. Тут тоже парочка интересных гостей, а именно, Роберт Локвуд и Лонни Брукс. Тоже есть старый убойный
    инструментал (Hideout), тоже почти все композиции собственного сочинения. Ну и по стилю опять это приджазованный блюз.
    Повторение? Может быть и да, но это совершенно не замечается, все звучит довольно свежо, хотя гитарные ходы с первого
    альбома были чуть поинтереснее...
