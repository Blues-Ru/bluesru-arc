- id: 220
  author: Алексей Калачев
  mark: 10
  date: '2003-09-18'
  text: Диск получил премию В. Хэнди. Этим многое сказано. Но не все. Эту премию не раз, по мнению российской блюзобщественности,
    можно было бы вручить и кому- нибудь подостойней иных лауреатов. Однако в данном случае, награда действительно нашла НАСТОЯЩЕГО
    героя. 30 лет Джоди, игравший у легенд ритм-энд-блюза 50-х (Бо Диддли, Билли Бой Арнольд и др.), не тревожил пальцами
    струны своего Гибсона, лежавшего, по его утверждению, под кроватью. Диск сработан при массированном участии звезд блюза
    – Тинсли Эллис, Расти Зинн, Рони Бейкер Брукс, Б. Б. Арнольд. Качество музыки и звука – выше всяких похвал. Но главное
    – сам Джоди! Несмотря на длительный простой, он остался чудесным, тонким инструменталистом. Пара его инструменталов-хитов,
    плюс набор блестящих пьес, где он еще и напевает. Вокальные партии предоставлены и гостям.
- id: 630
  author: Александр Панин
  mark: 10
  date: '2005-05-20'
  text: 'В пятидесятые годы Джозеф Вильямс был довольно известным сессионным музыкантом, работал с Билли Боем Арнольдом, Бо
    Диддли (например, гитару Джоди можно слышать на известной композиции Who Do You Love), выпустил ряд отменных синглов,
    но потом по некоторым причинам самоустранился от музыки. Через три с лишним десятилетия он вернулся, и записал в 2002
    году на лейбле Evidence альбом Return Of A Legend.


    Название диска может показаться немного пафосным, но качество уже самого первого трека его полностью оправдывает. Джоди
    исполняет свой инструментал 1957 года Lucky Lou, который в обработке Отиса Раша превратился в абсолютно классическую вещь
    All Your Love, и он звучит просто потрясающе! Всего на диске 13 вещей, как старых, так и новых (все авторства Вильямса),
    слабых моментов почти нет. Звучание гитары Джозефа очень четкое, чистое и красивое, по стилю это чикагский блюз, но довольно
    сильно и вкусно приджазованный. Много гостей - Билли Бой Арнольд, Тинсли Эллис, Расти Зинн...


    Отличный камбэк и абсолютно заслуженная премия W.C.Handy за 2003 год. На этом Джоди не остановился, его второй альбом
    на Evidence вышел в мае 2004 года.'
