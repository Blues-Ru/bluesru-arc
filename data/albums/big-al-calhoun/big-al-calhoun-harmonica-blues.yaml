- id: 1204
  author: Константин Колесниченко
  mark: 4
  date: '2008-01-29'
  text: 'К тому времени, когда Большой Эл решил записать, похоже, свой единственный альбом, в мире гармоники много чего произошло.
    Была и чикагская блюзовая революция, был и блюз-рок, и свингующий калифорнийский блюз, и фанк, и джаз. Но выросший на
    плантации Calhoun записал альбом в духе Sonny Boy Williamson (John Lee), который умер еще в далеком 1948 году, и это не
    тот случай, когда ученик превзошел мастера. На альбоме нет никаких откровений: примитивная игра на гармонике (зачем это
    нужно еще и через микрофон и комбик делать?) , невнятная игра на гитаре авторства Henry Townsend, иногда к музыкантам
    присоединяется Vernell Townsend, он поет получше двух вышеназванных музыкантов, но это не спасает альбома.'
