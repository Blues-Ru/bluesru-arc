- id: 845
  author: Дмитрий Казанцев
  mark: 7
  date: '2005-08-30'
  text: 'Восьмой альбом группы (седьмой студийный) и последний с участием Лоуэлла Джорджа - лидера и основателя группы. Лоуэлл
    записал сольный диск годом раньше и был в турне с этой программой; он умер от сердечного приступа во время тура, оставив
    диск Литтл Фит незавершенным (остальные 5 участников коллектива доделывали его без Джорджа).


    На альбоме 9 треков, из них 5 с авторским участием Лоуэлла (что очень неплохо для такого трудного периода). Звук и стиль
    банды будто бы вернулся на несколько лет назад - стало больше ритм-н-блюза и кантри-рока (как и на ранних альбомах). Другое
    дело то, что ярких вещей тут совсем немного; я бы выделил шикарный соул-номер "Perfect Imperfection", прекрасный фанк
    "Feel The Groove" и песню в духе Steely Dan "Front Page News".


    Этот диск закрыл эру Литтл Фит с Лоуэллом Джорджем. Очень жаль, конечно, Лоуэлл был классным гитаристом, прекрасным певцом,
    гениальным автором и человеком с отличным чувством юмора (Заппа не брал других в группу).'
