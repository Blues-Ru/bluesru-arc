reviews:
- id: 838
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-29'
  text: 'Лоуэлл Джордж и Рой Эстрада ушли из группы Фрэнка Заппы и организовали Литтл Фит - одну из самых интересных и самобытных
    групп за всю историю музыки. Название взято в честь маленького размера ступней Лоуэлла.


    На диске 11 треков, он длится около 33 минут. Все песни написаны группой (Payne, George, Estrada), кроме 44 Blues / How
    Many More Years - песни Хаулина Вулфа. Состав такой: Lowell George - guitars/vocals/harmonica; Roy Estrada - bass/vocals;
    Bill Payne - keys/vocals/percussions; Richard Hayward - drums/vocals. Ребятам в студии помогали: Emilio Castillo - sax;
    Ry Cooder - guitars; Mic Gillette - trumpet; Elliot Ingber - guitar; Sneaky Pete Kleinow - pedal steel; Stephen Kupka
    - sax; Fred Tuckett - guitars/mandolin/trumpet; Russ Titelman - production/vocals/piano/percussion. Как видите, состав
    ОЧЕНЬ КРУТОЙ и звездный, а еще надо отметить, что Лоуэлл - виртоуз игры слайдом (это при том, что Рай Кудер тоже на альбоме),
    Билл Пэйн - один из лучших пианистов в корневой и джаз-музыке, Ричи Хэйуорд - интереснейший мощный драммер со своей манерой
    игры.


    Группа играет смесь рока, блюза, кантри и соула. Можно сказать, что это Южный Рок. На этом альбоме нет хитов, хотя "Willin''"
    уже тут, она станет хитом чуть позднее и в другом исполнении. Вообще, диск продался плохо, люди просто не поняли, ЧТО
    ПРОИСХОДИТ. А это странно, ибо музыка вполне в духе Доктора Джона, Роллинг Стоунз и Оллманов. Пожалуй, вещам не хватает
    яркости и попсовости, но с точки зрения кантри и блюза ТУТ ВСЕ ОЧЕНЬ КЛАССНО.'
