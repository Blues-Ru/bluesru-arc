  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-29'
  text: 'Четвертый альбом группы и первый который попал в Топ-100 (36 место). Это,
    конечно, удивительно, но факт. На этом диске группа сосредоточилась на двух направлениях:
    фанк и блюз-буги-рок, почти забыв про кантри и про звучание предыдущего альбома.
    Можно сказать, что это снова новый звук для Литтл Фит (что, безусловно, интересно).
    Дудки, клавиши, гитары, перкуссия - все это в лучшем виде представлено здесь.
    Ударник Ричи начинает блистать своими фирменными сложнейшими рисунками в духе
    фанка и джаз-рока.


    На диске 8 треков, все написаны группой (George, Payne, Barrere). Состав банды
    не менялся, а вот в студии с ними работали такие люди: Gordon Dewitty - clavinet;
    Emmylou Harris, Fran Tate & Bonnie Raitt - back vocals.


    Эта пластинка идет как бы в одном стиле, в отличие от предыдущего альбома, фанки
    и буги-блюзы чередуются. Особенно хочется выделить треки "Skin It Back", "Spanish
    Moon" и "Feats Don''t Fail Me Now". В песне "The Fan" появились первые элементы
    джаз-рока для группы. Немного напрягает последний трек-поппури - они переходят
    из "Cold Cold Cold" (она уже была на втором альбоме) в дурацкий "Tripe Face Boogie"
    (но это единственное совсем слабое место на диске).'
