reviews:
- id: 842
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-29'
  text: 'Пятый альбом группы; состав не менялся, но у Джорджа начались проблемы с
    наркотиками и он стал меньше заниматься музыкой. В результате, на диске всего
    8 песен (и только 4 написаны с участием Лоуэлла). Все они хорошие, но гениальные
    тут только две: "Long Distance Love" и "All That You Dream". Стиль снова качнулся
    назад к кантри-блюз-року, но фанковые рисунки доминируют. Присутствие элементов
    джаз-рока явно привлекло и новую аудиторию - диск попал в Топ-40.


    Игра и пение на высоте, очень интересные ритмы и клавишные звуки. Гитарные риффы
    и игра Лоуэлла слайдом - по-прежнему великолепно. Буги-рока почти нет, это хорошо,
    но можно сказать, что на этой пластинке чуть меньше энергии, чем на предыдущих
    работах.'
