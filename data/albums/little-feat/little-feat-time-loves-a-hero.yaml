reviews:
- id: 843
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-29'
  text: 'Шестой альбом группы, где Лоуэлл совсем плотно сидит на алкоголе и наркотиках; он также создает трудности в работе,
    не соглашаясь с другими участниками группы в музыкальных вопросах. Из 9 песен Джордж принял участие в написании лишь двух,
    и все же "Rocket In My Pocket" (и другие песни) понравилась людям - диск занял 34 место в американском хит-параде (что
    очень хорошо).


    Звучание группы здесь напоминает джаз-рок, но фанковые и блюз-роковые ходы все же доминируют. На диске много гостей: 4
    человека из Doobie Brothers, духовые из Tower Of Power (они почти на каждом альбоме, впрочем), есть даже струнные. Большинство
    песен написано Полом и Биллом, ребят тянуло во фьюжн, и можно сказать, у них хорошо получилось - "Day At The Dog Races"
    - классный джаз-роковый инструментал. Группа просто великолепно играет, и даже если песни стали не такие яркие, как в
    1973 году, то слушать этот альбом крайне приятно (да и полезно для образования).'
