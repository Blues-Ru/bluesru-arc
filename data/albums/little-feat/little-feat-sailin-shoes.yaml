- id: 839
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-08-29'
  text: 'Второй диск группы отличается от первого (никто не хотел быть выгнанным с Уорнера) - звук стал более четкий (продюсер
    - великий Тэд Тэмплман с помощью Ленни Варонкера), появились более яркие песни и ХИТЫ. Здесь есть "Cold Cold Cold", "Sailin''
    Shoes" и "Willin''" (просто НЕВЕРОЯТНАЯ песня в этом исполнении). А музыка по-прежнему в духе Южного Рока: рок, кантри,
    блюз, соул. Появились тут песни и в стиле буги-рок (их будет больше в последствии); но лично я не в восторге от этого
    стиля в целом.


    В составе по-прежнему 4 человека (George, Estrada, Payne, Hayward), но в студии им помогали: Ron Elliott - guitar, Milt
    Holland - percussion; Sneaky Pete - pedal steel; Deborah Lindsey - back vocals. На диске 11 песен, он длится около 38
    минут. Все песни написаны группой, 8 из них написал Лоуэлл Джордж (он явно берет дело в свои руки, и правильно делает).


    Это диск продался хорошо, группа становится культовой, а их шоу - это отдельная история. Еще важная деталь - начиная с
    этого альбома, ВСЕ ДИСКИ ГРУППЫ оформлял художник (друг и член коллектива) Neon Park. Обложки очень веселые и интересные.'
