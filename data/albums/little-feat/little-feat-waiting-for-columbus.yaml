- id: 844
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-30'
  text: 'Заявление: Если бы все концертники были так хорошо записаны и интересно (и классно) сыграны, то я бы собирал (все)
    номерные концертники.


    Седьмой альбом группы оказался двойным концерником (записи сделаны в августе 1977 года). В оригинале на виниле было 17
    треков, на одинарном КД издали всего 15, а потом сделали издание на двойном КД, на котором 27 треков (его я и советую
    любителям цифрового звука).


    Вместе с группой на концерте играет духовая секция из Tower Of Power (5 человек!), что делает шоу уникальным по звучанию
    - настоящий Funky Dixieland. Большинство вещей сыграно в новых аранжировках, исполнение на высшем уровне, не смотря на
    то, что Лоуэлл Джордж был в плохом состоянии из-за наркотиков и алкоголя - на игре это не отражается (удивительная вещь,
    на самом деле).


    Все хиты тут, в новых обработках и с другим звуком. Это один из лучших живых альбомов в рок-музыке.'
