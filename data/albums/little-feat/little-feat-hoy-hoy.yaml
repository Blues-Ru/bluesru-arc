  date: '2005-08-30'
  text: Прекрасный подарок сделала группа своим поклонникам, выпустив этот двойник в 1981 году. На нем собраны концертные
    и студийные редкости, а также песни, которые не выходили на альбомах и синглах (всего 19 треков). Качество материала превосходное,
    альбом был издан с красивым буклетом. Обязательный сборник для любого ценителя Литтл Фит и Лоуэлла Джорджа.
