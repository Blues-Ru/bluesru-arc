- id: 1419
  author: Андрей Евдокимов
  mark: 6
  date: '2009-02-03'
  text: 'С первого трека Уилльямс демонстрирует блюз жесткий, на грани блюз-рока. Дальше будет всего понемногу: и кокетливый
    сладкий джаз в Will You Still Love Me, и регги, и чуть фанка… А завершает альбом превосходный спиричуэлс в сверхскоростном
    темпе Pocono Praise. Но блюз: энергичный или лиричный – доминирует по всему альбому. Шерри роилась в 1965 году, с12 лет
    пела в роительском церковном хоре, а с собственным блюзбэндом гастролирует с 90-х годов. И рука профессионала чувствуется.
    Это превосходный пример того, что "звезд с неба не хватает" - еще не значит "плохо". Хороший голос, профессиональное владение
    вокалом. Все песни в альбоме – собственного сочинения. Например: "Чтобы попасть в рай, надо пройти через ад" - из лучшего
    медленного блюза в альбоме. К сожалению, аккомпанирующий состав играет правильно, но безлико. В остальном, все на уровне.
    Ключевые трэки: Fire, Gotta Go Thru Hell.'
