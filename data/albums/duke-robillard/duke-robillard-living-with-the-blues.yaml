reviews:
- id: 892
  author: Константин Колесниченко
  mark: 9
  date: '2005-10-25'
  text: '"Living with The Blues" – один из самых блюзовых альбомов Робилларда, на котором он обратился к классикам жанра:
    BB и Freddie King, Little Milton, Brownie McGhee. Дюку аккомпанирует замечательный и звездный состав: Bruce Katz, Doug
    James, Jesse Williams и т.д. Одно из главных качеств Робилларда как музыканта (помимо просто замечательной гитарной игры),
    на мой взгляд, это то, что он умеет делать свои альбомы узнаваемыми, очень стильными – в этом плане этот диск один из
    самых сильных в его творчестве.'
- id: 1721
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-19'
  text: 'Дюк Робиллард был одним из основателей знаменитых Roomful of Blues, откуда он ушел в 1979 году, оставив свое место
    молодому Ронни Эрлу. В 1990 году в свою очередь Дюк заменил Джимми Воэна в Fabulous Thunderbirds. Параллельно он записывался
    с другими исполнителями и записывал сольные пластинки, на которых демонстрировал свою любовь к блюзу, джазу и свингу.
    В 2000 и 2001 годах он получил высшие блюзовые премии - W.C. Handy как лучший блюзовый гитарист.


    Диск 2002 года практически полностью посвящен блюзу в его различных проявлениях, причем на альбоме представлен как авторский
    материал, так и каверы блюзовой классики. Мастерски исполненный традиционный блюз усилен духовой секцией, напоминающей
    первую группу Дюка, причем слышно, что сами музыканты выкладываются в полной мере, получая удовольствие от исполняемой
    музыки.'
