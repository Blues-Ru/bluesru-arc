- id: 1277
  author: Леонид Аускерн
  mark: null
  date: '2008-06-03'
  text: New Guitar Summit – не дуэль, не поединок, не турнир и не выяснение отношений типа "кто же из нас лучше играет на
    гитаре". Это встреча старых добрых друзей, которые нашли время и возможность собраться вместе и вместе в охотку поиграть
    любимые мелодии. При этом Джей Гейлс возможно лучше знаком любителям рок-музыки, он некогда возглавлял очень приличную
    группу J.Geils Band, без статьи о которой не обойдется любая мало-мальски стоящая энциклопедия рока. Дюк Робиллард – очень
    известный и увенчанный множеством лавров блюзмэн, в свое время основатель Roomful Of Blues и музыкант, сделавший блестящую
    сольную карьеру. Джерри Бодойн по сравнению с первыми двумя гитаристами за пределами Америки известен значительно меньше.
    Но на региональном уровне это весьма ценимый и уважаемый музыкант. А объединяют этих трех людей не только теплые личные
    взаимоотношения, но и музыкальные вкусы. Все они очень любят старый свинговый джаз и именно эту музыку решили преподнести
    слушателям с благословления Хольгера Петерсена, шефа блюзового канадского лейбла Stony Plain. Так что, как это ни парадоксально,
    место этому отличному альбому, выпущенному в России по лицензии, на мой взгляд, именно в джазовой части нашего "CD – Обзора".
    Джей, Дюк и Джерри включили в программу целый ряд классических стандартов – Lady B. Good братьев Гершвинов, Bennys Bugle
    Бенни Гудмена, Ain't Nobody's Business из репертуара Билли Холидей, Perdido Тизоля. Звучит здесь и пьеса Seven Comes Eleven,
    среди авторов которой значится и Чарли Крисчен, пионер электрогитары, уважаемый мэтр для любого гитариста. Три собственные
    пьесы в джазовом стиле принес в проект Джерри Бодойн – к его чести в ряду с композициями классиков они выглядят вполне
    достойно. На обложке альбома подробно расписана очередность солирования каждого из музыкантов для всех пьес, так что желающие
    могут оценить игру всех участников проекта, включая очень профессиональных "секундантов" - басиста Тернера и ударника
    Гроттентхалера. Особый бонус альбома – видеозапись трека Swing With Dr. Jake, где участников этого замечательного саммита
    можно не только услышать, но и увидеть "в деле".
- id: 1380
  author: Константин Колесниченко
  mark: 7
  date: '2008-12-09'
  text: 'Когда я писал рецензию на альбом Дюка Робилларда "Guitar Groove A Rama", у меня проскользнула идея, что для того,
    чтобы альбом стал полноценным мастерклассом, не хватает только видео, демонстрирующего все аспекты техники музыканта.
    На этом альбоме гитаристов-виртуозов трое, да и диск сопровожден видео-материалом. Так что, если хотите начать изучать
    свинговую гитару на грани блюза и джаза – начните с этого альбома и копайте глубже. Важно, что техничность музыкантов
    на "New Guitar Summit" не преобладает над чувствами, все очень гармонично и уместно.


    Мне было немного удивительно, что Jay Geils настолько успешно играет такую музыку, ведь в первую очередь звук его гитары
    - это ассоциации с J. Geils Band. Gerry Beaudoin - это новое для меня имя, но судя по буклету, он довольно известный сессионный
    музыкант на такого рода записях. Одним словом, хороший, мягкий и расслабляющий альбом.'
- id: 2286
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2017-09-22'
  text: '"A swinging hybrid of jazz and blues music using delightful three-part harmony playing that''s the signature of this
    epic guitar trio. The warm-toned romance of the past combined with the energy of the here-and-now establishes a high standard
    ... all of which makes New Guitar Summit both an elegant reflection of another era - when the lines between jazz and blues
    were blurred but beautiful - and a reminder that virtuosity in the service of great music, at the command of the great
    players, is timeless." - Ted Drozdowsky (from the liner notes)


    Дюк Робиллард в особом представлении не нуждается: основатель знаменитых Roomful of Blues и обладатель множества блюзовых
    наград лучшему гитаристу (на момент записи альбома у него их было 4, больше было только у Бадди Гая - шесть). Сольная
    дискография Дюка включает не один десяток альбомов, записанных в разных стилях (джаз, блюз, свинг) и с разными музыкантами.
    Джей Джайлс более известен как мастермайнд рок-группы J. Geils Band, однако любовь к джазу и блюзу была у него с детства
    (в юном возрасте он играл отнюдь не на гитаре, а на трубе и хотел стать новым Луи Армстронгом). Джерри Бьюдон с детства
    играл джаз и блюз (одно время даже аккомпанировал Клинхеду Винсону), но добился широкой известности благодаря сольной
    карьере в 90-е, когда он записал пару акустических альбомов с гением мандолины Дэвидом Гризманом.


    Три маститых гитариста дано знали друг друга и неоднократно играли вместе на концертах (попарно и все втроем), и каждый
    раз у них возникало желание играть вместе почаще, поскольку их объединяло общее видение музыки, и они получали удовольствие
    от совместного творчества. Наконец они созрели для записи альбома и с помощью контрабасиста и ударника из группы Джерри
    в студии Робилларда почти без репетиций и практически без наложений записали диск, на котором представили свои интерпретации
    джазовых и блюзовых стандартов (плюс три трека написал Джерри Бьюдон). Для записи музыканты использовали несколько винтажных
    гитар.


    Альбом преимущественно инструментальный и джазовый, хотя без пары-тройки блюзов конечно же не обошлось. Есть три трека
    с вокалом: на Never Say Never Again Again и Backdoor Blues поет Дюк Робиллард, а на ''Tain''t Nobody''s Bizness If I Do
    - Джерри Бьюдон. Продюсировали все три гитариста. В качестве бонуса на диске имеется видео концертного исполнения Swing
    With Dr. Jake. Диск для любителей отменно сыгранного мягкого гитарного джаза с блюзовым оттенком.'
