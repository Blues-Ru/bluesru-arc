  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2013-06-13'
  text: 'Очередной альбом знаменитый Дюк Робиллард записал с музыкантами, которые
    играют в его группе уже не один год. В качестве приглашенных гостей на альбоме
    играют гитарист Майк Уэлч, трубач и коллега по Roomful of Blues Дуг Вулвертон
    и кларнетист Билли Новик.


    Музыканты отлично сыграны и свободно чувствуют себя во всех разновидностях блюзового
    жанра. Материал преимущественно авторский (бОльшую часть написал сам Робиллард,
    два трека Майк Уэлч, плюс еще пара треков от старого друга Дюка корнетиста Эла
    Бэсила). Сыграно высокопрофессионально, но как-то без изюминки, да и голос Робилларда
    (который никогда не был выдающимся вокалистом) здорово подсел. Похоже, это тот
    самый случай, когда отличного исполнения недостаточно для того, чтобы затронуть
    душу слушателя - нужно что-то еще (может быть, тот самый пресловутый feeling?).
    В общем, альбом приличный и качественный, но далеко не лучший у Робилларда.'
