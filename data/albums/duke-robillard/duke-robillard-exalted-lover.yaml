- id: 1278
  author: Леонид Аускерн
  mark: null
  date: '2008-06-03'
  text: Точеные женские ножки в эротичных чулочках на обложке плюс само название альбома (и титульного трека) "Экзальтированный
    любовник" - шерше ля фам! И действительно, в этом пятилетней давности альбоме Дюка Робилларда, выпущенном по лицензии
    в России, женщины обнаруживаются, даже три. Сначала во втором треке, появляется известная вокалистка из Нэшвилла Пам Тиллис,
    в вокальном дуэте с Дюком помогающая ему исполнить кавер-версию классического ритм-энд-блюза I'll Never Be Free. Затем
    приходит черед самой интересной композиции диска, сочиненной Робиллардом титульной песни Exalted Lover. Сам Дюк здесь
    поет и играет на гитарном синтезаторе, придающем звуку его инструмента сходство со звучанием трубы. Играет он медленный,
    тяжелый как осенний дождь блюз, и музыка звучит сквозь страстный монолог на французском другой дамы, Эйми Хилл – получается
    очень эффектно и очень эротично! Наконец, в шестом треке, появляется третья дама, блюзовая исполнительница Дебби Дэвис,
    в дуэте двух гитар с Дюком "зажигающая" в отличном образчике техасского блюза How Long Has It Been. Из других особенностей
    альбома нельзя не отметить огромное разнообразие гитар, использованных при записи Дюком Робиллардом – тут и обычная шестиструнная
    "испанка", и различные электрогитары, и упомянутый выше гитарный синтезатор, и добро. В остальном же Exalted Lover - типичный
    для одного из лучших гитаристов блюза альбом. Восемь из десяти треков сочинены самим Дюком. Как обычно, он активно использует
    в аранжировках духовую секцию, представленную ветеранами из первоначального состава Roomful Of Blues, как обычно, альбом
    представляет собой панораму самых разнообразных видов блюза – от кантри-блюза и до рок-а-билли, как обычно его музыку
    не будет скучно слушать и завзятым джазфэнам. Мастерство музыкантов, убедительность и драйв исполнения покоряют.
- id: 1373
  author: Константин Колесниченко
  mark: 7
  date: '2008-11-25'
  text: 'Концепция музыки, которую записывает Дюк Робиллард, не меняется уже много лет – максимально разнообразно, мелодично,
    побольше свинга и интересных музыкальных цитат. Какие-то альбомы у него получаются слабее, какие-то интереснее, но на
    каждом из них есть изюминка, что-то, что цепляет слух и притягивает внимание. Немаловажно, что все его записи звучат цельно,
    несмотря на жанровую эклектику.


    Ритм-н-блюз, кантри-свинг при помощи Pam Tillis, блюз-рок, новоорлеанская музыка, вокальный и гитарный диалог с Debbie
    Davies, а заглавная "Exalted Lover" - вообще в духе современного айсид-джаза – приблизительно так составлен альбом.


    Кичеватая обложка этого альбома и многоговорящее название лишний раз дают нам понять, насколько Дюк влюблен в свою гитару,
    и поверьте, это слышно в каждой извлекаемой им ноте.'
