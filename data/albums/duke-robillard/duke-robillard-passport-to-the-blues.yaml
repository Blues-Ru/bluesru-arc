  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-19'
  text: 'Четыре раза награжденный титулом "гитарист года" и получивший награду "лучшему исполнителю традиционного блюза в
    2010 году" вслед за своим номинированным на Грэмми альбомом "Stomp! the Blues Tonight" Дюк Робиллард выпустил альбом,
    полностью посвященный блюзу, причем блюзу жесткому, сырому и агрессивному.


    За исключением одного кавера Тома Уэйтса (с которым Робиллард гастролировал в качестве соло-гитариста в 2006 году) весь
    материал авторский. Большинство треков Дюк написал всего за пару недель до того, как они были записаны, а бОльшую часть
    соло он записал как обычно без наложений - "вживую в студии". Сопровождает Дюка квартет отличных музыкантов, среди которых
    старый его коллега по Roomful of Blues - саксофонист Дуг Джеймс. Есть пара-тройка треков с джазовым влиянием, но бОльшей
    частью это мощный жесткий качественный блюз, украшенный саксофонами Дуга. На бонусном треке Дюк и ударник Марк просто
    импровизируют, не связывая себя лишними рамками. Один из лучших альбомов Дюка Робилларда.


    Вот что говорит об альбоме сам Дюк: "Всю свою жизнь и карьеру я восхищался традиционной "корневой" музыкой, невзирая на
    ее стиль. Если это "корневая" музыка, я люблю ее, и мне всегда ее мало. А сейчас я особенно люблю блюз."'
