- id: 1282
  author: Разные авторы
  mark: null
  date: '2008-06-03'
  text: Один из ведущих гитаристов жанра записал диск-обозрение всевозможных стилистических
    направлений блюза и музыкальных влияний, через которые ему посчастливилось пройти.
    Самый продолжительный, 16-минутный, номер - дань признательности Дюка создателям
    "чикагского стиля" Мадди Вотерсу и Джимми Роджерсу, например. Едва ли не наполовину
    альбом инструментальный. А самая неожиданная пьеса закрывает диск - Дюк Роббилард,
    блюзмен с 45-летним стажем, выписывает "Очи черные"!
- id: 1279
  author: Леонид Аускерн
  mark: null
  date: '2008-06-03'
  text: Благодаря объемному лицензионному соглашению, на российский рынок попала внушительная
    часть каталога канадского блюзового лейбла Stony Plain и в том числе – практически
    все диски великолепного американского блюзмена Дюка Робилларда, изданные этой
    компанией. В этой супер-коллекции совершенно особое место занимает альбом Guitar
    Groove-a-Rama. Наверное, это самый подробный творческий отчет, который только
    можно представить. Дюк включил в этот альбом четырнадцать композиций, преимущественно
    своих, сочиненных в разные годы, но и также вещи Рэя Чарльза, Лил Сан Джексона
    и даже Боба Дилана (Down Along the Cove), чтобы, как он сам признается на обложке
    альбома, показать все звучания и стили, которые повлияли на становление его собственного
    стиля. Излишне говорить, что преимущественно это – различные варианты блюза. Альбом
    уникален, ну а внутри него еще более уникальна одна композиция – шестнадцатиминутная
    Blues-a-Rama, где на базе стандартной 12-тактной схемы Дюк салютует десяти великим
    гитаристам блюза, от Бадди Гая до Би Би Кинга, которые сильнее всего повлияли
    на него, играя поочередно в стиле каждого из них. И не зря вы видите на обложке
    так много гитар. В каждом треке он играет на разных инструментах из своей внушительной
    гитарной коллекции. На каком именно когда и что значит для него каждая из записанных
    композиций Робиллард подробно рассказывает в комментариях к ним. Кстати, о комментариях.
    Я не очень люблю российские лицензионные переиздания из-за того, что в них обычно
    информация идет в кастрированном виде – очень часто от оригинального издания с
    массой фотографий и liner notes в буклете остаются только обложка да названия
    треков со списком исполнителей. В этом плане представляемые "Крокусом" диски полностью
    идентичны оригиналам. Так что впечатление от Guitar Groove-a-Rama будет еще более
    ярким, если вы прочтете и комментарии Дюка, и весьма информативные liner notes
    от Теда Дроздовски.
- id: 1375
  author: Константин Колесниченко
  mark: 8
  date: '2008-12-01'
  text: Если бы в комплекте с этим альбомом шел DVD с обучающим материалом, вышел
    бы полноценный мастеркласс-учебник, но даже и без такого дополнения диск получился
    неким пособием по околоблюзовым стилям игры на гитаре. Для меня Дюк Робиллард
    всегда был человеком, способным сыграть абсолютно любую музыки, и в каждом течении
    он бы звучал более, чем убедительно. Если кому-нибудь нужно лишнее подтверждение
    этого – приобретите этот альбом. Но это не основной мотив для покупки, среди очевидных
    плюсов альбома, как всегда, отличный вкус Дюка, мастерские сопровождающие музыканты,
    а также интересные цитаты - от блюзовых гитарных кумиров музыканта в "Blues A
    Rama", до абсолютно неожиданной, но гармоничной вставки от Битлз в "Danny Boy"
    и сногсшибательного джазового трека "Dark Eyes" (переведите название на русский
    язык).
- id: 1476
  author: Андрей Евдокимов
  mark: 6
  date: '2009-02-05'
  text: Обильное гитарное ассорти украшает обложку. Под ней - наглядная демонстрация
    мастерства самого гитариста и тестирование его гитарного арсенала. "Конечно, блюз
    здесь – корень почти всего, но я хотел показать и некоторые из других стилей,
    которые волновали меня как молодого гитариста." - объяснил Дюк. Робиллард снабдил
    каждый трек комментариями, почем он выбрал именно эту песню и на каких именно
    гитарах он ее исполнил. На две трети альбом состоит из инструментальных пьес,
    большинство которых записано в формате трио, однако для записи нескольких были
    приглашены старые друзья. Саксофонист Дуг Джеймс даже взял губную гармонику для
    исполнения кантри-версии песни Боба Дилана. Эл Бесайл играет на корнете. Заглавный
    трек – это инструментальная сюита с пояснениями Дюка о встречах с гитаристами,
    чью манеру игры он пытается воспроизвести в этой пьесе. И завершает диск танго-румба
    "Черные глаза" - кабатчина, но какая!
