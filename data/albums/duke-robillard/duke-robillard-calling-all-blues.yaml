  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2014-10-23'
  text: 'The Duke Robillard Band - Calling All Blues!


    Очередной альбом патриарха блюза во всех его разновидностях мастера шести струн Дюка Робилларда выполнен в традиционной
    для него манере - это слегка отличающиеся стилистически 10 треков блюза в традиционном ключе с современным звучанием.
    Продюсировал сам маэстро, он же является автором большинства песен (8 из 10), в записи помогала вокалистка Санни Крауновер,
    а также духовая секция Roomful of Blues (коллег Дюка по джамп-блюзовой группе, созданной Дюком более 40 лет назад). Сыграно
    высокопрофессионально, музыка на уровне, единственное пожелание - побольше бы дать петь приглашенным вокалистам (сам Дюк
    отменный музыкант, но посредственный певец). В итоге имеем приятный альбом для поклонников Робилларда и современного блюза
    вообще, хотя выдающейся пластинку назвать нельзя.'
