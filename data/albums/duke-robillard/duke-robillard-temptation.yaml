- id: 893
  author: Константин Колесниченко
  mark: 7
  date: '2005-10-25'
  text: Видный и один из главных современных гитаристов Jump и West Coast блюза Duke Robillard поддался искушению и записал
    блюз-роковый альбом. Вообще, я считаю Робилларда одним из главных трудяг современного блюза, он записывался и с John Hammond,
    и с Blind Boys of Alabama, Eddy Clearwater итд, даже с самим Bob Dylan. Дюк – полистилист, умеющий практически все в американской
    музыке. Именно по этим причинам даже этот альбом Робилларда звучит не пресно, а с его особым подходом. Он умело использует
    как гитару, так и свой мужественный вокал, следует также отметить, что практически весь материал на диске – авторский.
    Время, проведенное с T-Birds подтолкнуло Робилларда оставить вот такой вот блюз-роковый след в своей дискографии.
