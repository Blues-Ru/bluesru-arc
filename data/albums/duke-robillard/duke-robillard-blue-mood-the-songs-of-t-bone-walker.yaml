- id: 1281
  author: Алексей Калачев
  mark: null
  date: '2008-06-03'
  text: В современном блюзе множество трибьютов Уокеру, однако лучше этого я не слышал.
    Изящно свингующий оркестр, абсолютно достоверно - с точки зрения техники, звука,
    фразировки - работающая под Ти-Боуна гитара, фантастическое по качеству звучание
    всего диска, голос… А вот вокал Дюка, конечно, далек от пения Уолкера, у которого
    действительно он был, голос, – сильный, мяукающий от страсти, сладкий яко сироп,
    - одним словом, выразительный голос. Надо признать, Робиллард превзошел самого
    себя, вывернулся наизнанку и спел чудесно. Но не как Ти-Боун… Диск изумительный,
    must have. Достоинства всех без исключения 12-ти его треков по-настоящему высоки!
- id: 1280
  author: Леонид Аускерн
  mark: null
  date: '2008-06-03'
  text: 'Альбомы-трибьюты всегда вызывают уважение. Это живое свидетельство связи
    поколений, неразрывности внутрицехового братства в музыкантской среде. Вот и здесь
    перед нами знак благодарности гитариста - гитаристу, белого ученика - черному
    учителю, Дюка Робилларда - Ти-Боун Уокеру. На обложке Blue Mood приведены слова
    Дюка Робилларда: "Я всегда знал, что когда-нибудь запишу трибьют моему учителю,
    Отцу электрической блюзовой гитары – Ти-Боун Уокеру. Все, что я играю, включая
    все мои записи со времен основания Roomful Of Blues более тридцати лет назад,
    несут в себе память о Ти-Боуне". Робиллард не преувеличивает, когда называет Аарона
    Ти-Боун Уокера отцом электрической блюзовой гитары. Игра Ти-Боуна в сороковые
    и в начале пятидесятых годов действительно революционизировала блюз. Уокер много
    взял у музыканта, первым применившего электрогитару в джазе, Чарли Крисчена, возможно,
    поэтому его манере игры присущ отчетливый свинг и другие джазовые элементы. Для
    блюза тех лет это было новостью. Молодой Дюк Робиллард постигал основы блюза,
    слушая "расовые" пластинки того времени и Ти-Боун Уокер был его любимым музыкантом.
    Отсюда и виртуозный баланс на границе блюза и джаза, ставший фирменным отличием
    его собственного стиля. Blue Mood Дюк записывал со своим постоянным ансамблем,
    а также представительной группой духовых инструментов, в составе которой играли
    и его приятели – ветераны Roomful Of Blues. Духовые очень заметны в аранжировках
    композиций Ти-Боун Уокера, составивших основу этого альбома, в частности, в девятиминутной
    I''m Still in Love with You, медленном чувственном блюзе, который я бы назвал
    вершиной альбома. Гитара и голос Дюка и игра его партнеров здесь просто превосходны.
    Впрочем, и остальные треки подстать этому. Шестой альбом Дюка Робилларда для канадского
    лейбла Stony Plain получился очень ровным, мощным и сполна передал любовь Дюка
    к своему учителю.'
- id: 1372
  author: Константин Колесниченко
  mark: 9
  date: '2008-11-25'
  text: 'Можно использовать характерные гитарные фразы T-Bone Walker''a, но записать
    целый альбом, посвященный этому музыканту – это поступок, если не сказать подвиг.
    Ведь такая запись, в первую очередь, адресована людям знающим, тем, кто хорошо
    знаком с оригиналом, а следовательно, работа эта очень ответственна и сложна.
    В наше время такой альбом мог записать только Дюк Робиллард. Он мастер принимать
    любой блюзовый облик, от чикагского блюза до новоорлеанского, от соул-блюза в
    стиле Литтл Милтона до фанка, что в очередной раз и доказал слушателю.


    У альбома нет слабых мест, какой трек не послушай, это будет почти дословная интерпретация
    классических песен. Казалось бы, что такая хрестоматийная работа может быть скучной
    и пресной, но это не так, Дюк превзошел сам себя – каждая композиция оживает заново
    в его прочтении. В этом заслуга, безусловно, не только Робилларда, ему помогает
    замечательный ансамбль, большинство музыкантов можно встретить на предыдущих альбомах
    гитариста: Doug James, Matt McCabe, Jessie Williams, Mark Teixeira и др.


    Лично мне на этом альбоме не хватило нескольких композиций из позднего периода
    творчества T-Bone Walker, когда он болем чем успешно пробовал себя на ниве соул-джаза,
    блюза с привкусом фанка, как на альбомах "Funky Town" или "Good Feelin''". Но,
    в любом случае, это один из сильнейших блюзовых альбомов в 21 веке.


