  date: '2009-04-13'
  text: '"Stretchin'' Out. Live" – это наверная самая блюзовая запись из всех альбомов Дюка. Именно блюзовая, не имитация
    блюза, не игра со стилями, не аккомпанемент другому музыканту, а именно блюзовый альбом, записанный вживую. Блюзовую игру
    Дюка слушать очень интересно – он ходячая энциклопедия гитарных стилей и наглядное подтверждение принципа, что индивидуальный
    и уникальный музыкальный почерк можно выработать, изучая игру своих предшественников.


    На записи Дюку Робилларду аккомпанирует состав, знакомый слушателю по другим его записям и концертам: Marty Ballou – bass,
    Marty Richards – drums и "Sax" Gordon Beadle – tenor и baritone sax.'
