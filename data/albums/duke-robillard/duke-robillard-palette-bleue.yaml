  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-19'
  text: 'Альбом Дюка Робилларда 1999 года существует в двух версиях: под именем New Blues for Modern Man на фирме Shanachie,
    и под именем La Palette Bleue на фирме Dixiefrog (в этом случае на диске имеется дополнительный трек I May be Crazy).
    Обложки практически совпадают, и остальные 12 треков идентичны (только порядок другой).


    Состоящий на три четверти из авторского материала, данный альбом наглядно иллюстрирует способности Дюка по смешению различных
    разновидностей современного блюза и соул. Базовая ритм секция усилена двумя духовиками (которые изредка придают альбому
    джазовое звучание), а также четверкой дополнительных музыкантов. Альбом звучит очень качественно и профессионально, и
    наверняка не оставит равнодушным поклонников как самого музыканта, так и его материнского коллектива Roomful of Blues.'
