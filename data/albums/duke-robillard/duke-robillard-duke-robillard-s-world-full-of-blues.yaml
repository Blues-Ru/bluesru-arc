reviews:
- id: 1248
  author: Андрей Евдокимов
  mark: 7
  date: '2008-04-09'
  text: 'Робилларду нет нужды доказывать еще свою виртуозность и владение всеми блюзовыми стилями. Но свою гитарную универсальность
    он демонстрирует снова и снова. На два компакт-диска поместились самые разные образцы: от неряшливого и грубого чикагского
    блюза до аккуратно прилизанного джамп-блюза. Плюс немного фанка, джаза и еще одна румба в придачу. Обрисовывая свой мир
    блюза, Робиллард вспоминает всех своих кумиров от Гейтмауса Брауна до Ти-Боун Уокера. Песню Боба Дилана он поет в традиции
    Дельта-блюза, а песню Тома Уэйтса превращает в гипнотически тяжелую тоскливую композицию. Когда-то он гастролировал с
    обоими этими выдающимися песенниками. Собственную песню, давшую название всему альбому, он исполняет сольно. Она отчасти
    напоминает одинокие размышление Джона Ли Хукера под гитару. В особых рекомендациях альбом не нуждается – все любители
    блюза и так знают, что новые записи Дюка надо "брать не глядя".'
- id: 1722
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-19'
  text: Мастер джамп-блюза Дюк Робиллард разошелся не на шутку и записал аж два диска блюза во всевозможных его стилях. Половина
    авторского материала, половина - каверы, причем под раздачу попали не только блюзовые мастера, но и Боб Дилан и Том Уэйтс.
    В целом - очень приличная работа, а бонусный диск вовсе не производит впечатление довеска. Отличная гитарная техника позволяет
    Робилларду свободно чувствовать себя в любой блюзовой и околоблюзовой эпостаси, а сопровождающий коллектив музыкантов
    и приглашенных гостей обеспечивает высокопрофессиональный аккомпанимент. Есть, конечно, и композиции среднего уровня,
    есть и затянутые треки, но при желании из двух дисков каждый может собрать для себя один просто отличный. Рекомендуется
    всем любителям качественного джамп-блюза, украшенного духовыми. Четырнадцатое место в блюзовом топе альбомов Биллборда.
