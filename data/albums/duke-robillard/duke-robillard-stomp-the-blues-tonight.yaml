- id: 1719
  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2011-05-19'
  text: 'Данный альбом - посвящение Дюка Робилларда джамп-блюзу 40х и 50х годов 20-го века, той музыке, которая вдохновила
    его на создание Roomful of Blues, где к блюзовой группе была добавлена полноценная свингующая духовая секция. Несколько
    треков написаны Робиллардом (и в соавторстве), остальное - классика джамп-блюза.


    Естественно, в аккомпанирующем составе представлена мощная духовая секция, включающая старого соратника Дюка по Румфулам
    - Рика Латалля. С гитарой Дюк управляется гораздо более искусно, нежели с микрофоном, поэтому присутствие отличной вокалистки
    Санни Крауновер только улучшает общую картину. Естественно, инструментальные номера также звучат великолепно.


    Роскошный альбом джамп-блюза и свинга, исполненный на одном дыхании - прекрасный подарок для любителей свингующего блюза
    с духовыми. Седьмое место в топе блюзовых альбомов Биллборда.'
