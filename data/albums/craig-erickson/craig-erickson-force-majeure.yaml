  text: Записанный на фирме Blues Buro International четвертый сольный альбом гитариста
    представляет собой техничную работу на стыке хард рока и блюз-рока с примесью
    фьюжн и фанка. Альбом украсили гостевым участием такие гитарные мастера, как Крис
    Дуарте и Юджин Гэйлз. В целом добротная работа, но без изюминки - одним словом,
    на любителя :-)
