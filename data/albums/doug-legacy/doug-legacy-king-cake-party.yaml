  author: Александр Мальчевский
  mark: 9
  date: '2003-12-01'
  text: 'Есть альбомы, благодаря которым начинаешь слушать определенную музыку. Вот этот альбом меня подбил на Зайдеко. Самое
    смешное, что этот альбом совсем не в традиции. Он вообще сильно отличается как от традиционного зайдеко, так и от нового.
    Альбом больше сориентирован на фолк. Повторюсь, к традиционному задеко он имеет очень отдаленное отношение, АллМузик вообще
    дает странные стили: Zydeco, Roots Rock, Americana, что меня до глубины души удивило.


    Сам Doug Legacy выпустил два альбома Hey You и King Cake Party, известен он больше как сессионщик, работал с Лизой Хейли,
    Джексоном Брауном и прочими разными людьми, в качестве пианиста и равно и аккордеониста.


    Что на альбоме интересного: Ну, во-первых, Рай Кудер играет на гитаре. Это и в правду он делает хорошо. Во-вторых, на
    альбоме нарисовался David Lindley, очень хороший музыкант в жанре блюграсс. В-третьих, бэк-вокал и скрипка сама Лиз Хейли,
    о которой отдельный разговор. Все в сумме дает очень интересный альбом, но не зайдеко, а около него. Из самого интересного
    на альбоме кавер Taj Mahal - CakeWalk into town, неплоха вещь Smoky places, напоминающая что-то из мексиканского народного
    творчества. Хороша и Hates his threads - сделана она в контескте зайдеко, как и заглавный трек. Свой материал у группы
    тоже на загляденье. Плюс мастреская игра музыкантов, все сыграно с любовью и заботой.


    Подчеркну, есть два издания этого альбома, на двух лейблах на Wild Cat и на Demon - они ничем не отличаются кроме обложки.
    Плюс на Wild Cat он вышел на 4-ре года позже.


    Что радует: Грамотный альбом, хорошие музыканты, настроение шикарное. Что огорчает: Вроде бы ничего... В итоге: 5-'
