  date: '2016-07-13'
  text: '"Bliss Avenue really purged my soul in a starker, more naked way, both lyrically and musically". - Dana Fuchs


    "juke-joint dirty and illicit, evoking Janis Joplin, Mick Jagger and a cigarette butt bobbing in a glass of bourbon..."
    - Classic Rock Magazine


    Одна из наиболее одаренных современных певиц на стыке хард-рока и блюза и ее наиболее интересный третий студийный альбом.


    Дана Фукс (или на американский манер Дэйна Фьюкс) - талантливая певица, автор песен и актриса, родилась 10 января 1976
    года в Нью-Джерси и выросла во Флориде в простой семье, где она была младшей из 6 детей. С детства любила петь, и в 12
    лет начала петь госпел в хоре первой баптистской церкви, а к 16 годам уже выступала по клубам с локальной рок группой.


    В 19 лет перебралась в Нью-Йорк и там встретила гитариста Джона Даймонда, который оказался ее музыкальным soul mate. Вместе
    они организовали группу Dana Fuchs Band, которая в процессе выступлений по блюзовым клубам постепенно набирала популярность.
    После совместных концертов с Марианной Фейтфул и Эттой Джеймс Дану заметили и предложили ей роль Дженис Джоплин в постановке
    мьюзикла Love, Janis. В 2003 году вышел первый студийный альбом Lonely for a Lifetime. Однако широкая известность пришла
    к Дане в 2007 году после того, как она исполнила роль певицы Сэди в музыкальном фильме Across the Universe, основанном
    на музыке Beatles. Кроме естественной ассоциации с великой Дженис из современных артистов Дану чаще всего сравнивают с
    Бет Харт.


    У Даны не только луженая глотка и мощный хриплый сексуальный голос - для нее также характерны профессиональная подача,
    эмоциональность и искренность, а также бешеная энергетика. Все эти качества в полной мере проявились на альбоме Bliss
    Avenue, материал которого был практически полностью написан Даной и Джоном (плюс пара песен в соавторстве). Диск был записан
    в Нью-Йорке, продюсировали сами - Дана, Джон и Тим Хэтфилд.


    Музыкальная стилистика альбома - блюз-рок и хард-рок с долей соул и примесью кантри. Хорошие мелодии, отменное исполнение,
    приличное качество записи. Особенно хочется отметить: мощную "открывашку" - заглавную песню Bliss Avenue, навеянную кантри
    Rodents in the Attic, а также Baby Loves the Life (эта песня написана уже давно и присутствовала в сет-листе концерта
    в Нью-Йорке 2008 года Live in NYC). Впрочем, остальные треки тоже хороши - проходных вещей на диске нет. Очень достойный
    альбом и заслуженное девятое место в топе блюзовых альбомов 2013 года.'
