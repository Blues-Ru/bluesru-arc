- id: 2357
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2022-10-31'
  text: 'Дана Фьюкс - одна из наиболее интересных и голосистых блюз-роковых певиц на современной сцене, которая одинаково
    хорошо чувствует себя и в мощном блюз-роке, и в сравнительно интимных соул-треках. Ее последняя работа - альбом Borrowed
    Time - вышел 29 апреля 2022 года на лейбле RUF Records после четырехлетнего перерыва. На этом уже седьмом диске в ее дискографии
    Дана отдает дань своим корням - диск явно замешан на энергичном жестком гитарном южном роке Флориды, на той музыке, на
    которой выросла сегодняшняя певица.


    Бунтарка из семьи ирландских католиков, в молодые годы Дана находила отдушину на рок-н-рольных концертах и в процессе
    пения в госпел-хоре баптистской церкви. Так она научилась петь, и одновременно полюбила хард- и блюз-рок. "В этом жанре
    невозможно представить концерт, на котором кто-то не попросит спеть Freebird. И вот вместо того, чтобы делать кавер на
    классический трек от Skynyrd, я просто записала свой собственный альбом южного рока."


    Предыдущий альбом Love Lives On, который по факту был своего рода соул-трибьютом музыке мемфисских лейблов Stax и Sun,
    Дана выпускала на собственном лейбле Get Along Records, но для новой работы опять вернулась под крылышко к Томасу Руфу.
    Дана и ее soul mate Джон Даймонд по-прежнему вместе, они напару написали практически весь материал альбома. Продюсировали
    большой мастер Бобби Хэрлоу (который также микшировал альбом) и второй гитарист Кенни Тудрик. Диск был записан всего за
    8 дней преимущественно вживую в студии.


    "Мы записывали всю музыку вживую, это был наш первый альбом, записанный с дополнительным гитаристом. Мы стремились к такому
    традиционному звуку а-ля Стоунз, и получилось как будто у нас в группе были Кит Ричардз и Ронни Вуд. Музыканты просто
    начинали джемовать, и неожиданно написанная на акустической гитаре песня становилась мощной рОковой, и мы сразу же ее
    записывали. У нас уходило не более трех дублей на запись каждой песни. Это был самый быстрый альбом из всех, которые я
    записывала."


    Дана признает: "Это впервые для меня рассказывать так много историй других людей. В течение двух последних лет большинство
    людей осознало, что обратной дороги к нормальной жизни уже нет. И, если положить руку на сердце, так ли мы этого хотим?
    Во время пандемии я вернулась в школу и родила ребенка, поэтому я надеюсь, что с этим опытом и переживаниями я подхожу
    к созданию музыки более ответственно. Это было время для того, чтобы выйти из себя и написать песни с точки зрения совсем
    другого человека. В конце концов, все мы на этой планете живем в одолженное время".'
