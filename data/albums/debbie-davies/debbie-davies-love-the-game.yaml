- id: 1573
  author: Андрей Евдокимов
  mark: 2
  date: '2009-08-29'
  text: "Милая девица (на момент выпуска альбома она как раз перевалила за полтинник), певица-гитаристка Дебби Дэвис в хорошей\
    \ музыке купалась с колыбели: ее отец работал аранжировки для Рея Чарлза, был концертмейстером на записях Фрэнка Синатры…\
    \ Сама она с младых ногтей играла ритм-гитару в ансамблях блюзовых ветеранов и была солисткой дамского ансамбля Мэгги\
    \ Мэйолл (супруги Джона Мэйолла, чьим песням она в 2003 г. посвятила целый альбом). Но мир узнал ее во время ее трехлетнего\
    \ членства в группе великого Алберта Коллинза. Памятна видеозапись ее участия в концерте Коллинза. В компании махровых\
    \ черных блюзменов она в своей кепочке и с гаврошевским блеском в глазах выглядела очень задорно. Наследственность и школа\
    \ предполагали блестящую сольную карьеру, к которой ее подталкивал и сам Коллинз. Он лично принимал участие в записи ее\
    \ дебютного альбома. И дебютный альбом 1993 г. эти ожидания оправдал, как все еще оправдывают его большинство треков из\
    \ последнего (пока) в ее дискографии альбома 2007 года. Но почти полтора десятилетия между ними пролегает унылое болото\
    \ из семи (!) альбомов. Один из самых никчемных вышел в 2001 г.\n\nЛюбитель блюза покупается на состав участников. Брюс\
    \ Катц за клавишными, соло-гитара в двух треках и общее художественное руководство (сиречь, продюсирование) – Дюк Робиллард.\
    \ Плюс великолепное соло Коко Мантойи в треке Fired Up (по духу – посвящение Коллинзу, в ансамбле которого он и познакомился\
    \ с Дэвис). Но Брюс играет словно \"по дружбе\" - строго в аккомпанименте. Дюка и Коки на покрытие недостатков всего альбома\
    \ не хватает.\n\nОбычно вокалистки имеют тенденцию входить в тандем с бас-гитаристами. Творческий партнер Дебби в этом\
    \ альбоме – барабанщик Дон Костаньо. Он автор или соавтор 8 из 13 песен. Ладно, что композитор он никакой, так еще и ударник\
    \ – по блюзовым параметрам – \"топорный\". \tНачиная с I'm Just Your Fool Девис переходит к серии песен в стиле соул.\
    \ Для них Дюк даже рекрутировал свою любимую медную секцию, товарищей еще по Roomful Of Blues: Дуга Джеймса и Гордона\
    \ Бидла. Но и их участие не спасло положение. Соул требует сильного голоса и открытых эмоций. Дэвис не обладает этими\
    \ качествами ни в коей мере – послушать Leading Me Home и спросить: \"Дебби, зачем ты сочиняешь рождественские песни,\
    \ когда уже есть гораздо лучше, а твоя – даже и не про Рождество?\" Просто сентиментальная нудятина.\n\nКонечно, бывают\
    \ в блюзе и более скучные альбомы, но записанных в столь блестящем составе, пожалуй, больше нет."
- id: 1908
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-06-17'
  text: 'Я думаю, достаточно просто перечислить аккомпанирующих музыкантов, и этим уже будет все сказано:


    Кроме постоянной ритм-секции тут у нас маэстро блюзового Хаммонда В3 Брюс Кац, а также среди приглашенных гостей Дюк Робиллард
    (который еще и выступил в качестве продюсера), Джей Джайлс (слайд на треке 5), Коко Монтойя (треки 2 и 3), а также два
    саксофониста, придающие дополнительный колорит музыке.


    Так что же мы имеем в результате - приличный альбом техасского блюза, но правда без особых откровений.'
