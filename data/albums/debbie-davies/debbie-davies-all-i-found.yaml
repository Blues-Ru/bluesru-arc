  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-17'
  text: 'Восьмой по счету сольный альбом бывшей гитаристки Альберта Коллинза, 7 раз
    номинированной на высшую блюзовую награду W C Handy Award, и получившей ее в 1997
    году в номинации "лучшая исполнительница современного блюза". В 2010 году Дебби
    также получила блюзовую награду лучшей исполнительнице традиционного блюза. All
    I Found - первый сольник Дебби Дэвис для фирмы Telarc.


    Аккомпанируют музыканты классического состава The Broadcasters Ронни Эрла (Пер
    Хэнсон на ударных и Брюс Кац на клавишах), на басу брат Кенни Нила - Ноэль, а
    в качестве второго гитариста - Артур Нильсон, гитарист Шемекии Копланд (все эти
    имена знакомые для тех, кто любит блюз).


    Альбом полностью состоит из авторского материала, но он не чисто блюзовый - тут
    и рок встречается, и даже немножко поп, но в целом исключительно профессиональная
    работа, в музыкальном отношении и в смысле качества записи выше всяких похвал.'
