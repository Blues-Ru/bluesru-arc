- id: 127
  author: Алексей Калачев
  mark: 7
  date: '2003-05-29'
  text: Песни Джона – отличный композиторский материал, и остается только гадать, почему этот оригинальный материал до сих
    пор мало эксплуатируется блюзменами. Американское высокомерие? Бог весть… Главное, диск Дебби по упомянутой причине уже
    любопытно послушать. Инструментальная часть явно интересней вокальной, и не только из-за гитары. А пианист Брюс Катз?
    А старик Джеймс Коттон, Мик Тейлор, Питер Грин в качестве гостей? Оправдывает 2003-й случае с Дэвис свою репутацию – репутацию
    "Года, альбомов нокаутирующих предшественника"? Думаю, да. "Key..." посильнее "Love the Game" будет. Остальное – дело
    вкуса.
- id: 1909
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-17'
  text: 'Дебби Дэвис - талантливая американская гитаристка из Лос-Анджелеса, игравшая в группе супруги Джона Мэйолла Maggie
    Mayall and the Cadillacs (группа Мэгги выступала на разогреве у Джона и его Блюзбрейкеров, и Джон всегда приглашал Дебби
    на финальный джем), и затем на сольном альбоме Джона 1990 года, а также 3 с лишним года в качестве соло-гитаристки в группе
    у Альберта Коллинза до начала сольной карьеры. Первый сольник Дебби Picture This вышел в 1993 году, и Альберт Коллинз
    присутствовал на нем в качестве гостя. В 1997 году Дебби была удостоена высшей блюзовой награды как лучшая исполнительница
    современного блюза, а в 2010 году получила высшую блюзовую награду лучшей исполнительнице традиционного блюза.


    Сотрудничество с Джоном и его неоценимый вклад в современный блюз оказали на нее огромное влияние - Дэбби училась играть
    на гитаре под звуки исторического альбома Джона с Эриком Клэптоном 1966 года. В 2003 году Дебби решилась записать трибьют
    музыки своего кумира, который понравился самому Джону, и не только ему - он занял 15 место в топе блюзовых альбомов Биллборда.
    В записи помогали маэстро блюзового Хаммонда Брюс Кац, а также Мик Тэйлор и Питер Грин (каждый присутствует на одной песне,
    причем Питер играет и гитарное соло, и соло на гармонике). И еще два трека украсил своим участием виртуоз губной гармоники
    Джеймс Коттон. Кроме песен Джона, на диске есть два трека, написанные Дебби под его влиянием. Продюсировали Дебби Дэвис
    и Пол Опалач.


    Возможно, не все треки получились одинаково хорошо, но в целом альбом состоялся.'
