  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2011-06-17'
  text: 'Дебби Дэвис - блюзовая гитаристка, которая 7 раз номинировалась на W.C. Handy и получила эту награду в 1997 году
    как лучшая артистка современного блюза. Джон Мэйолл известен своим чутьем на отличных гитаристов, и его приглашение Дэбби
    в качестве гостьи на альбом 1990 года говорит о многом.


    Счастливый случай свел в свое время Дебби с Коко Монтойей, который познакомил ее с великим Альбертом Коллинзом. Коллинз
    пригласил ее в свой состав Icebreakers, с которым Дебби отыграла в качестве соло-гитаристки почти 4 года. Сольную карьеру
    она начала в 1993 году, записав дебютный альбом на Blind Pig Records.


    На альбоме 2007 года Дебби собрала таких блюзовых звезд, как Коко Монтойя (гитара, вокал), Тэб Бенуа (гитара, вокал) и
    Чарли Масселуайт, а также знаменитый участник группы Ронни Эрла The Broadcasters мастер Хаммонда Б3 Брюс Кац вместе с
    остальными Броадкастерами :-). В результате получилось то, что лучше всего выражает название альбома - блюзовый взрыв!


    За исключением восьмого трэка все композиции отличные, а первый и последний инструменталы просто великолепны. Гитарные
    дуэли с привлечением гармоники, разные вокалисты на разных треках, полное взаимопонимание музыкантов и изрядная доля импровизации
    - просто какое-то блюзовое пиршество для гурманов!'
