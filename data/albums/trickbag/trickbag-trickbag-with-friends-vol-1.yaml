- id: 2158
  author: Олег Пчелкин (oleg_spb)
  mark: 8
  date: '2014-01-23'
  text: 'Шведский ансамбль, играющий винтажный гармоника-ритм-н-блюз во всех его проявлениях, в большей части треков - танцевальных,
    то есть чаще ближе к "послевоенному" джампу, чем к классическому "довоенному". Этот компакт больше напоминает интернациональный
    блюзовый концерт- сборную солянку с массой отличных участников, где все разнообразят и оттеняют друг друга. Записи сделаны
    в Стокгольме с 2008 по 2013 год (кроме That''s All Right, записанной живьем в Калифорнии). Сгодится и послушать и потанцевать.


    Do What You Want (Делай, что хочешь) поет опытный профессионал, играющий много лет, Стив "Вест" Вестон, один из заслуженных,
    но малоизвестных широкой европейской публике музыкантов (о США и говорить нечего). Мастер блюзовой гармоники, он еще и
    весьма неплохой певец и пианист, сочинил песню, применив новоорлеанский подход к фортепианноиу блюзу. Соло на гитаре -
    Андерс Леувен .


    Соме back (Вернись)- песня, где показывает свои умения первый гость альбома - вокалист и гармошечник Джеймс Харман James
    Harman. Он поет на альбоме еще две песни, кроме этой. Она записана с первой попытки в самом лучшем виде.


    Таке My Love (Забирай мою любовь), песня Литл Уилли Джона Little Willy John (в оригинале -ду-уоп), - здесь - бодрый шафл
    и новый гость с энергичным вокалом - Джон Немез John Nemeth. В отличие от многих вокалистов, голос его от обилия выступлений
    не садится, а даже где-то "стальнеет". "Обрамляет" Немеза на тенор-саксофоне Торбьерн Элиассон.


    Get Up (Вставай) -стандарт исполняется вокалистом и мастером акустической гармошки R J Misho, выделяется своим ярким вкладом
    ритм - секция с барабанщиком Пером Нулином и басистом Ларсом Насманом. So unhappy (Так несчастен)- поет очередной гость
    альбома, - вокалист и пианист Баррелхаус Чак, живая связь времен между ушедшими светилами и современными проводниками
    старой музыки.


    Песня Рики Аллена Cut You A-Loose органично вписалась в репертуар "Коробки с фокусами", поет ее штатный вокалист группы
    Томми Моберг, Фредрик фон Вердер играет на органе весьма близко к оригиналу, два признаных в Европе блюзовых лидер-гитариста
    - Томи Лейно и Андерс Леувен предоставляют друг другу возможности посолировать, сменяя один другого. Томи Лейно весьма
    искусно имитирует стиль Отиса Раша.


    Единственная песня на альбоме исполненная вживую, That''s All Right (Все в порядке), вещь Джимми Роджерса, поет певец
    и харпист Линвуд Слим Lynwood Slim, очень хорошее гитарное соло Томи Лейно, в последней части записи на гармонике присоединяется
    "Вест" Вестон.


    Эр Джи Мишо RJ Misho поет и играет на гармонике в номере Андерса Леувена It''s Your Life (Это твоя жизнь, детка), лидер-гитара
    - Томи Лейно, бас - Ларс Насман, Фредрик фон Вердер - пианино, Пер Нурин - барабаны


    Боб Корритор играет на гармонике, а ветеран шведского блюза Свен Зеттерберг поет песню Роберта Найтхавка The Time Have
    Come (Придет время), классический "laydown" , "грусть-печаль-блюз". Томми Лейно демонстрирует, что умеет играть еще и
    слайдом.


    Инструментальный номер Hot and Heavy (Жарко и тяжко), приятель гостеприимных финнов и шведов Баррелхаус Чак играет на
    своем органе "Фарфиса" (Farfisa). Номер был записан в 2008 году еще со старыми участниками бэнда , барабанщиком Бьерном
    Витаненом и гитаристом Йонасом Горанссоном.


    Трек в латиноамериканском духе Waiting For The Moon (Ожидая луну), снова Джеймс Харман в певцах и харп -солистах. Харман
    показал скандинавам удивительную способность сочинить девять версий мелодии за 45 минут о Луне, пляжах, винограде и девушках,
    Андерс Леувен в ответ сочинил основной гитарный рифф.


    Песню Томми Моберга I''m Not Lyin'' (Я не вру) сам он и поет, сочинение в духе класического жесткого шаффла (такие в Швеции
    называют "хонка") посвящена его девушке. "Люди, я не вру, эта длинноногая красавица-блондинка - моя девушка!" Боб Корритор
    играет на харпе в стиле Большого Уолтера Хортона .


    My Love is Strong (Моя любовь крепка), старый хит Эрла Кинга - еще один вклад Джона Немеза в альбом, как вокалиста и харписта,
    поет он в своей манере как обычно несколько расслабленно.


    Еще одна оригинальная песня и авторское исполнение, Talk Back (Отвечай) поет вокалист бэнда Стив "Вест" Вестон, быстрое
    буги, которым музыканты этого бэнда любят открывать свои танцевальные вечера.


    Песню The Goat (Козел) поет ветеран блюза в Швеции Свен Зеттерберг , очень хороший харпист, певец и гитарист, мастер петь
    аутентичный "южный соул", но здесь он показывает мастерство исполнения блюза авторства Сонни Боя Уильямсона. Отличное
    соло на гармошке.


    Завершает альбом инструментал Scandinavian Stroll, финско-шведская гитарная дуэль между Томми Лейно и Андерсом Леувеном
    и демонстрация мастерства ритм-секции Trickbag.'
