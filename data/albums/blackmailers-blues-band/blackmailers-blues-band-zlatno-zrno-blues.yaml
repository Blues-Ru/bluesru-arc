- id: 750
  author: Федор Романенко
  mark: null
  date: '2005-07-01'
  text: 'Первое впечатление от пластинки – диск очень смешной. Я хихикал от начала и до конца, когда слушал его в первый раз.
    Пожалуй, он как нельзя лучше отразил метаморфозу, которая произошла с группой Blackmailers Blues Band за последний год.
    Визитной карточкой группы, если можно так выразиться, всегда был ее солист-вокалист Тимофей Копылов (aka "Мистер Зло").
    Причем, когда раньше группа играла классику блюза с присущей большинству наших исполнителей серьезностью и пафосом, демонический
    образ Тимофея малость резал слух и глаз, ибо его "намеренно-простоватая" манера никак не вязалась с эстестким пафосом
    исполняемых композиций. Если Тимофей поет, скажем, песню, которую на записях исполняет какой-нибудь утонченный стилист
    типа Линвуда Слима, то на фоне попытки копирования в исполнении Тимофея вызвали бы закономерный протест. Особенно, если
    учесть заигрывания с румынской музыкой, "зажигаем хорошо" и т.д.


    Однако, я уверен, группа нашла себя. Сегодня стиль и фасад Blackmailers Blues Band – развлекательный блюз с балаганно-отвязными
    шутками с музыкальной подложкой, которая согласно официальной заявке не преподносится как высокое, одухотворенное искусство.
    В этом качестве стилистика шоу – глубоко натуральна и даже, не побоюсь сказать, весьма оригинальна! И мне это нравится!


    Ну и теперь, если повнимательней взглянуть на "бекграунд" для шоу Blackmailers Blues Band, т.е. их музыку, оказывается,
    что они достигли впечатляющих успехов. Конечно, во вселенском масштабе успехи скромно средние, подобно стартовой точке,
    из которой можно начать "развитие", но для меня уже почти из категории "можно слушать", в которую, ей-ей, входят считанные
    отечественные исполнители.


    Вообще, диск меня весьма и приятно удивил. Я был на нескольких концертах Blackmailers Blues Band, знаю, чего ожидать от
    группы, и думал, что на пластинке будет чистенько записанный концертный репертуар для галочки, но, увы, без намеков на
    концертный "драйв". На пластинке я обнаружил и, понимаешь, аранжировки, и какие-то новые песни, и разнообразие стилей
    – баллады, соул, вест-коаст, и почти фирменный звук. Говорят, пластинка писалась в Минске в гостях у Света. Снимаю шляпу,
    другие отечественные записи, пожалуй, по качеству звука уступают.


    Ритм-секция "Вымогателей" свингует более-менее нормально, что является уже достижением для наших исполнителей. Ей-ей,
    шутят во Владимире лучше, чем серьезно играют в Москве. Хотя, разумеется, есть претензии, когда на шаффлах, стоп-таймах
    и прочих неординарностях вся группа сбивается в комок, подгоняя и увлекаясь не очень крутыми простоватыми риффами, за
    что над ними иногда подтрунивают злопыхатели. Однако, в целом, впечатление хорошее.


    Барышев продемонстрировал отличную вест-коаст гитару. Звук фирменный, отличная фразировка и звукоизвлечение, для примера
    - на открывающей Rock This House. Прямо как на настоящей записи. Гитарные темы разнообразные на протяжении всей пластинки.
    Тимофей и группа зажигают всю дорогу, поют хором, что-то кричат, дудка размера, который нет необходимости чем-либо компенсировать.
    Сам Тимофей играет на нанайских инструментах, хрипит, поет севшим голосом, несколько раз отдает должное любимому режиссеру
    Кустурице под румынско-сербские мотивы. Цирк с конями!


    Конечно, всегда приходится делать скидки, если по гамбургскому счету, но пластинка оказалась удачной и оставила приятное
    впечатление, и звуком, и подбором материала, оригинальной стилистикой, и, почти что, концепцией. Я думаю, что ее будет
    интересно послушать тем, кто интересуется отечественным блюзом.'
- id: 873
  author: Разные авторы
  mark: 7
  date: '2005-09-30'
  text: 'Блюз из Владимира? Судя по номеру машины, на фоне которой сфотографирован ансамбль, так оно и есть. И парни сделали
    первый альбом, который удался. Это крепкая блюзовая пластинка, в которой есть отдельные недостатки. Такое мощное рок-н-ролльное
    (и свинговое) оружие, как тенор-саксофон записан как-то стыдливо. Зато гитары хоть отбавляй – ну, понятно, это же все-таки
    блюз-бэнд. Впрочем, гитарист, забрав на себя все внимание, оказывается на высоте. И его солирование в свете традиции очень
    убедительно. Вот погодите, лет через 7-10 он так вырастет, не узнаете! Может быть не так изощрен его аккомпанемент, но
    это тоже нарабатывается, если человек не зашорен и черпает из разных стилей. Если гитарные партии стандартны, то дудка
    и в аранжировке изпользована довольно скромно. И это тенденция: наши блюзмены и рок-н-ролльщики пробуют почву, осваивая
    свинговое наследие – духовые аранжировки. Которые джазмены, кстати, впитывают с молоком педучилища.


    В песне Bad Bad Whiskey гитара с саксом наконец-то начинает взаимодействовать, как у Луи Джордэна или Билла Хейли. Что
    еще подкупает у ШАНТАЖИСТОВ, так это их взаимодействие как группы, в том числе, вокальное. Все 5 музыкантов поют, и хотя
    в основном это пение сводится к радостным, бодрым и призывным крикам, воплям и воям, блюзмены вторят солисту с рок-н-ролльным
    отрывом. Это зовет слушателя посетить их концерт, и – простите за вольность – может даже покричать заодно с ними. Не за
    этим ли мы ходим на концерты?


    Певец поет голосом 27-летнего беззубого полупьяного негра, и иногда его английское произношение органично сочетается с
    вокальной манерой. На самом деле, это не совсем блюзовый альбом в понимании блюзовых пуристов. Ибо ритмы и инструментальный
    набор здесь, скорее, рок-н-ролльный и свинговый. Есть реверансы в сторону этники (Blues for Kusturica), бита и твиста,
    мамбо-бита (Ooh La La), психоделики (Brujo). В одном месте бэнд из джамп-н-джайва "сваливается" в польку-клезмер в духе
    Кустурицы.


    Диск, скорее, ритм-н-блюзовый. И это хорошо, ибо слушать гитарные запилы в 13 песняках мне не под силу. Здесь множество
    заводных танцевальных вещей с хорошим ощущением "джампа", когда подчернута вторая доля – "ум-ПА" вместо обычного "УМ-па".
    Жаль, что это делает только ударник. Это могли делать и гитары, и пианист, приглашенный на одну песню в стиле "шаффл".
    Ну и куда ж без медленной баллады с хрустальной гитарой! Разнообразие – это чудесное качество в музыке.


    Да, порой вещи затянуты – ряд гитарных соляков, приемлемых на концерте, в студии можно было бы сократить. Порой ритмически
    однообразны – 1-2 песни можно было бы выбросить из альбома без ущерба, музыканты сами почувствовав это, внезапно заканчивают
    Why don''t you eat where you slept last night. Или хотя бы поставить 4 однотипных вещи на диске вразнобой. Но в целом
    альбом тянет на 3-4 звездочки, а танцоры буги-вуги эту пластинку оценят, ведь для свинговых танцев важен постоянный ритм
    с хорошей "пружиной". А этого у ШАНТАЖИСТОВ хоть пруд пруди! <p align="right">Олег Усманов'
- id: 872
  author: Разные авторы
  mark: null
  date: '2005-09-30'
  text: 'Альбом владимирской группы Blackmailers - это действительно событие! В первую очередь, разумеется, блюзовое, но не
    только. Уже достаточно многим известны их яркий драйв и характерная стилистика веселой и забойной музыки. В последнее
    время группа сильно повернула в сторону Jump & West Coast blues, и все это тоже замечательно слышно на их новом диске.
    Однако, уже из названия Zlatno Zrno Blues становитася ясно, что традиционный блюз - не единственное, что составляет сущность
    представленной музыки, и музыканты вовсе не ограничились переработкой стандартов с соблюдением формальных правил и использованием
    заимствованных идей и эмоций. Это формирует самое главное, на мой взгляд, достоинство диска - его честность и натуральность.
    Ко всему прочему, этот альбом действительно может называться концептуальным, благодаря уникальной и цельной смеси музыкальных
    идей, эмоций и звучания.


    Теперь попробую кратко описать те вещи, которые особенно запомнились в отдельности. В первую очередь это яркий, эмоциональный
    и очень содержательный вокал. Очень хорошо записанная, и очень хорошо сыгранная гитара. В целом замечательная ритмика
    и драйв. Оригинальные аранжировки. Особого внимания заслуживает Blues for Kusturica, который также можно назвать Ronnie
    Earl meets Emir Kusturica. Очень много неподдельного веселья. Стильное и характерное оформление диска.


    Можно долго рассуждать, насколько близко к оригиналам и канонам исполнения сыграны классические блюзовые вещи, насколько
    хорошо прописаны, и сведены все инструменты (а надо сказать диск весьма неплохо звучит), однако в первую очередь хочется
    сказать спасибо ребятам за то, что они занимались настоящим творчеством, а не каким то прилежным исполнительством. Занимались
    тем, что действительно можно назвать самовыражением и соответсвенно тем, что может быть достойным внимания не только как
    этнографический казус "Эти русские опять играют Блюз".


    <p align="right">Владимир Русинов</a>'
