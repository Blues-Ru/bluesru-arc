- id: 1106
  author: Федор Романенко
  mark: 7
  date: '2007-07-07'
  text: 'Второй диск Блекмейлерз, несомненно, продолжает стилистическую линию, взятую в первом Zlatno Zrno Blues. Самобытная
    смесь свинга с балканщиной. Первый диск был более эклектичным, чистой воды удачным сборником хитов разных жанров с характерно-узнаваемыми
    для Блекмейлерз находками. А уж во втором диске и концепция, и стилистическое единство.


    Слушать диск по первому разу, конечно, также интересно, как и первый. Еще лучше зашлифованы аранжировки у дудок. Удивительно
    хорошо, непонятно, откуда берется такая филармоническая премудрость? Причем, как в свинговых номерах, так и в балканщине.
    Вроде, срисовывать-то не у кого!?… Хотя, если на балканщине звучание чисто-совершенно, то при переходе к свингу чувствуется
    рвение духовых вперед, вступающих чуть раньше слабой доли. Это было и раньше, но стало лучше слышно на записи более высокого
    качества.


    Что же изменилось по-большому с предыдущего раза? Конечно, очень заметно, как Тимофей искренне ударился в духовную и душевную
    музыку в виде спиричуэлз, госпел или баллад. Легкомысленных песен на диске осталось мало (их вообще там мало, пластинка
    короткая). Создается ощущение, что Тимофей решает свою личную миссионерскую задачу отчасти в ущерб художественно-эстетической.
    На мой взгляд, в искусстве сдержанность по части вечных тем диктуется не столь фальшью и ханжеством, а соображениями художественной
    достоверности и стилистической выдержанности. Утопить Муму каждый автор сможет, а вот сделать это так, чтобы читатель
    воспринял инцидент как личную трагедию…. Тут нужен тонкий подход.


    Но Тимофей сделал свой выбор для этой пластинки, он не умеет жить наполовину. Его голос звучит весьма фактурно, налицо
    проявившееся вибрато, прибавляющее волнительности. Голос хорош, однако, если углубляться в детали, то призакрытый рот
    добавляет к вибрато немного каши, которой не должно быть у великих соул-певцов. Пожалуй, тоскуешь по демоническому образу
    Мистера Зло, который запел вдруг духовно, совсем забросив чарующий грубо-легкий жанр. Хорошо ли это? Вспоминается Гомес
    Адамс, который при смерти, страдая от тяжелейшего недуга "замещения", побелел волосами и запел "Swing Low, Sweet Chariot".
    Хочется процитировать – "Кто же ты, Фестер? Тот отвратительный монстр-недоумок, которым ты был? Или отвратительный монстр-недоумок,
    которым ты стал??...."


    Хотя пластинка весьма на уровне, но, кажется, побольше эклектики было бы лучше. Про отдельные песни говорить, наверное,
    не стоит, лучше один раз послушать. Больше всего понравился старый хит "Well, Well, Well". Почему-то сразу после исполнения
    Блекмейлерз стало ясно, что именно с нее Бюль-Бюль-Оглы срисовал песню про "Учкудук, три колодца".


    Итого, неплохая пластинка, сравнивать у нас не с чем. Однако ж, мне ближе легкий и стильный жанр сыроватой первой. Но
    вспомним про обложку, она восхитительна! Своей концепцией "рай на помойке" она, несомненно, оставляет пути к отступлению,
    "а у нас-то была фига в кармане", чтоб никто ниче не подумал. Ладно, доллар им судья. Надеюсь, что в муках творческих
    исканий группа все-таки познает свое супер-эго.'
