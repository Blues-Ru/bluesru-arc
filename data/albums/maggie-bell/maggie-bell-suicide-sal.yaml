  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-19'
  text: 'Второй и лучший сольный альбом бывшей солистки Stone the Crows, записанный
    по итогам турне в поддержку удачного дебютного альбома с помощью Питера Гранта
    с гостевым участием Джимми Пейджа (соло на If You don''t know), и изданный на
    лейбле SwanSong. Пластинка получилась более энергичная и жесткая, чем дебютник,
    и характеризуется чувством "живой" записи, отражающей атмосферу концертов, которые
    Мэгги и ее группа давали в перерывах между записью треков альбома.


    Продюсером этого альбома, как и дебютного, также был Джерри Уэкслер. Альбом был
    записан на студии Ринго Старра, который часто заглядывал "на огонек" во время
    записи. Suicide Sal - сценический псевдоним тетки Мэгги, которая была чрезвычайно
    известной королевой мьюзик-холла в Шотландии. Заглавная песня написана Мэгги с
    помощью ее друзей, вторая авторская песня - If You Don''t Know - написана клавишником
    группы Мэгги Питом Уингфилдом. Еще один трек принадлежит перу бывшего коллеги
    по Stone the Crows ударника Колина Аллена и Зута Мани, остальные треки представляют
    собой каверы, включая битловский трек со слегка измененным текстом.


    Альбом хорошо продавался, но особой популярностью он пользовался в Америке и Германии.
    Лучшая сольная работа одной из лучших блюзовых и соул певиц Великобритании и шотландской
    королевы блюза.'
