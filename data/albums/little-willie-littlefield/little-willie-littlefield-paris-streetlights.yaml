  date: '2014-09-16'
  text: 'Певец и пианист, он записал несколько ритмэндблюзовых хитов на заре 50-х.
    И ему самому было под 50, когда он женился на голландке и обосновался в Европе
    на ПМЖ, продолжив давнюю блюз-пианистическую традицию.(c) блюзовый календарь


    Эта сольная запись сделана в первый европейский визит на фестивале San Francisco
    Blues Festival. Идеально запечатлен удивительный шарм его игры, эмоциональность
    и красота его голоса.


    Выступал и ездил в туры на протяжении 50ти лет(Америка, Япония, Австралия) и только
    в 2000м году решил немного отдохнуть. Но в 2006м вернулся к активной деятельности:


    "В течение пяти лет я ходил ловить рыбу и теперь я знаю каждую сельдь в Голландии
    по имени - мне это наскучило. Я прекрасно себя чувствую и хочу вернуться к моим
    слушателям"


    Последние годы жизни снова выступал на различных фестивалях, преимущественно в
    Великобритании. Умер в 2013 году от рака. Маленькому-маленькому Вилли был 81 год.


    Послушать можно тут https://vk.com/wall-13370755_3397'
