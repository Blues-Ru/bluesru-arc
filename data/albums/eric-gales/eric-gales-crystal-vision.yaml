- id: 1452
  author: Андрей Евдокимов
  mark: 6
  date: '2009-02-05'
  text: 'За 7 лет до появления на свет Эрика Гейлза Deep Purple сделали всемирно-известной
    песню Джо Сауса "Hush". Шли годы, наш клиент мужал, а "Hush" превратилась в золотую
    классику, записанную в сотне вариантов. Пришел час Гейлза внести свой вклад в
    копилку: "Hush" - единственный кавер в его новом альбоме. Финальный трек годится
    для сборника лирических баллад Bon Jovi. А роскошный слоу-блюз на семь с половиной
    минут "Freedom From My Demons" сыгран a-la S.R.Vaughan образца 1983г. Все прочее
    – цельный тяжелый блюз-рок и агрессивный фанк, принципиально грузный, как вся
    продукция лейбла. Сочиняет Гейлз хорошие песни, или не очень – понять нелегко.
    Над всем довлеет гитара. Именно ценителям электрогитарной музыки и адресован альбом:
    виртуозный, интенсивный, изобретательный.'
