  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2012-08-16'
  text: 'Если честно, меня альбом не впечатлил - очередной техничный гитарист со среднестатистическим вокалом и невысокими
    композиторскими способностями. А за счет "помощи" Майка Варни (хозяина Шрапнели) диск и вовсе потерял какую-либо выразительность
    (если она и была!), превратившись в очередной блюз-роковый клон от Blues Buro International.


    Впрочем, это мое личное мнение - можете ознакомиться и определиться самостоятельно.'
