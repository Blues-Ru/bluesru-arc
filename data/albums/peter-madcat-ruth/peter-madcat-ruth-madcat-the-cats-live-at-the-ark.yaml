  date: '2008-10-14'
  text: '<img src="http://bp1.blogger.com/_IWqfvyO_nw8/SF0Y63O7cEI/AAAAAAAAEp0/KcUyIRsjKDM/s400/BLOGmadcat.jpg"> Peter ''Madcat''
    Ruth - это musician''s musician. Его знают или люди, увлекающиеся игрой на гармонике (он выпустил 2 замечательных учебника,
    раскрывающих секреты его игры, а также фирма Shaker выпускает сконструированные им специальные микрофоны для этого инструмента),
    или настоящие меломаны - Питер играл в группе "Sky King", с Dave Brubeck и другими стилистически совершенно разными музыкантами.
    В 80-х он начал свою сольную карьеру, а с начала 90-х играет с гитаристкой Shari Kane в разных группах. У него не так
    много альбомов и их довольно сложно купить, по крайней мере, мне они попадаются очень редко.


    Этот альбом - запись концерта Питера. Рут поет, играет на гармонике и калимбе, а так же с ним в группе участвуют: Shari
    Kane (guitars), Perry Robinson - clarinet, Ruben Alvarez - drums, Kevin Maul - lap steel, Chris Cameron - piano, Jason
    Bockeloo - bass. Очевидно, что с таким составом можно играть любую музыку, не только блюз, что собственно Питер и делает.
    Начинается альбом "St. Louis Blues" - довольно традиционная для этой композиции аранжировка, кларнет звучит тут очень
    уместно; "Watching The World Roll By" - этно\ворлд мьюзик, Питер использует калимбу, барабанщик переключается на перкуссию,
    эта тема похожа на ту, что звучала в фильме "American Beauty", с помощью примочек гармоника Питера звучит почти как аккордеон;
    далее идут "La Cucaracha" и "Take Five"; "Kwahari" - интересная африканская композиция, мало кто играет на гармонике такую
    музыку (в голову приходит только Roland Van Straaten) - Питер очень интересно сочетает гармонию и мелодику такой музыки
    с игрой на гармонике в стиле Сонни Терри; "Jericho" - отличный джаз c латиноамериканским оттенком и классным свингом -
    Питер неплохо поет и переключается на хроматическую гармонику; далее идут две архиклассические "Driftin'' & Driftin''
    " и "On The Road Again"; "Mountain Soup" - бодрый и интересный джаз с сильным фанковым оттенком, Питер использует примочки
    для игры на инструменте - звучит прямо как Lee Oskar; заканчивается альбом развеселой классикой "Oh When The Saints Go
    Marching In".


    Не смотря на то, что Питер владеет премией Грэмми, играл с огромным количеством известных музыкантов, был признан лучшим
    харпером года обществом "SPAH" (The Society for the Preservation and Advancement of the Harmonica), он остается довольно
    неизвестным музыкантом, что не мешает ему постоянно искать новые пути для своей музыки - этот "живой" альбом лишнее тому
    подтверждение!'
