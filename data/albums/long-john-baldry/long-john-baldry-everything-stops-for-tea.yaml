  author: Сергей Исправников
  mark: 9
  date: '2009-07-11'
  text: 'На диске переиздан второй альбом Длинного Джона Болдри для лейбла Warner, как и предыдущий спродюссированный Элтоном
    Джоном и Родом Стюартом. По словам самого Болдри, этот диск представляет собой образец британского ритм-энд-блюза, музыки,
    которая игралась в клубе Marquee в "золотые деньки" начала 60-х гг. В отличие от предыдущего альбома 1971 г. здесь подчеркнута
    именно "английскость", которая отражается не только в подборе композиций, но и в художественном оформлении пластинки.
    Обложку диска нарисовал на этот раз не участвовавший в записи Рон Вуд, вспомнив навыки, полученные в свое время в художественной
    школе. На ней Болдри предстает в образе кэрролловского Сумасшедшего Шляпника, сидящего за столом в компании Алисы, Сони
    и Мартовского Зайца.


    Запись альбома проходила параллельно в лондонских I.B.C. Studios и Morgan Recordings Studios в январе-феврале 1972 г.
    Первую сторону пластинки продюссировал Элтон Джон, привлекший к работе своих музыкантов, причем басист Klaus Voorman был
    приглашен по рекомендации Джона Леннона. С первого до последнего трека первая сторона наполнена радостью и весельем. Это
    настроение отражено как в сыгранном в фанковом ключе блюзе Уилли Диксона "Seventh Son", так и в танцевалььной "Yko Yko",
    являющейся одним из ранних образцов world music. Кстати сказать, эта забавная вещь в то время стала хитом в Таиланде.
    Заканчивает первую сторону рок-композиция "Jubilee Clouds", сыгранная в духе той музыки, которую исполняли Род Стюарт
    с группой "The Faces". В самом начале второй стороны диска, продюссированной Стюартом, абсурд происходящего достигает
    своей кульминации в ретро-композиции 30-х – 40-х гг. "Everything Stops For Tea", исполненной Болдри под оркестровый аккомпанемент.
    Из "серьезного" репертуара необходимо выделить фолковую "Mother Ain''t Dead", записанную блестящим дуэтом Болдри и Стюарта.
    Заканчивает диск изящная фортепьянная кода "Armit''s Trousers". Исполнивший ее Ian Armit, по словам Болдри, был изумительным
    пианистом, сумевшим сделать невозможное – играть не хуже самого Отиса Спэнна.


    В качестве бонусов на диске записано несколько раритетов. В первую очередь, это блюз самого Болдри "Bring Me Baby Back
    To Me", исполненный в стиле Хаулин Вулфа на фестивале Mar-Y-Sol в Пуэрто-Рико в апреле 1972 г. Кроме того, две вещи спетые
    дуэтом с певицей Joyce Everson – лирическая баллада "Only Love Can Break Your Heart" и сыгранная слайдом в акустике "I''m
    Just A Rake & Ramblin'' Boy". Сам Болдри не мог выделить какой-то один из двух записанных для Warner альбомов, считая
    их лучшими дисками из тех, что он вообще когда-то записал. Оба они, действительно, хороши из-за нетривиального подбора
    исполняемого материала и высокого профессионализма музыкантов. Болдри надеялся, что они останутся примером андеграундной
    некоммерческой музыки и в рок-истории, и в памяти людей. Судя по настоящему изданию, так оно и вышло, однако сам Болдри
    буквально нескольких месяцев не дожил до их переиздания на CD.'
