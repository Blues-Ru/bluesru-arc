reviews:
- id: 1370
  author: Константин Колесниченко
  mark: 5
  date: '2008-11-18'
  text: 'Да, утверждение Джона верно на все сто процентов. Настоящий блюз играть сложно, тут не обойдешься хорошими вокальными
    данными, виртуозным владением инструмента. Должно быть еще что-то, чувство, вкус, ритмическая пульсация, это довольно
    сложно выразить словами. Первый вопрос, который приходит в голову, получился ли такой блюз у самого Baldry? Мне кажется,
    что сам Джонни далек от этой музыки, по крайней мере, на этом альбоме. А вот, что у него получилось наверняка – это эстрадная
    музыка, которая замешана, на ритм-н-блюзе. Добавьте к этому звучащие с неприятным синтезаторным привкусом ударные и гитары
    (в некоторых песнях это вообще драм-машина) и вы получите музыку, не отличающуюся хорошим вкусом и теплом. Возможно, так
    получилось потому, что альбом вышел не в самое лучшее время для жанра - начало 90-х, ведь слышно, что намерения у Джона
    самые лучшие. Нужно отметить присутствие на этом альбоме некоторых известных музыкантов: Amos Garrett, Lucky Peterson
    (в качестве гитариста) и Terry Evans с Bobby King''ом.'
