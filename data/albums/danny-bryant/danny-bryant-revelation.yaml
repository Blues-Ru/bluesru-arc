  text: 'Joe Bonamassa - "A fantastic guitar player... able to take a Fender Stratocaster and really make it sing..."


    Walter Trout - "What sets him apart is his passion and feeling. Danny''s playing grabs you with its intensity and urgency."


    "When the emotional dust settles, you''d have to say it''s the best album of his career". Classic Rock Magazine


    "It is an incredible journey. "Revelation", then, is aptly named, because it is just that." - 10/10 maximumvolumemusic.com


    Дэнни Брайант - английский гитарист, певец и композитор, который начал играть на гитаре в 15 лет, а к 18 уже стал профессионалом.
    Уже в самом начале карьеры талантливого музыканта заприметил Уолтер Траут, и с тех пор Дэнни стал его протеже. Дэнни в
    свою очередь отблагодарил Уолтера, организовав компанию по сбору средств на трансплантат печени и лечение последнего,
    а также отыграл турне с группой Уолтера, пока тот приходил в себя после операции. Дэнни пользуется заслуженным уважением
    у коллег-музыкантов, и к настоящему моменту записал уже более десятка альбомов.


    Создание альбома Revelation было тяжелым в эмоциональном плане, поскольку за полгода до этого Дэнни потерял отца, который
    скончался после долгой и тяжелой болезни. Надо заметить, что на протяжении долгих лет отец Дэнни Кен Брайант играл на
    басу в группе Дэнни и был для Дэнни самым близким другом. Трек Shouting at the Moon посвящен последней ночи, проведенной
    Дэнни с отцом. Естественно, что диск получился чрезвычайно личным и эмоциональным, и вполне оправдал свое название "Откровение".


    Revelation демонстрирует нам повзрослевшего музыканта, который не боится расширить стилистическую и музыкальную палитру
    диска. На диске два кавера (от Джона Мелленкампа и Хаулин Вулфа), остальной материал авторский. Группа усилена периодическим
    подключением духовой секции из музыкантов, с которыми Дэнни гастролировал на момент записи прошлогоднего концертника Big
    (Danny Bryant''s Big Band из 9 музыкантов). Заглавный трек украшен соло трубы Дэвида Мэддисона, которая звучит не только
    роскошно, но и крайне уместно (хотя соло трубы прямо скажем для блюз-рока не слишком характерно). Духовая секция полностью
    подключается на треках Liars Testament, Truth or Dare, Sister Decline и May I have a Talk with You.


    В результате получился очень достойный и достаточно разноплановый альбом современного блюз-рока, который, пожалуй, превосходит
    все предыдущие работы Дэнни Брайанта. Диск получил высокие оценки критиков и стал наиболее продаваемым альбомом музыканта,
    добравшимся до первой позиции в английском Амазоне. Лучшие треки - Revelation, Someday The Rains Will Fall и Yours for
    a Song.'
