- id: 2193
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2015-02-27'
  text: Лет 20 назад Уолтер Траут заприметил молодого парнишку, который лихо управлялся с гитарой, и с тех пор взял его под
    свое крыло. Со временем Дэнни превратился в достаточно зрелого исполнителя и отдал долг своему ментору, приняв активное
    участие в сборе средств на операцию по пересадке печени и последующее медицинское обслуживание Уолтера (который, кстати,
    идет на поправку и даже объявил о возвращении к концертной деятельности в недалеком будущем - дай Бог ему здоровья!).
    Дэнни начал выпускать альбомы с 2002 года, и уже записал их с десяток, тем самым завоевав свое собственное место среди
    ведущих современных британских блюз-рокеров. Его последний сольник - наиболее зрелый и интересный, хотя стилистически
    в музыке явно прослушивается влияние именитого наставника. В принципе, весь диск достаточно приличный и ровный, но последний
    трек особенно хорош.
