- id: 1663
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-11'
  text: 'Ленивый Лестер (настоящее имя Лесли Джонсон) - мультиинструменталист (гармоника, гитара, перкуссия и вокал) и классический
    представитель луизианского свамп-блюза. Родившийся в 1933 году и начавший записываться аж в 1956-м, Лестер уже давно превратился
    в живого классика. Несмотря на почти двадцатилетний перерыв в выпуске пластинок (который был прерван в 1987 году и затем
    в 1988 году очередным диском, записанным для лейбла Аллигатор), Лестер не утратил вкус к блюзу.


    На альбоме 1998 года представлен классический традиционный луизианский блюз с современным звучанием и стилистическим разнообразием.
    Сам Лестер обеспечивает расслабленный вокал, искусную гармонику и гитару. Из звезд в аккомпанирующем составе присутствуют
    Сью Фоли на гитаре, Сара Браун на басу и Майк Бак на ударных.'
