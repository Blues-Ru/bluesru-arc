- id: 1662
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-11'
  text: 'Второй альбом после триумфального возвращения к творческой деятельности классика
    луизианского свамп-блюза был записан на фирме Аллигатор. Ленивый Лестер (он же
    Лесли Джонсон) - живая легенда луизианского блюза, харпер, гитарист, певец и композитор,
    музыкальная карьера которого началась аж в 1957 году и, несмотря на значительные
    перерывы, продолжается и по сей день.


    Расслабленный неспешный "ленивый" южный блюз Лестера оказал влияние на множество
    современных исполнителей блюза, включая Кенни Нила, который аккомпанирует Лестеру
    на данном альбоме. Лестер в свое время играл на гитаре с отцом Кенни - известным
    харпером Руфулом Нилом, хотя самого Кенни тогда еще на свете не было. В музыкальном
    отношении на диске представлен коктейль из блюза, кантри, рокабилли и креольской
    музыки, приправленный изрядной долей юмора. Три трека на диске написаны самим
    харпером, остальное - классика блюза в современной интерпретации Ленивого Лестера.
    В результате получился добротный альбом классического блюза с луизианским привкусом,
    неспешно-расслабленный, как и прозвище блюзмена, записавшего этот диск.'
