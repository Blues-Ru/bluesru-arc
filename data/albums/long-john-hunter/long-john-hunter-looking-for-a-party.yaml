- id: 1601
  author: Андрей Евдокимов
  mark: 6
  date: '2010-01-18'
  text: Увы, самый слабый пункт альбома - вокал. Время не пощадило его великолепный рык. Долгая блюзовая дорога слегка утомила
    его голос. Но аранжировки стали гораздо интересней. Первый сингл - в 1954 году, затем более 30 лет ежевечерних выступлений
    в маленьком клубе приграничного городка Эл Пасо (на память о нем финальный трек Me And Phil) между Мексикой и США . И
    только в 1988-м – дебютный альбом. Игра его на гитаре поразила знатоков удивительной смесью техасского шафла с лаконичными
    выразительными гитарными брейками в манере Алберта Кинга. Мексиканские мотивы и ритмы проглядывают то тут, то там и в
    новом альбоме. Но по стилю он гораздо более разнообразен. В общем, этот альбом на радость любителям "традиционного" блюза
    – хотя именно такую манеру назвали "модерн-блюз" лет 30 или 40 тому назад.
