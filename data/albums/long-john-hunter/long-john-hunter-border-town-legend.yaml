  author: Дмитрий Казанцев
  mark: 7
  date: '2007-09-27'
  text: 'Джон выпустил свой первый альбом когда ему было почти 60. На этом диске ему 65. Интересный голос и гитарная игра,
    симпатичные песни. Традиционному квартету помогает духовая секция. Хантер играет разные стили - от классического электроблюза
    до прифанкованны тем.


    Интересно, но не более того. Не хватает какой-то изюминки на этой записи.'
