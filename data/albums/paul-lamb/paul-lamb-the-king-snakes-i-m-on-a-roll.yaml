  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-05'
  text: 'Пол Лэмб неоднократно признавался лучшим харпером по версии британского блюзового
    сообщества, а его группа PAUL LAMB & THE KING SNAKES не раз становилась группой
    года, выпустив при этом целый ряд лучших блюзовых альбомов.


    I''m on a Roll - альбом настоящего традиционного блюза в современной интерпретации,
    сыгранный титулованными профессионалами с берегов туманного Альбиона. Диск был
    записан в Лондоне и издан в 2005 году, затем переиздан на другом лейбле в 2006.
    Музыка группы и ее фронтмена лишний раз подтверждает, что многочисленные блюзовые
    награды были им присуждены не напрасно. Роскошная игра Пола наверняка понравится
    поклонникам блюзовой гармоники.


    На диске три кавера, остальной материал написан Полом и музыкантами The King Snakes.
    Основной состав для записи был усилен двумя саксофонистами - Ником Лантом (баритон)
    и Ли Бадау (тенор). Продюсировал альбом сам Пол Лэмб.'
