  author: Федор Романенко
  mark: 9
  date: '2003-07-09'
  text: 'Shifting Into Gear - довольно ранний диск Paul Lamb & the King Snakes 1991 года. С нынешним составом группы, записавшим
    основные альбомы, пересечение составляют только сам Paul Lamb и его друг - бессменный гитарист группы Johnny Whitehill.
    Поет и играет на второй гитаре на этом альбоме Chad Strentz.


    Слова Лэмба из буклета: "Ритм-секция на альбоме отличается от той, что играет в основном составе сейчас, но все магические
    ингредиенты там присутствуют. Джонни Уайтхилл, мой давний соратник, был в потрясающей форме, и Chad Strentz, который незадолго
    до этого присоединился к нам, выступил блестяще, как мы все от него и ожидали".


    На диске записаны многие хиты группы, некоторые их которых Kingsnakes продолжают играть спустя 10 лет на своих концертах.
    Это – "Come on, Everybody", "One More Time", "I Need Somebody To Love". Пластинка – отличная, хотя, наверное, звучание
    на сегодняшний день отличается немного в лучшую сторону. Но это свойственно вообще записям Лэмба - некоторая студийная
    сдержанность на альбомах и полная раскованность на концертах.


    Песни на альбоме написаны почти в пополаме - 7 при участии Уайтхилла и 5 - Лэмбом частично или полностью. В каком-то смысле
    великолепный гармонист Пол Лэмб является только условным лидером группы. Он не поет, пишет не все песни и пр. Тот же гитарист
    Уайтхилл играет в группе не меньшую роль. Группа Кингснейкс – это редкий случай, когда в группе собрались равные музыканты
    суперклассного уровня, и все заслуживают всяческих похвал. В качестве иллюстрации можно привести историю первого приезда
    Лэмба в Москву, когда вокалист Эрл Грин потерял паспорт и остался в Бельгии. Тогда басист на ура, с чувством и на уровне
    не только сыграл, но и спел всю программу.


    Несмотря на то, что пластинка довольно старая, я бы порекомендовал ее как одну из первых для ознакомления с творчеством
    Paul Lamb & the King Snakes.'
