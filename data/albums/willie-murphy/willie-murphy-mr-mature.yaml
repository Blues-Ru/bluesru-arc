  author: Дмитрий Казанцев
  mark: 4
  date: '2005-04-02'
  text: Да уж, 80-е годы; изначально блюзовый и корневой человек записыват диск с программингом и играет на синтезаторах.
    Голос-то у него живой, а звуки пластиковые - очень странное сочетание. Получается такой сплав ритм-н-блюза и корневой
    волны. Слушать можно, но получать много удовольствия - вряд ли.
