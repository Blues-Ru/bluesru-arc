- id: 126
  author: Алексей Калачев
  mark: 6
  date: '2003-05-29'
  text: 'Три альбома, три чернокожих пианиста-классика, которые должны быть одинаково близки сердцу поклонников чикагского
    фортепиано. Их объединяет: место создания (Франция), первоклассные музыкальный уровень и составы музыкантов, отменный
    звук и фирма-создатель "Black & Blue". Слим играет и поет сам, без сопровождения, Мэбон и Лик с типичными чикагскими ансамблями.'
