- id: 324
  author: Дмитрий Казанцев
  mark: null
  date: '2003-12-02'
  text: 'Полная коллекция всех 29 блюзов легендарного Роберта Джонсона на двух дисках плюс альтернативные версии 12 треков:
    Kind Hearted Woman Blues, Ramblin'' On My Mind, When You Got A Good Friend, Come On In My Kitchen, Phonogragh Blues, Cross
    Road Blues, Little Queen Of Spades, Drunken Hearted Man, Me And The Devil Blues, Stop Breaking Down Blues, Love In Vain
    Blues, Milkcow''s Calf Blues. Единственная проблема этого "комплита" - это то, что версии расположены сразу после основных
    треков, а не на отдельном диске, например.


    Диск отлично оформлен (фото, стиль Vocalion Records 30-х годов, 60-страничный буклет с текстами и полной историей записи
    и жизни Роберта. Владея этим двойником, Вы владеете всем наследием гения Джонсона. Он умер странной смертью в 27 лет и
    оставил всего 29 песен, но остался, пожалуй, самой заметной, загадочной и легендарной фигурой в блюзе за всю его столетнюю
    историю.'
