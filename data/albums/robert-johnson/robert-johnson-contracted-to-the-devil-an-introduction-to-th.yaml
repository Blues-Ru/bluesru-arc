reviews:
- id: 303
  author: Кирилл Мошков
  mark: 8
  date: '2003-12-01'
  text: 'Опять же: как можно оценивать абсолютную классику? Интересоваться блюзом (не говоря уж о том, чтобы любить его всерьез
    или, тем более, играть) и не знать творчества Роберта Джонсона, таинственного гитариста с Юга, с именем которого связано
    множество легенд - невозможно. Другое дело, что все и знают в основном только легенды - о том, что юный Джонсон толком
    не умел играть, хотя очень хотел, потом пропал но полгода, а когда вернулся - гитара и голос его звучали с таким совершенством,
    что все буквально сходили с ума, услышав его. И все потому, что он заключил сделку с дьяволом (ночью, на перекрестке,
    конечно же). Легенды были придуманы самим Джонсоном и декларировались им в соответствующих записях - они присутствуют
    здесь: "Me And The Devil Blues", "Crossroad Blues". В канон они были возведены кинофильмом "Перекресток" ("Crossroads",
    1986), где юный белый блюзмен отправлялся на Юг, чтобы отыскать потерянную песню Джонсона.


    Правда в том, что Джонсон умело вычленил из хаотической игры и неуверенного пения своих предшественников и современников
    ряд исполнительских приемов (как в вокале, так и в игре на гитаре), заучил эти приемы, отточил до совершенства и таким
    образом создал первый канон блюзового исполнительства, который за ним начали копировать и изучать блюзмены следующего
    поколения - Мадди Уотерс, Элмор Джеймс и т.п. Точно так же он собрал из старых блюзов характерные строчки и бродячие сюжеты,
    создав в своих песнях пусть неоригинальный, но эстетически завершенный свод блюзовой поэтики. Правда в том, что в 1936
    и 37 годах он сделал в Сан-Антонио и Далласе канонические записи своих сочинений-компиляций, всего около трех десятков
    треков, которые и стали первым блюзовым Сводом Законов. Правда и в том, что ревнивый муж любовницы убил 27-летнего Роберта
    16 августа 1938 г. в Гринвуде, Миссисипи. Так что когда парой лет позже на Юг приехал знаменитый фольклорист Алан Ломакс,
    чтобы найти и записать Джонсона, было уже поздно: миф завершился.


    Переиздавать записи Джонсона в результате можно до бесконечности, что и происходит каждые пять лет. Columbia адресует
    новое переиздание (в прошлый раз оно, ровно с тем же набором песен - из всех существующих выбрано 24 - выходило в 1997-м)
    начинающим, тем, кто знакомится с Робертом Джонсоном впервые. Странно, но никакой информации ни о самом музыканте, ни
    хотя бы о датах записи в буклете не содержится. Ремастеринг тоже не поражает воображение (тем более что исходные записи
    имеют очень низкое качество). Хотя магия Роберта Джонсона говорит за себя сама, начинающему можно было бы рассказать о
    нем хоть что-нибудь.'
