reviews:
- id: 377
  author: Дмитрий Казанцев
  mark: 10
  date: '2003-12-20'
  text: А вот и самая КЛАССНАЯ и необходимая компиляция Уотерса! Такие великолепные 12 треков трудно себе представить! Тускнеют
    даже 2 сборника Real Folk Blues! Тут есть Sugar Sweet, Trouble No More, Don't Go No Further, I Love The Live I Live...;
    все треки разные, яркие, абсолютно уникальные по звучанию и аранжировкам! После Folk Singer на второе место у Мадди я
    бы поставил именно этот сборник! Жаль, что Мадди записал так мало хороших номерных альбомов, но не будем забывать, что
    он 1915 года рождения и поздно стал записываться.
