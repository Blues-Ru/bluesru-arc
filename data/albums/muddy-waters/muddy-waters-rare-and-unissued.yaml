  date: '2003-12-20'
  text: Еще одна интересная и необходимая в коллекции компиляция Мадди. Сборник составлен Диком Шурманом из самых ранних записей
    Мадди. Название говорит само за себя; это редкие записи, которые не издавались на АЛЬБОМАХ до этого. Здесь есть записи
    еще на лейбле Аристократ 48 года! Качество записи местами совсем скверное, конечно, но музыка в полном порядке! Многие
    треки здесь еще совсем близки к дельта-блюзу; не будем забывать, что он Muddy "Mississippi" Waters.
