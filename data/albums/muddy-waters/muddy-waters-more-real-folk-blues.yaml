reviews:
- id: 374
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-12-20'
  text: 'Через два года после Real Folk Blues Чесс выпускает еще одну 12-трековую
    компиляцию блюзов Мадди 50-х годов. Еще один альбом настоящей классики послевоенного
    блюза. Все вещи кроме Kind-Hearted Woman написаны самим Мадди и все они отличные
    как и на первом сборнике! Если Вы уже владеете альбомом Real Folk Blues, то обязательно
    купите и его вторую часть! Есть английское издание на BGO Records, где собраны
    оба альбома.


    Есть проблемы с компановкой альбома и разницей в громкости треков; даже странно,
    что составители так наплевательски к этому отнеслись.'
