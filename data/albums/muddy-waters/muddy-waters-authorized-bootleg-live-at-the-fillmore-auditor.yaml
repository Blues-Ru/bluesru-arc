  author: Сергей Исправников
  mark: 9
  date: '2009-07-28'
  text: 'Данный диск выпущен в серии "Authorized Bootleg", издаваемой Universal Music Group, наряду с концертами рок-групп
    "Cinderella" и "Lynyrd Skynyrd". На альбоме представлена компиляция из трех выступлений Мадди Уотерса в Сан-Франциско
    с 4 по 6 ноября 1966 г. в легендарном зале Fillmore Auditorium. Эта концертная площадка, открытая продюсером Биллом Грэмом,
    была центром калифорнийского эйсид-рока и местом притяжения рок-музыкантов со всей Америки. Благодаря активности британских
    блюз-рокеров, имя Мадди Уотерса становилось культовым и для молодых белых американцев. Собственно говоря, эти концерты
    свидетельствовали об интересе нового поколения, в первую очередь, хиппи, к музыке 51-летнего блюзового патриарха. Летом
    того же года на фирме Chess был записан очередной альбом Уотерса "Muddy, Brass & The Blues", вызвавший нарекания многих
    его поклонников за включение духовой секции и приджазованный характер аранжировок. Надо сказать, что на данных концертах
    не только не исполнялась ни одна песня с этого альбома, но и сама музыка кардинально отличалась – игрался утяжеленный
    вариант классического чикагского блюза с продолжительными инструментальными вариациями. Что касается репертуара, то это
    были вечно молодые хиты Мадди, звучавшие уже лет десять-пятнадцать: "Hoochie Coochie Man", "Rock Me", "Got My Mojo Working"
    и т.д.


    Концерты проходили в рамках ежегодного "Muddy Waters Revue". Для этих гастролей Мадди предложил присоединиться к группе
    выдающемуся исполнителю на губной гармонике Джорджу Смиту, украсившему своими соло большинство концертных номеров. Гитарные
    партии исполнили Лютер "Georgia Boy" Джонсон, начинавший играть еще с Элмором Джеймсом и периодически выступавший с Мадди
    в 60-е гг., и Sammy Lawhorn, штатный гитарист бэнда Уотерса с 1964 г. В начале каждого концерта группа играла пару инструменталов
    для разогрева публики, потом появлялся сам "король чикагского блюза", чтобы исполнить серию своих стандартов. На диске
    записаны композиции только с участием Мадди Уотерса, некоторые из них приведены по два раза в разных исполнениях. Диск
    великолепно записан, оригинал фонограммы взят из архива Билла Грэма, выступающего здесь под псевдонимом Wolfgang. Данный
    альбом органично дополняет концертную дискографию Мадди, занимая достойное место между его классическими "живыми" альбомами
    "At Newport" (Chess, 1960) и "Live at Mr.Kelly''s" (Chess, 1971).'
