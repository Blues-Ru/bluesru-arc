  text: Странный и непонятный сборник, который фирма Чесс выпустила в 1974 году. 6 треков Мадди с сессий "Fathers And Sons"
    и 7 песен Вулфа с "London Sessions". Оба альбома были в продаже в те годы, они были переизданы и на компакт-диске; неясно
    зачем издавать такую убогую и вторичную компиляцию.
