reviews:
- id: 41
  author: Алексей Калачев
  mark: 8
  date: '2002-10-26'
  text: В заголовке альбома не говорится главное – это альбом Мадди Вотерса. И Отиса Спена. То, что он записан в компании
    представителей нового и белокожего поколения блюзменов Пола Батерфильда и Майка Блумфилда, - дело важное, но - второе.
    Это по-прежнему, пластинка главного блюзового ПЕВЦА 20 века. "В виниле" Fathers and Sons был двойным – на первом LP студийный
    материал, на втором концертный. В прошлом году диск получил премию В. Хенди "как лучшее переиздание" классики. Чем он,
    вне сомнения, и является. Прибавьте к этому прекрасное качество звука и драйв, приданный хрестоматийному вотеровскому
    материалу молодыми горячими ребятами.
- id: 767
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-07-22'
  text: 'Грандиозный проект фирмы Чесс - собрали черных и белых из Чикаго (и не только), и записали этот двойной альбом (первый
    диск студийный, второй - концертник). Мадди Уотерс выступает как лид-вокалист, Отис Спэнн - штатный клавишник, трое из
    Butterfield Blues Band (Сэм Лэй - ударные, Майк Блумфилд - гитара, Пол Баттерфилд - гармошка), на басу - великолепный
    Дональд Дак Данн (Booker T & The MGs и т.д.), на концертнике на барабанах - гениальный Бадди Майлз (они с Майком играли
    в Electric Flag в тот момент). Состав очень мощный и профессиональный, как видите; Мадди звучит как заправский блюз-рокер
    с такой поддержкой (это интересно, надо сказать). Я не буду подробно описывать кто и как где играет - все великолепные
    солисты, тут они подтверждают это еще раз.


    Есть одна, но серьезная проблема - тут почти нет нового материала, они снова переигрываю старые, известные всем блюзовые
    "стандарты". Это хорошо, конечно, но я не могу поверить, что Мадди и тусовка не могли написать десяток новых тем к такому
    грандиозному проекту.'
