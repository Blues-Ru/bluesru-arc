- id: 381
  author: Дмитрий Казанцев
  mark: 4
  date: '2003-12-20'
  text: 'Мадди - великий музыкант и блюзовый лидер, но иногда кажется, что он потерял реальность в середине 60-х. Странные,
    смазанные альбомы конца 60-х и, наконец, вот этот диск из серии Made In London. Играют британцы не так и не то. Они этого
    не слышали и не понимали, но Мадди и продюсеры были просто обязаны это слышать. Особенно странно звучит ритм-секция (Митч
    Митчелл и блюз - вещи несовместимые) и духовые; просто ужас местами. 9 знаменитых, но изуродованных блюзов.


    Оценка 2 балла. Что самое странное, есть лондонские сессии других блюзменов, которые звучат очень прилично. Не советую
    этот диск простым любителем блюза; он только для фанатов Мадди и комплетистов (типа меня).'
