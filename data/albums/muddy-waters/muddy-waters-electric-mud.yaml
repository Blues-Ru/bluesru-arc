reviews:
- id: 769
  author: Дмитрий Казанцев
  mark: 2
  date: '2005-07-22'
  text: 'Пожалуй, это самый плохой и безвкусный альбом Мадди. Маршалл Чесс решил попробовать
    Уотерса в роли психо-блюз-рока а-ля Хендрикс. Результат ужасен - музыки почти
    нет. Странные монотонные запилы на гитарах, какие-то дудки (зачем они тут?), клавиши
    играют по блюзу, но тут это не надо. И над всей этой кашей голос Мадди и его старые
    песни типа "I Just Wanna Make Love To You", "Hoochie Coochie Man", "Mannish Boy".


    Если и делать такой странный проект, то хоть новых песен что ли написать надо.
    Вместо этого Мадди поет "Let''s Spend The Night Together" (Stones) - это просто
    ужасно, честное слово. Я не знаю о чем думал мистер Чесс, но это позор для Мадди
    и студии.'
- id: 1344
  author: Антон Ворожеев
  mark: 8
  date: '2008-10-21'
  text: 'Electric Mud – самый необычный альбом Мадди Уотерса.


    На нем 8 песен, большинство из них знает каждый – блюзовая классика I''m Your
    Hoochie Coochie Man, I Just Want To Make Love To You, Mannish Boy. А также кавер
    на Роллинг Стоунз – Let''s Spend The Night Together. Почему именно так?


    В 1968 году, после многолетнего успеха групп вроде тех же Роллингов, которые в
    основу свою положили именно блюз, но в чистом виде его никогда не играли, Мадди
    решил записать альбом в ином звучании, нежели он играл в то время. В итоге, альбом
    вышел отчасти мощным блюзовым, как это всегда делал Уотерс, а отчасти роковым
    и психоделичным. Это получилось очень круто. А когда я слушал альбом впервые,
    не зная этой подоплеки, я недоумевал, откуда взялись такие странные аранжировки.


    Хоть критики и попытались разнести пластинку в пух и прах, коммерчески альбом
    был очень успешным, разошелся более чем 100 000 тиражом, занял 127 позицию в чартах
    Billboard и даже послужил источником вдохновения для Джона Пола Джонса.


    В записи альбома не принимали участие никакие хедлайнеры, это был обычный ансамбль
    – три гитариста (которые, между прочим, более джаз в то время играли), басист,
    саксофонист, барабанщик, клавишник. Примечательно, что сам Мадди Уотерс тут выступает
    только в роли вокалиста, гитарные партии целиком доверены другим.'
