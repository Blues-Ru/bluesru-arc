reviews:
- id: 889
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-10-18'
  text: 'Этот альбом очень редкий, его нет на КД (есть только редкое японское издание
    2-в-1 вместе с Can''T Get No Grindin'') и трудно найти на виниле. Диск состоит
    из 9 блюзов и длится около 35 минут. На обложке не прописан состав, но слышно,
    что с Мадди тут играет гитарист, гармошечник, пианист и ритм-секция. Все сыграно
    малым составом, без духовых и подпевок (что могло бы быть в 1974 году на диске
    с таким названием). Вообще, название диска не соответствует музыке - на альбоме
    обычный для Мадди Чикаго-блюз а-ля 50-е. С одной стороны это хорошо и привычно,
    но с другой, Woodstock Album (1975) звучит интереснее именно потому, что там Уотерз
    работает в более ритм-н-блюзовом ключе и с ним играют разнообразные музыканты
    (включая участников группы The Band).


    Альбом хорош, он лучше того, что делал Мадди после 1977 года с Джонни Уинтером.
    Здесь есть известные темы Уотерза, сыгранные по-новому: "Rollin'' and Tumblin"
    (длится более 7 минут!) и "Trouble No More". Радует то, что Мадди написал 5 песен
    из 9 и тут много нового материала.'
