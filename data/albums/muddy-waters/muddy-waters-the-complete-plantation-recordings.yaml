- id: 1620
  author: Сергей Исправников
  mark: 8
  date: '2010-03-17'
  text: 'Переизданный в 1997 г. к 50-летию фирмы Chess, данный диск включает все сохранившиеся записи Мадди Уотерса, сделанные
    знаменитым фольклористом Аланом Ломаксом в полевых условиях в 1941-42 гг. Безусловно, впоследствии Мадди являлся одним
    из символов чикагского блюза вообще и фирмы Chess в частности, однако данные сессии никакого отношения к этой компании
    никогда не имели, и включение их в юбилейную серию – не более чем маркетинговый ход. Они были изданы на долгоиграющей
    пластинке "Down On Stovall''s Plantation" фирмой Testament в 1966 г.


    Первая сессия звукозаписи Мадди Уотерса состоялась в августе 1941 г. на плантации Стовалла в Дельте Миссисипи, можно сказать,
    случайно. Дело в том, что в 1941 г. Ломакса как главного ассистента Архива народных песен при Библиотеке Конгресса пригласили
    для совместной работы в Университет Фиска в Нэшвилле. Ломакс считал, что с помощью его черных коллег из этого университета
    полевые записи негритянского фольклора будут более успешными. Однако в Университете Фиска блюз считали слишком вульгарным,
    чтобы быть достойным академического изучения, поэтому основной целью экспедиции стали записи религиозных баптистских песен.
    Во время одной из сессий Ломакс поинтересовался, нет ли поблизости блюзмена, похожего на покойного Роберта Джонсона. Ему
    порекомендовали 26-летнего Мадди Уотерса. К этому времени Мадди помимо работы в поле на плантации несколько лет исполнял
    блюз и стремился к карьере профессионального музыканта. Он даже открыл на плантации небольшое питейное заведение, где
    сам и выступал. С помощью 150-килограммовой мобильной звукозаписывающей аппаратуры Ломакса, позволяющей нарезать 16-дюймовые
    ацетатные диски, были зафиксированы несколько песен Мадди Уотерса и интервью с ним. В записи сохранились только три песни
    Мадди, наиболее интересные из которых – отсылающий к творчеству Роберта Джонсона и Сан Хауса "Country Blues" и "I Be''s
    Troubled", впоследствии переделанная в "I Can''t Be Satisfied" – были изданы под эгидой Библиотеки Конгресса на пластинке,
    два экземпляра которой Мадди получил в начале следующего года.


    Несмотря на вступление США во Вторую мировую войну, финансирование полевых экспедиций для Библиотеки Конгресса продолжалось,
    и в 1942 г. Алан Ломакс снова очутился на Юге, заехав записать и Мадди Уотерса. На этот раз были сделаны как его сольные
    записи, так и в составе местного бэнда "Son Simms Four", куда также входили Percy Tomas (гитара), Henry "Son" Simms (скрипка)
    и Louis Ford (мандолина). Необходимо сказать, что Симмс был еще и неплохим гитаристом, в свое время он играл с Чарли Пэттоном
    и был одним из первых учителей Мадди Уотерса. Записи с группой демонстрируют скорее музыку кантри, чем дельта-блюз, что
    было вполне закономерно – музыканты играли востребованный публикой репертуар. Что касается сольных записей Мадди, то в
    некоторых вещах на второй гитаре ему подыгрывают или "Сан" Симмс, или брат его жены Чарльз Берри. Среди записанных тогда
    вещей выделяются напоминающий Роберта Джонсона "Take A Walk With Me", "You''re Gonna Miss Me When I''m Gone" и редкий
    в репертуаре Мадди спиричуэл "Why Don''t You Live So God Can Use You". В отличие от сессии 1941 г., когда Мадди из-за
    отсутствия собственной гитары играл на одолженном Ломаксом "Мартине", здесь он использовал "National" c деревянным корпусом.
    Как и предыдущая сессия, это были некоммерческие записи, сделанные с научно-исследовательской целью. Тем не менее они
    оказались очень важны для самого Мадди. Как он впоследствии отмечал в интервью, "я впервые по-настоящему услышал себя.
    Раньше я никогда не слышал своего голоса. Я просто пел; пел, как сам чувствовал, потому, что так мы всегда и пели на Миссисипи.
    Но когда м-р Ломакс поставил мне запись, я подумал: мужик, а этот парень умеет петь блюз. Я был удивлен, потому что раньше
    не знал, что пою вот так". Как бы то ни было, на следующий год 28-летний Мадди Уотерс отправился в Чикаго, покорять блюзовую
    сцену.


    P.S. При записи компакт-диска были использованы оригинальные 16-дюймовые ацетатные диски из Библиотеки Конгресса. Специально
    для издания 1997 г. в Лондоне был произведен 32-битный цифровой ремастеринг. Оформление юбилейного европейского издания
    отличается от американского релиза.'
