  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2012-02-03'
  text: 'Невозможно представить себе послевоенную блюзовую сцену (и особенно чикагский блюз) без Мадди Уотерса, который во
    многом определил современный агрессивный чикагский блюз с характерной слайд-гитарой. Мадди Уотерс наравне с Робертом Джонсоном
    является, пожалуй, наиболее цитируемым блюзменом, творчество которого оказало огромное влияние практически на всех корифеев
    блюза сегодняшнего, включая Джона Мэйолла, Эрика Клэптона, Джимми Пэйджа и многих многих других.


    Рожденный под именем МакКинли Морганфилд, Мадди Уотерс стал блюзовой легендой еще при жизни, прославившись не только как
    певец и композитор, но и как незаурядный мастер слайд-гитары. Вместе с Мадди играли практически все известные блюзовые
    музыканты того времени: Литтл Уолтер, Джими Роджерс, Уилли Диксон, Бо Диддли, Джеймс Коттон, Бадди Гай, Уилли Смит, Пинетоп
    Перкинс, Боб Марголин и многие многие другие.


    Данный сборник составлен из более поздних работ Мадди Уотерса, записанных им в 70-е и 80-е для лейбла Blue Skу. В качестве
    продюсера выступал не кто иной, как Джонни Уинтер. Конечно, на сборнике отсутствуют классические работы Мадди 50-х и 60-х
    годов, но вместить наследие фигуры такого масштаба на один (да, собственно, и на два или три) диск практически нереально.
    Так что мы имеем вполне приличный сборник позднего Мадди.'
