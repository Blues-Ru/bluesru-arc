- id: 484
  author: Сергей Колобашкин
  mark: 9
  date: '2004-03-12'
  text: 'Bob Dylan "Bootleg Series Vol. 4: Live 1966" является великолепным изданием
    замечательного бутлега Боба Дилана. В данном случае - это ранний Дилан, которого
    легко узнать по исполнению его вещей. "Bootleg Series Vol. 4: Live 1966" - это
    двойной альбом, в котором взяты его песни типа "гитара + я" и выступление с отличной
    ритм-секцией, а точнее с группой The Band, правда, тогда такого названия еще не
    было. Я не хочу останавливаться на первом диске, так как мало кого заинтерисует
    интерьер Дилановских песен без ритм-секции. Второй диск наполнен теплым блюз-роковым
    звуком. Пластинка начинается с песни "Tell Me, Momma", которая демонстрирует эволюцию
    звука всего рок-н-ролла, что заинтересует многих. "I Don''t Believe You" - это
    вторая песня, в которой встречается замечательный текст и не менее замечательная
    музыка. "Baby, Let Me Follow You Down", как это ни странно, Дилановский взгляд
    на народные песни, чем он частенько занимался! Четвертая песня - это "Just Like
    Tom Thumb''s Blues", которую Дилан поет с исключительной остротой. Наконец-то,
    что-то похожее на блюз "Leopard-Skin Pill-Box Hat". С шестой песни начинается
    эпическое medley "One Too Many Mornings", "Ballad Of A Thin Man" и легендарный
    "Like A Rolling Stone", который искрометно завершает этот альбом. Моя оценка -
    это четыре с плюсом, просто не всем может понравиться первый диск этого концерта
    в Роял Алберт Холле.'
