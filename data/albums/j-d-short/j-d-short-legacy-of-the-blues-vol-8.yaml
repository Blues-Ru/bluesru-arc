  author: Дмитрий Казанцев
  mark: 10
  date: '2005-04-29'
  text: 'Очень интересный блюзмен. Шорт умер в 1962 году в возрасте 60 лет вскоре после записи этой сессии, оставив за собой
    очень мало пластинок. Джей Ди обладал великолепным голосом, прекрасно играл на гитаре, гармошке и других инструментах.
    Он был отличным рассказчиком и автором.


    На этом диске 10 полноценных блюзов, где Шорт рассказывает, поет, играет на гитаре и гармошке. Он очень техничен и его
    игра на гитаре абсолютно уникальна (хотя слышно, что он человек из южной "школы" Дельты). Качество записи великолепное,
    и трудно поверить, что это было записано еще до появления Битломании. Обязательно найдите и купите этот диск - это настоящая
    жемчужина в море блюза.'
