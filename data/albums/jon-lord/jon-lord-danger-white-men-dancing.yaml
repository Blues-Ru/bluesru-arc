- id: 1259
  author: Андрей Евдокимов
  mark: 6
  date: '2008-04-23'
  text: 'Он раскачивал электроорган как злобная нянька – колыбельку. Так было на концертах Deep Purple в те далекие времена,
    когда все были согласны, что Ян Пейс – гениальный ударник, но спорили, кто лучший инструменталист группы: гитарист или
    клавишник. Каким был бы Deep Purple без Ричи Блэкмора, отвечает появившийся лет пять назад проект органиста Джона Лорда
    THE HOOCHIE MAN. Кстати, второй альбом группы включает два гостевых появления вокалиста Deep Purple Яна Гиллана. Печальная
    баллада Over And Over с его голосом – неоспоримая удача. Есть еще три блюзовых стандарта сочинения Уилли Диксона и Дона
    Никса, но большая часть песен альбома сочинена гитаристом Тимом Гейзом и басистом Бобом Дейсли. Но гитары почти неслышно,
    а в целом густое звучание, замешанное на сочетании жужжащего электрооргана и низкой бубнящей бас-гитары заставляет музыку
    вязнуть, как муха в сиропе. Альбом - истинная отрада для тех, кто скучает по белому тяжелому блюз-року 70-х, который тогда
    казался самым важным, что есть в жизни. Остальным лучше не приближаться… О чем честно предупреждает название альбома.


    <small><i>По заказу газеты "Ведомости"</small></i>'
