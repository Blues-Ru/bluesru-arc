  author: Федор Романенко
  mark: 10
  date: '2010-02-15'
  text: 'Tee он же Marc Thijs - относительно молодой бельгийский гитарист, вокалист и продюссер. Он любит и играет соул, R&B,
    блюз, большой эстет относительно всего, что касается звука и стиля. Он выпустил две пластинки под своим именем, "Lights
    On!" - настоящий шедевр, одна из лучших блюзовых пластинок 21-го века, которые я слышал. На ней все совершенно. Она записана
    на аналоговом оборудовании с точным воссозданием звука и стиля 50-х: соул-голос, гитара, хаммонд, низкие дудки. Очень
    легко перепутать и датировать эту запись 50 годами ранее. Половина из 18 треков - собственного сочинения, что особенно
    ценно, это не вторичный материал, а уникальная ценнейшая РнБ работа, записанная в наше время.


    Достоинства пластинки не на поверхности, чем больше ты ее слушаешь, тем больше она захватывает. Пластинка из серии долгоиграющих....'
