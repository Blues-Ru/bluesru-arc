- id: 1464
  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: 'Прямой наследник короля зайдекоу Си-Джей Шеньер на концертах и КД всегда выпускал музыку бодрую. Нынешний альбом
    записан в студии на одном дыхании, как концерт, именно чтобы передать настроение момента. А настроение было далеко от
    оптимизма, поскольку записывался альбом после урагана Катрин, разрушившего столицу луизианской традиционной музыки...
    И еще в альбоме есть "Bogalusa Boogie", посвященная памяти Кларенса Гейтмауса Брауна, ушедшего из жизни всего несколько
    дней спустя после катастрофы. Если требуются доказательства, что блюз всегда отражает настроение момента, то послушайте
    эти записи: всегда задорные песни-зайдекоу вдруг прозвучали мрачновато, а в энергичных буги подтекстом читается тема судьбы
    а-ля 5-я Бетховена. Аккордеон виртуозен и голос мощен, как всегда. Но в череде альбомов шеньера-младшего, обладающих одинаковыми
    достоинствами, этот будет выделяться своим общим настроением. Шеньер поет свои новые песни и классику жанра, написанную
    его отцом. Песня Хэнка Уилльямса не кажется неожиданным выбором, а вот авторство Пи-ДжейХарви может удивить. Песня Вэна
    Моррисона "Comfort You" выбрана именно как утешение скорбящим.'
