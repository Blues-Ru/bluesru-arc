- id: 163
  author: Дмитрий Казанцев
  mark: 10
  date: '2003-08-19'
  text: 'И так Джону 60. Выглядит он неплохо, энергии полно, идей тоже. После двух
    абсолютно разных альбомов на Айланде ДМ оказался на блюзовом лейбле Силвертон.


    Тут у него стандартное для него трио Блюзбрейкеров: Коко Монтойа, Рик Кортес и
    Джо Юл (не самые приятные фамилии и имена, но что делать). Не хватает только Уолтера
    Траута. Есть тут и гости: Бадди Гай в I Could Cry; Мэвис Стейпл и Мик Тейлор в
    Wake Up Call и Not at Home; не отмеченный на обложке Алберт Коллинз в Light The
    Fuse и I''m a Sucker for Love. Играют тут и другие люди на клавишах, гитарах,
    дудках и т.д.


    Альбом уже длинный - 53 минуты - 12 песен - болезнь 90-х, но еще не в самой запущенной
    форме. Звучит он по-прежнему прекрасно, ведь рулит звук продюсер Филд.


    Теперь о музыке. Чистого блюза тут немного. Много блюз-рока, хард-рока, ритм-н-блюза.
    Но какие хорошие номера! Было бы их чуть поменьше, все бы было совсем ОК.


    Лучшие вещи: Wake Up Call, Undercover Agent For The Blues (как же здорово он тут
    поет), Nature''s Disappearing (обалденная вещь Джона, уже записанная ранее - гитара
    тут просто золото!), Not At Home (интересный блюз Джона в миноре, тут он солирует
    на синтезированной флейте - очень хорошо). Надо отметить мягкий звук всего альбома
    и прекрасную игру Коко и пение Джона (почему он не всегда так пел?).


    Этот альбом чуть слабее предыдущего, но учитывая его длину, дам ему 5 баллов -
    слишком уж хороши тут хиты и проходные песни.


    Wake up John, you''re nearly 60!'
- id: 1749
  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2011-05-23'
  text: 'Альбом записан и смикширован в Калифорнии в конце 1992 года и вышел в 1993
    году на фирме Silvertone Records.


    К Блюзбрейкерам во главе с Коко Монтойя на этом альбоме присоединяются гости:
    Бадди Гай в I Could Cry; Мэвис Стейпл и старый соратник Мик Тейлор в Wake Up Call
    и Not at Home; а также незаслуженно неупомянутый на внешней обложке Алберт Коллинз
    в Light The Fuse и I''m a Sucker for Love. Кроме того, при записи помогают сессионные
    музыканты - гитарист Дэвид Гриссом, клавишник Том Кэннинг, перкуссионист Майк
    Бруно, да плюс на половине треков присутствует духовая секция из Джо Саблетта
    и Дэррела Леонарда.


    В музыкальном отношении альбом скорее блюз-роковый, нежели блюзовый, но это его
    отнюдь не портит - это один из лучших альбомов Мэйолла: жесткий, энергичный и
    запоминающийся, с довольно плотным звуком и отменной игрой музыкантов. Отличный
    подарок сделал себе Джон на 60-летие! Без сомнения, это лучший альбом, записанный
    Мэйоллом за 90-е годы.'
