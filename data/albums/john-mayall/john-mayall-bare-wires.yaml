  author: Дмитрий Казанцев
  mark: 6
  date: '2003-08-23'
  text: 'Вот и наступила эра психоделия и изменений в жизни Джона, посмотрите на обложку
    диска. Драммер Хартли ушел (здесь даже есть инструментальный трек, посвященный
    этому - Hartley Quits), МакВи уже вовсю играет у Грина во Флитвуд Мэк; из основных
    остался лишь Тэйлор - это уже не мало, но после этого Джон откажется от имени
    БлюзБрейкерз - он понял, что не может содержать постоянную группу возле себя.


    Все вещи на этой Пластинке написаны Джоном и Миком, но песни - неяркие, грузные,
    лишенные искорки. Вещей всего семь, но всю первую сторону (23 минуты) занимает
    одна длинная Barewires Suite. Она состоит из семи отдельных кусков и абсолютно
    надуманна, это - не концептуальная композиция, а просто отдельные песни, составленные
    вместе. Мне такие 23-минутки не очень нравятся, а вот Англии 68-го года понравились
    - альбом занимал высокие места в хит-параде (но блюз тут вообще не при чем). Можно
    выделить лишь одну вещь на альбоме - No Reply, остальное скучно и даже мрачно.
    Попытка подружиться с психоделией привела к плачевным результатам.


    Оценка 3 этому альбому. Тут нет ничего нового, все эти 23 минуты и псевдо-сайко
    звуки - лишь дань моде, не более того. Судя по всему, Джон понял это и сменил
    направление очень скоро.


    This is the end, the end of The Blues Breakers.'
