  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-23'
  text: 'Отец британского белого блюза, а ныне его патриарх, великий Джон Мэйолл ознаменовал свое 75-летие выходом очередного
    сольного альбома (а их у него только официальных уже почти 60 штук, этот считается 57-м!). Для записи он набрал новый
    состав Блюзбрейкеров, ознаменовав тем самым очередную смену звучания. Впрочем, Джон всегда был мастером находить новые
    таланты, и новый состав не исключение.


    В музыкальном отношении это по-прежнему блюз-рок, но неторопливо-расслабленный и чуть более жесткий, местами с примесью
    фанка. Мощные клавиши и гитары, неспешный ритм, солирующая гармоника, высокопрофессиональная игра всех музыкантов - что
    еще нужно для хорошего альбома? Музыка звучит современно, но одновременно она следует блюзовой традиции и мгновенно узнаваема
    - это Джон Мэйолл!


    Продюсировал альбом сам маэстро, который также написал три песни из 11. Среди каверов Playing With A Losing Hand от Уолтера
    Траута и The Sum Of Something от Кертиса Салгадо.'
