  date: '2006-03-13'
  text: '<img src=http://i8.ebayimg.com/02/i/06/81/cd/c3_1_b.JPG>


    Довольно редкий альбом Джона для Dick James Music (про него вообще не знают на
    Оллмьюзике). Мэйолл продожает мешать блюз-рок с ритм-н-блюзом и джаз-роком. Элементы
    фанка и соула тут и там, но есть две проблемы - голос Джона и песни, которые он
    пишет (они не блещут). Когда он ковырял по блюзу, было все как-то ОК, и он находил,
    что сказать людям, а вот другую музыку Джон вообще не может петь и сочинять -
    это удивительное дело на самом деле (это при том, что он классно играет на клавишах,
    гармошке и гитарах в любом жанре).


    На диске 9 песен, большая половина из них все же ОК, а кое-что совсем наивно звучит.
    Тем не менее, это не "отстой".'
