- id: 159
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-08-19'
  text: 'То ли он сам понял провал на дебютном альбоме для Blue Thumb Records, то
    ли ему помогло общение с другими людьми. Не знаю, но этот альбом лучше! Намого
    лучше!


    Песен меньше, время почти такое же, но Вы посмотрите на состав! Тут и Джон МакВи,
    и Джон Марк, и Джонни Алмонд, и Блю Митчелл! Ди МакКинни уже только как подпевка,
    не более того - все это уже много обещает.


    Джон написал все сам и сам же спродюсировал. Но песни-то какие хорошие получились!
    Первая - Sunshine - почти хит (в хорошем смысле этого слова). Вторая отличная!
    Уже сдают нервы при переключении на третью - неужто поперло у ДМ? И третья хорошая!
    И четвертая! Все, альбом состоялся, надо брать!


    А в чем же успех? Банда из 24 человек - это уже здорово (представили себе ДМ как
    бэнд-лидера?) Хорошая банда из 24 человек - это еще более важно. Добавили фанка,
    соула, хороших аранжировок. А песни-то какие - отлично! Блюз убрали, скажете?
    А может ДМ не умеет их писать? Много хороших соло и импровизаций.


    Лучшие песни - Sunshine и Seven Days Too Long.


    Минусы? Последний трек. Нет, он не плохой, он на 14 с лишним минут - это что,
    джаз-рок или возврат в психоделию? Зря он это. А все в погоне за 42 минутами альбома!
    Нет чтобы 36 и была бы пятерка, а так твердых 4 балла за вот этот трек и... обложка
    мне не нравится!


    76 год, ДМ выдал 8 хороших композиций!'
