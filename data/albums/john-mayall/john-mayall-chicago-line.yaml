- id: 167
  author: Дмитрий Казанцев
  mark: 6
  date: '2003-08-19'
  text: 'После большого перерыва в 80-х Джон выпускает этот альбом на фирме Айланд.
    Первый из двух. Худший из двух. Сильно хуже второго.


    Альбом почти концептуальный: хард-рокин-блюз встречается с аутентичными песнями
    кумиров самого ДМ - Джимми Роджерса, Блайнд Бой Фюллера, Уолтера Дэвиса. Есть
    одна вещь Уолтера Траута (хорошая). Джон сделал хитро с несколькими вещами: взял
    оригинальные тексты и написал к ним свою музыку! Почему так не делать и нашим
    российским блюзменам, а то такое по-английски пишут (и поют), что чокнешься.


    И так о музыке. Звук ужасен - типичные 80-е. Песни от хороших до КОШМАРНЫХ - третий
    хард-роковый трек. Конфеток и радостей нет, но все пристойно. Оценка 3 балла!
    Если бы не этот идиотский звук типа "тщ-тщ-тща", то было бы и 4, а так 3 и все
    тут!


    Обложка вот очень интересная, но на КД ее не разглядеть, у меня винил, и я люблю
    ее разглядывать, тут фото старого Чикаго, музыкантов, заключенных, газет и постеров
    (все черное и мрачноватое) ;)


    Хорошие песни: Dream About The Blues, Cold Blooded Mama, The Dirty Dozens, Tears
    Came Rollin'' Down, то есть почти вся вторая сторона.


    Диск будет интересен любителям блюза.


    Damn the eighties!'
- id: 1742
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-20'
  text: 'Уникальный студийный альбом Джона Мэйолла, на котором в составе его Блюзбрейкеров
    играют сразу два прекрасных блюзовых гитариста - Коко Монтойа и Уолтер Траут (до
    этого этот уникальный состав записывался только на концертах). Состав дополняет
    проверенная ритм-секция из Бобби Хэйнса (бас) и Джо Юли (ударные). В качестве
    приглашенного музыканта на клавишах отметился небезызвестный Тони Кэри.


    Кроме того, на этом альбоме впервые звучит композиция Траута Life in the Jungle,
    вошедшая впоследствие в качестве заглавной в его первый сольный альбом.


    Альбом вышел в Америке на лейбле Island после долгого перерыва. Диск выходил с
    двумя альтернативными обложками. Chicago Line - довольно редкий диск, найти его
    сейчас на CD непросто.'
