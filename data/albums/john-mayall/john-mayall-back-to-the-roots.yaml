reviews:
- id: 274
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-11-21'
  text: 'Очень интересный двойной альбом Джона (видели бы Вы книгу к виниловому альбому...) "Назад к корням" в том смысле,
    что он позвал всех своих старых коллег. Тут с ним Харви Мэндл, Мик Тэйлор, Джонни Алмонд, Киф Хартли, Ларри Тэйлор, Эрик
    Клэптон, Джерри Макги, Стив Томпсон. Музыка уже больше в сторону прог-блюза и это хорошо. Что-то записано с ударными,
    что-то в духе ДМ 69-71 без барабанов. Альбом очень длинный и содержательный. Много разных блюзов и звуков, все время новые
    исполнители. Из такого количества песен просто невозможно выделить даже 2-3.


    Несмотря на то, что альбом очень сильный (это последний альбом ДМ в чартах), я бы поставил ему лишь 4 балла; мало ярких
    композиций, многие вещи затянуты, песен слишком много для блюзового альбома 71 года. В любом случае, этот альбом поставил
    точку в "британском" звучании Джона; после этого он начнет копать другие стили, звуки и составы, не заботясь о положении
    в чартах и о своих "поклонниках".


    Этот альбом нужно иметь в коллекции! Важная двойная пластинка той эпохи!'
