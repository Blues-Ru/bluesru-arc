- id: 169
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-08-19'
  text: 'Практически тоже самое, что и на альбоме 66 года, но...


    Тут есть Питер Грин - личность загадочная, темная, депрессивная и гениальная.
    Почему ТОТ альбом назывался БлюзБрейкеры с Эриком, а этот просто Трудная Дорога
    Джона Мэйалла?


    Можно сказать одно - тут есть Питер (который еще моложе Эрика, на два года), но
    который - уже личность. Он уже шикарно играет и поет. Он пишет СВОИ композиции!
    Он - еврей, но поет почти как черный, хотя и не подражает - это уже не талант,
    это гений, который не мог до конца развиться по разным причинам.


    67-ой год - это уже не 66-ой! Все серьезнее! Битлз уже выпустили Револьвер, Дилан
    уже играл рок, Эрик уже играл в Крим, психоделия пустила свои корни, наркотики
    стали изощреннее и опаснее. Как это ни странно, все это хорошо подействовало на
    атмосферу альбома.


    Трудно выделить лучшие вещи на этом альбоме, но You Don''t Love Me, Another Kinda
    Love и The Supernatural очень хороши.


    Я бы поставил этому альбому твердую 4-ку. Грину 5-ку, но альбом-то записали на
    Джона!


    So many hard roads, so many trains to ride...'
- id: 2238
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2016-11-01'
  text: 'Единственный альбом, записанный молодым Питером Грином с Джоном Мэйоллом,
    благодаря которому имя Грина стало известно широким слоям любителей блюза. Кроме
    4 каверов и 8 треков, написанных Джоном, на диске также присутствуют 2 трека авторства
    Грина, включая знаменитый инструментал Supernatural (кроме того, на двух треках
    Питер поет). Кроме Грина (который пришел на замену Эрику Клэптону 17 июля 1966
    года), на данном альбоме в составе Блюзбрейкеров также дебютирует ударник Айнсли
    Данбар (пришедший на замену Хью Флинту). На нескольких треках Джон использует
    духовые.


    Любопытный факт: Питер впервые пришел к Джону еще в тот момент, когда Эрик числился
    в Блюзбрейкерах, утверждая, что он играет лучше Клэптона. Затем, когда Клэптон
    осенью 1965 года неожиданно на три месяца подался в Грецию, Джон искал ему замену
    и выбрал именно Питера Грина. Но через неделю после этого Клэптон вернулся, и
    Джон попросил Питера уйти. Но зато в тот момент, когда Эрик окончательно объявил
    об уходе из Блюзбрейкеров, чтобы создать Cream, Джон знал того, кто сможет его
    заменить.


    Диск был записан под руководством знаменитого продюсера Майка Вернона с 11 по
    24 октября 1966 года, инженером звукозаписи был небезызвестный Гас Даджеон. Альбом
    вышел 17 февраля 1967 года и добрался до 10 места в британском топе. Но уже 15
    июня 1967 года Питер Грин уходит из группы, чтобы основать Fleetwood Mac.'
