- id: 21
  author: Алексей Калачев
  mark: 9
  date: '2002-10-26'
  text: Без варягов-гостей, лишь при участии блестящего продюсера David Z, Джон и его "Блюзовые Толкачи" сделали чрезвычайно
    МЕЛОДИЧНЫЙ альбом. Главное – электрические клавиши, прозрачный звук, упор на простые и изящные аранжировки. Сторонникам
    гитарной блюзроковой диеты он покажется скучноватым.
- id: 258
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Новая студийная работа John Mayall готовилась к семидесятилетию этого потрясающего музыканта, которое будет широко
    отмечаться у него на родине в конце следующего года.


    Несмотря на весьма преклонный возраст, величайший блюзмен Великобритании отнюдь не собирается уходить на покой. Более
    того, последние несколько лет он на зависть молодым коллегам удивительно активен - дает за год по сто пятьдесят, а то
    и двести концертов, находя при этом время для серьезной работы в студии.


    Вот и эта пластинка была записана в промежутках между выступлениями во время гастролей Mayall и его Bluesbreakers по британским
    клубам. Кстати, состав группы не меняется с 95-го года, когда вышел альбом "Spinning Coin". Bluesbreakers - это гитарист
    Buddy Whittington, бас-гитарист Hank Van Sickle, клавишник Tom Canning и барабанщик Joe Yuele. Сам John Mayall, как известно,
    с одинаковым успехом играет практически на всех инструментах, в том числе на разнообразных клавишных, гитаре и губной
    гармонике. Все эти свои таланты музыкант в очередной раз демонстрирует на Stories - таким образом, и без того впечатляющий
    список работ John Mayall получил достойное пополнение.'
- id: 1747
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-23'
  text: 'ПЯТЬДЕСЯТ ВТОРОЙ (!!!) альбом Джона, записанный им накануне 70-летия. Состав Блюзбрейкеров неизменен с 1995 года,
    на гитаре Бадди Уиттингтон, которого на этом альбоме Джон держит несколько в тени. В результате получился очень славный
    и мелодичный альбом: мощные и красивые клавиши, много гармоники, изящные аранжировки. Как обычно, это не чистый блюз -
    скорее блюз-рок, но не слишком тяжелый и очень элегантный, а Mists of Time так просто шедевр!


    Джон написал почти половину треков альбома, еще три трека сочинили коллеги-блюзбрейкеры, среди каверов - песни Уолтера
    Траута, Эрика Бибба, Рика Вито и других. Продюсировали Дэвид З и Джон Мэйолл.


    Заслуженное первое место в блюзовом топе Биллборда'
