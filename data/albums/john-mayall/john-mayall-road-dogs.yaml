- id: 1432
  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: 'Давний последователь здорового эгоизма, Мэйолл впервые за долгое время отказывается
    от портрета на обложке в пользу фотографии, дающей "ключ к шоссе". Работая в противофазе,
    ритм-гитары и ударные создают ощущение постоянного, подкачивающего ритма – словно
    быстрое движение в долгой-долгой дороге. "Если вам нужен рецепт к гастролям –
    Блюзбрейкерз знают все секреты!" 6 минут заглавного трека зачаровывают ощущением
    бесконечного пути. И не торопясь альбом переходит к стартовой точке: как автор
    в 1947 впервые услышал блюз на короткой радио-волне: "И блюз указал мне путь".
    С помпой отпраздновав 70-летие, в текстах Мэйолл не стесняется ни пафоса, ни трюизмов,
    если за ними скрывается истина, по его мнению. Сама музыка, при обилии виртуозных
    соло, звучит сдержанно. Это блюз для зрелых людей, хотя "медляки" тронут и девичьи
    сердца. Мэолл стремиться заполнить CD под завязку, и среди 15 треков оказывается
    слишком много дежурных блюд. Но даже эти блюда готовил блюзовый шеф-повар, играющий
    на клавишных, гитаре, губной гармонике и – самым нежным тоном - на флейте.'
- id: 2281
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2017-09-07'
  text: 'Согласно дискографии официальных альбомов на сайте крестного отца британского
    блюза, это 53-й релиз Джона Мэйолла.


    Альбом создавался тем же составом, который работал над альбомом Stories 2002 года
    - Джон (вокал, гармоника, клавишные), Бадди Уиттингтон на гитарах, Джон Юли за
    ударными и Хэнк Ван Сикл на басу. При записи квартет блюзбрейкеров был усилен
    следующими гостями: Том Каннинг (орган, на этом диске Том почему-то выпал из основного
    состава, хотя до этого он числился в нем, да и позже он опять в блюзбрейкерах),
    Дэйл Моррис младший (скрипка на двух треках - 5 и 11) и вундеркинд-тинейджер Эрик
    Штекель (соло гитара на 10 треке). На четырех треках на фоне присутствуют духовые,
    воссозданные Джоном на синтезаторе.


    Диск был записан и смикширован с 10 января по 10 февраля 2005 года в Калифорнии.
    Тринадцать треков сочинил маэстро, а остальные два - музыканты группы. На треке
    12 поет Бадди Уиттингтон. Продюсировал Джон Мэйолл при помощи остальных блюзбрейкеров
    и звукоинженера Билла Купера. Диск отлично сыгран, прекрасно записан и представляет
    собой качественный продукт от мастера современного блюза. Еще бы его чуток подсократить
    - и было бы совсем хорошо!'
