- id: 2323
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2019-02-27'
  text: 'Для записи своего нового альбома крестный отец британского блюза выбрал метод, отличающийся от его традиционного
    подхода: в этот раз он пригласил ряд звездных гостей-гитаристов, которые записали сольные партии для каждого из треков.
    Слаженная мощная прифанкованная ритм-секция с великолепным Грегом Рзабом обеспечивает надежную основу как для клавиш и
    периодической гармоники самого маэстро, так и для гостей-солистов. Своим участием альбом украсили следующие именитые музыканты:
    Джо Бонамасса (треки 1 и 6), Лэрри МакКрей (треки 2 и 7), Алекс Лайфсон (трек 3), Тодд Рандгрен (трек 4), Стивен Ван Зант
    (трек 8) и Кэролин Уондерлэнд, которую Джон пригласил в свою концертную группу в качестве штатной гитаристки (треки 5,
    9 и 10).


    Музыка украшена периодическими подключениями духовиков (где-то на половине треков) - Рона Дзуибла на саксофоне, Ричарда
    Розенберга на тромбоне и Марка Пендера на трубе. Инструменты отлично сбалансированы на записи, а голос Джона звучит достаточно
    сильно и уверенно.


    Три последних трека написал сам Джон, остальное - каверы. Диск записан с 23 января по 1 февраля 2018 года, но вышел только
    22 февраля 2019 года. Продюсировали Эрик Корн и Джон Мэйолл.


    Особенно впечатлили следующие треки: мощный Delta Hurricane с отменной работой Бонамассы, Evil And Here To Stay с необычным
    и тем особенно интересным соло гитариста Rush, прифанкованная That''s What Love Will Make You Do и Тодд Рандгрен, а также
    The Hurt Inside с отличным соло Лэрри МакКрэя. Остальные треки альбома тоже вполне на уровне, явно проходных просто нет.


    В итоге получился очень достойный альбом современного блюза - энергичный и звучащий качественно, свежо и интересно. Джон
    в свои 85 даст фору многим гораздо более молодым музыкантам - да и что другое можно ожидать от легендарного музыканта?'
