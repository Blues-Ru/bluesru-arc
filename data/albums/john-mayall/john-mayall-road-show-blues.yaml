- id: 166
  author: Дмитрий Казанцев
  mark: 4
  date: '2003-08-19'
  text: 'Этот альбом тоже попал в сборники на Оллмьюзике - сколько же их там уже?


    В отличие от Bottom Lime, Road Show Blues был переиздан на КД в разных видах и под разными названиями, например, Road
    Show или Why Worry.


    Это второй альбом ДМ на DJM, но тут нет и следа того кайфа и волшебства с предыдущего. 9 песен, около 39 минут.


    Простенький состав, Мэгги Паркер поет и что-то трясет под музыку. Простенькая музычка - блюзы, блюз-роки, роллы. А где
    же все эти шикарные песни и аранжировки? Где шикарная игра на инструментах? Не поймите меня неверно, играют ОК, попадают
    в ноты, но разве этого достаточно? Для меня - нет.


    Хорошие песни... а есть ли они тут? A Big Man вроде с хорошим риффом и драйвом, но что играется на гитаре? Baby What You
    Want Me To Do (You Got Me Running)? А нужна ли она нам в таком исполнении?


    Вывод: серый, неинтересный, безыдейный, плохо записанный альбом на хорошем лейбле. 2 балла! Эта пластинка есть у меня
    потому, что она на виниле в дешевом издании - пусть будет для памяти.


    Не советую.


    Вот и начались 80-е - конец музыке, отсутствие вкуса, дурацкая мода, ухудшение качества записей... Да уж.'
