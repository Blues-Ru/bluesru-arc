  author: Дмитрий Казанцев
  mark: 10
  date: '2003-08-18'
  text: 'Не знаю кто и почему на AMG запихнул этот номерной диск в сборники - они
    часто ошибаются, но с кем не бывает?


    Видимо общение с Тюссо и другими монстрами американской соул сцены оказало положительное
    влияние на Джона. Этот альбом записан на АВС и спродюсирован самим ДМ - хорошо
    сделан. Даже очень хорошо.


    42 минуты - 10 треков - все пристойно и не скучно. Разнообразные вещи, тут есть
    и блюз, и блюз-рок, и соул-фанк. Есть и минорная блюзовая баллада - An Old Sweet
    Picture.


    Большой бэнд играет тут. Есть все - дудки, подпевки, клавиши и классная ритм-секция.
    Сам Джон филигранно играет на гармошке - он умеет это делать, не мешая музыке.


    Можно сказать, что диск бодрый и оптимистичный. Есть настроения от южного рока
    в духе Doobie Brothers или Little Feat, но можно сказать, что это и южный соул
    в стиле Мемфиса и Стакса. Все очень эклектично и разнообразно. Да, ДМ вернулся
    к блюзам тут, но блюзовые номера ОЧЕНЬ интересные и необычные, например, -Goodnight
    Dreams - мурашки идут по коже от кайфовой темы и исполнения.


    Минусов я не обнаружил, разве что отсутствие Тюссо ;) Альбому с Тюссо я поставил
    5 твердых баллов, этому же альбому просто 5.


    Думаю этот альбом должен быть интересен почти всем. Обратите внимание на необычные
    перкуссии по всему альбому и ПРЕКРАСНУЮ игру ДМ на харпе. Лучшая песня - Goodnight
    Dreams, я люблю такие тягучие мрачноватые блюзы.


    77 год был удачен для Джона.'
