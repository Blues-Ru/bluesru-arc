- id: 1075
  author: Сергей Исправников
  mark: null
  date: '2007-05-12'
  text: 'Последний на сегодняшний день студийный альбом 73-летнего "отца британского блюза" Джона Мэйэлла посвящен творчеству
    выдающегося блюзового гитариста Фредди Кинга (1934-1976). Записи Кинга первой половины 60-х г.г. на лейбле Federal/King
    (г. Цинциннати) принесли ему известность по обе стороны Атлантики и оказали большое влияние на становление британского
    блюза, в первую очередь, на творчество Эрика Клэптона, Стэна Вэбба ("Chicken Shack") и непосредственно Джона Мэйэлла.
    Отдельные блюзы Фредди Кинга входили во все классические диски Мэйэлла 60-х г.г. В свой первый студийный альбом "Bluesbreakers
    with Eric Clapton" (1966 г.) Мэйэлл включил ставший классикой блюза инструментал Кинга "Hide Away". На следующем мэйэлловском
    альбоме уже с Питером Грином "A Hard Road" (1967 г.) прозвучали еще два стандарта Фредди Кинга начала 60-х – "The Stumble"
    и "Someday After A While". В альбом "Crusade" (1967 г.) с Миком Тэйлором был помещен инструментал "Driving Sideways".


    "In The Palace Of The King" – гитарный в своей основе альбом, поддержанный клавишными и усиленный духовой секцией. Из
    14 треков, записанных на диске, два были сочинены самим Мэйэллом: посвящение Фредди Кингу "King Of The Kings" и написанная
    в память скончавшейся в прошлом году матери Мэйэлла "Time To Go". Инструментал "Cannonball Shuffle" был написан одним
    из лучших современных американских блюзовых гитаристов Robben Ford (и исполнен им же на альбоме), остальные номера входили
    в репертуар непосредственно Фредди Кинга. Состав группы не претерпел существенных изменений, помимо Мэйэлла, в нее входят
    гитарист Buddy Whittington (р. 1956 г., Техас, в "Bluesbreakers" с 1993 г.), ударник Joe Yuele (р. 1951 г., Массачусетс,
    в группе с 1985 г.) и басист Hawk Van Sickle (р. 1961 г., Пенсильвания, в группе с 2000 г.). В итоге получилась работа,
    достойная памяти Фредди Кинга, которая сможет привлечь внимание современной аудитории к этому неординарному музыканту.
    Что касается самого Джона Мэйэлла, несмотря на возраст, он остается на высоте.'
- id: 1431
  author: Андрей Евдокимов
  mark: 6
  date: '2009-02-05'
  text: 'Один из королей блюза – техасец Фредди. Со времен, когда Эрик Клэптон играл в группе Bluesbreakers, Мэйолл проверял
    крутизну своих гитаристов именно умением сыграть виртуозные и энергичные пьесы Фредди Кинга, ни разу не запнувшись. И
    наконец-то Отец британского блюза полностью посвятил музыке Фредди Кинга полный альбом, 56-й в своей дискографии. Гитарные
    партии исполняет один из самых скромных виртуозов современного блюза Бадди Уиттингтон. Экзамены сдавать ему нет необходимости.
    Уже много лет он трудится в тени знаменитого лидера и заслужил у критиков репутацию "недооцененного". С Мэоллом выйти
    на первый план ему случай не представится. Даже в альбоме, посвященном одному из главных реформаторов электрогитарного
    блюза, он буквально повсюду: певец, пианист, исполнитель на губной гармонике и даже на соло-гитаре. Общее звучание альбома
    – довольно мягкое и сдержанное, даже в исполнении такого головокружительного рок-блюза, как I''mGoing Down. Уиттингтон
    избегает резкого и жалящего саунда Кинга – играет сколь виртуозно, столь и деликатно.'
- id: 2293
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2017-11-22'
  text: 'Фредди Кинг - знаменитый техасский гитарист, третий и менее известный из блюзовых "королей" после БиБи Кинга и Алберта
    Кинга. Фредди Кинг был одним из лидеров электрического гитарного блюза с конца 50-х до своей преждевременной смерти 28
    декабря 1976 года. Его игра повлияла на творчество многих блюзменов, от Эрика Клэптона и Питера Грина до Стиви Рэя и многих
    других. Роллинг Стоун поместил Кинга на 15-е место в своем списке 100 лучших гитаристов всех времен и народов. Джон Мэйолл
    всегда восхищался творчеством Фредди и включал каверы его инструменталов уже в самые ранние альбомы Блюзбрейкеров, и наконец
    решил посвятить музыке Кинга-третьего целый альбом (который стал 56-м в официальной дискографии самого Джона).


    Кроме треков из репертуара знаменитого техасского блюзмена, на диске есть и две песни авторства Джона - Time to Go (посвященная
    памяти Берил Мэйолл), а также посвящение Фредди King of the Kings. Cannonball Shuffle - инструментал, который сочинил
    в стиле Фредди Кинга знаменитый Роббен Форд, украсивший альбом своим соло на этом треке. Big Legged Woman отдана на откуп
    Бадди Уиттингтону - тут он и поет, и играет на всех гитарах, а Джон на этом треке отсутствует. Бадди хорош и на остальных
    треках, и составляет прекрасную партию Джону. Партии органа и фортепиано записал Том Каннинг, который периодически оказывался
    в составе Блюзбрейкеров. Музыканты группы играют вместе уже не один год и прекрасно понимают друг друга. Музыка украшена
    эпизодическим подключением духовой секции.


    Диск записан в Калифорнии с 8 по 11 июля 2006 года, вышел в марте 2007 года. Продюсировали совместно Джон, блюзбрейкеры
    и Майкл Аарволд. Получился качественный альбом современного блюза на гитарной основе - отменный трибьют творчеству великого
    блюзмена от другого не менее достойного музыканта.'
