- id: 1044
  author: Александр Панин
  mark: 7
  date: '2006-11-07'
  text: Самый первый альбом Джона Мэйалла, вышедший в марте 1965 года. Он был записан
    на концерте в лондонском клубе Klooks Kleek, состоявшемся в декабре 1964-го. Вместе
    с Джоном (вокал, губная гармошка, орган) играют Roger Dean (гитара), John McVie
    (бас), Hughie Flint (барабаны) и на нескольких номерах Nigel Stanger (саксофон).
    Ритм-секция здесь та же, что будет на первом студийном диске Джона <a href="http://www.allmusic.com/cg/amg.dll?p=amg&sql=10:5ek9ikz6bbo9">Bluesbreakers
    With Eric Clapton</a>, ну а про Эрика он тогда еще и не знал (узнал вскорости
    после выхода пластинки и сразу выгнал Роджера Дина). Из двенадцати песен этой
    концертной записи одиннадцать сочинил сам Мэйалл, что и отражено в названии диска,
    единственный кавер которого – невнятное попурри Night Train / Lucille. Среди вещей
    Джона есть ряд довольно удачных (в их числе выпускавшиеся на синглах Crawling
    Up A Hill и Crocodile Walk), а вот некоторые звучат довольно наивно. Качество
    записи очень приличное. По музыке это британский ритм-энд-блюз, с меньшим содержанием
    блюза, чем на нескольких последующих альбомах Блюзбрейкерс. Переиздание этой пластинки
    на компакте – настоящий подарок для всех любителей жанра! Осталось добавить, что
    на диске пять бонус-треков, записанных в 1964-1965 годах и выходивших ранее на
    синглах или сборниках.
