  author: Дмитрий Казанцев
  mark: 8
  date: '2003-08-23'
  text: 'Джон решил повторить успех альбома Turning Point и записал этот студийный
    альбом в том же составе, но с небольшими изменениями. Песен стало больше - 12,
    и они стали короче. Альбом по-прежнему очень длинный - 46 минут, но слушается
    на одном дыхании. Есть изменения и в музыке - больше блюза, появился фолк, социальный
    контекст еще больше усилился.


    Тут 12 песен и много хороших. Первый трек очень приятен, Plan Your Revolution
    придает бодрости, очень нежная и наивная фолк-песня Don''t Pick The Flower, Something
    New - игривая песня с классной мелодией, Thinking Of My Woman - интересные вокалы
    Джона в унисон с басом, крадущаяся и почти фолковая Counting The Days, роскошная
    вещь почти шепотом To A Princess.


    Оценка 4, по-прежнему не хватает барабанов и местами драйва, не все вещи интересные.


    Empty rooms are good for our ears.'
