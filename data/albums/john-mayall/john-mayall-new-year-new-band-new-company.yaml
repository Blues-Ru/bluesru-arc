  author: Дмитрий Казанцев
  mark: 6
  date: '2003-08-19'
  text: 'Многообещающее название, не так ли? Новый лейбл, новые (якобы) идеи, новая
    обстановка. Не надо забывать, что ДМ - англичанин, и он очень хотел опять в группу,
    в новые Блюзбрейкеры (он не решился взять это название на сей раз).


    Альбом длинный - 44 минуты - 10 треков (зачем так долго такую простую музыку?).
    Еще меня удивило плохая запись на родном дорогущем КД из США (может опять Джон
    виноват - надо искать винил).


    Сразу скажу, что на альбоме группа из ШЕСТИ человек + ДМ, но толку от этого немного.
    На вокале Ди МакКинни (девушка на подпевках) (ну зачем это?), и аж сам Дон Харрис
    на скрыпочке (ну это-то куда?), - вот эти два момента сразу бросаются в глаза.
    Более того, эти двое определяют глуповатую прикантрованность в некоторых вещах.


    А вообще альбом - блюзовый, роковый, бодрый, столько энергии и желания, а песни-то
    где хорошие? Мало. Все песни написаны и спродюсированы Джоном, даже My Train Time
    (это такой типичный цирковой номер для харперов - паравоз изображают как дети
    малые - у нас Петрович это дело любит).


    Не могу выделить ни одного трека! Разве что про паравоз, но это скорее несерьезно,
    чем хорошо.


    Альбом имеет оценку 3! И не более того! Плохой дебют, плохое начало года, нет
    песен. Нет идей, а вот ГРУППА - хорошая, они еще сыграют как надо и дальше.


    Этот альбом могу посоветовать ТОЛЬКО фанатам ДМ и Дона Харриса.


    Говорил я уже как-то, что Джон один мало что может - ему нужны интересные люди
    вокруг себя типа Питера Грина, Тюссо или Марка-Алмонда. Но тут их нет, и он один
    с этой дамой и фиддлером пытается что-то делать.


    Bad Year, Good Band, Fruitless Company.'
