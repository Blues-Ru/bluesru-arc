- id: 162
  author: Дмитрий Казанцев
  mark: 10
  date: '2003-08-19'
  text: 'Очень важный альбом в карьере Джона! Что он делает на Island, я не знаю, но все получилось очень хорошо. Спродюсированный
    Р.С. Филдом, этот диск ознаменовал возвращение в хорошую музыку после полного провала целой декады 80-х годов.


    Альбом состоит из 11 треков на 40 минут - отличный формат, не правда ли?


    Тут есть очень важный человек в составе - слайд-гитарист Сонни Ландрет, он же - автор лучшей вещи с этого альбома - Congo
    Square.


    Надо сразу сказать, что альбом прекрасно записан и спродюсирован. Альбом блюзовый, но все вещи разные и интересные. Очень
    изобретательные аранжировки, иногда, правда, немного тяжеловатые, но это нормально для 1990-го года.


    Плохих вещей тут просто нет, так получилось. Лучшие же вещи - это Congo Square, Sensitive Kind (очень хорошая, психоделичная,
    почти амбиентная версия), Jacksboro Highway, Black Cat Moan (вещь Дона Никса в хорошем исполнении), Sugarcane (еще одна
    классная вещь Сонни Ландрета). Остальной материал тоже силен, но довольно стандартен.


    Оценка 5 баллов по всем статьям. Айланд помог Джону вернутся к форме и положил начало серии хороших альбомов 90-х.


    Welcome back, my friend, to the show that never ends!'
- id: 1750
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-23'
  text: 'Джон Мэйолл, "отец белого блюза", не нуждается в представлении.


    Пластинка 1990 года, записанная на Island records, вознаменовала возврат Джона к хорошей музыке после кризисного десятилетия
    80-х. Это был первый из целой серии хороших и отличных альбомов, записанных им в девяностые и уже в современном веке.
    Пластинка интересна гостевым присутствием Сонни Ландрета на слайд-гитаре и Дэбби Дэвис на ритме. Ну и, конечно же, мастерской
    работой Коко Монтойи, который в то время был штатным гитаристом Блюзбрейкеров. Его с Мэйоллом версия песни Джи Джи Кейла
    "Sensitive Kind" с абсолютно неподражаемым гитарным соло привела в восторг огромное количество фанов, да и не только их
    - некоторые меломаны покупали диск "A Sense Of Place" только из-за этой вещи.'
