  text: Довольно длинный и хороший концерт Джона. Классно играют и поют. Большой состав рулит. Тут почти нет нудятины; играются
    вещи в стиле соул и блюз-рок. Я обычно не собираю концерты, но этот я оставлю в коллекции.
