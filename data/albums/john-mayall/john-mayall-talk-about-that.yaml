  text: '"When I first had the idea for the title track, ‘Talk about That,'' I wanted to write lyrics that were about aspects
    of life that were running through my head. I also wanted to give the song a modern groove that would convey the fun mood
    driving the piece. Greg and Jay laid down a really infectious rhythm for me to feature my keyboard chops and bring the
    song to life with a really funky feel driving it." - John Mayall


    Пятого апреля 2016 года Джон Мэйолл был принят в Зал славы блюза, а 27 января 2017 года вышел очередной студийник блюзового
    ветерана (по счету это 65й официальный релиз крестного отца британского блюза).


    Новый альбом Джона Мэйолла - это всегда интересно для любителей блюза. Альбом записан тем же составом, с которым Джон
    приезжал на гастроли в Москву, но с привлечением специального гостя: на двух треках наложил гитару знаменитый Джо Уолш
    (особенно хорошо получилась The Devil Must be Laughing). Восемь песен написал сам маэстро, да плюс три кавера блюзовой
    классики.


    Впечатляет заглавный трек - роскошный прифанкованный блюз с отменной игрой Грега Рзаба (что этот бас-гитарист вытворяет
    на концерте - это надо видеть!). Джон всегда славился умением находить прекрасных музыкантов, и Грег бесспорно один из
    них. Сам Мэйолл как обычно демонстрирует отличное владение клавишными и гармоникой - и это в 83-летнем возрасте! Ряд треков
    украшен присутствием духовой секции.


    Диск записан за три дня в феврале 2016 под руководством Эрика Корна, который продюсировал альбом совместно с самим Мэйоллом.
    Диск вышел на лейбле Forty Below, президентом которого является Корн. Джон сотрудничает с Корном с 2013 года. Похоже,
    это Уолтер Траут познакомил Джона с Эриком - Джон помогал Трауту в записи сольника, продюсером и инженером которого был
    Эрик Корн.


    Диск записан очень прилично - каждый инструмент звучит отчетливо и ясно. Конечно, Джон как обычно верен себе: это все
    тот же блюз на традиционной основе, но с современным звучанием, сыгранный профессионалами высочайшего класса.'
