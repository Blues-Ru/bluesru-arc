  text: '- <img src="http://www.ljplus.ru/img/d/r/dr_nick/MayallThru.jpg" width=400 height=400 alt=''64,19 КБ''>


    Американский двойной сборник Джона Мэйолла 60-х годов. На альбоме 21 песня. Большинство из них НЕ АЛЬБОМНЫЕ, редкие треки.
    Очень радует то, что тут 9 песен с Питером Грином (в трех из них Питер еще и поет).


    На фирме Deram выходил другой сборник с таким же названием, он же был переиздан на КД (но на нем только 14 треков):


    <img src=http://image.allmusic.com/00/amg/cov200/drf500/f573/f57337namjk.jpg>


    Очень хорошие блюзы есть здесь. Можно считать, что этот двойник является еще одним прекрасным диском Джона 60-х, на котором
    играют такие музыканты, как: Mick Taylor, Jon Hiseman, Dick Heckstall-Smith, Peter Green, John McVie, Aynsley Dunbar,
    Keef Hartley, Eric Clapton, etc.'
