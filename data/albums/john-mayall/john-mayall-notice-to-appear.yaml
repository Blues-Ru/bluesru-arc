  author: Дмитрий Казанцев
  mark: 10
  date: '2003-08-18'
  text: 'Если я напишу, что это лучшая работа Джона, то это будет неверно. У ДМ есть
    блюзовые и неблюзовые альбомы. Так вот этот - лучший неблюзовый. Это мой любимый
    альбом Джона (попробуй-ка выбери из полсотни его творений).


    Что тут хорошего? Тут ВСЕ делает Аллен Тюссо. Он всегда делает ЭТО отлично (кто-нибудь
    может назвать слабую пластинку с его участием? То-то!)


    Он написал большинство песен к этому альбому, набрал правильный состав, сделал
    умопомрачительные аранжировки, он ЗАСТАВИЛ ДМ правильно петь (мы знаем немного
    странную манеру ДМ, но не забывайте, что он старше Аллена и достаточно упрям).


    Что тут играют? А все играют. Южный соул, фанк (в стиле Митерз и Др. Джона с Митерз),
    соул-блюз, Битлз даже играют - Эй Хард Дэйз Найт - хорошо играют, почти на одном
    аккорде!


    Что тут плохого? ВООБЩЕ НЕТ ТАКОГО! То есть весь альбом отличный от начала до
    конца. Даже песни, написанные Джоном. Звучит очень утопично, но это так.


    Великолепная школа для начинающих басистов и драммеров. Игра Тюссо на клавишах
    - это незабываемое ощущение. Так никто больше не играет. Его игра самобытна, как
    игра Др. Джона или Ричарда Ти, например.


    Море музыки, вкуса, грува, Аллена, немного Джона (а может это и хорошо?)


    Это пластинка имеет рейтинг 5 и нужна просто ВСЕМ! Разве что, любителям металла
    и шансона не стоит ее слушать - они не поймут.


    Тюссо - это голова!'
