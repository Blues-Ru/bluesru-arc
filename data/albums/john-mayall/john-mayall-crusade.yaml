- id: 173
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-08-22'
  text: 'Питер Грин ушел. Ему стал не нужен Джон. А Джону был нужен классный гитарист. Вот тут мир и узнал о молодом и скромном
    Мике Тейлоре. Три альбома - три отличных гитариста: Эрик, Питер и Мик. В чем же разница? Разница в звуке и игре. Эрик
    и Питер играли наивный и чувствительный блюз, а вот Мик - это уже эпоха блюз-рока! Совсем другое звучание, другие ноты,
    другая подача. Мик местами играет так, как потом стали играть рок-гитаристы; теперь понятно, почему его взяли именно в
    Стоунз.


    Альбом неприлично длинный - 46 минут - 12 песен. Альбом тяжеловатый и вязкий, но ритм-секция играет уже лучше, а ведь
    прошло чуть больше года со второго альбома Джона! На басу МакВи (он еще не ушел к Питеру в группу), на барабанах Киф Хартли.
    Плюс хорошие, но немного "пионерские" дудки (у англичан это бывало) - Крис Мерсер на теноре и Рип Кант на баритоне.


    Сразу слышно, что Джон и ребята послушали Букера Ти к тому времени. В некоторых песнях уже слышен роковый орган, есть
    серьезные инструменталы - Snowy Wood, Driving Sideways. Есть тут уже и дыхание психоделии (любили ли ребята Бердз?) Все
    стало как-то серьезнее, профессиональнее, плотнее.


    Еще тут много "хитов" типа Oh Pretty Woman, My Time After Awhile, I Can''t Quit You Baby (позднее ЛэдЗэп сыграли почти
    копию этой версии), Checkin'' Up On My Baby. Интересно то, что другие вещи даже интереснее.


    Я бы выделил Oh Pretty One (очень хорошо поет), Snowy Wood (написана Миком и Джоном, а могла быть и Кроппером ;)), Man
    Of Stone, The Death Of J.B. Lenoir, Streamline (отличный ритм и настроение), Me And My Woman (послушайте ритм-секцию и
    все поймете).


    Альбом очень хороший, я ставлю ему твердую 4-ку. Рекомендую всем, кто не против тяжелого, мощного звука.


    Rock crusaders are coming!'
- id: 2287
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2017-09-26'
  text: 'С момента выхода предыдущего альбома А Hard Road в составе Блюзбрейкеров произошли заметные перемены: Питер Грин
    ушел собирать свою собственную группу (Fleetwood Mac), а Айнсли Данбар подался к Джеффу Беку. На вакантное место ударника
    Джон взял Кифа Хартли, а с заменой лидер-гитариста было сложнее - ведь новому музыканту пришлось бы выдерживать сравнение
    и с Клэптоном, и с Грином. Джон вспомнил, что на одном из концертов, когда Эрик по какой-то причине не появился вовремя,
    пришел молодой парнишка, который утверждал, что знает весь репертуар Блюзбрейкеров. У Мэйолла особого выбора не было,
    и он пригласил молодого гитариста на сцену. Тот продемонстрировал хорошее знание материала и отличную технику, и Джон
    был впечатлен его игрой. Но после концерта парнишка ушел, не оставив своих координат. Теперь Мэйолл хотел найти этого
    музыканта, и в конце концов смог это сделать, разместив объявление в Melody Maker. Так в группу пришел Мик Тэйлор, склонный
    более к блюз-року, а не к чистому блюзу. Состав группы был расширен привлечением двух саксофонистов - Криса Мерсера на
    теноре и Рипа Канта на баритоне. Этот секстет отправился в студию 11 и 12 июля для записи нового альбома, который продюсировал
    Майк Вернон, а в качестве звукоинженера вновь отметился Гас Даджеон.


    Альбом включает каверы хитов блюзовых исполнителей, которые были особенно дороги Мэйоллу, плюс четыре трека собственного
    сочинения и еще инструментал, написанный совместно с Миком Тэйлором. Диск попал в британские чарты, где он продержался
    14 недель, достигнув восьмой позиции. И, надо сказать, диск вышел вполне достойный - это классический Мэйолл на уровне
    двух предыдущих альбомов с Клэптоном и Грином (только разве что Crusade будет более блюз-роковым).


    В аннотации к этому альбому Джон Мэйолл написал: "Я посвятил свою жизнь блюзу... Я надеюсь Вы присоединитесь ко мне."
    Блюзовый крестовый поход Джона продолжается и по сей день.'
