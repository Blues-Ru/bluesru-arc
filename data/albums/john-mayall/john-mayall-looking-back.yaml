  author: Дмитрий Казанцев
  mark: 8
  date: '2003-08-23'
  text: 'Это сборник синглов 1964-1968 годов. Великолепный сборник, необходимый сборник,
    сборник, который сильнее всех его альбомов 60-х годов. Вы удивляетесь? Я тоже
    удивляюсь уже лет 15.


    Я всегда переживал, что у Джона только один альбом с Грином, так вот эту компиляцию
    можно считать вторым альбомом - 7 песен из 11 с Грином и с сильным влиянием Грина.
    Кроме третьего трека все вещи великолепны! Да, это - блюзовый альбом ДМ, и все
    вещи хороши - 10 нужных композиций!


    Альбом не длинный - 38 минут, и именно поэтому его хочется еще раз послушать -
    он не надоедает. Хочется выделить So Many Roads, Looking Back, Sitting In The
    Rain, Double Trouble, Jenny - половина альбома полного кайфа и очень приличная
    вторая половина. Грин тут прекрасен, как же жалко, что это только сборник синглов.


    Оценка - твердые 4 балла! Все минусы - это третий трек и разница в качестве записи
    треков (это раздражает).


    Looking back he found the truth...'
