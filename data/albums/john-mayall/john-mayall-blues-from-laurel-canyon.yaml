- id: 178
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-08-23'
  text: 'Первый альбом без БлюзБрейкеров (а какая разница, впрочем). Первые шаги к иммиграции в Штаты - Лорэл Каньон - это
    в окрестностях Лос Анжелеса в Калифорнии. Первый Альбом на четверых: Джон (35 лет), Мик на гитаре еще с ним (19 лет),
    Стив Томпсон - бас (18 лет), Колин Аллен (30 лет). Странный состав - двое очень взрослых людей и двое "тинэйджеров".


    Альбом очень длинный - 48 минут и 12 песен. Еще больше психоделии, еще больше рока и загадочности, но тут есть очень хорошие
    песни, в отличие от предыдущего издания. Следует выделить загадочную Medicine Man, великолепный соул-грув-блюз Somebody''s
    Acting Like A Child, совсем интимную First Time Alone (как тут не хватает Питера Грина), приджазованную и мрачную Long
    Gone Midnight и великолепную и длиннющую (аж на 9 минут) Fly Tomorrow. Как видите, вторая сторона пластинки значительно
    сильнее первой. Грина тут нет, но есть впечатление, что Джон начал слушать своих учеников со стороны.


    Оценка 4 балла, тут есть что послушать, только не пугайтесь вступительной песни Vacation.


    You will fly tomorrow, fly away from good old England.'
- id: 2295
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2017-11-29'
  text: '14 июля 1968 года группа Блюзбрейкерс была расформирована, поскольку Джон решил поработать в качестве сольного артиста
    с небольшой сопровождающей группой. Основная причина - музыкант был вымотан гастролями предыдущего расширенного состава
    Блюзбрейкеров (записавшего Bare Wires), где ему приходилось решать множество сопутствующих проблем (а чем шире состав
    группы, тем больше проблем). "Блюз из Лорел Каньона" - чисто блюзовый альбом, полностью написанный самим Джоном по итогам
    его трехнедельного отпуска в Лос-Анджелесе и Калифорнии. Он базируется на впечатлениях музыканта от нового места, а также
    на эмоциях от встреч с новыми людьми и музыкантами (например, Фрэнком Заппой (на треке 2401), с Canned Heat (на The Bear)
    и знаменитой группи Кэтрин Джемс (на Miss James)).


    В качестве соло гитариста выступает Мик Тэйлор, который уже работал с Джоном раньше в Блюзбрейкерах и не нуждается в особом
    представлении. На ударных - Колин Аллен, один из наиболее интересных ударников жанра (впоследствии будет играть в Stone
    The Crows). На басу - Стив Томпсон, который со временем также окажется с Алленом в Stone The Crows в период пика этой
    группы.


    Альбом был записан с 26 по 28 августа 1968 года в лондонских студиях Decca. Продюсировали Майк Вернон и Джон Мэйолл. Диск
    вышел в ноябре и добрался до 33 позиции в британском чарте уже в январе 1969 года.'
