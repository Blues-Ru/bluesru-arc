- id: 473
  author: Дмитрий Казанцев
  mark: 10
  date: '2004-03-03'
  text: 'Я очень много лет искал этот альбом, и вот наконец нашел. Английский оригинал на Polydor (2683 036). Дорогая, но
    ОЧЕНЬ нужная вещь!


    Итак, это двойной альбом, посвященный 10-летию карьеры (звукозаписи) Джона. Диск шикарно оформлен и составлен, продюсером
    выступает сам Дон Никс. В качестве группы - обычный для этих лет у Джона джазовый состав из шикарных музыкантов: Киф Хартли
    на ударных, Шугаркейн Харрис на скрипочке, маэстро Блю Митчелл на трубе и флюгельхорне, Рэд Холлоуэй на саксах и флейте,
    великолепный Фредди Робинсон на гитаре и Виктор Гаскин на бас-гитаре и контрабасе.


    Первый диск - это 9 шикарных песен, записанных в студии, а второй - концерт в Академии Музыки в Нью Йорке. Надо отметить,
    что концерт хорош, хотя состоит всего из четырех длинных импровизационных композиций. Студийный же диск настолько хорош,
    что невозможно даже что-то выделить. Тут блюз, соул-джаз, блюз-фанк...


    Оценка 5 баллов. Необходимый диск Мейалла; один из лучших в его карьере. Как жаль, что он (как и еще несколько других)
    по-прежнему недоступен широким массам. А может и не нужно все это массам...'
