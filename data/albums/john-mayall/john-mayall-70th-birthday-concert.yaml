- id: 361
  author: Алексей Калачев
  mark: 8
  date: '2003-12-15'
  text: 'Альбом из двух дисков уже успел стать бестселлером. Впрочем, в этом нет ничего удивительного: любой альбом Джона
    моментально раскупается. На этот раз в дело замешан, впрочем, не только "рефлекс", но и присутствие на альбоме двух грандов
    – Клэптона и Мика Тэйлора. Отрадно, что их присутствие не стало символическим, ритуальным. Оба гитариста играли от души,
    как в старые времена. Особенно удалась эта роль Мику, по-моему. При открытии концертного альбома прекрасно выглядит группа
    "Блюзбрейкерс" без Джона Мэйоллла. Это первый приятный сюрприз. Второй – игра Криса Барбера на тромбоне. Блюз редко выходит
    за круг традиционных инструментов, знаете ли. Не стану подробно брюзжать по поводу двух скучных (для меня) моментов –
    длиннющей версии "О притти вумэн" и совместного номера Джона и Эрика, который заканчивал первый диск. Достоинства явно
    затмевают промахи. Послушайте музыку с этого классного двойника, особенно середину первого диска, где играет Мик Тэйлор,
    фактически весь второй, где Мэйолл и его ребята играют с приглашенными звездами. Странно иногда звучит запись вокала,
    особенно когда поет Клэптон, однако это, наверное, мелочи по сравнению с общим результатом.'
- id: 2283
  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2017-09-14'
  text: 'Коллекционное издание знаменитого концерта 19 июля 2003 года, включающее в себя двуслойный ДВД с DTS-дорожкой и CD
    с 8 треками, включая не попавший на ДВД трек "Калифорния".


    Концерт в Ливерпуле, посвященный 70-летию легенды британского и мирового блюза, был особенным - кроме отлично сыгранного
    состава Блюзбрейкеров (играющий с Джоном с 1985 года ударник Джо Юили, Бадди Уиттингтон на гитаре, Хэнк Ван Сикл на басу
    и Том Каннинг на клавишных) на сцену поднялись гости, и какие гости! Эрик Клэптон (с которым Джон к тому моменту не играл
    почти 38 лет), тромбонист Крис Барбер (который пропагандировал американский блюз в Англии еще в далеких 50-х и привозил
    на гастроли американских блюзовых исполнителей того времени, включая Мадди Уотерса) и Мик Тэйлор (сменивший Питера Грина
    в команде Джона в далеком 1967 году и сотрудничавший с Джоном в 80-е), а также духовая секция под руководством трубача
    Генри Лоутера (тоже экс-Блюзбрейкера).


    Сам Джон на протяжении концерта был в отличной форме - пел и отменно играл на гармонике, клавишных и гитаре, причем часто
    практически одновременно! Аккомпанирующий состав отыграл отлично, а Бадди Уиттингтон практически ничем не уступал своим
    именитым визави. Все музыканты играли от души, но особенно необычно воспринимался вклад Криса Барбера с его блюзовым тромбоном.
    Естественно, основное внимание было приковано к Эрику, а Мик Тэйлор был слегка скован (но и у него были свои моменты,
    тем более что он один играл слайдом). Версии исполняемых песен получились продолжительными из-за поочередного солирования
    многих музыкантов, а гитарные джемы Уиттингтона, Клэптона и Тэйлора (попарно и всех троих вместе) не оставят равнодушным
    ни одного любителя блюз-рока. Концерт смотрится на одном дыхании, и 137 минут ДВД пролетают незаметно. Пожалуй, это лучший
    ДВД Джона Мэйолла и просто must для всех любителей хорошей музыки.


    Альбом микшировали и продюсировали Дэвид З и Джон Мэйолл. Выручка от продаж данного ДВД перечисляется в ЮНИСЕФ. Также
    существует полная аудиоверсия данного концерта на двух CD, но этот концерт из категории событий, которые надо именно видеть.


    Electric blues feast (my review for Amazon in 2004)


    John Mayall recorded more than 40 albums and his influence on British rock music is enormous. Musically he tried to mix
    blues with hard rock, progressive rock, jazz and folk music, was not afraid to experiment and recorded some interesting
    music in these fields, but his blues rock songs are definitely his trade mark. It was a real pleasure to see that at his
    70 John is still in a very good shape - both physically and creatively. There are 2 hours of real blues rock recorded
    on DVD - and all this time Mayall is singing and playing (keyboards, guitar and harmonica, sometimes both keyboards and
    harmonica at the same time!). The latest version of his Bluesbreakers proves that John is still a master to find talented
    musicians - they are just great, and especially Buddy Whittington on guitar. There are also guests: Mike Taylor, Chris
    Barber on trombone and Eric Clapton. With such personnel the show simply can''t go wrong! There are lengthy versions of
    16 blues numbers with fantastic jamming, guitar/harmonica/organ/trombone duels, but Whittington/Taylor, Whittington/Clapton
    and Taylor/Whittington/Clapton guitar soloing is simply unforgettable! It is a real feast for electric blues guitar lovers.
    The concert is absolutely unique and we are lucky it was shot for DVD so we can enjoy it over and over again.


    Tracklist: DVD 1) Southside Story 2) Kids Got The Blues 3) Dirty Water 4) Somebody s Acting Like A Child 5) Blues For
    The Lost Days 6) Walking On Sunset 7) Oh, Pretty Woman 8) No Big Hurry 9) Please Mr Lofton 10) Hideaway 11) All Your Love
    12) Have You Heard 13) Hoochie Coochie Man 14) I m Tore Down 15) It Ain''t Right 16) Talk To Your Daughter


    CD 1) Dirty Water 2) Walking On Sunset 3) Please Mr Lofton 4) Hideaway 5) Have You Heard 6) It Ain t Right 7) California
    8) Talk To Your Daughter'
