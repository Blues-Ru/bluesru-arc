  author: Дмитрий Казанцев
  mark: 8
  date: '2003-08-23'
  text: 'Ну все, Джон затусовался с джазменами, и ему это нравится! Им тоже нравится, нам должно понравиться!


    Альбом концертный на 45 минут и состоит всего из 7 песен. Состав очень интересный: Блю Митчелл на трубе, Клиффорд Соломон
    - саксофоны, Ларри Тэйлор по-прежнему с Джоном на басу, Рон Сэлико - барабаны и Фредди Робинсон на гитаре - классный музыкат!
    Записано в Бостоне и Нью-Йорке, хорошо записано и сыграно.


    Первая вещь - Country Road - традиционный блюз в отличном исполнении, Mess Around - классика жанра в битовой обработке,
    Good Times Boogie - шустрый буги-блюз с джазовыми импровизациями, Change Your Ways - великолепный фанковый номер с отличной
    темой, Dry Throat - медленный блюз в интересном груве, Exercise In C Major For Harmonica - все поиграли, поимпровизировали,
    но без музыки, Got To Be This Way - приличный фанки-блюз. Лучшая вещь - Change Your Ways.


    Оценка 4. Можно было все это подать и лучше. Вещи не самые интересные порой. Впечатление, что мало репетировали. Ну и
    концерт - есть концерт, много минусов случайного одноразового исполнения.


    Джаз-блюз - это хорошо, но надо работать и над этим.'
