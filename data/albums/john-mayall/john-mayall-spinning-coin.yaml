reviews:
- id: 164
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-08-19'
  text: 'Опять Силвертон, опять продюсер Филд, опять хороший звук и исполнение, но где же те гениальные песни с двух предыдущих
    альбомов?


    Коко Монтойа ушел, Бадди Уиттингтон пришел. Равноценна ли замена? Думаю, что нет. На альбоме интересный, чуть новый, другой
    звук, но будто чего-то не хватает. А, может, это просто сухие, профессиональные, бездуховные 90-е наступили на всех? Думаю,
    так оно и есть.


    Альбом чуть покороче - 11 песен - 49 минут, но кажется, что он затянут. Это от того, что песни тяжелые, однообразные и
    местами мутные. Тут чистой воды блюз-рок и хард-рок, от блюза мало что осталось, похоронил он и соул с фанком - плохо
    это.


    Лучшие песни: Spinning Coin, Double Life Feeling (вот эта очень хороша!), Run (тяжелая, но очень убедительная), Remember
    This (поучительная баллада). Все это очень неплохо, но тянет лишь на 4 балла. Звук все тяжелее, идей все меньше. Я слышал
    и все последующие альбомы Джона, но решил, что этот последний, который я купил и оставил у себя в коллекции.


    Помните песню When I''m 64? Там что-то типа Will you be near me, will you be with me when I''m 64? Так вот я не с ним,
    когда ему стукнуло 64. 62 was enough.'
- id: 1748
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-23'
  text: 'Первый альбом состава Блюзбрейкеров, где на смену Коко Монтойе пришел Бадди Уиттингтон.


    Альбом не блюзовый, а скорее блюз-роковый. В принципе все неплохо, но не хватает какой-то изюминки или элегантности, если
    угодно. Есть и отличные треки - Spinning Coin, Double Life Feeling, Run, Remember This и Ain''t no Brakeman (последнюю
    вещь Коко Монтойя переиграл на своем последнем сольнике), есть и проходные. Тем не менее, как это обычно и бывает у Джона,
    продукт качественный :-)


    Авторского материала чуть меньше половины (пять треков из 11), продюсировали Р.С. Филд и Дэйв МакНэйр. Основному составу
    Блюзбрейкеров помогали саксофонист Джо Саблетт и на паре треков харпер Джюк Логан.'
