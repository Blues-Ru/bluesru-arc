  author: Дмитрий Казанцев
  mark: 6
  date: '2003-08-23'
  text: 'Ну это слабо на этот раз. Их осталось только трое! Басист Ларри Тэйлор остался,
    Харви заменили на Джерри МакГи из Ventures, скрипача вообще убрали. И зачем все
    это? Умышленный шаг назад или куда?


    10 песен на 46 минут. Ничего особенного, разве что некоторые треки автобиографические
    и о своей семье. Джону опять нужно все менять, это ясно. Не могу выделить тут
    ни одной композиции. А играют хорошо, конечно. Записи классные, сделаны в Лос
    Анджелесе.'
