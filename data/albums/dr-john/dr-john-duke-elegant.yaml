- id: 240
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Dr. John может абсолютно все. Это уникальный музыкант, способный, к примеру,
    записать подряд пару абсолютно джазовых альбомов, а потом вдруг разразиться мрачноватенькой
    хищной пластинкой (скажем, "Anutha Zone"), близкой по духу скорее творчеству Tom
    Waits. Последнее творение Dr. John "Duke Elegant" пролежало у меня где-то с месяц
    - все недосуг было его послушать. Я внимательно слежу за творчеством музыканта,
    но в данном случае ожидал от него всего лишь банального альбома-посвящения Ellington,
    столь типичного для прошлого года, когда широко отмечалось столетие Великого Дюка.
    И ошибся, в чем убедился довольно быстро. Dr. John умудрился подать всем известные
    шедевры изумительно легко, аппетитно и даже с нелегким налетом фанка. Для этого
    он объединился с, честно говоря, абсолютно неизвестным мне трио The Lower 9-11.


    Между прочим, первоначально Dr. John хотел составить этот альбом-посвящение лишь
    из малоизвестных сочинений Ellington, но потом изменил свое решение, здраво рассудив,
    что может остаться непонятым, не исполнив такие стандарты, как "Mood Indigo",
    "Perdido", "Satin Doll" или "Don''t Get Around Much Anymore". Впрочем, отчасти
    музыкант осуществил и свой первоначальный замысел. Так, альбом открывается пьесами
    "On The Wrong Side Of The Railroad Tracks" и "I''m Gonna Go Fishing", а заканчивается
    "Flaming Sword", написанной Ellington в 40-м году.'
