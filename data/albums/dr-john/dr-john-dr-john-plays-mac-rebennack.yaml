  author: Дмитрий Казанцев
  mark: 6
  date: '2004-01-12'
  text: 'Доктор Джон записал много альбомов в разных стилях в 70-х, но только в 81 году решился записать сольный альбом. Только
    он и рояль. Лишь пара треков с вокалом! Коммерческое самоубийство? Да, но Мак давно не был в хит-парадах, и не его это
    дело - поп-музыка, на самом деле.


    Мак отлично играет на рояле! Блюзы, буги, новоорлеанские темы. Он абсолютно уникален как пианист, но почти час одного
    рояля может утомить даже самого упрямого поклонника Доктора.'
