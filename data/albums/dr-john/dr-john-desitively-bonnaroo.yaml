reviews:
- id: 427
  author: Дмитрий Казанцев
  mark: 10
  date: '2004-01-16'
  text: 'Это седьмой альбом Доктора на Атко. Мак Ребеннак решил продолжить историю успеха и снова записал альбом с Meters
    и Алленом Тюссо. Результат - 12 отличных песен в стиле фанк и ритм-н-блюз. Отличный звук, продакшн и аранжировки. Больше
    подпевок и поп-звучания, чем на предыдущем "In The Right Place", но это вообще не мешает. Материал очень сильный, трудно
    что-либо выделить. "Stealin''" и "Mos'' Scocious" гениальны.


    Альбом немного слабее предыдушего хита, но только потому, что он вышел после него. На диске нет слабых мест и звуков.'
