reviews:
- id: 420
  author: Дмитрий Казанцев
  mark: 6
  date: '2004-01-12'
  text: 'Этот альбом очень похож на предыдущий сольный диск 1981-го года. Мак и рояль. Запись чуть хуже по качеству, но лучше
    подбор песен. Доктор больше поет, но вокал записан в микрофоны для подзвучки рояля, так что звучит он очень тихо и невнятно.
    Даже непонятно, кто и зачем так сделал. Игра Доктора Джона на рояле - это великолепно, но очень уж одиноко становится
    при прослушивании таких альбомов.


    Видимо, Мак хотел выпустить два именно таких сольника; мы не будем его ругать за это. Но все же он отлично поет и играет
    в группе; вот этого нам не хватает на этом и предыдущем альбомах.'
