- id: 423
  author: Дмитрий Казанцев
  mark: 7
  date: '2004-01-16'
  text: 'Это первый официальный релиз Мака Ребеннака. Он был известен как классный студийный музыкант еще с конца 50-х, но
    получил контракт с Атко только в конце 60-х.


    Доктор решил создать свой стиль в музыке - сплав блюза, соула, психоделии и шаманства вуду. Сам он - главный шаман и доктор.
    Здесь он играет на гитаре, хотя мир знает его как классного пианиста. Женские подпевки, странные перкуссионные инструменты
    и мрачное настроение - вот основные элементы музыки на этом альбоме. В 1968 году народ увлекался разной музыкой и довольно
    тепло встретил это "безумие" Мака. Не думаю, что такое могло случиться в 70-х, 80-х или сейчас.


    За безумием и шаманством скрываются отличные мелодии, идеи и ходы. Сразу слышно, что Доктор Джон - это серьезно и надолго.
    Это культовый альбом, и мне кажется, что его должен иметь в своей коллекции каждый любитель ритм-н-блюза и музыки Нового
    Орлеана.'
