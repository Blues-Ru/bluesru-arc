reviews:
- id: 421
  author: Дмитрий Казанцев
  mark: 5
  date: '2004-01-12'
  text: 'Безумие, блюз-рок, психоделия, вуду-музыка, Новый Орлеан, полифония.


    Это второй альбом Доктора Джона на Atco Records. Дури стало еще больше, музыки
    меньше, запись по-прежнему плохого качества, к сожалению. По безумию это творение
    сравнимо только с Капитаном Бифхартом, пожалуй. Конечно, гений Доктора уже тут,
    но пока он еще плохо оформлен и слишком много мутных звуков и нот.


    "Barefoot Lady", "Lonesome Guitar Strangler", "The Patriotic Flag-Waver" и "Twilight
    Zone" вполне съедобны, но этого явно недостаточно для хорошего альбома. Очень
    "трудный" диск Доктора.'
