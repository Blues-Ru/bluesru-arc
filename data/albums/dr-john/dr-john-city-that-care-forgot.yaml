- id: 1316
  author: Андрей Евдокимов
  mark: 8
  date: '2008-07-19'
  text: Доктор любит обращаться к классике. Но в "Городе без заботы" все песни новые,
    и в текстах звучат социально-политические неласковые мотивы. А в музыке это все
    тот же Доктор Джон с его любовью к традиционным новоорлеанским синкопам в современных
    аранжировках и густом саунде. Его музыка обладает редким сочетанием мягкости подачи
    и непреклонности ритма. Песни сочинены в соавторстве с Бобби Чарлзом, автором
    бессмертно-легкомысленного See You Later, Alligator. Сейчас Чарлзу 70 лет. Да
    и Доктору Джону 68. 63-летний Эрик Клэптон – самый молодой в этой компании звезд;
    Уилли Нельсону, спевшему помесь кантри-баллады с новоорлеанским фанком Promises,
    Promises, уже 75 лет. Рекорды долголетия приведены потому, что пенсионный возраст
    музыкантов на слух не чувствуется. Это мастера с устоявшимся исполнительским почерком,
    и потому их игра довольно предсказуема для тех, кто хорошо знаком с их прошлым
    работами. При этом их восприятие музыки поразительно свежо, азартно и потому заразительно.
