reviews:
- id: 426
  author: Дмитрий Казанцев
  mark: 10
  date: '2004-01-16'
  text: 'И вот оно свершилось - Доктор попал в чарты! Мак написал хит! "Such A Night" и "Right Place Wrong Time" в хит-парадах.
    Альбом в Топ-30! Из "безумия" и местечковости в звезды!


    Что же изменилось? Да все. Доктор сосредоточился на фанке, соуле и блюзе, никакой "дури" и шаманства. Он работает с Алленом
    Тюссо, группой Meters и другими классными музыкантами. Все песни отличные, звук и продакшн на высоте (Аллен знает свое
    дело).


    Это лучший альбом Доктора всех времен! Это альбом черной музыки, но Мак отлично чувствует себя в этом груве. Обязательная
    пластинка для любого любителя музыки.'
