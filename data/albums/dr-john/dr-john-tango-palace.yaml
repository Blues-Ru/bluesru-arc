  author: Дмитрий Казанцев
  mark: 8
  date: '2005-05-02'
  text: 'Второй и последний диск Доктора на фирме Horizon. Продюсеры Томми ЛиПума
    и Хью МакКракен, как и на первом, но музыка в другом ключе. Меньше джаза и латины,
    но больше фанка и даже диско кое-где, аранжировки совсем другие. Надо отметить,
    что тут снова доминирует тема Нового Орлеана, как это было и на альбоме "Gumbo"
    в 1972 году. Это редко бывает, когда два альбома подряд разные, но оба отличные.


    Диск начинается с поучительного фанка "Keep That Music Simple" (это обязательно
    надо слушать всем нашим музыкантам, там все сказано про то, КАК НАДО). "Renegade"
    - хороший минорный номер в стиле Нового Орлеана. Очень удачный и веселый среднетемповый
    фанк в "Fonky Side". Еще одна симпатичная новоорлеанская песенка с элементами
    шаманства - это "Bon Temps Rouler". "Something You Got" в быстром темпе и другом
    римте звучит совсем неубедительно - это слабое место это альбома, конечно. Хочется
    отдельно отметить Стива Гэдда на ударных и Абрахама Лабориэла на бас-гитаре -
    волшебная ритм-секция.


    Очень симпатичная обложка у этого альбома: http://images-eu.amazon.com/images/P/B0000D8HUX.02.LZZZZZZZ.jpg'
