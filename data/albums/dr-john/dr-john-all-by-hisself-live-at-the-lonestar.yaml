reviews:
- id: 666
  author: Александр Панин
  mark: 10
  date: '2005-05-22'
  text: Невероятно хороший концерт Доктора Джона конца 1986 года (он был выпущен только в 2003-м на его собственном лейбле
    Skinji Brim). Как следует из названия, Доктор играет один, то есть на записи только его вокал и рояль. Это может показаться
    недостаточным, но результат превосходит все ожидания - час мощной игры, фирменного едкого вокала и отличного материала
    (отмечу Stagger Lee, Iko Iko, Right Place Wrong Time). Диск, кроме того, очень хорошо записан. В качестве бонуса приложен
    22-минутный ДВД, на котором Мак рассказывает о новоорлеанской музыке и иллюстрирует повествование игрой в стилях известных
    исполнителей. Рекомендуется без малейших сомнений.
- id: 700
  author: Дмитрий Казанцев
  mark: 7
  date: '2005-05-29'
  text: 'Первый альбом Доктора Джона на его собственном лейбле Skinji Brim. На нем он планирует выпускать свои концертные
    записи из прошлого и записи других артистов, которые не смогли выпуститься на других ярлыках.


    На этом диске 13 треков, записанных на концерте еще в 1986 году. Только голос Доктора и его клавиши. Звук хороший, но
    рояль звучит очень странно - будто это электро-пианино. Материал прекрасный - от старых блюзов и фолка до его песен из
    фанкового периода 70-х. Новоорлеанский драйв и кайф в каждом звуке. Stagger Lee, Average Kind Of Guy, Such A Night, Right
    Place, Iko Iko - это все шедевры, конечно. Эх, если бы он еще не играл всякие "бугивуги".'
