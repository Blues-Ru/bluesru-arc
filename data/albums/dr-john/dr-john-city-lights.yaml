- id: 603
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-05-01'
  text: 'Через 4 года после отличного "Desitively Bonnaroo" Доктор Джон вернулся с
    полноценным альбомом. На этот раз диск вышел на лейбле Horizon, а продюсерами
    выступили Томми ЛиПума и Хью МакКракен. Вместе с ними, конечно, целая когорта
    классных сессионных джазовых музыкантов: Steve Gadd - drums, Will Lee - bass,
    Richard Tee - keys, Hugh McCracken - guitar, John Tropea - guitar, Arthur Jenkins
    - percussion, Ronnie Cuber - baritone sax, Charlie Miller - cornet, Barry Rogers
    - trombone, David Sanborn - alto sax, George Young - tenor sax. Понятно, что с
    такими мастерами альбом получился отличный, но надо отметить и тот факт, что Мак
    вернулся к написанию отличных песен.


    Очень хороший альбом. Ритм-н-блюз разных видов с приятным джазовым оттенком. Есть
    тут очень классные песни: "Wild Honey", "Rain", "Snake Eyes", "Fire Of Love",
    "He''s A Hero".'
