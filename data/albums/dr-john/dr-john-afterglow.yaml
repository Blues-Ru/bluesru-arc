- id: 422
  author: Дмитрий Казанцев
  mark: 6
  date: '2004-01-12'
  text: 'Много блюза, джаза, рояля. Богатые аранжировки, биг-бэнд, сочный вокал, знакомые песни.


    Томми ЛиПума умеет работать. GRP/Blue Thumb/MCA - вот такие лейблы задействованы в создании этого диска. На басу играет
    сам Рэй Браун. Также на басу Джон Клэйтон, Джефф Хэмилтон на барабанах и знаменитый Фил Апчерч на гитаре. Все очень классно,
    но слишком много поп-джаза. Для кого-то это кайф, но Мак все же не очень похож на поп-идола, как мне кажется.


    Лично меня пугает биг-бэнд местами. Надо знать, что такое GRP, тогда становится не так странно, но все же Доктор не такой
    попсовый и джазовый обычно.'
