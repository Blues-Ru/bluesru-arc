- id: 357
  author: Дмитрий Казанцев
  mark: 9
  date: '2003-12-12'
  text: 'У Доктора Джона много альбомов в разных стилях, но этот диск 1972 года ближе всего к корневой музыке и блюзу. Типичный
    сплав новоорлеанского блюза и ритм-н-блюза; море энергии и музыки. 12 композиций на 39 минут, и это один из лучших альбомов
    Мака Ребеннака. Надо заметить, что это пятый альбом Доктора на лэйбле Atco, но предыдущие четыре были более шаманские
    и психоделические; хотя и на них был явный блюзовый замес.


    Вы наверняка знаете половину композиций с этого альбома, но в исполнении Доктора они имеют свой неповторимый шарм. "Iko
    Iko", "Big Chief", "Mess Around", "Let The Good Times Roll", "Stack-a-Lee" (aka "Stagger Lee") - все это классика новоорлеанской
    музыки в блюзе, джазе и ритм-н-блюзе. Альбом очень здорово сыгран и записан, и звучит он как одно целое произведение.
    Ощущение праздника и карнавала остается с нами все 40 минут звучания. Этот диск обязателен для любителей блюза и соула.
    Доктор - уникальный исполнитель на рояле и небычный вокалист, и тут его умение и талант отлично слышны.'
