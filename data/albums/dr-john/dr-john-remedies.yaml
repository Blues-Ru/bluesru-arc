reviews:
- id: 424
  author: Дмитрий Казанцев
  mark: 7
  date: '2004-01-16'
  text: 'Музыкальное шаманство, вуду, блюз, Новый Орлеан, психоделия, ритм-н-блюз,
    женские подпевки, перкуссия, транс, последний трек на 18 минут.


    Третий альбом Мака похож на первый и на второй, но тут довольно много совсем четкой
    и понятной музыки. "Loop Garoo" - шаманский блюз-роковый трек с риффом почти как
    в песне "Spoonful", "What Goes Around Comes Around" - прекрасный ритм-н-блюзовый
    трек, "Wash, Mama, Wash" - настоящий хит в новоорлеанском духе, "Chippy, Chippy"
    - еще один приятный блюзовый трек, а вот "Mardi Gras Day" - это уже карнавальная
    шаманская музыка фестиваля Марди Гра (но очень симпатичная). Конечно, пугает "Angola
    Anthem" на 18 минут, но и в ней есть свои интересные моменты. Этот диск не такой
    "трудный", как первые два, тут очень много хорошей и красивой музыки.'
