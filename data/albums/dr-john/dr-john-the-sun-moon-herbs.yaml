reviews:
- id: 425
  author: Дмитрий Казанцев
  mark: 7
  date: '2004-01-16'
  text: 'Четвертый альбом Мака Ребеннака на Атко. Три первых были почти в одном стиле, а на этом начали происходить изменения.
    Изменился состав музыкантов и подход. Тут с доктором играют и поют: Мик Джаггер, Грэм Бонд, Мемфис Хорнз, Джим Гордон,
    Пи Пи Арнолд, Эрик Клэптон, Карл Рэдл и многие другие. Практически, это состав Эрика Клэптона. С этим составом музыка
    стала более понятна и доступна, часть "безумия" отступила. На этом фоне кажется, что появились мелодии и интересные ходы.
    "Black John the Conqueror" - очень хороша, например. Вообще, альбом слушается легко, но все же эту пластинку стоит отнести
    к первому, "трудному" периоду Доктора (1968-1971).'
