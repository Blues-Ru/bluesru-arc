- id: 1006
  author: Александр Панин
  mark: 9
  date: '2006-05-07'
  text: В названии диска нет опечатки, дело в том, что новый альбом Доктора Джона посвящен выдающемуся американскому композитору
    и певцу Джонни Мерсеру. Многие его вещи, как то Come Rain Or Come Shine, Blues In The Night и Moon River, давно стали
    джазовыми и эстрадными стандартами. Все эти песни есть и здесь – как и в случае со своим <a href="http://www.allmusic.com/cg/amg.dll?p=amg&sql=10:8fq5g4f9tv4z">трибьютом
    Дюку Эллингтону</a>, из огромного творческого наследия Мерсера Мак выбрал превосходные номера. И добавил один свой – под
    названием I Ain't No Johnny Mercer. В прочтении Доктора Джона получилась новоорлеанская музыка высшего качества, надо
    выделить отменные фанковые аранжировки, потрясающее качество записи и замечательную игру всех ее участников (Маку помогает
    группа Lower 911 в составе гитариста и ритм-секции, а также ряд духовиков). Ну и, разумеется, неувядающий уникальный вокал
    Доктора, с которым материал, кем только до этого не перепетый, обретает поистину новую жизнь.
