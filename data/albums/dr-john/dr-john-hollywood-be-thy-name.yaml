- id: 602
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-05-01'
  text: 'Это восьмой альбом Доктора Джона, он вышел не на Atco Records, но на United
    Artists Music. На диске 10 треков, большинство из них - это концертные записи,
    но есть тут и парочка студийных треков.


    Диск неровный по качеству материала и звуку, к сожалению. Тем более странно, что
    продюсером является Боб Эзрин, человек, который известен своим сотрудничеством
    с такими концептуальными людьми как Эли Купер и Пинк Флойд. "Reggae Doctor" очень
    хороша, но вот зачем Мак дал своим дамам из группы петь знаменитую "The Way You
    Do The Things You Do", непонятно. Довольно забавно звучит его версия "Yesterday"
    Пола МакКартни, но это на любителя, конечно. Очень странное решение - переделать
    песню "Babylon" (со второго альбома); в итоге мы имеем мутный, психоделический
    студийный трек непонятно зачем. А вот "Back By The River" - это очень симпатичная
    песня, записанная в студии. Medley из "It''s All Right With Me", "Blue Skies"
    и "Will The Circle Be Unbroken" - еще один слабый концертный номер (наверное,
    на это надо смотреть). "Hollywood Be Thy Name" - очень странный студийный трек,
    который напоминает тему из какого-то мьюзикла. И под конец - "I Wanna Rock" -
    и еще одна невнятная концертная композиция.


    Неплохой альбом, но звучит совсем неубедительно после "Gumbo", "In The Right Place"
    и "Desitively Bonnaroo". Слышно, что Мак потерялся и не знал, что ему дальше делать.'
