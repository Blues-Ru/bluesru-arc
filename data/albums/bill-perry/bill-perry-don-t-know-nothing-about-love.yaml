  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2012-08-13'
  text: 'Последний студийный альбом известного американского блюз-рокера. К сожалению, летом 2007 года Билл скончался от сердечного
    приступа. Ему было всего 50 лет.


    Данный альбом был записан и смикширован для Blind Pig Records Паппой Чабби, который также выступил в роли продюсера. На
    альбоме 3 кавера, остальное - авторский материал Билла. В музыкальном отношении это качественный блюз-рок с изрядной долей
    фанка и интересной гитарной игрой Перри. Увы, от нас ушел талантливейший композитор, певец и гитарист.'
