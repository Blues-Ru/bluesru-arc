  text: '"He wrote songs that you could swear were written by Muddy Waters. I think he''s the best blues musician in the world,
    but he''s very shy when it comes to his music and I think that''s what drives him to do so well...he''ll tell you he''s
    just Bill Perry, but when he''s on stage, he''s a monster." RICHIE HAVENS


    Билл Перри - талантливый блюзовый гитарист, певец и автор песен, успевший записать 7 сольных альбомов до лета 2007 года,
    когда в возрасте 50 лет его настигла смерть от сердечного приступа.


    Билл начал играть на гитаре с 5 лет, в 13 лет уже участвовал в конкурсах талантов, играл в школьных группах, а к 1988
    году начал аккомпанировать Ричи Хэйвенсу. Перри также выступал в 1989 году с членами группы The Band во время их турне
    к 20 летию выступления на фестивале в Вудстоке.


    За время долгих гастролей в качестве аккомпанирующего артиста Билл получил массу впечатлений, которые помогли ему в написании
    собственного материала. Первый его сольный диск - Love Scars - вышел в 1996 году, и, несмотря на то, что он был записан
    всего за 6 дней, и по сей день является одной из лучших работ Перри. На диске представлен качественный гитарный блюз и
    блюз-рок с хорошим драйвом и густым чувственным вокалом Перри. Материал почти полностью написан самим Биллом, который
    также продюсировал диск совместно с Фредом Драхусом.'
