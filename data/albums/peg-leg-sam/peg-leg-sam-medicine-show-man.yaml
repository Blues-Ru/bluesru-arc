reviews:
- id: 692
  author: Александр Панин
  mark: 9
  date: '2005-05-28'
  text: 'Настоящее имя этого харпера было Артур Джексон, он родился в 1911 году, а
    прозвище получил, потеряв ногу в результате железнодорожного инцидента в 1930-м.
    Он играл блюз со многими перцами (в том числе с Пинком Андерсоном), принимал участие
    в medicine shows. Записывали его крайне мало, на этом диске 14 треков с нескольких
    сессий 1970 и 1972 годов.


    Звуки, извлекаемые Пег Лег Сэмом из своего инструмента, очень интересны и забавны,
    его гармошка (а иногда и две сразу) временами просто разговаривает! Конечно, есть
    на диске моменты кривляния и клоунства, без которых, наверно, никакое medicine
    show не обходилось, но их не так много. Примерно на половине треков только гармошка
    и вокал, а на остальных появляется и аккомпанирующая акустическая гитара (Генри
    Джонсон или Бэйби Тэйт).


    Поищите этот очень веселый альбом.'
