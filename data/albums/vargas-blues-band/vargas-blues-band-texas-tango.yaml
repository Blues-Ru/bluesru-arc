- id: 1881
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-06-14'
  text: 'Четвертый сольный альбом испанского мастера гитарных струн, и какой альбом! Если говорить о блюзовой эпостаси Хавьера
    Варгаса, то это самый блюзовый его диск, и, думаю, самый лучший.


    Несмотря на то, что диск был записан не только в разных городах, но даже в разных странах (часть в Остине - штат Техас,
    часть в Мемфисе - штат Теннесси, и часть в столице Испании), он производит достаточно цельное впечатление. Возможно, причина
    тому сам Варгас, написавший бОльшую часть материала, а может это гений знаменитого продюсера Джима Гейнса. В этот раз
    Варгас пригласил к микрофону Джеффа Эспинозу, а остальные музыканты были разными. Из Остина отметились Крис Лэйтон и Томми
    Шеннон (знаменитая ритм-секция Стиви Рэя Double Trouble), из Мемфиса - Стив Поттс, Лэрри Терстон, Престон Шеннон и харпер
    Лин Джонс.


    В итоге получился чрезвычайно техничный и одновременно мелодичный диск современного гитарного блюз-рока в его техасской
    интерпретации - с щепоткой испанского колорита (на единственном инструментале Buenos Aires Blues). От заглавной более
    хард-роковой Rose on the Water через вязкие блюзовые Blues Pilgrimage, Love Aint Not Got Nowhere to Go и совершенно убойную
    Ridin'' High до завершающего блюза Blood Shot - весь диск наполнен мощными гитарными рифами, техничными соло и высокопрофессиональной
    игрой всех музыкантов, тем самым представляя собой настоящее пиршество для любителей современного блюза. Легкая доля коммерции
    (в основном обусловленная женским бэквокалом) только делает альбом еще лучше. Диск наверняка станет украшением коллекции
    любого любителя современного блюза и рока.'
