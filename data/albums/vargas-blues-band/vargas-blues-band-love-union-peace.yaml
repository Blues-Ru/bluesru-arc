  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-18'
  text: 'Хавьер Варгас родился в Мадриде, затем жил в Аргентине, Венесуэле и США,
    потом вернулся в Испанию. Начинал играть на классической испанской гитаре с нейлоновыми
    струнами, но к 12 годам получил первую электрогитару. Жизнь в разных странах наложила
    отпечаток на его музыкальные вкусы - он увлекался различными музыкальными стилями,
    отдавая предпочтение блюзу, и в 1991 году собрал Vargas Blues Band.


    В творчестве Хавьера присутствует вся та музыка, которая его окружала - тут и
    латинские ритмы, и фламенко, и джаз, и рок, и блюз. Карлос Сантана так сказал
    о Варгасе: "Он - как радуга, в нем скрыты все цвета, все стили - не только испанская
    музыка или блюз. Мало кто может так воздействовать на каждого слушателя".


    Наглядная иллюстрация такой полистилистичности - альбом 2005 года, записанный
    в Мемфисе. Кроме лучших музыкантов штата Теннесси при записи помогали Джек Брюс,
    Глен Хьюс, Алекс Лигертвуд, Девон Аллман и другие.


    Альбом блюзовым не назовешь - это скорее коктейль современного рока, латино, джаза
    и испанской музыки с примесью блюза, исполненный исключительно технично и профессионально.
    Любителям традиционного блюза диск вряд ли придется по душе, тогда как неограниченные
    определенным стилем поклонники современной музыки и поклонники Сантаны наверняка
    найдут для себя много интересного.'
