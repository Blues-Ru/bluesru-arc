reviews:
- id: 1647
  author: Андрей Евдокимов
  mark: 7
  date: '2010-10-11'
  text: 'Не альбом – конфетка! Без приторности и без показной почтительности к голливудским
    мультфильмам, из которых некоторые сами стали вехами культурной истории. Когда-то
    "Волки" объясняли, что играют музыку, которую любили их родители и дедушки с бабушками.
    Нынче сами дедушки, они посвящают этот альбом своим многочисленным детям и внукам.
    Но играют не по-стариковски: легко, бодро, виртуозно, фантастически свободно от
    любых (исторических или стилевых) клише. Конечно, любимая отправная точка – текс-мекс,
    но есть и один рок-н-ролл, и две чарующе красивых баллады. Конечно, вырванная
    из контекста строчка "Такая обезьяна, как я, может научиться быть таким человеком,
    как ты" может показаться социальной сатирой, но в целом, когда мариачи взялись
    за Диснея, получился радужный мир, в котором только призраки скучают от нехватки
    общения.'
