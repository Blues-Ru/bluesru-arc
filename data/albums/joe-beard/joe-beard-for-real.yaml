- id: 1082
  author: Константин Колесниченко
  mark: 8
  date: '2007-06-04'
  text: 'Joe Beard не слишком известный музыкант. Альбомов у него мизер, свой первый
    диск он записал в 1996 году, уже совсем немолодым, и, как ни странно, его работы
    были популярны на блюзовых-радио, на них играли звезды современного блюза Дюк
    Робиллард, Ронни Ирл, Брюс Кац, Джерри Портной. Насколько я знаю, он даже играл
    на инаугурации Буша младшего.


    Своими учитилями Джо считает Джона Ли Хукера, Лайтнин Хопкинса и Сона Хауса, но
    на альбоме мы слышим электро-блюз где-то со свингом, где-то до капельки чикагский,
    где-то почти соло-дельта.


    Альбом записан качественно на замечательном лэйбле AudioQuest. С Джо играют звезды:
    Duke Robillard, Bruce Katz, Jerry Portnoy, Rod Carey, Per Hanson. Гитара ДЖо по
    звуку напоминает чем-то Альберта Коллинза - резкий, режущий звук, короткие, очень
    лаконичные и грамотные соло, а вокал в стиле бескомпромисных старых дельта музыкантов.


    Материал наполовину авторский, наполовину известные композиции. Мне почему-то
    нравятся такие вот "классические" записи.'
