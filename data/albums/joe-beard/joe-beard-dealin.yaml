- id: 1083
  author: Константин Колесниченко
  mark: 8
  date: '2007-06-04'
  text: 'Это последний альбом Джо (ему 62), тот же самый лейбл AudioQuest, те же музыканты, абсолютно та же самая концепция.
    Работа является логическим продолжением предыдущего "For Real".


    Видно что музыканты приигрались, что-ли, друг ко другу, потому этот альбом звучит поживее, больше быстрых композиций,
    чувствуется некоторая комфортность. Качественная, ровная работа, никаких прыжков в сторону. Наверное, общее представление
    о блюзе нужно получать из таких вот дисков, от них проще копать вглубь к классике.


    P.S. У Джо отлично получаются интимные, медитативные блюзы в стиле Джона Ли.'
- id: 1769
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-24'
  text: 'Joe Beard with Duke Robillard and friends - Dealin'' - 2000


    Joe Beard - американский гитарист-самоучка, певец и композитор, соратник Мадди Уотерса и Джо Ли Хукера. Интенсивно записываться
    он начал уже ближе к 50 годам, ибо до этого многодетный отец вынужден был работать, чтобы обеспечивать семью, и блюз для
    него был своего рода отдушиной или хобби. Но вот дети встали на ноги, и Джо смог отдаться любимому делу. Определенную
    помощь ему оказал Ронни Эрл, который заставил руководителя студии Audioquest прослушать кассету с записью Джо. С Ронни
    и его группой Джо записал на этом лейбле несколько альбомов.


    На альбоме 2000 года (3-й его альбом для этого лейбла), записанном 19 и 20 апреля в Вудстоке, ему аккомпанирует знаменитый
    Дюк Робиллард, а также классический состав the Broadcasters с Брюсом Кацем. Кроме того, особый шарм пластинке придает
    участие знаменитого Джерри Портного на губной гармонике. В общем, абсолютный all-star band. Запись производилась вживую
    в студии безо всяких наложений. Продюсировал диск Джо Харли.


    В результате получился отличный альбом традиционного блюза - искренний и профессионально сыгранный, где каждый музыкант
    показывает, на что он способен.'
