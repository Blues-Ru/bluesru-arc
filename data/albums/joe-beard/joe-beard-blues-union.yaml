  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-24'
  text: 'Joe Beard featuring Ronnie Earl and the Broadcasters - Blues Union - 1996


    Первый из альбомов Джо, записанный с Ронни Эрлом. Помогают при записи: аккомпанирующий состав Ронни the Broadcasters в
    полном классическом составе с Брюсом Кацем на Хаммонде В3, а также саксофонист Дэвид Ньюман и мастер губной гармоники
    Джо Дубук.


    Отличный альбом традиционного блюза, на котором деревенский блюз Джо контрастирует с джазовым блюзом Ронни, а аккомпанирующие
    музыканты выкладываются по полной программе. Нельзя также не заметить великолепные соло Ронни, а также отметим традиционную
    для фирмы Аудиоквест (на которой записан диск) политику записи live in the studio (т.е. без всяких наложений).'
