- id: 1702
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-19'
  text: 'В 1972 году Stone the Crows наконец добились положения одной из ведущих блюз-роковых
    групп Англии и достигли пика своей популярности по итогам продаж успешного третьего
    альбома и многочисленных концертных выступлений. Мэгги Бэлл была избрана лучшей
    певицей по итогам ежегодного опроса журнала Melody Maker, группа добилась определенного
    признания и в Америке, а их последний сингл Good Time Girl взбирался вверх в чартах
    (дошел до 12 места). Никто не мог предполагать, что записываемой группой четвертый
    альбом станет последним.


    Трагедия произошла 3 мая 1972 года во время саундчека, когда Лес Харви получил
    сильнейший удар током на сцене и умер на месте. Группа решила закончить альбом
    и продолжить деятельность. Вакантное место гитариста было предложено самому Питеру
    Грину, который принял участие в ряде репетиций в течение месяца, но на концерт
    в рамках рок-фестиваля в Уили не явился (видимо, его состояние в то время продолжало
    ухудшаться). Положение в тот вечер смог спасти Стив Хау из Yes, отыгравший гитарные
    партии вместо пропавшего Грина.


    В конце концов место Лесли занял молодой Джимми МакКаллах (еще один шотландец
    из Глазго!), который отыграл гитарные партии на последней песне альбома (на всех
    остальных песнях звучит гитара Лесли, которую он успел записать до внезапной смерти).
    Последняя композиция Sunset Cowboy - своего рода дань памяти Лесли, была записана
    группой уже после его смерти, и является, на мой взгляд, жемчужиной альбома. Несмотря
    на некоторую разноплановость, в целом альбом очень приличный, а Мэгги просто превзошла
    себя (Penicillin Blues - это что-то!). На альбоме эпизодически присутствуют духовые
    The Pumping Spumona Horns, аранжировки для них сделал Роджер Болл. На диске один
    кавер (Penicillin Blues), остальные треки написаны музыкантами группы. Продюсировал
    Марк Лондон, исполнительным продюсером был Питер Грант. На CD альбом впервые вышел
    в 1997 году в Германии на фирме Repertoire.


    Диск хорошо продавался и добрался до 33 места в английском топе альбомов. Джимми
    отыграл с группой целый ряд концертов, но так и не смог стать полноценной заменой
    ушедшего лидера. Вместе со смертью Леса Харви группа потеряла свою движущую силу,
    и в 1973 году распалась. Мэгги начала сольную карьеру, Колин Аллен присоединился
    к Focus, а Джимми МакКаллах оказался в группе Wings под крылышком Поля Маккартни.'
