- id: 1701
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-19'
  text: 'Stone the Crows - незаслуженно забытая сильнейшая блюз-роковая группа начала 70-х, была создана в конце 60-х в Глазго
    (Шотландия) гитаристом Лесом Харви (младшим братом Алекса Харви) и певицей Мэгги Белл. Имя Stone the Crows дал группе
    Питер Грант (менеджер Лед Зеппелин), которого настолько поразила молодая группа, что он немедленно подписал с ними контракт
    и стал их менеджером. После выхода второго альбома Ode to John Law произошла смена состава - Джон МакГиннис и Джимми Дьюар
    покинули группу, а на смену им пришли Стив Томпсон (бас) и Ронни Лихи (клавиши).


    Третий и самый успешный альбом группы, записанный уже с новыми басистом и клавишником (Ронни Лихи до этого играл у Джона
    Мэйолла, и вместе с Колином Алленом в составе группы оказалось уже двое бывших Блюзбрейкеров). Группа практически полностью
    отошла от психоделии и сконцентрировалась на мощном жестком хард роке с элементами блюза. Мэгги Белл и Лес Харви, как
    обычно, хороши, но и остальные музыканты не отстают. Big Jim Slater и Mr. Wizard - просто классика жанра!


    На диске два кавера, остальные треки написаны музыкантами группы (причем One Five Eight написал уже ушедший к этому моменту
    из группы клавишник Джон МакГиннис). Продюсировал Марк Лондон. На CD альбом впервые вышел в 1996 году в Германии на фирме
    Repertoire.


    На момент выпуска этого альбома группа была на подъеме - она побеждала в опросах популярности, выступала с аншлагами в
    престижных залах и на всех основных рок-фестивалях, приближаясь по популярности к Free и Bad Company. Мэгги Белл стала
    лучшей вокалисткой по итогам ежегодного опроса читателей журнала Melody Maker. Но 3 мая 1972 года произошла трагедия -
    Лес Харви получил удар током во время выступления и скончался прямо на сцене.'
