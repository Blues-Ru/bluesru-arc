  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-05-19'
  text: 'Stone the Crows - незаслуженно забытая сильнейшая блюз-роковая группа начала
    70-х, была создана в конце 60-х в Глазго (Шотландия) гитаристом Лесом Харви (младшим
    братом Алекса Харви) и певицей Мэгги Белл, к которым присоединились поющий бассист
    Джимми Дьюар, клавишник Джон МакГиннис и ударник Колин Аллен (игравший до этого
    у Джона Мэйолла). Эта группа называлась тогда Power. Имя Stone the Crows дал группе
    Питер Грант (менеджер Лед Зеппелин), которого настолько поразила молодая группа,
    что он немедленно подписал с ними контракт и стал их менеджером.


    Первый альбом был записан в 1969 году (вышел в начале 1970-го) и представил на
    свет публики интересный сплав блюза и хард рока (на первой стороне пластинки),
    а вторая сторона была отдана одной длинной хард-роковой композиции, включающей
    элементы психоделии и прогрессива. Гитарная работа Лесли была хорошего уровня,
    но особенно впечатлял сильный и проникновенный хриплый блюзовый вокал Мэгги, которой
    немедленно стали пророчить славу новой Джэнис Джоплин. Критика встретила группу
    благосклонно, но альбом не произвел фурора среди покупателей. Тем не менее это
    был первый шаг в нужном направлении.


    На диске два кавера и три трека сочинения музыкантов группы. Продюсировал Марк
    Лондон, исполнительным продюсером был Питер Грант. На CD альбом впервые вышел
    в 1997 году в Германии на фирме Repertoire.'
