  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-19'
  text: 'Второй альбом группы получился намного ровнее и цельнее дебютника - первоклассный
    хард-рок с блюз-роковыми интонациями, психоделия еще изредка встречается в проигрышах,
    но уже сходит на нет. Группа играет очень впечатляюще - мощные клавиши, крепкая
    ритм-секция с громким плотным басом Дьюара, Лес и Мэгги как обычно на высоте.
    Жемчужина пластинки - роскошная блюзовая Danger Zone (кавер Перси и Куртиса Мэйфилдов),
    спетая Мэгги выше всяких похвал. В целом очень добротный альбом, который хочется
    слушать и переслушивать. В качестве бонуса включена сингловая укороченная версия
    Things are getting better.


    На диске один кавер, остальные треки написаны музыкантами группы. Продюсировал
    Марк Лондон, исполнительным продюсером был Питер Грант. На CD альбом впервые вышел
    в 1996 году в Германии на фирме Repertoire. Качество фонограммы очень приличное,
    а уж с учетом ее возраста ... В очередной раз остается поблагодарить кудесников
    с Repertiore Records за то, что они вкладывают все силы в издание раритетов, причем
    делают это с полной отдачей.


    После выхода альбома группу постиг первый серьезный удар - ее покинули Джон МакГиннис
    и Джимми Дьюар. На смену им пришли Стив Томпсон (бас) и Ронни Лихи (клавиши),
    с которыми группа и записала в 1971 году свой самый успешный альбом - Teenage
    Licks.'
