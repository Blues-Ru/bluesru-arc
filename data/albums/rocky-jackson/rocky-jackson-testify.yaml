  date: '2010-07-27'
  text: Удостовертесь! Роки сегодня играет блюз полувековой давности. Все точно по стилю, поэтому его песни звучат согласно
    с шедеврами Уилли Диксона. Темп выдержан идеально, гитара не торопится. Удивительно, что на крошечный бюджет можно записать
    такой альбом. Альянс ударных и соло просто идеальный.
