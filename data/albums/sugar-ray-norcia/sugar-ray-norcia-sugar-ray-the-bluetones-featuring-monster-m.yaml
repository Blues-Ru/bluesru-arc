  author: Константин Колесниченко
  mark: 9
  date: '2007-12-21'
  text: 'На этом альбоме я открыл для себя Sugar Ray Norcia как потрясающего харпера. До этого диска я воспринимал его исключительно
    как вокалиста. Он играл на губной гармонике и на предыдущих альбомах, что я слышал, но ничего особенно выдающегося я не
    слышал, да и было это вкраплениями, так, одна-две композиции. А вот на " Sugar Ray & the Bluetones Featuring Monster Mike
    Welch" я был приятно удивлен его игрой. Тут есть 2 замечательных инструментала, ориентированных именно на харп: знаменитая
    "And The Angels Sing" и "From Now on This Morning (11 September)", на которых Sugar Ray с отличным вкусом и звуком играет
    интересные мелодии, что нехарактерно для традиционного блюзового исполнения на гармонике. На акустической "Feeling Blue"
    звучит, на мой взгляд, вообще одно из лучших соло на харпе!


    О вокале Норсии говорить бессмысленно - он мастер!


    Теперь непосредственно о том, кого же представляет нам группа Bluetones. Mike Welch получил свое прозвище "Monster" от
    Dan Aykroyd, который был потрясен гитарной игрой юного дарования. И, в принципе, я согласен с этим именем. Повзрослевший,
    но еще достаточно молодой, Майк замечательно играет на гитаре на этом альбоме, тонко и со вкусом. А на альберткинговской
    "Funk-Shun" он очень показательно воспроизводит манеру игры старого мастера. В отличие от других молодых и белых, игра
    Майка не варьируется от оголтелого блюз-рока (с акцентом на слове рок) до west-coast, имеющего за собой тоже солидный
    запас гитарных героев. Monster Mike Welch в своей гитарной манере скорее близок к чикагской манере. Следует также отметить,
    что он пишет неплохие песни, которые тоже присутствуют на этом альбоме.


    Группа Bluetones - тоже заслуживает похвалы, они замечательно поддерживают солистов, создавая правильный и плотный подклад.
    Michael "Mudcat" Ward - bass, а также является автором некоторых песен на альбоме, Neil Gouvin - drums, Antony Geraci
    - piano, organ.'
