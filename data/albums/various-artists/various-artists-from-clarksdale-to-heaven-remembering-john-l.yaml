  text: Песни Хукера исполняют Питер Грин, Гэри Мур, Мик Тейлор, Джек Брюс, Гэри Брукер, Джефф Бек и др. Альбом для тех, кто
    любит перечисленных музыкантов, но едва ли для поклонников Хукера. Банальность "Хукера невозможно копировать, имитировать,
    повторить" обретает в виде этого диска убийственный аргумент.
