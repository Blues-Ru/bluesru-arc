- id: 1463
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: 'Исключительно для знатоков и историков. Качество звука – отвратительное. Но любители чикагского блюза положат этот
    диск к себе на полочку. Споры о том, повлиял ли Бадди Гай на юного Джими Хендрикса решаются при прослушивании трека Junior''s
    Shuffle. На самом деле, Веллс в это номере играет мало, а вот Гай исполняет просто пиротехнические гитарные трюки, невообразимые
    для 64 года. Рядим с этим треком есть знаменитая (I can''t Get No) Satisfaction, исполненная более варварски и яростно,
    чем самими авторами. Сет Отиса Раша не подарит сюрпризов. Но с ним записался Литтл Уолтер – и это последняя его запись,
    которая должна быть в архиве любителя чикагского блюза. Но есть еще последний довод в пользу исторического значения этого
    альбома: сокрушительный! Именно так звучал чикагский блюз середины 60-х годов не в студии, в клубах.'
