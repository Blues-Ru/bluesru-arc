  author: Александр Панин
  mark: 9
  date: '2006-04-11'
  text: 'Есть такая довольно интересная серия лейбла Yazoo под названием Before The Blues. В ней три выпуска, посвящена она,
    конечно, не доблюзовым временам (вспомните, когда музыку начали записывать и когда появился блюз), а всему спектру американского
    довоенного народного творчества. Вот и новый язушный двойник очень похож на диски этой серии. Здесь представлены действительно
    самые различные образцы американской музыкальной культуры: блюз, кантри, олд-тайм, госпел, кейджн в исполнении таких известных
    людей, как Томми Джонсон, Мемфис Минни, Док Боггс, Джейберд Коулмен, Амеде Ардуэн. И, конечно же, Сон Хаус, ради которого
    этот сборник и затевался. Дело в том, что в прошлом году были разысканы две доселе непереизданные его парамаунтовские
    записи конца двадцатых годов. Долгое время они считались утерянными, и отдельные специалисты даже сомневались, были ли
    они официально выпущены, хотя в каталогах эти две песни (Mississippi County Farm Blues и Clarksdale Moan) числились. Парамаунт
    - это почти всегда плохое качество, к сожалению, и "новые" вещи действительно сильно пропесочены, но силы и эмоциональности
    выступлений это никак не убавляет. Первая композиция - типичный размашистый Хаус, а вот вторая необычная, не такая энергичная,
    но более ритмичная и точная.


    На каждом из двух дисков по 23 песни (стандартное количество для нынешних изданий Yazoo), много с чем нужно разбираться.
    Не очень понятно, что из этого совсем уж редкое и сенсационное, кроме упомянутого Хауса и коллектива Georgia Pot Lickers.
    По-видимому, ряд песен издан впервые в лучшем качестве. Конечно, на дисках много совсем малоизвестных музыкантов.


    Ставлю изданию на пол-балла ниже максимума лишь за традиционное язушное пренебрежение к деталям (никаких дат записей и
    составов участников в красивом 20-страничном буклете нет и в помине, да и хотя бы коротких рассказов о каждом из представленных
    исполнителей явно не хватает).'
