- id: 261
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Один из многочисленных блюзовых сборников, ежегодно выпускаемых различными фирмами, дабы представить "своих" музыкантов.
    Telarc, кстати, в отличие от многих, здесь есть кем похвастаться, поэтому и подборочка получилась совсем неплохой. Начинается
    все с блюза Tinsley Ellis "Hell Or High Water", действительно одной из лучших записей гитариста, сделанных им за последние
    годы. Сразу за ней следует "Fast And Free", очень приличная вещица другого мастера гитары - Tab Benoit. Это, к слову,
    единственный музыкант, попавший на "Now This Is What We Call Blues" дважды. Второй раз он выступает в компании с Jimmy
    Thackery. Представлены на сборнике и все остальные звезды блюза, за короткий срок перекочевавшие на Telarc с других лейблов.
    Это великолепный исполнитель на губной гармонике James Cotton, его коллега Charlie Musselwhite, гитаристы Joe Louis Walker,
    Ronnie Earl и т.д.


    Наименее известными из тех, чьи записи вошли в "Now This Is What We Call Blues", можно считать гитариста Paul Geremia,
    хотя ему уже под 60, и пластинок штук восемь он за свою карьеру выпустил. Дуэт Little Annie Raines и Paul Rishell тоже
    не особо знаменит, видимо, этих далеко не молодых музыкантов Telarc собирается раскручивать в ближайшем будущем.'
