  date: '2002-12-17'
  text: 'Послушав несколько первых энергичных блюзов из этой американской сборки, так и хочется последовать совету, напечатанному
    на задней стороне обложки: "Отправляйся в дорогу с десятью превосходными блюзменами! Эта десятка провезет тебя по автостраде
    с настоящим шиком! Вскакивай в свой Блюзмобиль и газуй - прокатись с ветерком!"


    <p>Интересно было услышать сборный диск, где почти ни одно имя ни о чем мне не говорило. Это свидетельствует, само собой,
    не о "малоизвестности" остальных исполнителей, а о том, что до нас, к сожалению, доходит не так много хороших образцов
    "глубинного" американского блюза. Только после тщательного изучения составов всех групп я обнаружил в одной из них на
    фортепиано Доктора Джона (Dr. John) - он же Мак Ребеннак (Mac Rebennak), который уже много лет участвует в сессиях как
    "звезд", вроде Джона Скофилда (John Scofield), так и просто своих друзей. Практически все парни из этой десятки записываются
    в студиях на Юге США, в штатах Техас, Луизиана, Флорида, и только два - в Массачусетсе и один - в Калифорнии. Почему я
    уделяю этому так много внимания? Да потому, что более всего в Европе как раз известны блюзмены из Нью-Йорка, Чикаго, и
    Сан-Франциско, например, Джонни Ли Хукер (John Lee Hooker) которые здесь не представлены вовсе.


    <p>Вышеупомянутая надпись относительно "автомобильной" специфики альбома подтверждается не только характером самой музыки,
    но и ее тематикой. Названия вещей как нельзя лучше подходят для прогулки по автостраде под их аккомпанемент - "Блюзмобиль"
    (Bluesmobile), "Парень с бензоколонки" (Gas Station Man), "Газуй!" (Step On It), "Автопилот" (Cruise Control), "Давай
    прокатимся" (Let''s Ride).


    <p>Стилистически все записи очень близки - это ритм-энд-блюз, прямо-таки пульсирующий от избытка энергии даже в медленных
    композициях. Минимум излишеств и украшательств, главный инструмент - гитара, гитара и еще раз гитара, различные духовые
    в тех немногих местах, где они присутствуют, служат лишь для бэкграунда (за исключением первой песни, где наряду с вокалом
    лидирует классное трио Oh Gee Horns - тенор, баритон-саксофон и труба).


    <p>Короче говоря, если у вас есть автомобиль - без этого альбома мощностью в сто пятьдесят лошадиных сил вам просто не
    обойтись, а если машины нет - тоже не беда, музыка даст вам ощущения не хуже.'
