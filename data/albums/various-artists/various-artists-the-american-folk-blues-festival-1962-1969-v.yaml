  author: Сергей Исправников
  mark: null
  date: '2007-09-13'
  text: 'В третий DVD из серии "American Folk Blues Festival" включены съемки немецкой телекомпании Sudwestfunk, не вошедшие
    в первые два выпуска, а также уникальный материал, отснятый датским телевидением в 1967 г. в рамках этих же гастролей.
    Съемки Sudwestfunk инициировал один из организаторов турне – Хорст Липман, который с конца 50-х г.г. был еще и директором
    регулярной джазовой передачи, выходившей на немецком телевидении. Благодаря его стараниям, с 1962 по 1966 гг. производились
    съемки часовой программы, отражавшей каждый год проведения фестиваля.


    Что касается 1962 г., то на диске приведена запись финального джема с участием всех участников шоу: певицы Helen Humes
    (съемка которой здесь появилась в рамках серии впервые), дуэта Sonny Terry и Brownie McGhee, пианиста Мемфиса Слима, гитариста
    Ти-Боун Уолкера, непременного Уилли Диксона и ударника Джамп Джексона (трек 15). Ближе к концу Уолкер начинает играть
    свой фирменный шаффл, которым и заканчивается выступление.


    1965 г. представлен четырьмя треками: певицей Big Mama Thornton в сопровождении Buddy Guy и ритм-секции (трек 1), сольным
    номером самого Buddy Guy (трек 3), выступлениями Roosevelt Sykes (трек 2) и Dr. Isaiah Ross (трек 4). Isaiah Ross, также
    впервые появляющийся на этом выпуске, был человеком-оркестром, одновременно играя на гитаре, губной гармонике и ударных.
    Прозвище "доктор" он получил во время войны, благодаря своим познаниям в медицине. Для европейской аудитории, ранее никогда
    не видевшей, чтобы один человек играл за целый блюз-бэнд, его выступления стали настоящим открытием. Пианист Рузвельт
    Сайкс, оказавший большое влияние на формирование пианистического блюза вообще, демонстрирует здесь свое фирменное "Gulfport
    Boogie". Однако лучшими съемками этого тура оказались выступления Buddy Guy и Big Mama Thornton. Buddy Guy был одним из
    новаторов блюзовой гитары и представлял на европейской сцене молодое поколение чикагских блюзменов. Заканчивала концерты
    Big Mama Thornton, чья внешность полностью соответствовала этому прозвищу. Несмотря на внушительные формы "Большой мамы",
    ее сценические выступления были ярким шоу, просто переполненным энергией.


    Из участников фестиваля 1966 г. на диске впервые в этой серии записано выступление ритм-энд-блюзового вокалиста Big Joe
    Turner (трек 5), которому аккомпанирует звездный состав: Otis Rush (гитара), Little Brother Montgomery (фортепьяно) и
    одна из лучших ритм-секций послевоенного Чикаго – Jack Myers (бас) и Fred Below (ударные).


    1967 г. был достаточно уникальным по составу участников, что было связано, в первую очередь, с фолк-блюзовым возрождением
    в Америке, когда в 60-е гг. из забвения возвращались герои довоенного блюза Дельты, такие как представленные здесь гитаристы
    Skip James (треки 6-7), Bukka White (трек 8) и легендарный Son House (трек 9). Более легкий и мелодичный Пьедмонт-блюз
    представлен неизменным дуэтом Sonny Terry и Brownie McGhee (треки 12 – 14), послевоенное Чикаго – гитаристом Hound Dog
    Taylor (трек 10), исполнителем на губной гармонике Little Walter и певицей Koko Taylor (трек 11). Ритм-секцию составили
    Dillard Crume (бас) и Odie Payne (ударные). Причем, кроме Little Walter, Sonny Terry и Brownie McGhee, ни один из них
    ранее не был в Европе. Представители старшего поколения блюзменов ощущали себя не очень уютно. Тот же Ским Джеймс вспоминал,
    что чувствовал, будто на него смотрят, как на непонятно кого, как на какого-то медведя. Тем не менее, это не помешало
    каждому из них продемонстрировать свой уникальный стиль игры на гитаре. Что касается самого известного гармошечника послевоенного
    Чикаго – Little Walter – то на диске представлены единственные сохранившиеся записи с его участием, где он аккомпанирует
    Hound Dog Taylor и Koko Taylor. Надо сказать, что тур выдался для него неудачным, во-первых, он был вынужден играть на
    губной гармонике в несвойственной ему манере без электроусиления, причем не из-за козней продюсеров, а по своей забывчивости.
    Вторая проблема была с Hound Dog Taylor, который помимо сольных выступлений, во время тура аккомпанировал и другим исполнителям.
    Причем, по общему мнению, аккомпанировать он не мог вообще, соответственно, остальным во время их собственных номеров
    приходилось подлаживаться под него. В довершении всего, через три месяца как он вернулся в Штаты, 15 февраля 1968 г. Little
    Walter был убит во время уличной драки.


    Фестиваль 1969 г. представлен съемкой Эрла Хукера (трек 16). Это были его первые и последние гастроли в Европе. Своими
    виртуозными выступлениями, наполненными гитарной пиротехникой, он закрывал фестивальные концерты. Хотя это никак не отразилось
    на качестве исполнения, переполненного энергией и самоотдачей, уже во время тура он был болен туберкулезом, от которого
    так и не смог вылечиться.


    В отношении съемок 1968 г. нужно сказать, что прямого отношения к "American Folk Blues Festival" они не имеют. Здесь запечатлены
    две классических вещи Мадди Уотерса – "Long Distance Call" (трек 17) и "Got My Mojo Working" (трек 18) – снятые в конце
    года немецким телевидением в рамках программы, посвященной соул-музыке. Несмотря на то, что его последний альбом того
    времени – "Electric Mud" – был выдержан в психоделическом ключе и вызвал неоднозначную реакцию публики, здесь он играл
    традиционный электрический блюз чикагской школы, лучшим исполнителем которого он и был за всю историю существования данного
    жанра.'
