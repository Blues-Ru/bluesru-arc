  author: Леонид Аускерн
  mark: null
  date: '2002-12-17'
  text: 'Общеизвестно, что блюз - музыка, которую острее воспринимаешь в ночной, в крайнем случае, - в вечерней тишине. Уходит
    дневная суета, приглушаешь свет, отключаешься от всего постороннего и - слушаешь блюз...


    <p>Название очередного сборника блюзовой музыки в уже знакомой нашим читателям серии фирмы "Rounder Records" в этой связи
    нельз не признать очень удачным. Что же до качества музыки, то оно удовлетворит даже строгого ценителя. Этот диск будет
    не лишним в самой изысканной коллекции.


    <p>В серии уже выходили альбомы чисто инструментальных блюзов. Однако можно отметить некоторые особенности, отличающие
    "Blues After Hours" от тех дисков, которые мне довелось слышать в этой серии ранее. Здесь довольно много блюзов с солирующим
    духовым инструментом. Согласитесь, не часто можно услышать, как основную тему в блюзе ведет тромбон - Джен "Майти Фли"
    Коннорс (Gene "Mighty Flea" Connors) делает это весьма грациозно в "Sanctified".


    <p>Мощно и агрессивно ведет свою партию в диалоге с гитарой Отиса Гранда (Otis Grand) тенор-саксофонист Джо Хьюстон (Joe
    Houston) в композиции "They Killed Crazy Horse". Можно добавить, что и в пьесе чикагского органиста Тони Зета (Tony Z)
    "Get Doun With The Blues" магия музыки рождается из слияния голосов его "Хэммонда", гитары Дьюка Робилларда и саксофониста
    Хьюстона Персона.


    <p>Несколько рафинированно, так сказать, в филармонической подаче, исполняет блюз на фортепиано Дэвид Максвелл (David
    Maxwell) в композиции собственного сочинения "Down At P.J.''s Place".


    <p>Но основу альбома составляет, как водится, парад гитаристов. Один из "завсегдатаев" серии Ронни Эрл (Ronnie Earl) блистает
    как в дуэте с органом ("Baby Doll Blues"), так и в виртуозной перекличке с другим гитаристом, Хьюбертом Самлином (Hubert
    Sumlin) - "Blues For Henry". Не обошлось и без техасской гитарной школы блюза - ее представляют композиции Туту Джонса
    (Tutu Jones) и Майка Моргана (Mike Morgan) и его состава "The Crawl".


    <p>В названиях шести из десяти записанных на диске произведений присутствует слово "блюз". Думается, однако, что даже
    не очень искушенный любитель распознает эту замечательную музыку с первого же такта первой же пьесы. Бьюсь об заклад,
    он не в силах будет выключить свой аппарат до последнего такта последней пьесы.'
