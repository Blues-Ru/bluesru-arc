reviews:
- id: 1061
  author: Константин Колесниченко
  mark: 4
  date: '2007-04-16'
  text: 'Набор музыкантов несколько изменился по сравнению с первой частью, но идея и исполнение остались те же. Музыканты,
    сменяя друг друга, играют композиции, отличимые друг от друга только словами. Возможно, это интересно смотреть-слушать,
    сидя в клубе, но слушать на сд - это очень скучно и абсолютно непознавательно. Ставлю на полбалла больше, потому что тут
    появились неплохие музыканты (Gary Primich, Paris Slim, которого я больше нигде не слышал), и материал чуть разнообразили
    (фанки блюз а ля Junior Wells сыграл Paris Slim). Харперы солисты: Paris Slim, Gary Primich, Gary Smith, Mark Hummel,
    Paul and Annie, Johnny Dyer, RJ Mischo. И опять мне не понятно такое однообразие, ведь на альбомах эти музыканты играют
    совсем по-другому.'
