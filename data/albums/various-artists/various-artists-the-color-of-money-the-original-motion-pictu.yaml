reviews:
- id: 343
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-12-09'
  text: 'Отличный саундтрек к фильму Мартина Скорсезе. 10 интересных треков. Мы знаем любовь Мартина к блюзу и со вкусом у
    него все в порядке. Здесь классные исполнители: Don Henley, Robert Palmer, Eric Clapton, Mark Knopfler, Willie Dixon,
    B.B. King, Warren Zevon, Robbie Robertson. К сожалению, я не видел фильма, но саундтрек уже нравится. Хороший альбом "под
    настроение".'
