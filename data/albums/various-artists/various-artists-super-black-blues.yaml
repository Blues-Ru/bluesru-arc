- id: 968
  author: Дмитрий Казанцев
  mark: 9
  date: '2006-02-12'
  text: 'Есть два диска с таким названием - Volume 1 & Volume 2. На первом - 4 студийных трека, где джемуют: T-Bone Walker,
    Joe Turner, Otis Spann, George "Harmonica" Smith, Paul Humphrey, Ernie Watts, Arthur Wright & Ron Brown. А вот на втором
    диске - 10 концертных блюзов (Карнеги Холл!!!) в исполнении Lou Willie Turner, Reece Fleming, Eddie "Cleanhead" Vinson,
    Leon Thomas, T-Bone Walker. Эти записи сделаны в 1969 и 1970 годах, а издали их только в 2004-ом. Настоящая находка для
    любителей настоящего черного блюза. Отменное качество записи, прекрасное исполнение!'
