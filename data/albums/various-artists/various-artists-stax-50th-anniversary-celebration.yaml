- id: 1485
  author: Андрей Евдокимов
  mark: 9
  date: '2009-02-05'
  text: 'Эти 50 песен - беспроигрышный вариант! Историки довольны: важность Stax в
    развитии популярной музыки невозможно переоценить. Главное течение соул, блюза
    и ритм-энд-блюза в 60-х и начале 70-х проходило через студию этого лейбла. Аккомпанировал
    там чаще всего квартет гениев поп-музыки Booker T. & The MG''s. А полный список
    звезд, оставивших свою веху в истории, едва ли поместится и в четырех таких рецензиях.
    Коллекционеры довольны: выпускается не сборник хитов, а именно лучшее из записанного
    на студии (не всегда лучшие песни добирались до вершин чартов). Кроме "звезд",
    здесь представлены имена полузабытые, но достойные, чтобы их вспомнили. Многостраничный
    буклет об истории лейбла тоже придется кстати. А шикарная упаковка при низкой
    цене превращает этот набор в великолепный подарок: два с половиной часа мастерской
    энергичной музыки не даст заскучать и доставит удовольствие тем, кто не желает
    заморачиваться по поводу ее исторической важности.'
