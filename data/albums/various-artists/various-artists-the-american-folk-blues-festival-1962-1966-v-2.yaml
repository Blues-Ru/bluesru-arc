  author: Сергей Исправников
  mark: null
  date: '2007-09-11'
  text: 'Этот DVD продолжает серию записей "American Folk Blues Festival", сделанных
    немецкой телекомпанией Sudwestfunk в 1962-66 и 1969 гг. Что касается самого фестиваля,
    то он во многом явился катализатором интереса к блюзу в Западной Европе. Причем
    его устроители, Хорст Липман и Фриц Рау, сами были поклонниками именно джаза и
    рассматривали блюз только как его предшественника. Они думали, что блюзовый фестиваль
    найдет свою аудиторию среди джазовой публики. Однако этого не произошло, многие
    эстеты считали блюз слишком грубой и примитивной музыкой. Вместо них на концертах
    оказалось большое количество молодежи, которая едва ли была знакома с творчеством
    Чарли Паркера или Мингуса, однако горела энтузиазмом слушать и играть блюз. Тем
    не менее, состав исполнителей – от акустического кантри-блюза до послевоенного
    Чикаго в жестком электричестве – соответствовал запросам самой широкой аудитории
    любителей блюза.


    Фестиваль 1962 г. представлен здесь съемками дуэта гармошечника Sonny Terry и
    гитариста Brownie McGhee (трек 12), дополняющими их материал на первом DVD этой
    серии. Также как и на первом выпуске присутствует Ти-Боун Уолкер, однако здесь
    он представлен не в фолковом, а привычном для него "электрическом" амплуа лучшего
    гитариста вест-коаст блюза (трек 8). Ему аккомпанируют: Уилли Диксон, Мемфис Слим
    и Джамп Джексон. Соответственно, они же вместе с Уолкером играют и на выступлении
    самого Диксона, когда он заикающимся голосом поет "I''m a nervous" (трек 4).


    Ритм-секция фестиваля 1963 г. состояла из группы пианиста Мемфис Слима, и в данный
    DVD включена запись выступления как его самого (трек 7), так и фирменный инструментал
    его гитариста Matt Murphy – "Murphy''s Boogie" (трек 11). В их компании записана
    еще одна вещь в исполнении Уилли Диксона (трек 10). Также из этого тура записана
    композиция в исполнении певицы Victoria Spivey (трек 6). По выражению критиков,
    Виктория была одной из последних "горячих блюзовых мам" с довоенным исполнительским
    стажем. На гитаре ей аккомпанирует Лонни Джонсон, с которым она впервые записалась
    еще в 1927 г.


    Фестиваль 1964 г. представлен на диске наиболее полно. В первую очередь, это две
    вещи в исполнении непревзойденного Сонни Боя Уильямсона (треки 1-2), а также сет
    Хаулин Вулфа (треки 13-15), ставшего олицетворением блюзовой мощи и неистовости.
    Не менее драйвовым было выступление и другой звезды послевоенного блюза – гитариста
    Lightnin'' Hopkins (трек 5), а также пианиста Sunnyland Slim (трек 3).


    1965 г. представлен единственным треком – блюзовым джемом, где на губных гармониках
    поочередно солируют Big Mama Thornton, Shakey Horton, J.B. Lenoir, Dr. Ross и
    даже Джон Ли Хукер собственной персоной (трек 16). Из съемок 1966 г. неохваченным
    первым DVD серии оказался представленный здесь один из ветеранов пианистического
    блюза – Roosevelt Sykes (трек 9), начавший играть в кабаках Арканзаса еще в начале
    20-х гг. Съемки 1969 г. демонстрируют мастерство одного из выдающихся представителей
    послевоенного электрического блюза – Magic Sam (треки 17-18). Через несколько
    недель после окончания гастролей, 1 декабря 1969 г. он скончался.'
