- id: 72
  author: Евгений Долгих
  mark: null
  date: '2002-12-17'
  text: 'Четырнадцать блюзовых команд отдали дань памяти своему коллеге, другу и вдохновителю Теодору "Hound Dog" Тэйлору.
    Он никогда не был так широко известен, как Мадди Уотерс или Альберт Кинг, но в Чикаго, где он провел на сцене разных блюзовых
    баров и клубов более 30 лет, его знали и любили очень многие поклонники такой музыки. Фирма "Alligator Records" выпустила
    этот диск в качестве благотворительной акции - вся прибыль от него должна пойти вдове певца и гитариста, не скопившему
    капитала за время своих выступлений.


    <p>Все песни, записанные на альбоме, в свое время исполнялись Тэйлором, и почти все были написаны им самим. В основе это
    энергичный, очень заводной "черный" ритм-энд-блюз и классическое буги. А ведь под такую музыку тридцать лет назад люди
    действительно танцевали, но ее к тому же и слушали, причем с равным успехом. Честно говоря, мне трудно представить себе
    современную танцевальную музыку, которой можно просто спокойно наслаждаться, сидя в уголке с бокалом пива. Блюз и рок-н-ролл
    постепенно стали исключительно музыкой "для души", а не "дл ног", о чем приходится только сожалеть, особенно слушая этот
    мощный, насыщенный "электричеством", альбом.


    <p>Как мне кажется, все группы даже слегка стилизовали свое исполнение под манеру "Hound Dog" Тэйлора: в большинстве вещей
    гитаристы используют слайд (металлический "футляр" на безымянном или среднем пальце левой руки), придающий музыке специфическое
    "подвывающее" звучание и с которым никогда не расставался сам Тэйлор. Среди музыкантов нет очень известных блюзменов,
    но некоторые имена должны быть знакомы и нашим любителям, например, Мэджик Слим & "The Teardrops", Латер Элиссон, Ронни
    Эрл.


    <p>Впрочем, особо выделить кого-то по уровню исполнения на этом диске практически невозможно: все треки сработаны на совесть
    и никто не присутствует просто так, "для галочки". Некоторая однородность музыкального материала полностью окупается разнообразием
    голосов и подачей самой музыки. Все буги сыграны на одном дыхании и прямо-таки заставляют ноги танцевать помимо вашей
    воли, а несколько красивых медленных блюзов показывают, что и глубоко прочувственная, трагическая манера не была чужда
    Тэйлору.


    <p>Отличие этой музыки от, скажем, исполнения Би Би Кинга или Мадди Уотерса состоит с том, что она более приземленная,
    "сырая", нерафинированная, это блюз простых людей, которые после тяжелого дня пришли в бар немного выпить, подвигаться
    в такт ритму и расслабиться перед следующим нелегким утром.'
- id: 2120
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2013-04-25'
  text: 'A kick-ass homage to one of the great sliders of all time. A bottle-necker''s dream" - GUITAR SHOP


    Трибьют знаменитому чикагскому блюзмену (пластинка которого в 1971 году стала первой в каталоге фирмы Аллигатор), записанный
    артистами Аллигатор рекордз и другими звездами блюза. Выручка от записи пошла семье артиста и в фонд Blues Community foundation.
    Все песни написаны самим Тэйлором, кроме треков 12 (автор - Ронни Эрл) и 9 (автор - Элмор Джеймс).


    Мастер слайд-гитары Хаунд Дог Тэйлор и его группа Хаузрокерс играли блюз по клубам Чикаго и окрестностей в течение 30
    лет до контракта с Брюсом Иглауэром, а за 5 лет с 1971 по 1975 г. добились заметной популярности за пределами "города
    ветров". К сожалению, в декабре 1975 года Тэйлор скончался от рака легких, но его четыре альбома на Аллигаторе стали классикой
    сырого традиционного блюза.


    Дань музыканту отдают его коллеги - Magic Slim & the Teardrops (любимая группа самого Тэйлора), Elvin Bishop (игравший
    в молодости в группе Тэйлора), Son Seals (тоже периодически игравший с Тэйлором), а также Luther Allison. George Thorogood
    выступал в разогревающем составе во время турне Тэйлора по Англии. Боб Марголин и Ронни Эрл часто ходили на концерты Тэйлора
    в Бостоне. Остальные музыканты знали музыку Тэйлора только по его записям, но она произвела на них сильнейшее впечатление.'
