- id: 1227
  author: Константин Колесниченко
  mark: 7
  date: '2008-03-18'
  text: 'Первый диск из серии "Superharps" был просто потрясающим: разнообразный, живой и свежий. Лэйбл Telarc попытался повторить
    успех того альбома и выпустил вторую часть, на которой James Cotton, Charlie Musselwhite, Sugar Ray Norcia и Billy Branch
    заменили харперы старшего поколения Snooky Pryor, Raful Neal, Lazy Lester и Carey Bell. К сожалению, второй части не суждено
    было стать настолько же удачной, как "Superharps" виной тому, я уверен, стал подбор материала и более низкий (за исключением
    Carey Bell) исполнительский уровень солистов-харперов. Мне очень понравилась исполнительская манера Lazy Lester, но музыка
    осталась в рамках среднетемпового шаффла; замечательно поет Raful Neal, но опять то же самое (а ведь можно было бы сделать
    что-то в духе соул-блюза); Snooky Pryor интересно комбинирует ритмический и мелодический подход к игре на гармонике, но
    композиции затянуты; а где знаменитые фанки-соло Carey Bell?'
