reviews:
- id: 52
  author: Алексей Калачев
  mark: 8
  date: '2002-12-17'
  text: Во времена всеобщего помешательства на мюзиклах нелишне вспомнить, что у блюза есть собственный мюзикл (и не единственный).
    Мюзикл, меломатериал которого помещен на данный диск, с успехом шёл не один год на Бродвее, и по праву считается главным
    блюзовым ответом на вызов моды. 21 музыкальный фрагмент отражает эволюцию жанра от песнопений и перкуссий племен Западной
    Африки до высших точек развития жанра - "Thrill is Gone" и "Fever". Говоря о достоинствах уникального альбома простым
    языком, вы найдёте на нем ряд стандартов, звучащих фантастически сочно и свежо, что объясняется в первую голову участием
    прекрасных ЧЕРНЫХ вокалистов с дивными голосами. На первый план выступает главное достоинство черной американской музыкальной
    культурой – певческий гений этого народа. Участие в проекте Би Би, Тадж Махала, Бадди Гая и Джонни Ленга говорит само
    за себя.
