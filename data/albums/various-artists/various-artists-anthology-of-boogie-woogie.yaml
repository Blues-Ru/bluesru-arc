reviews:
- id: 116
  author: Алексей Калачев
  mark: 8
  date: '2003-03-18'
  text: 'Рецепт простой: все, кто интересуется происхождением фортепьянного буги-вуги и его звездами 20-х годов, должны обратить
    пристальное внимание на эту простенькую на первый взгляд антологию. На самом деле, она содержит все, что должен знать
    об этом субжанре интересующийся филофонист – главные имена, основные пьесы. Кроме того, тут мы обнаруживаем редких исполнителей,
    творчество которых иной коллекционер разыскивает годами, выписывая диски-компиляции из самых дорогих заморских каталогов.
    Я имею в виду, например, Кларенса "Пайнтоп" Смита или Меад Лукс Льюиса.'
