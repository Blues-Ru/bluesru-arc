- id: 79
  author: Дмитрий Подберезский
  mark: null
  date: '2002-12-17'
  text: 'Сердце похолодело, когда я вчитался наконец в тексты, помещенные на обложке
    данного альбома, который мне хотелось бы отнести к наиболее ярким событиям в мировой
    не только блюзовой, но и вообще – популярной музыке. Ведь здесь записаны песни
    в исполнении уже легендарных музыкантов, с которых, собственно, и начинался наш
    общий европейский рок.


    <p>Честно говоря, не знаю, кому пришла в голову столь блестяща идея посадить за
    общий блюзовый стол первопроходцев стиля в Европе. Вполне вероятно, их объединила
    память об умершем от лейкемии еще в 1964 году Сайриле Дэйвисе, одном из основателей
    группы "Blues Incorporated", о чем сообщено на обложке. Этот же альбом адресован
    как знак уважения всем тем музыкантам, которые оказались причастными к зарождению
    и становлению белого европейского блюза.


    <p>Одним словом, те, кто помнит такие названия и имена, как "Savoy Brown", "Blues
    Incorporated", "Сream", "Fleetwood Mac", Мэгги Белл, Миллер Андерсон, Мик Джэггер,
    Мик Тэйлор, Дик Хексталл-Смит и другие, - этот альбом быть у вас просто обязан!
    И не только потому, что имена и названия столь ярки и значимы: из громких проектов,
    как мы почти все помним, часто получался не менее звучный "пшик". А потому, что
    альбом на самом деле прехорош, а те, кто участвовал в его записи, оказались на
    высоте положения.


    <p>Открывает альбом песня "Send For Me", написанна самим Сайрисом Дэйвисом, вокальную
    партию в которой ведет Джэк Брюс. Затем легендарный Джорджи Фэйм исполняет "If
    You Live" авторства Моуз Эллисон. Чуть позже Крис и Мик Джэггеры сотоварищи преподносят
    "Racketeer Blues" Лонни Джонсона, причем Мик солирует на губной гармошке. Затем
    Пит Браун поет знаменитый блюз "Rocks In May Bed", после чего очередь доходит
    до столь популярного сегодня блюза "Don''t Let Me Be Misunderstood", который исполняет
    соло Миллер Андерсон. А потом Мэгги Белл поет "Blind Man" Дидрика Мэлоуна...


    <p>И так далее в том же духе. А закрывает альбом знаменита в блюз-роке композиция
    "You Shook Me" Уилли Диксона, которую на протяжение 10 минут изумительно преподносят
    Мик Тэйлор и Макс Миддлтон.


    <p>Честно говоря, я никогда ранее не слышал о подобном проекте, вызванном к жизни
    не столько памятью о давно ушедшем коллеге, сколько, честно говоря, памятью о
    столь бурно прожитых годах. А этим людям на самом деле есть что вспомнить. Вы
    можете представить себе, чтобы всего несколько десятков человек перевернули по
    существу музыкальный облик столетия?! Ведь это уже после них, записавшихся для
    данного альбома, пришли "Beatles", и вопрос о революции в поп-музыке, о которой
    столь долго утверждало меньшинство населения земного шара, был окончательно снят:
    меньшинство сделалось большинством. Сегодня многим из этих музыкантов уже за пятьдесят,
    их имена редко появляютс на страницах музыкальных изданий, разве что в связи с
    какой-то некрупной, но для поп-музыки – безусловно круглой датой. Однако программа
    настоящих рыцарей блюзового стола наглядно показала, какой громадный творческий
    потенциал несут в себе эти музыканты. Вот почему любой из любителей белого европейского
    блюза, которому сегодня в районе "полтинника", просто обязан заложить последний
    экземпляр записи Алексиса Корнера, сделанной в первой половине 60-ых на собственных
    "ребрах", и достать если не сам компакт, то хотя бы его запись. Запись, которую
    запланировать невозможно, запись, которую невозможно забыть.


    <p>И больше, собственно, сказать о столь неожиданной и поразительной работе, мне
    нечего.'
