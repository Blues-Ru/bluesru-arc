  date: '2005-11-27'
  text: 'Редкий лейбл, редкий диск, редкие артисты, редкая музыка для тех лет (конец
    60-х, начало 70-х). 16 акустических блюзов разных исполнителей, которые работали
    на лейбле Blue Goose. Roy Bookbinder, Stephen Calt, Rob Fleder, Graham Hine, Larry
    Johnson, John Lewis, Woody Mann, Kenneth McNichol, Bill Williams - вот такие люди
    есть на этой пластинке. Прекрасный фолк-кантри-блюз от относительно молодых людей,
    которые не хотели быть в мейнстриме тех лет.


    Подробности тут: http://www.wirz.de/music/barrefrm.htm'
