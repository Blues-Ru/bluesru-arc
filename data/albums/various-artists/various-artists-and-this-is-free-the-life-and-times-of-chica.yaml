- id: 1318
  author: Андрей Евдокимов
  mark: 9
  date: '2008-07-20'
  text: 'Подарок всем любителям истории блюза, но особенно тем, кто любит все сразу и в удобной упаковке. Вот вам история
    уличного блюза на примере чикагского рынка Максвелл-стрит (конечно, она была бесплатной, но добровольные пожертвования
    в шляпу или картонную коробку весьма приветствовались). Теперь грубая музыка и сильные личности – четко специфицированы,
    поделены на категории, приправлены дополнительными разъяснениями в 20-страничном богато-иллюстрированном буклете. DVD
    в этой "коробочке" наконец-то дает возможность посмотреть фильм AND THIS IS FREE, снятый еще в 1964 году, прямо на месте
    событий. Второй фильм представляет собой новое историческое исследование, отправной точкой берущее аж 20-е годы прошлого
    столетия. Аудио CD тоже ширпотреб не предлагает. Это музыка безыскусна и темпераментна, как любой разговор на рынке...
    В те лучшие годы, когда рынок был особой культурой общения.


    В CD версии представлены записи: Hutto, J.B. & The Hawks , Floyd Jones, Baby Face Leroy Trio, Muddy Waters, Snooky Pryor,
    Robert Nighthawk, Arvella Gray, Johnny Young, Big John Wrencher, Daddy Stovepipe, Mississippi Sarah, Johnny Williams,
    John Lee Granderson, John Henry Barbee, Boll Weevil, Papa Charlie Jackson, Jimmy Rogers, Little Walter, Blind Percy &
    His Blind Band'
