  author: Алексей Калачев
  mark: 10
  date: '2003-09-18'
  text: У сверхпопулярного диска "8 Hands On 88 Keys" имелся предтеча - "Heavy Timbre". Пятеро друзей-пианистов из Чикаго
    наиграли и выпустили его в середине 70-х. С тех пор этот легендарный раритет не переиздавался, а когда о нем вспомнили,
    выяснилось, что мастер-пленка не сохранилась. Пришлось использовать виниловую копию. Результат – отменный. Пробивающийся
    с компакта звук пластинки выглядит даже мило, патриархально.
