  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Далеко не первый альбом - посвящение ливерпульской четверке. Помнится, выходили классические, джазовые, соуловые,
    попсовые и другие пластинки с новыми интерпретациями битловских шедевров. Блюзовые же мне как-то не попадались.


    Не буду расписывать здесь все достоинства и недостатки этой пластинки. Ограничусь лишь перечислением песен, взятых с легендарного
    битловского "Белого альбома", и их исполнителей.Jimmy Thackery со своим постоянным коллективом The Drivers исполнил гремучую
    версию "Why Don''t We Do It In The Road?".Мультиинструменталист и вокалист Lucky Peterson перепел "Yer Blues"."Happiness
    Is A Warm Gun" звучит в исполнении Anders Osborne.Забавную, немного прифанкованную версию "Revolution" предлагают трое
    - Kenny Neal, Lucky Peterson и Tab Benoit.Maria Muldaur спела "Ob-la-di, Ob-la-da".Joe Louis Walker растянул аж на восемь
    минут харрисоновскую "While My Guitar Gently Weeps".Басист T-Bone Wolk спел "Don''t Pass Me By", а Chris Duarte - "I''m
    So Tired".Гитарист Colin Linden сначала спел "Blackbird", а затем вместе с Charlie Musselwhite исполнил инструментальную
    версию "Dear Prudence".'
