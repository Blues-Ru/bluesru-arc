  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2012-08-07'
  text: 'Двухдисковое концертное выступление грандов блюза на фестивале в Ньюпорте в 1973 году. Обязательная программа для
    всех любителей традиционного блюза - тут и Биг Мама Торнтон, и Мадди Уотерс, и БиБи Кинг, но особенно удалось выступление
    Эдди Винсона, да и Клэренс Браун не подкачал.


    В общем, за исключением Артура Крадупа, сочинившего первый хит Элвиса, все остальные исполнители на должной высоте.'
