- id: 671
  author: Александр Панин
  mark: 10
  date: '2005-05-24'
  text: 'Писатель Илайя Уолд (Elijah Wald) выпустил в начале 2004 года книгу под названием Escaping the Delta: Robert Johnson
    and the Invention of the Blues, в которой среди прочего изучаются "корни" Роберта Джонсона, то есть исполнители и композиции,
    особенно повлиявшие на его творчество. Рецензируемый диск может рассматриваться в качестве ее музыкального дополнения.


    На диске 23 трека на 70 минут (это не переиздание более короткого язушного диска 1990 года, а скорее его расширенный вариант,
    хотя несколько вещей на новое издание не попали). Все композиции записаны в 1926-1936 годах. Среди них как очевидные вещи,
    например, Kokomo Blues (один из прототипов Sweet Home Chicago) Скрэппера Блэкуэлла, первое известное исполнение Roll And
    Tumble Blues (Хэмбон Уилли Ньюберн), песни Сона Хауса, Чарли Паттона и других гигантов, так и гораздо менее известные
    блюзы, к примеру, группы Harlem Hamfats и преподобного Клейборна. К диску прилагается 12-страничный буклет со статьей
    Уолда, в которой довольно подробно рассказано о влиянии каждой композиции на музыку Джонсона.


    Уолд постоянно подчеркивает следующую мысль: по меркам 30-х годов Роберт Джонсон был коммерческим музыкантом, а не корневым
    фолк-исполнителем. Он явно слушал много пластинок и записывал (как делали тогда многие) песни, напоминающие успешные хиты
    прошлых лет, использовал проверенные формулы и риффы (паттерны), сочинял "песни-ответы". Корни его (записанной) музыки
    могут быть явно прослежены, в отличие от корней творений того же Паттона. Это ни в коей мере не умаляет значимости двадцати
    девяти выпущенных песен Джонсона, а скорее дает пищу для размышлений и новые стимулы для исследования старой архаики и
    народной американской музыки.'
