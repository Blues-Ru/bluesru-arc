  author: Александр Панин
  mark: 10
  date: '2006-10-30'
  text: '"Хвалите Его на струнах и органе" (Псалтирь 150:3). Взяв на вооружение именно этот фрагмент псалма, одно из пятидесятнических
    движений Америки решило использовать во время служб вместо традиционного органа электрические стальные гитары. Этот инструмент
    можно встретить в самых разных музыкальных жанрах, многие наверняка видели выступления Роберта Рэндольфа на недавнем Crossroads
    Guitar Festival или наблюдали за Ронни Вудом на видеозаписях группы Роллинг Стоунз. Очень часто стальные гитары используются
    в кантри-музыке. Речь идет, как правило, о стационарных гитарах (<a href="http://en.wikipedia.org/wiki/Table_steel_guitar">table
    steel</a> и <a href="http://en.wikipedia.org/wiki/Pedal_steel_guitar">pedal steel</a>), располагающихся в горизонтальном
    положении, играют на них слайдом. В этом документальном фильме, выпущенном лейблом <a href="http://www.arhoolie.com">Arhoolie</a>,
    демонстрируется ряд выступлений мастеров этого инструмента. Традиция "священных стальных гитар" ведет отсчет с тридцатых
    годов прошлого столетия, на смену старикам постоянно приходят новые молодые музыканты. Среди исполнителей, показанных
    в фильме, есть как настоящие звезды – упомянутый уже Роберт Рэндольф, а также братья Кэмпбелл, так и большое число совершенно
    неизвестных мастеров слайда. Для используемой стальной гитары характерен очень вкусный драйвовый звук, похожий на органный,
    в храмах на ней в основном играют произведения в жанрах госпел и спиричуэлс. Фрагменты выступлений в церквях и реакция
    прихожан (белых среди них, как и среди музыкантов, не замечено) потрясают и временами просто шокируют. Надо видеть этот
    настоящий праздник жизни, радости и единения людей!'
