- id: 1397
  author: Андрей Евдокимов
  mark: 6
  date: '2008-12-29'
  text: 'Не девичья музыка: никаких сантиментов и нежничаний. Бар, дорога в Мемфс, одиночество, или, наоборот, уж очень хороший
    мужик!.. В традиционные блюзовые темы вкрался "Багдатский блюз". Перечислять участниц невозможно: три десятка имен! От
    сверхпопулярной Бонни Райт до новых, но очень достойных. Женский вокал в истории блюза занимает архиважное место. Этот
    сборник утверждает и традицию женской гитары, которая в блюзе идет от Мемфис Минни, чья песня "Мои девичьи денечки" завершает
    сборник. Но это самая старая из записей. В альбоме звучит преимущественно современный блюз. На первом CD – ансамблевый,
    на втором – сольный, под гитару. Компиляция составлена известной певицей-гитаристкой Сью Фолей, которая "знает вопрос
    изнутри" и сейчас готовит еще и книгу на эту тему.'
