  author: Александр Панин
  mark: 9
  date: '2006-05-05'
  text: 'Шестнадцать композиций, записанных новоорлеанскими музыкантами осенью 2005
    года, вскорости после разрушительного урагана Катрина. Среди участников этого
    благотворительного проекта – Аллен Туссен, Доктор Джон, Ирма Томас, Баквит Зайдеко,
    Рэнди Ньюман, Уайлд Магнолиас, Дерти Дазн Брасс Бэнд и многие другие. Отличный
    состав, как видите. Некоторые из музыкантов сильно пострадали от наводнения, у
    Туссена вообще практически ничего не осталось, вот что говорит он сам: "My Steinway,
    my records, my arrangements, my studio – it''s all gone. I had eight feet of water
    in my house near Bayou St. John". Однако тут же добавляет – "But the spirit didn''t
    drown. I still have my music. Give me a hammer. I''m ready to do my part". И именно
    Аллен открывает диск отличной версией своей старой композиции Yes We Can Can.
    Звучит просто потрясающе! На диске есть практически все жанры и стили новоорлеанской
    музыки - джаз, блюз, госпел, соул, фанк, зайдеко, кейджн. Большая часть треков
    превосходна, кроме двух вещей Туссена особенно выделю кавер песни Бесси Смит Back
    Water Blues в исполнении Ирмы Томас, древние новоорлеанские ритмы от Wild Magnolias,
    бодрую и энергичную My Feet Can''t Fail Me Now от Dirty Dozen Brass Band, довольно
    необычно сделанный стандарт When The Saints Go Marching In (Эдди Бо) и очень любопытный
    современный кейджн в исполнении Beausoleil. Совсем мне не понравился разве что
    только чересчур затянутый (почти 9 минут!) госпел Баквита Зайдеко с участием Рая
    Кудера и Джима Келтнера.


    Рекомендуется к приобретению всем любителям новоорлеанщины.'
