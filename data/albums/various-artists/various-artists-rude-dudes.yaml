- id: 679
  author: Александр Панин
  mark: 8
  date: '2005-05-25'
  text: 'Как-то внезапно главными специалистами по блюзу стали Мартин Скорcезе и Билл Уаймен. Последний уже выпустил две подборки
    древнего блюза на лейбле Document Records.


    Эта вторая подборка, в отличие от первой, тематическая, и состоит из композиций весьма фривольного содержания. Озаглавлена
    не совсем правильно, кроме чуваков тут полно и чувих. Названия песен, конечно, просто обалденные, от He''s Just My Size
    и Let Me Play With Your Poodle до Banana In Your Fruit Basket и Whats That Smells Like Fish? Сколько фантазии и выдумки!
    Отмечу просто шедевральный буклет, с цветными картинками и цитатами из песен. Очень весело и интересно. Как всегда на
    документовских дисках, у каждой композиции прописаны дата и место записи, а также все принимавшие участие. Недостаток
    у компиляции один - вместо двойника вполне можно было бы ограничиться одним диском.


    Содержание этого сборника дает прекрасный ответ многочисленным "знатокам", безапелляционно заявляющим, что старый блюз
    скучен, печален, грустен и депрессивен, что это когда "хорошему человеку плохо", и подобные глупые вещи. Прислушайтесь
    и поймите, что блюз бывает РАЗНЫЙ!!! А депрессивны, кстати, чаще бывают сами слушатели, а вовсе не исполнители.'
