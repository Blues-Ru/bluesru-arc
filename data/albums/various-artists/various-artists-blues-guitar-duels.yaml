  author: Евгений Долгих
  mark: null
  date: '2002-12-17'
  text: 'Название диска как нельзя лучше соответствует его содержанию. В десяти представленных композициях участвует семнадцать
    классных блюзовых гитаристов, играющих дуэтом в сопровождении своих групп. Мир американского белого и черного блюза и
    рок-н-ролла поистине необъятен. Среди этих семнадцати фамилий есть такие корифеи гитары, как Бадди Гай (Buddy Guy), Дюк
    Робиллард (Duke Robillard), Отис Гранд (Otis Grand), но ведь остальные совершенно ничем им не уступают! Такого количества
    настоящих профессиональных блюзовых гитаристов и вокалистов, какое представлено на одном этом альбоме, вполне может не
    оказаться даже в целой небольшой стране, пусть и с хорошими музыкальными традициями... Да, похоже, что блюз просто растворен
    в крови большинства американцев, и, взяв в руки инструмент, они начинают исполнять его так естественно и просто, как наши
    детишки поют "...в лесу родилась елочка..."


    Почти все представленные на диске песни - это темповый энергичный ритм-энд-блюз со строгим и даже изысканным "городским"
    звучанием. Все инструменты и вокал достаточно сдержанны, за исключением темпераментного и горячего голоса Бадди Гая. Лишь
    две вещи несколько выпадают из общего настроения: классический длинный "медляк" под названием "She''s Gone" Филиппа Уокера
    (Philip Walker) и залихватское буги-вуги "Full Gain" Грэйди Гейнса (Grady Gaines), но и они по уровню накала страсти явно
    не превышают средний уровень. Две записи сделаны в лондонских студиях, и их довольно легко распознать по приглушенному
    ровному тембру и исключительно сбалансированному сведению всех инструментов, что дает возможность в любой момент времени
    четко различать каждый из них в общем звучании оркестра. Это не значит, что остальные записи сделаны хуже, просто у английских
    звукоинженеров несколько иная концепция студийного саунда.


    Общее впечатление от этого альбома (да и от остальных блюзовых записей фирмы "Easydisc") такое, что всемирно известные
    американские блюзмены отличаются от менее известных только тем, что они были более настырны и удачливы и смогли хорошо
    "раскрутиться". Так что любители могут не сомневаться, читая незнакомые имена, - это настояща музыка!'
