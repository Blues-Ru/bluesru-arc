- id: 643
  author: Александр Панин
  mark: 10
  date: '2005-05-20'
  text: 'В 1980 году двое молодых немецких энтузиастов проехали 10 тысяч миль в этнографической экспедиции по югу США, записав
    огромное количество корневой музыки в исполнении встречавшихся им по пути черных блюзменов. Избранный материал издавался
    в начале восьмидесятых на 14 немецких пластинках под общим названием Living Country Blues USA. В конце девяностых эти
    записи еще раз отфильтровали для переиздания на компакте, и в итоге осталось примерно три с половиной часа великолепной
    музыки. Конечно, жаль невыпущенного, но и то, что есть, сражает наповал.


    Здесь очень много разного и хорошего блюза и фолка, исполняемого с помощью разнообразных инструментов (как вам название
    "broom bass" :)), а также много новых персонажей, разобраться в которых помогает потрясающий 48-страничный буклет. В 1980-м
    почти все эти имена никому ничего не говорили, за исключением, пожалуй, Хэмми Никсона и Джеймса Томаса, ряд людей в дальнейшем
    получили некоторую известность (Othar Turner, Lonnie Pitchford, John Cephas, Phil Wiggins, CeDell Davis), но многие так
    больше никогда не записывались.


    Эту коробку вполне можно поставить в один ряд с ломаксовской Sounds Of The South и другими сборками полевых записей.'
