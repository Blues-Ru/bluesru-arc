- id: 1237
  author: Константин Колесниченко
  mark: 10
  date: '2008-03-22'
  text: 'Один из лучших альбомов с губной гармоникой: плотный, насыщенный и разнообразный.
    Это именно тот случай, когда блюз звучит так, как он и должен звучать. Харперы
    Charlie Musselwhite, James Cotton, Billy Branch, Sugar Ray Norcia играют соло,
    устраивают дуэли, шутят и вообще видно, что музыканты вдохновлены идеей записи
    такого альбома. Некоторые композиции на альбоме с привкусом джаза, некоторые акустического
    блюза, чикаго; пение Норсии и Бранча - это очень и очень здорово!'
