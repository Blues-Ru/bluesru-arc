  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2018-11-30'
  text: 'Данный альбом - трибьют творчеству великой блюзовой исполнительницы является проектом Марии Малдор, для которой Мемфис
    Минни всегда была кумиром. Мария выступила в роли инициатора, участника и продюсера данного сборника, на котором представлены
    ее версии песен Мемфис Минни, записанные ранее с Элвином Янгблад Хартом, Роем Роджерсом, Дел Реем и Стивом Джеймсом, а
    также новые записи песен знаменитой гитаристки в исполнении Рори Блок, Бонни Райатт и Руфь Фостер. Кроме того, Марии удалось
    добавить в сборник по одной песне Минни, записанных ранее Фебой Сноу и Коко Тэйлор (которой на данном треке аккомпанируют
    Боб Марголин и Крисс Джонсон). Формально данный диск был анонсирован в качестве 40-го альбома самой Марии Малдор, но это
    все-таки сборник (хотя, надо признать, без Марии данного альбома просто бы не было).


    В итоге получился альбом традиционного акустического блюза с минимальным инструментарием, причем достаточно ровный - даже
    несмотря на то, что треки собраны из разных источников. Прекрасная иллюстрация творчества ведущей блюзовой исполнительницы
    первой половины двадцатого века, влияния которого не избежали даже такие гранды хард-рока, как Led Zeppelin (When the
    Levee Breaks с четвертого альбома является творческой переработкой песни Мемфис Минни).'
