- id: 1232
  author: Андрей Евдокимов
  mark: 8
  date: '2008-03-22'
  text: С.Л.Джонсон, бывший убийца и новообращенный христианин из "Криминального чтива", сыграл теперь богобоязненного блюзмена,
    как ни трудно в это поверить. И с такой ролью он справился достоверно. Он терзает гитару и поет, как блюзмен, в одиночестве.
    Или завораживает публику в сельском кабаке гипнотическим ритмом и экстатическими выкриками. Аккомпанируют ему ближайшие
    потомки и бывшие участники группы покойного Ар-Эл Бернсайда. Диск представляет не привычную форму саундтрека, а со вкусом
    и хорошим знанием составленную антологию блюза Севера Миссиссиппи - от речей Сонна Хауса до запутанных ритмов под слайд-гитару
    и вокального госпел-квартета North Mississippi Allstars. По заветам Бернсайда сегодня играют психоделический блюз на одном
    аккорде The Black Keys, Precious Bryant, Outragious Cherry… А в блюзе появились записи еще одного Джонсона.
