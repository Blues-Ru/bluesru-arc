  author: Леонид Аускерн
  mark: null
  date: '2002-12-17'
  text: 'Корпорация "Rounder Records" из Массачусетса на своей фирме "Easy Disc" реализует обширный проект - издание целой
    серии сборных альбомов различных исполнителей, чьи творческие интересы сосредоточены в рамках блюза. Для этой цели "Rounder
    Records" не только "поскребла" по собственным "сусекам", но и заручилась согласием на переиздание композиций тех или иных
    блюзменов из каталогов других блюзовых фирм звукозаписи: "Alligator", "Black Top", "JSP".


    <p>"Blues Moods" - характерный пример этой серии. Все десять записей диска - образчики как блюзового вокала, так и инструментального
    мастерства музыкантов. Здесь представлены блюзы белых и черных исполнителей, блюзы Техаса, Чикаго и Луизианы, блюзы, записывавшиеся
    в течение последних десяти лет (самая ранняя запись датирована 1987 годом, поздняя - 1997 г.).


    <p>Преобладают вокалисты-мужчины, из которых я бы выделил певца Ли Мак-Би из техасского состава "Mike Morgan & The Crawl"
    с характерной "воющей" манерой исполнения ("I Let Her Slip Right Through My Hands" (94 г.), известного по выступлениям
    с "Roomful Of Blues" очень "черного" белого блюзмена Шюгай Рэй Норсио, здесь представленного с составом "Bluetones" ("Moment
    Of Passion" (91 г.) и наиболее классического по стилю вокала Битера "Смити" Смита ("35 Long Years" (93 г.).


    <p>В двух композициях из десяти можно услышать женский вокал в блюзе. Дейтре Фэрр в "Taking the Long Way Home" (97 г.)
    близки лучшие традиции классических черных певиц блюза. Здесь есть и глубокое чувство, и чисто блюзовая фразировка. Неплохая
    же сама по себе композици Марсии Балл "Find Another Fool" (89 г.) выглядит единственным инородным телом в альбоме и была
    бы более уместна в сборнике музыки соул.


    <p>Много в альбоме и прекрасных инструментальных партий. По-блюзовому плачет гитара Ронни Эрла ("Ships Passing In The
    Night" (92 г.), по-блюзовому поет орган Рона Леви (в нескольких композициях). Есть и примеры аранжировок с обилием духовых,
    причем состав "Love Dogs" использует и такой раритет, как бас-саксофон. Гленн Шэмбрум, помимо этого громоздкого инструмента,
    играет и на баритон-саксофоне, и гитаре ("Learned To Live Without You" (96 г.).


    <p>В общем, обещанное в названии CD блюзовое настроение овладевает слушателем сразу и прочно. Чего же еще желать истинному
    поклоннику блюза!'
