  date: '2009-04-13'
  text: Всего лишь несколько фактов о Hound Dog Taylor'e и его первом альбоме и все
    станет на свои места. Theodore Roosevelt Taylor родился в Миссисипи в 1915 году
    и назван был в честь президента - Theodore Roosevelt. За гитару он взялся довольно
    поздно - в 20 лет. Перед тем как попасть в Чикаго в 1942 году, он засветился у
    Сонни Боя Вильямсона в его знаменитой радиопередаче KFFA King Biscuit Time. На
    его левой руке было шесть пальцев. Считается, что свою знаменитый инструментал
    "Hide Away" Freddie King позаимствовал именно у Хаунд Дог Тейлора. Фирму "Аллигатор"
    Брюс Иглауэр основал именно ради того, чтобы сделать эту запись. До своего первого
    альбома, вышедшего на Аллигаторе в 1971 году, он записал всего лишь три сингла
    в 60-х годах. Первый его сольный альбом "Hound Dog Taylor and the Houserockers"
    принес ему широкую известность, благодаря которой он объездил всю Америку, был
    даже в Австралии и Новой Зеландии, статьи о нем появились в таких изданиях как
    "Rolling Stone" и "Guitar Player". После такого масштабного успеха он уже больше
    не играл в маленьких и прокуренных клубах Южного Чикаго, разве что для удовольствия.
    Его группа "Houserockers" состояла из двух человек – второго гитариста Brewer
    Phillips и барабанщика Ted Harvey. Hound Dog Taylor входит в пятерку важнейшийх
    слайд-гитаристов Чикаго и блюза в целом. Вместе с Robert Nightwak, Elmore James,
    Muddy Waters и J. B. Hutto он является связью между диким и хаотичным дельта-блюзом
    и городским чикагским.
