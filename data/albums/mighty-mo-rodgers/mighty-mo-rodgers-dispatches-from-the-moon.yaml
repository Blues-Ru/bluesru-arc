- id: 1889
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-06-16'
  text: 'Последняя работа американского мастера современного блюза построена в форме
    радиопередачи, где сам Мо играет роль ведущего, который отвечает на звонки, ставит
    музыку и тп. Сам Роджерс не только написал музыку и аранжировал ее, но также выступил
    и в качестве продюсера. Приятный современный блюз, разбавленный регги и другими
    стилями, не лишенный также изрядной доли юмора.


    Музыку Роджерса можно назвать "интеллигентным блюзом" или "философским блюзом",
    хотя она не лишена и коммерческих ноток. Тем не менее добротные аранжировки и
    запоминающиеся мелодии в совокупности с осмысленными часто злободневными текстами
    выгодно выделяют Майти Мо среди других современных блюзовых исполнителей.'
