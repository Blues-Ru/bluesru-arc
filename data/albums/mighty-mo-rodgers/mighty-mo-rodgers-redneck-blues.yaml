reviews:
- id: 1477
  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: '"Средний класс умер" - не тема для блюза. Могучий Мо известен своей горячей социальной и исторической позицией. Прежде
    он вещал под шикарный аккомпанемент синтезаторов, в котором тонули блюзовые гитарные ноты. Но в самом звуке его мощного
    голоса было нечто завораживающее. Третий альбом потрясает не только названием ("На Юге черные пели кантри, а белые – блюз"),
    но и своим "обнаженным" звучанием. Это блюз как блюз – без ароматических добавок. Лучшая на сегодняшний день работа Роджерса,
    в которой он смог отказаться от пафоса в пользу личных переживаний... Ближе к финалу альбом скатывается к изложению полит-корректных
    взглядов... "Банды, пушки и тестостерон" спасает чувство юмора. А вот в "Блюз – не музыка дьявола" уже не до шуток, что
    печально. Но большая часть альбома восхищает своей естественностью и свежестью. В наше время трудно сочинить хороший госпел.
    Поэтому так хочется, чтобы песня "There But For The Grace Of God" не кончалась никогда, Это не проповедь, это красивая
    мечта'
- id: 1887
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-06-16'
  text: Четвертый сольный альбом блюзового ветерана, вокалиста, пианиста и композитора. Добротный альбом современного блюза
    с традиционной основой и небольшим влиянием соул и блюз-рока. Записан прекрасно, звучит как глоток свежего воздуха!
