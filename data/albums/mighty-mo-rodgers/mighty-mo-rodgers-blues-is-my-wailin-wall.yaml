- id: 1888
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-16'
  text: 'Mighty Mo Rodgers (настоящее имя Морис Роджерс) вырос в блюзовом окружении (у его отца был блюзовый клуб в Индиане).
    Молодой Морис брал уроки классического фортепиано и одновременно учился играть блюзовые стандарты, а также мемфисский
    соул. Бросив колледж, он полностью посвятил себя музыке - играл на клавишных как со своей группой, так и с другими блюзовыми
    исполнителями в качестве сессионного музыканта. Затем он переключился на написание песен для фирмы Мотаун, время от времени
    занимаясь также продюсированием других исполнителей.


    Наконец в 1999 году он выпустил свой первый сольный альбом, состоящий полностью из авторского материала. На диске представлена
    современная версия традиционного блюза с некоторой долей соул и блюз-рока, причем с явным авторским лицом. Пластинка чрезвычайно
    приятная - искренняя, звучащая достаточно оригинально, а также хорошо записанная.'
