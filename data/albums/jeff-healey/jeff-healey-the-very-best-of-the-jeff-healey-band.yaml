  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-11-16'
  text: 'Составление сборника - довольно неблагодарное дело, ибо всегда найдутся люди,
    которые посчитают неправильным включение одних треков, равно как и невключение
    других :-)


    Но в данном случае название не соответствует содержанию, ибо мы имеем отнюдь не
    заявленный Very Best, а типичный Best of Arista Years, ибо сборник составлен из
    4-х альбомов, записанных Джефом для лейбла Ариста. Как Вы сами понимаете, музыка
    от этого хуже не стала, но покупатель диска с таким названием поневоле после прослушивания
    найдет пару ласковых слов для маркетологов :-)'
