- id: 1355
  author: Константин Колесниченко
  mark: 6
  date: '2008-11-05'
  text: 'Это второй альбом известного канадского гитариста, посвященный старому эстрадному и "хот" джазу. Признаюсь, я не
    большой фанат блюз-рока, который играл Джефф до этого, потому эти его записи звучат для меня гораздо более комфортно.
    При прослушивании этих джазовых опусов Хили у меня сложилось впечатление, что играл эту музыку он исключительно для себя,
    в свое удовольствие, осваивал трубу, а так же джазовый подход к гитаре.


    Парадокс, но на этих записях, для меня, Хили звучит гораздо более убедительно в роли певца (хотя вокальные партии тут
    сведены к минимуму), чем гитариста или трубача. В инструментальном плане – это начало его пути к такой музыке.


    Эти альбомы вряд ли станут на полки любителей джаза рядом с подобными записями классиков – Jelly Roll Morton''a, Hot Five
    и Hot Seven или Johnny Dodds, у них нет того огня, задора, изобретательности. Но у альбома есть замечательная расслабленная
    и теплая атмосфера, потому что все сделано с удовольствием и любовью к подобной музыке.'
