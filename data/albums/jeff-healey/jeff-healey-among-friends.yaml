- id: 1368
  author: Константин Колесниченко
  mark: 7
  date: '2008-11-18'
  text: Каталог канадского лейбла "Stony Plain" содержит довольно большое количество музыкантов, играющих свингующую музыку.
    Несколько таких альбомов подарил фирме и знаменитый блюз-рокер Джефф Хили. Я уже писал в своем тексте к его альбому (тоже
    выполненному в ключе традиционного джаза) "Adventures In Jazzland", что музыка, которая получается на этих записях у Джеффа
    далека от стандартов, установленных отцами-основателями жанра, но сделана она с любовью и теплом, которые перекрывают
    все возможные ее недостатки. Умножьте все это на отменное качество записи, приятный вокал Хили, замечательную расслабленную
    атмосферу и получите замечательный альбом, который украсит собой тематический вечер или просто поможет вам окунуться в
    атмосферу того романтичного времени, когда джаз был необычайно популярен.
