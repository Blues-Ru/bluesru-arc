- id: 1283
  author: Леонид Аускерн
  mark: null
  date: '2008-06-03'
  text: Российское переиздание этого альбома канадского лейбла Stony Plain Records
    стало, увы, эпитафией его главному создателю, Джеффу Хили, скончавшемуся в марте
    2008 года от рака. Судьба вообще была чрезмерно сурова к этому музыканту из Канады.
    Уже в раннем детстве он ослеп, что не помешало Хили освоить технику игры на гитаре.
    Это и определило его дальнейший путь. Джефф стал видным блюзовым и роковым гитаристом,
    получившим известность далеко за пределами своей родной страны. Казалось бы, его
    альбому место в блюзовой части нашего "CD – Обзора". Ан нет! В последние восемь–десять
    лет своей карьеры Хили сделал крутой поворот, обратившись … к традиционному джазу!
    В дополнение к гитаре он мастерски освоил игру на трубе и со своим ансамблем Jazz
    Wizards быстро завоевал популярность в среде поклонников джазовой традиции. Для
    работы над альбомом It's Tight Like That Хили пригласил легендарного английского
    тромбониста Криса Барбера. Собственно, особой студийной работы здесь и не было.
    Просто Jazz Wizards Джеффа Хили в составе, усиленном присутствием Барбера, сыграли
    23 августа в одном из залов Торонто концерт, запись которого и превратилась в
    альбом It's Tight Like That. Тромбон Барбера окончательно придал составу диксилендовый
    характер. По репертуару же и характеру исполнения перед слушателем словно воссоздается
    панорама джаза 20-30х годов прошлого века. Тут и Bugle Call Rag, и знаменитый
    Basin Street Blues, и Keep It To Yourself от императрицы блюза Бесси Смит, и авторская
    композиция Барбера Going Up The River. Во всех пьесах музыканты демонстрируют
    отличный свинг, который язык не повернется назвать старомодным, а в отдельных
    треках дуэт гитары и скрипки заставляет вспомнить и классический аналогичный дуэт
    Джанго Рейнхардта и Стефано Грапелли. Очень живой и энергичный альбом, музыка
    которого прекрасно подходит для танцев в стиле ретро.
- id: 1381
  author: Константин Колесниченко
  mark: 7
  date: '2008-12-09'
  text: По-моему, этот альбом - квинтэссенция всех джазовых опусов Хили. Пожалуй,
    он вышел таким благодаря двум компонентам – это полностью живая запись, а также
    на альбоме присутствует легендарный тромбонист Chris Barber, который направляет
    Джеффа в нужном направлении. С этого альбома стоит начинать знакомство с джазовой
    стороной творчества Хили. Интересуетесь ли вы творчеством музыканта впервые или
    являетесь поклонником его блюз-роковых работ, я думаю, вы не останетесь равнодушным.
