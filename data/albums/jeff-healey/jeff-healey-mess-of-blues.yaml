- id: 1260
  author: Андрей Евдокимов
  mark: 7
  date: '2008-04-23'
  text: 'От яростного и грубого блюз-рока до рафинированной и расслабленной джазовой импровизации: "Смешенье блюзов" вынесено
    в заглавие альбома как манифест. Джеф Хиэли шагал над стилевыми барьерами ради электрогитарной музыки во всех ее проявлениях.
    И в нынешнем альбоме есть разболтанная луизианская кантри-песенка "Джамбалайа" (Jambalaya) и величавая баллада Нейла Янга
    "Как Ураган" (Like A Hurricane - Neil Young''s). Но остальное – на радость тем, кто ждал, когда же Хиэли вернется в блюз.
    Записано в Торонто и в Лондоне, в студии и на клубном концерте. Гитара очень эмоциональна. А голос – усталый. Он вернулся
    к музыке, которая принесла ему первую славу. Но это его последний альбом.


    <small><i>По заказу газеты "Ведомости"</small></i>'
- id: 1321
  author: Андрей Евдокимов
  mark: 7
  date: '2008-07-20'
  text: 'Обычно такие записи попадают в разряд "официальных бутлегов" - очень неровное качество и в техническом и в исполнительском
    отношении. Но тут особый случай. Со дня выхода альбома, сделавшего его звездой электрогитарной игры, судьба отмерила Джеффу
    Хиали ровно 20 лет. "Mess of Blues" вышел уже после его смерти. Здесь действительно "смесь" концертных и студийных записей.
    В блюз-роковых аранжировках звучит блюзовая классика. Это именно тот набор песен, который исполняется в блюзовых клубах
    каждый день. Хиали умеет сыграть их свежо и ярко, он сам зажигается от этих известных мелодий, и дежурных гитарных "запилов"
    не будет. Обреченный человек играет энергичный и веселый блюз. "Успех – это жить достойно, делая то, что ты любишь делать"
    - написал Д.Хиали в буклете к альбому…


    <small><i>По заказу журнала "Русский Newsweek"</i></small>'
