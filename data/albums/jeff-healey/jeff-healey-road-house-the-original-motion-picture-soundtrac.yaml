- id: 339
  author: Андрей Евдокимов
  mark: 5
  date: '2003-12-06'
  text: 'Джефф Хиали вновь - в блюзовом амплуа, исполняя роль гитариста в блюзбэнде из придорожной закусочной-гостиницы. Его
    вариант I''m Tore Down - достойное продолжение дела Фредди Кинга, из чьего репертуара и выбрана эта песня. Hoochie Coochie
    Man - вряд ли добавит нечто новое к бесконечной веренице ремейков гениального блюзового стандарта. А дорзовский Roadhouse
    Blues остался чем и был: блюз-роком. Плюс обработка дилановского блюза When the Night Comes Falling From the Sky. Кроме
    The Jeff Healey Band в записи звуковой дорожки к фильму принимали участие: фолк-блюз-группа Little Feat, весело в народном
    стиле исполняющие собственный блюз Rad Gumbo; и BOB SEGER (сын Пита Сигера) - глубокий сочный голос, исполняющий очень
    вкусный ритмэндблюзовый хит Фэтса Доминоу. Включена старая запись Отиса Реддинга (в стиле соул) вместе с Booker T.& The
    MG''s.


    Альбом можно было бы порекомендовать, как вполне приятную смесь традиций блюза вообще, традиций блюз-рока в частности
    с сегодняшним звучанием и виртуозной гитарой Джефа Хиали. Но коротенький альбом на треть состоит из невнятно-попсовых
    записей какого-то Патрика Свайза - типичная музычка из американских подростковых фильмов. Что делать? не переживать.'
