  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-13'
  text: 'Марк Селби - американский гитарист, певец и композитор, который в течение
    долгого времени живет в столице музыки кантри (г. Нэшвилл) и прославился тем,
    что написал множество песен для кантри и рок-звезд, включая Тришу Иарвуд и Дикси
    Чикс (There''s Your Trouble стал №1 в кантри чартах), а также 8 песен на альбоме
    Live On Kenny Wayne Shepherd''a.


    В 2000 году Селби начал сольную карьеру, в которой он придерживается преимущественно
    блюз-рока, а предлагаемый альбом стал его четвертым сольником. В результате получился
    крайне удачный альбом слегка коммерческого традиционного блюз-рока, отменно сыгранный
    и хорошо записанный - звук чистый, мощный и громкий. Селби не сделал никаких особых
    открытий на этом альбоме, но подкупает искренность и чувство, с которым он поет,
    а также мастерство исполнения. Классический альбом электрического блюз-рока.'
