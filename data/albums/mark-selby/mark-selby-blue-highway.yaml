  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2013-08-14'
  text: 'Свой очередной сольный альбом Марк Селби записал, как обычно, в Нэшвилле под руководством легендарного продюсера
    Брента Маера. Помогала ему проверенная ритм-секция из Дэрила Бургесса на ударных и Чарльза Андерсона на басу, а также
    целый ряд высококлассных музыкантов, включая клавишника Тима Лауэра, Джимми Холла на губной гармонике, и знаменитого джазового
    трубача Рода МакГара. Пара треков украшены духовой секцией "The Highway Horns".


    За исключением кавера Роллингов Let''s Spend the Night Together, весь остальной материал авторский, написан преимущественно
    самим Марком и его супругой Тиа Силлерс, которая также выступает в качестве бэк-вокалистки на многих песнях альбома. Бонусным
    треком идет последний инструментальных джем, записанный в студии в оставшееся после записи основных треков время.


    В музыкальном отношении на альбоме представлен мелодичный рок с элементами блюза, фанка и джаза. Сыграно и спето очень
    прилично, диск приятный, но, на мой взгляд, не выдающийся.


    "As a singer/songwriter, Mark Selby''s in the same league as Bruce Springsteen, with meaty words, a compelling voice,
    and tracks that have more groove than a vintage vinyl record." -AMERICAN SONGWRITER


    "An electrifying performer." -BLUES REVUE'
