  date: '2007-11-27'
  text: Живая запись 57 года малоизвестного саксофониста в клубе "Birdland" города Сиетла. Ну, что я могу сказать, запись,
    конечно, угарная, т.е. слышно, что музыканты и публика просто стоят на ушах. Но ведь слушателю спустя 50 лет сложно словить
    тот кайф, не находясь там, особенно, если учитывать не очень высокое исполнительское мастерство и качество записи. А музыка
    на альбоме - чистый, ни чем неразбавленный ритм-н-блюз в духе Рея Чарльза, иногда инструментальный, иногда с агрессивным
    вокалом.
