  date: '2003-12-16'
  text: Уникальный и образцово-показательный альбом. Эклектичный и энергичный, популярный и классный. Ничего подобного сольно
    не сделал ни Стиви, ни Джимми. Здесь все по-другому; разнообразные песни и темы, интересные аранжировки, классный звук
    и продакшн, духовые, подпевки, классные соло, юмор, танцы, энергия. Моя любимая песня - White Boots, а Вы выбирайте сами;
    есть из чего выбрать - 10 классных треков без филлера вообще!
