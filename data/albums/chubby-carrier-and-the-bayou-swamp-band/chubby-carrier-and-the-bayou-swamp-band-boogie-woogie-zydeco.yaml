reviews:
- id: 291
  author: Александр Мальчевский
  mark: 8
  date: '2003-12-01'
  text: 'Его папа – Рой Каррье, известный девятипалый аккордеонист. С папой играли и Шенье и Чавес, папу уважают в мире зайдеко
    и называют последним представителем классического зайдеко, то есть замешенного на блюзе и ритм-энд-блюзе.


    Чабби Каррье пошел по стопам отца. В принципе, тот факт, что сын популярнее отца, не должен вводить в заблуждение, Чабби
    популярнее, потому как он более танцевален и более весел, чем папа. Папа все таки на блюзе заморочен очень конкретно.


    Пластинка Boogie Woogie Zydeco очень веселая. Можно даже сказать, что она совсем веселая. Чабби не Лил Брайн, а значит
    с фанком и хип-хопом он не экспериментирует. Чабби просто играет классическое зайдеко в своем понимании, то есть быстрее
    и громче чем папа. С одной стороны это радует, а с другой стороны в те годы уж можно было и придумать что-то поинтереснее
    махровой классики.


    Музыкальных удивлений минимум, разве что заигрывания с чисто африканскими напевами в двух трех вещах могут порадовать,
    а в остальном сплошная классика. Не обошлось без соула, но это всего два трека и общей сути они не отражают. Самый лучший
    трек, пожалуй, - Be fair to people. Ради него альбом следует брать. Все остальные треки для того, чтобы врубить центр
    на полную и устроить дебош или шумное п.


    Стиль: классическое зайдеко, в его современном понимании – быстро, громко, весело.


    Радует: Не копирует папу ни в чем, аккордеоном владеет охренительно.


    Огорчает: Беда любой пластинки зайдеко – ее некая однообразность, плюс это 100% живая музыка, а запись передает минимум
    из возможного.


    В целом: Здорово. Весело. Хоть и неоригинально. Можно ставить 4.'
