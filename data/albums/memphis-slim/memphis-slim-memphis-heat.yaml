  date: '2018-09-12'
  text: 'Memphis Slim - американский блюзовый пианист, певец и композитор, который
    родился 3 сентября 1915 года в Мемфисе под именем Джон Лен Чэтмен. Во время своих
    первых записей молодой музыкант использовал имя своего отца - Питера Чэтмена,
    а затем вял псевдоним Memphis Slim (однако в качестве автора сочиненных им песен
    продолжал указывать Питера Чэтмена). Слим не только стал одним из наиболее интересных
    блюзовых пианистов своего времени, но и возглавлял ряд джамп-блюзовых групп, включавших
    духовые, ритм-секцию и пианино. Свой наиболее известный трек Every Day I Have
    the Blues Слим записал в 1947 году, и с тех пор на него было записано множество
    каверов. С середины 60-х и до самой смерти в 1988 году Чэтмен прожил в Париже,
    где он продолжал играть и записываться. За долгую карьеру Слим сделал более 500
    записей. В 1989 году уже после смерти Мемфис Слим был включен в зал славы блюза,
    а в 2015 году - в музыкальный зал славы Мемфиса.


    Диск, вполне адекватно названный Memphis Heat, является результатом студийного
    сотрудничества легендарного пианиста и знаменитых калифорнийских блюз-рокеров,
    усиленных на ряде треков мощной духовой секцией Memphis Horns. Вокал и характерное
    джамп-блюзовое фортепиано Слима достаточно органично соединились с рОковым звучанием
    Canned Heat, в результате чего получился вполне интересный блюзовый альбом.


    Десять треков на альбоме написал сам Питер Чэтмэн, да плюс один кавер Эдди Бойда
    Five Long Years. Альбом был записан во Франции в мае и июне 1973 года. Впервые
    диск вышел в 1974 году на лейбле Blue Star под именем "House of the Blues vol.
    7", на CD этот материал впервые был издан в 1993 году.'
