- id: 644
  author: Александр Панин
  mark: 8
  date: '2005-05-20'
  text: 'Очень хороший диск Мемфис Слима (a.k.a. Peter Chatman), записанный в Чикаго в 1961 году. Известный пианист играет
    со своим бэндом, включающим ритм-секцию, пару саксофонистов, а также клевого гитариста Мэтта "Гитар" Мерфи. Несмотря на
    то, что все песни авторства Питера, это на сто процентов коллективный диск, все музыканты на своих местах, играют плотно
    и вкусно. Слим здорово поет, духовые звучат очень в тему, а Мерфи временами просто зажигает!


    Недостатки - всего 32 минуты звучания и слышимый иногда треск.'
