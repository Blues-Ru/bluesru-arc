reviews:
- id: 770
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-07-26'
  text: 'Интересный и неожиданный диск Мемфиса, он записан в Теннесси и Луизиане с
    помощью группы Чарли МакКоя (гармошка). В составе много известнейших людей: David
    Briggs - piano, Reggie Young - guitar, Kenny Buttrey - drums. В составе также
    клавинет, добро, педал-стил-гитара, бас-гитара и Sister Gerry - backing vocals.
    Продюсер Wayne Moss сделал ставку на микс блюза, кантри-рока и ритм-н-блюза -
    получилось классно! Песни отличные - давно такого не слышал; "Bootleggin''" и
    "Poor Man Blue" - гениальны. Очень интересно звучит группа, когда они еще и прифанковывают
    в таком кантри-буги-блюзе - волшебно. Женские подпевки в половине песен - это
    единственный минус на этом альбоме (да и то не для всех).'
