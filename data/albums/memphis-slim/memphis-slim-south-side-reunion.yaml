  author: Дмитрий Казанцев
  mark: 7
  date: '2005-03-25'
  text: 'Этот альбом записан в 1970 году в Париже с группой Бадди Гая, который был
    тогда на разогреве у Роллинг Стоунз (какая нелепость...) На гитаре играет брат
    Бадди Фил, Джуниор Уэллс на гармошке, Эрнест Джонсон на басу, Рузвелт Шо на барабанах,
    Эй Си Рид на саксе, Джимми Конли - еще один саксофонист. Как видите, тут одни
    звезды Чикаго-блюза.


    На диске 10 вещей, на двух из них Слим один играет блюз и буги на клавесине -
    очень забавно и красиво, кстати. Остальные 8 треков - классический Чикаго-блюз
    без влияния 60-х годов (все очень "по-старинке"). Бадди Гай поет несколько номеров
    вместе со Слимом.


    Есть два момента: кажется, что ребята торопились и не стали играть дополнительные
    дубли - некоторые вещи звучат сыро и развалено, а еще кажется, что такой большой
    и "молодой" состав мешает Мемфису показать себя (так тоже бывает).


    Это интересный и хороший альбом, но далеко не лучший у МС.


    (Надо отметить, что Слим почти все время жил в Париже с 1961 года и многие обвиняли
    его в некоторой попсовости и коммерциализации его блюза - так оно и есть, просто
    где-то больше, где-то меньше).'
