reviews:
- id: 498
  author: Дмитрий Казанцев
  mark: 4
  date: '2005-03-25'
  text: 'Красивая обложка, но все остальное под большим вопросом. Этот альбом записан
    с британскими блюз-рок-музыкантами (Peter Green, Chris Spedding, Pete Winfield...)
    и сразу слышно, что они они не очень понимали, что надо делать в такой музыке
    в то время. Особенно странно звучат духовые, много шумных барабанов и странные
    аранжировки. Будто кто-то пытается сыграть какой-то арт-прог-блюз, а получается
    надуманно, бездуховно и попсово в итоге (типичная Англия...) Питер Грин тут ничего
    не решает (один в поле не воин); это редкий альбом, где он играет после ухода
    из группы, но до своего таинственного исчезновения.


    Надо сказать, что сам Мемфис все же отлично поет и играет на пианино, но у него
    очень много других альбомов, которые лучше этого "недоразумения".


    Редкий, ценный, но совсем необязательный альбом мэтра.'
