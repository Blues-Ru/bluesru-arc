- id: 1429
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: 'Изысканный фортепианный блюз Мемфис Слим записывал в Чикаго еще в довоенные годы. Но в конце 50-х он поотстал от
    веяний времени. И переехал в Европу, где его чтили как звезду. И где, выступая в клубах перед почитателями, он избег новомодных
    стилевых переворотов. Он много записывался. Но те пластинки давно затерялись. Подборка на двух компактах (30 треков) из
    этих европейских записей – подарок любителям старого доброго блюза. Слим лукав, добродушен, язвителен, романтичен – в
    тексты стоит вслушаться. Он обоятелен в любимых блюзменами темах: виски, бейби-вернись и воды-Миссиссиппи. Но есть и неожиданно
    саркастические высказывания в адрес Всевышнего. Заигрывая с дьяволом, блюзмены обычно не рисковали подкалывать его босса.
    И еще Слим потрясающе виртуозен. Скорость его бугивужных перекатов исполнена легко: ласкать клавиши было для него столь
    же естественно, как дышать. Многочисленны гости: от Уилли Диксона и Рузвельта Сайкса до Фредди Кинга и Бадди Гая, Питера
    Грина и "Кэннед Хит".'
