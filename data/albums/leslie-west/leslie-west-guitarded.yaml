  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2013-04-18'
  text: 'Альбом, почти полностью состоящий из каверов, записан Лесли с привлечением
    таких ярких звезд блюза и рока, как Ян Гиллан, Джо Линн Тернер, Джо Банамасса,
    Попа Чабби, Грег Оллман, Лео Лайонс и др.


    Альбом получился техничным, жестким и тяжелым. Возможно, не все кавер-версии Лесли
    заслуживают внимания, но бОльшая часть треков определенно интересны.'
