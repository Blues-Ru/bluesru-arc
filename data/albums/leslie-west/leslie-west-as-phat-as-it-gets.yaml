  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2013-04-18'
  text: 'Альбом от сильно похудевшего бывшего гитариста Vagrants и Mountain, которому
    помогают при записи многие небезызвестные в музыкальном мире личности.


    В музыкальном отношении Лесли как обычно играет тяжелый рок с примесью блюз-рока
    и рок-н-ролла, не забывая при этом демонстрировать свое умение обращаться с инструментом.
    Один из лучших дисков Лесли за всю его сольную карьеру.'
