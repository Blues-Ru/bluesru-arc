  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: 'Слегка позабытый, но много уважаемый на заре 70-х гитарный герой строил прогрессив-рок на крепкой блюзовой основе
    в самые славные годы своей карьеры. Вдруг за последние полтора года он выпустил уже третий принципиально блюзовый альбом.
    Остановись, мгновенье тяжелого гитарного блюза, ты прекрасно для Лесли и всех, кто вместе с ним душой остался в хард-роке
    70-х. Диск звучит так, словно за прошедшие три десятка лет изменился только уровень звукорежиссуры. Над прошлогодним альбомом
    Уэст трудился вместе со многими реликтовыми хардовиками, вроде Яна Гиллана. Теперь он замкнулся в формате пауэр-трио.
    С ним два ветерана: Ансли Данбар и Тим Богарт. Оба – из первой волны тяжелого блюза. Первый – соратник Джона Мэйолла,
    второй играл страшно тяжелый блюз в Vanilla Fudge. Репертуар на 50% представляет классические блюзовые стандарты. Другая
    половина поясняет широкий взгляд Уэст а на блюз: "Дом восходящего солнца", две песни – из репертуара Э.Пресли и т.д.'
