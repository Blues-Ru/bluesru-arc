- id: 1490
  author: Андрей Евдокимов
  mark: 5
  date: '2009-02-05'
  text: 'Тридцатилетие на блюз-рок-н-ролльной сцене Дж.Торогуд отмечает двумя альбомами: сборником лучших песен и концертной
    записью. И то, и другое – не впервые в его громкой карьеры. Вышедший 10 лет назад "Let''s Work Together" вполне может
    претендовать на звание лучшего концертного альбома в истории блюз-рока. И новый альбом самого Торогуда – ему не конкурент.
    Энергетика заметно ниже. Бесшабашная разухабистость десять лет назад была сыграна очень чисто. Теперь он демонстрирует
    вымученное веселье и небрежную игру. За единственным исключением все песни знакомы по предыдущим альбомам группы, и их
    "живая" интерпретация не балует ни одним сюрпризом. Исключение составляет блюзовый стандарт Элмора Джеймса "Sky is Crying",
    который за последние 30 лет сыграли даже самые ленивые блюзмены. Голос Дж.Торогуда особенно неприятно дрожит, когда он
    поет эту песню. Не лучший способ отметить юбилей.'
