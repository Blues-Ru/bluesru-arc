  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-07-19'
  text: 'Это ремастированное переиздание альбома 1980 года, который издавался в 1980
    году под именем More George Thorogood and the Destroyers.


    Как раз в начале 80-х к Джорджу пришло признание (по итогам продаж данного альбома
    он подписал контракт с EMI), и этот альбом является наглядной иллюстрацией того,
    что позволило ему добиться успеха - взрывная смесь рок-н-ролла и блюз-рока, исполненная
    с юношеским задором и мощным драйвом. Музыка Джорджа и его группы довольно простая
    (и, возможно, это тоже одна из причин его успеха - доступность), но он берет искренностью
    исполнения и бешеной энергетикой.'
