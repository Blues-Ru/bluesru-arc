  text: 'Что тут думать? Надо брать! 77 минут грубо жестко честно – про любовь к женщинам
    бухлу и быстрой езде: "Не станешь пить, так я пойду". Альбом должен заменить вышедший
    двенадцатью годами ранее The Baddest of George Thorogood. Теперь в нем 16 треков,
    включая раритеты и концертные записи. В многостраничном буклете комментарии Торогуда
    к каждой песне.'
