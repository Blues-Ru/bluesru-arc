- id: 1586
  author: Андрей Евдокимов
  mark: 7
  date: '2009-11-12'
  text: 'Торогуд – едва ли не рекордсмен по числу появлений в рубрике рецензий. Он
    играл жестко и громко, пытался уходить в кантри, возвращался… Но к такому альбому
    рано или поздно приходит каждый ветеран: 12 песен, на которых он рос и сыгранных
    почти так же, как они звучали моно- по радио во времена, когда трава была зеленее
    всего. Громкость чуть меньше, драйв ненавязчив… А главное, в голосе появилась
    какая-то теплота. Под эти песни Терминатор не стал бы творить безобразия. Доброта
    спасет мир! Даже в образе Торогуда.'
