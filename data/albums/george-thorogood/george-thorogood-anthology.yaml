reviews:
- id: 1973
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-19'
  text: 'Джорджа Торогуда и его группу с точки зрения постоянства исполняемой музыки
    можно считать своего рода американским ответом Status Quo - на протяжении более
    30 лет он играет прямолинейную смесь рок-н-ролла и блюз-рока, не балуя поклонников
    особым разнообразием и не отходя ни на шаг в сторону. С другой стороны, можно
    сказать, что музыкант предан своему стилю, и в его рамках работает вполне прилично.
    На данном двойнике представлены все его хиты, записанные c 1978 до 2000 года,
    и в связи с вышесказанным прослушать все 30 песен за один присест довольно проблематично.
    Однако если Вы собрались устроить вечеринку и попить пивка с друзьями под веселую
    музыку, вот тут данный двойник окажется незаменим и наверняка обеспечит пару часов
    отличного настроения :-)


    Отмечу также, что звукоинженеры фирмы Кэпитол потрудились и почистили старые записи
    группы, в результате чего они звучать намного лучше и естественней.'
