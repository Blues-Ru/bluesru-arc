  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-18'
  text: '2120 South Michigan Avenue - адрес легендарной чикагской студии Chess Records,
    на которой записывались такие гранды блюза и рок-н-ролла, как Чак Берри, Бо Диддли,
    Мадди Уотерс, Хаулин Вулф, Бадди Гай, Литтл Уолтер, Сонни Бой Уиллиамсон, Уилли
    Диксон и многие многие другие. Этот же адрес был увековечен в одноименном инструментале
    Роллингов с альбома 12 х 5. В свое время Кит Ричардс написал по этому адресу,
    чтобы получить каталог фирмы Chess, музыка которой вдохновляла молодых Роллингов.
    Аналогично поступил и молодой Джордж Торогуд, который впоследствии постарался
    собрать все диски знаменитой фирмы, чья музыка стала основой его творчества.


    За время своей карьеры Торогуд нередко обращался к наследию знаменитой чикагской
    фирмы, записав с 1977 года в совокупности 18 каверов. На данном диске Джордж записал
    10 каверов классики из репертуара фирмы Chess, добавив к ним 2 собственных трека,
    написанных в соавторстве со знаменитым продюсером Томом Хэмбриджем (треки 1 и
    11) - посвящение городу ветров (Чикаго) и знаменитому Уилли Диксону. Как видите,
    такой альбом - трибьют был вполне ожидаем от Джорджа уже давно.


    При записи помогали аж три лауреата премии Грэмми за 2010 год: продюсер Том Хэмбридж,
    Бадди Гай (Hi-Heel Sneakers) и Чарли Масселуайт (My Babe и заглавный инструментал).
    Джордж подошел к материалу в традиционном для себя ключе и в результате получился
    альбом мощного энергичного сырого блюз-рока и рок-н-ролла, отчасти напоминающий
    аналогичный трибьют музыке Chess Records, записанный мастерами английского паб-рока
    Dr. Feelgood в 2000 году и озаглавленный Chess Masters.'
