  author: Разные авторы
  mark: null
  date: '2002-12-17'
  text: 'Новый альбом Торогуда видимо, задуман как контраст с предыдущим - концертным,
    предельно темпераментным, громким. Достоинства этого блестящего слайдового гитариста
    и буги-рокера, перечисленные выше, намеренно смягчены. В остальном - полное следование
    собственной стилистике, стандартам, сложившимся за 20 лет записи: авторы 90 процентов
    материала - классики; номер кантри; пара собственных вещей; бесконечные клятвы
    верности рок-н-роллу, правда, меньше хрипоты в голосе, меньше дисторции на гитаре.'
