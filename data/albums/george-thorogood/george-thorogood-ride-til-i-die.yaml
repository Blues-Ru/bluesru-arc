reviews:
- id: 128
  author: Алексей Калачев
  mark: 6
  date: '2003-05-29'
  text: Максимальный американский буги-рок! Простой и бодрый, как ковбой на рекламе
    "Марлборо", добротный и самодостаточный, как гамбургер. Слабых мест я, в отличие
    от американских критиков-зануд, фактически не усмотрел. "Слабыми местами" у Джоржа
    я называю отклонения от буги – всякие там кантри, идиотские ля-ля-песенки и т.
    д. 50 минут, заполненных компактными номерами, скованными железным ритмом и темпом,
    от которого отходишь, лишь когда "игла патефона чертит пустые круги". Ровный,
    громкий и - еще раз простой. Лучшая работа как минимум с 1997.
- id: 263
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Последние несколько лет американские критики не особо жалуют этого еще совсем
    недавно очень популярного блюзового исполнителя. Они ждут от Thorogood какого-то
    новаторства, как будто не понимая, что он - давно сложившийся музыкант, нашедший
    свое место среди огромного количества современных блюзменов и, к счастью, не похожий
    ни на одного из них. Не очень-то почтительно обращаются с Thorogood и звукозаписывающие
    компании - за восемь лет ему пришлось сменить уже четыре лейбла. Так, "Ride ''Til
    I Die" стал первой пластинкой музыканта, вышедшей на Eagle Records. Для этого
    в некотором роде дебюта Thorogood написал всего одно новое произведение - "Sweet
    Little Lady", причем оно далеко не самое интересное на альбоме. Остальные двенадцать
    блюзов - более или менее известные творения других авторов. Например, "Devil In
    Disguise" J. J. Cale, не имеющее никакого отношения к хиту Elvis Presley "You''re
    The (Devil In Disguise)". Или "Move It" Chuck Berry. Один из лучших треков - бесспорно,
    песня "My Way", в давние времена звучавшая в исполнении Eddie Cochran.


    Ну, а самый лучший - это "Ride ''Til I Die" John Lee Hooker. George не записывал
    блюз специально для этого альбома, а просто использовал рабочую пленку, оставшуюся
    после саундчека перед одним из концертов. И угадал.'
