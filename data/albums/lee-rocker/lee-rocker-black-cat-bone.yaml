  author: Константин Колесниченко
  mark: 8
  date: '2008-11-05'
  text: 'Lee Rocker участник и основатель знаменитой рокабильной группы "Stray Cats",
    если вам ничего не говорит это название, то уж имя Brian Setzer знает почти каждый
    – он гитарист этого коллектива. Ли Рокер контрабасист, а в подобной музыке - это
    очень важная фигура. Половина харизмы рокабили – исходит именно от неистовых щелчков
    контрабаса, того как он вертится в руках музыканта.


    Не знаю, как Ли оказался на блюзовом лейбле "Аллигатор", но это уже его второй
    альбом у этой компании. Безусловно, эта музыка в какой-то мере близка к блюзу,
    но это очень дальние родственники. Я несколько предвзято начинал слушать "Black
    Cat Bone", но оттаял на первой же композиции - "Gone", заводная и минорная, она
    сразу задает тон и атмосферу всей записи. Я совсем не любитель этой музыки, но
    прослушал альбом от начала до конца с удовольствием – кость черной кошки, старый
    амулет, столь любимый блюзменами сработал и в руках Ли Рокера.


    Хочу отметить особенно понравившиеся песни: "One Moe Night" - песня Боба Дилана
    (за что Рокеру отдельное спасибо), "Sold Us Down The River" - такая песня должна
    была звучать на каком-нибудь выпускном американской школы в конце 50-х; следующая
    "What I Don''t Know" - это медленная танцевальная песня – логическое продолжение
    всего веселья и плясок первой половины альбома, а заканчивается альбом "Free Bass"
    - сольный номер Рокера.'
