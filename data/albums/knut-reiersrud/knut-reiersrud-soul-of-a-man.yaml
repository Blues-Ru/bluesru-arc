  author: Кирилл Мошков
  mark: null
  date: '2003-12-02'
  text: 'А вот это Блюз Как Он Есть, хотя автор проекта - норвежец, а играют датчане. Один из лучших блюзменов Северной Европы,
    Кнут Райерсруд после экспериментов с Африкой начала 90-х записал один из интереснейших в европейском блюзе концептуальных
    альбомов. Запись делалась в Осло в трех разных студиях (ее продюсировал сам музыкант), а сводилась в датском городе Рандерс.
    В этой работе удалось совместить почти хип-хоповые, тяжелые барабаны с компьютерно раздутой "бочкой" (похоже на работы
    Ленни Уайта), инфранизкий бас, многослойные психоделические гитарные аранжировки Райерсруда, голосовые сэмплы Хаулин Вулфа
    и Тексас Александера (звучащие как привет с небес) и гибкий, интеллигентный вокал Кнута (вокал хорош с одной лишь поправкой:
    все-таки Кнут не негр). Всю стилистику в целом можно определить как acid-blues, и звучание идеально отвечает обеим составляющим.'
