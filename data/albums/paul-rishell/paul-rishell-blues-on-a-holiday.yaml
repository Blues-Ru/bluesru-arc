  author: Дмитрий Казанцев
  mark: 7
  date: '2006-02-12'
  text: 'Белый блюзмен, певец и гитарист. Это дебютный альбом Пола, тут ему 40 лет.
    На диске 16 блюзов, 9 из них Пол поет под стил-гитару, а 7 с группой в Чикаго-стиле.
    Когда он играет один, то слышно насколько он хорош на гитаре в Дельта-блюзе и
    в фолк-блюзе (его вокал тоже на высоте), а вот записи с бандой слабее - здесь
    теряется его гитара и особенно вокал (да и нет в них ничего нового и особенно
    интересного).


    Первые 9 треков на твердую четверку, а вот остальные просто "удовлетворительны".'
