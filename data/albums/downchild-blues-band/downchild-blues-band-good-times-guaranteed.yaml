  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2012-08-07'
  text: 'В продолжение темы канадского блюза: двенадцатый альбом старейшего блюзового
    синдиката из Торонто, возглавляемого бессменным харпером и гитаристом Донни Уолшем
    по прозвищу Mr. Downchild. Альбом был записан к 25-летию коллектива, и представляет
    вниманию поклонников традиционную для группы энергичную смесь блюза, блюз-рока,
    джамп-блюза и рок-н-ролла, исполненную с присущим ветеранам профессионализмом
    и сохранением традиций, а также украшенную духовыми.


    За свою долгую историю группа и ее лидер собрали изрядное количество блюзовых
    премий, и данный альбом не стал исключением - он был номинирован на премию Джуно
    в качестве лучшего блюзового альбома.'
