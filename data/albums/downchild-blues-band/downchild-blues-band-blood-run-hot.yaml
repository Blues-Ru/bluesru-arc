  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2012-08-07'
  text: 'Downchild Blues Band - одна из ведущих блюзовых групп Канады и практически наверняка самая старая из современных.
    Она была создана аж в 1969 году в Торонто гитаристом Донни Уолшем по прозвищу Mr. Downchild и его братом Ричардом. Начиная
    с первого альбома, выпущенного в 1978 году, группа радует поклонников заводным джамп-блюзом с использованием духовой секции.
    Сразу напрашиваются параллели с Roomful of Blues, которые вполне обоснованы. За долгие годы в группе успело отметиться
    множество музыкантов, самый известный из которых, пожалуй, Кенни Нил.


    Данный альбом записан в 1981 году с привлечением знаменитого Спенсера Дэвиса, который также исполняет продюсерские функции.
    Диск представляет собой наглядную иллюстрацию поговорки "краткость - сестра таланта". Десять песен, чуть больше 30 минут
    звучания, но зато каких! Все сделано исключительно профессионально и "вкусно", с сохранением традиции и с хорошим драйвом,
    нет затянутости и длинных соло, но все на своих местах - и высококлассная игра музыкантов, и хорошие аранжировки с использованием
    разных инструментов, и приличный вокал, и духовые.


    Да, группа не открыла этой работой Америки, но зато доставила настоящую радость поклонникам. Приятный диск, который не
    успевает надоесть.'
