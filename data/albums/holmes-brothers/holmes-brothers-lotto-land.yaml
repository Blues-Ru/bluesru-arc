reviews:
- id: 1040
  author: Александр Панин
  mark: 7
  date: '2006-10-30'
  text: Саундтрек к одноименному фильму. Странно, что на оллмьюзике его не включают в дискографию братьев, поскольку они сочинили
    здесь всю музыку и спели все песни (не принимая, правда, никакого участия в написании текстов). Более того, второго подобного
    альбома совсем без каверов у них попросту нет. Сложно сказать, насколько это произведение адекватно именно в роли саундтрека,
    но в отрыве от фильма оно представляется довольно неплохим. Здесь хорошая и энергичная игра на инструментах, эмоциональный
    вокал, уникальный сплав соула и блюза. Пожалуй, все же маловато привычного по другим их альбомам госпела и фанка, и временами
    многовато блюз-рока. Да и, конечно, песни продюсера и режиссера фильма Джона Рубино несколько проигрывают традиционному
    материалу, особенно сильно получающемуся у Холмс Бразерс. Все же нужно сказать, что это незаслуженно забытый диск.
