- id: 1021
  author: Александр Панин
  mark: 9
  date: '2006-07-27'
  text: Второй диск братьев Холмс на лейбле Аллигатор (и седьмой номерной в их дискографии). И опять это удивительная и уникальная
    смесь госпела, соула и блюза. Альбом почти такой же сильный, как и его предшественник Speaking In Tongues (2001), хотя
    ярких вещей тут, пожалуй, чуть поменьше. Зато больше неожиданностей, к которым несомненно можно отнести исполнение песни
    Хэнка Вильямса I'm So Lonesome I Could Cry и очень необычный акустический кавер известной композиции Боба Марли Concrete
    Jungle. Нужно отметить, что по сравнению с предыдущим на этом диске больше акустических звуков, с одной стороны это здорово,
    но кажется, что по общей энергетике первый аллигаторовский альбом был посильнее. Впрочем, это не такой и большой минус
    еще одного очень хорошего диска Holmes Brothers.
- id: 1210
  author: Константин Колесниченко
  mark: 9
  date: '2008-01-31'
  text: 'Рецепт хорошей музыки наверняка знают в группе The Holmes Brothers. Как это у них получается? Я думаю, что завязано
    тут много: солидный музыкальный стаж, Нью-Йорк, профессионализм, классное смешение разных жанров музыки (блюз, соул, фанк,
    госпел, кантри и т.д.) и глядя на буклеты и фотографии группы - замечательная атмосфера внутри коллектива.


    Это второй диск братьев Холмс и барабанщика Попси Диксона (неизменный состав групп) для самого большого блюзового лейбла
    Аллигатор. Если первый их альбом для этой фирмы был жестче, в нем даже проскальзывали элементы хип-хопа, то на "Simple
    Truth" Holmes Brothers избрали путь более акустической музыки (в качестве приглашенных музыкантов есть и Greg Leiz - pedal
    steel гитара, и контрабас от музыканта бэнда Bill Frisell Cris Bruce ). Думаю, что такому подходу поспособствовал продюсер
    Craig Street, работавший, например, с Кассандрой Вилсон.


    Подборка материала и на этот раз, очень хороша, но, в случае с таким акустическим подходом, многие песни получает новое
    и интересное звучание, как, например, "Concrete Jungle" Боба Марли. Авторского материала, на этом альбоме немного, всего
    четыре композиции, остальное чужие песни, причем совсем разного формата, есть даже "I''m So Lonesome I Could Cry" Хэнка
    Вильямса.


    Пение The Holmes Brothers - это отдельная тема для разговора: они хороши и когда поют отдельно и на бэкграунде друг у
    друга! В качестве лучших хочу выделить такие песни: замечательные соул номера "We Meet, We Part, We Remember", "Hey Baby",
    минорные композиции, на которых lead vocals - это фальцет Попси Диксона "Everything Is Free" и "Concrete Jungle" и очень
    интимный блюз "I''m So Lonely".'
