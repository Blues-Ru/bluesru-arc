reviews:
- id: 1257
  author: Андрей Евдокимов
  mark: 7
  date: '2008-04-23'
  text: 'Забавное трио, исполняющее то, что широко называется "рутс-мьюзик", т.е.,
    музыку "от самых корней". На деле это означает странную смесь кантри, блюза и
    госпел, которая в трактовке трех ветеранов звучит удивительно свежо и увлекательно.
    При этом музыканты не являются ни виртуозами-инструменталистами, ни обладателями
    выдающихся вокальных способностей. Однако их отношение к музыке столько обаятельно
    и заразительно азартно, что слушателю устоять практически невозможно. Группа существует
    "всего" четверть века, но в ее составе бывалые мастера: самому младшему в новом
    году исполнится 60 лет. Нынешний альбом тяготеет к акустике, но в тяжелом блюзе
    Standing In The Need Of Love Венделл Холмс на деле доказывает умение обрабатывать
    электрогитару в манере гаражного рока. Только у него она звучит необъяснимо, парадоксально
    - как магический инструмент. А в целом это очень легкий, расслабленный альбом,
    где музыка льется естественно, как дыхание.


    <small><i>впервые напечатано в газете "Ведомости"</small></i>'
