- id: 1020
  author: Александр Панин
  mark: 10
  date: '2006-07-26'
  text: Holmes Brothers – это братья Уэнделл и Шерман Холмсы (гитара/бас), а также примкнувший к ним драммер Уилли "Попси"
    Диксон. Коллектив выступает с концертной деятельностью уже более четверти века, а с начала девяностых годов стал выпускать
    и диски собственных записей. Вначале группа базировалась на Раундере, но новое тысячелетие встретила дебютным альбомом
    на лейбле Аллигатор. Стиль Холмс Бразерс являет собой восхитительную смесь госпела, соул-блюза, фанка и ду-вопа. На этом
    диске они исполняют три песни Бена Харпера (и как исполняют!), потрясающий кавер Can't No Grave Hold My Body Down Сестры
    Розетты Тарп, песню Боба Дилана Man Of Peace, а также известейшую вещь Love Train группы O'Jays. Перечислена всего лишь
    половина треков, а остальные составляют отменные собственные песни "братьев" и традиционный госпел-материал. Все трое
    музыкантов превосходно поют и играют, им помогает ряд приглашенных исполнителей, делая звучание записи очень богатым и
    кайфовым. Это один из лучших дисков лейбла Аллигатор в его тридцатипятилетней истории!
