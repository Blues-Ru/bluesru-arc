- id: 1338
  author: Константин Колесниченко
  mark: 9
  date: '2008-10-09'
  text: 'Я никогда раньше не слышал о техасском гитаристе Hash Brown, но я знаю, кто такие Sam Myers, ZuZu Bolin и Darell
    Nulisch - это замечательные музыканты и гости на этой записи. Этот альбом для любителей свингующего блюза в стиле T-Bone
    Walker, причем воссоздается атмосфера и дух этих записей полностью - свингующая духовая секция, звук гитары, вокалисты,
    материал. Сам Hash Brown певец слабый, но зато отличный гитарист с мягкой, ненавязчивой и лаконичной манерой игры. Как
    же хороши его гости, особенно Zuzu Bolin - это его последняя запись, насколько я знаю. Альбомами любителей блюза Zuzu
    не баловал и остался малоизвестным музыкантом, но он чертовски хорош в игре на гитаре и в вокале!


    Конечно же, все сказанное и спетое на этом альбоме - абсолютно не ново, но у записи теплая и душевная атмосфера, что отличает
    настоящий блюз от другой музыки.'
