- id: 1460
  author: Андрей Евдокимов
  mark: 5
  date: '2009-02-05'
  text: 'Это первый концертный альбом за долгую карьеру артиста. Но увы: ничего нового. Свой фирменный звук Крей перенес из
    студии на сцену без малейших потерь. Все его достоинства тоже здесь: эмоциональное (пусть чуть плаксивое) пение, мастерская
    игра на гитаре, мелодичная импровизация. Исполняя музыку "соул", он придерживается мягкой подачи во всем. И эта "мягкость"
    воспринимается уже как "однообразие" задолго до финала двойного альбома. Сюрпризом оказывается только исполнение блюзовой
    классики "12 Year Old Boy", где его гитара звучит с напряженной настойчивость, свойственной Алберту Коллинзу. Все остальное
    - замечательная подборка его хитов, некоторым из которых скоро 30 лет исполнится и которые хорошо знакомы радио-слушателям
    формата "рок для взрослых".'
