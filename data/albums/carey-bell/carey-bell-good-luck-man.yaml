  text: 'Carey Bell Harrington - один из последнего поколения легенд блюзовой гармоники, он учился мастерству у грандов -
    Little Walter, Big Walter Horton и Sonny Boy Williamson II, затем был участником группы Мадди Уотерса, а также работал
    с Уилли Диксоном. Кроме мастерского владения гармоникой, Кэри Белл еще и разносторонний вокалист и композитор, а также
    аранжировщик. На протяжении многих лет он возглавлял свой собственный блюзовый состав, а также записывался с другими блюзовыми
    грандами. С Аллигатор рекордс он сотрудничает аж с 1972 года, и неудивительно, что предлагаемый альбом также вышел на
    знаменитом чикагском лейбле.


    Альбом Good Luck Man справедливо получил премию за Лучший традиционный блюзовый альбом 1997 года, и это наилучшая характеристика
    для самого альбома. Отмечу также отменное взаимопонимание Кэри и гитариста Стива Якобса, а также игру на клавишах Джонни
    Игуаны (работавшего с Джуниором Уэллсом) и, естественно, ударные Уилли Хэйеса (Алберт Коллинс, Лютер Аллисон, Джуниор
    Уэллс и др.). Послушайте Bell Hop, и Вы получите прекрасное представление о возможностях Кэри Белла. Он учился у мастеров
    блюзовый гармоники, но уже давно и сам стал таким же мастером.


    "A reigning Windy City blues harp master brandishes jaw dropping technique...stunning intensity, elegantly lowdown" -
    CHICAGO TRIBUNE


    "Raucous and exuberant in the great Chicago tradition ... tender introspection, emotional complexity, and the kind of
    sensitivity and tonal control a lot of us thought had died with Big Walter Horton." -- LIVING BLUES


    "Bell has set the mark for the harp kings to beat. Stunningly great, haunting." -- ASSOCIATED PRESS'
