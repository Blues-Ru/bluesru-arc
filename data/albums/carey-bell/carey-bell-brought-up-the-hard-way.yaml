- id: 2019
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-11-16'
  text: 'Сборник композиций легендарного харпера и певца Кэри Белла, записанных им в период с 1988 по 1990 год для лейбла
    JSP. В записях принимали участие разные музыканты, включая гостевое участие Луизиана Рэда, Лефти Дизза и сыновей Кэри
    во главе с гитаристом Лурри Беллом.


    Большинство треков написано самим Беллом и исполнено в лучших традициях современного чикагского блюза. Достойная бескомпромиссная
    работа признанного блюзового мастера.'
