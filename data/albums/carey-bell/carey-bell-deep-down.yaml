- id: 2021
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-11-16'
  text: 'Записанный на фирме Аллигатор альбом Deep Down - один из лучших альбомов талантливого харпера. Ученик знаменитого
    Уолтера Хорнтона, Кэри Белл Хэррингтон представил на суд слушателей динамичный традиционный чикагский блюз, исполненный
    с отличной техникой и мощной энергетикой. Половина материала написана самим Беллом, остальное - каверы, причем завершает
    альбом коронная композиция учителя Кэри - Уолтера Хорнтона Easy, исполнение которой служит свидетельством того, что ученик
    не посрамил чести учителя.


    В записи помогали такие звезды блюза, как Лаки Петерсон, Карл Уэтерсби, Рэй Аллисон и сын Кэри - Лури Белл. Отличный диск
    для любителей блюзовой гармоники.'
