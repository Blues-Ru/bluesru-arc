  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: Домашнее музицирование. Не самый выразительный голос. Плотное объемное звучание гитары и абсолютно идеальное чувство
    ритма. И удивительная домашняя теплота ее музыки. Она поет песни собственного сочинения и старинные стандарты, вроде традиционной
    "Когда святые пройдут маршем", или "Звонок издалека" Мадди Уотерса. Мадам Precious сколь типична, столь и неповторима.
    Она впервые записывалась еще полвека назад, выступала на фестивалях, но в первую очередь была матерью и домохозяйкой.
    Ее дебютный альбом вышел только в нынешнем веке, когда она уже отдохнула от домашних забот. Последний альбом, третий по
    счету и лучший в этой троице, представляет 26 песен, записанных в высшем "аудиофильском" качестве. Но это не музыка для
    "хай-энд", это музыка – для сердца.
