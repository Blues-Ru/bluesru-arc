reviews:
- id: 297
  author: Кирилл Мошков
  mark: null
  date: '2003-12-01'
  text: Самый разнообразный гитарист в мире Роббен Форд (Джимми Уэзерспун, Джони Митчелл, Джордж Харрисон, Майлс Дэйвис, Yellowjackets,
    Садао Ватанабэ - ничего послужной списочек?!) издал свой концерт с собственным блюзовым проектом, записанный в оклендском
    клубе Yoshi's в декабре 95-го. Запись была опубликована благодаря устроившей ее радиостанции KFOG, и сам Форд считает,
    что ему есть чем гордиться - это единственная запись, где он играет в акустике. Лучше б он играл в электричестве, право
    слово. У фьюжновых Yellowjackets его гитара звучала по крайней мере адекватно материалу. Но блюз есть блюз, его нельзя
    играть ни прохладно, ни с мечтательной улыбкой. Что же до звука, то он холоден, акустическая гитара (точнее, solid body
    acoustic) звучит пискляво - одним pickup'ом, без обертонов, а малоокрашенный и не слишком гибкий для блюза голос Форда
    можно было бы попытаться вытянуть, но...
