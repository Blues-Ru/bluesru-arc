  author: Артем Липатов
  mark: null
  date: '2008-01-29'
  text: 'Хороший гитарист Робен Форд – личность удивительно разноплановая. Хотя, если
    покопаться, разноплановость эта есть лишь отражение внутренних метаний. Форда
    всю жизнь метает от джаза к блюзу и обратно (через, понятное дело, рок). То он
    с Майлзом Дэвисом гастролирует, то с Чарли Масселуайтом играет. То Джорджу Харрисону
    и Джони Митчелл подыгрывает, то Yellowjackets осно... осну... в общем, создает.
    Правда, последние пару лет остановился на блюзе, но и тут его временами в авангардное
    музицирование тянет. Впрочем, нынешний диск - блюзовый. Играет Форд очень технично,
    но как-то излишне правильно: даже залихватский оттяг у него какой-то просчитанный,
    хотя виртуозность (та, где вместо сорока нот играется три, но именно те, которые
    нужны) не отметить нельзя. Но есть и еще один упрек - у Форда удивительно неприятный
    голос. Даже не в тембре дело, а в том, что слышно в этом голосе: эх, блин, вроде
    как блюз играю, а может, обратно в джаз податься? Сплошные сомнения и нерешительность.
    Быстро начинает раздражать.


    Однако подсластим пилюлю: Peace, Love and Understanding Ника Лоу, спетая дуэтом
    с великолепной Мэвис Стэплз, отчасти оправдывает существование этого альбома.
    Только этого мало.'
