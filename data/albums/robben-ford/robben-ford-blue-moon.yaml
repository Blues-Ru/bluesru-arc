reviews:
- id: 256
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Басист Roscoe Beck, записывавшийся с такими звездами как Omar Dykes, Jimmie
    Vaughan и даже Leonard Cohen. Один из наиболее востребованных барабанщиков наших
    дней Vinnie Colaiuta - перечислить всех, с кем он играл, просто невозможно, назову
    лишь Sting и Frank Zappa. Клавишник Neil Larsen, работавший с George Benson, Al
    Jarreau и George Harrison. Вот такая компания собралась для записи очередного
    альбома одного из самых популярных блюзовых гитаристов нашего времени. Впрочем,
    называя Robben Ford блюзменом, я, наверное, не совсем прав. Гитарист не менее
    известен и в джазовых кругах. Кстати, лейбл Concord - именно джазовый.


    Трудно представить, что Ford уже за пятьдесят. Задора и драйва у него все еще
    столько, что иные молодые гитаристы могут только позавидовать. О мастерстве я
    не говорю - свой высочайший класс Ford подтверждал неоднократно. В связи с чем
    не берусь выделить хотя бы одно из произведений нового альбома - они все одинаково
    хороши. Единственное, что удивило, так это наличие на пластинке ремикса одной
    из песен. Все-таки для блюзменов и джазменов это не очень типично.


    В общем, на мой взгляд, "Blue Moon" ничем не уступает лучшей, опять же по-моему,
    работе Ford "Handful Of Blues" 95-го года.'
- id: 2092
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2012-08-16'
  text: 'Роббен Форд - гитарист с прекрасной техникой, который на протяжении многих
    лет мечется между джазом, блюзом и фьюжн, и не желает остановиться на чем-то одном.
    С одной стороны, это показывает широту его музыкальных интересов и исполнительских
    возможностей, с другой - ... тут каждый решает для себя :-)


    В отличие от Ронни Эрла, который легко и непринужденно скрещивает блюз и джаз,
    у Форда это выходит как-то натужно и неаутэнтично. Вот и я, отслушав наверно процентов
    80 его дисков, так и не смог выбрать хоть один, который бы мне понравился настолько,
    чтобы его оставить или переслушивать. Пока диск играет, все вроде неплохо, а отдельные
    соло даже очень хороши, и придраться вроде не к чему, а по окончании диска и вспомнить
    вроде нечего. Случалось такое?


    Предлагаемый альбом считается одним из лучших у Форда, и занял второе место в
    блюзовом топе Биллборда. В отличие от его предыдущих работ, на этом диске Форд
    сравнительно много поет (хотя, на мой взгляд, среди его способностей эта не самая
    лучшая). Пластинка добротная - блюз, соул, немножко джаза, прекрасный аккомпанирующий
    состав, отличная техника игры, но опять чего-то не хватает. Впрочем, это мое сугубо
    личное мнение :-)'
