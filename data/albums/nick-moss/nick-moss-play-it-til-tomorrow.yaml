- id: 1240
  author: Андрей Евдокимов
  mark: 7
  date: '2008-03-29'
  text: 'Это не концертная запись. А в ней есть все то, чего зачастую не хватает блюзу в студии: настоящий азарт, увлеченность
    самих музыкантов, которая должна передаваться слушателю непосредственно. Это блюз непричесанный и неотесанный, похожий
    на дружеские посиделки с музыкой. Нику Моссу далеко до гигантов-реформаторов электрического блюза, но под его художественным
    руководством квартет музыкантов звучит почти перенасыщено, разболтанный ритм подхватывает, а музыка электризует. Отчасти
    напоминает попытки скрещения блюза с саундом "гаражного рока" 90-х. Но для знатоков лучшим ориентиром будет звучание записей
    студий Sun и Chess 50-х годов - времени, когда фигуры, ставшие ныне иконами жанра, были молоды, задиристы и не знали усталости.
    Нет, такой блюз не для начинающих и не для эстетов. Но двойной альбом, 29 песен, половина в неожиданной для Мосса акустике
    – будет время проникнуться.'
