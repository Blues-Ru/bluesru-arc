  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2012-08-13'
  text: 'Четвертый сольный диск блюзмена из Чикаго, получивший номинацию на премию Blues Music Awards. Невооруженным ухом
    слышно, что Ник вполне заслуженно собрал богатый урожай номинаций на высшую блюзовую премию. Это стопроцентный блюз -
    традиционный, но с современным звучанием, и очень прилично сыгранный. Четыре кавера, остальное - материал самого Мосса.


    Любителям громкого блюз-рока, пожалуй, может и не понравится, а вот для традиционалистов - самое оно :-)!'
