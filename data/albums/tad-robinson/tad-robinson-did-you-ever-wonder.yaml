- id: 1611
  author: Федор Романенко
  mark: 10
  date: '2010-02-15'
  text: 'На мой взгляд, лучшая пластинка современного соул-вокалиста Тэда Робинсона, записанная с его постоянным напарником
    гением-гитаристом Алексом Шульцом. На ней - соул, поп и нежесткий блюз, неяркие, сдержанные, аранжированные песни.


    Пластинку Робинсон и Шульц писали для себя в какой-то домашней студии, не имея контрактов и конкретных планов по ее изданию,
    ставили себе исключительно творческие задачи и выбрали любимые номера из их общего многолетнего репертуара. Позже глава
    Severn Records, к которому попала запись, ухватился за нее, уговорил издать на своем лейбле. При этом был сделан ремастеринг,
    аранжированы и дописаны замечательные дудки, которые сделали звучание богатым, но не потерявшим исходной томности минимализма.


    Тэд Робинсон сам написал 5 песен, остальные раскопал в золотых запасниках соул-музыки. Их с Шульцем объединяют общие музыкальные
    интересы - приверженность неярким формам, нежелание эксплуатировать достоинства, лежащие на поверхности, любовь создавать
    скрытое напряжение без прямой экспрессии. Шульц, который еще 30 лет назад мог обыграть любого в зажигательном искрометном
    свинге, может также играть завернутый сложнейший джаз. Однако ему приятно играть простые фразы в поп-соул балладах, которые
    остаются недосягаемо отточенными и мощными, хоть и немногословными.'
