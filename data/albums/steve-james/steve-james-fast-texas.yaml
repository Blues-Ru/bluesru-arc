  author: Александр Панин
  mark: 8
  date: '2005-05-21'
  text: Пятый альбом замечательного белого акустического исполнителя, вышедший в 2003 году. Здесь 16 коротких композиций (всего
    примерно на пятьдесят минут). Стив очень живо играет на шести- и двенадцатиструнных гитарах, мандолине и банджо. Среди
    составляющих его музыки - старая добрая пьемонтщина, дельта-блюз (много слайда), кантри. Все очень здорово и по-настоящему.
    Нужный диск, как и все предыдущие работы Джеймса.
