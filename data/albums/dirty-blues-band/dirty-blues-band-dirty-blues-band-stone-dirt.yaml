  author: Сергей Исправников
  mark: null
  date: '2008-04-10'
  text: 'На диске переизданы оба альбома калифорнийской блюз-роковой группы "Dirty Blues Band". Четверо из шести музыкантов
    первоначального состава группы, включая лидера – вокалиста и исполнителя на губной гармонике Рода Пьяццу, были из города
    Риверсайд, расположенного в шестидесяти милях восточнее Лос-Анджелеса. Собственно говоря, ее предшественником была группа
    "Mystic", образованная еще в 1965г., в которой Род Пьяцца и начинал свой творческий путь. Это была типичная гаражная команда
    с репертуаром, заимствованным у британских ритм-энд-блюзовых групп, таких как "Rolling Stones", "Yardbirds" и "Animals".
    На следующий год группа меняет свое название на более подходящее исполнявшейся ею музыке – "House of DBS" ("DBS" расшифровывалось
    как "Dirty Blues Sound"). Сначала группа перебазировалось в Лос-Анджелес, но не найдя там коммерческого успеха, была вынуждена
    вернуться обратно в Риверсайд. Там в марте 1967г. к ней присоединился незаурядный гитарист Гленн Кэмпбелл, только что
    покинувший ряды легендарной психоделической группы "Misunderstood". С его приходом рейтинг "House of DBS" значительно
    повысился, а концертное звучание группы обогатилось неординарными гитарными импровизациями. В августе об их концерте вышла
    восторженная статья одного из лос-анджелесских журналистов, после чего на группу обратил внимание продюсер Lee Madrid,
    обеспечивший подписание контракта на звукозапись с лейблом ABC.


    Дебютный альбом, озаглавленный "Dirty Blues Band", был записан в сентябре 1967 г. за две четырехчасовые сессии. В это
    время всем участникам состава было от 18 до 21 года. Кроме уже упоминавшихся Пьяццы и Кэмпбелла в группе играли, начинавшие
    еще в "Mystic", ритм-гитарист Robert Sandell, органист Pat Maloney, басист Les Morrison и ударник John Milliken. Руководство
    лейбла ABC, записывавшего таких гигантов блюза, как Ти-Боун Уолкер и Джон Ли Хукер, заинтересовалось группой в надежде
    расширить рынок сбыта за счет привлечения белой молодежной аудитории, в первую очередь, хиппи. По настоянию продюсера
    название группы было изменено на более компактное – "Dirty Blues Band". На диск были записаны 11 композиций, четверть
    из которых была авторским материалом Рода Пьяццы, а остальные – блюзовыми стандартами из репертуара Сонни Боя Уильямсона,
    "Большой Мамы" Торнтон, Хаулин Вулфа и других классиков жанра. Как и у большинства других блюз-роковых групп, дебютный
    альбом "Dirty Blues Band", по существу, являлся не какой-то концептуальной работой, а записанной студийно концертной программой.
    На записи заметно выделяются губная гармоника Пьяццы и стальная гитара Кэмпбелла, составляющие основу саунда группы. Для
    Кэмпбелла исполнявшаяся им музыка и собственный жизненный опыт были неотделимы. Он считал, что нельзя сыграть что-то,
    не прочувствовав это. Безусловно, его игра была весьма далека от классических канонов, но именно эта самобытность и "непричесанность"
    и обеспечили группе узнаваемое индивидуальное звучание, выделившее ее из множества коллективов подобного рода.


    Альбом вышел в январе 1968 г. на Bluesway – подразделении компании ABC. К этому времени идиллия "Dirty Blues Band" подошла
    к концу. Во-первых, вернувшись с горнолыжного курорта, где они выступали зимой, Milliken, Morrison и Sandell обнаружили
    у себя дома повестки из военкомата. Видя, что здесь повторяется та же ситуация, что и в "Misunderstood", Кэмпбелл перестал
    уделять группе внимание, большую часть времени посвящая езде на мотоцикле и употреблению героина. Тем не менее, Пьяцца
    не хотел терять достигнутое и вместе с органистом Pat Maloney весной 1968 г. возродил группу, пригласив в нее местных
    музыкантов – гитариста Rick Lunetta, басиста Gregg Anderson и ударника Dave Miter. В этом составе с привлечением духовой
    секции 23 апреля 1968 г. за одну сессию группа записала свой второй альбом "Stone Dirt". Второй альбом был построен по
    тому же принципу, что и первый – сочетание авторских вещей Пьяццы с кавер-версиями блюзов Джона Ли Хукера и Уилли Диксона.
    Как и его предшественник, диск был оформлен в психоделическом ключе, ориентируясь на молодежную аудиторию. Этому служила
    и помещенная на конверте пластинки аннотация, в которой прямо говорилось, что старшие участники группы достигли призывного
    возраста. Однако не стоит думать, что здесь были записаны песни протеста. Это был все тот же крепкий блюз-рок в чикагском
    стиле. С фактическим уходом Кэмпбелла никто больше не затмевал исполнительские способности Пьяццы, которые он здесь проявил
    в полном объеме. Уровень его игры не уступал куда более раскрученному Полу Баттерфилду, да и группа играла грамотно, однако
    альбом оказался более предсказуемым, чем первый. Данный состав группы продержался вместе еще меньше, чем его предшественник,
    и вскоре распался. В том же 1968 г. Пьяцца объединяется со своим кумиром – черным гармошечником Джорджем Смитом, создав
    группу "The Southside Blues Band". Что касается Кэмпбелла, то в марте 1969 г. он уезжает в Англию, где в августе того
    же года входит в состав блюз-роковой "Juicy Lucy".'
