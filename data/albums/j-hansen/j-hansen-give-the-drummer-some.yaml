- id: 1588
  author: Андрей Евдокимов
  mark: 8
  date: '2009-11-18'
  text: 'Весной, когда калифорнийскую группу для Litttle Charlie & the Nightcats, уже несколько десятилетий служившую образцом
    современного стиля Уэст-Коаст, покинул ее основатель, гитарист-виртуоз Чарли Бэйти, чье имя, собственно, составляло и
    передовую часть ее названия, а молодой талант Кид Андерсен еще только утверждался в качестве его замены, когда само будущее
    группы было под большим вопросом, барабанщик Джей Хэнсон, проработавший в группе последние 7 лет, решился на выпуск дебютного
    сольного альбома с программным названием "Дайте барабанщику шанс". В "смутное" для всей команды время он записал оптимистичный
    альбом, немного пестренький по стилям: превалирует блюз, но есть и рокабилли, и кантри под гавайскую гитару и (единственный
    сольный номер, голос + уданые) "Мэкки-нож" в стиле гангстерского джаза. Кстати, прочие 10 песен – его сочинения. Для пущего
    разнообразия временами подключаются духовые. Не смотря на доминирующее квази акустическое звучание, альбом идеально вписывается
    в дискографию the Nightcats, что неудивительно, поскольку прочие участники группы в записи помогали: Рик Эстрин (гармоника),
    Андерсен (гитара) и Лоренцо Фаррелл (бас). Это "легкая" музыка в лучшем смысле этого слова – она поднимает настроение.
    Ее играют виртуозы, не утратившие чувства юмора. Ее играют новаторы, сохраняющие уважение к традициям. Томительно медленный
    блюз "Wigglin'' On the Pole", c грубой гамоникой, ноющим слайдом и "щелкающим" контрабасом – вообще один из лучших, сочиненных
    в 2009 году.'
