- id: 1290
  author: Леонид Аускерн
  mark: null
  date: '2008-06-05'
  text: Уроженец Калифорнии Эрик Линделл (р.1969г.) начинал с чистого блюза в духе Джуниора Уэллса и Элберта Кинга, но постепенно
    эволюционировал в сторону ритм-энд-блюза и музыки соул (или как говорят американцы применительно к белым артистам, работающим
    в этом направлении, blue-eyed soul, то есть "голубоглазый соул"). Какое-то время он выступал на Западном Побережье, затем
    уехал в Нью-Йорк, но окончательно нашел себя в Новом Орлеане. Здесь он активно сотрудничает со многими местными музыкантами
    и очень гордится тем, что этот город принял его. По мнению Линделла, стать своим в Новом Орлеане – дорогого стоит. Дебютировал
    он на общенациональном уровне диском Change In The Weather (2006), изданным Alligator Records. Дебют прошел успешно и
    вот один из самых известных блюзовых лейблов представляет второй альбом Эрика - Low On Cash, Rich In Love. Альбом этот
    записывался в Новом Орлеане и почти полностью состоит из песен, написанных самим Эриком (в ряде случаев – при участии
    музыкантов его бэнда – Криса Мьюла и Аарона Уилкинсона). Единственное исключение – весьма любопытная кавер-версия песни
    Скотт-Херона Lady Day And John Coltrane, посвященная легендарным джазовым гигантам. Песни, как говорится, на любой вкус
    и некоторые, вроде Tried And True явно обладают определенным коммерческим потенциалом. Меня лично вокальные способности
    Эрика не восхитили, да и аранжировки с духовой секцией показались не слишком интересными, а вот гитарную технику и игру
    на губной гармонике в Lady Day And John Coltrane и I Got A Girl я бы оценил очень высоко. Это, разумеется, чисто субъективные
    оценки, а объективно поклонников смеси ритм-энд-блюза, фанка, соула и корневого блюза новый альбом Эрика Линделла наверняка
    не разочарует. Это диск из тех, которые не наскучат после первого же прослушивания.
- id: 1353
  author: Константин Колесниченко
  mark: 8
  date: '2008-11-05'
  text: 'Блюзовых стариков становится все меньше, молодое черное поколение находится далековато от жанра, это неприбыльный
    рынок. Компромисс – это качественная, красивая музыка, не откровенная попса, но и не корневой блюз. Эрик Линделл - это
    и есть выход из подобной ситуации. Обаятельный вокал, мелодичные аранжировки, ритм-н-блюз, фанк, соул, где-то новоорлеанская
    музыка – это все последний альбом Эрика "Low On Cash, Rich In Love". К счастью, Линделл, не сиюминутная звезда, вроде
    всплывающих время от времени блюзовых "юношей-вундеркиндов". Он долго шел к своему успеху, у него сформировавшийся музыкальный,
    стиль, образ и подход к музыке и, самое главное, полное понимание того, что он делает и своих возможностей. Можно разобрать
    "Low On Cash, Rich In Love" на составные части, выявить корни его музыки, потом посетовать на то, что музыка эта вторична,
    не оригинальна, но ее главное достоинство вот в чем - она свежа.


    Я долго не мог провести для себя аналогию между музыкой Линделла и кем-то более известным. В конце концов, пришел к выводу,
    что альбом "Low On Cash, Rich In Love" выполнен в лучших традициях Van Morrison, Terry Evans, Ben Harper и других подобных
    музыкантов, работающих на грани смешения жанров американской музыки.'
