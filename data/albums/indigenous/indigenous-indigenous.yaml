  author: Алексей Калачев
  mark: 8
  date: '2003-08-15'
  text: Кенни Вейн Шепед явно запаздывает с выпуском очередного диска и его нишу начинают
    занимать другие музыканты. Гитарист Мато Нанжи и его родственники из этой индейской
    по этническому составу группы сделали диск ну очень похожий по звуку, по подаче
    на мрачные и блистательные СиДи Шепеда. Настоящий "новый американский блюз-рок",
    густота и плотность которого местами достигают сюрреалистической консистенции.
    Почти звуковая лава - вязкая, упругая, обжигающая гитарными стаккато, накатывающая
    тяжелыми рифами. Все это богатство на фоне густого и низкого вокала Мато Нанжи.
    Два кавер-номера, остальное написал Нанжи, интересный и оригинальный мелодист,
    что для блюз-рока вообще-то редкость. Лучший диск в этом субжанре за лето 2003-го.
