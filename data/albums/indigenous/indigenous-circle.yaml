  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Еще примерно 15 строчек о блюзе. Семейный квартет Indigenous (три брата и сестра) ворвались на американскую музыкальную
    сцену пару лет назад, когда выпустили альбом "Things We Do". Продано было ни много ни мало 120 тысяч экземпляров.


    За молодую группу взялся продюсер Doyle Bramhall, имеющий большой опыт сотрудничества с самим Stevie Ray Vaughan. Именно
    Bramhall выстроил группе очень грамотный, а главное - самобытный саунд. Недаром одно известное американское издание, пишущее
    о блюзе, охарактеризовало музыку Indigenous как гремучую смесь из Cream, Buddy Miles, Carlos Santana, Jimi Hendrix и Stevie
    Ray Vaughan.


    Новая работа группы полностью подтверждает столь высокую оценку. На мой взгляд, особенно хороши "Little Time", "You Left
    Me This Mornin''", "You Were The One" и "Seven Steps Away".


    Кстати, свидетельством все растущей популярности Indigenous служит и тот факт, что лишь в этом году у них запланировано
    250 концертов, причем преимущественно им придется выходить на сцену с такими звездами, как Kenny Wayne Shepherd, B.B.King
    и George Thorogood.'
