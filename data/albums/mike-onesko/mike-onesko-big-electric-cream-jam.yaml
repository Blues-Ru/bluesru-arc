- id: 1975
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-22'
  text: 'Майк Онешко прихватил с собой своего коллегу по Blindside Blues Band ударника Эмери Сео, пригласил ветерана бас-гитары
    Тима Богерта (Vanilla Fudge, Cactus и др.) и 9 сентября 2008 года записал вживую на концерте в Огайо трибьют творчеству
    знаменитого трио Cream, который и был издан на данном диске в 2009 году. Я думаю, музыкантов представлять не нужно, и
    результат вполне можно предсказать: это техничный мощный блюз-рок. Представьте себе, что Black Sabbath сыграл музыку Cream
    - вот приблизительно так и звучит данный проект.


    Десять треков из репертуара английского трио, включая тройку блюзовых стандартов, плюс один скрытый бонус трек Sweet Wine
    на бис. Исполнено энергично, тяжело и технично. И если к исполнению особых претензий нет, то вокал Майка иногда "проседает",
    не все треки он вытягивает. Но в целом очень любопытно, а для любителей power-trio так просто праздник!'
