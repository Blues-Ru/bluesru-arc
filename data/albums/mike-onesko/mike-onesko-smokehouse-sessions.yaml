- id: 1981
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-08-12'
  text: 'Судьба улыбнулась молодому гитаристу Майку Онешко, игравшему по клубам Сан-Франциско, когда его услышал основатель
    фирмы Шрапнель Рекордс продюсер Майк Варни, и пригласил Майка в продвигаемый продюсером проект тяжелого блюз-рока по имени
    Blindside Blues Band. Записав три альбома, эта группа распалась, а Майк Онешко начал сольную карьеру, периодически вспоминая
    распавшийся коллектив (в 1996 году он записал альбом под именем Mike Onesko''s Blindside Blues Band). Затем была создана
    группа Mike Onesko''s Guitar Army, с которой он записал Armageddon - пластинку, на которой было гораздо больше техничного
    тяжелого рока, нежели блюз-рока.


    И вот, наконец, еще раз изменив название на Mike Onesko Blues Band, Майк записал самый блюзовый альбом за всю свою карьеру.
    На альбоме половина авторского материала, и половина каверов блюзовой классики, причем Crossroads представлен аж в двух
    версиях - акустической и электрической. В целом пластинка довольно жесткая (а кто б сомневался с Онешкой-то), техничная,
    представляет собой смесь блюз-рока и хард рока, но тем не менее вполне слушАбельная :-)


    P.S. Напомню, что через пять лет в 2009 году Онешко записал пластинку с таким же названием Smokehouse Sessions под именем
    Blindside Blues Band, сохранив при этом половину треков и почти не изменив обложку.'
