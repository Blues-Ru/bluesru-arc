- id: 609
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-05-04'
  text: 'Тони много лет играл в группе Рэя Чарльза и записал два сольных диска. Он очень неплохо и приятно поет, и, конечно,
    классно играет на гитаре.


    На этом альбоме 9 композиций (на компакте 1997 года издания - 10), блюз, соул-блюз, иногда фанки. Почти все песни своего
    сочинения, что не может не радовать. Очень симпатичный звук для 1981 года - группа отлично играет и звучит. Пожалуй, не
    хватает какой-то яркости в песнях, но разве это так важно, если мы рассматриваем Тони как блюзмена?'
