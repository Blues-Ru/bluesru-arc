  author: Сергей Исправников
  mark: null
  date: '2008-05-07'
  text: 'Альбом блюзового пианиста и вокалиста Отиса Спэнна с красноречивым названием "The Blues Never Die!", изданный на
    лейбле Prestige в 1965г., был записан за один день, 21 ноября 1964 г. в Чикаго. Диск не был заранее запланирован, по словам
    продюсера Samuel Charters, организовавшего запись, после выступления в нью-йоркском "Карнеги-холле" у бэнда Мадди Уотерса,
    в составе которого играл Спэнн, не оказалось достаточно денег, чтобы вернуться в Чикаго. Руководство фирмы Prestige оплатило
    им билеты обратно авансом за выпуск альбома. На обложке получившегося в итоге диска было поставлено имя только Отиса Спэнна,
    хотя более корректно было бы указать и Джеймса Коттона, поскольку на записи солировали она оба, каждый исполнив свой репертуар.
    Аккомпанировала им группа Мадди Уотерса, сам маэстро из-за контрактных ограничений был вынужден воспользоваться весьма
    прозрачным псевдонимом "Dirty Rivers".


    Что касается вошедших на диск композиций, то это был типичный клубный репертуар группы того времени. Дело в том, что в
    связи с возрастом Мадди Уотерс уже не стремился играть продолжительные сольные концерты, а позволял своим музыкантам вставлять
    собственные сеты в его выступления. Поэтому, фактически, половина этого альбома – программа Отиса Спэнна, а половина –
    Джеймса Коттона, причем каждый на своих треках сам исполнил вокальные партии. Звуковая картина диска также была максимально
    приближена к клубным выступлениям: практически живое звучание, без особых студийных эффектов.


    На диске записаны пять номеров авторства Отиса Спэнна, включая программный "The Blues Never Die!", в полной мере отражающие
    его душевную теплоту и талант блюзмена. Четыре трека, включая построенный на взаимодействии фортепьяно и губной гармоники
    инструментал "Lightnin''", были сочинены Коттоном. В бэнде Мадди Уотерса он играл с 1957 г., наследовав таким корифеям
    губной гармоники, как Литтл Уолтер и Джуниор Уэллс. Из записанных на этом диске вещей особо стоит отметить его пронзительный
    блюз "One More Mile To Go" и построенное на мелодии Джона Ли Хукера буги "Feelin'' Good". Из кавер-версий на альбоме были
    исполнены восходящий к творчеству Роберта Джонсона стандарт Элмора Джеймса "Dust My Broom" и "I''m Ready" Уилли Диксона
    из раннего репертуара Мадди Уотерса. В итоге получился аутентичный диск классического чикагского блюза периода его расцвета,
    записанного в условиях профессиональной студии, но при этом не растерявшего своего драйва и импровизационости. Вышедшая
    пластинка значительно расширила аудиторию Отиса Спэнна и упрочила его репутацию как одного из наиболее талантливых и самобытных
    блюзовых пианистов послевоенной эпохи.'
