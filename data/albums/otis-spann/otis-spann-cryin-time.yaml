  author: Сергей Исправников
  mark: 9
  date: '2010-05-02'
  text: 'После выпуска в 1966 г. чрезвычайно удачного тройного альбома "Chicago/The
    Blues/Today!" руководство нью-йоркской фирмы Vanguard обратило пристальное внимание
    на современный чикагский блюз того времени, начав записывать сольные альбомы исполнителей,
    принявших участие в вышеуказанной антологии. Не избежал этой участи и Отис Спэнн,
    по праву обладавший статусом лучшего блюзового пианиста Города Ветров. Как сайдмен
    он записывался на лейбле Chess в рамках бэнда Мадди Уотерса, а также с рядом других
    музыкантов, издававшихся на этой фирме. Что касается его сольного творчества,
    то эксклюзивного контракта с каким-либо одним лейблом у него никогда не было,
    соответственно его сольные альбомы носят довольно хаотичный характер, что, впрочем,
    было довольно типичным для многих блюзменов 50-60х гг. Настоящий альбом, записанный
    в Чикаго в Universal Studios в марте 1968 г., продюссировал Сэм Чартерс, ранее
    работавший со Спэнном как на данном лейбле, так и при записи диска для фирмы Prestige
    1965 г.


    Этот альбом, изданный в 1969 г. на лейбле Vanguard, отражал вкусы, в первую очередь,
    белой молодежи – основных покупателей блюзовых пластинок в то время. Соответственно,
    здесь присутствует не столько традиционный чикагский блюз, сколько ставший популярным
    благодаря Би Би Кингу более мягкий вест-коаст блюз и фанк. На лидер-гитаре здесь
    играл 19-летний эйсид-роковый гитарист Barry Melton, сооснователь исполнявшей
    психоделию калифорнийской рок-группы "Country Joe & the Fish", прославившейся
    своими антивоенными хэппенингами и леворадикальными идеями ("Country Joe" называли
    в США И.В.Сталина, а "fish" в названии группы отсылала к изречению товарища Мао,
    что настоящий революционер среди крестьян как рыба в воде). Басист Jos Davidson
    играл в чикагской блюз-роковой группе "Siegel-Schwall Band", причем оба этих бэнда
    также издавались на лейбле Vanguard. Классическую блюзовую составляющую обеспечивал
    второй гитарист – Luther Johnson, одно время также игравший в бэнде Мадди Уотерса.
    За ударной установкой сидел Lonnie Taylor. Вокальные партии на двух треках исполнила
    супруга Отиса Спэнна – Люсиль, также принимавшая участие в записи его альбома
    1968 г. на лейбле Bluesway. Фортепьянные партии самого Отиса здесь, как всегда
    на высоте, особенно выделяются классические медленные блюзы "You Said You''d Be
    On Time" и "Blues Is A Botheration", а также стремительное инструментальное буги
    "Twisted Shake". На трех треках Спэнн переключается на электроорган, характерной
    композицией с его использованием является титульный инструментал "Cryin'' Time".
    Фанковая составляющая наиболее ярко представлена в заключительном треке – исполненной
    под фирму Motown композиции Мадди Уотерса "Mule Kicking In My Stall".'
