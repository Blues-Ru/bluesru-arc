  author: Сергей Исправников
  mark: null
  date: '2008-05-01'
  text: 'На диске изданы записи выдающегося пианиста послевоенного чикагского блюза, Отиса Спэнна, сделанные в Лондоне для
    фирмы Decca продюсером Майком Верноном. Ранее известный только как аккомпаниатор Мадди Уотерса, Спэнн впервые явил себя
    широкой публике как самостоятельный исполнитель в июле 1960 г. на Ньюпортском джазовом фестивале, когда его импровизированное
    выступление, закрывавшее блюзовый сет, произвело настоящий фурор. В Великобритании Отис Спэнн впервые гастролировал в
    1958 г. вместе с Мадди Уотерсом, а затем еще дважды – в 1963 и 1964 гг. Когда весной 1964 г. Отис приехал в Британию в
    составе организованного Гарольдом Дэвидсоном турне "American Folk Blues And Gospel Caravan", Майку Вернону удалось убедить
    своего босса в руководстве Decca, Фрэнка Ли, заключить контракт на выпуск одного альбома и одного сингла Спэнна.


    Запись состоялась в понедельник 4 мая 1964 г. в студии № 2 Decca, расположенной в лондонском West Hempstead. Под именем
    "брат" на гитаре Отису Спэнну аккомпанировал не кто иной как Мадди Уотерс, скрывший свое имя из-за контрактных ограничений.
    Ритм-секцию составили ветераны чикагской блюзовой сцены: басист Ransom Knowling и ударник Little Willie Smith. В результате
    на альбом, озаглавленный просто "The Blues Of Otis Spann", вошли двенадцать композиций, из которых все, кроме "Rock Me
    Mama" Артура Крадапа, были сочинены самим Спэнном. Впрочем, здесь стоит отметить, что в ряде случаев это были скорее авторские
    интерпретации известных мелодий. Например, "Meet Me In The Bottom" также исполнялась Биг Джо Уильямсом и Хаулин Вулфом,
    про "Keep Your Hand Out Of My Pocket" говорили, что это была одна из любимых пьес Сонни Боя Уильямсона. Что касается "T.99",
    то композиция с похожим названием ритм-энд-блюзового певца Джимми Нельсона в 1951 г. взлетела на вершину чартов. Вместе
    с этим, исполнение Спэнна и аккомпанирующего состава было вне всяких похвал – это без преувеличения настоящая классика
    чикагского блюза. В этой связи отдельного упоминая достойны оба записанных буги, а также медленные исповедальные блюзы
    – "I Came From Clarksdale" и "Lost Sheep In The Fold", являющиеся настоящими жемчужинами диска.


    Изданный в том же году альбом удостоился самых лестных отзывов критики, причем не только британской, но и американской,
    редко писавшей что-нибудь хорошее на релизы, выходившие за пределами США. Диск назвали выдающейся записью, читателей призывали
    бежать покупать его в музыкальных магазинах. Благодарили Майка Вернона за великолепную продюсерскую работу. Основных причин
    таких восторгов было две. Во-первых, безупречное исполнение, и что немаловажно, отсутствие на записи английских музыкантов.
    Вопрос – умеют ли белые играть блюз? – в то время был отнюдь не риторическим. Во-вторых, качественная запись в условиях
    профессиональной студии, что далеко не всегда было доступно американским блюзменам у себя на родине.


    Не менее интересны записанные тогда же четыре трека, не вошедшие в пластинку и изданные здесь как бонусы. Они были исполнены
    в том же составе, за исключением того, что партию соло-гитары на "Pretty Girls Everywhere" сыграл юный Эрик Клэптон. Остальные
    три были стандартами чикагского блюза, на которых особенно выделяется мгновенно узнаваемая слайд-гитара Мадди Уотерса.
    Позднее все эти вещи вошли в компилятивный альбом "Raw Blues", изданный фирмой Decca в 1967 г.


    В заключении нужно сказать пару слов об альбоме "Cracked Spanner Head", вошедшем во второй диск данного издания. Пластинка
    была издана Decca в 1969 г. и представляла собой ремикшированный вариант диска "The Blues Of Otis Spann" с добавлением
    духовой секции и дополнительных гитарных партий. На диске оказалось десять из двенадцати оригинальных треков, причем все
    они были переименованы. Идея альбома заключалась в том, чтобы осовременить аутентичную музыку Спэнна, приблизить ее к
    молодежным вкусам. Но как известно, благими намерениями… Результат оказался просто провальным, фортепьяно в ряде случаев
    вообще оказалось на втором плане, из безупречного блюза сделали что-то невнятное. Однако не только из песни слов, но и
    из двойника диск не выкинешь, поэтому данное издание, в целом, безусловно крайне интересный релиз, необходимый в коллекции
    блюза, но именно из-за оригинального лондонского альбома Спэнна 1964 г., ставшего его эталонной работой.'
