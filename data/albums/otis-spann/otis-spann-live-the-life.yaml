  author: Сергей Исправников
  mark: 8
  date: '2010-01-30'
  text: 'Данный диск издан уже после смерти блюзового критика, продюсера и основателя
    фирмы Testament Пита Велдинга и включает редкие концертные и студийные записи
    Отиса Спэнна из его архива. Диск начинается записью пяти композиций, прозвучавших
    на концерте памяти Мартина Лютера Кинга ориентировочно в 1968 г., чье убийство
    4 апреля того же года вызвало в Америке широкий общественный резонанс и массовые
    волнения черного населения. Эти треки, фактически, являются акустическим дуэтом
    с Мадди Уотерсом, басовую партию скорее всего исполнил Уилли Диксон. В отличие
    от обычных концертов Мадди Уотерса, являющих собой пример агрессивного электрического
    блюза, здесь представлено камерное, даже интимное звучание, когда исполнитель
    обращается не к обезличенной толпе, а отдельно к каждому слушателю. Наибольший
    интерес вызывает непосредственно посвящение Мартину Лютеру Кингу, исполненное
    с чувством глубокой утраты, а также композиция 1941 г. "Worried Life Blues" одного
    из учителей Спэнна – чикагского блюзового пианиста Big Maceo Merriweather, к которому
    Спэнн испытывал искреннее уважение.


    Следующий блок взят с одного из концертов Мадди Уотерса с полным составом группы
    второй половины 60-х гг. В его выступлениях присутствовал сольный сет Спэнна,
    представленный здесь двумя композициями. Первая – драйвовый "Kansas City", написанный
    знаменитым творческим тандемом Джерри Лейбера и Майка Столлера в 1952 г. и впервые
    исполенный ритм-энд-блюзовым певцом и пианистом Little Willie Littlefield. Вторая
    – лирическая композиция сочиненная ритм-энд-блюзовым музыкантом и продюсером Бобом
    Геддинсом "Tin Pan Alley", посвященная 28-й улице в Нью-Йорке, на которой в начале
    XX века были сосредоточены ведущие нотоиздательские фирмы, торговые и рекламные
    агентства, занимавшиеся пропагандой и распространением поп-музыки. Из четырех
    треков, исполненных здесь Мадди Уотерсом, необходимо выделить "Five Long Years"
    эмигрировавшего в Европу чикагского блюзового пианиста Эдди Бойда, а также "Live
    The Life I Love" Уилли Диксона, давший название данному диску. Заканчивалось выступление
    инструменталом Спэнна "High Rising", фактически превратившимся в джем-сейшн участников
    группы. Студийная составляющая альбома представлена двумя сольными вещами Спэнна,
    записанными в Чикаго в 1965 г., возможно, во время сессий альбома "Otis Spann''s
    Chicago Blues" (Testament, 1966 г.). Заканчивает диск две вещи, где Спэнн представлен
    в качестве аккомпаниатора: чикагского исполнителя на гитаре и мандолине Джонни
    Янга ("Mean Old Train") и ныне практически забытого гармошечника Слима Уиллиса
    ("My Baby Left Me").'
