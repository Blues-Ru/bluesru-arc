  author: Сергей Исправников
  mark: null
  date: '2008-08-03'
  text: 'На диске переиздан дебютный альбом выдающегося чикагского блюзового пианиста
    Отиса Спэнна, ставший отправной точкой в его сольной дискографии. Несмотря на
    то, что Спэнн был известен, в основном, как аккомпаниатор Мадди Уотерса на этом
    диске он был записан дуэтом с гитаристом Робертом Локвудом, причем четыре из десяти
    альбомных треков были сочинены Локвудом, он же исполнил на них и вокальные партии.
    Остальной материал был написан самим Спэнном. Запись проходила 23 августа 1960
    г. в нью-йоркской Fine Studios. Безупречное качество звука обеспечил инженер George
    Piros, работавший над аудиофильным проектом Mercury Living Presence. Издавший
    диск лейбл Candid был образован в том же 1960 г. Archie Bleyer – владельцем звукозаписывающей
    компании Cadence. Новый лейбл был предназначен для выпуска исключительно джазовой
    и блюзовой музыки. Продюсером дисков выступал Nat Hentoff, известный музыкальный
    критик и журналист. На альбомах, выходивших под лейблом Candid, был издан весь
    цвет нью-йоркской джазовой сцены того времени – Чарльз Мингус, Сесил Тейлор, Эрик
    Долфи и многие другие. Блюзовое направление было представлено значительно скромнее
    – кроме Отиса Спэнна, были выпушены записи только Мемфис Слима и Лайтнин Хопкинса.
    Несмотря на быстро приобретенный среди коллекционеров культовый статус, лейбл
    просуществовал совсем недолго – всего лишь до конца 1961 г., а затем был возрожден
    уже в Лондоне через четверть века.


    Хотя первоначально диск "Otis Spann Is The Blues" был встречен публикой довольно
    прохладно, сегодня он считается общепризнанной классикой и является обязательным
    атрибутом любой серьезной блюзовой коллекции. В первую очередь, он интересен тем,
    что вместо исполнения стандартов чикагского блюза в духе Мадди Уотреса дает возможность
    услышать Отиса Спэнна как великолепного пианиста-импровизатора. Его способности
    ярко проявляются как при исполнении собственных вещей, так и при аккомпанементе
    Роберту Локвуду, часть композиций которого отсылает к творчеству его отчима –
    легендарного Роберта Джонсона. Отдельно стоит выделить два спонтанных инструментала
    Спэнна, сочиненных непосредственно в ходе работы над альбомом. Это "Otis In The
    Dark" (названный так, поскольку Отис попросил выключить свет во время своего соло)
    и "Great Northern Stomp" (названный в честь гостиницы "Great Northern Hotel",
    где располагалась студия звукозаписи). В результате получилась элитарная работа,
    довольно далекая от массовых вкусов подавляющего большинства любителей черного
    ритм-энд-блюза (к которому в то время относился городской электрический блюз).
    Не удовлетворила она и блюзовых пуристов, ратовавших за чистоту жанра. Однако
    сейчас, почти через полвека после записи, диск можно оценить как безусловный шедевр,
    имеющий мало параллелей за всю историю фортепьянного блюза. В заключение стоит
    добавить, что при переиздании на CD альбом был дополнен шестью бонус-треками с
    той же сессии, однако ни в буклете, ни на сайте фирмы-производителя их названия
    не обозначены.'
