- id: 1595
  author: Сергей Исправников
  mark: 8
  date: '2010-01-14'
  text: 'Записывая клубный чикагский блюз в 60-х годах, продюсер и просто большой
    энтузиаст и знаток блюза Pete Welding не мог пройти мимо творчества Отиса Спэнна
    – по общему мнению, лучшего послевоенного чикагского блюзового пианиста. Отдельный
    треки в исполнении Спэнна входили в издававшиеся на лейбле Велдинга Testament
    сборники – посвященный убийству президента Кеннеди "Can''t Keep From Crying" (1964
    г.) и "Modern Chicago Blues" (1964 г.), он также аккомпанировал на записях Джонни
    Шайнса, Джонни Янга, Флойда Джонса и Эдди Тейлора. В 1965 г. Велдинг записал его
    сольный альбом, переизданный на данном диске. На половине треков Спэнн играет
    на фортепьяно сольно, в остальных ему аккомпанирует бэнд Мадди Уотерса, в котором
    он и сам тогда выступал: James Cotton (губная гармоника), Jimmy Lee Morris (бас)
    и S.P.Leary (ударные). На гитаре играл Джонни Янг, на чикагской клубной сцене
    в то время он был востребован и как сессионный музыкант, и как сольный исполнитель.
    Что касается Коттона, то они со Спэнном были не только коллегами по работе, но
    и друзьями, ранее выпустив совместный альбом "The Blues Never Die!" (Prestige,
    1965 г.). S.P.Leary Спэнн считал лучшим блюзовым ударником вплоть до того, что
    во время записи альбома "The Biggest Thing Since Colossus" (Blue Horizon, 1969
    г.) с музыкантами группы "Fleetwood Mac" Спэнн потребовал, чтобы вместо Мика Флитвуда
    на ударных играл S.P.Leary.


    Спэнн никогда не порывал с блюзовой традицией, исполняя как материал блюзменов
    старшего поколения, так и собственные вещи. Приехав в Чикаго в 1946 г. Спэнн одно
    время играл вместе с легендарным чикагским блюзовым пианистом старой школы Big
    Maceo Merriweather, которого он считал одним из своих учителей. В память о нем
    Спэнн исполнил здесь его знаменитый "Worried Life Blues". Также из блюзовой классики
    были записаны "Vicksburg Blues" и "See See Rider". Более современное звучание
    демонстрируют треки, записанные с группой, причем на двух из них - драйвовом инструментале
    "Jack-Knife" и пронзительной "Lovin'' You" - Спэнн играл на электроргане. Не был
    забыт и привычный для Спэнна жанр буги-вуги, которому посвящен одноименный сольный
    инструментальный трек. Альбом, в целом, производит приятное впечатление и записан
    в традиционном для лейбла Testament ключе, когда ставилась цель добиться не столько
    идеального качества звучания, а передать в студийных условиях энергетику живого
    выступления. К сожалению, мастер-летны альбома, видимо, не сохранились, во всяком
    случае, при записи компакт-диска использован винил, причем не идеального качества.
    В виде бонус-трека записан электрический инструментал G.B.Blues 1966 г. из альбома
    "Johnny Shines with Big Walter Horton" (Testament, 1969 г.), впоследствии переизданный
    на соответствующем компакт-диске.'
