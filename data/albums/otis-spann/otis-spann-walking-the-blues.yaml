  author: Сергей Исправников
  mark: null
  date: '2008-06-22'
  text: 'На диске переиздан альбом Отиса Спэнна "Walking The Blues", вышедший в 1972
    г., через два года после его скоропостижной кончины от рака. Вошедшие в него записи
    пролежали на полке двенадцать лет и уже задним числом были признаны критиками
    и большинством поклонников Спэнна как одни из лучших в его творческом наследии.
    Собственно говоря, на диск вошел дополнительный материал, записанный 23 августа
    1960 г. в нью-йоркской Fine Studios во время сессий дебютного альбома Спэнна "Otis
    Spann Is The Blues" (Candid, 1961). В связи с тем, что первым подлинным триумфом
    Спэнна было выступление на Ньюпортском Джазовом фестивале в июле того же года,
    издатели решили, что основной целевой аудиторией его диска должны быть любители
    джаза. Однако Спэнн играл именно чикагский блюз, поэтому альбом не был принят
    джазовой аудиторией. Уже после того как Спэнн приобрел культовый статус, а архивы
    фирмы Candid перешли к CBS, данные записи, наконец, увидели свет.


    Первое, что бросается в глаза, при сравнении этого материала с последующими записями
    Спэнна на фирмах "Decca", "Prestige" или "Bluesway", это обилие именно фортепьянной
    игры, не скрадываемой звучанием аккомпанирующей группы. Более поздние записи с
    группой Мадди Уотерса демонстрировали качественное, но стандартное звучание именно
    бэнда Мадди Уотерса с солирующим Спэнном. А здесь запечатлен оригинальный спэнновский
    саунд в чистом виде. На диске он записан дуэтом с 45-летним Robert Jr. Lockwood,
    игравшим на 12-струнной электрогитаре. Что касается последнего, то он очень деликатно
    оттеняет сольные партии Спэнна, вкрапляя в них джазовые импровизации. На четырех
    из одиннадцати вошедших в оригинальное издание треков Спэнн аккомпанирует вокалу
    James Oden. Последний прославился не столько как исполнитель, столько как автор
    ряда блюзовых стандартов 30 – 40-х гг. Здесь он исполняет один из своих хитов
    – "Going Down Slow" 1941 г. По возрасту он годился в отцы Спэнну, и наряду с Мадди
    Уотерсом был одним из двух человек, оказавших на Спэнна наибольшее влияние. Что
    касается материала собственно Спэнна, то здесь он играет пять собственных композиций
    (три из которых – инструментальные), а также стандарты Мадди Уотерса "My Home
    Is The Delta" и James Oden "Evil Ways". К подлинным шедеврам альбома необходимо
    отнести берущий за душу роскошный медленный блюз "Half Ain''t Been Told" и блистательный
    инструментал "Walking The Blues".


    Среди приятных сюрпризов уже CD-издания стоит отметить наличие семи скрытых бонус-треков,
    не обозначенных в буклете. В основном, это джем-сейшны, а также дубли. По уверению
    фирмы-изготовителя, размещенном на ее официальном сайте, на этом компакт-диске
    записано все, что осталось неизданным после выпуска оригинального альбома "Otis
    Spann Is The Blues" 1961 г.'
