- id: 1126
  author: Константин Колесниченко
  mark: 10
  date: '2007-09-09'
  text: 'Один из величайших блюзовых пианистов золотой эры чикагского блюза, Отис
    Спанн, демонстрирует мастерство на этом коротком альбоме 66 года. Отис - мастер,
    очень тонко чувствующий музыку и инструмент. По стилю - это классический чикагский
    блюз, ни шага в сторону, а по подаче - музыка для блюзового клуба. На самом деле,
    на записи присутствовали сторонние слушатели, которые аплодируют, предлагают композиции
    к исполнению и это передает чувство того, как Отис отдает свой блюз аудитории.
    На альбоме со Спанном играет звездный состав: Muddy Waters, Sam Lawhorn, Francis
    Clay, George Harmonica Smith, Luther Johnson, Mac Arnold. Весь альбом хорош, но
    "T''Aint Nobody''s Biziness If I Do" пробирает до костей, особенно когда Отис
    своим невнятным голосом поет "Lord... lord"'
- id: 1415
  author: Сергей Исправников
  mark: 9
  date: '2009-01-29'
  text: 'Переизданный здесь первый из двух дисков Отиса Спэнна на лейбле Bluesway
    был записан по случаю. Дело в том, что в августе 1966 г. в знаменитом своими джазовыми
    концертами нью-йоркском Greenwich Village в сопровождении бэнда Мадди Уотерса
    выступал Джон Ли Хукер. Событие было из ряда вон выходящее, и 30 августа в "Cafe
    au Go-Go" была осуществлена запись одноименного концертного альбома Хукера. Продюсер
    Bob Thiele решил на этом не останавливаться и записать еще кого-нибудь из участвовавших
    там звезд. У Мадди был контракт с Chess, зато Спэнн оказался свободен. Запись
    его альбома уже без Хукера прошла в студии, но в присутствии живой аудитории.
    Это было сделано с целью совместить концертную непринужденность исполнения с качеством
    звучания профессиональной акустики. Чтобы добиться более аутентичной атмосферы
    клубной вечеринки продюсер обеспечил наличие спиртного, по ходу записи шло неформальное
    общение приглашенных гостей с музыкантами, которые периодически отлучались, чтобы
    чем-нибудь подкрепиться.


    Кроме Мадди Уотерса в записи приняли участие еще два гитариста – Sammy Lawhorn
    и Luther Johnson, а на губной гармонике сыграл легендарный Джордж Смит, чьих записей
    вообще сохранилось не так много. Ритм-секцию составили Mac Arnold (бас) и Francis
    Clay (ударные). В основном, был записан авторский материал Отиса Спэнна и Мадди
    Уотерса. Среди исполнявшихся композиций отдельного упоминания стоят медленный
    пронзительный блюз "T''Aint Nobody''s Biziness If I Do" и ностальгический "My
    Home Is On The Delta" с фирменной слайд-гитарой Мадди. Заканчивает альбом замечательный
    инструментал "Spann Blues", в котором сполна проявились исполнительские способности
    гитаристов Lawhorn и Johnson, а также губная гармоника Смита. Безупречна фортепьянная
    игра Отиса, явившая собой квинтэссенцию чикагского блюза 60-х гг. На диске нет
    каких-то музыкальных новаций, это традиционная для того времени музыка, блестяще
    сыгранная блестящими музыкантами. Сама манера исполнения здесь достаточно расслабленная,
    практически отсутствует привычный драйв чикагского электрического блюза. Фактически,
    это записанная в студийных условиях вечеринка для своих.'
