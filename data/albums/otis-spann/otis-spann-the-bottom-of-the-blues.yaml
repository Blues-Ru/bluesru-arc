  author: Сергей Исправников
  mark: null
  date: '2008-06-05'
  text: 'На диске переиздан второй альбом Отиса Спэнна на лейбле Bluesway, первоначально
    выпущенный в 1968 г. Как и на предыдущем диске "The Blues Is Where It''s At" (Bluesway,
    1966 г.) Спэнн играет с бэндом Мадди Уотерса и исполняет классический чикагский
    блюз, глубоко пережитый и сугубо личный. По словам самого Спэнна, "я пишу о том,
    что я делаю и о том, через что я прошел. Очень важно жить блюзом, потому что это
    именно то, что ты никогда не забудешь. Блюз идет от сердца. Например, ты приходишь
    домой вечером, чувствуешь себя плохо и ты хочешь сесть и петь блюз, пока тебе
    не станет лучше".


    Плотный электрический саунд альбома обеспечили три гитариста, принимавшие участие
    в работе и над предыдущим диском: Luther Johnson, Sammy Lawhorn и Muddy Waters
    собственной персоной. Состав остальных музыкантов претерпел кардинальные изменения.
    Вместо Джорджа Смита на губной гармонике теперь играл Джордж Бафорд, уроженец
    Hernando, Миссисипи. Перебравшись в Чикаго в 1952 г., он сформировал группу под
    названием "The Muddy Waters Jr. Band", которая заменяла Мадди в местных клубах,
    когда он уезжал на гастроли. В конце 50-х Бафорд успел поиграть и в основном составе
    Мадди, затем стал выступать со своим собственным бэндом. В 1967 г. он снова присоединился
    к Уотерсу. На бас-гитаре здесь играет Lawrence Wimberly, а за ударной установкой
    – S.P.Leary. Последнего Спэнн считал лучшим ударником и при записи последующих
    альбомов обычно настаивал, чтобы играл именно он.


    Данный диск известен прежде всего тем, что в его записи впервые приняла участие
    супруга Спэнна. Урожденная Lucille Mahalia Wilson, она начала петь в церковном
    хоре местной баптистской церкви. Имея определенный опыт в исполнении госпел, она
    блестяще справилась с задачей, поставленной на этом альбоме: ее вокал присутствует
    в четырех треках, причем один из них – "My Man" – она поет сольно. Материал альбома
    включает в себя как авторские композиции Отиса Спэнна, так и кавер-версии блюзовой
    классики – "Heart Loaded With Trouble" Джеймса Одена, "Shimmy Baby" и "Looks Like
    Twins" Мадди Уотерса. Что касается последней композиции, то этот отчаянный надрывный
    блюз является одним из лучших треков альбома. Это одна из тех вещей, в которых
    отражается сама сущность блюза и как музыкального жанра, и как состояния души.'
