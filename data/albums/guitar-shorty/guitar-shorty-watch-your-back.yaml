- id: 1554
  author: Константин Колесниченко
  mark: 7
  date: '2009-07-01'
  text: В коллекциях любителей блюза записи Guitar Shorty стояли рядом со многими
    другими гитаристами лейбла Black Top, например, Robert Ward или Earl King и были
    выдержаны приблизительно в таком же стиле – соул-блюз, ритм-н-блюз и т.д.. После
    подписания контракта с лейблом "Аллигатор", после 3-летнего перерыва с записями,
    Гитар Шорти полностью поменял свой стиль. Теперь это тягучий, мрачный и жесткий
    блюз-рок. Нужно сказать, что я совсем не любитель такой музыки, но запись получилась
    вполне интересной и совсем не подборкой беспощадных, для ушей слушателя, гитарных
    соло. Тут есть интересные рифы, ритмы, мелодии и песни. Большая часть материала
    написана клавишником группы – Jesse Harms, а есть одна композиция Van Morrison.Нужно
    заметить, что следующий альбом Шорти в этой же стилистике получился на голову
    хуже "Watch Your Back".
- id: 2285
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2017-09-20'
  text: '"Raucous, incendiary blues and explosive, bone-crunching guitar" - LIVING
    BLUES


    "Blistering, modern blues-rock, bristles with galvanizing guitar and forceful
    vocals" -Billboard


    "This is the record I''ve always wanted to do. The songs and arrangements are
    what''s been inside my head my whole life." - Guitar Shorty


    Guitar Shorty (настоящее имя Дэвид Уиллиам Кирни) начал выступать в 16 лет и за
    долгие годы карьеры сотрудничал с Рэем Чарльзом, Уилли Диксоном, Гитар Слимом,
    Т-Боун Уолкером, Джими Хендриксом и многими многими другими. Он выпустил ряд синглов,
    а вот первый альбом My Way Or The Highway он записал для лейбла JSP в 1991 году,
    получив за него блюзовую премию W.C. Handy. Новый виток карьеры случился у Коротышки,
    когда ему уже почти исполнилось 70 - он подписал контракт с ведущим блюзовым лейблом
    Аллигатор рекордз и выпусти для него три успешных альбома.


    Watch Your Back - первый и, пожалуй, лучший из трех альбомов, записанных мастером
    техасского блюза для лейбла Аллигатор Рекордз. Несмотря на долгую карьеру, это
    только шестой сольник Коротышки. Сам Кирни говорил, что это именно тот диск, который
    он всегда хотел записать, и эти песни и аранжировки были у него в голове всю его
    жизнь. На диске представлен преимущественно неспешный, но одновременно энергичный
    сырой тяжелый блюз-рок с вязкими мощными риффами и неизбежными гитарными соло.
    Есть два интересных кавера - I''ve Been Working от Ван Моррисона и A Little Less
    Conversation из репертуара Элвиса. Продюсировал пианист Джессе Хармс, который
    также написал половину песен и микшировал альбом. Диск понравится поклонникам
    жесткого бескомпромиссного гитарного блюз-рока.


    Альбом занял одиннадцатое место в топе блюзовых альбомов Биллборда.'
