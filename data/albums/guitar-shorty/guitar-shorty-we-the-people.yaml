- id: 1291
  author: Алексей Калачев
  mark: null
  date: '2008-06-05'
  text: В риффах вся сила! И эта простая истина блюз-рока превосходно усвоена Шорти,
    что он и демонстрирует на своем новейшем диске. Отлично артикулированные риффы,
    вызывающие аналоги с Ренди Бакманом и местами даже с ZZ Top, делает второй гитарист
    его группы, на их фоне лидер разворачивается со всей присущей ему неистовой энергией
    – и как гитарист, и как певец. Диск выдержан в среднем темпе, и он вполне сопоставим
    по кайфу и драйву с предыдущим альбомом коротышки, который открыл новую страницу
    в его творчестве – страницу, начатую контрактом с "Аллигатором". "We The People"
    претендует на место в десятке лучших релизов 2006 года.
- id: 1384
  author: Константин Колесниченко
  mark: 5
  date: '2008-12-15'
  text: 'Это второй альбом Шорти и вторая его запись, выполненная в стилистике современного
    блюз-рока. Жесткие гитарные рифы и простой размер поставлены тут взамен подлинному
    блюзовому груву, свингу и историям. Если взять то, что делает David Kearney (настоящее
    имя музыканта) и разложить на составляющие, то это - вроде бы и настоящий блюз:
    пение и игра на гитаре, вполне в рамках жанра. Но благодаря работе продюсера,
    игре ритм-гитары и аранжировкам всего альбома, на выходе получается довольно заурядный
    блюз-рок. Мне до сих пор удивительно, что музыкант, сформировавший свой стиль
    под влиянием T-Bone Walker, Guitar Slim и B. B. King, на старости лет пришел к
    такой музыке. При чем, на мой взгляд, на лицо ухудшение качества его альбомов,
    предыдущий его блюз-роковый опус был гораздо интереснее в плане материала, ритма,
    да и общей игры группы тоже. Этот альбом придется по душе любителям AC/DC или
    многочисленных гитарных героев блюза, но никак не "what this blues is all about".
    Даже медленные блюзы не спасают "We The People" - в них нет никакого "черного"
    (по цвету кожи музыканта) куража и обаяния, скорее они похожи на рафинированные
    песни Гарри Мура.'
- id: 2277
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2017-08-16'
  text: '"Defiant electric blues with piercing intensity and raw venom that''ll leave
    your ears singed" - CHICAGO TRIBUNE


    "It''s difficult to imagine that he ever tracks a better album than this one".
    - Billboard


    Guitar Shorty (настоящее имя Дэвид Уиллиам Кирни) начал выступать в 16 лет и за
    долгие годы карьеры сотрудничал с Рэем Чарльзом, Уилли Диксоном, Гитар Слимом,
    Т-Боун Уолкером, Джими Хендриксом и многими многими другими. Он выпустил ряд синглов,
    а вот первый альбом My Way Or The Highway он записал для лейбла JSP в 1991 году,
    получив за него блюзовую премию W.C. Handy. Новый виток карьеры случился у Коротышки,
    когда ему уже почти исполнилось 70 - он подписал контракт с ведущим блюзовым лейблом
    Аллигатор рекордз и выпусти для него три успешных альбома.


    We the People - девятый студийный альбом Guitar Shorty и его второй альбом для
    лейбла Аллигатор. Пожалуй, предыдущий и следующий альбомы гитарного коротышки
    (тоже на Аллигаторе) были чуть поинтереснее, но и этот вполне заслуживает внимания.


    Знаменитый техасский гитарист представил на суд публики альбом неспешного тяжелого
    блюза и блюз-рока с мощными жесткими риффами и энергичными соло, который вряд
    ли придется по вкусу блюзовым пуристам. Авторского материала чуть меньше половины,
    зато драйва предостаточно.


    Диск добрался до 12 места в топе блюзовых альбомов Биллборда, а в 2007 году стал
    победителем в категории "Лучший альбом современного блюза".'
