- id: 815
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-19'
  text: 'Этот альбом записан для лейбла Peace International (подразделение Philadelphia International Records), продюсеры
    - знаменитые "короли" Филли-соула Кенни Гэмбл и Леон Хафф (они записали много альбомов, а также являются авторами сотен
    песен и хитов). Естесственно, этот диск звучит как любая классная продукция фирмы PIR - соул-фанк-аранжировки, порой слишком
    попсовые и заоркестрованные. В данном случае это звучит хорошо, ибо пятеро слепцов все же исполняют госпел, и их трудно
    затащить в поп-соул (хотя некоторые треки звучат похоже на это).


    Альбом состоял из 8 треков, а вот на издании фирмы The Right Stuff 2004 года добавили еще 6 треков! Великолепная запись
    и музыка; пение - выше всяких похвал. Единственные минусы - небольшой налет звука 80-х и поп-соул-продакшн в некоторых
    треках.'
