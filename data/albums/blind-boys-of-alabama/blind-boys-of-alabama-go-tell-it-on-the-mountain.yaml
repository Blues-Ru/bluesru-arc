reviews:
- id: 285
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-11-28'
  text: 'Ну вот вышел и третий подряд альбом Слепцов на лейбле Real World. Его почему-то ругают на Оллмьюзике, хотя он ГОРАЗДО
    интереснее предыдущего. Слепцов стало уже семеро! Скоро возьмут Стиви Уандера и Рэя Чарльза? :)


    Тут много классных музыкантов и гостей. Огромный кайф идет от органиста Джона Медески!!! и гитариста Дьюка Роббиларда;
    они играют почти на всех треках. Гостей очень много и они очень разные: Solomon Burke, Tom Waits, Chrissie Hynde!!!, Aaron
    Neville!!!, Mavis Staple!!!, Les McCann, George "Mothershipconnection" Clinton и другие. Материал отличный; больше джазово-блюзово-госпел-звучания,
    чем на предыдущем "роковом" альбоме.


    Если первый был на 5 баллов, второй на 3, то этот заслуживает хорошей 4-ки!'
- id: 362
  author: Алексей Калачев
  mark: 8
  date: '2003-12-15'
  text: 'Почти одновременно в торговле появились два диска "Слепых Мальчиков" - "Go Tell It On The Mountain" и "Amazing Grace".
    Сразу проясню: первый является официальным релизом этого года на фирме "Риэл Ворлд", второй – компиляцией, предположительно
    относящейся к 80-м годам.


    "Go Tell It On The Mountain" - чудесный, праздничный, плотный по звуку диск, не требующий особых комментариев. Думаю,
    присутствие звездных гостей, особенно Тома Вэйтса, обязано привлечь к нему внимание. Альбом на этот раз имеет меньше,
    чем предыдущие два, отношения к современному блюзу (в части аранжировок), он ближе по духу, стилю к более архаичному стилю
    госпел первой половины 20-го века - джубили сингинг. Слушается он не менее, а может быть, и более комфортно, чем их грэмминосные
    релизы.'
