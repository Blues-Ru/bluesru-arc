- id: 363
  author: Алексей Калачев
  mark: 6
  date: '2003-12-15'
  text: 'Почти одновременно в торговле появились два диска "Слепых Мальчиков" - "Go
    Tell It On The Mountain" и "Amazing Grace". Сразу проясню: первый является официальным
    релизом этого года на фирме "Риэл Ворлд", второй – компиляцией, предположительно
    относящейся к 80-м годам. Второй, как его уже успели прозвать, "черный" альбом
    "Amazing Grace", немного странный. Первая его часть – студийная и сделана в духе
    традиционного госпела, заключительная – концертная, причем с участием Би Би Кинга
    и Коко Тэйлор. Едва ли диск относится к современной поре, хотя бы потому, что
    "Мальчики" связаны контрактом с другой фирмой. На критический лад приобретших
    его должна была настроить уже обложка: сейчас в ансамбль входит семь певцов, на
    обложке изображены шесть. Интересна ли музыка? Без сомнения. За такую бы сегодня
    "Мальчики" не получили "Грэмми" или что-то еще, однако звучит она совсем недурно.
    Диск состоит из госпел-стандартов, и это, по-моему, одно из его достоинств – мы
    продолжаем расширять свой музыкальный словарь, знакомиться с песнями, ставшими
    хрестоматией для великого народа. Любопытно также сравнить "тогдашнюю" группу,
    с их нынешним пением. Получается, что в принципе и тогда они были не хуже.'
- id: 816
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-08-19'
  text: 'После успеха группы в 2001 году разные полулевые фирмы начали выпускать сборники
    Слепых Парней из Алабамы. Этот диск - как раз пример подобного издания. Первые
    4 трека - это студийные записи 80-х годов, а остальные 6 - концертник, где мы
    также можем услышать голос Коко Тейлор и гитару Би Би Кинга.


    Материал - ОК (много известных госпел-тем, конечно), звук 80-х мешает в первых
    четырех треках, а "атмосфера" концерта портит последние 6. Есть еще интересный
    факт - все эти вещи + две есть на диске "If I Had A Hammer" (2005) - http://www.allmusic.com/cg/amg.dll?p=amg&sql=10:kzm1z83a5yvj


    Ох как я все это не люблю, на самом деле - бардак и беспорядок.'
