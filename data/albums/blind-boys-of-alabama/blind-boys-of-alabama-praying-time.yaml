reviews:
- id: 582
  author: Андрей Евдокимов
  mark: 4
  date: '2005-04-11'
  text: 'Возможно, надпись Collectors Series предостережет внимательного покупателя. Но у "Слепых мальчиков..." столько горячих
    поклонников, что скорее всего они схватят "новый" диск с прилавка, купившись на современный дизайн и цифру 2005г. Больше
    никаких сведений в буклете нет: ни о дате записи, ни о составе группы и аккомпанирующих музыкантов. На самом деле это
    всего лишь странноватая компиляция из двух полузабытых альбомов: концертного I Brought Him with Me, 1995 года выпуска,
    и студийного Holdin'' On, выпущенного в 1997г. Сегодня "мальчики" (а группа сложилась в 1939г. и в ней до сих поют трое
    из пятерых ее основателей) собирают Grammy пачками. Но до знакомства с Питером Гэбриэлом и сотрудничества с его лейблом
    Real World, дела у них шли не так блестяще. В альбомах середины 90-х есть вполне симпатичные песни. Особенно радует радостный
    госпелл Walk in Jerusalem с перекличкой энергичного солиста и добродушного многоголосого хора. Однако чаще становится
    просто неловко за вымученный пафос, неаккуратное исполнение и банальные аранжировки. Для таких мастеров это просто свидетельство
    торопливой работы на записи с малым бюджетом. Конечно, Blind Boys of Alabama всегда интересны: такие голоса, собранные
    в один великолепный ансамбль, не на каждом углу можно встретить. Но лучше либо послушать более ранние "классические" записи
    в альбоме Oh Lord, Stand By Me/ Marching Up To Zion, либо взять только что удостоенный Grammy альбом There Will Be a Light,
    записанный вместе с Ben Harper. Или уж подождать действительного нового альбома Atom Bomb, выпуск которого назначен на
    середину марта 2005 г..'
