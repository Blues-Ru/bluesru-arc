- id: 779
  author: Андрей Евдокимов
  mark: 9
  date: '2005-08-05'
  text: 'Любителям экзотики не понравилось, что древний состав группы пополнился новыми
    голосами. Но если принцип не в том, что в "блюзе только дедушки", то нынешний
    альбом относится к тройке лучших за долгую историю вокального ансамбля, исполняющего
    музыку госпел уже седьмой десяток лет. На момент записи в составе его были четверо
    из членов-основателей: их опыт и безупречное вокальное мастерство равно вдохновенной
    искренности исполнения. Поражает умение хранить традиции без консервации. Звучат
    традиционные церковные гимны первой трети ХХ века. Однако общее звучание, сдержанное
    внешне, от возвышенных гимнов проходящее к чувству непокоя и тревоги, и позволяет
    естественно включать в программу такие неожиданности, как песня Клэптона "Presence
    of the Lord" или "Demons" Фэтбоя Слима. Gift Of Cab, вокалист "позитивной рэпгруппы"
    Blackalicious, оказывается очень к месту, и дважды выступает как лидер на мощном
    фоне проверенного временем созвучия голосов "Слепых мальчиков..." Более предсказуемо
    участие в записи: Чарли Масселвайта (губная гармоника) и Дэвида Идальго (гитара).
    Звучание стало более плотным и актуальным, а дух самоотверженного госпел стал
    только ярче. Сдержанно, возвышенно, тревожно – атмосфера меняется от трека к треку,
    создавая сложную мозаику богоисканий нового века. "Иисус жжет как атомная бомба"
    - эту строчку нужно услышать от "слепых мальчиков".'
- id: 817
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-19'
  text: 'А вот и еще один релиз Слепцов на фирме Real World. Госпел с элементами блюза,
    фанка и соула продолжается! На этот раз на диске 10 песен, а длится он всего 35
    минут (что совершенный неформат для 2005 года). Есть тут еще удивительные вещи:
    песня "Demons" - хит Фэтбоя Слима, "Spirit In The Sky" - песня Нормана Гринбаума,
    а "Presence Of The Lord" - хит Blind Faith, написанный Эриком Клэптоном! Имеются
    на этом диске и известные гости: Билли Престон играет на органе, Чарли Масслуайт
    - на гармошке, Дэвид Хидалго - на гитаре.


    Этот альбом очень лаконичный, но, пожалуй, он не такой яркий и неожиданный, как
    альбомы ББА 2001-2003 годов. Надо еще отметить, что группа теперь состоит из 7
    человек, и четверо из них - совсем молодые люди, не имеющие отношения к оригинальному
    составу 30-х годов.'
