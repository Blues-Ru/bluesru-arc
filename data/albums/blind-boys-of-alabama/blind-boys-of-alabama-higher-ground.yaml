reviews:
- id: 25
  author: Алексей Калачев
  mark: 8
  date: '2002-10-26'
  text: 'По-моему, "Слепые мальчики" открыли совершенно новую страницу в наших знаниях о черной музыке и, в частности, о блюзе.  До
    выхода их предыдущего релиза "Spirit of The Century" широкая музобщественность в массе своей, в общем-то, была незнакома
    с тем, как звучит госпел. Теперь, сравнив, с одной стороны, дельта-блюз 20-40-х /и чикагских гигантов Отиса Раша и Бадди
    Гая, а также Би Би, с другой, мы можем судить о вкладе госпел во вторую группу. А вторая представляет собой высшую точку
    развития черного блюза.

    <p>Новый диск чуть уступает первому, но не настолько, чтобы адресовать ему сколько-нибудь тяжёлые упрёки.'
