  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: 'Тяжелый риф под мощными электрогитарными "запилами" - пародия на "белый блюз".
    Она и есть – только само-пародия: "Меня зовут не Мадди, фамилия моя не Кинг. Нет
    у меня гитары по имени Люсиль". Любители блюза сразу признают за своего такого
    знатока блюзовых шаблонов. В этой песне автор на личном примере рассматривает
    главный блюзовый вопрос столетия: не слишком ли он белый, чтобы петь блюз. Другие
    темы: как юному церковному служке избежать слишком ласкового духовного пастыря,
    как гражданину избежать повестки в жюри присяжных, или как у офтальмолога выманить
    рецепт на марихуану в лечебных целях... Смешна и страшна песенка "Состаришься,
    только если очень повезет. И горячить будет не водка, а виагра". А как же музыка?
    Никаких открытий, но на достойном уровне. Но почему блюзы так похожи на фельетоны?
    Автор на острых шутках руку наби,: много лет зарабатывая на жизнь репризами для
    популярнейшего теле-шоу Джея Лино. Когда-то из теле-шоу "В субботу вечером" родилась
    группа "Братья Блюз". Теперь пришло время Папы Джо Граппа заняться юмористическим
    блюзом.'
