- id: 2046
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2012-08-07'
  text: 'Первый сольник талантивого американского гитариста и композитора, до этого
    державшегося на вторых ролях. Джеймс тесно сотрудничал со своим другом и соратником
    Лютером Аллисоном, и его группа аккомпанировала Аллисону до самого конца.


    На данном диске собственных композиций Джеймса только одна треть, остальное -
    каверы. Нельзя также не отметить знаменитую Bad Love, написанную в соавторстве
    с Лютером.


    Диск добротного энергичного блюз-рока, сыгранного с хорошей техникой и мощным
    драйвом. В силу некоторой разнородности представленного материала диск слегка
    разноплановый, но в целом вполне приличный и один из лучших у Солберга.'
