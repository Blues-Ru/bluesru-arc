- id: 2047
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2012-08-07'
  text: 'Джеймс Солберг - талантливейший американский гитарист, певец и композитор, долгое время находился в тени своего старого
    друга Лютера Аллисона, с которым они сотрудничали аж с 1975 года. Группа Джима Солберга постоянно сопровождала Лютера
    на гастролях в США, пока Аллисон не перебрался в Париж. Затем оставшийся в Штатах Солберг сопровождал Джо Ли Хукера, Элвина
    Бишопа и Nighthawks.


    Вернувшийся на родину в 1993 году Аллисон сразу же призвал на помощь своего старого друга, и все альбомы Лютера на фирме
    Аллигатор написаны в соавторстве с Джеймсом, который также занимался аранжировками, играл на них и сопровождал Лютера
    во всех его гастролях до самой смерти. После ухода старого друга Солберг продолжил выпускать собственные альбомы (первый
    его сольник вышел в 1995 году), на которых его талант раскрылся полностью.


    Предлагаемый альбом - четвертый среди сольников Солберга. Диск довольно разноплановый, но каждая песня отличается качеством
    и профессионализмом. На диске представлен блюз и блюз-рок самой высокой пробы. Пять песен на альбоме написал Джеймс, остальное
    - каверы. Жемчужина альбома - песня Still Called the Blues, записанная дуэтом с Лютером Аллисоном еще в 1994 году. Продюсировал
    альбом знаменитый Джим Гэйнс.'
