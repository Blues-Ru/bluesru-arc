reviews:
- id: 475
  author: Сергей Колобашкин
  mark: 10
  date: '2004-03-07'
  text: 'James Solberg "L.A. Blues" является великолепным альбомом, который должен
    оказаться у всех, кто любит блюз. Джеймс Солберг демонстрирует все, что он знает
    о хорошем блюзе, он клево играет и поет, что очень интересно слушать. Альбом состоит
    из десяти песен, которые будет трудно забыть любому, кто их услышет. Диск начинается
    с великолепной песни "Bubba''s Boogie", где с первых нот чувствуется рука мастера.
    Все это продолжается песней "L.A. Blues", которая весьма трогательна по содержанию.
    Также очень интересными песнями являются: "Ballad Of A Thin Man", которую написал
    Боб Дилан, мне показалось, что в исполнении Солберга она получила легкий дух Нового
    Орлеана, что никак не портит классику. "Must Be A Reason" - это еще один клевый
    блюз, который понравится всем. "Rhumba Juice" - это еще один замечательный трек
    с альбома, который радует слух отличным текстом, музыкой и, самое главное, гитарным
    соло. "Say Goodbye" является очень клевым дополнением к альбому, замечательна
    на слух, тронет даже камень! Я ставлю этому альбому жесткую пятерку! Эту пластинку
    можно слушать часами и не уставать, замечательный музыкант, с отличной ритм-секцией
    делают невозможное!'
