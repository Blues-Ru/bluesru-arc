- id: 1275
  author: Леонид Аускерн
  mark: null
  date: '2008-06-03'
  text: Не изобретены еще аптекарские весы, чтобы определить, чего в этом альбоме больше – джаза или блюза, а потому размещение
    данного текста в том или ином разделе "СD – Обзора" - чисто условное, слишком уж тесно переплелись джаз и блюз в проекте,
    где звучит музыка в исполнении джазового гитариста в теплой компании блюзменов. Крис Флори – гитарист свингового направления,
    ставший известным по своей долгой работе в ансамбле саксофониста Скотта Хэмилтона с 1976 по 1993 годы. Успел Флори поиграть
    и со многими другими мастерами традиционного джаза, включая легендарного короля свинга Бенни Гудмэна. С 90-х годов Крис
    начал сольную карьеру, успев выпустить к моменту начала работы над данным проектом четыре альбома. Главным его соратником,
    партнером по гитарным партиям, а заодно и продюсером альбома Blues In My Heart стал земляк Криса (они оба из Новой Англии,
    городка Провиденс в штате Род-Айленд), знаменитый блюзмен Дюк Робиллард. Не зря именно его мы видим наряду с Крисом Флори
    на обложке альбома. Он же еще и поет в титульной композиции. Правда, вокальные партии на этом диске, пожалуй, более впечатляющи
    в исполнении другой блюзовой знаменитости – Шюгар Рэя Норсия, участвующего в двух треках. И он, и Робиллард, правда, в
    разное время, выступали в известном коллективе Roomful Of Blues. Еще одна яркая фигура среди участников проекта – бывший
    шеф Криса Скотт Хэмилтон, украсивший своим саксофоном пьесы Shine и If Dreams Come True. Но изюминка проекта все же, в
    первую очередь, во вдохновенной, с отличным свингом, игре двух гитаристов, Криса Флори и Дюка Робилларда. Крис играет
    очень легко, теплым мягким звуком, а Дюк, сознательно держась в тени, прекрасно подыгрывает лидеру. Мощная энергетика
    и драйв – вне этого проекта. Каждая из девяти пьес альбома – это словно пастельная миниатюра, буйства красок вы здесь
    не найдете, тонкость и красота – вот козыри Blues In My Heart.
- id: 1378
  author: Константин Колесниченко
  mark: 7
  date: '2008-12-03'
  text: 'Свингующим проектам Дюка Робилларда нет ни конца, ни края. Несмотря на то, что альбом относится к дискографии гитариста
    Chris Flory, присутствие Дюка очевидно. И я думаю, если бы не он, альбом получился бы очень уж легким и даже немного отстраненным,
    хотя ярких красок я на нем не заметил все равно.


    Музыка альбома – это музыка небольших свингующих комбо, с лидером гитаристом (на некоторых солирует саксофон Scott''a
    Hamilton''a, в его группе играл в 70-х Крис) – грациозно, мелодично и необычайно чисто, в плане звука. Шесть из девяти
    композиций – инструментальные, на остальных 2 поет замечательный Sugar Ray Norcia и в завершающей "Blues In My Heart"
    Duke Robillard.'
