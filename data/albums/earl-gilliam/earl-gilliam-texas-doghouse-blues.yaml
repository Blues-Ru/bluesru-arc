- id: 1451
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: Название "Блюз техасской конуры" может ввести в заблуждение. На самом деле это не треньканье старого деда на завалинке,
    а квалифицированно аранжированный блюз для гаражного секстета. Клавишных Ирл Джиллиам по воскресеньям играет в методистской
    церкви городка Томболл, выступает в местных клубах. Но самые любимые его музыкальные посиделки происходят на субботних
    джемах в его гараже, который он прозвал "конурой". Имя в большом блюзе не слишком известное, хотя первые свои пластинки
    он записал почти полвека назад. И сегодня, с десятилетиями блюзового опыта за спиной в качестве бас-гитариста и гитариста,
    ударника и солиста, он выдает добротный техасский блюз – с безупречным чувством ритма, превосходной сыгранностью ансамбля
    и добродушным юмором. Первым его инструментом был церковный орган. И сегодня он солирует на клавишных. В альбоме есть
    разбитные фортепианные буги-вуги и кабацкие рэгтаймы. Но больше изысканного расслабляюще-плавного звучания электрооргана.
    Кроме двух народных, остальные песни – его сочинения. Это не Большой Блюз, это блюз по домашнему "свойский" и жизнерадостный.
