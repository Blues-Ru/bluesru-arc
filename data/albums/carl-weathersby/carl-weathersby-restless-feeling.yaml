reviews:
- id: 628
  author: Александр Панин
  mark: 6
  date: '2005-05-20'
  text: 'В восьмидесятые и первую половину девяностых Карл успешно выступал с харпером
    Билли Бранчем в группе Sons Of The Blues, а этот диск - третий его сольный. На
    нем есть несколько нормальных песен, но в основном звук жестковато-запильный и
    не очень интересный, хотя музыка, конечно, довольно энергичная. Ближе к концу
    не самым выдающимся образом играется акустический кавер песни Лайтнин Хопкинса
    Glory Be.


    Это творение быстро записали, быстро выпустили, и, пожалуй, его стоит быстро забыть.'
