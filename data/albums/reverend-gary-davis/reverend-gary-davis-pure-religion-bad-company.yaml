- id: 725
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-06-15'
  text: 'Записи 1957 года для Smithsonian Folkways. Качество хорошее для середины 50-х, но диск записан с винила, а не с пленок.


    На альбоме было 15 треков, но добавили два длиннющих номера на 11 минут, и получился часовой диск. Гари Дэвис поет, рассказывает,
    играет на гитаре. Много классных инструменталов: "Cocaine Blues", "Hesitation Blues", "Buck Dance". Великолепная "Candy
    Man" со словами тоже тут. Преподобный Дэвис сочетает в себе мастера блюза, фолка, госпела и регтайма; его игра уникальна
    и интересна. Большинство вещей на пластинке написаны самим Гари или это обработанные им традиционные песни-госпелы.


    Материал прекрасный, но местами кажется, что кое-какие треки можно бы было и переиграть (есть совсем банальные "мимо нот").'
