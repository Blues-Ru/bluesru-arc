  date: '2005-06-16'
  text: 3 компакт-диска, 58 песен - эта огромная компиляция составлена и спродюсирована
    Стефаном Гроссманом (когда-то он был учеником Дэвиса). На этом сборнике собраны
    различные записи Гэри за период 1956-1966. Все они разного качества и содержания,
    так что очень сложно все это описывать. Можно сказать, что очень много случайных
    номеров и не всегда Гэри был серьезно настроен на игру и пение. В любом случае,
    это очень интересная подборка для тех, кто любит Пьедмонтский Блюз, госпел, фолк
    и хорошие песни Дэвиса.
