  date: '2005-06-16'
  text: '40 минут разговоров, криков, шуток, проповедей и пения хором с публикой. Запись ужасная - из зала. Всего спето 5
    песен! Это не музыка и не альбом! Берегите уши и нервы.


    Это хуже любого бутлега; как только не стыдно такое выпускать (диск вышел в Англии в 2000 году).'
