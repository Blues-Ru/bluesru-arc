  date: '2005-06-16'
  text: 'Вот такой интересный сборник выпустила фирма Riverside в 1961 году. Первые
    7 треков - это записи Пинка Андерсона 1950 года (это в честь него назвали группу
    Пинк Флойд). Другие 8 треков - Гари Дэвис образца 1956 года. Оба артиста представляют
    Пьедмонтскую Школу Блюза, оба виртуозы и интересные личности.


    У Пинка мало записей, так что его часть альбома более интересна с точки зрения
    РЕДКОСТИ. Андерсон хорош на гитаре, а его пение просто завораживает. Подбор материала
    тоже великолепен: "John Henry", "I''ve Got Mine", "He''s In The Jailhouse Now".
    Гари Дэвис был в прекрасной форме в 50-е, и много его фирменных хитов тут: "12
    Gates To The City", "You Got To Go Down", "Keep Your Lamp Trimmed And Burning".


    Я не очень люблю такие "два-в-одном", но в этом случае - это очень хорошая подборка!'
