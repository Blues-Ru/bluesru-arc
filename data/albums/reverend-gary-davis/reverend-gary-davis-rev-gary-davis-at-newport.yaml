  text: 'Какое прекрасное выступление Дэвиса на фолк-фестивале в Ньюпорте!


    Гэри в отличной форме, запись качественная, в программе много его "хитов": "Death
    Don''t Have No Mercy", "You Got To Move", "12 Gates To The City".


    Очень хороший концертник, публика в восторге и не очень мешает слушать музыку.'
