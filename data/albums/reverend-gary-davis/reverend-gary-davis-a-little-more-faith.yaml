reviews:
- id: 429
  author: Дмитрий Казанцев
  mark: 10
  date: '2004-01-16'
  text: 'Один из лучших дисков Дэвиса; тут ему уже 65, но он бодр и музыкален. 12 песен на 45 минут - длинный и содержательный
    альбом. Запись сделана в августе 1961 года для Prestige/Bluesville Records. Здесь блюз, фолк, госпел и регтайм; отличная
    игра на акустике, мощный вокал, преимущественно религиозные темы.


    Диск начинается с известнейшей "You Gotta Move" - Дэвис отлично ее исполняет! Есть тут и другие изюминки: "I''m Glad I''m
    In That Number", "There''s A Bright Side Somewhere", "A Little More Faith". Надо отметить прекрасный звук на альбоме;
    инженер - Руди Ван Гелдер.'
