- id: 640
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-05-20'
  text: 'Название диска говорит само за себя: тут 18 песен Дэвиса 1935-1949 годов. Фолк-госпел-блюз в исполнении одного из
    самых важных блюзменов-фолкеров. Очень серьезная, почти виртуозная игра на гитаре для тех лет. Пение не может не тронуть
    душу - очень душевно и духовно одновременно.


    Записи в хронологическом порядке, но качество везде разное (в основном плохое) - это, конечно, мешает насладиться прекрасной
    музыкой и текстами Гэри Дэвиса.'
