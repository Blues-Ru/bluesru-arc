- id: 146
  author: Алексей Калачев
  mark: 8
  date: '2003-08-15'
  text: 'Великолепная коллекция… ритмов. Во главе коллекции возвышается сияющий и неутомимый Бо Диддли. Этот гигант рок-н-ролла
    и блюза вызвал к жизни гигантское количество последователей (вспомните Англию 60-х годов) и продолжает свою бесконечную
    миссию вдохновения. Певец, гитарист и композитор Дэйв Галлахер и его партнеры по трио – колоритнейшая группа. В основе
    их творчества – простые формулы: три аккорда, ритм, фактура. Возникает искушение назвать их последователями Бо Диддли
    и ZZ Top. Однако, по-моему, они не так просты и заработали право называться музыкантами с индивидуальным звуком. Они ветераны,
    и прекрасно понимают, что при помощи трех упомянутых элементов можно делать фантастические по разнообразию звуковые "блюда".
    Альбом 2003 года – лучший из того, что они выпустили с точки зрения качества звука. Возможно, он - лучший в дискографии
    Микроволнового Дейва и Ядерных Головок со всех точек зрения. Голос Дэйва, мужественный, хриплый, отменно звучит на этом
    диске. Песни простые, компактные, без избыточных соло.'
