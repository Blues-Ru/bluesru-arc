  author: Денис Ковалев
  mark: null
  date: '2002-12-17'
  text: 'Истинный блюз! Это единственное, что напрашивается после прослушивания "Шестнадцати оттенков". Традиция, которую
    последовательно пронесли в своем творчестве Sonny Boy Williamson, Big Joe Williams, Sippie Wallace, Lonnie Johnson, B.
    B. King и John Lee Hooker нашла свое воплощение и в представленном вашему вниманию альбоме братьев Whiteley. Здесь практически
    все идеально - и лаконичные, очень традиционные по тематике тексты песен, и музыка, и само исполнение Кэна и Криса Вайтли,
    а также задействованных в этом проекте сессионных музыкантов (Al Cross - барабаны, John Deehan - кларнет, тенор-саксофон,
    Laurie Bower - тромбон). Братья-блюзмены проявили себя как истинные мультиинструменталисты, продемонстрировав незаурядное
    владение всеми перечисленными инструментами: Кэн Вайтли - фортепиано, гитары, хаммонд, банджо, аккордеон, стиральная доска,
    мандолина, вокал; Крис Вайтли - гитары, труба, духовая гармоника, стиральная доска, вокал. Интересно то, что Кэн и Крис
    Вайтли не довольствуются стилистическими границами блюза и активно привносят элементы свинга ("Swinging The Blues"), используя
    при этом джазовые духовые инструменты. Cледует отметить, что это уже не единственна работа братьев Вайтли в жанре блюза,
    но они стараются не повторяться, и поэтому в данном альбоме существенно разнообразили содержание, добавив новые оригинальные
    мелодические ходы. Не менее интересны их последующие и предыдущие работы, где они затрагивают традиционные американские
    музыкальные стили - свинг, блюз, госпел.'
