  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2013-04-25'
  text: 'Отличный концертник от легендарного лидера не менее легендарных Chicken Shack. Стэн Уэбб по прозвищу Stan the Man
    - один из незаслуженно недооцененных героев британского блюза, составлявший вместе со своей группой конкуренцию Питеру
    Грину с его Флитвуд Мэком. По иронии судьбы игравшая со Стэном Кристина Перфект вышла замуж за Джона Макви и "переметнулась"
    к конкурентам, заняв место в составе Флитвудов.


    Однако этот удар не остановил Стэна, и он до сих пор продолжает радовать публику отличным блюзом.'
