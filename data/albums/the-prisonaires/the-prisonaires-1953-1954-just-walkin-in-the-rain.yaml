  author: Александр Сомов
  mark: 10
  date: '2015-01-18'
  text: 'В 17 лет Джонни Брэгг сел в тюрягу на срок в 99 лет. В 1952 г. вместе с сокамерниками, у которых так же были впечатляющие
    приговоры, он организовал группу "Узники" (PRISONAIRES). c) блюзовый календарь


    Очень красивая музыка - и прекрасное исполнение!


    Группа, возглавляемая Johnny Bragg, состояла из двух исполнителей госпел, Ed Thurman и William Stewart, также осужденных
    на 99 лет и двух новоприбывших John Drue Jr. - 3 года за воровство и Marcell Sanders - от 1 до 5 за непредумышленное убийство.


    Обнаружил же группу радио продюссер Joe Calloway, услышав их пение, пока готовился к репортажу из тюрьмы. Он устроил им
    выступление на радио, эфир которого услышал Sam Phillips из Sun Records. Он договорился чтобы группу перевезли под конвоем
    в Мемфис для записи на студии. Через несколько недель была выпущена песня "Just Walkin'' in the Rain", которая тут же
    разошлась в количестве 50,000 копий(!!!).


    Успех был настолько велик, что им устроили тур на один день по штату Теннесси. Группа понравилась губернатору штата Frank
    G. Clement и впоследствии часто выступала у него в особняке. И даже песню про него сочинили.


    Значимость группы была подтверждена, когда песню "Just Walkin'' in the Rain", написанную Johnny Bragg''ом, записал весьма
    популярный в 50х певец Johnnie Ray.


    В 1959 году приговор смягчили и Johnny BRAGG продолжил записывать музыку после выхода из тюрьмы. Умер в 2004 году от рака.
    Stewart умер от передозы в мотеле Флориды в 1959м, Sanders умер где-то в конце 1960х, Thurman был убит в 1973, а Drue
    умер от рака в 1977 году.


    А еще про них даже книгу выпустили - Just Walkin'' in the Rain: The True Story of the Prisonaires: the Convict Pioneers
    of R & B and Rock & Roll amazon.com/Just-Walkin-Rain-Prisonaires-Pioneers/dp/1580631401


    Послушать можно тут https://vk.com/wall-13370755_3991'
