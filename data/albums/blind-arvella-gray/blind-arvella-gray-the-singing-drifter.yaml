  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: От "Много есть симпатичный девчонок" до "Веди меня за руку, Господь" представлено
    все разнообразие уличных песен "Максвелл-Стрит", увековеченной в многочисленных
    блюзовых мемуарах и в конце 70-х попавшей в культовый фильм "Братья блюз". Грей
    приехал в Чикаго с Юга, где побывал и на хлопковых плантациях, и на каторжных
    работах. Музыкальное его мастерство высоко, но в блюзе нужен еще и жизненный опыт,
    чтобы свободно петь и полевые песни-холлеры, и заунывные рабочие песни кандальных
    команд. И с течением программы альбом закономерно приходит к серии песен-госпел.
    Предысторию блюза нужно начинать изучать по записям Алана Ломакса, сделанным для
    Библиотеки Конгресса. Продолжать – по пластинке, доказывающей жизнь уличных сонгстеров
    десятилетия спустя после смерти Лидбелли и воцарения электрического блюза. Слепой
    Арвелла Грей выступал на Максвелл-Стрит до конца своей жизни под гитару "Добро".
    Его техника игры слайдом с полнозвучными аккордами уникальна. А анархичная экспрессия
    в бандитской "Джон Хенри" просто завораживает – в 1972 г. Джими Пейдж мог бы позавидовать!
    В 1972г. запись была издана тиражом в 1000 экз. Переиздание на CD (с роскошным
    буклетом и тремя бонус-треками) дает любителям доступ к этому бесценному раритету.
