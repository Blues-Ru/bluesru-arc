  author: Андрей Евдокимов
  mark: 7
  date: '2010-07-20'
  text: Соул – это госпел, согрешивший с блюзом. Без этого ядра соул-музыка – пустая скорлупа. Подлинный соул требует "горения
    души", о котором говорил "крестный отец" соул Джеймс Браун. Открывая альбом его песней "Try me", 32-летняя певица Миина
    покушается на высочайшую планку мастерства и самоотдачи. В альбоме всего два кавера из классики стиля, второй – I'd Rather
    Go Blind Этты Джеймс. В самом деле, надежд на возрождение соул почти не осталось. А уж из тихой горной деревушки в Австрии,
    где вся жизнь концентрировалась вокруг католической церкви, меньше всего ожидалось возвращения "опаленной огнем души".
    Однако так и произошло. Миина пела с пеленок, с детства сочиняла песни, покончив со школой, странствовала по свету. В
    Мемфисе записала альбом сокрушительной и возвышенной эмоциональной силы. От жертвенной красоты "Try me" к блюзу с говорящим
    названием "Вытаскивай руку из моего кармана" - это нарочитое выворачивание души на изнанку и одновременно пародия на блюзовую
    самоиронию. Легкая интермедия перед возвышенным покаянием в песне "Sorry", в которой есть все, чтобы стать классикой жанра.
    Белый тембр голоса, стремление взять весь диапазон от сопрано до фальцета… Превосходные песни, которых и нежность, и страсть.
    Феноменальный дебют.
