  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2012-08-16'
  text: 'Созданная в начале 1980-х гитаристом, харпером и вокалистом Робертом Помероем группа Barbecue Bob and the Spareribs
    играет классический южный свамп-блюз: уникальный коктейль блюз-рока, рокабилли и кантри, причем результирующий продукт
    получается по-настоящему традиционным и сырым, местами даже жестким, хотя и мелодичные кантри-мелодии им не чужды. Группа
    часто использует своеобразные звуковые дуэли губной гармоники и гитары.


    Несмотря на более чем 25-летнюю историю группы, данный диск - последний из записанного группой на данный момент - всего
    четвертый в их дискографии. Возможно, это связано с тем, что у группы никогда не было поддержки в лице крупной звукозаписывающей
    компании, и они записывались своими силами и за свой счет на маленькой фирме DaDa Records. На этом диске компанию Роберту
    составляет старый друг Саймон Шардет, играющий на гитарах и по мере необходимости на басу. Ряд приглашенных ударников
    и басист обеспечивают ритмическую структуру для песен Роберта и Саймона. В целом добротный диск искреннего жесткого свамп
    блюза с изрядной долей кантри.'
