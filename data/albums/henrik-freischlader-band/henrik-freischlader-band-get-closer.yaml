- id: 1974
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-07-22'
  text: 'Второй диск сравнительно молодого, но несомненно талантливого гитариста и певца из Германии Генрика Фрейшладера.
    Все песни написаны самим Генриком, сопровождает ритм секция, усиленная приглашенным клавишником.


    Диск современного блюза и блюз-рока, щедро сдобренного фанком. Не слишком идеально в композиционном плане, но достаточно
    прилично в техническом. В любом случае, европейский блюз всегда интересен своей нетрадиционностью :-)'
