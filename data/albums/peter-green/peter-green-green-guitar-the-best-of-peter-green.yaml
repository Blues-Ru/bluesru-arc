- id: 2123
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2013-04-25'
  text: 'Отличный сборник, составленный по итогам альбомов, записанных маэстро в период возвращения к активной музыкальной
    деятельности в конце 70-х. Сборник длиной 78 минут выпущен в 1996 году.


    В основном представлена классика с альбомов In the Skies и Little Dreamer, но также есть кое-что и из Blue Guitar, White
    Sky и Whatcha Gonna Do. Хорошая подборка для тех, кто по тем или иным причинам не желает собирать все номерные альбомы
    музыканта.'
