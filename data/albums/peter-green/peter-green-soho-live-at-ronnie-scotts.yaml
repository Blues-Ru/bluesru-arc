- id: 477
  author: Сергей Колобашкин
  mark: 9
  date: '2004-03-07'
  text: 'Peter Green Splinter Group "Soho: Live at Ronnie Scotts" является двойным концертным альбомом, который совмещает
    в себе классические вещи Питера Грина и Роберта Джонсона, которому посвещен почти весь второй диск. Альбом слушается легко
    и спокойно, Грин не дает слушателю нервничать. Особенно интересными являются песни "Black Magic Woman", где Грин демонстрирует
    отличную игру на гитаре и великолепную работу вокала. "Shake Your Hips" - это еще одная клевая песня с альбома, которая
    порадует любого. Очень интересной композицией является "The Supernatural". На втором диске кроме песен Роберта Джонсона
    есть еще замечательная "Goin'' Down", интерпретация которой очень свежа и интересна. Я бы не сказал, что это лучшая работа
    Грина, но данный альбом заслуживает похвалы! 4 с плюсом, послушать должны все!'
