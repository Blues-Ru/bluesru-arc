- id: 298
  author: Кирилл Мошков
  mark: 6
  date: '2003-12-01'
  text: 'Конечно, ветеран британского ритм-н-блюза Питер Грин, которого в конце 60-х многие ставили выше Клэптона (Грин заменил
    его в Bluesbreakers Джона Мэйолла), а его недолгое пребывание в составе Fleetwood Mac - выше всех последующих усилий группы,
    давно уже не тот. Семидесятые прошлись по нему тяжким катком, разрушив его здоровье и психику, и редкие альбомы, которые
    он выпускал в промежутках между работой могильщиком, барменом, санитаром в родной Англии и колхозником в израильском киббуце,
    были далеки от того первосортного блюза, что он играл в 60-е. И вот в середине 90-х он возник из небытия, с усталым голосом
    и ослабшими пальцами, и с тех пор выпустил уже пять альбомов: этот - шестой. Это только тень прежнего Грина, но это по-прежнему
    первосортный блюз, для записи которого собралась весьма достойная команда, включая второго гитариста и автора песен Найджела
    Ватсона, который сотрудничал с Грином еще в начале 70-х. Отличное качество игры, аранжировок и материала сохраняется на
    протяжении всего альбома, однако подлинный момент блюзовой истины наступает в четвертом треке, достойном войти в какой-нибудь
    будущий The Very Best Грина, а гитарный джем с еще одним бывшим соратником, Сноуи Уайтом, в предпоследней пьесе сопоставим
    по красоте с лучшими опусами Fleetwood Mac.'
- id: 346
  author: Дмитрий Казанцев
  mark: 10
  date: '2003-12-09'
  text: 'Это уже пятый альбом Грина с 97-го года! На этот раз произошла смена лейбла на Eagle Records. Альбом полностью состоит
    из своих композиций; Грин написал один инструментал, остальные треки написаны участниками Сплинтер Группы. Это уже совсем
    интересно, ведь мы имеем дело с новым уникальным материалом в 2001 году.


    На диске 13 композиций, из которых хочется отметить Real World, Lies, Feeling Good, Time Keeps Slipping Away. Блюз и блюз-рок
    высшего класса - вот что записано на этом альбоме! Аранжировки стали еще богаче, появились духовые, стало еще больше многоголосия,
    новых звуков. Сноуи Уайт пришел подыграть Питеру в его инструменталке. 5 баллов за эту прекрасную работу!'
