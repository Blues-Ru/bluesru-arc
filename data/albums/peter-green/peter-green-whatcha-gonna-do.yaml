- id: 327
  author: Дмитрий Казанцев
  mark: 10
  date: '2003-12-04'
  text: 'Это третий релиз Питера на PVK/Creole Records. Грин продолжает расширять стилистику; на этом альбоме появилась отличная
    реггийная Give Me Back My Freedom, например. По-прежнему много соула, блюз-рока и такой странной гриновской психоделии.
    По-прежнему отличные мелодии и гармонии. Все так же хорош вокал, гитары и аранжировки. Я бы поставил этому альбому 5 баллов,
    хотя он немного слабее предыдущих двух; дело в том, что тут 10 треков и все они великолепны - что же еще ставить?


    Стоит выделить несколько сильнейших треков. Got To See Her Tonight, Bullet In The Sky (ох, какая вещь); Give Me Back My
    Freedom (регги он тоже может); Last Train To San Antone (отличный блюз и лучший трек на альбоме); Like A Hot Tomato (очень
    классно).


    Итак, три альбома после девятилетнего перерыва, и все они очень и очень хорошие.'
