  author: Константин Колесниченко
  mark: 10
  date: '2006-02-16'
  text: 'Мое знакомство с творчеством Питера Грина началось с его поздних альбомов
    "Time Traders" и "Reaching The Cold". Первый альбом превзошел все мои ожидания:
    классные аранжировки, духовые, интересный как бы уставший голос, элементы соул-музыки.
    "Reaching The Cold" показался мне менее ярким и каким-то однообразным, но все
    равно, это была хорошая и качественная музыка.


    Следующими были "Bandit" и "Kolors", которые на время несколько оттолкнули от
    дальнейшей покупки албомов Грина. Но почти случайно в руки попали ранние альбомы
    Fleetwood Mac (с участием Грина) и "Hot food Powder", которые вернули мне интерес
    к его творчеству.


    И вот, мне наконец-то попался альбом "In the skies". Честно говоря, я не ожидал,
    что он будет ТАКИМ классным. Этот альбом можно рассматривать в целом, можно каждую
    композицию по отдельности, и он все равно будет шедевром. Естественный вокал,
    интересные гитарные партии, классная перкуссия, блестящие аранжировки. Пять из
    девяти композиций - инструментальные, на которых слышно отличную игру музыкантов,
    их понимание той музыки, которую они играют.


    На мой взгляд, это лучшая работа Грина (из тех, что я слышал, конечно) - яркая
    и неповторимая. Знакомство с творчеством этого музыканта нужно начинать с этого
    альбома(отмечу, что это переиздание на CD, в оригинале альбом вышел в 1979 году).'
