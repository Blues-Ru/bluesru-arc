- id: 264
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: Peter Green - один из лучших гитаристов в истории британской рок-музыки. И,
    пожалуй, в наибольшей степени недооцененный. Когда-то он достойно заменил Eric
    Clapton в составе легендарных Bluesbreakers, позже вместе с John McVie и Mick
    Fleetwood собрал уже упомянутую в этом обзоре группу Fleetwood Mac. В итоге и
    Clapton, и группа, покинутая через некоторое время Green, стали звездами мирового
    масштаба. Peter же упорно гнул свою линию, оставаясь приверженцем блюза. С коммерческой
    точки зрения, наверное, это было неправильно. Зато, видимо, нет в Великобритании
    другого гитариста с такими верными, хотя и немногочисленными поклонниками, уважающими
    своего кумира не только за бесспорное мастерство, но и за творческую бескомпромиссность.
    Не разочаровал он их и на этот раз. "Reaching The Cold 100" - классная пластинка,
    которую я бы порекомендовал приобрести тем, кто по каким-то причинам еще не знаком
    с творчеством Green. Дело в том, что новый альбом несколько мелодичнее и мягче
    по звуку в сравнении с предыдущими записями Peter Green Splinter Group. А если
    вы еще и поклонник Tony Joe White или Chris Rea, то тогда послушать "Reaching
    The Cold 100" вам просто необходимо. Особенно такие блюзы, как "Look Out For Yourself",
    "Must Be A Fool" и "I'm Ready For You".
- id: 347
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-12-09'
  text: 'Это второй студийный альбом на Eagle Records. Он состоит из тринадцати оригинальных
    композиций группы плюс бонус EP-Disc, на котором записаны старые вещи Грина периода
    Флидвуд Мак; Black Magic Woman, It Takes Time (by Otis Rush), Green Manalishi!!!,
    Albatross. Ничего нового Питер и Ко. не изобретают, они продолжают играть музыку
    вокруг блюза и блюз-рока, и у них это хорошо получается. Проблема лишь в том,
    что на этом диске меньше ярких и классных вещей, чем на Destiny Road или Time
    Traders. Для кого-то это может быть и не проблема, но все же нам есть с чем сравнивать.
    Альбом очень вязкий и плотный, менее "попсовый" что ли. Трудно выделить лучшие
    треки, но Needs Must The Devil Drives и Smile очень хороши, конечно!


    Оценка 4 балла. Да, альбом более блюзовый, чем предыдущие два, тут меньше элементов
    поп и соул-музыки, но что-то потерялось в сочинительстве и аранжировках. Бонус-диск
    очень душевный, но не спасает положения до конца. В любом случае, это хороший
    альбом с правильной музыкой, просто он чуть слабее предыдущих работ. Будем надеяться,
    что это не последний альбом Грина.'
