  author: Дмитрий Казанцев
  mark: 8
  date: '2003-12-04'
  text: 'Грин недолго думал и решил записать альбом, состоящий из песен Роберта Джонсона.
    Вот Вам и концепция! Легенда исполняет песни Легенды... Более того альбом записан
    на Питера Грина и Найджела Уотсона + Splinter Group; теперь становится понятно,
    что Грин надолго и серьезно. Альбом выпущен тем же лейблом, что и предыдущий -
    Snapper Music.


    На этом альбоме 16 композиций Джонсона (на сайте только 14, ну и Бог с ними).
    Отличные каверы знаменитых вещей с интересными аранжировками. Очень мило и спокойно.
    Кози Пауэлл умер и его заменил Лэрри Толфри, клавишник Роджер Коттон заменил Спайка,
    Street Angels 98 подпевают и Пол Роджерс поет в Sweet Home Chicago.


    Оценка 4 балла. Все очень здорово и приятно, но не хватает творчества и чего-то
    нового; именно этим Грин отличался, он умел удивлять.'
