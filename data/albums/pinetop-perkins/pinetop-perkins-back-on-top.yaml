- id: 670
  author: Александр Панин
  mark: 9
  date: '2005-05-24'
  text: Прекрасный альбом ветерана блюзового рояля, вышедший в 2000 году на Теларке. Вместе с Перкинсом и его бэндом играют
    Шугар Рэй Норсия на гармонике и, что особенно ценно, Кори Харрис на акустической и электрической гитарах. Пайнтоп по-прежнему
    на высоте и зажигает, исполняя ряд известных хитов (Kansas City, Five Long Years, Hi-Heel Sneakers, How Long Blues, Just
    A Little Bit) и несколько своих произведений. Ну а Кори Харрис - это всегда здорово!
