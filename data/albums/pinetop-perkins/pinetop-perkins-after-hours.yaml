- id: 1137
  author: Константин Колесниченко
  mark: 8
  date: '2007-10-02'
  text: 'Этим альбомом 88 года 75-летний Пайнтоп Перкинс начал свою удачную и звездную
    сольную карьеру. Это второй альбом Перкинса и ему повезло, что он вышел на большем
    и мощном блюзовом лэйбле "Blind Pig". Пайнтоп блюзовый пианист - акцент на обоих
    этих словах. Он играл на гитаре, пока какая-то девченка не вонзила ему в левую
    руку нож, чем и вынудила его перейти на фортепиано. Это ли не блюз? На этом альбоме
    Перкинс не оригинальничает, а прохаживается по материалу своих коллег, друзей,
    тех, с кеми он играл: Muddy Waters, Robert Nighthawk, Memphis Slim и даже Jimmy
    Smith. Хороший альбом, очень живой и по-настоящему блюзовый, пальцы Пайнтопа все
    еще быстры.С Пайнтопом играет белая блюзовая группа, под руководством харпера-виртуоза
    Little Mike.'
