  date: '2004-02-02'
  text: 'Первая часть (вторая еще, вроде, не вышла) концерта, сыгранного PP в Antone''s
    Nightclub в июле 1995 года в честь 20-летия клуба. Приятная пластинка с очень
    комфортным звуком и приемлемым временем звучания (56:30). Классический репертуар,
    записанный на ней, хорошо известен и не нуждается в представлении: "Got My Mojo
    Working", "Big Fat Mama", "Hoochie Coochie Man", "Caldonia" и т.д. Очень хороша
    ансамблевая игра: свингующий саксофон, гармоника, синкопированные партии ударные.
    В значительной части треков фортепиано достаточно скромное и выполняет роль аккомпанирующего
    инструмента. PP, как кажется, отдыхает, но вдруг происходят внезапные взрывы активности:
    волнообразно набегающие одно на другое глиссандо, а главное очень эмоциональный
    вокал. Еще одна особенность, не характерная для PP (как, в общем, и для большинства
    черных пианистов), почти совсем не используемая правая педаль и аккуратность игры,
    а в результате отсутствие грязи. Возможно, это следствие того, что альбом не сольный,
    и PP помогают сильные музыканты. <p align="right">Андрей Ордальонов'
