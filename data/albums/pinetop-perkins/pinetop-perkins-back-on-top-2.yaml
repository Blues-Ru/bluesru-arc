- id: 1136
  author: Константин Колесниченко
  mark: 7
  date: '2007-10-01'
  text: 'На этом альбоме главному исполнителю, пианисту Pinetop Perkins 87 лет! Но он крепок, поет про Анну Ли, про пять долгих
    мучительных лет с женщиной. Перкинс известен прежде всего своим участием в блюз-бэнде Мадди Уотерса и во всяких ансамблях,
    вроде "Legendary Blues Band". Перкинс идеальный аккомпониатор для чикагского блюза - не перетягивает, не солирует долго,
    играет четко и лаконично. Он не новатор, не оригинал, он просто один из самых старых, качественных и надежных блюзменов.
    Такие не дают сбоя. Honey Piazza, известная блюзовая пианистка сказала: "невозможно получить премию Хэнди, пока Пайнтоп
    делает свое дело". В этом правда и горькая ирония. Пайнотоп жив до сих пор (и пусть живет еще столько же!) и получает
    блюзовые премии с завидной регулярностью. Видимо, вручающие следуют принципу "Bring Me Flowers While I''m Living" из песни
    другого пианиста - Чемпиона Джека Дюпри. Пайнот - мастер, но не гений, просто в его пальцы уже вросли эти мелодии. Перкинсу
    помагает замечательный ансамбль: Corey Harris - guitars, Sugar Ray Norcia - harmonica, Danny Breau - guitars, Michael
    "Mudcat" Ward - acoustic bass, Per hanson - drums. Это блюз, полностью блюз и ничего кроме блюза.'
