- id: 1633
  author: Андрей Евдокимов
  mark: 8
  date: '2010-07-20'
  text: К собственному 97-летию выходец из Миссиссиппи и патриарх чикагского блюза
    выпускает новый альбом в содружестве со старинным товарищем еще по выступлениям
    в блюзбэнде Мадди Уотерса, барабанщиком Willie "Big Eyes" Smith. Вообще, по составу
    музыкантов в студии это была встреча старых и даже очень старых друзей (На басу
    играет Bob Stroger, John Primer - на гитаре). Смит сочинил большую часть песен
    для альбома, он же стал основным вокалистом, и его губная гармоника великолепна
    (в блюзбэнде Мадди Уотерса он играл на ударных, но последние годы концентрируется
    имена на губной гармонике, а за ударными теперь сидит его сын Кенни Смит). Перкинс
    не блистает больше своими фирменными бугивужными пробегами, но его аккордовая
    игра по-прежнему точна, а его пение – игриво и обаятельно (даже если голос совсем
    слаб). Альбом наполнен энергичным чикагским шаффлом, медленные блюзы в меньшинстве.
    Остается только завидовать запасу жизнелюбия, которым с такой легкостью делятся
    эти ветераны со слушателем. (Альбом удостоен Grammy как "Лучший альбом традиционного
    блюза" 2010 г.)
