- id: 1470
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: 'Работал он гитаристом, пока в кабацкой потасовке ему не подрезали ножом кисть левой руки. Вроде бы сил не стало хватать
    зажимать гитарные струны и пришлось ему переквалифицироваться в пианисты (за прошедшие с тех пор 70 лет никто не замечал
    слабости в его бугивужных перекатах). Прошел он высшую блюзовую школу в группе Мадди Уотерса, но, пока не разменял восьмой
    десяток, так и оставался на вторых ролях. И тут вдруг стал звездой блюз-фестивалей, и пошел записывать альбом за альбомом
    - многие из которых оказались поистине блюзовыми шедеврами. Нынешний альбом к таковым не относится. Хорошая добротная
    работа. В большинстве треков даже не звучит фортепиано Пайнтопа Перкинса - из-за последствий автокатастрофы, случившейся
    как раз во время записи альбома. Но в самом голосе Пайнтопа есть то глубинное и исконное понимание блюза, с которого начался
    этот жанр. Ради одного этого стоит послушать! В записи альбома "Дамский любимчик" принимали участие давние его обожательницы
    разных поколений: Рут Браун, Энн Рэбсон, Д.Коулмэн и др. Поучаствовал и давний товарищ по блюзбэнду Мадди Уотерса: барабанщик
    и харпист Уилли Смит.'
