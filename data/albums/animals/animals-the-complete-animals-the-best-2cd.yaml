  author: Алексей Калачев
  mark: 10
  date: '2002-10-26'
  text: В слабости антологии её сила. Она охватывает хронологически ничтожный период в 2 с половиной (или около того) года.
    Однако это как раз тот период существования Энималз, когда они и сделали самое главное – выпустили "Дом восходящего солнца",
    покорили Америку и сыграли кучу своих лучших кавер-версий – блюзовых стандартов. Всё, что они сделали стоящего в блюзе
    вы и обнаружите на двух данных дисках.
