- id: 704
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-05-31'
  text: 'Группа Энималз развалилась в 1966 году, а в 1977 ребята решили собраться
    в первом составе и выпустить альбом. Диск получился хороший, если не сказать замечательный.
    Эрик Бердон стал петь еще лучше, музыканты почище и поинтереснее стали играть,
    на пластинке нет той танцевально-угарной попсы 60-х. Бердон и Ко. записали диск
    в ритм-н-блюзовом ключе, хотя знали, что в 1977 году это совсем не актульно и
    не особо нужно. Слушая его, кажется, что делали они это просто для себя.


    10 песен и блюзов, лишь одну написали сами. Среди каверов - много известных тем:
    "It''s All Over Now, Baby Blue" (Bob Dylan), "Many Rivers To Cross" (Jimmy Cliff),
    "Just A Little Bit", "Lonely Avenue". Никакой попсы или диско, все в духе блюза
    и рутс-рока. Респект за эту работу! Можно сказать, что это самый интересный АЛЬБОМ
    группы (учитывая то, что в 60-х у них было всего 3 пластинки).'
