  author: Дмитрий Казанцев
  mark: 8
  date: '2005-05-30'
  text: 'Это можно называть ритм-н-блюзом, британским блюзом или брит-попом, но Энималз
    всегда были близки к настоящему черному блюзу, а Эрик Бердон умел петь в той самой
    черной ритм-н-блюзовой манере.


    Animalisms - это третий и последний диск группы в классическом составе (хотя Алана
    Прайса уже нет; на клавишах играет Дэйв Роуберри). В США этот альбом выходил под
    названием Animalization. В оригинале на пластинке было 12 вещей, но на издании
    фирмы Repertoire добавлены 13!!! бонусов, среди них все материалы, которые были
    записаны в тот год.


    Здесь очень много известных песен и хитов: One Monkey Don''t Stop No Show, Maudie,
    Sweet Little Sixteen, Gin House Blues, I Put A Spell On You, Don''t Bring Me Down,
    See See Rider, I Just Wanna Make Love To You, Boom Boom, Big Boss Man. Блюзы и
    соул-баллады, ритм-н-блюз и рок-н-ролл. Этот альбом интереснее и богаче по музыке,
    чем предыдущие два релиза Animals.'
