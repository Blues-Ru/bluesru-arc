  author: Дмитрий Казанцев
  mark: 9
  date: '2005-08-11'
  text: 'Этот альбом вышел только в США и так и не был по-человечески издан на КД.
    А ведь тут очень хорошая музыка. 12 песен - одна Бердона и 11 блюзовых и ритм-н-блюзовых
    каверов. Среди них: "Shake", "Rock Me Baby", "Lucille", "Smoke Stack Lightning",
    "Hit The Road, Jack", "Goin'' Down Slow". Группа очень живо мощно играет, Эрик
    Бердон - настоящий блюзовый shouter, каких никогда не было в Англии (разве что
    только Вэн Моррисон, но он из Ирланлии).


    Архиважная запись и альбом!'
