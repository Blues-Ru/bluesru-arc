  date: '2008-01-04'
  text: 'Charlie Sayles малоизвестный харпер, а ведь он клад для любителей блюза, фанка и, конечно, гармоники! Чарли вырос
    в детском доме, из которого он попал в армию. На дворе были 60-е, потому он угодил прямиком во Вьетнам. Вернувшись с войны,
    Charlie Sayles стал уличным музыкантом, где он только не играл, путешествуя по городам Америки. В 1976 году появился его
    первый альбом "Raw Harmonica Blues", следующий увидел свет аж в 1990 году и он называется "Night Ain''t Right".


    У Чарли особый подход к блюзу, написанию песен и самое главное - к игре на губной гармонике (ведь к 1990 году мало, кто
    мог удивить чем-то новаторским в игре на этом инструменте). По записи слышно, что студийная работа для Чарли в новинку,
    и не самый главный его конек, но его владение инструментом - это очень профессионально и круто! У Чарли особый подход
    к гармонике: он удивительно сочетает ритмическую игру (не в духе Сонни Терри, а скорее так играл Little Sonny - подход
    очень фанковый) и мелодизм в добавок к довольно скоростным соло. Я бы назвал Charlie Sayles черным Paul DeLay - очень
    уж у них похожее видение игры на харпе - много прыгают по регистрам, создавая при этом ОЧЕНЬ интересный мелодический рисунок.
    Но самое обалденное, что Чарли использует несколько гармоник в своих композициях (наложение) - например, он может вести
    ритм на диатонической гармонике, а мелодию на хроматической, комбинирует их.


    Аранжирован альбом очень интересно и небанально, таким образом звучали альбомы Альберта Кинга в 70е: изрядная доля фанка
    и ритм-н-блюза. Шаффлы и характерные блюзовые марши у Чарли приобретают очень интересный джазовый оттенок, он часто уходит
    то в мажор, то в минор в рамках одной и той же композиции.


    У альбома, конечно же, есть недостатки: не очень сильные вокальные данные Чарли и некая расхлябанность записи, но это
    не отменяет того, что лично для меня это одно из главных харп-открытий!'
