  author: Константин Колесниченко
  mark: 6
  date: '2008-01-06'
  text: '<img src="http://i021.radikal.ru/0801/d4/df32486ca917.jpg" /> Первый альбом
    Charlie Sayles, на CD его так и не переиздали. Запись датирована 76 годом, но
    по подаче и музыке, такое ощущение, что сделана она в 40е или 50е годы. В начале
    своей карьеры Чарли был уличным музыкантом, это и отразилось на альбоме. Некоторые
    композиции звучат почти как такой уличный джем: Charlie Sayles играет так, будто
    из музыкантов только он и гармоника - шипит, старается комбинировать ритм и мелодическую
    линию, заполняет харпом пространство вокруг вокала, стучит ногой и тут вдруг вступает
    электрогитара (иногда и бас с барабаном). Следует заметить, что все музыканты,
    за исключением Чарли, звучат не очень умело, хотя огрехи в игре есть и у него.'
