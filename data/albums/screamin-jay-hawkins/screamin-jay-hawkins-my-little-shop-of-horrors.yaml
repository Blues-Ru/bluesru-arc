- id: 533
  author: Дмитрий Казанцев
  mark: 5
  date: '2005-04-02'
  text: 'На этом альбоме 12 вещей, включая шикарные I Put A Spell On You (это именно Джэй автор этой песни), Portrait Of A
    Man, What Good Is It, Ashes. Остальное слушать не очень интересно, а порой и трудно. Очень попсовый вариант ритм-н-блюза,
    госпела, соула и блюза. Девушки на подпевках раздражают. Никаких ужасов нет, есть глупое дурачество, крики, хрипы, и прочие
    немузыкальные звуки.


    И не смешно, и не серьезно. Хотя песни есть отличные!'
