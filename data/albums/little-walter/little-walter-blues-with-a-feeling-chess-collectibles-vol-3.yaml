- id: 1118
  author: Константин Колесниченко
  mark: 10
  date: '2007-08-08'
  text: Тем, кто хочет получить представление о творчестве одного из самых значимых
    харперов блюза, новатора губной гармоники, Литтл Уолтера, необходимо обзавестись
    двумя 2-хдисковыми сборниками Чесс. Essential Little Walter - компиляция известных
    хитов Уолтера, а "Blues with a feelin'" - коллекция более редких записей, alternate
    тєйков и т.д. Например, знаменитейший инструментал "Juke" тут звучит абсолютно
    по-другому (и честно говоря, мне нравится больше оригинала). Эти записи - сливки
    чикагского блюза, да и блюза вообще. О сопровождающих музыкантах говорить нечего
    - это вся банда от Мадди до Бадди. Записи отлично ремастированы, звук на высоте!
