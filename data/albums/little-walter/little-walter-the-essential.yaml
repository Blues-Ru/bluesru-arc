  author: Константин Колесниченко
  mark: 10
  date: '2005-10-12'
  text: 'Лучшая подборка, пожалуй, самого влиятельного харпера, на одном из самых
    известных блюзовых лэйблов. На этом двойнике сольные записи мастера в классическом
    чессовском звуке, c классическими составами золотого периода чикагского блюза:
    с 1952 по 1963 год. Эта компиляция своего рода учебник по блюзу Города Ветров
    и блюзхарпу.'
