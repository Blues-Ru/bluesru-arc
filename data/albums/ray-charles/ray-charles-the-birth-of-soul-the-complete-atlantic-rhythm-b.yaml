reviews:
- id: 26
  author: Алексей Калачев
  mark: 10
  date: '2002-10-26'
  text: 'Обратите внимание на эту антологию Чарльза за 50-е годы. Что мы знаем о нём? Сознайтесь честно: почти ничего. Так
    вот, грубо говоря, творчество "брата Рэя" хронологически делится на два периода – 50-е годы и всё остальное. 50-е – звездный
    час Рэя, время прорыва, заполненное поиском и необыкновенной энергией, - словом, особый участок. Потом Рэй был "звездой",
    время от времени выпускавшей поп-шлягеры. Стиль Чарльза – эстрадный вариант блюза, в котором он пел о любви в манере солиста
    церковного хора, – получивший название ритм-энд-блюз, вы и найдёте на бокс-сете. Ничего более блистательного, комфортного,
    чувственного я не слышал в блюзе давненько! (Назад - в поисках новинок? Вполне возможно). Прекрасное для того времени
    качество записи.'
