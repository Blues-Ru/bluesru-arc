- id: 1465
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: "Если слеза не навернется на глаза, когда Гений поет \"Sorry Seems To Be the\
    \ Hardest Word\", то, видать, человек вы черствый, а лучшие главы в истории джаза\
    \ для вас – пустой звук. 73-летний музыкант записал ее за 4 месяца до своей кончины:\
    \ один из самых роскошных голосов джаз стал хрупким.. Но вокальное искусство –\
    \ это не только голос, но и эмоции. Тут Рэй Чарлз оставался непревзойденным мастером.\
    \ Нужно отдать должное и Элтону Джону: в дуэте он не стал \"голосить\", а подобрал\
    \ точно манеру пения в гармонию с маэстро. \tОднако 52-минутный альбом – не \"\
    затянувшееся прощание\". Дуэты Чарлза с мастерами джаза, блюза, кантри и поп-музыки\
    \ записывались почти год. В других песнях он поет и играет в соответствии со своим\
    \ прозвищем: Гений. Его чувство ритма, как и чувство юмора, делает новую версию\
    \ \"Fever\" - одним из лучших каверов в ее полувековой истории. Альбом – легкая\
    \ музыка с хорошим вкусом и с джазовой начинкой. Несомненный претендент на \"\
    Грэмми\" во многих категориях, он бесспорный лидер в категории \"Лучший дуэт года\"\
    .\n\nDuets with Natalie Cole, Elton John, Norah Jones, B.B. King, Gladys Knight,\
    \ Diana Krall, Michael McDonald, John Mathis, Van Morrison, Willie Nelson, Bonnie\
    \ Raitt, James Taylor."
