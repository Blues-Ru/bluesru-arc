  date: '2002-10-26'
  text: Альбом не имеет отношения к блюзу, что видно из его названия. С другой стороны, как такое возможно, если он записан
    классиком ритм-энд-блюза? Это – раз. Вторая причина, по которой он не только здесь обсуждается, но и рекомендован для
    каталога фэн-клуба, формальна, однако - существенна. Из всей  обширной дискографии слепого гения его выделяют в тройку
    самых-самых – покупаемых, слушаемых, музыкально безупречных. Откройте любую энциклопедию, любой сайт с дискографиями и
    убедитесь, что напротив "Modern Sounds.." наивысшая оценка (не путать с его последователем под номером 2)
