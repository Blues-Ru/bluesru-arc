- id: 2201
  author: Олег Пчелкин (oleg_spb)
  mark: 9
  date: '2015-04-03'
  text: 'Выпущенный 17 марта 2015 года блюз-рок альбом канадца Энтони Гомеса "Electric Field Holler" своей прямотой и живостью
    уже заслужил похвалы любителей этого жанра, которые называют альбом "шикарным, классным, , превосходным, отличным и просто
    супером". Если не считать обложки, которая - просто дрянь в худших традициях советской "Мелодии".


    В самом деле, не слишком усложняя, активно используя "квакушку", жесткие риффы и ходы , найденные передовыми хард-рокерами
    в конце и середине 1970х, полукровка француз-португалец создал нечто весьма весомое и впечатляющее для тоскующих по временам
    юности любителей тяжелого электрического блюз-рока.


    Эволюционировал он сам от Дельта-блюза, добавляя в этот устоявшийся стиль собственные оригинальные гитарные фразировки
    и был вознагражден в 1998 году за это самим Бадди Гаем премией в 10 тысяч долларов как "Лучший не подписанный Бэнд", то
    есть не имеющий контракта на запись альбомов с мейджором. Не смущаясь, Гомес замешивал в те времена дельта-блюз с техасским
    и психоделией Хендрикса.


    К 2015 наконец дошел совершенно и, возможно, окончательно до блюз-рок "жесткача" к восторгу слушателей из категории старичков-блюз-рок
    фанов. Что ни песня, то аллюзия на DP/ Whitesnake или Bad Compamy. Находится место и чистому пафосному хард-року : (05
    - Nowhere Is Home, 06 - Losing Game) Дельта-слайд-вставочка в середине альбома тем не менее имеет место быть (07 - The
    Blues Ain''t The Blues No More).


    Передохнув , далее Гомес опять продолжает нечто излишне риффовое и ладно скроенное на одну колодку в духе Come Taste The
    Band . Финиширует канадский португалец скорбным и душераздирающим (12 - Listen To The Universe ), где любой пенсионер
    найдет сходство с Mistreated. В целом, трио во главе с лидером с успехом справилось с поставленными задачами и даже уже
    попалo в первую тройку блюз альбомов к Billboard, подпирая Бонамассу с его "Разными оттенками голубого". Назовем наших
    героев поименно : Энтони Гомес-гитара, ведущий вокал Anthony Gomes - Guitar, Тео Харден - бас гитара Theo Harden - Bass,
    Фред Спенсер - барабаны Fred Spencer - Drums'
- id: 2211
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2015-07-17'
  text: 'Очередной (если не ошибаюсь, уже седьмой) сольник уроженца Торонто (правда, гитару он освоил уже после переезда семьи
    в Чикаго, так что корни оттуда растут). Энергичный блюз-рок, техничная игра на гитаре, неплохой вокал, мелодичные песни,
    авторский материал - вот слагаемые успеха талантливого гитариста. Несмотря на то, что в текстах он перечислил чуть ли
    не все возможные блюзовые клише, диск получился бодрым и заводным - возможно в силу того, что песни не затянуты. Понравится
    любителям хард-рока и тяжелого блюз-рока, а также поклонникам техничной гитарной игры.


    Альбом хороший и заслуженно добрался до 3 места в топе блюзовых альбомов.'
