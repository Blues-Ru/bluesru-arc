  author: Константин Колесниченко
  mark: 9
  date: '2008-07-02'
  text: 'Это первый сольный альбом Филлипа Уолкера, до этого его карьера состояла из нескольких синглов и игре в ансамблях
    таких звезд, как Lightnin'' Hopkins, Clarence ''Gatemouth'' Brown, Clifton Chenier и др.


    В конце 60-х- начале 70-х блюз начал меняться, появилось какое-то свежее дыхание в этой музыке - добавились элементы соул,
    фанка и т.д. Этот альбом один из таких - начинается отличной фанковой "I Can''t Loose (With The Stuff I Use)", далее знаменитая
    баллада "Tin Pan Alley" и в таком ключе альбом развивается до "Cryin'' Time", завершающей альбом.


    Я бы причислил Уолкера к техасским гитаристам, потому что стиль его игры лежит очень близко к Albert Collins, Clarence
    ''Gatemouth'' Brown и др, но в его музыке чувствуется влияние длительного сотрудничества с Clifton Chenier - она расслаблена
    и как-то беззаботна.'
