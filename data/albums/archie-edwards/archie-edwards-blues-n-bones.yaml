reviews:
- id: 1025
  author: Александр Панин
  mark: 7
  date: '2006-08-16'
  text: Пьемонтский блюз на стальной гитаре и костях. Именно на костях – гитаристу Арчи Эдвардсу помогает многолетний специалист
    по игре на этих "инструментах" Ричард Томас. Также на нескольких треках задействована губная гармошка Марка Уэннера. Наличие
    костей добавляет экзотики, конечно, но их музыкальная ценность здесь довольно сомнительна – звук получается довольно тонкий
    (почему-то сразу думается, что на ложках было бы гораздо интереснее), но самое главное, что партии "перкуссионист" с гитаристом
    ведут совершенно разные. Из положительных моментов записи несомненно надо отметить использование слайда, инструмента укелеле
    и впечатляющую энергию гармониста. Исполняемый материал преимущественно традиционный, но ничего особенно выдающегося и
    запоминающегося на диске нет.
