- id: 706
  author: Александр Панин
  mark: 8
  date: '2005-06-02'
  text: Пьемонтский блюз на стальной гитаре. Арчи Эдвардс (1918 - 1998) получил определенную известность после выхода в свет
    пластинок легендарной серии Living Country Blues, ездил с концертами по Северной Америке и Европе, записывался для лейбла
    Mapleshade. На этом диске 13 треков с торонтских сессий 1986 года, выпущенных лишь пятнадцать лет спустя, уже после смерти
    исполнителя, на канадском лейбле Northern Blues. Музыка очень ритмичная, звучит чуть посуше и не так зажигательно, как
    старый пьемонтский блюз двадцатых-тридцатых, но эта ее основная стилистическая составляющая очевидна. На диске ряд интересных
    каверов - Sitting On Top Of The World, How Long Blues, Meet Me In The Bottom. Очень впечатляет 24-страничный буклет с
    отличными фотографиями, статьями и текстами песен с историческими комментариями.
