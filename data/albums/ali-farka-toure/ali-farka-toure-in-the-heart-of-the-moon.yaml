- id: 1491
  author: Андрей Евдокимов
  mark: 9
  date: '2009-02-05'
  text: 'Два наиболее именитых малийских музыканта записали программный альбом. Это воспоминание о периоде в малийской культуре
    50-60-х годов, который получил название Юрана Кюра ("Новая Эра"), в большой степени связанный с борьбой за независимость
    и поисками новых путей в искусстве. Али Фарка Туре играет на гитаре, Тумани Диабате – на коре: национальном инструменте
    с 21 струной и корпусом из тыквы. Лишь два вокальных трека, лишь изредка к акустическому дуэту присоединяются ударные
    инструменты, пианино и гитара (один из гостей – Рай Кудер). Специалисты в восторге от альбома, но его неоспоримое достоинство
    в том, что он восхищает и вне исторического и этнографического контекста. Музыка льется легко и естественно (весь альбом
    записан за 2 часа). Поразительно, что проистекает она из одного из беднейших мест на планете – в ней все светло, изящно,
    нежно, гармонично и пронзительно прекрасно. Грэмми-2005.'
