- id: 689
  author: Александр Панин
  mark: 4
  date: '2005-05-28'
  text: 'Пятый диск из коллекции Джорджа Митчелла, выпущенный на Фэт Поссуме в 2004 году. Он значительно слабее предыдущих
    четырех. Здесь 13 треков на 37 минут, записанных в 1977 и 1982 годах дома у этого неизвестного фермера из Джорджии. Джимми
    Ли Вильямс играет на электрической гитаре, играет просто, незатейливо и однообразно, в основном зацикливаясь на одном
    и том же риффе. Инструментальных изысков практически никаких, гитара явно используется просто как аккомпанимент для вокала.
    Поет Вильямс тоже довольно однообразно, слова почти каждой песни повторяются и повторяются, а иногда их дополняет не очень
    приятное мычание. Материал традиционный, узнаваемых композиций три: When You Hear Me Howling - это переделка песни Howling
    For My Darling, а Step It Up And Go и Whiskey Headed Woman - перепевки вещей Томми Маккленнана.'
