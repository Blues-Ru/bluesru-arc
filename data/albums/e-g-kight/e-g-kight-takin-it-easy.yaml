- id: 1138
  author: Константин Колесниченко
  mark: 8
  date: '2007-10-03'
  text: 'Вообще неизвестная исполнительца, по крайней мере, я о ней до этого диска ничего не слышал. Хотя это ни о чем не
    говорит, конечно. А ведь дама уже немолодая и с хорошо видным сформировавшимся музыкальным почерком. Альбом "Takin'' It
    Easy" - это не блюз, хотя привкус блюза чувствуется, это, скорее срез, смесь американской музыки, исполненной в акустическом
    формате и очень по-белому. Диск заполнен замечательными авторскими композициями или, например,"I Ain''t Got Nothin'' But
    The Blues"(Duke Ellington) или "Southbound" (Dickie Betts). Есть на альбоме пара звезд, но не первой велечины: Chris Hicks,
    Ann Rabson, Greg Piccolo. Лучшие композиции: госпел "I''ll Believe It When I Feel It" и "Can''t Blame Nobody But Me",
    и близкие к южному року "Southbound", "I Ain''t Got No Business Doin'' Business Today", "Takin'' It Easy"'
