- id: 1224
  author: Константин Колесниченко
  mark: 9
  date: '2008-03-07'
  text: 'Mojo Buford - это не высшая лига блюза, он скорее "синий воротничок" жанра. Такие музыканты часто работают сайдменами
    у других мастеров, оттачивают свое мастерство до блеска, но не выбиваются в первый эшелон. Моджо - старый музыкант, но
    он играет по-молодецки задорно и не зацикливается на традиционном материале и на заезженной его подаче. Признаюсь, перед
    прослушиванием этого альбома, я опасался, что это будет очередной набор нетленок, знакомых до боли. Я ошибался в корне
    - альбом "Home Is Where My Harp Is" - это довольно актуальный и современный блюз, такая музыка часто недоступна музыкантам,
    годящиеся во внуки Mojo Buffurd. Суть и концепцию такого блюза, равно как и манеру исполнения на гармонике разработал
    Junior Wells - немного фанка, аранжировки и подачу сделать более прыгучей. Нет, музыка на альбоме не радикальна, она просто
    разнообразна: фанки, West Side Blues, Чикаго, немного West Coast. Игру на гармонике Моджо нельзя назвать революционной
    или сверхвиртуозной - но это очень грамотная и своеобразная компиляция манеры игры: Little Walter, George Harmonica Smith,
    Junior Wells, James Cotton.'
