  author: Александр Панин
  mark: 9
  date: '2006-09-10'
  text: Миссисипский городок Бентония известен любителям архаичного блюза как место рождения замечательного музыканта Скипа
    Джеймса. По сравнению с современниками, он довольно необычно пел и играл на гитаре, из-за чего классификаторы выделяют
    творчество Скипа в отдельный региональный блюзовый стиль. Известно крайне мало его земляков, принадлежащих к так называемой
    бентонийской школе, вспоминается разве что гитарно-гармошечный дуэт Джека Оуэнса и Бада Спайрса, выступления которого
    можно наблюдать в фильме Deep Blues. Оуэнс скончался около десяти лет назад, но оказывается, что бентонийская традиция
    не умерла вместе с ним. Back To Bentonia – первый альбом Джимми Холмса, ученика Джека начиная еще с семидесятых годов.
    Его фальцет напоминает пение Скипа, и на диске, конечно же, есть композиции Джеймса под немного измененными названиями
    I'd Rather Be The Devil и Hard Times, автором которых, впрочем, указан учитель Оуэнс. Ну а заглавная песня диска – не
    что иное, как замаскированная Key To The Highway. Холмс в основном играет на акустической гитаре, но на трех треках, записанных
    в кларксдейлской студии Джимбо Матуса, переключается на электрическую, и тогда ему помогает сессионный фэтпоссумовский
    барабанщик Сэм Карр, добавляя фирменного звучания этого лейбла. Еще на трех вещах на губной гармошке играет тот самый
    Бад Спайрс. Что ж, это довольно симпатичный диск старого традиционного блюза, и очень здорово, что и сейчас есть кому
    играть и выпускать такую музыку.
