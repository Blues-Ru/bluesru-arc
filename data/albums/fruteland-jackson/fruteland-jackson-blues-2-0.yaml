  author: Алексей Калачев
  mark: 4
  date: '2003-12-02'
  text: Джексон - новый музыкант, работающий с акустикой. Диск начинается натуральной "work song" – а капелла в такт физическому
    усилию, например, удару киркой. Таким заунывным ритмичным пением сопровождали работу в "chain gang" – скованные одной
    цепью колодники-зеки (смотри начало "O Brother, Where Art Thou?"). Диск представляет разные направления блюзовой акустики
    – дельта, пьемонт, баллады в стиле Rev. Gary Davis и проч. Иногда аккомпанимент выглядит черезчур незатейливым. Диск,
    как минимум, приятный.
