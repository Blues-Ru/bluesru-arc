- id: 354
  author: Дмитрий Казанцев
  mark: 10
  date: '2003-12-12'
  text: 'Слепой Снукс Иглин по кличке "Гений" тоже из Нового Орлеана как и еще один
    "Гений" Рэй Чарльз. Но если Чарльз - это поп-культура, то Снукс - это воплощение
    корневой музыки юга США. Мастер игры на гитаре и сногсшибательный вокалист с огромным
    шармом Снукс работал с группой в ритм-м-блюзовом ключе на лейбле Imperial, но
    для Bluesville он записывается один с акустической гитарой. В программе традиционные
    и не очень блюзы и несколько популярных треков типа I Got A Woman. Иглин великолепно
    чувствует ритм, и его очень интересно слушать даже тогда, когда он играет примитивные
    партии и забывает слова (а это у него часто бывает; он не готовится к записям).


    На этой пластинке 13 композиций, на которых Снукс играет на шести- и двенадцатиструнной
    гитаре. С первых секунд записи создается атмосфера праздника и волшебства; голос
    Иглина делает что-то невероятное! Тут очень много знакомых блюзов в его исполнении,
    и они будто получают новое рождение, настолько самобытен Снукс. Очень хороши:
    Mailman Passed, I''m A Country Boy, I Got A Woman (у него этот номер звучит как
    блюз), Alberta, послушайте игру на гитаре в Brown Skinned Woman, That''s All Right,
    Well I Had My Fun (Goin'' Down Slow)... Я начал перечислять почти все треки; надо
    слушать ВСЕ - тут нет плохих номеров.


    Даже зная его достижения в игре в группе с электрогитарой, я не могу не радоваться
    и удивляться этому милому акустическому альбому ГЕНИЯ! Обязательная пластинка
    в любой коллекции!'
