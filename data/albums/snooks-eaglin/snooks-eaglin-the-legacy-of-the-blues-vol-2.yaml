- id: 608
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-05-04'
  text: 'Тут только Снукс и его гитара. Он вытворяет на ней нереальные вещи: изображает
    пианино, ударные инструменты, играет за двоих. Очень здорово звучит "Lucille"
    в его исполнении - Иглин умеет петь подобные хиты по-своему, но как точно он передает
    игривое настроение этого рок-н-ролла. "Funky Malaguena" - это просто праздник
    инструментальной музыки на одной гитаре. "Pinetop Boogie Woogie" - Снукс изображает
    на гитаре игру на пианино легендарного Пайнтопа. Есть тут и "Tomorrow Night" -
    знаменитая песня, которую так хорошо исполнял еще Лонни Джонсон.


    У Иглина совсем мало альбомов, и каждый из них - радость. Этот диск не исключение
    - 12 волшебных треков. Возможно, он даже самый лучший у Слепого Снукса Иглина.'
