  author: Дмитрий Казанцев
  mark: 8
  date: '2007-12-15'
  text: 'Третий альбом Снукса для лейбла Black Top (Allmusic считает его лучшим у него). Альбом длинный - 14 песен на 48 минут.
    Тут нет ни одной песни Иглина, он играет чужие вещи, 4 из них - Эрла Кинга.


    Как обычно, Снукс исполняет новоорлеанский блюз, ритм-н-блюз, соул и фанк. Его гитара - это яркий и необычный стиль, его
    пение - это всегда ощущение чего-то типичного для Нового Орлеана. На бас-гитаре здесь играет великий John Porter Jr. (of
    The Meters).


    Не все вещи здесь супер-дупер, я бы выделил следующие номера: "Soul Train", "Teasin'' You", "Dizzy Miss Lizzy", "Black
    Night", "Travelin'' Mood", "Jesus Will Fix It", "Lilly May", "Red Beans". Очень хороший альбом, конечно, на нем потрясающее
    настроение и энергетика.'
