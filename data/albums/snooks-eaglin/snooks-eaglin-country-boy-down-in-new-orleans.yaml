  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-02'
  text: 'О музыке. Классный новоорлеанский блюз Снукса. Он гениально поет и играет на гитарах. 23 отличные песни; кое-где
    ему помогают на стиральной доске и гармошке, а также подпевают. Иглин - один из самых интересных блюзменов всех времен,
    безусловно.


    Об издании. Тут я запутался и даже расстроился. Издание канадское, фирма Arhoolie Productions, Inc. На первой стороне
    название Country Boy In New Orleans, а внутри Country Boy Down In New Orleans. На диске явно записаны 8 песен с его альбом
    1961 года That''s All Right (Bluesville), но в буклете написано, что записи сделаны в конце 50-х! Еще больше меня поразила
    надпись - (c) and (p) 1955, 1967 & 1991 by Arhoolie Productions, Inc. И еще меня добило это: Tracks 1-6, 19, 20 previously
    unissued in the U.S. Это как раз те треки 1961 года. Все это очень странно. Интересно бы было разобраться во всем этом.'
