  author: Дмитрий Казанцев
  mark: 8
  date: '2005-12-01'
  text: 'Второй диск Снукса на лейбле Black Top. А ведь до этого у него не было дисков аж 9 лет - с 1978 по 1987 год. Иглин
    - король новоорлеанской музыки, он свободно играет блюзовую акустику, а также любые вида южного ритм-н-блюза и соула.


    На этом диске Снукс с малым составом играет соул, блюзы, фанки и даже джаз. Рон Леви играет на клавишах - это очень серьезный
    музыкант. Сам Иглин блестяще солирует на гитаре и поет, создавая праздничную атмосферу. Его музыка здесь скорее бодрая
    и танцевальная, чем глубокая и вдумчивая, но Снукс хорош и в этом стиле - он соблюдает здесь все традиции Нового Орлеана
    и играет разнообразную программу. Каждый найдет на этом диске что-то для себя; здесь есть шикарные песни и инструменталы
    в разных жанрах.'
