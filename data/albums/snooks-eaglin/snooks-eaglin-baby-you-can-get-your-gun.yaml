- id: 607
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-05-04'
  text: 'Праздник блюза и новоорлеанского ритм-н-блюза. Снукс великолепно поет и виртуозно играет на гитаре, а ему помогают
    классные музыканты: David Lastie - sax, Ron Levy - keys, Erving Charles - bass, Smokey Johnson - drums, Ronnie Earl -
    rhythm guitar.


    На диске 11 песен, все в разных темпах и стилях, и это замечательно. Этот альбом стал возвращением Иглина в мир записи,
    ведь до этого его и так редкие альбомы выходили в далеких 70-х. Замечательное возвращение!'
