- id: 545
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-04-02'
  text: 'Издание на лейбле Storyville. Тут 25 треков с записями 1958-1961 годов. В книжке написано, что треки 1-8 - это диск
    "Snooks Eaglin - Portraits in Blues vol. 1", треки 9-18 - это диск "Snooks Eaglin", а треки 19-25 - это диск "Snooks Eaglin
    - New Orleans Street Singer". Я не думаю, что здесь записаны целых ТРИ ВИНИЛА, так что надо разбираться дальше с оригинальной
    дискографией Снукса.


    Иглин играет на гитаре и поет, а в одном треке ему помогает гитарист-вокалист и человек со стиральной доской. Материал
    очень классный, но он совпадает и с более поздними дисками Снукса - видимо он пытался записать эти треки с лучшим качеством.
    Здесь же качество разное, но нигде не идеальное - слышно, что записи сделаны сходу и иногда слышен шум улицы и пение ПТИЧЕК!


    Снукс Иглин - гениальный и виртуозный автор-исполнитель из Нового Орлеана, так что эта компиляция просто необходима в
    любой коллекции блюза и фолка.'
