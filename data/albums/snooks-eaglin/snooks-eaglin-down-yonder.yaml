  author: Дмитрий Казанцев
  mark: 10
  date: '2006-05-03'
  text: '<img src=http://images-eu.amazon.com/images/P/B000B7HY2E.03.LZZZZZZZ.jpg>


    Вот так странно (обложка и название) фирма UNIVERSAL решила издать этот замечательный альбом Снукса 1977 года. На диске
    12 песен - новоорлеанский блюз и ритм-н-блюз высшего класса. Снукс очень круто поет и играет на электрогитаре, ему помогает
    ОФИГЕННАЯ банда: Ellis Marsalis - piano, Clarence Ford - sax, George French - bass/vocals, Bob French - drums. Запись
    изумительного качества! Иглин играет тут много известных тем: "Down Yonder", "Talk To Your Daughter", "A Tiny Bit Of Your
    Love", "Mustang Sally". В меру фанки и в меру блюзи - классная южная музыка!


    Пожалуй, это сильнейший диск Снукса. А его вот только что переиздали, почти 30 лет спустя.'
