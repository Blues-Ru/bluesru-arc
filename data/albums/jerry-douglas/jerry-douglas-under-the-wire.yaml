reviews:
- id: 914
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-11-27'
  text: 'Джерри Дуглас - виртуоз игры на добро и стил-гитарах, он записал очень много альбомов в качестве сейшн-мена, но сольников
    у него не так много. Этот альбом - его третья работа. Этот альбом необычный - Джерри сам написал 7 песен из 10, так что
    нельзя сказать, что этот диск чисто в кантри или блюграсс стиле. Скорее, это сочетание фолка, кантри и блюза на его собственный
    манер (очень интересный манер, надо сказать). Вокала здесь нет, а вот виртуозы еще есть: Bela Flack - banjo, Mark O''Connor
    - violin, Russ Barenberg - guitar, Sam Bush - mandolin. Для тех, кто любит инструментальную рутс-музыку, этот диск - жемчужина.'
