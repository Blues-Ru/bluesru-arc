  author: Дмитрий Казанцев
  mark: 8
  date: '2006-01-21'
  text: '<img src=http://www.arsenic.blues.ru/img/release/dncov.jpg>


    Записано в Нальчике. Продюсеры - Джо Морабия и Арсен Шомахов. Мастеринг - Джек Крайсберг. Дизайн - Донна Мерсер. С дизайном
    тут плохо, с мастерингом тоже (частоты гуляют, громкость тоже). Я удивлен, это ведь в США делали. От имени Регтайм отказались,
    видимо, из-за его распространенности в США, а Арсен Шомэков звучит экзотично. Диск записан с технологией HDCD, кстати.


    На альбоме 13 песен, 11 из них написал Арсен, 1 песня Бюска и еще одна Фредди Кинга. Арсен играет на гитарах (различных),
    клавишах и поет (кое-где на голоса!) На басу Аслан из Регтайма, на барабанах Бек (тоже оттуда). Есть приглашенный контрабасист
    в двух песнях, его зовут Шамиль Хаджиев. Пение Шомахова стало еще лучше, но мне лично кажется, что его голос слишком красивый
    и не совсем подходит к довольно жесткой музыке Регтайма. Музыка разнообразная - от инструментальных шаффлов/свингов до
    блюз-рока и ритм-н-блюза. Почти везде наложены дополнительные гитары, кое-где даже акустические (а есть и клавиши).


    Можно сказать, что это блюз-рок с сильным влиянием соула и фанка в некоторых композициях. К сожалению, звук на альбоме
    по-прежнему "наш", не фирменный. Акцент сделан на гитарные соло Арсена и его вокал, все остальное как бы и не важно -
    это неверный подход, на мой взгляд. Минусы есть, конечно, но в любом случае, это лучший блюз-рок-коллектив из России,
    рядом никого и ничего нет. Арсен хорошо владеет английским и вокалом - это самое главное и то, чего точно нет у других
    российских команд такого плана.'
