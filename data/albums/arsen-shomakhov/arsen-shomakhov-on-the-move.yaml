reviews:
- id: 1646
  author: Андрей Евдокимов
  mark: 8
  date: '2010-10-09'
  text: Наш человек в Канаде записал без преувеличения мастерский альбом. Арсен уникальный музыкант. Он может играть и обычный
    квадрат (что делает преотлично). А может вытворят то, что вы никогда не слышали. В отличие от обычных "поющих гитаристов"
    он настоящий вокалист. Гитара и голос всегда в блюзе были в блюзе вместе. Но об этом почти забыли, и вот хороший повод
    вспомнить. Если вам кажется, что блюз вам досконально известен, послушайте этот альбом. Сначала привычный радостный вест-коаст,
    с собственно блюз начинается дальше. Собственные песни органично переплетаются с редкостями из блюзовой истории. В исполнении
    множество новаторских нюансов. Но альбом цепляет не только мастерством, но и настоящими эмоциями.
