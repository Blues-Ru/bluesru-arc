reviews:
- id: 49
  author: Алексей Калачев
  mark: 6
  date: '2002-11-26'
  text: 'В очередной раз приходится досадовать на то, что фирма Alligator не в полной мере учитывает интересы своих европейских
    покупателей: на вкладках нет текстов. С текстами, которые остроумны и весьма литературны, было б интересней.  Милый, не
    скучный, ровный, мелодичный диск и, может, чуть размытый, в сравнении с предыдущими. Дуэт остаётся, прибегая к военной
    терминологии, стойким ДОТом, обороняющим позиции Пьемонтского Ист Коуст Блюза.'
