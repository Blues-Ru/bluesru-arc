reviews:
- id: 1023
  author: Александр Панин
  mark: 8
  date: '2006-08-15'
  text: 'За плечами акустического блюзового дуэта уже почти тридцать лет совместных выступлений и более десяти номерных альбомов.
    Этот диск – их четвертый на лейбле Alligator. Он не слишком сильно отличается от предыдущих: как и раньше, Джон и Фил
    играют старый добрый пьемонтский блюз на акустической гитаре и гармошке, половина треков здесь – каверы (песен Скипа Джеймса,
    Блайнд Боя Фуллера, Слипи Джона Эстеса, Сонни Боя Вильямсона-первого, Чарли Паттона), вовсе не трепетно снятые с записей
    давно ушедших мастеров, а звучащие по-своему уникально (чего стоит только меланхолическая версия известной вещи Catfish
    Blues). Небольшим отличием от предыдущих дисков является участие примерно на половине треков пианистки Энн Рэбсон (Saffire
    – The Uppity Blues Women). Конечно же, Фил и Джон – это совсем не Сонни Терри и Брауни МакГи, но вряд ли кто играет в
    наше время пьемонтский блюз интереснее, чем это делают они. Диск рекомендуется к приобретению любителям блюзовой акустики.'
- id: 1459
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: 'Уже почти 30 лет в блюзе эти двое стоят плечом к плечу. Их тринадцатый альбом оказался первым концертным. В программе
    поровну блюзов собственного сочинения и классики жанра. И очень приятным сюрпризом оказалось участие еще одного "аллигаторского"
    артиста: пианистки Энн Рэбсон, которая не менее привержена традициям. А четыре года, прошедшие после выхода их предыдущего
    альбома, делают этот особенно долгожданным. По их дискографии можно проследить эволюцию от мрачноватых и самоуглубленных
    блюзов в начале до нынешнего стремления поднимать публике настроение. Но главные константы: приверженность акустическому
    кантри-блюзу пьедмонтского стиля и искренняя эмоциональность. Цефас и Виггинс – уникальны по чистоте стиля. Они удивительно
    органично себя чувствуют в его узких рамках. И заняты они не интерпретацией классики, а самой музыкой как способом самовыражения.'
