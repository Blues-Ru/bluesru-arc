  author: Дмитрий Казанцев
  mark: 6
  date: '2005-08-23'
  text: 'Это переиздание дебютного альбома дуэта 1984 года. Первые 10 треков - это и есть альбом (записан в апреле 1983-го),
    треки 11-16 - концертные записи 1981-1982 годов из разных мест и стран. Музыка - разнообразный акустический блюз: Дельта,
    Пьедмонт, госпел, ньюорлеанские традиции.


    Джон играет на гитаре и поет (очень четко и мощно), Фил играет на гармошке и поет дуэтом всего одну вещь на диске (и еще
    одну на бонусах). Вообще, надо отметить, что из 10 альбомных песен 3 - инструменталы, а 8 написаны Джоном и Филом. Два
    кавера - это традиционный "St. James Infirmary Blues" и госпел "I Saw The Light" (на концерте они еще играют Роберта Джонсона,
    Джимми Рида). Если сравнивать этот дуэт с Sonny & Brownie, то почти все у них слабее - Терри/МакГи часто пели в два голоса,
    они интереснее играли на гитаре и гармошке, и главное - они писали более яркие и ЗАПОМИНАЮЩИЕСЯ песни. Здесь же почти
    все время поет один Джон, его гитара потеряна в миксе (ее плохо слышно); Фил - хороший гармонист, но у него нет энергии
    и фантазии Сонни Терри, к сожалению.


    Еще сразу заметно, что многие песни длинные и затянуты - половина треков длиннее 4 минут, а два первых - длиннее 6-ти!
    Мне запомнились отсюда три вещи: "I Saw The Light", "Sickbed Blues" и "Hoodoo Woman". На диске есть что слушать, конечно,
    но не стоит ждать сильных эмоций и откровений от этой музыки.'
