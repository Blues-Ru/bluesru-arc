reviews:
- id: 106
  author: Алексей Калачев
  mark: 7
  date: '2003-02-24'
  text: 'Диск пользовался при своем появлении и пользуется до сих пор бешеной популярностью
    у любителей самого жесткого гитарного ритм-энд-блюза. Он почему-то считается исключительно
    удачным концертником. В действительности песни в нем звучат ровно так же, иногда
    даже с тем же хронометражом, не говоря уже об аранжировках, как и на студийных
    альбомах. Я ни в коем случае не хочу сказать, что это бесчувственный, засушенный
    и формальный альбом. Ни в коем случае!!! Он преисполнен эмоций. Во-вторых, он
    высвечивает забавное обстоятельство. Я имею в виду то, что он делает честь Томми
    Кастро как именно студийному музыканту: выходит, что его студийная работа столь
    же насыщена эмоциями и драйвом, как и концертные выступления, они ничем в этом
    смысле не отличаются. Аминь.'
- id: 239
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'В 97-м, отслушав только что вышедший альбом Tommy Castro "Can''t Keep A Good
    Man Down", я так расчувствовался, что даже отписал гитаристу на его e-mail (уникальный
    для меня пример проявления эмоций). Туда же я послал и свою рецензию из "Недели"
    (естественно, переведенную на английский), которая почти год провисела на личном
    сайте музыканта (www.tcband.com). В общем, к творчеству Castro я явно неравнодушен,
    и, конечно, не мог пропустить мимо ушей и глаз концертную запись этого калифорнийского
    блюзмена.


    С клубом Fillmore Auditorium, что в Сан-Франциско, гитарист знаком очень неплохо
    - выступал там не раз и, как раскачать аудиторию, знает. Видимо, поэтому он и
    выбрал это заведение для записи своей первой концертной пластинки. Все было достаточно
    традиционно - Castro исполнил несколько вещей ("Right As Rain", "Like An Angel",
    "Lucky In Love", "I Got To Change") с недавно вышедшего студийного альбома "Right
    As Rain". Отыграл три блюза со своей лучшей пластинки "Can''t Keep A Good Man
    Down" (медляк "My Time After Awhile", гремучую "Can''t You See What You''re Doing
    To Me" и "Can''t Keep A Good Man Down"). Все это было дополнено тягучим блюзом
    "Just A Man" и почти рок-н-роллом "The Girl Can''t Help It". Завершилось действо
    достаточно неожиданно - "на бис" Castro выдал классический хит James Brown "Sex
    Machine". Причем сделал это здорово. Убедиться в этом вы можете - не только послушав,
    но и посмотрев этот концерт ("Live At The Fillmore" параллельно вышел и на DVD).'
