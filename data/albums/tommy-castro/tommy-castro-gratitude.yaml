reviews:
- id: 144
  author: Алексей Калачев
  mark: 7
  date: '2003-08-15'
  text: Диск-трибьют. Томми интерпретирует любимые песни своих учителей - королей
    соул и блюза. Особенность в том, что обычно он записывает главным образом собственные
    песни, на этот раз – только чужие. Результат – превосходный. "Gratitude" ничего
    не добавляет к сложившемуся образу Кастро как гитарного супермена, умело разрабатывающего
    формулу соул-рока. Там нет ничего нового. Однако, поклонники и не ждут экспериментов,
    они ждут 100% Кастро и они его получают. Диск высокого качества и, по-моему, без
    узких мест. Вещи из репертуара Би Би и Алберта Кингов – выше всяких похвал.
