- id: 1754
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-05-23'
  text: Довольно типичный для Кастро качественный альбом, занявший вторую позицию в блюзовых чартах Биллборда. Как обычно,
    блюз-рок (с ударением на рок) с изрядной примесью соул, на заглавной песне на слайд-гитаре отметился Рой Роджерс. Своего
    рода "соул-блюз" с периодическим включением духовых инструментов, или то, что иногда называют 'party album' (альбом для
    вечеринок) - набор бойких заводных рок-номеров вперемешку с медленными блюзовыми балладами. Не самый лучший альбом Томми,
    однако это основа для его следующего триумфального альбома Painkiller
