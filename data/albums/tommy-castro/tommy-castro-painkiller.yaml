- id: 1467
  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: Перед каждым активно гастролирующим блюзменом регулярно встает вопрос о записи нового альбома. Примерно раз в три
    года Т.Кастро решает эту задачу. Альбомы он пишет не для истории, а для тех, кто после его концерта захочет их купить
    "на память". В нынешнем году под жутковатой и аляповатой обложкой вы найдете жизнелюбивую и качественную музыку. Стиль
    определить трудно, поскольку это уже не "современный блюз", но и, конечно, не "классика". И даже не блюз-рок, поскольку
    в большинстве номеров звучание его группы значительно "полегчало". Песни с хорошим чувством юмора и в достаточно остроумных
    аранжировках. Гитарную игру подкрашивают в изобилии клавишные. Поскольку ныне в блюзе альбом – не альбом, когда нет в
    нем гостей, приглашены были певец-гитарист Коко Мантойа и певица Анжела Стрелли. Им достались именно "блюзовые стандарты".
    А большинство песен написаны самим Кастро (в соавторстве). Особенно радует финальная "Быть мною нелегко" - и в музыке,
    и в тексте чувствуется опытная рука блюзмена.
- id: 1751
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-23'
  text: 'Томми Кастро - гитарист, певец и композитор, восходящая звезда американского блюза 90-х годов прошлого века и века
    настоящего, который прошел путь от клубных выступлений до участия во всех крупных блюзовых фестивалях, включая и позицию
    хедлайнера.


    В начале 90-х он собрал свою первую группу, которая в 93 году завоевала премию "Клубная группа года". Это дало возможность
    Кастро записать первый диск, выпущенный на независимой фирме. По итогам продажи этого диска был заключен контракт уже
    с существенно более крупным лэйблом - Blind Pig Records, на котором у Кастро вышло большинство пластинок. К концу 90-х
    Томми Кастро уже вовсю гастролировал в Америке и Европе, принимая участие во всех крупнейших блюзовых фестивалях. Стилистически
    музыка Кастро - это блюз-рок с изрядной примесью соул, что придает ей легкий коммерческий оттенок.


    Альбом Painkiller был признан блюзовыми музыкантами и критиками альбомом года в жанре современного блюза, а в блюзовом
    топе Биллборда он занял 2 место. На альбоме гитару Кастро усиливает духовая секция, на кавере Альберт Коллинзовской песни
    Good Fool is Hard to Find ему помогает Коко Монтойя, а на кавере "If You Believe (In What You Do)" из репертуара Фредди
    Кинга - Анджела Стрели. На последнем треке партию фортепиано записал знаменитый пианист Дэвид Максвелл (друг Ронни Эрла
    и Бродкастер, памяти которого Ронни посвятил альбом Maxwell Street). В отличие от американского издания на лейбле Blind
    Pig Records (а это уже шестой альбом Томми для данного лейбла), европейский релиз на лейбле DixieFrog вышел с альтернативным
    оформлением.


    Классический слегка коммерческий рок-и-соул альбом от калифорнийского блюз-рокера.'
