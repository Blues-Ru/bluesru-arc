  author: Артем Липатов
  mark: null
  date: '2008-01-30'
  text: 'Игра слов в названии этого диска прозрачна, как "Русский Стандарт": а) вокалистов трое; б) аккомпанирует им ритм-секция
    группы Стиви Рэя Воэна Double Trouble. Казалось бы, чего желать еще. Все трое - люди хоть и не совсем звездные, но при
    этом вполне заслуженные (харпист, гитарист и певец Холл работал много с кем и даже пел у Джеффа Бека на диске Flash, Джонс
    тоже из ветеранов, а Кастро который год не выходит из разряда "новых надежд блюза"), материал приличный (отметим небанальную
    кавер-версию битловской Help!), сыграно все гладко и даже с некоторым задором. В общем, среднестатистический блюз сегодняшнего
    дня.


    Но та самая игра слов в названии почему-то не дает покоя. Потому что не тянут эти парни даже втроем на одного Стиви Рэя.
    Они б и хотели, да нету в них столько страсти и такого нерва, как был у него. Так что остается им делать хорошую мину
    – при такой вот неуклюжей и неловкой игре.'
