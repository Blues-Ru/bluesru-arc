- id: 1752
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-23'
  text: 'Очередной альбом блюзовый соул-рокер Томми Кастро записал на не уже привычном
    лейбле Blind Pig, а на его более крупном конкуренте Alligator. Однако принципиальных
    изменений в музыку и стиль исполнителя это не внесло - ну разве что звук стал
    чуть более плотным и, пожалуй, временами даже слегка перегруженным инструментами.
    Кроме соло-гитары самого Томми, тут еще есть пара гитаристов (включая слайд),
    клавиши, бас, ударные и отдельная перкуссия, а также духовая секция.


    Половина песен на диске собственного сочинения Кастро (в соавторстве), остальное
    каверы. Кроме треков 10 и 12, которые несколько выдаются из общей канвы остальных
    песен (что вовсе не значит, что они хуже - они просто другие), весь альбом выглядит
    довольно цельно. Добротный хорошо спродюсированный и отлично сыгранный альбом
    одного из ведущих современных блюзовых мастеров. Единственное пожелание - добавить
    немного импровизации и свободы для инструментов, а то уж как-то все слишком "правильно".
    Второе место в блюзовом топе Биллборда.'
