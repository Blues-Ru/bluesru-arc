- id: 1753
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-23'
  text: Довольно приличный сборник лучшего с первых четырех альбомов гитариста, записанных на Blind Pig Records (Exception
    to the Rule 1995, Can't Keep a Good Man Down 1997, Right as Rain 1999 и Lve at the Fillmore 2000). Бойкий блюз-рок с примесью
    соул и фанка, исполненный с задором и хорошей техникой игры. Два трека данного сборника (4 и 12) до этого момента на CD
    не издавались. В качестве бонуса на данном мультимедийном диске присутствует видео композиции Nobody Loves Me Like My
    Baby, взятое с концерта Live at the Fillmore.
