- id: 1008
  author: Александр Панин
  mark: 9
  date: '2006-05-07'
  text: Иногда попадаются такие записи, что прослушаешь буквально первые десять секунд и понимаешь, что будет очень здорово.
    Этот диск для меня несомненно из таких. Аарон Невилл – замечательный новоорлеанский соул-вокалист, один из <a href="http://www.allmusic.com/cg/amg.dll?p=amg&sql=11:4z6qoa9abijv">Neville
    Brothers</a>. Believe – подборка музыки в стиле госпел, с шикарными распевками и богатым инструментальным сопровождением,
    почти на каждом треке задействовано по десять и более музыкантов. Аарон исполняет впечатляющие версии композиций Боба
    Дилана (Gotta Serve Somebody), Шуберта (Ave Maria), Сэма Кука (A Change Is Gonna Come), Хэнка Вильямса (I Saw The Light),
    известнейший традиционный номер Amazing Grace, несколько своих песен, тоже весьма удачных. Отменный диск с очень красивым
    лид-вокалом.
