- id: 598
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-04-29'
  text: Джимми - певец, пианист, автор и лидер. Этот альбом вышел на лейбле Stax и был спродюсирован Элом Джексоном (из Booker
    T & The MG's) и самим Уилли Митчеллом с Hi Records. Все вещи на диске написаны самим МакКрэклином. Очень радует присутствие
    The Memphis Horns в качестве духовой секции. В результате, великолепный соул-блюз альбом, полный эмоций и музыки. Один
    из лучших блюзовых дисков в этом стиле.
