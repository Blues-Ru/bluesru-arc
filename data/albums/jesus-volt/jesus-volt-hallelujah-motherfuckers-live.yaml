- id: 2069
  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2012-08-13'
  text: 'Четвертый диск французских блюз-рокеров, играющих вместе уже десять лет, был записан на концерте в Голландии в марте
    2008 года. На нем квартет представил на суд аудитории десять авторских композиций и два кавера. В музыкальном отношении
    творчество Jesus Volt объединяет традиционный блюз 60-х, хард-рок и фанк 70-х с современными электронными технологиями,
    включая использование диджейских сэмплов и лупов.


    На данном концертнике группа играет довольно тяжелый мрачный блюз-рок в сочетании с хард роком и даже некоторой долей
    психоделии, а также примесью фанка. Вряд ли можно назвать музыкантов Jesus Volt виртуозами, но они определенно способны
    создать экзотическую сырую психоделически-блюзовую атмосферу, наполненную тяжелыми риффами и хриплым вокалом. Несмотря
    на то, что концерт записан в лучших традициях рока 70-х, группа звучит очень современно, жестко и тяжело (да и название
    диска говорит само за себя :-)).


    Любителям традиционного блюза не рекомендуется, зато поклонникам тяжелого гитарного блюз-рока вполне может понравиться.'
