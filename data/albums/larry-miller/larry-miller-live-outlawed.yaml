  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2013-08-09'
  text: 'Как-то раз много лет назад молодой Ларри попал на концерт Рори Галлахера, и этот момент изменил всю жизнь подростка
    - он был настолько потрясен, что решил делать то же, что и Рори: играть на гитаре, писать песни и выступать под своим
    именем со своей группой. И вот прошло много лет, в послужном списке Ларри 7 сольных альбомов и слава одного из лучших
    блюз-роковых исполнителей Англии, а критики иногда называют его новым Галлахером.


    Восьмой сольник Ларри - это двойной концертник, записанный во время турне по Европе в сентябре - ноябре 2012 года. На
    альбоме в основном представлен авторский материал, за исключением кавера Messing with the Kid Джуниора Уэллса, посвящения
    Рори Галлахеру As Blue as it gets, и отрывков из Хендрикса и Галлахера. Поклонники часто жаловались, что студийные альбомы
    не передают духа концертных выступлений музыканта - и данный двойник наконец оправдывает их ожидания. Мощные рифы, искрометные
    соло, длинные версии песен, эмоциональное исполнение, энергия через край - одним словом, все то, за что любят концертные
    выступления настоящих мастеров. Сырой и безудержный, мощный и искренний блюз-рок от Ларри Миллера вряд ли оставит равнодушным
    любого поклонника современного тяжелого гитарного блюза.


    Хотя гитарное мастерство Ларри достойно восхищения, его вокальные способности оставляют желать много лучшего, что особенно
    слышно в концертном исполнении, где нет возможности перезаписать дубль или улучшить вокал студийными средствами. Возможно,
    приглашение в штат хорошего вокалиста заметно украсило бы окончательный продукт.


    "Holding his captive audience in a packed out venue hypnotising them into a trance with his guitar skills. A true master
    at work who many have said fit''s a void left by the great late Rory Gallagher. Much respected within the music industry
    by fellow artists who have nothing but good words to say about him and his guitar playing ability"


    - Blues matters 2011'
