- id: 1875
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-10'
  text: 'Шестой сольный альбом талантливого английского блюз-рокера, которого критики величают наследником Рори Галлахера
    и Алвина Ли, а также британским Стиви Рэем. Первый сольник Лэрри выпустил в 1991 году, и с тех пор только закрепил свою
    репутацию отличного гитариста и композитора, причем не только среди критиков, но и коллег-музыкантов.


    Альбом полностью состоит из материала, написанного самим Миллером, который также выступил и в качестве продюсера (вместе
    с басистом Нилом Сэдлером). Диск техничного блюз-рока, исполненного профессионально и энергично. Особенно хороши длинные
    треки - Cruel Old World и Delilah. Объективности ради отмечу, что вокальные способности Лэрри заметно уступают его гитарному
    мастерству, что особенно слышно на тихих акустических треках (Covering Me я бы вообще не включал в альбом). В целом -
    добротная работа, которая наверняка понравится любителям современного блюз-рока.'
