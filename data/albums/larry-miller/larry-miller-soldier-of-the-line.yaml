  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2015-03-12'
  text: 'По итогам опроса читателей журнала ‘Classic Rock Presents The Blues'' Лэрри Миллер занял третье место после Джо Бонамассы
    и Уолтера Траута, что говорит о многом. На свой девятый сольник знаменитый английский блюз-рокер включил 9 песен из 25,
    написанных им за последние два года.


    Сохранив свой традиционный техничный блюз-роковый подход, Лэрри на этом диске расширил звуковую палитру за счет эпизодического
    включения духовой секции и струнных, что сделало музыку более интересной. Сам Лэрри считает данный диск своим лучшим альбомом,
    на котором ему удалось выйти за рамки блюз-рокового жанра, одновременно сохранив пылкость и искренность исполнения. Пожалуй,
    с этим трудно не согласиться. К изюминкам альбома я бы отнес роскошную "открывашку" One Fine Day и балладу по библейской
    истории о царе Давиде и Вирсавии (на иврите ее имя - Батшеба) Bathsheba.


    Диск разнообразный и интересный, но не лишен недостатков. Лэрри прекрасный исполнитель и талантливый гитарист, знаменитый
    своими концертными выступлениями (ему принадлежит рекорд по количеству вызовов на бис на рок-фестивале в Кэмбридже). В
    то же время композитор он среднестатистический, а певец довольно посредственный. В результате сыграно все отлично, а вот
    вокал традиционно слегка подкачал. Включение в состав группы хорошего вокалиста несомненно привело бы к существенному
    улучшению звучания. Тем не менее любители гитарного блюз-рока несомненно найдут для себя на диске много интересного.


    "Fantastic world class guitarist" - Bluesrockers USA'
