reviews:
- id: 12
  author: Алексей Калачев
  mark: 9
  date: '2002-10-13'
  text: "Проблема Алексиса Корнера в том, что его творческое наследие исключительно \nобъемно и разнопланово. Поэтому составление\
    \ компиляций, антологий всегда было в \nслучае с Корнером задачей сложной. Как, например, отделить самого Алексиса от\
    \ \nмузыкантов, с которыми он заключал творческие союзы, выступал в дуэтах, при \nпомощи которых, посредством которых\
    \ он осуществлял свои замыслы? Ведь хорошо \nизвестно, что гуру выпустил свою сугубо сольную пластинку – первую и \nединственную\
    \ – лишь в 1979 году, остальное представляет собой в той или иной \nстепени плод коллективного творчества.\n<p>Данная\
    \ компиляция, честь ей и хвала, совместила 2 важных компонента, делающих \nее, возможно, лучшей на сегодняшний день: 1)\
    \ самые известные песни в исполнении \nсамого Корнера; 2) самые известные его дуэты, включая две вещи с Робертом \nПлантом.\n\
    <p>Хронологически сборник несколько хромает. Он ведёт отсчёт лишь с 1967.\n<p>В достоинства антологии входит то, что в\
    \ значительной степени (примерно на \nдве трети) она составлена на основе концертного материала – самой сильной и \nвместе\
    \ с тем непосредственной стороны Алексиса Корнера.\n<p>32 вещи плюс превосходное приложение-вкладка, наконец-то дающие\
    \ достаточно \nполный портрет &quot;дедушки английского блюза&quot;."
