  author: Дмитрий Казанцев
  mark: 8
  date: '2005-12-11'
  text: 'Второй альбом Рори для фирмы Chrysalis, куда он перешел с Полидора в 1975. Это его последний альбом с группой в составе:
    Лу Мартин - клавиши, Джерри МакЭвой - бас, Рон Де-Ат - ударные.


    Альбом спродюсирован Роджером Гловером из Deep Purple, но не ждите здесь хард-рока. Наоборот, песни стали разнообразнее,
    есть акустические номера, появилось много интересных звуков и аранжировок. Хотя в "Moonchild" почти хард-н-хэви, но до
    чего ж красивый. Блюз-рок доминирует, Рори играет слайдом и без, слышно, что он стал лучше петь, чем делал это в начале
    своей карьеры. А самое главное - тут появились яркие и красивые песни. И их много на этом дисе: "Do You Read Me", "Moonchild",
    "I''ll Admit You''re Gone", "Jackknife Beat".'
