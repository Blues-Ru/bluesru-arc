  date: '2005-12-11'
  text: '<img src=http://www.platterpus.com/images/59278.jpg>


    Этот сборник состоит из 8 песен с 6 ранних альбомов Рори: 1 с Rory Gallagher (1971), 1 с Deuce (1971), 1 с Live In Europe
    (1972), 2 с Blueprint (1973), 2 с Tattoo (1973) и еще 1 с Irish Tour (1974). Рори играет добротный блюз-рок, но есть два
    момента, которые делают его песни трудными для восприятия. 1-е - это его отрывистый вокал (голос похож на Питера Грина,
    а манера в духе Хендрикса), который не добавляет мелодий в и так маломелодичную музыку; 2-е - это общая тяжесть звучания,
    из-за нее некоторые действительно относят Рори к хард-рокерам. На гитаре же он прекрасен - играет слайдом и без. Он также
    дует в гармошку, и делает это отлично. С ним в группе басист, драммер и клавишник; они молодцы во всех отношениях. Можно
    сказать, что песням Рори не хватает яркости и разборчивости, ведь он не всегда играет музыку близкую к традиционному блюзу.


    Ценность этого сборника в том, что его ранние альбомы редки и стоят довольно дорого. Этот сборник не выходил на КД - это
    дополнительная ценность. А минус в том, что здесь есть две длинные концертные песни, они как-то странно "сидят" на этом
    диске.'
