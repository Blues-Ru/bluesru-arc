  date: '2017-06-16'
  text: 'Рори Галлахер - выдающийся ирландский гитарист, прославившийся на ниве тяжелого
    блюза и блюз-рока. Его мастерство владения Стратокастером и блестящая техника
    с лихвой компенсировали невысокие вокальные данные музыканта. Прославился выступлением
    своей группы Taste на фестивале Isle of Wight в 1970, и последующей успешной сольной
    карьерой в 70-е и 80-е. Рори знаменит концертными выступлениями с характерной
    мощной энергетикой, которую редко удавалось передать на его студийных записях
    (да и сам музыкант неуютно чувствовал себя в студии, где отсутствовал прямой контакт
    с аудиторией). Его альбомы разошлись по всему миру тиражом более 30 миллионов
    экземпляров, а британский журнал Classic Rock включил Рори Галлахера в список
    величайших гитаристов всех времен и народов.


    Edged in Blue - сборник, составленный самим Галлахером по итогам сольного творчества.
    На него Рори включил песни из следующих альбомов:


    Defender - треки 1, 7, 11


    Fresh Evidence - треки 2, 4


    Calling Card - 3


    Top Priority - 5


    Stage Struck - 6


    Live in Europe - 8


    Jinx - 9


    Irish Tour ''74 - 10.


    Рори также выступил в качестве продюсера альбома.


    Очень достойный сборник, который может послужить прекрасной отправной точкой для
    ознакомления с творчеством ирландского самородка.'
