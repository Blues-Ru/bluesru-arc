  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2012-02-03'
  text: 'Ирландский гитарист, певец и композитор Рори Галлахер был одним из лучших гитаристов прошлого века, влияние музыки
    которого на свое собственное творчество официально признавали такие гранды, как Гэри Мур, Брайан Мэй, Слэш и даже Джимми
    Пэйдж, а Эрик Клэптон названл Рори "человеком, который вернул его обратно к блюзу".


    Однако Рори заслужил признание не только среди коллег-музыкантов - публика также любила его: в ежегодном опросе журнала
    Мелоди Мэйкер в 1972 году Галлахер был назван "Музыкантом года", опередив при этом самого Клэптона. Возможно, такая любовь
    отчасти являлась результатом образа "своего парня" в вечной простой клетчатой рубахе и джинсовой куртке, а может, дело
    было в том, что Рори не очень-то стремился к успеху и славе - для него гораздо важнее было сочинять свою музыку и играть
    ее для других.


    За свою долгую карьеру он успел поиграть с такими грандами, как Мадди Уотерс, Алберт Кинг и Джерри Ли Льюис. После ухода
    Мика Тэйлора Роллинги обратились к Рори с предложением занять его место, а через год аналогичное предложение поступило
    уже от Deep Purple, откуда ушел Ричи. Но Галлахер остался верен себе и своей музыке.


    Двухдисковый сборник лучшего по итогам альбомов с 1971 по 1988 год.'
