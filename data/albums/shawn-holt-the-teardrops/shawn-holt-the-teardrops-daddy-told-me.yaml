  author: Олег Пчелкин (oleg_spb)
  mark: 8
  date: '2013-10-22'
  text: 'Дебют Шона Холта , сына покойного Мэджика Слима, с "Капающими Слезинками", альбом современный и динамичный, вышел
    на Blind Pig Records, фирме, где его отец записал десять альбомов за двадцать четыре года работы. Альбом без духовых и
    клавишных, но с очень качественной музыкой, который доказывает, что сын достойно продолжает дело отца. На двух треках
    поет старый участник Teardrops (13 лет с Мэджиком Слимом, 1982-1995) - Джон Праймер: 5., песня Мэджика Слима "Buddy Buddy
    Friend"; и 8., кавер "Before You Accuse Me" . Шон поет четыре известных кавера, пять своих песен и одну песню отца : "Please
    Don''t Dog Me". Можно сказать, что у Teardrops началась новая эра.


    Шон Холт (Shawn "Lil ''Slim" Holt) -сын легендарного мастера блюза Мэджика Слима ( Морриса Холта, скончавшегося 21 февраля
    2013) начал играть блюз в возрасте 17 лет, отправившись на гастроли с отцом и его "Капающими Слезинками" (Teardrops),
    где от своего дяди "Коли" - Ника Холта, получил прозвище "Маленький пижон""Lil ''Slim", в отличие от отца, видимо, пижона
    большого.


    Вскоре после первого тура Шон сформировал собственную группу, "Lil'' Slim and The Back Alley Blues Band". Далее играл
    в группе The Blues Messengers, затем взял перерыв до 2009 года, живя в Миннесоте продолжил с группой "True Sons of the
    Blues". Позже в штате Небраска, создал "Slim Lil ''Blues Band".


    Шон, заменивший в лидерах "Слезинок " отца, продолжает играть традиционный чикагский блюз без спецэффектов и педали, но
    часто с явным уклоном в буги.


    Он, как и отец , играет главным образом большим пальцем, редко используя остальные и достигая звучания, которого невозможно
    получить любым иным способом. Большой палец начинает летать по струнам так, что один из журналистов назвал его "Самый
    быстрый большой палец блюзового Запада. "


    "Капающие Слезинки" Мэджика Слима в последние десять лет номинировались Фондом Блюза на титул лучшей группы года восемь
    раз, чаще, чем другие. Шон Холт взял на себя лидерство в группе своего отца, когда тот был госпитализирован во время тура
    Джонни Уинтера по Восточному побережью , где Мэджик работал в первом отделении. Сын Слима стал членом Teardrops в начале
    2013 года. Хедлайнер Уинтер был столь впечатлен, что настоял, чтобы Шон Холт и Teardrops закончили с ним тот тур.


    (oleg_Spb)'
