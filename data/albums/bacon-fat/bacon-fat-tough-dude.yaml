  author: Сергей Исправников
  mark: null
  date: '2008-01-15'
  text: 'На диске представлен последний из двух альбомов американской блюз-роковой группы "Bacon Fat", изданный на британском
    лейбле Blue Horizon в 1971 г. Помимо участия в ее составе как белых, так и черных музыкантов, группа отличалась наличием
    фактически двух лидеров – Рода Пьяццы и Джорджа Смита – причем оба из них были исполнителями на губной гармонике. В отличие
    от дебютного альбома, записанного за один день и отражавшего, в основном, концертный репертуар группы, материал второй
    пластинки – "Tough Dude" – содержал преимущественно студийные композиции, написанные специально для этого проекта. По
    сравнению с достаточно прямолинейным звучанием своего предшественника данный диск демонстрирует элементы прогрессив-рока
    и включает ряд чисто инструментальных треков. Кроме того, изменился и сам принцип подачи материала. Если ранее в большинстве
    альбомных вещей солировал Род Пьяцца, то теперь треки были распределены между всеми ведущими музыкантами группы. Из 12
    вошедших в альбом треков на трех сольные партии исполнил Джордж Смит, на четырех – Род Пьяцца, на двух – пианист Дж.Д.Николсон,
    на оставшихся – гитаристы "Buddy" Рид и Грэг Шефер.


    Работа над альбомом началась летом 1970 г., когда 10 августа в голливудской Eldorado Recordings Studio были записаны три
    трека. Остальной материал был сделан в Лондоне во время визитов в студию CBS на Нью-Бонд Стрит 11, 18 и 19 ноября 1970
    г. в течение английского тура группы. На обложку альбома была помещена художественная фотография британского роуди группы
    – Джеймса Эткинсона, сопровождавшего группу от Гулля до Плимута и от Лестера до Бексли. Изданный в 1971 г., альбом был
    поддержан как критикой, так и покупателями, однако по ряду причин, далеких от творчества, продолжения не последовало.
    Фактически, "Bacon Fat", как проект, был детищем продюсера Майка Вернона, который был в большей степени энтузиаст блюза,
    чем бизнесмен. Соответственно, когда его лейбл Blue Horizon утратил фактическую самостоятельность, то это привело не только
    к краху самой компании, но и ударило по издававшимся на ней исполнителям. В результате кто-то на несколько лет остался
    без контракта с фирмой грамзаписи, а что касается "Bacon Fat", то данная группа просто распалась.'
