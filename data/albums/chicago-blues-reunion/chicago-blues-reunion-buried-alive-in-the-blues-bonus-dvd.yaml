- id: 783
  author: Андрей Евдокимов
  mark: 7
  date: '2005-08-05'
  text: Корки Сигел вот уже лет десять играет на губной гармонике только в филармонических залах в сопровождении скрипичного
    ансамбля. Ник Гревенайтс напротив продолжает лабать блюз по клубам. И хотя люди они не молодые, но барабанщик Сэм Лэй,
    участник блюз-бэнда Хаулина Вулфа, помнит их первые выходы на сцену. Барри Голдберг играл на клавишных в группе с программным
    названием Blues Band, Харви Манделл был гитаристом в первых альбомах Чарли Масселвайта. И еще барышня-бард Трейси Гельсон.
    Собравшись вместе в прошлом году для серии клубных гастролей, они уверяли, что блюзовые опыт и ярость хорошо идут в одной
    упряжке, а сорок лет, минувший после дебюта, пошли только на пользу. Нынешний альбом запечатлел аксакалов 60-х в студии.
    Не забыты знаменитые песни Гревенайтса, но Сэм Лей поет более древние, вроде Hound Dog. Если кто-то и сомневался, что
    не стареют душой ветераны чикагского блюза, то он имеет возможность подержать в руках документальное подтверждение.
