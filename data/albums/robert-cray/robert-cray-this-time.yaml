- id: 1598
  author: Андрей Евдокимов
  mark: 5
  date: '2010-01-18'
  text: 'Когда-то его считали сенсацией, надеждой, новатором… Но- не случилось. Роберт
    Крей демонстрирует редкую стабильность. Хорошая музыка для офисов, между прочим,
    успокаивает нервы офисного планктона.


    Chicken In The Kitchen – песня, открывающая новый альбом Роберта Крея. Ничего
    у Крея не меняется – он все так же ублаготворен происходящим, потому спокоен и
    частенько слащав. Поет он вкрадчиво и сладко, а вот на гитаре играет изысканно
    и интересно – прямо подарок гитарным гурманам. Электроорган Джима Пуха – непременный
    атрибут звучания ансамбля Роберта Крея. Другие участники менялись неоднократно.
    В нынешнем альбоме играет на ударных ветеран, участвовавший во многих славных
    проектах – Тони Браунагел. Эта мечта гитариста, а не ударник – ритм держит и не
    во что не вмешивается. На бас-гитаре, вернувшийся после 15-летнего отсутствия
    Ричард Казенз, участник первого состава блюз-бэнда Роберта Крея. В альбоме преобладают
    самоуспокоительные баллады а-ля Клэптон. Песня Trouble And Pain – это самое грубое
    звучание, на которое Крей только способен.'
- id: 2054
  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2012-08-07'
  text: 'Роберт не выпускал нового сольного материала целых 5 лет, и вот, наконец,
    новый альбом.


    Однако за это время ничего существенного в музыкальном плане не произошло - альбом
    сделан в традиционной для Крэя манере и мгновенно узнаваем. Обладатель 5 премий
    Грэмми продолжает обрабатывать ниву мелодичного коммерческого блюза в сочетании
    с соул и поп-музыкой. Если угодно, для такой музыки даже можно применить термин
    соул-блюз


    Поклонникам Роберта альбом, бесспорно, понравится, а остальным может показаться
    слегка пресным (ну так у Крэя вся музыка такая - чрезвычайно качественная и профессионально
    исполненная, но суховатая).'
