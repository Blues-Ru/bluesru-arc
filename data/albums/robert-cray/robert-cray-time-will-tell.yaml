reviews:
- id: 774
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-02'
  text: 'Роберт снова сменил лэйбл. На этот раз Ryko на Sanctuary. И это пошло ему
    на пользу (или просто совпадение?) На диске прекрасные яркие песни и великолепные
    звуки. Интересные звуки гитары Крэя, его точный вокал, клавиши, перкуссия, замечательные
    аранжировки - все это классно и радует слух. Чистого блюза тут нет, конечно, в
    программе - соул и соул-блюз, а иногда - очень поп-ориентированный ритм-н-блюз
    ("Up in the Sky", например).


    Как всегда, Роберт немного пресный и монотонный - это уже не изменить. Но это
    единственный минус этого диска.'
- id: 2055
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2012-08-07'
  text: 'На данном сольном альбоме Роберт решил чуть-чуть отойти от уже привычной
    выигрышной формулы, по которой он записывал свои предыдущие работы (многие из
    которых, если честно, трудно отличить одну от другой). Естественно, далеко в сторону
    Роберт уходить не стал - тут у нас тот же проверенный в коммерческом плане мелодичный
    поп-ориентированный соул-блюз, слегка пресный и монотонный (в общем, в стиле Роберта
    Крэя :-)).


    Однако есть и приятные исключения: слегка утяжеленный первый антивоенный трек,
    соло на ситаре во второй композиции, мощный фанк и интересное соло третьего трека,
    а также привлечение струнного квартета в паре песен. Также хороша завершающая
    альбом Time Makes Two.


    В целом - достойная пластинка, имеющая свое лицо. Третье место в топе блюзовых
    альбомов Биллборда.'
