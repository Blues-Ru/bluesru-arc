  author: Константин Колесниченко
  mark: 9
  date: '2007-11-06'
  text: 'Отличный альбом Роберта Крея. Кроме того, что Роберт обладает потрясающим
    голосом, виртуозно играет на гитаре, так и музыка, что он делает - это КРАСИВЕЙШИЙ
    сплав блюза, рока, соул и фанка. Настрой и мелодика песен Крея - это чуть мрачноватая
    и грустная музыка. Филигранное качество.


    В качестве гостей на альбоме засветился Albert Collins.'
