reviews:
- id: 618
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-05-06'
  text: 'Второй альбом Роберта вышел через три года после дебюта Who''s Been Talkin'',
    на нем Роберт продолжает свое соул-блюзовое движение. К этому моменту у него сформировалась
    своя группа: Richard Cousins - bass, Mike Vannice - keys/tenor sax, Warren Rand
    - alto sax, David Olson - drums.


    На диске 10 композиций, 8 из них написаны Робертом и группой. Альбом начинается
    с прекрасной "Phone Booth", "Bad Influence" продолжает создавать классную атмосферу
    диска, "So Many Women, So Little Time" - отличный прифанкованный соул, очень симпатичный
    минорный трек "Where Do I Go From Here", "Waiting For The Tide To Turn" - соул-блюз
    в духе Алберта Кинга, "March On" показывает, что Роберт умеет писать отличные
    соул-номера.


    Крэй нашел свой звук и аранжировки, этот диск сильнее его дебюта, о нем начали
    говорить.'
