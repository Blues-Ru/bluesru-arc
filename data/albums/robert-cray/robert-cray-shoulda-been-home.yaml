  date: '2012-08-07'
  text: 'Один из лучших альбомов Крэя, добравшийся до 2 места в чартах блюзовых альбомов
    Биллборда.


    Несмотря на наличие на альбоме пары каверов песен Элмора Джеймса, в музыкальном
    отношении, как обычно у Роберта, это скорее все-таки расслабленный неспешный соул
    с элементами блюза, нежели наоборот. Сыграно отлично, но в традиционной для Крэя
    пресноватой и коммерческой манере.'
