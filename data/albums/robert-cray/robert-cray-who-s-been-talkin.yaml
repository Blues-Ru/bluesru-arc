- id: 617
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-05-06'
  text: 'Дебютный альбом Роберта. Самый блюзовый из всех его творений, хотя влияние
    соула тут огромно, конечно. Крэй очень убедительно поет и интересно солирует на
    гитаре. Некоторые вещи записаны малым составом (квартет), а кое-где появляются
    и духовые. Музыканты играют прекрасно.


    Альбом состоит из 10 блюзов и длится около 36 минут. Диск начинается с прекрасного
    блюза Уилли Диксона "Too Many Cooks", очень хороша вещь самого Крэя "That''s What
    I''ll Do", "Who''s Been Talkin''" Хаулина Вулфа - это всегда приятно, очень интересная
    ритмика в песне Роберта "Nice As A Fool Can Be".


    Этот альбом выходил на разных лейблах (даже на Atlantic) с разными обложками и
    названиями (иногда как Who''s Been Talkin'').'
