  author: Сергей Исправников
  mark: 9
  date: '2009-10-12'
  text: 'Данное четырехдисковое издание включает в себя все записи, сделанные Чаком Берри на фирме "Chess" в 50-е годы. Это
    был период как расцвета рок-н-ролла в США в целом, так и творчества Берри – в частности. Берри был одним из создателей
    и символов этой музыки, представляя наряду с Бо Дидли, направление чикагского гитарного рока. В то время Берри был чрезвычайно
    популярен среди молодежи, в первую очередь, тинейджеров, одновременно подвергаясь обвинениям в пропаганде безнравственности
    со стороны старшего поколения. И если творчество таких классиков блюза, как Мадди Уотерс, Джон Ли Хукер и Хаулин Вулф,
    в то время было ориентировано в основном на негритянскую аудиторию, то Берри полюбила не только черная, но и белая молодежь,
    что сказалось как на характере его творчества, так и на перипетиях его непростой судьбы. Родившись в 1926 г. в Сент-Луисе,
    штат Миссури, к середине 50-х гг. Берри был блюзовым певцом и гитаристом местного значения, по совместительству работая
    еще и парикмахером. Отправившись в Чикаго, он подошел на концерте к Мадди Уотерсу, спросив, где здесь можно сделать запись.
    Мадди посоветовал обратиться к братьям Чесс. Леонард Чесс, оказался впечатлен молодым дарованием и согласился записать
    Берри, если тот придет с оригинальным материалом. Через неделю Чак снова появился в студии, и 21 мая 1955 г. состоялась
    его первая студийная сессия. На записи Берри аккомпанировали его сент-луисские коллеги, с которыми он играл в формате
    трио, – пианист Джонни Джонсон и ударник Эбби Харди. Басистом выступил незаменимый для фирмы Chess Уилли Диксон. Было
    записано всего два трека – знаменитая "Maybellene" и медленный блюз "Wee Wee Hours". Выпущенный в июле сингл произвел
    сенсацию - "Maybellene" взлетела на первое место ритм-энд-блюзовых чартов "Billboard", продержавшись там 11 недель, и
    также достигла 5-го места поп-чартов. История этой песни была анекдотична: первоначально это была песня в стиле хиллбилли
    под названием "Ida May". В процессе записи ее сыграли быстрее, а название превратилось в "Maybellene" (такого женского
    имени нет, это название косметики, которое просто оказалось созвучным). После феноменального успеха сингла карьера Чака
    Берри резко пошла в гору, начались бесконечные гастроли по городам и весям Америки, в перерывах между которыми в сентябре
    прошла еще одна студийная сессия. На ней был записан следующий сингл – энергичный рок-н-ролл "Thirty Days", достигшей
    2-го места в R&B чартах, с лирической балладой "Together" на обороте. В декабре 1955 г. в студии к Чаку Берри присоединился
    Отис Спэнн, восходящая звезда чикагского блюза и штатный пианист бэнда Мадди Уотерса. Из шести записанных тогда вещей
    в то время на сингле были изданы две: жесткий блюз в стиле Хаулин Вулфа "No Money Down" (8-е место в чартах) и имитирующая
    движение поезда "Down Bound Train".


    В 1956 г. в студии звукозаписи Эбби Харди заменил Fred Below, штатный ударник фирмы Chess, переигравший со всеми звездами
    чикагского блюза. В апреле прошла очень результативная сессия: на синглах были изданы все четыре записанных тогда трека,
    три из которых снова оказались в чартах популярности. Среди них – ставшие классикой всех времен и народов рок-н-роллы
    "Roll Over Beethoven" (2-е место в чартах) и "Too Much Monkey Business" (4-е место в чартах). На оборотные стороны синглов
    Берри предпочитал записывать блюзы и баллады, ту музыку, с которой он начинал, но среди подростков – основных покупателей
    его пластинок они были непопулярны. В мае-июне прошли выступления Берри в Нью-Йорке в рамках "Camel Rock''n''Roll Dance
    Party", организованного легендарным ведущим Аланом Фридом, изобретшим само название "рок-н-ролл". Для выпуска на пластинке
    были записаны две исполненные живьем вещи Берри, однако не смотря на реставрацию, их звучание оставляет желать лучшего.
    Это скорее свидетельство эпохи рок-н-ролльной лихорадки, когда исполнявшаяся на сцене музыка заглушалась истеричными воплями
    из зала. В октябре вместе с Уилли Диксоном и другой знаменитостью чикагского блюза – гитаристом Джимми Роджерсом была
    записана лирическая "Havana Moon". Изданный с нею сингл не имел особой популярности, а первоначальная идея была расширить
    аудиторию путем выпуска композиции, рассчитанной на испаноамериканцев. Этой же цели послужила и записанная в январе следующего
    года "La Jaunda", герой которой безуспешно пытается пообщаться с испаноговорящей девушкой, к сожалению, не владея этим
    языком.


    Но сессия января 1957 г. знаменита не этими упражнениями в испанском, а ставшим новым хитом №1 рок-н-роллом "School Day",
    продержавшимся на 1-ом месте R&B чартов пять недель и на 3-ем месте поп-чартов три недели. Песня отражала нужды и чаяния
    американских школьников, которые и раскупили ее в таком количестве. Тогда же были записаны три "чувственных" блюзовых
    инструментала – "Deep Feeling", "Low Feeling" и "Blue Feeling". Видя интерес к Чаку Берри среди белых подростков "Chess"
    в начале года выпустили его первую долгоиграющую пластинку "After Scholl Sessions", включающую как полюбившиеся слушателям
    хиты, так и ранее не издававшиеся композиции, записанные с мая 1955 г. по январь 1957 г. На сессии мая 1957 г. Джонни
    Джонсона заменил чикагский сессионный блюзовый пианист Lafayette Leake, как сайдмен игравший с массой знаменитостей. Среди
    пяти записанных тогда композиций в таблицы популярности попала заводная "Oh Baby Doll" (12-е место в R&B чартах) и ставшая
    классикой жанра "Rock And Roll Music" (6-е место в R&B чартах; 8-е – в поп-чартах). На прошедшей в декабре 1957 г. сессии
    было записано семь композиций, причем здесь за фортепьяно опять вернулся Джонни Джонсон, впоследствии чередуясь с Lafayette
    Leake. Среди записанных тогда вещей необходимо выделить очередной молодежный рок-н-ролл "Sweet Little Sixteen", изданный
    на сингле с "Reelin'' And Rockin''" на обороте в начале следующего года и занявший 1-е место в R&B чартах на три недели
    и 2-е место в поп-чартах на тот же период. В данном издании песня приведена в пяти вариантах, включая один ранее нигде
    не публиковавшийся. Гитарную технику Берри демонстрируют четыре записанных тогда же инструментала, среди которых выделяются
    построенный на взаимодействии гитары и фортепьяно "Rock At The Philharmonic" и стремительный "Guitar Boogie", "убойный"
    для 1957 г. номер, впоследствии популярный у английских рокеров. Не был забыт жанр баллады, представленный нежной "Time
    Was", оставшейся неопубликованной вплоть до 1988 г. Впрочем, оно и понятно, от Чака Берри ждали рок-н-ролла, а на его
    предложения записывать блюз, пусть даже под псевдонимом, Леонард Чесс ответил отказом.


    Январь 1958 г. начался с записи еще одного бессмертного хита "Johnny B. Goode", изданного на сингле в паре с записанным
    месяцем позже другим рок-н-роллом "Around And Around" и вновь взлетевшим на вершину хит-парадов (2-е место в R&B чартах;
    8-е место в поп-чартах). Как впоследствии признавался Чак, изначально "Johnny B. Goode" была адресована пианисту Джонни
    Джонсону, хотя в ней имелся ввиду и сам Берри. В угоду целевой аудитории, состоявшей из белых тинэйджеров, имевшиеся в
    первоначальном варианте слова "colored boy" были заменены на "country boy". В феврале 1958 г. также были записаны два
    инструментала и написанная в стиле хиллбилли "It Don''t Take But A Few Minutes". В это же время выходит вторая долгоиграющая
    пластинка Берри "One Dozen Berrys", составленная, как и предыдущая, из хит-синглов и нереализованного студийного материала
    периода с января 1957 г. по февраль 1958 г. На следующей сессии звукозаписи, состоявшейся в апреле 1958 г., место за ударной
    установкой временно занял другой чикагский блюзовый барабанщик – Odie Payne, начинавший играть с такими "звездами", как
    Тампа Ред и Элмор Джеймс. Из записанных тогда трех композиций две – баллада "Vacation Time" и очередной рок-н-ролл "Beautiful
    Delilah" – летом были изданы на сингле, но оказались достаточно спокойно встречены публикой. Однако хиты у Чака Берри
    еще пока не закончились – через месяц он снова оказался в студии, когда среди пяти довольно разнородных композиций был
    записан ставший классикой рок-н-ролл "Carol", сингл с которым в августе месяце достиг 9-го места в R&B чартах и 18-го
    в поп-чартах. На обороте с ним была записана довольно забавная песня в стиле латино "Hey Pedro". Не останавливаясь на
    достигнутом в июле в своем офисе в Сент-Луисе Берри в одиночку записывает впоследствии ставшие популярными танцевальные
    "Jo Jo Gunne" и "Memphis Tennessee". В сентябре он опять в чикагской студии "Chess" нарезает очередной хит – "Sweet Little
    Rock''N''Roller" (13-е место в R&B чартах), вошедший в золотой фонд рок-н-ролла. Тогда же были записаны две импровизационные
    инструментальные композиции, обозначенные как "Long Fast Jam" и "Long Slow Jam" по одиннадцать минут каждая. Обе построены
    на взаимодействии гитары Берри с фортепьяно Джонсона, первая из них – динамичный буги, а вторая – медленный блюз. В них
    наиболее полно проявляются таланты Джонсона, как пианиста, остается только удивляться как Чессы, при их коммерческом чутье,
    никогда не издавали Джонсона сольно, а не только как аккомпаниатора. Данные композиции издаются здесь впервые, являясь
    основным открытием данного издания. Записанные на следующей сессии в ноябре забавный рок-н-ролл "Run Rudolph Run" и сентиментальный
    блюз "Merry Christmas Baby", выпущенные на сингле как раз под Рождество, оказались во второй половине Top-100 поп-чартов
    "Billboard". Тогда же были записаны рок-н-ролл "Little Quienne" и очередная композиция в стиле латино "That''s My Desire".


    В 1959 г. прошли две сессии звукозаписи, обе с участием вокальных групп, привнесших в музыку Берри элементы ду-уоп – популярной
    в то время эстрадной разновидности ритм-энд-блюза. На первой из них, прошедшей в феврале 1959 г., к Берри присоединился
    записывавшийся в то время на "Chess" вокальный состав "Harvey & Moonglows", возглавляемый уроженцем Луисвилля, штат Кентукки,
    вокалистом Harvey Fuqua и активно поддерживаемый Аланом Фридом, включившим его в свое знаменитое радио-шоу. Среди прочих
    певцов в состав этой группы входил и молодой Marvin Gaye, восходящая звезда соул. Из четырех записанных на этой сессии
    композиций в то время на синглах были изданы только две – отражающий подростковые проблемы рок-н-ролл "Almost Grown" (3-е
    место в R&B чартах и 32-е место в поп-чартах) и "Back To The U.S.A." (16-е место в R&B чартах и 37-е место в поп-чартах).
    Оставшийся балладно-блюзовый материал был отложен до лучших времен, как не соответствовавший конъюнктуре рынка. Собственно
    говоря, фирма "Chess" всегда занималась именно бизнесом, а не высоким искусством. Это подтверждает и вышедшая в 1959 г.
    третья долгоиграющая пластинка Берри "Chuck Berry Is On The Top", включающая как издававшиеся ранее хиты, так и не реализованный
    материал с мая 1955 г. по февраль 1959 г., представляющая собой нечто среднее между сборником "лучших песен" и номерным
    альбомом. На следующей сессии звукозаписи в июле 1959 г. с Берри записалась вокальная группа "Ecuadors", причем до 2002
    г. ее состав был не известен. В нее входили Roquel Davis, уже упоминавшийся Harvey Fuqua со своей тогдашней подругой Etta
    James. Из десяти записанных тогда композиций коммерческого успеха добились только две: изданные на сингле в январе следующего
    года танцевальный номер "Too Pooped To Pop" (18-е место в R&B чартах и 42-е место в поп-чартах) и сыгранный в стиле Мадди
    Уотерса жесткий ритм-энд-блюз "Let It Rock" (64-е место в поп-чартах). Кроме стандартных для Берри рок-н-роллов тогда
    были записаны джазовый инструментал Каунта Бэйси "One O''Clock Jump", блюз Уилли Диксона "I Just Want To Make Love To
    You" и "туземная" композиция самого Берри "Broken Arrow". Также Берри сыграл на гитаре в двух эстрадных композициях "Ecuadors",
    изданных на сингле лейблом "Argo" – дочерней компанией фирмы "Chess".


    В целом, 50-е годы были наиболее удачными для Берри, как в плане коммерческого успеха, так и творчества. Он выпустил дюжину
    хитов, обеспечивших ему бессмертие в истории рок-музыки, имел толпы поклонников и что более приятно – поклонниц, открыл
    в родном Сент-Луисе ночной клуб, купил кирпичный особняк, куда перевез семью. Дорогие костюмы и "Кадиллаки" стали частью
    его повседневной жизни.'
