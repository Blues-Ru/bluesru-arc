  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2022-12-19'
  text: 'Supersonic Blues Machine - фактически супер-группа, это калифорнийское блюз-роковое трио, в настоящее время состоящее
    из барабанщика Кенни Ароноффа, продюсера/басиста Фабрицио Гросси и поющего гитариста Криса Барраса. Группа была создана
    в 2015 году и успела записать два студийных альбома West of Flushing, South of Frisco (2016) и Californisoul (2017), каждый
    из которых попал в пятнашку лучших блюзовых альбомов Биллборда. В январе 2018 года на смену оригинальному гитаристу Лансу
    Лопесу пришел англичанин Крис Баррас, и в июле 2019 года по итогам европейских гастролей трио выпустило концертник Road
    Chronicles - LIVE!


    "Modern Blues does not get any better than this" - Blues Magazine


    "Formidable...a modern day super-session which manages to hang on to the heart and soul" - Classic Rock Magazine


    "Rootsy compositions, stellar playing, and some of the in the finest guitarists in blues" - Vintage Guitar Magazine


    Voodoo Nation - третий студийник трио, выпущенный летом 2022 года на лейбле Provogue. В лучших традициях группы музыканты
    Supersonic Blues Machine приглашают для участия в записи (а также во время гастролей) множество друзей - музыкантов, которые
    своим участием украшают мощную музыку трио. На данном альбома фактически четвертым членом группы является клавишник Алекс
    Аллесандрони, а плеяда звездных гостей включает великого Сонни Ландрета, Ану Попович, Эрика Гейлса, Джо Луис Уокера, Чарли
    Старра (Blackberry Smoke) и др. Весь материал авторский. Записывал альбом, микшировал и продюсировал Фабрицио Гросси.


    В музыкальном плане на диске традиционным блюзом, конечно, и не пахнет - тут представлен энергичный мелодичный блюз-рок
    и хард рок с примесью соул, сыгранный высокопрофессионально и мощно. Каждый из гостей вносит свой яркий вклад в соответствующий
    трек, но и сами музыканты трио по уровню практически не уступают именитым гостям. На мой взгляд, Фабрицио при записи и
    микшировании переборщил с хорами бэк-вокалистов (их слишком много и они слишком громкие), а в остальном поводов для нареканий
    нет, добротная работа.'
