- id: 113
  author: Алексей Калачев
  mark: 4
  date: '2003-03-18'
  text: 'Сложно охарактеризовать стилистику этого альбома в коротких словах. Как правило, проще всего сказать "его легко сравнить…"
    или "он сделан в стилистике…" и т.д. Тут я долго прокручивал в голове, где бы найти аналоги, да и махнул рукой. Странная
    музыка... Наверно, это скорее экспериментальный гитарный соул. "Худышка С Южной Стороны" сделал вроде бы и гитарный альбом,
    но альбом, аналог которому в современной блюзовой гитаристике и подобрать-то сложно. Вот, может быть, Жан-Поль Бурели
    подходит для параллели. Да и то – для отдаленной параллели. Единственное, что я могу сказать наверняка: не верьте образу,
    вытекающему из названия альбома и обложки. Может возникнуть подозрение, что альбом связан с блюз-роком или с черным роком.
    Ничего похожего.'
