- id: 1558
  author: Константин Колесниченко
  mark: 8
  date: '2009-07-08'
  text: 'Snooky Pryor был одним из первых, кто электрифицировал звук гармоники, также, по одной из легенд, знаменитый риф
    из "Juke" Литтл Уолтер позаимствовал именно у него. Но так или иначе звездой блюза первой велечины Снуки не стал, хотя
    уважение коллег и ценителей музыки он заслуженно имеет. Большую часть своих записей Снуки сделал уже на старости лет.
    Возвращение Snooky Pryor в звукозапись произошло в 1987 году, в возрасте 66 лет. После своего comeback альбома он заключил
    контракт с техасcким лейблом Antone''s – этот альбом один из серии записей сделанных Clifford''ом Antone.


    Классический чикагский блюз, во всей свое красе, со всеми своими шероховатостями, со всем своим характерным звучанием
    – вот, что такое "Mind Your Own Business". У Снуки интересный и довольно ни на кого не похожий стиль игры на гармонике
    – у него манера игры, характерная для музыкантов, играющих акустически, но тем не менее фразировка и усиленный звук как
    у классиков чикагской блюзовой гармоники. Ни с кем не спутаешь. Весь материал на альбоме авторский и записан при помощи
    двух сыновей Richard Pryor – гитара и Earl Pryor – бас. Так же в записи приняли участие несколько довольно известных сессионных
    музыкантов: Derek O''Brien - гитара, Gene Taylor - фортепиано, Ted Harwey - барабаны.


    В итоге у старого мастера получился хороший, добротный альбом, идеально подходящий для знакомства с творчеством этого
    музыканта.'
