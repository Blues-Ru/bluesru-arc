- id: 1551
  author: Константин Колесниченко
  mark: 10
  date: '2009-06-22'
  text: 'Признаюсь, я неравнодушен к старым свингующим техасским гитаристам, и пусть они все, как один, похожи на Т-Боун Уолкера.
    Их подачу не спутаешь ни с чем – характерный подбор нот, их попадание именно в тот момент времени, когда они и должны
    звучать, и самое главное – все просто дышит свингом. Зузу Болин из блюзовых стариков и, к сожалению, он не успел сделать
    достаточно записей – что-то было в 50-х, он гостит на альбоме у Hash Brown и вот этот альбом 89 года и все, в 90 году
    он умер.


    Альбом "Texas Bluesman" - это, можно сказать, шедевр блюза. Возможно, при поверхностном прослушивании, CD может показаться
    немного однообразным, но поверьте, у этой записи многому можно и нужно поучиться, недаром мастер свинга Дюк Робиллард
    играет вторую гитару на этом альбоме. Богатая духовая секция, свинг, красивый глубокий вокал, чистый звук гитары – что
    еще нужно для счастья любителю блюза?!'
