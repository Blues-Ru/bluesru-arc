- id: 1474
  author: Андрей Евдокимов
  mark: 6
  date: '2009-02-05'
  text: После участия в различных блюзовых и джазовых проектах, мастер игры на гитаре "pedal steel" преподносит фанк-рок.
    И даже приправленный рэпом, этот фанк выдерживает стилистику 70-х, славных времен расцвета стиля. Но исполнен он столь
    азартно, что звучит свежо и в новом тысячелетии. В одной из старых песен на второй гитаре играет Клэптон. Спасибо, это
    поможешь поднять тираж. Хотя публике пора бы уже знать RRFB – их предыдущий альбом был номинирован на Грэмми. Игре на
    редком инструменте лидер обучался "на глазок", аккомпанируя церковному хору. Солнечный спиричуэлс Jesus Is Just Alright
    и прочувствованный госпел Stronger (который поет приглашенная Лила Джеймс) напоминают об этом. Альбом явно нацелен на
    "песенность" для преодоление репутации Рэндольфа как солиста-виртуоза. Однако на любом материале и в любом стиле он прежде
    всего поражает своем виртуозной игрой.
