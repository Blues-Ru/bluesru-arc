reviews:
- id: 511
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-04-02'
  text: Это самые первые записи легендарного Фреда. Алан Ломакс сделал их в сентябре 1959 года на своем переносном полупрофессиональном
    магнитофоне. Фреду помогают друзья на подпевках, гитаре и казу. Его жена Анни Мэй тоже поет в паре треков. Запись очень
    хорошего качества для тех лет и такого оборудования! МакДауэлл очень классно поет и играет - это что-то невероятное. До
    выхода этого диска в 1997 году лишь 4 трека издавались, так что тут мы имеем 10 песен, которые изданы впервые (фирма Rounder).
