  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: Блюз держится традиций. Может быть, поэтому он развивается не так быстро,
    как другие музыкальные жанры. Но, может быть, поэтому, в отличие от других музыкальных
    жанров, он более 100 лет остается самим собой?! И на месте не застаивается...
    В 1969г. пуристы были очень недовольны, что патриарх МакДауэлл записал альбом
    под электрогитару. И от массовой аудитории он отгородился, назвав альбом "Никакого
    рок-н-ролла я не играю". Но альбом стал вехой в истории жанра. Эти песни открывают
    мастера акустического слайда с неожиданной стороны. Он в прекрасном настроении,
    рассказывает добродушные байки. Переиздание в великолепной серии Capitol Blues
    Masters дополняет программу еще 10 песнями, гарантирует объемную сопроводительную
    статью и прекрасную подборку фотографий. Плюс аккуратно ремастированный звук.
    Смещение блюзовой классики с блюзовым новаторством – на двух компакт-дисках.
