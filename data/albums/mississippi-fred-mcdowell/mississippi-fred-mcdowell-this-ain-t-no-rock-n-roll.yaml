- id: 642
  author: Александр Панин
  mark: 8
  date: '2005-05-20'
  text: 'В конце шестидесятых Фред Макдауэлл перешел с акустики в электрический формат, и записал несколько удачных дисков,
    в том числе феноменальный концертник Live At The Mayfair Hotel.


    На этом же диске, выпущенном лейблом Arhoolie, 18 электрических треков с сессий 1968 и 1969 годов. Записи 1969 года студийные,
    с ритм-секцией и второй гитарой, а более ранние "домашние" и практически без аккомпанимента. Как всегда, слайд Макдауэлла
    звучит впечатляюще, но исполняемый материал временами не очень интересен, особенно это касается второй части диска (вот
    на первой части есть отменные вещи!). Четыре балла. В целом необязательное издание. Но не перепутайте с ним диск I Do
    Not Play No Rock''n''Roll, записанный примерно в то же время, вот там все просто великолепно!'
