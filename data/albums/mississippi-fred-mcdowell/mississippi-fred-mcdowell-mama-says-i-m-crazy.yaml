  author: Андрей Евдокимов
  mark: 10
  date: '2017-11-01'
  text: "Один из самых потрясающих альбомом эпохи фолк-блюз-ревайвал. Миссиссиппи Фред Макдаул уже выступал на больших фестивалях\
    \ в США и Европе, но продолжал большую часть времени работать на гахозапровочной и авторемонтной станции. Джонни Вудз\
    \ подрабатывал на полевых сельхозработах, играл, пил не в меру и играл на губной гармонике на пикниках и домашних вечеринках.\
    \ Они встретились после долгой разлуки и сыграли вместе на едином дыхании, яростно, энергично, не подыгрывая, или аккомпанируя\
    \ друг другу, но как дуэт равноправных солистов.\n\nМинздрав предупреждает: табак и алкоголь могут серьезно навредить\
    \ вашему здоровью. А их отсутствие - вашему настроению. Ну-с, в эпоху, когда подобные предупреждения вызвали бы простую\
    \ реакцию: \"не говори под руку\" Джордж Митчел, энтузиаст глубинного фолк-блюза, искатель и продюсер \"полевых\" музыкальных\
    \ записей написал для конверта издания на LP 1970 года:\n\n\"Талантливейший из музыкантов своего времени, на протяжении\
    \ нескольких десятилетий Фред МакДауэл выступал перед большими толпами в США и Европе. Но большую часть жизни проводил,\
    \ работая на станции техобслуживания в городе Комо, штат Миссиссиппи. Там я и нашел его в 1967 году. Фред как нельзя более\
    \ обрадовался возможности записать альбом, но настоял, чтобы бы мы привлекли аккомпанировать ему на гармонике Джонни Вудза,\
    \ его старого друга и местную знаменитость. \tНо только в округе никто не видел Джонни уже лет восемь. Однако Фред узнал,\
    \ что тот уже снова в городе. Часа три езды по проселочной дороге, и мы остановились в городе Синатобиа у полуразрушенной\
    \ хибары. Здесь мы и нашли Джонни Вудса, который оказался сердечным и любезным человеком лет сорока. Только в тот момент\
    \ он валялся на крыльце в отключке. \t В двух комнатках в доме набилось полтора десятка человек. Был полдень воскресенья,\
    \ И они неистово праздновали свой выходной, бухая и закусывая. \"Эй, Шейк Эм, как сам?\" - приветствовали Фреда, которого\
    \ тут лучше всего знали по его песне \"Шейк Эм он Даун\". Фред устроился на стуле с гитарой и достал боттл-нек, и мужики\
    \ сгрудились вокруг. После второй песни притащился Вудз, в полуотключке, с затуманенным взглядом. Он стал шарить по карманам\
    \ в поисках гармоники. И когда Фред завел \"Шейк Эм он даун\", губная гармошка Джонни присоединилась к гудению гитары\
    \ с такой мощью, что мурашки побежали по спине и, казалось, стены сейчас рухнут. \t Мы договорились, что завтра вечером\
    \ Вудз придет к Фреду домой.... \t И Джонни, конечно, не пришел. Несколько дней мы пытались выследить его. И наконец нашли\
    \ его на шашлыках, где он за машинами с дружком потягивал из бутылки самогон. Вудз, так и быть, согласился проехать до\
    \ ближайшего дома, где можно записаться. \t Невозможно было поверить, что эти двое не играли вместе уже восемь лет. Репетиции\
    \ были не нужны, и мы записали все без дублей. Они сидели лицом к лицу, вполголоса Фред что-то подсказывал Джонни. Вены\
    \ вздулись на лице Фреда, пока он пел. Слюни брызгали из гармоники Джонни... Ему не нужно было придерживать ее руками,\
    \ она, казалось, была продолжением его губ. Это честно, и это нужно - показать вместе двух величайших из живых блюзменов\
    \ - и вам, и всему миру. Пусь услышат.\" - Джордж Митчел, 1967 г.\n\nИ эта история не к тому, что непременно надо бухать,\
    \ не жалея себя, чтобы играть глубокий блюз. Она совсем про другое. В той социальной прослойке, где зародился и расцвел\
    \ блюз, условия жизни были чуть лучше рабства: всеобщая бедность и материальная, и духовная; дешевые развлечения после\
    \ тяжелой работы за гроши... И играли блюзмены в обстановке, где ничто не располагало к творчеству, уж тем более к созданию\
    \ шедевров. И тем не менее, вопреки всему, они не просто веселили собратьев и земляков, но создали шедевры, которые достучались\
    \ до слушателей по всему миру, и впечатляют и полвека спустя, после того, как были записаны на портативный ленточный магнитофон.\n\
    \nПервое переиздание на CD Fat Possum, 2002 год.\n\n<a href=\"http://blues.ru/ATB/atb_17_11_06_JohnnyWoods_II.mp3\">Программа\
    \ Весь Этот Блюз к столетию со дня рождения Джонни Вудза</a>."
