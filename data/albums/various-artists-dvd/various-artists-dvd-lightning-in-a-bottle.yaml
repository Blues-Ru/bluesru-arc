  author: Константин Колесниченко
  mark: 7
  date: '2008-01-11'
  text: 'То, что знаменитый голливудский режиссер Мартин Скросезе фанат блюза - известно
    всем. Он идеолог серии документальных фильмов о блюзе, да и его кинокартины часто
    украшены этой музыкой. В случае с этим концертом, Скорсезе выступил продюсером
    и организатором, а режиссером Antoine Fuqua. 2003 год был годом блюза в Америке,
    100 лет назад был записан первый блюз. Этому событию и посвящен концерт.


    Как мне кажется,у организаторов была идея - не показать разнообразие блюза, а
    скорее продемонстрировать то, как блюз проник в другие жанры. Таким образом, зрителю
    представлены не только блюзовые звезды и музыканты величиной поменьше, но и исполнители
    из другой музыки (иногда их дуэты с блюзменами) вроде Macy Gray, India.Arie, Natalie
    Cole. Зачем в формат концерта были помещена ужасная котовасия от Aerosmith и Chuck
    D and Fine Arts Militia - я не знаю.


    О солистах говорить почти не имеет смысла, потому что, в большинстве случаев,
    это очень знакомые всем музыканты. Лишь замечу, что мне очень понравились выступления:
    Clarence Gatemouth Brown, James "Blood" Ulmer & Allison Krauss, Neville Brothers,
    Keb'' Mo'', Solomon Burke и Mavis Staples.


    Больше, чем солирующих звезд, я хочу выделить сопровождающих большинство выступлений
    музыкантов: Levon Helm, Steve Jordan, Larry Taylor, Dr. John, Keb'' Mo'', Ivan
    Neville, Denny Kortchmar. Именно им концерт обязан отличному качеству музыки!


    Замечание от любителя блюзовой гармоники. Как и в случае с серией документальных
    фильмов, Скорсезе на этом концерте практически оминул этот важный для блюза инструмент.
    Так, всего в двух композициях появляется Ким Вилсон, и где-то в кулуарах мелькают
    Billy Boy Arnold и Lazy Lester (это скорее претензии к режиссеру Antoine Fuqua,
    как и то, что он безбожно вырезал выступление моего любимца John Hammond).'
