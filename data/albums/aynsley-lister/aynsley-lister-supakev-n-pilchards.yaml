  author: Олег Пчелкин (oleg_spb)
  mark: 9
  date: '2019-04-14'
  text: 'Этот живой концерт, записанный 14 июля 2001 года в Суонси, Англия, где музыкант
    играет на гитаре один, без сопровождающего состава, используя только стомп-бокс
    (ящик, по которому можно ногами отбивать ритм), был выпущен в апреле 2002 года
    на фирме Ruf Records и получил название Supakev ''n Pilchards.


    Название автор придумал дурашливое, потому что, с его слов, работалось над альбомом
    легко и весело. Если кто в состоянии сделать перевод этого названия - буду признателен.
    За исключением восьмой песни, написанной самим Листером, это - альбом каверов
    песен Роберта Джонсона (1, 6, 10, 11), Джимми Уизерспуна (2), Шерил Кроу (3),
    Уолтера Якобса (4), Джона Ли Хукера (5), Лайтинг Хопкинса (7),Сона Хауса (9) и
    Тони Джо Уайта (12).


    Его игра временами просто выдающаяся, его вокал почти страстный-обратите внимание
    на гитару в "Tougher than Tough" Уизерспуна или исполнение "Mad Man Blues" Джона
    Ли Хукера.'
