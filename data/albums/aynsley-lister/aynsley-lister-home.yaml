  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2013-08-05'
  text: 'Свой десятый альбом один из наиболее интересных современных британских блюзовых музыкантов записал на собственной
    студии - Straight Talkin'' Records. К этому Листер шел более 10 лет, хотя уже в 2007 году журнал Classic Rock включил
    его в символическую десятку лучших современных блюзовых исполнителей (в этом списке он соседствовал с Джоном Мейером и
    Джо Бонамассой и был единственным представителем Туманного Альбиона). Среди других достижений - альбом ''Equilibrium''
    попал в 50 лучших альбомов 2009 года от журнала Classic Rock, а альбом ''Tower Sessions'' по итогам опроса авторов журнала
    Blues Matters был признан лучшим концертным альбомом 2011 года.


    Хотя блюзовая составляющая на данном диске довольно велика (и, возможно, это самая блюзовая работа музыканта), альбом
    сравнительно разнообразен - там можно обнаружить и рок, и соул и даже джазовые отголоски. Два кавера (из которых, на мой
    взгляд, Feeling Good удалась не очень - у Бонамассы она получилась гораздо лучше), остальное авторский материал хорошего
    качества. Сыграно вполне прилично и профессионально, композиции запоминаются не только гитарными рифами и техничными соло,
    но и своими мелодиями. Вот бы еще чуть побольше поработать над аранжировками и сократить долю "голубоглазого соул" - и
    неплохой альбом превратился бы в хороший. Впрочем, возможно, я слегка придираюсь - для современных сравнительно молодых
    по блюзовым меркам музыкантов работа вполне приличная.'
