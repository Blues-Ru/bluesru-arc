  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2013-08-05'
  text: 'Айнсли Листер (род. 14.11.1976) начал играть на гитаре в 8 лет и учился мастерству,
    подыгрывая папиным дискам Фредди Кинга, Джона Мэйолла и Эрика Клэптона. К 18 годам
    он собрал свою группу и записал пару альбомов для локальной фирмы грамзаписи.
    Удача улыбнулась молодому музыканту, когда второй из этих дисков попал в руки
    владельца лейбла Ruf Records Томаса Руфа, который подписал контракт с английским
    гитаристом.


    Дебютный альбом Листера на крупном лейбле вышел в 1999 году, причем продюсировал
    его сам Джим Гэйнс. На диске две трети авторского материала да плюс гостевое участие
    Уолтера Траута. Стилистически это блюз-рок, и довольно техничный. Вполне приличный
    дебют для музыканта, который единственным из английских блюзменов был включен
    в 2007 году в символический список "10 лучших современных блюзовых артистов" журнала
    Classic Rock (вместе с The White Stripes, The Black Keys, John Mayer, Jon Spencer,
    Jonny Lang, Kenny Wayne Shepherd, Joe Bonamassa, Derek Trucks и the North Mississippi
    Allstars). Неплохая компания для любого музыканта, не так ли?'
