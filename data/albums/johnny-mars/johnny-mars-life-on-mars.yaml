- id: 1081
  author: Константин Колесниченко
  mark: 6
  date: '2007-06-04'
  text: 'Джонни Марс малоизвестен широкой публике, а ведь он новатор в игре на гармонике. В блюзе таких немного. Он один из
    первых, кто начал играть на большой скорости, применять всевозможные эффекты. Джонни отлично владеет как диатонической,
    так и хроматической гармоникой. У Марса странная и неровная музыкальная биография, он работал со многими и абсолютно разными
    музыкантами, например, с поп-группой Bananarama.


    Альбом 1984 года выдержан в блюзовом и соул-блюзовом ключе, подпевки, духовые и над всем этим - полет перегруженной гармоники
    Джонни.


    Во время тура по скандинавии Марса окрестили Хендриксом губной гармоники, на этом альбоме он подтверждает свое прозвище,
    и в комозиции "Keep Swinging" играет длинное и виртуозное соло ритмично и интересно.


    Материал перемешан: классика жанра (Don''t Start Me to Taking, Born Under Bad Sign) и авторские номера. Аранжировки нетривиальные,
    шаффлов немного, достаточно минора и фанка. Звук для 1984 года приличный.'
