- id: 249
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Осиротевшая в 90-м году (в связи с трагической смертью своего лидера Stevie
    Ray Vaughan) группа Double Trouble долгое время не отваживалась выпустить собственный
    альбом и в основном участвовала в записях других блюзменов. И вот спустя 11 лет
    барабанщик Chris Layton и бас-гитарист Tommy Shannon наконец решили, что пора
    уже им выпустить свою пластинку - естественно, посвященную Stevie Ray Vaughan,
    о чем они недвусмысленно заявляют на ее обложке.


    Конечно же, альбом "Been A Long Time" Layton и Shannon записывали не вдвоем. Их
    высокая репутация в блюзовом мире позволила им заполучить многих известнейших
    музыкантов. В первую очередь это - невероятно модные сегодня молодые гитаристы
    Johnny Lang и Kenny Wayne Shepherd. Плюс Charlie Sexton и Doyle Bramhall II, игравшие
    вместе с Layton и Shannon в техасской группе Arc Angels после смерти Vaughan.
    Свою лепту внесли также Dr. John, Malford Milligan и Susan Tedeschi, честное слово,
    здорово спевшая знаменитый "цеппелиновский" "Rock And Roll". Естественно, не отказал
    музыкантам и Jimmie Vaughan, родной брат Stevie Ray, спевший дуэтом c Lou Ann
    Barton блюз Johnny Watson "In The Middle Of The Night".


    Хорошая получилась пластинка. Правда, многочисленных поклонников Stevie Ray Vaughan
    может удивить отсутствие на ней произведений самого гитариста, но, думаю, это
    не последняя работа Double Trouble, и блюзы своего безвременно ушедшего друга
    они еще запишут.'
- id: 296
  author: Кирилл Мошков
  mark: 6
  date: '2003-12-01'
  text: 'Бывшая ритм-секция титана блюзовой гитары Стиви Рэй Воэна, на его альбомах
    называвшаяся Double Trouble (барабанщик Крис Лэйтон и басист Томми Шэннон), почтила
    память погибшего десять лет назад лидера качественным трибьютом при участии таких
    разноплановых, разностилевых и разновесящих музыкантов, как гигант кантри Вилли
    Нелсон, рок-гитарист Чарли Секстон, блюзовый "крестный отец" д-р Джон, брат покойного
    - Джимми Воун (экс-Fabulous Thunderbirds) и т.п. Треки получились в основном добрыми
    и трогательными, но сильно разными - причем чем значительнее солист, тем лучше
    трек, так что пиком альбома закономерно стал финал, где поет д-р Джон, а соло
    на гитаре играет Вилли Нелсон. Кроме факта, что всю работу продюсировали Лэйтон
    и Шэннон, разношерстный альбом объединяет и их игра: естественно, они играют во
    всех треках. Впрочем, есть стойкое ощущение, что у Стиви Рэя они играли все-таки
    лучше. Особенно разочаровывает (и именно по ритм-секции) детальное, но вялое воспроизведение
    лед-зеппелиновскго "Рок-н-ролла" с вокалисткой Сьюзан Тедески в роли Планта.'
