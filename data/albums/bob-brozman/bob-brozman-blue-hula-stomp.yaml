reviews:
- id: 697
  author: Александр Панин
  mark: 8
  date: '2005-05-29'
  text: 'Самый первый альбом Боба Брозмана, вышедший в 1981 году на лейбле Kicking Mule. Здесь в основном гавайская музыка,
    а также немного блюза и старых джазовых вещей. Много акустических инструментов и пиротехнической игры на них (послушайте
    вещицу Ukulele Spaghetti), но до этнического разнообразия последующих работ он еще не дошел. Пожалуй, что вокал Боба звучит
    послабее, чем на более поздних дисках. Но в целом - это очень серьезный и интересный дебют.


    Любопытно, что во время обучения в сент-луисском университете Брозман писал диплом по творчеству Чарли Паттона и Томми
    Джонсона.'
- id: 699
  author: Дмитрий Казанцев
  mark: 5
  date: '2005-05-29'
  text: 'Дебютный альбом Боба. Хотелось бы сразу отметить, что поет он неважно, и это очень мешает слушать остальное.


    На диске много разных акустических инструментов "типа гитара", на которых виртуозно играет Боб. Добро, резонаторы, стил-гитары,
    юкулеле и т.д. - все это очень интересно, конечно. Боб исполняет старые джазовые песенки, фолк, блюзы и много островной
    "а-ля гавайской" музыки. Все звучит хорошо и мощно, но я не слышу там корней и души. Больше похоже на дипломную работу
    или самоутверждение - типа "а я вот так умею и на этом тоже могу!".


    Этот альбом скорее для музыкантов, чем для слушателей (musician''s musician - есть такое понятие).'
