reviews:
- id: 659
  author: Александр Панин
  mark: 8
  date: '2005-05-21'
  text: Академический час акустической музыки, изданной на непонятном австралийском
    лейбле (Боб среди прочего является адъюнкт-профессором сиднейского университета).
    Весьма интересный диск с богатым звучанием (можно долго перечислять используемые
    инструменты). Среди исполняемых вещей есть две композиции Чарли Паттона и Скипа
    Джеймса, остальные приписаны Брозману или традиции. Точнее, конечно, традициям,
    ибо сконструированы из многих кусочков с разных частей света, но альбом в целом
    все же можно назвать блюзовым. Пожалуй, он не так впечатляет, как рекомендуемые
    в первую очередь раундеровские диски Боба Devil's Slide и A Truckload Of Blues,
    но его можно и нужно послушать.
- id: 1174
  author: Дмитрий Казанцев
  mark: 7
  date: '2007-12-11'
  text: Супер-виртуозная игра на разных акустических гитарах в разных стилях (блюз,
    фолк, джаз, этника), но что с вокалом? Кажется, что Боб стебется или кого-то изображает.
    Это явно не стеб, на мой взгляд. Смысл в том, что инструменталы звучат гораздо
    главнее песен. Большинство вещей написал сам Брозман, кстати.
- id: 1399
  author: Андрей Евдокимов
  mark: 6
  date: '2008-12-29'
  text: Конечно, он не раз говорил, что не играет блюз. Но кто принимает клятвы блюзмена
    за чистую монету? Он ездил в Африку учиться, а теперь сам открывает там музыкальные
    школы. Этот альбом записан еще два года назад и распространялся по подписке. Его
    переиздание на Ruf (независимом европейском лейбле, но с хорошо налаженной мировой
    дистрибуцией) впервые открывает его альбом широкой публике. За исключением трех
    треков с ударными инструментами – это сольный альбом. Но и без метронома Брозман
    служит образцом безупречного ритма. Столь же точна его нотная игра. Именно безупречность
    ставит его игру на грань стерильности, но в остальном – это музыка для гурманов
    акустической гитары.
