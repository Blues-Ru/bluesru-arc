- id: 1233
  author: Андрей Евдокимов
  mark: 8
  date: '2008-03-22'
  text: 'Доминирует National Resonator, который под руками музыканта и ритм, и соло,
    и еще замечательный металлический барабан. Но Брозман - вечный экспериментатор.
    Объездив весь мир в поисках музыкальных чудес, он для записи нынешнего альбома
    использует еще и струнные инструменты из Индии, Греции, Окинавы и Гаваев. И английское
    банджо середины XIX века. Коллекционер инструментов и стилей, он ненадолго вернулся
    на свою музыкальную родину, исполняя блюзы и другую американскую народную музыку.
    Тематика: от старинных американских страданий, с коротким экскурсом в блюз-рок
    60-х до актуальных размышлений самого Брозмана о наводнении в Новом Орлеане и
    войне в Ираке. В общем, нет человеку покоя, потому и альбомы он выпускает нечасто.
    И пока он не отправился в очередную музыкальную кругосветку, стоит послушать,
    что он записал за несколько дней вместе с контрабасистом Стэном Поплиным и барабанщиком
    Джимми Норисом.'
