reviews:
- id: 982
  author: Дмитрий Казанцев
  mark: 9
  date: '2006-04-05'
  text: 'Харри - волшебник "сингер-сограйтер". Он играет на слайд-гитаре (хитрым образом), 20-струнной индийской слайд-гитаре,
    на банджо и на гармошке. Очень симпатично поет и пишет. Вся музыка в духе фолка, кантри, блюза, рока и индийской раги
    (Мэнкс 6 лет учился музыке в Индии). Помимо своих песен он играет "The Thrill Is Gone" (hit), "Crazy Love" Вэна Моррисона
    и "Foxy Lady" Джими Хендрикса - обалденный результат.


    Великолепный, виртуозный минимализм и талант. Человек один создает ощущение группы, и он не похож НИ НА КОГО, что очень
    редко в наши дни.'
