reviews:
- id: 1356
  author: Константин Колесниченко
  mark: 10
  date: '2008-11-05'
  text: Шикарный альбом! К блюзу он практически не имеет отношения, хотя в одной композиции
    звучал риф а-ля "Hoochie Coochie Man". Kevin Breit известен своей работой с Кассандрой
    Вилсон, Норой Джонс, но больше всего ценен как гитарист на альбомах Карлоса Дель
    Хунко. А Harry Manx - просто потрясающий гитарист, который использует разные струнные
    и гитароподобные инструменты, плюс он очень приятный слуху вокалист в духе Спрингстина.
    Повторюсь, но альбом получился совсем не блюзовый – это скорее фолк, немного кантри,
    рутс-рок, исполненный в акустической манере. Самая первая ассоциация - "Nebraska"
    Брюса Спрингстина, да и альбом начинается с его композиции "I'm On Fire". В этой
    музыке нет резких звуков, смены динамики, красок – это плавное музыкальное повествование,
    которое слушается на одном дыхании.
- id: 2043
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2012-08-07'
  text: 'Отличный альбом неспешного расслабленного софт-рока и акустического блюза,
    полностью записанный двумя мастерами гитары. Один список использованных инструментов
    вызывает невольное уважение!


    Хэрри Манкс как обычно обеспечивает вклад восточной музыки, добавляя своеобразные
    блюзовые раги, слайд-гитару и основной вокал. Его более молодой коллега не уступает
    Хэрри в арсенале используемых инструментов, обеспечивая также половину материала.
    На альбоме 11 треков, из которых 4 инструментальных, один традиционный и один
    кавер Брюса Спрингстина. В результате получился мастерски сыгранный альбом своего
    рода медитативного уорлд-блюза :-)'
