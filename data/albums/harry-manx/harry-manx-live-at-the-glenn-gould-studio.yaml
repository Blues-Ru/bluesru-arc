  author: Антон Ворожеев
  mark: 10
  date: '2009-01-12'
  text: 'Записан альбом живьем в студии имени канадского классического пианиста Гленна Гульда. Сам Менкс тоже канадец – так
    что считаем, что альбом этот он играл на родине, а дома и стены помогают. Помогли.


    В идеале, это блюз, с другой стороны, от блюза кроме эмоций тут мало чего осталось – его обильно разбавили индийской музыкой,
    нью-эйджем и фолком. Музыка в основном акустическая, иногда с чисто звучащей электрогитарой. Есть парочка экзотических
    инструментов – уже ставшая привычная табла (больше ударных на альбоме нет), mohan veena и dilruba.


    Из повседневных инструментов – гармоника, мандолина, контрабас. Второй вокалист тут женщина - Samidha Joglekar добивает
    индийский колорит диска мощными завываниями.


    8 песен можно пересушивать раз за разом. Наряду с авторскими композициями Гарри, он играет песни других людей – он народных
    до классики блюза. Tijuana, в оригинале спетая J.J.Cale, стала в четыре раза длиннее, и полностью индийской. В ней блюзовые
    соло на губной гармошке великолепно сочетаются со звучанием восточных инструментов. Вся песня сплошной оргазм, и лишь
    зрители в экстазе аплодируют после каждого проигрыша.


    В очень бодрой Can''t Be Satisfied Мадди Уотерса все 10 минут отрываются харпер и мандолинист, а середина песни превратилось
    в поппури из американских народных песен и других знакомых мелодий.


    Goodtime Charlie начинается плавным эмбиентом и постепенно вырисовывается в красивую кантри-балладу. Samidha''s Tune –
    самая необычная песня на альбоме – это выход солистки с индийскими песнопениями под таблу и dilruba (оказывается, мило
    звучит эта загадочная штука).


    Лучшая песня на альбоме – несомненно, Voodoo Child. Та самая песня Хендрикса, которую только ленивый не играл. И это лучший
    кавер на нее. Нет запилов и попытки скопировать подчистую то, как играл Джимми. В середине песни ребятам сносит крышу,
    они пускаются в солирование на табле, пение в стиле медитаций, и когда музыка становится совершенно непохожей на то, с
    чего они начинали, снова звучит Voodoo Child. Это отлично.'
