- id: 2040
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2012-02-03'
  text: 'Мультиинструменталист (гитара, гармоника, банджо, индийские струнные инструменты), певец и композитор Хэрри Манкс
    своим творчеством проложил мостик между музыкой запада и востока. В его музыке традиционный блюз соединяется с классическими
    индийскими рагами, образуя своеобразный полуакустический коммерческий world-blues :-).


    Большую часть времени Хэрри прожил в Канаде, однако в молодости он успел пожить и в Европе, и в Японии, и в Индии, и в
    Бразилии, впитав в себя музыкальную культуру этих стран. Харри провел в Индии 5 лет, освоив там 20-струнный музыкальный
    инструмент, изобретенный Вишва Бохан Бхатом. Манкс оказался вторым после Джорджа Харрисона музыкантом с запада, которому
    удалось овладеть данным инструментом.


    Начиная с 2000 года, Хэрри начал выпускать в Канаде сольные альбомы, получив за них ряд канадских блюзовых премий и номинаций,
    включая награды "лучшему акустическому исполнителю", "за лучшую запись" и "блюзовый альбом года". На своем последнем альбоме
    Манкс выносит на суд слушателей мелодичный софт рок с блюзовыми элементами (включая соло на слайд-гитаре) и вставками
    восточных мелодий, добавляющих определенный колорит world music в результирующую музыкальную картину.'
