- id: 2342
  author: Дмитрий Казанцев
  mark: 5
  date: '2019-10-16'
  text: 'Домашняя запись Элвина, он играет на всем сам, кроме клавиш. Надо сказать,
    что он плох на ударных и на басу - это очень странно (он же очень опытный музыкант).
    При современных цифровых программах можно очень интересно и круто "сыграть" на
    ударных. Не думаю, что он хотел сделать этот диск в духе лоу-фай.


    Все 14 песен написал сам Ли. Что-то в традиционном ключе блюза и рок-н-ролла,
    но есть и интересные рутс-рок-песни. Дело в том, что традиция совсем хреново звучит
    с такими домашними ударными и бас-гитарой. А вот оригинальные песни вполне так
    ничего.


    Вы будете смеяться, но самое интересное тут - это пение Элвина. Гитара в порядке,
    но совсем неинтересно по звукам и фишкам. Клавишник совсем не в кассу; я просто
    не понимаю, как Элвин такое пропустил. Ну и конечно, ритм-секция в исполнении
    Ли - это детский сад какой-то (примитив с плохими звуками). Тут есть 3-4 интересные
    песни, но большинство - это довольно стандартные рок-н-роллы и блюзы.'
