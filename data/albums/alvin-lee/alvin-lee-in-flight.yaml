  author: Олег Пчелкин (oleg_spb)
  mark: 8
  date: '2019-10-16'
  text: 'После отказа Элвина Ли в 1973 участвовать в проектах с уклоном в поп-песни, которые его группе Ten Years After уготовила
    было их фирма Columbia, он выпускает малопонятный большинству его поклонников, но в меру нашумевший альбом христианского
    кантри -рока On the Road to Freedom. Шум возник благодаря появлению в одном флаконе по христиански сочуствующих Ли, Джорджа
    Харрисона, Стива Уинвуда, Ронни Вуда и Мика Флитвуда. Но альбом оказался и не более, чем шум, потому что Майлон Лефевр,
    фронтмэн этого альбома и его главный христианин, ничем таким особенным не отметился. В его оправдание можно сказать, что
    зато он помог достроить Элвину Ли сарай и превратить его в домашнюю студию звукозаписи.


    Год спустя, могучая Columbia тихо, но внушительно напомнила Элвину Ли о себе и он, почувствовав себя ей обязанным,опять
    вернулся в блюз-рок. Ли сформировал Alvin Lee & Company, чтобы сыграть шоу в знаменитом зале The Rainbow в Лондоне. Вполне
    на время удовлетворенная этим фирма Columbia выпустила его как двойной концертный альбом.


    Запись была сделана на выступлении 22 марта 1974 года, музыканты были представлены на афише как Alvin Lee & Friends, в
    первом отделении их разогревал британский прогрессив рок ансамбль Rococo. В друзьях у Элвина в тот вечер были: - крутой
    саксофонист и флейтист Мел Коллинз Mel Collins, который мало того, что был сам участником таких проектов , как King Crimson,
    Camel и The Alan Parsons Project, но и участвовал в записях целого букета других знаменитостей от 10cc до The Rolling
    Stones;


    - гитарист Нейл Хаббард Neil Hubbard, приятель Брайана Ферри и соответственно частый музыкант в Roxy Music, а также у
    Juicy Lucy, The Grease Band, Joe Cocker, Kokomo, B.B. King;


    - приятель первых двух перечисленных клавишник Тим Хинкли Tim Hinkley. Он помогал Ли и на предыдущем опусе Элвина, On
    the Road to Freedom. Более с Элвином не пересекался, позже работал на сессиях у Humble Pie - Street Rats (1975) ,Thin
    Lizzy - Jailbreak (1976), Bad Company - Run with the Pack (1976), Desolation Angels (1979), Joan Armatrading - Show Some
    Emotion (1977), David Coverdale - White Snake (1977), Northwinds (1978), Whitesnake - Snakebite (1978), The Rolling Stones
    - Some Girls (1978), The Who - Quadrophenia, film soundtrack (1979);


    - мало поживший бас гитарист Алан Спеннер, ушедший в 1991 году в возрасте 43 лет, приятель Нейла Хаббарда, они перекаются
    в Roxy Music, The Grease Band и Kokomo. Он играл у Peter Frampton, Spooky Tooth,ABC,Joe Cocker.


    - приятель Мела Коллинза по King Crimson и Тима Хинкли, рок и джаз барабанщик Ян Уаллас Ian Wallace, с 1968 по 2007 участвовал
    в десятках проектов самых именитых рок, поп и джаз исполнителей


    Сначала в длинном отступлении стоит сообщить о самом зале, где был концерт. Первый и самый лучший концертный зал Лондона
    с начала 1960х, ранее с 1930 служивший кинотеатром и называвшийся The Odeon до 1971, имеет и сейчас относительно скромный
    внешний вид, разработанный Эдвардом А. Стоуном, но с невероятно роскошным "атмосферным, поднебесным интерьером" , спроектированным
    фирмой Somerford & Barr, с украшениями, выполненными мастерами Марком-Анри и Г. Лавердетом. Через фойе в мавританском
    стиле с заполненным золотыми рыбками фонтаном (который существует и сегодня) можно пройти к зрительному залу с местами
    для 3 040 зрителей, напоминающему андалузский город-крепость ночью. Сцена, глубиной 11 м и охватываемая аркой просцениума
    шириной 20 м, была оборудована двухконсольным театральным трехмануальным органом Compton. За кулисами было 12 гримерных.


    Проще сказать , что ВСЕ более-менее рок- и поп- звезды отметились выступлениями в этом зале. Кому интересен их список,
    отсылаю по адресу http://www.rainbowhistory.x10.mx/index.htm


    Именно в этом театре Джими Хендрикс впервые сжег свою гитару, предварительно сговорившись со своим менеджером Чезом Чендлером
    и журналистом из New Musical Express. 31 марта 1967 года Хендрикс продолжил поджоги своего Fender Stratocaster вечером
    перед открытием тура Walker Brothers и в результате отправился в больницу залечивать обожженные пальцы.


    Но поддерживать в нормальном рабочем состоянии и вовремя реставрировать эти хоромы желающих в Лондоне долго не находилось.Контора
    обветшала окончательно к 1983 году и прикрылась. В конечном счете на баланс легендарные помещения взяли в 1995 христианские
    евангелисты из " Всемирной Церкви Царства Божия", которые все отреставрировали, как требовала щепетильная общественность
    и ныне используют помещения по своему религиозному назначению. С 2004 в зале снова стали показывать фильмы с более-менее
    божеским содержанием.


    Не забыть бы о самом двойном альбоме. Это очень живая, энергичная музыка понравится многим, но не всем тем, кто привык
    восхищаться прежним Ten Years After. До второй половины второго диска, фирменные запилы соло-гитары Элвина - в дефиците,
    вместо этого имеет место саксофонистское активничанье Коллинза. Изменилась и фактура музыки. В то время, как Ten Years
    After ранее легко переходил от блюз-рока к психоделии, здесь Элвин Ли и друзья демонстрируют нечто близкое к буги-року.
    Есть шанс прослушать ряд новых для Ли мелодий: " chug-along blues "(как описывает его сам Ли в своих заметках) "Got to
    Keep Moving". Появляется фанк ‘You Need Love Love Love", , милое буги "Let''s Get Back" и напоминающий старый стиль Ten
    Years After номер "Ride My Train".


    По мере продвижения вглубь второго диска, Элвин выдвигает собственно свою гитарную героику на передний план, демонстрируя
    старые навыки на таких треках, как "Keep A Knocking" и имитируя звучание Чака Берри на "Johnny B. Goode" на рок-н-рольчике
    "i''ve Got Eyes For You Baby".


    Есть и несколько других каверов, которые тоже заслуживают упоминания. Версия Элвина "Slow Down" дает представление о том,
    как его сольная работа отличается от работы в Ten Years After. Вы вроде ждете, что он зажжет с гитарой и вокалом на этом
    потенциально ярком треке, но он все делает гораздо более гладко и спокойно, чем раньше. Середина 1970х сделала это со
    многими психоделическими и блюз-рокерами из 1960х, и Элвин, похоже, тоже этим тогда заразился. Тоже самое можно сказать
    о его каверах "Don''t Be Cruel" и "Mystery Train" Элвиса Пресли и "Money Honey". Каждая из этих песен в большей степени
    опирается на саксофон и бэк-вокал Мэла Коллинза, а не на поразительную гитарную виртуозность прежнего Ли.'
