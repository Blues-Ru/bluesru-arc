- id: 936
  author: Дмитрий Казанцев
  mark: 7
  date: '2005-12-13'
  text: 'Это уже пятый сольник Отиса и его второй диск на фирме Telarc. Тэйлор продолжает создавать свой необычный вариант
    блюза, смешивая его с фолком, психоделией и одноаккордным шаманством. Тэйлор играет на гитарах, банджо, мандолинах и гармошке.
    Его дочь Кэсси играет на басу и подпевает. Есть тут еще три виолончелиста в нескольких песнях и Рон Майлз на трубе.


    На ранних альбомах Отис использовал в основном минорные аккорды, они создавали атмосферу мрачной блюзовой красоты. Здесь
    же доминирует мажор, а яркие риффы и мелодии стали появляться гораздо реже. Тэйлор по-прежнему остается самым необычным
    и интересным блюзменом нашего времени.'
- id: 1488
  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: 'Может ли великий комбинатор переквалифицироваться в управдомы? Отис Тейлор доказал, что антиквар с 20-летним стажем
    может стать экстраординарным блюзменом. Три года назад, выступая в России в программе эфесовского блюз-фестиваля, от других
    участников он держался особняком: они считали его мрачноватым и суровым. Справедливо! По музыке Тейлор и правда стоит
    в стороне от сегодняшнего блюзового движения, зато интеллектуальная критика, обычно игнорирующая блюз, любит его именно
    за мрачность и серьезность ( "Нью-Йорк Таймс" включила его предыдущий альбом в число десяти лучших года). Тейлор частенько
    отходит от блюзовой формы, но он умеет творить одноаккордовую блюзовую магию. Губная гармоника, банджо, мандолина и гитары
    - подвижный ритм он выстраивает, обходясь без ударных. Смех зловещий, голос низкий и густой, рык – мощный. Ценителей примитивных
    аккордов удивит скрипичный квартет в нескольких треках. Темы, как и раньше, острые: коренные американцы, афро-американцы,
    "Мама торгует героином", чернокожий чемпион мира по велогонкам, человек набожный, отказывается участвовать в соревнованиях
    по воскресеньям – злобные промоутеры назначают гонки именно на праздники.


    Три года назад, приехав в Россию в программе эфесовского блюз-фестиваля, Отис Тейлор держался в стороне от других участников:
    они считали его мрачноватым и суровым. Справедливо! По музыке Тейлор стоит особняком, зато интеллектуальная критика, игнорирующая
    блюз, любит его именно за мрачность и серьезность ("Нью-Йорк Таймс" включила его предыдущий альбом в лучшую десятку года).
    Тейлор творит одноаккордовую блюзовую магию. Губная гармоника, банджо, мандолина и гитары - подвижный ритм он выстраивает,
    обходясь без ударных. Смех зловещий, голос низкий и густой, рык – мощный. Среди африканских аккордов и вудуистских выкриков
    в нескольких треках удивляет звук скрипичного квартета. Темы, как всегда, преобладают четко конкретные и остро социальные.
    А для лирики есть и сольное бормотание заклинания "Поспеши домой" - у Тейлора много разных историй. На бас-гитаре играет
    17-летняя дочь Телора, рыжеволосая и белолицая, - ее портрет украшает обложку. Объективно есть один серьезный недостаток
    - альбом нельзя слушать в пол-уха, требуется полное внимание.'
