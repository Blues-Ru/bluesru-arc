reviews:
- id: 825
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-21'
  text: 'Тревожная, красивая, минорная, разнообразная музыка на основе акустического блюза. Много психоделических звуков и
    грува. Присутствуют элементы кантри и текс-мекса, и все же музыка Отиса очень самобытная и своеобразная. Ударных нет,
    есть гитары, банджо, бас и клавиши. Вокал Тэйлора классный и убедительный, слова из песен сразу западают в душу.


    Это уже третий альбом Отиса, он понравится как любителям блюза, так и ценителям фолка и современной авторской музыки.'
