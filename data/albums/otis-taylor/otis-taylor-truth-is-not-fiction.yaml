- id: 854
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-09-09'
  text: 'Четвертый альбом Тэйлора вышел на лэйбле Telarc, но его музыка и настроение
    почти не изменились. Жесткий, грустный, надрывный, гипнотический, психоделический,
    протестующий блюз Отиса - это его музыка, она не похожа ни на что. Сам Тэйлор
    играет на гитарах, банджо, мандолине и гармошке, ему помогает басист (он же клавишник
    и проюсер), иногда слышна виолончель, его дочь Кесси Тэйлор периодически что-то
    подпевает.


    Много песен о смерти, одиночестве, трудностях, свободе и страданиях. Отис - это
    музыка не для каждого, по своей жесткости и депрессивности он превосходит самого
    Ника Кейва, на мой взгляд. И тем не менее, все это красивые песни; просто надо
    любить и понимать это настроение и этот минор. Последняя вещь на этом диске -
    "Baby Please Don''t Go" - это неожиданность, Тэйлор обычно играет свои вещи.'
