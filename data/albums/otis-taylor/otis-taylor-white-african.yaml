reviews:
- id: 824
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-20'
  text: 'Отис Тэйлор играет свой вариант блюза. В нем много обработки, продакшна,
    амбиентных звуков, психоделии. Костяком этой музыки является акустическая гитара
    (иногда гитар много!) Отиса и его мощный вокал. Тэйлор поет об Иисусе, смерти,
    снах, религии, трудностях жизни. Можно сказать, что его музыка почти жутковата
    местами. На записи также есть бас, клавиши и гармошка, а вот ударных нет.


    На диске 11 недлинных треков, все они написаны самим Отисом. Очень интересная
    и необычная музыка, можно сказать, что это альтернативный вариант блюза. Очень
    советую всем любителям блюза ознакомиться с этим альбомом.'
