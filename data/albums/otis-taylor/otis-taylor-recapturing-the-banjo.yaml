- id: 1261
  author: Андрей Евдокимов
  mark: 8
  date: '2008-04-30'
  text: Гай Дэвис, Корей Харрис, Элвин Янгблад Харт и Кеб Мо – все признание имена
    блюзменов, тяготеющих к акустике и пользующих репутацией виртуозов. Все они по
    очереди солируют в песнях альбома. Но альбом в целом принадлежит именно Отису
    Тейлору. И не только благодаря придуманной им необыкновенной концепцией квартета
    банджистов. На большинстве песнях (за исключением 4 из числя кантри-блюзовой классики)
    лежит печать мрачного тейлоровского отношения к афро-американской истории в текстах;
    и любви к монотонной минималистике в музыке. Как он убедил известных мастеров
    обойтись без ярких соло – остается только удивляться. Но высокий исполнительский
    класс проглядывает к каждой ноте, сыгранной безупречно, нежно и элегантно. Мультиинструменталисты,
    они по очереди обмениваются еще и гитарами, мандолинами, губными гармониками.
    Музыка на любителя, но таких любителей найдется немало!
