- id: 937
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-12-13'
  text: 'На этом диске Отиса многое поменялось в его звуке. Во-первых, появились ударные, на которых играет Грэг Энтон. Во-вторых,
    трубач Рон Майлз стал играть больше, создавая приджазованную атмосферу. Появилась скрипачка Рэйна Геллерт - она довольно
    известная дама в кантри-фолковом кругу США. Сам Тэйлор продолжает использвать на записи различные гитары, а также банджо,
    мандолину и гармошку. Его дочь Кэсси стала штатным басистом, она также очень здорово поет.


    Здесь 10 композиций в стиле Тэйлор-блюз. Песни в основном на одном аккорде с психоделическими звуками, блюзовыми ходами
    и риффами, с фолковым настроением. Можно сказать с уверенностью, что этот диск сильнее предыдущего по мелодиям и интересным
    "фишкам" в композициях. Альтернативный, но гипер-интересный вариант блюзо-фолка.'
