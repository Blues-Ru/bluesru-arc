- id: 2026
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-11-16'
  text: 'Один из выдающихся британских гитаристов и композиторов Сноуи Уайт за свою почти 40-летнюю карьеру успел поработать
    с такими грандами, как Pink Floyd, Peter Green, Thin Lizzy и Roger Waters, а также записал ряд сольных альбомов со своими
    группами White Flames и Blues Agency.


    Сноуи - прозвище, данное Теренсу Уайту за цвет его волос. Он начал играть на гитаре в 11 лет, и первыми его кумирами были
    блюзовые артисты того времени - ББ Кинг, Отис Раш, Алберт Кинг и Бадди Гай. И хотя в 70-е, да и в 80-е годы Уайт не играл
    чистый блюз (пожалуй, за исключением сотрудничества с Питером Грином на альбоме In The Skies), тем не менее любовь к нему
    сохранилась и проявилась в его сольных работах позднее.


    Записанный им в конце 1983 года сингл Bird of Paradise стал международным хитом, добравшись до 6 места в британских чартах.
    Носящая такое же название данная двухдисковая антология дает прекрасное представление о разнообразной музыке талантливого
    музыканта - каждый диск играет почти 80 минут. Тут, конечно, представлен не только блюз и блюз-рок, но и хард рок, и инструментальные
    треки с легкой примесью фьюжн, но одно несомненно - и музыка, и исполнение заслуживают самой высокой оценки.'
