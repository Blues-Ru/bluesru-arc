  date: '2003-07-09'
  text: 'После одного из концертов Junior Watson с Canned Head, укуренный хиппи подошел к нему, нудя: "Sunflower, как же вышло,
    что ты не сыграл Fried Hockey Boogie?" Он продолжал донимать Ватсона, называя его "Sunflower", очевидно путая его с давно
    ушедшим гитаристом группы 60-х. В конце концов, Ватсон положил руку на плечо хиппи и сказал: "Послушай, приятель, я -
    не Sunflower (подсолнух)", "Ааа, а кто же ты тогда?", Ватсон холодно ответил - "Я - Seaweed (водоросль)".


    Нужно быть в состоянии, близком к умиранию мозга, чтобы перепутать Ватсона с каким-либо другим гитаристом, потому что
    его гитарный стиль является одним из наиболее оригинальных и отличимых в современном блюзе. Хотя у него есть прочная основа
    в традиционных блюзовых стилях - с особенной любовью к поцелованному джазом звуку вест-коаст блюза - его манера игры уникальна.
    Если бы T-Bone Walker когда-либо закрыл глаза и увидел бы сон о диком, мультяшном полете на ракете, музыка Джуниора была
    бы наилучшим саундтреком для него.


    Его соло могут уплыть извилистыми путями, основанными на невменяемой логике, но вновь возвращаются домой с эмоциональной
    прямотой ударившей молнии.


    Джуниор научился своему искусству в районе залива, работая с Luther Tucker, Big Mama Thornton, Jimmy Rogers, L.C.Robinson
    и другими. Он был гитаристом, участвовашим в создании Mighty Flyers, и за 11 лет с ними он заработал всемирную известность
    и значительно повлиял на других гитаристов (он впервые освоил использование бюджетных полукустических arch-top гитар,
    которые сейчас стоят бешеные деньги из-за того, что другие пытаются повторить звук Ватсона).


    В конце концов, Джуниор выпустил свой собственный альбом, и это - настоящее чудо. Звук и атмосфера песен столь же густая,
    как дыхание виски Биг Джо Вильямса. Гитара Джуниора скачет с индивидуальностью голоса, с нечеткими нотами и кажущимися
    ошибками, которые потом проявляют себя как часть его расширенного музыкального словаря. В дополнение к инструментальной
    манере Джуниора, ему вряд ли так уж нужен голос, но оказывается, что он у Джуниора - замечательный, здесь в компании с
    парой песен, спетых Lynwood Slim - его партнером по группе, а также первой певицей группы "Asleep at the Wheel" - Brenda
    Burns. <p align="right"><i>Jim Washburn<br>Los Angeles Times</i>'
- id: 131
  author: Федор Романенко
  mark: 10
  date: '2003-07-09'
  text: 'Джуниор Ватсон - гитарист, который известен не в очень широких кругах любителей блюза, но одновременно он является
    настоящим идолом среди людей, интересующихся вест-коаст блюзом и связанными блюзовыми течениями. Многие гитаристы на вопрос
    о том, кто больше всего повлиял на их стиль, осознанно и в здравом уме называют имя Ватсона в числе первых.


    Ватсон известен, в частности, тем, что играл более 10 лет в составе группы Rod Piazza "Mighty Flyers", а также довольно
    долгое время в современной Canned Heat, которая в последний период отличалась более блюзовым звучанием в ущерб хипповско-молодежным
    атрибутам времен Вудстока.


    За все это время Джуниор Ватсон записал гитару для более чем 40 пластинок различных музыкантов, но выпустил только две
    под своим именем: "Long Overdue" в 1994 и "If I Had A Genie" в прошлом - 2002 году. У меня есть обе эти пластинки, а также
    множество других записей с участием Ватсона. Все они совершенно великолепны, но Long Overdue, на мой взгляд, - особый
    шедевр, который мне нравится, пожалуй, больше всего. К сожалению, тиражи этой пластинки распроданы, поэтому ее сейчас
    не так просто купить.


    На диске с Ватсоном записалось несколько известных музыкантов. В большинстве песен - это ритм-секция Richard Innes (уд.)
    и Larry Taylor (бас) + пианино Fred Kaplan - участники легендарной группы Hollywood Fats Band. В половине песен с Junior
    Watson второй гитарой записался Rick Holmstrom. В паре - спел и сыграл соратник Junior Watson по другим дискам - Lynwood
    Slim, но на основной части песен поет сам Watson. Все песни записаны разным составом, там есть дополнительно - дудки,
    хаммонд б-3 и две вещи с женским вокалом - певицей Brenda Burns.


    Диск начинается с несерьезного хита Ватсона Certainly All, который он играет на концертах до сих пор. Складный и комичный
    рифф на гитаре исполняется под хлопки руками. Когда дело доходит до соло, Ватсон в первой же песне демонстрирует свою
    индивидуальность и свой стиль. Типичная его черта - это характерные рваные куски соло, отличающиеся друг от друга по тембру.
    Они никогда не ложатся сами под гладкий ритм, но задним числом, когда все в квадрате устаканивается, понимаешь что все
    сыгранное - это не спонтанная ошибка, а часть коварного плана. В гитаре Ватсона есть куча смешного до колик, изначальная
    его установка - несерьезность, отчасти - некоторая легкость формы. Но когда он наиграет достаточно, на первый взгляд -
    легковесно по форме, тебя все равно очень глубоко зацепляет сила его музыкального таланта. В лирических песнях он не начинает
    соло с декларации - сейчас я буду играть грустнейший минорный блюз про крушение всех жизненных надежд. Вместо этого, легкие
    смены настроения в непотребном для траура по форме соло, нагнетают сильнейшего лиризма, который Ватсон приправляет под
    конец уже очень выразительными гитарными звуками, секрет которых, вероятно, известен только ему одному. Я где-то прочитал
    очень хорошую характеристику манеры Ватсона в одном предложении: "Джуниор играет на гитаре так, как звучит поезд, сошедший
    с рельсов".


    Вторая песня на альбоме - Lonesome Train, шедевр, на мой взгляд. Поет и играет на гармонике в ней Lynwood Slim, отлично
    акцентируя все крутые места в песне своим отличным голосом. Песня была бы хороша и без Ватсона, но он на протяжении всей
    песни играет абсолютно потрясающую гитарную подкладку. Когда я единственный раз в жизни был на концерте Ватсона, меня
    поразило именно его умение разнообразить аккомпанимент. После его сногсшибательных соло, когда эстафета переходила, к
    примеру, к саксофону, у меня были мурашки по спине от того, ЧТО он играет на гитаре параллельно солисту. Песня про Lonesome
    Train именно в этом смысле как бы полифонична, и, на мой взгляд, вообще является идеалом и пределом совершенства.


    Сразу после этой песни через две секунды, не дав передохнуть, Ватсон на пару с Холмстромом дают по голове инструменталом
    Biscuits с забойнейшим риффом в начале. Сразу в голову приходит мысль - не большая ли роскошь ставить на пластику один
    супер-хит за другим? ;)


    Дальше после трех энергичных песен в начале альбома тебя охлаждают слишком спокойной, немного старомодной по звуку балладой
    про Френки и Джонни, которая очень хороша, но является, скорей, антихитом, которую надо бы спрятать под, к примеру, 11м
    номером из 17 возможных. Еще одна роскошь? ;)


    На альбоме еще 13 песен, они ВСЕ хорошие и разные, про каждую рассказывать - рука не поднимается, какие-то пропускать
    - тоже.


    Woodpecker - совершенно хулиганский инструментал на пару с Холмстромом. Want Me Some Love - очень лирическая песня с хаммондом,
    Брендой Бернс и элементами соул.


    Big Boy - драйвовый свинговый инструментал by Bill Jennings с джазовым уклоном. На хаммонде б-3 в нем отлично сыграл Fred
    Kaplan.


    Long Time Baby - очень стильная по звуку, с гладким голосом Lynwood Slim, Special Lesson #1 - с виду какая-то чересчур
    бравая пародия на популярную песню Гитар Слима "Letter to my Girlfriend". Мне понятен смысл этой шутки только частично,
    ибо я не знаю всей истории целиком.


    Cool Evening - очень разухабистый инструментал Pee Wee Crayton, который по стилю очень характерен именно для Junior Watson.
    Из него понятно, что Crayton значительно повлиял в свое время на стиль самого Ватсона.


    Песня Lump in My Throat - самый длинный, неспешный, лирический блюз, к которому в полной мере относятся все мои теплые
    слова, сказанные выше по тексту.


    Под конец на пластинке записана быстрая песня Руфуса Томаса "Don''t Leave Me Baby (The Easy Livin'' Plan)" - она звучит
    как какой-то бонус-трек после размеренной песни про поезд, которая должна была по логике вещей завершить альбом. Текст
    с речитативом там несерьезно-комический, очень подходящий для Ватсона, и в гитарном соло он разошелся не на шутку, завершив
    альбом эффектной кодой.


    Эта классная пластинка интересна тем, что она очень полно раскрывает все стороны таланта Ватсона. Кроме того, она очень
    качественно сделана, песни подобраны очень разнообразно, так что ее можно слушать несколько месяцев, не страдая от какой-либо
    монотонности. Главная проблема с этой пластинкой в том, что ее очень трудно найти.... (Вот и сейчас, куда же она подевалась???).'
