  date: '2011-07-06'
  text: 'Бывший бас-гитарист и вокалист третьего состава Deep Purple, а затем успешный
    соло-исполнитель в особых представлениях не нуждается. История записи его третьего
    сольного альбома такова: в сентябре 1992 года Хьюзу позвонил владелец фирмы Шрапнель
    Рекордс Майк Варни и предложил записать блюзовый альбом. Идея показалась Хьюзу
    интересной, и он согласился, предварительно пригласив поучаствовать ряд своих
    знакомых музыкантов.


    Если вы думаете, что в итоге в октябре был записан альбом блюза в обычном понимании
    этого слова, то вы просто не знаете ни Майка Варни, ни продукцию фирмы Шрапнель!
    Да и имена приглашенных гитаристов тоже должны настораживать, ибо из всех приглашенных
    к блюзу имеет непосредственное отношение разве что Крейг Эриксон, да и сам Гленн
    больше известен своим фанковым и хард-роковым прошлым. Итак, кроме Хьюза на альбоме
    играли отличный басист Тони Фрэнклин, за все ритм-гитары и часть соло отвечал
    Крейг Эриксон, а гостевые соло записали такие гранды тяжелого жанра, как Джон
    Норум, Мик Марс, Ричи Котцен и другие.


    В результате получилась пластинка тяжелого рока иногда даже на стыке с металлом,
    но определенно с блюз-роковым оттенком, который в отдельных композициях выражен
    достаточно явно. Все сыграно технично, профессионально, энергично и тяжело, но
    с традиционной для сольных работа Хьюза затянутостью. Любителям традиционного
    блюза данный проект вряд ли понравится, а вот поклонникам Гленна и любителям тяжелого
    блюз-рока будет в самый раз.'
