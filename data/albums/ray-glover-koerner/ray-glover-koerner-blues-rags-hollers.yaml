  author: Константин Колесниченко
  mark: 10
  date: '2008-12-15'
  text: 'В те далекие времена трое молодых белых парней, если собирались играть блюз,
    то это была музыка не в духе блюз-рока, а вдохновлялись они блюзами Sonny Terry,
    Brownie McGhee, Big Bill Broonzy, Leadbelly и др. Нужно сказать, что у этой троицы
    получалось играть замечательно - подлинная блюзовая искренность, рассказанные
    истории, отличное владение инструментами, пение. Возможно, некоторая аккуратность
    исполнения выдает в них худощавых белых парней.


    Два гитариста и харпер, немного своих песен, немного классических, 1963 год и
    в итоге классическая запись, передающая ту замечательную атмосферу фолк-возрождения.'
