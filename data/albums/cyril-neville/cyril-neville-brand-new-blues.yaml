  author: Дмитрий Казанцев
  mark: 9
  date: '2010-05-09'
  text: 'Четвертый сольник младшего брата группы Neville Brothers (тут ему 61 год). Сирил Невилл - перкуссионист, певец и
    автор; он начал играть и петь еще в знаменитой фанковой группе своего старшего брата Арта - The Meters. Кто бы мог подумать,
    что классный соул- и фанк-певец решит выпустить почти целиком блюзовый диск в 2009 году!


    Дело в том, что вся семейка Невиллов - из Нового Орлеана. Там живы богатые традиции старого блюза, ритм-н-блюза и джаза.
    Обычно люди не раскладывают песни на стили и жанры в этом Великом музыкальном городе: почти вся эта традиция - и блюзовая,
    и ритм-н-блюзовая (и соуловая, конечно). У Сирила очень мощный и характерный голос - это прекрасно для современной блюзовой
    подачи. На диске играют его родные Невиллы (старшему брату Арту уже 73) и другие люди из Нового Орлеана: гитарист Tab
    Benois, гармонист Johnny Sansone...


    В программе - две вещи самого Джимми Рида, блюзовая версия песни Боба Марли + свои композиции. Звук отличный и современный
    - прекрасно подходит для этого живого микса блюза, соула и даже (местами) фанка. Проще назвать это новоорлеанским блюзом
    и ритм-н-блюзом, но не всегда это понятно для простого слушателя. Важно вот что: тут классный певец, обалденная ритмика
    и перкуссия, сам Папа Фанк Арт Невилл на органе, его племянник Иван тоже играет на клавишах; здесь бодрая атмосфера драйва,
    а вовсе не старческий блюз пенсионеров (хотя по возрасту они именно что динозавры и ветераны - Арт начал играть и записываться
    еще в середине 50-х).'
