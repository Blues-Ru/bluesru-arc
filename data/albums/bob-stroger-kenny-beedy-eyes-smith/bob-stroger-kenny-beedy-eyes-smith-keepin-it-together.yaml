  text: '"My name is Bob Stroger, they can call me any name they choose, well you can call me what you want to, but my real
    name is the blues..."


    Легендарный Bob Stroger и Kenny "Beedy Eyes" Smith давно знают друг друга как музыканты, но кроме того этот альбом, можно
    сказать - семейное дело. Kenny Smith продолжает дело своего отца - величайшего барабанщика чикагского блюза - Willie ''Big
    Eyes'' Smith, который в свою очередь играл на протяжении 20ти лет у Muddy Waters''а. А Bob и Willie провели бесконечно
    много времени играя музыку и просто общаясь вне сцены. Работа над альбомом позволила Кенни и Бобу делать то, что они умеют
    делать лучше всего - отдать должное блюзу и великим музыкантам, которые были до них. Чей дух ощущается и здесь - ясно
    и разборчиво.


    Предыдущий раз Kenny и Bob сотрудничали на альбоме Pinetop Perkins & ''Willie ''Big Eyes'' Smith - 2010 - Joined At The
    Hip, который получил в Грэмми в 2011 году. И сегодняшний альбом - это продолжение блюзовых традиций, способ их передачи
    от поколения к поколению.


    Bob Stroger - bass, vocals; Kenny "Beedy Eyes" Smith - drums, vocals; Barrelhouse Chuck - piano; Joe Filisko - harmonica
    Billy Flynn - guitar; Kevin Iles - guitar; Frank Krakowski - guitar; Brian Leach - bass; Jerry Portnoy - harmonica; Sam
    Burkhardt - saxophone


    Послушать можно тут https://vk.com/wall-13370755_3896


    P.S. Сегодня(27 декабря) Бобу исполняется 84 года, с чем вас и поздравляю!'
