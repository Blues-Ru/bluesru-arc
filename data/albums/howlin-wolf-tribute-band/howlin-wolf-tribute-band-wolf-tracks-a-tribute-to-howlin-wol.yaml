- id: 73
  author: Леонид Аускерн
  mark: null
  date: '2002-12-17'
  text: 'Этот проект был просто обязан рано или поздно появиться. Могу даже предположить, почему он появился скорее позже
    (через 22 года после смерти выдающегося мастера блюза Хаулин Вульфа), чем раньше. Слишком уж уникальным, штучным, неповторимым
    был его талант. Можно исполнить композиции, написанные Честером Барнеттом (Chester Burnett) - Вульф подписывал песни своего
    сочинения подлинным именем - можно похоже сыграть на гитаре или губной гармонике, но как быть с голосом?! Громадного роста
    110-килограммовый афроамериканец, напоминавший на сцене средних размеров бульдозер, пел так, "как будто постоянно полоскал
    горло битым стеклом" ( цитирую авторов "liner notes" Джеймса Сегреста и Марка Хоффмана). Чтобы достойно почтить память
    Хаулин Вульфа, надо просто дышать блюзом, как дышал блюзом он, ну а уж пытаться сымитировать его вокал - дело заведомо
    безнадежное. Многие помнят, наверное, как жалко выглядели попытки российских попсовых звезд, звездочек и просто звездной
    пыли исполнять песни Владимира Высоцкого на концерте, посвященном 60-летию со дн его рождения в начале 1998 года...


    <p>К счастью, за проект памяти Хаулин Вульфа взялись люди одного с ним цеха, и какие люди! Честь и слава продюсеру альбома
    Рэнди Лаббе (Randy Labbe), объединившему этой идеей блестящую когорту настоящих блюзменов. Основное ядро составили музыканты,
    ранее работавшие с Вульфом, - барабанщик Сэм Лэй (Sam Lay), бас-гитарист Калвин Джонс (Calvin Jones), пианист Генри Грей
    (Henry Gray), саксофонист Эдди Шоу (Eddie Shaw) и гитаристы Колин Линден (Colin Linden) и, конечно, Хьюберт Самлин (Hubert
    Sumlin) - человек, бывший самым любимым учеником Вульфа, к которому он питал почти сыновние чувства. Кроме того, на приглашение
    принять участие в проекте, откликнулись, нередко по первому зову, очень разные, не похожие друг на друга, но одинаково
    принадлежащие к блюзовым "сливкам" люди - Тадж Махал (Taj Mahal), Ронни Хоукинс (Ronnie Hawkins), Кенни Нил (Kenny Neal),
    Лаки Питерсон (Lucky Peterson) и многие другие музыканты.


    <p>Все 13 композиций, звучащих на диске, естественно, взяты из репертуара Хаулин Вульфа. Две трети написаны им самим,
    остальные - другим классиком, Вилли Диксоном (Willie Dixon). Это и рок-н-роллы, и буги, и, в первую очередь, блюзы. Конечно
    же, такая бригада блюзовых певцов превратила альбом в конкурс вокального блюза имени Хаулин Вульфа, и оценку этому конкурсу
    я, уж извините, могу дать только субъективную. Тадж Махал ("Saddle My Pony") и Кенни Нил ("The Red Rooster") больше удовольствия
    доставили не столько пением, сколько виртуозной игрой на гармонике и гитаре соответственно. Очень приятно выглядели певицы
    Дебби Дэвис (Debbie Davis) в "Ooh Baby/Hold Me" и Люсинда Уильямс (Lucinda Williams) в "Come To Me Baby". Пианист Генри
    Грей пением в "Smokestack Lightnin''" заставил поразмышлять о блюзовых истоках Джима Моррисона: это было очень похоже
    на некоторые вещи "Doors". Скрипучий голос и сардонический смех Ронни Хоукинса превратили "Back Door Man" в один из самых
    ярких моментов альбома. Но главной звездой для меня стал Эдди Шоу. Этот старый партнер Вульфа не только оказался ближе
    всего к нему по манере пения и соло в "Built For Comfort", и в дуэте с Кристиной Оллмэн (Christine Ohlman) в "Howlin''
    For My Darling", но буквально заворожил своими саксофонными партиями. Острое, с агрессивной атакой, какое-то "нутряное"
    звучание его инструмента стало, на мой взгляд, главным украшением этого изумительного альбома.


    <p>Очень точно "попали" в тональность проекта и обе помещенные в буклете статьи. Сегрест и Хоффман, авторы готовящейся
    к изданию биографии Вульфа, эскизно, но зримо нарисовали портрет блюзового гиганта. Продюсер Лаббе нашел очень теплые
    и очень личные штрихи для каждого из участников проекта, рассказывая, как шла работа над альбомом.


    <p>В который раз радуюсь, что у нас в "JAZZ-квадрате" не принято выставлять дискам оценку. Для "A Tribute To Howlin''
    Wolf" мне явно не хватило бы и пяти звездочек. Не удивлюсь, если этот CD появится в числе номинантов на очередную премию
    "Грэмми". Во всяком случае, в этом году я ничего более интересного в сфере блюза пока не слышал.'
- id: 406
  author: Дмитрий Казанцев
  mark: 4
  date: '2004-01-08'
  text: 'Необычный трибьют. На диске постоянно играют и поют участники группы Вулфа Хьюберт Самлин, Хенри Грэй и Сэм Лэй.
    Диск записан и выпущен фирмой Telarc.


    Очень неровный и скучный местами альбом. Ничего общего с яркими и искрометными записями самого Хаулина! Почему-то мало
    ярких гостей, и очень вялая и невнятная игра. Почему-то бывшие участники группы Вулфа и его друзья решили, что они хорошо
    поют, и спели аж полальбома! Каб Кода тоже поет! Может ему лучше писать рецензии?


    Самая плохая пластинка в моей блюзовой коллекции, пожалуй. Если бы не шикарные номера с Таж Махалом и Ронни Хокинсом,
    то альбом был бы полным кошмаром. Все же нужно звать ярких и интересных солистов (каким был сам Хаулин Вулф), а не заниматься
    самодеятельностью.'
