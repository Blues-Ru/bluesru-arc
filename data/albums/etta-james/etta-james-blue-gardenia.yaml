- id: 299
  author: Кирилл Мошков
  mark: 8
  date: '2003-12-01'
  text: 'Певица Этта Джеймс начала свою карьеру еще подростком в начале 50-х, а к началу 60-х, перебравшись в Чикаго из Калифорнии,
    уже обладала значительной популярностью, которая неимоверно выросла в следующие полтора десятилетия, пока она работала
    с филиалом легендарной блюзовой фирмы Chess Records. Неимоверно энергичная вокалистка, Этта Джеймс всегда обладала захватывающей
    дух блюзовой мощью и темпераментом, даже когда записывала более соул- или даже поп-ориентированные композиции. Тем не
    менее позиционировалась она, несмотря на стилистические колебания, именно как певица блюзовая, или в крайнем случае -
    ритм-н-блюзовая (в прежнем, до-Urban''овом понимании этого термина).


    И вот новый стилистический дрейф - к джазу: новейшая работа 63-летней Таинственной Леди логично продолжает направление,
    возникшее в ее работе с середины 90-х. Начать с того, что на новом альбоме она поет джазовые стандарты - от эллингтоновской
    "In My Solityde" до "Cry Me A River" Артура Хэмилтона, от "There Is No Greater Love" до аж "These Foolish Things". Нельзя
    не признать, что ее версии небезынтересны - хотя бы из чистого любопытства: как блюзовая "дива" может исполнить джазовую
    классику. Выясняется, что - именно так, как может исполнить блюзовая дива с огромным опытом и мощным темпераментом: сильно,
    уверенно, очень по-блюзовому - довольно монотонно и безо всяких там вокальных штучек и украшений. Она поет эти поп-шаблоны
    полувековой давности именно как блюзы, настойчиво-проникновенно, зачастую игнорируя прихотливые джазовые гармонические
    изгибы, которым следует записавшийся здесь чисто джазовый ансамбль (все аранжировки - знаменитого пианиста Седара Уолтона,
    он же играет и фортепианную партию). Кстати, это противоречие - блюзовой манеры вокального изложения и джазовой манеры
    изложения инструментального - особенно ярко проявляется именно в сочетании голоса Этты и фортепиано Уолтона, изощренно
    кудрявые мелодические арабески которого то и дело вступают в забавное противоречие с уверенной, корневой простотой вокала.


    Интересно, что запись делалась по самой современной технологии: все стопроцентно цифровое, 96 кГц, 24 бита, эффект-процессор
    - супердорогой System 6000 от T.C. Electronics, пульт и мультитрек-рекордер от Euphonix - и при этом звучит тепло, живо,
    выпукло и бархатно, убедительно демонстрируя наконец-то пришедшее слияние аналоговой и цифровой эстетик (запись и сведение
    - Джей Ньюлэнд, студия Conway, Лос-Анджелес).'
