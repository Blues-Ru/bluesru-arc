- id: 1391
  author: Андрей Евдокимов
  mark: 6
  date: '2008-12-29'
  text: "\"Блюзовая до мозга кости\" - альбом Этты Джеймс, составленный сплошь из\
    \ сотни раз игранных-переигранных блюзовых стандартов. Такое может себе позволить\
    \ только она одна. Исключительный голос – и можно не оглядываться на предшествовавшие\
    \ кавер-версии! За более чем полувековую карьеру Этта Джеймс свой талант делила\
    \ между музыкой соул, блюзом и джазом. Добилась \"Грэмми\" в каждой из этих категорий.\
    \ Но в последние годы она все строже ограничивает себя блюзовым квадратом. И из\
    \ серии недавних альбомов именно нынешний наиболее соответствует блюзовым канонам.\
    \ Ушли аранжировки студийных асов, пропали синтезаторы и скрипичные оркестры –\
    \ и зазвучал блюзбэнд во всей его подкупающей простоте. Ритм-секцию составляют\
    \ два сына солистки. Всего несколько лет назад их игра была не столь убедительна,\
    \ однако гастроли с мамой и, по совместительству \"Матриархом блюза\", определенно\
    \ хорошо закалили братьев. Сегодня ритм-секция звучит образцово. Джон Джюк Логан,\
    \ один из признанных на сегодня лидеров в игре на губной гармонике, приукрасил\
    \ этот простой и надежный ансамбль. Но в меру – во главе угла стоит прямолинейность\
    \ аранжировок и немногословность сольных выходов инструменталистов. В разных треках\
    \ состав аккомпаниаторов меняется – от септета до одного гитариста. Все строится\
    \ вокруг голоса, который достоин безраздельного внимания слушателя. \tИз дюжины\
    \ песен альбома только три старше самой исполнительницы. Большинство из них появились,\
    \ когда она уже блистала в ритмэндблюзовых чартах. Эти песни сегодня считаются\
    \ стопроцентной блюзовой классикой: \"Действует мой талисман\", \"Красный петушок\"\
    , \"Все в порядке\" - они все здесь! И мало кто из наших современников может исполнять\
    \ их, не испытывая священного трепета. А Этта Джеймс поет их вальяжно, почти с\
    \ ленцой. Это первый ее блюзовый альбом, где она полагается не на силу голоса,\
    \ а на бесконечное разнообразие вокальных нюансов. И, прежде всего, на совершенное\
    \ владение блюзовыми нотами. Когда в \"Плачут небеса\" она переходит со слов на\
    \ вокализ – это образец именно блюзового владения голосом. Но для такого мастера,\
    \ как Этта Джеймс, не демонстрация техники является главным. В прошлом году напористый,\
    \ мощный альбом \"Закрутим!\" принес ей \"Грэмми\" за лучший альбом современного\
    \ блюза. Ее нынешняя работа – блюз интимный, без нарочитости и форсажа, без украшательства,\
    \ зато он насыщен внутренним эмоциональным движением. Если вы хотите услышать,\
    \ как искренне свежо могут звучать старинные блюзовые темы – значит, Этта Джеймс\
    \ пела для вас. \tБлюз разнообразен в своих проявлениях. С чьей-то точки зрения,\
    \ новым альбомам ветеранов не хватает яркости и экспрессивности. Но определенно\
    \ они порадуют их давних приверженцев."
- id: 2029
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2012-01-31'
  text: 'Etta James - одна из великих мастеров старой школы, которая за годы своей
    долгой вокальной карьеры не только заработала 2 премии Грэмми и ряд номинаций,
    но также испытала себя в бесчисленном числе всевозможных стилей, и при этом она
    одинаково комфортно чувствовала себя и в годспел, и в соул, ритм-и-блюзе, джазе,
    поп-эстраде, и даже в рок-н-ролле, однако истоки ее таланта, бесспорно, в блюзе.
    При этом, поскольку она работала в таких различных музыкальных стилях, блюз в
    ее исполнении становится чем-то особенным. Голос ее с годами сталь глубже и грубее,
    и поэтому набор блюзовых стандартов, которые обычно записывались мужчинами-вокалистами,
    собранный и переработанный Эттой на диске Blues to the Bone, прозвучал особенно
    интересно. Она вдохнула новую жизнь в блюзовую классику, придав ей определенный
    женский шарм и долю страстности и интимности - и старые хиты вновь зазвучали по-современному!


    Вполне заслуженное 4 место в топе блюзовых альбомов Биллборда'
