  author: Константин Колесниченко
  mark: 8
  date: '2007-11-07'
  text: 'Я не очень люблю женский вокал, в том числе и в блюзе, но полностью оградить
    себя от этого не получается. Мой выбор - сборники.


    Насколько я знаю, дискография Этты Джеймс разнообразна - от соула до очень традиционныx
    блюзовыx альбомов или даже трибьют Billie Holiday. Для меня Этта - это рычащий,
    почти мужской вокал, потому этот сборник, демонстрирующий ее раннее творчество
    был для меня удивлением. Нежный, но сильный голос, где-то скрипичные аранжировки,
    где-то как у Сэма Кука - очень приятный соул, с примесью блюза. Единственным полноценным
    блюзом и, к сожалению, самым слабым местом на диске является песня Джимми Рида
    "Baby, What You Want Me to Do".'
