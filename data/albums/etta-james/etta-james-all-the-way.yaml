  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: Критики в большинстве недовольны. Вдруг – с тем же ансамблем музыкантов, с
    которым спокон нынешнего веку "матриарх" блюза выпускала блюзовые альбомы один
    другого горячей – она записала пестрое собрание эстрадных баллад. Не блюз, не
    соул, не джаз... И звучит так безоблачно. Но, может быть, пришла пора по-ленноновски
    "Воображать" со спокойной уверенностью, что рано или поздно, но так и будет?..
    От забытой темы блюзмена Джонни "Гитар" Уатсона до нетленной "Где-то" Бернастайна
    – пока вполне предсказуемо. Но Джеймс берет и "Что происходит?" Марвина Гея, и
    "Пурпурный дождь" Принца. И добавляет гитару-фламенко в старинный блюз Джеймса
    Брауна "Этот мир принадлежит мужчинам". Музыкальное мастерство, виртуозная скэтовая
    импровизация и это чувство уверенного оптимизма, чуть оттененного грустью, что
    мечты не торопятся стать реальностью, – завораживают внимающего слушателя. Он
    ждет еще трубу с сурдинкой? Так на, возьми ее скорей!
