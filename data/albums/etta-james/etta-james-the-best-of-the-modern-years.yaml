  author: Андрей Евдокимов
  mark: 8
  date: '2005-04-11'
  text: 'Ныне "Матриарх блюза", Этта Джеймс в своей полувековой музыкальной карьере не раз вступала в бой за успех: то с поветриями
    моды, то со своими человеческими слабостями. Но ее первоначальный успех был легким и стремительным, как взлет голубки.
    В 16 лет она обладала почти ангельской внешностью, а пухлые щечки принесли ей прозвище Персик. Внешность обманчива. Малышка
    пела со всей страстностью, которую позволял нарождающийся ритм-энд-блюз – а он позволял ой-ой-ой-как. Ей было 16 лет,
    когда песня Wallflower (aka Dance With Me Henry) вынесла ее имя на вторую позицию в чартах. Собственно, на концертах ангелок
    пел Roll With Me Henry, но для американских радиостанций 1955 года это было слишком рискованным предложением, и для сорокопятки
    избрали более общеприемлемый вариант названия. Компиляция из 18 песен, записанных для Modern, представляет собой первый
    период ее творчества, четыре года, связанных с этой лос-анджелесской фирмой. (В 1960г. ее контракт перекупили Chess, и
    ее лично стал опекать сам Вилли Диксон.) А в 1955г. на Modern ее привел Джонни Отис, весьма популярный в то время руководитель
    оркестра, он же сочинил для нее первые два хита. Отис был замечательным музыкантом и аранжировщикам, его сотрудничество
    с Джеймс оказалось на редкость удачным сочетанием большого опыта и молодого энтузиазма. Увы, союз был недолгим. И многим
    другим ее записям этого периода свойственна определенная небрежность и в аранжировках, и в исполнении. Однако пламенный,
    юный, задорный, когда надо - чистый, когда надо – хриплый - голос Джеймс искупает все недостатки. К тому же Blue Note,
    нынешние издатели этих песен, не зря трудились над ремастерингом.


