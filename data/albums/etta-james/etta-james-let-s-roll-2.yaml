  text: Вполне такой белый блюз-рок и ритм-н-блюз, местами совсем а-ля Роллинг Стоунз.
    Этта поет почти мужским голосом, в студии делает это она совсем неплохо (на концерте
    же годом ранее почти не могла петь). На этот раз Этта не исполняет известные рок
    и поп-хиты, весь материал новый. Почти все песни в бите, совсем нет фанка и почти
    нет классического соула. Можно даже сказать, что это рок-альбом Этты.
