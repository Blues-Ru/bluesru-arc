reviews:
- id: 122
  author: Алексей Калачев
  mark: 6
  date: '2003-05-29'
  text: Знаменитая певица НИКОГДА не делала настолько жестких пластинок. Сама она
    называет свой опус рок-н-роллом, что передает скорее степень драйва, чем присущую
    рок-н-роллу стилистику. В центре внимания мощный голос и работа двух гитаристов
    ее концертного ансамбля. Все это, помноженное на работу помпоподобной ритм-секции,
    состоящей из ее сыновей, дает первоклассный результат – жесткий современный блюз.
    Душевность альбома по этой причине сведена к разумному минимуму, зато работу для
    ног на танцах диск вполне может дать.
- id: 302
  author: Кирилл Мошков
  mark: 6
  date: '2003-12-01'
  text: 'Лучшие времена вокалистки Этты Джеймс - на седьмом-то десятке - несомненно,
    позади. Однако повидала она на своем веку немало - пела и блюз как таковой, и
    танцевальный ритм-н-блюз, и соул, и околоджазовую эстраду, и снова старый добрый
    блюз в самом что ни на есть электрическом варианте, и что самое главное - ничего
    из этого она не забыла. Так что, когда теперь она сама спродюсировала себе очередной
    альбом со своим Roots Band, крайне положительно зарекомендовавшим себя на некоторых
    ее записях последних лет, в стилистике не просто электрического блюза, а ОЧЕНЬ
    электрического блюз-рока во всех его разновидностях (old-time R''n''R, Texan boogie,
    Chicago R''n''B и т.д.), она остается по крайней мере убедительной - да что там,
    вполне убедительной. В конце концов, в гитарном блюз-роке последних тридцати лет
    немного найдется таких вокалисток - умудренных колоссальным опытом, знающих блюз
    во всех его разновидностях, что называется, right down the pocket, и при этом
    столь эмоциональных, временами просто страстных, с таким грубоватым, сырым, "продымленным"
    голосом, да еще осененных такой славой, как Этта, в настоящее время остающаяся
    едва ли не последней активной вокалисткой своего поколения. Что с того, что она,
    как и в молодости, пренебрегает чрезмерно мелкими, по ее мнению, деталями и то
    и дело спрямляет мелодические закавыки? Она все равно остается собой: особой гибкостью
    вокала она и в молодости не отличалась, а след пронесшихся десятилетий, в отличие
    от столь многих ее коллег, только прибавил ее голосу оттенок Настоящего Опыта.'
- id: 2028
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2012-01-31'
  text: 'Легендарная Этта Джеймс, которой на момент выхода альбома исполнилось 65,
    невзирая на возраст записала альбом энергичного блюз-рока. Ей аккомпанирует ее
    группа Roots Band, где ритм-секцию составляют ее сыновья, а аранжировками занимался
    талантливый гитарист Джош Скляр. Конечно, на альбоме нашлось место и для "коронного"
    для Этты стиля соул, но все-таки это довольно нехарактерный для нее "тяжелый"
    альбом в стиле Роллингов, чем он и интересен. Лишнее свидетельство того, что настоящий
    профессионал может работать в любом стиле, что Этта уже неоднократно демонстрировала
    ранее. В качестве продюсера выступила сама Этта Джеймс.


    Чрезвычайно достойный альбом и заслуженное первое место в топе блюзовых альбомов
    Биллборда.'
