  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2012-01-31'
  text: 'Альбом каверов, причем выбор некоторых песен довольно неожиданный (например, Miss You или Hound Dog). В музыкальном
    отношении не столько блюз, сколько соул с блюзовыми и джазовыми оттенками. Сыграно профессионально, но без изюминки.


    Тем не менее второе место в блюзовом топе альбомов Биллборда.'
