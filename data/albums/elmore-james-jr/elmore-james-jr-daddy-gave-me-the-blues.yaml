- id: 1315
  author: Андрей Евдокимов
  mark: 5
  date: '2008-07-19'
  text: 'Дети "звезд" рано или поздно появляются на публике в качестве продолжателей "дела отцов". Дети блюзовых "звезд" не
    исключение. И 69-летний Элмор Джеймс-младший наконец-то выдал свой дебютный альбом. Голос блюзовый – спору нет! Явно прошел
    долгую практику выступлений в прокуренных и шумных блюз-клубах. Название альбома обещает продолжение традиций элморовского
    буравящего слайда – но его-то и нет… Джеймсу-младшему, не смотря на почтенный возраст, доверили сыграть гитарное соло
    только в трех песнях. И хотя играет он не столь искусно, сколь троица рекрутированных в студию гитаристов, зато у него
    есть свой почерк. Альбом всем хорош: нужный саунд, точная игра группы… Огонька только не хватает, а расчетливости - переизбыток.
    Если бы не заботливый продюсер, альбом получился бы безыскусней, грубей и – беззаботней.'
