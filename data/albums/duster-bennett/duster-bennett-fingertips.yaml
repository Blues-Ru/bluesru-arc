  author: Сергей Исправников
  mark: null
  date: '2008-04-19'
  text: 'На диске издан последний альбом легенды британского блюза – Дастера Беннета,
    ранее выходивший только на виниле, причем в Австралии. На этом диске Дастер окончательно
    отошел от амплуа "человек-оркестр", благодаря которому он приобрел первоначальную
    известность на британской клубной сцене второй половины 60-х гг. Осенью 1970 г.,
    когда была закончена запись его предыдущего диска "12db''s" (Blue Horizon 7-63868),
    у Дастера на повестке дня встал вопрос о формировании собственной постоянной концертной
    группы. Первая кандидатура была – его близкий друг, гитарист Top Topham, однако
    в конце года Topham был вынужден лечь в клинику лечиться от гепатита B, тут уж
    было не до выступлений. С остальными подобранными Дастером музыкантами тоже начались
    проблемы: у клавишника оказалась героиновая зависимость, гитарист толком не умел
    играть и т.п. На фоне этих проблем работа над новым материалом началась только
    в 1972г., когда стали намечаться контуры нового альбома, запись которого началась
    в Лондоне весной следующего года и с перерывами проходила в нескольких студиях.


    В записи альбома приняли участие большое количество сессионных музыкантов, наиболее
    известными из которых были пианист Nicky Hopkins (играл со всеми великими - "Rolling
    Stones", "Beatles", группой Джеффа Бека и т.д.), гитарист Peter Frampton (одна
    из звезд т.н. "арена-рока" 70-х гг.) и басист Boz Burrell (участник "King Crimson",
    группы "Snape" Алексиса Корнера, основатель легенды хард-рока 70-х гг. – группы
    "Bad Company"). В окончательный вариант альбома вошли девять композиций, причем
    по стилистике диск делится на две части – соул-фанковую и собственно блюзовую.
    В основном, это был авторский материал Дастера, отражающий эволюцию его творчества
    и музыкальных пристрастий. Из кавер-версий необходимо отметить заглавную "Fingertips"
    Стиви Уандера, украшенную проникновенным соло Дастера на губной гармонике и творчески
    переработанную гершвиновскую "Summertime". В итоге получился очень светлый и теплый
    альбом, однако ни одна из британских фирм звукозаписи не проявила к нему интереса.
    В конце концов, при поддержке Алексиса Корнера диск удалось издать на малоизвестном
    автралийском лейбле "Toadstool". В связи с этим Дастер дважды ездил в Австралию
    на гастроли, чтобы поддержать продажи альбома.


    Что касается шести бонус-треков, помещенных на этот компакт-диск, то они включают
    сингловые номера, а также не издававшийся материал. Среди них особенно выделяются
    кавер-версия "Cold Chills" Сонни Боя Уильямсона и нежная лирическая баланда "Everyday"
    самого Дастера. Последний трек ранее был записан для "Blue Horizon", однако здесь
    он был перезаписан в новой аранжировке со струнным оркестром. Помещенное на обложку
    альбома фото было сделано в сельской местности в Сюррее, на нем запечатлен напоминающий
    фермера улыбающийся Дастер. Как написал в буклете к данному диску гитарист Keith
    Randall: "Я помню Тони "Дастера" Беннета как человека редких душевных качеств;
    как человека, безмерно счастливого быть мужем и отцом; как человека, дорожившего
    своими друзьями, как будто они были его братья и сестры, – и (я тщательно выбираю
    слова) как великого музыканта".'
