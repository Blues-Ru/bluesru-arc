  author: Сергей Исправников
  mark: null
  date: '2007-11-03'
  text: 'В этом двухдисковом издании впервые в формате CD были изданы три из четырех номерных альбомов полузабытой ныне звезды
    британского блюза – Дастера Беннета. Западные музыкальные обозреватели иначе, чем историческим событием этот релиз не
    называли, а среди откликов рядовых любителей блюза можно было встретить, что "я больше двадцати лет ждал этого момента,
    и вот оно свершилось". Чем же, собственно говоря, так интересен Дастер Беннет? В первую очередь, он был настоящим человеком-оркестром,
    одновременно играя на гитаре, губной гармонике и ударных и, кроме того, владел еще множеством самых разных инструментов.
    Во-вторых, и это, пожалуй, самое главное, у него было поразительное для белого музыканта чувство блюза. А в третьих, по
    воспоминаниям современников, он был очень душевным, светлым и радостным человеком, и эти качества в полной мере прослеживаются
    в его творчестве.


    Шефу Blue Horizon Майку Вернону Дастера порекомендовал не кто иной, как Питер Грин. Прослушав демо-запись и посетив клубное
    выступление Беннета, Вернон пришел в полный восторг, и список выпускаемых им исполнителей пополнился еще одним именем.
    Первый сеанс звукозаписи прошел в апреле-мае 1968 г., когда была записана авторская композиция Дастера "Hard to Resist",
    открывающая данное издание. Несмотря на то, что эта вещь в полной мере демонстрирует фирменный стиль Дастера, издана она
    не была. Для дебютного сингла были выбраны знакомая публике "It''s A Man Down There" Сонни Боя Уильямсона и написанная
    в более традиционном ключе "Things Are Changing" самого Дастера. Несмотря на качество материала и безупречность исполнения,
    сингл коммерческого успеха не имел.


    Дебютный альбом Дастера Беннета "Smiling Like I''m Happy" (Blue Horizon 7-63208) содержал двенадцать треков, на восьми
    из которых Дастер выступил сольно, одновременно играя на гитаре, губной гармонике и ударных и исполняя вокальные партии.
    На двух композициях им были отдельно записаны фортепьянные партии, причем на альбоме был указан псевдоним – Ham Richmond.
    На остальных треках он был поддержан участниками "Fleetwood Mac": Питером Грином (гитара), Джоном МакВи (бас) и Миком
    Флитвудом (ударные). Большая часть композиций альбома была написана самим Дастером, в чьем авторском стиле блюз-роковая
    составляющая органично сочеталась с фолковыми мотивами. Основной идеей диска было адекватно отразить в условиях профессиональной
    студии непосредственность клубных выступлений Дастера, поэтому запись велась максимально в живую. Изданный во второй половине
    1968 г. альбом был тепло встречен публикой и достаточно хорошо продавался.


    Для поддержания интереса публики к фигуре Дастера Беннета в декабре того же года прошла запись его второго сингла. На
    этот раз в студии его поддержали музыканты "Chicken Shack" – Andy Silvester (бас) и Dave Bidwell (ударные). Для записи
    была выбрана классика Слима Харпо "Raining In My Heart" и драйвовая композиция самого Дастера "Jumpin'' For Joy". Изданный
    17 января 1969 г., сингл удостоился всего нескольких рецензий и довольно быстро исчез из плей-листов радиостанций, что
    лишний раз подтвердило некоммерческий характер творчества Дастера.


    Исходя из этого, Майк Вернон, ориентируясь, в первую очередь, на поклонников Дастера, на его следующем альбоме решил записать
    клубный концерт. Запись состоялась на выступлении Дастера 15 апреля 1969 г. в "Angel Hotel" в графстве Сюррей. Десять
    из записанных тогда композиций были изданы на альбоме "Bright Lights…" (Blue Horizon 7-63221), а заключительный "Fresh
    Country Jam" – на сингле. Дастер был в приподнятом состоянии духа и выступал с большим энтузиазмом, что чувствуется как
    по характеру его исполнения, так и по ответной реакции публики. Как обычно, он выступал в формате "one-man band", только
    одну композицию – "Talk To Me" – исполнив вместе со своей будущей женой Стеллой при поддержке своих друзей, Питера Грина
    и Тони Топхэма. Запись оказалась не идеальной по чистоте исполнения, зато великолепно передавала концертную энергетику
    Дастера, являясь своеобразным документом эпохи. Впоследствии Майк Вернон жалел, что увлекшись необычным характером выступлений
    Дастера, уделял ему недостаточно внимания именно как автору. Но из песни слов не выкинешь, а из альбома подавно, так или
    иначе, но на диске оказалось мало его собственных вещей, в основном, были записаны кавер-версии.


    Однако уже через месяц, 6 мая 1969 г., в студии им были записаны три новые авторские композиции, знаменующие новый этап
    в развитии его творчества. На одной из них, впоследствии изданной на сингле "I''m Gonna Wind Up Ending Up Or I''m Gonna
    End Up Winding You Up With You", помимо своего традиционного набора из гитары, гармоники и ударных, Дастер сыграл на фортепьяно,
    гармониуме, челесте, бас-гитаре и перкуссии. Майк Вернон был просто поражен результатом, считая эту композицию лучшей
    из когда-либо записанных Дастером. На сингл вошел записанный тогда же традиционный блюз "Rock of Ages Cleft For Me" в
    аранжировке Дастера, исполненный им слайдом на акустической гитаре.


    Казалось, намечается сильный материал на третий альбом, к записи которого Майк Вернон был готов немедленно приступить,
    но тут вмешались обстоятельства. К этому времени Дастера под свое крыло взял менеджер "Fleetwood Mac" Клифтон Дэйвис.
    В этом были как свои плюсы, так и минусы. С одной стороны, количество выступлений Дастера резко возросло, но с другой
    стороны, времени на творчество и полноценную студийную работу не хватало. Поэтому запись третьего диска Дастера "12db''s"
    (Blue Horizon 7-63868) проходила урывками и растянулась на четырнадцать месяцев вплоть до сентября 1970 г. Двенадцать
    из записанных в этот период студийных композиций вошли в альбом, еще две были изданы на синглах.


    В результате, альбом получился очень эклектичным и в какой-то мере экспериментальным. Здесь Дастер решил выйти за рамки
    формата двух своих предыдущих альбомов и концертных выступлений, где на него порой смотрели как на экспонат кунсткамеры,
    расширив звучание за счет использования новых инструментов и малых составов, включавших таких музыкантов, как "Top" Topham
    (гитара), Tony Miles (бас), Johnny Almond (орган / тенор-саксофон), John Cloury и Kenny Lamb (ударные). Подавляющее большинство
    новых композиций, были написаны самим Дастером. Среди них особенно выделяются два инструментала – фолк-блюзовый "Sugar
    Beat" и исполненный на мандолине "Hill St. Rag". Необычная для Дастера джазовая составляющая присутствует в "Sweeter Than
    Sugar", характерной скорее для Алексиса Корнера. Новыми были и лирические композиции "Everyday" и "Woman Without Love".
    Также необычным была и исполненная Дастером версия боевика "The Kinks" – "Act Nice and Gentle". Вместе с этим, основу
    альбома составлял именно блюз, в исполнении которого на первый план помимо энтузиазма и энергетики выходил технический
    профессионализм музыкантов.


    Все было хорошо, однако продолжения не последовало. В это время дистрибьюция дисков Blue Horizon перешла от CBS к Polydor,
    и начались проблемы. Джон Мэйэлл, издававшийся на Polydor, с которым на концертах выступал Дастер, хотел привлечь его
    в свою группу на постоянной основе. Дастер, в свою очередь, заявил ему, что не желает разрывать отношения с Blue Horizon,
    с которой имеет эксклюзивный контракт. Майк Вернон предложил компромиссный вариант, согласившись на запись Дастера в составе
    группы Мэйэлла, одновременно оставляя право выпускать его как сольного исполнителя. Однако договоренность достигнута не
    была. В результате, Дастер как не присоединился к Мэйэллу, так больше никогда и не записывался на Blue Horizon. В любом
    случае, этот незаурядный автор и исполнитель оставил яркий след в истории как британского блюза, так и выпускающей его
    компании, по словам Майка Вернона, внеся значительный вклад в ее самоидентификацию на рынке звукозаписи. Остается добавить,
    что Дастер погиб в автокатастрофе в марте 1976 г., годом ранее успев выпустить еще один студийный альбом "Fingertips"
    на австралийском лейбле Toadstool.'
