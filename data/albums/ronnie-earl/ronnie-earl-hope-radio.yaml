- id: 1216
  author: Андрей Евдокимов
  mark: 8
  date: '2008-02-20'
  text: Из-за многочисленных проблем со здоровьем он не может гастролировать и для
    нового альбома предпочел организовать в студии концерт перед небольшой аудиторией,
    чтобы почувствовать живой контакт со слушателем. Выступление получилось изысканным
    по исполнению и глубоко эмоциональным по существу. Ирл впервые обошелся без гостевых
    выступлений вокалистов. Сочетание продуманной композиции со спонтанностью импровизаций,
    и огромный арсенал исполнительских приемов позволяет ему удерживать внимание публики
    и общаться с ней без слов. В музыке достаточно много джазовых элементов, но основа
    везде чисто блюзовая. Гитара рыдает, нашептывает, рассказывает… Создается атмосфера
    полной откровенности и интимной доверительности, к которой Ронни Ирл шел на протяжении
    всего последнего десятилетия. (Альбом выпущен как аудио-CD и видео-DVD).
- id: 1762
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-24'
  text: '"...he is one of the most serious blues guitarists you can find today. He
    makes me proud!" ...B.B. King


    "Ronnie Earl''s ability to channel the very essence of jazz and blues is magical.
    Hope Radio provides another welcome testament to his extraordinary gift. Ronnie''s
    signature tone, intensity and boundless emotional depth remain his alone." - David
    Wilson, The ToneQuest Report


    Чисто инструментальный альбом, записанный "живьем в студии" 21 и 22 апреля 2007
    года в компании приглашенных друзей и поклонников - если угодно, это "классический"
    Эрл, объединяющий блюзовые структуры с джазовой импровизацией, создавая тем самым
    какую-то свою межстилевую музыку. Музыка рождалась на месте и была записана так
    же, как и сыграна: спонтанно, вживую, без наложений и без купюр.


    Все музыканты играют отлично, внося свой вклад в конечный продукт. Стратокастер
    Ронни как обычно способен выразить обширную палитру эмоций, ему легко подчиняется
    широкий динамический диапазон. При этом гитаристу не требуется играть с сумасшедшей
    скоростью, форсировать звук или увеличивать до предела громкость, как это делают
    многие современные музыканты. Ронни давно уже освоил все приемы извлечения звука
    и понял, что главное - это музыка, а гитарная техника - только способ ее создания
    и выражения. Ронни - один из немногих музыкантов, который своей игрой воистину
    создает эту музыку и может выразить эмоции звуками своего инструмента.


    Творчество Ронни лучше всего характеризуют его собственные слова: "Для меня это
    - как пить воду... Это мой способ коммуникации с миром." Лучше, пожалуй, и не
    скажешь.


    Ронни посвятил этот диск своему учителю и другу Роберту Локвуду, а также другому
    блюзмену и близкому другу - Отису Рашу. По мнению Ронни, Отис Раш и Роберт Локвуд
    младший - два величайших артиста всех времен, в одном ряду с Эллингтоном, Бэйси,
    Трэйном, Билли Холлидэй, Стиви Уондером и Аретой.'
