  text: '"The magic of music unifies us all and lets us remember what we all have
    in common and allows us to forget the few small differences we may have."


    - Jim Mouradian. on New England Music Awards, 4-9-16


    "A traditional blues album of remembrance, love, and unwavering resolve to live
    with faith and gratitude."


    - Ronnie Earl


    Ронни Эрл - троекратный обладатель блюзовой премии "лучшему гитаристу года", победитель
    в категории "блюзовый альбом года" журнала Downbeat, профессор по классу гитары
    музыкального колледжа в Беркли и просто великий музыкант. Свой 25-й сольный альбом
    он посвятил бас-гитаристу Бродкастеров Джиму Мурадяну, который скоропостижно скончался
    от сердечного приступа в январе этого года после концерта. Диск получил название
    по любимой фразе Джима: "I''m the luckiest man you know - and I don''t even know
    who you know" (Я - самый счастливый человек из тех, кого Вы знаете - и я даже
    не знаю, кого именно Вы знаете). Мурадян умел радоваться жизни и воспринимал каждый
    новый день как подарок. Ронни характеризовал этот диск как "Традиционный блюзовый
    альбом о воспоминаниях, любви и твердой решимости жить с верой и благодарностью".


    Памяти ушедшего друга Ронни посвятил песню Jim''s Song - атмосферную пьесу для
    одной акустической гитары. Композиций Ронни на альбоме четыре, да плюс одна авторская
    переработка традиционного блюза Howlin'' Blues - все эти треки инструментальные.
    Для записи трека "Long Lost Conversation" в июне 2017 года были приглашены участники
    оригинального состава 1977 года группы Sugar Ray & the Bluetones, в которой тогда
    играл на гитаре молодой Ронни Хорват. В этом реюнионе через 40 лет также принял
    участи сегодняшний гитарист Bluetones Майк Уэлч. На остальных треках играют Броадкастеры
    в следующем составе: Дайана Блю (вокал), Дэйв Лимина (фортепиано и орган), Форрест
    Паджетт (ударные) и Поль Кочански (бас). Помогают при записи гитаристы Николас
    Табариас и Питер Уорд, а также саксофонисты Марк Эрли и Марио Перретт.


    Продюсировал диск сам маэстро, исполнительный продюсер - Холгер Петерсен. Роскошную
    обложку альбома создал художник Том Нолл, который назвал эту работу "Трансцендентальность".


    Альбом в лучших традициях Ронни - эмоциональный, грустный и светлый. Качество
    музыки, исполнения и записи как обычно на высоте. Пожалуй, этот альбом недотягивает
    до уровня предыдущего отличного Maxwell Street, но в целом очень хорошо.'
