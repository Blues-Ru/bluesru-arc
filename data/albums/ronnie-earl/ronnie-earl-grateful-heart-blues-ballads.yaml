  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2011-05-24'
  text: 'Ронни Эрл - великий музыкант и огромный талантище, общепризнанный профессионалами
    современный классик. По мастерству владения инструментом и композиторскому дару
    фигура не меньшего масштаба, чем, скажем, Клэптон или Грин - а может, и бОльшего
    - в силу специфики исполняемой им музыки. Белый блюз и блюз-рок, в которых корифеи
    Клэптон, Грин и некоторые другие - более коммерческая и доходчивая музыка, да
    еще и с вокалом (как правило). На долю импровизации остается только соло - да
    и то в основном на концерте.


    Ронни играет импровизационную смесь джаза и соул на блюзовой основе, причем практически
    полностью инструментальную, и на долю импровизации приходится гораздо больше -
    многие пластинки он записывает с одного-двух дублей, музыка рождается прямо на
    месте (что характерно для джаза, который всегда был более сложной музыкальной
    формой). Так что тут своего рода случай блюзового фьюжна - музыкант берет лучшее
    от нескольких стилей, объединяет их, создавая свою внестилевую музыку. В силу
    отсутствия вокала все эмоции и чувства он передает своей игрой, и делает это мастерски.


    Но поскольку музыка такого рода подразумевает некоторую подготовленность слушателя,
    круг поклонников Ронни не столь велик, как у других грандов, но уж если в его
    музыку "въедешь", оторваться будет трудно.


    Очередной классический инструментальный альбом от Ронни и его "золотого" состава
    Бродкастеров, усиленных известным саксофонистом Дэвидом Ньюманом по прозвищу Fathead.
    Уникальная смесь блюза, джаза, соул и свинга с виртуозной игрой всех музыкантов
    длительностью 76 минут обеспечила автору 7 место в блюзовом топе Биллборда. Ронни
    посвятил этот альбом музыкантам, оказавшим на него особое влияние: Рональду Кирку,
    Джону Колтрейну и Дуэйну Аллману, а также Дэвиду Ньюману.


    Великолепная пластинка для тех, кто любит расслабленный неторопливый инструментальный
    блюз с джазовой основой :-)'
