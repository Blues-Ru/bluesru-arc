  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-24'
  text: '"Perhaps the finest living blues guitarist on the planet." ~ The Boston Phoenix


    Второй после Still River практически полностью инструментальный альбом "золотого" периода творчества Ронни Эрла в сопровождении
    классического состава Бродкастеров. На трех треках присутствует помощь в лице приглашенных гостей, но основную нагрузку
    несет четверка музыкантов.


    Высокопрофессиональный импровизационный приджазованный блюз с роскошной гитарой Ронни, красивыми клавишами Брюса и уверенной
    ритм-секцией Рода и Пера. За использование всего динамического диапазона и умение своей игрой выразить эмоции можно поставить
    памятник. Отличный альбом от великих музыкантов!


    (Кстати, заинтересованные товарищи могут сравнить различную интерпретацию трех треков на этом альбоме и через 13 лет на
    альбоме Hope Radio.)'
