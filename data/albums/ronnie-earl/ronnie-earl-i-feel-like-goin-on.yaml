reviews:
- id: 143
  author: Алексей Калачев
  mark: 6
  date: '2003-08-15'
  text: Самый темпераментный и "простой" альбом Ерла, вероятно, с середины 90-х - с его концертного диска. Хотя на нем есть
    и медленные номера, с первой же композиции Ронни дает понять, что он предлагает на этот раз – жесткий, тяжелый, атакующий
    инструментальный блюз (лишь один певческий номер с госпел-группой). Камерные, хрустальные, как написал о них один из респондентов
    программы "Блюзология", работы последних лет создали Ронни целый легион поклонников, культ. Боюсь, в массе его слушатели,
    привыкшие к такому звуку, будут несколько разочарованы диском. Хотя, объективно говоря, он хорош и целен.
- id: 1758
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-24'
  text: 'Записанный после определенного перерыва, данный диск несколько отличается от того, что было раньше (да и от того,
    что стало позже). Хорошо это или плохо? Я думаю, в отношении Ронни Эрла такой вопрос неуместен - уже на протяжении нескольких
    десятков лет его работы по определению соответствуют понятию "хорошо", чаще приближаясь к "отлично". Этот диск просто
    другой - более динамичный, чуть более жесткий, чуть менее джазовый, чуть более блюз-роковый. Тут уж каждый слушатель сам
    решит, насколько ему это интересно. Однако профессионализм исполнителя и композитора не вызывает никаких сомнений. Сам
    Ронни считал этот диск лучшим из всех своих предыдущих студийных работ.


    Диск стал дебютной работой Ронни для лейбла Stony Plain и занял одиннадцатое место в топе блюзовых альбомов Биллборда.
    В начале 2004 года на третьей ежегодной церемонии вручения премий независимой музыки композиция Hey Jose была названа
    лучшей в стиле блюз/ритм-и-блюз.'
