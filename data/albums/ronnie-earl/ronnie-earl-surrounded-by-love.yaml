  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-24'
  text: 'Последний из сольных альбомов Ронни, записанных им для фирмы Black Top. Аккомпанирует
    звездный состав Бродкастеров с харпером Шугар Рэем Норсиа у микрофона, Майклом
    Уордом на басу, Пером Хансоном на ударных, Тони Заманьи на органе и Дэйвом Максвеллом
    на фортепиано. В качестве гостя на трех треках отметился легендарный блюзмен Роберт
    Локвуд младший, который, как оказалось, не только был примером для подражания
    у Ронни Эрла, но и сам считал Ронни одним из своих любимых гитаристов всех времен
    и народов!


    Вокальных треков и инструменталов на диске примерно поровну, поют Шугар Рэй и
    Роберт Локвуд (на двух треках). Постепенно число инструментальной музыки в альбомах
    Ронни увеличивается, и это не может не радовать! В музыкальном плане это блюз
    с примесью соул и немножко джаза. Все сыграно профессионально, есть отличные соло
    как от Ронни, так и от Дэйва, да и вклад Роберта Локвуда интересен, но в целом
    как-то без изюминки. Диск качественный, но среднестатистический для такого мастера,
    как Ронни Эрл.'
