  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-24'
  text: 'Ronnie Earl, Pinetop Perkins, Calvin Jones, Willie Smith - Eye to Eye (1996)


    Очередной all-star проект Ронни Эрла на Аудиоквесте с участием Willie "Pinetop" Perkins, Calvin "Fuzz" Jones, Willie "Big
    Eyes" Smith, а также Брюса Каца. Результирующий состав представляет своего рода объединение лучших музыкантов группы Мадди
    Уотерса (выступавших после его смерти под именем The Legendary Blues Band) с Ронни и его лучшим Broadcaster''ом и мастером
    блюзового Хаммонда В3. Другими словами, это cream of the cream или лучшие из лучших в блюзе. Естественно, такие музыканты
    знают, как играть блюз, и записанный как обычно без наложений данный альбом традиционного блюза наглядно это иллюстрирует.
    Запись живьем не дает возможности наложений, поэтому на ряде треков пришлось прибегнуть к помощи дополнительных гитаристов
    - Тони Левиса (Anna Lee) и Хосе Алвареса (I Woke Up this Morning и Shake For Me). В качестве особого гостя на гармонике
    отметился знаменитый Джон Себастиан (Take It Easy Baby).


    От такого звездного состава я ждал большего - мне кажется, на этой пластинке музыканты слегка зажаты, звук чуть суховат,
    в общем - чего-то нехватает. Но, возможно, я уж слишком придираюсь :-)'
