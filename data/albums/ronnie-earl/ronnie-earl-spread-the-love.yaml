- id: 1666
  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2011-05-11'
  text: 'Новый альбом блюзового виртуоза был записан всего за три дня - 8, 9 января и 10 марта 2010 года, вышел 24 августа
    и сразу дебютировал на шестом месте в блюзовом топе альбомов Биллборда. Ронни написал 9 из 14 треков (частично в соавторстве)
    и выступил в качестве продюсера альбома.


    Альбом ознаменовал своего рода возвращение к "золотому" рецепту лучших альбомов Ронни, записанных в середине 90-х: это
    полностью инструментальный альбом приджазованного блюза, сыгранный эмоционально с огромным чувством и мастерством. Как
    обычно, Ронни использует блестящую технику игры для того, чтобы выразить свои чувства и передать настроение. Нельзя также
    не отметить и прекрасную игру сопровождающего состава Бродкастеров, включая клавишника Дэвида Лумина, написавшего один
    из треков альбома. Отличный альбом от настоящего мастера!'
