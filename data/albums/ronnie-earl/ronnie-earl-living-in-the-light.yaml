- id: 1763
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-24'
  text: 'Новый альбом Ронни Эрла - это всегда праздник для любителей профессионально исполненного приджазованного блюза. И
    этот диск не стал исключением, хотя на нем относительно велик процент вокальных треков - целых 5. Если честно, для меня
    вокальные треки на альбомах Ронни - своего рода экзотика, поскольку он своей гитарой может выразить практически любую
    эмоцию, и вокал для этого не требуется!


    Инструменталы, как всегда, просто великолепны, а вот из вокальных треков меня не сильно затронули первый и пятый (с госпел-хором),
    хотя и в них есть прекрасные инструментальные куски. Но поскольку продолжительность диска почти 80 минут, даже после удаления
    этих двух треков остается более часа прекрасной музыки.


    Музыканты группы играют прекрасно, им помогают на отдельных треках Ким Уилсон (гармоника и вокал), Дэйв Максвелл (фортепиано)
    и ветеран-Бродкастер Род Кэри (бас). Гитара Ронни по-прежнему неподражаема, а соло техничны и оригинальны (а какая под
    занавес "Пастораль"- ну просто сказка :-)). Очень хороший альбом от великого музыканта и четвертое место в блюзовом топе
    альбомов Биллборда.'
