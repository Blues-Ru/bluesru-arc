  text: '"Ronnie Earl is an incredible musician. He plays with more emotion than anyone
    else who plays blues, or really anything, today, and he gets me every time I hear
    him. The Broadcasters are the quality of musicians you would expect Ronnie to
    be playing with: solid, tasteful, and moving. You can''t be better than that."
    - David Bromberg


    "He has honed a leather and lace delivery and deep appreciation of life that he
    expresses with finesse in live performance and recordings. This one is no different.
    He weaves through 15 songs here with a brain surgeon''s precision." - Don Wilcock,
    Blues Music Magazine


    "Ronnie Earl''s stirring bell tone rings with intense fire and the subtle touch
    of a man with infinite depth to his soul. He''s a blues guitarist at the top of
    the heap, and on "Beyond the Blue Door," he''s very much still on top of his game."
    - Tom Clarke, Tahoe Onstage


    Ронни Эрл четырежды получал блюзовую премию "лучшему гитаристу года", он победитель
    в категории "блюзовый альбом года" журнала Downbeat, профессор по классу гитары
    музыкального колледжа в Беркли и просто великий музыкант. Behind the Blue Door
    - 26-й сольный альбом блюзового маэстро, записанный с проверенным составом Бродкастеров
    с Дайаной Блю у микрофона (этим же составом был записан и предыдущий альбом The
    Luckiest Man). С такими отменными музыкантами да плюс целый ряд приглашенных гостей
    результат предсказуемо интересен. Сам Ронни высказался по поводу этой работы следующим
    образом: "Этот альбом - совместная работа группы как сообщества родственных душ
    с приглашением некоторых гостей, в которой есть и отдельные новые направления,
    и старый добрый традиционный блюз с Кимом Уилсоном, Дэвидом Бромбергом и Грегом
    Пикколо".


    В записи альбома принимали участие многочисленные гости, включая старого коллегу
    Ронни по Roomful of Blues Грега Пикколо (его тенор саксофон украшает треки 3,
    4, 7 и 13), знаменитого харпера и певца Кима Уилсона (вокал и гармоника на треках
    2, 9 плюс гармоника на импровизации на тему Smokestack Lightning Хаулин Вулфа),
    Дэвид Бромберг (вокал и акустическая гитара на кавере Боба Дилана), Энтони Герачи
    (фортепиано на треках 2 и 11), Питер Уорд (гитара на треках 2, 5 и 11). Продюсировал
    диск сам маэстро, исполнительный продюсер - Холгер Петерсен.. Половина треков
    написана лично Эрлом (часть в соавторстве с Броадкастерами) или членами его группы,
    остальное - каверы.


    Как обычно у Ронни, итоговый продукт стилистически представляет собой пропитанный
    эмоциями блюзово-джазовый фьюжн с изрядной примесью соул, отменно исполненный
    высокопрофессиональными музыкантами. В лучших традициях пять треков инструментальных,
    остальные - с вокалом (один поет Дэвид Бромберг, два - Ким Уилсон, остальные -
    Дайана Блю). В целом альбом удался, но хочу отметить следующие несколько моментов,
    которые не позволяют ему оказаться на одном уровне с парой предыдущих дисков:


    - такое впечатление, что на некоторых треках Ронни просто накладывал гитару на
    уже полностью готовый трек Бродкастеров, и поэтому временами кажется, что Ронни
    сам по себе, а Бродкастеры тоже сами по себе


    - на ряде треков гитара Ронни звучит слишком громко в общем миксе


    - не могу сказать, что порядок треков на диске является оптимальным: на мой взгляд,
    наиболее интересные треки находятся в середине и второй половине альбома, тогда
    как два не слишком интересных дуэта оказались в его первой половине. Я бы выделил
    следующие треки: отменная Drown In My Own Tears, прекрасная A Soul That''s Been
    Abused, три очень достойных кавера (Why Can''t We Live Together, Blues with a
    Feeling и Drowning In a Sea of Love), а также авторские треки Peace of Mind, Bringing
    Light (to a Dark Time) и финальный инстументал.


    Вердикт: вполне достойный альбом от прекрасных музыкантов, который, к сожалению,
    слегка не дотягивает до лучших работ Ронни сотоварищи.


    The Broadcasters are: Ronnie Earl - Guitar Dave Limina - Piano and Hammond B3
    Diane Blue - Vocals Forrest Padgett - Drums Paul Kochanski - Bass


    Special Guests: David Bromberg - Acoustic Guitar and Vocals Kim Wilson - Harmonica
    and Vocals Mario Perrett - Tenor Saxophone Scott Shetler - Baritone Saxophone
    Greg Piccolo - Tenor Saxophone Anthony Geraci - Piano Peter Ward - Guitar Larry
    Luisgnan - Guitar Scott MacDougal - Guitar Michael Rush - Bass


