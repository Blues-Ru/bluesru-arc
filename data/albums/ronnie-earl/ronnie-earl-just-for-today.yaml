- id: 2133
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2013-06-14'
  text: 'Великий Ронни Эрл выпустил очередной альбом - на этот раз концертный, составленный
    из выступлений в трех разных залах его родного Массачусетса. Как всегда на протяжении
    уже более 25 лет аккомпанирует ему его группа The Broadcasters, современный состав
    которой играет с Ронни уже почти 13 лет. В качестве приглашенных гостей присутствуют
    вокалистка Дайан Блю (I''d Rather Go Blind) и гитарист Николас Табариас (Rush
    Hour, Jukein''). Альбом сразу попал на 8 место в блюзовых чартах Биллборда.


    Говорить о качестве музыки Ронни вряд ли имеет смысл, ибо из под медиатора Мастера
    и Музыканта (именно с большой буквы) уже много лет не выходит ничего, что нельзя
    было бы характеризовать как "хорошо" или "отлично". Ронни - скромный гений гитары,
    который идет своей дорогой и держится в тени от традиционного коммерческого успеха
    музыкальной индустрии, изредка гастролирует в свое удовольствие, живет своей музыкой,
    в которую он вкладывает всю душу, и периодически радует поклонников очередной
    блестящей работой. Сам Ронни как-то сказал о своей музыке: "Я просто пытаюсь затронуть
    души людей. Я просто пытаюсь дотянуться до их человечности".


    В музыкальном плане на диске представлена традиционная для Ронни элегантная инструментальная
    смесь джаза, блюза, годспел и соул, опирающаяся на высочайшую технику игры, и
    исполненная искренне с огромным чувством. На альбоме есть два посвящения великим
    блюзменам: Хуберту Самлину ("Blues for Hubert Sumlin") и Роберту Найтхоку ("Robert
    Nighthawk Stomp"). Эмоциональная игра Ронни как обычно не может не вызвать восхищения,
    но не менее хороши и аккомпанирующие музыканты - в особенности Дэйв Лимина на
    Хаммонде. В результате мы имеем 80 минут роскошного "живого" музыкального пиршества,
    которое по достоинству оценит любой любитель блюза и джаза.


    "Always carry hope and an open heart in your life. Don''t quit before the miracle
    happens." - Ronnie Earl'
