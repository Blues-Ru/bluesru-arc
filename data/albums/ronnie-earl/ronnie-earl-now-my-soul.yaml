- id: 1369
  author: Константин Колесниченко
  mark: 8
  date: '2008-11-18'
  text: 'Начиная с linear notes буклета и заканчивая материалом альбома, исполненем,
    видно, что запись эта является, своего рода, исцелением и благодарностью Богу
    и близким людям от Ронни. Последние годы Ронни отказался от концертной деятельности,
    у него обострились проблемы со здоровьем, но музыка лечит.


    Начинается альбом свингующей "Blues for J" Джимми Смита, где группе Earl''а подыгрывает
    на саксофоне один из основателей "Roomful Of Blues" Greg Piccolo. Далее следует
    потрясающе исполненный архиклассический минорный блюз "Double Trouble", в котором
    помимо пронзительной вокальной партии, замечательно играет на хроматической гармонике
    Ким Вилсон, старый друг Ронни. "Feel Like Goin'' On" – так назывался предыдущий
    инструментальный альбом Ронни, на обороте которого были слова-обращение музыканта
    к Богу, своего рода молитва. Ронни не поет, но в этой замечательной, основанной
    на госпел и соул музыке, песне это делает за него Greg Picсolo. "Abandoned" –
    чикагский блюз, на котором опять Ким Вилсон исполняет обязанности вокалиста и
    харпера. На предыдущем альбоме Ронни уже работал с замечательной госпел группой
    из Бостона, опыт этот получился удачным, потому красивый госпел "Walkin'' On The
    Sea" присутствует и на этом альбоме. "Black & White" - очередной чикагский блюз
    с участием Вилсона. "Kay My Dear" - композиция-благодарность. "Kay, my beautiful
    late sponsor", как пишет в буклете Ронни – это отличный медленный блюз с очень
    харАктерным саксофоном Грега. "Maxwell, Mudcat And Per" - как несложно догадаться,
    этот шаффл Ронни посвятил музыкантам, с которыми он работал очень длительное время,
    басисту Mudcat Ward, барабанщику Per Hanson и пианисту David Maxwell. Прифанкованная
    "My Buddy Friends" - это классика жанра и опять Ким Вилсон. "Walter Through Kim"
    – это знаменитая композиция Биг Уолтера Хортона "Walter''s Boogie", как видно
    из названия, сыграна она опять при помощи Вилсона. "#7" - коллективное творение
    группы Ронни. Эта композиция, как никакая другая на альбоме, показывает, все интересные
    особенности его подхода к музыке - на довольно стандартную блюзовую квадратуру
    Earl с товарищами накладывает интересную мелодию, которую обрамляет довольно нетривиальными
    рифами и ходами. "The Magic Of Sam" - посвящение гитаристу, повлиявшему на игру
    Ронни – Magic Sam. Тринадцатым, необозначенным треком альбома, идет обращение
    и благодарности от Ронни к слушателю, которое завершается словами "God Bless You".'
- id: 1457
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: Стартовая Blues for J – сочный органный звук "Хэммонда Би-3", сдержанный свинг
    небольшого ансамбля, изысканная джазовая гитара... Все было бы и дальше безмятежно
    так, как в большинстве блюзовых новинок, стремящихся доказать, что блюз – это
    музыка не менее виртуозная, чем джаз, но гораздо веселее. Немногие, как опытный
    виртуоз Р.Ирл, решатся дразнить злых демонов. Кажется, он чуть переигрывает с
    пронзительными гитарными нотами в 10-минутной версии "Double Trouble". Но степень
    искренности его блюза нельзя переоценить. Риф в его песне "Abandonded" – как блюзовое
    отображение темы судьбы. Ким Вилсон, старый друг и вечный оптимист, здесь из губной
    гармоники выдувает жутковатые аккорды. И даже вокальный госпелл-квинтет "Silver
    Leaf" предлагает лишь бегство от отчаяния. Альбом производит тяжелое впечатление
    – так бывает только с выдающимся блюзом.
- id: 2297
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2018-01-17'
  text: Ронни Эрл - троекратный обладатель блюзовой премии "лучшему гитаристу года",
    победитель в категории "блюзовый альбом года" журнала Downbeat, профессор по классу
    гитары музыкального колледжа в Беркли и просто великий музыкант. Он ушел из Roomful
    of Blues на вольные хлеба, осознав, что блюз можно играть и без вокалиста. Это
    дало Ронни огромную стилистическую свободу, позволив добавлять в блюзовую канву
    элементы джаза, соул и годспел, в результате чего он стал одним из наиболее интересных
    и новаторских музыкантов на современной блюзовой сцене. Однако на альбоме Now
    My Soul почти половина треков с вокалом (на треках 2, 4, 6 и 9 поет знаменитый
    фронтмен Fabulous Thunderbirds и давний друг Эрла Ким Уилсон, который также записал
    партии губной гармоники; на третьем треке поет соратник по Roomful of Blues Грег
    Пикколо, который также записал партию саксофона на треке 7; и, наконец, на треке
    5 присутсвует годспел-группа The 'Silver Leaf Gospel Singers'). Однако при этом
    наиболее мощно и интересно звучат именно инструментальные пассажи, которые позволяют
    Ронни вложить в игру все его чувства и выразить эмоции его гитарой. Ронни выступил
    в качестве продюсера альбома и написал половину материала (частично в соавторстве
    с музыкантами группы), остальные треки на диске - каверы блюзовой классики. Альбом
    получился вполне достойный, хотя и не лучший у Ронни Эрла.
