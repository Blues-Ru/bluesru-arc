  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2022-09-02'
  text: '"The Blues tell the story of life''s difficulties, and if you think for a
    moment, you will realize that they take the hardest realities of life and put
    them into music, only to come out with some new hope or sense of triumph." (Martin
    Luther King)


    Mercy Me - очередной (уже 28-й!) сольник бостонского мастера шести струн, записанный
    за два дня 18 и 19 июня 2021 года тем же составом Бродкастеров, что и предыдущий
    диск Rise Up. Альбом вышел 15 апреля 22 года на Stony Plain Records - и это 14-й
    релиз Ронни на данном лейбле. На диске 5 каверов (в том числе от Мадди Уотерса,
    Джона Колтрейна, Дэйва Мэйсона, Перси Мэйфилда) и 7 авторских треков (включая
    отличное новое прочтение трека Soul Searching с одноименного альбома 1988 года),
    продюсировал сам маэстро.


    Принципиальное отличие данного альбома от предыдущих - присутствие на большей
    части треков гостевого дуэта саксофонистов: Марк Ерли (баритон) и Марио Перретт
    (тенор), которые вносят заметный вклад в музыку альбома. Кроме того, альбом преимущественно
    инструментальный - вокальных частей стало поменьше, и Дайане Блю эпизодически
    помогает Тесс Феррайоло. Старый друг Ронни гитарист Питер Уорд также присутствует
    среди гостей, плюс на четырех треках вносит свой вклад пианист Энтони Герачи.


    На альбоме присутствуют три трека-посвящения: записанный с Питером Уордом акустический
    блюз для Руфи Фостер, отменный электрический инструментальный блюз в честь старого
    друга Дюка Робилларда, а также инструментал Dave''s Groove, сочиненный с Дэйвом
    Лиминой и названный в его честь. Надо отметить, что вклад Дэйва на данном альбоме
    достаточно велик.


    Альбом очень расслабленно-неспешный, это классическая для Ронни смесь блюза, джаза
    и соул, исполненная мастерами-виртуозами, главный из которых, бесспорно, сам маэстро.
    Не все треки из представленных на альбоме одинаково хороши, но даже удаление пары-тройки
    треков из 80-минутного диска несущественно уменьшит объем отменной музыки, представленной
    на нем. (Я бы задвинул треки 2 и 3 как можно дальше, объявив их бонусными, ибо
    они существенно отличаются от остального материала диска.) Думаю, это не лучший
    альбом у Ронни, но диск вполне достойный (да плюс нетрадиционная для музыканта
    саксофонная группа, что по-своему интересно) и заслуживает неоднократного прослушивания.'
