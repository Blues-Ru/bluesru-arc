  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2018-10-24'
  text: 'I Like It When It Rains - сольный альбом Ронни Эрла, записанный им еще до создания The Broadcasters, с привлечением
    различных музыкантов, с которыми он работал до этого (а некоторые из этих музыкантов впоследствии стали членами его группы).
    На виниле альбом вышел в 1986 году, на CD - в 1987 году в Германии и только в 1990 году в Америке. Диск вышел на лейбле
    Antone''s, созданной Клиффордом Антоне - владельцем одноименного знаменитого блюзового клуба в Остине штат Техас. Этот
    клуб считается кузницей традиционного техасского блюза, а сам Клиффорд был наставником Стиви Рэя и Джимми Воэнов, Кима
    Уилсона, Гэри Кларка и многих многих других техасских блюзменов.


    Диск блюзовый и в основном инструментальный. Вокальных треков только три: Midnite Clothes (поет Шугар Рэй Норсия), Walkin
    And Cryin (вокал и гармоника - Кертис Салгало), а также Anna Lee (поет клавишник Рон Леви). Среди других известных личностей
    при записи отдельных песен помогали басист Майкл Уорд, ударник Roomful of Blues Джон Росси и на паре треков харпер Джерри
    Портной. На диске есть и треки с минималистским инструментарием (I Like It When It Rains, Sittin On Top Of The World,
    а также написанная Ронни для матери Mutcika), и "полноформатные" блюзы. Есть на диске и композиция, являющаяся предвестником
    той стилистики, в которой будет в дальнейшем играть музыкант - Linda. Это своего рода будущее звучание классических Ronnie
    Earl and the Broadcasters.


    Репертуар преимущественно авторский - 7 треков написал Ронни (часть в соавторстве), плюс 3 кавера. Продюсировали Джордж
    Льюис и Ронни Эрл. Ронни посвятил данный альбом памяти Биг Уолтера Хортона и Эрла Хукера. Кроме того, он выразил свою
    признательность своему другу и поборнику блюза - Клиффорду Антоне. Поскольку диск записывался в разное время с разными
    музыкантами, звучит он местами сыровато, однако в целом работа достаточно приличная.'
