reviews:
- id: 13
  author: Алексей Калачев
  mark: 10
  date: '2002-10-13'
  text: 'Не припомню, чтобы Ронни делал скверные пластинки. Странным образом они нравятся

    всем, даже самым дремучим блюзрокерам. Они комфортны: Dr.Blues meets Dr. Jazz. Я нисколько не рискую, рекомендуя Ёла людям,
    и вовсе далёким от блюзовой музыки, или начинающим. Берите смело любой альбом 90-х!

    <p>Между нами, уже знакомыми с рафинированным и чувственным инструменталистом, признаем: мы ждали чего-то новенького.
    И вот оно - ДРУЗЬЯ.

    <p>Во-первых, они сделали альбом Ронни вокальным. Сам Ёл не поёт. Поют Ким Вилсон, Ирма Томас и Лютер &quot;Гитар Джуниор&quot;
    Джонсон. Во-вторых, альбом-2001 далёк от джаза. Пара бесподобных м-е-д-л-е-н-н-ы-х баллад в исполнении Ирмы. А так - ЧИКАГСКИЙ
    блюз с гармониками Кима и Джеймса Коттона.'
- id: 1756
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-24'
  text: '"Earl''s playing is superb throughout-stinging when appropriate, laying into shuffles with rhythmic fervor, squeezing
    every drop of juice out of each note on every slow blues...This one has him standing knee-deep in Chicago-style blues."
    - JazzTimes


    "Plenty of low down, back in the alley, gut bucket slow blues that you can really get lost in. Thirteen tracks and 68
    minutes of pure listening pleasure." - Twelve Bar Rag


    "If you can judge a performer by his friends, then the guitarist Earl is obviously someone special." - London Times


    Ronnie Earl and Friends - второй альбом Ронни для лейбла Теларк, записанный музыкантом после исцеления от разнообразных
    недугов, преследовавших Эрла в конце 90-х. Данный альбом - первый полностью блюзовый и почти полностью вокальный альбом,
    записанный Ронни за предшествующие 10 лет. Он был записан вживую в студии за три дня осени 2000 года в свободной расслабленной
    атмосфере с приглашением звезд блюза разных поколений, воссоздавая тем самым старую добрую атмосферу записей фирмы Delmark
    60-х годов.


    Этот диск - наглядное подтверждение старой доброй поговорки "скажи мне, кто твой друг...". Помогают Ронни при записи харпер
    и вокалист Джеймс Коттон, гитарист и вокалист Лютер Джонсон, харпер и вокалист Ким Уилсон и легендарная вокалистка из
    Нью-Орлеана Ирма Томас. Музыкальное сопровождение обеспечивают среди других Дэвид Максуэлл (клавиши) и ветеран-ударник
    Левон Хелм.


    На диске нет отдельного лидера - Ронни держится в тени, позволяя гостям показать себя, но в нужных местах всегда звучит
    мгновенно узнаваемая гитара - то аккомпанирующая, то солирующая. Диск ровный, спокойный, включающий в себя как каверы
    блюзовой классики, так и собственные композиции. Бесспорно одно: высочайшее мастерство исполнителей и качество музыкального
    материала.'
