  text: '"Ronnie Earl continues to play elegant guitar." - George Grella, Star Revue


    "Ronnie Earl is the John Coltrane of the guitar." ~ Jim Hynes, Elmore Magazine


    "Earl has always been keenly attuned to the pain people suffer...He channels those
    emotions and caring attitude into every note he plays. Just feel it and bask in
    his remarkable way of transforming suffering into joy." - Jim Hynes,Glide Magazine


    "There''s a wonderful cover of Bob Dylan''s "Lord Protect My Child," and a vibe
    that promotes faith, inspiration, and hope amid adversity. The album has all the
    elements of great music, down to Earl''s powerful solos but also the simple way
    in which he bends some notes for more detail and effect." - Tom Henry, Toledo
    Blade


    Ронни Эрл в особом представлении не нуждается - за свою более чем 45-летнюю карьеру
    он выпустил 26 альбомов и четырежды становился лучшим блюзовым гитаристом года.
    Ронни выработал свой собственный стиль, который можно назвать "эмоциональным блюзом"
    - это преимущественно инструментальный приджазованный блюз с примесью соул, исполняемый
    с предельной искренностью и филигранной техникой. Для знакомых с творчеством блюзового
    мастера его новый 27-й альбом станет приятным подарком, а для тех, кто еще не
    знает Ронни Эрла - прекрасной возможностью начать знакомиться с творчеством этого
    уникального музыканта.


    Новый альбом включает в себя 15 треков (7 авторских, остальные каверы): пять из
    них концертные, а на семи поет Дайана Блю. Концертные треки были записаны 12 января
    2019 года в клубе Daryl''s House Club, а студийные треки - 2 марта 2020 года во
    время сессий дома у Ронни, где он восстанавливался после операции на спине. В
    записи принимал участие тот же состав Бродкастеров, который записывал предыдущий
    сольник Beyond the Blue Door, с привлечением гитариста Питера Уорда. Продюсировал
    сам Ронни Эрл. Альбом был записан в необычных условиях перед самым разгаром пандемии
    в США и включает в себя посвящение знаменитому блюзмену Лаки Питерсону (который
    скончался в мае этого года), а также Джорджу Флойду (афроамериканцу, убитому полицией
    во время ареста в Миннеаполисе 25 мая 2020 года).


    Несмотря на некоторую разнородность материала и чередование студийных и концертных
    треков, альбом звучит достаточно цельно. Стилистически это все тот же классический
    элегантный блюзовый Ронни Эрл, которому аккомпанируют первоклассные музыканты
    - исполнение отменное, и все инструменты хорошо прописаны. Дейв Лимина отменно
    солирует на Mess Around, Blues for J и посвящении Лаки Питерсону. Музыка диска
    - это сочетание традиции и спонтанности, пронизанных глубокими чувствами и эмоциями
    ее создателей. За исключением первого акустического трека (инструментальной адаптации
    гимна защитников гражданских прав) остальной материал альбома достаточно интересен,
    но особенно выделяются, пожалуй, Blues for Lucky Peterson, Blues for George Floyd,
    All Your Love, Talking to Mr. Bromberg и Albert''s Stomp.


    Как образно выразился в свое время музыкальный критик Тед Дроздовски, "То, что
    Ронни извлекает из дерева, струн и старых Фендеровских усилителей - это не столько
    ноты, сколько звук человеческого сердца, которое бьется вместе с тобой, плача
    под тяжестью мира или признавая неизбежность наступления нового рассвета". В наш
    век интенсивной коммерциализации, снижения стандартов и избытка компьютерной музыки
    Ронни и Бродкастеры продолжают создавать настоящую музыку, характеризующуюся высочайшим
    качеством, искренностью и эмоциональностью. Диск Rise Up в очередной раз продемонстрировал,
    что Ронни Эрл остается ведущим современным гитаристом, работающим на стыке блюза,
    джаза и соул. Альбом дебютировал на 4 позиции в блюзовом чарте Биллборда.'
