- id: 1764
  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2011-05-24'
  text: 'Альбом Color of Love 1997 года - двенадцатый в официальной дискографии музыканта, он был восторженно встречен критиками,
    продан тиражом 65 000 экземпляров и принес Ронни мировую славу. По итогам Эрл получил свою вторую блюзовую награду W.
    C. Handy как лучший блюзовый гитарист.


    На данном альбоме Ронни вновь экспериментирует в духе слияния инструментального блюза и джаза, а помогают ему в этом классический
    состав the Broadcasters с великолепным Брюсом Кацем, а также в качестве гостей - Хэнк Кроуфорд на саксофоне и Грэг Оллман
    на Хаммонде В3 (Грэг также поет в единственной вокальной композиции).


    На альбоме только один кавер (Round Midnight Телониуса Монка), остальной материал авторский (8 треков написал Ронни (часть
    из них в соавторстве) и два трека - Брюс Кац). На диске есть ряд стилизаций-посвящений, включая посвящения легендарным
    блюзменам: Алберту Коллинзу (O'' Yeah), Питеру Грину (Heart Of Glass) и Джимми Воэну (I Liked That Thing You Did), в которых
    Ронни передает своей игрой стиль соответствующего гитариста. В качестве продюсера выступил знаменитый Том Дауд.


    Очень хороший альбом, один из лучших, а игра Ронни как обычно превыше всяких похвал - мягкий звук, отличная техника, блестящие
    соло. Альбом добрался до 10 место в блюзовом топе Биллборда, что для инструментального альбома очень серьезное достижение!'
