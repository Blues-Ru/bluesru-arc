  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2011-05-24'
  text: 'Ронни Эрл в представлениях не нуждается - это бесспорно один из лучших современных белых блюзовых гитаристов планеты.
    А данный концертный альбом, записанный в Бремене в 1993 году, название которого полностью соответствует содержанию, по
    мнению большинства является лучшей работой Эрла. Классический инструментальный сет гитариста, записанный с лучшим составом
    его аккомпанирующей группы (Broadcasters), включая непревзойденного мастера блюзового Хаммонда В3 Брюса Каца. На этой
    записи Ронни отдает дань своим кумирам, отыграв ряд каверов классиков блюза (Magic Sam, Freddie King, T-bone Walker),
    а также 7 собственных композиций.


    Этот музыкальный материал первоначально издавался небольшим тиражом в 1993 году в Германии с другой обложкой и под другим
    названием Blues and Forgiveness Live in Europe, а в 1995 году был переиздан в Америке на лейбле Bullseye Blues уже под
    именем Blues Guitar Virtuoso Live in Europe. Продюсировал альбом сам маэстро.


    Ронни Эрл всегда славился уникальной способностью блюзовой и джазовой импровизации, что позволяло ему записывать студийные
    пластинки практически "вживую", с первого дубля. Здесь же он черпает вдохновение от общения с восторженной аудиторией,
    и это только добавляет масла в огонь. А его талант построения гитарных соло наглядно иллюстрирует последняя композиция
    Rego Park Blues (за нее одну ему уже можно памятник поставить!). Отличная пластинка - работа настоящего Мастера!'
