  date: '2015-07-22'
  text: 'Ronnie Earl and the Broadcasters - Father''s Day - 2015


    Новый альбом Ронни Эрла - это всегда праздник для любителей настоящей музыки. Ронни, который в прошлом году был призван
    блюзовым сообществом "гитаристом года", вкладывает всю душу в музыку, славится элегантностью и полистиличностью исполнения,
    мелодизмом и динамикой, не говоря уже о филигранной технике. Скромный блюзовый гений из Бостона, который своей музыкой
    пробуждает в слушателе самые светлые чувства.


    Новый альбом по-своему необычен и поэтому интересен по следующим причинам: он не инструментальный, а почти весь с вокалом
    (вокалистов двое - уже хорошо нам знакомая по предыдущей работе с Ронни Дайана Блю, а также вокалист группы Ника Мосса
    Майкл Ледбеттер); на альбоме эпизодически присутствует духовая секция (что было в порядке вещей во время сотрудничества
    Ронни с Roomful of Blues, но нехарактерно для его сольного творчества); и, наконец, авторского материала всего 3 трека,
    и даже единственный инструментал - это джазовый стандарт, получивший блюзовое прочтение.


    Каверы (два от Отиса Раша, два от Мэджик Сэма, по одному от ББ Кинга, Брука Бентона Фэтс Домино, Вэн МакКоя и завершающий
    годспел от преподобного Томаса Дорси) подобраны и сыграны с большим вкусом. Продюсировал диск сам маэстро.


    Альбом посвящен отцу Ронни - Джерри Экосу Хорвату, с которым сын уладил все личные разногласия и достиг примирения в день
    отца в 2014 году.


    Кроме проверенного трио Бродкастеров (Дэйв Лимина традиционно выдает запоминающиеся соло на Хаммонде), при записи помогал
    ряд гостей - два саксофониста (которые знатно солируют в инструментале) и три гитариста, включая уже хорошо известного
    нам по предыдущему сотрудничеству с Эрлом Николаса Табариаса.


    Мастерски сыграно, профессионально спето, отлично записано - настоящий подарок для всех поклонников Ронни и вообще всех
    любителей хорошей музыки.


    "This album is made for my beautiful father, and we came to peace in the end. Don''t ever give up on your family and don''t
    quit until the miracle happens."


    - Ronnie Earl'
