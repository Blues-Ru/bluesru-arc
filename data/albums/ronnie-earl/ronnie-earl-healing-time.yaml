- id: 244
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Ronnie Earl - человек в музыкальном мире известный. В конце 70-х он играл в славном коллективе Roomful Of Blues.
    Позже все больше выступал с собственным Broadcasters. Пару раз он даже удостаивался самой престижной блюзовой награды
    - имени W. C. Handy, как лучший гитарист года. Известно также, что сам B. B. King неоднократно называл его своим любимым
    современным блюзовым гитаристом.


    В конце прошлого года Earl пополнил армию блюзменов, перешедших под крыло быстро прогрессирующего блюзового отделения
    фирмы Telarc. И вот спустя полгода гитарист начал отрабатывать новый (видимо, неплохой) контракт.


    Новая пластинка музыканта получилась довольно любопытной. Просто блюзовой я бы ее не назвал - нашлось на ней место и джазу.
    Не зря же на эту сессию Earl пригласил одного из самых великих джазовых органистов - Jimmy McGriff. Последний отыграл
    здесь пару вещей ("Churchin''" и "Blues On A Sunday"), далее уступив место постоянному клавишнику Broadcasters Anthony
    Geraci.


    На альбоме Earl исполняет в основном свои вещи, но есть и парочка общепризнанных шедевров - например, "Catfish Blues"
    Muddy Waters, а также "Idle Moments" Duke Pearson и "Thembi" Pharoah Sanders.'
- id: 2271
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2017-06-07'
  text: '"Guitarist Ronnie Earl is living history of Boston Blues." ~ Brett Milano, Boston Globe


    Альбом Color of Love 1997 года был восторженно встречен критиками, продан тиражом 65 000 экземпляров и принес Ронни мировую
    славу, по итогам он получил свою вторую блюзовую награду W. C. Handy как лучший блюзовый гитарист. Однако раскрутка этого
    альбома и сопутствующие гастроли вызвали эмоциональное истощение, обострение диабета и психическое расстройство. Ронни
    перестал гастролировать, разорвал контракт с лейблом Verve, распустил группу и "лег на дно" почти на два года. Тем не
    менее постепенно его состояние улучшилось, и вот в 2000 году появился альбом, носящий символичное название "Время исцеления".


    Healing Time - первый из двух альбомов, записанный Ронни Эрлом для лейбла Теларк, который музыкант посвятил своей жене
    Донне Хорват. Ронни записал альбом в лучших традициях своего творчества - очень эмоциональный полностью инструментальный
    блюзово-джазовый (джаз, пожалуй, даже слегка превалирует) с примесью годспел. На диске в качестве гостя присутствует знаменитый
    джазовый органист Джимми МакГрифф, записавший партию Хаммонда В3 на двух треках.


    На диске 4 кавера, остальные треки написаны самим Эрлом (Blues on a Sunday в соавторстве с Джимми МакГрифом). Пожалуй,
    диск чуть поспокойнее, чем обычно у Эрла, и звучание чуть более камерное, но с хорошей динамикой. Все инструменты прописаны
    четко, диск звучит очень хорошо - слушать одно удовольствие!'
