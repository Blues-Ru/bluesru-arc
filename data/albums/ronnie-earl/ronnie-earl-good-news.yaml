  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2015-03-12'
  text: 'Ронни Эрл является признанным мастером 6 струн, работающим на стыке блюза и джаза, причем преимущественно в инструментальном
    варианте - гитара Ронни способна выразить любые чувства и в отсутствии вокала. Регулярно радует любителей блюза отличными
    альбомами, в которых сочетается отменное техническое мастерство и глубокая эмоциональность. Долгожданный новый студийник
    от блюзового маэстро дебютировал на 7 месте в блюзовых чартах Биллборда - и надо сказать, диск отличный! Да что тут говорить?
    Ронни - великий мастер, гений современной блюзовой гитары.


    Семь из 10 треков диска написаны Ронни в соавторстве, да плюс 3 кавера, треки записаны за два дня 20 и 21 декабря 2013
    года. Продюсировал сам Ронни. Кроме сплоченного коллектива Бродкастеров, на альбоме отметились вокалистка Дайана Блю (отличная
    работа на 4 треках) и гитарист Николас Табариас (оба они участвовали и в работе над предыдущим диском Ронни Just for Today),
    а также гитарист группы Джанивы Мэгнесс Зах Зунис. Приглашенные гитаристы поочередно с Ронни солируют на трех треках альбома.
    Также традиционно хорош и клавишник Дэйв Лимина.


    Альбом отлично записан, он качественный и ровный, но особенно запоминается композиция Six String Blessing, написанная
    к 60-летию Ронни (10 марта 2013 года). Одним словом, прекрасная работа маэстро и его группы, один из лучших дисков Ронни.


    Рад сообщить всем заинтересованным товарищам, что 8 мая 2014 года в Мемфисе Ронни Эрл получил блюзовую премию лучшему
    блюзовому гитаристу 2014 года в разделе инструменталистов! Справедливость в очередной раз восторжествовала!


    "Ronnie Earl is one of the most sensitive, refined, and exquisite guitarists on the international blues scene." - Living
    Blues


    Ronnie Earl: "My greatest love in music is the blues; this is my ‘mother music. And I dig deep - I have no choice; playing,
    for me, is a very emotional experience. I put every particle of my soul into it. I''m just trying to get into peoples''
    souls and reach their humanity."'
