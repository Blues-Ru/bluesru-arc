- id: 744
  author: Александр Панин
  mark: 8
  date: '2005-06-27'
  text: Оба исполнителя в последние годы выпустили ряд очень крепких альбомов, и этот новый совместный диск никоим образом
    не является исключением из правил. На каждом из восьми продолжительных треков (они длятся добрые 72 минуты, а одна композиция
    - аж почти 16!) много красивой, яркой и впечатляющей гитарной игры. Диск преимущественно инструментальный, но иногда Дюк
    поет, а одну вещь исполняет Майти Сэм Маклейн. Больше половины композиций - каверы. На паре треков играет знаменитый органист
    Джимми Макгрифф. Все хорошо и красиво, но очень длинно.
- id: 1286
  author: Леонид Аускерн
  mark: null
  date: '2008-06-03'
  text: Дуэль! Видите две скрещенные гитары на обложке альбома? Это дуэль! Но не из тех, в результате которых таланты гибнут,
    здесь их встреча удваивает удовольствие любителей музыки от услышанного. Герцог против графа! Ронни Эрл против Дюка Робилларда!
    Это первый в истории совместный альбом двух выдающихся гитаристов современного электрического блюза. Ранее, если не считать
    эпизода с участием Дюка в одном из альбомов Эрла, вместе они не записывались. Зато играли когда-то на блюзовых джэмах
    много, начиная с памятной обоим встречи в клубе Speakeasy в Кембридже, Массачусетс, где и состоялось их знакомство. Как
    и на настоящей дуэли, здесь тоже есть "секунданты" с обоих сторон. Тейксейра, Уильямс и МакКейб – постоянные участники
    The Duke Robillard Band. Лимина и Кэйри играют с Эрлом. А такие "нейтральные" гости, как знаменитый органист Джимми МакГрифф
    или певец Майти Сэм МакКлейн способны украсить любую сессию. Ронни Эрл располагается слева (вы будете слышать его гитару
    из левой колонки), Дюк Робиллард – справа (соответственно - правая колонка). Для поединка дуэлянты выбрали восемь композиций.
    Ронни Эрл принес в проект две собственные вещи - Zeb"s Thing и A Soul That&#185;s Been Abused, Дюк Робиллард - West Side
    Shuffle, с которой и начинается альбом. Остальные пьесы – классика блюза от Би Би Кинга, Ти-Боун Уокера и других мастеров.
    Дюк с Эрлом наигрались всласть! Не на всяком концерте пьесы звучат так долго. А тут, в студийных условиях, диалог двух
    гитар вышел настолько насыщенным, содержательным и увлеченным, что, скажем, My Tears Уолтера Прайса, вылилась в 16-тиминутный
    фейерверк блюзового мастерства и, честное слово, я был бы не против, если бы он продолжался еще столько же! Но и так,
    альбом из восьми треков занял более семидесяти минут звучания. При иных обстоятельствах это могло бы и наскучить, но только
    не в этот раз! Можно проклинать поединки, в которых мир терял гениев, будь то Пушкин или Галуа, Хольгера Петерсена из
    Stony Plain можно только благословлять за организацию этой дуэли и надеяться на ее повторение.
- id: 1757
  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2011-05-24'
  text: 'Альбом-дуэт от двух мастеров современной блюзовой гитары, причем оба вышли из одной и той же группы - Roomful of
    Blues (Робиллард был ее основателем, а Эрл пришел ему на смену, когда Дюк отправился в сольное плавание). Великолепный
    блюзовый альбом с легкой примесью джаза, полный гитарных диалогов (Ронни - левый канал, Дюк - правый), украшенный присутствием
    Джимми МакГриффа (нестареющий Хаммонд В-3) и Майти Сэма МакЛейна (вокал). Восемь треков (2 написал Эрл, 1 Робиллард, остальные
    - каверы блюзовой классики), 72 минуты и море красивой гитарной игры. Продюсировал Дюк Робиллард.


    Четвертое место среди блюзовых альбомов Биллборда.'
