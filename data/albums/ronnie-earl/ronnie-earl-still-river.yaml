reviews:
- id: 1140
  author: Константин Колесниченко
  mark: 9
  date: '2007-10-06'
  text: 'Ронни можно причислять к говноблюзу, можно к современному электрическому и т.д. и все это будет ерундой. Потому что
    Ирл - ходячая компиляция стилей и жанров и не является подлинно блюзовым гитаристом. Этот диск полностью инструментальный,
    Ронни не поет и решил не приглашать вокалистов, видимо. Да и стилистика альбома такая, что вокал не нужен. В большей степени
    этот диск можно отнести к соул-джазу в духе, Паттона, Гранта Грина, МакДаффа и прочих. Блюзоподобные номера все же присутствуют,
    но это больше джазо-блюз. В блюзах же стиль Ирла лежит ближе к вест-сайд школе: к Мэджик Сэму, Отису Рашу, Джимми Джонсону.
    С Ирлом играет его группа, в составе которой очень сильные музыканты: Bruce Katz - piano, B3; Rod Carey - bass, Per Hanson
    - drums и на некоторых композициях Larry Etkin - trumpet, Anders Gaardmand - sax. Альбом очень ровный, прозрачный и красивый,
    но есть и самые-самые места: "Time To Remember", "Szeren", "Soul Serenade", колтрейновский "Equinox", "Eyes That Smile"
    и красивый акустический джаз Ирла и Каца "Derek''s Place". Да, альбом записан на лейбле "AudioQuest", так что звук просто
    потрясающий.'
- id: 1767
  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2011-05-24'
  text: 'Современный блюз невозможно представить без Ронни Эрла и его группы the Broadcasters, в состав которой некоторое
    время входил знаменитый блюзовый клавишник и композитор Брюс Кац. В 1979 году Ронни Эрл пришел на смену Дюку Робилларду
    в группу Roomful of Blues, с которой он отыграл 8 лет, после чего полностью посвятил себя сольной карьере (во время работы
    с Roomful of Blues он также эпизодически выпускал сольные пластинки, но это было вроде как хобби). Альбом 1993 года уникален
    тем, что это первый полностью инструментальный блюзовый альбом Ронни Эрла, который также содержит определенную долю джаза
    и соул. Ронни Эрл и его группа - одни из немногих музыкантов, обладающих достаточным композиторским и исполнительским
    мастерством, а также определенной смелостью, чтобы периодически записывать чисто инструментальные блюзово-джазовые альбомы
    длительностью 60 - 70 минут.


    Отмечу также, что альбом записан 6 и 7 февраля 1993 года на студиях Audioquest (для музыкантов и аудиофилов это имя скажет
    многое!) практически живьем (т.е. без наложений, с одного дубля) и звучит вследствие этого просто феноменально. Кроме
    виртуозности исполнения, игра Ронни характеризуется потрясающей искренностью и великолепной динамикой, передавая целую
    палитру чувств. Альбом отличный во всех отношениях - и по композиции, и по мастерству исполнения, и по качеству записи.
    Прекрасная работа великого музыканта.'
