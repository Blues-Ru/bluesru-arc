  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-24'
  text: 'Третий сольный альбом Ронни Эрла, на котором в составе его группы присутствует
    знаменитый харпер Джерри Портной, вокальные партии исполняет Даррил Нулиш, а в
    качестве гостей отметились старый товарищ по Roomful of Blues Дюк Робиллард и
    знаменитый саксофонист и аранжировщик духовых Каз Казаноф. Альбом был записан
    в мае 1988 года в Бостоне. Репертуар преимущественно авторский - 6 треков написал
    Ронни (часть в соавторстве), по одному Джерри Портной и Даррил Нулиш, да плюс
    3 кавера. Продюсировали Хаммонд Скотт и Ронни Эрл.


    На диске инструментальные треки соседствуют с вокальными, причем манера пения
    Нулиша временами сильно напоминает манеру Джона Мэйолла. Есть и блюзовые, есть
    и джазовые элементы, мастерство музыкантов как обычно на высоте, и в целом пластинка
    остaвляет очень приятное впечатление. Тут уже проявляются красивые соло и фирменные
    "фишки" Ронни, а духовые придают дополнительные краски музыке. Классика блюза
    Восточного побережья.'
