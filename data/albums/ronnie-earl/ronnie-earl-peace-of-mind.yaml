  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2018-10-23'
  text: 'Peace of Mind - четвертый сольный альбом Ронни Эрла, записанный составом,
    схожим с музыкантами предыдущего сольника Soul Searchin''. За вокальные партии
    отвечает Дэррил Нулиш, записавший также гармонику на паре-тройке треков. Основу
    для импровизаций Ронни составляет проверенная ритм-секция из Стива Гомеса и Пера
    Хансона, органные партии записал Тони Заманьи (отменная работа!). Дэйв Максвелл
    играет на фортепиано на ряде треков, а партии духовых исполняют старые коллеги
    Ронни по Ruomful of Blues Грэг Пикколо и Дуг Джеймс. Альбом был записан в январе
    1990 года в Бостоне. Репертуар преимущественно авторский - 9 треков написал Ронни
    (часть в соавторстве), один Даррил Нулиш, да плюс 2 кавера. В продюсерском креселе
    - Хаммонд Скотт.


    Диск начинается свингующим джамп-блюзом, затем появляются и блюзы с джазовым привкусом,
    и под занавес - наиболее аутентичный полуакустический блюз Wayward Angel. На диске
    9 вокальных треков и три инструментала, из которых наиболее хорош первый из стоящих
    друг за другом Wayne‘s Blues и Bonehead Too, где Ронни и Тони попеременно солируют
    и выкладываются по полной. Хочется также отметить соло Грега Пикколо на третьем
    инструментале Sickin‘, хотя все музыканты играют отменно и нельзя сказать, что
    диск вытягивает только Ронни - это действительно полноценная совместная работа.
    В целом - хороший диск, оставляющий очень приятное впечатление от прослушивания.'
