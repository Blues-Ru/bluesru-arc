- id: 1585
  author: Андрей Евдокимов
  mark: 7
  date: '2009-11-12'
  text: Блондинка, 23 года, из Англии – худшего резюме для блюзовой певицы-гитаристки и не придумаешь. Однако блюз, как правило,
    чреват сюрпризами. И "Белый сахарок" - сюрприз дюже приятный. Свежий и энергичный дебют, все 10 песен – собственного сочинения.
    Никому впрямую не подражая, Тейлор контрастирует сама себе, играя то сглаженный модерн-блюз, то грубый и напористый ранний
    чикагский саунд. Голосок, конечно, нежный, но страстный. А гитарный саунд сочный, техника сочетает чередование коротких
    выразительных соло с напористыми аккордами. На корпусе гитары картинка с "пин-ап-герлой" - значит, будет горячий блюз!
