  date: '2014-10-09'
  text: 'Месяца еще не прошло со дня выпуска нового, четвертого альбома двадцативосьмилетней
    британской блюз-роковой певицы и гитаристки Джоан Шоу Тейлор (Joanne Shaw Taylor).
    Под названием "The Dirty Truth" альбом вышел 22 сентября на ее собственном лейбле
    Axehouse Records. Еще раз объединив усилия с продюсером Джимом Гейнсом (Journey,
    KBC Band, Painter, Pablo Cruise), который записывал ее дебютный альбом "White
    Sugar" в 2009 году, Джоан обещала поклонникам "вернуться в прошлое", сделать что-то
    похожее на "White Sugar". И она вернулась, если не сказать, триумфально, то очень
    к этому близко.


    Она сделала как раз то, что от нее ждали: продуманную комбинацию из не слишком
    агрессивного, но и не слишком лиричного "дамского" блюз-рока, получилось очень
    естественно для голоса Тэйлор. Певица хотя и не страдала никогда от особой сложности
    собственной музыки, но по сравнению с претензиями ее студийного альбома 2012 года
    ''Almost Always Never'', все опять стало проще , понятней и доходчивей.


    Хитом альбома уже сейчас в рецензиях признается поп-блюз-рок номер Shiver And
    Sigh (Дрожь и вздох), но многих впечатляет и копирование позднего Хендрикса в
    заключительной Feels Like Home .


    Если говорить о ее вокале, то сама Тэйлор в начале карьеры была весьма критично
    настроена в отношении собственных вокальных данных и петь не планировала. Сейчас
    это уже странно слышать, потому что ее низкий, хрипловатый, проникновенный вокал
    и составляет самую большую изюмину ее творчества.


    Силой этого альбома является и отсутствие откровенно проходных номеров, слабых
    мест. Редкий для нынешних времен случай, когда по окончании прослушивания размышляешь,
    не нажать ли на кнопку "repeat". Ну, и продолжим на английском: "Highly recommended"


    В поддержку нового альбома Тейлор проедет с концертами по Британии в течение двух
    недель в ноябре со специальным гостем - бывшим гитаристом Whitesnake Берни Марсденом.
    Как всегда в последнее время - с уверенностью в себе, энергией и азартом. Два
    часа пения в микрофон Тэйлор считает лучшей терапией. Все песни сочинены ею самой,
    одна - в соавторстве (Shiver and Sigh)


    Комментарии самой Джоан по некоторым песням:


    Mud, Honey:(Грязь, дорогая) "Давно придумала тему с таким названием и написала
    инструментал. Вообще сначала хотела назвать так мой второй альбом "Diamonds in
    the Dirt". Когда снова начала работать с Джимом Гэйнсом, принесла ему демо,предложила
    включить в альбом инструменталом, но послушав , как это звучит в исполнении всего
    ансамбля, поняла, что звучит круто и глупо будет не написать текст. Сочинила историю
    довольно темную о гангстере, который сжег за собой слишком много мостов, чтобы
    органично вписать ее в хард-блюз-рок."


    The Dirty Truth (Неприкрытая правда): "Когда я села писать эту песню, то задумывала
    кантри-номер. Я - большая поклонница кантри и слушаю его много, когда пишу песни.Но
    сочинился рифф более блюзовый и текст пришлось подправить, чтобы он был поближе
    к блюзовым темам. Это еще одна придуманная история о попытке разрыва отношений
    с партнером, склонным к насилию. Но это не касается ни одного из моих бой-френдов"


    Tried, Tested and True (Попробовал, проверил и убедился): "Я считаю это соул балладой.
    Название придумала давно и хотела написать медленный блюз. Песня автобиографичная,
    она о причинах разрыва довольно долгих взаимоотношений."


    Outlaw Angel (Ангел вне закона): "Блюз-шаффл в техасском стиле. Хотела сделать
    ее потяжелей, что-нибудь в духе Билли Джибсона и сыграла на Les Paul."


    Shiver and Sigh (Дрожь и Вздох): "Я написала песню в соавторстве с Кэвином Боу
    более десяти лет назад и последние несколько лет она - одна из ключевых на моих
    концертах. Но долго не знала, в какой из альбомов ее включить. Песня о невостребованной
    любви, я хотела в куплетах немного сгустить атмосферу, а припев сделать посветлее.
    "


    Struck Down (Сразила): "Достаточно прямолинейная рок-песня, опирается на драйвовый
    рифф. Речь в песне идет об изменах. Мне нравится атмосфера этой песни, она тесно
    связана с атмосферой первого трека "Mud, Honey".


    Feels Like Home (Чувствуй себя, как дома): "Я написала эту песню для своего дебютного
    альбома "White Sugar". Но там уже была похожая песня "Kiss The Ground Goodbye"
    и два трека в духе Хендрикса было бы многовато. Мне нравится, как Хендрикс использовал
    соло-ритм стиль и я постаралась сделать что-то близкое."


    Музыканты: Guitars and Vocals: Joanne Shaw Taylor Bass Guitar: Dave Smith Drums:
    Steve Potts Keyboards: Rick Steff'
