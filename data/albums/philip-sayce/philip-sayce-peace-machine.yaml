  date: '2012-02-03'
  text: Европейское переиздание альбома 2005 года, дополненное бонусным треком. Филип родился в Англии, но вырос в Торонто.
    Присутствие в конце 80-х на концерте Эрика Клэптона, которому помогал на второй гитаре Марк Нопфлер, навсегда изменило
    жизнь Филипа. В 1996 году Филипа представили другому знаменитому канадцу - Джефу Хили, который пригласил молодого гитариста
    в свою группу. Затем в начале нашего века Филип сотрудничал и гастролировал с Мелиссой Этеридж, а в 2005 году записал
    свой дебютный альбом - Peace Machine, представлявший собой стандартный концертный сет музыканта. На саму запись ушло всего
    полтора дня, альбом был записан практически по технологии "вживую в студии", и затем вышел на маленьком независимом лейбле.
    Переиздание на крупной фирме в этом году позволило донести музыку талантливого гитариста до широких кругов поклонников
    тяжелого блюз-рока.
