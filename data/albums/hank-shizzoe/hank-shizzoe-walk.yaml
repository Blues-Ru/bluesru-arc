  date: '2008-11-05'
  text: 'Hank Shizzoe - музыкант с непроизносимой фамилией из Швейцарии. Здесь речь
    пойдет про его альбом Walk 1996 года.


    Музыкальное направление я четко определить не смог – с одной стороны руки тянутся
    назвать это блюз-роком, но мозг понимает, что с блюз-роком сейчас в основном у
    людей ассоциируются гитарные запилы а-ля Гари Мур, Эрик Сардинас или Джо Бонамасса.
    А тут же их в принципе нет. Так что, если говорить длинно, это смесь блюза и софт-рока
    а-ля Eagles, где в равной степени преобладает и то и другое.


    Песни цепляют своей мелодичностью, разнообразным набором инструментов – Хэнк играет
    на гитаре, добро, вурлицере, тамбурине. Очень приятно было слышать женский бек-вокал
    и аккордеон (например, в Fallin'' Forever and Ever)– но не на манер zydecco, а
    просто в качестве аккомпанемента.


    Этот альбом, пропитанный мелодиями из области рока, блюзовыми аккомпанементами
    и небольшими уходами в сторону кантри, наверняка понравится приверженцам всех
    этих направлений. Лично я порой люблю послушать красивые и несложные мелодии,
    поэтому этот диск как нельзя лучше мне подходит.


    Еще несколько песен особо хороши. Спокойная Handmade Love, подвижная End of the
    Trail и кантри Joe Went to the Water открывают альбом. Закрывает его акустическая
    народная Blood In My Eyes, эта песня наверняка многим знакома по версии Боба Дилана,
    тут она исполнена тоже в акустике, но совершенно иначе. Be Good to Me просто душевная
    баллада, в духе Марка Нопфлера.


    Очень необычный современный блюз.'
