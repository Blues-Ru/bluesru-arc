- id: 1124
  author: Константин Колесниченко
  mark: 10
  date: '2007-09-05'
  text: 'Не знаю, в чем провальность этого альбома, как пишет allmusic. Мне "There''s One in Every Crowd" показался вполне
    логичным продолжением предыдущего "461 Ocean Boulevard". Причем Клэптон учел все недостатки и эта его запись вышла просто
    замечательной, на мой взгляд.


    Может показаться, что на альбоме нет уж совсем ярких песен, как было на предыдущем, нет каких-то прорывов в его дискографии.
    Но это ровная работа, сделанная со вкусом и без ненужных рывков.


    Я считаю, что этот альбом получился предтечей записей, например Keb Mo'' и других музыкантов, работающих в похожей стилистике.
    Рецепт и прост и сложен одновременно: жанровое разнообразие, основанное на блюзе, приятные мелодии и вокал, простые слова
    о простых вещах.


    Отличный альбом, на котором я бы хотел выделить следующие композиции: "Don''t Blame Me", "Better Make It Through Today",
    "Pretty Blue Eyes" и даже заезженная "The Sky Is Crying" звучит замечательно и свежо!'
