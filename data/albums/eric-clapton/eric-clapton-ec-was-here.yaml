  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-06'
  text: 'Знаменитый концертник Эрика, в основном посвященный традиционному блюзу (хотя присутствуют и два трека из репертуара
    Blind Faith). С вокалом Эрику помогает не кто иной, как Ивонна Эллман (Мария Магдалена из Исуса Христа).


    Альбом добрался до 20 места в топе поп-альбомов Биллборда.'
