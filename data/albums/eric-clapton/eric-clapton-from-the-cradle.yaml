reviews:
- id: 356
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-12-12'
  text: 'Можно до бесконечности обсуждать тему: блюзмен ли Клэптон или нет, но точно
    можно сказать одно: помимо огромного количества блюзов на его нормальных альбомах
    у него есть ОДИН КЛАССНЫЙ блюзовый альбом целиком - From The Cradle 1994 года.
    Есть еще диск с Би Би Кингом, но это уже другая история. Я не знаю, почему Эрик
    решил так резко вернуться к классике электрического блюза после огромного успеха
    Unplugged и саундтрека к Rush, но народ понял Клэптона, и этот альбом занял все
    возможные первые места в поп- и блюз-чартах. Это очень странно потому, что альбом
    чисто блюзовый и совершенно некоммерческий по звучанию. Он даже не попсовый, тут
    нет ни одного хита! После Layla (Unplugged) и Tears In Heaven (Rush OST) этот
    альбом звучит как антикоммерческое самоубийство, но кто-то четко знал, что все
    будет хорошо; так и вышло.


    И так, 16 композиций на целый час! Целый час вязкого, традиционного, местами грязного,
    но очень хорошего блюза. Эрик может быть и не чистый блюзмен, но дело свое знает;
    его игру и пение слушать НАМНОГО интереснее, чем бесконечные записи "новодельных"
    блюзменов, играющих в этом же стиле. Здесь с Эриком большой состав и его лучшие
    друзья и перцы. Отличная запись и настроение, но 60 минут - это явный перебор
    для такой музыки. Оценка 4 балла. Эрик может более лаконично и красиво; тут уж
    слишком большой шаг назад в традицию. Я бы выделил лишь несколько "светлых" треков;
    это Third Degree, How Long Blues, Motherless Child (это должно было стать хитом).
    Эрик доказал, что он умеет играть по блюзу и записывать цельные блюзовые диски,
    но он забыл про то, что он много еще чего умеет!'
