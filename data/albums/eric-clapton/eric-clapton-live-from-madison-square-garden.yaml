- id: 1564
  author: Андрей Евдокимов
  mark: 8
  date: '2009-07-09'
  text: 'Представим, что Клэптон и Винвуд сошлись в студии? Все будут ждать революции, какой была Blind Faith. А тут, на концерте,
    все просто: старинные друзья джемуют знакомые темы – былого драйва и отвяза нет и в помине, зато инструменты слушаются
    бесприкословно, выполняя тончайшие нюансы. Версия DVD только для самых крепких – не каждый выдержит зрелище двух седых
    дядек, поющих хендриксовское "Крылышко", не вспомнив о пенсионном фонде. Sleeping In The Ground, где запевает Винвуд -
    просто мусор... Есть еще несколько песен, где вокалистам хочется дать на пиво, лишь бы смолкла старческая дрожь в голосе.
    Но есть и сольно-акустическая Rambling…, где Клэптон поет как белый негр – что Бог на душу положит и как пальцы по струнам
    раскинет. Право, абсурдистский концерт: временами – позорная самопородия, а другими временами – судьбоносная недосягаемая
    краса. Новое "Зазеркалье" - берите, не понравится сейчас, переслушаете лет через десять. Эта штуковина актуальности не
    утратит.


    Особо рекомендовано практикующим музыкантам – нельзя позволять себе все, что хочется, надо и слушателя иметь ввиду. Деликатное
    перебирание струн и изобретательная смена тональности – это не соль концерта, это для родственников на даче. Исполнив
    в этом концерте Presence of the Lord м-р. Клэптон самоопозорился, спев Cocaine – предъявил, что он уже не ТОТ Клэптон,
    никакой порошок им не правит давно. Но в тех же песнях его гитарные соло – образец понимания мелодики, саунда, изящности
    и легкости абсолютного владения инструментом. В альбоме – переизбыток заезженных тем. Но если вы не можете сыграть Double
    Trouble или Voodoo Chile не то, чтобы лучше, но хотя бы по-другому – не надо играть их на публике. В реинкарнации этих
    песен высшая планка поставлена, прыгать ниже – себя не уважать. И пожалейте трезвую часть публики, а пьяным сыграйте хонкитонквуман
    – они вас на руках будут носить.'
