  author: Андрей Евдокимов
  mark: 8
  date: '2005-03-23'
  text: 'Приближаясь к пенсионному возрасту, англичанин Эрик Клэптон является миллионером
    и звездой поп-музыки с обширной дискографией. Он родился восемь лет спустя после
    смерти Роберта Джонсона, чья жизнь была неразрывно связана с Дельтой Миссиссиппи,
    и который, не дожив до 28 лет, оставил после себя в наследство лишь 29 записанных
    им песен. Встретиться они могли либо "фотографией на стене", либо в музыке. И
    то, и другое случилось в альбоме "Я и мистер Джонсон" (см. обложку альбома), где
    все песни в исполнении Клэптона сочинения Джонсона.


    Игра ритм-секции выше всяких похвал. Мало у кого из наших современников найдешь
    такое аутентичное по духу, но оригинального в воплощении понимание внутреннего
    движения блюзового ритма. Превосходно постоянное, но ненавязчивое присутствие
    клавишных и губной гармоники. Ансамблевое полуакустическое звучание сбалансировано
    идеально. Все музыканты - ветераны, за годы сотрудничества с Клэптоном у них сложилось
    абсолютное чувство взаимопроникновения через музыку.


    Игра самого Клэптона – образец высшего гитарного искусства. Лаконичные брейки
    всегда точны и выразительные. Легкость его виртуозных пассажей еще раз свидетельствует,
    сколь оправданно он носит прозвище "Увалень" (Slow Hand), делая головокружительные
    трюки одним ленивым движением. Не может не восхищать то, как спустя сорок лет
    от начала профессиональной карьеры он избегает шаблонов и находит все новые не
    банальные, а яркие гитарные ходы. Это великолепная музыка для слушания – виртуозная,
    традиционная, но сегодняшняя, теплая, и ничто не режет ухо...


    ...А почему не режет? Откуда такая ровность во всем? Джонсон играл свои блюзы
    с отчаянием обреченного – "<i>гончие ада шли по его следу</i>". Его гитара давала
    почувствовать, как он "<i>тонет, стоя на твердой земле</i>". Это строчка из самой
    известной его песни "Перекресток" (Crossroads), автор спел ее голосом, сдавленным
    от ужаса. Много лет назад, играя в группе "Крим" Клэптон, перепутав, спел этот
    текст на мелодию народной плясовой песенки "Качусь, кувыркаясь" (Rollin'' & Tumblin'').
    И поет ее так с тех пор, и не проходит впечатление, что англичанин Клэптон не
    понимает стихов афро-американца Джонсона.


    "Перекрестков" нет в нынешнем альбоме. Есть, например, "<i>Заходи ко мне на кухню,
    на улице собирается дождь</i>" (Come on in my Kitchen), в которой <i>он любит
    ее и хочет защитить от превратностей жизни, она не любит его и не хочет его защиты</i>.
    У Джонсона это очень нежная печальная песня, и когда Джонсон проговаривает: "<i>Слышишь,
    как воет ветер</i>" и гитарная струна тихо подвывает под слайдом – безвыходность
    нежности охватывает сердце. Это лирика в самом классическом понимании поэзии..
    И не случайно, что про слайдовый вой ветра Клэптон не вспомнил. А ценителю джонсоновских
    стихов не понять, зачем он превратил эту лиричную, безысходную - в оптимистичный
    марш, который можно распевать хором на свадьбе. Зато в его исполнении безупречен
    веселый рэг-тайм "Раскаленные до красна" (Red Hot).


    Почти 40 лет назад, в 1965г., когда Э.Клэптон впервые запел на записи, это был
    именно один из блюзов Р.Джонсона. И с тех пор постоянно исполняет их, повторяя,
    что это "лучшая музыка", которая его "манит из-за горизонта". В 2004г. он ее вновь
    аранжировал на свой манер. Нет нужды учить Клэптона, как играть блюз – сегодня
    он знает это лучше всех. Просто, что такое блюз - это действительно каждый понимает
    по-своему. Клэптон понимает блюз совсем не так, как Джонсон: для него это чуть
    грустная музыка под комфортный английский сплин. Все было бы отлично в его альбоме,
    лишь режет ухо диссонанс текстов и музыки.


    За последние годы Питер Грин выпустил два альбома, полных джонсонских блюзов –
    у него ближе к сути. У Клэптона – легче слушать.


    P.S. В 1994г. Клэптон уже выпускал полновесный блюзовый альбом, поднявший популярность
    этого специфического жанра. Ровно десять лет спустя он совершил такой же благородный
    поступок. Играет ли Клэптон блюз, или только притворяется? За прошедшие десятилетия
    спорщики уже устали, а Клэптон не собирается останавливаться.'
