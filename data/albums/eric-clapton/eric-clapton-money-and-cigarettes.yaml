- id: 1125
  author: Константин Колесниченко
  mark: 10
  date: '2007-09-06'
  text: Специалисты говорят, что это последний нормальный альбом Клэптона. Потом идут звуки 80-х, и всякая анти-музыкальная
    ерунда. Признаюсь, мне понравился и его альбом посвященный Роберту Джонсону и коллаборация с БиБи. Но речь сейчас об этом
    альбоме, на обложке которого аллюзия на Дали, как мне кажется. Альбом 83 года "Money and Cigarettes" - не блюзовая работа
    Клэптона, хотя блюзы, присутствуют тут в других аранжировках и сами по себе, например, "Everybody Oughta Make A Change"
    и "Crosscut Saw". Весь остальной альбом - это музыка, стилистике которой Эрик научился у другого замечательного и неповторимого
    музыканта JJ Cale. С Эриком играют отличные музыканты, например, Ry Cooder, Donald Duck Dunn из Букер-Ти, Albert Lee,
    Roger Hawkins и др.
