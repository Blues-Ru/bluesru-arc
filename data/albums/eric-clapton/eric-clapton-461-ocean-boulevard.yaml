- id: 1102
  author: Константин Колесниченко
  mark: 10
  date: '2007-06-26'
  text: 'Меломаны деляться на две группы: им либо нравится творчество Клэптона, либо
    нет. Потом они же дробятся еще на две, те которые называют его Клаптон и те, что
    Клэптон. Я отношусь к любителям его творчества и называю его вторым способом.
    Возможно, моя любовь к творчеству этого музыканта проистекает из того, что я слушал
    и слушаю его творчество датированное исключительно 70-ми + 3 альбома новой эры:
    коллаборации с БиБи Кингом и JJ Cale и трибьют Роберту Джонсону. Я делаю это умышленно.
    Вот только хочу "From The Cradle" и "Unplugged" раздобыть, чтобы иметь представление,
    что он творил в 90-х.


    "461 Ocean Boulevard" второй студийный альбом Клэптона и я считаю его одним из
    лучших альбомов 70-х, а в дискографии Эрика так вообще единственно лучшим. Музыкант
    ударился на этом диске в жанровое разнообразие, взамен своему привычному подходу
    к музыке. Некоторые композиции звучат как ритм-н-блюз, другие как регги, а, например,
    "I Can''t Hold Out" звучит совсем уж по JJ Cale''овски.


    У этого альбома есть замечательная атмосфера юга, тепла и отдыха. Отличная и обложка.'
