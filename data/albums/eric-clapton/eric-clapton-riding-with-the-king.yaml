- id: 248
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Еще одна сбывшаяся мечта. Оказывается, и Eric Clapton, и B.B.King практически всю жизнь только и делали, что мечтали
    отписать совместную пластиночку.


    Но люди они, естественно, занятые, к тому же Clapton последнее время блюз играл крайне нерегулярно, в общем, как-то не
    складывалось. Впрочем, позволю себе предположить, что оба просто ждали именно 2000 года, дабы сия, и без того эпохальная,
    запись двух легендарных блюзменов стала еще более значимой.


    Честно говоря, затруднительно говорить еще какие-то слова об альбоме, который, только выйдя в свет, уже получил статус
    исторического. Могу перечислить музыкантов. Это сплошь звезды - Joe Sample, Andy Fearweather Low и Steve Gadd.


    Еще, пожалуй, стоит отметить, что кроме блюзов на этом альбоме есть классика соула ("Hold On I''m Coming") и джаза ("Come
    Rain Or Come Shine"). Слушается все очень легко.


    Впрочем, все уже давно привыкли, что блюз в исполнении Clapton и King весьма доступен, и это, в частности, подтверждают
    великолепные продажи нового альбома по всему миру, в том числе и в России.'
