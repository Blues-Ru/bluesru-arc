reviews:
- id: 1645
  author: Андрей Евдокимов
  mark: 8
  date: '2010-10-09'
  text: Клэптон давненько не баловал почитателей сольным альбомом. Но в новом песни
    абсолютно предсказуемы и по общему устало-меланхоличному настроению, и по мастерскому
    расслабленному исполнению. Большинство звучит так, словно могли бы быть записаны
    еще в 70-х. Блюзов много, как всегда, и как всегда звучат они "заторможено". Неожиданно
    для Клэптона появились эстрадные стандарты таких мастеров-мелодистов, как Хогги
    Кармайкл и Ирвин Берлин. И в аккомпанирующем ансамбле, и среди гостей – сплошь
    звездные имена, что окончательно удостоверяет престижность итогового продукта.
- id: 1939
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-06'
  text: 'Новый альбом Эрика Клэптона представляет собой набор песен, которые нравятся
    ему самому: от джазовых стандартов времен биг-бэндов и Ново-Орлеанского джаза
    до софт-рока и новых блюзовых трэков. Очень условно можно разделить альбом на
    блюзовые и джазовые треки, причем маэстро абсолютно свободно себя чувствует в
    обеих этих ипостасях. Диск неспешный, расслабленный - одним словом, типичный Slowhand.


    Помогает при записи звездный состав музыкантов, включая Джей Джей Кэйла, Джима
    Келтнера, Уинтона Морсалеса, Алена Тусена, Шерил Кроу, Кима Уилсона, Дерека Тракса
    и других. Диск в основном состоит из каверов, но есть и пара авторских треков.
    На мой взгляд, лучшие песни Кэйловская River Runs Deep и финальная Autumn Leaves.
    Диск приятный, мелодичный, качественный, но вряд ли понравится поклонниками блюз-рока
    или Cream и Blind Faith. Зато любителям джаза наверняка придется по душе. Впрочем,
    Эрик уже давно завоевал право записывать именно ту музыку, которая нравится ему
    самому.'
