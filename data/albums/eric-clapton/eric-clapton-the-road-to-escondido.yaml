- id: 1393
  author: Андрей Евдокимов
  mark: 6
  date: '2008-12-29'
  text: Ожидаемый всем миром альбом может и не понравиться "русскому уху". Вместо "героических" гитарных соло – тонкий отыгрыш
    к вокальным линиям. Пение напоминает добродушное бормотание под нос. Да и ценность песен – наполовину в стихах... Исторические
    корни альбома уходят к началу 70-х. Мега звезда и автор его знаменитейших хитов не раз выступали вместе, так что идея
    записать дуэт в студии просто перезрела. Изначально она состояла в том, что Кейл спродюсирует альбом Клэптона... А обернулась
    так, что за пульт сел человек из свиты Клэптона. И Кейл записал свой типичный альбом, в котором Клэптон сыграл отведенную
    ему роль. Из 14 песен две написаны Клэптоном, плюс один блюзовый стандарт Б.МакГи. Остальное – Кейл. Такова информация.
    А мастерская умная взрослая сдержанная ироничная лиричная музыка – в альбоме. (Взгляните на обложку повнимательней – снова
    Клэптона подставили).
- id: 1940
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-06'
  text: 'Поскольку Кэйл в течение долгого времени оказывал влияние на творчество Клэптона (не говоря уже о том, что два известнейших
    хита Эрика принадлежат перу Кэйла - After Midnight и Cocaine), подобное сотрудничество двух музыкантов уже давно находилось
    в "листе ожидания".


    Получившийся диск все-таки скорее диск Кэйла, нежели Клэптона (Кэйл написал 11 из 14 треков), тем не менее это бесспорно
    совместная работа - музыканты и поют, и солируют, сменяя друг друга. Пластинка "неспешная" и расслабленная, причем отличить
    где Кэйл, а где Клэптон, непросто. Добротная работа, на которой музыканты получают удовольствие от музыки, которую они
    создают.


    Номинация на Грэмми в категории "лучший альбом современного блюза" в 2007 году.'
