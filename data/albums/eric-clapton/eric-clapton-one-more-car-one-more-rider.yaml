reviews:
- id: 55
  author: Алексей Калачев
  mark: 4
  date: '2002-12-17'
  text: 'Блюз в творчество Эрика прибывает периодически - в режиме прилива и отлива.
    Иногда по его собственной прихоти, иногда под давлением запросов рынка. Судя по
    этому концертнику из 2-х дисков, сегодня на календаре Клептона не день блюза.
    Первый диск любителю блюза будет слушать совсем скучно. Хотя открывается классическим
    блюзом Биг Билла Брунзи, в остальном он составлен из поп-песен последних лет,
    не имеющих прямого отношения к жанру, к тому же Эрик играет там преимущественно
    на акустике. Второй – вежливое и более чем умеренное с точки зрения эмоций напоминание
    о славном прошлом, включая и Hoochie Coochie Man. Вероятно, это первый случай,
    когда Эрик представлен на своём концертном альбоме скорее как певец, нежели как
    знакомый нам до боли музыкальный Кентавр – существо в равной мере сочетающее умение
    великолепно петь (с годами все лучше) и гитарный талант! Угрюмые и как правило
    ограниченные люди - критики Эрика – забрызжут слюной: Мы ж говорили, он барахло,
    попсятина! Ребята, нет такого блюзмена, который не хотел бы сделать поп-песню,
    желательно масштаба "Yesterday" или "Wonderful Tonight" и почивать на лаврах благосостояния,
    принесенных ею! Эрик – гениальный поп-музыкант и композитор. И гениальный блюзмен.
    На данном альбоме берущий, правда, тайм-аут.'
- id: 370
  author: Михаил Бирюков
  mark: null
  date: '2003-12-16'
  text: 'Двойной концерт. Хайлайтс ов зе ласт йиэрз уорлд туур. Очень, просто супер
    профессионально. И скучно настолько, что я перестал жалеть о непопадании на московский
    концерт Клаптона.


    Тот, кто следит за творчеством г-на Slowhand, слышал это все уже не раз (в случае
    со старым материалом) или слышит непрестанно на протяжении последних десяти лет
    (My Father''s Eyes, River of Tears, Change the World, Tears in Heaven). Ничего
    сильно нового в представленных на диске исполнениях нет. Есть, конечно, фирменные
    клаптоновские соло - но это уже для совсем уже сугубых фанов-ценителей.


    Все-таки профессиональный рок - это ужасно скучный рок. Даже если на хорошем материале
    типа Badge, Bellbottom Blues, Sunshine of Your Love и пр.'
