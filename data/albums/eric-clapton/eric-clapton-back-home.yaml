- id: 849
  author: Дмитрий Казанцев
  mark: 3
  date: '2005-09-02'
  text: 'Продюсер и соавтор этого альбома Simon Climie - это ужас для Эрика. Он один раз уже изуродовал альбом Pilgrim, предложив
    нам мерзкий электро-поп. На этот раз все по-другому, но общие черты есть. Играют здесь живые музыканты (все высшего класса),
    но и программинг тоже присутствует, конечно. Кошмар же не в этом, а в материале, его подаче и АРАНЖИРОВКАХ. 5 песен Эрик
    написал вместе с Саймоном, зачем-то испортили песни Стиви Уандера и Джорджа Харрисона, две песни написал Doyle Bramhall
    II (он в группе Эрика). В итоге мы имеем высококлассный, надуманный соул-поп и ритм-н-блюз, с попсовыми ритмами и постоянными
    женскими подпевками. При этом песни не блещут мелодиями и хуками, так что КАЙФАНУТЬ от настоящей ПОПСЫ тоже не выйдет.


    После безликого блюзового занудства Me & Mr Johnson Эрик выпустил ВОТ ЭТО. После этого его диск Reptile (и альбом с Би
    Би Кингом) можно считать настоящим шедевром - ТАМ БЫЛА МУЗЫКА.'
- id: 859
  author: Андрей Евдокимов
  mark: 6
  date: '2005-09-14'
  text: 'Подобно Мадонне и Бритни Спиарз, Клэптон – уже не личность и не музыкант. В общественном восприятии он стал символом.
    На поле поп-музыки он выделяется хорошим вкусом и грамотным музицированием. Но главное для публики в том, что выходец
    из просто семьи достиг славы и богатства... Что богатство не принесло ему счастья... И что свои несчастья он преодолел,
    достигнув спокойствия и не утратив богатства. На фоне этих коллизий совершенно неважно, какую музыку он играет. Печально,
    что это не важно и для самого Клэптона. Возвращаясь домой, он сходит на перрон, чтобы сыграть немного блюз-рока, немного
    регги и много поп-баллад. Именно то, что от него и ожидали: сдержанная лирично-меланхоличная музыка высшего качества.
    Примечательно участие звезды 60-х и товарища Клэптона по группе Blind Faith Стива Уинвуда... Как и исполнение песни "Любовь
    приходит к каждому" Джорджа Харрисона, с которым Клэптона связывали непростые отношения. Однако издание в октябре концертных
    записей Cream Reunion будет, пожалуй, более увлекательно.'
