  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-19'
  text: 'Один из наиболее успешных своих альбомов талантливый блюзовый гитарист Кенни Блю Рэй записал для лондонского лейбла
    JSP Records. При записи ему помогали саксофонисты Джон Фирмин (Johnny Nocturne Band) и Роб Саддат (Huey Lewis and the
    News). Будучи мастером гитарных струн, Кенни не обладает вокальными способностями, поэтому обычно приглашает на запись
    профессиональных вокалистов со стороны. На этом альбоме их сразу трое: Джимми Морелло (который также выступил в качестве
    продюсера диска вмести с самим Кенни Рэем), Джэки Пэйн и Чарли Чавес (который дополнительно сыграл соло на гармонике).


    Получился альбом блюза и блюз-рока с примесью соул, составленный преимущественно из авторского материала. Диск отдает
    дань блюзовой традиции, но не ограничивается ей. Любителям качественного традиционного блюза с духовыми и современным
    звучанием наверняка будет интересно ознакомиться.'
