  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-19'
  text: 'Прежде чем собрать собственную группу в 1990 году, мастер вест-коуст блюза
    и блюз-рока из Калифорнии гитарист Кенни Блю Рэй записывался с множеством современных
    блюзовых грандов, включая Чарли Масселуайта, Little Charlie and the Nightcats,
    Маршу Болл, Смоуки Уилсона и многих других.


    В 1994 году он выпустил первый сольник Fired Up!, причем на собственном лейбле
    Blue Ray/Tone King. Bless my Axe - шестой его сольник, и один из лучших. На нем
    представлено чуть меньше половины авторского материала, остальное - каверы. Среди
    помогающих при записи гостей - певцы и харперы Литтл Дэнни и Чарли Чавес, а также
    саксофонист Роб Саддат из группы Хью Льюиса. Приятный альбом современного блюза
    от мастера гитарного тона.'
