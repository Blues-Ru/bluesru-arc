  author: Константин Колесниченко
  mark: 10
  date: '2007-06-05'
  text: 'Джерри Портной - харпер, который играл в группе Мадди, был в составе Eric Clapton''s All-Star Blues Band, с последним
    записывается до сих пор. Джерри очень популярен как cайдмен, но сольных альбомов у него совсем мало - всего три, плюс
    еще учебник по изучению игры на гармонике. Каждый из этих альбомов представляет огромный интерес и ценность. Дело в том,
    что Джерри обладатель шикарного звука (ему он уделяет большое внимание в своей школе) и очень виртуозный музыкант.


    Данный альбом - это отличная подборка блюза и джаза, сыгранного с потрясающим вкусом и чувством. Нужно отметить, что Джерри
    играет исключительно на диатонической гармонике на этом альбоме, но с завидным мелодизмом. С Портным играют музыканты
    высочайшего класса: Duke Robillard,Marty Ballou,Steve Ramsay,Doug James,Gordon Beadle,Troy Gonyea,Bob Malone, Mark Davis.


    Обязательный СД для всех изучающих игру на гармонике!'
