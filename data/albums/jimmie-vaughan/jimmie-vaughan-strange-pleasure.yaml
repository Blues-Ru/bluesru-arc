- id: 1057
  author: Дмитрий Казанцев
  mark: 9
  date: '2007-04-07'
  text: 'Прекрасный дебют старшего брата Стиви Рэя Вона! Джимми поет и играет блюз, ритм-н-блюз, соул и госпел. Все это классно
    сыграно и замешано вместе. Подпевки и клавиши - великолепно! Песня SIX STRINGS DOWN (by Neville Brothers) тоже тут - она
    про Стиви Рэя.


    Этот диск не только интереснее всех работ группы Fabulous Thunderbirds (с Джимми), но он лучше всех альбомов младшего
    брата, и даже посильнее их совместного диска FAMILY STYLE. Джим поет своим голосом, не пилит на гитаре постоянно, все
    очень душевно и в духе черной музыки. И еще важный момент - тут почти нет следов моды 80-х, которая портит все альбомы
    Стива и вообще музыку тех лет.'
