- id: 1183
  author: Константин Колесниченко
  mark: 9
  date: '2007-12-29'
  text: 'Jimmy Reed, наравне с Вилли Диксоном, является одним из главных поэтов блюза,
    да и не только блюза, ведь их песни настолько хороши и точны, что просочились
    и в другие жанры музыки. Пожалуй, нет ни одного по-настоящему блюзового музыканта,
    который не исполнил хотя бы раз "Hush Hush" или "Baby, What You Want Me To Do".
    Песни эти проверены временем, блюзом, роком, гитарами и гармониками огромного
    количества других музыкантов и при правильном подходе обязательно зазвучат как
    нужно. Альбом "On the Jimmy Reed Highway" Omar Kent Dykes и Jimmie Vaughan посвящен
    именно Джимми Риду и состоит преимущественно из его материала.


    Omar Kent Dykes - лидер блюз-роковой Остинской группы "Omar & the Howlers", музыка
    их не изысканна, а крепко сбита, рычащая и напористая. Jimmie Vaughan же наоборот
    гитарист деликатный и аккуратный. Как следствие, их музыкальный союз вышел замечательным
    и приятным для уха любого блюзового поклонника. Альбом не звучит, как очередной
    набор шаффлов и маршей, хотя и выдержан в стилистике чикагского блюза, все очень
    легко и "вкусно" исполнено.


    Не знаю, была ли это договоренность двух музыкантов или еще что, но почти все
    вокальные партии принадлежат Омару (а его вокал - это традиции Howlin'' Wolf),
    а гитарные Джимми. Лишь на "Aw Shucks, Hush Your Mouth" и "Baby, What You Want
    Me To Do" поет Джимми, а Омар играет только на "You Made Me Laugh" и "Baby, What''s
    Wrong". На альбоме присутствует много звездных гостей: James Cotton, Delbert McClinton,
    Kim Wilson, Lou Ann Barton, Gary Primich (хотя как гость он почему-то не обозначен)
    и Gary Clark Junior (к сожалению, эта персона мне неизвестна). Да и сопровождающий
    состав - это известные и проверенные музыканты, например, Ronnie James - bass
    или Derek O''Brian - guitar. Единственным разочарованием альбома для меня является
    гармоника авторства Кима Вилсона - как-то совсем плоско он тут звучит, почти нет
    вибрато и прочих фирменных харперских штучек. Но зато, когда за инструмент берутся
    James Cotton или Gary Primich (да и Delbert McClinton звучит гораздо убедительнее)
    - это совсем другое дело, сразу слышно богатый и хороший звук, отличную фразировку.


    Замечу, что "On the Jimmy Reed Highway" может стать альбомом года на вручении
    "Blues Music Awards 2008". В моем личном чарте он таким уже стал.'
- id: 1246
  author: Андрей Евдокимов
  mark: 8
  date: '2008-04-09'
  text: '"Лед и пламя" - это уже преувеличение. Однако союз Джимми Воэна и Омара Дайкса
    казался невозможным – не схожи их блюзовые манеры. Omar & the Howlers играют блюз
    "кабацкий": разудалый и разухабистый. Поет Омар хрипло, с куражом загулявшего
    биндюжника. Воэн – сдержанный эстет, мастер рафинированных и лаконичных гитарных
    соло. Но оба – техасской выучки, а сошлись на любви к чикагцу Джимми Риду. Сия
    работа – лучший пример единства противоположностей в блюзе. Прибавьте губные гармоники
    Деймса Коттона, КимаУилсона, Гэри Примича и голос Лоу Энн Бартон. Песни Джими
    Рида в правильном соотношении общеизвестных и извлеченных из забвения. С точки
    зрения современного звучания блюзовых традиций – альбом выше всяких похвал: и
    мастерски, и душевно.'
