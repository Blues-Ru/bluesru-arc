- id: 1629
  author: Михаил Белов
  mark: null
  date: '2010-07-12'
  text: 'Даже с применением новейших микроскопов найти на альбоме что-нибудь новое не представляется возможным. Это все тот
    же блюз, все тот же Джимми Вон, все та же фирменная гитара, все та же манера пропевать любые тексты на один и тот же мотив.


    Песенки подобраны клевые, но благодаря особой "вокальной ноте" Джимми (она у него присутствует в единственном числе и
    никогда не меняется), кажется что на фабрике совершили ошибку при штамповке дисков и записали один трек пятнадцать раз.


    Фанаты получают свежую порцию фишек, большой список новых каверов и удовольствие от офигительного звука - записано все
    очень круто; ну а рядовым любителям блюза лучше переслушать старые диски Вона - они все-таки были поинтереснее.'
- id: 1632
  author: Андрей Евдокимов
  mark: 9
  date: '2010-07-20'
  text: 'Содержание классифицируется четко: это джамп-блюз рубежа 40-50-х годов, тех времен, когда эта музыка была популярна.
    И даже аморфное на первый взгляд название отсылает нас к обычаям того периода. Сыграв лишь одну инструментальную тему
    собственного сочинения, с названием как ключик к программе: "Было и прошло" - Воэн пропускает знаменитые и не очень стандарты
    через призму собственного музыкального восприятия. Звучит свингующий блюз-бэнд, прикрашенный небольшой секцией медных
    и полагающийся на воркочущий звук органа "Хэммонд Би-3" (на котором играет Б.Уиллис, участник в прошлом группы Джеймса
    Брауна). Гитарные соло Воона восхитительно точны и лаконичны. Эмоционально он легко сочетает искреннюю любовь к этой музыке
    с нежной ностальгией по ушедшей эпохе и тонкой доброй иронией. При этом общее звучание выстраивает столь оригинально,
    что под термин "ретро" его интерпретации никак не подходят. Превосходный альбом, да жаль, не всем понравится. Это ярко
    авторское, личностное прочтение… Кстати, первый альбом мастера за 9 лет!'
