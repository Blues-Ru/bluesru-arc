- id: 14
  author: А.Пелосси
  mark: 8
  date: '2002-10-13'
  text: 'Джимми Вон, вне сомнения, оригинал. Его

    манеру играть на гитаре не спутаешь. Джимми

    не назовешь большим певцом, однако голос

    его моментально узнаваем. Он не следит за

    музыкальной модой, он презирает массовый

    вкус и гитарные &quot;примочки&quot;. Это о

    достоинствах его нового диска, где явна

    симпатия к классическому соулу.

    <p>Джимми скуп на альбомы - это всего третий

    его сольник. Кроме того, для многих, он

    прежде всего &quot;брат 2&quot;, брат Стива Рея.

    Учитывая сказанное, интерес сразу

    повышенный.

    <p>Не уверен, стоит ли говорить об эволюции,

    поскольку от диска к диску как музыкант он,

    в общем-то, менялся мало. Но если говорить,

    то - Джимми дрейфует в направлении

    технологического минимализма и, если так

    пойдет дальше, мы услышим, как через 3-4 года

    на следующей пластинке он играет на своём

    Фендере, не подключенном к комбику вовсе.

    <p>Диск с затянутыми - для его манеры петь -

    вещами. Не Каррузо же он, чтобы петь, петь,

    петь. Аранжировки слабо развиваются,

    возникает ощущение, что музыкант слишком

    увлекается солированием. Скучновато.

    Холодная пластинка, хотя и не без

    достоинств.

    <p>Поостерегусь рекомендовать поклонникам <i>гитарного</i>

    блюза.'
- id: 251
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Карьера Jimmy Vaughan началась еще в середине 70-х, когда он собрал группу Fabulous Thunderbirds. Коллектив был весьма
    популярен, особенно в родном Техасе. В общем, все было нормально, пока на сцену не вышел Vaughan-младший - Stevie Ray.
    Его недолгая (увы!) карьера была столь яркой, что практически все техасские блюзмены в тот период оказались как бы во
    второй лиге. И Jimmy в том числе. Stevie Ray царил на сцене, а его старший брат не мог подписать элементарный контракт,
    чтобы выпустить очередной альбом своей группы. В 90-м Stevie Ray не стало. Jimmy покинул Fabulous Thunderbirds, а спустя
    два года начал сольную карьеру. "Do You Get The Blues?" - его третья пластинка. И, как и первые две, не очень интересная.
    Между тем, наверняка многие каждый раз ждут от Vaughan чего-то сумасшедшего, яркого - подобного тому, что мог предложить
    его младший брат. А Jimmy - другой. Его блюзу свойственна некоторая аккуратность (разве что на первом своем сольнике "Strange
    Pleasure" гитарист играл несколько по-другому), что для этой музыки не очень хорошо. Но по большому счету придраться здесь
    вроде бы не к чему: "Do You Get The Blues?" - крепкий ровный альбом, который наверняка понравится любителям блюза. Мне
    же здесь больше всего запомнились две пьесы, в записи которых участвовал Herman Green. Все-таки флейта - не самый типичный
    инструмент для блюза. Штатный флейтист был, по-моему, только у John Mayall.'
