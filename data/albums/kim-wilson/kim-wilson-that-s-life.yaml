- id: 1552
  author: Константин Колесниченко
  mark: 9
  date: '2009-06-22'
  text: 'Ким Вилсон – икона современного блюза, таким он стал благодаря участию в
    Fabulous T-Birds, а также своему мастерскому владению гармоникой. Да, его стиль
    и манера игры – не очень далеко ушли от Литтл Уолтера и Джорджа Смита, но среди
    огромного количества современных подражателей этих легенд блюза – Ким один из
    первых и все же в его стиле есть свои особенности, главной из которых является
    – уникальный, объемный звук.


    "That''s life" - это второй сольный альбом Уилсона и, пожалуй, лучший в его дискографии.
    Как и дОлжно блюзмену из Техаса – он весь пропитан свингом, потому для записи
    его он пригласил именно тех музыкантов, что славятся исполнением подобной музыки:
    Duke Robillard, Junior Watson, Rusty Zinn, Gene Taylor, Derek O''Brian, Clarence
    Holliman, Larry Taylor, Richard Innes и ветеран чикаского блюза бас-гитарист Calvin
    Jones.


    Но нужно отметить, что Вилсон еще и неплохой вокалист, с узнаваемым вокалом (у
    которого, кстати, довольно много подражателей), потому на альбоме есть несколько
    композиций, в которых он раскрывается исключительно как певец: "Time Is On My
    Side", "I''ve been Searchin''", "Teach Me (How To Love You)".'
