reviews:
- id: 176
  author: Дмитрий Казанцев
  mark: 6
  date: '2003-08-22'
  text: 'Почти оффтопик для блюзового сайта, но все же этот сборник называется БЛЮЗ. Хендрикс был гением электрогитары, он
    был один из родоначальников психоделии, он практически придумал хард-рок, а еще он очень любил играть по блюзу. Записав
    четыре отличных студийных альбома и странный концертник, он умер, оставив за собой огромное количество записей разного
    качества. Вот из этих записей и делают все эти посмертные сборники вот уже 30 лет.


    На этой компиляции нарезка из блюзов и почти блюзов. Песен всего 11, а вот звучание диска аж 72 минуты! Большинство песен
    были неизданы до этого, с этой точки зрения это нужный материал. Вещи очень длинные, много импровизации разного качества,
    куча шума и свиста, психоделия, поток сознания...


    Не могу поставить этому сборнику больше 3 баллов. Слишком он длинный, скучноватый и нудный. Тяжело слушать его грязную
    игру в течение 72 минут, да еще в не очень хорошей записи. Джими был велик, но весь его гений записан на четырех его альбомах,
    а остальное очень "на любителя".


    Remember when you were young, you shone like the sun...'
- id: 2097
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2012-08-16'
  text: 'Сборник редких записей за период с 1967 по 1970, каверы классических блюзов и несколько собственных композиций близкой
    стилистики, включая ряд концертных записей. К традиционному блюзу имеет отношение довольно отдаленное, это скорее типичный
    для Джими психоделический импровизационный рок с блюзовыми интонациями. Тем не менее достаточно интересно для поклонников
    великого гитариста.


    Четвертое место в блюзовом топе Биллборда.'
