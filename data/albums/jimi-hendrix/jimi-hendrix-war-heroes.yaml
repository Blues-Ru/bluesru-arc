  text: '<img src="http://www.ljplus.ru/img/d/r/dr_nick/hendrix72b.jpg" width=200
    height=200 alt=''25,70 КБ''>


    Один из первых посмертных альбомов Джими с понятным и качественным студийным материалом.
    На диске 9 композиций, 3 из них более ранние с Ноэлом Реддингом на басу, остальные
    6 - песни его последнего периода, где на ударных снова Митч Митчелл, но на басу
    уже Билли Кокс (жаль что нет Бадди Майлза, конечно).


    Большинство песен написал сам Джими, но тут также есть классный инструментал "Tax
    Free" (Bo Hansson) и почти дурацкий, недоделанный "Peter Gunn" (Henri Mancini).
    Непонятка с песней "Bleeding Heart" - на альбоме написано, что это вещь Хендрикса,
    но есть источники, которые указывают, что это блюз Элмора Джеймса. Еще одна неясность
    - это "Beginning"; на диске заявлено, что эта вещь не Джими, но на Allmusic пишут,
    что она именно его. Все это не очень важно, ибо самое ценное в этом диске то,
    что здесь неплохие студийные записи ДХ, которые ранее не выходили на альбомах.


    Совсем необязательный диск для обычного любителя поп-музыки, но для фаната Хендрикса
    - это жемчужина (одна из немногих).'
