  text: '<img src=http://www.ljplus.ru/img/d/r/dr_nick/crash-landing.jpg>


    Один из немногих интересных посмертных дисков Джими. На альбоме всего 8 вещей, длится он менее 30 минут, но почти все
    время идет хорошая музыка. Все треки "новые", не выходившие на альбомах Хендрикса в 60-е. В песнях наложены инструменты
    и вокалы, в этом деле принимали участие классные музыканты: Jimmy Maeulen (percussion), Buddy Miles (vocals, drums), Jeff
    Mironov (guitar), Bob Babbit (bass), Alan Schwartzenberg (drums). Записи очень хорошего качества, порой лучше, чем оригинальные
    работы Джими. Мало здесь ненужного хард-рока и психоделического шума, большинство вещей в духе блюз-рока, соула и фанка.'
