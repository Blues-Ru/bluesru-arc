- id: 522
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-04-02'
  text: 'Единственный прижизненный концертник Хендрикса. На диске всего 6 композиций,
    все они длинные с пространными соло Джими. Хендрикс плохо поет и грязно (порой
    неритмично) играет, но Бадди Майлз и Билли Кокс вытягивают все это хулиганство.


    Есть тут шикарные песни - Who Knows, Power Of Love и Changes. Если бы не Бадди
    Майлз с его отменным пением и драммингом (это вам не "Митч Митчелл он драмс"),
    то этот диск было бы совсем тяжело слушать.'
