  date: '2005-11-27'
  text: '<img src=http://www.ljplus.ru/img/d/r/dr_nick/rarehendrix.jpg>


    Редкий альбом редких записей Джими (и не только его). Никаких подробностей нет,
    могу лишь сказать, что тут записи с разных сессий, где Джими играет фанки-ритм-н-блюз,
    в основном без слов. Иногда кажется, что это вообще не Хендрикс (порой солирование
    похоже на Нила Янга, Питера Грина или Grateful Dead). Так и есть - некоторые источники
    говорят, что тут всего ДВА трека с участием Джими! Группа состоит из ударника,
    басиста и второго гитариста. Что-то подпевается хором. Музыка черная, в жанре
    R&B, а не в роке. Все это удивительно. С кем же тут джемует Хендрикс и другие?
    На диске 8 песен, все они чуть разного качества (слушать можно, откровенной грязи
    нет).'
