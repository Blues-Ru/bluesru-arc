  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-14'
  text: 'Двадцать пятый диск в карьере певицы - альбом традиционного акустического
    блюза 20-х - 30-х годов 20-го века в исполнении блистательной Марии Малдор, которая
    прославилась своими интерпретациями репертуара полузабытых исполнителей первой
    половины прошлого века. Оригинальные треки были записаны Мемфис Минни, Бесси Смит
    и рядом других исполнителей. В записи Марии помогают Бонни Райатт, Тадж Махал,
    Джон Себастиан, Эмос Гэррет, Рой Роджерс, Дэйв Мэтьюс и Элвин Янгблад Харт. Продюсировала
    альбом сама Мария.


    Минимальный акустический аккомпанемент (гитара или слайд гитара, фортепиано, иногда
    плюс еще контрабас) позволяет Марии своим голосом (а он у нее чрезвычайно выразительный
    и интересный) обыграть эмоции, заложенные в лирике. Хороший альбом традиционного
    народного блюза в профессиональной интерпретации, максимально приближенной к оригиналу.
    Девятое место в топе блюзовых альбомов Биллборда, две блюзовых премии Уильяма
    Хэнди и номинация на премию Грэмми.'
