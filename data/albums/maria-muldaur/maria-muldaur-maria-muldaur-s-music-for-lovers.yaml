  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-14'
  text: 'Сборник из трех альбомов, записанных Марией для фирмы Теларк в 1996, 1998
    и 1999 годах. На альбоме Fanning the Flames ей помогают Бонни Райатт и Сонни Ландрет,
    а альбом Meеt Me Where They Play the Blues посвящен Чарльзу Брауну (дуэт Gee Baby
    Ain''t I Good to You - его последняя прижизненная запись).


    Альбом неспешного расслабленного приджазованного блюза с примесью соул и госпел
    - своего рода фирменный коктейль Марии Малдор, который даже получил свое собственное
    имя: "блюзиана". Прекрасная вокалистка легко сочетает эти стили, свободно переходя
    из одного в другой, а ее хриплый сексуальный голос мягко обволакивает слушателя.
    Лучшие треки, на мой взгляд - восьмой и десятый, хотя и все остальные также на
    высоком уровне.'
