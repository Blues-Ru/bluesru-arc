- id: 1433
  author: Андрей Евдокимов
  mark: 6
  date: '2009-02-05'
  text: Это музыка приятная во всех отношениях – безо всякой иронии. Но и без каких-либо конфликтов, обычно свойственных песням
    Дилана. В соответствии с названием, в альбоме исключительно любовные песни. Есть и Lay Lady Lay, и I'll Be Your Baby Tonight
    и менее знаменитые мелодии. Джазовые баллады умело прорежены поп-свингом, игривым кантри, есть один блюз и чуть-чуть реггей.
    Альбом не превращается в однообразную "лирическую кашу", но и особым разнообразием не балует. Это просто идеальная музыка
    для фона, у которой есть несколько плюсов. Во-первых, это удивительный хрипловатый теплый голос певицы. Во-вторых, превосходные
    небанальные аранжировки. И в третьих, Мария и Боб подружились еще в начале 60-х в Гринвич-вилладж. Так что певица, вероятно,
    знает подоплеку этих песен.
- id: 1676
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-05-14'
  text: 'Мария Малдор была знакома с Бобом Диланом еще в начале 60-х, когда его карьера только начиналась. И вот в конце 2005
    года она решилась записать целый диск его песен - причем песен о любви, которые никогда не были доминирующими в творчестве
    поэта. Тем не менее за долгие годы Боб написал достаточно таких песен, и Мария выбрала и записала 12 из них.


    Помогал ей при записи коллектив высокопрофессиональных музыкантов, с которыми она уже неоднократно записывалась, включая
    гостевое участия Эймоса Гэррета. Интерпретация Марии может отличаться от оригинальных версий - ну так это даже и к лучшему,
    ибо пение - не самая сильная сторона творчества Дилана. В исходный фолк-рок добавились оттенки блюза, джаза и кантри,
    а вокальная подача, как обычно, просто замечательная. Хотя, на мой взгляд, не все из 12 треков удались одинаково хорошо
    (например, последний трек, да и классическая I''ll be your baby tonight как-то не очень прозвучали), но зато Wedding Song
    и Moonlight просто феноменальны.


    Первое место в топе блюзовых альбомов Биллборда (я думаю, в первую очередь из-за имени Боба Дилана, ибо для Марии это
    альбом не лучший).'
