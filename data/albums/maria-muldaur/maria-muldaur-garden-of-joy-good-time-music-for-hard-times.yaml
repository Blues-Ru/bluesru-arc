  text: 'Maria Muldaur and her Garden of Joy Muldaur is our national treasure and
    she helps to keep us young. ~ Richard Ludmerer, BluesWax, 2009


    Muldaur sounds positively energized by this return to her roots and delivers one
    of the best vocal performances in her long and storied career. ~ Mark Smith BluesSource.com,
    2009 - Good Time Music for Hard Times (2009)


    Свои первые записи Мария Малдор сделала в далекие 60-е именно в составе джаг-бендов
    Even Dozen Jug Band и The Jim Kweskin Jug Band. Джаг-бенды были особенно популярны
    в Америке 20-х и 30-х годов 20 века - это были бродячие фолковые и блюзовые ансамбли,
    исполнявшие народную музыку с использованием традиционных акустических и импровизированных
    музыкальных инструментов, созданных из подручных предметов (в какой-то мере они
    перекликаются с более поздней эпохой скиффл в Англии). На альбоме "Хорошая музыка
    для тяжелых времен" певица возвратилась именно к такому формату и записала ряд
    классических треков эпохи экономической депрессии, а также две новых песни, написанных
    Дэном Хиксом (The Diplomat и Let It Simmer). Певице аккомпанирует джаг-бенд из
    молодых музыкантов Crow Quill Night Owls, а также ряд именитых гостей.


    С некоторыми из музыкантов, которые помогли ей в работе над альбомом, Мария выступала
    еще в тех первых группах - это Джон Себастиан, Дэвид Грисман и Дэн Хикс (с которым
    она записала два дуэта). В альбом также вошла титульная песня с номинированного
    на Грэмми альбома Марии 2005 года Sweet Lovin'' Ol'' Soul. Среди других гостей
    на альбоме - знаменитый Тадж Махал. Музыка альбома - это энергичный зажигательный
    коктейль фолка, кантри, рэгтайма и диксиленда с примесью блюза и свинга, предназначенный
    для того, чтобы слушатель забыл о всех своих проблемах и развеселился. Продюсировала
    диск сама певица.'
