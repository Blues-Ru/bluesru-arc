- id: 1816
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-01'
  text: 'В отличие от преимущественно блюзовых пластинок замечательной американской певицы Марии Малдор данный диск в музыкальном
    отношении более эстрадный и джазовый, нежели блюзовый, хотя все песни балансируют на грани между джазом и блюзом.


    По мнению самой Марии, "Этот альбом - своего рода саундтрек к прекрасному отпуску в тропиках. Интимные моменты любви,
    призывы к любви и грусть о потерянной любви ... Он полностью о любви." Чувственный и проникновенный голос певицы оттеняется
    профессиональной игрой восьми талантливых музыкантов, образуя в итоге идеальный романтический фон для влюбленных.'
