- id: 2318
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2018-11-27'
  text: '40 years after the folk revival of the 60''s, Maria Muldaur has assembled some legendary female vocalists for her
    July Telarc release "Yes We Can," a very powerful selection of protest songs that not only work as commentary on the state
    of the world, but musically, hit every high note. ...it doesn''t get much better musically. ~ The Huffington Post, Sal
    Nunziato August 2008


    "This is one fine album. Strongly musical, free of preachment and tunnel vision. Part of the credit for its success is
    due to Muldaur''s own strong musical sensibilities... The duet [with Bonnie Raitt] "Yes We Can" already has been co-opted
    by Barack Obama''s supporters." ~ Tuscaloosa News July 2008


    Для работы над своим 35-м сольным альбомом Мария решила обратиться к антивоенной теме и теме спасения планеты от разрушения.
    Для этого она обратилась к песням эпохи возрождения фолка 60х- 70х годов 20 века - песням протеста, которыми прославились
    в то время Боб Дилан, Пит Сигер и другие, превратив эти песни в гимн миру. Ее также вдохновили слова Пита Сигера: "Если
    Вы любите свою страну, Вы найдете способ высказаться в защиту того, что является правильным. И отличный способ начать
    - это найти правильные песни и петь их снова и снова".


    В рамках данного проекта Мария собрала целый хор, получивший название "Женские голоса за мир", пригласив для участия в
    нем многих знаменитостей - Бонни Райатт, Джоан Баез, Джейн Фонду, Фибу Шоу, Одетту и многих других. Музыкальное сопровождение
    и аранжировки обеспечили музыканты, с которыми Мария уже неоднократно сотрудничала: клавишник и аранжировщик Дэвид Толкановски,
    ударник Тони Браунагель, гитарист Шэйн Териот и басист Хатч Хатчинсон. Продюсировала диск сама певица.


    Идея проекта и послание, которое он несет слушателю, бесспорно, заслуживают всяческой поддержки, однако в музыкальном
    плане не все получилось столь гладко: есть песни явно затянутые, есть и те, которые не очень прозвучали или не очень согласуются
    с отстальными. Одним словом, Yes We Can - как и все песни протеста - довольно специфический продукт, хоть и направленный
    на благое дело, вряд ли понравится всем и каждому.'
