- id: 1359
  author: Константин Колесниченко
  mark: 5
  date: '2008-11-05'
  text: 'На обратной стороне буклета есть слова от знаменитой блюзовой певицы первого
    поколения Victoria Spivey, она рассказывает о своем впечатлении от молодой Марии,
    тогда еще d''Amato. По ее словам, Мария должна была стать фолк-звездой, которые
    были так популярны в середине 60-х. Звездой, пожалуй, Muldaur так и не стала,
    но некоторую известность она приобрела, но самое главное, что у нее появился свой
    собственный музыкальный стиль(и сценический образ, см. обложку). Запись эта посвящена
    певицам того, старого блюза, который очень сильно смешан с джазом. В буклете к
    альбому Мария рассказывает историю своего знакомства с этой музыкой, а также представляет
    читателю основных фигур жанра: Victoria Spivey, Sippie Walace, Ma Rainey, Mamie
    Smith, Bessie Smith, Ethel Waters, Alberta Hunter и Sara Martin. Если вы слышали
    записи одной из вышеперечисленных исполнительниц, то альбом не будет звучать для
    вас в новинку. На мой взгляд - это довольно однообразные старые блюзы, сыгранные
    приблизительно в одном темпе, структура которых очень похожа. В этом нет абсолютно
    никакой вины Марии, это законы жанра и соблюла она их честно, исполнив всю эту
    музыку необычайно близко к оригиналу. Аккомпанирует Maria Muldaur James Dapigny''s
    Chicago Jazz Band, гостит на записи и Bonnie Rait. Самый интересный для меня момент
    на диске - это знаменитая "Empty Bed Blues", исполненная в формате трио – Мария
    и пианист с тромбонистом.'
