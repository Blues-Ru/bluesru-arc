reviews:
- id: 115
  author: Алексей Калачев
  mark: 9
  date: '2003-03-18'
  text: Диск посвящен музыке умершей в прошедшем году джазовой певице Пегги Ли. Безусловно, альбом джазовый. Однако, если
    вы поклонник женского вокала в блюзе, вам нужно им обзавестись. Одна из причин – сама Мария Мюльдор. То, что она за последние
    годы вошла в период фантастического расцвета своего блюзового таланта, ни у кого не вызывает сомнений. Это раз. То, что
    Мюльдор окрасила звучание своего "трибьюта" в глубочайшие тона блюза, говорит и само название, и сама суть ее интерпретации
    – чувственный, почти интимный и камерный по стандартам классических певиц блюза 20-х годов.
- id: 1675
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-14'
  text: 'Данный альбом блестящая певица и интерпретаторша традиционной музыки начала и середины 20 века Мария Малдор посвятила
    памяти недавно ушедшей от нас знаменитой эстрадной и джазовой певицы Пегги Ли, творчество которой оказало неизгладимое
    влияние на молодую Марию. Двенадцать треков из творчества Пегги в исполнении Марии сохранили джазовую природу, но приобрели
    явно выраженную блюзовую окраску, иногда даже с долей свинга. Чувственная и интимная подача Марии оттеняется почти камерным
    исполнением октета сопровождающих музыкантов, которое время от времени взрывается свингующими духовыми. Black Coffeе -
    это что-то :-)


    Отличный альбом ретро-окрашенного приджазованного блюза с современным звучанием и блестящим вокалом Марии.


    Девятое место в топе блюзовых альбомов Биллборда.'
