- id: 2315
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2018-11-21'
  text: 'Meet Me at Midnite (именно так написано на обложке) - один из лучших дисков американской певицы - мощный, энергичный,
    блюзовый, с примесью мемфисского соул и фанка. В записи принимали участие отличные музыканты - ударник Тони Браунагель,
    гитарист Джонни Ли Шелл, пианист Билл Пэйн, Рик Вито на слайд-гитаре, а также многие другие. Альбом можно слушать уже
    из-за одной заглавной песни с роскошными гитарными соло и энергичной вокальной подачей Марии. Музыка украшена периодическим
    подключением духовой секции Texacali Horns и вокальной группы. Нельзя не отметить уникальную трактовку песни Woman''s
    Lament, исполненной без аккомпанемента. В целом - крепкая, эмоциональная и достаточно разнообразная работа, приятная во
    всех отношениях.


    Данный альбом выходил в 1994 году на лейбле Black Top и к счастью был переиздан в 2005 году лейблом Shout!Factory.'
