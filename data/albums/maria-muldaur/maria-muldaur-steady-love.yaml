  date: '2018-11-23'
  text: 'Muldaur sounds fantastic. Her vocals have grown richer and huskier over the years, which suits this material perfectly.
    Steady Love is the kind of disc that will appeal not just to blues fans, but to music fans in general. It ranks high among
    Muldaur''s best releases. ~ Grahm Clarke, Phoenix Blues Society: Bluesbytes, 10/25/11


    "Soul & grit" emanates from Muldaur''s voice on every track of this impressive CD - Muldaur and the band excel at all
    levels. A triumph! ~ Mick Rainsford, Blues in Britain, 10/6/11


    Maria Muldaur and her sweet, sultry voice literally helped to define the term "Americana," and she''s a national treasure.
    She''s recorded songs that have crossed many genres'', and she appeals to fans of all ages. Get ready for a cool road
    trip down to N''awlins with "Steady Love!" ~ Sheryl & Don Crow, Nashville Blues Society, 9/26/11


    Отменный выбор материала, естественная непринужденная полистиличность и сильный глубокий обволакивающий голос - вот главные
    козыри знаменитой певицы, которую многие критики называют королевой традиционной корневой музыки, и это отнюдь не пустые
    слова. Она в состоянии взять практически любую песню в любом традиционном стиле и интерпретировать ее таким образом, что
    песня естественным образом становится ее собственной, как будто бы специально написанной именно для Марии Малдор.


    Steady Love - альбом-возвращение Марии к традиционной музыке Нового Орлеана, к "блюзиане" - прифанкованному свамп-блюзу
    с изрядной долей госпел, исполненному с участием лучших музыкантов этого города. На момент записи певице было 67 с хвостиком,
    из которых почти 50 лет она провела на сцене. В качестве музыкального директора выступает известный клавишник Дэйв Торкановски,
    гитарные партии записал Шейн Териот, в качестве гостя на слайд-гитаре - Рик Вито. Заглавный трек украшен подключением
    духовой секции. Диск записан с хорошим драйвом, позитивной и эмоциональной атмосферой, а также некоторой долей спонтанности
    и шероховатости, которая только делает его лучше. Альбом энергичный и разноплановый, но одинаково качественный - "проходных"
    песен на нем нет. Пожалуй, особенно интересны треки Soulful Dress, Rain Down Tears, Please Send Me Someone To Love и заглавный.


    Продюсировала альбом сама певица. Диск стал одним из лучших блюзовых альбомов 2011 года и определенно украсил обширную
    дискографию певицы.'
