  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-14'
  text: 'Обладательница чувственного обволакивающего голоса Мария Малдор еще раз демонстрирует
    свою универсальную полистиличность на альбоме 1999 года, записанном для фирмы
    Telarc, и посвященном знаменитому пианисту и вокалисту Чарльзу Брауну. На этом
    альбоме представлена последняя запись знаменитого музыканта, по праву считающегося
    одним из создателей "блюза западного побережья" (west coast blues).


    Подбирая треки для будущего альбома, Мария часто представляла их в сопровождении
    фортепианных партий в исполнении Чарльза Брауна, с которым она планировала записать
    диск. К сожалению, из-за тяжелой болезни пианист не смог принять полноценное участие
    в работе, и окончательный диск превратился в своего рода трибьют Брауну. Альбом
    был записан в октябре 1998 года на студиях в Беркли, Калифорния. Вокал Брауна
    для дуэта "Gee Baby, Ain''t I Good to You" был записан в частной лечебнице, поскольку
    состояние артиста не позволило ему добраться до студии. На диске представлен мягкий
    чувственный коктейль джаза, блюза и соул, замешанный на изрядной порции коммерции
    и поданный с легкой нотой сексуальности. Вместо Брауна фортепианные партии исполнил
    Дэвид Мэттьюс, и сделал это очень достойно. Нельзя также не отметить периодические
    включения духовой секции, включая соло Джима Ротермеля на кларнете и саксофоне.


    Высокопрофессиональный альбом медленного душевного блюза и джаза, для которого
    Мария выступила также и в роли продюсера. Мария Малдор бесспорно является ведущей
    современной исполнительницей "корневой" музыки, открывающей для современного поколения
    красоту традиционного наследия блюза и джаза двадцатого века.'
