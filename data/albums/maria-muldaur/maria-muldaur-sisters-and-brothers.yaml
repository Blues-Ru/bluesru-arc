- id: 1677
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-14'
  text: 'Совместная работа трех звезд современного блюза, записанная для лейбла Telarc. Преимущественно акустический альбом
    включает в себя стилистически разнообразные треки - и госпел, и фолк-блюз, и блюз дельты, и джаз, объединенные профессионализмом
    исполнителей и качеством исполняемого материала. Где-то одна треть на диске - авторский материал, остальное каверы блюзовой
    и традиционной классики. Обратите внимание также на аккомпанирующих музыкантов - все трое широко известные мастера в блюзовой
    среде.


    Кроме качества музыки диск характеризуется и качеством записи - недаром он вышел также и в формате SACD.


    Очень приятный альбом, выдержанный в традиционном ключе при одновременном стилистическом разнообразии.'
