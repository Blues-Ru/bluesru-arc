- id: 1015
  author: Дмитрий Казанцев
  mark: 7
  date: '2006-07-03'
  text: 'Альбом записан в Чикаго. Морис Джон поет и играет стратокастере. Его голос хрипловат, он часто поет почти как Хаулин
    Вулф (и это совсем не плохо). Игра Вона на гитаре чистым звуком - остро и интересно.


    На альбоме 8 блюзов, 6 из них написал сам Вон. Джон играет Чикаго-блюз, но фанки и соул-блюз тоже есть на этом альбоме.
    Звук 80-х портит пол-дела, но музыка хороша.'
