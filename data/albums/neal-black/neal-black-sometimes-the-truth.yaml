- id: 1801
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-30'
  text: 'Последний альбом Нила Блэка вышел в марте 2011 года на старом проверенном европейском лейбле Dixiefrog (с которым
    Нил сотрудничает уже более 18 лет), и быстро занял первое место в плей-листе французских радиостанций. Энергичная смесь
    блюз-рока и техасского буги разбавлена тройкой неспешных треков. Материал преимущественно авторский. Есть на диске и три
    инструментала, исполненных технично и профессионально. Музыканты используют широкую палитру инструментов - тут и электрогитары,
    и слайд, и акустика, и старый добрый хаммонд, и фортепиано, и соло гармоники, и аккордеон.


    Помогали при записи следующие гости: Попа Чабби, Мэйсон Кейси, Нико Уэйн Туссен, Стив Холли и Фред Чапелье. В целом -
    очень приличный диск, который не оставит равнодушными любителей современного электрического блюза.'
