  author: Антон Ворожеев
  mark: 9
  date: '2010-02-17'
  text: 'Губная гармошка в блюзе проделала большой путь: от компактного инструмента,
    который любой негр мог взять с собой на плантацию и поиграть в перерыве, до одной
    из визитных карточек этого музыкального направления. История запечатлела такие
    столпы, как <i>Little Walter</i>, два <i>Sonny Boy Williamson, Howlin'' Wolf,
    Sonny Terry</i> и другие, от которых отталкивались последующие поколения блюзовых
    музыкантов.


    John Nemeth варился в самом соку этой музыки – его путь начался с прослушивания
    блюза и r''n''b, затем он пел в церковном хоре, потом - в подростковых группах.
    На гармошке он учился играть по записям корифеев, но постепенно пришел к собственной
    манере игры, которая лишь основана на старой школе, но вовсе не копирует ее нота-в-ноту.


    Love Me Tonight – это в первую очередь альбом Неметта-музыканта, нежели Неметта-харпера.
    В отличие от его предыдущих дисков, он уходит далеко вперед с точки зрения качества
    песен. Все же, раньше Джон играл, хоть и качественный, но стандартный блюз, который,
    так или иначе, основывался на нескольких квадратах, оставленных нам в наследие
    трудягами с Миссиссиппи. Здесь же есть такие легкие и мелодичные композиции, как
    <i>Too Good To Be True, Love Me Tonight</i> и <i>Fuel For The Fire</i>, и это
    нонсенс для блюза.


    Следующая вещь, которая сразу же бросается в глаза – это голос Неметта. Кристально
    чистый, он украшает даже самые минорные песни и не оставляет камня на камне от
    стереотипа, что блюз – это <i>"когда грустный негр под унылую гитару хрипло жалуется
    на жизнь"</i>. Эти песни потеряли бы большую часть своей красоты, будь они спеты
    иначе.


    Когда говоришь про альбомы харперов, невозможно обойти описание того, как звучит
    губная гармошка на их записях. Прослушав Love Me Tonight целиком, сразу же, ловишь
    себя на мысли "гармошка – не ритм-секция". И правда, здесь она только в половине
    песен: в большинстве случаев в небольших соло и в каждом случае это не затертые
    паттерны, а уникальные мелодии. Примерно таким же образом губная гармошка звучит
    у Битлз.


    Альбом записывался и сводился на студии Кида Андерсена, который также был продюсером,
    наряду с самим Неметтом. В нескольких песнях на гитаре засветился <i>Elvin Bishop</i>
    (интересно, что на альбоме Бишопа <i>The Blues Rolls On</i>, вышедшем годом ранее,
    Джон играет на гармошке), остальные же песни легли на плечи молодого гитариста
    <i>Бобби Уэлша</i>, чей послужной список на тот момент насчитывал несколько десятков
    имен – от <i>Rusty Zinn</i> до <i>Charlie Musselwhite</i>.


    На официальном сайте Неметта можно прочесть около десятка положительных отзывов
    о <i>Love Me Tonight</i>, AMG поставил альбому 4 звезды. Эти песни нравятся, как
    любителям блюза и гармошки, так и тем, кто любит совершенно другую музыку. Сейчас,
    больше, чем через год после релиза альбома, его продолжают слушать дома, на работе,
    в машинах и айподах. А для современного диска это хорошие показатели.'
