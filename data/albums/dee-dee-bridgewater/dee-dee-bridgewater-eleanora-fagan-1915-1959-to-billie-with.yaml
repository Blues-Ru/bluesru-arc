  author: Андрей Евдокимов
  mark: 9
  date: '2010-07-20'
  text: '"Lady Sings the Blues" превратили в клише, в салонный джазовый романс. Бриджуатер
    соскребает с песни сусальное золото. Головокружительный ритмический вихрь босса-новы,
    едва поднявшись, упирается в жесткие блюзовые 4/4 как в клетку, и снова раскручивается
    в калейдоскоп отчаянных чувств от обиды до гнева и к финальным вудуистичеким повторам
    заклинания: "Она больше не станет петь блюз" . "Блюз – это сердца боль" - давненько
    никто в джазе не принимал эти слова буквально. Высочайшее мастерство вокала, игра
    с тембром голоса от хриплого блюза до колоратурных пассажей согласуется с драматическим
    мастерством. Такие глубокие образные стихи, как в этих песнях, сродни искусство
    импрессионизма, растворяющего зыбкую повседневность в яркую палитру эмоций...
    В коллекции наград певицы есть и Грэмми за лучший джазовый вокал (1998 г.), и
    театральная премия "Томми". Новый альбом – умный и чувственный музыкальный спектакль.
    Великолепная игра джаз-комбо, прозрачная чистота акустики, напористые хард-боповые
    импровизации… А в целом – мрачно, горько. Так альбом и задуман не к юбилею, а
    к годовщине смерти Билли Холидей. От старта задиристой "All Of Me" к финальной
    трагической "Strange Fruit" (под басовые линии контрабаса и бас-кларнета) проносится
    большая жизнь.'
