reviews:
- id: 851
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-09-08'
  text: 'Второй альбом Бишопа для лэйбла Capricorn. Элвин играет южный рок, у него
    это отлично получается. В его группе: Johnny "V" Vernazza - guitars/vocals; Michael
    "Fly" Brooks - bass; Phil Aaberg - keys; Don Baldwin - drums/percussion/vocals.
    На записи также были друзья и тусовщики: Johnny Sandlin - guitar/percussion; Ross
    Mason - bass; Rick Kellogg - harmonica; Stephen Stills - guitar.


    9 песен на этой пластинке, 7 написаны Элвином, + "Crawling King Snake" (John Lee
    Hooker) & "Calling All Cows" (Earley Dranne). Отличный микс блюза, рока и кантри.
    Акустические и электрогитары, классные клавиши, перкуссия, подпевки - все на месте.
    Диск великолепно прописан и аранжирован. Можно сказать, что он также хорош, как
    и его первый диск на Каприкорне 1974 года.'
