- id: 852
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-09-08'
  text: 'Четвертый альбом Элвина на Capricorn Records. Музыка скорее ритм-н-блюз, чем южный рок и блюз-рок. Много фанка и
    даже есть регги. В группе есть отдельный вокалист Mickey Thomas, певица Reni Slais, сам Элвин тоже поет периодически.
    На пластинке 10 треков, почти все написал сам Бишоп, но есть и интересный кавер - "Twist And Shout".


    Этот диск совсем далек от блюза, рока тоже осталось немного, но здесь много других интересных жанров и стилей. Все отлично
    спето и сыграно, конечно; диск легко слушается. Он не переиздан на компакт-диске.'
