- id: 1212
  author: Разные авторы
  mark: 6
  date: '2008-02-06'
  text: Это концертный альбом, записанный 03 декабря 2006г. в клубе Constable Jack, Калифорния. Звук достаточно посредственный,
    но, на мой взгляд, передает атмосферу концерта. На диске не только классические блюзы, но и композиции в стиле Нового-Олеана,
    роковые номера. Диск открывается композицией в "современном" стиле (современность придает рисунок ударных). Если не ошибаюсь,
    Элвин там играет слайдом. Вообще, его игра на гитаре здесь впечатляет. Что касается остальной группы, то, в общем, тоже
    все хорошо, за исключением нескольких сырых моментов, где создается впечатление несыгранности и неотрепетированности материала.
    Вот эти моменты и портят диск. <p align="right"><i>Анатолий Копыл</i>
- id: 1231
  author: Андрей Евдокимов
  mark: 8
  date: '2008-03-22'
  text: 'Блюз требует соблюдения традиций. Одновременно он требует индивидуальности. Боб играет блюз почти полвека, и в первой
    половине альбома вы получаете то, что и ожидали: крепкий профессиональный блюз. И вдруг, когда уже кажется, что сюрпризов
    не будет, группа взрывается бешенным ту-степом, где гитара тянет в одну сторону, гармошка, - в другую, а рояль блямкает
    свою новоорлеанскую линию…- нет слов… Потом Боб дает передышку: песенку про то что песик – лучший друг. И только вы расслабились:
    ныряет в глубокий правдивый блюз "Belly Rubbin", оттягиваясь на гитаре, как любой белый парень в 60-х. А когда короткий
    альбом закончится, любитель блюза скажет: "уже все?". Если хочется дальше – это лучшее качество альбома.


    Определенно не для новичков: такой непричесанный раздолбайский блюз может и испугать при первом знакомстве. Зато тем,
    кто помнит участие Бишопа во второй чикагской блюзовой революции, будет забавно это возвращение к "дореволюционной" манере.
    Из предсказуемого есть "простуженный" звук слайда и любимая песня My Dog про лучшего друга человека, который приведет
    домой, даже когда сам человек будет пьян в стельку. Из сюрпризов: разудалая нецивилизованная манера игры всех солистов
    поверх безупречно драйвового ритма. Бишоп – известный юморист-разговорник, но лучшие номера концерта именно инструментальные.
    Забудьте о джазовых изысках! В первом треке тамтамовый ритм а-ля Бо Дидли рисуется ударными, стиральной доской, бубном,
    свисточком и гармонью… "Мы теперь живем в городе, но музыка у нас своя, деревенская" - это кредо. А вывеска про попки
    - Booty – недвусмысленно декларирует двусмысленность намерений.'
- id: 2288
  author: Олег Пчелкин (oleg_spb)
  mark: 8
  date: '2017-09-27'
  text: 'Альбом с многозначительным названием Booty Bumpin ("Проталкиваемся задницей") записан Элвином 3 декабря 2006 года
    в клубе Constable Jack, в городке Ньюкасл, штат Калифорния с поддерживающими его музыкантами числом до шести. Выпущен
    в 2007 году на Blind Pig Records и стал четвертым по счету концертным альбомом музыканта.


    Бишоп родился во всегда модной и музыкально продвинутой Калифорнии, но вырос на ферме в сельской Айове, а затем в десятилетнем
    возрасте родители перевезли его в Оклахому, где он с возрастом продемонстрировал весьма впечатляющие способности к учебе,
    спокойно выиграв путевку в Чикагский университет, как один из лучших учеников штата по предмету "физика" и даже начал
    в 1960 году там учиться.


    Но в 1963 Бишоп познакомился с дувшим блюз на губной гармонике Полом Баттерфилдом, физика была отправлена далеко и надолго
    и творческий союз этой пары продолжился около пяти лет в Butterfield Blues Band, повторимся, первой американской группе
    , начавшей в США играть в стиле "блюз-рок".


    Начинал он там , как единственный гитарист группы, но позже Майк Блумфилд оттеснил его с позиции лидер-гитариста на первых
    их двух альбомах, признанных впоследствии "классическими ". После ухода Блумфилда Бишоп вернулся на позицию главного гитариста
    группы, но не надолго, а именно до 1968 года , когда проект в целом перестал быть чем-то серьезным и был погребен под
    лавиной возникших более эффектных рок-блюз-аналогов.


    Далее музыкант создал свою собственную группу, но охотно параллельно выступал с тогда коммерчески успешными Grateful Dead
    и The Allman Brothers Band. В 2000 музыкант пережил трагедию, лишившись первой жены и дочери, которых убили из-за денег
    вымогатели - тогдашний приятель дочери, его брат и еще один сообщник.


    Музыка этого альбома - стилистический замес из классических чикагских блюзов, композиций в стиле Нового Орлеана, каджуна,
    рок-номеров с уклоном в южном направлении, - в целом крепкий профессиональный блюз начала 2000х в исполнении не вполне
    сыгранного состава музыкантов, что чувствуется местами однако, но не сильно.


    Часть треков - авторства самого Бишопа, другая часть - кавера: "Keep a Dollar in Your Pocket," Роя Милтона ( Roy Milton''),
    "I Feel Alright Again" Кларенса Гейтмауса Брауна (Clarence "Gatemouth" Brown), "I''m Gone." Аллена Тюссо (Allen Toussaint)
    Одна вещь пианиста группы Стива Уиллиса тоже вошла в альбом (Half Way out The Door), он сам ее и поет более-менее прилично.


    Выделяются индивидуальным мастерством Эд Эрли эффектными партиями тромбона и Стив Уиллис, своим фортепиано и аккордеоном
    придающий блюзам "корневой" оттенок.


    Открывает альбом номер "Stomp" - с солирующей слайд- гитарой Бишопа и там-тамами барабанщика Бобби Кохрана, где трудно
    определить, где заканчивается Чикаго и начинается Новый Орлеан. Далее идет классический фанк "Ворованные арбузы" ("Stealin
    Watermelons") и пара рок-блюз номеров среднего темпа с обильным, жирным и густым слайдом Бишопа. Пятым по порядку несколько
    портит общую картину своим слабым незамысловатым вокалом тромбонист Эд Эрли, впрочем этот номер служит для представления
    некоторых музыкантов-участников концерта, гитарист и пианист вставляют свои соло в канву.


    Инструментальный шаффл Booty Bumpin, давший название альбому, призван обратить внимание на умелость Джона Немета (John
    Nemeth), как губного гармониста . Более на альбоме эта еще восходящая на то время молодая звезда блюза не появляется.


    Далее идет уже упомянутая Half Way out The Door, следом за ней - приблюзованный фанк My Dog, потом - неторопливый (на
    6 минут) пафосный инструментал Belly Rubbin, чтобы дать время отдохнуть голосовым связкам вокалистов и показать , как
    может запиливать на гитаре Майк Счермер (Mike Schermer) и вышивать на тромбоне Эд Эрли.


    Свои весьма скромные вокальные способности демонстрирует на I''ll Be Glad барабанщик коллектива Бобби Кохран. Но каждому
    же в конце концов нужно дать самовыразиться. Вновь для передыха вокалистов служит простой неторопливый блюз Blue Flame,
    где голубое пламя раздувает специальный гость - гитарист Дэниэл Кастро и Элвин Бишоп между делом выдает задушевный монолог
    под музыку.


    Заканчивается концерт кавером - чистым Нью-Орлеаном Алена Тюссо I''m Gone, который постепенно затихает. Занавес. Хорошо,
    да мало.'
