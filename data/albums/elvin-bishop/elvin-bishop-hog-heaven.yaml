reviews:
- id: 746
  author: Дмитрий Казанцев
  mark: 7
  date: '2005-07-01'
  text: 'Шестой и последний диск Бишопа для Capricorn Records. Многое поменялось с
    тех пор, как он записал первый альбом для этого лейбла. Здесь у Элвина другой
    состав и другая музыка. По-прежнему эклектичная и веселая, но другая. Первый трек
    "It''s A Feeling" настолько похож по гармонии на "Such A Night", что диву даешься.
    "Arkansas" - классика южного рока с сильным кантри-акцентом. Maria Muldaur поет
    первым голосом в песне "True Love", а гармонист Applejack написал шикарную блюзроковую
    "Let''s Break Down", и в ней играет на гармошке, конечно. 8 песен из 9 тут написаны
    Элвином - это не может не радовать, конечно.


    На этом диске почти не осталось того фанкового влияние, которое было у него в
    середине 70-х, вместо это появились более традиционные ритм-н-блюзовые и кантри-мотивы,
    веселые и даже слишком игривые порой. Слушая некоторые моменты на диске, понимаешь,
    что сам Элвин был в тупике и не знал, что ему делать дальше. Тем не менее, альбом
    вполне "съедобный" и интересный по звуку и аранжировкам. Конечно, его ранние работы
    на Capricorn были сильнее и более музыкальные.'
