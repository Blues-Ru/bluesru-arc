  author: Дмитрий Казанцев
  mark: 9
  date: '2005-07-01'
  text: 'Третий альбом Элвина на фирме Сapricorn. Бишоп продолжает развиваться в сторону
    фанка, соула и прогрессивного блюз-рока. На этом диске есть даже почти реггийные
    ритмы. Это можно бы было назвать южным роком и блюз-роком, но эклектика и разнообразие
    на этом альбоме не позволяет это сделать. Да, тут есть блюз, рок, фанк, соул и
    кантри, но все это очень интересно и УНИКАЛЬНО смешано.


    На диске 10 песен, 9 написаны Элвином, а знаменитая "My Girl" (Smokey Robinson)
    сделана в бодром темпе с интересным ритмическим рисунком. Состав на диске большой
    - есть отдельный вокалист Мики Томас (хотя Элвин сам иногда поет), Джонни Верназза
    - еще один гитарист в составе, на басу Майкл Брукс, Дон Болдвин - перкуссия, Фил
    Аберг играет на пианино и клавинете, еще один клавишник по имени Билл Слэйс играет
    на синтезаторе, а третий "кибордист" Майк Кек шустрит на пианино и органе; на
    саксе - Терри Хэнкс. Богатый состав, "большие" аранжировки, много всего интересного
    происходит. Элвин вообще не тянет одеяло на себя, и это замечательно.


    К блюзу этот диск имеет мало отношения, но все же Бишоп - культовый блюз-роковый
    гитарист 60-х, а в 70-х он пошел еще дальше в развитии. Слушать его приятно, как
    и его группу.'
