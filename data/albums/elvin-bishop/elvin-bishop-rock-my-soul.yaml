reviews:
- id: 850
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-09-08'
  text: 'Это третий сольный альбом Элвина (он был гитаристом Butterfield Blues Band в 60-х, как мы помним), диск вышел на
    фирме Эпик и был спродюсирован Бишопом с помощью Дилэйни Брамлетта (это не очень хорошо, Брамлетт попсит). 11 песен в
    духе ритм-н-блюза и соул-блюза, но попсовые звуки струнных явно мешают. Элвин прекрасно играет на гитаре и мило поет,
    но поет он не все - на альбоме есть черная дама Джо Бэйкер, она поет около половины материала (это явный минус, конечно).


    Хорошие песни, прекрасный звук, классная группа, но пение Джо и струнные явно мешают. Блюза и рока тут совсем мало, к
    сожалению. И тем не менее, это очень добротная и яркая музыка.'
