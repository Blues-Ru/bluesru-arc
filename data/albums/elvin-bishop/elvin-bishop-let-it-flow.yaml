- id: 751
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-07-02'
  text: 'Это четвертый сольный альбом Элвина и его первый на знаменитом лейбле Capricorn.
    Диск очень неожиданный и многообещающий; на первой стороне пластинки - мощный
    заряд ритм-н-блюза, блюз-рока и Южного рока, а на второй стороне - почти чистый
    кантри и кантри-рок. Очень много известных людей решило отметиться на этом сольнике
    Бишопа: Richard Betts - гитара (Allman Brothers Band), Toy Caldwell - pedal steel
    guitar (Marshall Tucker Band), Charlie Daniels - fiddle, Johnny Sandlin - guitars
    & producer, Sly Stone - organ (вот уж кого не ожидал тут услышать).


    На альбоме 11 песен, 7 из них написал сам Бишоп. Из каверов стоит отметить "Honey
    Baby" (Lightnin'' Hopkins) и "Hey Good Lookin''" (Hank Williams).


    Симпатичный блюз-кантри-рок альбом. Очень всем советую, особенно тем, кто любит
    блюз-кантри-рок и разнообразную игру на инструментах.'
