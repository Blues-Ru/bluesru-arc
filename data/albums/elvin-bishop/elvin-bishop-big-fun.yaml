- id: 947
  author: Дмитрий Казанцев
  mark: 7
  date: '2006-01-07'
  text: 'Прошло 10 лет между этим альбомом на Аллигаторе и последним альбомом Элвина на Каприкорне. За это время Бишоп выпустил
    всего один диск в Германии Is You Is or Is You Ain''t My Baby? для лейбла Line.


    На этом альбоме все очень хорошо с музыкой (блюз, ритм-н-блюз, кантри-соул), с составом (Доктор Джон на клавишах, Нортон
    Баффало на гармошке...), но звук 80-х портит многое. Песни отличные, есть тут известные темы: "Don''t You Lie To Me",
    "Honest I Do", "The Right String But The Wrong Yo-Yo".


    Хороший диск для Аллигатора 1988 года и для Элвина после 10-летнего перерыва.'
