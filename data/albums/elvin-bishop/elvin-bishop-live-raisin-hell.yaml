reviews:
- id: 853
  author: Дмитрий Казанцев
  mark: 7
  date: '2005-09-08'
  text: Серьезный двойной концертник. Два певца (Элвин и Мики), женские подпевки (и пение тоже), мощная духовая секция. На
    этом двойнике 15 треков, 14 написаны Бишопом (его лучшие вещи 70-х годов) и одно ритм-н-блюзовое поппури (для мамы, она
    была в зале). Звук прекрасный, группа хорошо сыграна и классно импровизирует и играет. В программе, в основном, фанки
    и ритм-н-блюз, большинство песен в быстром темпе. Зал в восторге - есть от чего. К сожалению, нет нового материала или
    чего-то неожиданного (поппури не в счет - это слабое место на диске на 13 минут).
