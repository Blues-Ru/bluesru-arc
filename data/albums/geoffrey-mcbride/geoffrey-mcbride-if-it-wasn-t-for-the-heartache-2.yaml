- id: 1541
  author: Андрей Евдокимов
  mark: 5
  date: '2009-05-18'
  text: 'Добротный образец современного модерн-блюза. "Масломасленное" определение более чем уместно: все очень мягенько и
    гладнько, и вращается без скрипа. МакБрайд – имя не громкое, но у музыканта огромный исполнительский опыт. Что, собственно,
    позволило ему записать альбом за четыре дня "живьем" в студии и сразу на пленку (стало быть, минуя компьютерные пересведения).
    А звук при этом получился очень сбалансированным, густым и насыщенным, покоящимся на "подушке" аккордов электрооргана
    "Hammond B-3". Идеальная для модерн-блюза ритм-секция: никаких изысков, зато все четко на месте. Замечательные "черные"
    подпевки… Альбом прокатывается по всем стилям, приемлемым для модерн-блюза. Открывается свингом, имеется суровый чикагский
    риф в "Nobody''s Fool", проходит через соул и завершается фанком. Недоумение вызывает "Crazy" – словно саундтрек из молодежной
    комедии: оптимизм подаче и штампы в аранжировках. "Ain''t Nothing Like A Bad Woman" – та разновидность соул, которую трудно
    отличить от стандартной сладкой эстрадной баллады, здесь тоже все по проверенным рецептам. В минусы альбома следует записать
    именно это его качество: добротно, но ничего нового. А плюсов множество. Все песни собственного сочинения, и среди них
    нет вымученных. МакБрайд очень умелый вокалист, он знает, какой эффект производит контраст между строчкой, спетой мягким
    соул-баритоном, и следующей за ней грозной хрипотой. При случае и фальцет подпустит – ловушка для романтичных девушек.
    Гитарой он пользуется дабы оттенять и отвечать на вокальную линию. Предпочитает лаконичные фразы, однако, если в соло
    не может нащупать логичное завершение, ныряет в обычную кучу-малу из быстрых нот. Заглавная песня не уступает хитам Роберта
    Крэя периода его высшей популярности. При неброскости подачи, в альбоме кроется масса нюансов, которые в арсенале бывалого
    гастролера накапливаются годами, - так что от повторного прослушивания удовольствие только прибывает. "Ключевые" песни:
    I''ve Been Running и Criminal Lawyer.'
