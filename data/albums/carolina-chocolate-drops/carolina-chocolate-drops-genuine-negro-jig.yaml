- id: 1650
  author: Андрей Евдокимов
  mark: 8
  date: '2011-01-05'
  text: 'Никакого "бережного отношения к традициям"! Музыка жива, отражает эмоции
    и требует от музыканта виртуозности в не меньшей степени, чем чувство юмора, или
    накатившей тоски. Трио, которому чихать на политкорректность, вспоминает времена,
    когда народная музыка не делилась на "белый" кантри и "черный" самопальный блюз.
    Это очень бодрая и далекая от следований историческим правилам народная музыка
    (хотя историю музыканты знают отлично, но слушателю несут не урок, а искренность
    чувств). В основе трио: банджо, гитара и скрипка, но все трое - мультиинструменталисты
    и вокалисты. Музыка лишь слегка знакомая в России благодаря фильму "Где же ты,
    брат?" Невольно завидуешь тем, кто побывал на их концерте: если так непосредственно
    они держаться в студии, то как же замечательно они звучат в непосредственном контакте
    с публикой.'
