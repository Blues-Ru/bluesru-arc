  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: 'Вам нравилась музыка фильма "Где брат твой"? Берите этот диск. Это традиционная
    музыка. Исполненная с молодым энтузиазмом. Здесь есть банджо, навязчивая скрипка,
    немножко губной гармоники…И даже стиральная доска здесь тоже играет. Еще в этом
    странном ансамбле (со странным названием) собрались афроамериканец, еврей, англо-саксонец
    и метис…Коктейль получился терпкий, временами слишком предсказуемый, но одновременно
    задорный, забавный, добродушный и с хорошим драйвом. "Если бы люди всей земли
    за руки вместе бы взяться могли" - они бы для начала сыграли так. И это было бы
    очень весело: можно ли представить себе веселую песню для пения в компании, которая
    называется "Жизнь коротка и приносит только беды"? – а она есть в этом альбоме.
    Не верите? Пойдите и проверите…'
