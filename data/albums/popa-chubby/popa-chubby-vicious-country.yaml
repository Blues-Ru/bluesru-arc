  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-04'
  text: 'В мае 2006 года самый увесистый электроблюзовый гитарист с своей супругой,
    знойной женщиной (мечтой поэта), в Мемфисе встал на то самое место в студии Sun,
    с которого молодой Элвис пел в микрофон. Пресли известен как микшер кантри и блюза,
    и Попа Чабби обратил свой взор к музыке кантри. Альбом он назвал "Порочное кантри":
    ценители традиций кантри-музыки получили удар, любители блюза слегка недоумевают.
    А Попа без комплексов с супругой Галей, бас-гитаристкой, играют и поют себе в
    удовольствие - весело и задорно - рокабилли, хиллбилли и блю-грасс - так, как
    они их понимают. Имеются слайд по steel-гитаре, а так же скрипка, прилагаются
    два домашних видио, на обложке улыбающиеся черепа и перекрещенные револьверы –
    все дела! Половина песен собственного сочинения, вторая половина: Earl Green,
    Gene Vincent и т.д., есть даже Act Naturally, написанная Вэном Моррисоном и прославленная
    the Beatles. Ключевые треки: Race With The Devil и Sam Lay''s Pistol (намеком
    на мощь удара Сэма Лэя, барабанщика Хаулин Вулфа).'
