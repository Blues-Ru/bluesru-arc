  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2012-08-07'
  text: 'Очередная работа самого большого по габаритам из современных блюз-рокеров,
    рожденного в Бронксе под именем Тед Хоровиц. Диск тяжелый и, пожалуй, ближе к
    хард-року, и уж наверняка не соответствует представлениям о традиционном блюзе.
    Думаю, лучше всего диск характеризует включение кавера "Туза пик" от Лемми сотоварищи
    - этим, пожалуй, будет сказано все для любого поклонника блюза.


    В целом жестко, энергично, более-менее технично, как обычно с включением цитат
    из других сегодняшних музыкальных стилей (вплоть до репового речитатива) и довольно
    современно. Одним словом, современный городской электрический блюз-рок (это я
    перевел термин modern urban electric blues :))


    А вот смотреть на выступления Чабби иногда даже любопытно'
