  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Внешность у Popa Chubby какая-то несерьезная. Скорее рэппер, чем блюзмен, но без цепочек (ударение на первом слоге)
    и перстней.


    Несмотря на все это, в блюзовых кругах Popa Chubby человек далеко не последний. Выпустил вот уже шестой сольник, кстати,
    пользующийся популярностью не только в его родном Бронксе, но и у нас в Москве.


    Что касается непосредственно "Brooklyn Basement Blues" - альбом хорош. Плотненький, в меру жесткий белый блюз, который
    не может не нравиться поклонникам, скажем, Johnny Lang и Kenny Wayne Shepherd. Например, очень сильный четвертый трек,
    "She Said That Evil Was Her Name", - неспешный, мрачненький, стилистически очень напоминающий немногочисленные, к сожалению,
    записи безвременно ушедшего John Campbell.


    В общем, купленная мною вслепую пластинка Popa Chubby полностью оправдала затраты. Более того, я уже заказал и предыдущие
    работы музыканта.'
