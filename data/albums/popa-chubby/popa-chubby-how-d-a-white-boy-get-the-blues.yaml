- id: 16
  author: Алексей Калачев
  mark: 6
  date: '2002-10-13'
  text: 'Первый из упомянутых хорош до середины, затем он теряет динамику и, неразборчиво
    булькая, тянет вас в пучину дремы. Толстяк Попэ набил руку на блюзовом поп-материале,
    и на &quot;How''d…&quot; есть 2-3 такие симпатяги с его мурлыкающей, бархатной
    хрипотцой. Однако досадно, что звук гитары, - хищный, острый, чистый, которым
    он пользовался до середины 90-х, куда-то уходит. Техас вытесняет Нью-Йорк.


    Второй диск набит каверами эстрадных шлягеров 60-х. Симпатично. Мило. Даже там,
    где поет его супруга Галеа, невеликая, мягко говоря, вокалистка. Кстати, здесь
    и можно услышать прежний, хорошо артикулированный Фендер нашего Чабби. Но тут-то
    он как раз не всегда оправдан, поскольку придает христоматийным номерам избыточную
    агрессию.


    Какой диск предпочтительней? Пожалуй, второй. А лучше попробуйте его диски до
    98 года.'
- id: 250
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'О предыдущей пластинке этого колоритного блюзмена из Бруклина я писал в одном
    из предыдущих номеров "Мотора" - расхваливал, если мне не изменяет память. Примерно
    в том же ключе я собирался высказаться относительно только что вышедшего альбома
    "How''d A White Boy Get The Blues?", но вместо этого решил немного поворчать.


    Недавно в жизни Popa Chubby произошли перемены, которые, возможно, положительно
    скажутся на его дальнейшей карьере. Он наконец-то покинул фирму Shanachie и подписал
    контракт с одним из лучших на сегодня американских блюзовых лейблов Blind Pig.
    Трудно сказать, кому это выгоднее. Мне кажется, что все-таки лейблу, а не музыканту.
    В США Popa Chubby давно уже считается королем нью-йоркского блюза, но в то же
    время ни одна независимая фирма не способна раскрутить гитариста так, чтобы о
    нем говорили и писали столько же, сколько о ничуть не более талантливых Kenny
    Wayne Shepherd и Johnny Lang. Все дело в промоушне. А здесь с мэйджорами тягаться
    трудно. Вот и получится, что один из самых, не побоюсь этого слова, вкусных блюзменов
    Америки так и останется неизвестным широкому слушателю.


    В общем, советую бежать и покупать как эту, так и предыдущую пластинку бруклинского
    музыканта - несмотря на то, что вы вряд ли прочтете что-нибудь о нем в нашей специализированной
    музыкальной прессе.'
