- id: 1402
  author: Андрей Евдокимов
  mark: 6
  date: '2008-12-29'
  text: Всю рецензию можно посвятить комплекции, манере одеваться, мимике и распальцовке, татуировкам, красным авто и черным
    очкам этого самого большого человека в современном блюзе. Поет он в манере среднестатистического американского рок-бэнда,
    отлично играет на гитаре, а его группа поддерживает правильную блюзовую пульсацию, что в белых блюзбэндах встречается
    ой-как-редко. Настроение в любовных песнях разнится от "Слез взрослого мужика" до "Я помочусь на твою могилу". И хотя
    по названиям так не подумаешь, в текстах Попа не менее остроумен, чем в игре на гитаре. Что подкупает, это желание музыканта
    заполнить все 70 возможных минут под завязочку. Да еще прибавить два видеоклипа. Хард-блюзовый разгул перемежает то кантри,
    то даб и венчает сольная акустика "Эх, рок-н-ролл, ты, сука, украл мою душу"… Аранжировка темы из "Крестного отца" в стиле
    "серфинг" вернет силы и поднимет настроении самым усталым душам меломанов.
