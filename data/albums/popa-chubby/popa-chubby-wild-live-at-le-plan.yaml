  date: '2005-05-19'
  text: '[DVD] Popa Chubby "Wild (Live)" 2004 Classification: modern electric blues, blues-rock.


    Popa Chubby, он же по рождению Тед Хоровитц, родился в Бронксе, Нью Йорк. Наш человек, сразу видно :) И папа у него был
    владельцем магазина конфет, а не музыкантом в третьем поколении. Chubby в 13 лет увлекся ударными, он рос большим сильным
    мальчиком все-таки... Однако вскорости он открыл для себя музыку "Роллинг Стоунз" и начал учиться игре на гитаре. Дальше
    все типично для "белого" гитариста - Джимми Хендрикс, Эрик Клэптон, etc. Увлекся блюзом, короче говоря. В 1992 году получает
    премию как начинающий артист на блюзовом фестивале в Лонг Бич. С этого момента все у него пошло удачно - альбомы на Sony/Okeh
    Records, далее собственный лэйбл. В общем, на данный момент порядка десятка альбомов (а начал он в 90-х) и несколько видео-концертных
    релизов.


    Данный же концерт на видео предпоследний - он был записан во Франции в марте 2004 года. Будучи весьма продолжительным
    (1 час 56 минут), включает в себя разную музыку - от блюз-роковых политических песен ("Unamerican blues" - Popa весьма
    политичная личность и слово "peace" повторяет не раз за свой концерт) до классических блюзовых стандартов в его обработке
    ("Come On In My Kitchen", "Backdoor Man"). Не буду детально описывать концерт, скажу лишь, что Пухлая Popa, как модно
    говорить, "зажигает". Все очень энергично, с хорошими размашистыми современными гитарными соло на стратокастере (молодежь
    это оценит :) ), плюс интересное цитирование хендриксовских "ходов". Большинство композиций длинные и весьма богатые на
    соло Chubby. Из интересных интерпретаций отмечу - "Come On In My Kitchen", исполненная с шикарной женщиной-басисткой по
    имени Galeo (которая и пела - такую девушку на басу вы никогда не видели, уверяю), "Hey Joe" (в исполнении самого Popa
    Chubby), "Hallelujah" (вещь Коэна, одна из немногих спокойных песен на концерте, весьма душевно исполненная Chubby). В
    завершении концерта исполняется короткая кантри-подобная "Keep On The Sunny Side Of Life" двумя милыми пухленькими девочками,
    сильно похожими на потомство Chubby, и той же Galeo. В общем, милое завершение.


    Неплохой концерт в рамках современного развития блюзового жанра, хорошая группа музыкантов (особенно радует клавишник).
    Диск вышел на лэйбле DixieFrog в PAL и с хорошим 5.1 звуком.'
