  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2013-07-23'
  text: 'Блюзовый тяжеловес из Бронкса Тед Хоровиц (он же Попа Чабби) записал очередной альбом современного электрического
    блюза, посвятив его памяти великого блюзмена Маджика Слима, который покинул этот мир 20 февраля 2013 года. Альбом записан
    с ноября 2012 года по январь 2013 года в Нью-Йорке самим Чабби, который выступил также в роли продюсера. На диске 9 треков
    авторства Хоровица и три кавера, причем инструментал Over the Rainbow (с заимствованиями из "к Элизе") записан на концерте
    в Нью-Йорке в баре Родео.


    В итоге получился добротный альбом современного городского блюза и блюз-рока, который добрался до 7 места в топе блюзовых
    альбомов 2013 года. Сам музыкант рекомендует следующее: "Слушайте этот диск часто и на повышенной громкости. Пусть он
    радует Ваши уши, облегчит Ваши заботы и принесет радость Вашему сердцу". Грех не последовать такому совету, не так ли?'
