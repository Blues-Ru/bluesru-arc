reviews:
- id: 24
  author: Алексей Калачев
  mark: 4
  date: '2002-10-26'
  text: Альбом любопытен в первую очередь тем, какую эволюцию претерпевает "забронзовевший" толстяк. Он больше не столько
    ньюйоркский клубный волк, он – респектабельный продюсер и сонграйтер. Порэ, похоже, хочет делать поп-песни с блюзовым
    уклоном и настолько этим увлечен, что прежнего (и лучшего?) его начинаешь узнавать лишь с 6 или 7-й песни.
- id: 257
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Очередная пластиночка весьма модного нынче блюзмена. Альбом вроде бы, не хуже и не лучше предыдущих. Разве что несколько
    мрачнее. Впрочем, этого следовало ожидать - достаточно было посмотреть на обложку с, мягко говоря, не слишком жизнерадостной
    физиономией музыканта. К тому же "The Good, The Bad & The Chubby" - это на две трети название знаменитого спагетти-вестерна
    Sergio Leone. Слово "ugly", то бишь "злой", Popa заменил собственным прозвищем. Прозрачный намек.


    Американская музыкальная критика уже поспешила назвать этот релиз чуть ли не лучшей блюзовой работой 2002 года. Немного
    погорячились. Альбом действительно хорош, но уверен, что при распределении блюзовой премии W. C. Handy про Popa Chubby
    опять забудут. Зато наверняка наградят юное дарование Johnny Lang, чья очередная студийная работа уже на подходе. Несправедливо
    это.


    Но вернемся к "The Good, The Bad & The Chubby". Все вещи написаны самим музыкантом. Энергичных, быстрых песен здесь раз,
    два и обчелся. Преимущественно Popa Chubby исполняет тягучие мрачноватые блюзы, среди которых я бы выделил открывающий
    альбом "Somebody Let The Devil Out", а также "Stress Will Kill You Every Time". Не могу обойти вниманием и "I''ll Be There
    For You", очень напоминающий отдельные шедевры Tom Waits.'
- id: 2051
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2012-08-07'
  text: Записанный во время трагедии небоскребов торгового центра, данный альбом является, пожалуй, одним из лучших в карьере
    гитариста-тяжеловеса. Тут Чабби представил на суд слушателей техничный современный городской блюз-рок, оттененный как
    новомодными диджейскими эффектами, так и включением традиционных блюзовых (гармоника) и не очень блюзовых (сопрано саксофон)
    инструментов. На паре треков на всех инструментах играет сам автор. Хороший диск для начала знакомства с творчеством музыканта.
