  text: Старый козырь Клауса Зинделя вновь в игре – эмбиент + блюз + струнный квартет
    на фоне электронной перкуссии. Немецкий электронщик уже выпускал такой чрезвычайно
    успешный альбом. Этот лишь в точности повторил проект 1997 "Сulture Clash", кстати,
    включив в себя часть не вошедших в него материалов. В высшей степени комфортный
    и успешный опыт "расширения" диапазона блюза.
