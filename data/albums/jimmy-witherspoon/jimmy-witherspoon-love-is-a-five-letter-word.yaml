reviews:
- id: 583
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-04-11'
  text: 'Этот диск записан в Англии с помощью знаменитого продюсера с Blue Horizon
    Records Майка Вернона и его команды из классных английских музыкантов.


    Альбом получился длинным (14 песен) и очень насыщенным по музыке и звукам; тут
    есть духовые, струнные и большая группа ритм-секции. Но проблема вовсе не в этом,
    а в том, что аранжировки сделаны очень попсовыми во многих треках. Когда идет
    жесткий фанк-блюз или блюз-рок, все хорошо; а вот когда начинают играть в стиле
    поп-соул-блюз (еще и приджазованный), то становится совсем сладко. Голос Джимми
    и так больше подходит к джаз-поп-стандартам, чем к настоящему блюзу и соулу, а
    тут еще и такие аранжировки и инструменталы.


    И все же половина песен тут очень хороша, а музыканты играют волшебно. Радует
    еще и то, что сам Спун купается в этом звуке и лоске, и хорошо поет. Такие треки,
    как Aviation Man, What''s Going Down, The Other Side Of Love, No Money Down, Landlord
    очень хороши.


    Этот диск понравится любителям соула и фанка, но вряд ли он интересен для поклонников
    "архаики" и "классики".'
