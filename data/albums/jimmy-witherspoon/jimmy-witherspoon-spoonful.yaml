reviews:
- id: 584
  author: Дмитрий Казанцев
  mark: 7
  date: '2005-04-12'
  text: 'На этом альбоме Спуна играют очень хорошие музыканты из мира джаза и ритм-н-блюза:
    Роббен Форд на гитаре, Ричард Ти - пианино, Джо Сэмпл - клавинет, Корнелл Дюпри
    - гитара, Чак Рэйни - бас, Бернард Перди. Музыка в стиле соул-блюз и фанк. Местами
    очень и очень хорошо, а иногда кажется, что Форд слишком увлекается джазом, превращая
    все это в джаз-фанк. Отличный материал и исполнение, но кажется, что Джимми все
    же не совсем в своей тарелке.


    Big Boss Man, Sign On The Building, The Moon Is Rising - отличные треки.'
