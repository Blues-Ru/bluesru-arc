  author: Дмитрий Казанцев
  mark: 8
  date: '2003-09-10'
  text: 'Это редкий сборник Джимми на лейбле BluesWay. Он собран с трех отличных альбомов на этом лейбле Blues Singer, Handbags
    And Gladrags и Huhh. Эти альбомы не переизданы, и весь этот период является очень редким.


    На сборнике 9 вещей. Надо отметить людей, которые играют тут с Джимми. Это: Джо Уолш - гитара; Расс Канкел - барабаны;
    Билл Жимчик - продюсер и инженер; Чарли Массэлуайт - гармоника; Харви Мэндэл - гитара; Джэк МакДафф - орган; Чарльз Браун
    - пианино; Эрл Хукер - гитара; Бэрри Голдберг - орган; Джим Келтнер - барабаны и многие другие. Как видите, состав очень
    классный звездный.


    Первый трек - это фолковый хит "Handbags And Gladrags". Отличное блюзовое исполнение этой известной вещи.


    Вторая вещь - I Don''t Know - классный блюз Уилли Мабона.


    I Made A Lot Of Mistakes - классический блюз Джимми.


    Blow Wind Blow - очень выразительный блюз Джимми.


    Bags Under My Eyes - еще одна вещь Джимми. Очень высокий класс вокального мастерства!


    Вторая сторона начинается с великой песни Робби Робертсона и группы Бэнд The Night They Drove Old Dixie Down. Очень блюзовое
    и почти трагическое испонение.


    You Can''t Do A Thing When You Drunk - блюз Джимми о постоянной проблеме с алкоголем. Здесь поется о пьяной подруге, с
    которой невозможно жить из-за ее пьянства.


    Just A Dream - блюз Биг Билла Брунзи. Очень классно, Масселуайт тут просто красавец!


    Testifying - рассказ Джимми о блюзе и о своей музыкальной жизни на 10 минут. В песне присутствуют слова песни: I have
    had my fun, if I don''t get well no more.


    Оценка 4 балла. Кажется, что можно было сделать сборник еще лучше. Это очень редкий период Джимми, и не понятно, почему
    ABC не переиздает всю эту красоту.'
