- id: 879
  author: Константин Колесниченко
  mark: 7
  date: '2005-10-02'
  text: Smokey Wilson – малоизвестный калифорнийский гитарист, мало записывавшийся и выступающий большей частью в клубах Лос-Анджелеса.
    Не смотря на то, что он живет и выступает в Калифорнии, его музыка – это West Side Blues. Это его второй альбом и считается
    он лучшим в его дискографии. Записываться Smokey Wilson начал поздно, кстати, его первый альбом известен тем, что в его
    записи участвовал будущая звезда калифорнийского блюза – William Clarke. Альбом нельзя назвать разнообразным, подобные
    вещи мы уже слышали у других, более известных музыкантов. Но есть все-таки на этом альбоме и блестящие места, к примеру,
    - это композиция "Smoke n' Fire" - замечательный быстрый инструментал с привкусом фанка. В качестве гостей на этом альбоме
    засветились Jimmy McCracklin, Larry Davis и Ron Levy – ведь это его лэйбл.
