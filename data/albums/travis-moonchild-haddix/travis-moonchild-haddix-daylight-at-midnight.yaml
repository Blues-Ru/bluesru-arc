- id: 1976
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-08-11'
  text: 'Один из ветеранов американского блюза, гитарист и певец Травис Хэддикс в возрасте восьми лет услышал игру ББ Кинга
    и начал осваивать гитару. В 1959 году он переезжает в Кливленд и со временем становится блюзовым героем этого города (а
    22 августа он будет включен в Зал блюзовой славы Кливленда). Выпускать сольные альбомы он начал только в 1988 году и по
    мере роста популярности стал гастролировать по миру, собрав ряд блюзовых наград в Европе и на родине.


    Один из немногих оставшихся исполнителей традиционного блюза с современным звучанием, Трэвис достаточно энергичен для
    своих лет, и его соло по-прежнему интересны и самобытны, хотя голос уже чуть "подсел". Более того, он продолжает играть
    на постоянной основе в блюзовых клубах Кливленда. Сопровождает его коллектив высокопрофессиональных музыкантов, включая
    мощную духовую секцию. Материал на альбоме полностью авторский, а время от времени Хэддикс также пишет и для других исполнителей
    (Майкл Беркс, Шон Силс и др.). Как говорится, старый конь борозды не портит, и в результате получился качественный альбом
    современного электрического блюза.'
