  author: Федор Романенко
  mark: 10
  date: '2010-02-15'
  text: 'Sunset Travellers - группа голландского молодого клавишника и вокалиста Roel Spanjers. "For The Sake Of It" - мх
    единственная пластинка, сам Роэл засветился тем, что в молодости долго играл в группе у Luther Allison. В голландии они
    выступают на местных фестивалях, в половине случаев с черным блюзменом Byther Smith.


    На диске записан южный соул и РнБ, во-многом, приятно-аранжированные песни, сделанные эстетски без претензии и надрыва.
    Основные достоинства - вокал Роэла, его пианино и орган, а также партии гитариста, который на части номеров очень драйвово,
    но аккуратно играет слайдом. Отличная ритм-секция, местами записаны аккордеон и мандолина.


    Достоинства музыки не в яркости, привыкшие к надрыву блюзофилы могут испытывать неловкость и замешательство при прослушивании
    пластинки: а не попса ли?. Отсутствие перегибов, которые могут набить оскомину, отличное качество аранжировок, разнообразные
    песни делают пластинку супер-мега-долгожителем. Я ее слушал, кажется, сотни раз, мне не надоело ;) Все это, конечно, заслуживает
    5-ти баллов!'
