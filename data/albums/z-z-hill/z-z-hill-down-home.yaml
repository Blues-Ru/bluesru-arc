  date: '2007-07-15'
  text: 'Очень хороший соул-блюз, соул и соул-фанк. Все держится на прекрасном голосе Хилла и приятных песнях. Вроде все просто
    и обычно, но подача ЗиЗи делает свое дело. Звук хорош для 82 года!


    Советую всем любителям черного соула и блюза.'
