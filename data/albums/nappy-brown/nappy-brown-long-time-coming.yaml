- id: 1244
  author: Андрей Евдокимов
  mark: 8
  date: '2008-04-09'
  text: 'Приближаясь к 80-летию блистательный, но полузабытый вокалист записал альбом веселый и энергичный. Критики сходятся
    во мнении, что это его лучший альбом за последнюю четверть века, но Браун еще категоричней в оценке: "Эта лучшая из всех
    записей, что я сделал после 1955 года. И больше тридцати лет у меня не было возможности поиграть с парнями, которые понимают
    мою музыку, как надо". В студию Браун привел команду отличных музыкантов нынешнего поколения, которые близко к сердцу
    воспринимают идеи ритм-энд-блюза именно того времени, когда Браун был звездой этого стиля и сочинил лучшие свои песни.
    Возглавляют ансамбль выдающиеся гитаристы: Шон Костелло, Джуниор Ватсон, Боб Марголин.'
