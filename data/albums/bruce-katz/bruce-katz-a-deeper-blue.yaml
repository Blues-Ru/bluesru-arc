  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-26'
  text: 'Брюса Каца, я думаю, можно смело назвать самым известным из современных блюзовых клавишников – он признанный мастер
    Хаммонда В3, а также автор первого углубленного курса по блюзу, который он читал в Беркли, где также преподает уроки игры
    на фортепиано. Однако Кац не менее известен и в джазовом мире, ибо умело сочетает оба эти музыкальных направления в своем
    творчестве, открывая новые горизонты в обоих стилях.


    Фортепианные способности Брюса проявились уже в возрасте пяти лет, а в 80е он аккомпанировал множеству известных музыкантов,
    включая Бо Дидли и Чака Берри. Затем он закончил консерваторию по классу джаза, и через 5 месяцев после этого повстречал
    Ронни Эрла, который принял его в свою группу The Broadcasters. Взгляды Брюса и Ронни на слияние блюза и джаза, очевидно,
    совпали, и Брюс провел в группе Ронни 5 лет, параллельно выпуская сольные пластинки (первый сольник вышел в 1992 году
    на фирме AudioQuest). Затем Брюс решил сконцентрироваться на сольной карьере, собрав собственный состав музыкантов.


    На своем пятом сольном альбоме Брюс записал качественную инструментальную смесь джаза и блюза, где он солирует на фортепиано
    и Хаммонде В3, а помогают ему Майкл Уиллиамс на гитаре, старый коллега по Бродкастерам Род Кэрри на басу и Ральф Розен
    на ударных. На двух треках также отметился старый друг и соратник Брюса Ронни Эрл. Добротный альбом инструментального
    приджазованного блюза, исполненного с изяществом настоящих профессионалов.'
