  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-26'
  text: 'Третий сольный диск Брюса Каца был записан 20 и 21 июня 1997 года на аудиофильских
    студиях Audioquest - как обычно "вживую" сразу на двухдорожечный мастер. Мастеру
    блюзового Хаммонда и знатному пианисту помогают музыканты его группы, усиленной
    саксофонистом Томом Холлом, с гостевым привлечением харпера Майка Констелло и
    знаменитого вокалиста Майти Сэма МакЛейна (вокал на двух треках, в остальном альбом
    инструментальный).


    В музыкальном плане, как обычно у Каца (сочинившего бОльшую часть музыки), это
    сплав блюза и джаза, включая в данном случае еще и стомп, и буги-вуги. Брюс много
    солирует на фортепиано, орган используется в меньшей степени. В силу разнообразия
    музыкального материала и изрядной доли джазовой импровизации данный диск найдет
    своего слушателя и среди любителей блюза, и среди поклонников современного инструментального
    джаза.'
