reviews:
- id: 741
  author: Александр Панин
  mark: 8
  date: '2005-06-27'
  text: Дебют Брюса как лидера, выпущенный на лейбле AudioQuest в 1992 году. Очень
    приятный сплав инструментального джаза и блюза. Кац довольно бодро и красиво играет
    на Хаммонде и рояле, ему помогают ритм-секция, гитарист и саксофонист. Почти все
    вещи собственного сочинения Брюса, только к концу иcполняется пара довольно интересных
    каверов - Will It Go Round In Circles и Just A Closer Walk With Thee. Имейте в
    виду, что диск более джазовый, чем блюзовый.
- id: 1789
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-26'
  text: 'Первый сольник маэстро блюзового Хаммонда В3 Брюса Каца, записанный на аудиофильских
    студиях Audioquest (там же, кстати, в 1993 году записывался и следующий альбом
    Ронни Эрла Still River, на котором представлена другая версия композиции Contrition
    с данного диска Каца). Полностью инструментальный, традиционно (и для Каца, и
    для Эрла, с которым он играл в тот период) приблюзованный, а также высокопрофессионально
    исполненный альбом является одним из лучших за всю карьеру Брюса. На данном альбоме
    довольно сильна джазовая и импровизационная составляющая музыки Брюса, который
    солирует на фортепиано и Хаммонде. Ему помогает ритм-секция и гитарист Кэвин Берри,
    а также приглашенный саксофонист Боб Малах.


    Очень профессиональная и интеллигентная пластинка, бесспорно понравится любителям
    инструментального джаза, да и поклонникам Ронни Эрла, пожалуй, тоже :-)'
