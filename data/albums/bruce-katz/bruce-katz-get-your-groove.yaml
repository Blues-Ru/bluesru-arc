  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2022-11-01'
  text: 'Брюс Кац - уникальный американский клавишник (также играющий на бас-гитаре), мастер классического Хаммонда В3, одинаково
    хорошо чувствующий себя и в блюзе, и в джазе. С 1990 по 1992 гг. учился в консерватории Бостона, которую окончил со степенью
    магистра музыки в категории "джазовое исполнение". С 1996 по 2010 год преподавал в музыкальном колледже Беркли в Бостоне.
    Кроме записей и гастролей с собственной группой Bruce Katz Band, созданной в 1991 году, сотрудничал и записывался с множеством
    ведущих блюзовых, джазовых и рОковых музыкантов современной американской сцены, пять лет провел в составе Бродкастеров
    Ронни Эрла (записав с ним 6 альбомов, включая получивший в 1996 году титул блюзового "альбома года" диск Grateful Heart).


    Талант Брюса как музыканта и композитора был признан музыкантами, критиками и поклонниками: на ежегодной церемонии вручения
    блюзовых наград он семь раз номинировался в категории "лучший блюзовый пианист" (годы 2008, 2009, 2014, 2015, 2019, 2020,
    2021), получил награду за лучший акустический блюзовый альбом в 2019 году, номинировался в категории "выдающийся клавишник"
    в 2017 и 2019 годах, а в 2013 году был введен в Зал славы блюза Нью-Йорка. По всем параметрам выдающийся музыкант и композитор,
    который по стопам Ронни Эрла записывал полностью инструментальные альбомы (вплоть до альбома Homecoming 2014 года, на
    котором появились вокальные треки).


    Get Your Groove! - восьмой (если не ошибаюсь) студийник Bruce Katz Band, записанный Брюсом с ударником Рэем Хэнгеном и
    поющим гитаристом Крисом Витарелло. На трех треках на ударных отметился Джеймо из Allman Brothers Band (включая трибьют
    Бутчу Траксу "Freight Train"), на шести треках присутствует бас-гитарист Мэтт Рэймонд. В остальных треках по мере необходимости
    Брюс играет парию баса на органе сам, следую рецепту Рэя Манзарека. Кроме первого трека, остальной материал авторский
    - написан Брюсом лично или в соавторстве. Кац также занимался продюсированием альбома (совместно с Беном Эллиоттом).


    Музыкальный материал сочетает инструментальные композиции и номера с вокалом Криса Витарелло (с преобладанием инструменталов),
    отдавая предпочтение импровизационному приджазованному блюзу. Характерная для Брюса интеллигентная импровизационная подача
    предлагает слушателю коктейль из джаза, соул и фанка на мощной блюзовой основе, виртуозно исполненный мастерами своего
    дела. Отличная пластинка для любителей Хаммонда В3, а также импровизационного инструментального блюза с джазовым оттенком.'
