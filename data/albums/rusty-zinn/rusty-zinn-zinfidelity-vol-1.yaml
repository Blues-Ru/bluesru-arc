- id: 977
  author: Федор Романенко
  mark: 10
  date: '2006-04-01'
  text: 'Rusty Zinn – пожалуй, все-таки, вест-коаст гитарист, известен чуть меньше, чем главные, но регулярно появляется на
    очень хороших записях, например, у Kim Wilson и пр. Очевидно желание сравнивать его впрямую с главными в их стилистике,
    однако кой-какие его записи оставляют не самое выгодное первое впечатление. Например, на пластинке The Chill есть мягкотелые
    баллады и рок-н-рольные номера из 60-х, которые как-то совсем неуместны в блюзовом мире с культом бескомпромиссной черной
    или же, наоборот, современной забойной музыки. Расти Зинн – очень белый, белобрысый, недостаточно брутален для блюзмена,
    и музыка у него с виду такая же.


    Но, самое главное, он не стестняется и делает то, что ему нравится. Если слушатель отбросит предубеждения и подойдет с
    тех же позиций, у него есть шанс получить огромное удовольствие. Последняя пластинка – уход от традиционных блюзовых форм
    в соул и полную эклектику. Главное на диске, конечно, это голос Расти Зинна. Мама, как он фантастически хорошо поет, это,
    правда, изумительно, потрясающе! Стилистика замешана на соул-музыке с большими вариациями. Там есть и баллады, и шаффлы,
    даже соул-регги, которого я раньше не слышал, похоже на новое изобретение. Две песни с битами и гипертрофированным звуком
    гитары, очевидно, напоминают современные эксперименты Холмстрома. Очень интересные звуки. А тот факт, что кто-то еще занимается
    в этом же направлении, наталкивает на мысль, что Холмстром изобрел новый стиль в музыке. Есть пара, но не более, шаффлов,
    без которых вест-коаст гитарист никуда. Фанковая песня чем-то очень напоминает моего любимого John "Juke" Logan.


    Вообще, пластинка – лирическая от начала до конца, про любовь без стеснения и сарказмов, включая обложку. На амазон.ком
    есть пара очень точных рецензий с двойками и тройками в качестве оценок. Там написана сущая правда, например, название
    одной – "white chocolade melting in your hands". Единственная разница в том, я со всем согласен, но мне страшно нравится
    эта бесстыдно-приятная музыка. Человек, которому не суждено быть крутым и черным, делает то, что ему нравится, хе-хе.
    Очень рекомендую, как минимум, интересно и провокационно.'
- id: 1163
  author: Константин Колесниченко
  mark: 9
  date: '2007-11-27'
  text: Расти Зинн, молодая звезда West-Coast Blues, постепенно отдаляется от этой музыки. Последний его альбом вообще почти
    весь выдержан в регги стиле. А вот "Zinfidelity Vol1" еще несет на себе отпечаток блюза. Пожалуй, самым большим достоинством
    Расти является его вокал (помимо очень достойной гитарной работы), высокий, нежный и очень гибкий. Потому самое место
    для вокальных данных Зинна - это соул-музыка. В таком ключе и выдержана приблизительно половина этого альбома. И уж поверьте,
    из своего голоса Расти Зинн выжимает все соки. Диск очень интересный и разнообразный - здесь и ритм-н-блюз с духовыми
    и потрясающие соул-номера, и регги и фанковый инструментал, а заключительная песня "Love Him Or leave Him" - doo wop.
