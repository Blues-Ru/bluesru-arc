reviews:
- id: 1962
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-06'
  text: 'Очередной альбом от блюз-рокового гитариста, певца и композитора как обычно представляет собой смесь блюза, блюз-рока
    и хард рока. Восемьдесят процентов треков написаны самим музыкантом да плюс два кавера. Два трека украшены саксофоном
    Джонни Хэйгрина.


    В целом - добротная профессиональная работа в стиле современного электрического блюза, но как-то без изюминки. С техникой
    исполнения все в порядке, и звук приличный - разве что с вокалом Иннес что-то перемудрил.'
