  date: '2015-04-22'
  text: 'Innes Sibun is the best sort of musician: overflowing with ideas and energy sure, but drawing on a deep wellspring
    of feeling that''s undeniable and immediately infectious. --Classic Rock the Blues Magazine


    Иннес Сайбун начал играть блюз в 12 лет, услышав концертный альбом Б.Б. Кинга, и с тех пор добился больших успехов, снискав
    уважение коллег и любовь поклонников. Британский гитарист знаменит не только своим энергичным блюз-роком и отменной техникой
    игры, но и разнообразием используемых блюзовых стилей и инструментов. Специалисты иногда сравнивают его манеру игры и
    пения со знаменитым Рори Галлахером - и неудивительно, что в 2011 году Сайбуна пригласили сыграть в клубе Иридиум в посвященном
    Галлахеру концерте, который был организован в честь выхода посмертного альбома Рори Notes From San Francisco.


    Новый сольник музыканта интересен тем, что основная часть треков записана в музыкальном центре Мостар в Боснии с местными
    музыкантами во время гастролей Сайбуна в тех краях. Иннес посвятил альбом "прекрасным людям из центра Мостар". Гитарист
    сам выступил в качестве продюсера альбома, а также написал 10 треков из 12. Не обошлось и без кавера Рори - I Fall Apart.'
