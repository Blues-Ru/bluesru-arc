reviews:
- id: 1959
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-06'
  text: 'На своем первом концертном альбоме английский блюз-роковый виртуоз представил на суд публики почти 80 минут энергичного
    жесткого блюз-рока на стыке с хард роком. Записано "живьем" без наложений со всеми преимуществами и недостатками рОкового
    концерта. Кому нравятся длинные запилы на инструментах, продолжительные соло на барабанах и жесткий сырой саунд - качать
    немедленно :-)!


    Местами, когда музыкантов не заносит сильно в избыточное нотоизвлечение, группа звучит очень хорошо и мощно. Последний
    трек - акустический, своего рода тихий аккорд после блюз-рокового буйства.'
