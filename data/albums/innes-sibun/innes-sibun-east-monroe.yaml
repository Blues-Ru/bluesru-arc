  date: '2011-07-06'
  text: 'Четвертый сольник английского гитариста, на котором он также выступил и в
    качестве продюсера.


    Добротный хард-рок вперемешку с блюз-роком (блюза поменьше, рока побольше), все
    качественно и профессионально (а кто бы сомневался то :-)), но без особых откровений.
    Материал в основном написан самим Сибуном (пара треков авторства Стива Робинсона),
    поет Стив Робинсон.'
