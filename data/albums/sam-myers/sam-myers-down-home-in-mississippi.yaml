  date: '2008-01-08'
  text: 'Оллмьюзик и другие авторитетные справочники часто начинают отсчет дискографии Sam Myers c 1985 года, но это ошибка.
    Если копнуть глубже, то видно, что первым его сольным альбомом является "Down Home In Mississippi". Sam Myers прежде всего
    известен как участник ансамбля "ANSON FUNDERBURGH & THE ROCKETS" , в котором он вокалист и харпер. Но он не самая последняя
    фигура в блюзе и принимал участие в работах других музыкантов, например, Elmore James (он играл на барабанах на некоторых
    его композициях), Snooks Eaglin, Joe "Guitar" Hughes.


    Альбом "Down Home In Mississippi" записан вживую в местечке Fannie, штат Mississippi. На записи, кроме Myers, участвует
    гитарист Tommy Lee Thompson. Не знаю, зачем музыканты выбрали электрогитару и усиленную гармонику для записи дуэта, потому
    что, в случае Сэма, это еще больше выдает не очень аккуратную игру. Музицирования гитариста вообще ужасны. Альбом этот
    может представлять интерес исключительно для фанатов блюза, которые ищут редкости. На CD "Down Home In Mississippi" не
    переиздавали (и правильно!).'
