  date: '2003-10-20'
  text: 'Реакция американских критиков и рецензентов на диски Фандербурга и К вполне
    предсказуема – более или менее комплиментарная. Они того заслуживают. Нынешний
    – тоже. Другое дело у нас: публике в массе не доступны изыски неброского, отточенного
    стиля гитариста, скромное очарование его изящно свингующей группы и сочного пения
    черного полуслепого гиганта Сэма Майерса. А между тем, это и есть "техасский стиль"
    в чистом виде, на этот раз с вкраплениями soul, которые напел сам Энсон.'
