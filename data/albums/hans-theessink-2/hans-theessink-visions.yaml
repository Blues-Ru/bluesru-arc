- id: 1322
  author: Андрей Евдокимов
  mark: 7
  date: '2008-07-20'
  text: Вокалист Терри Иванс первого успеха добился в дуэте с певцом Бобби Кингом в начале 70-х. Его песня "Down in Mississippi"
    стала гимном в подростковом блюзовом фильме "Crossroads". Его сольные альбомы – подарок гурманам блюзового вокала. Гитарист
    Ганс Тисинк известен гурманам блюзовый акустически уже четвертый десяток лет (первый EP вышел в 1970 году). В последнее
    время Тисинк и Иванс, образовав трансатлантический черно-белый дуэт, выступали вместе, что логично увенчалось выпуском
    совместного альбома. Альбом записан акустическим дуэтом, при гостевом участии перкуссиониста Phil Bloch и электрогитариста
    Richard Thompson. И Тисинк и Иванс являются перфекционистами в звукозаписи, альбом отличается превосходным звучанием.
    В репертуаре – песни собственного сочинения и блюзовая классика. А блюзовый "рэп" наговорил гость на записи, сам Бо Диддли,
    которому уже 79 лет.
