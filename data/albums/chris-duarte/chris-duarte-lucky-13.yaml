- id: 2184
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2014-11-19'
  text: 'Тринадцатый сольник американского слингера, который похоже не боится "несчастливого" номера.


    Альбом для любителей мощного гитарного блюз-рока в интерпретации Майка Варни и его Шрапнель рекордс, тогда как поклонникам
    традиционного блюза можно не беспокоиться. Пожалуй, альбом чуть поспокойнее и помягче, чем обычно у Криса, и это, на мой
    взгляд, даже хорошо - тут не один современный блюз-рок, есть и элементы хард-рока, психоделии, примесь джаза и фьюжн.


    Материал полностью авторский. В лучших традициях Blues Bureau International диск записан в формате power trio и доставит
    удовольствие поклонникам техничной гитарной игры.'
