- id: 1215
  author: Андрей Евдокимов
  mark: 8
  date: '2008-02-13'
  text: 'Во-первых, это блестящая, полная страсти гитарная игра. Во-вторых, ничего
    принципиально нового, увы. Отношение слушателя к альбому будет зависеть от того,
    перевешивает ли в его мнении достоинство - недостаток? Дюарт посвятил предыдущий
    альбом поискам оригинального стиля и три года спустя (это стандартный антракт
    в его дискографии) вернулся практически к тому, с чего начинал: к тяжелому интенсивному
    блюз-року. Только композиции стали еще длинней – кто еще из современных блюз-рок-гитаристов
    пойдет на запись 13-минутной гитарной импровизации? Давним поклонникам, которые
    в 1994 году называли его главной надеждой гитарного блюза, этот альбом покажется
    возвращением к дням былой славы. Эпическая "Something Wicked" превосходит знаменитую
    тогда "Shilo" не только свой протяженностью. В ней больше продуманности в композиции,
    и больше чувства в исполнении. Сама игра технически стала много точнее, а качество
    записи – чище.'
