reviews:
- id: 222
  author: Алексей Калачев
  mark: 4
  date: '2003-09-18'
  text: Если быть точным, "ромп" переводится как "шумная игра, возня". Действительно,
    доля беспорядка, непоследовательности в альбоме имеется. В том смысле, что он
    заполнен слишком уж разными по стилю песнями и инструментальными пьесами. Тут
    вещи в стилистике "блюз северной Миссиссиппи" и шаффл соседствуют с песней Боба
    Дилана и альтернативным роком, интересные вещи чередуются с номерами сомнительного
    качества. Словом, альбом, похоже, занятный, однако, мягко выражаясь, неровный.
    40-летний Крис – один самых интересных блюзовых исполнителей Техаса. В 1994 и
    в 1997 годах Дуарте сделал 2 альбома, которые поставили его в один ряд с лучшими
    гитарными слингерами и повлекли сравнения со Стиви Рэем Воном. Пластинка "Ромп"
    до этих высот едва ли дотягивает, хотя отказать ей в приятности тоже нельзя.
- id: 476
  author: Сергей Колобашкин
  mark: 6
  date: '2004-03-07'
  text: Крис Дуарт может себе самолично присвоить титул хорошего музыканта благодаря
    его последней работе "Romp". Диск вышел в 2003 году благодаря Zoe Records и в
    оригинальной печати содержал всего восемь треков, затем через месяц был выпущен
    другой вариант альбома уже из десяти треков, что делало его значительно интереснее.
    Первый трек "Do The Romp" представляет собой замечательный коктейль из техасского
    блюза и южного рока, что может понравится многим. Гитара Дуарта звучит весьма
    необычно, так как вряд ли сможет вылечиться от повреждений, нанесенных временем;
    этот необычной звук можно услышать на втором треке с альбома, который называется
    "101". Дальше следует трек "Fire's Gone Out", который представляет собой классический
    блюз-рок с перегруженной гитарой и весьма простым ритмом. Четвертая композиция
    "Like Eric" является данью уважения техасскому виртуозу Эрику Джонсону, где Дуарт
    мастерски копирует стиль Джонсона. "My, My" - это монотонная композиция, которая
    была добавлена во втором издании альбома. "One More Cup Of Coffee" является песней
    Боба Дилана и, по-моему, это лучший кавер из всех, которые были записаны. Седьмой
    трек - это еще одна инструментальная композиция под названием "B# Blues". Наконец-то
    блюз! Композиция "Last Night", которая демонстрирует всю резкость игры Дуарта.
    "Mr. Neighbor" представляет собой простенькую песню, которая хорошо вписывается
    в альбом только из-за того, что она подходит по стилю к остальным песням. Последняя
    песня "Take It To The Lord" является отличным завершением альбома. Моя оценка
    3 бала. Крис Дуарт понравится не каждому, но послушать рекомендую всем.
