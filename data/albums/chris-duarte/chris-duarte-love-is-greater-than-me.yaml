  author: Евгений Долгих
  mark: null
  date: '2003-10-26'
  text: 'Третий по счету альбом молодого техасского блюзмена Криса Дуарте вышел самым ярким, мощным и хардовым из всех его
    работ. Крис слегка растерял доверие своих фанов после облегченного, с фанковым оттенком, предыдущего проекта "Tailspin
    Headwhak", но новым альбомом, я думаю, остались довольны практически все. Во всяком случае, в подавляющем большинстве
    западных рецензий и отзывов на него преобладают восторженные тона и пятизвездочные оценки. Полностью присоединяюсь к этим
    характеристикам.


    Надо сказать, что альбом действительно ошеломляет уникальным сочетанием мощи, напора и изысканной блюз-роковой мелодичности.
    Никакой монотонности - все темы оригинальны и интересны. Хотя... для поклонников блюз-рока со стажем не составит труда
    услышать в некоторых вещах явные отголоски старых хард-роковых групп, а песня "Metaphor Song" почти воскрешает уже подзабытый
    ныне саунд легендарного британского квартета "Led Zeppelin". Если Дуарте придумал это совершенно самостоятельно, то он
    просто гений, а если и позаимствовал несколько идей, то сделал это с настоящим вкусом и изобретательностью.


    Даже голос его зазвучал иначе, чем раньше - более мужественно, хрипло и выразительно. "Стратокастер" Криса хорош как всегда
    - в звучании гитары стало больше "мяса" и рвущихся наружу эмоций.


    Думаю, этот альбом никого не оставит равнодушным.'
