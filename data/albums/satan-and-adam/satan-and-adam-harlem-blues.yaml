- id: 1252
  author: Константин Колесниченко
  mark: 10
  date: '2008-04-10'
  text: 'В буклете харпер Adam Gussow описывает свое первое впечатление от встречи со Sterling Magee (Satan): "He was Robert
    Johnson reborn as Parliament Funkadelic". И я вам скажу, он недалек от истины.


    Раньше, когда я слышал игру какого-нибудь one-man-band, это было как-то не особо впечатляюще, но Satan покорил меня! Он
    стучит в барабаны и играет на гитаре, для которой использует всевозможные примочки, которые больше подходят для фанка
    и прочей подобной музыки, но никак для блюза! Да и игра его, это совсем не блюз - прав был Adam Gussow.


    Gussow сейчас культовый музыкант для многих, изучающих харп, но мне кажется, что на этом альбоме он немного не дотягивает
    до уровня Satan. Но это и не мудрено, Sterling гремит, играет очень психоделические аккорды, и все это приправлено хрипловатым
    вокалом, что-то среднее между Bobby Womack, James Brown и Howlin'' Wolf. Попробуй сохранить лицо рядом с таким неистовым
    музыкантом. И потому в контексте их подачи, даже такие заезженные блюзы как Sweet Home Chicago или CC Rider звучат очень
    необычно и свежо.


    И в заключении немного о гармонике. Я не очень люблю подзвученную гармонику в дуэтах, но это уличный ансамбль человека-оркестра
    и харпера, потому все должно звучать громко и жестко!'
