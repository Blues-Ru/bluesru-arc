- id: 1265
  author: Константин Колесниченко
  mark: 10
  date: '2008-05-12'
  text: 'Гай Дэвис более, чем успешно справляется с миссией хранителя настоящего блюза! Таких музыкантов, как он, остались
    считанные единицы - сильный голос, отличное владение инструментами (гитары, банджо, гармоника) и подлинно блюзовые истории,
    которые рассказаны так, что им невозможно не поверить.


    Альбом записан в Германии, в Бремене и это живая запись. Кроме самого Дэвиса на сцене еще двое: Nerak Roth Patterson -
    электрогитара и Mark Murphy на контрабасе.


    Я не любитель живых записей, но эта входит в то немногое их количество, что есть у меня. Альбом отлично записан и игра
    музыкантов на высочайшем уровне! Очень приятно слышать, что зал с интересом откликается на то, что происходит на сцене.
    А "Train Story", в которой Гай Дэвис потрясающе изобразил собак, что гонятся за поездом, на гармонике (гавкал и завывал
    во время игры) - вызвала вообще шквал оваций! Но для меня жемчужиной альбома стала проникновенная песня "Sweethart Like
    You" авторства Боба Дилана.'
