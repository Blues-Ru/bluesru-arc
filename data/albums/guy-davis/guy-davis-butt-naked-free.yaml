- id: 758
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-07-10'
  text: 'На этом альбоме Дэвис решил показать, что он умеет писать прекрасные песни в различных блюзовых и фолклвых стилях.
    Вещи на диске настолько разные по стилистике, что это могли быть разные исполнитель. Но всю эту красоту объединяет голос
    и гитара Гая. Он написал все 14 песен на альбоме, одна из них - посвящение Слепому Гэри Дэвису "Sometimes I Wish", в ней
    ой отлично цитирует хит Преподобного "Death Don''t Have No Mercy".


    С Дэвисом играет прекрасная команда музыкантов, они используют различные инструменты и звуки для создания этого эклектичного
    диска Гая. Надо отметить, что диск длится всего 44 минуты, он не затянут. Это уже четвертый альбом Дэвиса, классный альбом.'
