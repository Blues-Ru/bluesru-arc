reviews:
- id: 991
  author: Александр Панин
  mark: 9
  date: '2006-05-02'
  text: Это уже восьмой альбом Гая Дэвиса на лейбле Red House. Как и раньше, он пишет
    отличные песни и разбавляет их традиционным материалом. На этом диске очень симпатичные
    и хорошо аранжированные фолк-блюзовые композиции, среди которых три кавера и одиннадцать
    вещей авторства Дэвиса. На записи много инструментов и хороших звуков, в основном
    это акустика, но есть и электрические партии. Сам Гай превосходно играет на гитарах
    и банджо разного количества струн, губной гармошке, а также отлично поет. Банджо
    на нескольких композициях доминирует и звучит просто превосходно! На рояле и органе
    играет знаменитый Марк Нафталин, это очень здорово. Единственный обнаруженный
    мной недостаток диска - две восьмиминутные композиции, все-таки так затягивать
    хорошие песни не стоит. Если Вы никогда не слышали о Гае Дэвисе, запомните это
    имя. Это один из лучших современных акустических блюзменов, в последние десять
    лет он стабильно записывает очень приличные диски, я слышал шесть из восьми и
    горю желанием заполучить два оставшихся!
- id: 1458
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: 'Диск идет 65 минут, но его содержания хватило бы на два альбома. И вот почему:
    он перенасыщен. Во всех отношениях. В текстах и вековая блюзовая тоска, и ирония,
    и байки из жизни и полит-социальная сатира. Пестрота музыкальных стилей акцентирует
    это впечатление. Здесь есть и кантри-баллады а-ля Лидбелли, и акустические блюзы,
    и клубная электрика под "Хэммонд Би-3"... И жалобные переливы мандолины, и нахальный
    аккордеон... Заглавная песня подозрительно напоминает одесские куплеты и рассказывает
    о ловком воре кур, "про которого никто бы не подумал" - под виртуозное банджо,
    потешное кудахтанье и ошеломляющий ритм. В финальной песне Дэвис продолжает тему
    предыдущего альбома – разговор с сыном (да, с родным сыном, почитателем рэпа)
    о важности блюза, здесь и тон другой. Но в целом альбом представляет редкий образец
    смешения стилей без эклектики. И развеселое лицо на обложке точно отражает внутреннее
    содержание – это альбом из тех, что очень поднимают настроение.


    Когда музыкальному жанру переваливает за сто лет, его надо почаще встряхивать,
    во избежание осадка. Самым встряхивающим альбомом года стало новое творение мультиинструменталиста
    и истинно блюзового вокалиста и поэта Гая Дэвиса. В миру он еще и актер, писатель
    и обладатель научно степени. А поскольку блюз прежде всего отражение личности
    исполнителя, то этот альбом полностью отражает многогранность его талантов. По
    хитросплетению ритмов наговорен заглавный трек – куплеты о величайшем в истории
    похитителе кур Сканкмелло! Лиричные баллады чередуются с перчеными катнри-блюзами.
    А еще в 70-х ставший притчей во языцах 9-минутный блюз с длиннющим электрогитарным
    соло исполнен на "голубом глазу" - искренне по настроению и без повторов в музыке.
    Азартно выхватывая стили из столетней кладовки жанра, Дэвис делом подтверждает,
    что из истории блюза ничего не надо выкидывать – все сгодится в дело и сегодня.
    Это потрясающий (как уже было сказано) альбом. Который при насчитанных музыкальных
    достоинствах еще и гарантировано поднимает настроение.'
