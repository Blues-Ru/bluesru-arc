  author: Александр Панин
  mark: 10
  date: '2013-04-05'
  text: Полуторачасовая музыкальная пьеса, периодически исполняемая на концертах Гая начиная с 1994 года. Вжившись в образ
    бродячего довоенного блюзмена Фиши Уотерса, Дэвис выдает поразительную смесь акустических блюзов и рассказываемых историй.
    Большая часть песен известна нам по отменному альбому Stomp Down Rider (1995). Теперь понятно, что он просто не решился
    выпустить на своем дебютном альбоме сразу всю пьесу, а ограничился только музыкой. Эта музыка сама по себе великолепна,
    пусть и исполняется всего одним человеком. Акустическая гитара, слайд, губная гармошка, хитро имитирующая разные звуки.
    Башмак, верный инструмент блюзмена. Звучание потрясающее, духовное, энергетическое. Добавим теперь в промежутках разнообразные
    истории, жизненные и фантастические. Сказка про пьяного шелковичного червя. Про комаров "two-timers", настолько больших,
    что с одного раза не прихлопнешь. Рассказ про одноногого грабителя могил. Печальная история про линчевание чернокожего
    подростка. Про то, как герой, в бытность Брайтом Фуллером, в первый раз хлебнул муншайна. Как его дядя неудачно навязался
    на садовые работы. Про странствия без особенной цели. Браво! Необходимо определенное напряжение, чтоб расслышать все детали,
    ибо транскрипта к пьесе не прилагается, но это того стоит. Невероятно яркий, потрясающий диск, отправляющий нас в прошлое,
    к довоенному блюзу и сопутствующему фольклору!
