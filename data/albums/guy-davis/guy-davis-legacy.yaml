reviews:
- id: 805
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-08-10'
  text: 'Великолепный альбом Дэвиса. Он использует всю широту понятия фолк-блюз, у него разнообразные гармонии, мелодии и
    ритмы. Гай играет на гитаре, банджо, мандолине и других струнных, а его голос заставляет слушать диск дальше и дальше.
    Группа играет выше всяких похвал, но иногда ее нет - Дэвис поет один. Он исполняет блюзы, кантри-фолк, госпел и другую
    сельскую музыку с одинаковым качеством и самоотдачей. Первый трек интересен тем, что он ругает молодого рэппера за то,
    что тот не любит блюз и не чувствует корней, а рэппер отвечает ему, что блюз - это дрянь для стариков.


    Очень хорош этот человек - Гай Дэвис. Слушая его, понимаешь, что где-то там в США еще живет та искренняя и красивая акустическая
    музыка, да еще в таком шикарном исполнении.'
