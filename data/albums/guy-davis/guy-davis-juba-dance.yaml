- id: 2101
  author: Александр Панин
  mark: 10
  date: '2013-04-05'
  text: 'Новый альбом Гая Дэвиса, записанный в итальянском городе Бергамо при участии неизвестного мне харпера Фабрицио Поджи.
    Сей губногармонист зело хорош, но речь сначала не о нем. На этом диске соотношение каверов и собственного материала Дэвиса
    примерно пятьдесят на пятьдесят, и совершенно исключительные треки есть в обеих категориях. Песня See That My Grave Is
    Kept Clean с партией банджо и дозаписанными подпевками самих Blind Boys of Alabama превратилась в проникновенный госпел-номер,
    That''s No Way to Get Along и Saturday Blues оригиналов, конечно, не заменят, но невероятно мощны и хороши. А вещи авторства
    Гая? Совсем архаично звучащая Dance Juba Dance с гипнотичным банджо-риффом, притопываниями и игрой на ложках! Black Coffee,
    где в полную мощь разворачивается инструмент Фабрицио. И тут же сам Дэвис берется за гармошку и выдает смешную тему Did
    You See My Baby в духе Сонни Терри. Нельзя не отметить Satisfied с насыщенным звуком: тут наложены шести-, двенадцатиструнка
    и банджо. Я перечислил всего около половины треков диска, но и остальные содержат немало изюминок. Замечательная запись
    с очень богатым и красивым акустическим звучанием, жемчужина дискографии Гая Дэвиса!'
