  author: Дмитрий Казанцев
  mark: 10
  date: '2005-05-18'
  text: 'Невероятная красота и энергия. Современный блюз Дэвиса - это его мощный хриплый
    вокал (очень в духе Хайлина Вулфа), акустические гитары, мандолина, орган Хаммонда
    и великолепная ритм-секция. Гай также играет на гармошке, стиральной доске, банджо
    и даже диджериду!


    Альбом длинный - 16 песен, но трудно тут найти плохие места или кусочки. Дэвис
    - настоящий продолжатель дела фолк-блюза (не без элементов соула, кстати).'
