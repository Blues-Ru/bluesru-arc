  author: Дмитрий Казанцев
  mark: 9
  date: '2005-05-18'
  text: 'И еще один классный альбом Дэвиса. Блюз и фолк высочайшего уровня. В мире,
    где популярны гитарные запилы и дурацкое пение не своими "делаными" голосами,
    подобные альбомы являются настоящими жемчужинами музыки.


    Гай поет, играет на 6-и и 12-струнной гитарах, слайд гитаре, банджо, гармонике
    и перкуссии. С ним отличная группа (барабаны, бас, туба, электрогитара, орган,
    мандолина, аккордеон), которая великолепно исполняет древние фолковые номера и
    приджазованные соул-блюзы (такие тоже есть на диске).


    Из 14 композиций есть очень известные: "Limetown" (Estes), "Step It Up And Go"
    (она же "Bottle Up And Go"), "I Believe I Lose My Mind" (Hooker), "Drifting Blues",
    "Matchbox Blues", "Back Door Man".


    Музыка живет и продолжается в жизни Гая Дэвиса.'
