- id: 653
  author: Александр Панин
  mark: 9
  date: '2005-05-20'
  text: Первый альбом Гая Дэвиса на лейбле Red House Records. Это концертный диск, Дэвис исполняет интересный акустический
    сет, большую часть которого составляют классические блюзовые вещи - три композиции Роберта Джонсона, по одной Блайнд Уилли
    МакТелла, Ледбелли, Мэнса Липскома и своего преподобного однофамильца. Своих песен только три, они вполне адекватны, хоть
    и несколько проигрывают классике (впрочем, Ramblin' All Over - ломовая вещь). Гай играет на шести- и двенадцатиструнной
    гитаре, дудит в гармошку и довольно выразительно поет. Все очень интересно! Слайд местами отменнейший, особенно яросто
    звучит Walkin' Blues. В середине сета Дэвис рассказывает историю о человеке по имени Мэдисон и его свиньях, во время которой
    выдает прикольные соло на гармошке. В отличие от многих древних блюзменов, разговоры которых без подстрочника не разобрать,
    здесь все слышно и понятно.
- id: 757
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-07-10'
  text: 'Дебютный концертный альбом этого симпатичного исполнителя по имени Гай Дэвис. Он играет и поет один, используя гитары
    и губную гармошку. В программе целых 17 композиций, но альбом длится всего около 50 минут - это очень приятно, конечно.


    Дэвис исполняет классику Дельты и фолк-блюза, а также свои композиции. Среди блюзовых хитов тут есть: "Dust My Broom",
    "If I Had Possession...", "Candy Man", "Walkin'' Blues". Хриплый, но яркий голос Гая хорошо передает атмосферу архаики,
    а его игра на гитаре не настолько виртуозна, чтобы "забить" его пение и рассказы. Кстати, стоит отметить, что он также
    использует слайд при игре на акустике.


    Хороший концертник, но забегая вперед, надо сказать, что его альбомы с группой все же интереснее.'
