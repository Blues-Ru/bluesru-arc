  author: Дмитрий Казанцев
  mark: 10
  date: '2005-06-04'
  text: 'Второй альбом группы. Продюсер диска - Том Дауд - знаменитый мастер на Уорнере (и не только). В группе 6 человек:
    James Montgomery - harmonica/vocal, Billy Mather - bass/vocal, Peter Malick - guitar/steel guitar/vocals, David Case -
    organ/piano/clavinet/vocal, Chuck Purro - drums/percussion/vocal, Peter Bell - guitar/vocal. Ребята продолжают играть
    очень интересный микс блюза, фанка и рока, а на этом альбоме еще двое поют первым голосом - Чак и Дэвид (на первом диске
    пели только Джеймс и Питер Белл).


    На диске 10 песен; 7 написаны группой, а 3 - каверы: "I Can''t Stop" (Roger Hawkins), "Brickyard Blues (Allen Toussaint
    - снова он!), "Ten Page Letter" (Otis Redding). Ребята отлично поют, Джеймс классно играет на гармошке, два гитариста
    интересно обыгрывают различные стили и жанры. Том Дауд сделал так, что этот диск звучит еще лучше первого (а ведь их дебют
    очень классно записан).


    Еще одна отличная пластинка классной группы!'
