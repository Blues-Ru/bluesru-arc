- id: 710
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-06-04'
  text: 'Третий альбом группы. Здесь все по-другому - диск вышел на фирме Island, а продюсером стал Аллен Тюссо. Конечно,
    появилось много фанка, соула и ритм-н-блюза. Блюзовые корни тут, но все звучит очень по-фанковому и по-новоорлеански.
    Дудки, женские подпевки, шикарные темы и аранжировки - все это здОрово и красиво.


    В составе тоже есть изменения - на гитаре вместо Питера Мэлика пришел Пол Ленарт, а на саксофонах появился Дэвид Вудфорт
    - седьмой участник группы. На этом альбоме 8 отличных ритм-н-блюзовых номеров, один лучше другого. Прекрасный звук и настроение.'
