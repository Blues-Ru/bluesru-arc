  author: Дмитрий Казанцев
  mark: 10
  date: '2005-06-04'
  text: 'Дебютный альбом этой интересной блюз-рок-группы. Сам Джеймс поет и играет
    на гармошке, а вместе с ним: Дэвид Кейс - орган/клавинет/пианино/вокал; Билли
    Матер - бас; Чак Пурро - барабаны/перкуссия; Питер Мэлик - гитара/стил-гитара/вокал;
    Питер Белл - гитара/вокал; Ларри Уошингтон - конга/бонго. Группа играет замечательный
    сплав блюза, рока и фанка, иногда слышны элементы латинского рока. Это можно назвать
    и южным роком, но тут почти отсутствует кантри-влияние. Монтгомери очень лаконично
    и красиво играет на харпе, но поет не только он - 4 песни поет Питер Белл.


    На диске 9 треков, 5 из них написаны участниками группы, а остальные 4 - замечательные
    каверы: "Don''t Do That" (traditional) - танцевальный свинг-блюз; "Ready Teady"
    - знаменитый рок-н-ролл в классном исполнении (они поют его в два голоса в быстром
    темпе); "Going Down" - песня знаменитого Аллена Тюссо в хорошей блюз-фанковой
    аранжировке (одна из лучших вещей на альбоме); "Train" - знаменитый "Train I Ride"
    или "Mystery Train" в очень необычной аранжировке (длится 9 минут). Песни, написанные
    группой еще интереснее каверов, так что можно сказать, что эта группа не только
    классно исполняет, но также достойно сочиняет ("I''m Funky But I''m Clean" и "Drive
    Myself Crazy" - шедеврально).


    Интересный, классный, необычный, эклектичный и НУЖНЫЙ диск.'
