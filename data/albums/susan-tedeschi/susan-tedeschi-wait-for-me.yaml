reviews:
- id: 107
  author: Алексей Калачев
  mark: 5
  date: '2003-02-24'
  text: 'Удивительно, но новый альбом Тедески вызвал больше интереса, чем предыдущий.
    Удивительно, потому что предыдущий был несравнимо более жесткий, гитарный и более
    непосредственный, что ли. На этом релизе заметна тенденция: многие ритм-энд-блюзовые
    музыканты смягчили тон своих работ, сделав упор не на драйв, а на мелодику. Таково
    уж требование конъюнктуры американского рынка. Сюзан – прекрасная вокалистка,
    все более явно обретающая свой певческий почерк. Вот что следует из ее новой пластинки.
    В этот раз у нее куча весьма искушенных и изощренных помощников, начиная от собственного
    мужа, виртуоза слайд-гитары Дерека Тракса и заканчивая целой командой сессионных
    виртуозов и аранжировщиков. Суммируя впечатления,можно сказать, что диск состоит
    из симпатичных поп-песен с сильным блюзовым звучанием (предыдущий диск Тедески
    все-таки поблюзовей будет).'
