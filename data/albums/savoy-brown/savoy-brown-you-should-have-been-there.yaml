  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2018-07-19'
  text: 'You Should Have Been There - концертный альбом легендарных Savoy Brown во
    главе с бессменным лидером Кимом Симмондсом. Запись была сделана 23 февраля 2003
    года в Ванкувере, Канада, для CBS. Первое издание альбома вышло в 2004 году, а
    в 2018 он был переиздан.


    На диске представлена одна совершенно новая песня Where Has Your Heart Gone, одна
    песня с сольного альбома Кима Симмондса Blues Like Midnight (кавер Джимми Роджерса),
    а также проверенная классика группы Poor Girl, Street Corner Talking и Hellbound
    Train. Пять из шести композиций длятся более 10 минут - это развернутые концертные
    версии, содержащие блюз-роковые джемы и гитарные дуэли. Музыка на стыке блюз-рока
    и хард рока в их классической концертной ипостаси - мощная энергетика, отменное
    исполнение, много импровизации и солирования. Диск записан вполне прилично и слушается
    на одном дыхании - приятный часовой подарок от мастеров жанра.'
