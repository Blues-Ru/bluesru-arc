  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2016-12-06'
  text: 'Шестого декабря 2016 года исполняется 69 лет известному уэльскому блюз-рокеру,
    основателю и бессменному лидеру группы Savoy Brown гитаристу Киму Симмондсу. Группа
    была создана в 1966 году на волне британского блюзового бума под именем Savoy
    Brown Blues Band и достигла успеха на блюзовом поприще, хотя уже в 70-х и позднее
    блюз перестал быть основной составляющей в музыкальной стилистике группы. За долгую
    историю коллектива через него прошла целая плеяда музыкантов, но только Ким Симмондс
    неизменно оставался у руля и поддерживал группу на плаву.


    Альбом Make Me Sweat - своего рода переходный альбом, на котором в группу вернулся
    вокалист Дэйв Уокер, а Ким пытается переориентироваться в коммерческом плане и
    нацелиться не только на блюзовую, но и рок аудиторию, и сделать музыку, привлекательную
    для радио ротации.


    Этого ему в полной мере удалось достигнуть на следующем альбоме Kings of Boogie.'
