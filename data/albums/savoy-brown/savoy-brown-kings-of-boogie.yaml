  date: '2016-12-06'
  text: Альбом Kings of Boogie - 22-й по счету в дискографии Кима Симмондса. Диск
    записан тем же составом и с тем же продюсером, что и его предшественник Make Me
    Sweat, и ориентирован отнюдь не на блюзовых пуристов, а скорее на широкую аудиторию
    поклонников рока (а Hertbreaks Make You Strong даже имеет отчетливый металлический
    привкус). Группа звучит мощно, Симмондс демонстрирует прекрасное владение инструментом
    (включая слайд), а Дэйв Уокер хорош и в балладах, и на быстрых треках. При записи
    группе помогали клавишники Бобби Секстон и Роберт Мартин (которые участвовали
    и при записи предыдущего диска), а также перкуссионист Стив Клонг. В целом получился
    довольно приятный мелодичный блюз-роковый альбом полностью авторского материала
    (преимущественно написанного одним Симмондсом), вполне подходящий для ротации
    на коммерческих радиостанциях.
