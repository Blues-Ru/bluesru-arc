  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2017-09-06'
  text: '"On this album, I tried my best to get my voice in its power zone. I''m a baritone singer. I like listening to singers
    I can relate to, such as J.J. Cale, Mark Knopfler, Tony Joe White and Tom Rush. For my guitar playing, I still get inspiration
    from Otis Rush, Buddy Guy and all the Chicago players I grew up listening to back in ''63... but I always listen to new
    music too."


    "I''m amazed that I still have the energy inside me to play guitar, create music and write songs. I''ve been blessed in
    my life and I thank God for that. I''ve never been a believer in holding on to the past - I don''t look over my shoulder
    and congratulate myself. I always want to climb the next mountain - and I''m very pleased with this new album..."


    - Kim Simmonds


    Вслед за своим инструментальным сольником 2017 года Jazzing on the Blues неутомимый Ким Симмондс выпустил очередной альбом
    уже под именем своего основного коллектива - Savoy Brown. Диск записан в формате power trio с басистом Пэтом Десалво и
    ударником Гарнетом Гриммом. Все песни написаны Кимом в течение последних двух лет, Симмондс также выступил в роли продюсера.
    В музыкальном плане это классический гитарный блюз и блюз-рок, которым славится долгая история Savoy Brown. К исполнительскому
    мастерству Симмондса никогда претензий не было, а вот с вокалом у него не очень - иногда он даже приглашал вокалистов
    (и это только шло на пользу конечному продукту). Но на данном альбоме на удивление с вокалом у Кима все достаточно прилично.
    Диск записан очень хорошо и сбалансировано, все инструменты звучат четко. Вполне достойный альбом легендарного коллектива,
    который наверняка найдет своего слушателя, и одна из лучших работ Кима в этом тысячелетии. Сам маэстро утверждает, что
    он более чем доволен своей новой работой.'
