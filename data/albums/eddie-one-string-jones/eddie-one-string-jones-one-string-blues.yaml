  date: '2005-05-20'
  text: 'Очень неважно записанный, но тем не менее интересный и уникальный диск!


    Первые девять треков исполняются человеком по имени Эдди Джонс. Каково было его
    настоящее имя, неизвестно, этот бродячий черный музыкант внезапно появился в 1960
    году в поле зрения одного лос-анджелесского любителя фолковой и этнической музыки,
    тот записал несколько его вещей, и он так же внезапно исчез. Этот Эдди играл блюз
    на примитивном однострунном самодельном инструменте с помощью небольшой плоской
    бутылки из-под виски в роли слайда и какой-то палочки. Звуки у него получались
    металлические, совершенно безумные и ни на что не похожие, но музыкально и ритмически
    это был настоящий блюз, о чем свидетельствуют и известные названия Rolling And
    Tumbling, John Henry, I''ll Be Your Chauffer, Baby Please Don''t Go... Первым
    треком диска идет "мастер-класс", во время которого Эдди показывает, как из одной
    струны извлекаются все нужные ноты. Девятый номер - впечатляющая история про слона
    с "nine inch dick", однако это сильно, особенно под одну струну :))


    Оставшиеся шесть вещей диска сыграны бродячим харпером Эдвардом Хэзелтоном, здесь
    интересного немного.


    Оценивать объективно трудно - и качество неважное, и традиционные музыкальные
    критерии тут, пожалуй, не подойдут. Ценность диска в крайней необычности записанных
    звуков. Просто удивительно, как с помощью одной струны можно добиться такой мощи
    звучания!'
