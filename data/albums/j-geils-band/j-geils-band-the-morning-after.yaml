- id: 1034
  author: Константин Колесниченко
  mark: 8
  date: '2006-10-04'
  text: 'Второй альбом группы. Группа продолжает играть блюз-рок и ритм-н-блюз, хотя, на этот раз, рок доминирует. Музыканты
    стали играть быстрее, громче и агрессивнее, но музыка все равно классная - интересные и нетривиальные аранжировки, музыканты
    играют от души - 1971 год - это лучшее время для такой музыки.


    Все музыканты - играют монолитно, без лишних и ненужных наворотов, Magic Dick (harp) - это что-то невероятное, потрясающее
    владение инструментом, очень показательно.


    Лучше композиции: "Gotta Have Your Love", медленная "Cry One More Time", "Whammer Jammer" (что тут творит Magic Dick!),
    "Looking for Love", "So Sharp".'
