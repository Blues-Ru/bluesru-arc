reviews:
- id: 718
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-06-11'
  text: 'Группа из Бостона, в составе 6 человек: Peter Wolf - vocals, Seth Justman
    - piano & organ, Magic Dick - harp, J. Geils - guitar, Danny Klein - bass, Stephen
    Bladd - drums & vocals. Это их дебютных альбом, и на нем они играт и поют в стиле
    блюз-рока и ритм-н-блюза. Есть тут и то, что принято называть буги-роком и южным
    роком. Питер прекрасно поет, его вокал чем-то напоминает Джона Хаммонда. Magic
    Dick очень здорово владеет гармошкой, играет точно и очень ярко. Сам J. Geils
    здорово солирует на гитаре, очень уверенно и классно.


    На альбоме 11 песен, среди которых три отличных блюзовых стандарта в их обработке:
    "Serves You Right To Suffer" (John Lee Hooker), "Homework" (Otis Rush), "Sno-Cone"
    (Albert Collins). Помимо этого тут есть песня Смоуки Робинсона "First I Look At
    The Purse" и прекрасный боевик Уолтера Прайса "Pack Fair And Square". Остальные
    вещи написаны участниками группы, и они тоже очень хороши.


    Звук на диске четкий и разборчивый - ясно слышны все звуки и инструменты. Альбом
    слушается на одном дыхании - прекрасное начало творческой карьеры!'
- id: 1033
  author: Константин Колесниченко
  mark: 9
  date: '2006-10-04'
  text: 'По-моему, это один из лучших дисков в ритм-н-блюзе, блюз-роке, а ведь играют
    белые. Великолепный дебют классной группы.


    Альбом наполнен классной музыкой, внятной, разнообразной и очень драйвовой. Музыканты
    отлично играют, особенно хочется выделить Magic Dick на гармонике - один из лучших
    белых харперов (на уровне с первопроходцами: Paul Batterfield, Charlie Musselwhite,
    Corky Siegel). Материал подобран тоже очень классный, лучше песни: "Wait", "Ice
    Braker", "Homework", "First I Look at the Purse", и инструментал Альберта Коллинза
    "Sno-Cone"'
