reviews:
- id: 942
  author: Дмитрий Казанцев
  mark: 4
  date: '2005-12-30'
  text: 'Сонни - один из лучших слайд-гитаристов на сегодняшний день, он работал с различными музыкантами, как в акустике,
    так в электро-звучании. К сожалению, этот диск - концертник, на нем записаны 11 блюз-роковых песен, все они написаны самим
    Сонни. Звучание шумное, грязное и тяжелое, совсем не то, чего ждешь от гитариста-виртуоза такого класса. Можно сказать,
    что программа мощная и виртуозная, но совсем не музыкальная. Сонни может неплохо петь, но на концерте все это звучит просто
    как "надо было спеть".


    Этот альбом совсем не такой как его студийные работы - они классные.'
- id: 1436
  author: Андрей Евдокимов
  mark: 6
  date: '2009-02-05'
  text: 'Гитарное трио на концерте в небольшом (и давно любимом лично музыкантами) клубе. Живая музыка: вся на виду, и все
    по честному - никаких переналожений. Любителю собственно блюз-рока альбом не покажется серьезным: лишь два трека возвращают
    во времена пафосного тяжелого блюза, а прочие основываются на родных Ландресу луизианских игривых ритмах и лукавых.нотках.
    Как стремительно он приземляется с верхов внушительно мощного глиссандо к ироничному стаккато! На сегодня он один из лидеров
    слайдовой техники, игра его разнообразна и своеобразна. Гитара звучит и мощно, и точно. Самая слабая сторона – вокал Ландреса.
    Увы, это такая обычная история для гитарных героев, что мы привыкли и почти уже не замечаем. А в финальном десятиминутном
    треке голос человека резонно звучит слабо против невероятного многоголосия выразительных возможностей слайд-гитары – под
    вудуистский аккомпанемент африканских ритмов.'
- id: 1796
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-05-27'
  text: 'Сонни Ландрет - один из лучших слайд-гитаристов нашего времени, которого Эрик Клэптон назвал, возможно, самым недооцененным
    и одновременно вероятно одним из самых выдающихся современных блюзовых гитаристов.


    На данном концерте, записанном в любимом клубе Сонни на Грант Стрит 23 и 24 апреля 2004 года, гитарист и его проверенная
    временем ритм-секция играют 11 треков из всего творчества Сонни, написанные им самим. Данная запись в формате power trio
    заметно отличается от элегантного виртуозного звука его сольных альбомов - тут на первом месте стоит мощь, напор, жесткие
    рифы, длинные импровизационные куски. В общем, классический тяжелый блюз-рок, виртуозно исполненный, но не слишком мелодичный.


    Техника владения инструментом и исполнение, бесспорно, феноменальные, но для меня, например, этого маловато - мне важна
    еще и музыкальность материала, поэтому рекомендую в первую очередь студийные альбомы Ландрета, на которых в полной мере
    раскрывается его многосторонний талант.


    Диск поднялся до второго места в блюзовом топе альбомов Билборда.'
