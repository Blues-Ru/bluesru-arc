  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2022-11-09'
  text: 'СОННИ ЛАНДРЕТ (именно так - заглавными буквами, и никак иначе!). Гениальный
    слайдер и луизианский блюзман. гитарист с уникальной техникой, создавший особую
    музыкальную нишу, в которой ему просто нет равных. Новаторская техника Сонни открывает
    новые возможности звукоизвлечения для нового поколения гитаристов-слайдеров. Талант
    Сонни признан поклонниками, критиками, а также - что наиболее весомо - коллегами-гитаристами
    высшего эшелона (Клэптон, Траут и многие многие другие). Ландрет - учший инструменталист
    2005 года по данным Американской музыкальной ассоциации и обладатель блюзовой
    награды Blues Music Award в категории "лучший гитарист-инструменталист" в 2016
    году.


    Blacktop Run - последний на данный момент студийный альбом короля слайдеко (а
    всего это уже четырнадцатый диск Сонни), записанный до начала пандемии и вышедший
    21 февраля 2020 года. Альбом состоит из 10 треков, включая четыре отменных инструментала.
    Сонни написал восемь, остальные два трека авторства клавишника Стива Конна. Ландрет
    также продюсировал альбом (совместно с Тони Дэйглом и РС Филдом). Филд до этого
    продюсировал три наиболее важных альбома в карьере Сонни, и воссоединение с ним
    на этом диске дополнительно стимулировало творческий потенциал музыканта. БОльшая
    часть треков была записаны "вживую" в студиях Доксайд к югу от Лафайетт, где был
    записан предыдущий концертный альбом Сонни - Live at the Lafayette, номинированный
    на Грэмми. Все инструменты прописаны очень хорошо.


    Blacktop Run - необычный гитарный альбом. Он пропитан луизианским духом, наполнен
    тонкими музыкальными оттенками и структурами, пульсирующими риффами и оригинальными
    соло, а также характеризуется стилистическим разнообразием. Игра Ландрета одновременно
    чрезвычайно элегантна и очень сложна в техническом плане. Однако эту сложность
    часто просто не замечаешь - настолько легко, естественно и даже - кажется - очень
    расслабленно играет музыкант. Уникальная филигранная техника Сонни и его композиторские
    навыки позволяют ему легко и естественно смешивать различные стили - блюз, рок,
    луизианский свомп-блюз, зайдеко и даже джаз-рок , создавая на выходе свой собственный
    уникальный микс современной американской корневой музыки.


    Сонни утверждает: "Если честно, я думаю, что наиболее естественная форма музыки
    - импровизационная. Когда музыка течет, она кажется возникающей из ниоткуда и
    соединяет твое сердце и душу с кончиками пальцев. Различные подходы могут влиять
    друг на друга - и для меня это делает процесс более музыкальным и более интересным."


    Любопытно, что завершающая альбом песня "Something Grand" не содержит гитарного
    соло. По словам самого автора, "это песня-искупление. И хотя она повествует о
    взаимоотношениях двух людей, она также затрагивает более крупномасштабные жизненные
    проблемы." По словам Ландрета, "творчество - это способ рассказать историю. И
    пока я могу находить свой путь на этом маршруте, я буду продолжать." Подход музыканта
    наглядно иллюстрирует заглавная песня альбома: "Начинается новый день, и я еще
    никогда не чувствовал себя столь живым".


    Cонни Ландрет уже давно создал свой собственнй саунд, и на каждом новом диске
    умудряется найти новый способ создания интересной музыки в луизианской традиции.
    Да, это традиционная музыка, но каждый раз мастер-слайдер умудряется доставить
    уникальное удовольствие слушателю. Думаю, данный альбом не самый лучший в каталоге
    Ландрета, но один из лучших и бесспорно достойная работа большого мастера (жаль
    только, коротковат альбом - всего 35 минут).'
