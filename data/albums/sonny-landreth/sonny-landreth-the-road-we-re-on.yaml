- id: 1795
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-27'
  text: 'Шестой сольный альбом Сонни Ландрета, на котором он сконцентрировался на
    современном блюзе в различных его разновидностях: тут и техасский шаффл, и зайдеко,
    и блюз-рок.


    Как обычно, филигранная техника владения слайд-гитарой с сохранением спонтанности
    концертных выступлений (большинство треков записаны практически без наложений),
    соединенной с утонченностью студийного звучания. В этот раз Сонни обошелся без
    приглашения звезд мировой величины, но от этого альбом нисколько не пострадал.


    К сожалению, композиторские навыки Сонни все же уступают его таланту исполнителя,
    и пластинка не дотягивает до твердой пятерки (но уже близко-близко).


    Третье место в блюзовом топе Биллборда.'
