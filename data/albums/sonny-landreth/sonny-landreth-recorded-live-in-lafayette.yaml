  text: '"Sonny''s guitar playing thrives in its'' own universe." - Blues Blast Magazine


    "Unlike any blues before... You never knew things could be this good." - All About
    Jazz


    Мастер-слайдер Сонни Ландрет выпустил второй за его долгую карьеру официальный
    концертный альбом, записанный в течение трех концертных вечеров в центре искусств
    в Лафайете (по месту жительства Сонни). На первом диске представлен акустический
    сет, иллюстрирующий зайдеко-прошлое гитариста, а на втором диске - более традиционный
    электрический сет. Вместе с маэстро на сцене двое музыкантов его концертной группы
    - бас-гитарист Дэвид Рансон и ударник Брайан Бриньяк, а также двое гостей - гитарист
    Сэм Бруссард и клавишник и аккордеонист Стив Конн (который также поет на последнем
    треке). Программа концерта составлена преимущественно из собственных песен Ландрета,
    написанных в разные годы, да плюс тройка каверов. Продюсировали Сонни Ландрет
    и Тони Дайгл.


    Акустический сет содержит 8 песен с новыми аранжировками и минималистским сопровождением
    - две гитары, укелеле бас, традиционная каджун-перкуссия и эпизодический аккордеон.
    Здесь слышны корни музыки Сонни Ландрета - это музыка Луизианы и каджун-культуры,
    замешанная на блюзе и приправленная зайдеко. Даже песни, записанные исходно на
    альбомах в электрических версиях, не проигрывают в этой концерной unplugged-интерпретации.


    Во время электрического сета Сонни выкладывается по полной - только он может поставить
    в сет-лист подряд 3 инструментала и отыграть их на одном дыхании. Brave new Girl
    и Uberesso звучат просто фантастически! Что там говорить - Мастер он и есть Мастер,
    да и группа ему под стать.'
