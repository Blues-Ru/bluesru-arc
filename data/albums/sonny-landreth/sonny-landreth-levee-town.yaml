  text: 'Sonny Landreth - Levee Town - 2000 (expanded edition 2009 with bonus CD)


    Один из лучших альбомов современного луизианского свамп-блюза, записанный виртуозом-слайдером
    Сонни Ландретом в 2000 году. Хотя альбом преимущественно спокойно-расслабленный,
    на нем есть место и для акустики, и для блюзовых баллад, и для заводного зайдеко,
    и для быстрых рОковых треков. Пожалуй, это самый близкий к традиционной музыке
    Луизианы альбом современного блюза, исполненный мастером в сопровождении отличного
    сопровождающего состава, включая ряд приглашенных гостей, среди которых Джон Хайэтт
    и Бонни Райатт, а также Майкл Дусе на скрипке.


    Этим альбомом Сонни отдал дань той музыке, на которой он вырос, предложив свою
    собственную современную ее интерпретацию. Виртуозная игра Сонни по-прежнему поражает,
    но все же главное на альбоме - песни и музыка, они создают соответствующее настроение
    - то иллюстративное созерцательное, то празднично-веселое. Все песни написаны
    Сонни (только одна - в соавторстве), что характеризует его возросший композиторский
    талант.


    Отличный альбом мелодичного современного свамп-блюза, который также понравится
    и любителям мелодичного софт-рока.


    В 2009 году Сонни переиздал диск 2000 года на своем собственном лейбле Landfall
    Records в виде расширенного издания, в которое вошел ремастированный исходный
    альбом, а также бонусный диск из неизданных ранее 4 инструментальных и одного
    вокального треков, записанных в 1998, 1999 и 2000 годах (плюс некоторые добавки
    уже в 2009 году).


    "Sonny is held in near-unparalleled esteem by musicians across the globe for his
    seemingly effortless ability to meld guitar technique and tone." -- Rock N Reel,
    June 1, 2009


    "The blues are never far away; but there''s effortless style and variety throughout;
    raw instrumental jams - chugging, thoughtful jaunty swamp pop, and soulful." --
    CRS, June 1, 2009'
