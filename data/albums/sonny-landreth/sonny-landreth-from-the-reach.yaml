reviews:
- id: 1313
  author: Андрей Евдокимов
  mark: 7
  date: '2008-07-19'
  text: 'Любителям старого доброго рока. Не настолько старого, чтобы растерять все
    зубки и стать слишком добреньким. Контригра двух лидирующих гитар на почве хороших
    электрических клавишных обращает знатоков истории вопроса к аналогиям с лучшими
    годами the Allman Brothers. У повзрослевшего Сонни Ландерса тоже есть героические
    рок-блюзы (Blue Tarp Blues), как есть и величественные кантри-рок-баллады. Он
    ведет во всех песнях бравую атаку слайдом, а в гитарных дуэлях противостоят ему
    люди бывалые: Марк Нопфлер играет молодецки хрипатую гитару a-la изначальные Dire
    Straits; Роббен Форд уж на что умен, но тут, в "южном роке", он ближе к земле;
    Эрик Клэптон – парень не промах, уж-конечно. Вообще, это мужской поступок: позвать
    Клэптона и Доктора Джона в качестве инструменталистов, а как вокалистов – оставить
    их на подпевках. Ландерс всерьез повзрослел: он больше не мечется от стиля к стилю,
    не стесняется выступать в роли лидирующего вокалиста, и все песни – его сочинения.'
- id: 1797
  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2011-05-27'
  text: 'From the Reach - пожалуй, самый интересный в музыкальном отношении студийник
    Лэндрета; кроме того, он записан в качестве дебютного на собственной студии звукозаписи
    Сонни - Landfall Records. Уже один список приглашенных музыкантов (см. ниже) говорит
    о том, что это неординарная работа. Однако Сонни не стал концентрировать внимание
    на технике и гитарных дуэлях (которые тоже присутствуют), а постарался написать
    песни таким образом, чтобы органично вплести в свой музыкальный материал характерные
    стили игры (и эпизодический вокал) приглашенных звезд блюза. Весь материал - авторский,
    продюсировали Сонни и Тони Дайгл.


    Получилась во всех отношениях отличная пластинка - диск с прекрасными мелодиями,
    отлично исполненными, спетыми и записанными. При этом Ландрет сохранил свою оригинальность,
    оттенив ее манерой игры приглашенных блюзовых грандов. Диск, который хочется слушать
    еще и еще (и еще!). Заслуженное первое место в блюзовом топе Биллборда.


