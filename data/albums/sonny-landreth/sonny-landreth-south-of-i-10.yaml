- id: 985
  author: Дмитрий Казанцев
  mark: 7
  date: '2006-04-09'
  text: 'Сонни - гипервиртуозный слайд-гитарист; а еще он неплохо поет и пишет приятные песни (его главный хит "Congo Square"
    именно на этом альбоме). Лэндрет родился на юге, и в его музыке очень сильны влияния зайдеко, кейджун и блюза. Можно сказать,
    что это рутс-рок, но тут нет традиционного влияния фолка и кантри, как это обычно бывает. Большинство песен на альбоме
    в очень бодром темпе, но вокал Сонни успокаивает эту безумную скорость. Есть тут одна большая проблема, из-за которой
    я поставил оценку на БАЛЛ ниже. Это КОШМАРНЫЙ компрессированный, цифровой и громкий звук, который идет с компакта. Очень
    тяжело слушать такую сжатость и нединамичность. А учитывая то, что здесь записана рутовая музыка, это почти катастрофа.
    Я просто не понимаю как так могло у них выйти.


    Отличная музыка и игра, но звук убивает легкость и все корневые ощущения.'
- id: 1794
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-27'
  text: 'Луизианского гитариста Сонни Ландрета недаром прозвали "королем слайдеко" - в его музыке чувствуется сильное влияние
    традиционной музыки зайдеко, а по мастерству владения слайдом ему просто нет равных. Вот какое мнение о Сонни высказал
    Уолтер Траут: "Сонни Ландрет - величайший слайд-гитарист в мировой истории. Никто не может с ним сравниться - неважно,
    кого бы Вы не назвали. Есть Сонни - и есть все остальные."


    Четвертый сольный альбом американского виртуоза-слайдера и одна из его лучших работ. Кроме наиболее известного хита Сонни
    Congo Square, на альбоме содержатся различные околоблюзовые стили (рок-н-ролл, ритм-и-блюз, каджун, зайдеко, блюз-рок).
    Музыка, бесспорно, имеет традиционные народные корни, но сыграна современно и достаточно жестко. Виртуозное владение гитарой
    и приличный вокал Сонни, а также помощь таких звезд, как Марк Нопфлер и Ален Туссен, делают этот альбом чем-то особенным.
    Материал почти полностью авторский (1 кавер Mojo Boogie). Продюсировали Р.С. Филд и Сонни Ландрет. Great Gulf Wind украшена
    привлечением духовой секции The Legendary White Trash Horns, партии которых написал и аранжировал Ален Туссен.


    Рекомендуется всем любителям блюза!'
