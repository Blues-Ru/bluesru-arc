- id: 2210
  author: Олег Пчелкин (oleg_spb)
  mark: 9
  date: '2015-06-06'
  text: '9 июня состоится официальный выход в свет нового альбома Сонни Ландрета Bound
    of The Blues (В рамках блюза). Выпускает его Provogue Records, альбом - возвращение
    к звучанию первых пластинок Ландрета (The Road We''re On, к примеру), благодаря
    которым его узнали и полюбили. Альбом украшают кавера, вариант, в случае Ландрета,
    беспроигрышный, хотя кое-что узнаешь не сразу под скатертью-занавеской ландресовской
    слайд вязи. Отдав должное классическим оркестровым формам и джаз-фьюжн в Elemental
    Journey артист вернулся к простому и мощному собственному оригинальному и узнаваемому
    зайдеко-электроблюзу.


    Двенадцатый альбом певца и музыканта начинается с отличного стандарта Сона Хауса
    "Walking Blues", переделанного Ландретом на свой манер. Далее - заглавный трек
    собственного сочинения- ода великим именам в блюзе.Третим идет The High Side -полуакустический
    трек среднего темпа, очень авторский, фаны первых альбомов артиста его обязательно
    должны оценить . It Hurts Me Too знавал исполнителей и получше Ландрета, но и
    Сонни песню не испортил (а если испортил, то - не сильно), а своим фирменным слайдом
    даже кое-что добавил-подправил. Where They Will - поп-лирика Ландрета, музыка
    для девочек и для промоутеров альбома, что-то вроде клона Blue Tarp Blues, но
    без Нопфлера.


    Некоторой вторичностью дышит и Cherry Ball Blues, что не умаляет радости от новой
    встречи со старыми исполнительскими приемами артиста, полюбившимися ранее. Инструментальный
    квадрат Firebird Blues, посвященный Джонни Уинтеру, демонстрирует профессиональное
    умение всего трио: Ландрета, барабанщика на картонных коробках Брайана Бригнака
    (Brian Brignac) и басиста на бас-укелеле Дэвида Рэнсона ( David Ranson)


    Стандарты Роберта Джонсона Dust My Broom и Билла Брунзи Key To The Highway Сонни
    с товарищами исполняет также с душой, на высоком идейно-художественном уровне,
    творчески переосмыслив и внеся свой оригинальный вклад в развитие песен, упрекнуть
    некого и не в чем. Венчает труд инструментальный шаффл Simcoe Street , пример
    трека, который можно вставить и в начало, и в конец, и в середину альбома - везде
    будет к месту.'
- id: 2213
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2015-07-20'
  text: 'Долгожданный новый студийник от знаменитого слайдера - первый студийный альбом
    за 3 года, первый блюзовый диск с выпуска From the Reach 2008 и первый в формате
    power trio с записи The Road We''re on 2003. Сонни - один из лучших слайдеров
    жанра (а может, и самый лучший), признанный критиками, публикой и коллегами-музыкантами,
    вернулся к корням и вместе со своей проверенной за долгие годы ритм-секцией записал
    альбом в стиле, который собственно и породил слайд.


    На диске половина каверов блюзовой классики - песни, которые в свое время оказали
    сильное влияние на становление молодого музыканта (Walking Blues Роберта Джонсона,
    It Hurts Me Too Элмор Джеймса, Cherry Ball Blues Скип Джеймса, Key to the Highway
    Билла Брунзи, Dust My Broom Роберта Джонсона/Элмор Джеймса), половина - собственного
    материала (включая два инструментала, один из которых посвящен памяти его коллеги
    и друга Джонни Уинтера и сделан в манере Джонни). Отдавая должное Сонни, его интерпретация
    блюзовых стандартов, которые за долгие годы были переиграны уже несметное число
    раз всевозможными исполнителями, достаточно оригинальна и интересна (кроме, пожалуй,
    It Hurts me too, которая мне не очень показалась). Собственный материал хорошего
    качества, но маловато его, хотелось бы побольше. Особенно понравился заглавный
    трек. Говорить о технике исполнения смысла нет - игра Ландрета уникальна, играет
    Мастер, и этим все сказано.


    Очень приличная работа от уникального музыканта, которая точно найдет своего слушателя,
    но не станет особенно популярной в силу относительно малого количества авторского
    материала.


    "The blues has been a big part of my journey for the past 40-plus years. "Some
    of the numbers on this album are among the first I learned. I wrote ‘Where They
    Will'' about my relationship to blues - letting the music lead me to new sounds
    and improvisational passages, and introduce me to things I haven''t played before."
    Sonny Landreth'
