- id: 1793
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-27'
  text: 'Сонни Лэндрет - гитарист, певец и композитор из Луизианы, обладающий уникальной техникой игры на слайд-гитаре: параллельно
    с традиционным для слайдистов звукоизвлечением он одновременно еще "бегает" пальцами по грифу в традиционной для рок-гитаристов
    манере.


    Первые сольные альбомы он выпустил на маленьких фирмах в 1981 и 1985 году, и по итогам второго альбома его пригласили
    выступать с Джоном Хайэттом. Затем он кратко сотрудничал с Джоном Мэйоллом, Лесли Уэстом и др. знаменитыми персонажами.


    С начала 90-х Лэндрет начинает выпускать сольные альбомы более регулярно, хотя зачастую промежуток между ними оказывается
    довольно большим. Тем не менее все сходятся во мнении, что музыкальный материал этих дисков становится все лучше и лучше,
    и поэтому такое ожидание вполне оправдано.


    На своем первом сольнике на крупной фирме Сонни продемонстрировал не только свое великолепное мастерство владения слайд-гитарой,
    но и таланты композитора (все песни написаны им самим)) и певца. На альбоме звучит прекрасно сыгранный коммерческий коктейль
    мелодичного луизианского блюза, южного буги, поп-рока и блюз-рока с изрядной примесью кантри. Очень мелодичная и элегантная
    работа - достойный дебют будущего Мастера


    Сам Сонни играет на всевозможных гитарах и поет под аккомпанемент слаженной ритм-секции. В качестве гостей на альбоме
    отметились такие небезызвестные в мире американского блюза личности, как:


    Steve Conn - Organ, Piano, Accordion, Organ (Hammond)


    John Hiatt - Guitar (Acoustic), Guitar (Rhythm), Vocals (bckgr)


    Sue Medley и Marce Lacouture - Vocals (bckgr)


    Продюсировали Р.С. Филд и Сонни Лэндрет.'
