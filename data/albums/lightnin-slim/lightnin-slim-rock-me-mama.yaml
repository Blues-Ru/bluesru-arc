  date: '2015-03-13'
  text: '13 марта в 1913 году (102 г. назад) на ферме недалеко от Сент-Луиса, Миссури,
    родился Отис Хикс, ставший в блюзе Лайтнин Слимом (LIGHTNIN'' SLIM). Хриплый голос,
    хриплая электрогитара - он абсолютно органичен в безыскусном блюзе. Критике ставят
    его в один ряд с великими - Muddy Waters, Little Walter, Howlin'' Wolf и Sonny
    Boy Williamson. И неспроста. На этом диске собраны самые первые записи.


    В возрасте 13 лет(опять это число! А сегодня еще пятница 13е - точно своеобразный
    юбилей) переехал в Батон Руж, Луизиана. Старший брат, Layfield, обучал его игре
    на гитаре, а в конце 40х Slim уже самостоятельно стал играть по местным клубам.
    Дебютная пластинка вышла в 1954 году на лэйбле Feature Records - "Bad Luck Blues"
    ("If it wasn''t for bad luck, I wouldn''t have no luck at all") Угадайте кто позже
    свистнул эту фразу в свою ставшую известной, песню. Но как круто песня продолжается:


    "Folks, I was born in the last month of the year, in the last week of the month,
    in the last day of the week, in the last hour in the day, in the last minute of
    the hour, in the last second in the minute. And to tell you the truth about it,
    I was lucky to get here at all"


    Кстати еще одна фраза Lightnin'' Slim''а стала весьма популярной в блюзе - "blow
    your harmonica, son".


    Слушая как играет Lighnin Slim, сразу вспоминается Lightnin Hopkins. Глубокий
    бас-баритон, придающий драматизм его ленивому пению - вот та причина, по которой
    в Батон Руж его знали как Lightnin'' задолго до первой записи.


    Следующие 12 лет записывался для Excello Records и часто в компании шурина Slim
    Harpo и харпера Lazy Lester. В 60х жил и работал в Детройте. Забытый, был найден
    Fred Reif''ом в городе Pontiac, где жил в доме сестры Slim Harpo. Reif устроил
    ему выступления и помог подписать новый контракт с Excello. Первым выступлением
    стал концерт 1971 года University of Chicago Folk Festival вместе с Lazy Lester,
    которого Reif привез из Baton Rouge в январе 1971 года. Вторая волна славы пришла
    с гастролями в Европу, где на губной гармонике с ним играл Moses "Whispering"
    Smith, да и в Америке фестивалей хватало. После того как Harpo неожиданно умер
    в 1970 году, Lightnin продолжил свой путь один, время от времени записываясь и
    выступая в составе American Blues Legends


    Slim умер в июле 1974 года от рака желудка.


    Lightnin'' Slim со своим мощным, выразительно-шершавым вокалом и узнаваемым мрачноватым
    стилем стал неотъемлемой частью истории блюза и Луизианы в частности.


