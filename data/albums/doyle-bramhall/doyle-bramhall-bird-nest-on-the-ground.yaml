- id: 1562
  author: Константин Колесниченко
  mark: 7
  date: '2009-07-08'
  text: Подборка записей 80-х – начала 90-х знаменитого техасского барабанщика и автора песен. Известен Doyle прежде всего
    сотрудничеством со Stevie Ray Vaughan. Bramhall успел переиграть со всеми звездами техасского блюза того времени от Zuzu
    Bolin до братьев Vaughan, Smokin' Joe Kubek и т.д, что, в принципе, удачно демонстрирует данная подборка (кстати, сделанная
    при участии его звездных товарищей). Блюз-рок, техасский свинг, соул-блюз - у каждого, с кем сотрудничал Bramhall, он
    брал уроки. А еще успел вырастить сына – известного гитариста, который кстати играет в нескольких композициях на записях
    отца.
