- id: 262
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Поклонники молодой блюзовой звезды покупают эту пластинку, думая, что это свежая работа Lang. На самом же деле "Smokin''"
    - первый альбом гитариста, вышедший еще в 95-м году, а сейчас выпущенный с новой обложкой. Причем хитрющие продюсеры даже
    не удосужились указать на ней настоящий год выхода альбома, датировав его 2002 годом. Впрочем, пусть этот маленький, а
    может, и большой обман останется на их совести - на качестве записанного материала это никак не отразилось. Кстати, именно
    "Smokin''" открыл юному дарованию дорогу на большую сцену. В 95-м этот альбом, выпущенный маленьким независимым лейблом
    Oarfin, разошелся удивительно большим тиражом - 25 тысяч экземпляров, что не осталось незамеченным крупными компаниями.
    Быстрее всех отреагировала A&M Records и не прогадала - второй альбом Lang, "Lie To Me", имел феноменальный успех.


    Непосредственно же о "Smokin''" могу сказать следующее - пластинка очень приличная. Поверить в то, что ее записывал 14-летний
    юнец, практически невозможно. Не исключаю, что не последнюю роль в успехе этой работы сыграли участники Big Bang - самого
    первого состава Lang, с которым он, собственно, и стал известен широкой блюзовой общественности, переехав в свое время
    в Северную Дакоту.'
