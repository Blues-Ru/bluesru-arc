  author: Александр Мальчевский
  mark: 8
  date: '2003-12-01'
  text: 'Альбом этот лежал на полке с лета. Руки до него клинически не доходили. А он лежал и ждал. Так спокойно себе лежал.
    Сегодня руки дошли.


    Steve Riley - это новый кейжун. Для тех, кто не в курсе: кейжун это разновидность Луизианской музыки, только исполняемая
    белыми и на французском, причем со скрипкой вместо или с аккордеоном. Альбом по всем статьям хороший: сбалансированный,
    ровный, без явных провалов; не такой, чтобы уж прямо умереть от удивления.


    Люди на нем записанные все из одной тусовки, особливо примечателен C.J. Chenier - Sax (Alto), который вспомнил свое прошлое
    и сыграл очень красиво и грамотно.


    В принципе здесь все опять таки танцевально, но не хватает свойственного зайдеко размаха и легкости, что-то музыкантов
    сковывает, как мне показалось. Некоторые треки радуют особенно:


    Je M''En Fous Pas Mal (Greely/Riley)– мощное начало пластинки;


    La Toussaint (Greely/Schwarz) – грустная вещь, но красивая;


    La Valse d''Amitiй (Guidry) – элегантный вальс


    New Orleans Beat (Chenier) – жемчужина альбома: сакс, аккордеон и скрипка устраивают нечто совершенно фантастическое.
    А Шенье-младший просто великолепен.


    Entre l''Amour et l''Avenir (Domengeaux/Greely) - очень красиво и очень трогательно, блестящее соло на скрипке, аж на
    слезу пробивает...


    Радует: Все красиво, самобытно и традиционно


    Огорчает: Как обычно некоторая однообразность (для зайдеко и кейжун в классическом варианте – это клиника).


    В целом: Все хорошо, все приятно. 4 бала.'
