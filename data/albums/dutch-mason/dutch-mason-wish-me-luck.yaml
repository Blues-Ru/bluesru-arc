    Приятный набор каверов в своих аранжировках. Здесь все песни известные и классные:
    "It''s Your Thing" (Isley Brothers), "Ain''t Nobody''s Business", "Dust My Broom",
    "Going Down", "Goin'' To Chicago", "Polk Salad Annie", "Barefootin''" (Robert
    Parker), "Going Down Slow". Группа Мэйсона отлично играет, гармонист Рик Джеффрри
    просто умница, духовая секция тоже тут. Обработки в духе различных стилей ритм-н-блюза,
    а что-то совсем в классическом блюзовом ключе.'
