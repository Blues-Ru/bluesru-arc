  text: '<img src="http://www.ljplus.ru/img/d/r/dr_nick/Dutch-Mason-1976.jpg" width=200 height=200 alt=''9,53 КБ''>


    Датч Мэйсон - певец и гитарист из Канады. С ним его группа из пяти человек и два духовика. На этом альбоме они исполняют
    известные всем блюзовые песни в своих аранжировках. Аранжировки ближе к блюз-соул-року, а песни такие: "Pawnbroker", "Diddly
    Diddly Daddy", "The Thrill Is Gone", "Get Outa My Life Woman", "Move Up To The Country", "I''m Ready", "Hard Times", "Baby
    Please Don''t Go", "Walkin'' Blues".


    Хорошие музыканты и интересные аранжировки. А вот голос самого Мэйсона можен понравится и не всем, слишком уж он неестесственный
    в некоторых песнях. И все же, это интересный диск, да еще с канадскими музыкантами.'
