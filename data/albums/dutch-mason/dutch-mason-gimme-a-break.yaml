  author: Дмитрий Казанцев
  mark: 7
  date: '2006-01-09'
  text: 'На этом диске Датч отказался от имени Блюз Бэнд, но зато здесь появились
    свои песни. 2 песни написал сам Мэйсон, одну - гармонист Рик Джеффри и 3 - клавишник
    Джон Ли. Среди каверов тут есть "Trouble No More", "That''s Life", "I Got A Woman
    (Mean As She Can Be)", "Go Down Gamblin" (Blood, Sweat & Tears).


    Первая песня на диске в духе кантри-рока, есть здесь и блюз-рок, и ритм-н-блюз.
    В целом, очень симпатичная музыка и исполнение.'
