- id: 46
  author: Алексей Калачев
  mark: 7
  date: '2002-11-26'
  text: Трудно судить, насколько Тейлору удалось подойти к собственному звуку. Дело в том, что 5 его предыдущих альбомов слишком
    разные именно в этом смысле – в смысле звука. Достаточно вспомнить "Bang That Bell" 2000 года с его безудержным фанком,
    "квакушками" и т.д. или работу 1997 с явной "симпатией" к SRV. Этот альбом наиболее черный – расслабленный, вязкий и одновременно
    чудесно засвингованный, что достигается тремя составляющими – "хаммондом" с Лаки Петерсоном за ним, во-вторых, приторможенным
    темпом (без залихватского "Rock It!!!")  и общим минорным настроем диска. Тайлор и второй гитарист Мато Нанжи делают диск,
    безусловно, добротно гитарным, в то же время "Rendezvous With the Blues" миновал участи просто "ещё одного блюзрокового
    сидюка", которые можно загребать на Горбушке лопатой.
- id: 1913
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-06-30'
  text: 'Шестой сольный альбом чикагского виртуоза записан с помощью Лаки Петерсона (клавиши, да плюс гитара на треке 4) и
    гитариста Indigenous Мато Нанджи (треки 1 и 5). Трек 4 также украшен присутствием духовой секции.


    Альбом состоит из каверов, некоторые из которых в интерпретиции Мелвина довольно далеки от оригинала (например, классика
    Сонни Боя Уиллимсона Help Me или Black Queen Стивена Стиллса, которую Мелвин превратил в блюз-роковый стомп). Есть и пара
    инструменталов, причем в Eclipse Эрика Гейлса Мелвин звучит как Уэс Монтгомери (кстати, по словам самого Тэйлора, на него
    оказало особое влияние творчество Монтгомери и Хэндрикса). Цитируя самого Тэйлора, он до этого в основном играл в мажоре,
    пока не столкнулся с заинтересовавшей его минорной песней. В результате бОльшая часть треков данного альбома - именно
    минорные.


    Техника исполнения музыкантов по-прежнему на высоте, но временами кажется, что Тэйлору "тесновато" в рамках стандартных
    аранжировок, и его визитная карточка - скоростные импровизационные соло - проявляется не слишком часто. В целом альбом
    оставляет такое же впечатление, что и предыдущий Bang That Bell: он в общем-то неплох, местами даже очень хорош, но определенно
    не лучший для такого мастера, каким является Мелвин Тэйлор.'
