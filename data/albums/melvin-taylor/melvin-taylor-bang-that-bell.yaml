  text: '"Taylor''s arsenal consists of blinding speed, a feverish wah-wah pedal, a range of tones that leaps from groans
    to squeals, and notes bent so dramatically that his guitar sounds like it''s retching. Taylor succeeds because he''s a
    virtuoso who pushes the limits of his own skills."


    -Living Blues Magazine


    Данный альбом Мелвина довольно далек от традиционного блюза, представляя собой смесь блюз-рока, фанка, джаза и даже рока
    на блюзовой основе. В обычной для себя манере Тэйлор смело переходит стилевые границы, выбирая свой собственный нехоженный
    путь в музыке. Отталкиваясь от классического блюзового наследия середины прошлого века, Мелвин идет вперед, используя
    достижения сегоднешнего дня, создавая свою музыку для поколения двадцать первого века.


    В качестве гостей отметились харпер Sugar Blue и Eric Gales - каждый на паре треков.


    Несмотря на традиционное высокое мастерство исполнения, мне кажется, чикагский виртуоз на данном альбоме в некоторой степени
    утратил часть своей индивидуальности, которая явно проявлялась на его ранних пластинках.'
