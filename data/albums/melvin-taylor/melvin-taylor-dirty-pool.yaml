  date: '2011-06-08'
  text: '"One of the most exhilarating blues guitarists to emerge in the past decade is more a blues innovator than a purist,
    mixing jazz chords and rock influences into his tapestry of electric blues."


    -Rolling Stone Magazine


    "A volcanic guitarist! The sort of virtuosity that drags an audience into a world of risks and chances and excitement."


    -The New York Times


    Четвертый сольник блюзового виртуоза был записан с 11 по 14 декабря 1996 года, включает в себя девять каверов и носит
    на себе отпечаток творчества Стиви Рэя - такое своего рода посвящение от одного блюзового мастера в честь другого. Аккомпанирует
    Мэлвину его энергичная ритм-секция Slack Band (Итан Фарнер на басу и ударник Джеймс Ноулс), все гитарные партии и вокал
    записаны Тэйлором.


    Проблема Тэйлора заключается в отсутствии авторского материала - по его собственным словам, он "слишком ленив", чтобы
    писать свои собственные песни. В результате он автоматически подпадает под сравнение с автором исполняемой им песни, а
    переплюнуть канонических блюзовых исполнителей практически невозможно. Тем не менее как исполнитель, интерпретатор и аранжировщик
    Мелвин очень хорош, виртуозов такого уровня можно сосчитать по пальцам.


    Альбом одновременно и высокотехничный, и - я бы сказал - более доступный, что делает его одним из лучших среди работ чикагского
    мастера. Легкость и изящество в подаче материала наглядно свидетельствуют о классе музыканта.'
