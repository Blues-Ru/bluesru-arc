  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-08'
  text: 'Мелвин Тэйлор - гитарист-самоучка из Чикаго, который освоил блюзовую гитару
    и слайд-гитару по пластинкам ББ Кинга, Алберта Кинга и Джими Хэндрикса. Его считали,
    возможно, наиболее талантливым новым гитаристом, появившимся после Стиви Рэя.
    Так это или нет, каждый может решить сам, но то, что Мелвин - талантище, это бесспорно.


    Когда в начале 80-х Пинетоп Перкинс искал гитариста в свою группу для нескольких
    гастролей в Европе, его взгляд упал на молодого Тэйлора. В итоге Тэйлор отыграл
    с Legendary Blues Band целый год и произвел такой фурор в Европе, что некоторые
    клубы заочно пригласили его вновь выступить уже с его собственной группой.


    Музыка Тэйлора объединяет блюзовые и джазовые стили, он прекрасно использует динамику
    и обладает фантастической техникой, напоминая временами великого Ронни Эрла. Однако,
    в отличие от Эрла, у Мелвина блюз все же находится на первом месте, и, кроме того,
    он еще и поет.


    Это второй сольник Мелвина, записанный 21 марта 1984 года в Париже. На этой записи
    ему помогает другое молодое блюзовое дарование - Lucky Peterson, играющий на органе
    и пианино. За ударной установкой - Рэй Аллисон.'
