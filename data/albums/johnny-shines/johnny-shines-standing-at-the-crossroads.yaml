reviews:
- id: 672
  author: Александр Панин
  mark: 9
  date: '2005-05-24'
  text: Во второй половине шестидесятых Джонни выпустил несколько электрических альбомов с разным составом музыкантов, но
    с начала семидесятых переключился обратно на сольную акустику. Этот материал был записан в ноябре 1970 года и вскоре вышел
    на лейбле Testament. На компакте к оригинальным одиннадцати трекам добавлено пять бонусов, что составляет в итоге без
    пяти минут час превосходной музыки! Отличный слайд и глубокий дельта-блюз. В 1935-1937 годах Шайнc постоянно играл с Робертом
    Джонсоном, и через тридцать с лишним лет приобретенные тогда навыки оказались в полной мере востребованы. Recommended.
- id: 1330
  author: Сергей Исправников
  mark: null
  date: '2008-09-21'
  text: 'На диске представлен третий альбом Джонни Шайнса, из записанных им для независимого блюзового лейбла Testament. В
    отличие от его предыдущих работ, где Шайнс представлен в формате послевоенного электрифицированного блюза, здесь он обратился
    к музыке, с которой начинал, - акустическому дельта-блюзу. Родившийся в 1915 г. в штате Теннеси, Шайнс начал играть на
    гитаре лет в 16-17, скоро став выступать профессионально в Мемфисе и его окрестностях. Первоначально его кумиром был Хаулин
    Вулф, на одном из выступлений которого он набрался смелости и взял его гитару, сыграв несколько вещей перед публикой.
    Впоследствии судьба свела его с Робертом Джонсоном, с которым они пару лет вместе играли и путешествовали по Америке,
    добравшись даже до Канады. Записанные на данный альбом пьесы являются либо классическими блюзами Дельты, либо авторскими
    интерпретациями Шайнса традиционных тем. В своей музыке Шайнс органично сочетает подходы к исполнению Роберта Джонсона
    (характерными примерами которого являются записанные здесь "Standing at the Crossroads" и "Kind Hearted Woman") и Сона
    Хауза ("It''s A Lowdown Dirty Shame" и "Dearth Letter Blues", соответственно). В исполнении Шайнса очень велик уровень
    взаимодействия голоса и гитары. Последняя здесь не является аккомпанирующим инструментом, а выступает на равных, выражая
    всю эмоциональную палитру блюза.


    Альбом был красноречиво озаглавлен "Стоя на перекрестке", где по одной из широко известных блюзовых легенд можно было
    продать душу дьяволу. Но в отличие от того же Роберта Джонсона, жизнь которого была полна женщинами и алкоголем, а смерть
    до сих пор остается загадкой (то ли его отравил один из обманутых им мужей, то ли дьявол потребовал себе его проданную
    душу, что не исключает одно другого), Шайнс был добропорядочным, семейным и религиозным человеком. В 40-60-х гг. он жил
    и выступал, в основном, в Чикаго. В 1969-м гастролировал в Европе. Однако когда вскоре после этого внезапно умирает его
    дочь, оставив внуков, Шайнс решает собрать семью и переехать на Юг. Они обосновались в Таскалузе, штат Алабама, где Шайнс
    стал давать уроки гитары, воспитав немало учеников. Во время визита в Калифорнию в конце 1970 г. он за два дня – 11 и
    17 ноября – записал данный альбом, являющийся отличным образцом Дельта-блюза. Остается добавить, что при переиздании его
    на компакт-диске, к оригинальному материалу было добавлено еще пять записанных тогда же треков. Альбом по праву считается
    одним из лучших в дискографии Шайнса, демонстрируя высочайший уровень владения слайд-гитарой и аутентичность исполнения.'
