- id: 1382
  author: Сергей Исправников
  mark: 8
  date: '2008-12-14'
  text: 'На диске представлена дебютная долгоиграющая пластинка гитариста Джонни Шайнса,
    записанная в Чикаго в июне 1966 г. К этому времени Шайнсу исполнился 51 год и
    он был достаточно известной фигурой в среде чикагского блюза. Начав записываться
    на синглах с середины 40-х гг., к концу 50-х из-за изменения музыкальной моды
    он перестал выступать, начав работать рабочим, а потом бригадиром на стройке.
    Кроме того, он часто подрабатывал внештатным фотографом. В конечном итоге, когда
    он снимал выступление Хаулин Вулфа в одном из чикагских клубов в 1965 г., о нем
    наконец вспомнили, как о незаурядном слайд-гитаристе, что позволило Шайнсу вернуться
    на сцену. Данную пластинку продюссировал известный блюзовый обозреватель Pete
    Welding, который и выпустил ее в 1967 г. на принадлежащем ему независимом лейбле
    Testament в серии "Мастера современного блюза". Вслед за Шайнсом в рамках этого
    проекта были изданы такие легендарные исполнители, как J.B.Hutto, Floyd Jones,
    Robert Nighthawk.


    Музыка Шайнса брала начало в среде традиционного блюза Дельты Миссисипи, по существу,
    он продолжал традиции Роберта Джонсона. Диск как раз представляет собой сочетание
    электрического блюза послевоенного Чикаго с более архаичной музыкой. Шайнс стремился
    электрифицировать блюз Дельты, придать ему более мощное, более современное звучание.
    Десять вошедших в альбом треков являются либо авторскими вещами Шайнса, либо интерпретациями
    традиционных тем. Среди последних стоит отметить "Sweet Home Chicago" и "Walkin''
    Blues", исполнявшиеся еще Робертом Джонсоном. На записи Шайнсу аккомпанировали
    не нуждавшиеся в представлении звезды чикагского блюза: Big Walter Horton (губная
    гармоника), Otis Spann (фортепьяно), Lee Jackson (бас) и Fred Below (ударные).
    Партии Спэнна и Хортона просто роскошны в "Trouble Is All I See", а бас Джексона
    особенно выделяется в меланхоличной "Mr. Tom Green''s Farm". Что касается Fred
    Below, то он лишний раз подтвердил здесь репутацию лучшего ударника чикагского
    блюза 50-60х гг. В целом, альбом не содержал в себе каких-то музыкальных новаций,
    являя собой образец традиционного послевоенного блюза. Звучание диска достаточно
    архаично для 1966 г., кажется, что он был записан на десять лет раньше, как будто
    Шайнс так и не покидал сцену.'
