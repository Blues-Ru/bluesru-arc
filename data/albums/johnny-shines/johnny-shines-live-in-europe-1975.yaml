- id: 627
  author: Александр Панин
  mark: 4
  date: '2005-05-20'
  text: Зимой 1975 года корневого блюзмена, мастера слайда и соратника Роберта Джонсона занесло в совсем неблюзовую Вену,
    где он дал несколько концертов в местном клубе Jazzland. Ряд записей с тех концертов попали на этот недавно выпущенный
    документовский диск. Список сыгранных вещей сражает наповал - кроме нескольких обязательных песен Джонсона и своих номеров
    Шайнс исполняет такие композиции, как Stormy Monday, Got My Mojo Working, Roll And Tumble Blues, St.Louis Blues, Shake
    Your Moneymaker! Все выглядит очень заманчиво, но... качество записи ниже всякой критики. Натуральный бутлег. Слушать
    местами просто невозможно. На высоком уровне только оформление - к диску прилагается буклет с отличными фотографиями и
    интересной статьей.
