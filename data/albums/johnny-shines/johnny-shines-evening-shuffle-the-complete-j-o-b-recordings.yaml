- id: 1387
  author: Сергей Исправников
  mark: 9
  date: '2008-12-25'
  text: 'На диске собраны ранние записи гитариста Джонни Шайнса, записанные на чикагском лейбле J.O.B. в 1952-53 гг. Оказавшись
    в Чикаго в сентябре 1941 г. Шайнс включился в музыкальную жизнь Города Ветров, возобновив контакты с пианистами Roosevelt
    Sykes и Memphis Slim, с которыми он был знаком еще на Юге. Шайнс был одним из первых переехавших в Чикаго мастеров дельта-блюза,
    начавших играть в электричестве, с которыми стали сотрудничать фирмы грамзаписи. Предложение записать сингл к нему поступило
    еще в 1945 г., а в феврале следующего года он впервые оказался в студии. Впрочем ни один из четырех треков, записанных
    тогда для лейбла Columbia, не был издан. Свой первый сингл Шайнс сумел записать только в октябре 1950 г. на легендарной
    фирме Chess, однако продолжения сотрудничества не последовало. Еще через полтора года, когда Шайнс стоял на улице в компании
    других блюзменов, к нему подошел хозяин лейбла J.O.B. Джо Браун и предложил записаться у него. Причин для отказа у Шайнса
    не было, и 28 апреля 1952 г. он записал в студии четыре трека, два из которых были переработками блюзов Роберта Джонсона,
    а два других – авторскими вещами Шайнса. Шайнс играл слайдом на усиленной акустической гитаре, ритм-секцию составили Moody
    Jones (бас) и Alfred Wallace (ударные). Времени на репетиции и аранжировку не было, по словам самого Шайнса, он начал
    петь первое, что пришло в голову. В результате две вещи – "Ramblin''" (вариант "Walking Blues" Джонсона) и "Cool Driver"
    – были изданы на сингле. Несмотря на спонтанность записи и некоторые огрехи в работе звукооператора, эта сессия наглядно
    продемонстрировала как виртуозную технику слайда, так и выразительный вокал Шайнса.


    В начале следующего года Шайнс еще дважды записывался для J.O.B. Сначала в январе с группой пианиста Саннилэнд Слима он
    выступил как вокалист. Записанные в ритм-энд-блюзовом ключе с фортепьяно и саксофоном два вещи Шайнса – "Livin'' in The
    White House" и "Please Don''t" – в то время остались неизданными. Вскоре после этого последовала сессия со знаменитым
    исполнителем на губной гармонике Уолтером Хортоном. Из четырех записанных тогда треков изданы были только два – шаффл
    "Evening Sun" и блистательная баллада "Brutal Hearted Woman". Эта сессия являла пример чикагского блюза, сыгранного двумя
    виртуозами, не как копирования музыки Дельты, а именно авторского подхода к исполнению. К сожалению, особого коммерческого
    успеха данный сингл, также как и его предшественник, не имел, поэтому больше записей не последовало. Некоторое время Шайнс
    еще продолжал давать живые выступления, а затем на семь-восемь лет ушел со сцены. Собранные на этом диске записи, включая
    дубли, являются иллюстрацией развития послевоенного чикагского блюза на этапе его формирования. Несмотря на ряд чисто
    технических дефектов, они представляют немалый интерес для коллекции.'
