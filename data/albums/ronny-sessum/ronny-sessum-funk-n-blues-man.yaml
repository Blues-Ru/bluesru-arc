  author: Андрей Евдокимов
  mark: 7
  date: '2010-01-18'
  text: Иногда он даже романтичен – но это чтобы перевести дух. Настоящий пир духа (и яростное источение его) наступает на
    You're A Wicked Woman Baby – фанк небессмысленный, но беспощадный. Ритм вколачивает так, что вздохнуть некогда… Бас закручивает,
    квакушка на лидер-гитаре, ударные хотят играть и глубоко и светло – отличный прогнозируемый, но высокоэнергичный бардак.
    Злобный или игривый – до корней пропах "тяжелым фанком" начала 70-х. В альбоме неизвестного артиста – 10 треков, из них
    половина – потенциальные хиты.
