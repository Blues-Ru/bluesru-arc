reviews:
- id: 902
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-11-27'
  text: У этого проекта всего один альбом. Сзади на обложке много текста, но мало
    инфы о музыкантах. И так, это проект аранжировщика Gene Page. Tom Scott играет
    на саксофонах и флейтах, он также написал две темы на диске. На гитаре Art Adams
    - очень классный музыкант. На гармошке Lightnin' Rod Piazza, он также поет единственную
    песню на альбоме (она же единственный блюз). Остальные 9 треков - довольно доступный
    соул-фанк-джаз. Почти все песни в груве. Весело, но вдумчиво. Жаль, что непонятно,
    кто играет на остальных инструментах.
