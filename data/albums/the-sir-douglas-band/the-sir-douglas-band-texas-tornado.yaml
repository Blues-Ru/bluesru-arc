- id: 474
  author: Дмитрий Казанцев
  mark: 10
  date: '2004-03-03'
  text: 'Невероятное сочетание блюза, фанка, джаза, соула и кантри! Все это из Техаса
    под простым и емким названием Текс-Мекс-музыка. Тут много известных и понятных
    людей, но особенно радует присутствие Доктора Джона на альбоме.


    11 отличных треков, все вещи разные, так что скучно не будет. Надо выделить шикарные
    San Francisco FM Blues и Blue Horizon. Каж жаль, что всей этой роскошной музыки
    нет на КД, а ведь это Atlantic Records.'
