  author: Сергей Исправников
  mark: 7
  date: '2009-03-29'
  text: 'На диске представлены записи группы британского блюзового гитариста Дейва
    Келли (ex-"John Dummer Blues Band", "Tramp"), сделанные в период 1979 – 82 гг.,
    включая выпущенный на лейбле Cool King альбом "Feels Right" (1981 г.). Основным
    проектом Келли в указанное время была блюз-роковая группа с лаконичным названием
    "Blues Band", сформированная в феврале 1979 г. Однако времена для исполнявшейся
    ей музыки были малоподходящие, как таковая британская блюзовая сцена практически
    отсутствовала, коммерческий интерес был почти на нуле, большинство музыкантов
    или уехали в США, или вовсе отошли от исполнения блюз-рока. Поэтому Келли одновременно
    сформировал параллельный состав – "Dave Kelly Band" – исполнявший AOR, основанный
    на сочетании фолк-рока, кантри и R&B. Кроме самого Келли (акустическая и слайд-гитара,
    вокал) в состав группы вошли параллельно участвующие в "Blues Band" гитарист Tom
    McGuinness и басист Gary Fletcher, а также клавишник Lou Stonebridge (ex-"Dance
    Band") и ударник Roy Morgan. Группа выступала как на разогреве у "Blues Band",
    так и самостоятельно.


    Запись альбома "Feels Right" проходила в лондонской Nova Studio в период с февраля
    по май 1980 г. На диске звучит как авторский материал участников группы, так и
    кавер-версии. Среди последних выделяются "I''m Into Something Good" из репертуара
    бит-группы 60-х "Herman''s Hermits", "The Best Part Of Breaking Up" Фила Спектора
    и фолк-роковая "You''re Gonna Make Me Lonesome When You Go" Боба Дилана. Из авторского
    материала, в первую очередь, следует отметить титульную "It Feels Right", сочиненную
    басистом группы Гарри Флетчером совместно со своей женой Хиллари и его приятелем
    Steve Gurl. Эта нежная кантри-баллада обычно исполнялась во время саундчека "Blues
    Band", а впоследствии, когда были написаны слова песни, вошла в постоянный репертуар
    "Dave Kelly Band". Самим Дейвом Келли для альбома были написаны всего две вещи
    – "Dawn Surprise" с прекрасным соло на электрическом банджо приглашенного на запись
    Keith Nelson (ex-"Rocksalt"), а также написанная в духе Бо Дидли ритм-энд-блюзовая
    "Don''tcha Hang Up The Phone". Одной из лучших вещей альбома является основанный
    на пратии слайд-гитары Келли инструментал "Red Red Wine", идея записать который
    первоначально возникла еще в группе Джона Даммера, а теперь получила свое конечное
    воплощение. В целом, альбом, также как и добавленные на диск сингловые и нереализованные
    треки, производит приятное впечатление, однако музыкантам на тот момент явно не
    хватало свежих идей – записанная музыка звучит хоть и профессионально, но стандартно,
    что-либо нового найти в ней слушателю вряд ли удастся.'
