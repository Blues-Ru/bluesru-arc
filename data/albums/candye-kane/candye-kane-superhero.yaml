- id: 1966
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-08'
  text: 'Бывшая стриптизерша и порно-звезда, крупногабаритная знойная дама Кэнди Кэйн с самого детства мечтала стать певицей.
    В начале 90-х она открыла для себя блюз, в котором не обязательно обладать модельной фигурой, а темное прошлое только
    приветствуется. Вот в этом стиле и проявила себя на редкость голосистая дама, создав свой собственный сплав сексуального
    джамп-блюза, свинга, рок-н-ролла и кабаре (с легкой добавкой китча).


    Начиная с первого сольного альбома, выпущенного в 1994 году, самая горячая белая исполнительница современного блюза неизменно
    собирает полные залы, поскольку она и ее группа Swinging Armadillos гарантируют искрометное шоу и качественную музыку.
    Кэнди сама пишет бОльшую часть песен, полных чувственных намеков и своебразного юмора. Она щедро делится своей энергетикой,
    радуясь жизни и поднимая настроение слешателям.


    За свою карьеру Кэнди собрала неплохой список различных наград и номинаций (хотя некоторые из них довольно специфические):


    1994 Best Blues Band/ San Diego Music Awards (SDMA) 1995 Best Blues Band/ SDMA 1996 Best Cabaret Swing Artist/ California
    Music Awards 1996 Best Blues Band/ SDMA 1997 Best Blues Band/ SDMA 1998 Artist Of The Year/ SDMA 1999 Best Blues Band/
    SDMA 1999 Buzz Magazine Award/ One of L.A.''s 100 coolest people 2000 Best Entertainer/ San Diego Nicky Awards 2001 Nomination
    Best OUT Song/ Gay Lesbian American Music Awards/ NYC 2001 Best Blues Band/ SDMA 2002 Nomination Best OUT Song/ Gay Lesbian
    American Music Awards 2005 Blues CD of the Year/ SDMA 2005 Sexual Intelligence Award/ Marty Klein/ Sex Institute 2006
    Nomination/ SDMA/ Best Blues Band 2007 Nomination/ National Blues Foundation Award / Best Contemporary Blues Female 2007
    National Songwriter award - My own worst enemy. Best blues composition 2007 Rainbow award/ Best Bisexual musician 2008
    Billboard song contest/ Honorable mention - Top 1500. 2008 Nomination/ National Blues Foundation Awards/ Best Contemporary
    Blues Female 2009 Nomination/ OUT Music Award/ CD of the year 2009 Billboard Top Ten blues charts/ #10 debut / August
    10, 2009 2009 Nomination/ Best Blues Release/ San Diego Music Awards


    Альбом 2009 года Кэнди записала по итогам победы над раковым заболеванием, и диск получился не просто жизнерадостным,
    как ее предыдущие работы, но более глубоким и чувственным. Рекомендую обратить внимание на кавер песни Уилли Диксона You
    Need Love :-)'
