- id: 1229
  author: Андрей Евдокимов
  mark: 7
  date: '2008-03-22'
  text: 'Самая горячая из белых дам на сегодняшней блюзовой сцене: бешенная энергетика
    помноженная на причудливое китчевое чувство юмора. Увы, именно энергии и не хватает
    большинству треков ее нового альбома. Хотя есть и приятные исключения. "Вся в
    перьях и гитарах" - так можно перевести название. На запись дама пригласила гитаристов
    и гитаристок, чьи имена говорят сами за себя: Джуниор Ватсон, Сью Фолей, Кид Рамос,
    Энн Попович, Попа Чабби и даже нелюдимый Боб Брозман (обычно избегающий всяких
    приглашений). А Боб Марголин не только сыграл на большинстве треков, но и стал
    продюсером этого парада гитаристов-виртуозов под предводительством знойной дамы
    в перьях.'
