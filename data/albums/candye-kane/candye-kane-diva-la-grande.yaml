- id: 1441
  author: Андрей Евдокимов
  mark: 5
  date: '2009-02-05'
  text: Бывшая порно-звезда и гордая обладательница рекордно большого бюста с удивительной
    настырностью продолжает петь блюз. Все ждали, когда ей надоест играть, но вот
    уже 12 лет, как она записывает диски. Трудно поверить в ее искренность тем, кто
    верит в блюз от Лайтнинга Хопкинса и обоих Санни Бой Уилльямсонов. К тому же,
    в блюзовом мире непопулярен феминизм и наличие песни с названием "Если бы бог
    был женщиной" уже достаточный повод не слушать весь альбом. Как ни удивительно,
    но из всех своих блюзовых недостатков гражданка Кейн выстраивает цельный образ
    и собственный стиль. Ее концерты не оставляют равнодушных, а диски... Диски не
    испортят настроение. Знатоки английского сексуального сленга оценят название "All
    You Can Eat (And You Can Eat It All Night Long)". А чувство юмора исполнительницы
    прекрасно вписывается в качественный подновленный джамп-блюз.
