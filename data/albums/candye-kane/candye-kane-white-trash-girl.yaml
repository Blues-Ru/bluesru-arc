- id: 1965
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-08'
  text: 'Данный альбом является седьмым сольником, который самая знойная дама современного блюза записала в конце 2004 года
    с помощью знаменитого Марка КазАнова, известного также по прозвищу "Каз". Он выступил в качестве продюсера, аранжировщика
    (вместе с самой Кэнди) и руководителя духовой группы Texas Horns. Своим гостевым присутствием альбом украсил также мастер
    губной гармоники Гэри Примич.


    Кэнди авляется автором 9 из 14 треков (единолично или в соавторстве). Стилистически альбом довольно разноплановый: от
    заводного энергичного блюз-рока заглавного трека через джамп-блюз и свинг до финального годспела с минимальным сопровождением.
    На мой взгляд, быстрые напористые треки удаются Кэнди заметно лучше, чем медленные, хотя с такой командой профессионалов
    откровенно слабых песен на диске и быть не может. Правда, мне не очень понравилась творчески переработанная Daydream Джона
    Себастиана из Lovin'' Spoonfu, получившая новое расширенное названиеl What a Day for a Daydream - ну так я к оригиналу
    привык. В целом - хороший энергичный диск современного блюза - и в музыкальном плане, и в вокальном.'
