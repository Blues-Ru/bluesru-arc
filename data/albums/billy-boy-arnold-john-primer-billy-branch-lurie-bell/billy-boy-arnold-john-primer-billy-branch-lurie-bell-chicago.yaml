- id: 1587
  author: Андрей Евдокимов
  mark: 8
  date: '2009-11-12'
  text: 'Гордость и печаль: дайджест чикагского блюза от добродушной педофилии довоенного Санни Боя Уилльямсона ("Моя машинка")
    до обреченности 90-х Джона Ли Хукера и Бадди Гая ("Да, черт побери, без блюза я никак")… На обложку вынесено четыре имени,
    но на деле играет ансамбль "All Stars". Джонни Игуана, чье имя замечено лишь в списке аккомпаниаторов, легко играет на
    фортепиано без четкой сетки четырех четвертей. Кенни Смит (сын барабанщика блюзбэнда Мадди Уотерса), может "шелестеть"
    щеточками по стиральной доске, а может и отбивать тяжелый грув в электрическом блюзбэнде. Намеренно или случайно, но двухдисковая
    антология чикагских стандартов демонстрирует путь от вольного города мастеров к промышленному и финансовому центру, который
    проделал Чикаго в прошлом веке. Солисты этого альбома были очевидцами событий и их "Живая история" достоверна, увлекательна
    и искренняя. Такой альбом нельзя пропустить.'
