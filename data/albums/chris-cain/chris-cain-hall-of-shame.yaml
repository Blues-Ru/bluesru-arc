reviews:
- id: 219
  author: Алексей Калачев
  mark: 7
  date: '2003-09-18'
  text: Меня всегда приводила в замешательство противоречивость музыкального феномена Кейна. С одной стороны, он исключительно
    талантлив, с другой, настолько схож с Би Би Кингом (звучание в целом), что почти сразу теряешь интерес. На этот раз я
    слушал песню за песней, ожидая в каждом номере уже известного мне по прошлым релизам разочарования, но оно не приходило.
    Ай да Крис, ай да сукин сын! Что же это за диск? В основе его "блюз Мемфиса", то есть на грани блюза и соула, с мягким,
    словно приглушенным звуком. Другая составная – гитара. Это словно "гитара-джазмена,-который-вдруг-решил-поиграть-блюз".
    Пусть голосом Кейн по-прежнему напоминал Кинга. В данном случае это был джаз-блюз самого Криса, а не "талантливого музыканта,
    похожего на Би Би".
