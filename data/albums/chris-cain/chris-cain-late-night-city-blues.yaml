- id: 1938
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-07-06'
  text: 'Гитарист и певец из Калифорнии Крис Кэйн записал дебютный альбом со своей группой в 1987 году, причем альбом был
    настолько хорошо встречен критиками, что оказался номинирован на блюзовую премию W.C. Handy аж в четырех категориях, включая
    номинации на лучшую блюзовую группу года и блюзового гитариста года.


    Гитарная игра Кэйна определенно опирается на наследие Би Би Кинга и Альберта Кинга, а его низкий баритон оттеняется игрой
    "штатного" саксофониста, усиленного приглашенной духовой секцией. Материал на диске полностью авторский, исполнение вполне
    приличное, но диск довольно разношерстный - начало поинтереснее, вторая половина послабее. Для дебюта - неплохо, потенциал
    чувствуется, но работа еще недостаточно зрелая. Тем не менее любопытно услышать, с чего начинал один из ведущих калифорнийских
    блюзменов.'
