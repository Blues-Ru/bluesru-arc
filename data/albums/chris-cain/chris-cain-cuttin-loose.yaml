- id: 1937
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-06'
  text: 'Второй сольник Криса Кэйна, записанный им для лейбла Blind Pig Records, принес талантливому блюзмену из Калифорнии
    заслуженное признание. Обладатель низкого баритона и талантливый гитарист, играющий блюз так, как если бы его играл джазовый
    музыкант, Кэйн написал все треки альбома, а также выполнил аранжировки.


    Наличие духовых в группе Криса только расширяет музыкальную палитру, включающую блюз, фанк, соул и джаз. В качестве продюсера
    альбома выступил знаменитый Патрик Форд.'
