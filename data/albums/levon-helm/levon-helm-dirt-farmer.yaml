- id: 1236
  author: Андрей Евдокимов
  mark: 7
  date: '2008-03-22'
  text: 'Когда-то в группе со смешным названием "The Band" он помогал Дилану становиться "электрическим", что сильно раздражало
    традиционалистов. Он больше не будет. Поющий барабанщик пропагандирует теперь "старую" музыку. Он поет кантри так, словно
    ни рок-музыки, ни рэп-музыки не было… Словно не было и Майкла Джексона и Мадонны. Возьмите этот диск – и машина времени
    отправит вас в позапрошлый век. Скрипка ноет, и голос такой, что школа бель-канто даже радом не была. Все поется строго
    "в нос". Поклонники эстрады и классики дружно поспешат отвернуться. Но у этой музыки есть лучший козырь: она звучит по-свойски,
    по дружески. Хелм поет ту-степы, вальсы и кантри-блюзы с такой естественностью, что цифровой компакт-диск переносит вас
    в ржаной поле юга США. Это редкостный дар. И он определенно не навязывался к филофонистам. Это первый его альбом за 25
    лет!'
