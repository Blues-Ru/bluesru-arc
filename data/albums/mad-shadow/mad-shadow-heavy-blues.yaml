  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2017-08-30'
  text: 'Mad Shadow - квартет сравнительно молодых блюз-рокеров из Ванкувера, играющих
    хард рок с изрядной долей блюза в стиле 70-х а-ля Led Zeppelin. Группа создана
    в 2007 году вокалистом Эриком Олуфсоном и гитаристом Дэниелем Джеймсом (которые
    выросли на музыке Humble Pie, Led Zeppelin, Deep Purple и the Small Faces), а
    в 2008 вышел дебютный альбом. Однако новых альбомов группа не выпускала аж до
    2012 года, когда после смены ритм-секции (пришли басист Бадди Линдрин и ударник
    Коул Джордж) группа записала 4-х песенную ЕPшку "Mk II". Наконец, в 2013 вышел
    второй полноформатный альбом Heavy Blues, полностью оправдывающий свое название.


    С точки зрения музыкального новаторства ребята звезд с неба не хватают и придерживаются
    проверенного золотого рецепта середины семидесятых, но играют технично с хорошим
    драйвом и энергетикой. Их музыка - просто бальзам для души поклонников олдскульного
    блюз-рока.


    К сожалению, в июне 2017 года Эрик Олуфсон ушел из жизни. Ему было всего 26. Но
    музыка осталась и наверняка понравится многим фанатам классического рока.'
