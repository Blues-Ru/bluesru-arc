- id: 369
  author: Михаил Бирюков
  mark: null
  date: '2003-12-16'
  text: 'Чак И. Вайсс, уроженец Денвера, Техас, еще подростком он играл на ударных в сопровождающем бэнде великого земляка
    - блюзмена Сэма Лайтнин Хопкинса. Такое начало не могло не определить соответствующего продолжения, и Чак на долгие годы
    вливается в американскую блюзовую тусовку высшего порядка. Играя то с Мадди Уотерсом, то с Доктором Джоном, а то с другом
    и соавтором Томом Уэйтсом, он накапливал мастерство и нешуточную репутацию. Собственную сольную карьеру Вайсс не спешил
    начать до 80-х, а начав, вполне в соответствии с канонами жанра тут же забросил, предпочтя выступления с постоянной группой
    одного из лос-анджелесских ночных клубов. Лишь в конце 90-х состоялось на удивление успешное и актуальное возвращение
    Вайсса в студию звукозаписи. Его альбом 1999 года "Extremely Cool" собрал весьма положительную критику. И вот воспоследовал
    сиквел.


    С первых же тактов Чак И. Вайсс декларирует верность старой американской музыке. Так и будет на протяжении всего диска
    - то дремучий шаффл, переклички запевалы и хора, и джунглевый бит ("Congo Square at Midnight"), то знойное неулыбчивое
    буги ("Tony Did the Boogie Woogie"), то жуткие рассказки под заполошные грязные гитары ("Jolie''s Nightmare"), то петрушечный
    ярмарочный фальцет ("Piggly Wiggly") как зачин тому же буги ("Two-Tone Car"), ну и т.д. На диске немало забавных стилизаций,
    увлекательных моментов, очаровательно грязных и просто красивых инструментальных пассажей, и вроде все на своем месте,
    и как бы наплевательский вокал - достаточной степени наждачности. Правда, когда дело доходит до подгулявшего салонного
    джаза, из него слишком явно торчат рыжие баки друга Уэйтса, от чего как-то неловко. Да и с особой гордостью включенная
    в альбом 30-летней давности запись из гербария былых заслуг - дуэт с великим Вилли Диксоном "Down the Road A Piece" -
    хоть и хороша, и заводна, и аутентична, но - явно выбивается из общей концепции диска. Однако не будем придираться, а
    лучше вспомним, что тот же Диксон говорил о Чаке И. Вайссе как о, возможно, лучшем музыканте Америки. В музыкантах Вилли
    Диксон разбирался, а выданный им коллеге Вайссу кредит доверия усугубляется тем фактом, что нынче-то совсем немногие артисты
    со знанием дела, пришедшим из первых рук, берутся сыграть "совсем как тогда". Ну или почти как тогда, что уже почти не
    важно. Так что человеку двадцать первого века-любителю корневой музыки века двадцатого - должно понравиться.'
