  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-07-06'
  text: 'Второй сольный альбом одного из ведущих британских слайдеров был записан
    в марте 1990 года и затем выпущен небольшим тиражем на маленькой независимой фирме.
    В 1998 году диск был переиздан фирмой KOCH International. В 1991 году Майкл Мессер
    был назван читателями журнала Blueprint и по итогам вручения премии British Blues
    Connection "Лучшим исполнителем года в стиле акустического блюза".


    Диск очень разнообразен стилистически (блюз, регги, калипсо, кантри, поп) и наглядно
    демонстрирует мастерство музыканта, который свободно чувствует себя во всех этих
    музыкальных стилях. Сразу видно, что проведенное во время его юности время в Нэшвилле
    не прошло даром - Майкл не только научился традиции у мастеров жанра, но и смог
    добавить в свою музыку оригинальные моменты, свойственные только ему. Возможно,
    данный диск покажется блюзовым пуристам недостаточно цельным, но любой сможет
    адекватно оценить мастерство исполнения и желание сказать свое слово в музыке.'
