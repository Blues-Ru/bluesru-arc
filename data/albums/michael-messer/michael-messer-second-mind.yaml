- id: 1935
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-06'
  text: 'Очередной альбом от английского мастера акустического слайда вышел в 2002 году, а в следующем году этот альбом получил
    титул "Лучший блюзовый гитарный альбом" от Международной гитарной федерации.


    "Теплое" естественное акустическое звучание альбома обеспечивается аналоговой записью, которая проводилась в традиционной
    манере - "живьем" в студии, без использования цифровых технологий. Особую пикантность музыке придают ди-джейские примочки
    Луи Джениса, органично вкрапленные в блюзовые ландшафты Майкла Мессера.'
