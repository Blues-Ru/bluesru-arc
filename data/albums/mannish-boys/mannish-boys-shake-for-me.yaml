- id: 1624
  author: Андрей Евдокимов
  mark: 7
  date: '2010-05-07'
  text: 'К своему пятому альбому группа пришла с удивительной репутацией нерациональной, но действенной блюзовой алхимии:
    подвижная в стилистике, стремительная в развитии, удивительная в органическом сочетании традиций и новшеств. Парадоксальные
    рецепты смешения несочетаемых компонентов – все слишком пестро! Мощный, до мозга кости продирающий голос ветерана Бобби
    Джоунса мужествен и как-то тяжеловесен. Шальная гитарная "пальба" гитары Майка кружит голову в адекватно названной инструментальной
    пьесе "Пуля". Вообще, обилие ярких солистов превращает короткую рецензию в простое перечисление имен из числа блюзовой
    элиты, каждое из которых говорит само за себя. Очевидные или неожиданные союзы самобытных музыкантов! Род Пьяцца, Митч
    Кочмар, Кид Рэмос, Майк Зитоу, Джонни Дайэр, Линвуд Слим и еще многие другие… Архи-классические темы блюза перемежаются
    с новыми песнями без нарочитой почтительности. Накал страстей, печальное самокопание и просто бесшабашное веселье виртуозно
    "взболтаны" в этом блюз-шейкере. Бывалые и молодые, они все молодцы: "Мужественные мальчики".'
