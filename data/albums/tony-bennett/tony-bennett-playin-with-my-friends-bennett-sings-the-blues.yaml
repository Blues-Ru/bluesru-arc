- id: 11
  author: А.Пелосси
  mark: 8
  date: '2002-10-13'
  text: 'Собиралась написать &quot;странная и неожиданная пластинка Тони&quot;, а потом подумала: почему же, собственно говоря,
    странная. 75-летний эстрадный монстр, ласкающий слух нескольких поколений &quot;зрелых дам&quot;, вполне имеет право на
    блюзовый диск. В молодости на свой манер он перепел их изрядное количество. Блюз ему ничем не обязан, а вот он блюзу -
    да. Будем считать, это он долг признательности отдает. На свой манер.


    Суть: превосходный диск &quot;джазового блюза&quot;. Камерный, салонный, сентиментальный. Близкий по духу и настроению
    Чарльзу Брауну.'
- id: 311
  author: Кирилл Мошков
  mark: 10
  date: '2003-12-02'
  text: 'Некоторые артисты с годами теряют форму. Некоторые - наоборот, набирают, приобретая при этом еще и почти львиное
    величие. Так случилось с Антонио Бенедетто, последним из еще живых итальянских королей американской песни, всем известным
    под именем Тони Беннетт (как Пьерино Комо был Перри Комо). После смерти Фрэнка Синатры Беннетт царит в классической американской
    эстраде единолично, и при этом год за годом выпускает альбомы, качество которых ничуть не хуже, а зачастую - и лучше,
    чем в прошлом. Новейшая его работа - дважды тематическая, что отражено в названии: это - альбом дуэтов, причем исключительно
    блюзовых.


    Конечно, Беннетт - не блюзовый певец. Как, впрочем, и не джазовый. Но он настолько большой мастер в своем деле, и манера
    его столь сильно и многосторонне связана с джазом, а дружеские и творческие связи с джазовыми (и блюзовыми!) музыкантами
    столь сильны, что для большинства слушателей он неразрывно связан именно с джазовым миром.


    Альбом представляет пятнадцать версий классических блюзов (точнее, песен в блюзовой форме - наряду с классикой Питера
    Чэтмена, Сэма Тэрда и даже Роберта Крэя здесь есть и поп-номера вроде "Stormy Weather" Хэролда Арлена). Диапазон партнеров
    по дуэтам - от активно продвигаемой ныне лесбиянской певицы k.d.lang (для пущей политкорректности) до Натали Коул и от
    поп-рок-барда Билли Джоэла до Рэя Чарлза. Нельзя не признать, что ряд дуэтов - с Чарлзом, с Би Би Кингом и даже с Билли
    Джоэлом (самый неожиданный трек альбома - главная песня самого Джоэла, "New York State of Mind"!) - очень удачны. Остальные
    - совсем недурны. Сам Беннет - эталон "старого эстрадного льва": чуть расслаблен, чуть по-стариковски ворчлив, но то и
    дело ненавязчиво демонстрирует, что пороху в пороховницах еще предостаточно.


    Немалую долю успеха записи приносит уверенная, сильная работа постоянных аккомпаниаторов Беннетта - ансамбля пианиста
    Ральфа Шарона. Ну и, конечно, продюсирование. Мощный, цельный звук с красивым панорамированием, богатой реверберацией
    и тщательно проработанными планами - фирменный знак Фила Рамона.'
