- id: 1317
  author: Андрей Евдокимов
  mark: 9
  date: '2008-07-19'
  text: 'Известный джаз-блюзовый авангардист свой предыдущий альбом записал в одиночестве, отстукивая ритм ногой. Нынешней
    идет дальше по истории жанра: Дельта-блюз подключается к электичеству. На первой половине песен гитарная игра сводиться
    почти только к ритмической функции. А в результате появляется трагически горький и пронзительно искренний альбом; в нем
    философские и социальные вопросы, что не имеют ответов. Записанный в злосчастном Новом Орлеане, он продолжает тему урагана
    Катрины и подхватывает атмосферу катастрофы, от стихии продолжающейся к социальной политике, финансовым мошенничествам
    и бесправию граждан перед властями. К своим песням Улмер подключает серию стандартов, некоторым из которых уже 80 лет.
    И интерпретирует их так, чтобы они наглядно показывали, что острые сегодняшние проблемы были ясны давным-давно. Траурная
    обложка вполне дает представление о настроении альбома, хотя ближе к занавесу в его драматургии появляется тень надежды.
    Музыка, выдающаяся по всем параметрам, сведена в альбом общей актуальной идеей. Номинирован на Grammy.'
