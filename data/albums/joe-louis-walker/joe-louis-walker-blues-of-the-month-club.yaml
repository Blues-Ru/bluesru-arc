- id: 2112
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2013-04-18'
  text: 'Джо Луис Уокер - один из наиболее интересных и новаторских артистов современного блюза. Его музыка включает также
    изрядную долю соул и даже госпел (с 1975 до 1985 Уолкер пел в госпел группе Spiritual Corinthians, после чего вернулся
    к блюзу). Он уверенно себя чувствует и в акустике, и в электричестве, отличаясь довольно самобытными соло.


    Предлагаемый альбом был спродюсирован знаменитым Стивом Кроппером, который также отметился на гитаре в первой песне. Кроме
    того, дополнительный колорит придает эпизодическое присутствие духовых от Memphis Horns и хора от родной госпел-группы.
    На диске 3 кавера, а остальной материал написан самим Уокером. Альбом добрался до 13 места в топе блюзовых альбомов Биллборда.'
