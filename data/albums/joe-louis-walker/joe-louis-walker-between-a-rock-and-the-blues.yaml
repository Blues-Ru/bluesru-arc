- id: 1634
  author: Андрей Евдокимов
  mark: 8
  date: '2010-07-20'
  text: 'Всегда в блюзе была и есть дюжина наредкость стабильных имен. Мастеровитый
    блюзмэн и виртуоз гитарной игры, Уокер последние четверть века выпекает по альбому
    каждый год. Он настольно врос в роль безупречного авторитета, что своей "весомостью"
    напрочь отбил интерес к своим новым записям: заведомо ясно, что там все ОК! Поэтому
    и прошлогодний его релиз прошел почти незамеченным. А напрасно. Уокер – дока по
    части блюзовых стилей, и ему, как профи, легко было перехватить техасский блюз
    на момент переезда в Калифорнию за минуту до того, как тот вылился в новое течение
    Уэст-Коаст-блюза. Но на этот раз слава ученого мужа, воссоздавшего недостающее
    звено эволюции, его больше не прельстила. Чудом он встряхнулся от реноме блюзоведа
    и выдал взрыв эмоций: блюз то запальчивый, то нежный, то игривый и лукавый: "Устал
    я жить в Техасе, устал я играть блюз, устал я петь эту песню" - оцените игру слов,
    поскольку песня называется "I''m Tide" (А кстати, ни усталости, ни рока в альбоме
    нет ни на йоту). От напускной лени к свинговому азарту, этот "прилив" наполнил
    весь альбом эмоциональной энергетикой. И безупречная гитарная игра оказалась не
    сама по себе, а очень к месту! Две недели назад сей труд был назван "Блюзовым
    альбомом года" по архипрестижному в жанре мнению жюри The Blues Foundation. И
    по делу: не за "выслугу лет", за то, что выложился "от души".'
