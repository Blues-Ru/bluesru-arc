reviews:
- id: 267
  author: Алексей Калачев
  mark: 8
  date: '2003-10-25'
  text: 'Как раз тот случай, когда результаты действия госпел на блюз выражены ярчайшим образом. Это о вокале. Инструментальная
    часть диска (звук) выглядит неожиданно аскетически: только гитары. В случае с великим перфекционистом и изощренным инструменталистом
    Волкером все звучит необыкновенно свежо и сильно.'
- id: 255
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Надоело мне уже писать о том, что лейбл Telarc в последние годы собирает под свои знамена лучших блюзменов современности,
    но ничего не поделаешь. Очередным приобретением этой американской независимой звукозаписывающей компании стал гитарист
    Joe Louis Walker, хорошо известный своими многочисленными записями на лейблах HighTone и Verve. Перед тем как неожиданно
    появиться на Telarc, Walker молчал целых три года - может, это был творческий кризис, а может, он просто работал над материалом
    для нового альбома. В любом случае, времени он явно зря не терял - очередная работа музыканта получилась очень приличной.


    На мой взгляд, наиболее интересны три трека. Открывающий альбом в меру шустрый блюз "You''re Just About To Lose Your Clown"
    стилистически отдаленно напоминает творчество Carlos Santana. Здорово прифанкованная инструменталка "2120 South Michigan
    Avenue" вполне могла бы в свое время прозвучать в исполнении некогда популярного коллектива Booker T. & The MG''s. И,
    конечно, Walker не смог удержаться, чтобы не продемонстрировать, как он умеет играть на акустической гитаре - имеется
    в виду блюз "Strangers In Our House", последний на этом альбоме.'
- id: 2111
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2013-04-18'
  text: 'Дебютный альбом Джо на фирме Теларк получился довольно разноплановым в музыкальном отношении: тут есть и блюз, и
    джаз, и соул, и блюз-рок, и акустика, и госпел. Все эти стили музыкант сочетает довольно свободно, демонстрируя также
    прекрасно мастерство владения инструментом.


    Тем не менее, на мой взгляд, результат получился среднестатистический - оно все вроде и неплохо, а по окончании прослушивания
    вспомнить особенно нечего. Не лучший диск музыканта.'
