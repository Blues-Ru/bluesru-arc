- id: 957
  author: Константин Колесниченко
  mark: 10
  date: '2006-01-10'
  text: 'Музыка Joe Louis Walker основана на синтезе блюза, соул, госпел и фанка.
    Нельзя сказать, что такой подход уникален, но музыка тут индивидуальна. У Джо
    интересный, как бы "скрипучий" и "надтреснутый" вокал, лаконичные соло и мелодичные
    аранжировки. Нужно заметить, что оформление диска на высоте, интересно и очень
    красиво. На отдельных треках засветились Steve Cropper и Jimmy Johnson. Некоторые
    песни сопровождаются отличной духовой секцией. Рекомендую этот диск в качестве
    знакомства с творчеством Joe Louis Walker; практически весь материал на диске
    авторства самого Джо. Лучшие песни, хотя они все очень хороши: "Yveline", "I''m
    not messin'' around", "Tell the Truth", "Lyin'' in the name of love".'
