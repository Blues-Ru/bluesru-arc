reviews:
- id: 2245
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2017-01-13'
  text: Довольно любопытный новый диск от голландских ветеранов блюзовой сцены - группа была основана почти 50 лет назад,
    но известно о ней очень мало. Однако это никак не отражается на качестве музыки - с этим у "Иоаннов-богословов" все в
    порядке. Тут мы имеем дело с профессиональным белым европейским блюзом, украшенным эпизодическими подключениями оркестра
    (роскошный первый трек с "гилморовской" гитарой и тягучий блюз Wandering eye). Исполнение очень достойное, аранжировки
    приличные, правда вокал уже подсел от возраста (ну да для блюза это не главное). Стилистически тут не чистый блюз, а скорее
    разноплановый неспешный блюз-рок (иногда даже с элементами психоделии а-ля Дорз). Каверы блюзовых нетленок (Sensitive
    kind, Congo Square, The Green Manalishi) сделаны добротно, но без откровений. В целом альбом оставляет очень приятное
    впечатление, а первый трек A woman knows просто шедевр!
