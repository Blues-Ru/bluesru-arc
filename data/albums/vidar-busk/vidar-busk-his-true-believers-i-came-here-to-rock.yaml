- id: 136
  author: Федор Романенко
  mark: 10
  date: '2003-07-09'
  text: 'Вторая пластинка норвежского супер-гитариста более разнообразна по стилю,
    даже, можно сказать, эклектична, нежели первая - более блюзовая "Stompin'' Our
    Feet Joy". Во время ее выхода Бюск постоянно играл в клубах в составе чисто блюзовой
    группы с контрабасом и великолепной хроматической гармоникой чрезвычайно молодого
    и талантливого Arne Rassmussen. Кроме того, к ним иногда присоединялся человек-ансамбль
    Johnny Augland, который одинаково хорошо играет как на гитаре и басу, так и на
    рояле. В таком составе они достигли чрезвычайно крутого "плотного" блюзово-свингового
    звука, записав первую пластинку и сыграв в течение двух лет серию потрясающих
    концертов.


    Но Бюск, судя по всему, не может удовлетворяться одной и той же музыкой в течение
    продолжительного времени, поэтому, достигнув успеха в одной области, он решил
    поэкспериментировать с новыми вещами.


    На пластике "I Came Here To Rock" часть песен записана в старом блюзовом свинговом
    звучании с полуакустикой, часть на стратокастере с уклоном в рок и рок-н-ролл,
    а также впервые у Бюска появились песни, аранжированные с оркестром, и даже есть
    одна вещь с тремя скрипками.


    У Бюска существенную часть его натуры составляет т.н. игра в стиль. Во время записи
    этой пластинки он выглядел как Элвис Пресли - прическа, пиджак с блестками и пр.
    На следующей пластинке с оркестром он был больше всего похож на Брайана Зетцера,
    через год отрастил усы и стал изображать горячего испанского парня - гитарного
    героя, еще через год, записывая втроем гитарную школу, чрезвычайно точно изобразил
    SRV, отрастил бородку под нижней губой, завел серьгу, и даже нацепил на басиста
    Бьйорна Хольма кепку, снятую с Томми Шеннона.


    Во время записи пластики "I Came Here To Rock" Бюск вяглядел как Элвис, и это
    поначалу сбивало с толку. От музыканта с такой внешностью ожидаешь какого-то внутреннего
    убеждения: "Элвис - самый крутой парень, я хочу быть как он, я так оделся потому,
    что рок-н-ролл - круче всего, и я постараюсь все сделать и сыграть в точности,
    как у Элвиса.". После того, как послушаешь несколько песен, становится понятно,
    что это - все туфта, которая к Бюску не относится. Бюск играет то, что захочет,
    в том числе - блюз, все перемешивая по своему усмотрению, и ни в коем случае не
    следуя никакому готовому музыкальному шаблону. Его внешний вид - это игра в стиль,
    желание ярко выглядеть и т.д. Разумеется, что-то он берет из соотв. имиджу музыки,
    но только в качестве одной десятой части в пропорции... Совершенно очевидно представить
    себе разодетого рокабилла, который поет и танцует рок-н-роллы, а также, в качестве
    "противоположности", современного блюзмена, который решил исполнять кантри-блюз
    на акустике про страдания на плантации. Такой музыкант никогда не оденется как
    бездуховный рокабилл, а специально пойдет в бутик, чтобы купить стильную дырявую
    шляпу, и не забудет поставить в кадр недопитую бутылку виски и сигарету. И то,
    и другое - совершенные шаблоны, которые распространяются и на музыку. Понятно,
    что если рокабилл исполнит занудный блюз в миноре, а аутентичный блюзмен - какой-нибудь
    рок-н-ролл - свои не оценят и выгонят взашей.


    Для Бюска стиль в музыке и одежде - это только повод, чтобы бы взять самое интересное
    из каждого направления. Он ничего знакового не подразумевает, никакой "кастовой
    принадлежности" и т.д.


    Пластинка, исполненная в форменной одежде Элвиса Пресли, содержит пару рок-н-роллов.
    В частности, одноименную с альбомом песню "I Came Here To Rock", построенную на
    риффе с забойным фирменным бюсковским звуком баритон-гитары стильной фирмы Danelectro
    (которую можно купить, кстати, за 300$ в магазине). Этот гимн Бюск продолжает
    исполнять на концертах до сих пор, вставляя в середину песни импровизацию на совершенно
    другие темы минут на 5-10.


    Сразу после забойного полурок-н-ролла, идет блюз 24/7 в чисто-чикагском стиле,
    к рок-н-роллу не имеющий ни малейшего отношения. Третий номер программы - абсолютно-четкий
    шаффл Гитар Слима про "Letter To My Girlfriend" с дудками. Судя по всему, про
    старую песню Бюск вспомнил в результате переиздания в том году концерта SRV в
    Карнеги Холле.


    Собственная песня Mr. Sugar - фантастически точная стилизация под T-Bone Walker.
    Когда слушаешь ее в первый раз, захватывает дух - неужели так можно сыграть в
    Норвегии в конце 20го века? Текст и название песни (They call me Mr.Sugar, I can
    play some sweet blues for you) очень созвучно ее музыкальному содержанию. Соло
    на саксофоне и, главное, Бюска на гитаре замечательно демонстрирует умение изображать
    оттенки настроения во времени чисто музыкальными средствами. То, что называют
    "talking guitar". "Сладкие" куски соло на мягкую мажорную гармонию развиваются
    в более жесткие, можно сказать "соленые", хе-хе, формы, грань зыбкая, все неустойчиво.
    Удивительно, что еще и происходит в четком свинговом ритме, приходя в одни и те
    же точки вместе с параллельной гармонией.


    Песня Get Up Baby по стилю растет из рокабилли, но содержит в середине самое убойное
    блюзово-свинговое соло с постоянным развитием темы и нагнетанием напряжения на
    примерно 16 квадратов. От этой песни у гитариста по-настоящему захватывает дух
    и не отпускает до кульминации, в которой совершенно неожиданно из правого уха
    в левое на полной громкости проезжает мотоцикл...


    Потрясающий инструментал Groovy Gravy (One For Bill) написал 22х летний гармонист
    Arne Rassmussen в подражание и в память William Clarke. Более точно, за основу
    был взят инструментал Greasy Gravy. Эта песня на 5 минут совершенно опрокидывает
    своим жестким минорным шаффлом, свинговыми соло Бюска и забойнешими риффами хроматики
    и гитары. Можно сказать, что они сыграли лучшего Вильям-Кларка, чем он сам. Вторая
    половина песни построена по принципу вопрос-ответ, Бюск и Рассмуссен играют по
    одному такту, отвечают друг другу музыкальными фразами. Песня - потрясающая по
    драйву и качеству, заставляет биться сердце чаще, а по спине бегут мурашки. Высокий
    класс!!!


    Песня Lovestruck - это лирическая баллада со скрипками, которую очень много крутили
    в Норвегии по относительно попсовым радиостанциям. В ней есть все - текст про
    любовь, мягкий рояль, проникновенный голос и даже скрипки! Ее отличает от плохой
    попсовой лирики - качество - это еще один эксперимент Бюска еще в одной области.
    Песня - длинная, развивается по законам жанра, во второй части Бюск начинает играть
    относительно спокойные лиричные куски соло на стратокастере, которые впоследствии
    становятся совершенно эмоционально-разнузданными и абсолютно блюзовыми, что совершенно
    нетипично для попсы, удар в поддых тем, кто изготовился послушать легкую не напрягающую
    музыку. При этом, стоит сказать, что стиль и уровень лиризма в понимании Бюска,
    несомненно, выдержан. Кода, которая должна бы продолжаться один неполный квадрат,
    становится подложкой под развивающееся, захватывающее, кричащее гитарное соло.


    После лирической песни идет жесткий минорный шаффл - Hard Times - клубная запись
    совместного выступления трех отличнейших норвежских блюзовых гитаристов - Видара
    Бюска, Джонни Огланда и Кнута Рейерсруда. Это - "разговор" трех гитар, из которого
    выносишь представление о том, каким разнообразным и развитым может быть гитарный
    язык. Это - один из редких примеров качественного драйвового джема, когда участники
    - высококлассные музыканты не забивают, а поддерживают друг друга.


    Под занавес на альбоме записана несерьезная песня "One Way Ticket Man" - намек
    на историю Бюска, уехавшего в молодости из Норвегии в Америку, купив билет только
    в один конец. Особую прелесть ей придает очень изящная, совершенно несерьезная
    расслабленная гитарная партия Бюска на фоне рояля, которая отчасти растет из какого-то
    рокабилли, но, разумеется, гораздо разнообразней. Песня с неочевидными достоинствами,
    но - настоящий подарок для тех, кто ее оценит ;)


    На этом альбоме Бюск в первый раз опробовал веселый прием, необозначенный бонус
    в конце записи для тех, кто не выключит магнитофон. Нечто совершенно неожиданное
    и разнузданное ;)) В студии забыли отключить микрофон и Бюск продемонстрировал
    свое истинное лицо! Такой же номер есть у Бюска на его следующей пластинке и на
    одном из дисков Холмстрома.


    Пластинка "I Came Here To Rock" совершенно разнообразна по стилю, Бюск никогда
    не играл на одном концерте большую часть песен с него, это, скорее, набор студийных
    экспериментов, тем она мне особенно и интересна, как проявление таланта в разных
    областях и безумное смешение стилей.'
