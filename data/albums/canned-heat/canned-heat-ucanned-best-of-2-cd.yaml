reviews:
- id: 35
  author: Алексей Калачев
  mark: 10
  date: '2002-10-26'
  text: 'Есть риск потонуть и запутаться в альбомах группы: история её столь продолжительна, число дисков с разными составами,
    разного уровны столь ошеломительно велико, что лучше начать (или ограничится) грамотной компиляцией. Большинство сборников
    – а их тоже ой как немало! – заполнены лишь поп-материалом, а, значит, не дадут представления о выдающейся БЛЮЗОВОЙ команде.
    За этим двойничком пришлось поохотиться, но он стоит того: представительный и по охваченному периоду (с основания до 80-х)
    и по материалу, а также хорош по звуку. Всё, что нужно знать о музыке "Кеннед Хит", вы из него узнаете.'
- id: 2244
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2016-12-16'
  text: Двухдисковая антология творчества американских звезд белого блюза, включающая в себя золотой период группы, начиная
    с весны 1967 года (еще до выпуска дебютного альбома) по 1973 годы. На дисках в хронологическом порядке представлены как
    хиты Canned Heat ('On The Road Again', 'Let's Work Together', 'Up The Country' и другие), так и альтернативные версии,
    а также рекламные джинглы - из 41 треков 12 не были изданы ранее. В антологию также включены совместные работы Canned
    Heat с Джо Ли Хукером (It's All Right) и Доктором Джоном (Christmas Blues) - правда, по какой-то причине в сборник не
    попали записи с Мемфис Слимом. В общем и целом, очень приличная подборка и прекрасная возможность ознакомиться с творчеством
    знаменитого коллектива.
