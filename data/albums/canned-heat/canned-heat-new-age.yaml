  date: '2016-10-20'
  text: 'Этот довольно короткий по продолжительности номерной альбом вышел в сентябре
    1973 года на United Artists, альбом - последний на этой фирме, его записывает
    состав: Боб (Роберт) Хайт, Генри Вестайн, Адольфо "Фито"де ла Парра - ударные,
    Ричард Хайт (Richard Hite), бас-гитара, туба, вокал; Джеймс Шейн (James Shane),
    гитара, вокал, Эд Бейер (Ed Beyer), клавишные; Клара Уард (Clara Ward), вокал
    . Из основателей группы к этому времени остаются только двое - Боб Хайт и Вестайн,
    лучшие времена этих блюз-буги евангелистов остались в 1968-1970 годах, но альбом
    провальным не назовешь.


    Альбом был посвящен памяти Клары Уард, принимавшей участие в записи одной песни
    на этом альбоме, вокалистки и активистки музыки госпел, ее голос и общий вклад
    в альбом можно оценить в Lookin'' for My Rainbow, госпелз, на котором она поет
    со своей группой Clara Ward Singers плюс сопровождение Canned Heat . Она умерла
    в 1973 году в возрасте 48 лет, а в 1972 году скорее по настоянию ее работодателей
    из United Artists, чем по велению души, записалась с Canned Heat. Здоровье ее
    к тому времени уже было совсем слабым, было не до песен и записей.


    Стиль альбома - скорее американа, чем блюз. Три песни принадлежат авторству ритм
    гитариста Джеймса Шейна, он же сам их и поет хрипловатым голосом, напоминающим
    голос Доктора Джона, три - брату Боба бас- гитаристу Ричарду Джи Хайту, две -
    клавишнику Эду Бейеру и одна - паре хит-мастеров, Либеру и Столлеру. Наиболее
    яркими моментами альбома по моему мнению является быстрый блюз Rock and Roll Music
    и популярный гимн байкеров Harley Davidson Blues .'
