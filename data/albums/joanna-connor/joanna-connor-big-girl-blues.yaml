  date: '2012-08-15'
  text: 'Джоанна Коннор - современная гитаристка, певица и композитор, которую журнал
    Чикаго называл "наиболее возбуждающим новым талантом на блюзовой сцене". Несмотря
    на очевидные параллели с Бонни Райатт (обе дамы мастерски владеют слайд-гитарой),
    Джоанна играет в более жестком и агрессивном воплощении современного техасского
    блюза, обладая очень приличной гитарной техникой.


    Первую гитару Джоанна получила в семь лет, в 16 уже пела в местных группах, а
    в 22 года перебралась в Чикаго, где вскоре уже аккомпанировала местным грандам
    - Джеймсу Коттону, Джуниору Уэллсу и Бадди Гаю. В 1989 году она подписала контракт
    с Blind Pig Records и выпустила свой первый сольный альбом. Работа получила восторженные
    отзывы музыкальных критиков, и следующий альбом Джоанны уже продюсировал знаменитый
    Джим Гэйнс. Джонанну Коннор назвали сопрано-версией Джонни Уинтера :-)


    Альбом 1996 года - шестой сольник Джоанны и ее третий релиз на лейбле Blind Pig
    Records. Альбом техничного энергичного блюз-рока с обилием слайд-гитары (кроме
    последнего трека, который сделан в стиле реггей!). Все достаточно прилично и к
    технике игры никаких претензий нет, но вот чего нашей героине действительно нехватает,
    так это по настоящему запоминающихся мелодий и гитарных риффов.'
