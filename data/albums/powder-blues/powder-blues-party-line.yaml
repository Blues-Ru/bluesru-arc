  date: '2006-05-07'
  text: '<img src=http://image.allmusic.com/00/amg/cov200/drf800/f823/f82339s23i1.jpg>


    На этом альбоме группа совсем отменила блюз и рок-н-ролл. Почти все песни в духе
    ритм-н-блюза и блюз-рока + один свинговый инструментал. Более того, ребята решили
    чуть припопсить звук, но, слава Бобу, они не очень гадко это сделали. Интересно
    еще и то, что в группе появились женские подпевки. Надо заметить, что ритм-н-блюз
    у них звучит все же в стиле 60-х - это не может не радовать. Все песни написаны
    группой, и они очень приятные.'
