  author: Дмитрий Казанцев
  mark: 8
  date: '2005-11-27'
  text: 'Группа из Канады, это их первый альбом, он записан в Ванкувере, а мастеринг
    сделан в Лос Анджелесе (США). Команда играет разные стили блюза и ритм-н-блюза:
    тут есть свинг, шаффл, фанк и традиционный ритм-н-блюз в бите. Я бы наповал сражен
    их мастерством, особенно хороша духовая секция (Wayne Kozak - tenor sax; Gord
    Bertram - baritone sax; Mark Hasselbach - trumpet). Основная же группа состоит
    из: Tom Lavin - guitar/vocal; Jack Lavin - bass/vocal; Will Mac Calder - keys/vocal;
    Duris Maxwell - drums; David Woodward - tenor sax/vocal.


    На издании RCA 9 треков, но был и канадский оригинал фирмы Blue Wave - на нем
    было 10 треков (вроде бы). Большинство песен написаны группой, но есть тут и очень
    знакомые нам песни: "Just A Little Bit" (hit), "Personal Manager" (Albert King).
    Почти все вещи в бодром темпе, можно сказать, что это веселая и танцевальная музыка
    (рекомендую любителям разного вест-коуста и другого поп-блюза).'
