  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2012-08-13'
  text: 'Отличный альбом для вечеринок от одной из наиболее известных канадских блюзовых групп, созданной в далеком 1978 году
    гитаристом Томом Лэвином. За прошедшие 30 с лишним лет группа превратилась в ведущий блюзовый коллектив Канады, заработала
    ряд блюзовых премий (включая премию W.C. Handy в 1986 году), отыграла на престижных фестивалях (включая фестиваль в Монтре),
    и даже выпустила диск на фирме Мелодия в 1990 году!


    Относительная неизвестность коллектива за пределами родной страны отнюдь не сказывается на качестве музыкального материала:
    на данном альбоме группа исполняет отличный танцевальный джамп-блюз с духовыми, причем делает это высокопрофессионально
    и энергично. Диск ровный и одинаково хороший от начала до конца, и даже поставленные в самый конец два инструментала ничуть
    не портят картину. Рекомендую!'
