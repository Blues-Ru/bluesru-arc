  date: '2006-05-07'
  text: '<img src=http://image.allmusic.com/00/amg/cov200/drf800/f823/f82323k1ybz.jpg>


    Эта канадская блюз-группа очень здорово играет. Особый акцент сделан на духовых - они великолепны. Команда играет блюз,
    свинг, ритм-н-блюз и блюз-рок. Иногда рок-н-ролл и рокабилли, но с духовыми все это звучит как ритм-н-блюз, конечно. На
    этом альбоме ВСЕ песни написали сами участники банды, в которой 7 человек (+ 2 гостя). Песни хороши, но рок-н-роллы звучат
    совсем странно в 1981 году.'
