  date: '2005-11-27'
  text: '<img src=http://www.ljplus.ru/img/d/r/dr_nick/powder-blues-83.jpg> Канадская
    ритм-н-блюзовая команда и их альбом на независимом лейбле Flying Fish. Звук ОТЛИЧНЫЙ
    для 1983 года - вот что значит ГРАМОТНЫЙ инди-лейбл. Ребята играют разные стили
    блюза и вокруг этого - джамп, вест-коуст, соул, рок-н-ролл. Ребята белые, но все
    же они пытаются играть музыку в черных традициях (не блюз-рок и не рокабилли со
    свингом). Группа большая - 7 человек + трое гостей; они создают хорошую звуковую
    палитру из грамотных звуков и фраз. Есть тут известные номера: "Sugaree", "Tore
    Down", "Roll Over Beethoven", "Farmer John". Симпатичный альбом с легкой, приятной
    блюз-музыкой.'
