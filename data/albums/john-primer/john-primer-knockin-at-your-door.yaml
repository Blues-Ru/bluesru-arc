- id: 243
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'John Primer - один из видных блюзменов, попавший не так давно в сети Telarc. Следует упомянуть, что Primer - типичный
    представитель чикагского блюза. Начинал он еще в середине 60-х. Успел поиграть с такими звездами, как Willie Dixon, Muddy
    Waters и Magic Slim, а с начала 90-х выступает уже с собственными составами. Свой первый сольник записал в 93-м году,
    пластинки в основном выпускал на Wolf Records.


    Новый альбом Primer, как уже говорилось, вышел на Telarc и, в общем, ничем не потряс. Очень ровная и весьма приятная на
    слух работа. Особенно понравились блюзы "Hard Workin'' Woman", "Every Time You Touch Me", "A Woman Was Made To Be Loved"
    и "I Want To Know". Да и остальное впечатления не портит - в сон, скажем прямо, не вгоняет.


    Я был несколько удивлен, когда в одном из американских изданий прочитал, что Primer якобы не очень удачно подобрал музыкантов
    для этой записи. Не знаю - по-моему, все сыграно весьма и весьма неплохо. По крайней мере, никто не фальшивит. Ну разве
    что, может быть, Matthew Skoller с его губной гармошкой многовато.'
