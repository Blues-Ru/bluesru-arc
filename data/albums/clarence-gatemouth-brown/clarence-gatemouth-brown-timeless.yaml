reviews:
- id: 1152
  author: Константин Колесниченко
  mark: 9
  date: '2007-11-06'
  text: 'Насколько я знаю, это последний прижизненный альбом Гейтмауса (на allmusic
    ошибка, они запихнули его в компиляции), и это более чем достойная работа! Гейтмаус
    яркий пример того, как хорошо, когда музыкант не зацикливается на одном стиле,
    особенно пожилой. Поэтому альбом пестрит разнообразием: техасский блюз, кантри,
    джаз и даже какие-то эксперименты (Гейтмаус что-то начитывает речетативом на музыку).


    Слышно, что пение уже не просто дается Брауну (рак), но его игра на гитаре - это
    по-прежнему очень круто, да и его скрипка звучит очень сочно и уместно!


    Я согласен с названием, музыка Гейтмауса действительно вне времени.'
- id: 1810
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-01'
  text: 'Последняя прижизненная работа техасского мультиинструменталиста и певца Клэренса
    Брауна по прозвищу "Гэйтмаус" (увы, в сентября 2005 года его не стало). Кроме
    пения и сочинения музыки, Клэренс свободно владел гитарой, скрипкой, гармоникой
    и рядом других инструментов. При этом исполняемая им музыка поистине полистилистична
    - он никогда не ограничивался одним стилем (причем не только в рамках одного альбома,
    но даже в рамках одной песни!). При этом Гэйт всегда говорил, что он играет американскую
    музыку. И если бы пришлось выбрать только одного среди всех исполнителей современной
    американской музыки во всем ее разнообразии, таким исполнителем практически наверняка
    стал бы именно Клэренс Браун.


    На данном диске наряду с новым материалом Браун записал ряд своих более старых
    хитов в новой аранжировке, а также свою чрезвычайно оригинальную интерпретацию
    Unchained Melody (помните фильм "Призрак" с Дэми Мур и Пэтриком Суэйзи), плюс
    еще Mercy, Mercy, Mercy Джо Завинула. Конечно, пение 80-летнего Клэренса на данном
    диске уступает его вокалу на более ранних альбомах, но его игра на гитаре и скрипке
    по-прежнему весьма и весьма впечатляют. Стилистически мы имеем традиционный для
    Брауна полистиличный коктейль из блюза, джаза, кантри и свинга (а под занавес
    даже что-то типа ирландской жиги), исполненный на самом высоком профессиональном
    уровне (хотя и чуть поспокойнее, чем раньше). На редкость точное название выбрано
    для альбома - музыка Клэренса Брауна воистину не подчиняется временным рамкам.'
