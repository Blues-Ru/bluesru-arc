- id: 1811
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-01'
  text: 'Один из последних альбомов знаменитого техасского музыканта, на котором как обычно представлен целый коктейль стилей,
    но преимущество отдано джамп-блюзу и традиционной музыке штата Луизиана. На альбоме Клэренсу аккомпанирует другой знаменитый
    луизианский блюзмен - слайдер Сонни Ландрет.


    Как обычно у Брауна, роскошные духовые аранжировки, фанковые инструменталы, свинговые танцевальные треки, исполненные
    с исключительным профессионализмом - одним словом, очень приятная традиционная пластинка.'
