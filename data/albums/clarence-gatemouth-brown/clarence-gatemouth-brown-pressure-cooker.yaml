  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-06-01'
  text: 'Изданный фирмой Аллигатор в 1985 году материал был записан Брауном в марте, июле и августе 1973 года во Франции во
    время европейских гастролей знаменитого американского музыканта.


    На данном диске Браун не радует поклонников различными инструментами - он только играет на гитаре и поет, причем бОльшую
    часть диска с минимальным сопровождением (в форме трио или квартета). Однако полистиличность музыканта проявляется и тут,
    ибо записанная музыка содержит элементы и блюза, и свинга, и джаза, и кантри. В более поздних работах за счет расширенного
    состава музыкантов и более мощных аранжировок эта полистиличность раскрывается в полной мере (некоторое представление
    о будущем звучании дает трек номер 3).


    Диск чуть более расслабленный и не такой цельный, как лучшие работы Клэренса, тем не менее не лишен своей прелести: это
    и хорошая гитарная техника музыканта, и его отменное чувство юмора (услышите сами), и прекрасная игра на фортепиано Джэя
    МакШенна. Для своего времени работа вполне достойная.'
