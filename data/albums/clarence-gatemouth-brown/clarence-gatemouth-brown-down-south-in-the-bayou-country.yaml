- id: 1027
  author: Александр Панин
  mark: 8
  date: '2006-08-28'
  text: Недавнее переиздание пластинки Брауна, выходившей в 1975 году на лейбле Barclay. После ряда блюзовых сессий во Франции
    Гейт решает на какое-то время забыть о гитаре (на этом альбоме он играет только на скрипке и губной гармошке) и обратиться
    к другим любимым жанрам американской музыки. Так и получилась довольно необычная для его дискографии запись Down South
    In The Bayou Country, сделанная в начале 1974 года в Луизиане. На ней в основном звучит кантри-рок с примесью соула, южного
    рока и музыки кейджн. Вместе с Брауном играет пара гитаристов (pedal steel, акустическая и электрические гитары), ритм-секция
    и пианист. Известных и очень уж ярких песен тут нет, большая часть вещей написана студийными сочинителями специально для
    проекта, а самая любопытная композиция, называющаяся Loup Garou, представляет собой вовсе и не кантри, а фанки-соул в
    духе Доктора Джона. Впрочем, все треки звучат довольно прилично, хотя и кажется, что вокал Кларенса не очень подходит
    для целого альбома такой музыки. Переиздание на компакте включает два бонус-трека, записанных в Париже в начале семидесятых.
