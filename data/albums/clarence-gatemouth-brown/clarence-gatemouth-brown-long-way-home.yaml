reviews:
- id: 1127
  author: Константин Колесниченко
  mark: 8
  date: '2007-09-11'
  text: 'Я не знаю, чем руководствовался Bill Dahl, когда поставил на allmusic оценку
    этому альбому 1,5 балла. Вообще, я довольно лояльно отношусь к оценкам альбомов,
    от других критиканов, но тут просто обидно и непонятно. Пожалуй, это один из самых
    эклектичных и, в то же время, наименее блюзовых альбомов Гейтмауса. Скорее всего,
    это и смутило Билла, ожидающего услышать вместо карибских, рок, кантри, ритм-н-блюз
    мелодий подборку свингующего блюза. На альбоме ОЧЕНЬ впечатляющий список именитых,
    звездных, замечательных музыкантов: Eric Clapton, Ry Cooder, Leon Russel, Jim
    Keltner, Sonny Landreth, Maria Muldaur, Bobby Charles, Bobby Campo, Willie Weeks,
    John D. Loudermilk, Grady Gaines и др. Замечательно подобраны и композиции, словно
    под каждого из музыкантов: с Клэптоном "Blues Power" и дилановская "Don''t Think
    Twice", c Кудером карибская "I''ll Be There", c Расселом "Mean and Evil", что
    исполнено с John D. Loudermilk, думаю, понятно, и отличное исполнение с Sonny
    Landreth "Don''t Cry Sister" Кейла.'
- id: 1815
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-01'
  text: 'Альбом, бесспорно, интересный, но не слишком характерный для самого Брауна
    (хотя и его гитара, и его скрипка, и его полистиличность присутствуют). Однако
    сам Клэренс выступает на данной пластинке в роли своего рода хозяина дома, пригласившего
    поиграть других звезд блюза, которые и вносят свой вклад в результирующую музыку.


    Вот кто заглянул "на огонек" при записи альбома:


    Эймос Гэрретт, Джим Келтнер и Уилли Уикс (практически на всех треках, кроме акустики)


    Эрик Клэптон - треки 1, 10 и 13


    Рай Кудер - 3 и 4


    Сонни Ландрет - 12


    Леон Рассел - 1, 7 и 8


    Мариа Малдор - дуэты и бэквокал


    Джон Лаудермилк - 11


    Пятое место в топе блюзовых альбомов Биллборда.'
- id: 2248
  author: Дмитрий Казанцев
  mark: 8
  date: '2017-01-17'
  text: 'Verve 1996 CD. Clarence "Gatemouth" Brown - чудо во всех отношениях: родился
    в Луизиане, но стал симовлом Техаса. Его считают блюзменом, но он также играл
    кантри, рнб, джаз, рок-н-ролл, кейджун, зайдеко... Прекрасное пение + игра на
    гитаре, скрипке, альте, мандолине, гармошке ударных... На этом альбоме - звездный
    состав и супер-песни. Jim Keltner & Willie Weeks - в основном составе; гости:
    Eric Clapton, Ry Cooder, Sonny Landreth, John Loudermilk, Leon Russell, Bobby
    Charles, Maria Muldaur. Альбом, конечно, начинается с первого хита Клэптона (Blues
    Power), который был написан Расселом. Есть тут и великая Tobacco Road вместе с
    автором Лаудермилком. Много я слышал Брауна, но этот альбом, пожалуй, самый сильный
    и интересный!'
