reviews:
- id: 1151
  author: Константин Колесниченко
  mark: 7
  date: '2007-11-06'
  text: 'Хороший и очень цельный диск Брауна. Гейтмаус просто воплощение свинга, но он не делает это пошло, не делает это
    скучно и заезженно.


    Этот альбом allmusic считает (судя по количеству звездочек) лучшим у Брауна, он очень хороший, но к сожалению, не раскрывает
    слушателю всех сторон музыканта. На мой взгляд, в звуке чувствуется влияние 80-х(звук какой-то пустоватый) - это я тоже
    отношу к недостаткам. Но если все вышеперечисленное вас не отпугнет, то при прослушивании вы получие порцию задорного,
    энергичного и виртуозного блюза в духе T-Bone Walker.'
