  author: Александр Панин
  mark: 7
  date: '2005-05-25'
  text: Нэшвилльские записи Гейта, датированные 1965-м годом. Диск начинается с песни
    May The Bird Of Paradise Fly Up Your Nose, ей же и заканчивается (тут два разных
    тэйка этого хита кантри-исполнителя Литтл Джимми Дикенса). В промежутке - три
    вещи Сонни Боя Уильямсона, блюзовый стандарт Goin' Down Slow, композиции самого
    Брауна. Вся музыка довольно легкая и с определенным джазовым оттенком, Кларенс
    играет в основном на гитаре, но немного и на скрипке. Диск выпущен в серии Charly
    Blues Masterworks (это Vol.6) и длится всего 32 минуты. Не самый интересный альбом
    Гейта, но тут есть что послушать.
