  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-06-01'
  text: 'Выдающийся блюзово-джазовый экспериментатор Клэренс Браун с более чем 50-летней
    карьерой записал данный альбом, когда ему было 74 года. Однако энергии ветерана
    может позавидовать любой - пластинка очень бойкая, гитарные пассажи Клэренса по-прежнему
    хороши, аранжировки насыщенны, а музыка, как всегда, не ограничивается каким-либо
    одним стилем. Хотя на этой пластинке Браун отдал дань любимому им джазу, исполнив
    3 стандарта из репертуара Эллингтона и еще 2 от Чарли Паркера, поэтому джазовый
    компонент более выражен (что, впрочем, нисколько не портит сам альбом).


    Добротная работа мастера, добравшаяся до 14 места в блюзовом топе альбомов Биллборда.'
