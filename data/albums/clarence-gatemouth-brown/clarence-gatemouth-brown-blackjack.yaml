  text: '<img src=http://image.allmusic.com/00/amg/cov200/drd500/d571/d57123179dp.jpg> <img src=http://www.letitbe.com/auction/pictures/fcx.jpg>


    Длинный, классный, разнообразный альбом Брауна. Компакт издали только в 1999 году, и на нем дурацкая обложка (слева).
    На диске 12 песен - вокальные и инструментальные блюзы и кантри-песни. Кларенс играет на гитаре, скрипке, альте, мандолине,
    гармошке и поет. Ему помогают еще шестеро. Удивительное сочетание кантри и блюза. Как говорил сам Браун - он не блюзмен,
    он играет южную народную американскую музыку.


    Альбом записан в Луизиане. Прекрасная музыка.'
