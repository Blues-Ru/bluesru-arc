  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-01'
  text: 'Клэренс Браун по прозвищу "Гэйтмаус" - разносторонний и полистиличный музыкант-виртуоз, оказавший огромное влияние
    на развитие американского блюза вообще и техасского блюза в частности, обладатель Грэмми за лучший традиционный блюзовый
    альбом 1982 года. Он начал играть в 5 лет - но на скрипке, а к 10 годам освоил и гитару, разработав свой собственный уникальный
    стиль игры.


    Его музыка не подчиняется одному выбранному стилю - он использует их все, смело перемешивая всевозможное традиционные
    стили без каких-либо ограничений - и блюз, и джаз, и свинг, и кантри, и фанк, и зайдеко, и джамп-блюз. Хотя критики считают
    его самым джазовым из всех блюзовых музыкантов, Клэренс всегда утверждал, что он играет просто "американскую музыку".


    No Looking Back - его второй альбом на фирме Аллигатор, исполненный в традиционной для Брауна полистиличной манере, где
    он в полной мере демонстрирует свой талант гитариста, аранжировщика и композитора.'
