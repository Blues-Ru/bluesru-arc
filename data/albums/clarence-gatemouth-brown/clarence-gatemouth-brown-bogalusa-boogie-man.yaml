reviews:
- id: 1039
  author: Александр Панин
  mark: 9
  date: '2006-10-23'
  text: 'Это второй "ковбойский" альбом Гейтмауса (первый назывался <a href="http://www.blues.ru/data/albumview.aspx?cdid=997#1027">Down
    South In The Bayou Country</a> и был записан годом ранее). Он очень похож на своего предшественника: здесь так же доминируют
    жанры кантри и кейджн, а также ощущается влияние южного рока, фанки-соула и блюза. Как и на том альбоме, Кларенс в основном
    играет на скрипке и поет. Десяток песен был написан специально для проекта, а среди двух каверов диска выделяется известнейший
    номер группы Little Feat Dixie Chicken. Оригинальные песни весьма неплохи, и должен сказать, что эта пластинка нравится
    мне чуть больше предыдущей. Для недавнего ее переиздания на компакт-диске в серии Maison De Blues: Barclay''s Masters
    составители откопали еще несколько записей примерно того же периода, на которых Кларенс играет один на акустической гитаре
    и исполняет джазовые композиции Дюка Эллингтона и Бенни Гудмена, известнейший джамп-блюзовый номер Caldonia, блюз Someday
    (или Worried Life Blues) и свой старый хит Okie Dokie Stomp. Нельзя сказать, что качество записи бонусов очень хорошее,
    но подобная дописка весьма интересна!'
