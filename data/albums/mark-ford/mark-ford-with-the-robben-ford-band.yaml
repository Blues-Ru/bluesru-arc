- id: 2320
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2018-12-06'
  text: 'Семья калифорнийца Чарльза Форда оказалась богатой на музыкальные таланты - три его сына стали знаменитыми блюзовыми
    музыкантами: ударник Патрик Форд, гитарист Роббен Форд и харпер Марк Форд.


    Данный диск записан в Беркли (Калифорния) в ноябре 1990 года и издан в 1991 году, затем через несколько лет переиздавался
    (отсюда разные обложки). На нем Марк Форд вновь объединил силы с братом Роббеном и его группой, записав фактически блюзовый
    джем, выразив тем самым свою любовь к музыке - музыканты не стремились к коммерческому успеху, они просто наслаждались
    совместным творчеством и получали удовольствие от процесса. Братья не только играли вместе, но и выступили в роли продюсеров
    альбома.


    Несмотря на блюзовую основу, на диске также выражена джазовая импровизационная составляющая, которая всегда присутствовала
    в музыке Роббена. Тем не менее первую скрипку тут играет Марк - и как композитор (написав бОльшую часть треков, остальное
    - классика блюза), и как певец, и, конечно же, как харпер с уникальной техникой. Новаторскую игру Марка и его оригинальное
    звучание практически невозможно спутать - это могут быть легкие джазовые пассажи, быстрые мощные почти рОковые проходы,
    а также традиционные блюзовые соло, причем одно органично и легко перетекает в другое. Альбом стоит слушать уже только
    за гармонику Марка, а ведь есть еще и гитара Роббена, и мощная ритм-секция! Инструментальные дуэли двух братьев (хотя
    их и немного) - еще одна изюминка пластинки. Один из треков - Up From The Streets - написан как посвящение знаменитому
    Джону Ли Хукеру.


    Резюме: слушать всем любителям современного блюза и особенно любителям современной блюзовой гармоники.'
