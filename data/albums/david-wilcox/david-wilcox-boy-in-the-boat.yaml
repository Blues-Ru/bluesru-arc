  date: '2008-11-05'
  text: '"Blues Is the Roots,Everything Else Is The Fruits" - сказал как-то великий
    Willie Dixon. David Wilcox – как раз и есть эти самые "плоды" блюзовой музыки.
    На своем последнем альбоме известный канадский музыкант, наряду со своими собственными
    композициями (которые лежат, скорее, в плоскости рок-музыки, чем блюза), использовал
    достаточно большое количество классики жанра –песни Blind Lemon Jefferson, Blind
    Boy Fuller, Willie Dixon и др. Придало ли это блюзового чувства музыке Девида?
    Мой ответ на этот вопрос, скорее нет, чем да. Дэвид Вилкокс из той категории музыкантов,
    что могут сымитировать и чувствуют себя комфортно в любом музыкальном течении,
    но не погружаются в него слишком глубоко.


    Слушая "Boy In The Boat", меня не покидало ощущение, насколько лаконично, продуманно
    и уравновешенно играет Дэвид. С таким подходом его музыка находится где-то посередине
    между спонтанной, порой небрежной, архаичной и традиционной блюзовой музыкой и
    роком. Полностью отказаться от последнего Вилкоксу не удалось, потому на "Proffesional
    Vistim" и "Feel Like Shit" мы слышим рифы и соло гитары Девида, которые подошли
    бы, скорее, для группы колледж-рока, чем блюза.'
