- id: 1276
  author: Крокус Блюз
  mark: null
  date: '2008-06-03'
  text: Дэвид Уилкокс – ведущий рок-музыкант Канады, известный далеко за пределами
    своей страны. Более 25 лет в музыке, плотный гастрольный график, 5 золотых или
    платиновых альбомов, многочисленные награды на родине и значительное количество
    фэнов по всему миру – все это говорит о заслугах Уилкокса и его популярности.
    Дэвид впервые появился со своим Telecaster'ом в легендарной кантри-группе Яна
    и Сильвии Тайсон "The Great Speckled Bird". Набравшись опыта, он через три года
    покинул этот коллектив, чтобы основать собственную группу "David Wilcox & the
    TeddyBears", где впервые начал исполнять авторский материал. В 70-е и 80-е Дэвид
    написал и сыграл достаточное количество хитов, чем привлек внимание сначала Captilol
    Records, а затем EMI, где и издавал свои альбомы в эти годы. Живые выступления
    Уилкокса также были весьма заметными в клубной и студенческой жизни Канады. Часто
    он играл более 300 "гигов" в год. И признание не заставило себя долго ждать –
    сначала титулы студенческой сцены, а затем и номинации на Juno Awards – канадский
    аналог Grammy. Уилкокс обладает оригинальным, узнаваемым "саундом". Его музыка
    может быть охарактеризована как roots-rock и blues-rock, однако чаще всего довольно
    сложно "навесить подходящий ярлык" на этого артиста – он находится в постоянном
    поиске, эксперименте, развитии. Альбом 2001 года "Rhythm Of Love" это с успехом
    подтверждает.
- id: 1383
  author: Константин Колесниченко
  mark: 6
  date: '2008-12-15'
  text: Нет, на обложке не изображены клоны знаменитого футбольного рефери Пьера Луиджи
    Колины, на ней знаменитый канадский рок музыкант Дэвид Вилкокс. Он совсем не блюзмен,
    но, как и многим западным музыкантам его поколения, блюзовая музыка не чужда Вилкоксу.
    Безусловно, в конечном итоге, получается у него, конечно же, не совсем чистый
    жанр. Есть композиции откровенно роковой направленности, вроде первой "Hook It
    Boy", но следом за ней идет красивая и расслабленная "High Water Rising". Так
    построен весь альбом, музыка которого звучит очень эклектично, – жесткие композиции
    перемежаются с более мягкими, близкими к року в духе, например, John Hiatt. Нужно
    отметить, что большая часть материала - это заслуга Давида, а это не только музыка,
    но и довольно неплохие тексты.
