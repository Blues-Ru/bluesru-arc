- id: 819
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-20'
  text: 'Хенри Батлер - черный, слепой клавишник, певец и автор из Нового Орлеана. Он большой мастер игры на пианино - это
    волшебно. На этом диске Батлер мешает в одну кучу блюз, буги, фанк, соул, поп, госпел, джаз и ньюорлеанский ритм-н-блюз.
    Очень эклектично и разнообразно. Хенри много поет (хотя инструменталы тоже есть), и я могу сразу сказать, что мне его
    голос не нравится; он какой-то пафосный и оперетточный (это один минус). Второй небольшой минус - это те песни, которые
    банальные буги-блюзы и поп-соул (но этого мало). Почти все песни тут написал сам Батлер, но есть интересный вариант классической
    "Iko Iko".


    Если бы не вокал Хенри и пара песен, я бы поставил этому диску твердую пятерку.'
