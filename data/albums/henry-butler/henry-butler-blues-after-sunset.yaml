reviews:
- id: 336
  author: Андрей Евдокимов
  mark: 5
  date: '2003-12-04'
  text: 'Это пятый альбом в дискографии слепого пианиста-певца, но он - самый блюзовый среди других его альбомов с мягкой
    джазовой музыкой. Не слишком яркая работа, вполне послезакатная - идеальная, что называется, "для фона". (исключение -
    "Death Has No Mercy" - заставляет задуматься, главным образом, о том, что певец - не Поль Робсон). Большая часть треокв
    - фортепиано соло, лишь на некоторых треках приправленное игрой двух признанных в блюзе стилистов-виртуозов: Snooks EAGLIN
    (гитара), Mark KAZANOFF (губная гармоника). Надобно признать, что AMG дает этому альбому сугубо положительную рецензию.'
- id: 906
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-11-27'
  text: 'Батлер - слепой пианист из Нового Орлеана. Виртуоз в джазе, блюзе и ритм-н-блюзе. Он также поет глубоким, низким,
    несовременным голосом. На этом диске нет ритм-секции, ему помогают друзья из Нового Орлеана: Снукс Иглин на гитаре и Марк
    Казанофф на гармошке. Не все вещи со словами, есть инструменталы.


    Хороший альбом, но лично мне не хватает ритм-секции. Когда Батлер играет один, кажется, что ты одиноко сидишь в кабаке.
    Любителям Доктора Джона этот диск очень понравится. Есть тут довольно интересное исполнение "Death Has No Mercy" (совсем
    не похоже на гитарные версии).'
