  date: '2024-03-14'
  text: 'Американский хитмейкер итальянского происхождения Дион, известный у нас в
    первую очередь по хиту The Wanderer (перепетому в том числе и Status Quo), продолжает
    записывать интересные альбомы, даже перевалив за восемьдесят. В июне 2020 года
    Дион выпустил диск Blues with Friends на независимом лейбле Keeping the Blues
    Alive Records, который был создан Джо Бонамассой и Роем Уэйсманом специально для
    блюзовых музыкантов. Этот диск занял первое место в топе блюзовых альбомов Биллборда.


    Следующий диск Диона - Stomping Ground - был записан в период пандемии и вышел
    19 ноября 2021 года на том же лейбле и создавался по тому-же рецепту с привлечением
    множества музыкантов мировой величины - Эрика Клэптона, Марка Нопфлера, Питера
    Фрэмптона, Сонни Ландрета и многих многих других. Диск получился вполне достойный
    и - также как предыдущий - занял первую позицию топа блюзовых альбомов Биллборда.


    А 8 марта 2024 года на том же лейбле вышел третий "коллоборационистский" диск
    Диона - в этот раз это 12 дуэтов с представительницами прекрасного пола, включая
    звезд блюза, соул и кантри. Результирующий коктейль разнообразных разновидностей
    блюза и кантри замешан на мощной рОковой основе и иллюстрирует все разнообразие
    американской музыки в исполнении ведущих исполнительниц. В свои 84 года Дион записал
    очередной энергичный и заводной альбом, не растеряв при этом своих вокальных,
    композиторских и исполнительских талантов. Отличная работа большого мастера в
    сопровождении талантливых гостей - Шимекии Коуплэнд, Рори Блок, Сью Фоли, Сьюзан
    Тедески, Дебби Дэвис, Джоан Шо Тэйтор, Карлин Картер и других.'
