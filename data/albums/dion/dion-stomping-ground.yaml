  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2022-10-31'
  text: 'Дио&#769;н (полное имя: Дио&#769;н Диму&#769;ччи) - американский певец, популярный в 1950-1960 годах. В конце 1950
    годов со своей группой Belmonts достиг статуса подросткового идола с такими хитами, как "I Wonder Why" и особенно "A Teenager
    in Love" (5-е место в американской "горячей сотне"). В 1960 году ушел из группы и уже один продолжил серию больших хитов
    с такими песнями в первой десятке "Билборда", как "Runaround Sue" и "The Wanderer". Популярность певца была очень высокой
    вплоть до начала в середине 1960-х "Британского вторжения", приведшего к изменению музыкальных вкусов публики. Песня "Runaround
    Sue" в исполнении Диона входит в составленный Залом славы рок-н-ролла список 500 Songs That Shaped Rock and Roll. - Из
    Википедии


    За свою долгую карьеру Дион выпустил более 40 альбомов, был номинирован на Грэмми, записал 11 хитов из первой десятки
    Биллборда. В 1989 году он был введен в зал славы рок-н-ролла. В 2002 году Дион был введен в зал славы премии Грэмми за
    песню "Runaround Sue".


    Американский хитмейкер итальянского происхождения Дион, известный у нас в первую очередь по хиту The Wanderer (перепетому
    в том числе и Status Quo), продолжает записывать интересные альбомы, даже перевалив за восемьдесят. В июне 2020 года Дион
    выпустил диск Blues with Friends на независимом лейбле Keeping the Blues Alive Records, который был создан Джо Бонамассой
    и Роем Уэйсманом специально для блюзовых музыкантов. В создании альбома Диону помогали Ван Моррисон, Джефф Бек, Пол Саймон,
    Брюс Спрингстин и другие звезды. Этот диск занял первое место в топе блюзовых альбомов Биллборда.


    Следующий диск Диона - Stomping Ground - был записан в период пандемии и вышел 19 ноября 2021 года на том же лейбле и
    создавался по тому-же рецепту с привлечением множества музыкантов мировой величины - Эрика Клэптона, Марка Нопфлера, Питера
    Фрэмптона, Сонни Ландрета и многих многих других. При этом приглашенные звезды не тянули одеяло на себя, и их партии вполне
    органично вписались в сочиненную Дионом музыку, тем самым только украсив ее. В отличие от диска 2020 года, на этом альбоме
    среди звезд преимущественно гитаристы, а за вокал в основном отвечает сам автор (конечно, за эти годы вокал Диона слегка
    подсел, но это ни в коей мере не портит отличную музыку). За исключением кавера Red House Джими Хэндрикса весь материал
    авторский. Продюсировали Дион и Уэйн Худ, который также заведовал аранжировками и записал партии бас-гитары, органа, клавишных
    и ударных. Диск получился вполне достойный и - также как предыдущий - занял первую позицию топа блюзовых альбомов Биллборда.'
