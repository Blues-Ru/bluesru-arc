  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2023-05-04'
  text: 'За свою долгую карьеру Дион Димуччи выпустил более 40 альбомов, был номинирован
    на Грэмми, записал 11 хитов из первой десятки Биллборда. В 1989 году он был введен
    в зал славы рок-н-ролла. Песня "Runaround Sue" в исполнении Диона входит в составленный
    Залом славы рок-н-ролла список 500 Songs That Shaped Rock and Roll. В 2002 году
    Дион был введен в зал славы премии Грэмми за песню "Runaround Sue".


    Американский хитмейкер Дион, известный у нас в первую очередь по хиту The Wanderer
    (перепетому в том числе и Status Quo), продолжает записывать интересные альбомы,
    даже перевалив за восемьдесят. В июне 2020 года Дион выпустил диск Blues with
    Friends на независимом лейбле Keeping the Blues Alive Records, который был создан
    Джо Бонамассой и Роем Уэйсманом специально для блюзовых музыкантов. В создании
    альбома Диону помогали многочисленные друзья - Ван Моррисон, Джефф Бек, Пол Саймон,
    Брюс Спрингстин, Сонни Ландрет, Брайан Зетцер, Билли Гиббонс, само собой Джо Бонамасса
    и другие звезды. Аннотация к альбому написана Бобом Диланом. С такой командой
    диск уж точно заслуживает внимания - уже просто послушать игру Бека, Зетцера,
    Ландрета и других грандов дорогого стОит.


    Этот диск совершенно заслуженно занял первое место в топе блюзовых альбомов Биллборда
    (9 недель на первой позиции и 59 недель в чарте). Альбом также попал в чарты Англии,
    Германии, Франции, Италии, Канады и Австралии. Журнал American Songwriter назвад
    песню "Song for Sam Cooke (Here in America)" "лучшей из лучших песен 2020 года".
    В 2021 году песня "Blues Comin'' On" получила номинацию на блюзовую награду, а
    сам диск получил статус "любимого блюзового альбома".


    В отличие от традиционного подхода к записи дуэтов с приглашенными артистами,
    когда исполняются преимущественно каверы блюзовой классики, весь материал альбома
    - новый и авторский, написан почти полностью тандемом Майка Акуилины и Диона ДеМуччи.
    Продюсировали Дион и Уэйн Худ, который также заведовал аранжировками и записал
    партии бас-гитары, органа, клавишных и ударных. А уж вклад приглашенных друзей
    каждый сможет оценить сам во время прослушивания.'
