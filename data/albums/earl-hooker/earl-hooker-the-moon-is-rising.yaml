- id: 1147
  author: Дмитрий Казанцев
  mark: 8
  date: '2007-10-28'
  text: 'Тут почти 80 минут музыки. Первые 8 треков - это альбом 68 года HOOKER''N''STEVE (Steve Miller - органист). Остальные
    вещи - это редкие записи и джемы на фирме Arhoolie 68-69.


    Уникальная игра слайдом и без, много холла на гитаре - это фирменные дела Хукера. Он мало поет сам, но поют его коллеги
    по группе, а инструменталы тоже хороши. Игра сырая и неаккуратная, но есть в этом что-то совсем не попсовое даже для блюза.'
