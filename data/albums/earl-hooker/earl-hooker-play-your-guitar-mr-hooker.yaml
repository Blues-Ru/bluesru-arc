  author: Дмитрий Казанцев
  mark: 8
  date: '2005-06-14'
  text: 'Такой вот интересный сборник выходил на фирме Black Top в 1985 году. Компиляция состоит из 13 треков, записанных
    Хукером в 1964-1967 годах. Записи прекрасного качества, с Эрлом играет довольно большая группа - ритм-гитара, клавиши,
    духовые, бас, барабаны. Сам Хукер поет лишь в одном треке, но в других номерах ему помогают: A.C. Reed, Little Tommy,
    Muddy Waters. Но главное на этом диске - это гитара Хукера и его своя подача. Среди известных блюзов тут есть: All Your
    Love (Otis Rush), Frosty (Albert Collins), Reconsider Baby (Lowell Fulson), Dust My Broom (Elmore James).


    Хороший, полезный диск. Удивительно, что эти (редкие) записи такого высокого качества!'
