  author: Дмитрий Казанцев
  mark: 7
  date: '2005-08-19'
  text: 'Вот такой интересный сборник сделали японцы; на нем 29 треков, которые Хукер записал с разными людьми в период 1959-1963.
    Среди музыкантов такие звезды блюза, как: Fred Below - drums, Lafayette Leake - piano, Jack Myers - bass, Pinetop Perkins
    - piano, A.C. Reed - sax/vocal, Junior Wells - harmonica/vocal. Это все очень приятно и интересно, конечно. Музыка по
    блюзу, в основном, но ритм-н-блюзовые номера тут тоже есть. Надо сразу скзать, что большинство треков инструментальные
    (Эрл редко пел вообще). Стоит ли говорить, что Хукер - великолепный и своебразный соло-гитарист.


    А теперь о плохом. Записи почти ужасного качества, сделаны с виниловых дисков, которые были далеко не "в нуле". Очень
    трудно получать удовольствие от таких звуков (не путать с информационным кайфом и ПОЗНАНИЕМ).


    Интересный, полезный сборник, но далеко не все могут слушать музыку в таком качестве.'
