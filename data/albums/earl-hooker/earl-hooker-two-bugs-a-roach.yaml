- id: 721
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-06-14'
  text: 'Еще один замечательный блюзмен по фамилии Хукер. Он незаслуженно забыт и
    неизвестен, а ведь он был одним из первых, кто начал использовать интересные звуки
    в блюзе (вау-вау-гитары, обработка ревербератором, игра на двухгрифовой гитаре).
    Все это становится понятным, когда узнаешь, что Эрл записал свой первый диск только
    в 1968 году, а в 1970 он уже скончался (в возрасте 41 года).


    "Two Bugs" - дебютный альбом Хукера, он был выпущен в 1966 году фирмой Arhoolie.
    В оригинале было 9 треков, а на компакт-диске добавлено еще 5 (записи 1968-1969
    годов). С самого начала альбома слышно, что это ИНТЕРЕСНЫЙ и ОРИГИНАЛЬНЫЙ блюз.
    "Two Bugs And A Roach" - инструментальный трек с шуточками, а тема в нем почти
    такая же, как в "Mary Had A Little Lamb" (Buddy Guy). "Wah Wah Blues" - классный
    инструментал с использованием "квакушки". "Anna Lee" - невероятной красоты трек
    (довольно известный, конечно).


    На диске много инструменталов; все они разные по звуку и аранжировкам - очень
    интересно. С Эрлом играет малый состав - барабаны, бас, орган/пианино (+ Carey
    Bell на гармошке в некоторых треках) - так что весь акцент сделан на его НЕОБЫЧНОЙ
    манере игры на гитаре (она уникальна). Хукер - не виртуоз, его игра грешит неточностями
    и "грязью", но идеи и ЗВУКИ великолепны. Вокальных блюзов тут мало, и не все поет
    сам Эрл - петь ему помогают Carey Bell и Andrew Odom.


    Эту пластинку я знаю с детства, может еще и поэтому я испытываю к ней такие теплые
    чувства. Но переслушав ее еще раз в расширенном варианте, я понял, что мое мнение
    об этом диске не изменилось - это шедевр (не смотря на то, что местами группа
    совсем криво и "мимо" играет).'
