  author: Андрей Евдокимов
  mark: null
  date: '2005-09-30'
  text: 'Опять Grammy.


    Набирая темп на первых двух номерах, Гай исполняет два истошных блюза в ключе
    своих первых записей вроде Stone Crazy, но с поправкой на утяжеленное интенсивное
    звучание новой эпохи: She Is A Superstar собственого сочинения и I''ll Go Crazy
    (Я с ума сойду) Джеймса Брауна, бывшего в этом стиле для него эталоном. Спокойная
    заглавная песня - дуэт с Bonnie Raitt, с мелодичной ее слайд-гитарой, скорее ближе
    к кантри-звучанию. Автор ее - опять же Джон Хиитт (см.выше).


    She Is Nineteen Years Old (Ей девятнадцать лет) сочинения Мадди Уотерса и по аранжировке
    является явным поклоном памяти отца чикагского блюза. Some Kind Of Wonderful (Какая-то
    чудесная) - моторный дуэт с британским ветераном Paul''ом Rodgers''ом, прославившимся
    в 60-х в группе Free, а в 1993г. выпустившим примечательный "Tribute To Muddy
    Waters", где Бадди Гай сыграл соло-гитару на заглавном треке.


    Последний, появляющийся по ходу альбома гость - John Mayall. Он поет и играет
    на ф-но на блюзе I Could Cry (Я едва не расплакался) сочинения давнего, но, оказывается,
    отнюдь незабытого друга Бадди Гая - Junior''a Wells''a. У Мэйэлла с Бадди Гаем
    есть одна общая черта в биографии - оба они изучали блюз заочно, по пластинкам
    и радиопередачам, поскольку в той округе, где они росли, один в Манчестере, другой
    в Луизиане, просто поблизости не было ни одного реального блюзмэна, кто мог бы
    показать приемы игры, так что их первые открытия, что как играется - исключительно
    их личное достижение... Может быть, и наложившее характерное клеймо яркой индивидуальности
    стиля. Альбом Бадди Гай завершил новосочиненным своим блюзом, но на самую классическую
    тему и вполне в духе delay technic Мадди Уотерса: Country Man (Деревенский).'
