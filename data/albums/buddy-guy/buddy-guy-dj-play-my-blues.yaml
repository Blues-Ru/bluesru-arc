- id: 2009
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-11-16'
  text: 'Записанный в декабре 1981 года в чикагской студии, данный альбом является одним из лучших в творчестве Бадди. На
    момент записи Бадди уже давно превратился в настоящего мастера, что он наглядно демонстрирует своей игрой. Альбом классического
    чикагского блюза с феноменальной гитарной техникой Гая, которого поддерживают высокопрофессиональные музыканты с Рэем
    "Киллером" Аллисоном на ударных, включая гостевое участи брата Бадди - Фила.


    Альбом бескомпромиссного блюза, идущего от самого сердца музыканта, который на момент записи был в самой лучшей форме.'
