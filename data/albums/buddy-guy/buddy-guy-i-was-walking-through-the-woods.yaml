- id: 458
  author: Дмитрий Казанцев
  mark: 4
  date: '2004-02-14'
  text: 'Это сборник Бадди на Чесс. Записи 60-х годов; качество записи просто ужасно
    порой, но что-то вполне съедобно. Орущий, театральный, пафосный вокал Бадди уже
    присутствует, как уже живет его дерганная, нервозно-кривая игра на гитаре. Вдумчивость
    и мудрость отсутствует напрочь, но есть энергия и какой-то нездоровый угар. Есть
    еще один неприятный момент - постоянно одинаково играют духовые, которые тут вообще
    не очень нужны.


    Оценка 2 балла. Ну как же могли пропустить такое жуткое качество? Несколько вполне
    приличных треков ("Let Me Love You Baby", например) просто невозможно слушать.
    Манера Бадди неоднозначна, "музыканты шутят" встречаются с пафосом и мачо-прокламациями.
    "No Lie" - лучший трек, но его тоже очень тяжело слушать из-за мути в звуке. Диск
    нужен только любителям Бадди и тем, кому близки впечатления от музыки "на грани
    фола".'
