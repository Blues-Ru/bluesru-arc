- id: 901
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-11-27'
  text: 'Альбом сразу начинается с классной соул-песни Кертиса Мэйфилда "Now You''re Gone"; Бадди поет фальцетом, таким образом
    подражая типичной манере великого Кертиса. Второй трек - знаменитый хит Стива Кроппера (Stax Records) "99 & A Half" (кто
    только не исполнял эту песню); Бадди Гай сделал довольно традиционную, но жесткую ритм-н-блюзовую обработку. "What Kind
    Of Woman Is This" - прифанкованная, ритм-н-блюзовая песня Бадди; очень хороша, очень в духе Эла Грина. "Somebody''s Sleeping
    In My Bed" - блюзовый номер; у Гая интересный звук соло-гитары, есть в нем что-то новое и необычное. "I Put A Spell On
    You" - знаменитый хит Джея Хокинса; Бадди играет его очень жестко, в стиле латин-рока (продюсер - Карлос Сантана) - это
    интересно! "On A Saturday Night" - и еще один хит Кроппера; прекрасная песня и исполнение в духе 60-х. Седьмой трек -
    великолепный хит божественного Билла Уитерза "Ain''t No Sunshine"; Бадди делает фанковую аранжировку, но с приджазованным
    звуком (Трэйси Чепмен поет вместе с ним). "Dreams To Remember" - соул-песня легендарного Отиса Реддинга, Джон Мэйер поет
    ее вместе с Бадди. "Lay Lady Lay" - прекрасная и известнейшая песня Боба Дилана, здесь Бадди Гай звучит модно: живой хип-хоп-ритм,
    но стил-гитара и необычные звуки других гитар тоже тут (Энтони Хэмилтон, новая звезда нео-соула, отлично поет дуэтом с
    Бадди). "Cheaper To Keep Her / Blues In The Night" - две темы в одной ритм-н-блюзовой песне; она длится более 6 минут.
    "Cut You Loose" - композиция Мела Лондона, она длится почти 8 минут! Бадди делает что-то в духе блюз-рока "Voodoo Chile"
    Джими Хендрикса. "The Price You Gotta Pay" - песня Кеба Мо. Почти госпел-исполнение; хороший номер. "Do Your Thing" -
    slow funk Айзака Хейза. Сказочная музыка и исполнение!


    Ритм-н-блюзовый соул-альбом. Очень интересно и разнообразно. Местами чуть попсово, но это не портит жанр. Можно сказать,
    что две песни на 14 минут в конце диска - это многовато, но и на такое найдется любитель. Очень серьезный тут состав:
    на ударных Стив Джордан, на басу волшебник Уилл Ли, Дэнни Кортчмар на гитаре и сам БЕННИ УОРРЕЛЛ на клавишах! Тут также
    много гостей: Tracy Chapman, Keb Mo, Ivan Neville, Willie Mitchell, Keith Richards, Carlos Santana и другие. Добротно
    и душевно сделано; прекрасный материал!


    А ведь Бадди будет 70 в следующем году. Его предыдущий альбом 2003 года был совсем в другом стиле и жанре - там он играл
    акустический блюз; мне он тоже очень понравился, кстати.'
- id: 984
  author: Константин Колесниченко
  mark: 10
  date: '2006-04-06'
  text: 'Чтобы узнать, как можно принципиально поменять стилистику своей музыки, но при этом полностью сохранить свой музыкальный
    стиль и почерк – послушайте последний альбом Buddy Guy "Bring ‘em In". В последнее время Бадди удивляет: он выпустил неожиданно
    "тяжелый" и "грязный" альбом "Sweet Tea", потом потрясающий акустический "Blues Singer", а теперь вот этот, действительно
    шедевр "Bring ‘em In" - в соул ключе.


    Гай разнообразен на этом альбоме, звучит абсолютно по-разному! Тут есть типичные для него тягучие и упругие номера, а
    есть прозрачные по звуку и лирике песни вроде хита Bill Withers "Ain''t No Sunshine" и дилановской (!!) "Lay Lady Lay".
    На альбоме играют музыканты высшей лиги, как в группе (Willie Weeks, Steve Jordan, Danny Kortchmar, Andrew Love и т.д.),
    так и в гостях (Carlos Santana, Keb Mo, Tracy Chapman, Keith Richards и т.д.). Нервный и немного яростный голос Бадди
    идеально подходит для этой музыки – песни, ставшие известными в исполнении: Curtis Mayfield, Otis Redding, Isaac Hayes
    и др.


    И последнее, об обложке альбома – на ней мы не видим 70-летнего старика, а перед нами подтянутый, широкоплечий мужчина,
    он улыбается и дает понять - у него еще много сил и идей, музыка делает его молодым!'
- id: 1201
  author: Артем Липатов
  mark: null
  date: '2008-01-29'
  text: 'Короля чикагского блюза Бадди Гая в последние годы сильно клонит - то в одну, то в другую сторону. Неожиданно мощно
    и новаторски выступив на без дураков гениальном, провидческом альбоме 2001 года Sweet Tea, в котором виднелись реальные
    перспективы развития жанра (и перспективы практически необозримые), он словно бы испугался Господней руки, которая им,
    судя по всему, водила. Именно поэтому следующий его диск оказался пусть высококачественным (мастерство не пропьешь!) но
    абсолютно салонным при этом сборником кавер-версий блюзовой классики.


    Новый альбом кажется шагом… не то чтобы вперед и даже не шагом самого Гая, а решением продюсера - а в этой роли выступил
    знаменитый барабанщик Стив Джордан - сделать артиста более доступным широким массам. Естественно, с пониманием специфики
    жанра, предпочтений артиста, эт цетера. Предполагаю, кстати, что и сам артист с любопытством отнесся к идее близости к
    широким массам - впрочем, как там было на самом деле, нам вряд ли когда-то станет известно. Мы имеем компакт-диск, и все.


    А на диске - сплошь обратно же кавер-версии (лишь одна вещь принадлежит авторству нашего героя). Да не блюзовые, а, по
    большей части почерпнутые из анналов музыки соул: среди авторов встречаем Айзека Хэйса, Отиса Рединга, Стива "Полковника"
    Кроппера, Кертиса Мэйфилда. Впрочем, затесался среди них и один блюз Кеба Мо, а также Lay Lady Lay Боба нашего Дилана,
    но это так, не со зла. Имеется также аккомпанирующий состав, состоящий из именитых персон – ту и тот же Джордан, и Дэнни
    Кортчмар, и Берни Уоррел, а также несколько партнеров по бэк-вокалам да дуэтам. Среди них - пихаемый нынче во все возможные
    дыры вундеркинд Джон Майер, который думает, что он копирует Отиса Рединга в I''ve Got Dreams To Remember, продюсер одной
    вещи (I Put A Spell On You) Сантана, который изо всего, что ему попадает в руки, пытается сделать то Oye Como Va, то Black
    Magic Woman, Кит Ричардс и Трейси Чапмен. К двум последним претензий предъявить вроде как и не за что - как и к новой
    соул-звезде Энтони Хамильтону, отлично справившемуся как раз с дилановской песней. В общем, за образец взяты два вектора
    - на смену жанра и на дуэты, которые хорошо продаются. И то, и другое так или иначе получилось: из соула Гай все равно
    сделал круто сваренный, густой, нажористый блюз, и даже из самых нейтральных (вроде Cheaper To Keep Her) вещей прет натуральная,
    ничем не разбавленная энергия, а дуэты не выглядят натужными. Хорошая, короче говоря, пластинка, крепкая. Не стыдная.


    Только вот почему-то хочется выкинуть и гостей, и чужие вещи прочь, оставив перед микрофоном одного Бадди - можно даже
    без ансамбля. И почему бы это?'
