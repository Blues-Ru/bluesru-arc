- id: 865
  author: Андрей Евдокимов
  mark: null
  date: '2005-09-30'
  text: 'Halleluyah!!! Grammy!! HOT 10! Прорыв к славе не как следствие компромиса с законами коммерции, а как нежданный плод
    верности главному делу своей жизни (плюс применение добрыми коммерсантами законов рекламы и торговли к бескомпромисному
    блюзу, право на который Бадди Гаем утверждено десятилетиями бескорыстного служения музыке). Традиционное блюзовое содержание
    при великолепно свежей музыкальной подаче, по духу соответствующей 90м годам, - это органичнейшее сочетание традиций и
    современности составляет самое ценное качество всех альбомов Бадди Гая 90х годов. Тайтл первому из них дал мощный размеренный
    блюз, специально сочиненный Бадди Гаем к первому заходу в студию после 12-летнего перерыва; в нем он горько признает:
    "Мне не выиграть никак, просто потому что мне на кон поставить нечего". Но зато он стоит на своем, не отрекаясь от блюза
    ни за какие коврижки. Трек звучит с тем огромным запасом энергии, который не выплеснуть в один короткий миг, которого
    хватит вперед еще на десятилетия и десятилетия блюзовой судьбы.


    Второй густой блюз - сочинение американского умного песенника John''a Hiatt''a, чьими творениями пользуются те представители
    приблюзованного или прикантрованного поп-рока, которых вполне можно считать людьми достойными и честностарающимисякакмогут.
    "Where Is The Next One Comming From - Откуда грянет следующий" (подразумевается "подарок судьбы") содержит мелодию далекую
    от блюзовых канонов, но Гай добавляет soulовые дудки и подпевки, так что трек ложится в блюзовый альбом вполне. Тем более,
    что уж по содержанию 100% блюз: "У меня была работа, но меня сократили. У меня было сердце, но оно стало слишком мягким.
    У меня была подруга, но она мне врала. У меня была жена - но она умерла. И мне уже все равно, откуда грянет следующий.
    И сам прошу - давай, давай, пошли мне еще"- отлично ложится на размеренную блюзовую походку. Бряцает здесь неразличимые
    аккордики весьма тогда популярный Mark Knopfler.


    А дальше начинаются знойные кайфы: блюз чикагского пианиста Eddie Boyd''a "Five Long Years": "Пять долгих лет пахал ради
    этой бабы на металлургическом заводе, все денежки до цента приносил домой, и у нее хватило наглости прогнать меня прочь.
    Если с вами когда-то обходились не по-справедливости, вы поймете, что я чувствую" Неожиданно вкусно серябряными молоточками
    на фортепиано играет некто Pete Wingfield (о котором ничего не знаю, а теперь хотел бы). Но когда врываются густые басовитые
    спокойные фразы баддигаевского Фендера (сам-то он поет не без истерики) - только тогда и понимаешь, как же та баба глупа,
    что такого солидного человека проморгала.


    На хитовой MUSTANG SALLY сира Мака Райса солирует гитара Jeff''a BECK''a, британского ритмэндблюзового ветерана, друга
    BG еще с первого его посещения Англии в 60х. Eric Clapton и Jeff Beck играют на еще одном soulовом номере Early In The
    Morning. А дальше до конца альбома - только блюз, и только высокооктановый. Баддигаевский "Too Broke To Spend The Night
    - Нечем даже за ночь заплатить" - искрит злостью на финансовые обстоятельства.


    Классический "Black Night" Jessie Robinson''a (блюзовая "Темная ночь") - вот this is really COOOOL! Архи-медленных 7''42"
    под рояль и электроорган вводят слушателя в сомнамбулическо-левитационное состояние! Когда работа над альбомом уже началась,
    пришло известие о гибели SRV. Для Бадди Гая это была личная горькая утрата. И два последних трека - посвящение памяти
    друга. (На оборотной стороне компакта - фотография, где за спиной печально склонившего голову Бадди Гая - не в вокусе
    - фотография гитариста в широкополой шляпе и цветастой рубашке. Пусть посторонние не знают, свои - поймут и разделят эту
    скорбь.) Гай сыграл тот блюз Диксона, который SRV разучивал в детстве по его, Бадди Гая, пластинке,- Let Me Love You Baby
    - но теперь уже он перенимал у Стиви его манеру исполнения. Закольцовывается в бесконечную ленту взаимообратная связь
    блюзовых поколений и школ: чикагской 60х и техасской 80х.


    Финальный инструментальный трек "Remembering Stevie/Вспоминая Стиви" - это именно душа музыки Стиви и его блюзовые постулаты,
    но в преломлении восприятия Бадди Гая.'
- id: 864
  author: Ozon.Ru
  mark: null
  date: '2005-09-30'
  text: 'Классический блюз, особенно интересный в чикагском стилевом направлении, нашел свое лучшее воплощение в творчестве
    Buddy Guy. Это смелый инноватор, чувственный вокалист и блестящий шоумэн. Он начинал в 50-х, прошел яркий и противоречивый
    карьерный путь. В 80-ых был значительный перерыв, а в 1991 начался самый бурный и успешный период. Бадди получил три премии
    Grammy (и еще одну статуэтку после миллениума). Он стал желанным гостем на популярных телешоу (David Letterman, например).
    Его клуб в Чикаго стал местом, попадающим во все туристические и культурные справочники. В общей сложности продано более
    2 миллионов пластинок артиста. Бадди Гай получил 19 наград W.C. Handy Blues (самая престижная премия в мире блюза), что
    является рекордом.


    Альбом ''Damn Right I''ve Got The Blues'' заработал один из Grammy, попал на 2 строку чарта Heatseekers Billboard. Вместе
    с Бадди Гаем пластинку записывали Эрик Клэптон, Марк Нопфлер и Джефф Бек, которые всегда были поклонниками блюзмена. Сейчас
    эта пластинка выходит с двумя бонус-треками, которые не входили в состав альбомов - ''Doin'' What I Like Best'' и ''Trouble
    Don''t Last''.'
- id: 2012
  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2011-11-16'
  text: 'Отличный студийный альбом Бадди, за который он совершенно заслуженно получил Грэмми в номинации "лучший альбом современного
    блюза". Несмотря на то, что авторского материала меньше половины и альбом содержит много каверов, они исполнены настолько
    хорошо и энергично, что слушать одно удовольствие.


    В качестве гостей отметились такие небезызвестные персоны, как Эрик Клэптон, Джефф Бек и Марк Нопфлер'
