  author: Дмитрий Казанцев
  mark: 8
  date: '2003-08-19'
  text: 'Два знаменитых черных записали диск в сопровождении не менее знаменитых белых.
    Тут много известных людей: Эрик Клэптон, ЭйСи Рид, Доктор Джон, Кард Рэдл, Джим
    Гордон и даже J. Geils Band. Диск записан неровно потому, что писался в разные
    дни и в разных местах.


    Альбом начинается убойно - "A Man Of Many Words" - БГ поет этот классный соул-номер
    и шумно, и суетно пилит на гитаре. Потом шустрый блюз "My Baby She Left Me" -
    Джуниор поет вещь Сонни Боя Уилльямсона. Дальше идет "два в одном" - "Come On
    In This House/Have Mercy Baby" - две полупесни Уэллса в классном исполнении (чем-то
    напомнило мне подачу Хаулин Вулфа). Ну а теперь "T-Bone Shuffle" - автор ясен,
    не так ли? "A Poor Man''s Plea" - вот это уже очень здорово - отличный блюз Джуниора
    в стиле Хукера. "Messin'' With The Kid" - а это просто хит для Уэллса (и Blues
    Brothers позднее). "This Old Fool" - такой залихватский ритм-н-блюз Бадди. "I
    Don''t Know" - прям Мадди Уотерз, а что еще ждать от Джуниора, когда он поет классические
    блюзы? "Bad Bad Whiskey" - Бадди поет хороший блюз про свои сложные отношения
    с алкоголем - все страдают от этого дерьма, не так ли? "Honeydripper" - а это
    что-то типа буги-вуги в стиле Джей Джей Кейла. Играют-играют, а ты гадаешь - запоют
    или нет? Так и не решились.


    Ну что сказать, это - не самый лучший альбом Бадди, и точно не лучший для Джуниора.
    Просто приличная блюзовая пластинка.'
