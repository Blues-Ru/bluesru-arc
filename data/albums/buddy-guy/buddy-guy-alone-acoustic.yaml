- id: 867
  author: Андрей Евдокимов
  mark: null
  date: '2005-09-30'
  text: Акустический оазис в электроблюзгдетодажероковом наследии Бадди Гая. Американский alligatorовский вариант включает
    в себя на пять треков больше, чем европейское первоиздание Isobel. Начав с собственных блюзов, Гай и Уэллс (и солируя
    по очереди, и дуэтом) перешли к классике. Гай спел даже ту песенку J.L.Hooker'a, которую когда-то разучивал на завалинке,
    изгнанный из дома братьями-сестрами. Альбом несет такое ясное ощущение интимности, что, кажется, записан был непременно
    при свечах. Хотя энергичных блюзов в нем не меньше, чем эллегических.
