- id: 870
  author: Андрей Евдокимов
  mark: null
  date: '2005-09-30'
  text: 'Собственно, куда мне указывать американским звукоакадемикам, но, что касается блюза, не им мне указывать. Так что
    - вот этому альбому Grammy точно принадлежал бы по праву. Но не дали. Бадди играет с великолепным оркестриком, руководимым
    замечательным (и при том белым) гитаристом G.E.Smith''ом. За клавишными: Johnny Johnson(акустика) и Leon Pendarvis (электрика).
    Гай играет песни, которые в его репертуаре уже по лет 20-30. Успех явно пошел ему на пользу. Он легко импровизирует, из
    голоса напрочь исчезли повизгивания, блюз обрел спокойствие и уверенность. Наверное, с точки зрения юности, ищущей приключения,
    это не самый привлекательный альбом Бадди Гай. Но рано или поздно, укатавшись на крутых горках, любитель блюза обретет
    в этом альбоме - свою АРКАДИЮ.'
