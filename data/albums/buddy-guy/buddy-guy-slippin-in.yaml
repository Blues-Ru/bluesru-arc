  author: Андрей Евдокимов
  mark: null
  date: '2005-09-30'
  text: 'Наконец-то альбом без гостей, значит хозяин может позволить себе и расслабиться.
    А это качество для блюза положительное. И альбом вышел более цельным, чем предыдущий
    (<i>Feels Like Rain</i>). Наконец-то рядом с Гаем пианист Johnny Johnson. "Я забываю,
    что у меня в руках электрическая гитара, когда слышу, как Джонсон играет на акустическом
    рояле.- говорил Гай.- Это уносит меня в далекие времена, когда я слышал Эдди Бойда.
    Переворачивает во мне все и вытаскивает на поверхность самый глубокий блюз."


    Блюз на Slippin'' In глубок, един по стилю и разнообразен в оттенках. Программа
    состоит из новых и старых песен Бадди Гая и вечнозеленой блюзовой классики, вроде
    Shame Shame Jimmy Reed''a, Love Her With A Feeling L.Fulson''a, или блистяще исполненного
    блюза 7-11 F.Robinson''a, погодка Бадди Гая. На нескольких песнях Гай играет вместе
    с осиротевшей группой "Double Trouble". Поскольку они вместе играли еще в остинских
    клубах за десятилетия до прорыва к славе, Reese Wynans, Tommy Shannon и Chris
    Layton никак не воспринимаются гостями. И опять Grammy.'
