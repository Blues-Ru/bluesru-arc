reviews:
- id: 1165
  author: Константин Колесниченко
  mark: 10
  date: '2007-11-30'
  text: 'Бадди Гай одна из самых важных, символических и значимых персон блюза. Я
    думаю, что с уверенностью можно заявить: Бадди наследник ББ Кинга. Это нелегкая
    задачка, быть королем блюза. Нужно держать жанр на плаву, писать альбомы с кучей
    друзей, участвовать в шоу, в общем, быть повсюду и с каждым. Но Бадди крепок,
    все еще полон идей и музыкального мастерства. Среди последних его записей был
    и странный вязко-тяжелый "Sweet Tea"; отличный, прозрачный и интимный "Blues Singer"
    и совсем потрясающий, свежий "Bring Em In", на котором Гай затмил даже самых именитых
    гостей. Но почему Бадди стал знаменит, почитаем и любим слушателями, и не затерялся
    в массе хороших, но неизвестных блюзовых исполнителей его поколения? Я думаю,
    что ответ стоит искать не в его "Damn Right…", а гораздо раньше. Начинал Бадди
    на лейбле "Cobra" вместе с другим новатором блюза Otis Rush. Прежде, чем лейбл
    перестать существовать, Отис успел записать порядочно материала, в том числе,
    и хитов. Бадди так не повезло. Но фортуна улыбнулась молодым музыкантам - следующие
    их записи уже были на Чесс. Данный сборник - это полный набор материала, что Бадди
    записал для Чесс с 1960 по 1966 год. Материал неровный, есть сбои и в игре Гая,
    и ансамбля, есть и чистый чикаго-блюз, и приджазованные номера. Но самым интересными
    записями являются те, на которых Бадди предстает как новатор чикагского блюза,
    те на которых рождается Вест-сайд блюз. Интересно наблюдать, как Гай постепенно
    избавляется от влияния ББ в игре на гитаре и постепенно находит свой фирменный
    нервный стиль. Показательны и номера, на которых встречается старая школа в лице,
    например, Little Brother Montgomery, Sonny Boy Williamson, Robert Nighthawk и
    др. Но самый смак, это, безусловно, записи нового блюза. И тут уже в игру вступает
    молодое поколение: Gene Barge, Jack Meyers, Junior Wells, Clifton James, Matt
    Murphy, Phil Upchurch. Да, возможно, эти записи - давняя история, музыкальный
    уровень вырос, но это интересный и обязательный для изучения материал, который
    никогда не устареет.'
