  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2015-08-07'
  text: 'Бадди Гай не нуждается в представлениях - это ведущая фигура современного чикагского блюза. Новый студийник мастера
    сделан в традиционном ностальгическом ключе - начиная от заглавного посвящения себе любимому и заканчивая финальным воображаемым
    разговором с Мадди Уотресом о старых добрых временах. Из общей блюзовой канвы альбома слегка выдается пара треков - откровенно
    попсовая I got what it takes в сотрудничестве с великолепной Джосс Стоун (исходно хит Брука Бентона и Дайаны Уошингтон
    пятидесятилетней давности), а также дуэт с Билли Гиббонсом, представляющий собой если не своего рода жесткий блюз-роковый
    ЗиЗи Гай, то уж наверняка Бадди Топ.


    ОК, шутки в сторону, альбом вполне приличный и сыгран отлично, стратокастер Бадди по-прежнему хорош. Вполне к месту эпизодическое
    подключение духовых, традиционно хорош мастер-харпер Ким Уилсон, а проверенный соавтор и продюсер Том Хомбридж обеспечил
    отменный звук. Есть посвящение памяти недавно ушедшего Би Би Кинга, спетое дуэтом с Ван Моррисоном (на мой взгляд, не
    лучший трек). На альбоме присутствует кавер традиционного блюзового стандарта Too Late, но в основном это новый материал.
    Больше всего понравились Whiskey, Beer and Wine, Crying out of One Eye и Turn Me Wild. Достойная работа от блюзового патриарха,
    в которой совсем не просматривается почтенный возраст знаменитого блюзмена (ему уже 79).


    "‘Born To Play Guitar'' truly is a gem, boasting plenty of highlights that begin with the title track and it''s nothing
    short of a masterpiece." - Glide Magazine


    "Buddy Guy delivers a set of classic blues tracks on his latest release. If it doesn''t already, the world should know
    by now that Buddy Guy was born to play the guitar." - Blues Rock Review'
