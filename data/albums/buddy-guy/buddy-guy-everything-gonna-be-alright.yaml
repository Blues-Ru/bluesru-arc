  author: Дмитрий Казанцев
  mark: 7
  date: '2005-08-07'
  text: 'Еще один полуофициальный концертник Бадди и Джуниора. Его бы стоило назвать Junior Wells with Buddy Guy, а не наоборот
    - Бадди поет только первых три трека. Запись сделана на фестивале в Монтре 9 июля 1978 года, этот материал уже выходил
    в виде альбома Live in Montreux (Evidence, 1995).


    Когда поет Бадди - это не очень хорошо, мягко говоря, но начиная с четвертого трека петь начитнает Уэллс и все становится
    на свои места. Гармошка Джуниора - тоже огромный плюс для этого концерта (группа играет малым составом - барабаны, бас,
    две гитары). Ребята исполняют все свои хиты, конечно: "Things That I Used To Do", "Every Day I Have The Blues", "Help
    Me", "Messin'' With The Kid", "Got My Mojo Working". Качество записи очень приличное, и это еще один плюс. Но в целом,
    это обычный проходной концертник, в котором нет ничего нового или необычного.


    Треки с 12 по 17 - бонусы под названием "The Chicago Blues All-Stars". Две песни поет Big Voice Odom, одну - Hubert Sumlin,
    еще одну - Eddy Clearwater. Это довольно интересный материал, но он имеет мало отношения к концерту Бадди и Джуниора.'
