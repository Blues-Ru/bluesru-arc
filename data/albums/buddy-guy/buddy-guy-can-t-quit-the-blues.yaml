  author: Андрей Евдокимов
  mark: 9
  date: '2009-02-05'
  text: Этого артиста нет нужды представлять любителям блюза. Однако стоит напомнить,
    что в нынешнем году ему исполняется 70 лет, а первую пластинку он выпустил почти
    полвека назад. Просто в серии чикагских блюзовых классиков он всегда был младшим,
    и это реноме "младшего" так и закрепилось за ним, хотя уже давно он сам вышел
    в возраст "классиков". Видимо, нынешний бокс-сет из трех компакт дисков должен
    изменить это отношение. Бадди Гай – классик. Он начинал в лучшие годы лейбла Chess,
    аккомпанируя Мадди Уотерсу и Уилли Диксону, записывал первые сольные альбомы на
    авангардом для 60-х Vanguard, прошел блюзовую ссылку в Европе, джемовал со Стиви
    Реем Воэном, и совершил триумфальное возвращение на большую блюзовую сцену в 1991-м
    году. Но не обронзовел, и продолжал экспериментировать. Все эти этапы Большого
    Пути отражены в нынешнем сборнике, который можно назвать зеркалом эволюции чикагского
    электрического блюза.
