- id: 1659
  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2011-05-11'
  text: 'Блестящий новый альбом от короля чикагского блюза, который не сбавляет обороты, несмотря на 74-летний возраст. Диск
    мощный, техничный, энергичный, профессионально аранжированный и исполненный - бесспорно, один из лучших у Бадди. Жесткие
    блюз-роковые треки с безумной "сырой" гитарой Бадди перемежаются более спокойными балладами с влиянием госпел. В качестве
    гостей отметились Б.Б. Кинг и Карлос Сантана.


    Воистину Бадди Гай является "живым свидетельством" неувядаемого блюзмена, который и в свои 74 по-прежнему творчески молод
    и полон сил. Long Live the King!'
