  text: Silvertone 1998. Четвертый альбом Бадди для Силвертоун, он самый жуткий по звуку - тут такая компрессия, что идет
    чистая перегрузка (прямо как у RHCP 1999). Более того, Гай тут увлекается жесткими звуками на ударных, басу, гитаре. Такой
    тяжкий блюз-фанк-рок. Песни-то есть отменные, но такой звук... А как все хорошо у него начиналось в 1991 году на этом
    лейбле.
