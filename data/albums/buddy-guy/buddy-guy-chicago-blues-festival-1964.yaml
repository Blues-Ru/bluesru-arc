  author: Александр Панин
  mark: 5
  date: '2005-05-21'
  text: Очень неважно записанная подборка живых выступлений, не имеющих никакого отношения к чикагскому фестивалю 1964 года.
    В буклете говорится, что это вещи с концертов середины семидесятых. На диске есть ряд неожиданных треков, например, Stormy
    Monday и роллинговская Satisfaction (вот почему это точно не 1964 год!), есть хиты Leave My Girl Alone под названием Woman
    Blues и Messing With The Kid, но звучит все это просто безобразно (особенно омерзительно записан вокал). Бонусом три студийные
    вещи Бадди начала шестидесятых (разумеется, чессовские). Очень странный диск, который можно порекомендовать только комплетистам.
