  author: Дмитрий Казанцев
  mark: 8
  date: '2003-08-17'
  text: Даже и не ожидал я такого от БГ. Не поймите меня неправильно, я очень ценю шумную, грязную, порой бестолковую игру
    Бадди, его орущий, немного театральный вокал, но этот альбом совсем другой, и нравится он мне гораздо больше, чем все,
    что он сделал ранее (хотя у меня есть около десятка его ранних альбомов). То ли он постарел, то ли поумнел, то ли ему
    просто надоело бездумно шуметь и эпотировать публику, но результат налицо - отличный альбом, который не может не понравится
    любителям акустического кантри-блюза.
