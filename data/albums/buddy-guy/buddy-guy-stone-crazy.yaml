- id: 460
  author: Дмитрий Казанцев
  mark: 6
  date: '2004-02-14'
  text: Этот диск был записан во Франции в 1979 году и вышел там же на лейбле Isabel Records. Alligator выпустил его в США
    только в 1981-ом. Длинный альбом на 42 минуты, но на нем только 6 треков; ясное дело, что треки затянуты. Игра и пение
    Бадди блещут энергией и злостью, но музыкальность осталась на втором плане, к сожалению. Грязный, перегруженный звук гитары,
    кривая игра ритм-секции, истеричный вокал - вот такой блюз-рок выдает Бадди во Франции в конце 70-х. Надо отметить отличную
    игру Фила Гая на ритм-гитаре; выдержал все в стиле.
- id: 866
  author: Андрей Евдокимов
  mark: null
  date: '2005-09-30'
  text: В 1981г., когда Alligator опубликовал в США эту европейскую запись Бадди Гая, никто и подумать не мог, что когда-нибудь
    вновь будет переиздан тот первый сборник, у которого и позаимствовано название STONE CRAZY. То, что казалось вполне логичным
    в 1981г., ныне создает известную путаницу в дискографии. О содержании могу только повторить - весьма рекомендовано почитателям
    SRV для того, чтобы понять, почему же он так высоко ценил дружбу с BG. Альбом поразительно сродни молодому рьяному воэновскому
    блюзу. Слушать только ГРОМКО!
- id: 2011
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-11-16'
  text: 'Довольно интересная и одновременно специфическая пластинка, записанная в студии во Франции 31 октября 1979 года.
    На ней Бадди под аккомпанимент брата Фила и отменной ритм-секции просто "отрывается", демонстрируя свое сумасшедшее мастерство
    владения гитарой и не менее дикий вокал. Такое "сырое" звучание характерно для концертных выступлений Бадди, когда он
    безо всяких тормозов несется вперед по блюзовой колее.


    В результате получилось 40 минут неистового техничного блюз-рока, смешанного даже с психоделией в стиле Джими Хэндрикса.
    Повторюсь: пластинка на любителя - если понравится, будете слушать с удовольствием, но многие, боюсь, не дотянут и до
    конца первого трека.'
