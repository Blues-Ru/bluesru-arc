  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2013-08-05'
  text: 'Новый альбом легенды чикагского блюза поступил на прилавки магазинов 30 июля 2013 года - в день, когда Бадди отмечал
    свой 77 день рождения. Но музыка Бадди по-прежнему молода и энергична - поклонники получили сразу два диска мощного современного
    электрического блюза, условно разбитого на две части: "ритм" (диск 1 с более энергичными треками) и "блюз" (диск 2 с чуть
    более спокойными песнями).


    Не обошлось без гостей: отметились Кид Рок, Кит Урбан, Бет Харт, тройка "Аэросмитов" и Гэри Кларк младший. Исполнение
    на самом высшем уровне, аранжировки насыщенные и плотные, яркие гитарные соло, мощные духовые - чего еще желать любителю
    современного блюза? (ну разве что выкинуть 11-й трек с первого диска и вместить оба диска на один 80-минутный, ну так
    ведь тогда концепция потеряется, да и цена двойника крайне демократичная и не превышает среднюю цену одиночного релиза).


    Отличный альбом от классика жанра, который, как это и принято в настоящем блюзе, с годами становится только интереснее.
    Лучше Бадди Гая может быть только... Бадди Гай! Бесспорный номинант на блюзовый альбом года.'
