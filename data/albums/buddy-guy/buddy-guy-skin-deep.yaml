reviews:
- id: 1334
  author: Андрей Евдокимов
  mark: 9
  date: '2008-10-01'
  text: В фильме "Да будет свет" Бадди Гай наглядно продемонстрировал, кто здесь главный
    по блюзу. В своем новом альбоме он утверждает это бесповоротно. Из струны вытягивается
    пронзительная нота, или повторяется по кругу короткая нотная фигура - гитара возвращается
    от продуманных импровизаций к непосредственному пробуждению эмоций звуком и ритмом,
    как это было принято в вудуистских обрядах. Соло в Everytime I Sing the Blues
    не надо слушать, в него нужно окунуться с головой - это волшебство электроблюзового
    звукоизвлечения. Альбом не баюкает – он силой гонит в блюзовый транс. Гай снова
    запел навзрыд, как делал это более 40 лет назад в чикагской студии Chess. И это
    лучший его альбом за последние полтора десятилетия. Давно для записи он не играл
    так грубо и "напрямки", с лихой безоглядной вольностью и открытой эмоциональностью.
    Исключительно новые песни; развернутые аранжировки с электроорганом и группой
    медных; а гости (от необходимого слайд-мастера Роберта Рэндольфа до неизбежного
    Эрика Клэптона) держатся на вторых ролях.
- id: 2013
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-11-16'
  text: 'Очередной альбом последнего из когорты великих блюзменов (на момент записи
    Бадди было 72 года). По музыке - о его возрасте не скажешь, все тот же напор,
    ярость, полностью свой материал, намного интереснее предыдущей пластинки. Помогают
    Эрик Клэптон, Роберт Рэндолф и Сьюзан Тедеши. Прифанкованный блюз высшей пробы
    - с сохранением традиции, но с современным звучанием.


    Наконец Бадди смог записать такой альбом, который он всегда хотел - если угодно,
    в традиции "Бадди Гая".'
