- id: 1963
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-08'
  text: 'Одна из ведущих блюзовых групп Остина The Fabulous Thunderbirds была создана
    в 1974 году вокалистом и харпером Кимом Уилсоном и гитаристом Джимми Воэном (старшим
    братом Стиви Рэя). Настоящий успех группе принес пятый сольный альбом Tuff Enuff,
    который был первым, записанным группой для крупного международного лейбла. Диск
    добрался до 13 места в чарте альбомов Биллборда, а три сингла с него Tuff Enuff,
    Wrap it Up и Look at That, Look at that добрались соответственно до 4, 8 и 20
    места. Этот альбом оказался самым коммерчески успешным в истории группы, попытки
    повторить его успех оказались не слишком удачными, и через 3 года Джимми Воэн
    ушел из группы. Затем на сольные хлеба подался и Уилсон, но в середине 90-х он
    вновь собрал группу (потом опять распустил, затем опять собрал и т.д.).


    Для группы характерен чисто техасский блюз-роковый стиль, представляющий собой
    энергичный сплав рок-н-ролла, блюза и рока. Альбом был записан в Англии под руководством
    знаменитого уэльского рокера Дэйва Эдмундса и содержал три кавера и семь треков
    собственного сочинения. Диск энергичный, заводной и чуть более коммерческий, чем
    более ранние работы группы.'
