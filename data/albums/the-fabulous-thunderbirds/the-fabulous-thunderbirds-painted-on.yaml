reviews:
- id: 1453
  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: 'В истории блюза это едва ли не единственная группа, достигшая хитпарадных
    успехов. Но с той поры минуло 20 лет. И многие из участников удачно устроили свою
    сольную музыкальную карьеру. В том числе вокалист и харпер Ким Уилсон, один из
    ее основателей. На сегодня он считался признанным лидером среди исполнителей на
    губной гармонике. Его решение воскресить группу в прошлом году казалось неожиданным
    и нелогичным. Чтобы войти дважды в одну реку популярности и именно по старым проверенным
    рецептам, ему пришлось делать два шага назад от новых достижений. Помимо проверенной
    ритм-секции, в новый состав Уилсон пригласил двух весьма популярных на сегодня
    блюзовых гитаристов: Ника Кюррана и Кирка Эли Флетчера, чья репутация связана
    с новым вест-коаст-свингом, но никак не с техасским блюз-роком. Неожиданно в варианте
    с тремя фронтменами группа заиграла как новенькое свое хорошо забытое старенькое!
    Секреты, выведшие их в чарты, не были забыты: это хороший знакомый плотный техасский
    шафл, сыгранный вроде бы с небрежной разболтанностью, но четко и с роковой энергетикой
    – фирменный звук T-Birds. Лучший их диск за последние полтора десятилетия.'
