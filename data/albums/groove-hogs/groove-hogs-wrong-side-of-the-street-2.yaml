- id: 130
  author: Алексей Калачев
  mark: 6
  date: '2003-05-29'
  text: '"Румфул Оф Блюз" - не единственный биг-бэнд, играющий ритм-энд-блюз. И "Грув Хогз" являет прекрасное тому подтверждение.
    У них обширная духовая секция из пяти музыкантов и свой собственный стиль, который некоторые музкритики называют "соул-рок".
    При массированном присутствии очень хорошей "меди" группа крепко давит и на акселератор гитарного звука. По этой причине
    музыка их более жесткая, плотная и бескомпромиссная в сравнении с другими составами подобного свойства.'
