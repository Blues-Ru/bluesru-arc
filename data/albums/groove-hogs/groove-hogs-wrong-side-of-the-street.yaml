- id: 110
  author: Алексей Калачев
  mark: 8
  date: '2003-02-24'
  text: 'Это предназначено тем, кто любит "биг-бенд блюз", проще говоря, стиль "Roomful of Blues". Хотя и гитарист очень недурен,
    главное достоинство – духовая секция аж из 5 человек! Сумасшедший дух и драйв классического soul, которые здесь явно присутствуют,
    заставляет вспомнить рекламное клише: если к третьей песне вы не раскачались, значит, вы умерли.'
