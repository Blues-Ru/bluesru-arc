- id: 1060
  author: Константин Колесниченко
  mark: 3
  date: '2007-04-16'
  text: 'Один из тех знаменитых Mark Hummel''s Blues Harp Meltdown (выступления известных харперов в одном шоу) - это первый
    том этих концертов. Ну, что можно сказать - музыканты-харперы высочайшего класса, все звезды: RJ Mischo, Gary Smith, сам
    Mark Hummel, Billy Branch, James Harman, Rick Estrin, Kim Wilson. Но до чего же нудная и однообразная запись! Непонятно,
    ведь, например, уважаемый мною Billy Branch - умеет смешиватьв с своей музыке и соул и фанк, регги, а тут целых 2 сд -
    однообразнейших шаффлов, к счастью, в разном темпе. Лишь один Харман выбился и сыграл румбу. Может, ограничение поставил
    устроитель, а может группа не умеет играть по-другому? Очень низкая оценка.'
