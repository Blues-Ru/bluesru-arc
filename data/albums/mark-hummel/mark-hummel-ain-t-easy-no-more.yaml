  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: Отличный подарок для ценителей блюзовых традиций в их современном продолжении.
    Блестящая игра, авторский саунд, уважительное отношение к известным стандартом
    в новых интерпретациях. И несколько собственных композиций, прекрасно вписывающихся
    в общую концепцию. Заглавный трек – весьма ироничный комментарий к потилической
    возне вокруг восстановления Нового Орлеана. Это единственный свамп-блюз в альбоме.
    А прочее - интригующая череда суровых чикагских блюзов с зажигательными джамп-блюзами.
    В своем десятом по счету альбоме Хэммел демонстрирует неиссякаемую страсть к любимой
    музыке и поразительную игру на губной гармонике, которая от переизбытка чувств
    хрипит, рычит и даже слегка кусается.
