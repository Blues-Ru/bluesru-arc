  text: '22 января в 1908 году в Браунзвилле, Теннеси, родился Хэмми Никерсон. Он
    выступал под именем Хэмми Никсон (Hammie NIXON), играл на множестве инструментов,
    но главным для него была губная гармоника. Партнер по странствиям и записям Слиппи
    Джона Истса на протяжении 50 лет. (c) блюзовый календарь


    На совместном альбоме представлены два блока 13 аудиозаписей, где поочередно солируют
    Hammie Nixon и еще 15 песен - Sleepy John Estes. В буклете написано, что Nixon
    поет и играет на гитаре, губной гармонике и казу(хотя казу и гармоника на записи
    звучат одновременно и весьма потешно:) Sleepy John Estes - вокал, гитара.


    Благодаря Никсону сейчас мы имеем возможность услышать в записи многих адептов
    блюза. Например Bukka White признавался по поводу сессии звукозаписи: "I''ve never
    done it before to such a price" (20 долларов и бутылка виски), "But if those two
    are with you, I''ll do it!" и добавлял "I play to Nixon and his friends" на записи
    Aberdeen Blues. Но Никсон не только представлял своих друзей миру, он и сам принимал
    участие в записях - пел и играл. Стиль его игры на гармонике напоминает известного
    Sonny Boy Williamson''a I и Noah Lewis''a. А свою технику игры на казу он выработал
    еще будучи членом группы Memphis Jug Band. Sleepy John Estes на момент записи
    77 лет и жить ему остается всего год.


