reviews:
- id: 402
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-12-23'
  text: 'Второй альбом Кинга с группой Crusaders. Он очень похож на предыдущий, но чуть длиннее и слабее. Игра музыкантов
    и аранжировки по-прежнему на высочайшем уровне, БиБи отлично поет и "купается" со своей гитарой в великолепном звуке.


    Оценка 4 балла. Отличный диск, просто предыдущая работа с этим же составом была чуть сильнее. Тут же хочется выделить
    два первых трека: Better Not Look Down и The Same Old Story. Оба эти альбома будут интересны любителям БиБи, джаза и фанка.'
