  text: 6 песен из 9 написаны Джо Сэмплом и Уиллом Дженнингсом - Кинг как бы снова работает с людьми из Crusaders (у них есть
    2 совместных альбома в конце 70-х), отсюда и название альбома. На ударных - Джим Келтнер, Ленни Кастро - на перкуссии.
    Да и вообще, состав прекрасный. Звуки 80-х еще тут, но они уже не такие страшные, а Би Би снова много солирует на гитаре.
    Большинство песен здесь в стиле приджазованного соула и соул-блюза; Кинг отлично поет подобные номера.
