  author: Дмитрий Казанцев
  mark: 10
  date: '2003-11-20'
  text: 'Сразу должен сказать, что они сильно ошибаются на Оллмьюзике. Они решили, что тот сборник, что у них на сайте - это
    и есть альбом 75 года, но это не так!


    Lucille Talks Back - это НОМЕРНОЙ альбом Кинга с другой обложкой и другими треками! ABC Records 1975 год. Я давно знаю
    об этом редком альбоме, но купил его на виниле совсем недавно (на КД его просто нет, как я понимаю).


    Альбом интересен со всех сторон. Он редкий, он очень короткий - 8 треков на 27 минут, и... на этом альбоме БиБи все время
    играет с квакушкой! Вы можете себе представить БиБи с ВауВау постоянно? Очень забавно звучит синтезатор порой - он пытается
    заменить струнные; совсем необычно для 75 года! Продюсер - БиБиКинг, между прочим.


    Может быть это лучшие 27 минут музыки, когда либо записанные БиБи.


    Первая сторона начинается с шикарного инструментала в стиле соул - Lucille Talks Back (Copulation). Затем идет классный
    фанковый номер Breaking Up Somebody''s Home. Reconsider Baby - третий трек, не нуждается в представлении; классный блюз
    в исполнении БиБи. Сторона заканчивается на Don''t Make Me Pay For His Mistake - еще одна фанковая вещь с хорошим грувом.


    Вторая сторона начинается с When I''m Wrong - отличный блюз с длинным инструментальным вступлением (квакушка и синтезатор
    звучат просто сногсшибательно смешно!). I Know The Price - еще один классный прифанкованный блюз. Седьмая вещь на альбоме
    - Have Faith - блюз-баллада с очень сильным уклоном в джаз и ритм-н-блюз; БиБи любит подобные песни и мы уважаем его мнение,
    я надеюсь. Настоящей конфеткой на альбоме является последний трек - Everybody Lies A Little - настоящий праздник соул-музыки
    и юмора. Everybody lies a little sometimes, your old lady lies a little, your old man lies a little, even your preacher
    lies a little, EVEN I LIE A LITTLE!!! LUCILLE LIES A LITTLE...


    5 баллов такому альбому и как всегда вопрос - когда они все это переиздадут на КД? Когда пленки совсем высохнут?...'
