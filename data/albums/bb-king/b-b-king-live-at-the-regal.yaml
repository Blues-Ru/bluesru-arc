reviews:
- id: 393
  author: Дмитрий Казанцев
  mark: 6
  date: '2003-12-23'
  text: 'Знаменитый концертный диск Кинга 1964 года. 10 треков на 35 минут. Запись не самого лучшего качества, но что Вы хотите
    от 1964 года? БиБи тут больше певец и шоу-мен, чем страдающий блюзмен. Много духовых и других атрибутов джаза и поп-музыки.
    Поет БиБи прекрасно, но Король ли он блюза тут? Это вряд ли; слишком уж все гладко и попсово.


    Оценка 3 балла! Короткий концерт не самого лучшего качества. Есть приятные треки - Sweet Little Angel и Help The Poor,
    но их явно недостаточно для полноценного хорошего концертника. Этот альбом явно переоценен критиками и коллекционерами
    БиБи 60-х годов.'
