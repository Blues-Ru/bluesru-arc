  author: А.Пелосси
  mark: 7
  date: '2002-10-13'
  text: "Возможно, не самый сильный альбом Кинга. Однако и судить его по обычным \nстандартам не вполне уместно. Он превосходно\
    \ выполняет свою основную функцию: \nлирическая работа, лишенная намерения потрясти (что на рождество никому и не \nнужно),\
    \ ласкающая слух мягкими, по-новогоднему &quot;пушистыми&quot; мотивами. Достаточно \nли там собственно блюза? Вполне!\
    \ 2-3 ритуально рождественские американские вещи \nдля нас, в массе не обращающих внимания на текст, не имеют, по-моему,\
    \ решающего \nзначения. Просто милый диск."
