  author: Дмитрий Казанцев
  mark: 9
  date: '2017-01-24'
  text: 'Crown 1960.


    Шестой альбом БиБи на этом дешевом лейбле Crown; всего их было 12 - только в 1963
    Кинга взяли на хорошую этикетку - на знаменитый ABC-Paramount!


    Только вчера обсуждали с Mikhail Mishouris эти ранние альбомы Райли, и он решил,
    что все они просто "сборники синглов". Это не так; King Of The Blues - настоящий
    номерной диск на полчаса с обалденным стереозвуком конца 50-х! Это уже не шеллак-качество
    ранних лонгплеев.


    Духовые здесь звучат просто супер - образец соула! Вообще верится с трудом, что
    это записи 50-х. Маст-хэв!'
