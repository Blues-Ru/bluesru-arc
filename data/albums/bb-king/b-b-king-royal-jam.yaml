  author: Дмитрий Казанцев
  mark: 6
  date: '2005-04-09'
  text: 'Вот такой хитрый концертный двойник вышел в 1982 году (запись сделана в сентябре
    1981 года). Полное его название такое: The Crusaders with B.B. King and the Royal
    Philarmonic Orchestra - Royal Jam - Recorded Live at the Royal Festival Hall,
    London. После такого названия сразу становится понятно что к чему. Забыли только
    указать, что на второй стороне первого диска поет Josie James (лучше бы она этого
    не делала), а также есть еще классные гости: Barry Finnerty & David T. Walker
    - guitars, James Jamerson Jr. - bass.


    Вещи с Би Би Кингом отличные, конечно; пение Josie James ужасно, а когда они просто
    играют с оркестром - это симпатичный smooth-funky-pop-jazz - неплохая вещь, на
    самом деле. Концерт прекрасно записан, а музыканты играют великолепно, так что
    тут есть от чего кайфануть.


    Этот диск выходил на компакте, но найти его очень трудно, имейте в виду.'
