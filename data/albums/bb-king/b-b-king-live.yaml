- id: 1243
  author: Андрей Евдокимов
  mark: 8
  date: '2008-04-09'
  text: 'Новаторы становятся классиками, патриархами… и даже консерваторами. Но Королю блюза можно только позавидовать в том,
    насколько свежо звучит его консервация блюза примерно начала 70-х годов. Он слегка заигрывает с джазом, но свингующая
    секция медных инструментов лишь оттеняет его любовь к слегка "опаздывающему" ритму гитарной импровизации. Король на концерте,
    и он желает пообщаться с публикой. Поэтому речей больше, чем принято. Но в них столько обаяния, что они не покажутся тратой
    времени. Репертуар тоже не блещет новизной, это все излюбленные и десятилетиями проверенные песни: Rock Me Babe, Key To
    The Highway, When The Saints Go Marching In – невозможно представить без низ концерт Кинга. Даже самой молодой When Love
    Comes To Town, которую написали для него U2, исполнилось уже 20 лет. Не стоит начинать знакомство с Кингом именно с этого
    концерта. Но давним почитателям его таланта приятно убедиться, что он все так же увлечен блюзом, и так же непосредственен
    в желании поделиться своим блюзом с миром. (Запись опубликована в форматах CD и DVD.)'
