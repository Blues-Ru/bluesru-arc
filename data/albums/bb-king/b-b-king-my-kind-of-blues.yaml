  text: Crown 1962. Седьмой альбом Кинга. На этот раз не сборник синглов, а очень интересная сессия без дудок и большого состава.
    Вот это должно понравиться и любителям Чикаго-блюза! Тут есть известные номера, но БиБи просто дает им другие названия
    и делает вид, что это его песни. Есть I'm A Good Man (But I'm A Poor Man), Worried Life Blues, Catfish Blues... Must-have!
