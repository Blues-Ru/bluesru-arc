  author: Дмитрий Казанцев
  mark: 4
  date: '2006-03-04'
  text: 'Сам БиБи пишет, что "this is the greatest album I have recorded in my 35
    years in the music business". На самом же деле, на этом диске поп-кантри-соул-музыка,
    а не соул или блюз. Альбом записан в Muscle Shoals Studios с лучшими музыкантами
    США, с продюсером Стюартом Левином, с классным звуком, но СТРУННЫЕ и ЖЕНСКИЕ ПОДПЕВКИ
    портят тут почти все. Подбор материала тоже не на высоте; ну зачем играть интимную
    "Love me tender" в поп-соул-варианте?


    Классный звук, пение, игра на гитаре, классные музыканты, но попсовые аранжировки
    и продакшн. Лишь бы самому БиБи нравилось. Любителям поп-соула тоже понравится,
    кстати!'
