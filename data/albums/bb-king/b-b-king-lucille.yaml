reviews:
- id: 720
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-06-14'
  text: 'Симпатичный во всех отношениях диск Кинга. Хороший, прозрачный звук, красивый соул-блюз и ритм-н-блюз, пение и игра
    Би Би на гитаре выше всяких похвал.


    На диске 9 композиций, из них 6 написал сам Кинг - не часто он записывал так много своих композиций на одном альбоме.
    Первый трек "Lucille" длится более 10 минут, в нем Кинг рассказывает историю своей любимой гитары. Я не люблю "разговорный
    жанр" в музыке, но эти 10 минут моногола и соло-гитары мне нравятся.


    Здесь нет ярких хитов или очень известных песен и стандартов (кроме "I Need Your Love So Bad" и "Watch Yourself", пожалуй),
    но все вещи на альбоме по-своему приятны. Группа хорошо играет, духовые не сильно давят на уши. Очень симпатичный трек
    "Move Me So", он отличается от "обычных" стандартных блюзов и здорово поднимает настроение.


    Этот альбом не такой "мощный" и яркий, как знаменитый "Completely Well" 1969 года, но уже тут Би Би продолжает искать
    свой звук и репертуар - получается хорошо.'
