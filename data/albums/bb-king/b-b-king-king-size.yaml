  author: Дмитрий Казанцев
  mark: 10
  date: '2003-12-23'
  text: Wow Mr. B.B. King! Back to the blues with funky beat! Именно так можно озаглавить этот альбом БиБи. Его, похоже, нет
    на КД, а жаль, альбом очень хорош. Тут лучшие музыканты Мемфиса и Лос Анжелеса и отличные композиции! Много традиционных
    знакомых блюзов в новых интересных аранжировках, а также соул и фанк высшего класса. К 1977 Кинг понял, что к чему, и
    чего он хочет сам, результат на лицо! Оценка 5 баллов! Тут просто не к чему придраться; все и все на своих местах!
