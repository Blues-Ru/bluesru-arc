  date: '2017-01-20'
  text: Crown 1956. Первый альбом Кинга. Это сборник синглов, как и почти все в 50-х
    и 60-х. Странно то, что великий БиБи очень долго издавался на дешевом и жутком
    лейбле Crown. Они готовили мастер на RPM, но в итоге так и не издали... Кинг начал
    записываться в 1949 году (ему было 23 года), но первые четыре стороны вышли еще
    на шеллаке, так что считается, что виниловая история началась только в 1951 году,
    когда его ВТОРОЙ сингл сразу занял ПЕРВОЕ место в РнБ! Потом были издания и на
    10 дюймов, шеллак тоже выпускали. И вот первый диск, а на нем уже почти все его
    лучшие вещи, которые он играл до самого конца своей карьеры. Это первый хит 3
    O'Clock Blues + You Upsets Me Baby, Everyday I Have The Blues, Sweet Little Angel,
    10 Long Years. Прекрасная музыка начала 50-х, записи Окей, но это не блюз, а южный
    ритм-н-блюз - с дудками, клавишами, латиной, свингом и джазом. Кинг пел просто
    супер - яркий тенор (как это было принято еще с 20-х). И гитара тут еще не ленивая
    и красивая, но мощная, виртуозная и сосвсем еще не Люсилль-стайл...
