reviews:
- id: 398
  author: Дмитрий Казанцев
  mark: 10
  date: '2003-12-23'
  text: 'B.B. goes Soul! The King goes Philly Soul!


    Да это так. Этот релиз на ABC Records записан в Филадельфии со знаменитыми музыкантами
    стиля филли-соул. Играют они просто великолепно! Да тут еще и Стиви Уандер оказался
    рядом! В результате три супер-хита; I Like To Live The Love, Respect Yourself
    и To Know You Is To Love You!


    На альбоме всего 8 треков; звучание ровное и классное! Блюзы тут очень хороши,
    а остальные треки - это настоящие хиты. БиБи все дальше уходит от традиционного
    блюза, но когда он играл его? Когда был БиБи без лоска и соул-музыки? Оценка 5
    баллов. Не важно сколько тут фанка и блюза, это великолепный альбом, и он обязан
    быть в любой коллекции.'
