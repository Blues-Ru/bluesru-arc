  author: Алексей Калачев
  mark: 8
  date: '2002-10-26'
  text: 'Редкий диск. Проверьте в магазинах раздел с альбомами Би Би. Повторяющийся
    набор одних и тех же? Вы удивлены? Я тоже. Часто встречаются в разных "обёртках"
    компиляции его классического периода (на фирме RPM) – периода 50-х. А то, что
    делалось им на ABC, Kent в 60-е? Пойдите, поищите…Возможно, на SONY Music готовится
    масштабное переиздание каталога Кинга к круглой дате в 2005. Факт же остаётся
    фактом: некоторые, даже хрестоматийные, альбомы сыскать архитрудно. Так и в случае
    с "Blues''n''Jazz", кстати, получившим премию "Грэмми".'
