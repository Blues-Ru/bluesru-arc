- id: 396
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-12-23'
  text: 'Как и остальные лондонские сессии других блюзменов альбом БиБи в Лондоне
    очень странный и неровный. Разница в том, что у БиБи альбом не называется The
    London Sessions, он не на Chess Records, и тут с Кингом играют и классные американцы
    тоже; это спасает этот альбом.


    На виниле 9 треков, на КД добавлен еще один. Надо отметить, что это уже второй
    диск Кинга на ABC Records, а не на BluesWay. Чтобы просто подогреть Ваш интерес
    к этой работе, я перечислю наиболее известных звезд, играющих на этом альбоме.
    Джим Прайс на трубе, Чак Финдли на тромбоне, Бобби Киз на саксе, Рик Райт (Пинк
    Флойд!!!) на пианино, Питер Грин на гитаре, Клаус Вурман!!! на басу, Джим Гордон
    на ударных, Джим Келтнер!!! на ударных, Стив Мэрриот на гармошке, Доктор Джон!!!,
    Ринго Старр!!!, Джимми Хаскелл тоже тут (куда же без него), Дэвид Спинозза на
    гитаре. Список очень внушительный и серьезный. Это просто звездный состав; такого
    не собирал ни один черный блюзмен.


    Оценка 4 балла. Остается впечатление, что все это делалось ради тусовки в Лондоне,
    а не ради этого куска пластика, которого мы так любим. Но тусанулись неплохо,
    на альбоме два супер-хита: Ghetto Woman и Ain''t Nobody Home. Остальные треки
    тоже хороши, на самом деле. Кинг по-прежнему на дороге к соулу и фанку, именно
    поэтому Лоднон был не самым лучшим местом для записи подобной музыки. Но зато
    как все тусанулись! А какие фотки на развороте!'
