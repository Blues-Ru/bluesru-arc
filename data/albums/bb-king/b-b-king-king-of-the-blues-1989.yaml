  date: '2005-04-02'
  text: 'Длинный альбом Кинга с ОТЛИЧНЫМ материалом и КОШМАРНЫМ звуком 80-х годов. Я это слушать не могу.


    Тут много классных песен и музыкантов, но это не может спасти ситуацию с продакшном. Похоже, Би Би уже не очень понимал,
    что делал.'
