  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Несмотря на солидный возраст (скоро будет 78), B. B. King потрясающе активен. Считая с 1997 года, легендарный блюзмен
    выпускает уже седьмой альбом. Если судить по продажам, наиболее удачным был "Riding With The King", записанный King на
    пару с Eric Clapton. Думаю, именно это обстоятельство повлияло на выбор продюсера новой пластинки. Им стал Simon Climie,
    приложивший руку к созданию "Riding With The King". На мой взгляд, на этот раз задача перед продюсером стояла посложней
    - объединение King и Clapton три года назад уже само по себе было неплохой приманкой для любителей музыки.


    Теперь же компанию гитаристу в студии составили клавишник Joe Sample (кстати, участвовавший и в создании "Riding With
    The King"), гитарист Doyle Bramhall II, басист Nathan East и барабанщик Abe Laboriel, Jr. Плюс оркестр под управлением
    Nick Ingman.


    Для записи были отобраны преимущественно "эвергрины". Так, "I''ll String Along With You" в разные годы исполняли Nat King
    Cole, Frank Sinatra и Dean Martin. "(I Love You) For Sentimental Reasons" - Nat King Cole и Peggy Lee. А еще "Exactly
    Like You", "Cross My Heart" и, наконец, "What A Wonderful World". Возможно, такая подборка несколько разочарует любителей
    блюза, зато, без сомнения, придется по душе всем любителям просто хорошей музыки.'
