- id: 1333
  author: Андрей Евдокимов
  mark: 10
  date: '2008-10-01'
  text: "\"Прошу тебя о последней услуге, последи, чтобы на могиле у меня было чисто\" - Кинг полюбил эту песни в далекой\
    \ молодости. В ритме румбы он исполнил ее для начала своего нового альбома, на котором он вспоминает свои любимые блюзы.\
    \ Однако сантиментам нет места. Давным-давно эти песни сразили его. Теперь он жалит гитарой новых их слушателей. Крепко\
    \ и пронзительно! Блюз редко звучми так мощно и сильно, как в Get These Blues Off Me. Король блюза объясняет, какой мужественной\
    \ и сильной музыкой он занимается всю свою жизнь. Абсолютный must have. Король на троне – и это радует! Лучшие песни блюза\
    \ выполнены им так, что их невозможно забыть. Рык БиБи Кинга еще здесь – например, в песне Waiting For Your Call. Альбом\
    \ планировался как музыкальное путешествие во времени на полвека назад – к саунду 50-х. Он записывался в Лос-Анджелесе,\
    \ в студии The Village Recorder. Экспертом по воссозданию \"правильного\" саунда был призван Ти-Боун Бурнетт (T-Bone Burnett)\
    \ – среди подвигов этого звукорежиссера и музыканта: работа над последним альбомом Robert Plant & Alison Krauss и выдающийся\
    \ (не только звукоинженерный, но и историко-исследовательский) труд над саундтреком к фильму \"Ну, где же ты, брат?\"\
    . А в ансамбле играли титулованные ветераны: Dr. John (piano), Nathan East (stand up acoustic bass) и Jim Keltner (drums).\
    \ Полный трек-лист альбома и имена артистов, чью память чтит БиБиКинг: •\t\"See That My Grave Is Kept Clean\" (Lemon Jefferson)\
    \ •\t\"I Get So Weary\" (T-Bone Walker) •\t\"Get These Blues Off Me\" (Lee Vida Walker) •\t\"How Many More Years\" (Chester\
    \ Burnett) •\t\"Waiting For Your Call\" (Oscar Lollie) •\t\"My Love Is Down\" (Lonnie Johnson) •\t\"The World Is Gone\
    \ Wrong\" (Walter Vinson and Lonnie Chatmon) •\t\"Blues Before Sunrise\" (John Lee Hooker) •\t\"Midnight Blues\" (John\
    \ Willie \"Shifty\" Henry) •\t\"Backwater Blues\" (Big Bill Broonzy) •\t\"Sitting On Top Of The World\" (Walter Vinson\
    \ and Lonnie Chatmon) •\t\"Tomorrow Night\" (Lonnie Johnson)"
- id: 1577
  author: Сергей Исправников
  mark: 9
  date: '2009-09-20'
  text: 'Последний на сегодняшний день студийный альбом Би-Би Кинга "One Kind Favor" (2008 г.), записанный в Лос-Анджелесе,
    по итогам года получил премию Grammy в категории "Лучший диск традиционного блюза". Это не случайно, поскольку здесь Би-Би
    Кинг обратился к своим корням: блюзам Блайнд Лемон Джефферсона ("See That My Grave Is Kept Clean" 1928 г.), Лонни Джонсона
    ("My Love Is Down" 1944 г., "Backwater Blues" 1948 г., "Tomorrow Night" 1948 г.), Ти-Боун Уолкера ("Waiting For Your Call"
    1949 г.), Хаулин Вулфа ("How Many More Years" 1951 г.), Джона Ли Хукера ("Blues Before Sunrise" 1961 г.), и других классиков.
    Концепцию альбома можно определить как ретро-блюз – и подбор исполняемых композиций, и звуковая картина диска, и визуальное
    оформление в виде набора художественных черно-белых фотографий отсылают к 50-м годам. Безусловно, это стилизация, своего
    рода взгляд назад, на времена своей молодости, времена расцвета блюза. Соответственно, никакой эстрадной музыки, никакой
    слащавости здесь нет и в помине. Диск решен в довольно жестком для Би-Би Кинга ключе, в меру агрессивен, в меру вызывает
    ностальгию. Как отметил журнал "Rolling Stone", складывается впечатление, что это последний шедевр великого мастера. Впрочем,
    дай Бог, чтобы не последний….


    В работе над альбомом принимала участие целая команда музыкантов, среди которых необходимо выделить ставшего легендарным
    ритм-энд-блюзового пианиста из Нового Орлеана Доктора Джона, одного из лучших сессионных ударников Джима Келтнера, игравшего
    с массой музыкантов – от блюзменов и рок-н-ролльщиков до экс-битлов, и джазового басиста Nathan East. Диск продюссировал
    60-летний T-Bone Burnett, специалист по традиционной американской музыке, как автор и исполнитель дебютировавший в 1972
    г. с сольным альбомом, затем игравший с "Delaney & Bonnie", Бобом Диланом и рядом других музыкантов. Однако более известен
    он именно как саунд-продюссер: свою первую студию он открыл еще в 60-х гг. в Сент-Луисе, где записывал блюз, а в начале
    70-х гг. перебрался в Лос-Анджелес. В его послужном списке были такие имена, как Элвис Костелло и Рой Орбисон. Славу ему
    принес диск Роберта Планта и Эллисон Краус "Raising Sand" (2008 г.), получивший сразу пять Grammy. Что касается данного
    диска Би-Би Кинга, то иногда не верится, что это современная запись, кажется, что она сделана задолго до эры цифрового
    оборудования. В любом случае, как сам 83-летний маэстро, так и остальные, кто был задействован в этом проекте, создали
    органичную винтажную работу, по достоинству оцененную и критикой, и слушателями.'
- id: 2246
  author: Дмитрий Казанцев
  mark: 8
  date: '2017-01-17'
  text: 'Geffen 2008 CD. 42-ой и последний альбом Кинга. Король покинул нас 14 мая 2015 года, ему было 89 лет. Удивительно
    сильный альбом и набор песен на этой пластинке. Мог ли БиБи знать, что это его финальная работа за 7-8 лет до смерти?
    Я думаю, что нет, но первый трек как раз об этом - See That My Grave''s Kept Clean (одна из любимых песен в блюзе начала
    20 века). Есть тут и другие блюзовые нетленки: How Many More Years, Blues Before Sunrise, Sitting on Top of the World,
    Tomorrow Night. Состав здесь просто золотой: Dr. John, Nathan East, Jim Keltner - лучшие из лучших. Этот диск - маст-хэв!
    Хотя, вы знаете, я не большой поклонник позднего БиБи.'
