- id: 855
  author: Дмитрий Казанцев
  mark: 7
  date: '2005-09-09'
  text: 'Би Би Кингу скоро 80 лет. Он празднует это с друзьями-музыкантами. На этом альбоме собрались интересные гости: Вэн
    Моррисон, Билли Гиббонс, Эрик Клэптон, Шерил Кроу, Холл и Оутс, Джон Мэйер, Марк Нопфлер, Гленн Фрей, Глория Эстефан,
    Роджер Долтри, Бобби Блэнд, Элтон Джон. Песни тоже радуют: 1 Early in the Morning, 2 Tired of Your Jive, 3 The Thrill
    Is Gone, 4 Need Your Love So Bad, 5 Ain''t Nobody Home, 6 Hummingbird, 7 All Over Again, 8 Drivin'' Wheel, 9 There Must
    Be a Better World Somewhere, 10 Never Make Your Move Too Soon, 11 Funny How Time Slips Away, 12 Rock This House.


    Очень хорош Вэн Моррисон (как обычно, впрочем), Шерил Кроу - умница, Hall & Oates красиво все сделали, хороша новая версия
    "The Thrill..." (Эрик играет на гитаре), Долтри хорош (ему досталась песня в бите - его тема), очень трогателен дуэт с
    Бобби Блэндом, Элтон нарезает "ракабили" (зачем?)


    Сам Би Би уже не тот, конечно, но в студии все получилось ОК. Иногда его пение очень даже радует (откуда только силы берутся?)
    На гитаре он играет совсем мало и слабо, но это и не страшно - с ним отличная группа (Расселл Канкел на ударных, Лилэнд
    Склар на басу - The Section). Хороший, добротный альбом вышел.'
- id: 1438
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: 'Как пройти мимо альбома, который Король жанра записал себе в подарок на юбилей? Изобилие поп-звезд, пожелавших спеть
    с ним дуэтом, не удивляет – в его королевской практике это далеко не первый альбом "звездных дуэтов". На этот раз Эрик
    Клэптон записал его известнейшую песню о том, что "волнение ушло". Модерн-блюз, вызвавший на заре 70-х столько споров,
    превратился в действительно не слишком волнующий медленный блюз. Элтон Джон и Роджер Долтри вспомнили, что начинали карьеру
    именно в блюзбэндах. Кинг как-то объяснял, почему он так любит дуэты со звездами (а он записывался даже с "Ю-Ту"). Потому
    что это повышает интерес публики к блюзу! Любителям чисто блюзового вокала в новом альбоме остаются два трека. Первый
    - дуэт с Бобби Блэндом, старинным другом и мастером "соул". И лучший трек: блюзовый стандарт, спетый вместе с Вэном Моррисоном,
    "Рано по утру" – видимо потому, что он давно и горячо любим обоими.'
