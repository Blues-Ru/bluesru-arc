- id: 294
  author: Кирилл Мошков
  mark: 8
  date: '2003-12-01'
  text: 'С тех пор, как Эрик Клэптон выступил с Би Би Кингом в 1968 г. и тем открыл его белой аудитории (тогда как черная
    аудитория на американском Юге знала Кинга уже двадцать лет), Слоухэнд мечтал записать с Кингом совместный альбом. Так
    он, во всяком случае, утверждает. И вот не прошло и тридцати двух лет, а мечта эта уже осуществилась.


    Превосходная группа из джаз-роковых виртуозов (упомяну лишь двоих: на барабанах Стив Гэдд, на фортепиано и вурлицер-пиано
    - Джо Сэмпл). Со вкусом подобранный репертуар из песен самого Кинга ("Three O''clock Blues", "Ten Long Years"...) и блюзовых
    стандартов ("Hold On I''m Coming" Айзека Хэйза, "Key To The Highway" Биг Билла Брунзи...). Единственное, к чему можно
    предъявить некоторые претензии - аранжировки (местами в них слишком много от диско и поп-соул), но такова уж тенденция:
    Би Би никогда особенно не брезговал попсовыми оркестровками, может - поэтому так и популярен. Впрочем, альбом все-таки
    идет по ведомству Клэптона, а не Кинга: Кинг выпускается на MCA.


    Установить из буклета, где делалась запись, невозможно; впрочем, можно выяснить, что запись полностью цифровая - продюсер
    Саймон Клайми и инженер Алан Дуглас писали музыкантов напрямую в ProTools, минуя рекордеры. Результат - яркая, острая
    звуковая картина с ностальгически-старомодным панорамированием: "вурлицер" справа - "хаммонд" слева, Кинг справа - Клэптон
    слева, и т.п. Особенно трогательны в этом отношении вещи, где Кинг и Слоухэнд поют через куплет (например, "Key To The
    Highway", где они оба еще и играют на акустических инструментах: здесь, в отсутствие фирменного звука своей "Люсиль",
    Кинг неожиданно оказывается куда ближе к блюзовым корням, чем обычно). Интересна и концепция реверберации: так, в большинстве
    вещей вокал, а вторым планом - и гитары, и вся панорама в целом, обработаны настолько реалистичным эффектом small room,
    что временами почти веришь, что это и есть естественная акустика студии. И как-то уж и неприлично говорить о превосходных
    индивидуальных характеристиках звука гитар двух главных персонажей: "плывущий", плавящийся звук Клэптона и толстый, смачный
    звук Кинга едва ли не более узнаваемы, чем их голоса.'
- id: 405
  author: Дмитрий Казанцев
  mark: 8
  date: '2004-01-08'
  text: 'Они правы на Оллмьюзике, этот альбом стоит назвать Эрик и БиБи, но не наоборот. Странно, что этого диска просто НЕТ
    в дискографии БиБи на Оллмьюзике, хотя первым стоит именно его имя. Альбом вышел на лейбле Эрика Reprise Records, на диске
    играют эриковские музыканты. Тут Andy Fairweather Low, Doyle Bramhall II, Nathan East, Steve Gadd!!!, Joe Sample!!!. Лучшие
    из лучших, это слышно с первых нот. Стив Гадд даже в этой музыке умеет делать ВСЕ!


    Самое интересное, что это почти спасительный альбом для Эрика! Его последняя приличная работа была аж в 1994 году (Пилигрима
    мы не будем считать, с Вашего позволения)! Для Кинга это очередная клевая тусовка, но очень старается и даже играет тут
    на АКУСТИЧЕСКИХ гитарах в некоторых треках!


    12 отличных песен, много блюза, есть соул-рок, есть даже джаз в виде Come Rain Or Come Shine (одна из лучших вещей на
    альбоме). Отличное исполнение Help The Poor! Оценка 4 балла. Слишком уж это эклектично даже для Эрика. Мощные роковые
    треки типа Riding With The King или Marry You звучат очень странно с милыми и акустическими Key To The Highway или Help
    The Poor. Такое ощущение, что они легко могли сделать два альбома из этого материала, один соул-роковый, другой акустический
    по блюзу. Но они сделали по-другому. В любом случае, это лучшая работа Эрика за последние 6, а может быть и 8 лет, и уж
    точно лучшее "тусование" БиБи за всю его жизнь. Мечта Эрика сбылась, он записал диск с БиБи, а вот сбылась ли мечта БиБи?


    Эрика в молодости спрашивали, как он так хорошо умеет играть по блюзу на гитаре? Он отвечал, что ВСЕ, что он делает, -
    это КОПИРУЕТ БиБиКинга!'
