  author: Дмитрий Казанцев
  mark: 8
  date: '2017-01-23'
  text: 'Crown 1958. Второй альбом Кинга, снова на ужасной фирме Crown, снова просто сборник синглов - он очень похож на дебютный
    LP 1956 года. Южный ритм-н-блюз и блюз с дудками, перкуссией и клавишами. Особенно хорошо звучат латинские румбы с переходом
    на шаффл. Известные номера тут тоже есть, конечно: When My Heart Beats Like A Hammer, Early In The Morning, That Ain''t
    The Way To Do It, Troubles, Troubles, Troubles... Для тех, кто любит Чикаго-блюз, это, конечно, совсем не то, но для любителей
    соула и РнБ - просто сказка!'
