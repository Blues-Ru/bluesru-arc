  author: Дмитрий Казанцев
  mark: 10
  date: '2003-12-23'
  text: 'Оу е бэби, БиБи наконец определился! Он хочет быть известным и популярным.
    Он хочет играть рок, блюз и фанк, и ему интересно работать с хорошими белыми музыкантами.
    Здесь с Кингом целая плеяда лучших студийных музыкантов США. Кэрол Кинг на пианино
    - это неожиданность! Она скорее композитор и культовая певица, чем сессионная
    клавишница. А вот остальные один краше другого: Расс Канкел на ударных, Лион Рассел
    на клавинах, Джо Уолш и Хью МакКракен на гитарах.


    9 треков и 40 минут хорошей музыки. Главный хит здесь - это знаменитая Hummingbird
    Лиона Рассела. Но и помимо нее тут есть что послушать. Nobody Loves My But My
    Mother; You''re Still A Woman; Ask Me No Questions; King''s Special; Ain''t Gonna
    Worry My Life Anymore; Chains And Things; - все это очень хорошие композиции и
    песни! Надо отметить, что дудки и струнные под руководством ЗНАМЕНИТОГО Джимми
    Хаскела играют очень тихо и ненавязчиво, создается впечатление малого состава.


    Оценка 5 баллов! Может этот альбом "переходного периода" БиБи и есть лучшее в
    его творчестве? Один из лучших, это уж точно. Абсолютно уникальная и демократичная
    пластинка, ее можно посоветовать практически всем!'
