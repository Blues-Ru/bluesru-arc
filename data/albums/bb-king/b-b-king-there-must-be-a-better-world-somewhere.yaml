reviews:
- id: 403
  author: Дмитрий Казанцев
  mark: 6
  date: '2003-12-23'
  text: 'Мне очень грустно писать именно эту рецензию потому, что, на мой взгляд, БиБи окончательно ушел из хорошей музыки
    после этого альбома. Может, он просто не пережил дух 80-х?


    После двух альбомов с Crusaders БиБи решил еще больше уйти в джаз и южный соул. На этом диске отличный состав, надо выделить
    присутствие здесь Доктора Джона на клавишах; на ударных король грува Бернард Пюрди; на ритм-гитаре Хью МакКракен. Духовая
    секция здесь состоит сплошь из звезд: Хэнк Кроуфорд - альт; Дэвид Ньюман - тенор; Роналд Кьюбер - баритон; Том Мэлоун
    - тромбон.


    На альбоме всего 6 песен, но они довольно длинные. Очень чувствуется влияние Доктора Джона и соул-джазовой музыки. Это
    не совсем область Кинга, но он выбрался с честью из этого испытания. Второй трек Born Again Human великолепен! More More
    More - классный блюз с соул/госпел влиянием. You''re Going With Me - соул-музыка во всей красе.


    Оценка 3 балла. БиБи будто потерялся среди стилей и тусовок. Он уже лет десять не записывал блюзовых альбомов, а соул
    и фанк ему стал надоедать или он просто все уже сыграл. Но дальше будет еще хуже; 80-е - это мрак для БиБи, так что этот
    альбом определяет конец эры классического БиБи (блюз, соул, фанк). Не советую пробовать его альбомы 80-х.'
