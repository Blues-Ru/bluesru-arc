- id: 149
  author: Дмитрий Казанцев
  mark: 6
  date: '2003-08-18'
  text: 'Первое, что бросается в глаза, - это большое количество треков (11) и приличная длина альбома (44 минуты). С одной
    стороны, это хорошо, но может быть и утомительно, если попался не тот продюсер, или сам БиБи плохо подумал.


    Начинается альбом с Summer In The City - это хит Loving Spoonful 60-х годов (кто эту вещь только не исполнял впоследствии).
    БиБи ее приблюзил, замедлил, а надо было бы наоборот для первого трека, наверное.


    Много средненьких композиций в стиле соул и поп - ничего страшного, но это еще не БиБи середины 70-х. Он так и не смог
    понять всю прелесть грува на тот момент, и его вместе с продюсером тянет на лирику, струнные, лишние дудки и прочую мишуру
    в аранжировках.


    Под конец Кинг все же нарезал знаменитую Five Long Years в десятый раз - тут все клево, но все это мы уже слышали. Стоит
    отметить тут наличие двух великих людей из мира соул/фанк/джаза - это гитарист Cornell Dupree и драммер Bernard Purdee.
    Обычно наличие этих двух перцев в составе уже гарантирует качество альбома, но тут это не так.


    Я бы поставил этому альбому 3 балла из пяти (поверьте, у ББК есть альбомы намного хуже этого). Для сравнения, я бы поставил
    5 баллов его Indianola Mississippi Seeds или L.A. Midnight.'
