reviews:
- id: 394
  author: Дмитрий Казанцев
  mark: 6
  date: '2003-12-23'
  text: 'Классический альбом БиБи на BluesWay Records. Кинг на распутье; он и поп-идол,
    и король блюза, и соул-фанк уже наступает на пятки, и рок давно победил всех и
    вся. Вот в таком ключе вся пластинка. 9 треков аж на 50 минут! Иногда странно
    и чуждо звучат дудки (они просто попсовые тут), местами странно слушаются салонно-джазовые
    аранжировки, но в целом, это неплохой диск БиБи. Он известен и популярен во многом
    благодаря The Thrill Is Gone, так уж получилось, что эта попсовая песня стала
    визитной карточкой БиБи. Помимо этого хита можно отметить So Excited, You''re
    Losin'' Me и Cryin'' Won''t Help You Now, остальной материал довольно обычен и
    даже банален.


    Оценка 3 балла! Уберите Thrill и альбома нет! Нельзя служить трем господам. То
    БиБи попсит, то джазит в салонном стиле, то его пробивает на фанк, а местами и
    на рок (You''re Mean). Но фанк-соул он пока не постиг, а рок - это вообще не его,
    слишком уж у него довольное лицо, красивый строгий пиджак и сладкий голос.'
