  date: '2008-01-26'
  text: 'Малоизвестный техасский гитарист Joe "Guitar" Hughes достаточно самобытен и интересен, чтобы отнести его к когорте
    лучших Штата Одинокой звезды: Albert Collins, Johnny Copeland и др.


    Альбом "Down & Depressed: Dangerous" - это характерный образчик музыки большинства гитаристов его поколения: что-то от
    Альберта Кинга, что-то от Альберта Колизна, что-то от Гейтмауса Брауна, где-то фанк, где-то свинг, где-то шаффл. Это все
    по форме, а по сути - у него уникальный почерк и есть, что послушать и чему поучиться: он деликатный, лаконичный и аккуратный
    гитарист и неплохой певец, пишет хорошие песни. Что касается его песен, то самая яркая на альбоме - это, наверное, "Pitbull",
    в которой Джо очень смешно и умело сочетает забавный текст с собачьим гавканьем, кряхтеньем и пыхтеньем. У него получается
    издавать эти звуки не хуже, чем играть на гитаре!'
