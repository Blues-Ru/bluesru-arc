- id: 1046
  author: Александр Панин
  mark: 8
  date: '2006-11-07'
  text: Второй альбом интересного акустического гитариста, не слишком хорошо известного за пределами Германии, где он живет
    и выступает. Ларри исполняет старые блюзы, рэгтаймы, разнообразную народную музыку (на диске есть ирландские, гавайские
    и индийские мелодии). В Германии его называют местным Раем Кудером, мне также приходит на ум сравнение с Бобом Брозманом.
    Ларри прекрасно играет слайдом на стальной гитаре и сочиняет неплохие композиции, черпая вдохновение в разнообразном старом
    материале. Мне не очень нравится его вокал, который местами представляется довольно пафосным. Впрочем, среди семнадцати
    треков диска немало инструменталов. Неплохой альбом, он должен понравиться всем любителям гитарной акустики и слайда.
