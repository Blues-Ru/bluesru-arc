reviews:
- id: 466
  author: Дмитрий Казанцев
  mark: 5
  date: '2004-02-14'
  text: 'На этом альбоме 10 треков, но только шесть из них можно назвать полноценными композициями. Четыре трека длятся меньше
    двух минут и представляют из себя странные психоделические заставочки. Вообще это альбом очень "дурной" и обкуренный (вчитайтесь
    в название). Блюза много, но еще больше психоделии и тайнственно-мрачных настроений. Все это, конечно, не очень хорошо
    для музыки, но годы были такие. Элвин Ли прекрасно играет, задумчиво и мрачно поет. Запись довольно неровная по качеству,
    но это почти незаметно из-за стилистики альбома.


    Всего 6 песен? Это маловато даже для 1969 года. Мрачно, тяжеловато, обкурено. Hear Me Calling - лучшая. Это не самый сильный
    диск группы; можно сказать, что он вообще необязательный.'
