- id: 681
  author: Александр Панин
  mark: 8
  date: '2005-05-25'
  text: Очень интересный альбом немецкого блюзмена Аби Валленштайна. На диске 13 композиций почти на час. Аби играет как на
    акустической, так и на электрической гитарах, на половине треков присутствует известный автор гармошечных школ Стив Бейкер.
    На отдельных вещах звучат аккордеон, кларнет, туба. Начало диска не очень вдохновляющее - невнятный кавер стоуновской
    Off The Hook, попсово-танцевальная Ramona с женскими подпевками и баллада Leaving To Stay, но начиная с пятого трека материал
    становится просто превосходным! Появляется ряд старых блюзовых номеров - Titanic Мэнса Липскома, Death Letter Blues, Blue
    Bird. Все звучит очень аутентично и здорово. На всем диске очень хороша гармошка. Ну а самое большое откровение - кавер
    битловской песни Taxman, сделанный как старый архаичный блюз! Чуть похоже на Stop Breaking Down, звучит просто замечательно,
    хотя и узнается не сразу.
- id: 2349
  author: Олег Пчелкин (oleg_spb)
  mark: 9
  date: '2021-09-19'
  text: '1 июля 2021 года с помощью краудфандинговой компании вышел компакт Аби Валленштейна Spirit Of The Blues (или проект
    Abi Wallenstein''s Spirit Of The Blues). Квартет музыкантов включает давно работавшего с Валенштейном мастера игры на
    каджоне и барабанщика Мартина Роттгера (Martin R&#246;ttger), лучшего современного германского харписта Марка Брейтфелдера
    (Marc Breitfelder), блюзового пианиста Георга Чретера (Georg Schroeter) и самого певца и гитариста Валленштейна. Почему
    Валленштейн обошелся без проверенного старого коллеги-харписта Стива Бейкера - пока неясно. Таким образом , в квартете
    объединились два творческих дуэта: Чретер - Брейтфелдер и Валленштейн-Роттгер. Интересный компакт, где много каверов на
    известные блюзовые стандарты спеты Валленштейном очень оригинально. Валленштейн поет песни Принца (с вставкой в конце
    RS'' "Satisfaction"), Элмора Джеймса, Слима Харпо, Мадди Уотерса, Ледбелли, Дж. Би Ленуара, Дэйла Хокинса, Джона Фогерти.
    Есть и три оригинальных трека. Очень понравилась работа пианиста, на высоте и все остальные, как обычно.'
