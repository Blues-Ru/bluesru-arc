  date: '2014-05-10'
  text: 'Не будет ошибкой сказать, что вышедший в июне 2013 года на Ruf Records альбом певца и гитариста Майка Зито "Поехать
    в Техас" был особенным и очень личным для этой восходящей звезды корневого "народного" кантри-блюз-рока. Это был один
    из самых интересных и долгожданных новых альбомов 2013 года. В записи принимали участие его собственная группа ( The Wheel:
    Jimmy Carpenter - sax, guitars; Rob Lee - drums; Scot Sutherland - bass) и приглашенные звезды : Delbert McClinton - вокал
    и гармоника, Сонни Ландрет Landreth - слайд гитара, Сьюзан Коусилл Cowsill- вокал и Льюис Стивенс (Delbert McClinton,
    Фредди Кинг) - клавишные.


    Заглавная песня Gone to Texas автобиографична, это история спасения и очищения самого Зито, написанная несколько в духе
    сходных проблем участников Allman Brothers. "Rainbow Bridge " демонстрирует достоинства гостей - Ландрета и Сюзан, песня,
    будто найденная в давно забытом альбоме Little Feat. "The Road Never Ends" - мощный слайд и яростный вокал самого Зито
    плюс вокал и гармоника Делберта Макклинтона. "Вычитание-Блюз" - это об отношениях с женщиной, которые не складываются
    (вот так редкость !)"Subtraction Blues" и про чувства мужчины, которого "держат про запас". "Take It Easy" - один из двух
    каверов на альбоме, умиротворяющий вариант баллады авторства Макклинтона. Еще один кавер завершает альбом, это довольно
    заунывная и нагоняющая сон версия песни Слепого Уилли Джонсона "Позволь своей любви осветить меня"Blind Willie Johnson
    "Let Your Love Shine on Me"


    "Техас спас мне жизнь". Звучит несколько драматично, но это - истинная правда, так уверяет нас Зито. Исторически, Техас
    был действительно спасительным местом для многих отчаявшихся, оказавшихся в безвыходном положении. В начале 1800х люди,
    имевшие крупные долги или разыскивающиеся за преступления, бежали в Техас в надежде укрыться от кредиторов и властей колонии.
    Это и называлось "поехать в Техас". Тогда это было Новой Испанией (Мексика в то время включала и Мексиканский Техас) и
    там находили убежище беглецы и бомжи. Многим из них удалось начать новую жизнь, расплатиться по долгам, вернуться к своим
    семьям. Часть их погибла в боевых действиях за "свободу Техаса от испанского владычества".


    И для Зито Техас стал последней остановкой. Некогда он сел в Грейхаунд-автобус и поехал в нем в Техас от проблем, от семьи,
    от самого себя. А все - наркотики, будь они неладны, и Зито на них как следует посидел. Техас оказался здоровым для излечения
    местом, в очередной раз подтвердив свое целительное действие на заплутавших по дорогам жизни североамериканцев. Причем
    для Зито целительным оказалась юго-восточная часть Техаса, это он подчеркивает особо. Ему -видней. Родному южному Сент
    Луису Зито в такого рода волшебстве отказывает, обижает малую родину.


    Но -это все шутки, альбом, правда, пусть и не outstanding from start to finish, но очень неплохой и вообще Зито становится
    с каждым годом все более известным и примелькавшимся победителем или номинантом Blues Music Awards. Заслуженно.'
