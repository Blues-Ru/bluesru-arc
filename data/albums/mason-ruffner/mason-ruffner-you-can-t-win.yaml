  author: Алексей Калачев
  mark: 8
  date: '2003-02-24'
  text: Так бывает. Музыкант выпустит вдруг единственный блюзовый альбом за всю карьеру, и альбом выйдет преотличный. Я выделил
    "You Can't Win" среди десятков дисков, тех, кто решил вспомнить о корнях или просто желавших "отметиться", ориентируясь
    на конъюнктуру, поскольку он меня задел за живое. В нем есть свинг, его несколько грузный, неспешный темп, мужественный
    вокал, глуховатый тон Стратокастера – теплые. Альбом записывался "вживую", без наложений, не считая духовых.
