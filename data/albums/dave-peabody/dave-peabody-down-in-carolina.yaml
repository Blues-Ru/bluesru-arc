- id: 803
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-10'
  text: 'Дэйв Пибоди - англичанин, но его сердце всегда в США, а его музыка - это фолк-блюз. Этот диск записан в 1996 году
    в США с помощью американских музыкантов: Gary Erwin (keys), Juke Joint Johnny (harmonica), Jerome J. Griffin (bass), Dudley
    Birch (drums), Dan O''Reilly (baritone sax), John E. Cobb (alto sax), Cora Mae Bryant (vocals; это дама в возрасте с прекрасным
    голосом - дочь легендарного Curley Weaver), Neal Pattman (vocals; этот 70-летний черный дядя из Джорджии великолепно поет),
    Steve James (guitar; довольно известный гитарист из Техаса).


    Музыка, в основном, акустическая, но есть и ритм-н-блюзовые номера с большим составом. Когда поет Кора и Нил - это просто
    праздник какой-то, сам Дэйв поет хорошо, но его голос не очень вяжется с блюзом (иногда он поет песни почти в стиле хиллбилли,
    вот тогда все супер). А группа играет просто прекрасно; радость для любителей акустики и чистого блюзового звука.


    "You Was Born To Die", "McTell, Moss & Weaver", "Mama Whoopin'' Blues", "Glory, Glory, Hallelujah" - все это великолепные
    образцы фолк-блюза и госпел-блюза.'
