reviews:
- id: 1153
  author: Константин Колесниченко
  mark: 10
  date: '2007-11-06'
  text: 'Потрясающий альбом Альберта Коллинза, и один из самых лучших альбомов в блюзе
    вообще! Это первый альбом Коллинза для "Аллигатора" и надо признать, записали
    они его хорошо. Ну что можно ждать от Albert Collins: характерной виртуозной гитарной
    игры, смесь фанк и техасского блюза в аранжировках - и все это есть тут. Странно,
    Альберт неплохо поет, но приличную долю диска занимают инстурменталы. Много юмора
    в песнях, особенно в Master Charge. Аккомпанирующая группа тоже на высоте. У альбома
    отличная обложка, обыгрывающая многочисленные "ледянные" прозвища музыканта.'
