  author: Дмитрий Казанцев
  mark: 8
  date: '2006-01-07'
  text: 'Четвертый альбом Алберта для Alligator Records. Звук довольно приятный и живой для 1983 года, программа разнообразная
    и энергичная. Очень хорош Крис Форман на органе, есть духовая секция и ритм-гитарист. Резкий и высокий звук гитары Коллинза
    на месте, его пение с хорошим чувством умора тоже. "Don''t Lose Your Cool" - старый инструментал Алберта еще с 50-х годов
    - отличный номер. "Broke" - классный фанки-блюз в фирменном стиле Алберта.


    Один из лучших дисков Коллинза по звуку и материалу.'
