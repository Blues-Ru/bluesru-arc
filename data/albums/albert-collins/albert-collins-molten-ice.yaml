reviews:
- id: 677
  author: Александр Панин
  mark: 4
  date: '2005-05-25'
  text: 'Судя по дискографии, в 70-х годах прошлого века Альберт записывался крайне мало (вероятно, много концертировал).
    Вот в 1973-м году его занесло в какой-то клуб в Торонто, где он и отыграл концерт, представленный на диске, c местной
    командой.


    На протяжении всех 70 минут диска звук мутный и мерзкий, бутлежного типа. Хорошо слышны только фирменные коллинзовские
    соло, да и то покуда наплывов нет. Вокал звучит плохо, группу слышно плохо (однако, похоже, это плюс). Коллинз, конечно,
    отличный музыкант и один вполне вытягивает концерт, но диск можно порекомендовать только коллекционерам.'
