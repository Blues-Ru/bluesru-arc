  author: Олег Пчелкин (oleg_spb)
  mark: 8
  date: '2019-04-13'
  text: '"Trash Talkin''" ("Пустая болтовня") сейчас считается одной из ранних и достаточно сырых записей "позднего" Альберта
    Коллинза. Его еще более поздние альбомы были лучше в плане качества песни и гитарной техники, но и этот альбом полезно
    послушать.


    "Болтун" ( "Chatterbox" ) был, например, сделан в стиле Т- Букера (Booker T. & the M.G.''s) , а "Back-Yard-Back-Talk"
    очень напоминает "Mustang Sally" Мака Райса, но Альберт Коллинз был отнюдь не "спец по плагиату". Многие его блюз и R&B
    мелодии действительно часто имеют сходство с друг другом и записями иных авторов, а иногда используют одни и те же гитарные
    риффы. На самом деле многие мелодии выпускались под разными названиями на протяжении многих лет, и иногда чрезвычайно
    трудно определить оригинального композитора . В целом этот альбом - добротное сочетание медленного электрического блюза,
    зажигательного R''n''B и большого количества фанка.'
