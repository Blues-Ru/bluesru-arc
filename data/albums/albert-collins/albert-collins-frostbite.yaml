  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2017-02-07'
  text: 'Второй альбом ветерана блюзовой гитары и признанного "столпа" современного
    блюза, записанный для лейбла Аллигатор. Продюсировали хозяин лейбла Брюс Иглауэр,
    Дик Шурман и Кэйси Джонс. На диске прифанкованный техасский блюз Коллинза оттеняет
    мощная свингующая духовая секция во главе с А.С. Ридом на тенор-саксофоне. В составе
    аккомпанирующих при записи музыкантов - легендарный чикагский блюзовый ударник
    Кэйси Джонс.


    Не лучший диск Мастера Телекастера, но достаточно интересный для прослушивания.


    "Mercurial, highly individual guitar playing...unpredictable imagination...stunning"
    - NEW YORK TIMES'
