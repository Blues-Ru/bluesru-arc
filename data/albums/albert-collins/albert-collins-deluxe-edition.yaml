  author: Леонид Аускерн
  mark: null
  date: '2002-12-17'
  text: 'Еще один диск из блюзовой "портретной галереи" фирмы "Alligator". Это тоже
    сборный альбом типа "Greatest Hits", где представлены композиции с восьми альбомов
    Элберта Коллинза, изданных фирмой с 1978 по 1986 год. К сожалению, новых вещей
    этому прекрасному гитаристу и певцу уже не создать — в 1993 году его не стало.


    <p>На примере музыки Коллинза хорошо видна разница между "белым" и "черным" подходом
    к материалу. Ритмический "скелет" композиций, не менее жесткий, чем у белых музыкантов,
    искусно спрятан у Коллинза за эффектной группой "мышц" в виде гитарных импровизаций,
    мощной и гибкой духовой секцией из саксофонов, труб и тромбонов, а иногда и органными
    звучаниями. Коллинз одинаково хорош и в студии и на концертной сцене — на CD представлена
    8-минутная "If Trouble Was Money", записанная на концерте в Токио в 1982 году.


    <p>Высокий класс этого выходца из Техаса подтверждается всем его творческим путем.
    Еще в 70-х годах Элберт Коллинз был удостоен премии ГРЭММИ за альбом "Show Down!",
    впоследствии переизданный "Аллигатором" и также представленный рядом композиций
    на данном CD. Кроме того, он собрал все мыслимые в мире блюза премии и награды.
    В этой сборке я бы особо отметил "Blue Mondey Hangover" и потрясающий вокал в
    "But I Was Cool!", где пение Коллинза переходит уже в просто нечеловеческой экспрессии
    вой и стоны.


    <p>И еще одна мысль по поводу. Новое время — новые песни. Разве могли бы, скажем,
    Блайнд Лемон Джефферсон или Биг Билл Брунзи представить себе такую тему для блюза:
    "When The Welfare Turns It Back On You?" А блюзмэн конца ХХ века Элберт Коллинз
    может. И исполняет этот блюз столь же проникновенно и прочувствованно, как его
    предшественники пели о своих горестях. Социальный прогресс, спору нет, штука замечательная.
    Но блюзмэны без работы все равно не останутся, новые темы приходят сами. Так что,
    мы еще послушаем блюз!'
