reviews:
- id: 353
  author: Дмитрий Казанцев
  mark: 7
  date: '2003-12-11'
  text: 'Один из последних альбомов Алберта и последний на Аллигаторе. Хорошо то, что на альбоме есть фанки, блюзы и соул,
    плохо то, что звук 80-х убивает все это на корню! Барабаны звучат кошмарно (даже на виниле), бас не качает, звук резкий
    и холодный. Может и соответствует названию альбома и кличке Алберта (Iceman), но это никак не вяжется с черной музыкой.


    На альбоме 9 композиции, в которых Алберт резко (как обычно) солирует на гитаре, поет с юмором и настроением, создает
    атмосферу энергии и ее портит только звук.


    Оценка 4 балла за музыку и 2 за звук! Просто кошмарное продюсирование! Если Вы любите и уважаете Коллинза, то этот альбом
    - необходимость, если же только начинаете с ним дружить, купите какой-нибудь более ранний релиз (1978 год, например).'
