  author: Константин Колесниченко
  mark: 5
  date: '2009-04-13'
  text: 'Немного свинга, кантри, парочка номеров блюз-рока в духе СРВ, немного американы
    в стиле Los Lobos и вы получите ансамбль, способный удовлетворить любую публику,
    открыть выступление практически любой звездной группы и принять участие в записи
    практически любого музыканта. Именно таким ансамблем и является трио "The Paladins",
    состоящее из гитариста Dave Gonzalez, басиста Thomas Yearsley и барабанщика Scott
    Campbell.


    Альбом "Years since yesterday" является как раз показателем возможностей группы.
    Например на "Years since yesterday" или "Happy Home" они звучат очень близко по
    духу к группам техасского блюз-рока в стилистике СРВ, а уже на "Good Lovin''"
    "Happy Home" – это нечто среднее между Stray Cats или Hollywood Fats, а балада
    "You And I" должна окончательно растопить сердце слушателя.


    Может быть не самая душевная и блюзовая группа, но дозу танцевального настроения
    и виртуозной игры вы получите обязательно после прослушивания этого альбома.'
