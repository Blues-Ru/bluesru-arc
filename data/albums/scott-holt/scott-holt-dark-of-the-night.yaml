  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Еще одна очень удачная блюзовая пластинка. Гитарист Scott Holt, известный по своим выступлениям у Buddy Guy в начале
    90-х годов, наконец-то отважился обзавестись сольником. На запись музыкант пригласил аж три разных состава - свой собственный
    коллектив "Scott Holt Band", соратников еще самого Jimi Hendrix - Mitch Mitchell и Billy Cox и, наконец, "Double Trouble"
    - бывших музыкантов Stevie Ray Vaughan. В отличие от большинства современных блюзменов Holt не стал загружать потенциального
    слушателя (покупателя) новоиспеченными собственными опусами, а отписал целый альбом почти классики - и не только блюза.
    Так, в альбом вошли "I Believe To My Soul" (Ray Charles), "Five Women" (Prince), "You Gotta Serve Somebody" (Bob Dylan)
    и т.д.


    Ну а украшением пластинки, бесспорно, стал сочный прифанкованный блюз "Breakin'' up Somebody''s Home", записанный гитаристом
    вместе с его бывшим работодателем Buddy Guy.'
