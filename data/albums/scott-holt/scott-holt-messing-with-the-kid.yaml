- id: 2066
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2012-08-13'
  text: 'Дебютный сольный альбом гитариста-виртуоза из Теннесси, который до этого почти десять лет играл в группе самого Бадди
    Гая. В 1987 году Скотт побывал на концерте Бадди Гая и познакомился с блюзовой легендой, а уже в сентябре 1989 года Бадди
    пригласил 23-летнего гитариста в свой состав. Через три года работы у звезды чикагского блюза Скотт понял, что в перерывах
    между гастролями с группой Бадди у него есть достаточно времени и для собственной деятельности, и собрал свою блюзовую
    группу - Scott Holt Band. У Скотта была уникальная возможность изучить блюз не только у самого Бадди, но и у других грандов,
    с которыми играл Бадди во время гастролей: Эрика Клэптона, Джона Мэйолла, Альберта Коллинза и др. Но Хольт не ограничивается
    традицией, а старается внести в блюзовое звучание современные элементы и расширить тем самым границы жанра.


    На дебютнике представлен блюз-рок с изрядной долей фанка и интересным гитарным аккомпаниментом, хотя гитарные соло Скотта
    пожалуй слегка перегружены количеством нот в единицу времени. Сопровождающие музыканты играют очень прилично, и в целом
    диск вполне заслуживает внимания.'
