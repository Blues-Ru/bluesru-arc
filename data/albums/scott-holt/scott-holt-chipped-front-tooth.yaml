  text: Диск записан за один день. Таким образом, Скотт поставил эксперимент над самим собой – смогу, не смогу. Как он отмечает
    на вкладочке, не без помарок (в этом и аллегория названия), но в целом – крепко, громко, искренне. Иногда рок-н-рольный
    драйв, правда, несколько в ущерб блюзу.
