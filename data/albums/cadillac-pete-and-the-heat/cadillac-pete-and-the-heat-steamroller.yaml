  text: '"...the way Cadillac Pete blows harp will have you experiencing the cold blues chill. He plays the kind of harp that
    sends chills down to your toes...(only) a few harp men can breathe that kind of life into that Mississippi saxophone and
    touch oyur soul instantly!"


    Blues Harp Magazine


    Питер Ран по прозвищу "Петя-кадиллак" - американский блюзовый певец, композитор и харпер очень приличного уровня, который
    играет блюз уже довольно много лет и является обладателем двух премий музыкальной индустрии округа Висконсин за лучший
    инструментал на гармонике (в 1999 и 2001 годах).


    Вместе со своей группой The Heat Пит исполняет традиционный блюз с современным звучанием, причем в основном отдает дань
    традиционализму: никаких новых примочек, преимущественно консервативный подход. При этом играют музыканты очень прилично,
    легко обращаются к классике жанра (на диске есть пара каверов Уилли Диксона, включая классический номер Сонни Боя Уиллиамсона
    Help Me, исполненный очень неплохо), но не забывают и авторский материал. Пластинка наверняка не разочарует любителей
    традиционного блюза с солирующей гармоникой.'
