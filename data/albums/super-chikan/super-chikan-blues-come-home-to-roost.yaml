  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-18'
  text: 'Джеймс Луис Джонсон, получивший впоследствии прозвище Супер Чикан, родился
    в феврале 1951 года в г. Дарлинг, Миссиссиппи. Его детство прошло в дельте Миссиссиппи,
    причем музыка окружала Джеймса с самого начала: дед и дядя были музыкантами. Будущий
    блюзмен начал играть на акустической гитаре в 13 лет, а в 19 уже играл на басу
    в местных группах, переходя время от времени на гитару. Свое прозвище - Супер
    Чикан (или "супер цыпа") он заслужил благодаря своему умению подражать кудахтанью
    кур звуками своей гитары.


    Впоследствии Джонсон работал водителем грузовика, и во время долгих разъездов
    начал постепенно писать песни. Когда песен набралось достаточно много, он начал
    постепенно по возвращении домой с работы записывать их на кассеты. Джеймс записывал
    все партии сам, используя наложение. При этом он стремился, чтобы каждая новая
    песня не была похожей на все другие.


    Наконец Супер Чикан отправился в студию в Кларксдейле, где с помощью местных музыкантов
    записал 30 песен, 14 из которых вошли в его дебютный диск - Blues Come Home to
    Roost. Все песни написаны Джонсоном, который также отметился в качестве продюсера,
    и, кроме вокала, записал также партии гитары, баса и гармоники. Супер Чикан подходит
    к своему творчеству не слишком серьезно, и его блюз выходит временами довольно
    веселым. Интересный музыкант и любопытный альбом, который вышел исходно в марте
    1997 года и затем был переиздан в 2000 году.'
