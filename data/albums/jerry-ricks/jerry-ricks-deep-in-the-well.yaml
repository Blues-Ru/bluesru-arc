- id: 694
  author: Александр Панин
  mark: 8
  date: '2005-05-28'
  text: 'Это первый американский альбом Джерри, вышедший в 1997 году на лейбле Rooster. Он номинировался на три премии W.C.Handy,
    но ни одной так и не получил.


    Джерри Рикс в 60-е годы поиграл со многими именитыми блюзменами, в 70-е и 80-е жил и выступал в Европе, где записал ряд
    пластинок, в 90-е вернулся в Америку и выпустил там пока два альбома на Рустере. Он приезжал к нам в 2003-м году на эфесовский
    блюзовый фестиваль и выступил просто отлично!


    Диск очень длинный, здесь 14 треков почти на 70 минут. Большая часть композиций сочинена самим Риксом. Он играет один
    на акустической гитаре, играет элегантно и точно, вот только поет немного меланхолично и задумчиво, и за семьдесят минут
    его стиль пения чуть надоедает. Слайд, к сожалению, появляется только на одной песне под названием Ain''t Afraid Of These
    Blues. Отмечу еще хорошие каверы New Avalon и (инструментальный) Hesitation Blues. Удачный диск.'
