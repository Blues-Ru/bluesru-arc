- id: 1103
  author: Константин Колесниченко
  mark: 8
  date: '2007-06-26'
  text: 'Хаммонд решил осовремениться и, по всей видимости, это не совсем его решение. Подтолкнул его к этому продюссер и
    музыкант Garrett Dutton (aka G. Love). Я читал про G. Love в одном из журналов фирмы Hohner - молодой парень, играющий
    на гитаре и гармонике в холдере смесь блюза, рока и хип-хопа.


    Под "осовремениться" я имею ввиду, что Хаммонд разнообразил свой подход к музыке (ритм, аранжировки), да и звучание стало
    такое себе грязновато-развязное. Музыкантам, играющим блюз сегодня, не избежать таких изменений: движение в сторону рока,
    соула, хип-хопа. Этот подход давно уже использует, скажем, Keb'' Mo''. Вот до него и добрался Хаммонд. К счастью, у Джона
    хватило вкуса и мудрости не переборщить, и на одних песнях использовать его на полную катушку (например, даже элементы
    рэп-речетатива), а на других играть в традиционной для себя манере.


    С Хаммондом играют отличные и известные музыканты: Bruce Katz - piano, organ; Marty Ballou - bass; Stephen Hodges - drums.
    Альбом является как бы надстройкой над предыдущим "In your arms again". Джон добавил клавиши, новые ритмы и аранжировки,
    но рычит, как прежде. По-моему, Хаммонду идут такие изменения.'
- id: 1235
  author: Андрей Евдокимов
  mark: 7
  date: '2008-03-22'
  text: 'Блюз – долгая музыка. Обычно занимает всю жизнь. Подарок за это только один: артисты-ветераны переходят в категорию
    тех, чьи новые альбом нужно покупать обязательно. Джон Хэммонд-младший – один из таких. Ему 64 года, дебютный альбом он
    выпустил 45 лет тому назад. Но знатока его творчества ждет шок от его нового альбома. Хэммонд набрасывается на 12 блюзов
    с азартом новобранца. Ровно на середине альбома он берет короткий антракт для исполнения изящного и сладкого блюза Eyes
    Behind Your Head. Пять песен сочинил он сам, что для Хэммондла – редкость. Он считается интерпретатором, но не автором.
    Остальные почерпнуты из репертуара блюзовых классиков и примкнувшего к ним Тома Уэйтса. Ансамбль квази-акустический, но
    играет с энергетикой гаражного рока. Ветераны блюза не перестают удивлять своим талантом постоянно удивлять.Если такой
    человек, как Джон-Хэммонд, все еще играет, значит, блюз не закончился. Полвека в блюзе. Никогда не был повторителем прошлого.
    Но никогда и не изменял традициям. Его новый альбом традиционен в лучшем понимании этого слова. И одновременно свеж и
    красив. Большая часть песен – его собственного сочинения. Гитара – выдерживает спокойный шафл. Несколько песен – просто
    шутка, но весь альбом – очень всерьез. Это тот блюз, который играют в своем кругу. И такую науку нужно постигать всю жизнь.
    Хэммонд излагает это искусство не банально. Но и без внешнего блеска. Не юноша уже.'
