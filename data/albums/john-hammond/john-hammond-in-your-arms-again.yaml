- id: 701
  author: Сергей Кириченко
  mark: 10
  date: '2005-05-29'
  text: 'Альбом открывается зажигательной акустической "Jitterbug Swing", вещь Букки Вайта в аранжировке Хаммонда. Джон потрясающе
    играет на нэйшнл стил гитар слайдом, звук очень вкусный и сразу понимаешь, что этот альбом будет в большую радость. Далее
    рэй-чарльзовская "I''ve Got A Woman", здесь уже присутствует ритм-секция, прекрасный веселый вокал. Джон заводит. Следующая
    "In Your Arms Again", сочинена самим Хаммондом, отличный кантри блюз - нэйшнл стил, чуть гармошки, простые ударные - реинкарнация
    доброго старого блюза от Мастера. Четвертая вещь "I''m Leavin'' You" Хаулин Вульфа - блюз с полноценным бэндом, чуть выпячена
    ритм-секция, в меру гармошки. Веселое состояние сохраняется. И далее опять же чарльзовская "Fool For You", оригинальное
    исполнение Джона. Классика на шестом треке - диксоновская "Evil", Джон всегда выделялся необычностью исполнения обычных
    вещей. Вот и тут так. Отличная гармошка на треке. Следующая авторская вещь "Come To Find Out", как мне показалось, перегружена
    гармошкой в верхнем регистре, но вокал и гитара безупречны. Джон отлично играет на гармошке, он далеко не виртуоз, но
    тем не менее - джиммиридовская "You Got Me Crying" насыщена такой игрой. Степенный вокал, четкая ритм-секция - прекрасно!
    Следующий трек - хукеровская "Serve Me Right To Suffer", медленный блюз, во время гитарного соло просто замираешь - настолько
    все здорово (возникает ассоциация с также трогающим соло в мэйалловском исполнении "All Your Love"). Далее еще одна песня
    Хаулин Вульфа "Moanin'' For My Baby" - близко к оригиналу, но не сильно близко. И еще один старый блюз - вещь Перси Мэйфилда
    "My Baby''s Gone", несколько "истеричная" и резкая гармошка, отличный вокал, в целом опять "пятерка"! И в завершении альбома
    просто шедевр Мастера от другого Мастера - "I''ll Be Your Baby Tonight"! Без комментариев!!!


    Превосходный альбом, лучший из последних альбомов Джона Хаммонда "по блюзу" - очень позитивный и красивый. Всем скорее
    бежать в магазины!


    Диск выпущен лэйблом "Back Porch" в этом году и просто превосходно записан! Джону на альбоме помогали Stephen Hodges (ударные)
    и Marty Ballou (бас).'
- id: 800
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-08-09'
  text: 'Трудно в это поверить, но в 2005 году Джон Хаммонд выпускает один из своих лучших дисков - In Your Arms Again. Он
    в сопровождении только басиста и барабанщика, на остальных инструментах играет сам (разные гитары и гармошки).


    Этот диск звучит как живая запись, лишь иногда Джон накладывает вторую гитару и гармошку. Очень интересен подбор материала
    - от кантри-блюза до ритм-н-блюза и Боба Дилана (есть тут две вещи Рэя Чарльза, песня Перси Мэйфилда и "I''ll Be Your
    Baby Tonight"). Разнообразные темы и аранжировки, сразу слышно, что Хаммонд хотел сделать эклектичный и "новый" по звуку
    альбом. Не удержался он и от "Serve Me Right To Suffer" Хукера и классической "Evil" Уилли Диксона.'
- id: 1447
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: 'Славную дискографию длинной в 42 года Джон Хэммонд пополнил достойным альбомом. Хэммонд славен не как сочинитель,
    а как интерпретатор. Новый диск представляет лишь две песни его сочинения (одна из них дала ему название). Остальное –
    классика жанра, плюс знаменитая I''ll Be Your Baby Tonight Боба Дилана, сыгранная "на закуску как бы в шутку". Все записано
    в составе трио: гитара, бас, ударные. Общее звучание ориентируется на традицию, но сыгранно и спето - с актуальной страстностью.
    Хэммонд вновь подтверждает свое виртуозное владение акустической гитарой. Недлинный по нынешним временам альбом из 12
    песен оставляет и вовсе редкое чувство, что хотелось бы послушать еще.'
