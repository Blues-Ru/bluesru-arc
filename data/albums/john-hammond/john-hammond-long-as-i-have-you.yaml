reviews:
- id: 148
  author: Дмитрий Казанцев
  mark: 9
  date: '2003-08-17'
  text: Я слышал почти все его альбомы, владею дюжиной номерных и концертников, но все, что мне сильно нравится - это 60-е
    и 70-е; остальные просто ОК (ну что-то типа бесконечных альбомов Джона Мэйолла). Слышал последние пластинки Джона и его
    переделки Том Уэйтса - все это неплохо, но этот диск понравился целиком. Удивительно, конечно. Отличный подбор материала,
    блистательная игра в разных стилях, отличный звук и продюсирование (три трека нарулил J.J. Cale - они работали вместе
    и раньше) - все это очень здорово и красиво.
