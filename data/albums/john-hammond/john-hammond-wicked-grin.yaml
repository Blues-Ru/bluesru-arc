- id: 321
  author: Евгений Долгих
  mark: null
  date: '2003-12-02'
  text: 'Джон Хэммонд, мастер фолк-блюза, совершенно неожиданно выпустил альбом блюзовых аранжировок песен Тома Уэйтса. Спродюсировал
    этот проект сам Уэйтс, да еще и сыграл на гитаре, так что можно смело говорить о совместной работе этих непохожих друг
    на друга исполнителей.


    Результат получился сногсшибательный - все вещи Уэйтса сохранили свой мгновенно узнаваемый колорит и еще приобрели настоящий
    блюзовый грув. Ковбойский лихой образ Хэммонда - это как новая одежда для старых песен. Странное ощущение - все время
    сравниваешь про себя уэйтсовский и хэммондовский варианты и никак не можешь понять, что же лучше. Голос у Хэммонда, конечно,
    не такой выразительный, но зато блюзовый стопроцентно, что работает на контрасте с Уэйтсом. Причем в этот альбом не выбрано
    для исполнения ни одной вещи с единственного действительно блюзового диска Уэйтса "Blue Valentines" - наверное, просто
    неинтересно было.


    А эти переделанные песни проявили себя каждая с какой-нибудь неожиданной стороны. Я попытался угадать, как же будут сделаны
    здесь знакомые мне до того по исполнению Уэйтса вещи, и почти ни разу не смог. Все слушается на одном дыхании - а такие
    песни, как "Shore Leave" и "Jockey Full Of Bourbon", просто заставляют забыть обо всем. Два артиста, соединив свои усилия,
    выдали альбом, который делает честь им обоим. Рекомендуется как блюзфэнам, так и почитателям самого Уэйтса с равным успехом.'
- id: 414
  author: Дмитрий Казанцев
  mark: 6
  date: '2004-01-08'
  text: 'Не может быть! Медведь в лесу сдох! Джон Хаммонд записывает концептуальный диск! Он не играет традиционные блюзы!
    Он поет 12 песен Тома Уэйтса! Что же делать? Брать диск сразу или бояться и хулить? Надо отслушать.


    Дело в том, что Том Уэйтс тоже есть на этом альбоме. Он продюсер, он хлопает в ладоши, он присутствует на записи. А теперь
    подумайте, похож ли Том на Джона? Нет, вообще не похож. Том - забияка, безумец, всю жизнь ломающий каноны и стандарты.
    Джон - умница, консерватор, традиционалист. Что-то типа Фрэнк Синатра исполняет "хиты" Фрэнка Заппы. Вы можете сказать,
    что контраст - это классно, но я Вам повторю, что Том тоже есть на записи, и этот факт ломает все! Звук тяжелый и грязный,
    Хаммонд явно переигрывает местами, он же не псих, но пытается изображать такового местами. Джон далек от театра, а Том
    им живет. Блюзовой классикой эти песни не станут никогда, но многие из них потеряли шарм оригинального исполнения Уэйтса.
    Сравните хоть великую Clap Hands в исполнении Джона и оригинал. От оригинала бегут мурашки, от версии Хаммонда ничего
    не бежит, просто обычная песня. Так он может поступать с песнями Диксона или Джонсона, но только не с таким материалом,
    как Том Уэйтс.


    Оценка 3 балла! Играют и поют классно, но кто же ожидает лажи? Концепция отличная, но почему так скучно, и что там делает
    сам Том? Он просто не сочетается с Джоном! Они нашли друг друга с Уиллиамом Бэрроузом, но это совсем другой менталитет
    и воспитание. Хамонд хоть и из Нью-Йорка, но по характеру он "деревенщина" и увалень; Том должен был это понимать.'
- id: 1167
  author: Константин Колесниченко
  mark: 10
  date: '2007-12-05'
  text: Кто такой Джон Хаммонд? Великий блюзовый интерпретатор, удивительным образом за долгую блюзовую карьеру написавший
    своих песен совсем мало (да и то, в основном, на последних альбомах). Кто такой Том Уэйтс - это театральщина, иногда страшные,
    а иногда правдивые истории, музыкальный коктейль. Совместимы ли они на одном альбоме? Что будет, если блюзовый Джон споет
    песни Тома, а последний подыграет ему? Большое количество рецензентов остались неудовлетворены такой коллаборацией, признали
    такой союз несовместимым. Я же придерживаюсь другой точки зрения. Джон и Том, возможно, разные по форме, но очень похожие
    по сути музыканты. Своим творчеством они рассказывают одинаковые истории, только в случае Уэйтса, они приправлены изрядной
    долей гротеска и особого Томового юмора. Что дала им такая запись? Для Хаммонда - это замечательная возможность освежить
    свой материал, а для Уэйтса - придать своей музыке человеческое лицо. Немаловажным фактом является также потрясающий вокал
    Джона, который является равноценной заменой знаменитому хрипу Тома. Состав музыкантов на альбоме замечательный, помимо
    Хаммонда и Уэйтса, Charlie Musselwhite - harp, Augie Meyers -accordion, keyboards, Larry Taylor - bass, Stephen Hodges
    - drums.
- id: 2039
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2012-02-03'
  text: 'Знаменитый Джон Хэммонд записал альбом песен Тома Уэйтса (первые 12 треков, последний - традиционный госпел) с участием
    Тома Уэйтса, выступающего и как музыкант, и как продюсер. В результате традиционализм Джона слился с безбашенностью Тома
    и получился альбом современного блюза, довольно далекий от оригинального авторского звучания. Боюсь, ярым поклонникам
    Уэйтса альбом может не понравиться, зато для остальных он окажется приятной неожиданностью. Из блюзовых грандов на диске
    отметился мастер губной гармоники Чарли Масселуайт.


    Третье место в топе блюзовых альбомов Биллборда.'
