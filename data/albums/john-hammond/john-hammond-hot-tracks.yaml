- id: 559
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-04-02'
  text: 'Довольно поздний альбом Джона на Вангарде. Джон и еще квартет классных парней (он сам даже не играет на гармошке,
    что редкость). Очень четкий, жесткий и честный блюз. Куча известных треков, конечно, но Джон всегда знает что и как поменять
    чтобы не было скучно.


    10 классных блюзов и отличная запись. Джон давно нашел свой звук и стиль.'
