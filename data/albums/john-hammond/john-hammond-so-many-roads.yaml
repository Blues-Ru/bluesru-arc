- id: 558
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-02'
  text: 'Четвертый альбома Джона для Вангард Рекордз очень интересен по составу. Тут ему помогают три участника будущей группы
    The Band - Робби Робертсон на гитаре, Левон Хелм на ударных, Гарт Хадсон на Хаммонд-органе. На гармошке Чарли Масселуайт,
    Джимми Люис на басу, а Майк Блумфилд на пианино (странно даже). С таким-то составом трудно наиграть что-то плохое, сами
    понимаете.


    Альбом длинный, на нем записано 12 блюзов. Очень много "хитов", но это обычно для Хаммонда; он как бы каждый раз записывает
    этакий The Best Of The Blues. Тут есть Down In The Bottom, Who Do You Love, So Many Roads, You Can''t Judge A Book, Baby
    Please Don''t Go, Big Boss Man. Хорошие песни, не так ли. Трудно сказать что это - блюз или блюз-рок, но скорее второе.
    Талантливые белые парни по-своему подают старый материал. Очень серьезная работа для 65 года; ну может звук чуть подкачал.


    И все же Джон еще не нашел свой собственный фирменный стиль, и продолжает копировать и "играть" в блюз. Но даже такой
    театр очень даже съедобен.'
