  author: Андрей Евдокимов
  mark: 7
  date: '2010-01-18'
  text: 'Знаток блюзовой истории Джон Хэммонд выпустил альбом Rough & Tough – "Грубый и сильны" В альбоме Rough & Tough две
    песни – его сочинения, еще одна песня – авторства его друга Тома Уэйтса "Вставай за мулом" - Get Behind the Mule. Впервые
    Уэйтс записал эту песню с помощью Джона Хэммонда для своего альбома The Mule Variations, затем Хэммонд включил ее в свой
    альбом, полностью собранный из песен Уэйтса "WickedSmile", и вот в прошлом году появилась сольная акустическая версия.


    Но это лишь одна из трех относительных новых песен в альбоме Rough & Tough. Остальные 12 – чистая блюза классика, песни,
    ставшие блюзовыми стандартами, и песни почти позабытые. Ре"дко испо"лняется отличная песня Джерри МакКейна "She is Tough"
    – Она крута.


    Новый альбом блюзового ветерана Джона Хэммонда примечателен еще и тем обстоятельством, что записан, так сказать, на едином
    дыхании. Фирма Чески гордится, что все записано на один микрофон, никакого монтажа многоканальной записи и пересведения,
    даже никаких компрессоров. Губная гармоника закреплена в холдер, так что Хэммонд солирует на гармонике аккомпанируя сам
    себе на гитаре. Манера свойственная архаичному блюзу. Но Хэммонд смело переиначивает под акустический кантри блюз и песни,
    которые в оригинале звучали с электрофицированным составом. Например I got To Find My Baby – "Я должен отыскать свою крошку"
    - Литл Уолтера, записанная им в 1954 году. В альбоме Хэммонда – две песни еще одного музыканта, работавшего в студии Чесс
    – Хаулин Вулфа.


    Хэммонд – ярый хранитель блюзовых традиций, знаток блюзовой истории. Однако он всегда не прочь поэкспериментировать. В
    новом альбоме его акустика звучит довольно далеко от традиционного кантри-блюза. Он переигрывает оригиналы, не копируя
    их. Тем интересней, что ближе всего к традиционной манере исполнения в его альбоме оказалась одна из двух песен его сочинения.'
