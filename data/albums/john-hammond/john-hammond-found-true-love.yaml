- id: 413
  author: Дмитрий Казанцев
  mark: 6
  date: '2004-01-08'
  text: 'Ключевые слова: 1996, Virgin, Pointblank Records, Duke Robillard - знакомые песни и звуки, хороший звук и прекрасное
    исполнение. Ах да, забыл слово БЛЮЗ. Традиционный блюз. У Хаммонда он был и в 1963-ем, и 1973-ем, и 1996-ом. Мы уже привыкли
    к тому, что Джон ничего не создает, а мы его все равно любим и слушаем!


    На этом диске 12 треков на 43 минуты. Дюк Робиллард продюсирует этот альбом вместе с Джоном. Он же играет на гитаре. В
    последнем треке в гости пришел Чарли Масселуайт и поиграл с Джоном на харпе. Все мило, красиво, обычно, скучно...


    Оценка 3 балла. Солидная работа, но что-то не так с подбором материала. Скучновато местами. Я даже не могу выделить лучшие
    треки. Звук холеный, но не цепляет. Альбом явно слабее его дисков 70-х годов. Этот альбом очень нужен только упертым любителям
    традиции и фанатам Хаммонда.'
