  author: Артем Липатов
  mark: null
  date: '2008-01-28'
  text: 'Джон Хэммонд играет блюз вот уже сорок лет. Не мудрено, если отец у тебя – Джон Хэммонд-старший, великий продюсер,
    открывший миру целый сонм звезд, начиная с Билли Холлидей, продолжая Каунтом Бейси, Чарли Крисченом, Эритой Фрэнклин и
    заканчивая Бобом Диланом и Брюсом Спрингстином... Между прочим, это в группе Хэммонда-младшего в Cafe Au Go Go играл никому
    не известный юный Джими Хендрикс, когда его впервые услышал Чес Чендлер, приведший Джими впоследствии к славе.


    Но Джон-младший пошел собственной дорогой.


    На протяжении всей своей карьеры он исследовал глубины и высоты традиционного блюза. Лишь два года назад он сошел с этой
    дорожки, выпустив альбом песен старинного друга, Тома Уэйтса (Wicked Grin), альбом непростой и многими встреченный в штыки.
    Но Джон доказал и себе, и всем вокруг – не одной акустической гитарой и, более того, не только традицией жив и силен блюз.


    Вот и на новом диске он снова играет на электро, да и список авторов, чьи песни звучат, тоже более чем разнообразен (Вилли
    Диксон, снова Том Уэйтс, Дэвид Идальго из Los Lobos, Джордж Джонс, Джагтер-Ричардс). Идальго, кстати говоря, выступает
    здесь в роли продюсера и гитариста, что придает электрическому блюзу Хэммонда непередаваемую техасско-мексиканскую окраску
    (словно в давно знакомое блюдо сыпанули изрядную пригоршню перца чили). Интересно, что композиция Slic Crown Vie - единственная
    на диске и вторая в биографии музыканта, написанная им самим (первой была Baby, Won''t You Tell Me на альбоме-1964 Big
    City Blues). Диксоновская Same Thing - лучшая из версий его песен, слышанных мною, а песня Билли Холлидей (привет отцу,
    видимо) Comes Love из откровенного свинга чудесным образом стала медленной и тягучей балладой... Том Уэйтс, написавший
    для диска не только песню Gin Soaked Boy, но и текст для буклета, отмечает: "Джон Хэммонд с его гитарой, гармошкой и голосом,
    может звучать и как поезд, несущийся в ночи на всех парах, и так, словно он боится разбудить спящего ребенка".


    Ну и что еще добавить? Разве только отметить трогательное посвящение жене, Марии Хэммонд, "подруге, товарищу по работе
    и вдохновению на протяжении последних тринадцати лет".


    А еще говорят, блюз - это когда женщина уходит.'
