- id: 412
  author: Дмитрий Казанцев
  mark: 8
  date: '2004-01-08'
  text: 'Это первый альбом Джона на Rounder Records. На КД в Европе он выпущен на
    Virgin (Sky Ranch Records, Millesime Records). На диске 13 песен и длится он 42
    минуты. Альбом записан в Нью-Йорке в знаменитых Skyline Studios и звучит он просто
    отменно! Половина пластинки записана с бэндом, а другая половина в одиночку или
    дуэтом с пианистом Бобом Монталто. Джон поет, играет на харпе и гитаре, как обычно,
    его бэнд это: Чарльз Отис на ударных, Шерман Холмс на басу и Робби Кондор на пианино.
    Малый состав, четкость аранжировок, продуманность треков на альбоме. Еще один
    классный альбом Джона. А чего нам еще ожидать? Ничего нового, но все очень интересно
    и красиво. Много известнейших блюзов, как обычно, плюс целых два блюза Роберта
    Джонсона! Надо будет подсчитать, сыграл ли Джон все 29 песен великого Роберта.


    Оценка 4 балла. Сильный альбом, но ничего нового и сногсшибательного. Надо выделить
    My Babe, Seventh Son, Help Me, Give Me A 32-20, Hot Tamales, Diddley Daddy - эти
    треки очень хороши! Джон отлично играет Джонсона, Биг Джо Уиллиамса и Бо Диддли
    заодно. Если Вы любите хороший, обычный и правильный блюз, купите этот диск!'
