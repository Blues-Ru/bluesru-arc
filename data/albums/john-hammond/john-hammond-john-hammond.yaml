- id: 415
  author: Дмитрий Казанцев
  mark: 6
  date: '2004-01-08'
  text: '20-летний белый блюзмен из "Лонг-Айлэнда". Сразу вспоминается злая шутка из фильма про Перекресток. Но к Хаммонду
    это не относится, он отлично играет и поет, он копирует и ищет свои ходы.


    Это дебютный альбом Джона, он записан на лейбле Vanguard. Лэйбл в основном фолковый, и Джон - один из самых блюзовых исполнителей
    на нем. Он играет на гитаре, стучит ногой в пол, дует порой в гармошку (потом дуть он станет больше). Он еще не нашел
    своего голоса, во всех песнях он звучит по-разному, копируя разных архаичных черных. У него хорошо это получается. Да
    и вообще, много ли мы знаем белых ровесников Битлз, которые записали акустическую блюзовую пластинку в 1963 году? Разве
    что Боб Дилан, и тот сам писал песни, в основном. Вся эта ранняя игра в блюз явно некоммерческая, и это большой плюс.
    Джон старается, он нервничает, играет в разных темпах, заигрывает с разными голосовыми приемами. Забавно сравнивать его
    первые альбомы с матерыми альбомами 70-х и позднее.


    Оценка 3 балла. Джон очень старается, но все как-то сыро и неуверенно местами. Настоящая работа 20-летнего блюзмена! Не
    поп-идола, но человека, избравшего альтернативный и сложный путь. Лучшая песня? Я бы выделил Louise...'
