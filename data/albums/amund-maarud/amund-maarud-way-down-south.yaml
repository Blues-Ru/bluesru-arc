  date: '2009-06-22'
  text: 'В моей классификации блюзовых гитаристов Мэтт Гитар Мерфи находится сразу
    в двух категориях: "эстеты" и "лучшие аккомпаниаторы". Эстет Мэтт потому, что
    его соло всегда лаконичны, виртуозны, но не надуманны.А лучший аккомпаниатор он
    потому, что большую часть своей карьеры он провел играя в группах других известных
    блюзменов – вся тусовка Чесс, Мемфис Слим, Чак Берри, Джеймс Коттон, Блюз Бразерс
    и др.


    "Way Down South" - это первый сольный альбом Мерфи, записанный им довольно поздно,
    когда ему уже перевалило за 60. Примечательно, что запись эта сделана с его братом
    Флойдом Мерфи (в две гитары записана отличная "Thump Tyme"), тоже довольно известным
    блюзовым гитаристом. Альбом этот – отличная подборка музыки, которую играл Мерфи
    на протяжении всей своей карьеры, работая в группах других музыкантов, – фанк,
    чикагский блюз, свинг, ритм-н-блюз.


    Единственное слабое место альбома – это характерный звук записей начала 90-х,
    но музыку он совсем не портит, просто нужно же к чему-то придраться.'
