reviews:
- id: 486
  author: Сергей Колобашкин
  mark: 10
  date: '2004-03-12'
  text: Я всегда очень тепло относился к этой группе. Это их первый альбом, и для первого альбома он звучит просто восхитительно,
    клевый звук, клевые музыканты, кстати, на сегодняшний день в группе нет ни одного ветерана! Альбом начинается с замечательной
    песни "She Does It Right". Очень мне нравится их интерпретация песни "Boom, Boom", она вторая на альбоме. Самой клевой
    песней на альбоме остается "Roxette", которая стоит всего диска. "Twenty Yards Behind" - это замечательный рок-н-ролл,
    великолепное исполнение. "I Don't Mind" долгое время являлась визитной карточкой группы. В принципе, этот диск можно считать
    лучшим из всех творений группы, короче говоря, всем старым любителям хоорошего рок-н-ролла стоит найти этот альбом, он
    золото! Моя оценка пять, без всяких разговоров!
