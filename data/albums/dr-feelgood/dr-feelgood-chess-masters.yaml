- id: 245
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Ура! Dr. Feelgood вновь на сцене. Или в студии. А скорее - и там, и там.
    Правда, от первого состава совсем никого не осталось. На сегодняшний день ветеранами
    Dr. Feelgood уже считаются барабанщик Kevin Morris и басист Phil Mitchell, пришедшие
    лишь в середине 80-х. Гитарист Steve Walwyn появился и того позже - в конце 80-х.
    Ну, а вокалиста Robert Kane группа впервые представила своим поклонникам ровно
    год назад, в августе 99-го.


    Тем не менее послушать "Chess Masters" стоит. Это, конечно, не шедевральные "Malpractice"
    или "Sneakin'' Suspicion", но тоже ничего. Вплоть до того, что Steve Walwyn периодически
    напоминает саундом своего предшественника Wilco Johnson.


    Идея "Chess Masters" очень проста. Участники группы просто взяли да и записали
    14 шедевров, в свое время прославивших хорошо известный в джазового-блюзовом мире
    лейбл Chess. Так, в альбом вошли знаменитая "Susie Q" (очень интересная акустическая
    версия), блюзы "Hoochie Coochie Man" и "29 Ways" Willie Dixon и так далее. Мне
    лично больше всего понравилось, как группа отыграла известный блюз Sonny Boy Williamson
    "You Gotta Help Me". Кстати, помимо вышеперечисленной четверки музыкантов, составляющих
    сегодня Dr. Feelgood, в записи местами участвовали исторически нехарактерная для
    группы духовая секция и три клавишника, один из которых - сам Rick Wakeman. Правда,
    его тут почти и не слышно.'
- id: 2024
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-11-16'
  text: 'Вот такой вот танцевальный подарочек всем от мастеров британского паб-рока
    и блюз-рока: гарантирую, что ноги сами пустятся впляс!


    На этом диске группа записала каверы знаменитых классических синглов, которые
    исходно были записаны в шестидесятые на студии Chess Уилли Диксона разными артистами
    (а затем еще бОльшим количеством артистов перепетые), причем сделала это превосходно,
    с хорошим драйвом, украсив рок-н-рольное звучание эпизодическими духовыми и саксофоном.


    Конечно, если Вы привыкли к оригинальному звучанию, данные современные версии
    могут показаться чрезмерно "тяжелыми" и заводными, но зато для вечеринки это самое
    оно. Ну так ведь Dr. Feelgood уже на протяжении многих лет совершенно справедливо
    зовутся "королями вечеринок"!'
