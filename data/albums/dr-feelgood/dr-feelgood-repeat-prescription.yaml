  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-11-16'
  text: 'Одна из легендарных групп британского паб-рока, Dr. Feelgood была создана в 1971 году вокалистом Ли Брилле, и вплоть
    до его преждевременной кончины от рака в 1994 году радовала поклонников взрывной смесью рок-н-ролла и блюз-рока. В первую
    очередь группа прославилась благодаря своим мощным концертным выступлениям. Особого успеха в Америке музыкантам добиться
    не удалось, однако у себя на родине они были довольно популярны и получили своего рода культовый статус.


    На последней студийной пластинке новейшая реинкарнация группы переписала старые хиты, обеспечившие успех группы на протяжении
    предыдущих лет. Так что тут мы имеем своего рода The Best, но только в новой интерпретации. Хорошая пластинка качественного
    блюз-рока, под который приятно посидеть с приятелями за кружечкой пива, а заодно и попеть и потанцевать :-)'
