  date: '2011-11-16'
  text: 'Dr. Feelgood - Singled Out: The UA/Liberty A''s B''s and Rarities (3 CD box)


    Трехдисковый бокс от легенды британского паб-рока и блюз-рока охватывает преимущественно период их наивысшего рассвета
    в середине и конце 70-х (с 1974 до 1981 года).


    На первом диске собраны основные синглы (стороны А), на втором - обратные стороны синглов (стороны В), а на третьем -
    раритеты. Материал первого диска наиболее известен для слушателя, второй диск содержит чуть менее знакомые треки, а на
    третьем диске представлен преимущественно редкий фанатский материал - в основном концертные записи, включая 3 трека, записанные
    на BBC в 2000 году. Кроме этих трех последних треков, на всех остальных вокал и гармоника от основателя группы Ли Брилле.'
