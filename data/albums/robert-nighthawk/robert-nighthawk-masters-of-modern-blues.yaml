- id: 1523
  author: Сергей Исправников
  mark: 10
  date: '2009-04-11'
  text: 'Четвертый, заключительный, выпуск серии "Мастера современного блюза" был
    издан на лейбле Testament в 1968 г. и посвящен памяти выдающегося мастера блюзовой
    слайд-гитары Роберта Найтхоука, скончавшегося осенью 1967 г. В отличие от более
    современного на тот период варианта чикагского блюза, представленного на первых
    трех выпусках серии, здесь отражен городской уличный блюз, неразрывно связанный
    с традициями довоенных странствующих блюзменов. Это касается обоих представленных
    здесь исполнителей – как Найтхоука, так и Хьюстона Стакхауса. Роберт Найтхоук
    родился в Арканзасе в 1909 г. и с конца 20-х гг. уже странствовал по Югу США,
    где встречался со многими легендарными мастерами, включая Sleepy John Estes и
    Charlie Patton. В 1937 г. под именем Robert Lee McCoy он сделал свои первые записи
    для лейбла Bluebird. Впоследствии периодически записывал отдельные треки на различных
    лейблах, включая чикагский Aristocrat/Chess, однако долго не засиживался на одном
    месте – его всегда тянула дорога. Наконец, в 1964 г. он вернулся в Чикаго, однако
    блюзовая сцена оказалась занята молодыми исполнителями, игравшими в более современной
    манере. Когда удавалось, он выступал в отдельных клубах, а в теплое время года
    каждое воскресное утро играл прямо на улице на Maxwell Street.


    В мае 1964 г. Найтхоука пригласили принять участие в сборном блюзовом концерте
    в Чикагском университете, где и был записан представленный на этом диске "Kansas
    City". На губной гармонике ему аккомпанировал не кто иной, как Литтл Уолтер, отдавая
    дань уважения человеку, чья техника слайда в свое время была образцом для Элмора
    Джеймса, Эрла Хукера и Мадди Уотерса. В октябре того же года состоялась другая
    сессия звукозаписи Найтхоука, включающая половину треков данного альбома. На этот
    раз ему аккомпанировали исполнитель на губной гармонике John Wrencher и гитарист
    Johnny Young, в то время регулярно игравшие с ним. Найтхоук исполнил свой традиционный
    репертуар в несколько отстраненной, даже меланхоличной манере. Его глубокий выразительный
    голос и мастерская техника слайда выражали скрытую силу, не проявлявшуюся в дешевых
    внешних эффектах. Сессия начинается с его наиболее известной вещи "Black Angel
    Blues", также следует обратить внимание на "I''m Getting Tired" и "Crying Won''t
    Help You".


    Вторая половина диска посвящена творчеству мало известного блюзмена Хьюстона Стакхауса,
    который в свое время научил Найтхоука играть на гитаре. Стакхаус родился в 1910
    г. в штате Миссисипи и был, в свою очередь, учеником легендарного довоенного блюзмена
    Томми Джонсона. Начиная с 1947 г. он более менее регулярно начинает играть с Сонни
    Боем Уильямсоном, выступая вместе с ним на радиостанции KFFA в Арканзасе. На состоявшейся
    в августе 1968 г. записи, включенной в данный диск, Стакхаус отдал должное своему
    учителю – Томми Джонсону, чье влияние особенно ощущается в сыгранных тогда "Big
    Road Blues", "Big Fat Mama Blues" и "Cool Water Blues". В отличие от Найтхоука,
    Стакхаус не был ни виртуозным гитаристом, ни выдающимся певцом, однако обладал
    необычной манерой исполнения, выделявшей его из общей массы чикагских блюзменов.
    Кроме гитары, он владел и губной гармоникой, на которой его еще в 1924 г. научил
    играть в Луизиане Эдди Джонс. Аккомпанируют ему здесь Найтхоук (2-я гитара) и
    Джеймс Куртис (ударные). Последний в свое время начинал играть на стиральной доске,
    только потом освоив традиционную ударную установку. Играл до войны с массой блюзменов,
    затем вошел в группу Сонни Боя Уильямсона, а после его смерти остался со Стакхаусом.
    Для Найтхоука это была последняя сессия – в конце того же года его не стало. Диск
    дополнен шестью бонус-треками, записанными на тех же сессиях, но не вошедшими
    в оригинальную пластинку.'
