- id: 989
  author: Дмитрий Казанцев
  mark: 8
  date: '2006-04-27'
  text: 'Это первый сольный альбом Майка. До этого он играл и был звездой в Paul Butterfield
    Blues Band, Electric Flag, Kooper/Bloomfield и в Kooper/Bloomfield/Stills. Тут
    играет много его бывших друзей из предыдущих проектов: Bob Jones - drums/vocals,
    John Kahn - bass, Fred Olsen - guitars, Ira Kamin - keys/banjo, Mark Naftalin
    - keys, Roy Ruby - organ, Michael Melford - guitar/mandolin/vocals, Orville Rhodes
    - steel guitar, Ron Stallings - sax, Mark Teel - sax, Gerald Oshita - saxes, Noel
    Jewkis - saxes, John Wilmeth - trumpet, Marcus Doubleday - trumpet, Richard Santi
    - accordion, The Ace Of Cups - vocals, Diane Tribuno - vocals, Nick Gravenites
    - vocals. Мощный состав как видите. Вокал Майка - не самое его сильное место (как
    и у Эла Купера), но вот гитара его поет разными голосами и всегда отлично.


    На этой пластинке есть блюзы, кантри, кантри-рок, соул и рок-н-ролл, конечно.
    Все очень душевно и классно, без истерик и показухи. Но вокалистов можно было
    и позвать, на самом деле.'
