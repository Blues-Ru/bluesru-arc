- id: 638
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-05-20'
  text: 'Двойной концертный альбом Блумфилда и Купера. Длится он почти 90 минут, но композиций на нем немного - очень длинные
    джемы. Запись 1968 года, она не самого лучшего качества. Группа неплохо играет, но Майк часто играет странные ноты (иногда
    гитара совсем не строит) - слышно, что он не очень трезв. В то же время, это первая запись, где Блумфилд поет (нельзя
    сказать, что он хорошо это делает). Купер поет лучше и прекрасно играет на органе и синтезаторах.


    Тут много известных тем и есть хорошие находки, но в целом все это похоже на случайный пьяный джем конца 60-х. Блюз, рок,
    психоделия. Этот двойник гораздо слабее предыдущего джема "Super Session" со Стивеном Стиллзом.'
