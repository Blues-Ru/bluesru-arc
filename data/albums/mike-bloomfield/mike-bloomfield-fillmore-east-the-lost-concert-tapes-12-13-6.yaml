  author: Дмитрий Казанцев
  mark: 7
  date: '2005-08-05'
  text: 'В 2003 году фирма Сони решила издать эти записи, сделанные еще в конце 1968
    года. До этого Эл и Майк работали вместе на знаменитом диске "Super Session" (1968)
    со Стивеном Стиллзом и записали знаменитый двойник "The Live Adventures of MB
    and AK" (1969). Почти весь материал на этом издании именно с этих альбомов. Блюзы
    и немного рока - вот что играли эти парни в конце 60-х. Майк вытащил на сцену
    еще неизвестного тогда Джонни Уинтера и тот тут же "запилил" и проорал дурным
    голосом - он уже тогда был таким.


    На записи много разговоров - мат-перемат (ничего не вырезано!); слышно, что ребята
    под кайфом. А играю неплохо, очень неплохо. Запись тоже на удивление качественная
    - можно слушать и получать удовольствие. И все же их студийные работы точнее,
    глубже и интереснее; в конце 60-х люди выходили на сцену порой совсем в неприличном
    состоянии, сами знаете.'
