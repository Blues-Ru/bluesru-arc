  text: Columbia 1994. Хорошая подборка раннего Блумфилда. Его блюз-роковые работы
    1964-1969. Пара песен с Paul Butterfield Blues Band, остальное - его коллаборации
    и свое. Тут очень много редких записей, которые не издавались до 1994 года. 71
    минута юного белого блюза и рока из Чикаго.
