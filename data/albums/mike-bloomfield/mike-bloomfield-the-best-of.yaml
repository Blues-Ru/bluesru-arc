- id: 88
  author: Андрей Евдокимов
  mark: null
  date: '2002-12-17'
  text: 'Корректней было бы назвать альбом: "Лучшее из записанного для фирмы "Такома". 70-е кризисный для Блумфилда период,
    он не находит места своему таланту, работает мало, а когда работает - то спустя рукава. Что заметно даже в лучших треках
    именного альбома "Майкл Блумфилд" 1978г. Но когда нему приходило вдохновение!.. Бесспорно, хорош "Сиротский блюз" Роберта
    Брауна, выбранные вместе с еще двумя треками из записанного в 1979г. альбома "Between The Hard Place & The Ground. Альбом
    вышел уже после смерти Блумфилда и, подозреваю, именно благодаря ей. Для конца 70-х представленный на нем блюз-рок совершенно
    устарел, и фирма имела основания сомневаться в коммерческой его состоятельности. Сейчас, когда имя Блумфилда само стало
    историей, эти соображения уже не имеют никакого значения. Собственно, историк прослушает эти три трека с тем большим интресом,
    что записать альбом собралась компания первопроходцев блюз-рока: в Блумфилду присоединился его коллега по блюзбэнду Пола
    Баттерфилда пианист Марк Нафталин и клавишник Барри Голдберг, с которым Блумфилд записывался с 60-х. Блумфилд мог вести
    в конце 70-х довольно разболтанный образ жизни, и некоторые треки могут послужить иллюстрацией к "Мастерство не пропьешь".
    Треки из акустического альбома 1977г. блистают филигранной точностью и тонкостью исполнения, и уникальною мягкостью гитарного
    "туше" Блумфилда. Перлами же сборника являются две песни, записанные еще в 1963г. в дуэте с ветераном-пианистом Little
    Brother Montgomery: по-домашнему просто, по-блюзовому грубо и энергично, и очень искренне. Поет на эти треках Монтгомери,
    первоначально они опубликованы были в 1980г. в сборнике "Редкий Блюз" (Rare Blues).'
