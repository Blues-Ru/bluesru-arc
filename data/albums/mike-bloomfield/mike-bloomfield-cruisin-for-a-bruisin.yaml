- id: 1073
  author: Дмитрий Казанцев
  mark: 7
  date: '2007-05-12'
  text: 'Один из последних альбомов Майка, он умрет в феврале 1981 года. Блумфилд
    игарет на гитаре и клавишах, и поет (пение - его слабое место, к сожалению). С
    ним играет ритм-секция + два духовика и гармонист. Секстет исполняет вокальный
    и инструментальный блюз и ритм-н-блюз. Поскольку вокал Майка далек от совершенства,
    инструментальные номера лучше вокальных. Гитара очень хороша тут и там, но все
    же это уже не тот Блумфилд, который "зажигал" в 60-х и в начале 70-х.


    Редкий альбом, его нет на компакт-диске.'
