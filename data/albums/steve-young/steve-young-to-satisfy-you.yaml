- id: 911
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-11-27'
  text: 'Еще один интересный singer/songwriter. Обычно он исполняет свои песни, и они близки к кантри и фолку. На этом же
    альбоме Стив поет 9 чужих номеров и лишь один свой! И стиль совсем не кантри, но сильно приблюзованный рутс-рок, местами
    близкий к музыке Джей Джей Кейла, например. Есть здесь очень известные вещи: "Top of the World", "Corrina Corrina", "No
    Expectations" (Rolling Stones), "Wild World" (Cat Stevens). Диск записан в Нэшвилле, звук прекрасный для 80-х годов.'
