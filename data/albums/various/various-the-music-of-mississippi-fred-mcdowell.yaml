- id: 1308
  author: Дмитрий Казанцев
  mark: 8
  date: '2008-07-01'
  text: 'Прекрасный аудиофильский трибьют великому Фрэду. Здесь 12 треков и не самые известные блюзмены, конечно. Ведь надо
    играть Дельта-блюз, а это дело не простое. Paul Geremia сносит башню в самом первом треке. Очень хорош Charlie Musselwhite,
    а Anders Osborne великолепен в "Kokomo Blues". Brian Stoltz прекрасно делает корневой вариант "You Gotta Move". Tab Benoit
    отличился в "Train I Ride", Kenny Neal просто перевоплощается в "Worried Life Blues". "I Rolled and I Tumbled" досталась
    Стиву Джеймсу, а Скотту Холту - "Little Schoolgirl". Есть тут пара номеров с ритм-секцией, но они выбиваются и значительно
    слабее остального материала.


    Отличный диск для любителей старины и современного рутс-блюза.'
