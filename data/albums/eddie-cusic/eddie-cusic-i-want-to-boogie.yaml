  author: Александр Панин
  mark: 10
  date: '2005-05-20'
  text: 'Единственный диск Эдди Кьюсика вышел на лейбле Hightone в 1998 году, когда исполнителю было уже за семьдесят. До
    этого он успел отметиться на фундаментальной антологии Living Country Blues, но больше вроде бы вообще не записывался.
    Очень жаль, ибо изданный материал просто великолепен!


    На диске пятнадцать композиций, почти все из них каверы. Кьюсик играет корневой акустический дельта-блюз, и это уже очень
    здорово. Еще интереснее то, что он трактует в том же духе и ряд традиционных чикагских вещей. Например, такой заезженный
    электрический стандарт, как Hoochie Coochie Man, в акустике звучит просто превосходно. Также на диске отменные версии
    Catfish Blues, Big Boss Man, Good Morning Little Schoolgirl. То, что надо!'
