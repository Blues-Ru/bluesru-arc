- id: 89
  author: Андрей Евдокимов
  mark: null
  date: '2002-12-17'
  text: 'Первый "аллигаторовский" альбом Роя Бьюкэнона, возможно, действительно самый цельно-блюзовый, как то утверждает статья
    на конверте. Заглавный блюз - великолепен; нетороплив (с интродукцией "бьюкэнэновская бахиниана" в стиле Блюз) - и эмоционален
    до предъинфарктного состояния. Как всегда хороши гитарные импровизации. Они и есть основное блюдо на этом роскошном пиру
    для почитателей электрогитарного блюза. Но и присутствие достойных гостей придает альбому новые интересные грани. Отис
    Клэй со всей увременностью опытного мастера поет соул-блюз, в то время как молодая певица Глория Хардиман поет соул ближе
    к традициям госпелл. Их голоса уравновешивают эмоциональность-на-грани-нервного-срыва импровизацией Бьюкэнона. Его гитара
    часто звучит близко к истерике - но полную волю воплям он дает ей в предфинальном инструментальном номере, в шутку названном
    "Годзилла крадется по аллее". Но в этой музыки - мало шуточного, это чудище - из психоделического кошмара; это прорыв
    эмоциональной плотины, обозначеной в первом, заглавном номере альбома. Однако, завершив круг, Бьюкэнон не останавливается.
    Мрак развеевается в финальной короткой слайдовой импровизации - типично-чикагский жизнеутверждающий шафл на прощание:
    "Все плохо, но все будет хорошо!"'
- id: 1116
  author: Дмитрий Казанцев
  mark: 7
  date: '2007-07-30'
  text: 'Первый альбом Роя для Аллигатора. Дела у него были плохи, и это была надежда на возвращение к жизни и к успеху.


    Диск начинается неплохо - за вступительным блюзом идет фанк-блюз-инструментал. Звук гитары пугает - в нем и энергия, и
    грязь одновременно. К сожалению, это были такие годы и "вкусы". "Mrs. Pressure" - очень красивый инструментальный соул-блюз
    (чуть приджазованный). "A Nickel And A Nail" - еще одна радость - на этот раз фанки-соул в миноре. "Short Fuse" - симпатичный
    инструментальный рок-н-ролл в духе Нового Орлеана. "Why Don''t You Want Me" - традиционный соул-блюз в исполнении Глории
    Хардиман (очень мощный и академичный женский вокал); песня будто не с этого диска вообще. "Country Boy" - клевый риффовый
    шаффл с речетативным вокалом. "Sneaking Godzilla..." - самый необычный номер на альбоме - мрачноватая инструменталка с
    жутковатыми риффами. А может и стеб в духе Заппы. Истерическая гитарная игра Роя не дает понять задумку - она очень громко
    выведена в балансе. Под конец Рой играет быстрый и веселый рок-н-ролл со слайд-гитарой.


    Все могло бы быть совсем хорошо, если бы не противный продакшн 80-х и звук гитары Роя. Истеричная игра почти в каждом
    треке тоже не помогает слушать музыку, сами понимаете. Тем не менее, это самый лучший альбом Бьюкенана 80-х (их всего-то
    4).'
