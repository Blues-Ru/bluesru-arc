reviews:
- id: 1114
  author: Дмитрий Казанцев
  mark: 4
  date: '2007-07-30'
  text: 'Второй диск Роя для Alligator Records. Альбом начинается ужасно - дикий,
    резкий, антимузыкальный гитарный запил в композиции Манчини "Peter Gunn" (звук
    80-х в его худшем виде). Второй трек неплохой - ритм-н-блюзовая песня. А вот дальше
    начинается однообразный блюз и ритм-н-блюз с одинаковыми гитарными пилежками и
    с гадким звуком.


    Самое плохое, что могло быть в современном блюзе тех лет - противный продакшн
    80-х и постоянные гитарные соло с жутким звуком. Не выручают даже песни и гость
    Delbert McClinton.'
