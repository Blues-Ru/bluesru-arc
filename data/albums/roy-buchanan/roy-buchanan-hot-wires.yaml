- id: 1115
  author: Дмитрий Казанцев
  mark: 6
  date: '2007-07-30'
  text: 'Третий альбом Роя для Аллигатора и последний у него - он умрет в апреле 1988 года в 49 лет.


    Этот диск не так плох, как предыдущий - тут меньше агрессии и шума. Но все же звук 80-х портит почти все, а гитарный звук
    Роя отталкивает во многих песнях. Жаль, что Рой ушел из жизни в такой период; он все же был классным гитаристом и лидером
    в 70-е.'
- id: 2076
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2012-08-15'
  text: '"Guitar lovers rejoice! His best album ever" - CHICAGO TRIBUNE


    "Whirlwind solos with brilliant technique and flat out blues feeling" - GUITAR MAGAZINE


    Hot Wires - двенадцатый студийный (а также третий для фирмы Аллигатор) и, к сожалению, последний прижизненный альбом гитариста-виртуоза.
    Как обычно у Роя, альбом стилистически разноплановый - тут и блюз, и рок-н-ролл, и хард-рок, и роскошные гитарные инструменталы
    с легким привкусом фьюжна. Объединяет все эти разноплановые треки одно - высочайшее мастерство Бьюконена и аккомпанирующих
    музыкантов. Продюсировали диск Брюс Иглауэр, Дик Шурман и Рой Бьюкенен. Авторских треков четыре, остальное - каверы. Сам
    Рой считал альбом Hot Wires лучшим из всего, записанного им ранее.'
