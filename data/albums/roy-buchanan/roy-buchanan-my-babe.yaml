- id: 969
  author: Дмитрий Казанцев
  mark: 5
  date: '2006-02-12'
  text: 'Рой - классный блюз-роковый гитарист. Виртуозный и своеобразный одновременно. Но на этом альбоме музыка в духе мейнстрим-буги-рок-н-ролла
    конца 70-х не дает получить удовольствие от его игры до конца. Но самое страшное здесь - это вокал Пола Джэкобса (он кричит
    неприятным голосом). Инструментал же звучит совсем не плохо. Тут есть известные "My Babe" & "Dizzy Miss Lizzy".


    Один из слабых альбомов Бьюкэнэна. Тем не менее, это обязательно нужно слушать тем, кто сам играет на гитаре.'
