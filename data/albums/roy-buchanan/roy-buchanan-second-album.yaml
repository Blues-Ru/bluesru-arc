  text: Второй альбом Бьюкэнана. Рой заставляет свой телекастер рыдать и кричать,
    он большой мастер игры в своем особенном стиле. На диске - блюз и блюз-рок + немного
    рок-н-ролла и кантри-рока. Кое-где Бьюкэнан поет - это делает диск еще интереснее.
    Прекрасная пластинка!
