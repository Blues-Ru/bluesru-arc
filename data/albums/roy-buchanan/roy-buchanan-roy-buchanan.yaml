- id: 1121
  author: Дмитрий Казанцев
  mark: 8
  date: '2007-08-26'
  text: 'Второй альбом Роя и его первый для Полидора. Рой сам говорит лишь в одной
    песне, но у него есть вокалист и еще четверо: гитарист, клавишник, басист и ударник.
    На первой стороне - два блюза и три кантри-композиции (две с вокалом). На второй
    - два блюза и знаменитый кантри-хит "Hey Good Looking" (Hank Williams).


    Рой очень своеобразно и ярко играет на гитаре (не без хулиганства). Он умеет говорить
    на гитаре - это важный момент. Альбом должен понравиться любителям блюза, кантри
    и южного рока, конечно.'
