  author: Дмитрий Казанцев
  mark: 7
  date: '2007-12-09'
  text: 'Почти полностью инструментальный диск Роя с классными людьми. На альбоме
    играют звезды: Stanley Clarke, Steve Cropper, Duck Dunn, Jan Hammer, Will Lee,
    etc. Музыка разнообразная - блюз-рок, фьюжн, кантри-рок. Рой мощно солирует на
    гитаре, но во многих вещах идет явный перебор с запилами. Пара вокальных номеров
    звучит довольно странно на этом диске.'
