  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-10'
  text: 'Келли Ричи обратилась к блюзу, услышав Стиви Рэя. Она терзала гитару по 12
    часов в сутки, оттачивая мастерство, и довольно скоро уже собрала свою собственную
    группу. Группа выступала на разогреве у таких грандов, как Джэймс Браун и Эдгар
    Уинтер, а также у Клэренса Брауна. Затем последовал контракт с звукозаписывающей
    компанией, и Келли начала записывать сольные альбомы.


    На альбоме 2001 года она играет прифанкованную смесь блюз-рока и хард рока, чистого
    блюза тут практически нет, но он чувствуется в каждой ноте. Авторского материала
    чуть меньше половины, остальное - каверы. Продюсировал Джон Снайдер. Альбом вышел
    на собственном лейбле Келли - Sweet Lucy Records. Интересная исполнительница с
    мощным вокалом, приличной техникой игры и хорошим вкусом, который позволяет ей
    записывать свои собственные довольно интересные версии классических хитов.'
