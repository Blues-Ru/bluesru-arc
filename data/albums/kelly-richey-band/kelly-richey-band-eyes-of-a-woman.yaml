- id: 1877
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-10'
  text: 'Четвертый сольный альбом блюз-рокерши из Цинциннати, которую один из критиков назвал "Стиви Рэй Воэном в женском
    теле, из которого рвется наружу Джэнис Джоплин".


    Пожалуй, это довольно точное определение для музыки Келли Ричи: мощный блюз-роковый вокал, техничная гитара с оригинальным
    звучанием и блюзовой тональностью, и профессиональное исполнение. В музыкальном плане ее творчество находится на стыке
    блюз-рока и хард-рока. Диск качественный, довольно интересный, хотя и без особых откровений, но наверняка найдет своих
    поклонников.


    Данный альбом содержит преимущественно авторский материал, и Келли посвятила его известному блюзмену Джиму Розену, который
    украсил диск своим гостевым присутствием и записал партии гармоники. Базовый квинтет музыкантов усилен гостевым подключением
    духовой секции. Диск записан на лэйбле Sweet Lucy Records, основанном самой Келли Ричи.


    Параллельно с музыкальной деятельностью Келли также преподавала историю блюза и обучала тонкостям гитарной игры, а в 2012
    году опубликовала свою первую книгу поэм Whisperings.'
