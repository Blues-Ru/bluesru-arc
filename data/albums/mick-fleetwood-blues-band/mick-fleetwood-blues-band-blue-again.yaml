- id: 1542
  author: Андрей Евдокимов
  mark: 4
  date: '2009-05-18'
  text: И зачем они иногда возвращаются? Никто не мешает ветерану-барабанщику Мику Флитвуду поигрывать песни своей юности,
    но зачем же концертный альбом выпускать? Его гастроли соберут публику – он не только барабанщик со своим индивидуальным
    почерком, но и сама фамилия его составляет половину названия знаменитой группы, бывшей в авангарде британской блюзовой
    волны в 60-х, а в 70-х ставившая рекорды продаж альбомов в США. Впрочем, история "Fleetwood Mac" подробно изложена в многостраничном
    буклете к альбому. Над буклетом явно поработали более тщательно, нежели над записью самого альбома. На гитаре Рик Вито
    играет пристойно, а вот поет высоким гнусавым дрожащим голосом. Так что слушать его интерпретации песен Питера Грина ни
    один ностальгирующий меломан не захочет, а молодежь и вовсе не поймет, из-за чего сыр-бор.
