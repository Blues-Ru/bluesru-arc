  date: '2006-05-02'
  text: Любопытный дуэт блюзменов с восточного побережья. Прозвище Алекса Сьюарда
    - Гитар Слим, и он не имеет никакого отношения к автору и исполнителю композиции
    Things That I Used To Do. Настоящее имя Джелли Белли - Луис Хейз, и здесь, конечно,
    нет никакой связи с легендарным джазовым драммером. Оба перца всего лишь играют
    на акустических гитарах и поют. Алекс значительное время находился под влиянием
    Лонни Джонсона, и его вокал в буклете издания характеризуется как smooth, в то
    время как менее искусный "деревенский" вокал Луиса описывается словом rough. На
    диске нью-йоркские записи 1944 года, 29 треков, выдержанных в пьемонтской традиции,
    в духе Блайнд Боя Фуллера и Брауни Макги. Часть их издавалась в сороковые на различных
    мелких лейблах, а вместе их собрали уже на этом издании лейбла Arhoolie. Качество
    записи приемлемое, музыка симпатичная, акустика звонкая. Гармошку бы сюда еще,
    совсем бы здорово было.
