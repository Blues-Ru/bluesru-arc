  date: '2012-08-16'
  text: Признанная "королевой блюза из Детройта", легенда традиционной музыки Алберта
    Адамс записывала блюзовые сорокопятки для Chess Records, ее песни включали в блюзовые
    сборники, однако, несмотря на возраст исполнительницы, полновесный сольный диск
    ей удалось записать только в 1999 году. И это с учетом карьеры протяженностью
    почти 70 лет! Альбом качественного традиционного блюза попал в 25 лучших блюзовых
    альбомов 1999 года по версии журнада Living Blues.
