- id: 2091
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2012-08-16'
  text: Записанный в конце 1999 года практически с теми же музыкантами, что и предыдущий альбом Born with the Blues - группой
    Джонни Бассетта, диск Say Baby Say (Life's Trials and Tribulations according to Miss Alberta Adams) вышел в 2000 году
    и оказался даже более успешным, нежели его предшественник. Несмотря на свой достаточно преклонный возраст, "королева дейтройского
    блюза" представила на суд слушателей еще один достойный альбом традиционного блюза.
