- id: 108
  author: Алексей Калачев
  mark: 6
  date: '2003-02-24'
  text: Впервые в обзор альбомов попадает московская команда. Именно потому, что, начиная с этого диска, "Блюзовые Кузены",
    возможно, перестают быть "просто одной из московских групп". Леван и его ребята – и звуком, и качеством музицирования
    – поднялись до уровня, на котором как-то язык не поворачивается назвать их "русским блюзом". (Да нет никакого русского
    блюза! Есть либо просто блюз, либо местечковые поделки). "Блюз Казнс", похоже, сделали, наконец, "иностранный" диск. Это
    особенно бросается в глаза на фоне их предыдущей - слабой и до неприличного короткой - работы. Особенностью этого релиза
    является преобладание авторских вещей Левана Ломидзе. И знаете, наконец, слышно, что, как и положено грузину, Леван великолепный
    певец, а не только клубный гитарист.
