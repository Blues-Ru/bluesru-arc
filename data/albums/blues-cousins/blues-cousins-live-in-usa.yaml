- id: 782
  author: Андрей Евдокимов
  mark: 6
  date: '2005-08-05'
  text: Трио "Blues cousins" уже второй год подряд меняют мертвый московский клубный сезон на успешные клубные гастроли по
    США и выступления на крупных блюзовых фестивалях. Причем, в качестве "хэдлайнеров" - на афишах название московской группы
    стоит в одном ряду с корифеями и звездами жанра. Послушать, как публика фестиваля Санбэнкс распевает сочинение Левана
    Ломидзе "Moscow Boogie", можно теперь на компакте, увековечившем одно из четырех фестивальных выступлений этого года.
    Российские блюзовые пуристы (а есть и такие) упрекают группу в том, что она играет слишком тяжеловесно, а солиста – что
    слишком быстро. Им для домашнего прослушивания альбома потребуется известная выносливость. Однако те же качества на концерте
    американская публика воспринимала как энергичность и виртуозность, - и принимала русских блюзменов "на ура!". Вдобавок
    к своим музыкальным достоинствам альбом получает еще и статус архиважной вехи в истории отечественного блюза, впервые
    столь успешно показавшего себя на родине блюза.
