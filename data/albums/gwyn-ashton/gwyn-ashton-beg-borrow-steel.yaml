  date: '2012-08-07'
  text: 'Гитарист и певец Гвин Эштон - один из наиболее интересных современных блюз-роковых
    гитаристов, пришедших из Австралии (родился в Уэльсе, но вырос и стал музыкантом
    в Южной Австралии). Данный второй альбом акустического блюза он записал в Австралии
    в 1996 году вживую в студии за один день с приглашением друзей-музыкантов. Мы
    имеем качественный альбом традиционного акустического блюза с современным звучанием
    и мастерской игрой, не лишенный также мелких ошибок и погрешностей, присущих "живой"
    записи.


    Когда в 2001 году французский журнал Guitar Parts включил Эштона в тройку лучших
    гитаристов года наряду с Беком и Муром, диск был переиздан.


    GUITARIST OF THE YEAR 2001 Guitar Parts Magazine (France)


    1: JEFF BECK


    2: GARY MOORE


    3: GWYN ASHTON


    В настоящее время Гвин Эштон возглавляет дуэт Two-Man Blues Army, где виртуозному
    гитаристу помогает не менее виртуозный ударник "киллер" Кев Хикман. Вдвоем (!!)
    они умудряются выступать и записывать альбомы энергичного блюз-рока с грязным
    гаражным звучанием.'
