  author: Александр Сомов
  mark: 10
  date: '2016-08-07'
  text: 'На концертном альбоме Man & Guitar, записанном на блюзовом фестивале в 2013 в Royal Albert Hall в Лондоне, перед
    нами акустический блюз от Ian Siegal, обладателя множества наград. Драйвовая, харизматичная игра, голос, как наждак, шутки
    с невозмутимым видом - его выступление просто завораживает своей энергетикой. Очень теплая, уютная атмосфера концерта.


    "Сейчас я сыграю песню величайшего блюз-музыканта - певца, сочинителя песен, гитариста, когда-либо жившего... его имя
    не Джо Бонамаса... и не Эрик Клэптон...".../..."Хочу представить вам мое новое приобретение - имя этой гитары - Чарли,
    конечно они все девочки, так что это Шарлотта, вы только посмотрите на эти формы... Но я назвал ее в честь Чарли Паттона
    - величайшего гитариста когда-либо жившего. Что ж может быть у вас другое мнение, относительно величайшего гитариста когда-либо
    жившего... но тогда вы ошибаетесь. Возможно вы думаете, что это Джимми Хендрикс... и я хотел бы согласиться с вами, но
    тогда мы вместе будем не правы."


    Послушать можно здесь https://vk.com/wall-13370755_3061'
