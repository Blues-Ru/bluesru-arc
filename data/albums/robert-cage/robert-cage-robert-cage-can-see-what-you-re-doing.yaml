  date: '2005-05-24'
  text: Единственный альбом миссисипского дизельного механика Роберта Кейджа, выпущенный
    на Фэт Поссуме в 1998 году. Качество материала совсем низкое, хоть на диске всего
    9 композиций на 30 минут. Половина песен вообще не имеет осмысленных текстов,
    к тому же поется довольно мерзким подвывающим голосом. Очень слабый и плохой диск.
