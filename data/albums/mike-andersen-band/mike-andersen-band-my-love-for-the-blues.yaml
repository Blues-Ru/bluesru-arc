  author: Федор Романенко
  mark: 10
  date: '2010-02-15'
  text: 'Майк Андерсен - датский вокалист и гитарист, который играет современный блюз с элементами свинга, увлекаясь соул-музыкой
    и р-н-би. Его пластинка "My Love For The Blues" названа по имени блюзового гимна, которым она заканчивается, в этом шаффле
    Майк эмоционально признается в любви ко всем классикам и ныне здравствующим гигантам блюза на исторической родине жанра.


    Сам диск - тоже посвящение блюзу, например, на нем есть два номера из репертура от Бобби Блэнда, главного героя для Майка
    - это Yield Not To Temptation и красивейшая баллада Чарли Рича Who Will The Next Fool Be?


    Все песни аранжированы и записаны безупречно, в них есть напряжение и эмоциональность в голосе и гитаре, которые очень
    волнуют. Почти все песни рассчитаны на то, чтобы быть хитами. Тебя берут либо ритмом как в минорной "How Do You Sleep
    At Night", либо потрясающей свинговой-поющей гитарой в "I Was Wrong", в которой главное не бодрость, а ощущение неустойчивости
    положения (девушка то ли ушла, то ли, все-таки, нет).


    Запись очень хороша, выжимает из тебя эмоции всю дорогу. Есть, однако, в этом всем что-то излишне гладкое, какой-то сентиментализм.
    Потом понимаешь, что, если он ослабит хватку на секунду, то композиция может развалиться, ибо все слишком срежиссированно.
    Я слышал краем уха жалобы на его живые концерты - too uptight и нет там расхлябанного low down dirty blues, все слишком
    плотненько и ухожено. Но на пластинке все выдержано от начала и до конца, спектакль доигран, и за эту запись - твердую
    пятерку.'
