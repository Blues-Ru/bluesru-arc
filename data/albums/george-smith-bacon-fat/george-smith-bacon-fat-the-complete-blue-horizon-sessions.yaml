- id: 1184
  author: Сергей Исправников
  mark: null
  date: '2008-01-01'
  text: 'Очередное двухдисковое переиздание архивов фирмы Blue Horizon на этот раз посвящено блюзу на губной гармонике, демонстрируя
    таланты двух бесспорных мастеров жанра – Джорджа Смита и Рода Пьяццы. Диски отражают их сотрудничество в рамках блюз-роковой
    группы "Bacon Fat" в 1969-70 гг.


    Что касается уроженца штата Арканзас, Аллена Джорджа Смита (р. 1924 г.), то он безусловно входил в элиту послевоенных
    черных харперов, наряду с Сонни Боем Уильямсоном и Литтл Уолтером. Последнего он даже одно время заменял в бэнде Мадди
    Уотерса. Однако жизненные обстоятельства и особенности характера не позволили Смиту стать супер-звездой, и в настоящее
    время его редкие записи известны, в основном, профессионалам. Как и Литтл Уолтер, Смит играл на хроматической губной гармонике
    и был одним из пионеров использования электроусиления этого инструмента. В 1968 г. Джордж Смит вместе с белым американским
    блюз-рокером Родом Пьяццой образовал группу "The Southside Blues Band".


    Род Пьяцца (р. 1947 г.) начал увлекаться блюзом, слушая пластинки своего старшего брата, и после недолгих экспериментов
    с гитарой взялся осваивать губную гармонику. В 1967 г. он записал первый альбом с собственной группой "The Dirty Blues
    Band". После знакомства с Джорджем Смитом группа была реформирована и переименована. Где-то в первой половине 1969 г.
    она попалась на глаза Майку Вернону, бывшему в очередной деловой поездке по Штатам. Их концертное выступление произвело
    на него сильное впечатление, и он заключил с ними контракт на выпуск альбомов. Впрочем, из-за коммерческих соображений
    название бэнда пришлось поменять на более короткое и запоминающееся – "Bacon Fat". К тому времени состав группы, помимо
    Пьяццы и Смита, включал двух гитаристов – Ivan Reed (р. 1947 г.) и Gregg Schaefer (р. 1954 г.), басиста Jerry Smith (р.
    1947 г.), ударника Richard Innes Jr. (р. 1948 г.) и коллегу Джорджа Смита – черного пианиста из Луизианы J.D.Nicholson
    (р. 1923 г.).


    Решено было записать два альбома: один всей группы, а другой сольник Джорджа Смита в сопровождении "Bacon Fat". Сессии
    звукозаписи прошли 17-18 ноября 1969 г. в голливудской Eldorado Recordings Studio. В первый день был записан альбом "Bacon
    Fat", получивший название "Grease One For Me" (Blue Horizon 7-63858). Из десяти записанных на пластинку композиций половина
    была взята из репертуара Литтл Уолтера, две написал Род Пьяцца, две – Джордж Смит и одну – Николсон. В отличие от "The
    Southside Blues Band", который характеризовался одновременной игрой двух харперов, на этот раз Род и Джордж записывались
    по отдельности. В результате на альбоме "Bacon Fat" Джордж Смит играет только в одной композиции – собственной "Telephone
    Blues", а на его сольном альбоме Род Пьяцца вообще не появляется.


    На следующий день записывался диск Джорджа Смита. Кроме "Bacon Fat" в полном составе за исключением Рода Пьяццы, в записи
    приняли участие два гостя – гитаристы Pee Wee Crayton и Marshall Hooks. В получившийся в результате альбом "No Time For
    Jive" (Blue Horizon 7-63856) вошли восемь композиций, половину из которых написал Джордж Смит, а половину Nat McCoy, с
    которым как с автором Джордж сотрудничал еще с 50-х гг. Запись проходила в спонтанной непринужденной атмосфере, ряд вещей
    представляют собой скорее джемы, чем заранее отрепетированные композиции. Запись получилась очень достойной, однако по
    мнению Майка Вернона, она была бы еще лучше, если бы он в свое время больше контролировал процесс и не допустил излишнего
    затягивания части треков.


    После того, как у Майка Вернона на руках оказался законченный продукт, он решил организовать европейские гастроли "Bacon
    Fat" вместе с Джорджем Смитом, как в поддержку уже записанных дисков, так и чтобы получить возможность вновь записать
    группу уже в Лондоне. Запланированный на май-июнь 1970 г., британский тур фактически состоялся только в ноябре. Выступления
    проходили в клубах и университетских аудиториях. Группа была на пике своей формы, собирая аншлаги. Майк Вернон принял
    решение записывать эти концерты на портативную аппаратуру, что и было сделано. Конечно, не все записи оказались приемлемого
    качества. В то время они опубликованы не были, зато в это издание включено 16 концертных бонус-треков, запечатлевших живую
    энергетику группы и восторженную реакцию аудитории. Помимо собственных вещей в концертную программу входила классика блюза
    из репертуара Мадди Уотерса, Литтл Уолтера и Хаулин Вулфа, а также гершвинская "Summertime", чье пронзительное исполнение
    безусловно является одной из жемчужин данного издания.


    Во время гастролей состоялось несколько сессий на лондонской студии CBS, когда был записан основной материал для второго
    альбома группы "Tough Dude", отсутствующий здесь. В данное издание включен только сингл, выпущенный в конце 1970 г. в
    преддверие диска и содержавший кавер-версию "Evil" – хита Хаулин Вулфа, а также авторский инструментал Рода Пьяццы – "Blues
    Feeling". Альбом должен был быть издан в начале 1971 г., но тут права на дистрибьюцию продукции Blue Horizon перешли от
    CBS к Polydor, которые стали активно вмешиваться в репертуарную политику. Диск, в конце концов, все же появился на полках
    магазинов и получил хорошие отзывы в прессе, но из-за новых хозяев перспектив дальнейшей работы у Майка Вернона с "Bacon
    Fat" не было. В результате, группа вылетела обратно в Калифорнию, где вскоре распалась. Джордж Смит снова соединился с
    Родом Пьяццой только в 1982 г. для записи совместного альбома. Это была его последняя работа – 2 октября 1983 г. Джордж
    Аллен Смит умер от сердечного приступа.


    В заключение стоит отметить, что хотя особого коммерческого успеха "Bacon Fat" и не достигли, однако это была одна из
    лучших американских блюз-роковых групп своего времени, чья музыка и сейчас не оставляет равнодушным.'
