  text: 'Michael Hills Blues Mob - Suite: Larger than Life - 2001


    Майкл Хилл, простой парнишка из Бронкса, увидел игру Джими Хэнрикса на нескольких
    фестивалях, и сразу же понял, чего ему хочется в этой жизни. В 1970 году он начал
    осваивать гитару, а к середине 70-х уже подигрывал Литтл Ричарду, Гэри Белафонте
    и др. звездам. Контракт с Аллигатор рекордз в 1993 году позволил ему наконец выпустить
    сольные альбомы.


    Отличная техника, неплохие композиторские навыки и сильный голос, а также мощная
    поддержка от его сопровождающей группы The Blues Mob делают Хилла желанным гостем
    всех блюзовых фестивалей.


    Предлагаемый пятый сольный альбом Хилла - это современный городской блюз в лучших
    традициях, причем песни сгруппированы в отдельные блоки (с претензией на сюиту).
    Майкл не только написал практически все песни на диске, но и выступил в роли продюсера.
    В качестве гостя на альбоме отметился гитарист Living Colour Вернон Рейд. Как
    мне кажется, это тот самый классический случай, когда за счет сокращения музыкального
    материала на одну треть просто хорошая пластинка превращается в очень хорошую
    и даже почти отличную (но тогда бы не было сюиты, не так ли :-) )'
