- id: 2000
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-09-15'
  text: 'Второй альбом одного из наиболее интересных современных блюзменов из Нью-Йорка,
    который в своей музыке старается объединить всевозможные стили (и традиционный
    блюз, и хард рок, и регги, и фанк, и соул, и джаз), получив в итоге своего рода
    современный городской блюзовый фьюжн. И тогда, когда ему это удается, результат
    получается воистину впечатляющим: "Women Make the World Go Round," "Africa is
    Her Name" или переработка "Stagolee".


    Музыка группы современна и искренна, альбом стилистически многогранен и отлично
    сыгран. Майкл не только талантливый и техничный гитарист с узнаваемыми соло, но
    и автор почти всего материала с альбома. Музыка украшена эпизодическим подключением
    саксофона и духовой секции. Рекомендую к ознакомлению, ибо, несмотря на то, что
    не всегда задуманное у него получалось, Майклу удалось создать свою нишу и сказать
    свое слово в современном блюзе. Нечасто попадаются работы, звучащие свежо и современно
    при одновременном сохранении традиции.'
