- id: 121
  author: Алексей Калачев
  mark: 6
  date: '2003-05-29'
  text: 'Макл Хилл играет в стиле "блюзовый модерн". Это означает, что в этом двойном концертном альбоме вы найдете современный
    блюз, смешанный с роком и фанком. Если вы слышали предыдущие два альбома, то рассказывать больше и нечего: на релизе 2003
    года тот же репертуар, только без клавишника плюс продолжительные импровизации, как и положено крепкому концертному блюз-коллективу.'
