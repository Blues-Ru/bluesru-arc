  author: Константин Колесниченко
  mark: 10
  date: '2009-07-10'
  text: '<img src="http://www.filisko.com/images/LiveCover.jpg"> Спросите у любого, кто увлекается или профессионально занимается
    игрой на губной гармонике, кто такой Джо Филиско. Например, я вам отвечу - это самый известный мастер по кастомайзингу
    губных гармоник, БОЛЬШОЙ знаток и мастер играть довоенный блюз на гармонике (найдите его сайт, у него самая полная дискография
    записей Big Walter Horton - впечатляет!), и он ведет занятия для начинающих и продолжающих изучать губную гармонику.


    Этот альбом представляет собой живую запись дуэта, которая является ничем иным, как историей и настоящим погружением в
    истоки блюза - тут и Sonny Terry, и Rev. Gary Davis, и Robert Johnson (куда уж без него), и Memphis Jug Band и др известнейшие
    классики того, старого блюза. Исполнено все на высочайшем уровне! Эрик - это идеальный аккомпаниатор для акустической
    гармоники, а Джо - так это просто ходячая энциклопедия всех этих стилей олд-скул игры на гармонике.'
