- id: 651
  author: Александр Панин
  mark: 9
  date: '2005-05-20'
  text: 'У основателя лейбла Фэт Поссум Мэттью Джонсона очень интересная работа. Ездить по миссисипским селениям в поисках
    блюзовых стариков. К сожалению, блюз - умирающее искусство, и находить их становится все труднее. Мэттью пишет, что десять-двенадцать
    лет назад в городишке с населением 800 человек можно было найти троих черных, сносно играющих на гитаре. Сейчас же - почти
    никого. Поэтому он был очень рад встрече с Чарльзом Колдуэллом, произошедшей в мае 2002 года.


    Чарльз играет на электрической гитаре Gibson 135, сохранившейся у него с 1957 года, делает это в стиле Бернсайда, Кимброу
    и Ти-Модел Форда, то есть это опять драйв и клевые повторяющиеся риффы, хотя гитара звучит чуть потоньше, чем у тех перцев.
    Его вокал вполне убедительный и мощный, и все сорок минут музыки на диске очень хороши.


    Ар Эл Бернсайд уже закончил гастролировать, поэтому Джонсон рассматривал Колдуэлла как его потенциальную замену и просто
    новую звезду, ведь ему было всего около 60. Однако альбом Remember Me, вышедший в феврале 2004 года, стал для Чарльза
    посмертным... за полгода до этого он скончался от рака поджелудочной железы.'
