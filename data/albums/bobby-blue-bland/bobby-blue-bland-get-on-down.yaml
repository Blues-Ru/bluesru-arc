  text: Соул-блюзовый альбом Бобби середины 70-х. Богатые аранжировки - духовые, подпевки (их немного) и струнные. Спокойная
    такая музыка; очень странно, что почти нет фанка в 1975 году. Вторая сторона пластинки гораздо интереснее первой.
