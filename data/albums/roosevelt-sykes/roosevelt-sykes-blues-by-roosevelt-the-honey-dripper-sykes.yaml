  date: '2006-04-04'
  text: Мое знакомство с блюзовым пианистом и вокалистом Roosevelt Sykes произошло уже после прослушивания трех других гигантов
    блюзовых черно-белых клавиш, значащихся в музыкальных энциклопедиях на букву S (Sunnyland Slim, Otis Spann и Memphis Slim).
    Sykes был самым старшим из этого квартета и самым веселым, что немаловажно для блюзмена. Аккомпанируя в 40-е годы великим
    St. Louis Jimmy и Lonnie Johnson (любимый музыкант Би Би Кинга!!!), Sykes получил отличную школу и выработал свой стиль
    игры - не очень техничный, но легко узнаваемый. Пианист выпускал пластинки нерегулярно и не задерживался долго на одной
    фирме звукозаписи. Одной из лучших его работ является пластинка 1961 года Blues by Roosevelt "The honey-dripper" Sykes,
    продюсированная другом и конкурентом Memphis Slim. Выпущенная фирмой Folkways Smithsonian великолепно записанная пластинка
    представляет собой 14 коротких композиций исполненных Sykes соло с первого дубля. Пианист играет по современным блюзовым
    меркам старомодно и незамысловато, но после прослушивания альбома, остается приятное послевкусие, и хочется бежать в музыкальный
    магазин для покупки пластинок его учителей (Cow Cow Davenport, James P. Johnson и Jimmy Yancey). После ознакомления с
    работами этих на первый взгляд очень похожих друг на друга пианистов становится очевидно, что все они имеют свой неповторимый
    звук и шарм. Также очень рекомендую для просмотра и прослушивания R.Sykes и других корифеев джаза концерты "The American
    folk blues festival".
