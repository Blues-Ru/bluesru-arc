  author: Александр Панин
  mark: 7
  date: '2005-05-24'
  text: 'Это второй диск Эйши Пэйтона на Фэт Поссуме. Он не увидел и первого, и долгое время все считали, что Worried так
    и останется его единственным альбомом. Однако знакомый владельца Фэт Поссума вытащил несколько сделанных им домашних записей
    Пэйтона 1980 года, сам владелец поднял демо-треки 1994 года, на большинство вещей дописали другие инструменты, и выпустили
    этот диск в 2002 году. К сожалению, на отдельных треках слышны электронные эффекты.


    На диске есть ряд замечательных нетронутых (или почти нетронутых) технологией вещей, среди них корневой акустический блюз
    Livin'' In So Much Pain, электрогипнотические Why''d You Do It и You Don''t Want Me, Watch Yourself с гитаристом Кенни
    Брауном. Есть и более жесткие, даже фанковые вещи, хотя довольно сомнительно, что такое звучание было задумано самим автором.


    Лучшая музыка Эйши сравнима с той, которую на Фэт Поссуме записывал Джуниор Кимброу.'
