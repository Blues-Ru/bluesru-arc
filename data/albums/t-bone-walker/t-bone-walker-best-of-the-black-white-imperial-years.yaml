reviews:
- id: 577
  author: Андрей Евдокимов
  mark: 9
  date: '2005-04-11'
  text: 'Имя Ти-Боун Уокера – в первых строках списка бесспорно великих блюзменов. В конце концов, именно он оказал решающее
    влияние на БиБиКинга, нынешнего короля блюза. Коллекционеров до сих пор вполне устраивало "Полное собрание записей Black
    & White и Imperial", изданное Capitol ровно десять лет назад на трех компакт-дисках. Новая подборка вероятно привлечет
    внимание более широких кругов слушателей. 19 треков, записанных с 1946 по 1953 годы, представляют и ранний (но не начальный)
    период, и расцвет творчества великого реформатора блюзовой гитары. Техасец по происхождению, он свою жизнь связал с Калифорнией
    и со стилем блюза Западного побережья. Мелодичная нотная вязь, диалог голоса и гитары, довольно мягкая манера пения –
    в новой компиляции собраны только шедевры. Бессмертная Call It Stormy Monday входит в десятку лучших блюзов, записанных
    за всю историю жанра. Есть еще и блюз о "Гламурной девушке", замечательно сочетающий чисто блюзовую "жалостливую" простоватую
    манеру пения с изысканной джазовой гитарной импровизацией. Этот диск можно уверенно рекомендовать для первого знакомства
    с музыкой Ти-Боун Уокера.


    Что было дальше: T-Bone Walker "T-Bone Blues" [Atlantic] Продолжатель: Best of B.B. King, vol.1


    (впервые опубликованном с сокращениями в журнале Play)'
