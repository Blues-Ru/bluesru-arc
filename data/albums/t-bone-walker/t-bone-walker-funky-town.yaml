- id: 972
  author: Дмитрий Казанцев
  mark: 9
  date: '2006-03-02'
  text: '9 прекрасных блюзов в исполнении ТиБоуна и его большой группы (ритм-секция, орган, пианино, духовые). Настоящий южный
    блюз, а в трех песнях используется фанковый ритм. Почти все блюзы тут с вокалом, но гитара Уокера звучит ярко и остро,
    создавая контраст с мягким, почти джазовым звучанием банды.


    Отличный звук, программа и исполнение - ТиБоун на высоте даже в свои 58.'
