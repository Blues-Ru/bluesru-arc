reviews:
- id: 669
  author: Александр Панин
  mark: 8
  date: '2005-05-24'
  text: 'Компиляция раннего Ти-Боуна, выпущенная французским лейблом EPM Musique. Слово beginning на обложке написано с ошибкой,
    но весь 12-страничный двуязычный буклет очень неплох и информативен.


    Несколько первых треков представляют в основном исторический интерес, первые два были выпущены аж в 1929 году, когда Уокер,
    естественно, играл на акустической гитаре, и являются не очень выразительными гитарно-рояльными блюзами. Остальные записи
    сделаны в сороковые и с различными бэндами, Ти-Боун играет уже в электричестве, исполняет свои фирменные приджазованные
    блюзы и отлично поет!


    Качество записи, конечно, неважное, но музыка очень хорошая. Однако здесь нет Stormy Monday, да и некоторые треки, записанные
    на Imperial Records в начале пятидесятых, тоже не были бы лишними.'
