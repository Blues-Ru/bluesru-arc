  author: Константин Колесниченко
  mark: 9
  date: '2006-08-15'
  text: 'Немецкая фирма Membran занимается выпуском архивов-сборников джаза и блюза. На своих компиляциях лэйбл отображает
    в основном ранние периоды творчества музыканта, классический материал. В руки мне попалась 4-дисковая подборка записей
    T-Bone Walker''а, начиная с записей 29 года, где T-Bone играет на акустической гитаре, ему аккомпанирует пианист Douglas
    Fernell. На последнем, четвертом сд - записи, датированные 1949 годом. Записи довольно хорошо ремастированы, но на мой
    вкус, есть некоторая плоскость в звуке.


    О творчестве T-Bone Walker говорить много бессмысленно – он один из лучших гитаристов блюза, замечательный певец с моментально
    узнаваемым голосом, манерой исполнения, которой пытаются подражать многие современные музыканты West Coast стиля. Материал
    на 4 сд – энциклопедия и, на мой взгляд, исчерпывающая по классическому, раннему периоду творчества музыканта.'
