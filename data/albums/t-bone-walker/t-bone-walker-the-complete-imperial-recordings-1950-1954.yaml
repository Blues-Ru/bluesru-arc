reviews:
- id: 37
  author: Алексей Калачев
  mark: 10
  date: '2002-10-26'
  text: 'Бесспорная классика, без которой любая качественная коллекция таковой считаться
    не смеет. В опросе на тему "Лучшие альбомы блюза", проведенном по случаю Миллениума
    журналом "Блюз Ревю", абсолютное большинство читателей и журналистов назвало этот
    двойник в ряду "The Best". Среди его достоинств, среди прочих, назывались – более
    высокое по сравнению с другими записями Ти Бона качество звука и более продвинутые
    аранжировки. Единственный изъян – отсутствие "Stormy Monday". В данном случае
    я без терзаний (впервые!) нажимаю на кнопочку рейтинга - шесть "собачек". Впрочем,
    собственные мозги мне напрягать для этого не пришлось: высшую оценку "The Complete
    Imperial Recordings" им ставят все музкритики лет 40.'
