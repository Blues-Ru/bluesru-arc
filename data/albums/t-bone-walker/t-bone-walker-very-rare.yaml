  author: Дмитрий Казанцев
  mark: null
  date: '2005-03-25'
  text: 'Это последний альбом Уокера, он записан за год до смерти гения блюзовой гитары (умер ТиБоун в 1975 году в возрасте
    65 лет).


    Эта двойная пластинка спродюсирована Лейбером/Столлером, а в записи приняли участие звезды джаза и соула. Назову лишь
    самые известные имена: Dizzy Gillespie, Herbie Mann, David "Fathead" Newman, Al Cohn, Zoot Sims, Gerry Mulligan, Sweet
    Inspirations, David Matthews, James Booker, Dean Parks, Jim Gordon, Larry Carlton, Wilton Felder, Max Bennett. Как видите,
    тут много людей из тусовки CTI/Kudu, а также лучшие люди из Лос-Анжелеса (разные поколения черных и белых джазменов).


    В результате мы имеем великолепный двойник с безупречной игрой "оркестра", приятным и спокойным вокалом ТиБоуна и его
    гитару, которая хороша и в 1974 году. Исполняется блюз, джаз, соул-блюз и новоорлеанские традиции тоже тут. Много известных
    тем в новых интересных аранжировках: Evening, Every Day I Have The Blues, Fever, Just A Little Bit, Been Down So Long,
    Kansas City, Stormy Monday.


    Жаль, что Уокер умер так рано - он очень хорош и в блюзе, и в джазе!'
