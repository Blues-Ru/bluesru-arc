  author: Дмитрий Казанцев
  mark: 10
  date: '2005-05-05'
  text: 'На этом диске всего 8 песен, но альбом не короткий - все композиции довольно длинные. Записи сделаны в Копенгагене
    (Дания) 13 и 14 ноября 1971 года. Брауни и Сонни, но иногда им подыгрывает на ударных/перкуссии Svend Erik Norregard.


    Великолепная запись и материал! Оба прекрасно поют и играют на своих инструментах. Невозможно оторватся от такой музыки.


    Я не знаю в каком виде этот винил вышел в цифре, но почти уверен, что эта сессия была переиздана. Даю список треков: 1.
    Rock Island Line (2:58) 2. John Henry (7:42) 3. The Chariot Is Coming (2:50) 4. Two Points Of View (5:20) 5. Midnight
    Special (5:20) 6. Tears Rollin'' Down (4:40) 7. Backdoor Sunshine (5:30) 8. Find My Way Home (5:05) (Storyville SLP 4007)'
