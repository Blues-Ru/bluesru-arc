  text: Бюджетный, редкий сборник очень низкого качества из серии "Blues Encore". На диске 20 композиций Сонни и Брауни разных
    лет (среди них много их хитов), но качество местами просто ужасное. Я даже и не знаю, на кого расчитаны подобные полупиратские
    компиляции.
