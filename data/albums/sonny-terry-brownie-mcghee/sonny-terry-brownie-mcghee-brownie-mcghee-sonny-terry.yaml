  author: Дмитрий Казанцев
  mark: 10
  date: '2005-05-05'
  text: 'Еще одна великолепная сессия Сонни и Брауни. На этот раз им помогают: Ray Johnson - piano/electric piano/tambourine,
    Jimmy Bond - bass, Panama Francis - drums. Они прекрасно звучат и в таком расширенном составе. Записи сделаны 1 марта
    1969 года.


    Если я не ошибаюсь, в оригинале этот альбом выходил в 1969 году на фирме Bluesway и назывался он "Long Way From Home".
    Тут такие треки: 1. Rock Island Line (2:23) 2. Long Way Home (1:57) 3. Big Question (3:40) 4. Night & Day (4:52) 5. You
    Just Usin'' Me For A Convenience (3:45) 6. Hole In The Wall (3:46) 7. Life Is A Gamble (4:31) 8. Don''t Mistreat Me (3:24)
    9. Packin'' Up, Gettin'' Ready (5:55) 10. B.M. Special (7:34)


    Издавался ли этот диск в цифре? Я не знаю.'
