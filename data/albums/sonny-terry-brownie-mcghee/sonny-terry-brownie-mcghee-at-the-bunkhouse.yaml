- id: 654
  author: Александр Панин
  mark: 7
  date: '2005-05-20'
  text: 'На диске запись выступления знаменитого акустического дуэта (гитара и губная гармошка) в Ванкувере, то ли в конце
    1964, то ли в начале 1965 года. Точнее сказать возможности не представляется.


    Диск хороший, звуки приятные, оба исполнителя в ударе. Однако все очень ровно, ничего совсем уж выдающегося нет. Думается,
    таких записей у Терри с МакГи было много. Да и альбом коротковат, всего 38 минут.'
- id: 735
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-06-26'
  text: Этот короткий концертник (38 минут) вышел в 1965 году на довольно редком лейбле Smash. На диске 11 песен, записаны
    они в Канаде, в месте под названием The Bunkhouse. К сожалению, запись не самого лучшего качества, а в начале некоторых
    песен слышно, как Брауни ругается с Сонни (у них были плохие отношения, как известно). Материал приличный и понятный,
    но у дуэта есть гораздо более сильные концертники по исполнению, настроению и качеству. Не стоит судить об их концертной
    игре по этой пластинке.
