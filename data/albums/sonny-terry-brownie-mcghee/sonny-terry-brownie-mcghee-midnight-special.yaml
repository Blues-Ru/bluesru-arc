- id: 734
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-06-26'
  text: 'Замечательный двойной альбом, на нем более 70 минут прекрасного фолк-блюза
    в исполнении Брауни и Сонни. Запись великолепная - МакГи в левом канале, а Терри
    отвечает ему из правого. Оба поют и подпевают, оба великолепно владеют своими
    инструментами - акустической гитарой и губной гармошкой (соответственно).


    20 отличных песен, среди них такие жемчужины, как "Midnight Special", "Take This
    Hammer", "Muddy Water", "Gone Gal", "Meet Me Down In The Bottom". Это записи 1960
    года на фирме Bluesville (тут 2 номерных альбома - "Blues And Folk" и "Blues All
    Around My Head").'
