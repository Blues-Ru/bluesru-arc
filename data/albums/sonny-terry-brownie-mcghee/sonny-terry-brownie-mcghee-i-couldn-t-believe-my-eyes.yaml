reviews:
- id: 764
  author: Дмитрий Казанцев
  mark: 5
  date: '2005-07-20'
  text: 'Очень странный альбом. Запись сделана в 1969 году в Лос-Анджелесе, МакГи
    поет и играет на гитаре, Терри играет на гармошке и поет, Хукер - на соло-гитаре,
    Ray Johnson - keys, Jimmy Bond - bass, Panama Francis - drums. Трое джазменов
    играют хорошо, а вот на записи все очень странно звучит - голосов не слышно, баланс
    инструментов ужасен. Все 10 треков написаны Сонни и Брауни, но трудно выделить
    хоть один яркий и интересный блюз. Сонни постоянно играет на харпе, а это совершенно
    не вяжется с таким большим бэндом. Брауни играет на электрогитаре - это ведь совсем
    не его занятие. Даже игру Хукера на гитаре трудно назвать интересной и яркой (а
    обычно это так). Кое-что интересное появляется в шестом треке, где хор подпевает
    фразу Don''t Wait For Me после каждого запева Брауни. Заглавный 10 трек тоже хорош,
    но после такого слабого альбома он уже не помогает.


    Этот диск - разочарование. Такие имена, такое время, и такой слабый материал в
    итоге.'
