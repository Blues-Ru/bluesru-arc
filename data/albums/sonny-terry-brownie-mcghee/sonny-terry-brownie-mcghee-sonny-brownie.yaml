reviews:
- id: 612
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-05-05'
  text: 'На каких только лейблах не записывались Терри и МакГи, на этот раз - великолепная сессия на A&M Records в 1973 году.
    Вместе с Сонни и Брауни играют прекрасные молодые музыканты, среди которых Джон Мэйолл и Джон Хаммонд.


    Очень интересен подбор материала - тут есть ритм-н-блюз, госпел и даже поп-музыка. Все сделано по-своему и под себя, так
    что слушается очень интересно. Альбом начинается со знаменитой "People Get Ready" Кертиса Мейфилда - настроение сразу
    поднимается и музыка льется вокруг. Отмечу еще несколько известных хитов отсюда: "Bring It On Home To Me" (Sam Cooke),
    "Sail Away" (Randy Newman), "Jesus Gonna Make It Alright" (trad. gospel).


    Отличная пластинка, она была переиздана на компакт-диске.'
