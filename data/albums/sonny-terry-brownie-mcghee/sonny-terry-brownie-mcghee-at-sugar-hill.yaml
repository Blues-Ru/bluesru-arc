  author: Дмитрий Казанцев
  mark: 9
  date: '2005-05-05'
  text: 'Очень и очень хороший концертник дуэта. Шума зала почти не слышно, но все
    же атмосфера концерта есть, и те, кому это нравится, получат свое удовольствие.


    На диске 11 песен, а длится он 44 минуты - полноценный концертный альбом. Оба
    артиста в форме, исполняют свои лучшие песни по очереди. Сонни в правом канале,
    Брауни в левом.


    "Born To Live The Blues" - величайшая песня, конечно.'
