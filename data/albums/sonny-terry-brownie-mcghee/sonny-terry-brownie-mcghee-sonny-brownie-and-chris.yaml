  date: '2005-07-07'
  text: Редкий диск. Тут нарезка с записями 1958 года, когда Сонни и Брауни работали с оркестром Криса Барбера (белый джазмен).
    Всего 25 вещей, многие мы знаем, конечно. Кое-где нет никакого оркестра, а есть Сонни, Терри и пианист Криса Дэйв Ли.
    Солидный, интересный материал!
