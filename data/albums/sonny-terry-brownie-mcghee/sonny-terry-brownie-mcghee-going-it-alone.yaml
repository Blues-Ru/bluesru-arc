- id: 737
  author: Дмитрий Казанцев
  mark: 5
  date: '2005-06-27'
  text: 'Сонни и Брауни решили больше не работать дуэтом и занялись сольными "карьерами". Оба занялись не своим делом, на
    мой взгляд. Сонни Терри стал играть в трио вместе с акустическим гитаристом Бобом Маленки (он также поет и сочиняет) и
    пианистом Майклом Рура. Звучит все это странно, будто люди и не вместе играют вовсе. Брауни стал играть в группе вместе
    с Luisiana Red и Sugar Blue, но он зачем-то взял в руки электрогитару и начал играть банальный "традиционный" блюз. Короче,
    их сольный материал гораздо слабее их дуэта.


    Диск издан полулевой фирмой Blues Alliance, на нем 14 вещей из сольного творчества Терри и МакГи. Почему-то 8 песен Сонни
    и только 6 Брауни. Песни расставлены в странном порядке; если тут и есть какая-то гениальная задумка великого "компилятора",
    то простым смертным (типа меня) она непонятна.


    Ценность этого диска только в одном - тут можно послушать довольно редкие сольные записи Сонни и Брауни середины 70-х.
    Жаль, что этот материал явно хуже, чем их работы вместе.'
