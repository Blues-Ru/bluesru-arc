  date: '2005-07-07'
  text: И еще один сборник раннего материала Сонни и Брауни. Они тут не только в двоем, но ритм-секция и пианино тоже с ними.
    Полноценный, сильный состав, но записи не самого высокого качества. Сонни здорово один исполняет "Oh What A Beautiful
    City".
