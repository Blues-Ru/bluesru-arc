  author: Александр Мальчевский
  mark: 10
  date: '2003-12-01'
  text: 'Один из самых любимых моих альбомов в стиле зайдеко. Кейт Франк – это очень интересный дядя, и музыка им создаваемая
    вдохнула новую жизнь в стиль зайдеко как таковой.


    AllMusic поставил всего 3 звездочки. Если у этого альбома их всего три, то что на остальных, у которых 4, я боюсь представить.
    Ибо альбом действительно шикарен. Тут есть все: фанк, регги, классическое зайдеко. Кейт смешивает стили и на выходе получается
    очень энергичная, живая (что большая редкость для альбомов в стиле зайдеко) работа.


    Сама группа состоит всего из трех человек:


    Brad Frank - Drums


    Jennifer Frank - Bass


    Keith Frank - Bass, Guitar, Accordion, Producer, Scrubboard


    Как видно из совпадения фамилий, они все родственники и раньше звались Family zydeco band. Данный факт кстати типичен
    для зайдеко, в котором как нигде развита клановость, на вскидку вспоминаются кланы Шенье, Каррье и Ардоинов (этих вообще
    по-моему миллион).


    Аранжировки продуманы и самобытны, аккордеон сменяется активным мелодичным басом, гитарой или вообще ударными, а не лезет
    из всех щелей как, например, у Чабби Каррье.


    Отдельный разговор прекрасный кавер Satisfaction. Так обстебать легендарный трек надо было суметь. Песня зазвучала не
    просто по-новому, она стала совсем другой и более интересной.


    Подводя итоги, скажем, что данная пластинка возможно, одна из лучших для зайдеко в 90-х.


    Стиль: nouveau zydeco


    Радует: Самобытный, необычный альбом, в котором переплелись многие стили музыки.


    Огорчает: Остальных альбомов Keith Frank в Москве нет.


    В целом: Твердая 5.'
