- id: 682
  author: Александр Панин
  mark: 8
  date: '2005-05-25'
  text: 'На этом диске, выпущенном лейблом Testament в 1998 году, записан неизданный ранее концерт Биг Джо Вильямса в Rockford
    College в 1965 году. Probably 1965, как написано на вкладыше. Да, шестидесятые были уже очень давно, раз никто ничего
    точно не помнит или не знает.


    Музыки на диске чуть больше чем на сорок минут, но в это время уместилось аж 17 композиций. За три минуты зашкаливает
    всего четыре трека, а пять не дотягивает и до двух минут. Тем разнообразнее блюзы. Много хороших вещей как самого Большого
    Джо, так и других исполнителей - Baby Please Don''t Go, Good Morning Little Schoolgirl, Highway 49, Bottle Up And Go,
    Sloppy Drunk, Boogie Chillun, Rock Me Mama. Но самое главное здесь - звук 9-струнной гитары Вильямса. Он и так всегда
    был уникальным и сразу привлекающим внимание, а на этом концерте гитара была еще изрядно подзвучена, что прибавило электрического
    драйва. Очень впечатляет.


    Это, конечно, не самый лучший альбом Биг Джо Вильямса, но довольно важный и интересный необычным звуком.


    Для археологов - сам Вильямс говорит, что сочинил Baby Please Don''t Go в 1927 году. Хотя в основе ее, как и многих других
    древних блюзов, скорее всего, лежит народная песня.'
