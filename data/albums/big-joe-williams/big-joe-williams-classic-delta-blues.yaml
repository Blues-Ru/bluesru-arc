reviews:
- id: 650
  author: Александр Панин
  mark: 8
  date: '2005-05-20'
  text: 'Записи двух чикагских сессий 1964 года. Биг Джо отложил свою самодельную
    9-струнку и взял обычную шестиструнную акустическую гитару. Характерных фирменных
    звуков больше не слышно, но исполнение отличное, а материал просто превосходен!
    Вильямс играет только архаичный материал, большая часть из 12 треков диска - композиции
    Чарли Паттона и Роберта Джонсона. Естественно, он поет и играет все по-своему,
    а не занимается простым копированием.


    Здорово. Удачный кавер всегда в тему :) Минус - не всегда хороший звук, есть потрескивания
    и щелчки.'
