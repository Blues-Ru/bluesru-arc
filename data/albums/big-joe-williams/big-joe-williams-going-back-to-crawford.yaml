  author: Александр Панин
  mark: 7
  date: '2005-05-24'
  text: 'Биг Джо Вильямс собрал для этой записи своих родственников, соседей и знакомых, попросту говоря, блюзовую тусовку
    родного города Кроуфорд, штат Миссисипи. Это 1971 год, блюзовый ривайвл уже отгремел, поэтому пленки пролежали в шкафу
    28 лет и были выпущены лейблом Arhoolie только в 1999-м.


    На диске 26 вещей, Биг Джо поет только на восьми, но все время играет на гитаре. Отмечу довольно сильную версию Baby Please
    Don''t Go. Из остального ничего особо не выделяется, но плохих треков нет. С Вильямсом играют еще два гитариста (у одного
    гитара ощутимо потрескивает, на развороте так и написано - rattling guitar :) ), несколько композиций с женским вокалом.
    Семь последних вещей записаны на радио и звучат чуть похуже остального материала.'
