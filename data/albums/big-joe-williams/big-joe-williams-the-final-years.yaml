  author: Александр Панин
  mark: 7
  date: '2005-05-20'
  text: Это не компиляция, как заявлено на АМГ, а одна из последних сессий Биг Джо,
    датированная сентябрем 1979 года. Вильямс уже стар, и это чувствуется - его гитарная
    игра уже не столь впечатляюща, хотя вокал по-прежнему силен. Впрочем, привычная
    9-струнка Джо как и ранее издает очень необычные звуки, поэтому этот диск довольно
    интересен, хотя, конечно, совершенно необязателен.
