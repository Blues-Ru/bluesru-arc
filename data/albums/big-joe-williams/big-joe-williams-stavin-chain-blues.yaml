  date: '2006-07-04'
  text: Записи 1958 года. Биг Джо поет и играет на 9-струнной гитаре, J.D. Short поет в двух блюзах, играет на гармошке и
    гитаре. На альбоме 11 отличных акустических блюзов; Биг Джо хорош и один, но вдвоем это звучит совсем круто! Запись очень
    приличная для 58 года.
