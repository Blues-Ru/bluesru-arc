- id: 507
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-04-02'
  text: 'Полный кайф! Гениальный альбом. Фолк, блюз, кантри и рок "в одном флаконе".
    Колин потрясающе поет и интерпретирует чужие песни и блюзы. Как здорово звучит
    в фолк-обработке песня Чака Берри Sweet Little 16; великолепная кантри-песня 6
    Days On The Road - это шедевр в этом исполнении; Creole Belle Миссиссиппи Джона
    Херта спета вместе с его женой Сюзи так, что мурашки идут по телу; 6000 Miles
    и Born In Chicago - просто классные блюзы, в конце концов. Я уже не говорю про
    песни, написанные самим Янгом. Душевная, мелодичная, красивая фолк-рок-музыка.


    Это первый сольник Янга, хотя группа Youngbloods еще существовала (но его сольники
    гораздо интереснее).'
