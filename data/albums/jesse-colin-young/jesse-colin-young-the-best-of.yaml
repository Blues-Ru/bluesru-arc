reviews:
- id: 908
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-11-27'
  text: 'Самая забытая и недооцененная фолк-рок-группа 60-х. А ведь, возможно, это ЛУЧШАЯ фолк-группа 60-х (наряду с Byrds,
    Buffalo Springfield, Lovin'' Spoonful). Джесс Колин Янг прекрасно поет, играет на гитаре, а его песни - это что-то выдающееся.
    "Darkness Darkness" и "Sunlight" - это шедевры, конечно. Ребята также играют и (блюзовую) традицию: "C.C. Rider" и "Sugar
    Baby" тут в очень интересных вариантах. Возможно, это не так умно и матеро, как сольники Янга 70-х, но эта музыка настоящая,
    она дарит радость и настроение. Сборник очень короткий - 10 песен на 29 минут.'
