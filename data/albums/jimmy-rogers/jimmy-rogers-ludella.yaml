  text: '<img src="http://image.allmusic.com/00/amg/cov200/drc300/c370/c37022lxm3q.jpg">
    Джимми Роджерс – это легенда чикагского блюза, именно с его участием первый блюзбенд
    Мадди Уотерса получил прозвище Headhunters, а также была записана добрая часть
    золотого фонда чикагского блюза на лейбле Чесс.


    "Luedella" (первое название композиции) появилась на свет в далеком 1950 году
    и, по традиции тогдашнего чикагского блюза, была записана малым составом – сам
    Джимми на гитаре, Литтл Уолтер на гармонике, Big Crawford – контрабас и некто
    неизвестный на стиральной доске. А вот на этом альбоме 1990-го года состав уже
    гораздо более расширенный – добавились барабаны, вторая гитара и фортепиано. Именно
    этим, прежде всего, и интересна данная запись – свой классический материал и прочтение
    чикагского блюза Джимми записал в новых условиях и обновленным составом. На протяжении
    всей свой карьеры Джимми был верен этой музыке, потому весь материал звучит именно
    так, как и должен играться настоящий чикагский блюз, ничего лишнего. В этом ему
    помогают замечательные музыканты, которые сами по себе являются классиками блюза:
    Pinetop Perkins, Kim Wilson, Bob Stroger, Calvin Jones, Willie Smith, Hubert Sumlin,
    Derek O''Brian. Нужно отметить, что часть материала записана в студии, а часть
    вживую.'
