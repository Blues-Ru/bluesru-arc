- id: 647
  author: Александр Панин
  mark: 7
  date: '2005-05-20'
  text: Концерт 1991 года в Германии. Первые три вещи играет Ронни Эрл со своей группой Броудкастерс, и звучат они очень здорово.
    Затем к перцам присоединяется патриарх чикагского блюза Джимми Роджерс. Вроде все получается у них неплохо, но ничего
    выдающегося на совместных треках нет. Они звучат очень обыкновенно, ничем не отличаясь от многих других образцов чикагского
    блюза (это, конечно, не трагично). Ронни очень хорош, первые три композиции диска в целом интереснее остальных девяти.
    Я бы назвал альбом Ronnie Earl And The Broadcasters - With Jimmy Rogers :)
- id: 1791
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-26'
  text: 'Jimmy Rogers is one of the most important and influential figures in the history of Chicago blues. The last remaining
    link to such classic figures as Sonny Boy Williamson, Little Walter and Otis Spann, Jimmy helped pioneer and develop the
    archetypal Chicago Blues sound with his bandmate Muddy Waters from 1947 to 1954. Today he''s still a leader in a vital
    and satisfying tradition. "All my career I''ve wanted to make a Chicago blues album. When I heard the tapes of this concert,
    I knew I had. . . . I will always be grateful to Jimmy Rogers." --Ronnie Earl


    Ронни Эрл всегда хотел записать альбом чикагского блюза, и это ему удалось сделать во время концертного выступления его
    группы с легендой чикагского блюза - Джимми Роджерсом (настоящее имя - Джеймс Лэйн). Концерт состоялся 7 июня 1991 года
    на фестивале в Бремене, а диск с записью вышел почти на 3 года позже. Первые три трека играет группа Ронни, к которой
    на остальных треках присоединяется Джимми Роджерс. С Бродкастерами играет коллега Ронни по Roomful of Blues - вокалист
    и харпер Шугар Рэй Норсия.


    Очевидно, Роджерс и остальные музыканты впервые играли вместе, поэтому слегка "осторожничали" и на второй части концерта
    они слегка скованы. Но зато первые три трека - просто ураган, а соло Ронни со второго трека смело можно занести в зал
    славы и блюза, и рока. Блестящее исполнение!


    Итак, мы имеем концерт звездного состава, играющего добротный чикагский блюз с виртуозными соло Ронни, Шугар Рэя и клавишника
    Дэйва Максвелла. Начало концерта великолепное, вторая часть, увы, чуть послабее, но в целом вполне прилично.'
