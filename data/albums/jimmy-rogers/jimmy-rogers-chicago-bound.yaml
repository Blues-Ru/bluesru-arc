- id: 1154
  author: Константин Колесниченко
  mark: 9
  date: '2007-11-07'
  text: 'Это сборник записей Джимми Роджерса для Чесс. Чикагский блюз в период своего
    становления и расцвета.


    Джимми Роджерс прежде всего известен тем, что был второй гитарой в блюз-бенде
    Мадди Уотерса, позже ушел оттуда и начал сольную карьеру. Насколько успешна сольная
    карьера - это спорный вопрос, а вот то, что этот сборник более чем удачен - это
    факт. Удачен по трем причинам: аккомпониаторы - вся тусовка от Мадди, до Вилли
    Диксона, Литтл Уолтера, Биг Уолтера Хортона, Фреда Билоу и т.д.; не знаю, насколько
    широко, но репрезентативно так точно, сборник дает представление о творчестве
    музыканта в тот период; и третье - удивительное ощущение молодости чикагского
    блюза, пока он еще не превратился в шарманку.


    Единственным недостатком я бы назвал резковатый вокал Джимми, за это и сниму полбалла.'
