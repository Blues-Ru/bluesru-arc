- id: 1584
  author: Андрей Евдокимов
  mark: 8
  date: '2009-11-12'
  text: За 44 года профессиональной музыке и 24 записанных альбома Род Пьяцца никогда
    не стремился был традиционалистом. Но за столь долгую карьеру у музыканта случаются
    разные неожиданности – просто чтобы не заскучать. Пьяцца всегда предпочитал атакующий
    мощный саунд диатоники. В нынешнем альбоме он полностью отдается хроматической
    губной гармонике. И смена инструмента принципиально меняет весь характер музыки.
    Все звучит степенно. И, хотя порой он пытается напугать слушателя самыми страшными
    звуками, которые можно извлечь из микрофона, не прибегая к электронной обработке
    звука, по существу это самый деликатный блюз уходящего года. Милый, старомодный,
    виртуозный… И скромный, поскольку уверенность в своих силах прошла испытание временем.
    В общем, блюз для старшего возраста
