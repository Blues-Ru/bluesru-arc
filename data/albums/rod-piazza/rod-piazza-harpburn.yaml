  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-06'
  text: 'Один из выдающихся блюзменов современности одаренный мастер губной гармоники,
    певец и композитор Род Пиацца учился ремеслу у знаменитого Джорджа Смита (получившего
    прозвище "Гармоника") - в группе Смита Род играл почти 15 лет, и только после
    ухода своего учителя на покой в начале 80-х создал свой собственный коллектив
    The Mighty Flyers. Своему наставнику Пиацца посвятил трек под номером 6.


    Кроме самого Рода музыку группы также определяет присуствие там виртуозной пианистки
    Хани Александер, которая стала супругой харпера. Правда, музыка Хани ближе к темпераментному
    буги-вуги и рок-н-роллу, нежели к традиционному блюзу, но зато играет она классно
    и зажигает не хуже супруга. Возможно, такой сплав современного блюза и энергичного
    буги и является "изюминкой" коллектива, который славится своими искрометными концертами.


    Материал данного альбома был записан в течение двух сессий в 1985 году и издавался
    на виниле в 1986 году. При переиздании на КД в 1993 году к десяти оригинальным
    трекам были добавлены еще два (3-й и 11-й) неиздававшиеся ранее и записанные в
    тот же временной период, что и основной материал. Хороший альбом современного
    блюза с заводными мелодиями, профессиональным исполненеим и мастерскими соло.'
