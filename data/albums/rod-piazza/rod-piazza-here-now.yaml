  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-06'
  text: 'Семнадцатый альбом калифорнийского харпера, на котором он и его группа попытались
    отойти от интерпретаций того, что уже неоднократно было сделано до них, и создать
    что-то новое и современное, сохранив при этом верность блюзовой традиции. По мнению
    самого Пиаццы, им это удалось.


    Род является автором 9 треков альбома, причем 6 из них в соавторстве с женой.
    Сопровождающий квартет The Mighty Flyers укомплектован первоклассными музыкантами:
    ритм-секция из Стива Мугалиана на ударных и Била Штуве на контрабасе, отличный
    гитарист Рик Холмстрем и, конечно же, виртуозная пианистка Хани Пиацца. При этом
    каждый музыкант вносит свой вклад в общую музыкальную картину, периодически солируя,
    причем иногда одновременно (обратите внимание как "заполняют" промежутки между
    куплетами гитара, гармоника и фортепиано, например, на I do Believe). А какое
    буги выдает Хани на First Love! На двух треках группа усилена двумя саксофонистами,
    что тоже очень и очень кстати.


    Возможно, не все из задуманного удалось одинаково хорошо, но альбом определенно
    вносит свежий вклад в блюзовую картину современности и является одним из лучших
    у Рода сотоварищи. Достойный самобытный альбом современного блюза и вполне заслуженное
    двенадцатое место в топе блюзовых альбомов Биллборда.'
