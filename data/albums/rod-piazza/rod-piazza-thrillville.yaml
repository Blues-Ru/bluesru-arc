- id: 1247
  author: Андрей Евдокимов
  mark: 7
  date: '2008-04-09'
  text: Дикая смесь калифорнийской изысканности с чикагской грубостью. Густой гармошечный саунд поперек очень странного шафла.
    Род Пьяцца хотел удивить – и у него это получилось. Когда он переходит с шафла на свинг в первой песне – это действительно
    поражает. Придерживаясь стандартных блюзовых форм, он умудряется перетасовывать давно известные рецепты в нечто новое
    и удивительное. Впрочем, кое-что принципиальное новое в нынешнем альбоме есть. Великолепная пианистка Ханей Пьяца полностью
    берет на себя функции басиста, что абсолютно не меняет общий саунд блюз-бэнда. Традиционный блюз в свежих обработках –
    этим и занимается Род Пьяцца в своем новом альбоме. А ведь уже 40 лет прошло от дебютной записи.
