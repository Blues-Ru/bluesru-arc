- id: 1930
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-07-06'
  text: 'Очередной студийный альбом семейного дуэта Рода и Хани Пияцца сотоварищи
    был записан на лейбле Blind Pig Records в условиях, максимально приближенных к
    концертным - преимущественно с первого дубля и почти без наложений, чтобы передать
    реальное звучание группы (отсюда и название диска).


    На диске половина авторского материала, половина каверов, сосредоточенных в основном
    в начале диска. Наряду с реалистичностью звучания, спонтанностью и честностью
    подхода имеются и недостатки "живого" исполнения - большинство треков откровенно
    затянуты, а уж буги от Хани аж на 10 минут так просто рекордсмен в этом плане.
    На мой взгляд, каверы не очень удались, а интересный материал сосредоточен в основном
    в середине альбома (в конце - чрезмерно затянутые треки). В целом приличный альбом
    современного блюза, но не лучший у знаменитого харпера.'
