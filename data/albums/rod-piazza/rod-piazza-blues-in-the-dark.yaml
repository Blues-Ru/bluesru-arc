- id: 135
  author: Федор Романенко
  mark: 9
  date: '2003-07-09'
  text: 'Группа Рода Пьяццы - это один из самых горячих концертирующих блюзовых ансамблей
    в Америке. Группа существует уже очень давно, а за последние 15 лет в группе сменилось
    три основных гитариста - Джуниор Ватсон, Алекс Шульц и Рик Холмстром. Не нужно
    объяснять значение гитариста в таком ансамбле. Третьим солистом в группе после
    Пьяццы и гитаристов с 73-го года была Honey Alexander Piazza - виртуозная пианистка,
    по стечению обстоятельств - жена Рода. Все три гитариста у Пьяццы вызывают мое
    восхищение, но у Пьяццы мне, пожалуй, больше всех нравится Алекс Шульц, который
    и играет на пластинке Blues in the Dark. Еще один альбом Пьяццы с Шульцем на гитаре
    - Alphabet Blues - также великолепен. Как написано в буклете, эту пластинку Пьяцца
    постарался составить из наиболее горячих и выигрышных концертных номеров из числа
    ранее не записанных, не стараясь непременно сочинить для новой пластинки новый
    материал.


    Результат получился великолепный, также во многом благодаря гитаре Алекса Шульца,
    который демонстрирует на пластинке различные стороны своего таланта. Супер-классные
    чисто блюзовые соло, как, например, в классической песне I''m Tired (наш ответ
    блюз-рокерам, облюбовавшим эту песню!) или более свинговые в песне Low Down Dog.
    Причем, что интересно, виртуоз на гитаре Алекс Шульц всего за три года до этого
    записывался с Пьяццой, играя на басу, и это было его основной профессией.


    Наибольшее влияние на Пьяццу (также и на William Clarke и других) как на гармониста
    оказал умерший в 84м году в Лос Анжелесе George "Harmonica" Smith. На пластинке
    есть несколько характерных песен со звуком хроматики в его стиле - это, например,
    песня G.Smith-а California Blues и отличный медленный блюз, который ему же посвятил
    Пьяцца - 4811 Wadsworth (Blues for George).


    Honey Piazza сочинила на альбоме две очень качественные песни, разумеется, не
    без любимого ею уклона в буги. Honey - супер-крутая и виртуозная пианистка, таких
    можно попробовать поискать, но, скорее всего, не найдешь. К сожалению, ее тяга
    к более гладким, чем блюз (low-down-dirty one) формам, типа буги-вуги, иногда
    не очень хорошо сказывается на пластинках Пьяццы, на мой взгляд. Тем не менее,
    ее присутствие в группе здорово разнообразит звучание, а ее крутые песни в умеренных
    количествах очень приятно слушать. Весь вопрос в некой пропорции и т.д. Пластинка
    Blues in the Dark выгодно отличается от некоторых других, ибо там нет излишнего
    буги-вужного угара. Пластинка получилась очень и очень блюзовая. На этот счет
    выскажу крамольную мысль. Мне кажется, что в группе у Пьяццы всегда происходила
    какая-то борьба невсерьез мужского (естественно склонного к более грязно-блюзовому
    звучанию) и женского (склонного к более гладким и блестящим формам) начал. Но
    не будем переходить на личности? ;)


    Пластинка получилась отличная, Род показал с себя с лучшей стороны, Шульц сыграл
    кучу первоклассного утонченного блюза, Хани - не перестаралась. ;) Хотя, конечно,
    мне больше всего хотелось бы послушать Пьяццу живьем. Говорят, что не очень просто
    получить представление об урагане на его концертах даже по его великолепным записям.'
