  date: '2009-01-13'
  text: '<img src="http://s49.radikal.ru/i126/0901/6e/e61004db4938.jpg"> Это первый
    полноценный альбом Jerry Mccain и на момент записи музыканту было уже 59 лет.
    "Blues ''n'' Stuff" предшествовали синглы на "Excello" и "Trumpet", как вы понимаете,
    все это происходило в золотые для блюза времена - 50-е. В эти годы его кумиром
    на игре в гармонике был Little Walter (а для кого он не был кумиром?), потому
    играл Джерри музыку, находясь под влиянием своего великого одногодки. Позже он
    немного отошел от блюза в сторону рок-н-ролла. Его демозаписи, сделанные для лейбла
    "Excello" у себя в гостинной, позже были изданы на LP под названием "Choo Choo
    Rock".


    Между этим альбомом и юношескими (для музыканта) временами прошло почти 30 лет,
    во время которых Джерри играл в клубах, выступал на фестивалях, в общем, вел образ
    жизни довольно малоизвестного блюзмена. После выхода "Blues ''n'' Stuff" критики
    сетовали на то, что этот альбом не дотягивает до его "классических" записей. На
    мой взгляд, это не так. Выпущенный в 1989 году, альбом хоть и имеет в недостатках
    характерный для того времени звук, в целом является очень хорошей и качественной
    работой зрелого музыканта.


    Бывает, когда слушаешь такие вот возвращения из прошлого, отмечаешь, что музыкант
    не сдвинулся музыкально и технически с того времени, когда был молод и полон идей.
    С Джерри у меня такого ощущения не сложилось - он очень хорошо играет на гармонике
    с профессиональным звуком и довольно интересными фразами. Причем альбом этот -
    это совсем не одни лишь шаффлы, начинается он живым фанком "Messin'' With Me Baby",
    затем медленный блюз "3 Wives", "Brand New Mojo" - это опять фанк, правда с отголосками
    80-х, но тут очень интересно слушать, как справляется с исполнением такой музыки
    Джерри. Приблизительно так и развивается вся запись. Мне кажется, что ключевым
    моментом всего альбома является замечательная соул-баллада "A Rose For My Lady",
    в которой Джерри играет очень интересную и лиричную мелодию на гармонике.


    Многие критики отмечают, что Джерри является замечательным автором блюзов, должен
    с ними согласиться - весь материал на альбоме авторский и это не очередной повтор
    блюзовых штампов, а интересные и содержательные песни!'
