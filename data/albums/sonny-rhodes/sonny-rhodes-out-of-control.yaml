- id: 881
  author: Константин Колесниченко
  mark: 10
  date: '2005-10-03'
  text: Альбом выпущен на "King Snake Records", лейбле, которого уже не существует. Rhodes продолжает играть интересный и
    очень своеобразный блюз, используя соул-фанк аранжировки на этом диске. В чем-то этот диск похож на то, что делал, например,
    Альберт Кинг в 70-х, но записано и сыграно все с позиции середины девяностых. Sonny замечательно солирует на своей Lap
    Steel Guitar, не переигрывает и не пилит. Большинство композиций тут авторства именно Sonny Rhodes, он еще и замечательный
    автор, тексты очень добрые и лиричные. Отличный вокал, гитара, прекрасные песни – для меня этот диск на пятерку.
