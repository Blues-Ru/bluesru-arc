- id: 1287
  author: Леонид Аускерн
  mark: null
  date: '2008-06-03'
  text: Среднестатистический техасец, как правило, не большой интеллектуал, зато энергии
    и напора у него хоть отбавляй. Ничего не могу сказать об интеллектуальности Сонни
    Родса, но вот с энергией и напором в его техасском блюзе действительно все в порядке.
    А кроме того, он прекрасно играет на самых разных инструментах гитарного семейства
    и обладает запоминающимся, чуть хрипловатым голосом. Родс преимущественно исполняет
    композиции собственного сочинения, но изредка выдает и весьма смачные версии чужих
    блюзов. Убедиться во всем вышесказанном вы сможете лично, прослушав изданный в
    России по лицензии лейбла Stony Plain альбом Родса Blue Diamond. Этот девятилетней
    давности диск стал фонографическим дебютом Сонни на этом канадском лейбле. К тому
    времени Родс был уже признанным мастером блюза с богатой творческой биографией
    – достаточно сказать, что он одиннадцать раз номинировался на Blues Music Award
    (правда, ни разу не получил эту высокую награду). Уроженец техасского городка
    Смитвилл Кларенс Смит (это его настоящее имя) свой первый диск записал еще в далеком
    1958 году. С тех пор его дискография заметно пополнилась, хотя и выглядит не столь
    внушительной, как можно было ожидать. Дело в том, что Сонни Родс – в первую очередь
    концертирующий музыкант, большую часть времени отдающий бесчисленным турам по
    городам Америки и Канады, а также и Европы, которую он открыл для себя еще в 1976
    году. Прекрасный шоумен, он не случайно изображен на обложке альбома в ярком тюрбане
    – это его обычный сценический имидж. Blue Diamond – крепкий альбом, весьма удачно
    представляющий творчество Родса. Единственный недостаток, который в этом проекте
    можно усмотреть, это некоторое однообразие исполняемых блюзов. Но если стиль Сонни
    придется вам по душе, то такой недостаток обернется весомым достоинством. Собственно
    музыкальных треков в альбоме тринадцать. Завершает же его двадцатиминутное интервью
    Родса с шефом Stony Plain Хольгером Петерсеном.
- id: 1374
  author: Константин Колесниченко
  mark: 8
  date: '2008-11-26'
  text: 'Sonny Rhodes - не самый известный блюзмен, но он это – what this blues is
    all about, по-другому и не скажешь. С самых первых нот альбома это становится
    понятно. И хорошо, что есть такой лейбл, как "Stony Plain" - настоящий архивариус
    блюза и корневой музыки. Мало того, что они дают возможность записываться музыкантам,
    у которых нет контрактов с ведущими лейблами этой индустрии, так еще и подробное
    20-ти минутное интервью помещено в конце диска.


    Сонни – техасец, его блюз знойный, свингующий, его вокал шершавый и сильный, одним,
    словом, он достойный продолжатель дела своих предшественников – Albert Collins,
    T-Bone Walker, Bobby Blue Bland, Johnny Copeland. Кстати, последнему он и посвящает
    свой альбом. У Сонни за плечами очень большая школа игры в ансамблях различных
    известных блюзменов – от Freddie King до Albert Collins. Казалось бы, что играя
    со столькими уникальными гитаристами, Сонни мог стать компилятором их стилей,
    но нет, этого не случилось – он выработал свой уникальный почерк, да в добавок
    к этому еще и играет на lap steel guitar.


    Сонни долгое время записывался и работал с несуществующим ныне лейблом King Snake
    и его владельцем и музыкальным продюсером Bob Greenlee. Так вот, на этом альбоме
    присутствуют все сливки фирмы: Ace Moreland, Mark Hodgson и др, да и сам Боб играет
    на басу.


    Подытожив все вышесказанное: если вам по душе техасский блюз во всех своих проявлениях,
    то этот альбом то, что вам нужно.'
