- id: 880
  author: Константин Колесниченко
  mark: 7
  date: '2005-10-03'
  text: 'Первый альбом замечательного и малоизвестного гитариста Sonny Rhodes. Sonny,
    чье настоящее имя Clarence Smith, играл на басу у Freddie King и у своего большого
    друга Albert Collins. В шестидесятых, семидесятых и восьмидесятых выпускал синглы,
    но большой популярности не приобрел, продолжая оставаться известным только небольшому
    кругу любителей его клубных выступлений. В середине семидесятых много гастролировал
    по Европе, где записал несколько живых записей, которые так и не переиздавались
    на родине. В восьмидесятых, он на свои деньги сделал альбом, переиздали его лишь
    в 95 году, потому данная запись и считается первой.


    На диске Sonny демонстрирует замечательный современный блюз, с интересными аранжировками,
    яркой гитарной (он использует Lap Steel Guitar на своих записях) игрой и сильным
    вокалом. В своей гитарной манере Rhodes в чем-то схож со своим другом и учителем
    Albert Collins, разве что звук его гитары не такой резкий, более насыщенный. Весьма
    радует присутствие духовой секции на записи, она очень разнообразит альбом. На
    диске всего девять композиций, наверное, поэтому он выглядит очень цельным и не
    затянутым.'
