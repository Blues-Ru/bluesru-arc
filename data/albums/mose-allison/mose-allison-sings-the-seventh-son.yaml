  author: Алексей Калачев
  mark: 10
  date: '2003-02-24'
  text: Пианист и певец, сочинивший "Parchman Farm". И это – только, во-первых. Сначала Моуз исполнял чужие вещи, стандарты,
    много играл инструментального. На данной пластинке – только его вокально-инструментальные опусы. И только самые-пресамые!!!
    Формат – пианино, контрабас, ударные + голос, разумеется. Запись 1957-59 годы, то есть пик карьеры. Впрочем, 75-летний
    Аллисон всегда оставался респектабельным и крайне востребованным музыкантом, список его дисков поистине бесконечен. "Sings
    The Seventh Son" – лучший способ не утонуть в его творческом наследии и не сорить деньгами, пытаясь найти отыскать эссенцию.
    Это она и есть.
