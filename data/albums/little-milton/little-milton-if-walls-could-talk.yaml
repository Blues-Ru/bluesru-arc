reviews:
- id: 950
  author: Дмитрий Казанцев
  mark: 9
  date: '2006-01-08'
  text: 'Третий и последний альбом Милтона для Чесс Рекордз. Все песни записаны в 1969 году, а сам диск вышел в январе 1970-го.


    Мощный, энергичный, прифанкованный соул-блюз с сильным акцентом на соул, пожалуй. Милтону (который играет на гитарах)
    здесь помогает целый оркестр музыкантов, а в одной песне на рояле играет великолепный Donny Hathaway. Пение Милтона настолько
    уверенное, что он легко справляется даже с бодрыми фанковыми номерами, делая из них настоящие жемчужины.'
