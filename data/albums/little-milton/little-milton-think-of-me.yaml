reviews:
- id: 777
  author: Андрей Евдокимов
  mark: 8
  date: '2005-08-05'
  text: Первую пластинку он выпустил на легендарном лейбле Sun более полувека назад. Нынешний альбом Литл Милтон Кэмпбэлл
    начал записывать, едва отпраздновав 70-летний юбилей. Ни в чем не изменив своим принципам, Милтон играет "соул" в изначальном
    звучании, которое совершенно не похоже на сегодняшний день этого стиля. Его новые песни немодны, по большей части благодушны
    и легкомысленно романтичны. Но эмоции глубже в Blues Is My Companion и Reconsider Me. Гитара Милтона великолепно комментирует
    вокальную линию – короткими и ясными фразами, как в тех его давних песнях, которые уже признаны классикой соул-блюза.
    Финальный жесткий блюз исполнен с яростной горечью, он словно обрывает программу альбома на высшей точке. Баллады Милтона
    часто насыщали скрипками и трубами. Telarc выдерживает строгий стиль небольшого блюз-бэнда, и далеко не такой сильный,
    как в молодости, голос Милтона предстает без прикрас. Брюс Катц, виртуоз клавишных инструментов, оказался очень к месту
    со свойственным ему чувством стилевого такта.
- id: 928
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-12-01'
  text: 'Последние 20 лет своей жизни Милтон записывался на лейбле Malaco, но в 70 лет решил сменить фирму на Telarc. Альбом
    получился прекрасным - соул-блюз и фанки-соул в духе 70-х (его лучшее время на Stax Records). Здесь нет слабых номеров
    и супер-хитов, музыка несовременная и почти клубная (в хорошем смысле этого слова).


    К огромному сожалению поклонников черной музыки, Милтон умер 4 августа 2005 года, чуть-чуть не дожив до 71 года.'
