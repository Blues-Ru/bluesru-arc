  author: Дмитрий Казанцев
  mark: 10
  date: '2005-08-15'
  text: Свои лучшие записи Литтл Милтон сделал для фирмы Стакс в начале и середине 70-х годов 20-го века. Соул-блюз высочайшего
    класса, прекрасное пение, выразительная игра на гитаре, яркие песни и композиции Милтона. На этом сборнике собраны все
    20 синглов, которые выходили на Стаксе в период 1971-1975 годов. Можно сказать, что это двойной (по длине) сборник лучших
    вещей артиста тех лет. Великолепно!
