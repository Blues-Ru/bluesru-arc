- id: 566
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-03'
  text: 'Очень интересный диск Милтона - он вышел в 1981 году на Стаксе, но на нем записаны композиции 1972 и 1974 годов (один
    сингл и 8 неизданных вещей). И это не просто демо-записи или концертные нарезки, но настоящие студийные работы отличного
    качества.


    Милтон работал на Стаксе в начале 70-х, сочетая в своей музыке блюз, фанк и deep soul. У него прекрасный (если не экстраординарный)
    вокал и он самобытно играет на гитаре - слушать его очень приятно. На этом диске особенно хороши: Somebody''s Tears, Open
    The Door To Your Heart, Letter Full Of Tears, Bet You''ll Win.


    Очень приятный подарок любителям блюза и Стакса в 1981 году, когда Милтон играл и пел совсем другую музыку, далекую от
    этой красоты.'
