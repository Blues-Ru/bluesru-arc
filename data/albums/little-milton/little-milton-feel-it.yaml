- id: 765
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-07-22'
  text: 'Какой красивый микс блюза, соула и фанка. Милтон гениально поет и прекрасно
    солирует на гитаре, довольно большая группа музыкантов создает ему классную музыкальную
    поддержку.


    12 песен на 50 минут, кое-что слишком сладко и попсово, но в целом, это очень
    сильная ритм-н-блюзовая работа Милтона. Совсем приличные звуки и аранжировки для
    2001 года (я был удивлен и обрадован). Очень убедительно для 67-летнего артиста.'
