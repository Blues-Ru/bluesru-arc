reviews:
- id: 530
  author: Дмитрий Казанцев
  mark: 5
  date: '2005-04-02'
  text: 'Очень длинный одинарный концертник Милтона. Запись сделана на джазовом фестивале в Монтре (Швейцария). Группа очень
    живо и мощно играет, но иногда это приводит к лажовым местам в композициях. Гитара Милтона порой не строит; все это ОК
    на концертах, но на записи это может и напрячь.


    Литтл прекрасно поет и общается с публикой, а его игра на гитаре очень самобытна и необычна в тихих сольных местах. И
    все же его студийные работы с группой гораздо сильнее этого полуслучайного концертника.'
