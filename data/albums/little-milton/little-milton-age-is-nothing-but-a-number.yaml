  author: Дмитрий Казанцев
  mark: 4
  date: '2005-07-22'
  text: 'Литтл Милтон записывал отличную музыку на фирме Stax в 70-х, но после ухода оттуда все изменилось. 1983 год, MCA
    Records, звук пластиковый и попсовый, аранжировки местами почти ужасны, материал далек от блюза и того соул-фанка, который
    Милтон играл до этого. И при всем при этом, он продолжает прекрасно петь и играть на соло-гитаре. Нельзя сказать, что
    тут записана совсем плохая музыка, скорее, этот звук и стилистика не идут самому Милтону.


    Некоторые треки очень хороши, тем не менее. Я бы выделил "I Wanna Love You", "Living On The Dark Side Of Love", "Why Are
    You So Hard To Please". Если бы не они, то этот диск можно было назвать полным провалом и ненужностью.'
