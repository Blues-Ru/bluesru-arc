  author: Дмитрий Казанцев
  mark: 8
  date: '2007-09-27'
  text: 'Блюзы про cheating, lying & leaving. Как же классно поет Милтон; его соул-блюз - это что-то отдельное в Мемфис-стиле.
    На этом диске есть и чистые блюзы, и прифанкованные вещи, и развитый ритм-н-блюз. Гитара Милтона звучит близко и без обработки
    - необычное ощущение.


    Хорошая пластинка во всех отношениях. Если Вам нравится Би Би Кинг, то Вам точно придется по вкусу и Литтл Милтон.'
