  date: '2005-04-04'
  text: 'Еще один хороший диск Милтона на фирме Стакс. На этом диске почти нет фанка,
    а соул-блюз доминирует. Отличное пение, игра на гитаре, группа и продакшн; просто
    не к чему придраться и при желании.


    You''re No Good - замечательный ритм-н-блюзовый номер, который сильно выделяется
    из программы, а Hard Luck Blues - шедевральный соул-блюз Милтона.'
