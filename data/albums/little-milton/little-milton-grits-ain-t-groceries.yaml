  author: Дмитрий Казанцев
  mark: 6
  date: '2005-04-04'
  text: 'Первый альбом Литтл Милтона на Стаксе оказался концертным. Милтон перешел на этот лейбл с фирмы Checker (подразделение
    Chess), и в его музыке стало еще больше влияния соула, фанка и ритм-н-блюза вообще. Можно сказать, что Литтл Милтон -
    само воплощение соул-блюзового вокалиста/гитариста. Прекрасный вокал, умение играть на гитаре сложные расширенные гармонии,
    соул-музыка в концертных выступлениях и на альбомах.


    На этом диске всего 6 композиций; маловато для "живого альбома" и некоторые вещи кажутся затянутыми. А в целом, это очень
    симпатичный концертник.'
