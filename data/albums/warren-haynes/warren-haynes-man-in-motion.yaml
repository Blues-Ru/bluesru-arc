  author: Дмитрий Казанцев
  mark: 6
  date: '2011-04-13'
  text: 'Уоррен - один из лучших гитаристов мира в жанре классик-рока и блюз-рока. Он - участник Gov''t Mule и Allman Brothers
    Band. Настоящий умница и фанат старой доброй музыки от блюза и госпела до гранжа и хард-рока.


    Это его второй студийный альбом. Диск прекрасно записан (на пленку), на басу играет сам George Porter (из Meters), на
    клавишах - монстры: Ian McLagan и Ivan Neville. Музыка грамотная, правильная, виртуозная и абсолютно нужная, но есть несколько
    "но". Что-то не то творится у Уоррена с сочинительством - все какое-то одинаковое и крутое, но где полет? Пожалуй, он
    остался на самых ранних альбомах Gov''t Mule. И еще, Уоррен крутой и безупречный гитарист, но вот его пение может доставать
    с плохой стороны - все как-то старательно, серьезно, пафосно и без юмора. Да, круто и точно в ноты, но все же тут соул,
    блюз-рок, фанк-рок и корневая музыка - ну куда такой серьез и занудство?


    Диск очень хорош для тех, кто мало знает Уоррена. Они сразу услышат крутость во всем: игра, пение, звук, продакшн, атмосфера.
    Но все же знатоки Хейнза (и его проектов) легко поймут и услышат, что Уоррену надо что-то менять; возможно нужны и другие
    голоса, и песенки кто-то должен написать поинтереснее...'
