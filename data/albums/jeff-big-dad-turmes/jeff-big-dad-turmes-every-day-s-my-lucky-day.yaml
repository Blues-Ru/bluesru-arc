- id: 861
  author: Федор Романенко
  mark: 10
  date: '2005-09-14'
  text: 'Jeff Turmes известен мне в первую очередь как баритон-саксофонист, который записался на большом количестве отличных
    современных вест-коаст пластинок. По совместительству он еще и муж певицы Джанивы Магнесс. Но основной талант Термса в
    написании песен. На известной пластинке Рамоса West Coast House Party для меня главным хитом была вещь Happy Hour, которую
    написал как раз Turmes.


    Авторская пластинка Every Day''s My Lucky Day с его песнями стала для меня откровением, я слушаю ее уже месяц, продолжая
    получать огромное удовольствие. Термс написал все 14 песен. Кроме баритон-саксофона, сыграл на других дудках, гитаре,
    контрабасе, рояле и отлично спел. На пластинке ему среди прочих помогали Рик Холмстром и мой любимый John "Juke" Logan
    на клавишах. Аранжировки на 5 баллов, сами инструментальные партии Термса, может, не столь виртуозны как у "специалистов",
    но отлично выверены и драйвовы со вкусом. Но, самое главное, - это песни! Отлично! Класснейшие тексты и темы, песни сделаны
    со вкусом, местами спеты с запредельным блюзовым чувством, вызывают у меня сильные эмоции.


    Достоинства пластинки не в каких-то ярких моментах, но я думаю, что после 2-го прослушивания всем должно очень понравиться.
    С удовольствием запишу в свою подборку "долгоиграющих" пластинок.'
