  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-10'
  text: 'Legendary Blues Band была создана в 1980 году музыкантами группы Мадди Уотерса, и продолжала играть традиционный
    чикагский блюз на протяжении многих лет, несмотря на смены состава. Одно время в течение года в группе играл талантливый
    молодой гитарист Мелвин Тэйлор.


    Альбом 1983 года - второй альбом группы, и один из лучших. На нем костяк группы из Пинетопа Перкинса, Уилли Смита, Кэлвина
    Джонса и Джерри Портного усилен приглашенными музыкантами Румфул оф Блюз - духовая секция + бывших "Румфуловец" Дюк Робиллард
    на гитаре. Получился такой своего рода джем музыкантов Мадди Уотерса и Roomful of Blues. Поют попеременно Перкинс, Джонс
    и Портной, Портной и румфуловцы обеспечивают духовое сопровождение, материал в основном написан Портным. Добротная пластинка
    высококачественного традиционного чикагского блюза с современным звучанием и прекрасной игрой музыкантов.'
