- id: 1879
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-06-10'
  text: 'За время, прошедшее с альбома 1983 года, который я рецензировал ранее, состав
    группы сильно изменился, а от исходного состава группы Мадди Уотерса осталась
    только ритм-секция из Кэлвина Джонса и Уилли Смита. Тем не менее новые музыканты
    с честью несут знамя чикагского блюза, и в результате получился добротный альбом
    традиционной "корневой" музыки, исполненной на хорошем профессиональном уровне.


    Однако, на мой взгляд, до альбома 1983 года этот диск все-же недотягивает.'
