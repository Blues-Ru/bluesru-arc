  date: '2006-01-08'
  text: '<img src=http://image.allmusic.com/00/amg/cov200/drc300/c373/c37358m0sa2.jpg>


    В составе этой группы два человека из банды Мадди Уотерса: Willie Smith - drums/vocals & Calvin Jones - bass/vocals. Им
    помогают четверо белых блюзменов: Billy Flynn - guitars, Willie O''Shawney - keys, Madison Slim - harp/vocals, Tony O
    - guitars.


    На диске 10 блюзов, игра и пение на высоте, хорош и материал - 7 песен написаны участниками группы (+ каверы: "Got Love
    If You Want It", "Don''t Say That No More", "Who''s Been Talkin''").


    Хороший Чикаго-блюз без истерики и шума; ребята играют так, как делали это еще в 50-х.'
