- id: 479
  author: Сергей Колобашкин
  mark: 10
  date: '2004-03-08'
  text: 'Эрик Сардинас стал таким гитаристом, которого ждали долго: молодой белый
    гитарист с агрессивным стилем слайдовой игры, с отличными каверами и со своим
    отличным материалом. Многи могут сказать, что он делает то, что уже все слышали,
    и скорее всего, он это делает намного хуже, чем все остальные. Я считаю, что Сардинас
    замечательный гитарист, что подтверждает заглавный трек "Treat Me Right", затем
    "Write Me A Few Lines" Фреда МакДауэлла. От первой песни и до конца диска Сардинас
    провозит своим слайдом целый поезд, тяжело загруженный гитарами Dobro и разноколиберным
    виски всех сортов. Стоит обратить внимание на то, что на этой пластинке еще есть
    и гости, а именно Хаберт Самлин и косоглазый альбинос Джонни Винтер. Хаберт Самлин
    гостит и играет на треке "Down In The Bottom", который был написан Вилли Диксоном.
    Далее следует Джонни Винтер и песня "Tired Of Tryin", которую, кстати, написал
    Винтер. Музыканты отлично делят соло и вокальные партии, что отлично завершает
    данный альбом. Моя оценка - это пять с плюсом, мне понравилось. Я очень часто
    слушаю этот альбом, он великолепен.'
