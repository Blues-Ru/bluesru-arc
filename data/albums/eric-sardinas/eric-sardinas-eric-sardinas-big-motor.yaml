- id: 1332
  author: Андрей Евдокимов
  mark: 4
  date: '2008-10-01'
  text: На недавнем блюз-фестивале "Qвадрат" в Москве можно было сполна оценить усилия,
    прилагаемые Сардинасом для создания брутально-мистического образа. Без лицезрения
    его шляпы, шнурованного гульфика, без обилия фенечек, брелочков, колец и браслетов,
    а так же без его гитар, словно поднятых с затонувшего сотни лет назад пиратского
    брига – слушать его музыку не так уж увлекательно. Песни основаны не на мелодии,
    не на блюзовых нотах. Они базируются на тяжелых гитарных рифах (свое происхождение
    ведущих, разумеется, от блюза). Изредка песни скрашивает звучание струн акустической
    гитары с металлическим корпусом под славянским названием Добро. Однако поет Сардинас
    столь сдавленным голосом, что никакого доброго отношения у любителя классического
    блюза он не заслужит. Те, кому нравятся гитарные пауэр-трио, сочтут звучание альбома
    "хлипким". Но в целом, достаточно энергично и искренне. Некоторые понимают блюз
    так, и это их право. Первый его альбом за пять лет.
