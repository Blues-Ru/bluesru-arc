reviews:
- id: 483
  author: Сергей Колобашкин
  mark: 9
  date: '2004-03-12'
  text: '"Black Pearls" - это третий альбом в карьере Эрика Сардинаса. Я лично долго ждал появления этой пластинки, так как
    я очень увлечен музыкой Сардинаса. Этот альбом ужасно приятно слушать, но также его очень приятно держать в руках - оформление
    выходит за грань обычных блюз-роковых альбомов. Итак, первая песня "Flames of Love" начинает все, иначе говоря, заводит
    Сардинаса от начала и до самого конца альбома. Эта пластинка понравится не каждому, но попробовать стоит всем, кто любит
    тяжелый блюз-рок. Интересными песнями являются: "Big Red Line" - клевый блюз, "Black Pearls" - замечательная рок-композиция,
    где Сардинас демонстрирует свое пристрастие к жестким жанрам музыки. Но самым клевым треком с альбома остается незабываемая
    кантри-баллада "Old Smyrm Road", которая подводит альбом к логическому концу, то есть к песне "Wicked Ways", которую Эрик
    исполняет без ритм-секции, только лишь помогая себе своей Dobro. Моя оценка альбому - это пять с маленьким минусом, альбом
    страдает от постоянства + любовь к традициям, что может не порадовать любителей блюз-рока.'
