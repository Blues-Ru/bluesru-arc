- id: 481
  author: Сергей Колобашкин
  mark: 10
  date: '2004-03-08'
  text: 'Эрик Сардинас доказал, что он не любитель, а музыкант первого класса, который может поспорить с многими за свою заслуженную
    крутость. "Devil''s Train" является вторым альбомом в карьере Эрика Сардинаса, и так получилось, что является лучшим,
    по крайней мере, я так думаю! Пластинка начинается с песни "Piece Of Me", которая зажигает весь альбом, который продолжается
    замечательной песней "My Sweet Time". Стоит отметить потрясающую песню "Аggravatin Papa", которая шатает стены! "My Kind
    Of Woman" не дает, мягко говоря, засохнуть и несет в себе отличный рок-н-ролл - никто не останется равнодушным. Эрик Сардинас
    отлично владеет своим инструментом и поэтому лихо зажигает в великолепных инструментальных композиях: "Texola" и "Sidewinder".
    "Down To Whiskey" - это просто локомотив, который прибывает на заполненую народом станцию, клевая композиция в стиле рок-н-ролл.
    На диск зашел погостить великолепный Дэвид Ханибой Эдвардс, а в частности на песню "Gambling Man", которая была записана
    в номере какого-то отеля. И при всех этих тяжелых блюзовых прелестях альбом заканчивается легкой композицией "8 Goin''
    South", которая плавно покачивает любого любителя хорошей музыки; это очень нежная и личная композия для Сардинаса, что
    отражено в тексте самой песни. Короче говоря, послушать надо всем! Моя оценка - это пять с плюсом, в этом альбоме все
    на месте, тут есть и ритм, и блюз, и рок-но-ролл.'
