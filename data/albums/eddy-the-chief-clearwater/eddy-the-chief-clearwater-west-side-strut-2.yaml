  text: '"Joyous rave-ups...Clearwater testifies with stunning soul fervor and a powerful guitar. One of the blues'' finest
    songwriters" - BLUES REVUE


    "With his powerful left-handed guitar playing, unique hybrid of West Side blues, relentless rockabilly and high energy
    performances, Eddy "The Chief" is Chicago''s premier blues showman" - CHICAGO TRIBUNE


    "Clearwater is equally adept at Chuck Berry-style guitar as he is at deeper blues style. He''s a fine singer who puts
    on a wild, exciting show...the sort of exuberant entertainer who can turn a concert into a party" - NEW YORK TIMES


    Эдди Клиаруотер (настоящее имя Эдвард Хэррингтон) по прозвищу "Вождь" - талантливейший ветеран чикагского блюза, гитарист-левша,
    певец, композитор и яркий шоумен, который называет свой музыкальный стиль "рок-а-блюз" (термин придуман по аналогии с
    рокабилли) - мощная смесь блюза, рока, рокабилли, кантри и годспел. Согласно легенде прозвищем Вождь обязан своей бабушке,
    которая была индианкой из племени чероки, поэтому Эдди гордо носит на сцене головной убор из перьев. Если же верить другой
    версии, это прозвище пристало к Эдди после выхода его альбома The Chief 1980 года, на обложке которого Эдди позировал
    в образе вождя - верхом на коне в индейском головном уборе (этот убор подарил ему один из поклонников). Кстати, Эдди приходится
    кузеном другой блюзовой легенде - знаменитому харперу Кэри Беллу. Четвертого мая 2016 года в Мемфисе Эдди Клиаруотер был
    принят в зал славы блюза.


    Альбом West Side Strut - предпоследний на данный момент диск Эдди, который вышел через пять лет после получившего номинацию
    на Грэмми альбома Rock''n''Roll City, записанного Клиаруотером совместно с серф-группой Los Straitjackets. West Side Strut
    - дебют Клиаруотера на лейбле Аллигатор и является одним из лучших дисков музыканта, которому на момент выхода альбома
    исполнилось 73 года.


    За исключением трех каверов (от Мадди Уотерса и Лоуэлла Фулсона), весь материал авторский - написан Эдди в соавторстве
    с гитаристом Ронни Бэйкером Бруксом (сыном Лонни Брукса и племянником Эдди). Ронни также выступил в качестве продюсера
    альбома, а исполнительным продюсером стал сам Эдди. В качестве гостей на альбоме отметились: харпер Билли Бранч, знаменитый
    Лонни Брукс, Отис Клэй и Джимми Джонсон. Духовая группа добавляет дополнительные краски в музыку Эдди.


    Достойный альбом традиционного чикагского блюза с высокопрофессиональным исполнением, современным звучанием и жизнерадостной
    энергетикой.'
