reviews:
- id: 531
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-04-02'
  text: 'Очень неплохой для 1986 года блюзовый альбом. Эдди хорошо играет на гитаре и очень прилично поет. Радует и тот факт,
    что 7 из 8 песен написал сам "Вождь", а восьмая песня - бесподобная Black Night.


    Интересный современный блюз и ритм-н-блюз без кривляния и пафоса. Otis Rush подыгрывает на гитаре в пяти треках, а на
    гармошке в двух песнях выступает сам Sugar Blue.'
