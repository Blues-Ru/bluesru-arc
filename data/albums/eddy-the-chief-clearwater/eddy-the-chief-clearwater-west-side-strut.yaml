reviews:
- id: 1217
  author: Андрей Евдокимов
  mark: 8
  date: '2008-02-20'
  text: 'Ветеран чикагской сцены с индейским прозвищем "Вождь" выпускает альбом после
    долгого перерыва. И он явно соскучился по студийной работе. Альбом получился разнообразным
    и увлекательным. Голос могуч и грозен, гитара выдает пронзительные ноты. Классическая
    формула чикагского блюзбэнда: гитара, губная гармоника, фортепиано плюс мощная
    ритм-секция – подкрашена участием секции медных инструментов. В названии указано
    направление: West Side – разновидность чикагского блюза. Этот стиль празднует
    круглый юбилей. Но в альбоме он юн и задирист, как и 50 лет назад. В песне Мадди
    Уотерса ‘Walking Through The Park" он бьет копытом, брыкается и подпрыгивает –
    классика наглядно молодеет под стать новому веку. Есть и обворожительно-ленивый
    "блюз вразвалочку" Do Unto Others (спетая на пару с друзьями-ветеранами: Otis
    Clay, Lonnie Brooks и Jimmy Johnson). Тем, к кому мир справедлив и ничего не светит,
    дан в утешенье медленный вселенский тоскливо-сладкий "Trouble, Trouble" Лоуэлла
    Фуклсона. За ним скетч "Староват я, чтоб жениться, слишком молод умирать": от
    слов хохочешь, под ритм ноги идут в пляс. Певец-гитарист Лонни Брукс – напарник
    в этом скетче, его сын певец-гитарист Ронни играет в группе "Вождя" на гитаре.
    Вдвоем с Вождем Брукс-мл. в акустическом дуэте они рассказывают о путешествии
    блюза с хлопкового Юга в северный Чикаго, демонстрируя, как разница ритм сельской
    и городской жизни. По контрасту за этим диалогом включается могучая раскатистая
    визитка "They Call Me The Chief". Спектакль завершает пацифистская соул-колыбельная
    с хором под орган. Блестящая драматургия! Это один из самых радостных и энергичных
    альбомов нынешнего сезона, диалектически сочетающий: традицию и свежесть, мастерство
    и беспечность, индивидуальность и приверженность стилю, простоту и разнообразие!
    Все выполнено по старым чикагским рецептам, но преподнесено слушателю с юношеским
    задором.


    Бывалый блюзмен открывает альбом громогласной интродукцией, из которой выходит
    уверенным энергичным шагом. Эта походка на слэнге называется "strut". В название
    альбома есть направление движения: West Side – разновидность чикагского блюза.
    Этот стиль празднует круглый юбилей. Но в альбоме он юн и задирист, как и 50 лет
    назад. В песне Мадди Уотерса он бьет копытом и подпрыгивает – классика молодеет
    под стать новому веку. Есть и обворожительно-ленивый "блюз вразвалочку" Do Unto
    Others (в вокальном дуэте с ветераном Отисом Клэем). И для тех, кто повержен в
    тоску и мир к ним не справедлив, есть в утешение медленный вселенский блюз "Trouble,
    Trouble". Сразу после него начинается скетч "Староват я, чтоб жениться, слишком
    молод умирать": слова заставят хохотать, под ритм ноги пустятся в пляс. Разыграно
    на пару с певцом-гитаристом Лонни Бруксом, чей сын был участником группы на записи
    и соавтором "Вождя" в половине новых песен. Ронни Брукс и "Вождь" разыгрывают
    великолепный акустический дуэт о путешествии блюза с южный ферм в северный Чикаго.
    И по контрасту включается увесистая визитка "They Call Me The Chief". Тут дюжина
    блюзов выстраивается в концептуальный альбом. Спектакль продолжает оттяжный блюз
    про "крошку, которая умеет прогнать блюз" и завершает пацифистская соул-колыбельная
    с хором под орган. Блестящая драматургия! Соблюден формат чикагского блюзбэнда
    (на губной гармонике играет Билли Брэнч). Присутствует в нужных моментах Один
    из самых радостных и энергичных альбомов нынешнего сезона представляет "блюз без
    претензий", диалектически сочетающий: традицию и свежесть, мастерство и беспечность,
    индивидуальность и приверженность стилю, простоту и разнообразие! Гармошка навзрыд,
    пронзительная гитара, и бухой ритм!'
