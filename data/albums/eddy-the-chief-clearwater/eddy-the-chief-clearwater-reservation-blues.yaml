- id: 1156
  author: Константин Колесниченко
  mark: 10
  date: '2007-11-08'
  text: 'Eddie "The Chief" Clearwater начинал как подражатель Чаку Берри, сейчас же он яркий представитель West-Side Blues.
    У Эдди яркий сценический образ - индейский вождь.


    На альбоме "Reservation Blues" Clearwater развивает тему своего "индейства" - некоторые песни звучат подходяще для вестерна,
    в некоторых он поет "я как вождь без скво". Но основная часть альбома - это конечно же блюз.Блюз у Эдди мастерский и красивый,
    в разнообразных аранжировках: от рок-н-роллов а ля Чак Берри, до румбы, надрывных минорных композиций и блюз-рока. С Эдди
    играют звездные и отличные музыканты, например, Duke Robbilard, родственник Carey Bell, Matt McCabe, Doug James и др.'
