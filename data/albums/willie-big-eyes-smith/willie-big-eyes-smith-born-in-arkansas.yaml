- id: 1342
  author: Андрей Евдокимов
  mark: 7
  date: '2008-10-14'
  text: 'Этому парню 72 годика, он сочинил 12 песен для своего нового альбома, который он сам и продюсировал и выпустил на
    собственном лейбле. Блюзмены не знают, что такое "пенсионный возраст". Он действительно родился в Арканзасе, но с 17 лет
    живет в Чикаго, он пропитался блюзом этого города до мозга кости и продолжает играть именно чикагский блюз: неторопливый
    и с виду неуклюжий, но с бесподобным зарядом энергии, спрятанным в вязкий неотступный ритм и короткие всхлипы гитары или
    гармоники. Почти два десятка лет Смит играл на ударных в блюзбенде Мадди Уотерса (который и дал ему прозвище "Большеглазый").
    Сейчас он вокалист и харпер. Играет и на диатонической, и на хроматической гармонике. Поет с неотразимой уверенностью
    и искренностью чикагской школы. А за ударными теперь трудится Кенни Смит, его сын. На бас-гитаре играет Bob Stroger (выступавший
    в "Доме у Дороги")'
