  date: '2003-10-20'
  text: После кончины Адды в конце прошлого года тут же вышла компиляция ее самого
    горячего периода - 40-50 годов. Причудливая судьба и изящная музыка, красивая
    женщина и милый голос, буги, классика и джаз – все смешалось в альбоме и его оформлении.
    Представительное, серьезное издание для коллекционеров.
