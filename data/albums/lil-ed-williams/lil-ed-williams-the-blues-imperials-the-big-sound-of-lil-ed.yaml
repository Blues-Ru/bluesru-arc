  text: '"Electrifying, raucous, pure Chicago blues...Lil'' Ed is a guitarist extraordinaire...slashing slide and flamboyant
    stage persona." -Chicago Tribune


    "Rough and ready blues played with unmitigated intensity...Swirling, snarling, riveting slide...The Blues Imperials pound
    out riffs and rhythms like they''re overdosing on boogie juice. Scorching and soulful, joyous and stomping." -Living Blues


    Lil'' Ed And The Blues Imperials - мастера чикагского танцевального блюза и одна из самых стабильных групп жанра. К тридцатилетию
    своего сотрудничества с лейблом Аллигатор (дебютный альбом вышел в 1986 году) Эд Уиллиамс сотоварищи выпустили свой девятый
    студийник, спродюсированный совместно самим малышом Эдом и боссом лэйбла Брюсом Иглауэром.


    Фронтмен группы - "малыш" Эд Уиллиамс заразился блюзом от своего знаменитого дяди - чикагского слайдера J.B. Hutto, и
    вот уже три десятилетия его слайд-гитара играет заводной энергичный блюз с включениями буги и рок-н-ролла. Музыка группы
    за все эти годы принципиально не изменилась, и все пластинки сделаны в одном ключе. Тут нет каких-то особых откровений,
    группа берет энергетикой, задором и создает веселое танцевальное настроение. Ассоциативно группа может считаться последователями
    знаменитого чикагского слайдера Хаунд Дог Тэйлора и его Хаусрокеров (кстати, это был первый из блюзовых артистов, с которым
    заключил контракт молодой Брюс Иглауэр).


    Музыка группы пользуется спросом и у поклонников блюза, и у критиков - они получили награду от Living Blues лучшему концертному
    исполнителю в 2011, 2012 и 2013 годах. Кроме того, в 2007 и 2009 году они получили блюзовую награду лучшей группе года.
    На очередной 38й церемонии вручения блюзовых наград, которая будет проходить 11 мая 2017 г. в Мемфисе, у Эда и группы
    есть две номинации: на премию Б.Б. Кинга лучшему артисту года и на премию лучшей блюзовой группе года.


    Из 14 песен на диске 12 новых написаны самим Эдом, а два кавера - из репертуара его знаменитого дяди, аранжированные Уиллиамсом.
    На записи квартет был усилен клавишником Сумито Ариоши, который добавил новые краски в общее звучание группы. Стилистически
    это все тот же жизнерадостный танцевальный чикагский блюз с солирующей слайд-гитарой на традиционной основе с современным
    звучанием, мастерски сыгранный музыкантами с тридцатилетним стажем совместных выступлений.'
