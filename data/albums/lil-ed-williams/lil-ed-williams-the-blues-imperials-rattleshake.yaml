- id: 1022
  author: Александр Панин
  mark: 5
  date: '2006-08-06'
  text: 'Очередной, уже шестой альбом этой чикагской команды для лейбла Alligator. Их лидер Маленький Эд – племянник известного
    блюзмена J.B.Hutto, отличный слайдовый электрогитарист и шоумен. Но студийные записи у Blues Imperials часто совсем не
    задаются. Вот и на этом диске можно выделить всего пару-тройку по-настоящему хороших вещей, а в основном тут шумный и
    мало запоминающийся, хотя и довольно энергичный блюз-рок. Общее звучание совсем мне не нравится, барабаны выведены уж
    слишком громко. Играет Эд по-прежнему здорово, но поклонникам его слайд-гитары не стоит рассчитывать на что-то экстраординарное
    и ранее не слышанное. А вот любители Мотауна, а скорее даже британского рока 60-х несомненно порадуются от новой версии
    известной песни Leaving Here, она и вправду получилась очень неплохо. Но этот трек – самый первый на диске, и после такого
    многообещающего старта нас ожидает довольно невыразительное продолжение. Где-то в середине альбома спрятана еще одна хорошая
    и весьма необычная для Blues Imperials песня – кавер вещи Tramp On The Street авторства кантри-исполнителя Billy Joe Shaver.
    Продолжая скрести по сусекам, обнаруживаем еще парочку композиций авторства самого Эда, которые вполне можно будет переслушать:
    это веселая вещица под названием Icicles In My Meatloaf и заключительный номер It''s A Beautiful World c большим влиянием
    музыки зайдеко. Вот, пожалуй, и все, драйва на диске хватает, конечно, но в общем получилось как-то пустовато. Увы.'
- id: 1293
  author: Разные авторы
  mark: null
  date: '2008-06-05'
  text: '50-летний Маленький Эд, он же Эд Виллиамс, действительно совсем невысокого роста – метр с кепкой. Зато энергии в
    этом миниатюрном негре, выбегающем на сцену в кедах и турецкой феске (может, чтобы казаться выше?) наберется на целую
    "Фабрику звезд". Подоспевший этим летом диск, по-моему, отлично передает, на что способны музыканты на публике, а если
    студийная работа по накалу и свободе равняется концертной, лучшего и желать не стоит. Rattleshake – исключительно удачный
    альбом, набитый куражными, огненными песнями. Их сплоченную "компанию" подпортил лишь банальный медляк в заключительной
    трети пластинки. Может быть, в ней кто-то обнаружит слишком сильное влияние рока. Мне-то это не кажется недостатком. Мне
    бы хотелось, чтобы Lil'' Ed побольше поиграл здесь – как в старые времена – слайдом. Ведь он превосходный слайдовый мастер,
    если помните, потомственный: его дядька Джей Би Хатто принадлежит к классикам данного способа игры на гитаре. Но и общая
    работа группы, вокал заслуживают только теплых слов. Шестой альбом на "Аллигаторе", большую часть материала сочинил Эд
    или его супружница, кое-что добавил его басист и по совместительству сводный брат.'
