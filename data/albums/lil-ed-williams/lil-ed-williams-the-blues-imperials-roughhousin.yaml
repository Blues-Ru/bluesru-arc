- id: 1074
  author: Дмитрий Казанцев
  mark: 7
  date: '2007-05-12'
  text: 'Первый альбом Эда и его группы. Живая запись в студии - квартет (2 гитары,
    бас и барабаны) и более ничего. Чикагский блюз в его веселом и раздолбайском варианте.
    Радует то, что песни разнообразные - мажор/минор, различные ритмы и темпы. Эд
    ярко поет и хулиганисто играет на гитаре - в данном случае это скорее хорошо.


    Запись очень даже ничего для 86 года. Слышен каждый звук и инструмент.'
