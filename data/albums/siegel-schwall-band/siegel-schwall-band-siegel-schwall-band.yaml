  author: Дмитрий Казанцев
  mark: 6
  date: '2005-04-02'
  text: 'Дебютный альбом этой блюз-группы из Чикаго. Все ребята белые, но очень любят
    черную музыку. Грамотно и бодро сыграно, немного озадачивают вокалы - уж слишком
    по-белому и без изюминки.


    На альбоме квартет и традиционный блюзовый материал типа Down In The Bottom, Going
    To New York, Hoochie Coochie Man + свои композиции. Corky Siegel хорошо играет
    на гармошке.'
