- id: 1296
  author: Алексей Калачев
  mark: null
  date: '2008-06-05'
  text: Ансамбли-ветераны время от времени либо радуют, либо удивляют нас разными
    по длительности всплытиями из пучины забвения. The Siegel-Schwall Band и порадовали,
    и удивила. Немного жеманности и воображения, чуть эксцентрики, положенные на строгую
    канву ритма – вот вам грубый набросок их стиля, где еврейская легкость и негритянский
    бит сходятся в продуктивном альянс. Невозможно вычеркнуть из него нарочито слабые
    голоса Джима и Марка, но и эту составляющую они сумели обратить в составляющую
    собственного стиля. Команда вполне вписывается в канон классики по разряду "первые
    белые исполнители электроблюза в США". Харпер Джим Сквол и харпер Марк "Корки"
    Сиджел в 1965 году, когда они составили фолк-дуэт, являлись двумя студентами-разгильдяями,
    которые прогуливали занятия в чикагском университете ради занятий кантри-блюзом.
    Сиджел еще и пел и играл на пианино, как раз ему пришла в голову идея расширить
    любительское предприятие до полномасштабного ансамбля по типу группы Пола Баттерфилда.
    Ансамбль в первоначальном виде просуществовал несколько лет, сменил ритм-секцию,
    записал 10 альбомов и распался в середине 70-х. Прошли годы, подул ветер перемен,
    который принес с собой семена нового интереса к блюзу. В конце 80-х бывшие студенты-прогульщики
    и их ритм-секция, состоящая из негров, вновь стали давать концерты и даже выпустили
    диск. Минуло почти 20 лет, и Сиджел Сквол Бэнд вновь заявил о себе. Альбом они
    записали вчетвером вместе с барабанщиком Сэмом Лэем и бас-гитаристом Роло Рэдфордом.
    То есть в составе 1969 года. "Флэш форвард" заметно сильнее их прошлого альбома-ривайвала
    1987 на том же "Аллигаторе".
- id: 1351
  author: Константин Колесниченко
  mark: 9
  date: '2008-10-30'
  text: 'Меломаны со стажем обычно очень скептически относятся к воссоединению групп
    после длительных перерывов в творческой деятельности. Альбом "Flash forward" -
    это как раз тот случай. Группа (названая в честь 2 ее лидеров - харпера и пианиста
    Corky Siegel и гитариста Jim Schwall) была создана в благоприятные для жанра времена
    и успела получить свой кусочек успеха в эпоху развития и становления белого блюз-рока,
    в лучшем смысле этого слова. В конце 60-х – начале 70-х этот коллектив был, в
    какой-то степени, сопоставим с блюз-бендом Пола Баттерфилда или Чарли Масселвайта.


    Но вернемся к действительности – признаюсь, я тоже с некоторой опаской начинал
    слушать альбом. Я боялся, что запись будет "моложавой", попыткой, если не переплюнуть
    себя молодых, то хотя бы максимально приблизится к прошлому успеху. Но, к счастью,
    этого всего нет на альбоме, а есть необычайная атмосфера дружбы, здоровое чувство
    юмора и какой-то задор, на удивление естественный для таких убеленных сединами
    музыкантов. Примечательно, но в коллективе нет четко выраженного лидера, все участники
    - это равноправные солисты и творцы довольно нетривиального подхода к музыке.
    Если Сэм Лэй (барабаны и гитара) – это больше чикагский блюз, то Ролло Редфорд
    (басист; он играл даже с Сан Ра) – это более джазовый и мелодичный подход к музыке,
    в свою очередь, Джим Швалл привносит оттенки кантри и блюграсс, а Корки – свое
    интересное прочтение блюза, ритм-н-блюза. При всем таком, казалось бы, разнообразии
    альбом звучит ровно и цельно, оставляя приятное послевкусие и желание повторить
    его прослушивание.'
