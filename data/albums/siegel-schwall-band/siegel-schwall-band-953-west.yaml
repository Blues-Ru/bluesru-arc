reviews:
- id: 924
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-11-28'
  text: 'Это седьмой альбом группы и их третий на фирме Wooden Nickel. На диске 10 песен, из них 8 написаны участниками группы.
    Музыка в блюзовом ключе, но ребята подмешивают кантри, соул и элементы новоорлеанского ритм-н-блюза. Нет, это не южный
    рок, это по-прежнему блюзовая группа, но с явным акцентом на интересные миксы с рутс-роком. Состав не менялся, в банде
    4 человека: Корки Сигел - вокал, клавиши, гармошка; Джим Шуолл - вокал, гитара; Роллоу Рэдфорд - бас, вокал; Шелдон Айра
    Плоткин - ударные.


    Этот диск - их предпоследняя студийная работа, очень матерая и интересная работа, но можно сказать, что местами чуть не
    хватает яркости и живости.'
