- id: 923
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-11-27'
  text: 'Это пятый альбом этой блюзовой группы из Чикаго и первый на лейбле Wooden Nickel (первые 4 были на Vanguard). Все
    7 песен на этом альбом записаны на концертах в Чикаго, но в отличие от большинства "живых" записей, этот диск прописан
    и издан просто ВЕЛИКОЛЕПНО. Слышна каждая нота и звук, слушать подобное - одно наслаждение. Корки Сигел поет, играет на
    гармошке и пианино; Джим Шуолл поет и играет на гитаре; на басу - чернокожий Роллоу Рэдфорд (он тоже подпевает), на ударных
    - Шелли Плоткин. Парни классно играют и поют, а их блюзы - это очень интересно и ПО-СВОЕМУ. Группа играет смесь Чикаго-стиля,
    кантри-блюза и ритм-н-блюза, их ритмы и риффы своеобразны и самобытны - это немаловажно в блюзе, на мой взгляд.


    Все песни написаны группой, но здесь также есть традиционная "Corrina" и "Hush, Hush" Джимми Рида. Запись - супер, игра
    тоже, настроение убойное, диск альбомный и сногсшибательно оформлен! Один из лучших альбомов группы и один из лучших из
    белого блюза/блюз-рока вообще.'
