  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: Самые интересные блюзовые события сегодня происходят в возродившемся и значительно обновившемся стиле "уэст-коаст".
    Этот диск хорош именно своей представительностью, поскольку гитарист Рэмос собрал весь современный ареопаг, всего более
    20 участников. Стиль требует виртуозной игры, модерн-джазовой осмысленности, ощущения новизны в согласии с традициями...
    И превалирующей жизнерадостности!
