- id: 132
  author: Федор Романенко
  mark: 10
  date: '2003-07-09'
  text: 'Этот диск 1995 года - первый собственный диск Кида Рамоса. В 80-х годах в течение 9-ти лет Рамос играл в группе гармониста
    James Harman, в группе которого научился очень многому. После этого Рамос создал группу вместе с гармонистом Lynwood Slim
    и двумя столпами вест-коаст блюза из исходного состава ансамбля Hollywood Fats - Richard Innes и Fred Kaplan, которые
    вместе с Larry Taylor записались практически на всех хороших пластинках западного побережья, начиная с конца 80-х. Все
    дело в том, что лучшей блюзовой ритм-секции в Америке не найти, поэтому их всегда приглашают на записи, чтобы получить
    первоклассный звук.


    В 1995 году, когда записывался альбом "Two Hands One Heart", Kid Ramos работал на два фронта - кроме своей группы одновременно
    играл с составом Fabulous Thunderbirds того времени и записал гитару для половины их альбома.


    Пластинку Рамоса 2H1H сейчас уже трудно найти, но она мне нравится, пожалуй, больше всего. На мой взгляд, Рамос записал
    ее вместе со своей лучшей группой. И у него еще очень много юношеского задора, но он уже достиг высот по части безукоризненного
    "винтажного" звука, к которому он всегда очень стремился. На альбоме записана приглашенная отличная духовая секция, и
    первая же песня в быстром темпе "I Can''t Stop It" с духовыми риффами и слегка подгруженной полуакустикой Рамоса практически
    сбивает с ног. Поет на пластинке гармонист Lynwood Slim, характерный мягкий, но настойчивый голос которого вспоминается
    по пластинкам, в частности, Junior Watson-а. Это - "голос Кида Рамоса", который я поначалу по незнанию принимал за голос
    самого Кида Рамоса ;)


    Кид Рамос раскопал все, что касается "винтажного" звука 50-х, он мастер аранжировок, в чем можно убедиться по "поставленному"
    им альбому "West Coast House Party" 2000-го года, в котором участвует два десятка известнейших музыкантов. На 2H1H Рамос
    сделал с дудками песню T-Bone Walker-a "You don''t love me" с тем самым томным звуком Уокера, но на современном безукоризненном
    уровне аранжировки, и, по странности, без виниловых щелчков, которых ожидаешь в таких записях. Две песни "Baby Look at
    You" и "I Was A Fool" являются переаранжированной классикой от B.B.King и Elmore James.


    Песня, давшая название альбому, Two Hands One Heart написана самим Рамосом и исполняется акапелло без ансамбля на акустической
    гитаре. Это - отличный инструментал в классическом кантри-блюзовом стиле, который демонстрирует умение Рамоса играть не
    только бездуховную стильную музыку. И, будучи одноименной с альбомом, она декларирует приверженность Рамоса блюзовым корням.


    На двух песнях у Рамоса есть хороший приглашенный женский вокал, что делает диск еще приятно разнообразней.


    Особый перл, раскопанный Рамосом у T-Bone Walker-а, - это не очень известная его песня Tell Me What''s The Reason. На
    альбоме она сыграна в чуть убыстренном темпе, но аранжирована просто великолепно.


    Основное достоинство пластинок Рамоса - это старое звучание, воссозданное на современном, очень качественном уровне. Он
    очень бережно относится к звуку, и каждая его пластинка записывается как постановка с привлечением большого количества
    лучших музыкантов. Все песни всегда старательно "сделаны" и, при этом, разнообразно, отчего пластинки Рамоса можно слушать,
    совершенно не утомляясь. Особое удовольствие записи Рамоса доставят гитаристам, которые готовы внимательно выслушивать
    гитарные партии, ибо Рамос на сегодня - один из самых сильных и интересных гитаристов в современном блюзе.'
