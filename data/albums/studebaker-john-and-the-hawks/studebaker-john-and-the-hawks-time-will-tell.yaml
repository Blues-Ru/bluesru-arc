  author: Леонид Аускерн
  mark: null
  date: '2002-12-17'
  text: 'Блюзмен из Чикаго Студебеккер Джон (а точнее Студебеккер Джон Гримальди)
    со своими "Ястребами" меня по-настоящему восхитил. Этот средних лет музыкант,
    гитарист, певец и исполнитель на губной гармонике, играет современный электрический
    "белый" вариант блюза.


    <p>Его альбом напоминает некую монолитную скульптуру, высеченную из одного цельного
    куска мрамора. Особого разнообразия вы здесь не найдете. На CD записано 12 композиций,
    но впечатление такое, что все время звучит одна тема - мощный, жестко пульсирующий
    блюз-рок. "Ястребы" сыграны прекрасно, никто, как говорится, борозды не портит.
    Но погоду делает безусловно сам Студебеккер Джон. Каждый звук слайд-гитары лидера
    словно обжигает сконцентрированным в нем внутренним пламенем. Студебеккер Джон
    - обладатель удивительного, очень "черного", резкого, "царапающего" голоса, от
    которого просто мороз идет по коже. А когда он не поет, то в дуэт с его же гитарой
    вступает губна гармоника. И импровизирует Джон на ней так, что зааплодировал бы
    и сам король джазовой губной гармоники Тутс Тилеманс. Словом, Студебеккер Джон
    достойно продолжает традиции Пола Баттерфилда, крупнейшего мастера "белого" блюза
    из Чикаго.


    <p>Сознательно не выделяю какие-то конкретные композиции. В таком ровном альбоме
    мне это кажется просто не нужным. Оставляю это право тем, кто приобретет "Time
    Will Tell". Думаю, таких людей будет немало.


    <p>Все вышесказанное, конечно, субъективно. Кому-то сурова простота Студебеккера
    Джона покажется однообразной. Это уже дело вкусов, о которых, понятно, спорить
    трудновато. Для меня бесспорно другое: нюху "Слепой Свиньи" можно верить, покупая
    релизы этой фирмы, ценители блюза не попадут впросак.'
