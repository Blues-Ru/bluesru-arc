  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2013-08-08'
  text: 'Третий и, увы, последний совместный студийный проект легендарного клавишника
    The Doors Рэя Манзарека и мастера слайд-гитары Роя Роджерса вышел менее чем через
    месяц после кончины Рэя и посвящен его памяти.


    Музыка определенно сохраняет дух The Doors - это первая группа, сходство с которой
    приходит на ум при прослушивании. В отличие от преимущественно блюзового предшественника
    (Translucent Blues 2011), в музыкальном плане на новом диске целый коктейль стилей,
    но ближе всего, пожалуй, будет следующая характеристика: рок с примесью джаза
    (клавиши Манзарека и саксофоны Джорджа Брукса) и блюза (гитары Роджерса). Музыку
    написали Манзарек и Роджерс, который также сочинил текст пары треков, а остальные
    тексты написаны преимущественно Джимом Кэрроллом и Майклом МакКлуре. Говорить
    о качестве исполнения, я думаю, особого смысла нет - музыканты мирового класса.


    Любители традиционного блюза вряд ли оценят альбом по достоинству, зато поклонникам
    The Doors он наверняка понравится. Покойся с миром, Рэй!


    "In our last meeting together before his passing, Ray and I were both very excited
    about the upcoming release of ‘Twisted Tales''. We signed off on the artwork and
    agreed that it should be released sooner than later. So, honoring that decision,
    I have proceeded with the release. We both were proud of this recording and hope
    that people enjoy it. This recording is dedicated to Ray''s memory"


    - Roy Rogers'
