  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: Не понять, чему тут больше удивляться? Тому, что группа собралась в оригинальном составе спустя 32 года после выпуска
    предыдущего альбома? Или тому, что с неподдельным энтузиазмом и завидной энергией они играют совершенно немодный нынче
    британский абсолютно белый и жутко тяжелый блюз-рок? И в репертуаре только два блюзовых стандарта, а 12 песен – новые,
    сочиненные специально для этого альбома. Густой звук, в котором ярко слышится акустика фортерпиано, губной гармонике или
    гитары "добро". Но доминируют, как в легендарных 60-х, развернутые гитарные "запилы" и тяжелые рифы, сыграныt в унисон
    гитарой и басом. Слушать это не рекомендуется в равной степени и тем, кто ориентируется на модные тенденции, и тем, кто
    ностальгирует по временам "гитарных героев". Это совсем не музейный вариант блюза – слишком энергично по музыке. Да и
    обращение в песнях к мистерам Бушу и Блеру – актуальны на 2005 год.
