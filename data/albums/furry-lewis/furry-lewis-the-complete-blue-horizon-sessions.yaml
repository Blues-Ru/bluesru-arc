  author: Сергей Исправников
  mark: null
  date: '2007-11-18'
  text: 'Настоящее двухдисковое издание является продолжением предыдущего релиза в
    серии выпуска архивов британской фирмы Blue Horizon – "The 1968 Memphis Country
    Blues Festival with Bukka White" (Sony BMG 82876851232, 2006). Как уже отмечалось,
    третий мемфисский кантри-блюзовый фестиваль проходил 20 июля 1968 г., а на следующий
    день была организована студийная запись сольных альбомов трех из его участников
    – Букки Уайта, Фарри Льюиса и Джо Калликотта. В студии "Ardent" г. Мемфиса 21
    июля была проведена поистине ударная сессия – за 12 часов работы было записано
    сорок треков. Включенные в данное издание записи Льюиса и Калликотта, в свое время
    были выпущены Blue Horizon в серии "Presenting The Country Blues". Данный проект,
    безусловно интересный для коллекционеров и любителей аутентичного блюза, не имел
    коммерческого успеха, и из-за проблем с дистрибъюцией его вынуждены были закрыть,
    издав в рамках него только четыре пластинки.


    Что касается представленного на первом диске Фарри Льюиса, то к моменту записи
    альбома ему могло быть от 68 до 75 лет. Несмотря на почтенный возраст в это время
    он находился на пике своей карьеры в звукозаписи: начиная с 1959 г. его диски
    выходили на таких лейблах, как Folkways, Prestige/Bluesville, Matchbox и других.
    Из тринадцати записанных 21 июля 1968 г. композиций на диск вошли одиннадцать,
    исполненных Льюисом под собственный гитарный аккомпанемент. Что касается самого
    репертуара, то большинство песен Льюис уже записывал ранее для других лейблов
    и опять перезапишет впоследствии.


    Однако на альбоме присутствуют и несколько эксклюзивных треков. В первую очередь,
    это "Waiting For A Train" белого довоенного певца и гитариста Джимми Роджерса.
    В конце 20-х гг. Рорджерс создал новый музыкальный стиль – "блю-йодль", представляющий
    собой сочетание кантри-блюза и тирольского пения, редкий пример которого и демонстрирует
    Льюис. Следующим раритетом является "Let Me Call You Sweetheart". Эта лирическая
    баллада, исполненная в ритме вальса, впервые была записана в 1911 г. ансамблем
    "Peerless Quartet" и стала в то время хитом. Фактически, обе вещи представляют
    собой еще доблюзовый репертуар черных менестрелей и трубадуров начала века. Вместе
    с этим, на диске присутствовали и две новые композиции самого Льюиса, записанные
    им впервые: это "Let''s Shake Hand In Hand" и лирический инструментал "Take Your
    Time Rag".


    На диске Льюис исполнил несколько своих вещей, впервые записанных им еще в 1927-29
    гг. Среди них необходимо отметить демонстрирующий великолепную технику слайда
    Льюиса авторский "Judge Harsh Blues" и обработки традиционных тем – "Casey Blues"
    и "John Henry". Что касается присутствующих здесь двух ранее не издававшихся треков,
    то это два разных варианта композиции "Furry''s Blues", концертное исполнение
    которой вошло в пластинку с записью самого фестиваля. Изданный в итоге на Blue
    Horizon в 1969 г. альбом Фарри Льюиса получил положительные отзывы, однако исключительно
    от профессионалов. Понимая, что больших денег он на этом не заработает, руководитель
    Blue Horizon Майк Вернон тем не менее гордился, что представил широкой публике
    возможность ознакомиться с песенным репертуаром американского Юга в аутентичном
    исполнении.


    В той же степени это относится и к альбому Джо Калликотта, записанному на втором
    диске. Несмотря на две довоенные записи, как сольную, так и дуэтом с певцом и
    гитаристом Garfield Arkers, а также сессию 1967 г., сделанную на волне возрождения
    интереса к фолк-блюзу, имя Джо Калликотта было практически неизвестно за пределами
    окрестностей Мемфиса. Когда Майк Вернон приехал к нему домой, чтобы договориться
    о выступлении, то оказался в деревне, состоящей из одноэтажных однокомнатных деревянных
    домиков, к каждому из которых примыкал клочок земли. Супруга Джо Калликотта с
    гордостью продемонстрировала гостям корову, настолько худую, что не понятно, давала
    ли она вообще молоко. Казалось, что время остановилось, не было никакой индустриальной
    революции, ни современных средств коммуникации. То же чувство охватывает и при
    прослушивании альбома, исполненного почти семидесятилетним мастером под собственный
    гитарный аккомпанемент, лишь на нескольких треках поддержанного второй гитарой
    Билла Барта – организатора Мемфисского кантри-блюзового фестиваля и лидера группы
    "The Insect Trust".


    На изданный в 1969 г. альбом вошло восемь треков, семь из которых были авторскими
    композициями. Исключение составляла дебютная "You Don''t Know My Mind" – одна
    из любимых вещей Калликотта, первоначально записанная еще в 1923 г. звездой раннего
    блюза Вирджинией Листон, выступавшей с Луи Армстронгом и Сиднеем Беше. Что касается
    песен самого Калликотта, то они написаны в традициях мемфисских уличных сонгстеров
    начала века, в первую очередь, Фрэнка Стоукса (1888 – 1955 гг.), чье влияние чувствуется
    в "Joe''s Troubled Blues" и "Hoist Your Window". Использованное в ряде треков
    фальцетное пение ассоциируется с легендой дельта-блюза 20-х гг. – певцом и гитаристом
    Томми Джонсоном, давшему этому вокальному стилю широкое распространение.


    В ряде треков присутствуют исторические реалии. Например, "War Time Blues" посвящен
    событиям первой мировой войны, в которую вступили Соединенные Штаты, когда Джо
    было шестнадцать. В нем присутствует несвойственный для блюза патриотический пафос
    сражаться за "старого доброго Дядю Сэма" и пройти "сквозь Францию, чтобы биться
    с кайзером и его бандой". Из восьми ранее не издававшихся треков Калликотта, помещенных
    в данный выпуск, с исторической точки зрения интересен "Lost My Money in Jim Kinnane''s".
    Блюз повествует об эпохе гангстеров, когда Beal-street в Мемфисе, где выступали
    многие странствующие блюзмены, была центром азартных игр, проституции, подпольного
    виски и наркотиков. Королем мемфисского дна как раз и был Jim Kinnane вместе со
    своим братом Томасом. Герой песни сетует, что "оставил все свои деньги Jim Kinnane"
    и что "здоровый черномазый всего его обобрал". Получившаяся в итоге пластинка
    имела определенный резонанс среди любителей фолк-блюза, предполагалось, что Калликотт
    снова выступит на следующем фестивале. Однако его кончина в мае 1969 г. оборвала
    эти планы. По словам Майка Вернона, "с ним ушел последний отзвук сельской музыки
    Миссисипи".'
