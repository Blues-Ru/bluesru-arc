  author: Разные авторы
  mark: null
  date: '2004-02-02'
  text: 'Это фактически сборник, составленный из двух пластинок 61 года


    Потрясающая акустическая пластинка. Льюис родился аж в 19 веке, но и 61 году звучит очень свежо. Его музыка - просто какое-то
    пульсирующее облако. Кажется, играют как минимум два гитариста. Я не музыкант и могу ошибаться в терминах :-) но насколько
    я понимаю, он играет постоянный аккомпанемент и бас на нижних струнах, а на верхних одновременно играет слайдом. И слайд
    у него какой-то необычно пронзительный, высокий, может ножом играет.


    Рекомендуется любителям Led Zeppelin III :-)


    <p align="right">Сергей Иванов'
- id: 1331
  author: Сергей Исправников
  mark: null
  date: '2008-09-27'
  text: 'На диске переиздан двойной альбом мемфисского мастера блюзовой слайд-гитары Фарри Льюиса, изданный в 1972 г. американским
    специализированным джазовым лейблом Fantasy Records. В него в полном объеме вошли два диска Льюиса – "Back on My Feet
    Again" и "Done Changed My Mind" – первоначально изданные в 1961 г. на лейбле Prestige/Bluesville. Эти пластинки продюссировал
    поэт, писатель, исследователь блюза Samuel Charters, который двумя годами ранее – в 1959 г. заново открыл Льюиса широкой
    публике, записав его дебютный LP для компании Folkways. В то время Льюис работал дворником в Мемфисе и даже не имел собственной
    гитары. Однако технику игры и исполнительские навыки он не утерял, периодически выступая "для своих". Как и на дебютной
    пластинке, здесь Льюис также записан один с гитарой без аккомпанирующей группы. Надо сказать, что и до войны Льюис предпочитал
    выступать сольно, хотя в начале века, когда он начинал, ему случалось играть в группах, включая оркестр легендарного W.C.Handy
    (автора знаменитого "St.Louis Blues", который исполнен Льюисом на первом из приведенных здесь дисков).


    Что касается самого исполнения, то в первую очередь, внимание привлекает филигранная техника игры на гитаре, сочетающая
    как сельский, так и довоенный городской подход к исполнению блюза. Дело в том, что уйдя из дому в 15-16 лет и вскоре в
    результате несчастного случая потеряв ногу, Льюис осел в Мемфисе, который был один из центров "черной" музыкальной культуры.
    Соприкасаясь со многими появлявшимися в городе блюзменами, Льюис выработал свой уникальный стиль исполнения, который в
    полной мере продемонстрирован на этих пластинках. В основном, на них содержится традиционный довоенный репертуар, включая
    не только блюзы, но и баллады, например "John Henry" (здесь записан, возможно, лучший вариант его исполнения). На диске
    Льюис переиграл ряд треков, первоначально записанных еще в 1928-29 гг., а также перезаписал большую часть пластинки 1959
    г. Собственно говоря, уже в момент записи это была блюзовая архаика, что ни коим образом не умаляет достоинств обеих пластинок
    1961 г. Сама запись проходила в студии "Sun" в Мемфисе в период апреля-мая 1961 г. Запись велась вживую без наложений,
    что позволяет непосредственно прикоснуться к магии гитары Льюиса. Действительно, при прослушивании возникает иллюзия,
    что играют два гитариста. Хотя диски и не принесли Льюису больших гонораров, однако позволили ему вернуться на профессиональную
    блюзовую сцену и время от времени выступать на различных фолк-блюзовых фестивалях.'
