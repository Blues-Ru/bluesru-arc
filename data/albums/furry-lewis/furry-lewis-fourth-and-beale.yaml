- id: 1502
  author: Сергей Исправников
  mark: 8
  date: '2009-02-14'
  text: 'На диске переиздан один из последних альбомов патриарха фолк-блюза Фарри Льюиса, записанный у него дома на углу Четвертой
    и Beale Street в Мемфисе 5 марта 1969 г. Запись организовал музыкант, продюсер, звукоинженер и просто большой любитель
    блюза Terry Manning, впоследствии работавший с массой групп и исполнителей: от "Led Zeppelin" до "ZZ Top". Он познакомился
    с Льюисом, когда они оба выступали на одном из концертов под открытом небом. Впоследствии Manning неоднократно посещал
    его выступления на фестивалях и в клубах, бывал у него дома. Несмотря на то, что Льюис в конце 60-х почитался как икона
    мемфиского блюза, он был достаточно открытым человеком и охотно шел на контакты. Собственно говоря, сама идея записи была
    частной инициативой Manning. Вооружившись портативной аппаратурой и имея за плечами восемь лет в звукозаписи, он в компании
    своего приятеля – фотографа Jerry Cunningham – нагрянул домой к Льюису. Встретившая их женщина, которую Льюис назвал своей
    женой, предложила им выпить и закусить. Сам Льюис лежал в постели, протез ноги был отстегнут. Фарри уже выпил несколько
    кварт пива и чувствовал себя превосходно. Такая авантюра, пожалуй, могла произойти только в шестидесятые, и как ни странно,
    она увенчалась успехом.


    Не вставая с постели Льюис записал программу альбома, особо не напрягаясь и сопровождая песни краткими комментариями.
    На диске сохранена домашняя атмосфера, как будто Льюис играет на дружеских посиделках, в компании для своих. Собственно
    говоря, так оно и было, по ходу дела он даже предложил Manning сыграть самому. Диск не идеален по исполнению, это спонтанная
    запись, заранее не подготовленная и не отрепетированная. В ней ярко присутствует добродушие и чувство юмора Льюса, его
    непосредственность, качества шоумена и рассказчика. Был сыгран как стандартный репертуар Льюиса, так и ряд вещей, более
    им ни разу не записанных. Помимо собственно блюза, который составлял основу его творчества, Фарри исполнил несколько традиционных
    баллад, популярных в начале 20-го века, включая "John Henry" и "Let Me Call Your Sweetheart". В отличие от других записей
    здесь Льюис проявил еще одну грань своего таланта, не часто демонстрировавшуюся широкой публике, и исполнил ряд госпелов,
    в том числе знаменитые "When The Saints Go Marchin'' Home" и "God Be With Us ‘Till We Meet Again". Получившаяся запись
    пару лет пролежала на полке, пока в конце 1971 г. не была издана на французском лейбле Barclay и называлась "Beale Street
    Blues", а в 1974 г. была переиздана под "правильным" названием "Fourth And Beale". В оригинальную пластинку входило девять
    треков, сейчас сессия издана в полном объеме с добавлением шести бонусов.'
