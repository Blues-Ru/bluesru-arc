- id: 1651
  author: Андрей Евдокимов
  mark: 7
  date: '2011-01-05'
  text: 'Ник никак не выберет, что лучше: The Nitelifes, the Lowlifes или по простяцки – соло. Чехарда на афише соответствует
    стилевой каше в голове. Обладатель престижной премии Blues Award, певец-гитарист снова заставляет и слушателя "репу чесать",
    как понять, что же это за музыка. В первой песне он вопит так, словно поклялся переплюнуть самого Литл Ричарда по части
    "напора и натиска". Потом бьет прямой наводкой по сердцам старшеклассниц, поскольку в заглавной песне он крутой лишь с
    виду, но нежный как размороженная хурма, внутри. Из плюсов: Карран не только мастер чистой скоростной игры, но и знаток
    нюансов. Гурманы саунда "джюк-боксов" с нежностью перечтут список антикварных усилителей, использованных при записи, знатоки
    истории бросятся доказывать, что Рой Браун делал (почти) то же самое более полувека назад. Ко всем отдельным плюсам есть
    один большой минус: игра в страсти понарошку никакой тонкой стилистикой не искупишь. Диск очень красочный, он оставляет
    впечатление бойни вампиров в "От заката до рассвета", только с экзальтированной Ренатой Литвиновой в главной роли – что
    значительно усиливает комический эффект.'
