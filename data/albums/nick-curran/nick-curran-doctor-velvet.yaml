  author: Федор Романенко
  mark: 10
  date: '2010-02-15'
  text: 'Ник Карран - интереснейший современный гитарист, который успешно балансирует
    на грани между бездуховным рокабили, свингом, старым черным блюзом и р-н-б. В
    свободное от блюза время он играет что-то похожее на панк в своей группе Nitelifes.
    Похоже, его совершенно не заботят возможные косые взгляды с разных сторон, когда
    он играет свою стильную мешанину. Карран - эстет в музыке, но не библиотекарь,
    он обязательно играет страстного героя для девочек, это касается старых пыльных
    р-н-би хитов.


    Его музыка чрезвычайно стильна, кажется, что он вжился в какой-то тщательно разработанный
    образ то ли рокабила, то ли блюзмена, однако, понимаешь, что подобного сочетания
    до него не существовало. Карран вполне уникален, а кой-какие его пластинки определенным
    образом войдут в современную историю как нечто новое.


    У Ника Каррана очень характерный хриплый блюзовый и рок-н-ролльный голос. Гитара
    в разных песнях звучит как отличный Фредди Кинг или Ти-Боун Уокер, где-то - Альберт
    Кинг и Отис Раш.


    Doctor Velvet, наверное, - самая интересная подборка разнообразных вещей, недаром
    она получила блюзовую премию Хэнди как пластинка года. На ней есть чудесные хиты
    - изящная Don''t Be Angry Нэппи Брауна, забористый свинговый Doctor Velvet, чистейший
    Фредди Кинг в Lonesome Whistle Blues, соул в Drivin'' Me Crazy, лиричнейшая минорная
    соул-блюзовая баллада She''s Gone...


    Пластинка - a must, от нее пахнет свежестью и новизной, а разные песни становятся
    любимыми надолго.'
