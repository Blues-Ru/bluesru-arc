- id: 723
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-06-15'
  text: 'Первый из двух альбомов Фредди на Атлантике состоит из 12 блюзов и длится
    36 минут. Очень странно составлена программа на этот раз: первые 5 треков - довольно
    монотонные и однообразные блюзы, потом слух радует "Get Out Of My Life Woman",
    за ней идет фанковый вариант "Hideaway", еще три хороших инструментала, а в конце
    опять идет пресный блюз с вокалом. Как-то странно все это слушается в итоге.


    Фредди играет с большой группой - орган, пианино, ритм-секция, духовые. Аранжировки
    типичные для ритм-н-блюза и соула на Атлантике тех лет. Кинг убедительно поет
    и еще более убедительно играет на гитаре, но на этой пластинке не хватает яркости
    и какого-то стержня, который появился на его более поздних работах. Этот диск
    слабее его второго альбома на Атлантике, но несколько классных номеров есть и
    тут, как я уже сказал.'
