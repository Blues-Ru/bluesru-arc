  author: Дмитрий Казанцев
  mark: 8
  date: '2004-02-02'
  text: 'Это второй альбом Фредди на лейбле Shelter. Два ударника во всех песнях -
    это фирменный звук трех дисков на Шелтере. Фредди шикарно поет и играет - это
    тоже фирменный момент на этих альбомах. Лион Рассел прекрасно играет на пианино
    и рулит всем процессом. Хорош тут и звук и настроения; слышно, что музыканты получали
    удовольствие от музыки и друг от друга. Сразу обращаешь внимание на множество
    новых идей в блюзе - тут и влияние соул-фанка и блюз-рок. Гитара Фредди звучит
    очень убедительно! Любителям СРВ обязательно надо слушать Кинга 72-75!


    Оценка 4 балла. Все очень хорошо, но не весь материал супер-интересен. Стоит отметить
    шикарные Big Legged Woman, Me And My Guitar, I''d Rather Be Blind, You Was Wrong,
    Ain''t No Sunshine!!!, The Sky Is Crying. Прекрасный блюз-соул-фанк-рок альбом!
    Обязан быть в каждой коллекции!'
