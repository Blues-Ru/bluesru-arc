  author: Дмитрий Казанцев
  mark: 8
  date: '2005-05-21'
  text: 'Очень хороший альбом Фредди, в оригинале он вышел на лейбле Cotillion (подразделение Atlantic). 11 блюзов на 36 минут,
    ничего лишнего. Блюзовый квартет + духовая секция - звучит очень убедительно вместе с мощным и ярким вокалом Кинга.


    На этом диске много блюзовых хитов: "Yonders Wall", "Stumble", "I Wonder Why", "Stormy Monday", "What''d I Say", "Ain''t
    Nobody''s Business", "The Things I Used To Do". Еще один классный и нужный диск Фредди Кинга.'
