- id: 440
  author: Дмитрий Казанцев
  mark: 10
  date: '2004-02-02'
  text: 'Фредди записал три альбома для лейбла Shelter, этот третий и последний. Третий и лучший из трех. Один из трех лучших
    альбомов Фредди (вместе с Burglar и Larger Than Life).


    На диске 11 прекрасных композиций. Везде играют два драммера - Чак Блэкуэлл и Джим Келтнер; Карл Рэдл на басу; Дон Престон
    на гитаре, сам Лион Рассел на пианино; Пэтрик Хендерсон на клавишах; The O''Niell Twins на подпевках. Сам Фредди поет
    и играет на гитаре с невероятной отдачей и драйвом! Великолепные соло и вокал, которому могут позавидовать любые маститые
    "отдельные" вокалисты. Музыка от блюза до фанка, все очень классно и разнообразно, интересно слушается даже Hootchie Cootchie
    Man (автор C. Long!!!).


    Оценка 5 баллов! Следующие два альбома еще сильнее, но и этот диск уже что-то невероятное. Boogie Man, Leave My Woman
    Alone, Help Me Through The Night - настоящие хиты и жемчужины! Этот альбом обязан быть в каждой приличной коллекции по
    блюзу и соулу.'
