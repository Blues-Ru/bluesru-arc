- id: 391
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-12-20'
  text: 'Довольно серьезная по объему компиляция, выпущенная фирмой Hip-O Records. На диске аж 18 треков, представляющие музыку
    Фредди с 1960 года почти до самой его смерти в 1976 году. Диск отлично звучит и классно оформлен; есть буклет с подробным
    описанием треков и историей Кинга.


    Оценка 4 балла. Довольно тяжело слушать альбом с настолько разным качеством звучания (1960 и 1975 - это большая разница
    в звуке и музыке).'
