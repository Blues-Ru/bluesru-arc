  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-02'
  text: 'В 2002 году фирма Collectables выпустила три диска под названием The Very Best Of (Vol. 1, 2, 3). Они ошибочно назвали
    Freddie именем Freddy и назвали эти диски The Very Best, хотя, на самом деле, это все вещи, которые Кинг записал для лейбла
    Federal (King Records); его самые ранние записи. Тут есть блюз, ритм-н-блюз, твист, серф и много других стилей. Все это
    очень и очень интересно.


    Стоит ли говорить, что Фредди Кинг - великолепный исполнитель современного блюза и соул-блюза, виртуоз игры на электро-гитаре
    и классный вокалист/композитор. Он умер в 1976 году в возрасте 42 лет.'
