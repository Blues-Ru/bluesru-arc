- id: 171
  author: Дмитрий Казанцев
  mark: 10
  date: '2003-08-21'
  text: 'Это предпоследний альбом Фредди. Потом он умрет. А пока он был жив, он делал великолепную музыку. Его последние несколько
    альбомов просто фантастичны. Взяв самое лучшее из блюза, соула, фанка и рока, Кинг создал музыку, которую сложно повторить
    или переоценить.


    На этом альбоме 10 прекрасных композиций. Они хороши со всех сторон: сами вещи отличные, игра и пение на высоте, аранжировки
    и продакшн прекрасны. Альбом записывался для RSO (часть Полидора), и тут много британцев, классных британцев! Продюсеры
    - Майк Вернон и Том Дауд - это уже здорово. На барабанах сам Стив Ферроне! Карл Рэдл на басу, Брайан Огер на органе, Дик
    Симс на клавишах, Эрик Клэптон на гитаре, и много других классных исполнителей.


    Тут два очень известных хита - The Same Old Blues и Let The Good Times Roll, но не они или не только они определяют настроение
    пластинки. Все 10 композиций прекрасны. Игра Фредди на гитаре - это уже больше, чем игра по блюзу, тут и интересные ноты
    и перегруженный звук. Пение Фредди - это большое мастерство человека, умеющего петь во всех жанрах.


    Надо выделить отличную версию Same Old Blues Джей Джей Кейла и заглавный трек She''s A Burglar. Поскольку остальные 8
    вещей тоже супер, оценка 5 баллов и рекомендация послушать этот альбом всем! Возможно это лучший альбом Фредди, в любом
    случае он входит в тройку лучших.'
