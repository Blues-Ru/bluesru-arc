  author: Сергей Исправников
  mark: 8
  date: '2009-03-01'
  text: 'На диске представлено ранее творчество британской блюз-роковой группы "Jellybread",
    ставшее доступным широкой публике благодаря энтузиазму Майка Вернона, продюссировавшего
    как оригинальное виниловое издание, так и настоящую серию. По аналогии с выделяемым
    т.н. "колледж-роком", материал этой группы можно назвать "университетским блюзом".
    Действительно, в рассматриваемый период времени (1969-70 гг.) все четверо участников
    "Jellybread" учились в Суссекском Университете, а основная их аудитория тоже состояла
    из студентов. Группу образовали пианист и вокалист Pete Wingfield, гитарист Paul
    Butler, басист John Best и ударник Chris Waters. Источниками вдохновения для них
    были блюз Западного побережья и соул. Оба этих направления являлись доминирующими
    в исполнявшейся "Jellybread" музыке, тем более что Вингфилд летом 1967 г. посетил
    США, воочию увидев легендарную студию "Stax" в Мемфисе, был на выступлениях Джеймса
    Брауна в нью-йоркском "Apollo" и Би Би Кинга в чикагском "Regal". Вернувшись на
    родину, он с группой товарищей решил исполнять именно такую музыку. В результате
    в 1968 г. и была образована "Jellybread", названная так по одному из хитов Booker
    T. & The MGs''- "домашней группы" фирмы Stax, изданному в 1963 г.


    Получив определенное реноме в результате живых выступлений, группа решила сделать
    демо-запись. Она была осуществлена в феврале 1969 г. в лондонской IBC Studios
    с помощью приятеля Вингфилда, работавшего там звукоинженером. Запись производилась
    подпольно, когда в студии никого не было, на бывшую в употреблении пленку. Всего
    были записаны шесть композиций, включавшие как репертуар классиков блюза – Джимми
    Роджерса, Сонни Боя Уильямсона и Рузвельт Сайкса, так и отдельные соул-композиции.
    В отличие от других британских блюз-роковых групп, здесь доминировало фортепьяно.
    Манера игры Вингфилда уже тогда отличалась разнообразием, но в целом склонялась
    к стилю Отиса Спэнна. В результате в количестве 99 копий был издан "официальный
    бутлег", который распространялся в университетских кругах и живых выступлениях
    группы. Одна из пластинок попала в офис Blue Horizon, группой заинтересовались
    и в том же году с ней был подписан контракт.


    Записанный "по горячим следам" в мае – июне 1969 г. диск "First Slice" включал
    11 композиций и был решен в более мягком ключе, по сравнению с демо-записью. Фактически
    это был мелодичный фортепьянный соул с отдельными вкраплениями джаза, блюза, буги-вуги.
    Половина треков была авторскими вещами участников группы, из которых особенно
    стоит отметить джазовый инструментал "Chairman Mao''s Boogaloo" и медленный блюз
    "No One Else", выпущенные также на дебютном сингле группы. Среди кавер-версий
    выделяются "I Pity The Fool" из репертуара Бобби Блэнда и эпическая семиминутная
    "Evening", являющаяся центральной композицией альбома. В целом, группа записала
    добротный диск в духе работ Long John Baldry, но без каких-либо музыкальных инноваций.
    Событием он не стал, зато выпущенный в начале 1970 г. второй сингл с песней протеста
    Чарльза Райта "Comment" и собственным инструменталом Вингфилда "Funky Wasp" имел
    эффект разорвавшейся бомбы. Затем было записано и выпущено еще два сингла, одна
    из композиций которых – "Old Man Hank" – даже попала в плей-лист BBC Radio One.
    Группа продолжала играть фортепьянную музыку, все больше склоняясь к чистой эстраде.
    Назвать это блюз-роком невозможно при всем желании. Руководство Polydor, к которому
    в то время перешли права на дистрибъюцию релизов Blue Horizon, это устраивало,
    и в 1971 г. на Blue Horizon выходит их второй альбом "65 Parkway", а в 1972 г.
    – третий "Back To Begin Again". Из-за контрактных ограничений эти релизы не включены
    в настоящую коллекцию. К слову сказать, они ни разу не переиздавались и мало вероятно,
    что в ближайшее время их можно будет увидеть в цифровом формате. В качестве сессионных
    музыкантов почти все члены "Jellybread" приняли участие в знаковом альбоме Би
    Би Кинга "In London" (1971 г.), в то время это стало высшей точкой их профессионального
    признания.'
