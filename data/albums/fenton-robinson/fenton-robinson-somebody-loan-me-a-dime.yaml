  date: '2009-03-24'
  text: 'Музыка Фентона Робинсона – это не классический чикагский блюз, хотя начиная
    с 1962 он переехал в этот город и стал резидентом клубов города Ветров. Робинсон
    выделяется среди гитаристов Чикаго – у него деликатная манера игры на гитаре а
    ля T-Bone Walker или B.B. King и мягкий вокал, как у певцов соул-блюза. До переезда
    на Север он играл и записывался в Тенесси, Арканзасе, Луизиане и Техасе. По прибытию
    в Чикаго местные звезды сразу оценили способности Робинсона и он стал выступать
    с такими мастерами как Джунор Веллс, Санни Бой Вильямсон, Отис Раш, колесил по
    стране с молодым белым блюзменом Чарли Масслвайтом. В 1967 году Робинсон записывает
    свой главный хит, в основном благодаря которому он навсегда останется в пантеоне
    величайший блюзовых музыкантов – медленный блюз "Somebody Loan Me A Dime".


    Fenton Robinson выпустил очень мало альбомов за свою жизнь, не все были ровными
    и интересными, но альбом 74 года "Somebody Loan Me A Dime" - это настоящая жемчужина
    в его дискографии, да и в блюзе вообще. Альбом этот записан на молодом тогда лейбле
    "Аллигатор" и представляет собой стилистический срез блюза, который играл Робинсон
    на протяжении своей карьеры. Альбом содержит два хита заглавную "Somebody Loan
    Me A Dime", а так же знаменитую "Texas Flood", в записи которой он участвовал
    еще в 1958 году. Помимо композиций, выдержанных в стилистике ритм-н-блюза с духовой
    секцией, на альбоме есть несколько вещей, исполненных в современной прифанкованной
    манере: "The Gateway", "You Don''t Know What Love Is" и "Gotta Wake Up". Следующий
    альбом для "Аллигатора" "I Hear Some Blues Downstairs" содержал уже гораздо больше
    композиций в такой стилистике, но это уже материал для следующего текста.


    Аккомпанирующий состав на альбоме – это очень актуальная группа на то время, ритм-секция
    из группы Mighty Joe Young, который и сам играет вторую гитару на альбоме, а клавишник
    Bill Heid из джазовой тусовки, он играл и с Grant Green, и с James Moody, плюс
    некоторые композиции украшены духовой секцией.


    "Somebody Loan Me A Dime" - это классика блюза от одного из самых самобытных и
    интересных музыкантов своего поколения, альбом очень наглядно, как никакой другой,
    показывает, в каком направлении двигался блюз в то время.'
