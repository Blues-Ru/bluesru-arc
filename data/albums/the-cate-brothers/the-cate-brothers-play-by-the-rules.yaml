- id: 2027
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-11-16'
  text: 'Братья Эрни (вокал, клавиши) и Эрл (гитара, вокал) Кэйт из Арканзаса прославились и как авторы песен для многих американских
    исполнителей, и как самостоятельные исполнители. В своем творчестве братья соединяли элементы блюза, рока, кантри и соул,
    выдавая в результате мелодичный софт-рок. В 1975 году братья подписали контракт с фирмой Asylum, на которой и вышел их
    дебютный альбом, а в 1976 году сингл Union Man закрепил успех, став наиболее коммерчески успешной записью группы.


    В 80-е годы братья участвовали в возрожденном составе группы Band, затем сотрудничали с Марией Малдор. В 90-е годы появились
    новые записи братьев, включая сотрудничество с Коко Монтойей. Альбом 2004 года - последняя на данный момент работа братьев
    Кэйт.


    Данный диск записан в сотрудничестве с другим блюзовым героем - Джимми Тэкери, который не только добавил свою гитару при
    записи, но и выступил в качестве продюсера (кстати, его альбом 2006 года также записан вместе с братьями Кэйт). Кроме
    братьев Кэйт и гостевого участия Джимми, на пластинке играет ритм секция из братьев (!!!) Рона и Мики Еоф, а также не
    по годам талантливый саксофонист Дэвид Ренко. Половина авторского материала, половина каверов, высокопрофессиональная
    игра всех музыкантов, хорошие аранжировки, красивые мелодии, стилистическое разнообразие - одним словом, чрезвычайно приятная
    пластинка. Бесспорно понравится любителям Eagles, Джона Хайатта (есть кавер одной из его вещей), да и любители коммерческого
    мелодичного блюза и соул найдут для себя много интересного.'
