reviews:
- id: 1107
  author: Дмитрий Казанцев
  mark: 9
  date: '2007-07-08'
  text: Новый волшебный альбом Мэйвис. Jim Keltner (drums), Ry Cooder (guitars, etc.),
    Joachim Cooder (percussion), Mike Elizondo (bass, keys) + трое подпевают - вот
    такой малый состав на этом диске. Госпел, соул и блюз высшего класса. Голос 67-летней
    Мэйвис по-прежнему сильный и лучший в мире в этом жанре. Стоит ли говорить, что
    Келтнер и Кудер творят чудеса (они и не умеют по-другому).
- id: 1133
  author: Константин Колесниченко
  mark: 10
  date: '2007-09-19'
  text: 'У меня есть "Spirituals & Gospel: Dedicated to Mahalia Jackson" - этот альбом
    Mavis мне показался скучноватым, нет, там все исполнено на высочайшем уровне,
    песни красивы, но не хватает разнообразия. Последний альбом Mavis Staples "We''ll
    Never Turn Back" гениальный. После таких альбомов начинаешь верить в то, что старая
    музыка живет в 21 веке,цветет и пахнет. Слушая его, просто невозможно не пропитаться
    величием этой музыки, ее какой-то грузностью, масштабом, Верой. Этому способствует,
    в первую очередь, вокал Mavis,во вторую, отличнейшие музыканты - Ry Cooder, его
    сын Joachim, Jim Keltner, Mike Elizondo, отличный хор the Freedom Singers, а в
    третью, сами песни. Также важным элементом является оформление альбома, его обложка
    - все в точку! Рекомендую к прослышиванию этот альбом всем, даже тем, кто не имеет
    представления, что это за музыка.'
- id: 1484
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: 'Когда девушка из 60-х начинает петь "Down In Mississippi", джентльмены снимают
    шляпы и слушают в почтении... Мисс Мэвис вышла из подполья и сделала второй сольный
    диск совсем не таким, как первый. Если вы хотите ностальгический диск – берите
    предыдущий (Newsweek писал о нем). Сейчас она записала другой альбом: жесткий,
    резкий и сердитый. Барабаны звучат как жестянки. Гитара не играет, а скрипит.
    Бас бубнит что-то свое. Для любителя миссиссипского блюза не нужно других рекомендаций.
    Мэвис Стаплз свой голос - шикарный, глубокий и красивый - выдает поверх деревенского
    грубого ансамбля, достигая того, что в блюзе дороже всего: полной искренности
    и самоотдачи. Старина Рай Кудер делает все мастерски: от протяжного слайда до
    простого ту-стэпа.'
