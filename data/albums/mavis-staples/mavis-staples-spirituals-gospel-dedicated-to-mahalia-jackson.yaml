  author: Алексей Калачев
  mark: 10
  date: '2003-05-29'
  text: Абсолютная классика. Возможно, Махэлия Джексон – самая великая американская
    негритянская певица. Нет в Америке второй половины 20-го века ни одной чернокожей
    вокалистки, которая бы не училась у великой Махэлии, не испытала ее влияния, "не
    хотела бы быть, как она". Под этим могла бы подписаться любая чернокожая звезда,
    начиная с Этты Джеймс и Ареты Френклин и заканчивая нынешними девчачьими вокальными
    группами.
