reviews:
- id: 953
  author: Дмитрий Казанцев
  mark: 10
  date: '2006-01-09'
  text: Гениальный голос, великолепная музыка - соул/блюз/фанк/госпел. Никто из дам не может петь так ярко и мощно, как это
    (до сих пор) делает Мэйвис. Этот альбом ничуть не хуже, чем классические соул/госпел-альбомы группы The Staple Singers.
- id: 1483
  author: Андрей Евдокимов
  mark: 9
  date: '2009-02-05'
  text: 'Первым же треком определяется смесь акустического слайд-блюза из Дельты, ритм- гитары и органа "Хэммонд Би-3", составлявших
    захватывающий звук соул-музыки Мемфиса и традиционного хора госпел. Есть даже скрипка в стиле кантри. Нет обычной для
    госпел экзальтации. Напротив, свой роскошный хрипловатый голос Стаплз использует полушепотом. Саунд наполненный и густой,
    но музыка звучит сдержанно, словно чуть приглушенно. И это создает удивительную атмосферу интимности. Возвышенные слова
    на бумаге читались бы банально: "Все, чем владею - временно. Нужна только любовь". Или курьезно: "Бог не спит. Он всегда
    за работой". Но в голосе столько искренности, что всякая критика - беспомощно отступает. Это не может не покорить - если
    есть хоть немного веры. Одна из самых радостных песен в альбоме - посвящение своему отцу Попсу Стаплзу, в группе которого
    Мэвис начала петь госпел и песни политического протеста на заре 60-х.'
