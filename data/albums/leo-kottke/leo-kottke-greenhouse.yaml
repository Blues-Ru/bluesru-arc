  date: '2005-06-21'
  text: 'Альбом начинается с инструментала, который Лео исполняет на электро-гитаре
    - это первая "новость". Вторая идет сразу в следующем треке - Коттке отлично поет
    под акустическую гитару. И это не единственный вокальный номер на диске - их тут
    4.


    Лео продолжает смешивать фолк, блюз и кантри; делает это он очень красиво и виртуозно.
    Замечательно еще и то, что его альбомы разные - он развивался, пытался быть интересным
    и эклектичным.'
