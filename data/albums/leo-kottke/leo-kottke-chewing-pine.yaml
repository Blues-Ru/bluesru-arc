- id: 586
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-15'
  text: 'Очень хорошие песни и темы на этом альбоме, яркие и интересные. Лео великолепен
    на гитарах и здорово поет в нескольких треках. Пианист Билл Барбер творит чудеса,
    ритм-секция прекрасна и постоянно создает новые ритмы и грувы. Забавная версия
    песни Power Failure (Procol Harum) и Wheels (Buddy Holly).


    Этот альбом отличается от предыдущего Ice Water и он "сильнее" его. Отличный фолк,
    кантри и фолк-блюз в исполнении виртуозов.'
