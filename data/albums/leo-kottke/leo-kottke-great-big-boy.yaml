  date: '2005-12-30'
  text: На этом альбоме Лео поет и играет с довольно большой группой музыкантов. Его
    низкий, обаятельный, странноватый голос действует завораживающе. Некоторые песни
    похожи на номера Джей Джей Кейла, и это очень хорошо. Музыка в духе фолк-рока,
    с кантри и блюзовым влиянием. Один из лучших альбомов Коттке, безусловно!
