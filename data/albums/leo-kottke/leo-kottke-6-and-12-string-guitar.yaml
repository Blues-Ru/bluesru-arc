  author: Дмитрий Казанцев
  mark: 8
  date: '2005-06-21'
  text: 'Волшебная игра на разных гитароподобных инструментах с разными настройками
    и тональностями. На диске 14 инструментальных композиций - смесь фолка, блюза,
    кантри и классики (12 песен написаны Лео, а 2 - композиции Баха). Виртуозно, красиво,
    но очень одиноко.


    Это дебютный альбом этого необычного музыканта.'
