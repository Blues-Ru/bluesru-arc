reviews:
- id: 585
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-04-15'
  text: 'Лео Коттке - гитарист-виртуоз. Он играет на шести- и 12-струнных гитарах. Играет пальцами и слайдом в разных строях
    - очень интересный и богатый звук. Лео исполняет фолк, фолк-блюз, кантри и свои собственные композиции (кто-то даже относит
    его музыку к нью-эйджу). На этом же диске Коттке еще и поет - 6 песен из 10. Нельзя сказать, что у него очень интересный,
    сильный или красивый вокал, но он не раздражает. Вместе с Лео тут играют барабанщик Bill Berg, басист Bill Peterson, пианист
    Bill Barber и добро-стил-гитарист Cal Hand.


    Для тех, кто любит фолк, кантри, блюз, акустику и слайд - это необходимый альбом. Для любителей поп-музыки и рока тут
    нет ничего интересного.'
