reviews:
- id: 1042
  author: Александр Панин
  mark: 8
  date: '2006-10-30'
  text: 'Последний альбом замечательного гитариста для лейбла Chrysalis получился довольно коротким: на нем 11 треков всего
    на 32 минуты. Коттке играет с ритм-секцией и интересными гостями (Альберт Ли и Эммилу Харрис), сам поет на большинстве
    треков. На диске немало кантри-музыки, а также фолк, фолк-рок и блюз. Акустика и слайд великолепны! Лучшие вещи, пожалуй,
    все же инструментальные, поскольку вокал Лео нельзя назвать выдающимся, хотя в нем есть свое очарование. Ряд треков, на
    мой взгляд, подпорчен слишком громкими барабанами, но других признаков того времени на записи, к счастью, не наблюдается.
    Неплохой альбом.'
