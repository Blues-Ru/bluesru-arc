- id: 905
  author: Дмитрий Казанцев
  mark: 6
  date: '2005-11-27'
  text: 'Этот сборник вышел в 1997 году на лейбле Джона Фэйхи Revenant. Док Боггс - белый человек, которые поет и играет на
    банджо. Дело в том, что он использует технику блюзовой гитары при игре на банджо, а также исполняет много блюзов; все
    это делает его одновременно блюзменом, фолкером и ранним хиллбилли (здесь записи конца 20-х годов 20 века!)


    Минимальная игра на банджо, но очень хорошо у него с ритмом, что радует. Голос очень похож на то, как пели черные; к сожалению,
    иногда он не очень "строит". Довольно монотонная музыка, надо сказать, скорее для изучения, чем для получения удовольствия.
    Записи очень даже неплохие для конца 20-х.'
