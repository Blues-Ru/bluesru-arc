  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-09-09'
  text: 'Альбом Katrina Was Her Name явился результатом личных переживаний блюзового ветерана, студия которого была уничтожена
    ураганом Катрина в 2005 году. Диск был записан в конце 2006 года, выпущен в 2007, а на следующий год был номинирован как
    лучший альбом современного блюза за 2008 год. Правда, из-за проблем со здоровьем Брайан не смог присутствовать на церемонии
    вручения наград.


    В создании данной работы незрячему блюзмену из Нового Орлеана помогали настоящие гранды блюза: Дюк Робиллард (продюсирование
    диска и акустическая гитара на паре треков), маэстро блюзового Хаммонда Брюс Кац, а также духовая секция из Дуга Джеймса
    и Гордона Бидла. И хотя авторского материала только треть, каверы Уилли Диксона, Кима Уилсона, Дока Помуса, Лютера Аллисона,
    Джимми Уизерспуна и других звучат довольно интересно, а сам диск сделан в лучших традициях Брайана Ли: это современный
    качественный гитарный блюз и блюз-рок с примесью фанка, украшенный духовыми.'
