  text: '"Whether he''s wailing a Freddy King inspired blues ballad, stomping out low down and dirty blues, or getting down
    with a super funky New Orleans groove, Bryan Lee is gonna grab your soul and squeeze it till you scream in blues ecstasy."
    - Duke Robillard


    Брайан Ли потерял зрение в возрасте 8 лет, но это не помешало ему стать настоящим музыкантом. Как это характерно для многих
    незрячих, у Брайана обостренный слух, что делает его мастером игры в ансамбле. Он вырос на записях мэтров техасского блюза,
    а к 15 годам уже играл на гитаре в различных составах. В 1981 году на летнем фестивале в Милуоки группа Ли уже выступала
    на разогреве у самого Мадди Уотерса. Впоследствии Брайан начал довольно успешную сольную карьеру, заслужив прозвище braille
    blues daddy.


    Альбом Six String Therapy - седьмой студийник в каталоге музыканта и был записан с 28 по 31 января 2002 года. В создании
    данной работы незрячему блюзмену из Нового Орлеана помогали настоящие гранды блюза: Дюк Робиллард (продюсирование диска
    и ритм-гитара), маэстро блюзового Хаммонда Брюс Кац, а также духовая секция из Дуга Джеймса и Секса Гордона. Авторского
    материала немного (уже одна 10-минутная заглавная песня многого стоит!), при этом каверы хитов 50-х - 60-х звучат довольно
    интересно, а сам диск сделан в лучших традициях Брайана Ли: это украшенный духовыми современный качественный гитарный
    блюз и блюз-рок с примесью фанка, джамп-блюза и соул.'
