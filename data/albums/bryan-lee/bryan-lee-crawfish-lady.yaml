  date: '2011-05-19'
  text: 'Брайан Ли потерял зрение в возрасте 8 лет, но это не помешало ему стать настоящим
    музыкантом. Он вырос на записях мэтров техасского блюза, а к 15 годам уже играл
    на гитаре в различных составах. Чуть позже он подружился с другой будущей блюзовой
    легендой - Лютером Аллисоном, с которым они часто играли в одних и тех же клубах
    Висконсина. В 1981 году на летнем фестивале в Милуоки группа Ли уже выступала
    на разогреве у самого Мадди Уотерса.


    В 1982 году Брайан перебрался в Новый Орлеан, где во время одного из его концертов
    к группе присоединился 13-летний Кенни Уэйн Шеперд. По итогам того памятного вечера
    Шеперд осознал, что играть блюз и блюз-рок - это как раз то, что он хочет делать
    до конца своей жизни.


    Альбом 2000 года - седьмой сольник Брайана на лейбле Justin Time. На нем представлен
    преимущественно авторский материал, записанный с гостевым привлечением духовой
    секции. Стилистически это коктейль из блюза и блюз-рока с примесью фанка и долей
    соул, профессионально исполненный и качественно записанный. Возможно, не все треки
    одинаково хороши, но уж неспешные блюзы с мощными духовыми (например, Louisiana
    Woman или What You Gonna Do) наверняка придутся по душе любителям современного
    блюза и блюз-рока.


    "Bryan, my friend, don''t stop what you''re doing, because one day you''re going
    to be a living legend." - Muddy Waters


    "Whether he''s wailing a Freddy King inspired blues ballad, stomping out low down
    and dirty blues, or getting down with a super funky New Orleans groove, Bryan
    Lee is gonna grab your soul and squeeze it till you scream in blues ecstasy."
    - Duke Robillard'
