  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-01'
  text: 'В феврале и мае 1986 года знаменитый блюзовый гитарист, композитор, певец
    и пианист из Нового Орлеана Эрл Кинг (настоящее имя Эрл Силас Джонсон IV) совместно
    с Roomful of Blues записал альбом Glazed, который стал для него очередной вехой
    в музыкальной карьере - это был своего рода альбом-возвращение после почти 10
    лет отсутствия новых записей блюзмена. Эрл Кинг оказал значительное влияние на
    других музыкантов своего и последующих поколений - его песни исполняли Фатс Домино,
    Джими Хэндрикс, Стиви Рэй, Доктор Джон и другие музыканты.


    Эрл Кинг играет на гитаре и поет, а также играет на фортепиано на двух треках.
    Его поддерживает на гитаре Ронни Эрл, который в то время был штатным гитаристом
    Румфулов. Рон Леви отвечает за фортепиано и орган. Аранжировки духовых выполнил
    саксофонист Roomful of Blues Грег Пикколо. За исключением последнего трека, весь
    материал написан Кингом (лично или в соавторстве).


    Диск качественного традиционного блюза с примесью джамп-блюза и свинга, исполненный
    высочайшими профессионалами своего дела. До шедевра недотягивает, но вполне прилично.


    Издание 2009 года дополнено неиздававшимся до этого бонус треком Don''t leave
    me here to cry с вокалом Кертиса Салгадо.'
