  author: Дмитрий Казанцев
  mark: 10
  date: '2005-08-24'
  text: 'Шедевральный музыкальный сплав блюза, соула, фанка и новоорлеанского ритм-н-блюза.
    В записи принимали участие лучшие люди Нью-Орлеана: Earl King - vocals/guitars/piano;
    Snooks Eaglin - guitar; David Torkanowsky - keys; George Porter (from The Meters!)
    - bass/vocals, Mark "Kaz" Kazanoff - saxes/flute. 12 отличных композиций, одна
    лучше другой; прекрасный звук и сведение для 1993 года. Респект фирме Black Top!


    Еще давно я слышал (или читал) историю, что Эрл Кинг не стал НАСТОЯЩЕЙ звездой
    (рок-н-ролла, ритм-н-блюза и т.д.) лишь потому, что очень скромен и стеснителен.
    В это можно поверить, ибо его ПЕНИЕ и ИГРА НА ГИТАРЕ - это очень и очень классно.
    Я уж не говорю про то, что он пишет прекрасные песни - на этом диске они все его
    авторства.'
