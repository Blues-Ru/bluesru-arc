- id: 1462
  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: 'Скрипичные "переливы" на фоне стандартных гитарных "переборов" пугают только
    в первых тактах. За интродукцией начинается блюз подлинный и глубокий. И неожиданный.
    Вассар Клементс прожил долгую жизнь. Из своих 77 лет он был профессиональным музыкантом
    шесть десятков. Записав под собственным именем всего несколько альбомов, он пользовался
    непререкаемым авторитетом в сообществе любителей кантри-музыки. И вдруг за год
    до смерти он собрал в студии мастеров блюза: черных (Боб Кокрэн) и белых (Рой
    Роджерс), молодых (Дейв Мэтью) и патриархов (Элвин Бишоп), общепризнанных (Чарли
    Масселвайт) и тех, кто своим путем идет (Боб Брозман). Поющих и играющих девушек
    не забыл (Мария Малдаур). Пеструю компанию построил по своему разумению. Он записал
    потрясающий альбом, поставив высшую планку в блюзе 2005 года. Стандарты и сюрпризы,
    сладкий блюз и жесткая деревенщина - чередуются с легкостью невыносимости бытия.
    Веселье на грани отчаяния, и тоска под шутки-прибаутки – как и должно в настоящем
    блюзе. Вы слышали "Green Onions" в акустике?.. Оказывается, он "Жил с блюзом"
    (а с виду – типичный red-neck). Признался в этом, уходя. Его не стало в августе,
    в том месяце, когда альбом вышел в свет.'
