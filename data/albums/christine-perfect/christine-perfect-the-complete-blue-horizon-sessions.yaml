  author: Сергей Исправников
  mark: null
  date: '2008-03-30'
  text: 'На сборнике представлены сольные записи Кристины Перфект на лейбле Blue Horizon,
    сделанные во второй половине 1969 г. Талантливая певица и пианистка, Кристина
    входила в первоначальный состав легенды британского блюза – группы "Chicken Shack",
    где она, наряду с гитаристом Стэном Уэббом, была полноправным автором исполнявшегося
    материала. В начале 1969 г. после свадьбы с басистом "Fleetwood Mac" – Джоном
    МакВи она заявила о выходе из группы, чтобы больше внимания уделять своему мужу,
    а не бесконечным гастролям. Однако контракт Кристины с Blue Horizon все еще действовал,
    и Майк Вернон решил продолжить ее записывать, теперь уже как сольную исполнительницу.
    Весна и начало лета прошли в переговорах с менеджером певицы по поводу репертуара
    и поиска аккомпанирующего состава. В конечном итоге, в августе 1969г. Кристина
    пересекала порог студии CBS в Лондоне, чтобы начать работу над своим первым сольным
    диском, которая была завершена только в декабре того же года.


    На альбоме играли два гитариста – Top Topham и Rick Hayward. Топхэм был одним
    из пионеров британского ритм-энд-блюза, в начале 60-х гг. входил в первый состав
    "Yardbirds", где его заменил Эрик Клэптон. Hayward играл в собственной группе
    "Accent" из Брэдфорда, сингл которой Майк Вернон ранее записал на фирме Decca.
    Впоследствии Hayward долго сотрудничал в Верноном как сессионный гитарист. Басистов
    на записи оказалось целых трое, причем основным был Martin Dunsford, известный
    сессионной работой с такими звездами соул, как Fontella Bass и Len Barry. Также
    по одному треку сыграли Энди Сильвестер из "Chicken Shack" и Джон МакВи из "Fleetwood
    Mac". За ударной установкой сидел Chris Harding, взятый на запись по результатам
    прослушивания. Кроме того, на нескольких треках присутствовали духовая и струнная
    секции.


    Появившийся в 1970 г. альбом "Christine Perfect" (Blue Horizon 7-63860), содержал
    12 композиций, пять из которых написала Кристина. Остальные были взяты из репертуара
    таких звезд соул-музыки, как Bobby Bland ("I''m Too Far Gone", "I''m On My Way"),
    Chuck Jackson ("And That''s Saying A Lot"), Etta James ("I''d Rather Go Blind").
    Последняя вещь опущена в настоящем издании, т.к. была записана еще в феврале 1969
    г. с "Chicken Shack" и вошла в трехдисковый бокс записей группы на Blue Horizon
    (Sony BMG 82876734942, 2005г.). Кроме того, на диск вошла сильно измененная "Crazy
    ‘Bout You Baby" Литтл Уолтера, трактовка которой была значительно ближе к исполнению
    Айка и Тины Тернер, чем самого автора. Также присутствуют решенная в фанковом
    ключе "I Want You", взятая с дебютного альбома техасского кантри-рокера Tony Joe
    White, и пасторальная "When You Say", написанная новым гитаристом "Fleetwood Mac"
    Дэнни Кирвэном, в которой он сам и сыграл.


    Альбом производит приятное впечатление. В основном, это лирические баллады, исполненные
    с большой душевной теплотой и очень по-женски, в лучшем смысле этого слова – без
    надрыва, рыданий и истерик. К блюзу диск никакого отношения не имеет, это именно
    соул, в британском его варианте. Когда альбом появился на полках магазинов, реакция
    на него была неоднозначной, а результаты продаж и ротация в чартах вызывали разочарование.
    Тем не менее, как в 1969 г., так и в 1970 г. Кристина Перфект авторитетным журналом
    "Melody Maker" по результатам опроса читателей была признана лучшей певицей года.
    В конечном итоге, во второй половине 1970 г. Кристина закончила свои отношения
    с Blue Horizon и официально вошла в состав "Fleetwood Mac".


    В заключение необходимо кратко охарактеризовать бонус-треки. Это более короткий
    по сравнению с альбомным вариант "I''m Too Far Gone", изданный на первой стороне
    второго сингла Кристины в начале 1970 г., а также ранее не издававшаяся авторская
    "Tell Me You Need Me", обозначившая ее дальнейшее движение к исполнению поп-роковых
    баллад в составе "Fleetwood Mac". Отдельного упоминания достойны также три трека,
    записанные 24 ноября 1969 г. на BBC. Это буги-блюз "Hey Baby" с третьего сингла
    "Chicken Shack" 1968 г. и две новые лирические композиции Кристины с великолепными
    гитарными партиями Топхэма и Hayward.'
