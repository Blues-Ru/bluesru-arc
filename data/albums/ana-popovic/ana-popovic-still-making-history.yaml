  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-09-15'
  text: 'Третий студийный (а если принимать во внимание концертник 2005 года, то всего
    четвертый) альбом собравшей к моменту его выпуска целый ряд престижных блюзовых
    номинаций и наград Аны еще более разнообразен в музыкальном плане, чем ее предыдущие
    работы: блюза все меньше (хотя он, пожалуй, является единственным, что связывает
    вместе эти стилистически разные песни), зато более выражен стал джаз, добавилось
    даже регги. Качество исполнения повысилось, но одновременно музыка стала чуть
    более коммерческой, разноплановой и удаленной от блюза.


    Тут можно провести аналогии и с Кенни Уэйном Шепердом, и с Джонни Лэнгом: они
    отталкивались от блюза, но постепенно скатились в высококачественный профессиональный
    американский мейнстрим. Чтобы не пойти по их стопам, Ане, возможно, стоит подумать
    и посвятить весь альбом одному/двум стилям, и не распыляться. Если талант позволяет,
    а душа просит разнообразия, можно записать несколько альбомов, каждый из которых
    будет посвящен преимущественно одному стилю.


    Тем не менее некоторая коммерциализация принесла свои плоды - диск поднялся до
    3 места в топе блюзовых альбомов Биллборда.'
