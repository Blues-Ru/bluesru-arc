  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2013-08-12'
  text: 'Ана прочно осела в Америке - в Мемфисе, штат Теннесси - и определенно нацелилась
    на покорение американского рынка. Очередной сольный альбом был записан за несколько
    сессий в течение 2012 года и января 2013 года в Мемфисе и Нэшвилле. На диске три
    кавера, остальное авторский материал. В записи помогала профессиональная команда
    высококлассных музыкантов, а из приглашенных звезд отметились Лаки Петерсон и
    Тони Симс.


    Что имеем в результате? Очень по-американски коммерчески звучащий диск, где много
    фанка с мощными духовыми, много соул, блюз тоже имеется, но не преобладает. Музыканты
    играют отлично, звук отменный, Ана тоже на высоте, но как-то за душу не цепляет
    - уж больно сладковато (какой-то местами прямо блюз-поп в отличие от блюз-рока).
    Но для американского рынка, на который и ориентирован альбом, видимо, это как
    раз то, что надо - и в итоге третье место среди блюзовых альбомов Билборда. Но
    искренности и сырости настоящего блюза, увы, почти не осталось.'
