- id: 1997
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-09-15'
  text: 'Дебютный альбом гитаристки из бывшей Югославии Аны Попович был записан на
    Ruf records с помощью знаменитого продюсера Джима Гейнса, причем часть альбома
    была записана в Мемфисе, остальные треки - в Голландии (там Ана училась в консерватории
    по классу джазовой гитары). Альбом на удивление приличный, в особенности с учетом
    техники игры (включая слайд-гитару), вокала и аранжировок. Половина альбома -
    авторская, половина - каверы. Стилистически диск разноообразен - тут и блюз-рок,
    и фанк, и джаз, и соул. Хорош блюзовый дуэт (и гитарный, и вокальный) с Бернардом
    Аллисоном на треке Bring Your Fine Self Home. Ряд треков украшены мощным подключением
    духовой секции. Некоторая доля коммерции (в хорошем смысле) на отдельных треках
    делает музыку более доступной, не портя ее при этом. Пожалуй, именно в силу стилистического
    разнообразия это лучший альбом Аны, хотя и остальные вполне на уровне.


    В США и Франции альбом был номинирован в категории "лучший альбом года" и попал
    в 25 лучших альбомов в радио-чартах журнала Living Blues в мае 2001.'
