reviews:
- id: 1998
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-09-15'
  text: 'Ана Попович освоила гитару еще тинейджером, и в 1995 году уже собрала свою первую группу. Второй альбом от талантливой
    гитаристки из бывшей Югославии содержит в себе различный стилистически материал: и блюз-рок, и рок, и соул, и джаз, и
    фанк. По-видимому, молодому дарованию интересно попробовать себя в разной музыке. Тем не менее основа ее творчества все-таки
    блюзовая, хотя она и училась джазовой гитаре в консерватории в Голландии. Из новых блюзовых и околоблюзовых открытий 21
    века Ана, бесспорно, одно из самых ярких.


    По итогам выхода данного альбома Ана получила престижную блюзовую премию WC Handy Award в номинации "лучший новый исполнитель"
    - причем оказалась первой из европейских артистов, который номинировался в данной категории.'
