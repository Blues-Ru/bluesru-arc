  author: Олег Пчелкин (oleg_spb)
  mark: 9
  date: '2015-07-22'
  text: 'Кто там говорит, что нельзя войти в одну и ту же воду дважды ?. Певица и альт -саксофонистка Клаудиа Караван вошла
    в "Li''l Ronnie and the Blue Beats" в 1990 году на восьмом году его деятельности, заменив там ушедшего Робина Стенли.
    Порекомендовал ее барабанщик группы Стюарт Граймс, который слышал, как она поет джаз в Ричмонде. К марту 1992 они записали
    восемь песен и все еще держали пальцы скрещенными, мечтая подписать контракт на запись с некой солидной фирмой. Клаудиа
    сообщала местному фрилансеру в интервью по телефону, что они финишируют с проектом pretty soon "довольно скоро". Но, как
    известно, человек предполагает, а Господь располагает, фирма от их услуг неожиданно отказалась и музыканты, разочарованные,
    "довольно скоро" разошлись в разные стороны. Блюз-ориентированный секстет The Blue Beats был известным и довольно успешным
    концертным коллективом у себя в Вирджинии в 1980х, уже имел один альбом, сильно рассчитывал на второй, но почил безвременно
    от этого расстройства.


    По меркам бесконечности, этот "Бизнес" проект и в самом деле финишировал "довольно скоро", через 23 года, 15 апреля 2014
    . Клаудиа Караван успела стать матерью, общественницей, популярным модератором, педагогом-новатором, модным оратором и
    проповедником позитивных свершений. Ну и музыкантом осталась тоже, записав 3 сольных альбома на независимых фирмах и сменив
    саксофон на рояль. Ее нынешние жизнеутверждающие песни можно найти в Ютубе. Хотя то, что она записала в 32 - лучше того,
    что она поет в 56, на мой взгляд, конечно субъективный.


    Что сподвигло столь давно расставшихся музыкантов взяться за старое, записать еще шесть песен и завершить альбом - толком
    никто из действующих лиц объяснить не сумел. Но столь необычным образом появившийся альбом стали крутить блюзовые радиостанции
    США и он начал получать неплохую прессу. "Жизнь полна сюрпризов" - резюмировала очень позитивная Клавдия.


    Спасибо большое фирме EllerSoul, чудо, что он увидел свет вообще, альбом получился, как коллеция соул, фанка, блюзов и
    баллад 1920-1930х, демонстрирующие пусть не сногсшибательный, но яркий и задушевный вокал Клаудии и маловыразительное
    пение лидера группы, харписта Ронни Оуэнса, он же и есть Li''l Ronnie. Лидер оказался адекватным и спел мало, всего две
    песни из четырнадцати. Метко названный "Unfinished Business" (Незаконченное дело) альбом состоит из 12 оригиналов и двух
    каверов (Луис Прима и Рэй Чарльз).


    "Too Fast For Conditions" (Рано ставить условия) -отличный танцевальный номер, из тех мелодий, которые нравятся сразу,
    рваный ритм, впечатляющие соло гитары (Jim Wark), гармоники (Ronnie Owens) и фортепиано (Eric Holt ).


    "I Feel A Heartache Coming On""(Иду и душа болит)" демонстрирует проникновенный вокал певицы, бэк-вокалисток (Almeta Ingram-Miller
    и Cheryl Beaver , обе из The Ingram Gospel Singers) и дает пример того, что следует понимать под настоящей блюз-балладой
    .


    В заглавной песне Unfinished Business Ронни хорош на гармонике и неплохо смотрится в дуэте с Клаудией. Эта песня из тех,
    что были записаны уже в 2014, надо дать вокалисту скидку на солидный возраст и слабое здоровье.


    ""Thick & Thin" (Толстый и тонкий)- в музыкальном плане может быть даже лучший трек в быстром темпе . Очень хороши тенор-саксофон
    (Roger Carroll), бас (Mike Moore -acoustic & electric bass), барабанщик (Stu Grimes) и соло клавишных (Eric Holt )


    ""That''s What A Girl Wants To Hear"(Это то, что девушка хочет услышать)- еще одна медленная приблюзованная баллада с
    акцентом на фортепиано и духовые, вокал Клаудии почти классический для этого стиля, она вообще серьезный мастер насчет
    замешать джаз, блюз, госпел и балладу.


    Финальное буги "I Had A Warden For A Woman" (Я был женским надзирателем) где-то в конце сваливается совершенно в "Got
    My Mojo Workin''", но Ронни все же хорош на гармошке, да и поет очень мило, почти по -домашнему.


    "Bring Your Fine Self Home" " (Вернись домой с повинной головой) - голос Клаудии, теплый и убедительный, вещает в стиле
    госпел:"Не нужно, мне теперь подарков, потому что ты уже ушел. Не нужно мне сладких льстивых речей по телефону, я -не
    ребенок, . Я не хочу новый автомобиль с хромированным блеском, но дружок, вернись домой с повинной головой. "


    "Stop Cheatin'' Me Blind" - стандартный рок-н-ролл, служит скорее заполнением места, ни на что особенно не претендует,
    но для танцпола - чуть не главная запись на альбоме.'
