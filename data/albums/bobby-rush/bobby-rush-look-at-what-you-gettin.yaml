  author: Андрей Евдокимов
  mark: 7
  date: '2008-11-22'
  text: Прошлогодний альбом принес ему Blues Award за акустический традиционный блюз. От прошлогоднего в нынешнем – только
    песня I Got Three Problems. Но не под гитару соло, а с хорошим ансамблем, с дудками и в обычном для Бобби стиле фанк.
    Густое басовитое звучание ближе к соул начала 70-х, с лаконичной бас-гитарой, небуйными барабанами и сочными подпевками.
    Альбом для тех, кому надоела назойливая лидер-гитара. Тут она скромненько на вторых ролях. Но и губная гармоника не досаждает.
    Все внимание ритму и замечательным историям в текстах. Темп от начала до конца – средний, что придает альбому ритмическую,
    т.с., монотонность. Что не обязательно недостаток! Автором всех песен указан сам Бобби, однако в половине из них он лукаво
    играет с золотыми блюзовыми стандартами, исподтишка подменяя несколько нот и слов. Два последних альбома Бобби абсолютно
    полярны по звучанию, но оба - неординарны.
