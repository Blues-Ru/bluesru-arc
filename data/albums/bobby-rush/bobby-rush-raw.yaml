- id: 2121
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2013-04-25'
  text: 'Триумфальная работа ветерана блюзовой сцены Бобби Раша. Не слишком обласканная Биллбордом :-), она тем не менее нашла
    свою аудиторию и собрала восторженные отзывы любителей блюза, блюзовых критиков и музыкантов. Четыре номинации на блюзовые
    награды, и три из них материализовались в премии - акустический альбом года и акустический музыкант года, а также лучший
    исполнитель в стиле блюз и соул!


    Это сырой (что полностью оправдывает название альбома) традиционный акустический блюз (снабженный долей соул и фанка),
    виртуозно исполненный с минимальным аккомпаниментом (гитара, гармоника, ножная перкуссия), но полный неподдельного чувства.
    Шедевр истинного блюзового минимализма.'
