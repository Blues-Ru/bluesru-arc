reviews:
- id: 2016
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-11-16'
  text: 'FolkFunk (народный фанк) - так называет сам Бобби Раш свою музыку, которая представляет собой коктейль из южного
    блюза, соул и фанка. Мультиинструменталист Раш записал данный альбом на своем собственном лэйбле Deep Rush в сопровождении
    Элвина Янгблада Харта на гитаре, Чарли Дженкинса на ударных и Стива Джонсона на басу. Сам Бобби как обычно играл на гитаре,
    гармонике и пел. По слухам, весь диск был записан в течение одной пятичасовой сессии, что обеспечило ему цельность, а
    отсутствие излишней перегруженности инструментами и аранжировками позволяет сохранить искренность.


    За исключением двухчастичной Feeling Good, которая представляет собой классический блюзовый буги, остальные треки ближе
    к блюзовому фанку. Очень приличный альбом - и традиция сохранена, и звучание современное.'
