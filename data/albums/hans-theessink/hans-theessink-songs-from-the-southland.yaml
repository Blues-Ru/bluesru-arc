reviews:
- id: 313
  author: Алексей Калачев
  mark: 8
  date: '2003-12-02'
  text: У Тейсинка тихий-тихий-тихий диск под гитару. Иногда туба, иногда подпевочки.
    Чудесный диск, без претензий и прочувствованный. Только дельта-блюзы, единственная
    вещь самого голландца. На его сайте, кстати, есть тексты этих вполне классических
    песен.
- id: 995
  author: Александр Панин
  mark: 6
  date: '2006-05-02'
  text: Диск традиционного американского материала, в основном блюзового, слышанного
    Хансом в исполнении Ледбелли, Роберта Джонсона, Фреда Макдауэлла, Скипа Джеймса,
    Вилли Брауна, Гэри Дэвиса, Джона Харта, Хэнка Вильямса. Здесь очень много хороших
    и известных песен, Тэйссинк здорово играет на гитаре, банджо, мандолине и губной
    гармошке, но запись звучит по-белому неэмоционально и стерильно, не в последнюю
    очередь из-за вокала. Джазовому номеру St. James Infirmary такой баритон подходит,
    но блюзовые вещи выглядят меланхоличными, надуманными и попросту скучными. Соул
    и госпел в виде женских подпевок тоже здесь не работает. В "предисловии" к альбому
    Ханс вспоминает первые впечатления от прослушивания оригинальных композиций и
    рекомендует разыскать диски старых мастеров. Ну а между делом - получить удовольствие
    от его собственных версий, хотя в возможность этого лично мне не очень-то верится.
