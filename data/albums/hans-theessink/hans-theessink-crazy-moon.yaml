- id: 1010
  author: Александр Панин
  mark: 9
  date: '2006-05-14'
  text: Блюз, рутс-рок, госпел, соул, зайдеко, кельтские мотивы, чего тут только нет! На диске тринадцать вещей собственного
    сочинения Ханса и ни одного кавера, песни очень приличные. Как всегда, здесь много различных акустических и электрических
    гитар, хорошо звучащих в фирменном сочетании с тубой. Конечно же, есть и гости, отмечу Терри Эванса и Марсию Болл. Что
    ж, это еще один очень хороший альбом в обширной дискографии Ханса.
