reviews:
- id: 992
  author: Александр Панин
  mark: 10
  date: '2006-05-02'
  text: Волшебный альбом голландского акустика Ханса Тэйссинка. Блюзовая и околоблюзовая кудеровщина с соуловым оттенком.
    Мне никогда особенно не нравился вокал Ханса, поет он неважно и как-то безжизненно, но на этом диске на подпевках сам
    Терри Эванс, и все звучит совсем по-другому! По музыке вообще очень здорово, здесь куча акустических гитар, барабаны и
    перкуссия, бас, туба (!), губная гармошка, аккордеон, рояль и орган. Одиннадцать отличных треков, диск начинается композицией
    Тэйссинка Where The Southern Crosses The Dog (такая фраза многое скажет посвященному!) и заканчивается очень персональным
    исполнением песни Мадди Уотерса Feel Like Going Home. В промежутке - довольно интересно и оригинально звучащие каверы
    Ледбелли, Вилли Диксона, Руфуса Томаса (подобного прочтения песни Walkin' The Dog я еще не слышал) и прекрасные песни
    самого Ханса. Красота!
