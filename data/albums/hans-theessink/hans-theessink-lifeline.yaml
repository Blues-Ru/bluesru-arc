reviews:
- id: 101
  author: Алексей Калачев
  mark: 8
  date: '2003-02-24'
  text: 15-й (!) альбом чудесного датчанина. Комфортный диск. Акустика (Тессинк последние
    годы исполняет исключительно акустику), максимально насыщенная щипковыми инструментами,
    слайдами и великолепными хорами. Да, не подпевками, а хорами, коллеги, поскольку
    голоса на диске стоят гораздо выше термина "беквокал". Участие в записи альбома
    The Holmes Bros и Linda Tillery & Cultural Heritage Choir уже делают его событием.
    Добавьте сюда прозрачный, легкий звук. (Кстати. Тессинк вовсе не тот случай, когда
    "поросенок решил, что он собака" - не скандинав, заигравшийся в американского
    негра. Ханс давно живет в Америке и представляет собой редчайший пример неанглосакса,
    сумевшего стать НАСТОЯЩИМ блюзменом, не стремясь стать "как Мадди" - аутентичным.
    Он как-то умудрился найти свою нишу – комфортную и вполне американскую, - и не
    раздражать своим неблюзовым происхождением таких зануд, как я).
- id: 1009
  author: Александр Панин
  mark: 9
  date: '2006-05-14'
  text: 'Голландский блюзмен Ханс Тэйссинк ездит с гастролями по всему миру, попутно
    заводя знакомства с самыми разными музыкантами. На этом диске коллаборации с госпел-блюз-группой
    The Holmes Brothers, дамами из The Cultural Heritage Choir, знаменитым Чарльзом
    Брауном и зимбабвийским хором Insingizi Emnyama. С вокальной составляющей тут
    очень здорово! Что же до инструментальной, то Ханс использует целый струнный арсенал:
    обычные 6- и 12-струнные акустические гитары, баритон- и стальные гитары, банджо,
    мандолины, стальные мандолины (!), что-то непонятное под названием mando-guitar,
    а также полуакустические Гибсон и Фендер. Большую часть композиций сочинил сам
    Тэйссинк, как всегда, у него получился этакий гибрид блюза и прочих корневых дел.
    Назвать его песни выдающимися, конечно, нельзя, но слушаются они довольно легко.
    Отмечу два удачных кавера – Soul Of A Man Блайнд Вилли Джонсона и Death Don''t
    Have No Mercy преподобного Гэри Дэвиса, такие номера всегда радуют! Солидный альбом,
    здесь неплохие песни и богатое чистое звучание, удовольствие гарантировано.'
