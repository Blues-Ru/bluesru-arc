  text: <img src="http://image.allmusic.com/00/amg/cov200/drg300/g359/g35923jintm.jpg"/> Для записи этого диска "евроблюзмен"
    Ханс Тэйссинк собрал целую команду музыкантов, среди которых выделяется духовая секция в составе Масео Паркера, Пи Ви
    Эллиса (оба – саксофон) и Фреда Уэсли (тромбон), мощный дуэт бэк-вокалистов (Бобби Кинг и Терри Эванс), а также участники
    группы The Band и их друзья (Рик Данко – бэк-вокал, Гарт Хадсон – аккордеон, Ричард Белл – рояль/орган, Колин Линден –
    гитары/вокал). Роль баса с успехом исполняет туба, на которой играет постоянный участник альбомов Ханса Джон Сэсс. В подобном
    симбиозе рождаются действительно хорошие и приятные звуки. Диск, в общем-то, не совсем и блюзовый, тут есть фолк и рутс-рок,
    госпел, соул и ритм-энд-блюз, иначе говоря, это смесь американских жанров и стилей, отчасти напоминающая ту, что получается
    у Рая Кудера. Большая часть материала авторская, из каверов выделю любопытную версию известного рок-н-ролла Mabellene
    (здесь именно в таком написании). Как всегда, приятно слушать игру Ханса на различных акустических гитарах, да и вокал
    его в таком формате и с таким материалом звучит довольно уместно. Симпатичный и популярный диск, запись продана тиражом
    более 50000 экземпляров, как говорится на <a href="http://www.theessink.com">сайте Тэйссинка</a>.
