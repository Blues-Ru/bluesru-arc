  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2019-04-05'
  text: 'В 1977 году венский пианист Йохим Палден победил на конкурсе буги-вуги, и в качестве приза получил контракт на запись
    альбома. Вместе со своим приятелем гитаристом Эриком Траунером он решил создать блюзовую группу, получившую название The
    Mojo Blues Band. В 80-е годы The Mojo Blues Band тесно сотрудничала с Даной Гиллеспи, в результате чего был записан ряд
    совместных альбомов. Однако сотрудничество австрийского мастера хонки-тонк и английской блюзовой дивы на этом не закончилось
    и вылилось в пару совместных альбомов, записанных в начале 90-х . Более того, время от времени Дана и Йохим выступают
    вместе и по сей день.


    Boogie Woogie Nights - первый совместный альбом Даны Гиллеспи и австрийского пианиста-виртуоза Йохима Палдена, причем
    альбом концертный. Концерты проходили с 5 по 7 декабря 1990 года в Вене в зале Jazzland. Именно на этой концертной площадке
    в 1980 году Дана начала выступать с группой The Mojo Blues Band, и с тех самых пор она хотела записать настоящее концертное
    исполнение блюза и буги. На диске два инструментала (один из которых написал Йохим Палден), два трека написаны совместно
    Гиллеспи и Палденом, остальное - каверы. Продюсировали диск лейбл Wolf Records и Йохим Палден. Интересен инструментарий
    сопровождающего состава: ударные, фортепиано и два саксофона. При таком раскладе получается довольно необычная звуковая
    палитра - звучание достаточно интимное и скорее джазовое, а фортепиано и голос звучат особенно ярко. При этом солируют,
    естественно, фортепиано и саксофоны. Запись дышит мощной энергетикой и искренностью клубного выступления, в котором публика
    принимает самое активное участие.


    Альбом в первую очередь для поклонников фортепианного буги-вуги, но и любители блюза найдут для себя немало интересного.'
