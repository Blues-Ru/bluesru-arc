  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-11'
  text: 'I Rest my Case - первая после альбома 2003 года Staying Power сольная студийная работа примы британского блюза. Все
    треки написаны самой Даной, музыку записали музыканты ее гастрольного состава. Среди них старые знакомые ветеран группы
    саксофонист и харпер Майк Пэйс, а также ритм-секция из Джеффа Уолкера и Ивана Дженкинса, остальные лица новые. Как считает
    сама певица, это лучший ее альбом за последние годы.


    По словам критика, "первоклассная певица и композитор, великолепный материал и отличные музыканты - вот что представляет
    собой данный диск". На мой взгляд, на самом деле не все так радужно: к вокалу претензий нет, спето отменно; материал бОльшей
    частью тоже на уровне, хотя и не весь; из музыкантов мне понравились практически все, кроме гитариста Джейка Зайтца -
    его бы я определенно заменил. В целом - диск хороший, профессиональный, но не лучший у Даны Гиллеспи. Тем не менее наверняка
    будет интересен любителям современного блюза.'
