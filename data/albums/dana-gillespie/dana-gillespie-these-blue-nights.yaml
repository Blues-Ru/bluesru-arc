  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-13'
  text: 'За плечами Даны Гиллеспи фолковая юность конца 60-х, сотрудничество с Дэвидом Боуи, карьера певицы и киноактрисы,
    участие в театральных постановках и продолжительная сольная карьера. На момент выхода данного альбома музыкальная карьера
    Даны превысила 40-лет, из которых бОльшую часть она посвятила блюзу. Именно блюз был для нее откровением в музыке, когда
    она была еще тинейджеркой, и к нему она обратилась, когда достаточно повзрослела. За эти годы певица записала не один
    десяток альбомов, получила множество блюзовых наград и стала настоящей интернациональной блюзовой легендой.


    These Blue Nights - сборник блюзовых и блюз-роковых треков с альбомов (Blue One, Have I got Blues for You и Back to the
    Blues), записанных знаменитой британской вокалисткой Даной Гиллеспи для фирмы Wolf Records, с добавкой нескольких новых
    треков, записанных Даной с ее обычным концертным составом London Blues Band.


    За свою долгую карьеру Дана записала около 50 альбомов в разных стилях (фолк, поп, блюз и рок), однако данный сборник
    наглядно иллюстрирует ее владение блюзом во всех его ипостасях - от традиционной акустики до современного блюз-рока. Обратите
    внимание, что представлен почти полностью авторский материал - за исключением кавера Уилли Диксона Three Hundred Pounds
    of Joy на всех остальных треках Дана либо единоличный автор, либо соавтор. Данный диск - наглядное свидетельство того,
    что Дану совершенно справедливо называют королевой британского блюза. Отличный диск - профессионально сыгранный, хорошо
    аранжированный и мастерски спетый.


    На треке Blue Blood Дане аккомпанирует знаменитый голландский гитарист Ханс Тейсинк. Среди сопровождающих музыкантов нельзя
    не отметить игру молодого гитариста Мэтта Скофилда , который впоследствии заслужит славу одного из самых новаторских молодых
    блюзовых гитаристов Британии в качестве лидера его группы The Matt Schofield Trio. Мэтт принимал участие в записи "новых"
    треков 1, 3, 5 и 11. Другой талантливый английский гитарист Тод Шарпвилль - обладатель титула лучшего британского гитариста
    1995 года по версии British Blues Connection - играет на треках 2, 10, 13 и 14. На треке Be my Sugar Дана сотрудничала
    с легендарным чикагским блюзменом Мэджик Слимом и музыкантами его группы The Teardrops.'
