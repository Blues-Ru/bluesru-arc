- id: 2329
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2019-03-29'
  text: 'Материал полностью авторский - на всех треках Дана либо единоличный автор, либо соавтор. Певица также выступила в
    роли продюсера. Среди сопровождающих музыкантов ветеран группы саксофонист и харпер Майк Пэйс, а также клавишник-виртуоз
    Дино Баптист. Гитарные партии записал известный ирландский блюзовый левша Эд Дин, прекрасно управляющийся и с акустикой,
    и с электричеством, и особенно со слайдом. В начале 70-х Эд заменял Гэри Мура в Skid Row, впоследствии играл с Алексисом
    Корнером и Крисом Фарлоу, записывал саундреки к фильмам, а в 90-е гастролировал с Даной Гиллеспи и записал с ней ряд альбомов
    (Where Blue Begins 1989, Hot Stuff 1995, Blue One 1994, Have I got Blues for You 1997).


    В музыкальном плане диск разнообразный - тут и блюз, и блюз-рок, и буги-вуги, и соул с мемфисским привкусом. Есть пара
    акустических треков (включая заглавный), на которых слайд Дина прекрасно соседствует с гармоникой Пэйса, на "электрических"
    треках периодически встречаются переклички гитары и саксофона. Наиболее интересные треки Who''s Got The Blues To Blame,
    Too Blue To Boogie, Back To The Blues, Travelling Man Blues и It Makes Me Blue. Диск оставляет приятное впечатление и
    наверняка придется по душе любителям британской разновидности современного белого блюза.'
