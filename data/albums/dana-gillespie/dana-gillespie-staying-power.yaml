  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2019-03-20'
  text: 'За плечами Даны Гиллеспи фолковая юность конца 60-х, сотрудничество с Дэвидом
    Боуи, карьера певицы и киноактрисы, участие в театральных постановках и продолжительная
    сольная карьера. Данный альбом вышел в ознаменование 40-летия музыкальной карьеры
    певицы, из которых бОльшую часть она посвятила блюзу. За эти годы в Англии и Европе
    Дана превратилась в настоящую звезду блюза - блюза в лучших британских традициях.


    Альбом, который традиционно продюсировала сама певица, состоит преимущественно
    из авторского материала (единственный кавер Фрэнки Миллера "You''re the Star"
    завершает альбом). В музыкальном плане диск достаточно разноплановый - тут и блюз-рок,
    и соул, и фанк, и джаз, и буги-вуги, однако все это звучит достаточно органично
    за счет отличной подачи вокалистки и мастерской игры сопровождающих музыкантов.
    Нельзя не отметить существенный вклад одаренных британских гитаристов - Мэтта
    Скофилда (лидера The Matt Schofield Trio) и Тода Шарпвилля (обладателя титула
    лучшего британского гитариста 1995 года по версии British Blues Connection). Музыка
    также украшена эпизодическим подключением мощной духовой секции в стиле мемфисского
    соул, в которой блистает давний соратник Даны саксофонист и харпер Майк Пэйс.
    Духовая секция раскрывается во всей красе в джазовом треке It''s What He''s Got.
    Любители блюза не смогут остаться равнодушными при прослушивании медленного блюза"Put
    My Anchor Down".


    Отличный диск в стиле традиционного британского блюза с современным звучанием
    - полистиличный, профессионально сыгранный, хорошо аранжированный и мастерски
    спетый.'
