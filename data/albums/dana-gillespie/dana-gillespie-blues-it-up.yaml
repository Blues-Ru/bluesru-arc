- id: 2330
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2019-04-02'
  text: 'Blues It Up - сборник, выпущенный лейблом Асe, в который вошли лучшие треки с трех альбомов певицы, изданных ранее
    этим лейблом и лейблом Horizon. C альбома 1982 года Blue Job (продюсировала Дана Гиллеспи) взяты треки 1, 7, 11, 14, 16,
    18, 20 и 23, с альбома Below the Belt 1984 года (продюсировал знаменитый Майк Вернон) - треки 2, 5, 8, 10, 12, 17, 19,
    21 и 22, и наконец с альбома Sweet Meat 1989 года (продюсировал Майк Вернон) - треки 3, 4, 6, 9, 13 и 15. Материала авторства
    самой Даны в итоге оказалось около одной четверти, остальное - каверы. В текстах присутствует игривый двусмысленный контекст
    и сексуальные намеки, поданные с изрядной долей юмора, что довольно характерно для творчества Даны Гиллеспи.


    В итоге на суд слушателя представлен заводной блюз вперемешку с буги и рок-н-роллом, украшенный саксофонами и эпизодической
    губной гармоникой - в лучших традициях классического английского блюза.'
