- id: 2365
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2023-10-06'
  text: 'За плечами Даны Гиллеспи фолковая юность конца 60-х, сотрудничество с Дэвидом Боуи, карьера певицы и киноактрисы,
    участие в театральных постановках и продолжительная сольная карьера. Однако именно блюз был для нее откровением в музыке,
    когда она была еще тинейджеркой, и к нему она обратилась, когда достаточно повзрослела. За эти годы певица записала не
    один десяток альбомов, получила множество блюзовых наград и стала настоящей интернациональной блюзовой легендой.


    На момент записи Deep Pockets Дане было 72, а ее музыкальная карьера разменяла шестой десяток. Диск вышел 6 августа 2021
    года на лейбле Асе, с которым певица сотрудничает уже не один десяток лет. Альбом полностью состоит из авторского материала,
    сочиненного Даной с помощью ее гитариста Джейка Зайтца во время локдауна. Продюсировала сама Гиллеспи с участием все того
    же Джейка. Альбом в основном неспешно-спокойный, расслабленный. Конечно, тут уже нет юношеской прыти, но класс исполнителя
    чувствуется в каждой ноте: мастерство, как говорится, не пропьешь :-) Очередная достойная работа от певицы, которую приятно
    слушать всем любителям блюза, а песня Now You''re Stardust посвящена памяти Дэвида Боуи, с которым она тесно общалась
    в начале 70-х.'
