  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2019-04-10'
  text: 'Cat''s Meow - первая после альбома 2010 года I Rest My Case сольная студийная
    работа примы британского блюза. Все треки написаны самой Даной в соавторстве с
    Джеком Зайтцем, гитаристом ее гастрольного состава the London Blues Band в течение
    последних 7 лет. Среди аккомпанирующих музыкантов старые знакомые: ветеран группы
    саксофонист и харпер Майк Пэйс, а также ритм-секция из Джеффа Уолкера и Ивана
    Дженкинса. Дополняет состав сын Джейка Арти Зайтц. Музыка создавалась в Италии
    в перерыве между гастролями, а окончательная запись была выполнена в Лондоне.
    Продюсировали альбом Дана и Джейк Зайтц.


    Название альбома навеяно любовью Даны к кошкам. Интересная история случилась с
    певицей во время российских гастролей в 2011 году. В небольшом российском городке
    она подцепила опасный вирус и вынуждена была впервые за 30 лет отменить концерты.
    Ее отвезли в клинику под наблюдение врачей, но по дороге туда она встретила маленького
    котенка, которого кто-то выбросил на улицу. Дана взяла котенка с собой, и все
    10 дней в клинике он пролежал у нее на груди и шее, принимая непосредственное
    участие в исцелении певицы.


    В результате использования Джейком "семейного подряда" на альбоме не нашлось места
    для Дино Баптиста, мастерская игра которого на клавишных украшала многие предыдущие
    альбомы Даны Гиллеспи. В итоге этого музыкальная палитра диска оказалась обедненной.
    Кроме того, на альбоме маловато по-настоящему классного музыкального материала,
    диск добротного среднего уровня.'
