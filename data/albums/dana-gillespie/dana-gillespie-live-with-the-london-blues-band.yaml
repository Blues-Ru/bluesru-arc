  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2019-03-26'
  text: 'На данном диске представлена запись концертного выступления Даны и группы
    the London Blues Band на концертной площадке Mr. Kyps в английском городе Пул,
    сделанная в 2006 году (кстати, в Mr. Kyps во время английских гастролей любит
    выступать Джо Бонамасса). Концертный альбом поклонники ждали от Даны уже давно,
    и вот наконец такой клубный концерт вышел. Сет-лист почти полностью состоит из
    авторского материала - за исключением двух каверов (треки 2 и 11) на всех остальных
    треках Дана либо единоличный автор, либо соавтор. Певица также выступила в роли
    продюсера.


    Среди сопровождающих музыкантов нельзя не отметить игру гитариста Мэтта Скофилда
    , который заслужил славу одного из самых новаторских молодых блюзовых гитаристов
    Британии в качестве лидера его группы The Matt Schofield Trio. Отменно играет
    на клавишных Дино Баптист, и как всегда на высоте ветеран группы саксофонист и
    харпер Майк Пэйс. От ураганной рок-н-рольной энергетики Big Boy и Too Blue To
    Boogie до медленных блюзов Big Daddy Blues и Up Your Sleeve группа и певица демонстрируют
    прекрасное владение блюзом во всех его вариантах. Настоящее живое выступление
    без наложений и корректировок лишний раз показывает высочайший профессионализм
    музыкантов, а свойственные такому выступлению некоторые шероховатости не портят
    общую картину. Уверен, что данный концерт придется по душе всех поклонникам современного
    блюза.'
