  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2019-04-09'
  text: 'Where Blue Begins - не самый репрезентативный альбом в дискографии Даны Гиллеспи,
    который заметно отличается от большинства других ее работ. Это своего рода коммерческий
    проект, записанный британской певицей для крупного немецкого лейбла - BMG Ariola.
    Звучание осовременено электронными ударными и синтезаторами, но и характерные
    для дисков Даны искусные гитарные партии и эпизодические саксофоны также присутствуют.
    В музыкальном плане на диске представлен приджазованный коммерческий рок с блюзовыми
    вкраплениями.


    На диске примерно половина авторского материала. Продюсировал диск знаменитый
    Майк Вернон. Среди наиболее интересных треков нельзя не отметить заглавный Where
    Blue Begins (кстати, желающие могут сравнить эту версию 91 года с более поздней
    версией с альтернативной аранжировкой, замыкающей альбом Blue One), а также Up
    Your Sleeve.


    Альбом сделан высокопрофессионально, но это не лучший диск для поклонников блюзового
    направления в творчестве Даны Гиллеспи.'
