  text: '"She literally beats the pants off anything done by a British bluesman these last 10 years."


    - Charles Shaar Murray


    Essential Blues on CD


    Have I Got Blues for You - еще один добротный альбом от ведущей блюзовой артистки Британии.


    Материал вновь авторский (частично в соавторстве), исполнение высокопрофессиональное, аранжировки классные, вокал сильный
    и выразительный, треки стилистически разнообразные, традиционное звучание дополнено современным звуком. Продюсировала
    диск сама певица. Хороша также обложка Йорга Хубера. На треке Blue Blood Дане аккомпанирует знаменитый голландский гитарист
    Ханс Тейсинк.


    Возможно, на данном диске нет таких шедевральных треков, как на Blue One, но в целом музыка очень приличного уровня, до
    которого дотягиваются далеко немногие.'
