  date: '2019-04-03'
  text: 'Альбом Below the Belt издавался в Англии на виниле в 1984 году лейблом Ace,
    а затем в 1985 году переиздавался в Европе лейблом Philips. Оригинальная обложка
    альбома была слегка провокационной, и первый английский тираж вышел без нее. Зато
    Европа оказалась менее пуританской и переиздала диск с оригинальным оформлением.
    При внимательном рассмотрении эта оригинальная обложка отражается в очках Даны
    на традиционной обложке.


    Дана написала три трека, остальное - каверы. Продюсировал диск знаменитый Майк
    Вернон. В текстах присутствует игривый двусмысленный контекст, юмор и сексуальные
    намеки, что довольно характерно для творчества Даны Гиллеспи (да и само название
    альбома - "ниже пояса" - говорит о многом). Партии гитары записал известный ливерпульский
    блюзовый гитарист Сэм Митчелл, который в 70-е годы сотрудничал с певицей Кэрол
    Граймс, помогал Чарли Масселуайту при записи альбома Harmonica According to Charlie
    Musselwhite, а в 80-е присоединился к группе Даны Гиллеспи. Сэм был мастером игры
    слайдом на гитаре National Steel, и согласно слухам именно он научил Марка Нопфлера
    этому методу (а сама гитара National Steel впоследствии украсила обложку Brothers
    in Arms).


    В итоге на суд слушателя представлен энергичный блюз вперемешку с буги и рок-н-роллом,
    украшенный саксофонами - в лучших традициях классического английского белого блюза.'
