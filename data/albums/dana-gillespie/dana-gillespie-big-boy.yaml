  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2019-04-04'
  text: 'В 1977 году венский пианист Йохим Палден победил на конкурсе буги-вуги, и в качестве приза получил контракт на запись
    альбома. Вместе со своим приятелем гитаристом Эриком Траунером он решил создать блюзовую группу, получившую название The
    Mojo Blues Band. В 80-е годы The Mojo Blues Band тесно сотрудничала с Даной Гиллеспи, в результате чего был записан ряд
    совместных альбомов. Однако сотрудничество австрийского мастера хонки-тонк и английской блюзовой дивы на этом не закончилось
    и вылилось в пару совместных альбомов, записанных в начале 90-х . Более того, время от времени Дана и Йохим выступают
    вместе и по сей день.


    Big Boy - второй совместный альбом Даны Гиллеспи и австрийского пианиста-виртуоза Йохима Палдена (первым был концертник
    Boogie Woogie Nights), и, в отличие от предшественника, этот альбом студийный и практически полностью состоит из авторского
    материала. На диске один кавер (Your Mind Is On Vacation), два инструментала написал Йохим Палден, три трека сочинила
    Дана Гиллеспи, остальные треки написаны совместно Гиллеспи и Палденом. Продюсировал альбом знаменитый Майк Вернон, который
    также выступил в роли звукоинженера. Треки Be My Sugar (прифанкованный блюз) и Got It Bad (классический медленный блюз)
    записаны в сотрудничестве с легендарным чикагским блюзменом Мэджик Слимом и музыкантами его группы The Teardrops. Среди
    сопровождающих музыкантов нельзя не отметить блестящую игру знаменитого мастера духовых Мела Коллинза, который искусно
    владеет всеми типами саксофонов.


    Альбом в первую очередь для поклонников фортепианного буги-вуги, но и любители блюза найдут для себя много интересного.'
