- id: 1670
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-13'
  text: 'Достойная работа от английской королевы блюза: Дана выступила не только в роли вокалистки, но и автора (весь материал
    написан ей единолично и в соавторстве), а также продюсера.


    Профессиональный сопровождающий состав, блестящие аранжировки, мощный чувственный голос вокалистки - что еще нужно для
    хорошего альбома? Пожалуй, на диске все треки достаточно хороши, но есть и определенно выдающиеся композиции: True Blue
    Love, Once in a Blue Moon, Blues Line, Full Circle Blues и Where Blue Begins.


    Каждый самостоятельно может расширить этот список, ибо материал (как и диск) действительно хороший!'
