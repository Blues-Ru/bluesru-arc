reviews:
- id: 1876
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-06-10'
  text: 'Очередной сольный альбом британской блюзовой примы - и альбом традиционно
    хороший! Несмотря на стилистическое разнообразие музыкального материала (от медленных
    блюзов со свингующими духовыми до рок-н-ролльных буги), все треки объединены высоким
    качеством записанной музыки и профессионализмом ее исполнения, причем хороша не
    только сама певица (голос которой временами чуть выдвинут на передний план), но
    и сопровождающий состав музыкантов, играющих с хорошим драйвом. Среди сопровождающих
    музыкантов нельзя не отметить игру молодого гитариста Мэтта Скофилда , который
    впоследствии заслужит славу одного из самых новаторских молодых блюзовых гитаристов
    Британии в качестве лидера его группы The Matt Schofield Trio. Мэтт принимал участие
    в записи еще нескольких альбомов Даны Гиллеспи.


    Дана выступила в качестве автора или соавтора практически всех треков на альбоме
    (кроме кавера Фрэнки Миллера - трек 8, который очевидно слегка выдается из общей
    канвы), равно как и в качестве продюсера. Результат каждый может оценить сам,
    но я уверен, что альбом понравится практически всем любителям современного блюза
    на традиционной основе.'
