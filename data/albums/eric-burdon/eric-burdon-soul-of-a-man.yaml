- id: 964
  author: Дмитрий Казанцев
  mark: 10
  date: '2006-01-27'
  text: 'Альбом вышел в США 10 января этого года. 65-летный Эрик разошелся; он ведь
    только выпустил отличный альбом в 2004 году, и вот опять. На диске 14 песен, он
    длится 60 минут. У ребят на Оллмьюзике стоит стиль ХАРД РОК (умные ребята!)


    Первая песня "Soul Of A Man" сразу в стиле госпел (видать наслушался он Blind
    Boys of Alabama). Интересен набор музыкантов на этом альбоме: Иван Невилл!!! подпевает
    и играет на клавинете и клавишах (это племянник легендарного Арта Невилла и сын
    не менее легендарного Аарона Невилла), прекрасный Регги МакБрайд играет на басу,
    кудесник Ленни Кастро на перкуссии, Джон Клиари - пианино, Род Пиацца - гармошка,
    Карл Карлтон - гитары, Джонни Ли Шелл - гитары/вокал, Хатч Хатчинсон - бас, Тони
    Бронагел - ударные/продюсер.


    Вторая вещь "Kingsize Jones" на альбоме в духе жесткого фанка - очень хороша.
    "Red Cross Store" - отличный блюз Фреда Макдауэлла в мощной обработке. "Como Se
    Llama Mama" - офигенный латин-фанк с подпевками и тремоло-гитарой! "40 Days &
    40 Nights" - классика блюза, Род Пиацца на гармошке. "Feeling Blue" - нереальной
    красоты олд-скул фанки-соул-рок! "Never Give Up Blues" - яркий кантри-блюз в электро-акустической
    обработке. "GTO" - грустный и красивый южный соул-блюз. "44" - классический блюз
    Хаулина Вулфа в довольно шумной обработке (к сожалению). "Slow Moving Train" -
    южный кантри-соул со стил-гитарой. "Don''t Ever Let Nobody Drag Your Spirit Down"
    - очень душевный госпел-блюз Эрика Бибба с обалденной слайд-добро-гитарой! "Devil
    Run" - и снова мощный фанки-соул-рок с клавинетом и подпевками. "I Don''t Mind"
    - эдакий микс новоорлеанского блюза в миноре и песни Хендрикса "Little Wing".
    "Circuit Rider" - еще один блюз с гармошкой Рода.


    Шикарный диск! Что-то подобное, на таком уровне, Эрик делал в далеком 1970 году
    с группой War (не считая диск 2004 года). Как удивительна все же жизнь. Особенно
    хочется здесь отметить голос Эрика, клавиши Ивана и подбор песен. Звук тоже на
    высоте, на самом деле. Бердон делает невозможное в свои 65, он поет лучше, чем
    делал это 40 лет назад.'
- id: 1205
  author: Артем Липатов
  mark: null
  date: '2008-01-29'
  text: 'Эрик Бердон не вписывается в классическое определение "благородного блюзового
    старика". Он всю жизнь рубил сплеча, разрезал узлы и вел себя безоглядно, прямо
    как те герои Туве Янсон, что "пили вино и топтали чужие огороды". Если кому-то
    показалось, что человек, сардонически сказавший о себе "I used to be an animal",
    подуспокоился и стал донельзя лиричен (ну, как на альбоме "My secret life"), то
    это ошибка: секретная жизнь на то и секретная, чтобы к ней особо не подпускать:
    разок дали подглядеть, и ладно.


    На нынешнем релизе, отмеченном классически-блюзовым репертуаром авторства Миссисипи
    Фреда МакДауэлла, Честера Бернетта и Слепого Уилли Джонсона, а также блюзовым,
    но не столь классическим авторства Эрика Бибба и великого органиста Джона "Кролика"
    Бандрика (это он вписал свой органчик в уже готовый первый альбом Боба Марли на
    лейбле Island и тем самым объевропеил корневой регги, сделав его удобоваримым
    для белых ушей!), Эрик неистов, могуч, циничен… и трепетен, нежен, бережен. Голос
    его все еще силен, музыканты записываются с ним отличные – взять хотя бы Айвена
    Невилла, Лени Кастро, Рода Пиаццу, Реджи МакБрайда и Карла Карлтона to name but
    a few, альбом прямолинеен и мощен – но тут же, на последней странице буклета Эрик
    объясняет, где и почему он изменил тексты песен, и что не проявил этим никакого
    неуважения к оригинальным версиям, а наоборот…


    Так не поступают, удаляясь на покой и выбираясь в студию подзаработать на новое
    кресло-качалку и пару ящиков бурбона. Англичанин Бердон, тридцать лет живущий
    в Штатах и готовый начистить морду любому, кто обидит его музыку(сказал же он
    экс-гармошечнику Оскару Ли, позвавшему его подхалтурить на рекламе автоответчика,
    "go fuck yourself!") явно не готов сваливать в теплые и уютные кусты. Впрочем,
    он так и выдал несколько лет назад в интервью – дескать, хочу дожить до конца
    света. Похоже, у парня есть шанс.'
- id: 1401
  author: Андрей Евдокимов
  mark: 8
  date: '2008-12-29'
  text: 'Рок-ветераны время от времени выпускают новые альбомы... Новые работы подтверждают:
    дело свое они знают. А еще отчетливо слышно, как хрустят их косточки под тяжестью
    прожитых лет. Предыдущий альбом Бердона был таким: мастерским и покрытым мхом
    усталости... Нынешний преподносит сюрпризы с порога: энергично, жестко, бескомпромиссно!
    Общая композиция выстроена от интенсивных, накачанных горькой иронией блюзов до
    чувственных соул-песен и унылых баллад – к венчающему альбом ерническому маршу!
    Последний – одна из двух песен собственного сочинения. Остальные – традиционные
    блюзовые темы, игранные-заигранные сотнями музыкантов. Но здесь они звучат настолько
    свежо, что просто удивляют сочетанием мгновенной узнаваемости и оригинальной новизной.
    В ансамбле – только звезды (разумеется). Общее звучание ориентировано на акустику,
    но это агрессивный и увесистый звук, ничего умильно-благостного. Бердона, более
    сорока лет проведшего на рок-сцене, зажгла вновь его первая любовь – музыка Нового
    Орлеана.'
- id: 1987
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-08-12'
  text: 'Soul of a Man - отличный альбом от ветерана блюз-рока, вышедший 27 января
    2006 года. Пожалуй, чуть не дотягивает до предыдущего студийника (в первую очередь
    по причине практического отсутствия авторского материала), но все равно очень
    и очень и очень хорошо! Записать пластинку подобного класса - это честь для любого
    музыканта, невзирая на возраст (заметим, что на момент записи Эрику было 65! Но,
    как известно, блюзмены, как хорошее вино, с возрастом становятся только лучше
    :-)) .


    Альбом был записан всего за неделю. При записи помогали в основном те же музыканты,
    что и 2 года назад при работе над My Secret Life: ударник Тони Браунагель (он
    же и продюсер), гитарист Джонни Ли Шелл, клавишники Майк Финниган, Айван Невилл
    и Джон Клири, басист Джеймс Хатчинсон. На гармонике отметился Род Пиацца. Присутствуют
    также эпизодические включения духовых. Альбом посвящен памяти Рэя Чарльза и Джо
    Ли Хукера, а также городу Новый Орлеан. В качестве обложки послужила картина,
    которую нарисовала и прислала Эрику одна из его поклонников.'
