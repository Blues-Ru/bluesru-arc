- id: 1985
  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2011-08-12'
  text: 'Бывший лидер легендарной группы Энималз из Нью-Касла навсегда вошел в историю
    рок музыки как исполнитель знаменитого "Дома восходящего солнца". Однако надо
    заметить, что этим его карьера вовсе не исчерпывается: с конца 60-х после ухода
    из группы он выступал и записывался как сольно, так и с различными коллективами,
    переживая традиционные для любого эстрадного исполнителя периоды взлетов и падений.
    Тем приятнее было узнать, что и в 21 веке Эрик по-прежнему в прекрасной форме
    и записывает сольные пластинки отменного качества, которые дадут фору любому намного
    более молодому музыканту.


    My Secret Life - первый альбом, состоящий из нового преимущественно авторского
    материала, записанный Бердоном за 16 лет. И, надо сказать, come-back вполне удался.
    Сам Эрик написал 9 песен (в соавторстве), заглавная песня принадлежит перу Леонарда
    Коэна, свой вклад также внесли Дэвид Бирн и Майк Чэпмен. Продюсировал Тони Браунагель,
    исполнительный продюсер - сам Бердон. Сопровождающие музыканты составляют костяк
    группы Бонни Райатт (ударник Тони Браунагель, гитарист Джонни Ли Шелл, клавишник
    Джон Клири и басист Джеймс Хатчинсон). Местами также присутствует духовая секция
    The Texicali Horns.


    Не совсем, конечно, блюз - просто отличная пластинка от матерого человечище, которая
    звучит великолепно, несмотря на возраст музыканта, и включает в себя целый коктейл
    стилей: и блюз, и рок, и соул, и джаз, объединенных харизмой самого автора. Аранжировки,
    исполнение, качество записи и самой музыки - все выше всяческих похвал, причем
    от повторных прослушиваний диск только выигрывает. Настоятельно рекомендуется
    всем любителям хорошей музыки!'
