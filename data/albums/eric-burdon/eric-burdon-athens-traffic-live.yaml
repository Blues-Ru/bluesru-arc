  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-08-12'
  text: 'Концертный альбом, записанный во время турне по итогам суперуспешного сольника
    2004 года. Есть и старые хиты, есть и изрядная доля материала с прошлогоднего
    альбома. Последняя вещь - студийный бонус-трек. Очень приличный концерт, хотя
    пара вещей все же уступает альбомным версиям, тем не менее сам Эрик и его группа
    находятся в прекрасной форме и звучат отлично.


    Вторым дисков в комплекте идет ДВД с 3 видео, комментариями Эрика и соло на ударных.
    В качество бонусного диска неплохо, но самого концертного видео там, увы, нет!'
