- id: 1984
  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2011-08-12'
  text: 'Довольно любопытный диск Эрика Бердона - два альбома на одном КД: Sun Secrets 1974 (первые 7 треков) и Stop 1975
    (остальные треки).


    Исторически сложилось так, что альбом 1974 года был издан без ведома самого Эрика, и по его мнению содержит сырой материал,
    который певец рассматривал в качестве "репетиционного". Тем не менее диск довольно приличный, и даже занял вполне достойное
    51 место в топе альбомов Биллборда. Следующий диск - Stop - заметно слабее, но в качестве бонусного на том же КД вполне
    годится. Этот диск также имеет свою историю: музыка была преимущественно написана на несколько лет раньше (где-то в 1970
    и 1971 годах во время совместного сотрудничества и гастролей бывшего фронтмена Animals и группы гитариста и композитора
    Джона Стерлинга), а выпущена только в 1975-м. Из-за ограниченного места на диске один трек с альбома 1975 года (Be Mine)
    пришлось опустить.'
