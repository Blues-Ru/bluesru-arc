- id: 2135
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2013-06-19'
  text: 'Эрик Бердон и в 21 веке не перестает радовать поклонников, периодически выпуская отменные студийные сольники. И в
    71 год источник его вдохновения не пересыхает, и наглядное доказательство тому - новый альбом. Записанный в тех же студиях
    Нового Орлеана и Южной Калифорнии, как и два его знаменитых предшественника 2004 и 2006 года, альбом спродюсирован самим
    Бердоном и Тони Барнаклом, и является, пожалуй, наиболее личным альбомом музыканта. В написанных лично или в соавторстве
    10 треках из 12 Эрик с позиции умудренного опытом человека размышляет о прожитой жизни, ушедших друзьях, человеческих
    проблемах и других вопросах, волнующих сегодня как его самого, так и зрелую аудиторию, которой в первую очередь адресован
    альбом и которая собственно выросла на песнях Бердона. Один из авторских треков посвящен Бо Дидли, кавер на песню которого
    Before You Accuse Me завершает альбом (собственно, эту песню старшее поколение прекрасно знает в исполнении Тома Фогерти
    сотоварищи).


    Недаром Брюс Спрингстин в 2012 году пригласил Эрика в качестве почетного гостя на свое шоу South by Southwest: Бердону
    есть что сказать, и его музыка вовсе не звучит архаично. Стилистически альбом довольно разнообразный, основанный на традиции,
    с блюзовым привкусом, и при этом звучащий вполне свежо и искренне. Приятно то, что, как и его предшественники, альбом
    только выигрывает от многократного прослушивания. Возможно, на нем чуть меньше драйва, но зато больше чувства, и в целом
    он вполне на уровне двух предыдущих.'
