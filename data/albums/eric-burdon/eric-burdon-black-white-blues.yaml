- id: 1982
  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2011-08-12'
  text: 'Любопытный альбом, переизданный на КД в 2003 году под названием Black and White Blues. В оригинале данный материал
    был записан в 1971 году и издан на пластинке под именем "Guilty"


    Диск представляет собой совместную работу Эрика и темнокожего блюзового певца Джимми Уитерспуна. На одном из треков в
    качестве сопровождающего состава играют музыканты группы War, с которыми в тот период сотрудничал Бердон. Представлены
    каверы блюзовой классики и несколько собственных композиций, включая финальный госпел совместно с хором преподобного Джеймса
    Кливлэнда.


    Диск неспешного блюза с элементами психоделии, характерной для того временного периода. Работа любопытна именно в силу
    сотрудничества двух основных музыкантов и понравится поклонникам Эрика Бердона, хотя по сути альбом довольно средненький.'
