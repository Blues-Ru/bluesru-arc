- id: 996
  author: Александр Панин
  mark: 8
  date: '2006-05-03'
  text: 'Весьма бодрый и заводной диск от зайдеко-музыканта в третьем поколении. Бэндлидер
    Чабби Каррье, как и положено, играет на аккордеоне, ему помогает более-менее стандартный
    для этого жанра набор инструментов: гитара, бас, барабаны и стиральная доска,
    на паре треков добавлен саксофон. Чабби также очень хорошо поет, в его музыке
    слышно влияние многих жанров и стилей: от блюза, соула и новоорлеанского фанка
    до госпела и ду-вопа. Подпевает ему, кстати, половина состава. На диске удачный
    баланс каверов и авторских произведений, все композиции довольно компактные, практически
    нет чрезмерных затягиваний и бездумных солирований (хотя гитарист временами и
    раздражает). В итоге – сорок пять минут приятной, быстрой, по-настоящему легкой
    и совсем не однообразной музыки. Лейбл Blind Pig, 1993-й год. Премия журнала Living
    Blues за альбом года в жанре зайдеко.'
