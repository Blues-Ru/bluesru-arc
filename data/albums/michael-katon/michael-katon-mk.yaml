  date: '2018-04-27'
  text: '" Michael Katon plays some of the loudest, toughest, meanest rock & blues on the planet!" - Metal Hammer


    "Katon is a virtuoso guitar player with his roots in the right place...[his] sound is a blazing blend of electric blues
    and roadhouse boogie" - Living Blues


    Несмотря на то, что гитарист Майкл Кэйтон выпускает альбомы с 1984 года, у себя на родине в Америке он известен мало.
    В то же время он добился определенной популярности в Европе, где его диски выпускает голландская фирма Provogue. Кэйтон
    родился в музыкальной семье и освоил гитару еще тинэйджером. Проведя почти 20 лет в качестве гитариста в составе различных
    гаражных и рок-н-рольных групп, Майкл в конце концов осел в небольшом городишке по имени Hell (по нашему - Ад) в штате
    Мичиган, соорудил в подвале домашнюю студию звукозаписи, создал лейбл Wild Ass Records и начал записывать там свое "адское
    буги".


    Майкл сам себе композитор, сам себе певец, музыкант и продюсер - он самостоятельно клепает "на коленке" альбомы прямолинейного
    кондового блюз-рока без особых претензий на оригинальность. Его музыка представляет собой смесь гитарного блюз-рока, тяжелого
    рок-н-ролла, буги и хард рока - просто, но энергично, мощно, жестко и довольно однотипно (если понравится один диск Кэйтона,
    то скорее всего и остальные тоже покатят). Такая музыка находит своего слушателя, и в результате в июне 2014 года Майкл
    был принят зал славы рок-н-ролла штата Мичиган.


    Диск МК вполне репрезентативен для творчества Майкла - он написал и записал весь материал у себя в студии, он же и продюсировал.
    Альбом для тех, кто любит громкий мощный гитарный саунд, хриплый вокал и техничное исполнение без особых композиторских
    изысков.'
