- id: 57
  author: Алексей Калачев
  mark: 6
  date: '2002-12-17'
  text: Отменный буги-рок, плотнющий гитарный звук, свирепый хриплый вокал. Как мы могли его просмотреть?! Кэтон – невоспетый
    герой блюзового бума 90-х. Тысячи людей сходят с ума по Джоржу Торогуду и Пету Треверсу, а Майкл остался на обочине. Причина
    сугубо техническая, от чего не менее досадная. Названные гитарные монстры хлынули к нам в массовом количестве из Америки
    в районе 1993-94 годов в виде пластинок фирмы "Блюз Бюро". На рынке блюз-рока они в купе со Стиви Рэем создали монополию.
    Майкл Кэтон, будучи американским блюз-слингером до мозга костей, издавал свои опусы на маленьком  европейском лейбле,
    и ходу сюда не имел. Вот и вся история. Теперь, когда страсти-мордасти схлынули, прежние кумиры приелись, мы оглядываемся
    в поисках новых имен. И - находим.
