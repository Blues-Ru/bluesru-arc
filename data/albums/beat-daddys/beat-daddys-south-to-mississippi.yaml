- id: 1835
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-02'
  text: 'Третий альбом мастеров южного рока и блюза, на котором к базовому дуэту харпера и вокалиста Лэрри Гришема и гитариста
    Томми Стиллуелла присоединилась ритм-секция и духовая секция студии Muscle Shoals (на которой был записан этот и предыдущий
    альбомы коллектива).


    Материал бОльшей частью собственного сочинения, в музыкальном плане существенных перемен по сравнению с предыдущим диском
    не произошло: группа играет слегка коммерческий мелодичный южный рок на блюзовой основе, украшенный духовыми и женским
    бэк-вокалом. Диск вполне приличный и понравится многим.'
