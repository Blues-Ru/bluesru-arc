- id: 1834
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-06-02'
  text: 'Второй сольный альбом мастеров южного рока и блюза из Индианы представляет собой слегка коммерческую смесь традиционного
    рока, блюза и южного рока с примесью фанка. Возглавляемая харпером и вокалистом Лэрри Гришемом группа прославилась своими
    мелодичными балладами, украшенными эпизодическим соло саксофона, а также быстрыми номерами, оттененными духовой секцией.
    За исключением первого трека весь материал авторский.


    Исполнение энергичное и профессиональное, музыка приятная, вокал красивый - в общем, вполне достойный альбом.'
