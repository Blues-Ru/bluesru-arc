  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-06-02'
  text: 'Последний на данный момент студийный альбом мастеров южного блюза вышел с заметным перерывом после предыдущего студийника
    Delta Vision. Ураган "Катрина" нанес жестокий удар по имуществу фронтмена группы Лэрри Гришема, лишив его не только дома,
    но и накопленной за многие годы коллекции памятных вещей, связанных с деятельностью группы, равно как и текстов множества
    новых песен.


    Однако недаром говорится, что "блюз - это когда хорошему человеку плохо". Такой удар судьбы и вынужденная жизнь в трейлере
    пробудили творческие способности Лэрри, открыв ему новый взгляд на мир. С поддержкой старого коллеги и друга Бритта Мичема
    он записал, пожалуй, самый интересный альбом за всю карьеру коллектива, сочинив лично и в соавторстве все песни с альбома.
    Среди гостей - бывший органист Allman Brothers Джонни Нил.


    По словам критика журнала Gritz Magazine, группа играет "блюз с большой долей художественной креативности. Добротный материал,
    от начала и до конца." И с этим трудно не согласиться.'
