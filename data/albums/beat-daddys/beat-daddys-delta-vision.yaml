- id: 1836
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-02'
  text: 'Четвертый студийный альбом блюз-рокеров из Индианы, записанный после заметного перерыва. Лэрри Гришэму (вокал, гармоника)
    помогает талантливый гитарист Бритт Мичем, заслуживший прозвище "американского Эрика Клэптона".


    Материал полностью авторский, музыка представляет собой коктейль из блюза и американского рока с примесью фанка. Название
    диска говорит само за себя, ибо в основе музыки лежит блюз дельты. Сыграно профессионально, качественно и мелодично. Рекомендуется
    любителям современного южного блюза с легкой долей коммерции.'
