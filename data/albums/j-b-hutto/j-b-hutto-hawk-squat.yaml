reviews:
- id: 809
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-13'
  text: 'Энергичный Чикаго-блюз под руководством Хатто - он поет и играет на слайд гитаре. На пианино и ОРГАНЕ - Саннилэнд
    Слим - прекрасный аккомпаниатор и коллега. Еще в составе - ударник, басист и саксофонист. Голос Хатто пронзительный и
    кричащий, но приятный и, местами, забавный. Его игра на слайд-гитаре рваная и острая - звучит очень ярко и вызывающе.


    На диске 12 блюзов на 49 минут, запись отличного качества для тех лет. Этот альбом просто необходим для любителей Чикаго-стиля.
    Удивительно, но это первый альбом артиста, а ведь ему было уже 42 года, когда он увидел свет.'
