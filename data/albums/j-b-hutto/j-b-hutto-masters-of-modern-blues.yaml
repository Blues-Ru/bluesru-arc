- id: 1516
  author: Сергей Исправников
  mark: 9
  date: '2009-04-05'
  text: 'На втором выпуске серии "Мастера современного блюза", вышедшего на лейбле Testament в 1967 г., продюсер Pete Welding
    издал незаурядного чикагского слайд-гитариста, ученика и последователя Элмора Джеймса, J.B.Hutto. Родившийся то ли в 1926
    г. в Южной Каролине, то ли в 1929 г. в Джорджии, Joseph Benjamin Hutto на волне массового переселения в 1949 г. переехал
    в Чикаго. Первые записи были сделаны им в 1954 г., а затем лет десять в студии звукозаписи его никто не приглашал и, соответственно,
    не записывал. Как и большинство черных блюзменов Джей-Би был клубным музыкантом и представленные здесь треки отражают
    атмосферу его живых выступлений, демонстрируя слушателям довольно сырой и агрессивный чикагский блюз. Как продюсер, Welding
    стремился добиться здесь не столько чистоты звучания, сколько аутентичности. Безусловно, не было и речи, чтобы включить
    сюда элементы фанка и соул или хотя бы усилить запись духовой секцией. Аккомпанирующая группа составляла квартет звезд
    чикагского блюза той поры: Johnny Young – 2-я гитара, Big Walter Horton – губная гармоника, Lee Jackson – бас, Fred Below
    – ударные. Название "The Hawks" ("Ястребы") она получила по аналогии с одноименным составом, аккомпанировавшим Hutto в
    начале 50-х.


    Настоящий альбом в полной мере отражает своеобразие музыкального дарования J.B.Hutto, как эмоционально выразительного
    певца и оригинального слайд-гитариста. Запись проходила в июне 1966 г. в чикагской One-derful Studios. Среди аккомпанирующих
    музыкантов особенно выделялся Уолтер Хортон. С Джей-Би он начал регулярно играть года с 1965, когда тот стал выступать
    в "Turner''s", небольшом питейном заведении в чикагском Sought Side, недалеко от дома Хортона. После того, как они начали
    играть вместе, их выступления стали настоящим событием в музыкальной жизни Чикаго тех лет. В оригинальный альбом, оказавшийся
    первой долгоиграющей пластинкой Hutto, вошли десять треков. Частично это были блюзовые стандарты, такие как "Dust My Broom"
    Роберта Джонсона или "Goin'' Down Slow" Джимми Одена. Авторский материал Hutto включал лирические композиции, в основном,
    посвященные им своей жене – "My Kind Of Woman", "The Girl I Love". Включенные в компакт-диск бонус-треки – "Wild Wild
    Woman" и "Bluebird" – были записаны тогда же, но первоначально оказались изданы на сборнике "Goin'' To Chicago".'
