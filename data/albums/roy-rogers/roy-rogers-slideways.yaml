  author: Константин Колесниченко
  mark: 7
  date: '2007-11-27'
  text: 'Рой Роджерс - известен своим участием в качестве продюсера и гитариста на
    последних альбомах John Lee Hooker, дуэтом с Нортоном Буффало, а также виртуозным
    владением слайд-гитарой. Последнему он и посвятил полностью инструментальный альбом
    c говорящим названием "Slideways". Некое чувство меры и вкуса отказало Роджерсу
    и в целом альбом граничит с чем-то нехорошим. Но несколько действительно прекрасных
    мест на этом диске есть, это: "Talking Walls", "Gumbo Funk" и в основном, композиции,
    где участвует его друг, виртуоз в игре на губной гармонике, Нортон Буффало.'
