  date: '2011-11-16'
  text: 'Wolfpin - блюз-роковое power trio из Голландии, созданное талантливым гитаристом
    Марселем Шерпензеелем. Марсель начал играть на гитаре в 12 лет, а к 21 году уже
    сформировался в качестве профессионального исполнителя. Участие в группе Рори
    Галлахера наложило отпечаток на музыку молодого гитариста, который также играл
    в ряде других коллективов и участвовал во многих блюзовых фестивалях. С группой
    Wolfpin он записал один ЕР, два студийных и один концертный диск на локальных
    лейблах, и наконец в этом году вышел их дебют на международной фирме.


    Трио Марселя играет мощный блюз-рок, уходящий корнями в 70-е, и определенно носящий
    отпечаток музыки Рори Галлахера и Джими Хендрикса, а также южного американского
    рока. Хорошая гитарная техника и интересный вокал, а также мощная ритм-секция
    наверняка обеспечат данному диску успех среди любителей тяжелого блюз-рока.'
