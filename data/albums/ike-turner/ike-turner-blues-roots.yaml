  author: Дмитрий Казанцев
  mark: 9
  date: '2005-11-29'
  text: '<img src="http://www.ljplus.ru/img/d/r/dr_nick/ike01.jpg" width=200 height=200 alt=''54,74 КБ''>


    Блюз, ритм-н-блюз, Мемфис-блюз, иногда чуть фанки. И все это без попсового звучания и аранжировок. Айк прекрасно поет
    и играет на соло-гитаре. С ним его лучшие люди, но здесь нет акцента на духовые или клавиши, вокал и БЛЮЗ тут главное.


    На диске 12 песен, многие из них очень известные: "The Things That I Used To Do", "Lawdy Miss Clawdy", "Think", "That''s
    Alright (Who''s Loving You Tonight)", "My Babe". 4 песни написал сам Айк - они очень хороши; я считаю, что Тернер велик
    именно как автор, продюсер и аранжировщик.


    Давно не получал такого удовольствия; какое разнообразия и какие эмоции! Этот диск понравиться как любителям блюза, так
    и соулстерам/фанкерам (хотя фанка тут совсем чуть).'
