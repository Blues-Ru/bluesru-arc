- id: 1177
  author: Константин Колесниченко
  mark: 7
  date: '2007-12-13'
  text: 'Людям, не особо сведущим или без интереса относящимся к музыке, прежде всего
    известна Тина Тернер, по ТВ ее часто называют "бабушкой рока" и прочими пафосными
    именами. Имя Айка всплывает же, при упоминании о его жестоком обращении с Тиной
    и ничего не говорится о его заслуженных почестях, как пионера рок-н-ролла (Rocket
    88), фанка, соула и довольно известного блюзового музыканта. У Айка самая настоящая
    блюзовая судьба и известность, например, при внесении имен семейства Тернеров
    в "Зал Славы Рок-н-Ролла" он отбывал срок в тюрьме и не смог присутствовать на
    церемонии.


    Альбом "Rising With The Blues" (получил Грэмми) - является как бы ретроспективой
    Тернеровского музыкального пути. Блюз, джамп (с отличными духовыми), фанк, госпел
    - вобщем, жанры истинно "черной" музыки соединены на этом диске. Не смотря на
    свой преклонный возраст, музыкальные способности Айка, на альбоме, все еще на
    высоте: резкий вокал, острая гитарная игра и отличное владение клавишными инструментами.
    Единственной моей претензией к "Rising With The Blues" является неважный звук
    на некоторых композициях, с каким-то отголоском 80-х в работе ударных, баса и
    синтезатора.


    В одном из фильмов цикла Мартина Скорсезе о блюзе Сэм Филиппс делает шуточное
    замечание о том, что Бог хорошо сохранил Айка для его возраста. К сожалению, вчера
    Айка Тернера не стало. Он умер во сне.'
- id: 1493
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: 'Дебошир, наркоман, тюремный сиделец и черный Дон Хуан и женоненавистник...
    "Иисус меня любит, а что там говорят другие – мне все равно", - скрипучим голосом
    поет этот великий революционер поп-музыки в альбоме, которым он отметил свое 75-летие.
    Суровый взгляд на мир отражается во всех песнях: никаких слащавых "I Love You".
    Женщины – лишь повод для ехидных шуточек. Гитарные соло лаконичны и едки. Бугивужные
    пробеги по клавишным стремительны. В музыкальном наборе – блюзы, соул и фанк,
    немного джаза. Юбилейный альбом записан без единой приглашенной "звезды". Тернер,
    как король горы, не терпит никого рядом с собой (кроме аккомпаниаторов). Альбом
    получился ярким, энергичным и, при стилевом разнообразии, очень цельным. И абсолютно
    заслужено был удостоен премии "Грэмми", как лучший альбом традиционного блюза
    2006 года.'
