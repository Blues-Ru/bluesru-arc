- id: 956
  author: Дмитрий Казанцев
  mark: 4
  date: '2006-01-10'
  text: 'Очень странный диск. Записан в Германии и немного в Калифорнии. Живые барабаны только в паре треков, но при этом
    орган Хаммонда и шикарные гитары Айка. Куча женских вокалов и музыка в различных стилях: блюз, диско, современный р-н-б,
    соул и фанк. Но все это почти плохо с программингом. Голос Айка хорош, дамы поют прекрасно (но не их же мы тут собирались
    слушать), песни тоже прекрасные, но что же за мешанина в голове у Айка и в продюсерстве.


    Просто сделано все в Европе - вот ответ. Фирма Mystic Records - это Англия; продюсеры, музыканты и инженеры из Германии.
    Самое страшное то, что подобный звук был уже и НЕ МОДЕН в 1996 году (а уж тем более в 1998-ом, когда этот диск появился
    в продаже во многих странах).


    Здесь есть несколько блюзов: "5 Long Years", "My Babe", "Sweet Black Angel", "Early One Morning"; удивительно, как они
    вообще попали в этот альбом. А название альбома? Совсем странно. И еще один удивительный момент - здесь есть песня "Sexy
    Ida", которую написала Тина Тернер. Зная их отношения после распада дуэта в середине 70-х, это очень необычный факт.'
