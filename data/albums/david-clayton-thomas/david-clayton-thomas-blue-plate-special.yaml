  author: Андрей Евдокимов
  mark: 5
  date: '2003-12-04'
  text: 'В буклете сообщается, что Д.К-Т давно мечтал записать такой альбом - весь блюзовый. Жаль, что он не записал его раньше.
    Похоже, к моменту записи страсть уже перегорела.


    Звучит музыка, типичная для белого блюзового клуба - то есть, чисто, прохладно-отстранено; и почти все это можно услышать
    на пластинках в несравненно более ярком неавторском исполнении. Недоработанные аранжировки портят впечатление, особенно
    если сравнить записи этого же вокалиста с Blood, Sweat & Tears, которые и принесли ему первую широкую известность. Д.К-Т
    - гитарист не блестящий, а пригласить на запись гитариста лучше, чем сам - мужества не хватило. Браться за "Хучи-Кучи",
    если не можешь добавить ничего нового к игранному-переигранному стандарту - вообще моветон. Записывать нейтральный вариант
    не менее заезженного блюзового шлягера Hard Times Рея Чарлза вовсе не имеет смысла - он ничего не прибавляет к огромному
    количеству уже записанных. Само по себе пришепетывание не придает исполнению индивидуальности.


    С другой стороны - эта работа профессионала. Пусть глубоко не вспашет, но и борозды он не испортит и голос хорош, и владеет
    им мастерски. Из самого интересного в альбоме - обработка собственного шлягера Д.К-Т "Lucretia MacEvil" в ритме рег-тайма;
    блюз Алберта Коллинза "Too Many Dirty Dishes"; малоизвестная тема Фредди Кинга "Woman Across The River", выполненная точно
    в стиле арт-блюзов "Blood, Sweat & Tears". И собственного сочинения новая песня - Wish The World Would Come To Memphis
    - искреннее признание в любви к одной из блюзовых столиц. Последняя песня весьма рекомендуется в репертуар молодым блюзбэндам:
    и тема хорошая, и песня малоизвестная, и - простор для вариаций.'
