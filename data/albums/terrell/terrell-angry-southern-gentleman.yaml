- id: 489
  author: Сергей Колобашкин
  mark: 10
  date: '2004-03-12'
  text: Тэррелл в очередной раз доказал, что он может играть классный блюз. Это его второй альбом, который в себе несет некую
    концептуальность, что добавляет интереса к прослушиванию. Самое интересное - это отсутствие той самой попсовой лажи, которую
    многие музыканты вытащили из себя в начале девяностых. Это интересная пластинка, состоящая из двенадцати песен; легко
    слушается, без лишнего напряга. Иногда встречаются какие-то намеки на кантри и на южный рок, но во всем остальном - это
    отличный белый блюз. Особо мне понравились песни "let's Go For A Ride", "Strawdogs", "Dreamed I Was A Devil" - все идут
    одна за другой, отлично дополняя друг друга. "New Hope" - это еще одна клевая песня. Очень сильно запомнилась песня "Come
    On Down", которая из себя представляет легкую балладу типа Боба Дилана и очень красиво завершает альбом. Вообщем, недочетов
    тут нет. Кому-нибудь он может показаться скучным, я лично так не считаю, эта пластинка заслужила твердую пятерку!
