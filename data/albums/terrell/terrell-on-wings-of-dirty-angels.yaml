- id: 488
  author: Сергей Колобашкин
  mark: 9
  date: '2004-03-12'
  text: Уроженец Техаса Тэррелл заявил о себе его работой "On The Wings Of Dirty Angels" в 1990 году, собственно говоря, в
    этом году и дебютировал! Этот альбом является отличным примером того, как надо играть настоящий блюз-рок. Совершенно чумовая
    песня "On The Wings Of Dirty Angels" начинает этот альбом. "Shoutin' Ground" - это еще один трек, который держет слушателя
    в жутком напряжении, не дает остыть. "Women" - это одна из тех песен, котрая одновременно режет и радует слух. Вообщем
    говоря, это - отличный альбом для прослушивания. Я лично рекомендую и ставлю 4 с плюсом.
