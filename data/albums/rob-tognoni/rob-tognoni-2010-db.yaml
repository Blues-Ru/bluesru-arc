- id: 2006
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-11-16'
  text: 'А вот и очередной релиз от австралийского блюз-рокера. Собственно, название
    диска говорит само за себя: это утяжеленный блюз-рок вперемешку с хард-роком и
    тяжелым рок-н-роллом, но есть и приятные неожиданные добавки (как, например испанский
    привкус в Another Tequila - роскошная вещь получилась в результате). Думаю, это
    лучший альбом Роба за всю его карьеру, а главное, музыкант, очевидно, растет и
    не останавливается на достигнутом.'
