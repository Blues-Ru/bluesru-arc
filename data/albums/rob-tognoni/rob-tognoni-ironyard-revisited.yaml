- id: 2007
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-11-16'
  text: 'Записанная в 2008, но изданная в начале 2009 года, данная работа австралийского мастера шести струн как обычно у
    Роба находится где-то ближе к хард-року, хотя и с блюз-роковым привкусом. БОльшую часть песен Роб записал только с помощью
    ударника, отыграв самостоятельно партии всех гитар и клавишных. Диск дополнен 3 бонусными концертными треками и одним
    акустическим инструменталом и играет почти 80 минут.


    Технично, профессионально, но - на любителя :-)'
