- id: 1358
  author: Константин Колесниченко
  mark: 7
  date: '2008-11-05'
  text: 'Новый Орлеан для блюза город, по значимости, не меньший, чем Чикаго или Мемфис. Блюз родом из Луизианы особенный
    – он мягкий, синкопирующий, пропитанный музыкой Cajun и Zydeco. У этого стиля есть свои культовые фигуры: пианисты Professor
    Longhair и Dr. John, аккордеонист Clifton Chenier. Музыка их проверена временем. Marcia Ball - непоследняя фигура в этом
    жанре, недаром Клинт Иствуд поместил в свою часть кино-эпопеи о блюзе Мартина Скорсезе интервью с ней. Альбом "Peace,
    Love & BBQ" - первый после 5-летнего перерыва в ее студийной дискографии и практически сразу после выхода он занял 1 место
    в блюзовом рейтинге такого авторитетного издания, как Billboard. На мой взгляд, ключ к успеху этой записи лежит в умелом
    сочетании замечательной музыки Нового Орлеана и лирики, рассчитанной на взрослую аудиторию. В своих песнях Marcia пытается
    быть близкой к людям, потому в них звучат слова вроде "Well I look around and I see a whole lot of people just like me
    having hard times…". Безусловно, за всей этой лирикой и проблематикой лежит очень качественная работа музыкантов: тут
    и знаменитый Cindy Cashdollar играет на lap steel, замечательные аккордеонисты Wayne Toups и Terrance Simien, и куда же
    в подобной записи без Dr John''a! Вообще, в записи альбома принимало участие довольно большое количество разных музыкантов,
    потому и музыка вышла довольно разноплановой от типично новоорлеанский композиций вроде заглавной "Peace Love And BBQ",
    до "Where Do You Go?" исполненной в манере госпел музыки, а заканчивает альбом жизнеутверждающая песня Билла Уизерса "I
    Wish You Well".'
- id: 1927
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-05'
  text: 'Марша Болл - пианистка, певица и композитор, она исполняет очень специальный вид американского блюза - так называемый
    swamp blues.


    Она записывается уже почти 20 лет и успела получить блюзовую премию за лучший блюзовый альбом 2002 года, номинацию на
    Грэмми в следующем году, в 2004 получила премию за лучший альбом современного блюза, на следующий год - вновь номинация
    на Грэмми, в 2005, 2006 и 2007 году стала блюзовой пианисткой года. В общем, дама крайне титулованная и популярная в своих
    Соединенных штатах :-)


    Последний ее альбом, записанный на фирме Аллигатор, быстренько поднялся на 1 место в хит-параде блюзовых альбомов Биллборда,
    и довольно прочно там обосновался. Что же есть в ее музыке такого, что гарантирует коммерческий успех? А там всего понемногу
    - немного блюза, немного джаза, немножко быстрых номеров, немножко слезных баллад, изрядная доля эстрады и бесспорный
    профессионализм исполнителя. В общем, я бы назвал ее Норой Джонс от блюза. На мой вкус, эта музыка слишком эстрадная и
    коммерческая, но, безусловно, отменного качества.'
