  date: '2011-07-05'
  text: 'Пятый сольный альбом пианистки, певицы и композитора из Остина, штат Техас,
    которая прославилась исполнением смеси техасского и луизианского блюза с примесью
    буги-вуги, кантри и поп. Марша Болл неоднократно получала награды блюзовых критиков
    и как исполнительница, и как автор блюзовых альбомов (правда, этого она добилась
    уже в середине 90-х и позднее).


    Альбом 1989 года - стопроцентный хит музыки для вечеринок, на котором быстрые
    зажигательные номера чередуются медленными чуть слащавыми балладами. Кроме собственно
    блюза тут нашлось место и для кантри, и для рок-н-ролла, и для хонки-тонк. Материал
    в основном авторский, хотя имеется и 4 кавера. Помогали при записи такие блюзовые
    гранды, как Марк Казанофф (саксофоны), Лу Энн Бартон и Анжела Стрели (бэквокал).


    В целом - очень приличный альбом эстрадного свамп-блюза, динамичный, зажигательный
    и профессионально сыгранный, с хорошими аранжировками. Один из лучших у Марши
    (а может, и самый лучший!).'
