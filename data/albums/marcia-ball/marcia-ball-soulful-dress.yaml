  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-05'
  text: 'Первый альбом Марши Болл на сравнительно крупном звукозаписывающем лейбле
    Rounder Records наглядно демонстрирует, с чего начиналась карьера будущей обладательницы
    престижных премий и топовых блюзовых альбомов. Выпущенный исходно на виниле, альбом
    королевы луизианского фортепиано был в 1989 году переиздан и на CD.


    Диск вполне приличный - заводной, энергичный, хорошо аранжированный и исполненный.
    Кроме неплохо исполненных каверов блюзовой классики есть на нем место и для трех
    собственных композиций Марши. Помимо блюза и луизианского свамп-блюза, нашлось
    место и для буги, и для хонки-тонка. При записи соло на первом треке отметился
    сам Стиви Рэй Воэн, а с саксофонами помог знаменитый в будущем Марк Казанофф.
    И хотя впоследствии Марша записала более сильные диски, этот альбом вполне достойный.'
