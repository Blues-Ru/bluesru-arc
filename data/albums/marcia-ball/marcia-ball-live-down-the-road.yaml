- id: 1395
  author: Андрей Евдокимов
  mark: 6
  date: '2008-12-29'
  text: Одна из самых честных концертных записей за последнее время! Ни малейшего стремления сгладить клубное звучание под
    домашний кинотеатр. Ни одной попытки сделать аранжировки более сложными, нежели они годятся для группы, переезжающей каждую
    ночь из одного города в другой. Очевидцы давно говорили, что клубные выступления Марсии Болл производят гораздо большее
    впечатление, нежели ее студийные работы. Наконец-то этим словам нашлось документальное подтверждение. И то – случай помог.
    В сентябре прошлого года один из кабельных каналов транслировал клубный концерт Марсии Болл. Рейтинг убедил, что запись
    стоит растиражировать. Возможно, DVD был бы более убедителен, но и на аудионосителе эта музыка звучит зажигательно. По
    стилю здесь нет ни одного блюза. Это техасско-луизианская бодрая музыка для горячих вечеринок, и тоску она прогоняет сразу.
    На рояле Болл играет грубовато, но это вполне списывается в общий стиль. В "Любовь приносит боль" ей составляет дуэт давняя
    партнерша по техасской сцене Анжела Стрелли. Почти половина песен – сочинения Болл, и она демонстрирует, как можно сочинять
    яркие оригинальные мелодии, придерживаясь рамок традиций.
