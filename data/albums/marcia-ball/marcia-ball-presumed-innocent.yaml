  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-05'
  text: 'Пианистка, певица и композитор Марша Болл, о которой я уже рассказывал ранее, пожалуй, самая известная исполнительница
    коммерческого свамп-блюза (и уж наверняка самая титулованная).


    На данном альбоме, который поднялся до 4 места в топе блюзовых альбомов Биллборда, она представила традиционный коктейль
    из коммерческого блюза, буги-вуги, кантри, джаза и просто эстрады. Это первый альбом Марши для фирмы Аллигатор, при записи
    помогали такие звезды, как Делберт МакКлинтон (дуэт), Марк Казанофф (саксофоны и аранжировки духовых), а также Сонни Ландрет
    (слайд-гитара на паре треков). Собственного материала чуть меньше половины, остальное - каверы. Let the Tears Roll Down
    - стопроцентный хит.


    Добротный альбом традиционного эстрадного свамп-блюза с отличными аранжировками и высокопрофессиональным исполнением -
    один из лучших у Марши. Альбом продержался 7 месяцев в блюзовом чарте Билборда и в 2002 году получил высшую блюзовую награду
    W.C. Handy за лучший блюзовый альбом года.


    "A stellar collection of R&B and blues..her best vocal performance to date. Strikes a fine balance between polished performance
    and true grit, capturing the totality of Marcia Ball like no previous album" - BILLBOARD


    "Rollicking, good time blues and intimate, reflective balladry..her songs ring with the truth of experience" - ROLLING
    STONE'
