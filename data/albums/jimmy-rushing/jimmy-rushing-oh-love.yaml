- id: 877
  author: Константин Колесниченко
  mark: 8
  date: '2005-10-01'
  text: Jimmy Rushing – это главный конкурент Big Joe Turner среди первых шаутеров,
    прозванный "Мистер 5 на 5" за свои немалые габариты. Певец, чья манера исполнения
    повлияла на таких музыкантов как Joe Williams, Jon Hendricks, Jimmy Witherspoon.
    Он относится к той категории блюзовых певцов, которые исполняли свой репертуар
    с музыкантами хот джаза. Он пел в ансамбле Count'a Basie, ему аккомпанировали
    Lester Young, Coleman Hawkins, Buck Clayton, Benny Moten итд т.е. те джазовые
    музыканты, в основе музыки которых лежал блюз. Этот сборник составлен из трех
    альбомов Rushing'a записанных в 1956 и 58 годах. Аккомпанируют ему на записях
    музыканты, входившие в оркестры Duke Ellington и Count Basie, они прекрасно дополняют
    мощный, несколько лукавый и мяукающий вокал. Начинается альбом композицией "Boogie
    Woogie" (одна из самых известных ее версий - это "T-Bone Boogie"), вторая композиция
    – это известная тоже в исполнении T-Bone Walker "I Want a Little Girl", третьей
    идет "How Long" блюз Leroy Carr итд, Rushing продолжает исполнять классику блюза
    и джаза тех лет. Если Вам интересно, откуда растут ноги практически у всех современных
    музыкантов, исполняющих West Coast Blues, – послушайте вот эти классические записи.
