  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-11-16'
  text: 'Блюз из Швеции, и очень приличного уровня, замечу Вам :-)


    Группа создана участниками различных шведских блюзовых коллективов, которые решили записать музыку в стилистике чикагского
    и луизианского блюза 50 - 60х годов прошлого века. Получилась отменная стилизация в традиционном стиле, исполненная профессионально
    и качественно.'
