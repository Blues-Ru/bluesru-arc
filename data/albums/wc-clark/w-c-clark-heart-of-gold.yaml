  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-08-11'
  text: 'Один из лучших альбомов (а по версии AMG так и просто лучший) блюзового ветерана
    из Остина, умело сочетающего в своем творчестве техасский блюзовый стиль игры
    на гитаре с чувственным соул-вокалом.


    С аранжировками помогал знаменитый Марк "Каз" Казаноф, он же выступил и в качестве
    продюсера. Марк также руководил при записи духовой группой Kamikaze Horns, сам
    солировал на саксофонах и гармонике. Авторского материала ровно половина. Среди
    гостей отметилась ритм секция Стиви Рэя Double Trouble. Качественный альбом слегка
    коммерческого современного блюза с духовыми и примесью соул.'
