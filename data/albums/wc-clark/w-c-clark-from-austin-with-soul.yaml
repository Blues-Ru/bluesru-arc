  author: Камиль Ахмеджанов
  mark: 8
  date: '2018-04-12'
  text: Пятый сольный альбом W.C. Clark, но первый выпущенныйна фирме Аллигатор. Записывал альбом в Остине LarryGreenhill
    хорошо известный по работам с Willie Nelson. Прекрасная смесь техасского блюза с соул музыкой с вкраплениями фанка и госпел.
    Прекрасная игра на гитаре, вокал W.C. Clark излучает радость от исполнения на каждом трэке. Mark "Kaz" Kazanoff, отметился
    исполнением партий альт и тенор саксофонов, Marcia Ball на пиано и вокале. На данном диске продюссерами выступили BruceIglauer
    (основатель Аллигатор рекордс) и Mark "Kaz" Kazanoff. Дизайн обложки создал Kevin Niemiec (известный своим участием в
    дизайне альбомов Mavis Staples, TheHolmes Brothers, Michael Burks, Shemekia Copeland, Lil' Ed& The Blues Imperials, на
    Аллигаторе). Рекомендую всем любителям блюза, крепкая профессиональная работа.
