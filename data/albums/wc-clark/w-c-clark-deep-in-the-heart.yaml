- id: 1978
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-08-11'
  text: 'Последний (на сегодняшний день) альбом гитариста, певца и композитора из Остина, ветерана тамошней блюзовой сцены
    и наставника молодого Стиви Рэя Воэна - выпущен на фирме Аллигатор. Долгая карьера Кларка включала работу со многими звездами
    блюза и соул-музыки, включая работу гитаристом у Джо Текса (кавер песни которого легко узнают все любители Назарета),
    а также со Стиви Рэем в одной из первых групп по имени Triple Threat Revue. Вместе с клавишником Майклом Киндредом Кларк
    написал песню Cold Shot, ставшую визитной карточкой Стиви Рэя в начале 80-х. В середине 80-х Кларк начал записывать сольные
    альбомы, на которых сочетал мастерство гитариста и композитора.


    Данный альбом представляет собой техасскую прифанкованную смесь блюза и соул с легким влиянием годспел. Вот такой-вот
    очень коммерческий и очень профессиональный коктейль - настоящее лакомство для любителей современной соул-музыки. В записи
    помогали Марк Казанофф (гармоника, саксофоны), Марша Болл (пиано и два дуэта), а также духовая секция.'
