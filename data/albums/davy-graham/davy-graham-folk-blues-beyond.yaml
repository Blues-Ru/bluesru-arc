reviews:
- id: 1002
  author: Александр Панин
  mark: 8
  date: '2006-05-05'
  text: Поразительное разнообразие жанров и стилей! Фолк-блюзовые композиции Ледбелли,
    Гэри Дэвиса, Биг Билла Брунзи, народные норвежские, английские, американские и
    марокканские мелодии. Песня Боба Дилана и на закуску "модерн блюз на шесть восьмых"
    Чарльза Мингуса. Все это записано в 1965-й год, самый расцвет музыки "британского
    вторжения", кто тогда в Англии слушал подобные диски? Гитарные партии Грэма временами
    просто шедевральны, а вот вокал звучит не очень эмоционально и даже можно сказать,
    что временами попросту безжизненно. Ряд треков исполняется с ритм-секцией, это
    уже звучит почти как фолк-рок! На оригинальной пластинке было 16 вещей, при переиздании
    на компакте добавили еще пять, датированных 1963-м годом, среди которых известная
    инструменталка Angi (здесь именно в таком написании). Все это очень интересно
    и познавательно.
