- id: 1181
  author: Константин Колесниченко
  mark: 8
  date: '2007-12-21'
  text: 'Нет, пожалуй, в блюзе фигуры более значимой, весомой, чем мистер Райли Б. Кинг, всем известный как Би Би Кинг. Его
    манера игры на гитаре, блюзовая судьба показательны и вдохновляют огромное количество музыкантов. Вот и Мэм Шеннон был
    таксистом, а стал блюзовым певцом и гитаристом. Я не утверждаю, что он хотел быть именно как БиБи, но что-то в этом есть,
    неправда ли? Но на такую мысль наталкивает прежде всего музыка (отличная смесь блюза, соул, фанка) и материал. "Why I
    Sing The Blues" да и слова "Open up the show for mr. BB King" - это уважение к своему музыкальному наставнику, не иначе.


    Гитарная игра Мема хороша, он не переигрывает, все очень четко и лаконично, но основным достоинством Шеннона я бы назвал
    вокал. Голос его - это нечто среднее между Bobby Blue Bland и Solomon Burke. Конечно, по фирменным штучкам, вроде хрипа
    и захлебываний Бобби или модуляций Берка, ему еще далеко до этих мастеров, но это всего лишь вопрос времени.


    Альбом Мема продюсировал знаменитый Dennis Walker, много работавший с Robert Cray, так что, как должна звучать такая музыка,
    он знает. К общему звучанию альбома приложили руку и знаменитые Memphis Horns.'
