- id: 1482
  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: Джон Гримальди никогда звезд с неба не хватал. Но и последним в длиной очереди
    гитаристов не был. Его настойчивость в следовании блюз-року достойна уважения.
    В нынешнем году он выпускает очередной альбом. Пожалуй, лучший его альбом за последние
    десять лет. Энергетика могучая, песни самостоятельны, ритм отличный. Слабым местом
    остаются вокал и оригинальность. Однако в скучном блюзовом мае этот альбом представляется
    самым актуальным. Работая в суровом формате трио, Гримальди успевает заполнить
    собой все слушаемое пространство и даже поднять на ноги те задницы, которые думали,
    что век блюз-рока давно миновал.
