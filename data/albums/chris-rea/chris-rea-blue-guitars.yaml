- id: 1200
  author: Артем Липатов
  mark: null
  date: '2008-01-29'
  text: 'Недавно мне довелось пересмотреть сборник старых клипов Криса Ри и фильм "Роковые выстрелы", в котором Ри сыграл
    главную роль. Такое ощущение, что тот весельчак с невозмутимым выражением лица, что в 1998-м выступал в Кремле, и глядящий
    на нас сегодня с афиш изможденный человек - две разных персоны. В сущности, так оно и есть.


    История, случившаяся с Крисом Ри, переводит все, что мы думаем о поп- и рок-музыке, в разряд "серьезного", того, о чем
    не принято говорить, но о чем невозможно не думать. Все началось в 2000-м, когда во время гастрольного тура у Криса случился
    приступ панкреатита. К тому же ему сообщили, что обнаружена опухоль, более того - есть шанс, что ему осталось жить всего
    48 часов. Умирать Ри не планировал, и эти 48 часов стали самым большим испытанием в его жизни.


    Он не умер, но поджелудочную железу, двенадцатиперстную кишку и почти половину желудка потерял. "В операционной мне привиделся
    мой давний кумир, великий блюзмен Блайнд Уилли Джонсон. И я понял, что если я сейчас умру, то не запишу то, к чему так
    давно готовился - свой блюзовый диск". Вот, оказывается, что заботило автора "Джозефины" и "В поисках лета"!


    Это было сродни религиозному опыту. Кое-как оклемавшись от хворей (понятно, что окончательно оклематься окончательно не
    вышло), Крис "Роуд ту Хелл" Ри окончательно распрощался с прошлым собой. Он записал самый честный и проникновенный свой
    альбом - (Dancing Down The) Stony Road, создав для этих целей собственный лейбл Jazzee Blue. Альбом этот вышел, что греха
    таить, очень личным и потому малопонятным для непосвященных (поэтому, кстати, для широкой дистрибуции часть треков пришлось
    выкинуть), а блюз у Ри получился отчасти ученическим и наивным - не было органичности, естественности, того, что присуще,
    скажем Питеру Грину или Эрику Клэптону. Но, повторюсь, это был честный альбом.


    Потом было еще несколько дисков - своих и чужих - выпущенных на своем лейбле, в том числе и The Blue Jukebox, на котором
    Ри смог создать удивительно точное ощущение одиночества в городе. Отсюда уже было рукой подать до блюза.


    И вот в истекшем году поклонники - и прежние, и нынешние, были поражены новинкой. Крис Ри выпустил альбом из 11 новых
    дисков. Это не укладывалось в голове. За год очень больной человек сочинил и записал материал, которого хватило на 11
    компакт-дисков. 137 композиций? Это, получается, песня в три дня? Непостижимо.


    Дело осложняется тем, что это - не просто 11 альбомов. Это - заново написанная Крисом Ри историю блюза, его любимого жанра.
    Это - стилизации разных стилей и направлений блюза. Из Африки, от песен гриотов, от магии вуду через деревенский блюз
    а-ля Роберт Джонсон, через Новый Орлеан, Техас, Мемфис, Чикаго - к соулу, кельтскому (!), латиноамериканскому блюзу… И
    ведь Ри говорит, что не успел осмыслить все, что было после 70-х годов прошлого века. Не хватает 12-го диска, сокрушается
    он. Впрочем, "даже если меня прикончит мой панкреатит, этот проект окажется "тем, что сделал Крис Ри".


    Оставим в покое сантименты, согласившись, что "этот проект" изданный в форме художественного альбома, (проиллюстрированного
    картинами самого Ри, на которых основным действующим лицом являются бесчиленные гитары синего цвета, от старенького "Хофнера"
    до "Стратокастера" - картинами, кстати сказать, симпатичными, но безумно вторичными) являет собой памятник силе человеческого
    духа, задумаемся - а что он представляет собой с точки зрения музычкальной? Пусть с точки зрения блюзовых историков, архивистов,
    исследователей результат вполне сопоставим с масштабом задуманного - что в сухом остатке? Только лишь безумно амбициозный
    и в то же время искренний, но опять неуклюжий, недоделанный, недо-блюз?


    И тут выяснится интересная штука: окажется, что, несмотря все-таки несостоявшееся проникновение в блюз, даром что все
    формальные признаки имеются, на каждом из 11 дисков есть как минимум три-четыре хорошие песни. Это не те песни, благодаря
    которым он прославился и имеет сейчас возможность тратить деньги на неприбыльные релизы (розничная цена комплекта в Европе
    не превышает 40 евро!), но это по-настоящему хорошие песни. А называть их блюзом или нет - личное дело каждого.


    Может быть, в этом и кроется настоящий блюз?


    P.S.12-м диском в комплекте идет уже издававшийся DVD о записи того, первого блюзового альбома Ри про каменную дорогу.
    Его стоит посмотреть - для того, чтобы понять, кем стал жизнерадостный "английский Спрингстин", почему он таким стал и
    как все это воспринимать. Тем более, что нынешним туром все еще очень нездоровый Крис Ри, похоже, закрывает и гастрольную
    историю, и даже блюзовую страницу - объявлено, что в конце нынешнего года он войдет в состав трио The Fire Flies. И что
    это будет, пока неизвестно…'
- id: 1208
  author: Артем Липатов
  mark: null
  date: '2008-01-30'
  text: 'История Криса Ри, жизнелюбивого человека и автора мягких поп-рок-баллад, перескочила из легкого жанра хорошей мужской
    сентиментальности в область чистой трагедии внезапно - в 2000-м. Во время гастрольного тура у артиста случился приступ
    панкреатита. Затем ему сообщили, что обнаружена злокачественная опухоль, более того - есть шанс, что ему осталось жить
    всего 48 часов. К счастью, он пережил эти ужасные двое суток и не умер, но поджелудочную железу, двенадцатиперстную кишку
    и почти половину желудка потерял. "В операционной мне привиделся мой давний кумир, великий блюзмен Блайнд Уилли Джонсон.
    И я понял, что если я сейчас умру, то не запишу то, к чему так давно готовился, - свой блюзовый диск". Кое-как оклемавшись,
    исхудавший Крис Ри оставил "Дорогу в ад" и действительно направился в сторону блюза. Его следующий альбом, Dancing Down
    The)Stony Road, выпущенный на специально созданном лейбле Jazzee Blue, получился очень личным и потому малопонятным для
    непосвященных. К тому же блюз у Ри вышел отчасти ученический и наивный - не было органичности и естественности, присущей
    ветеранам Питеру Грину или Эрику Клэптону. Дальнейшие попытки (в том числе The Blue Jukebox) были ближе к блюзу стилистически:
    тема одиночества человека в большом городе удалась Ри особенно хорошо. Но жанровой точности Крис добиться так и не смог.


    И вот в истекшем году поклонники были поражены новинкой. Ри выпустил альбом из 11 новых дисков. Это не укладывалось в
    голове. За год очень больной человек сочинил и записал материал, которого хватило на 11 компакт-дисков. 137 композиций?
    Это, получается, песня в три дня? Непостижимо. Дело осложняется тем, что это - не просто 11 альбомов, которые оформил
    сам музыкант, нарисовав маслом 11 полотен с синими гитарами в разных сочетаниях. Это - заново написанная Крисом Ри история
    блюза, его единственно любимого жанра. Это - стилизации разных стилей и направлений блюза. Из Африки, от песен гриотов,
    от магии Вуду, через деревенский блюз а-ля Роберт Джонсон, через Новый Орлеан, Техас, Мемфис, Чикаго - к соулу, кельтскому,
    латиноамериканскому блюзу И ведь Ри говорит, что не успел осмыслить все, что было после 70-х годов прошлого века. "Не
    хватает 12-го диска, - сокрушается он. - Впрочем, даже если меня прикончит мой панкреатит, этот проект окажется тем, что
    сделал Крис Ри".


    Проект, конечно, вполне может называться памятником силе человеческого духа, тем более что доподлинно неизвестно, как
    много из опубликованного материала было у Ри припасено в архивах, если было вообще. Однако каждый блюзовый критик, который
    посмотрит на собрание альбомов непредвзято, скажет, что проникновения Криса Ри в блюз так и не произошло - возможно, в
    его случае это вообще неосуществимо. Зато на каждом из 11 дисков есть как минимум три-четыре хороших трека. Это не те
    песни, благодаря которым он прославился и имеет сейчас возможность тратить деньги на неприбыльные релизы (розничная цена
    комплекта в Европе не превышает 40 евро!), но это по-настоящему хорошие песни. А называть их блюзом или нет - личное дело
    каждого.'
