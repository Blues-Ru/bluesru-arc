- id: 38
  author: Алексей Калачев
  mark: 9
  date: '2002-10-26'
  text: 'Внимание: это блюз! Особый "блюз Криса Ри". Крис – самый блюзовый из всех мегапопсовиков, и, наконец, обстоятельства
    позволили ему сделать максимально "черный", то есть проникнутый госпел и блюзом диск. Таким он был, между прочим, всегда.
    Достаточно вспомнить два факта. Первый - его главный музыкально-поэтический ментор – Чарли Пэттон. Второй – маниакальная
    преданность Криса "Стратокастерам", на которых он играет слайдом. Есть и масса других. … На моём проигрывателе "Stony
    Road" уже вторую неделю. Я бдительно отношусь к попыткам в упаковке с надписью "БЛЮЗ" подсунуть мне фальшивку, поэтому
    и слушаю внимательно. Нет, тут подвоха никакого. Красивый, честный диск. Крис Ри, оказывается, гитарист с изысканным вкусом…'
- id: 259
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'И что это за мода такая пошла среди звезд - записывать блюзовые акустические пластинки? В прошлом году Tony Joe White
    расстарался. Сочинив одиннадцать песен, загнал их все на один альбом - "The Beginning". Решил признаться в своей любви
    к блюзу (как будто раньше это было для кого-то секретом) и в итоге получил самую неудачную для себя в коммерческом плане
    работу. Chris Rea, также никогда не скрывавший своих музыкальных предпочтений, пошел по тому же пути, впервые за свою
    карьеру сотворив пластинку, которую невозможно раскручивать на хоть сколько-нибудь коммерческой радиостанции.


    Кстати, один любопытный момент. Rea впервые выпустил диск на независимом лейбле. По словам музыканта, это было сделано,
    дабы никто не оказывал давления на участников проекта при записи. Впрочем, есть подозрение, что все было не совсем так
    - просто ни одна из фирм-мейджоров не согласилась вкладывать деньги в очевидно некоммерческий альбом.


    Так что же такое "Stony Road"? Если коротко - двенадцать блюзов, написанных непосредственно Chris Rea, плюс баллада "Give
    That Girl", собственно, все того же автора. Дамам, влюбленным в низкий хриплый голос Rea, покупать "Stony Road" не советую.
    Разочаруются. Нет, не в голосе, а в музыке. Сложновата она для неподготовленного слушателя.'
- id: 306
  author: Кирилл Мошков
  mark: 6
  date: '2003-12-02'
  text: 'Интересная тенденция: то один, то другой деятель поп-роковой сцены 80-х в последние годы пытается обратиться к "подлинному
    блюзу". У кого-то это получается лучше, у кого-то хуже, у кого-то не получается вовсе. Крису Риа, который своего честного,
    "корневого" звучания не менял с самого дебюта в глуши Северной Англии в начале 1970-х (он сменил в местной никому не известной
    группе вокалиста Дэвида Ковердейла, нанятого в Deep Purple), такое освежение стилистики вряд ли было нужно, даже учитывая,
    что в последние пять лет его коммерческие достижения трудно было назвать впечатляющими. Впрочем, результат вполне убедителен,
    хотя и довольно однообразен: 13 крепких, плотных авторских композиций в блюзовой форме и безусловно британском (хотя и
    отмоделированном в мемфисском каноне) блюз-роковом звучании, пусть и украшенном всеми кунштюками современных технологий.
    Впрочем, альбом выпущен уже не на WEA, с которым были связаны наивысшие успехи музыканта, а на немецком поп-лейбле, что
    говорит о том, что Крис меняет поле, на котором хочет играть: именно в германоязычных странах Европы началась в свое время
    его популярность - задолго до того, как "The Road To Hell" возглавила британские хит-парады. Кстати, тур в поддержку этого
    альбома Риа начал в Швейцарии на эклектичном фестивале в Монтре, где богатая европейская публика обычно встречается со
    своими любимцами, списки которых могут поставить в тупик самого продвинутого американского слушателя.'
- id: 368
  author: Михаил Бирюков
  mark: null
  date: '2003-12-16'
  text: 'Все мы знаем Криса Ри очень давно, наслышаны и примерно представляем, что от него можно ожидать. Очень хорошо представляем.
    Джозефин, На бичу, Дорога к аду и пр.


    На неоднократно повторенную мысль, что на новом диске Крис Ри играет "корневой блюз", я бы отреагировал в том духе, что
    этого не может быть, оттого что не может быть никогда. Но это если б я диска не слышал. А теперь вот послушал, и вот что
    хочу сказать. Мнение свое я круто изменил с первыми звуками вступления первой песни. А ко второй половине альбома вернулся
    к нему снова.


    Крис Ри действительно пытается играть корневой блюз, старательно и изобретательно воссоздает его звуковую картину. И тут
    на его стороне многое. Он большой профессионал, он всю жизнь практически играет на слайд гитаре, он - это чувствуется
    - знает и любит жанр, до которого ныне дорвался. В частности, будто бы в подтверждение широты своей эрудиции он использует
    не только лежащий на поверхности гитарный кантри-блюзовый арсенал, но и фортепианный аккомпанемент будто б из традиции
    классического блюза а ля Бесси Смит, и банджо в духе Гаса Кэннона, задействует интересные шаффлы и т.д. и т.п.


    Но чем дальше, тем более скучно становится это слушать. Не то, чтоб имеет место быть провал или неудача - вот и музжурналисты
    выносят вполне почтенный вердикт. Просто это диск Криса Ри, и все тут. Любителям творчества Криса Ри его можно только
    рекомендовать; далеким от блюза, скажем так, меломанам - рекомендовать его можно и, мне кажется, нужно, авось появится
    интерес к той музыке, которой Крис Ри здесь подражает. И приятно им будет, и полезно. А мне вот, за себя скажу, не очень-то
    понравилось. Слайд-гитара, которую Ри здесь с таким упоением использует, к четвертой песне начинает раздражать, поскольку
    и меры и вкуса в ее использовании не хватает; гармонии вроде б и под блюз, а все же что-то в них слышится чужеродное.
    Вроде б и есть драйв, а вот уж он и потух. И чем дальше, тем более эти подробности становятся явны. В итоге получается
    как-то уныло, смурно и не то чтобы блюз, а именно подражание. Очень профессиональное, с большой любовью к предмету, не
    без интересных моментов, но тем не менее все же подражание.


    Так что со всей душой, видимо, рад бы Крис Ри в блюзовый рай, но нечто нажитое за всю предыдущую карьеру - не пускает.
    Что жаль, конечно. Ведь хороших блюзовых дисков, сыгранных хорошими музыкантами, знающими и любящими блюз, - много не
    бывает.'
