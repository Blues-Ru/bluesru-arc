  author: Леонид Аускерн
  mark: null
  date: '2003-12-02'
  text: '"Спасибо Господу Всемогущему за то, что он позволил этим песням высоко, подобно орлам, взлететь над блюзовым миром
    и достичь сердец всех подлинных любителей блюза," - так высокопарно открывает свой новый альбом гитарист и певец Рой Гэйнс,
    мощный здоровяк, внешне напоминающий ушедшего на пенсию боксера-тяжеловеса.


    Все двенадцать песен написал Гэйнс, сам или в соавторстве. Этому музыканту уже за шестьдесят, и теперь, после довольно
    долгого молчания, он решил суммировать в новой работе свои впечатления от самых разных блюзовых стилей. Изначально уроженцу
    Хьюстона вроде бы должен был быть особенно близок родной для него техасский блюз.


    Но в композициях данного альбома можно услышать не только острую гитарную игру, мощный вокал Гэйнса и жесткий ритм, но
    и переклички солиста с духовой секцией, и вибрирующий, тоскующий голос губной гармоники и клавишные импровизации. Кто-то
    услышит здесь элементы ритм-энд-блюза, кто-то - влияние блюза Дельты, и все при этом будут правы.


    Рой Гэйнс предлагает нам некий моментальный снимок, репортажный обзор современного американского блюза. Другой вопрос,
    что позиция автора в жанре репортажа не всегда заметна, но тут уже дело в его выборе и в его таланте...'
