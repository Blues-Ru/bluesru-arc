- id: 1437
  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: 'Антракт в 29 лет между записью первого и второго альбома требует от музыканта изрядной уверенности в себе. У "Маленького"
    (сейчас ему 65 лет) Литл Фредди ее хватает. Еще у него есть несколько отсидок и пять пулевых ранений. Но ни грозных, ни
    жалостливых блатных песен не ждите. Есть сельский миссиссипский блюз – лукавый, ироничный, добродушный, чувственный. Поется
    хрипло, на гипнотически повторяющемся одном аккорде, под неотразимый ритм. Сольно под гитару, но чаще с ансамблем. Как
    вся продукция Fat Possum, звучание – грубое, неотесанное, под стиль джюк-джоинтов. А два трека этого короткого альбома
    вполне могут попасть в "горячую ротацию": на них продюсер Matthew Johnson продолжил эксперименты по "диджейской" обработке
    записей корневых блюзменов, начатые им с R.L.Burnside. Но и без ремиксов и лупсов, Литл Фредди – очень даже danceable
    и актуален, и столь же архаичен и анархичен.'
