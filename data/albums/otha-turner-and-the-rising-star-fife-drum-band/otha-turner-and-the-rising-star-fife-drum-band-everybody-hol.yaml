  author: Александр Панин
  mark: 10
  date: '2005-05-20'
  text: 'Файф-энд-драм бэнд - совсем редкое ныне явление. По-видимому, таких ансамблей было много в Америке девятнадцатого
    века, до исторических "черных кодексов" (Black Codes), которые среди всего прочего, как пишет Роберт Палмер в своей книге
    Deep Blues, запретили бывшим рабам заниматься барабанными делами. Естественно, искусство пережило срок действия этих кодексов,
    но, по-видимому, в двадцатом веке широко распространенным уже не было, хотя в разные годы Алан Ломакс, Джордж Митчелл
    и Роберт Палмер записывали такие коллективы во время своих этнографических экспедиций.


    Ну а на этом диске почти целый час подобной музыки, записанной в девяностые (и опять же в глубинке). Типичный файф-энд-драм
    бэнд включает в себя следующие инструменты: тростниковая флейта (cane fife), один или два малых (рабочих) барабана (snare
    drums) и большой басовый барабан (bass drum). Естественно, можно еще сколько угодно петь :) Музыка, конечно, получается
    примитивная, но очень ритмичная и захватывающая. На нескольких треках вступает слайд-гитара, и получается потрясающий
    глубокий блюз! Все слушать очень интересно и познавательно.


    Оза Тернер прожил почти 95 лет и передал традицию, связанную с файф-энд-драм бэндами, своим детям и внукам.'
