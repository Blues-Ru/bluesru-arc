- id: 1320
  author: Андрей Евдокимов
  mark: 7
  date: '2008-07-20'
  text: Рядом с пламенными выкриками и глубокой блюзовой "отрыжкой" старинного джамп-блюза
    Бобби Блэнда, музыка "Рыжего простака" (Simply Red) всегда будет казаться изысканно-малахольной.
    Известие, что Мик Хакнэлл записывает "Дань уважение Бобби" повергло в шок обе
    стороны; почитатели сипловатого Хакнэлла спрашивали друг дружку "Что еще за Бобби",
    а знатоки хрипловатого Блэнда задавались вопросом, что же из этого может выйти.
    Вышло не так уж плохо. Блюзовые стандарты звучат в отнюдь не стандартных аранжировках.
    Музыка Блэнда смогла согреть голос Хакнэлла, пробудить в нем хорошую ритмическую
    энергетику. А нестандартно обыгрывать вокальные фразы он всегда умел. И характернейшие
    черты, сделавшие Simply Red богатым и знаменитым, проглядывают повсюду. Это самый
    интересный из его сольных альбомов. Не смотря на то, что под занавес он превратил
    страстную соул-балладу Lead Me On в нечто сопливо-хитпарадное.
