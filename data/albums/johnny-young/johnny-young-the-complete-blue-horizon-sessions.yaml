- id: 1175
  author: Дмитрий Казанцев
  mark: 9
  date: '2007-12-11'
  text: 'Все записи Джонни для английского лейбла Blue Horizon. Тут 16 песен - полностью альбом Fat Mandolin (1970) и много
    редких треков (есть повторы). Янг играет на гитаре и МАНДОЛИНЕ, с ним - прекрасный состав: Sammy Lawhorn (guitar), Otis
    Spann (piano), Paul Oscher (harmonica), S.P. Leary (drums).


    У Джонни мощный и эмоциональный вокал в духе Мадди Уотерса и Джуниора Уэллса, а его мандолина - это уникальная вещь в
    Чикаго-блюзе. Он, конечно, с юга, где блюз играли на банджо и мандолинах - этот кайф он принес с собой и в Чикаго.


    К сожалению, Янг умер в 1974 году, так и не купив себе дом (он всю жизнь мечтал об этом).'
- id: 1337
  author: Сергей Исправников
  mark: null
  date: '2008-10-05'
  text: 'В серии архивов фирмы Blue Horizon изданы записи блюзового певца, гитариста и незаурядного исполнителя на мандолине
    – Джонни Янга. Сразу необходимо отметить, что содержимое диска является одним из наиболее раритетных в серии – в формате
    компакт-диска эти треки издаются впервые, а оригинальная виниловая пластинка 1969 г. в свое время была продана в количестве,
    не превышающем 500 экземпляров. Что касается самой мандолины, то это, безусловно, не самый типичный для блюза инструмент.
    Она распространена в Старом Свете, особенно в средиземноморском регионе, где широко используется в фолк-музыке, а также
    встречается и в классике. В США инструмент получил распространение с середины XIX века, впоследствии ассоциировался, в
    первую очередь, с разновидностью кантри – стилем блюграсс. В начале XX века мандолина попала и в "черную" музыку, в частности,
    в блюз. Тем не менее, блюзовых записей с использованием мандолины в 20-х – 30-х гг. было сделано достаточно мало, а после
    войны этот инструмент среди блюзменов встречался не чаще, чем стиральная доска.


    В детстве Джонни Янг сначала попробовал свои силы в игре на губной гармонике, а затем переключился на гитару и самостоятельно
    освоил мандолину. Периодически выступая в 30-х гг. в Мемфисе и родном Виксбурге (Миссисипи), в 1940 г. Джонни в поисках
    лучшей доли переехал в Чикаго, где впоследствии познакомился с Мадди Уотерсом и первым Сонни Боем Уильямсоном. Начав записываться
    на синглах с конца 40-х, в середине 60-х гг. Янг сделал два блестящих альбома на лейбле Arhoolie в компании с такими звездами
    чикагского блюза, как Отис Спэнн, Джеймс Коттон, Уолтер Хортон. Когда в январе 1969 г. в Нью-Йорке для фирмы Blue Horizon
    проходила запись альбома Отиса Спэнна, обсуждался вопрос о возможности записать и Джонни Янга. Инициатива исходила от
    главы нью-йоркского отделения Blue Horizon – Seymour Stein, он выдвинул идею записать Янга и Викторию Спивей, когда они
    будут гастролировать на Восточном побережье. Запись, в конечном итоге, состоялась 5-го июня 1969 г. в O-D-O Studious в
    самом центре Манхэттена. Янгу аккомпанировали Paul Oscher (губная гармоника), Otis Spann (фортепьяно), Sammy Lawhorn (бас,
    2-я гитара) и S.P.Leary (ударные).


    С учетом того, что на альбоме с Янгом сыграла, по существу, группа Мадди Уотерса, записанная музыка стилистически следовала
    стандартам послевоенного чикагского блюза. В основном, был записан авторский материал самого Джонни. Дебютный трек "Moaning
    and Groaning" отсылает к 40-м гг., к творчеству Big Maceo Merriweather и трагически погибшего Джона Ли Уильямсона. Что
    касается последнего, то Джонни записал здесь один из его стандартов – "Jackson Bound" (в оригинале – "Shotgun Blues").
    В других треках чувствуется влияние Мемфис Слима – медленных блюзах "Heard My Doorbell Ring" и "Lend Me Your Love". Однако
    основной ценностью альбома является виртуозная игра Янга на мандолине, хотя выступал он все же чаще именно с гитарой,
    которой он также уделил здесь внимание. Еще в середине 60-х продюсер и исследователь блюза Pete Welding заметил интересную
    вещь – начиная с 40-х годов стиль игры на мандолине (в отличие от гитарной техники) у Джонни практически не изменился.
    В связи с этим альбом дает возможность услышать звучание чикагского блюза до того, как он стал канонизирован. Компакт-диск
    дополнен тремя ранее не издававшимися треками и несколькими дублями. Красноречиво озаглавленная "Fat Mandolin", пластинка
    вышла в конце 1969 г. и из-за крайне ограниченного тиража быстро стала коллекционной редкостью.'
