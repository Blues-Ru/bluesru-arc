- id: 1506
  author: Сергей Исправников
  mark: 8
  date: '2009-03-08'
  text: 'На диске переиздан посмертный альбом Джонни Янга (музыкант скончался 18 апреля
    1974 г. от остановки сердца в возрасте 56 лет), первоначально выпущенный на виниловой
    пластинке на лейбле Testament в 1975 г. Диск представляет собой сборник неформальных
    студийных записей, сделанных Янгом в Чикаго в компании своих друзей-музыкантов
    в период 1962-66 гг. Сразу возникает вопрос: почему при обилии записей Янга на
    Testament его сольный диск при жизни так и не был издан? Pete Welding, хозяин
    Testament, отмечал, что он очень уважал Янга, но не считал его ни выдающимся певцом,
    ни выдающимся гитаристом. Для него Янг был живым воплощением традиционного блюза
    и прекрасным ритм-гитаристом, соответственно отдельные его треки издавались на
    сборных тематических дисках, выпускавшихся на Testament в 60-е гг., и, кроме того,
    Янг входил в состав аккомпанирующих групп более ярких исполнителей, таких как
    J.B.Hutto и Robert Nighthawk.


    Welding познакомился с Янгом в начале 1962 г., когда тот периодически выступал
    в чикагских клубах, а каждое воскресенье играл на знаменитой Maxwell Street в
    компании гитаристов John Lee Granderson и Robert Nighthawk, исполнителей на губной
    гармонике John Wrencher и Carey Bell, ударников Robert Whitehead и Houston Phillip.
    Собственно говоря, сессии с большинством этих музыкантов, а также такими звездами
    как Отис Спэнн, Уолтер Хортон и Литтл Уолтер и вошли в этот диск. Стилистически
    это ранний чикагский электрический блюз и акустические вещи в стиле Дельты. Треки,
    сыгранные электрическим составом, звучат достаточно архаично, как будто были записаны
    лет на десять раньше. По сравнению с ними звучание акустических номеров, особенно
    где Янг использует мандолину, явно выигрывает. Среди последних отдельно стоит
    отметить кантри-блюз "Sugar Farm Blues". Удачным получилось и сыгранное в две
    гитары с Nighthawk акустическое буги "Meet Me In The Bottom". В целом, диск по
    своему настроению полностью погружает слушателя в эпоху традиционного блюза. Эти
    сессии интересны своей спонтанностью и непринужденностью, поэтому не стоит здесь
    искать техническое совершенство записи и самого исполнения. Остается добавить,
    что при переиздании на компакт-диске материал оригинальной пластинки был дополнен
    четырьмя ранее не издававшимися бонус-треками.'
