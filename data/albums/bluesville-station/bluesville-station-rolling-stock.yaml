  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2015-03-24'
  text: 'Австралийские блюз-рокеры Bluesville Station за более 15 лет существования группы записали 6 альбомов плюс один сборник
    лучшего, а 1 января 2015 года представили публике седьмой студийник, полностью состоящий из авторского материала лидера
    группы Брэда Палмера.


    Возможно, в силу отдаленного географического положения группа не столь известна любителям блюза (да и диски они издают
    на собственном лейбле при отсутствии международной дистрибьюции), однако и в Австралии есть прекрасные блюзовые музыканты
    (вспомним того же Дэйва Хола), и Bluesville Station - не исключение. Слаженная ритм секция, мощные гитары, эпизодический
    слайд, губная гармоника и хороший вокал, профессиональное исполнение, энергичный драйв, заводные мелодии и интересные
    инструменталы - все это в полной мере представлено на диске, который наверняка не оставит равнодушным ни одного любителя
    зажигательного современного блюз-рока. Справедливости ради отмечу, что некоторые треки слегка затянуты, но в остальном
    вполне добротная и сделанная со вкусом пластинка, которая слушается с удовольствием.'
