- id: 1234
  author: Андрей Евдокимов
  mark: 7
  date: '2008-03-22'
  text: В группе нет выдающихся солистов, и голос вокалиста сильным не назовешь. Хотя легкости, с которой Дункан исполняет
    блюз, можно только позавидовать… Особенно, если знать, что солисту на момент записи исполнилось 74 года. Как и три четверти
    блюзменов его поколения, он родился в Миссиссиппи, а свою музыку обрел в Чикаго. Правда, он не спешит называть себя "артистом"
    или "музыкантом", предпочитая трудное переводимое "just a pleaser" - он просто доставляет удовольствие публике. И с этим
    не поспоришь! Рискну предположить, что новичкам эта концертная программа может показаться несколько однообразной. Однако
    ценители чикагского блюза периода 50-х годов высоко оценят такое пополнение фонотеки. Не так уж много осталось ветеранов
    той эпохи, и радует уже сам факт, что Дункан, пусть сидя в кресле, но продолжает выступать. Кстати альбом выпущен чикагским
    лейблом, который в нынешнем году отметит свое 55-летие. Альбом выпущен одновременно в формате CD и DVD. На видео можно
    еще посмотреть увлекательное интервью с "простым ублажителем публики" о миссиссипском детстве и чикагском блюзе времен
    его расцвета.
