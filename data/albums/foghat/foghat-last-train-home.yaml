  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2011-08-12'
  text: 'Foghat был создан в 1971 году, когда бывшие участники английской блюзовой группы Savoy Brown Дэйв Певерет, Роджер
    Эрл и Тони Стивенс решили создать свою собственную группу и играть музыку с более рок-н-рольным драйвом, расчитанную на
    американскую публику. Такой несложный блюз-рок пришелся по вкусу фанам, и в течение 70-х группа была довольно популярной
    в Америке.


    В дальнейшем группа пользовалась заметно меньшей популярностью, но продолжала гастролировать и выпускать альбомы даже
    после преждевременной смерти от рака Дэйва Певеретта. Данный альбом вышел после довольно долгого перерыва (7 лет) на собственной
    фирме Foghat Records и практически полностью посвящен блюзу и блюз-року. В основном это каверы блюзовой классики, разбавленные
    немногочисленными собственными композициями в том же ключе. Два последние трека наиболее интересны - они записаны совместно
    с 86 летним блюзменом Эдди Киркландом. Диск посвящен памяти двух покинувших этот мир участников группы - Дэйва Певеретта
    и Рода Прайса.


    Альбом приличный, качественный, профессионально сыгранный, но без откровений - пока играет, вроде неплохо, а потом вроде
    и вспомнить особенно нечего. Тем не менее фанатам группы и любителям несложного блюз-рока понравится наверняка.'
