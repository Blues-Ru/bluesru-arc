  author: Дмитрий Казанцев
  mark: 9
  date: '2004-02-14'
  text: 'Well, well, well, what a cute little album!...


    У этого дебюта вокалиста Терри Эванса сразу несколько достоинств: альбом отлично
    записан, живая игра в студии, великолепные музыканты и вокалисты, разнообразие
    стилей от блюза до госпела и соула, отсутствие всякого рока и блюз-рока, 10 блюзов
    на 49 минут - отличная формула альбома, и главное - это современная классная музыка,
    а не попытка кого-то копировать. Кто-то найдет и другие плюсы, но и этих достаточно
    для того, чтобы признать этот альбом отличным дебютом!


    Итак, продюсер - Рай Кудер, Терри сам написал пять блюзов из десяти, альбом вышел
    на фирме Pointblank (подразделение Virgin). Кудер великолепен на гитаре, его сын
    Joachim играет на перкуссии, на ударных блистательный Джим Келтнер, на пианино
    почти культовый Спунер Олдэм; это все очень хорошо, как Вы понимаете. Paramount
    Singers создают волшебные хоровые паттерны, добавляя в музыку привкус госпела.
    Стоит ли говорить, что голос самого Эванса - это красота, мощь и обаяние.


    Оценка 4.5 балла. Почему не 5? Может быть чуть не хватает "матерости" его следующих
    дисков (забегая вперед). Hey Mama Keep Your Big Mouth Shut и Natcha Bone Lover
    - лучшие на альбоме, на взгляд. Альбом нужен буквально всем, я просто не могу
    себе представить блюзмена или меломана, которому этот диск может не понравиться.'
