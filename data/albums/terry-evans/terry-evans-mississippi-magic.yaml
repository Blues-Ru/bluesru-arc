reviews:
- id: 465
  author: Дмитрий Казанцев
  mark: 8
  date: '2004-02-14'
  text: 'Making this album has been a journey back for me. The gospel, blues, and soul of the Mississippi delta... such a
    beautiful place! Так описывает этот альбом сам Терри; ну все понятно, в общем. Хип-хоп он и не собирался исполнять.


    Рай Кудер играл с Терри на всех его альбомах и на дисках Терри с Бобби Кингом, а вот тут его нет! Это почти сенсация;
    Райлэнда заменил гитарист Джесси Сэмсел. Нет тут и Джима Келтнера. Джон Логан играет на гармошке, Уилли Грин подпевает
    вместе с Рэйем Уиллиамсоном. 10 треков на 46 минут, Терри написал ровно половину из них. Есть тут и один известный хит
    Уилли Диксона - это Mellow Down Easy. Хочется сразу сказать, что этот альбом еще более блюзовый, чем предыдущий диск на
    Теларке, к сожалению, это не значит, что он лучший.


    Оценка 4 балла. Пожалуй, этот диск слабее всех, но совсем на чуть-чуть. Явно не хватает магии Кудера и Келтнера, изменений
    в звуке и стиле ВООБЩЕ не произошло, а это уже почти кризис для пятого альбома. Но материал все же по-прежнему очень силен;
    Big Daddy Good, Where The Southern Crosses The Dog, Blues & Wine, Mellow Down Easy, Let Love Begin - очень хорошие треки.'
