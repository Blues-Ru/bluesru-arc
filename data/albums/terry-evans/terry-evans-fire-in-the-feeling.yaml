- id: 895
  author: Константин Колесниченко
  mark: 8
  date: '2005-11-06'
  text: 'Последний альбом замечательного певца Terry Evans. На этом диске Терри пытается воссоздать атмосферу его предыдущих
    альбомов, тех, в записи которых принимал участие Ry Cooder. Для этого он пригласил отличного гитариста David Lindley,
    игравшего и с самим Кудером, и с много кем еще из фолк-блюз-рок музыки, тромбониста George Bohannon, игравшего с Эвансом
    на "Puttin'' It Down". Есть на альбоме и неплохой барабанщик Phil Bloch, давно играющий с Терри, и вокальная группа. Вообщем,
    на диске есть все, кроме Кудера и той замечательной легкости, с которой были сделаны предыдущие альбомы, слушавшиеся на
    одном дыхании. Этот диск показался мне чуть затянутым, практически все композиции длинной около пяти минут и более. Наиболее
    удавшиеся песни: подарок Кудера "My Baby Joined the Army", знаменитая "Turn On Your Love Light", "Discover Me" - c этим
    замечательным, но, к сожалению, редко сейчас использующимся инструментом – тромбон. Подведя итоги, хочется отметить, что,
    в общем, диск получился неплохой и красивый Завершает альбом потрясающая, но несколько длинная композиция "Walkin''Chains"
    авторства Phil Bloch, с перкуссией Эванса и замечательной подпевкой.'
- id: 955
  author: Дмитрий Казанцев
  mark: 9
  date: '2006-01-10'
  text: 'Терри Эванс - замечательный блюз-соул-госпел-певец, гитарист и автор. Это его седьмой сольный альбом; первый был
    в 1994 году. До этого у него было два диска с Бобби Кингом; они вместе работали с Райем Кудером долгое время (бэк-вокалисты).


    Терри ушел на другой лейбл, с ним более нет Рая Кудера, но музыка его осталась в прежнем ключе - блюз, соул и госпел высшего
    класса. Что-то в акустическом звучании, а что-то в электро. Кудера заменил не менее известный Дэвид Линдли (кудесник игры
    на всем струнном), а на тромбоне сам Джордж Бохэннон, который уже работал с Терри (и с Кудером в начале 70-х). Звук на
    диске очень мягкий и живой, похоже, что все или почти все сыграно живьем. Терри здорово делает знаменитую "Turn on your
    lovelight", есть тут также песня Кудера "My baby joined the army" - очень хороша.


    11 кайфовых песен в духе блюза и соула. Классный голос и подача. Эванс по-прежнему на высоте.'
- id: 1454
  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: 'Отличные рекомендации: родился в Миссиссиппи, пел в церковном хоре... Для тех, у кого знакомство началось с фильма
    "Перекресток", он всегда будет голосом из этого фильма. Иванс выработал свой эклектичный стиль, в котором блюз перемежается
    с мотивами из госпел и кантри-балладами. И все под пружинящий, но не акцентированный ритм. И великолепное владение голосом!
    Он умеет быть нежным, быть сдержанным, быть осторожным – чтобы накопить вокальную атаку на высшем энергетическом уровне.
    Среди предсказуемого звучания виртуозного ансамбля аккомпаниаторов приятно удивит песня с солирующим тромбоном – инструментом
    с блюзовым, оказывается, характером (сюрприз для тех, кто не знаком с записями Джимми Чисеэма, мастера блюзового бас-тромбона).
    От шуток и лирических баллад весь альбом идет к великолепной лирической семиминутной балладе Walkin'' Chain сочинения
    барабанщика и аранжировщика Фила Блока, настоящего соавтора этого альбома.'
