  author: Дмитрий Казанцев
  mark: 8
  date: '2003-08-25'
  text: 'Можно сказать, что Бобби Кинг и Тэрри Эванс - это люди Рая Кудера, они работают
    с ним с середины 70-х и создают неповторимый колорит вокальной поддержки. Но иногда
    они пишут и свои альбомы, то есть, солируют. Этот дебют 88 года для Rounder Records
    более чем удачен, с ними играют лучшие люди жанра под руководством Рая Кудера.
    Можно сказать, что это еще один сольник Рая, но без его пения. Тут неповторимый
    Джим Келтнер на барабанах, почти культовый Спунер Олдэм на пианино, Дэррил Джонсон
    на басу, сам Кудер на гитаре, и несколько других классных инструменталистов.


    Это не блюзовый альбом в чистом виде, скорее соул, но тут очень сильное влияние
    блюза почти во всех номерах. Тут 9 треков и 6 из них написаны Кингом, Эвансом
    и Кудером. Кроме этого, есть еще два известных номера - Just A Little Bit и At
    The Dark End Of The Street.


    Альбом довольно ровный стилистически, разве что немного выбивается из диска пятый
    трек Saturday Night. Выделю классные песни: Just A Little Bit, Seeing Is Believing,
    Let Love Begin, Got To Keep Moving и Live And Let Live.


    Оценка 4 балла - слабоваты последние вещи на сторонах - 5-я и 9-я.


    Хороший дебют двух замечательных вокалистов!'
