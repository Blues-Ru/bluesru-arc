  author: Дмитрий Казанцев
  mark: 8
  date: '2004-02-14'
  text: 'From one label to another... why not?


    После двух подряд дисков на AudioQuest Music Терри решил записать пластинку для еще одного известного аудиофильского лейбла
    - Telarc. Звук стал чуть ярче и резче, но все по-прежнему очень и очень классно!


    На этот раз 9 треков на 47 минут, из них аж шесть собственного сочинения. Надо сразу сказать, что альбом очень блюзовый
    и ровный по музыке. Это совсем неплохо в данном контексте; Эванс играет не поп-музыку вообще, ему не помешает некая доминанта.
    Надо сразу отметить, что Джим Келтнер снова играет на ударных, Рай Кудер на месте (куда же без него), Уилли Грин и Рэй
    Уиллиамс отлично подпевают, Джон Логан снова играет на гармошке. Еще надо заметить, что этот альбом все же отличается
    по звуку и балансу от двух предыдущих. Это хорошо, наверное.


    Оценка 4 балла. Вещи ровные, но не такие яркие как на втором альбоме Эванса. Walk That Walk, The Story Of My Life, Don''t
    Give Up, I''ll Get Over You - лучшие треки на этом диске. Это самый блюзовый (на этот момент) диск Терри; он хорош, и
    станет украшением в Вашей блюзовой коллекции.'
