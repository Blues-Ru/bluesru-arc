- id: 637
  author: Александр Панин
  mark: 8
  date: '2005-05-20'
  text: 'Очень редкие и неожиданные записи. Некто Джин Дейч пригласил Джона Ли сыграть
    у себя дома, и воспользовался случаем записать это "выступление". Хукер собирался
    исполнять свой обычный материал того времени, но Дейч уговорил его поиграть ряд
    совсем старых традиционных вещей и госпелов. Большую часть этих композиций Джон
    Ли никогда более не записывал! Trouble In Mind, John Henry, Jack O'' Diamonds,
    Ezekiel Saw The Wheel, Moses Smote The Water, Old Blind Barnabas, Rabbit On The
    Log... все очень интересно, пара госпелов вообще рэповых :) Итого еще один час
    малоизвестного, но сразу узнаваемого Хукера. Звук, естественно, не самый лучший,
    но запись слушается вполне нормально, хотя один балл за ее качество я скину.


    Впервые эти вещи были изданы в 2000 году на лейбле Flyright, но тот диск быстро
    стал out of print. На "комплитах" от Body&Soul их нет.'
