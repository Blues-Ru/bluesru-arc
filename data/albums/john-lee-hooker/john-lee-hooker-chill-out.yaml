  author: Антон Ворожеев
  mark: 10
  date: '2008-10-21'
  text: 'Блюзовый бестселлер Джона Ли Хукера Chill Out – это альбом, с которого многие
    начинают слушать блюз. И это хорошо объяснимо, ведь, на этом диске есть всего
    понемногу – и душещипательные запилы от Сантаны, и красивые клавишные соло, и
    быстрые буги, и эмоциональные акустические песни. Слушаешь, и сразу охватываешь
    несколько сторон блюза. А, учитывая, что все это исполнено с душой и профессионализмом
    (в придачу ко всему в 1996 году Хукер получил за этот альбом Греми) – как тут
    уж не увлечься такой музыкой.


    В моем случае все произошло наоборот – знакомство с блюзом началось с Sonny Terry,
    John Mayall и SRV, а Chill Out я впервые услышал лишь спустя 8 лет. Заполнил еще
    один пробел, так что в этом альбоме и для меня есть своя ценность.


    Как я уже сказал выше, альбом запоминается своим разнообразием. Многие любят его
    именно за титульный трек – медленный и въедающийся в сердце блюз с красивым соло
    Карлоса Сантаны, клавишными от Честера Томпсона и тихим бормотанием Джона Ли Хукера.
    "Времена изменятся" - повторяет он, и звучит это действительно завораживающе.
    Сантана - фонтан энергии и Хукер – спокойная меланхолия. Эти две стихии сменяют
    друг друга на протяжении пяти минут и утихают, так и не закончив свое соперничество,
    продолжая его где-то там, за ширмой тишины.


    Помимо Карлоса на альбоме отметились еще два именитых музыканта – в песне Serves
    Me Right To Suffer/Syndicator на органе играет Booker T. Jones, а вокал и соло
    Джона Ли Хукера перемежаются голосом и гитарой Вана Моррисона. Играют не быстро,
    но с драйвом, без излишних запилов и длинных соло – это просто музыкальная беседа,
    диалог двух музыкантов, в котором они для пущей аргументированности дают голос
    своим гитарам.


    Песни Kiddio и Annie Mae примечательны аккомпанементом Чарльза Брауна на пианино
    и чем-то напоминают Пайнтопа Перкинса. Хукер до того отдался пению, что практически
    не играет на гитаре, но недостатка в чем-либо не чувствуется – все за него делают
    клавиши.


    Too Young – это грустная мелодичная история любви в две электрогитары. Тихо-тихо
    подыгрывают гитары, Джон тихо поет, и мы видим, что такие песни можно играть без
    надрывов в голосе, без современного аккомпанемента, а просто сидеть и, перебирая
    струны на гитаре, рассказывать о том, что тебя гложет, изливать душу, не думая
    о том, какой гонорар выйдет от этой песни. А это и есть блюз.


    Не обошлось и без веселья. Самая знаменитая песня Джона Ли Хукера, которая идеально
    подходит для посиделок в компании блюзменов и виски – One Bourbon, One Scotch,
    One Beer – просто подвижное ритмичное буги.


    Все эти песни хорошо дополняют акустические номера, такие, как Deep Blue Sea и
    Tupelo. Они относят нас на несколько десятилетий назад к истокам блюза – закрываешь
    глаза и через мгновение видишь плантацию, старый барак в лучах заходящего солнца
    и одинокого невольника, вышедшего перед сном с самодельной гитарой подышать свежим
    воздухом и высказать природе все, что у него на душе. А кому еще пожаловаться?
    Сидит он и играет неспешно, спокойно поет и выстукивает ногой ритм по старому
    прогнившему деревянному настилу…


    У Джона Ли Хукера спросили – "А почему вы носите черные очки". Он сказал, "когда
    я пою, у меня возникают такие эмоции, что я могу заплакать. Пускай это останется
    моим личным". А когда слушаешь его песни, состояние такое же. Ибо это нельзя слушать
    по другому – человеческая натура не позволит.'
