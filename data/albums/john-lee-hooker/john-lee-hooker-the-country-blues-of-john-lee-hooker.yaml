  author: Дмитрий Казанцев
  mark: 10
  date: '2006-05-21'
  text: 'Выходит, что это есть самый первый альбом Хукера. В оригинале он назывался
    THE FOLK BLUES OF JLH. Здесь только поющий Джон и его акустическая гитара (зачем
    он вообще взял электро?) 13 блюзов, все великолепны. Тут есть такие хиты, как:
    "How Long Blues", "Tupelo Blues", "Bundle Up And Go", "Good Morning Little School
    Girl".


    Может быть, это и есть лучший диск Хукера. Обязателен в любой коллекции.'
