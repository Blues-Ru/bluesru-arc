reviews:
- id: 312
  author: Алексей Калачев
  mark: 8
  date: '2003-12-02'
  text: 'Да простится мне мрачная ирония в блюзовом стиле: сегодня Джон звучит не
    хуже, чем при жизни. Если серьезно, в целом диск, пожалуй, не хуже других его
    релизов 90-х годов. Диск отмечен известным разнообразием. В нем есть приятно аранжированные
    группой его дочки Закии вещи в современном вкусе (там Джон в дуэте с Закией),
    есть типичные буги на одном аккорде, тягучие медленные с шаманским бормотанием
    и даже просто песенка со смычками в стиле его классической "Waterfront". Если
    вспомнить, что диск сделан с "гостями", наложившими партии на треки, оставшиеся
    в виде забракованного и неиспользованного начиная с 1989, то и "гости" звучат
    более чем достойно – лаконично и к месту. Расстроил только Джонни Винтер невнятным
    ерзаньем слайдом по струнам на одном из треков. Хотя, положа руку на сердце, диск
    и без них имел бы 100% успеха.'
