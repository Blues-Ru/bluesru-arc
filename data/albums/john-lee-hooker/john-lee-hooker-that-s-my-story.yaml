  author: Дмитрий Казанцев
  mark: 10
  date: '2006-05-21'
  text: 'Второй альбом Джона. Он на акустической гитаре, в большинстве вещей ему помогает
    "скромная" ритм-секция: Sam Jones - bass, Louis Hayes - drums. Все песни написал
    Хукер (во всяком случае, он так решил); они очень хороши. Есть тут и первая версия
    "I Need Some Money" (он перепевал эту песню; ее исполняли все подряд в 60-е).


    Хукер с акустикой - это очень и очень классно. Еще один обязательный альбом шамана
    блюза.'
