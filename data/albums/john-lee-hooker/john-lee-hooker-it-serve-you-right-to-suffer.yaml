  author: Дмитрий Казанцев
  mark: 8
  date: '2004-01-08'
  text: 'Хукер на джазовом лейбле Impulse! Под соусом "The New Wave Of Jazz Is On"!
    Мы-то знаем, конечно, какой из Хукера джазмен, но, как это ни странно, этот альбом
    звучит очень органично и интересно. Джону подыгрывают только джазмены под руководством
    самого Панамы Фрэнсиса, но делают это они очень деликатно и ПРИМИТИВНО, этим самым
    они отлично вписываются в монотонный и психоделический стиль Джона. Bottle Up
    And Go, Sugar Mama, Decoration Day, Money, Serve You Right To Suffer - классные
    треки с этого альбома!


    Оценка 4 балла. Местами джазмены уж слишком монотонны, а кое-где и Хукер почти
    засыпает. В целом же это необычный, редкий по исполнению и необходимый в каждой
    коллекции альбом Джона Ли!'
