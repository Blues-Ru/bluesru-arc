  date: '2002-12-17'
  text: 'Среди альбомов, выпущенных Хукером в 90-х, этот наименее тяжелый по звуку,
    и, если такой термин применим, прозрачный. "Скорректирован" он в сторону массового
    вкуса продюсировавшим диск Вэном Моррисоном , две композиции которого еще более
    "разжижают" сугубо блюзовый коктейль "Don''t Look Back". В записи и продюсировании
    приняли участие Los Lobos, Ch. Brown. Общее впечатление : увеличение запаса коммерческой
    прочности не помешало Хукеру остаться самим собой. Учитывая его возраст , музстаж
    и харизму при любых "отклонениях", он обречен на успех.'
