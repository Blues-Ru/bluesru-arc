- id: 342
  author: Андрей Евдокимов
  mark: 6
  date: '2003-12-06'
  text: 'Для многих звезд блюза период связанный с "Chess", обычно - лучшие годы. Но Хукер и тут - исключение. Этот альбом
    явно не рекомендуется для первого знакомства с его творчеством.


    "House Of The Blues" и "Plays And Sings The Blues", собственно, представляют собой сборники синглов Хукера, выпущенный
    в 50-х на "Chess". "The Complete 50''s Chess Recordings" предлагают к этим альбомам еще 8 треков, которые порадуют только
    коллекционеров раритетов. <br> "You Have Two Hearts" никогда прежде не публиковалась, и понятно почему: сентиментальная
    баллада под кривые аккорды Хукера и невнятное побрякивание челесты может восприниматься как милый курьез, но никак – всерьез.
    "Walkin'' The Boogie" можно послушать в двух вариантах – в известном по альбому "House Of The Blues", смикшированном в
    убыстренном темпе, и в оригинальном нормальном темпе, который прежде не публиковался ни в одном из хукеровских сборников,
    только в альбоме "Wizards from the Southside" (почему Хукер был причислен к "кудесникам с южной окраины" - совершенно
    неясно, поскольку сама песня была записана вовсе не в Чикаго, а в Детройте). Четыре последние песни альбома весьма любопытны,
    как попытки записать Хукера в сопровождение джазового квартета (труба, cаксофон, пиано, ударные), в аранжировках не то
    кул- джаза, не то зарождавшегося модального стиля. Но по большому счету фьюжин не получился. "Big Fine Woman" оставляет
    впечатление неудачной репетиции. "Tell Me Baby" - крепче только потому, что ансамбль четко следует коротенькому блюзовому
    рифу, а трубач оставляет попытки вставить свои реплики между вокальными строчками. Cамая последняя "Cry Baby" очень неплоха.
    Видимо, если бы музыканты не пожалели времени на аранжировку и рипетиции, могло бы получиться нечто действительно любопытное.
    А то, что было сделано, звучит это довольно нелепо и надоедливо.


    Если вы уже обладаете двумя альбомами Хукера на Chess, то вряд ли "полное собрание 50-х" добавит что-то существенное к
    вашей коллекции. Но если нет – собрание предпочтительней, поскольку буклет содержит хорошую обстоятельную статью и одну
    редкую фотографию Хукера 50-х годов – с пивом за столиком, в женском окружении.'
