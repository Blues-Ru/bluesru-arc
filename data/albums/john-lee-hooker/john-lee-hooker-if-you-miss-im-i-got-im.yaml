  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-09'
  text: 'Это не просто Джон Ли Хукер, это John Lee Hooker featuring Earl Hooker. Earl Hooker играет на лид-гитаре, делает
    он это великолепно - интересные ноты и звуки. В двух треках вместо Эрла на гитаре играет Paul Asbell. Johnny Walker играет
    на оргАне и пианино, Jeffrey Carp - гармошка (очень хороший харпер), Chester Scaggs - бас-гитара, Roosevelt Shaw - ударные.


    Классный вариант Блюза на этом альбоме. В левом канале постоянно играет гитара Эрла, в правом - гармошка Джеффри, а по
    середине - голос и шаманство Джона Ли (его гитара тоже там). Бесконечный джем и "буги", но в таком исполнении это хочется
    слушать и слушать.'
