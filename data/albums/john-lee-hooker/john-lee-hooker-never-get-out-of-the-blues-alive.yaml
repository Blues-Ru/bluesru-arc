  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-02'
  text: Тут нет мелодий и пения (хотя Вэн Моррисон очень старается в последнем треке),
    тут почти нет музыки - вместо этого бесконечный джем и разговорный жанр, но все
    равно, я люблю творчество Хукера и этот диск! Тут много известных белых гостей.
    Bumble Bee Blues, Country Boy, T.B. Sheets - очень классные загрузы; просто надо
    найти состояние и настроение для подобного погружения в мир Хукера.
