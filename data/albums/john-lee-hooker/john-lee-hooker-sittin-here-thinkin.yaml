  date: '2005-04-02'
  text: Отличные сессии Хукера 50-х годов для Muse Records (12 песен на 45 минут). Прекрасные по качеству и исполнению записи.
    Джону помогают барабанщик, басист и второй гитарист. Интересно слушать как они ОБА солируют в разных песнях. Трудно тут
    что-либо выделить - все блюзы отличные и гипнотическое искусство Джона присутствует в каждом треке.
