  text: 'Трудно переоценить то впечатление, которое произвел после своего выпуска
    в 1983 дебютный альбом Stevie Ray Vaughan''а "Texas Flood". В то время блюз не
    был уже так моден, как в 60-ых. Texas Flood все изменил все: он вошел в число
    "40 лучших" и больше половины года держался в списке шлягеров, что было фактически
    неслыханно для блюзовых записей. Vaughan стал подлинной звездой и одновременно
    толчком к началу возрождения блюза. Это был хороший толчок, но критики кричали,
    что независимо от того, насколько потрясающим является инструментальный талант
    Vaughan''а, собственная уникальная манера пения у него еще не сформировалась.
    Вместо этого он не стеснялся демонстрировать влияния, под которыми он находился,
    было ли это "сдавленное" грубоватое соло Albert''а King''а или эмоциональное пение
    Larry Davis''а. В замечаниях критики есть доля правды, но именно это стало своего
    рода изюминкой Texas Flood. Vaughan не скрывал влияний, а, наоборот, прославлял
    эти имена, пуская в знакомый жанр свежую струю.


    К тому времени, когда в 1982 году Vaughan и Double Trouble за три дня перекомпоновали
    весь альбом, он уже много раз попадал в списки лучших; Vaughan знал, как можно
    вывернуть этот материал, поддать жару и тем самым достичь максимального эффекта.
    Альбом выстроен как клубное шоу: cначала две лучшие песни, написанные самим Vaughan''ом,
    "Love Struck Baby" и "Pride and Joy", затем следует медленный трек, по которому
    назван альбом, и (мы читаем это название с упоением) "Tell Me" Howlin Wolf''а,
    и вскоре кульминация - "Dirty Pool" и "I''m Crying". Венчает все "Lenny", лирическая
    джазовая дань Vaughan''а своей супруге. Становится ясно, что истинное достижение
    Vaughan''а - это то, как в соединении различных исполнительских элементов своих
    кумиров он умеет находить что-то индивидуальное, передавать какое-то свое чувство.
    Иногда заимствование было откровенным, в другой раз тонким и искусным, но все
    вместе это смешивалось в стиль, который, схватывая эмоциональное ядро настоящего,
    одновременно говорил о прошлом. <p align="right">All Music Guide, Stephen Thomas</a>'
