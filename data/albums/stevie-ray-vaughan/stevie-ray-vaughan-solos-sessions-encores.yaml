- id: 1251
  author: Андрей Евдокимов
  mark: 8
  date: '2008-04-09'
  text: '17 лет спустя после его смерти Sony пополняют его дискографию великолепным
    новым альбомом. Это собрание дуэтов. Половина треков ранее не издавалась. Самый
    ранний относится к 1978 году. The Sky Is Crying потрясает, состав ансамбля солистов
    головокружителен: СРВ, Кинги, Пол Баттерфилд и два короля: Алберт и БиБи. Прежде
    эта запись была доступна только на видео. Знатокам будет интересно сравнить известню
    акустическую версию дуэта с Лонни Мэком с прежде неиздававшейся электрической
    концертной записью. Среди известных партнеров СРВ неожиданным кажется концерт
    с Джефом Бэком. Популярнейшая песня в репертуаре СРВ Texas Flood прозвучит в концертном
    исполнении вместе с Бонни Райт. Коллекцию венчает Let''s Dance Дэвида Боуи, где
    СРВ поработал сессионным музыкантом. Альбом – не попытка наскрести по сусекам
    остатки неизданных записей. Он демонстрирует все лучшие стороны таланта легендарного
    ныне гитариста. В том числе и его умение тонко чувствовать стиль и настроение
    блюзового партнера.'
