  text: Epic 1986 CD. Двойной, но короткий лайв Вона (всего 70 минут длится). Запись
    и продакшн - почти жуть (как и все диски Стива), играют классно, конечно. Этот
    концертник интересен тем, что тут есть неальбомные хиты типа Superstition (Stevie
    Wonder).
