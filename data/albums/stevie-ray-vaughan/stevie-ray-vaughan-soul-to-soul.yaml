  author: Андрей Евдокимов
  mark: null
  date: '2005-10-28'
  text: 'Со дня выхода альбома прошло всего 20 лет, но минула целая эпоха в развитии блюза. Теперь альбом стоит считать памятником
    эпохи электрогитарного блюз-рока. Но это замечательный памятник, поскольку Стиви Рей умел придать легкость звучания и
    подвижность ритма даже блюз-роковой тяжеловесности.


    Третий альбом в его официальной дискографии впервые представляет его группу "Double Trouble" как квартет – к ней присоединился
    клавишник Риз Вайнонз. Летящий звук его электрооргана представлен на равных уже в первой квазиинструментальной композиции
    "Say What", словно в группе теперь два солиста. Вайнонз доказал, что он виртуоз под стать самому Стиву Рею. Эта дуэль
    электрооргана, выстроенного под звук "Хэммонд Би-3", и гитары, явно импровизирующей под влиянием Джими Хендрикса, слушается
    непривычно и свежо. Замечательная песенка Хэнка Болларда "Взгляни на сестричку" (Look At Little Sister) аранжирована под
    внушительную интенсивную поступь техасского шафла. Первые три номера столь энергичны, что пролетают на одном дыхании.
    И наступает время сверх-медленного блюза "Ain''t Gone ''N'' Give Up On Love". Песня отображает перипетии личной жизни
    Воэна на тот период: "Не я ушел, бросив любовь. Любовь ушла, бросив меня". Эмоциям текста соответствует лиричность гитарного
    соло. Сглаживая эмоции, следует "Ушел домой" (Gone Home), приятная и изящная как коктейльный джаз. И сразу по контрасту
    с ней – "Измени это" (Change It) – одна из самых сильных песен сочинения Воэна. Скорее роковый марш, нежели блюз, но обладающий
    теми необходимыми блюзовыми ингредиентами, что позволяют ему органично входить в программу блюзовой пластинки.


    Нынешнее издание на CD предлагает не только ремастированный 24-битный звук. Но и четыре дополнительных трека, которые
    обязательно порадуют старых поклонников SRV. Это небольшое интервью Стиви о его старом кумире: Джими Хендриксе. И две
    общеизвестные темы Хендрикса в исполнении Воэна: "Крылышко" (Little Wing) и "Третий булыжник от Солнца" (Third Stone From
    The Sun). Завершает альбом короткая инструментальная пьеса.'
