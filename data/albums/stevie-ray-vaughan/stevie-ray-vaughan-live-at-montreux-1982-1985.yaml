reviews:
- id: 9
  author: А.Пелосси
  mark: 8
  date: '2002-10-13'
  text: "Ну, наконец-то! - воскликнет истомившийся от ожидания стивиман. Целых 120 \nминут, 2 часа новой музыки! Не спешите\
    \ приходить в экстаз. Возможно, альбом \nявляется предметом острого интереса именно для этой категории, то есть фэнов.\
    \ \nОстальным не обязательно отрывать деньги от школьных завтраков, грабить банки и \nутаивать налоги, чтобы непременно\
    \ завладеть &quot;Live At Montreux 1982 &amp; 1985&quot; \nнемедля. Рядовой блюзмен, знакомый с прежними работами SRV,\
    \ едва ли сделает для \nсебя какие-то открытия, послушав только что вышедший двойник. Из 19 композиций \n11 раньше не\
    \ издавались. Правда, среди последних вы не найдёте не известных вам \nпо другим пластинкам пьес. Что в остатке? Послушать\
    \ ещё раз очередные версии \nзнакомых до боли песен? Нет, не всё так скучно, даже наоборот. В отличие от \nбесчисленных\
    \ бутлегов, альбом - в прекрасном звуке. Даже материал, слышимый вами \nна Live Alive, и вновь помещенный здесь, &quot;играет&quot;\
    \ по-новому и, надо признать, \nлучше. А потом, речь всё-таки о SRV! Есть и любопытные моменты. Например, \nпарадокс 1982,\
    \ заключенный на первом, заметно более коротком и более интересном \nдиске. Наш любимец ведь был тогда освистан! И это\
    \ осталось на записи. И тем не \nменее, получил именно за это выступление свою первую &quot;Грэмми&quot;."
