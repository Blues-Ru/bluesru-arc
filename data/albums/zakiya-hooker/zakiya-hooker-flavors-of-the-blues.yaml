  text: Дебют дочери Джона Ли Хукера Зекии Хукер - в целом милый, тонко и со вкусом аранжированный в про-джазовом ключе альбом.
    Аккомпанемент деликатно соседствует с не слишком выразительным и ярким голосом. Из диска невозможно определить, есть ли
    голос вообще или "так было задумано".
