  author: Константин Колесниченко
  mark: 6
  date: '2007-06-21'
  text: 'Harmonica Shah немолодой музыкант, свой первый альбом он записал только в 54 года, в 2000 году. Это его вторая запись.
    Харпер родился в Калифорнии, далее жил в Техасе, а вот теперь перебрался в Детройт. Жизни в гетто этого города он и посвятил
    свой альбом.


    Музыка на альбоме - это преимуществено шаффлы, расположенные в плоскости чикаго-блюза, снабженные грубым и мощным голосом
    Harmonica Shah и его же, не менее топорным, харпом (хотя есть пара интересных приемов), гитарист квартета Howard Glazer
    играет в стиле, лежащем ближе к року. Большую часть материала написал сам Shah и она представляет собой типичные грубоватые
    тексты музыканта из гетто. Самые показательные и интересные композиции: "Flat Down On My Back","Dun Made My Getaway" и
    "Do You Remember".'
