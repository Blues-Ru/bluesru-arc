  date: '2012-08-13'
  text: 'В 1996 году молодой гитарист из техаса Вес Джинс занял второе место среди 1500 участников международного конкурса
    гитаристов имени Джими Хендрикса, а в 2000 году уже выпустил первый сольный альбом, на котором представил энергичный современный
    тяжелый техасский блюз. Журнал Guitar Player назвал Веса одним из лучших молодых гитаристов.


    Концертный альбом 2009 года - третий сольник Веса, записанный 17 января 2009 года живьем в зале Music City Texas. К группе
    Веса на концерте присоединился его старый друг гитарист Лэнс Лопез, а на одном треке им помог Джэйсон Хелмс. Диск мощного
    довольно тяжелого техасского блюз-рока с энергичным драйвом и хорошей техникой игры наверняка понравится любителям тяжелой
    гитарной музыки с блюзовым уклоном.'
