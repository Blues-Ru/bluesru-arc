  author: Сергей Исправников
  mark: 8
  date: '2010-01-08'
  text: 'Третий выпуск полного собрания записей Бо Дидли на фирме Chess отражает следующий год его чрезвычайно плодотворной
    музыкальной карьеры и включает треки, записанные им с января 1960 г. по февраль 1961 г. в своей домашней студии в Вашингтоне.
    Данное издание заканчивает материал сессии января 1960 г., начатой в предыдущем выпуске. Из записанных здесь треков выделяются
    энергичный блюз в чикагском стиле "Live My Life", великолепный инструментал "Scuttle Bug" с блестящей фортепьянной партией
    Отиса Спэнна, а также нежная ду-уоп баллада "Love Me". Интересная история произошла с записанной тогда же песней "Mule
    Train". Это была стилизация под ковбойскую песню времен освоения Дикого Запада, впервые ее записал поп-певец Франки Лэйн
    в конце 1949 г., после чего песня стала хитом №1 в чартах журнала "Billboard". Буквально через три недели ее перепел Бинг
    Кросби, чья версия также умела общенациональный успех, достигнув второго места в чартах. Дидли сделал несколько вариантов
    ее аранжировки, однако руководство Chess в конечном итоге издало только ее инструментальную версию под названием "Travelin''
    West". В продолжении этой сессии был записан впоследствии ставший хитом ритм-энд-блюз "Craw-Dad" c фирменным африканским
    ритмом, бывшим визитной карточкой Дидли. К сожалению Chess издали его на второй стороне сингла, в результате чего он не
    достиг заслуженного успеха в чартах. В том же 1960-м году выходит четвертый альбом Бо Дидли "Bo Diddley In The Spotlight",
    на три четверти включавший в себя новый материал января 1960-го года, а также издававшиеся ранее на синглах хиты 1959
    г. – "Road Runner" и "Story Of Bo Diddley".


    Тем временем сам Дидли не сбавлял обороты и в феврале 1960 г., не дожидаясь выхода предыдущего диска, начал записывать
    новый. В это время к нему присоединились два вашингтонских музыканта – басист Jesse James Johnson и ударник Billy Downing,
    сменивший Клифтона Джеймса, решившего остаться в Чикаго. Вышедший в ноябре 1960 г. пятый альбом Дидли "Bo Diddley Is A
    Gunslinger" включал новые записи, сделанные в феврале 1960 г. с добавлением пары не издававшихся треков 1959 г. В связи
    с тем, что увлечение рок-н-роллом в это время сходило на нет, Дидли сделал альбом преимущественно в стилистике кантри-энд-вестерн.
    Наиболее показательными здесь были треки "Cheyenne", посвященный героям популярных вестернов, деревенские "Georgia Moo"
    и "Ride On Josephine", а также авторское прочтение хита 1946 г. кантри-исполнителя Мерла Тревиса "Sixteen Tones", ставшего
    впоследствии безусловной классикой жанра. Традиционную ритм-энд-блюзовую часть составляли такие треки, как "Do What I
    Say", в которой Дидли предстает этаким мачо, и танцевальная "Doing The Craw-daddy". В США альбом не пользовался особым
    успехом, однако в Великобритании занял 20-е место в чартах и два года спустя по итогам продаж приобрел золотой статус.


    После полугодового перерыва Дидли вернулся в студию в конце года, чтобы зафиксировать новый материал. К его группе в качестве
    гостей присоединились вашингтонский гитарист Уильям Джонсон, ударник Фрэнк Кирклэнд и две сестры Пегги Джонс – Патрина
    (тамбурин, бэк-вокал) и Патриция (маракасы, бэк-вокал). Из записанных 22 треков (включая варианты) изданными оказались
    только три, остальные записи представлены здесь впервые. В основном это рок-н-роллы и R&B на подростковую тематику, а
    также другие танцевальные композиции на популярные в то время ритмы твиста и хали-гали. Было записано достаточно инструменталов,
    среди которых, в первую очередь, стоит отметить рокабильный "Mess Around" и джазовый стандарт "When The Saints Go Marching
    In". Не были забыты и такие традиционные для Дидли жанры, как блюз ("Come On Baby") и кантри-энд-вестерн ("Aloha"). По
    воспоминаниям гитаристки Пегги Джонс, специально приезжавшей на запись в Вашингтон из Нью-Йорка, в основном, это были
    спонтанные студийные джемы, писали все с первого раза, в ряде случаев делали второй вариант в другом темпе. На записи
    было много шуток и импровизации.


    В феврале 1961 г. Дидли приступил к записи своего шестого альбома "Bo Diddley Is A Lover", половина треков которого вошла
    в это издание. Этот диск считается вершиной творческого альянса Дидли и Пегги Джонс. Включенный в альбом написанный ей
    в испанском стиле гитарный инструментал "Aztec" пару лет спустя стал хитом в Европе. На записи к бэнду Дидли присоединилась
    ду-уоп группа "Impalas", исполнившая бэк-вокалы. Диск являл собой образцы всех жанров, в которых работал Дидли, от рок-н-ролла
    ("Bo Diddley Is Loose") до лирической баллады ("Love Is A Secret") и блюза ("Call Me"), в котором Дидли исполнил партию
    скрипки.'
