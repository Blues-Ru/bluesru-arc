- id: 945
  author: Дмитрий Казанцев
  mark: 6
  date: '2006-01-04'
  text: Неплохой сборник ранних вещей Вуди - всего 20 песен. Это записи 40-х годов, что-то вместе с Сиско Хьюстоном и Сонни
    Терри. Фолк, кантри, вестерн, блюзы, народные песни. Материал хороший, а иногда прекрасный, но качество записей почти
    ужасное, так что слушать все это очень трудно, а кайфовать вообще невозможно.
