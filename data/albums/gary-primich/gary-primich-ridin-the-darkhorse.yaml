- id: 1473
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: Гитарист Марк Корпи в полной мере является соавтором альбомов харпера Гэри Примича. Легкий саунд колеблется между
    современным техасским блюзом и рокабилли полувековой давности. Этот коктейль служит хорошим фоном для ярких оригинальных
    импровизаций обоих музыкантов. В альбоме всего три кавера, из них только одна песня (Kansas City) является стандартом.
    Остальные песни – собственного сочинения. И, хотя для блюзовых альбомов, это редкое достоинство, надо признать, что композиторский
    дар – не главный талант Примича. Даже в песне с программным названием Hillbilly Blues хотелось бы услышать нечто-то большее,
    чем перепев старинных мотивов. С другой стороны, Pray For A Cloudy Day – действительно "новый" блюз, т.е., не похожий
    на дюжину других стандартов. Ну а лучшее в альбоме – лаконичная выразительная игра обоих солистов.
