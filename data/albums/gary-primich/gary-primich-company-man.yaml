- id: 410
  author: Дмитрий Казанцев
  mark: 8
  date: '2004-01-08'
  text: 'Не надо смеяться над его почти славянской фамилией и забавной физиономией.
    Гари родился в Чикаго и впитал все лучшее из американской музыки. Он умело и приятно
    поет, классно играет на гармошке, иногда цитируя своих кумиров и учителей, он
    пишет отличные песни, в конце концов. Поет он спокойно, без пафоса, СВОИМ ОБЫЧНЫМ
    голосом, но именно так, на мой взгляд, надо петь ВСЮ корневую музыку. Пафос и
    "школа" неуместны в блюзе и фолке. На гармошке Примич играет очень стильно, точно,
    МАЛО (о, это ВЕЛИКОЕ умение!), с правильным сочным звуком. Его стиль - сочетание
    всего лучшего от Сонни Боя до современных мастеров харпа. Его музыка полна хорошего
    вкуса и ПОНИМАНИЯ современной ситуации в блюзе. Никаких запилов и ненужных соло;
    все сосредоточено на драйве, классных мелодиях, грамотных композициях и ПРАВИЛЬНЫХ
    звуках. Это большое умение и мастерство.


    На альбоме аж 12 песен, но альбом не длинный - 46 минут. Гари играет по блюзу,
    но ВСЕ песни абсолютно разные по ритмике и груву. Так умеют немногие. Его голос
    обычен и приятен, сразу вспоминается его старший коллега и земляк Масселуайт,
    он тоже никогда не выпендривался. Может быть Гари не хватает харизмы певца и звездности
    Джуниора Уэллса, но такие люди рождаются не часто, и не стоит его винить в этом.


    Оценка 4 балла! Все очень хорошо! Гари молод для блюза, но в нем МОРЕ вкуса! Как
    звучит орган, гитары, гармошки! Нет резких и дурацких звуков, музыка льется в
    удовольствие. Да, ему не хватает истерики и боли, но это придет (или не придет),
    и тогда он станет рядом с великими. Альбом обязателен для российских блюзменов
    и их поклонников. Гари - еще один представитель ПРАВИЛЬНОГО блюза из Чикаго.'
- id: 883
  author: Константин Колесниченко
  mark: 10
  date: '2005-10-06'
  text: 'Замечательный альбом, слушается на одном дыхании, нет ни одной лишней песни,
    плохой и непродуманной аранжировки. Гари очень блюзовый музыкант, все его соло
    - это анализ, изучение и самое главное понимание - кто и как что играл до него
    (начиная от гармоники, на которой он играет, и, заканчивая всеми остальными инструментами
    ансамбля). Но Примич не ходячий цитатник, он оригинален во всем – от подбора материала,
    до подачи своей музыки. На альбоме 12 композиций, абсолютно все они интересные,
    разные, сыгранные с необыкновенным чувством и остроумием. В музыке Примича нет
    ненужных рывков, наигранных эмоций - все честно. Гари Примич – не звезда первой
    величины, но он тот, кто доставит максимальное удовольствие своей музыкой. Cub
    Coda в статье, приведенной в буклете, сказал: "….he''s givin'' all he can, he''s
    a company man." Высшая оценка за этот диск.'
