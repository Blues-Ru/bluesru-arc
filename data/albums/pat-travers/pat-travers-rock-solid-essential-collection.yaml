  text: 'Двухдисковый сборник с девяти первых альбомов канадского рокера, записанных
    для фирмы Polydor. Мощный хард рок с примесью блюз-рока, исполненный технично
    и напористо. Прекрасное введение в творчество талантливого музыканта.


    Издание от Репертор Рекордз как всегда на высоте и по качеству звука, и по качеству
    оформления.'
