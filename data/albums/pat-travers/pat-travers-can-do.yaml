- id: 2139
  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2013-07-19'
  text: 'Свой очередной альбом 59-летний рокер из Торонто записал с мая по декабрь
    2012 года во Флориде под аккомпанемент проверенного концертного состава Pat Travers
    Band. Ничего принципиально нового тут Вы не найдете - это традиционный для Пэта
    энергичный хард рок с примесью блюз-рока и рок-н-ролла: громкие гитары, мощная
    ритм секция, хриплый вокал. Пара каверов, включая Here Comes that Rain Again от
    Eurythmics, остальное написано самим Траверсом. Музыканты отлично сыграны, сам
    Траверс в хорошей форме, и нет никаких сомнений, что он и группа "can do".


    Любителям традиционного блюза слушать не стоит, зато хард-рокерам и поклонникам
    гитарного блюз-рокового громыхалова будет самое оно.'
