- id: 265
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: После выпуска в 2000 году альбома "Don't Feed The Alligators" один из самых свирепых блюз-роковых гитаристов современности
    взял тайм-аут. А по прошествии трех лет решил познакомить почитате-лей своего таланта с собственным прочтением ряда произведений,
    хорошо известных любителям рока. Непонятно только, почему альбом "P. T. Power Trio" вышел на лейбле Blues Bureau, а не
    на Shrapnel. Блюза-то как такового на новой пластинке нет. Зато есть "White Room" Jack Bruce из репертуара Cream, "Inside
    Looking Out", наиболее знакомая в исполнении Animals. Кроме того, в альбом Travers вошли, например, "Dreams Of Milk And
    Honey" группы Mountain, "Young Man Blues" Mose Allison (в свое время это произведение с удовольствием исполняли участники
    The Who), "Fire And Water" популярной в конце шестидесятых - начале семидесятых группы Free, а также "Nasty Dogs And Funky
    Kings" ZZ Top и даже "Highway 61 Revisited" Bob Dylan. Все это шумит и грохочет в традициях лучших альбомов Pat Travers.
    Кстати, стоит представить и двух других участни-ков трио. Это знаменитый британ-ский барабанщик Aynsley Dunbar, игравший
    у John Mayall в Blues-breakers, David Bowie и Frank Zappa, и австрийский бас-гитарист Gunter Nezhoda.
