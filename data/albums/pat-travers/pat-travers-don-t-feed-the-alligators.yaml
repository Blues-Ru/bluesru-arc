reviews:
- id: 235
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: Travers, последние несколько лет упорно игравший блюз, решил вдруг отметиться нормальной роковой пластинкой. При этом
    напрягаться и сочинять что-либо он не стал, а просто надергал известных произведений разных лет и сыграл их. Нужно отметить,
    что выбор гитариста до конца не понятен. Сложно сказать, что объединяет, например, "Black Friday" Steely Dan и "I'm Bad,
    I'm Nationwide" ZZ Top. Или "Don't Change Horses" Tower Of Power и "Crosstown Traffic" Jimi Hendrix. Кроме них в альбом
    вошли не менее разнородные "I Can Hear You Calling" Three Dog Night, "I Love You More Than You'll Ever Know" Blood, Sweat&Tears,
    "Nothing Easy" Jethro Tull и прочие рок-шедевры разных лет. Рискну предположить, что выбор Travers объясняется тем, что
    все эти 11 произведений просто очень ему нравятся. По крайней мере, исполнены они с большим энтузиазмом. Кстати, в записи
    этого альбома Travers помогали клавишник Doug Bare, бас-гитарист Larry Jacoby, еще один гитарист Tommy Calton и барабанщик
    Liberty DeVitto.
