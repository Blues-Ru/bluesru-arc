- id: 1366
  author: Константин Колесниченко
  mark: 8
  date: '2008-11-11'
  text: '"Make My Home In My Shoes" - это не чистый блюз, рецепт подобной музыки хорошо знает J.J. Cale и его последователи,
    например, Eric Clapton. Музыка альбома - это блюз-рок, замешанный на других жанрах американской музыки. Заглавная "Make
    My Home In My Shoes" - это бодрый современный блюз; следующей идет расслабленная и красивая "Stanley Street" - трибьют
    юношеским годам Гаррета, проведенным в музыкальном клубе "Esquire Club" Монреаля; далее "Sleepwalk" - инструментальная
    классика, которую исполняло огромное количество музыкантов от Chet Atkins, до The Ventures, Larry Carlton или даже Charlie
    Musselwhite; затем идет свингующая "Bert''s Boogie", далее довольно эстрадный вариант блюза "Move On Down The Line" и
    т.д. - приблизительно так подобран материал альбома.


    Для меня в "Make My Home In My Shoes", помимо довольно интересной гитарной работы самого Garett''a, изюминкой является
    присутствие харпера David Burgin (очень интересный музыкант и musicians musician). Также хочу отметить замечательные аранжировки
    духовой секции, которые смягчает подачу музыки и оживляет несколько синтетический звук, который был присущ альбомам, записанным
    в 80-х.'
