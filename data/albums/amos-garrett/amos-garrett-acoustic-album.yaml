- id: 1273
  author: Леонид Аускерн
  mark: null
  date: '2008-06-03'
  text: Все, к чему прикасался мифологический царь Мидас, превращалось в золото. Все, к чему прикасается Амос Гарретт, превращается
    в блюз. Мидасу его дар приносил одни неприятности, Гарретту – уважение и успех, как у публики, так и, особенно, у коллег
    по цеху. Уроженец Соединенных Штатов, Гарретт с раннего детства живет в Канаде, что не помешало ему успешно работать с
    целым рядом звездных исполнителей из США – Стиви Уандером, Бонни Райт, Марией Малдор. Для поклонников блюза его имя памятно
    по выступлениям с Полом Баттерфилдом в группе Better Days. В собственных проектах Гарретт зарекомендовал себя как прекрасный
    гитарист и певец. Играет он преимущественно на электроинструменте, а чисто акустические альбомы записывает крайне редко
    – раз в четверть века. По крайней мере, предыдущий его акустический проект выходил именно за 25 лет до Acoustic Album.
    Но переизданный в России альбом знаменателен не только этим. Умение все превращать в блюз здесь проявилось исключительно
    ярко. Small Fry и Hong Kong Blues старого хитмейкера Хоуги Кармайкла, Sam's Song из репертуара Бинга Кросби, Grasshoppers
    In My Pillow легендарного Ледбелли – всем этим композициям Гарретт придал подлинно блюзовое настроение. Вошла в альбом
    и одна его собственная песня (Bailey Hill Requiem), а также несколько вещей продюсера проекта и его гитарного партнера
    Кена Уитли. Амос действительно виртуозно играет на гитаре – как шести, так и двенадцатиструнной, а его приятный баритон
    действует просто завораживающе – и это при том, что поет Гарретт внешне очень просто, естественно, словно беседуя со своим
    слушателем. Остается удивляться, почему акустические проекты столь редки в его дискографии. Наверное, чтобы их больше
    ценили? Ценить есть за что – очень рекомендую убедиться.
- id: 1379
  author: Константин Колесниченко
  mark: 7
  date: '2008-12-03'
  text: Альбом создает ощущение домашней записи не только обложкой, но еще и своей музыкой - она исключительно расслабленная
    и ироничная, и главное - название не обманывает, альбом полностью акустический. Музыку, которую играет на альбоме Amos
    сложно назвать блюзом, хотя, безусловно, она на нем основана. "Acoustic album" - это регтаймы, старый джаз и эстрадные
    песни начала 20-го века, исполненные акустически и свингующе. В добавок к очень аккуратной и красивой игре Garrett'a на
    гитаре, он еще и очень хороший певец. Нет, он не поразит диапазоном вокала или какими-то приемами, но его спокойный баритон
    действует очень умиротворяюще и добавляет половину замечательной атмосферы альбома. Гарретту помогают отличные музыканты,
    с которыми у него полное взаимопонимание, не только в музыкальном плане, но и в настроении – это слышно по музыке – обратите
    внимание на "Bailey Hill Requiem" - это нежная акустическая мелодия, в которую плавно вплетается аккордеон и труба.
