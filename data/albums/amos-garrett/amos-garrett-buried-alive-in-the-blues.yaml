  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2017-09-19'
  text: 'Будущий знаменитый американо-канадский гитарист Эймос Гэррет родился в Детройте, но вырос в Торонто и Монреале. Его
    музыкальная карьера началась в далеком 1963 году, и с тех пор в качестве сессионного музыканта он записывался с множеством
    американских звезд (Стиви Уондер, Бонни Райтт, Эмимилу Харрис, Мария Малдор (у которой он был руководителем аккомпанирующей
    группы), Элвин Бишоп, Поль Баттерфилд (в группе которого Эймос играв вместе с Майком Блумфилдом), Соломон Берк) - всего
    более 150 исполнителей! В своем интервью для журнала Роллинг Стоун в 1975 году Джимми Пэйдж назвал Гэррета одним из своих
    самых любимых американских гитаристов. Такие гитарные гранды, как Чет Эткинс и Марк Нопфлер, высоко ценили уникальный
    стиль игры Эймоса Геррета. В 1978 году Эймос начал сольную карьеру и в 1980 году выпустил свой первый альбом.


    Данный сборник составлен французским лейблом Voodoo records с использованием материала с четырех альбомов Amosbehavin''
    1982 (трек 5), The Return of the Formerly Brothers 1988 (треки 3, 4), I Make My Home In My Shoes 1989 (треки 1, 2, 6,
    7, 9, 12, 13), а также Third Man In 1992 (треки 10, 11, 14). В качестве бонусного трека добавлено неиздававшееся ранее
    концертное исполнение Too Many Drivers на джазовом фестивале в Монтре в июле 1992 года. На диске в основном представлены
    каверы, хотя есть и три авторских трека, включая два инструментала. Музыка украшена эпизодическим подключением саксофонов
    и гармоники. В музыкальном плане диск довольно разноплановый (как это и полагается для сборника), но в целом это блюз
    (и немножко мягкий блюз-рок) с легким эстрадно-коммерческим уклоном - такой чисто американский коктейль из традиционной
    музыки на блюзовой основе а-ля J.J.Cale. При этом баритон Гэррета-певца и мастерство владения инструментом Гэррета-исполнителя
    производят достойное впечатление.'
