  author: Дмитрий Казанцев
  mark: 9
  date: '2011-04-14'
  text: 'Первый альбом группы за 21 год! Йорме-то уже 71 год! Диск записан в ноябре-декабре
    2010 года в студии Левона Хэлма в Вудстоке.


    А вообще, группа собралася в 1969 году как параллельный проект Jefferson Airplane,
    где играли оба участника - Jack Casady (bass) & Jorma Kaukonen (guitar/vocals).


    На этом диске Джеку и Йорме помогают: Barry Mitterhoff (mandolins), Skoota Warner
    (drums), Larry Campbell (guitars, violin, organ, vocals), Teresa Williams (vocals).
    12 песен на альбоме, 7 из них написали участники Hot Tuna. Конечно, не обошлось
    без песен Преподобного Гари Дэвиса - их тут две, и они прекрасны!


    Музыка тут прекрасная - блюз, рутс-рок и фолк-рок. Йорма очень внятно и живо поет
    для 71 года!'
