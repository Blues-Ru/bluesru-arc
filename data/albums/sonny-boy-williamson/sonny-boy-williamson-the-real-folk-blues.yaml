- id: 684
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-05-27'
  text: 'Хороший номерной сборник Сонни Боя 1966 года (вышел уже после его смерти).
    На диске 12 блюзов на 32 минуты - записи 1957-1963 годов. Все лучшие люди Чесс
    помогают Сонни Бою, в их числе Роберт Локвуд, Уилли Диксон, Отис Спэнн. Среди
    известных блюзов тут "One Way Out" и "Bring It On Home" (ее должны хорошо знать
    поклонники Led Zeppelin).


    Записи разного качества, но все же все они почти одного периода - это звучит ОК.
    Можно сказать, что тут мало ярких "культовых" вещей, их гораздо больше на "More
    Real Folk Blues" (вышел в 1967 году).'
