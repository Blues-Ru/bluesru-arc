- id: 762
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-07-19'
  text: 'Без всякого сомнения, этот дебютный альбом Сонни Боя является одним из лучших
    дисков на Chess Records вообще. Диск вышел еще в 1959 году, но музыка, записанная
    на нем опережает годы по содержанию и саунду. Сонни Бой мощно поет и очень конкретно
    играет на гармошке. Ему помогают известнейшие люди: Fred Below, Willie Dixon,
    Robert Lockwood, Muddy Waters, Jimmy Rogers, Otis Spann, Luther Tucker. Играют
    бодро, весело, но не без огрехов; хорошо, что личность Сонни просто затмевает
    все эти "технические" неточности.


    На пластинке 12 блюзов, все они написаны Уилльямсоном. Очень трудно здесь выделить
    что-то лучшее, ибо материал очень качественный и ровный на всем альбоме. Я бы
    все же отметил энергичный первый трек "Don''t Start Me To Talking" - он дает настроение
    всему альбому. Есть тут один минус - запись очень резкая и "плоская", но надо
    сделать скидку на 1959 год и на позицию фирмы Чесс по этому вопросу в целом.'
