  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2017-03-01'
  text: 'Сборник записей великого чикагского харпера и вокалиста для фирмы Chess,
    выпущенный уже после его смерти. Этот диск вышел вслед за первым посмертным сборником
    Уиллиамсона (Real Folk Blues 1966 года) и включает в себя такие "нетленки", как
    Help Me, Nine Below Zero, Decoration Day, Bye Bye Bird и Trying to get Back on
    my Feet. Девять треков сочинил сам Уиллиамсон (к Help Me приложил руку звукооператор
    Ральф Басс), Close to Me авторства Уилли Диксона, и два трека Bye Bye Bird и The
    Hunt Уиллиамсон и Диксон написали вместе. Все треки записаны в Чикаго в разное
    время с 1960 по 1964 год. При записи помогали такие блюзовые гранды из "конюшни"
    фирмы Chess, как Роберт Локвуд, Лютер Такер, Уилли Диксон, Отис Спанн, Бадди Гай
    и другие.


    Отличный диск традиционного чикагского блюза и наглядное свидетельство гения музыканта.'
