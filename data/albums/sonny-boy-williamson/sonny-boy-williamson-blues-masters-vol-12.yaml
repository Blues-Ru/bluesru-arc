  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-02'
  text: 'Отличный сборник Сонни Боя Второго. Тут записи 1963 года, сделанные в Европе (Копенгаген и Стокгольм). Качество звучания
    просто великолепное. Малые составы с Мемфисом Слимом и Мэттом Мерфи.


    Сонни Бой - великий инструменталист и замечательный рассказчик. Очень приятно его слушать.


    Он родился в 1899 году, а умер в 1965.'
