- id: 925
  author: Константин Колесниченко
  mark: 10
  date: '2005-11-28'
  text: 'Коллекция классических записей Sonny Boy Williamson I, для лейбла Bluebird,
    которые он делал в 1940-х годах, вплоть до своей смерти в 1948. Диск замечательно
    ремастирован, звучание почти идеальное, гораздо лучше многих классических записей
    того времени. Санни Бой играет на неусиленной гармонике классический чикагский
    блюз: "Good morning little school girl", "Susie Q", "Early in the Morning" итд,
    аккомпанируют ему тоже знаменитости того времени: Big Joe Williams, Yank Rachell,
    Specled Red, Robert Lee McCoy. Возможно, по современным меркам, его подход к инструменту
    не кажется таким уж инновационным, виртуозным, но в 30-40-х годах это был действительно
    прорыв.'
