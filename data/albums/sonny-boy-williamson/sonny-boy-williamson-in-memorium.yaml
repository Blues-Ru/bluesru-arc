reviews:
- id: 763
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-07-19'
  text: 'Этот диск вышел сразу после смерти Сонни в 1965 году, он стал первым посмертным сборником артиста. На альбоме собраны
    12 композиции, записанных в разное время в начале 60-х. Многие из них никогда не выходили на синглах и альбомах, так что
    эта пластинка представляет собой несомненную ценность. Здесь много известных блюзов, позднее они выходили и на других
    компиляциях (а также в других исполнениях). "One Way Out", Too Young To Die", "Checkin'' Up On My Baby", "Bring It On
    Home" - все это классика Блюза.


    Записи разные по звучанию, но качество очень высокое, в основном. Очень хороший и редкий диск Сонни Боя.'
