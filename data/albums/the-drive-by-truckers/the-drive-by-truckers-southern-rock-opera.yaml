- id: 490
  author: Сергей Колобашкин
  mark: 8
  date: '2004-03-12'
  text: 'Этот альбом был куплен мной совершенно случайно, в магазине была пустая касса
    и мне предложили вместо здачи в 10.99 евро выбрать любой диск. Собственно говоря,
    я был удивлен результатом тыка, так как группа оказалась весьма грамотной в плане
    игры отличного южного рока и рок-н-ролла, что, мягко говоря, тронуло мое сердце.
    Вообщем, это - двойной концептуальный альбом, который объеденен одной сюжетной
    линией, а иначе говоря, повествованием о группе Lynyrd Skynyrd от начала и до
    того, как разбился их самолет. Очень тяжело выбрать отдельные треки, так как все
    на альбоме слишком однообразно, но все же стоит отметить, что второй диск значительно
    сильнее, чем первый. На втром диске из общей массы очень выделяются некоторые
    клевые песни: блюзовая "Women Without Whiskey", рок-н-рольная "Life In The Factory".
    Композиция "Cassie''s Brother" очень сильно поражает своей мелодичностью, которая
    присуща кантри-рокерам. Очень интересная композиция "Road Ceses", которая исполнена
    в духе 70-х. Альбом завершает очень жесткая песня "Greenville to Baton Rouge",
    которая обладает сильной энергией, которая заставит землю двигаться. Вообщем,
    альбомчик сильный, даже очень сильный. Оформление внушает уважение: нарисованная
    обложка, красивый буклет с фото и текстами. Короче говоря, альбом слегка страдает
    от однообразия и только из-за этого получает твердую четверку.'
