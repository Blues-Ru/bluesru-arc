  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2012-08-13'
  text: Несмотря на то, что альбом носит то же имя, что и группа (что обычно характерно для дебютника) , это четвертый альбом
    техасских рокеров. Группа была создана в 1991 году в пригороде Хьюстона в районе Сансет Хайтс, который и дал имя коллективу.
    Обычно группу сравнивают с Black Crows и причисляют к блюз-року, хотя, на мой взгляд, они все-таки ближе к року и хард-року
    с блюзовыми и фанковыми элементами.
