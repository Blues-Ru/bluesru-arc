- id: 639
  author: Александр Панин
  mark: 9
  date: '2005-05-20'
  text: 'Обычно при упоминании записей библиотеки Конгресса на ум приходят совсем
    древние ломаксовские дела. Конечно, в нашем случае это не так. Недавно выпущенный
    на лейбле Fuel 2000 двойник содержит записи июля 1963 года, сделанные всего через
    несколько месяцев после того, как Харта чудесным образом отыскали в миссисипской
    глубинке (в далеком 1928-м он исполнил песню Avalon Blues, этот Авалон оказался
    поселением, по имени которого энтузиасты блюзового ривайвла шестидесятых на Джона
    и вышли).


    На этом двойнике 36 треков, перепета большая часть вещей, впервые записанных в
    1928 году, а также исполнено много новых. Звучание очень чистое и четкое, а сам
    Харт в прекрасной форме. Оформление хорошее, а цена просто отличная! A must have.'
