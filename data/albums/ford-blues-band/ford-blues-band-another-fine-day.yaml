reviews:
- id: 228
  author: Алексей Калачев
  mark: 5
  date: '2003-10-20'
  text: 'Сразу оговорюсь: в группе нет Робена. Однако это не помешало его брату, барабанщику Патрику Форду и Ко наиграть диск
    не хуже. Может, даже и лучше. Во всяком случае, с точки зрения техники исполнения он очень сильный и любопытный: отменная
    медная группа, участие Марка Форда (на гармонике) и высочайший уровень исполнения.'
