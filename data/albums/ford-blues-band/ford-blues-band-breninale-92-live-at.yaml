  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-08'
  text: 'Концерт легендарной калифорнийской блюзовой группы, записанный 7 июня 1992 года на блюзовом фестивале в Бремене.
    К составу в срочном порядке присоединился оригинальный басист Стэн Поплин, заменивший для концерта выбывшего штатного
    бас-гитариста.


    На альбоме есть все то, чем славится группа Патрика Форда: мощное профессиональное концертное исполнение с искусным владением
    инструментами и длинными блюзово-джазовыми джемами. Музыканты играют уверенно и сами получают удовольствие от своей музыки.
    Приятный альбом современного блюза.'
