  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-08'
  text: 'Альбом - посвящение памяти Майкла Блумфилда, записанный группой Патрика Форда с привлечением брата Роббена, Криса
    Кэйна и духовой секции. Треки разбавлены короткими интервью Блумфилда.


    Представлены композиции из разных периодов творчества Блумфилда, поэтому материал слегка разнородный, но в целом это высококачественный
    блюз с отличным исполнением. Добротный трибьют от одних блюзовых профессионалов в адрес другого.'
