- id: 1230
  author: Андрей Евдокимов
  mark: 7
  date: '2008-03-22'
  text: 'Альбом очень хорош естественным течение блюза. Заметно, что долгих репетиций не было, зато чувствуется полное взаимопонимание
    музыкантов и их желание играть. На фоне вполне привычного современного чикагского блюзбэнда Лури Бэлл чувствует себя раскованно.
    Он поет хрипло и "со смаком", гитара звучит лаконично и пронзительно. Он энергичен в быстрых номерах, лиричен в медленных…
    И преисполнен блюзового пафоса в самом длинном треке альбома: "Чикаго заряжен блюзом" - сочинения Уилли Диксона. Вообще,
    в альбоме нет ни одной песни его собственного сочинения, но это никого не смущает. У Лури старые песни звучат так, словно
    сочинены именно для его нового альбома – а это редкое достоинство! (В 2008 г. Л.Белл выдвигается на Blues Award в трех
    категориях).'
