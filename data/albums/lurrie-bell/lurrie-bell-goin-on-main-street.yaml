- id: 1219
  author: Константин Колесниченко
  mark: 5
  date: '2008-02-22'
  text: Я очень люблю Carey Bell - он отличный харпер с уникальными приемами и фирменным
    жужжащим звуком, но данный альбом не очень интересен даже мне. Дело в том, что
    запись эта - подборка довольно длинных блюзовых джемов, практически не отличающихся
    по темпу и подходу. На альбоме есть несколько приятных слуху моментов - это хорошая
    игра Lurrie Bell и отличная композиция "Tribute To Big Walter", на которой Bell
    при помощи другого харпера, Billy Branch, исполняет попурри из различных и хорошо
    узнаваемых фраз Большого Уолтера. Среди других знаменитостей - Hubert Sumlin и
    Bob Stroger, которые засветились на некоторых песнях альбома.
