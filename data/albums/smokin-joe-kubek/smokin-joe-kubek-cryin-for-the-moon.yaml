  text: 'The Smokin'' Joe Kubek Band - Cryin'' for the Moon (1995)


    Альбом Cryin'' for the Moon - четвертый диск группы Джо на лейбле Bullseye Blues/Rounder Records. На диске представлен
    в основном авторский материал плюс пара треков авторства Рона Леви, который при записи выступил в качестве клавишника,
    а также продюсировал альбом. Диск был записан в Мемфисе, штат Теннеси, с эпизодическим участием духовой секции. На диске
    представлен современный электрический техасский блюз в различных вариациях. Замечу, что диск не очень ровный: есть сильные
    треки с отличной игрой Кубека (например, In One Hand, You Haven''t Hurt Me , If It''s The Last Thing I Do, You''re So
    Hard To Understand), но есть и довольно "проходные" композиции. Однако с учетом общей длительности диска в почти 60 минут
    каждый может легко набрать для себя стандартные 40 минут хорошей музыки.


    В 1995 году на 16-й ежегодной церемонии вручения блюзовых наград W.C. Handy группа Джо Кубека была номинирована на звание
    "блюзовой группы года".


    "His guitar playing is more than Smokin''; he''s blended the sound of other Texas guitarists like Albert Collins and has
    taken them to a world of his own." - The Nice Paper


    "Kubek''s flame-throwing guitar work and whiskey-smooth vocals of Bnois King make a powerful, irresistible combination."
    - CMJ'
