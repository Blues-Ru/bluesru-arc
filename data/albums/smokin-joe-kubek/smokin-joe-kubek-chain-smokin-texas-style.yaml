- id: 1903
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-17'
  text: 'Второй альбом техасских блюз-рокеров, записанный по итогам удачного дебютника,
    оказался ничем не хуже. За счет привлечения дополнительных музыкантов (клавишника
    Рона Леви и саксофониста Джима Спейка) музыка группы приобрела дополнительные
    краски, сохранив традиционную блюз-роковую основу. Музыканты играют легко и расслабленно,
    получая удовольствие от исполняемой музыки и одновременно демонстрируя хорошую
    технику. Приятный альбом, хотя и без откровений.


    "If Art Blakey did hard bop and Otis Clay hard soul, then assign to the Smokin''
    Joe Kubek band featuring Bnois King the niche of hard blues. Regard them as essential
    to a full perception of the modern blues experience." - Tim Schuller'
