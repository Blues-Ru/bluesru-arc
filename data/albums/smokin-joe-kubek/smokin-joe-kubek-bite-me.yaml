  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-17'
  text: 'Девятый альбом Джо Кубека и его партнера Биноиса Кинга сделан в лучших традициях группы - это традиционный современный
    заводной техасский блюз-рок. В качестве продюсера выступил знаменитый Джим Гэйнс, на гармонике и саксофоне отметился небезызвестный
    Каз Казаноф, которому помогали еще два духовика.


    Если понравились другие альбомы группы, понравится и этот :-)'
