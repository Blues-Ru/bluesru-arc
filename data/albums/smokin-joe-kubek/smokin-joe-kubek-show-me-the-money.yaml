  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-17'
  text: Show Me the Money - десятый альбом в дискографии Кубека, записанный с неизменным участием Биноиса Кинга. Тут мы вновь
    имеем дело с добротным современным техасским блюзом от мастеров жанра, причем это второй альбом группы для лейбла BlindPig
    Records. Материал полностью авторский, продюсировал и аранжировал сам Джо Кубек. Джо посвятил данный альбом памяти своего
    отца. Хорошая техника исполнения, мощный драйв, заводные песни - что еще нужно за кружечкой пива :-)? В альбом вошли такие
    хиты, как I Saw It Coming, Burning to the Ground и, конечно же, знаменитая My Heart's in Texas. Одиннадцатое место в топе
    блюзовых альбомов Биллборда.
