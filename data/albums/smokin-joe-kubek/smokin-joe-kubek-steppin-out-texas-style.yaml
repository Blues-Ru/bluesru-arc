reviews:
- id: 1906
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-17'
  text: 'Дебютный альбом группы Джо Кубека содержит традиционный электрический техасский блюз с долей мемфисского блюза. Материал
    был предварительно многократно обкатан во время концертных выступлений, и группа играет очень уверенно и даже расслабленно,
    демонстрируя не только музыкальный профессионализм, но и искренность исполнения.


    Дополнительный колорит музыке придают эпизодические подключения сессионных музыкантов: двух саксофонистов и клавишника.


    Отлично сыгранный традиционный блюз с современным звучанием.'
