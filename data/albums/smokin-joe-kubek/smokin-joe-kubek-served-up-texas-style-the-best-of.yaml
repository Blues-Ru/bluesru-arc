  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-17'
  text: Сборник лучшего, записанный Джо Кубеком и Биноисом Кингом за время сотрудничества с компанией Bullseye Records, для
    которой они записали 7 альбомов за 10 лет. На полноту охвата не претендует, ибо группа записывалась и на других лейблах,
    но это, по крайней мере, достаточно представительный сборник (а другого пока просто нет!). В качестве бонусов добавлены
    две неизданные композиции.
