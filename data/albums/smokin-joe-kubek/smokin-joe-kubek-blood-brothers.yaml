- id: 1360
  author: Константин Колесниченко
  mark: 7
  date: '2008-11-05'
  text: Техасский блюз уже давно не ассоциируется с блюзменами Blind Lemon Jefferson
    или Mance Lipscomb, даже свингующие гитарсты этого края вроде T-Bone Walker, Zuzu
    Bollin и пр. - это не главные фигуры стиля. После появления Стиви Рея Вона, большинство
    блюзменов, выходцев из этого края - это гитаристы, находящиеся под влиянием этого
    культового музыканта. Но сотрудничество белого Smokin' Joe Kubek и чернокожего
    Bnois King, к счастью, вышло гораздо более разноплановым и интересным. У Кинга
    красивый, истинно черный, вокал и мягкая манера игры на гитаре, а у Джо гораздо
    более жесткий, блюз-роковый, подход к инструменту. По-отдельности у них получилось
    бы что-то довольно привычное, а вот их сочетание – это уже гораздо более интересная
    смесь, Гибсон встретил Стратокастер. Не могу сказать, что это самый сильный их
    альбом, но это хорошая и добротная работа, одним из основных достоинств которой
    является авторский материал - 13 из 14 композиций – плод совместных усилий этих
    двух музыкантов. Есть тут и классические техасские шаффлы с интересными и мелодичными
    рифами, и композиции с налетом фанка, и минорные медленные баллады. У "кровных
    братьев" Smokin' Joe Kubek и Bnois King есть все шансы со временем стать очередными
    классиками блюза.
- id: 1899
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-17'
  text: 'Дебютный альбом техасского блюзового дуэта на фирме Аллигатор (до этого группа
    записывалась на других лейблах) практически полностью состоит из авторского материала.
    Продюсировали Джо Кубек и Брюс Иглауэр.


    Добротная блюзовая пластинка, которой, на мой взгляд, не хватает некой изюминки.
    Тем не менее твердая четверка по пятибалльной шкале и заслуженное четвертое место
    среди блюзовых дисков Биллборда.


    "Potent, undiluted 100-proof Texas blues honed to a razor''s edge" -GuitarOne


    "Powerful, hard-nosed, authentic roadhouse blues...Punchy Texas shuffles, fierce
    boogies, tough slow blues and mighty fine roots rock" -Living Blues'
