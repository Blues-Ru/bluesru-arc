  date: '2011-06-17'
  text: 'Отыграв более 10 лет практически во всех блюзовых барах Техаса и окрестностей, тандем более жесткого блюз-рокера
    Джо Кубека и более мягкого соул-вокалиста Биноиса Кинга наверняка закончил исследование всех придорожных заведений штата
    :-).


    Еще один добротный альбом традиционного техасского блюза и блюз-рока от дуэта Кубек и Кинг, добравшийся до 14 места в
    блюзовом топе альбомов Биллборда.'
