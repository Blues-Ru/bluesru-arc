- id: 1901
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-06-17'
  text: 'Техасские блюз-рокеры потратили почти год на подготовку нового альбома, который вышел 25 мая на лейбле Аллигатор.
    В этот раз музыканты не спешили и добивались от каждой песни именно того звучания, которое они и хотели получить. В результате
    получился динамичный блюз-роковый альбом с запоминающимися мелодиями, исполненный с мастерством, присущим техасскому дуэту.
    Материал полностью авторский, а искусная ритм-секция позволяет гитаристам свободно демонстрировать их широкие возможности.
    По мнению Кинга, это лучший альбом из всех записанных музыкантами. Заглавный трек особенно хорош, да и остальные подстать
    ему - проходных треков нет. Любителям техасского блюза слушать в обязательном порядке :-)!


    Третье место в топе блюзовых альбомов Биллборда.'
