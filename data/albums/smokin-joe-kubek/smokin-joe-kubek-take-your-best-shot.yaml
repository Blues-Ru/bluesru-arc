- id: 1905
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-17'
  text: 'Smokin'' Joe Kubek записал данный (шестой по счету) сольный альбом для фирмы Bullseye - как обычно, в тесном творческом
    партнерстве с вокалистом и вторым гитаристом Биноисом Кингом. Также на альбоме отметились Jimmy Thackery и Little Milton,
    продюсировал знаменитый Джим Гэйнс. Получился добротный альбом традиционного техасского блюза, слегка утяжеленный Джо
    за счет использования всяческих исказителей гитарного звука.


    В принципе, все альбомы дуэта Кубек & Кинг достаточно ровные и качественные, если понравился один - понравятся и остальные,
    и наоборот :-)'
