reviews:
- id: 1157
  author: Константин Колесниченко
  mark: 8
  date: '2007-11-08'
  text: 'На мой взгляд, самая известная и популярная блюзовая певица - это Коко Тейлор.
    Зачастую блюз ассоциируется с сильным, шершавым мужским вокалом, который бы своей
    аброзивностью оставлял следы на чувствах слушателя. Очень мало певиц обладают
    такой способностью, Тейлор первая среди них.


    Свою карьеру Коко Тейлор начала как протеже Вилли Диксона. А с чем это ассоциируется?
    Правильно, студия Чесс. Этот, один из главных блюзовых лейблов прошлого, не оминул
    и Тейлор. Под руководством Диксона и с его участием она записала некоторое количество
    материало для Чесс. Данный сборник - довольно емкая компиляция ранней Коко Тейлор,
    ее первых блюзовых шагов с 1964 по 1971 год. На этих записях чувствуется молодая
    энергия Тейлор, запал, желание донести свою музыку до слушателя (в исполнении
    "Wang Dang Doodle" она отлично выглядит даже с Howlin'' Wolf). Жанрово весь материал
    можно отнести к West-Side Blues с сильной долей соул.


    Состав этих записей - это отдельный предмет для разговора: Maddy Waters, Buddy
    Guy, Willie Duxon, Gene Barge, Big Walter Horton, Mighty Joe Young и очень и очень
    много других именитых блюзменов, известны или сольной или сайдменской карьерой.'
- id: 2292
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2017-11-15'
  text: 'Коко Тэйлор - абсолютная рекордсменка среди блюзовых вокалисток по количеству
    полученных блюзовых премий W.C.Handy (24 награды) и признанная королева блюза
    из Чикаго, возведенная в 1997 году в зал славы блюза. С момента записи знаменитого
    хита Wang Dang Doodle (написанного Уилли Диксоном специально для нее) и до смерти
    в 2009 году Коко выпустила с десяток классических альбомов, вошедших в золотой
    фонд современного блюза.


    Сборник ранних записей будущей королевы чикагского блюза из серии Legendary Masters
    охватывает ее сотрудничество с лейблом братьев Чесс с 1964 года до ухода на Аллигатор
    рекордз. На сборнике представлен материал с первых двух сольных альбомов Коко
    (Koko Taylor 1969 (треки 2 - 4, 9, 10, 12) и Basic Soul 1972 (треки 14 - 16)),
    а также ее синглы и концертный дуэт с Мадди Уотерсом на фестивале в Монтре 1972
    года (последний трек). Большая часть материала написана Уилли Диксоном, а при
    записи помогают лучшие музыканты чикагского блюза - Диксон, Бадди Гай, Лафайет
    Лики, Уолтер Хорнтон и другие. Продюсировал Уилли Диксон.


    Наглядная иллюстрация того, с чего начиналась карьера великой певицы.'
