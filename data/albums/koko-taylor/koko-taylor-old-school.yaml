- id: 1076
  author: Сергей Исправников
  mark: null
  date: '2007-05-21'
  text: '"Old School" – выпущенный после 7-летнего перерыва новый альбом признанной
    королевы чикагского блюза Коко Тэйлор. Диск, действительно, выдержан в традициях
    "старой блюзовой школы" и вдохновлен музыкой, которую Коко Тэйлор слышала в детстве
    и юности. Коко жила в сельской местности американского Юга (штат Теннеси), собирала
    хлопок, присматривала за домашней живностью и вообще выполняла любую деревенскую
    работу. Семья была бедной, жили достаточно тяжело. Девочкой Коко стала петь госпел
    в местной баптисткой церкви и исполнять блюз. На альбоме записана песня "Black
    Rat" из репертуара легендарной Мемфис Минни (1897-1973), которую Коко пела еще
    подростком.


    В начале 50-х г.г. с 35 центами в кармане и пачкой крекеров она переехала в Чикаго.
    Поначалу пришлось работать прислугой в домах белых американцев: убираться, смотреть
    за детьми, готовить, стирать, гладить. По вечерам в воскресенья Коко с мужем ходили
    в блюзовые клубы, где блистали Muddy Waters, Howlin'' Wolf, Little Walter. Постепенно
    она стала там петь сама, однажды ее заметил Willie Dixon, продюссировавший ее
    первые записи и добившийся для нее контракта с Chess Records. На данном альбоме
    Коко Тэйлор исполнила два блюза его авторства – "Don''t Go No Further" и "Young
    Fashioned Ways". В середине 60-х к ней пришла слава. И в альбом, помимо пяти новых
    собственных композиций, были включены каверы таких блюзменов той поры, как Magic
    Sam и Lefty Dizz.


    В итоге получился достаточно жесткий и бескомпромиссный альбом чикагского блюза.
    Это не имитация старых кумиров. Диск, безусловно, является современной работой,
    но исполненной с соблюдением блюзовых традиций. Переполненный эмоциональным напряжением
    вокал Коко Тэйлор поддержан драйвовой игрой целого ряда высококлассных музыкантов,
    в том числе и таких звезд современного блюза, как гитарист Bob Margolin и гармошечник
    Billy Branch. Сама Коко Тэйлор так прокомментировала этот релиз: "Я вкладываю
    свое сердце и душу во все, что я делаю. Я долго и упорно работала над "Old School"
    и хочу, чтобы моим поклонникам он понравился так, как я его сделала".'
- id: 1487
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: 'Сходство с ее дебютным синглом, вышедшем 43 года назад, не только в подвижном
    напористом темпе. Оно и покоряющей энергетике; и в фирменном вокале, хриплом и
    властном, который принес ей титул "Королевы чикагского блюза". Новый альбом она
    открывает мощным раскатистым рыком. После медицинской операции она несколько лет
    провела в клиниках, врачи опасались за ее жизнь. И вполне понятно, что первый
    вопрос – о ее голосе и творческой энергии. Все-таки, ей уже за 70! Невероятно,
    но все отлично! Название у альбома точное. С небольшой долей блюз-рока, но по
    большей части это, бесспорно, тот увесистый и солидный блюз, каким его делали
    Уилли Диксон и Мадди Уотерс, бывшие непосредственными учителями Тейлор. Репертуар
    наполовину состоит из классики, наполовину из новых песен Тейлор, доказывающих,
    что с возрастом и после столь серьезных испытаний она не утратила ни чувства юмора,
    ни страстного отношения к любви. Немаловажный вклад внесли в запись профессора
    чикагского блюза: гитарист Боб Марголин и харпер Билли Бранч.'
- id: 1563
  author: Константин Колесниченко
  mark: 8
  date: '2009-07-08'
  text: 'Альбом этот попал ко мне поздно, уже после того, как Королева Блюза умерла.
    И как бы банально это не звучало, жива она осталась в своих записях. Недаром буклет
    содержит автобиографическую заметку от самой Коко, которая начинается словами
    "Blues is my heart". И это истинная правда, в каждой песне, в каждом рычащем возгласе
    певицы слышно, что блюз это все, что у нее есть. Мне даже кажется, что музыканты,
    принимавшие участие в записи альбома, настолько прониклись настроем певицы, настолько
    заразились этой "олд скульной" подачей, что это буквально можно читать в каждом
    соло, в каждой партии. А в записи альбома принимали участие, например, такие звезды
    как Billy Branch и Bob Margolin.


    Песни Вилли Диксона, Меджик Сэма, Мемфис Мини, Лефти Диза (мало, кому известного
    чикагского блюзмена, но как говорится must listen), EG Kight и 5 собственных блюзов
    – вот содержание последнего послания Королевы Блюза, это то, чем жила Коко Тейлор
    свою довольно длинную музыкальную жизнь.'
- id: 1866
  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2011-06-09'
  text: '2008 BLUES MUSIC AWARD WINNER FOR FEMALE ARTIST OF THE YEAR, SONG OF THE
    YEAR FOR "GONNA BUY ME A MULE", & TRADITIONAL BLUES ALBUM OF THE YEAR!!!


    GRAMMY NOMINATED FOR 2007 TRADITIONAL BLUES ALBUM OF THE YEAR!!!


    Последний фантастический альбом от королевы чикагского блюза, записанный для лейбла
    Аллигатор в возрасте 70 с лишним лет, объективно является одним из лучших за всю
    карьеру Коко Тэйлор, и совершенно справедливо получил множество профессиональных
    наград: Blues Music Award 2008 исполнительнице, лучший традиционный альбом года,
    а также песня года Gonna Buy me a Mule. Кроме того, он был номинирован на Грэмми
    как лучший традиционный блюзовый альбом года и занял третье место в блюзовом топе
    Биллборда.


    Надо сказать, что эти награды даны отнюдь не "за выслугу лет". Альбом действительно
    очень хорош - сырой, жесткий, мощный и бескомпромиссный! Это традиционный олд-скульный
    блюз с современным звучанием, исполненный высочайшими профессионалами. Это тот
    самый чикагский блюз, которым Коко Тэйлор жила на протяжении не одного десятка
    лет, и в котором ей нет равных.


    Вот что пишет в аннотации к альбому сама Коко: "Блюз - это мое сердце. Это альбом
    бескомпромиссного блюза в лучших традициях. Этот альбом того блюза, который я
    слушала на юге и когда впервые приехала в Чикаго.


    Я люблю петь настоящий блюз, блюз старой школы. Мне нравится петь блюз такого
    типа. Это старая школа. Это - я."


    Пять треков написала сама Коко, остальное - каверы (включая два трека авторства
    Уилли Диксона). Помогали при записи пластинки такие блюзовые звезды, как Боб Марголин
    (гитара и слайд-гитара), Крис Джонсон (гитара), а также Билли Брэнч (гармоника)
    и Марк Казаноф (саксофон). Продюсировали Коко Тэйлор, Брюс Иглауэр и Крис Джонсон.


    Увы, этот студийник оказался последним - 3 июня 2009 года Коко Тэйлор ушла от
    нас, но музыка ее по-прежнему с нами.'
