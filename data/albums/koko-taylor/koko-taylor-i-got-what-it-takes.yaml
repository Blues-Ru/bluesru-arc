- id: 1509
  author: Константин Колесниченко
  mark: 9
  date: '2009-03-17'
  text: 'Альбом "I Got What It Takes" стал во многом для Коко Тейлор определяющим. С ним она начала свое длящееся до сих пор
    сотрудничество с самым успешным блюзовым лейблом "Аллигатор", а также номинировалась за него на Грэмми.


    Коко вообще везло на звукозаписывающие компании - в начале 60-х она попала на "Чесс", затем, в 70-х были "Evidence", "Black
    and Blue" и конечно же "Аллигатор". Знаменитый Вилли Диксон, взял ее под свое крыло на "Чесс" и именно его песни "Got
    What It Takes"(июнь 1964 года), а также "Whang Dang Doodle"(декабрь 1965), в исполнении которой она могла тягаться с самим
    Howlin'' Wolf, стали ее визитными карточками и хитами на все времена.


    Блюз, исполняемый Коко еще в 60-х был довольно современным и свежим - West Side Blues. Ее записи для Чесс были довольно
    багато аранжированы, и Тейлор очень легко смешивала соул, блюз и ритм-н-блюз. Этому она училась у Вилли Диксона, а также
    у своих более молодых коллег. Время прошло и она стала самостоятельной звездой, лидером ансамбля и очень востребованным
    музыкантом, но все музыкальные уроки, полученные в Чесс, она усвоила очень хорошо.


    Помимо истинно блюзового вокала Тейлор, альбом "I Got What It Takes" очень хорош в плане подобранного материала, игры
    группы, а еще тем, что помимо довольно известных композиций, вроде "Big Boss Man", "What It Takes", "Blues Never Die"
    на записи присутствует и свежий авторский материал "Voodoo Woman", "Be What You Want To Be", "Honkey Tonkey". Отдельной
    похвалы заслуживает и аккомпанирующая группа с двумя известными чикагскими гитаристами: Mighty Joe Young (с ним она записывалась
    еще на Чесс) и Sammy Lawhorn (игравший в блюз-бендах Мадди Уотерса и Джеймса Коттона), саксофонистом Abb Locke, клавишником
    Bill Heid, басистом Cornelius Boyson и барабанщиком Vince Chappele.'
- id: 2230
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2016-09-01'
  text: '"Chicago''s premier blues growler...one of the blues'' best party albums " - LIVING BLUES


    Коко Тэйлор - абсолютная рекордсменка среди блюзовых вокалисток по количеству полученных блюзовых премий W.C.Handy (24
    награды) и признанная королева блюза из Чикаго, возведенная в 1997 году в зал славы блюза. С момента записи знаменитого
    хита Wang Dang Doodle (написанного Уилли Диксоном специально для нее) и до смерти в 2009 году Коко выпустила с десяток
    классических альбомов, вошедших в золотой фонд современного блюза. Последние 30 лет творчества Коко была вне конкуренции.


    Это первый альбом Коко Тэйлор, записанный на фирме Аллигатор (до этого она с 1963 года записывалась на других фирмах,
    включая знаменитую Chess, где она работала под крылом Уилли Диксона). В дальнейшем певица непрерывно сотрудничала с лейблом
    Аллигатор в течение более 30 лет до самого конца. Диск пользовался большим успехом и был номинирован на Грэмми. Продюсировала
    сама Коко совместно с Джо Янгом и создателем фирмы Аллигатор Брюсом Иглауэром. Кроме блюзовой классики, на диске есть
    три песни, сочиненный самой певицей (одна из них в соавторстве с Уилли Диксоном). Аккомпанирующий состав выбирала сама
    певица: один из лучших гитаристов Чикаго Майти Джо Янг, гитарист Сэмми Лоухорн (играл в группе Мадди Уотерса), саксофонист
    Эбб Локе, басист Корнелиус Бойсон (из группы Бобби Раша), клавишник Билл Хейд и постоянный ударник певицы Билл Чапелле.


    Классический альбом мощного чикагского блюза, отлично спетый, сыгранный и записанный. Один из лучших дисков королевы блюза
    из Чикаго, который и сегодня слушается с удовольствием.'
