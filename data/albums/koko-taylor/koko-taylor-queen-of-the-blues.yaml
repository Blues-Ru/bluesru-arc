  text: '"Deep soul, raw vocal power, blustery swagger...the great female blues singer of her generation" -Rolling Stone


    "That voice is in superb form...a powerful album that goes straight to the heart"-CHICAGO TRIBUNE


    Итак, королева блюза из города ветров, несравненная Коко Тэйлор, в багаже которой скопилось больше всевозможных премий
    и номинаций, чем у любого другого современного блюзового артиста.


    Тем, кто помнят знаменитый хит Wang Dang Doodle в исполнении столь популярных у нас в середине 70-х Livin'' Blues, будет
    небезинтересно узнать, что оригинал записан именно этой певицей на фирме Chess.


    Альбом 1985 года (уже на фирме Аллигатор, с которой Коко сотрудничает с 1975 года), совершенно справедливо был назван
    Queen of the Blues


    К моменту выхода этого альбома она уже получила 4 престижных блюзовых премии WC Handy, 5 номинаций на Грэмми и собственно
    Грэмми за лучший блюзовый альбом в 1984 году. За предлагаемый альбом 1985 года она получила еще две премии WC Handy -
    вокалист года и артист года.


    При записи диска в качестве гостей отметились блюзовые легенды Чикаго - Лонни Брукс, Алберт Коллинз, Джеймс Коттон и Шон
    Силс. Продюсировали: сама Коко, глава лейбла Аллигатор Брюс Иглауэр и гитарист Крисс Джонсон.


    Line-Up:


    KOKO TAYLOR, Vocals


    CRISS JOHNSON, Guitar


    "PROFESSOR" EDDIE LUSK, Keyboards


    JOHNNY B. GAYDEN, Bass


    RAY "KILLER" ALLISON, Drums


    А помогали ей в записи данного альбома следующие небезызвестные музыканты:


    LONNIE BROOKS, Guitar on Queen Bee


    ALBERT COLLINS, Guitar on The Hunter


    JAMES COTTON, Harmonica on Evil and Queen Bee


    ABB LOCKE, Tenor sax on Beer Bottle Boogie and Flamin'' Mamie


    SON SEALS, Guitar on I Don''t Care No More'
