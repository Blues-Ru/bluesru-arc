  date: '2018-04-16'
  text: '"Superb" -NEW YORK TIMES


    From the Heart of a Woman - третий альбом знаменитой певицы для лейбла Аллигатор, который был издан на виниле в 1981 году
    (а на CD он выходил только в 1989 году). Коко написала только одну песню (It Took A Long Time), остальное - каверы, включая
    знаменитую "коронку" Этты Джеймс I''d Rather Go Blind. Продюсировали Коко Тэйлор и Брюс Иглауэр. Аккомпанирует практически
    тот же проверенный состав, что помогал при записи дебюта Коко на лейбле Аллигатор в 1975 году (только вместо Майти Джо
    Янга на гитаре Крисс Джонсон). Среди гостей на альбоме - Билли Брэнч (гармоника на двух треках), Эммет Сандерс (гитарное
    соло на треке 4) и А.С. Рид (тенор саксофон на треке 3).


    Пожалуй, это наиболее разноплановый альбом королевы - кроме мощного чикагского блюза, на нем присутствует и соул, и свинг,
    и ритм-и-блюз. Но все эти стили объединяет неподражаемый мощный голос и энергичная подача великой певицы. Не могу сказать,
    что это один из наиболее сильных дисков Тэйлор, но работа вполне достойная.


    Альбом был номинирован на Грэмми.'
