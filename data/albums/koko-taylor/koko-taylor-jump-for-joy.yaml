  date: '2017-06-01'
  text: '"A national treasure...she packs firepower a lot of youngsters only wish they had" - CHICAGO TRIBUNE


    Шестой альбом королевы Чикагского блюза для лейбла Аллигатор. При записи певице помогал звездный состав музыкантов, включая
    знаменитого ударника Рэя Аллисона, гитариста Крисса Джонсона, харпера Билли Брэнча, а также духовую секцию. Три трека
    написала сама Коко (плюс еще один в соавторстве), продюсировали Брюс Иглауэр, Коко Тэйлор и Крисс Джонсон. It''s A Dirty
    Job представляет собой дуэт с Лонни Бруксом, который не только записал мужской вокал, но и сыграл гитарное соло. Альбом
    посвящен памяти мужа Коко - Роберта "Попс" Тэйлора, не выжившего после автокатастрофы, в которую они попали вместе с Коко
    в 1988 году во время гастрольной поездки.


    Альбом традиционного блюза с духовыми (аранжировки делал Джин Бардж) - но, пожалуй, чуть более коммерческий и не такой
    яркий, как обычно у Коко. Диск добротный, но не лучший у Королевы.'
