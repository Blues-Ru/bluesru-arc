  text: '"The queen of Chicago blues keeps it real..her voice is a growling, stomping
    powerhouse..this blues lioness still has her bite and plenty of roar" - ROLLING
    STONE


    Предпоследний студийный альбом королевы чикагского блюза, записанный на традиционном
    для Коко лейбле Аллигатор после 7-летнего перерыва после выхода Force of Nature
    в 1993 году. В создании альбома приняла участие целая плеяда звезд блюза, включая
    Би Би Кинга (трек 6), Кенни Уэйна Шеперда (трек 3), Кеб Мо (трек 8), Джонни Джонсона
    (треки 2, 4, 10) и других. Коко написала для этого диска четыре песни. Музыка
    украшена эпизодическим подключением саксофона и губной гармоники, а на последнем
    треке - полной духовой секции. Продюсировали Брюс Иглауэр, Крисс Джонсон и Коко
    Тэйлор. Получилась пластинка энергичного высокопрофессионального современного
    блюза с мощным вокалом Коко и довольно интересным вкладом от приглашенных звезд.


    Тем не менее, на мой взгляд, возможно это тот самый случай, когда то ли звезд
    было слишком много, то ли каждый из них тянул одеяло на себя, а может, по какой-либо
    другой причине, но что-то не сложилось, и результирующая пластинка не производит
    цельного впечатления, не хватает завершенности аранжировок - в общем, уровень
    чуть выше среднего для дисков Коко. К сожалению, Royal Blue не идет ни в какое
    сравнение с поистину щедевральными предшествующим (Force of Nature) и следующим
    (Old School) дисками певицы. Однако для большинства других исполнителей даже такой
    среднестатистический альбом Коко является недостижимой вершиной - Королева она
    и есть Королева и всегда ей останется.


    Одиннадцатое место в топе блюзовых альбомов Биллборда.'
