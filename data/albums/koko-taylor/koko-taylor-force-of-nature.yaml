  text: 'Raucous and raunchy, bommingly definiant blues...a rafter-rattling voice" - WASHINGTON POST


    "Raw vocal power and blustery swagger...a royal level of accomplishment worthy of Muddy Waters " - ROLLING STONE


    Коко Тэйлор - абсолютная рекордсменка среди блюзовых вокалисток по количеству полученных блюзовых премий W.C.Handy (24
    награды) и признанная королева блюза из Чикаго, возведенная в 1997 году в зал славы блюза. С момента записи знаменитого
    хита Wang Dang Doodle (написанного Уилли Диксоном специально для нее) и до смерти в 2009 году Коко выпустила с десяток
    классических альбомов, вошедших в золотой фонд современного блюза.


    Альбом 1993 года у меня - самый любимый из всего творческого наследия Коко Тэйлор. Поразительно, как ей удалось в 65 лет
    записать такой мощный диск традиционного необузданного блюза с современным жестким звучанием. Впрочем, на то она и королева!


    Роскошная "тяжелая" блюзовая пластинка с гостевым участием Бадди Гая на гитаре, Кори Белла на губной гармонике и сопровождением
    духовой секции. Коко Тэйлор не только сочинила 3 трека данного альбома, но и выступила в качестве его продюсера (совместно
    с гитаристом ее группы Криссом Джонсоном и боссом лейбла Аллигатор Брюсом Иглауэром).'
