- id: 1872
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-09'
  text: 'Омар Кент Дайкс - гитарист, певец и композитор из Остина, штат Техас. Его
    группа играет традиционный техасский блюз-рок вперемешку с рок-н-роллом, и ассоциативно
    напоминает знаменитый Криденс (но с поправкой на 80-е годы). За долгую карьеру
    Омар приобрел множество поклонников, а в 2001 году Omar and the Howlers были включены
    в Зал славы Техаса.


    На этом диске Омар решил попробовать себя в джамп-блюзе и записал свою версию
    классических хитов эпохи свинга. Кроме собственной ритм-секции из Пола Джуниора
    на басу и Стива Килмера на ударных, ему также помогали в записи Дэвид Ньюман (саксофон)
    и Марк Казанофф (саксофоны и аранжировки духовых), а также Гэри Слечта (тромбон)
    и Гэри Примич (губная гармоника). Продюсировали Омар Дайкс и Кевин Уоммэк.


    Запись сделана по максимуму "вживую" с минимальными наложениями. Возможно, не
    все версии классических хитов оказались удачными, но в целом пластинка удалась.'
