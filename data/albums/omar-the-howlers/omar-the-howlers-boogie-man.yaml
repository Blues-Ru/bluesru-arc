- id: 1869
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-09'
  text: 'Записанный по итогам личной трагедии - смерти супруги, альбом Boogie Man впервые за 4 года содержит полностью авторский
    материал (сочиненный как лично, так и в соавторстве с рядом приглашенных профессиональных авторов). В результате довольно
    жесткий сырой блюз-рок альбома слегка разбавлен фолком с примесью кантри.


    Энергичный и мощный буги-стомп обеспечивается рядом знаменитых музыкантов, включая ритм-секцию Стиви Рэя Dоuble Trouble,
    ударника-виртуоза Терри Боззио, а также гитаристов Криса Дуарте, Йона Ди Грэхема и "Папу Мали". Впрочем, ничего принципиально
    нового для творчества Омара на данном диске нет - музыка мгновенно узнаваема, а гости держатся слегка в тени. Альбом наверняка
    придется по душе любителям творчества Кента Дайкса, равно как и всем любителям энергичного техасского буги.'
