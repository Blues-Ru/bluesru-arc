- id: 254
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Новый диск техасского коллектива, состав которого претерпел значительные изменения. Бессменный лидер группы Omar
    Dykes никуда не делся, а вот его Howlers теперь выглядят так: супербарабанщик Terry Bozzio, поигравший с Jeff Beck, Frank
    Zappa и еще кучей рок-звезд, и басист Roscoe Beck, имеющий в активе записи с Jimmie Vaughan и Robben Ford и Eric Johnson.
    Означает ли это, что именно так отныне будет выглядеть сопровождающий Dykes состав? Вряд ли. Скорее это был лишь эксперимент,
    причем весьма удачный. Ритмичный и жесткий блюз Omar Dykes приобрел новые оттенки, стал, что ли, еще более упругим. Особенно
    это заметно на хорошо известных произведениях Dykes, которые он решил записать по новой. Это блюзы "Monkey Land", "Muddy
    Springs Road" и "Wall Of Pride" с его одноименных релизов 90-го, 95-го и 88-го годов.


    Из остальных песен, большинство которых Omar Dykes уже исполнял ранее, выделю стартовую "Linin'' Track" (музыка и слова
    народные) - коротенький, но задающий тон всему альбому хит группы Mountain "Mississippi Queen". Вместе с тем, немного
    выпадают из общего ряда блюзы "Bad Seed" и "Pushin'' Fire". За последний особенно обидно, так как в старой версии он звучал
    интереснее. Впрочем, возможно, я просто придираюсь. Просто как-то неудобно все время писать лишь восторженные отзывы о
    работах одного из моих самых любимых блюзменов.'
- id: 1870
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-09'
  text: 'Омар Кент Дайкс - гитарист, певец и композитор из Остина, штат Техас. Его группа играет традиционный техасский блюз-рок
    вперемешку с рок-н-роллом, и ассоциативно напоминает знаменитый Криденс (но с поправкой на более поздний период).


    На предлагаемом диске (четырнадцатом в его дискографии) Омар переигрывает ряд своих классических хитов из прошлого, а
    также исполняет пару новых песен, и поэтому его можно рассматривать как своего рода Best of, который на момент выпуска
    данного диска отсутствовал в официальной дискографии музыканта. Диск вышел в 2001 году на лейблах Big Guitar Music/Mascot,
    а в 2002 году его переиздала компания Blind Pig Records. Помогали при записи такие гранды, как басист Роско Бек и ударник
    Терри Боззио, а также Папа Мали на ситаре и слайд-гитаре. За исключением кавера Mississippi Queen, который, на мой взгляд,
    не слишком удачен, все треки вполне достойны неоднократного прослушивания. Одним словом, данный альбом хорош для первого
    знакомства с музыкой Омара и его группы.'
