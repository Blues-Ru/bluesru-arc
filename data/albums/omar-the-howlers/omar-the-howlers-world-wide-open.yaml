  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-06-09'
  text: 'Пластинка, вполне репрезентативная для творчества Омара Кента Дайкса - классический
    энергичный техасский блюз-рок, сыгранный преимущественно собственными силами.
    На паре треков на губной гармонике Гэри Примич. Десять авторских треков да плюс
    два кавера. Продюсировали Омар Дайкс, Кевин Уоммэк и Джеймс Таттл.


    Традиционная для Омара смесь блюза и грязного рок-н-ролла в традициях Криденса
    или Стоунз. Не оригинально, но очень зажигательно и эмоционально!'
