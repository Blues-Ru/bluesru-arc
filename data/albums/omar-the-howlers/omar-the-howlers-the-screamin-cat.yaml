- id: 234
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'Наконец-то вышла пластинка с музыкой, которую я бы назвал идеальной для машины. Плотный упругий ритм, низкий сдавленный
    вокал плюс несложные мелодии. Правда, если по-честному, такую характеристику можно дать практически любому альбому Omar
    Dykes. Пожалуй, исключение составляют лишь его предпоследняя не совсем удачная работа "Swing Land" (по-моему, музыкант
    просто зря обратился к свингу) и акустический сольник "Blues Bag" 92-го года.


    Я давний поклонник Omar. Впервые его пластинка попала мне в руки в 94-м году. И постепенно все альбомы Omar, кроме двух
    первых, оказались в моей коллекции. Кстати, в своей любви к этому, наверное, самому яркому на сегодня представителю техасского
    блюза я далеко не одинок: третий альбом Omar&The Howlers "Hard Times In The Land Of Plenty" (1987) разошелся очень неслабым
    для блюзовых релизов тиражом - 500 тысяч экземпляров.


    Возвращаясь же к "The Screamin'' Cat", хочу отметить, что г-н Dykes полностью поменял состав своих Howlers, что никак
    не отразилось на звучании группы, по крайней мере, отрицательным образом.'
