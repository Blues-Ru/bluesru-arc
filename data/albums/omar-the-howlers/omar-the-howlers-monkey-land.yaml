- id: 1571
  author: Константин Колесниченко
  mark: 4
  date: '2009-08-06'
  text: Запустив в проигрывателе альбом, первой мыслью было – это AС/DС или ZZ Top? Я так удивился, потому что первыми моими
    записями Omar Kent Dykes были два последних альбома записанных при участии Джимми Вона, которые выдержаны в очень традиционном
    ключе. Потом эти, практически не имеющие отношения к блюзу, альбомы вызвали досаду. Любителям блюза искать в этих альбомах
    абсолютно нечего, а вот поклонникам бородатого трио, особенно записей периода "Eliminator", альбом придется по душе.
- id: 1871
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-06-09'
  text: 'Диск чуть более тяжелый, чем обычно у Кента Дайкса, но мгновенно узнаваемый - это все тот же техасский блюз-роковый
    буги.


    Материал преимущественно авторский, в соавторах - гитарист Дик Вагнер. На диске содержится один из главных хитов Омара
    - Monkey Man.'
