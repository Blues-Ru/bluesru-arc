- id: 1873
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-09'
  text: 'Омар Кент Дайкс - гитарист, певец и композитор из Остина, штат Техас. Его группа играет традиционный техасский блюз-рок
    вперемешку с рок-н-роллом, и ассоциативно напоминает знаменитый Криденс (но с поправкой на 80-е годы). За долгую карьеру
    Омар приобрел множество поклонников, а в 2001 году Omar and the Howlers были включены в Зал славы Техаса.


    К моменту выхода предлагаемого альбома (четвертого студийника и одного из лучших их альбомов) группа уже обзавелась рядом
    преданных поклонников, а Rattlesnake Shake вошел в 40 синглов Биллборда (добрался до 36 места). Правда, затем фирма Коламбиа
    не стала продлевать контракт с Омаром, но это его не остановило, и он продолжает записывать музыку и по сей день. На диске
    два кавера, остальной материал авторский. Присутствие клавишника в составе заметно расширяет музыкальную палитру группы
    на данном альбоме.'
