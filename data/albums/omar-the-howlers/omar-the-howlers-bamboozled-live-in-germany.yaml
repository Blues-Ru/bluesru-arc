- id: 1469
  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: 'Блюзовое веселье – дело серьезное. Веселые энергичные блюзы Омар несут отпечаток
    суровости. Терпение и труд – не главные добродетели в блюзе. Пример Омара ценен
    как уника. Терпение, и труд, и веселие – с этой узкой музыкальной тропы он ни
    разу не сходил в сторону. Нынешний альбом доказывает, что в своем деле он достиг
    совершенства: мощный хриплый голос, суровый неотступный ритм, лаконичная зажигательная
    гитара... Есть и два глубоких блюза, которые заставят остановить веселье и взглянуть
    на музыканта пристальней. Вдруг его веселье – напускное. Но если так – тем ближе
    он к сути блюза. 70 минут альбома содержат песни его сочинения за все 30 лет карьеры.
    И, возможно, это лучшее их исполнение. И лучший способ познакомится с Омаром.
    А если вы не хотите перегружать дом CD, то вполне можно этим и ограничится. (Формат
    на выбор: CD или DVD).'
