- id: 2220
  author: Олег Пчелкин (oleg_spb)
  mark: 9
  date: '2015-09-27'
  text: 'Омар Ван Дайкс в свои 66 еще весьма активен, собирает через свой сайт деньги на выпуск двойного альбома и там же
    объявляет о том, что его новый альбом The Kitchen Sink появиться скоро. На I-tunes 25 сентября 2015 года альбом уже появился
    и произвел достаточно благоприятное впечатление, если не считать две попытки Омара спеть в стиле кантри The Battle Rages
    и Climb On Board, где у слушателя возникает ощущение, что какой-то немолодой любитель приятным голосом поет караоке и
    изредка мило фальшивит.


    А в остальном - все хорошо. Открывает альбом добротный блюз-рок номер That Ain''t It, потом Омар весьма преуспел в Fire
    And Gasoline, спел ну просто как шаутер 1940-1950х, как Джимми Уизерспун (Jimmy Witherspoon), столь же эффектно преподнес
    I''ll Keep On Dreamin'', винтажный эстрадный кантри-блюз со скрипочкой и знакомым хрипловатым, но уже подсевшим с возрастом
    голосом не подвел в шаффле Dirty People.


    В стиле блю-грасс (Dixie''s All Night Bar) Омар показал себя отменным мастером жанра. Cutie Named Judy - получилось что-то
    такое от Джона Фогерти времен Cosmo''Factory, но весьма слушабельное. Ну а дальше пошли кавера-стандарты: концертный вариант
    Dust My Broom Роберта Джонсона- Элмора Джеймса, Who Do You Love- кавер Бо Диддли "Кого Вы любите", Can''t Hold Out - еще
    один стандарт, шаффл Элмора Джеймса, украшенный партиями саксофона и харпа. Слушая Hello Operator осталось впечатление,
    что артист решил спеть что-то свое на мотив хита RS "Its all over now" . Те фаны Omar And The Howlers, которые ждали три
    года новой работы этой группы - разочарованы не будут, особенно те, кто кроме блюз-рока, симпатизирует и джазу.'
