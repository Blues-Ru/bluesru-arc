  author: Дмитрий Казанцев
  mark: 8
  date: '2006-01-23'
  text: 'Уолтер - гитарист, певец и автор из Нового Орлеана. Это его третий альбом
    и второй для лейбла Rounder Records. Уошингтон играет фанк, соул, блюз и все,
    что связано с музыкой Нового Орлеана (что-то даже звучит как джаз-фанк). Удивительно
    и то, что это не звучит как 1988 год, настолько хорош и натурален звук. Голос
    Уолтера чем-то похож на Рэя Чарльза, кстати (что не удивительно, конечно).


    Вулфмана всегда относят к блюзу. Да, можно сказать, что в целом, это новоорлеанский
    соул-блюз, но его фанковые номера звучат очень серьезно, это вовсе не так, как
    когда блюзмены пытаются прифанковывать. На диске 8 песен, 2 из них написал сам
    Уолтер. Есть тут и известные темы: "You Can Stay But The Noise Must Go" (Johnny
    Guitar Watson), "Ain''t That Loving You" (Deadric Malone), "Nobody''s Fault But
    Mine" (Otis Redding).


    Хороший, цельный альбом. Понравится одновременно любителям блюза, соулстерам и
    фанкерам.'
