- id: 1302
  author: Андрей Евдокимов
  mark: 7
  date: '2008-06-26'
  text: 'Этот врать не станет: сказал "Фанково" - так и есть. Это не гаражный фанк 90-х и не разновидность авангардного джаза.
    Хотя в пьесе Wolf Jazz он, конечно, тоже не врет: джаз, но по-волчьи. А в целом весь этот фанк – по-блюзовому. Отличный
    ритм, не через уши, а через кожу и через кровь заставляющий быстрее биться сердце. Ушам достаются "мемфисские" партии
    духовых, краткие гитарные лики Вулфмена и его глубокий, хриплый, грубоватый голос. Он умеет разнежничаться, но лишь в
    песне под названием "За день до того, как стану дураком". Дальше этот голос уверено ведет за собой госпел-хор в посвящении
    "Звездам над Новым Орлеаном". Альбом не назовешь новаторским, но кто же ждет крутых поворотов от ветерана новоорлеанской
    музыки. Его любят именно за верность традициям. И за вечную свежесть.. Ритм, энергетика, автобиографическая начинка текстов
    – три кита, на которых зиждется эта музыка.'
