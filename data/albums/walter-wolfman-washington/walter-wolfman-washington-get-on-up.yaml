- id: 832
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-24'
  text: 'Очень редкий альбом ньюорлеанского гитариста Уолтера Уошингтона. Он вышел в английской блюзовой серии Charly Blues
    Masterworks. На самом же деле, блюза тут немного; этот диск скорее фанковый, с элементами блюза и даже джаза. Уолтер интересно
    и самобытно играет на гитаре, может легко играть по блюзу одновременно с джазовой импровизацией. Его голос не для всех
    - что-то среднее между Рэем Чарльзом и Дэвидом Клэйтоном-Томасом; хорошо то, что на альбоме есть инструменталы - они и
    есть лучшие треки диска.


    Вулфману помогают: Carlos Cosey - keys; Bratt James - bass; Wilbert Arnold - drums; George Jackson - percussions; Sam
    Henry - keys; Joe Smith & Johnny Ray - trumpets; Hrdich Rivers & Lester Singleton - saxes. Альбом записан в Новом Орлеане
    в 1981 году. Надо отметить, что звук просто прекрасный для начала 80-х; Уолтер шел против течения - он играл музыку, которая
    была в моде лет 5-7 назад (и это замечательно). Из 9 песен, Уошингтон написал 8; "Honky Tonk" - знаменитый ритм-н-блюзовый
    хит 50-х годов органиста Билла Доггетта.


    Очень интересная пластинка, самым слабым местом которой является неоднозначный вокал Вулфмана. Инструментал "Get On Up"
    - настоящий хит и маленький шедевр.'
