- id: 878
  author: Константин Колесниченко
  mark: 6
  date: '2005-10-02'
  text: Одно из последних творений Lowell Fulson. Альбом получился какой-то старческий,
    Фулсон поет уставшим, слабым голосом. Его гитара все также лаконична, играет он
    поразительно короткие соло. Среди композиций очень много соул-фанковых, в них
    Fulson играет еще меньше. Грустно слушать такие диски, но у них есть какое-то
    пожилое обаяние и доброта. В качестве знакомства с творчеством Фулсона, рекомендую
    его ранние альбомы, фирма "Ace" их переиздавала.
