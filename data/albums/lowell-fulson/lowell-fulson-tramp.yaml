- id: 1404
  author: Константин Колесниченко
  mark: 8
  date: '2009-01-05'
  text: 'Заглавная композиция наверняка известна многим по довольно странному альбому Бадди Гая "Sweet Tea". Оригинал отличается
    мягким вокалом Лоуэлла, фанковым ритмом и гораздо более лаконичным соло на гитаре.


    Альбом можно разделить на 2 части: новый подход к музыке - композиции, вроде заглавной "Tramp" (все они довольно похожи
    на нее) и довольно стандартные ритм-н-блюзы (сдобренные духовой секцией) в духе того времени. В чем-то "Tramp" мне напоминает
    подобные альбомы T-Bone Walker вроде "Funky Town" или "Good Feelin'' ", да и подход к игре на гитаре у них очень похож.
    В то время блюз начал меняться и шершавым записям Чесс приходили на смену блюзы пропитанные новым ритмом и энергетикой
    - Лоуэлл был одним из первых, кто подхватил эти веяния и стал одним из родоначальников нового блюза, в этом смысле альбом
    "Tramp" хрестоматийный.


    P.S. Я бы советовал обращать внимание на все, к чему прикасался Jimmy McCracklin, большинство таких записей со временем
    превращаются в золото блюза, песня "Tramp", написанная в соавторстве с Фулсоном, - один из таких "слитков".'
