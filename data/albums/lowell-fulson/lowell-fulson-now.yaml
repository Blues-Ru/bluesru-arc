- id: 1403
  author: Константин Колесниченко
  mark: 10
  date: '2009-01-05'
  text: 'Любителю блюза, который еще не начал раскапывать сокровища жанра, Луэлл может быть знаком по знаменитой "Reconsider,
    Baby", записанной для Чесс. При первом, поверхностном прослушивании, наверняка сложится впечатление, что это очередной
    музыкант, играющий блюз и ритм-н-блюз в ключе, заданном B.B. King. Но если копнуть глубже, то с "Three O''Clock Blues"
    (коронный номер B.B. King''a ) он стал хитмейкером еще в 1948 году. В 1967 году он записал "Tramp" - во многом решающий
    альбом для самого себя и для жанра в целом. На этой записи он вплотную приблизился к новому тогда в блюзе фанку и записал
    свой большой хит - заглавную песню альбома.


    "Now!" - это второй альбом Лоуэлла в таком ключе и он гораздо более ориентирован на то, современное для жанра звучание.
    Даже название совсем в духе того времени, не говоря уже об оформлении альбома! Эта запись получилась живее, ярче и интереснее
    предыдущей, хотя во многих справочниках "Now!" ценится меньше "Tramp". Музыка альбома очень разнообразна, пропитана грувом
    и классным настроением! Даже "Every Day I Have The Blues" звучит свежо! Очень уместно и убедительно звучит вокал и гитарная
    игра Лоуэлла. Этот альбом для тех, кому нравится музыка Литтл Милтона, БиБи Кинга и Альберта Кинга в 70-х!'
