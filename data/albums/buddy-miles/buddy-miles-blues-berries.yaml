  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-17'
  text: 'Бадди Майлз - гениальный драммер и певец. Он также играет и на других инструментах. Его музыка - это смесь блюза,
    рока, соула и фанка. Так было всегда, так и на этом альбоме (хотя здесь акцент явно сделан на блюзе и блюз-роке). На гитаре
    играет некто Rocky Athas - виртуозный, мощный блюз-роковый гитарист. Его игра точна и интересна, это будет интересно любителям
    современного блюза (все, что было после Стиви Рэя).


    На диске 10 песен, длится он почти час - много игры и импровизации. Знаменитая "Tobacco Road" открывает альбом и сразу
    задает тон и настроение всей пластинке. Очень хороша "Texas Cannonball" - посвящение Фредди Кингу. Интересно еще и то,
    что тут есть что послушать и рокерам, и блюзменам, и соулстерам - настолько разнообразно и ярко делают это парни под руководством
    Бадди.'
