- id: 2044
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2012-08-07'
  text: 'Свой шестой сольный альбом гитарист из Чикаго Дэйв Спектер записал полностью инструментальным. На диске представлена
    смесь блюза и джаза в стиле Ронни Эрла или Брюса Катца (Хаммонд В3 клавишника Роба Уотерса играет заметную роль). Девять
    композиций авторских, четыре кавера. Музыка квартета приобретает дополнительные краски благодаря эпизодическим включениям
    саксофониста Рича Паренти.


    В целом - добротная профессиональная работа, радующая стилистическим разнообразием. До гениального Эрла недотягивает,
    но слушается вполне приятственно :-)'
