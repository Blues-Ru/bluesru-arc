  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2013-07-22'
  text: 'Гитарист-виртуоз из Бостона, Гэри Хои пробовался в группу Оззи Озборна в 1982 году на смену безвременно ушедшего
    Рэнди Роадса, однако работу не получил. Но это не остановило молодого гитариста, который не опустил руки, и в конце концов
    добился успеха в 1993 году, записав дебютный альбом Animal Instinct. На этом диске была представлена роковая интерпретация
    композиции Hocus Pocus, исходно сочиненной Аккерманом и Ван Леером из знаменитой голландской арт-роковой группы Focus
    и включенной в их наиболее успешный второй альбом Moving Waves 1971 года. Кавер от Гэри добрался до 5 места в Биллборде,
    а дебютный альбом стал наиболее коммерчески успешным диском музыканта. Впоследствии Гэри записал еще более 15 альбомов
    и обеспечил себе прочное место в сотне лучших гитаристов всех времен и народов.


    В течение долгого времени Гэри хотел записать диск блюзов, и вот, наконец, его мечта осуществилась. Интересно, что средства
    для записи этого альбома он привлек от своих поклонников через интерент-проект Kickstarter. На диске 2 кавера блюзовой
    классики, остальные треки написал сам гитарист, который также исполнил партии всех инструментов, кроме ударных, а также
    выступил в качестве инженера записи и занимался микшированием и продюсированием. Помогали при записи друзья музыканта:
    Джеймс Монтгомери (гармоника), Йон Бутчер (гитара), Фрэнк Хэннон (слайд-гитара), а также Джонни А (гитара и слайд). В
    итоге получился альбом современного мощного блюз-рока, который найдет своих поклонников среди любителей виртуозной гитары.'
