  author: Андрей Евдокимов
  mark: 8
  date: '2010-01-18'
  text: "Блюз мертвого парня, или Блюз мертвеца, или Мертвецкий блюз. Как не выкручивайся с переводом названия этого трио\
    \ – оптимистично или позитивно не получится. В этот коренное отличие группы на поле современного блюза, который стал слишком\
    \ гладеньким и чистеньким. Уходят последние мастера старой чикагской школы, прекратил свое существование лейбл \"Фэт Поссум\"\
    , разыскивавший в 90-х миссиссипских блюзменов, переключившихся на электричество, но не покинувших свои маленькие джюк-джоинты,\
    \ где по пятницам и субботам устраивались танцы до утра под живую неказистую, зато увлекательно ритмичную музыку. Большинство\
    \ нынешних звезд блюза предпочитают играть блюз так, словно они и в туалет ходят исключительно во фраке, в крайнем случае\
    \ – в клубном пиджаке. \tDead Guy Blues играют небрежно и вовсе не виртуозно. Зато от души, с той смесью гордости, хвастливости\
    \ и жалоб на неудачи и собственную никчемность. Играют они увлеченно, энергичной, с полной самоотдачей. На рубеже 60-х\
    \ и 70-х годов они могли бы стать звездами, но сейчас это все звучит как анахронизм. И по всей видимости, выбор стиля\
    \ и общего звучания был вполне сознательным.\n\nДебютный альбом группы вышел в 2004 году, записан с приглашенным клавишником.\
    \ Деад Гай по звучанию легко распознается как \"белая\" группа. Нынешний – трио. Ударник без комплексов играет прямолинейный\
    \ рок. Но достоинства перевешивают недостатки. Несмотря на отдельные заимствования у, скажем, Стиви Рея Воэна и даже Криса\
    \ Дюарта, музыка Деад Гай звучит так, словно ничего нового не случилось с блюз-роком со времени смерти Дюана Оллмана.\
    \ Может, в этом отрицании новшеств и кроется объяснение странноватого названия группы Иногда, хоть и спотыкаясь, Джеф\
    \ Пауэрс показывает высокий класс игры. Но даже если это и уэст-коаст-блюз, то далекий от нынешних его технических достижений.\
    \ В звучании первого альбома чувствовалась некая скованность, испуг перед первой серьезной работой в студии, второй альбом\
    \ свободен от смущения. Уверенная жесткая игра, песни стали еще лучше, особенно по качеству содержания. Вообще группа\
    \ существует восемь лет. Формат пауэр-трио: Chris Boross играет на бас-гитаре, Steve Zavesky – за ударными. И инициатор\
    \ создания группы - Джеф Пауэрс – вокал, гитара, он же автор почти всех песен. - Dead Guy Blues чужих песен не поют, только\
    \ свои. Благо Джеф сочинил их уже более двух сотен. Он получил музыкальное образование, играл классику на гитаре, преподавал\
    \ сам. И именно как учитель игры на классической акустике переехал в Мехико. Однако город затянул его в ряды мариачи,\
    \ он играл на улице, в клубах, которые правильно бы называть кабаками, он даже давал концерты в мексиканских тюрьмах.\
    \ Денег едва хватало на жизнь, обычно он на очередной концерт отправлялся пешком или на автобусе, с гитарой и усилителем\
    \ в руках. Как тут не выработать свой непробиваемый жесткий блюз. И вести себя как богач, даже если в кармане пусто. Джеф\
    \ Пауэрс провел в Мексике 7 лет, и в Штаты, в родной Кливленд, вернулся не преподаватель игры на классической гитаре,\
    \ а прожженный блюзмэн. Мексиканские мотивы изредка мелькают в его гитарных импровизациях \t\t\t\t\t\t Вообще-то, с такой\
    \ музыкой трио группе нечего и мечтать о звездной славе. Это явно музыка задиристых лузеров, гордых неудачников, к тому\
    \ же придерживающихся нездорового образа жизни. Такие блюзмены ныне - большая редкость."
