- id: 1444
  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: 'Что плохо, так это полное несоответствие пафоса названия и обложки с приземленностью музыки. Звучит очень хороший
    уэст-коаст-блюз, сыгранный душевно, как умеют ветераны стиля. Ритм тяготеет чуть "назад", что в пьесе Jo Angelyn создает
    впечатление ленивого свинга, а в песне I''m A Lucky, Lucky Man – ироничного и неторопливого шаффла. Имена двух участников
    группы отлично известны любителям клубного уэс-коаст-блюза. Эл Блейк – опытный вокалист и исполнитель на губной гармонике.
    Фред Кэплан – интеллектуал блюзовых клавишных. Они, как и басист Ларри Тэйлор (экс-Canned Heat) играли еще в 60-х. Идеально
    в эту компанию вписывается гитарист Кирк Эли Флетчер, которого в 60-х еще и в проекте не было. Объединяет поколения простой
    принцип игры: не частить. По давним блюзовым заветам здесь каждая нота – дорогого стоит. Все традиции подаются с хорошей
    приправой чувства юмора. И, что редкость для традиционалистского альбома, почти все песни сочинены участниками группы.
    Одно из трех исключений – песня Джимми Роджерса You''re Sweet. Поскольку она выпадает из общей концепции звучания мини-свинг-бэнда,
    она названа "бонусом" и завершает альбом очень душевным кантри-блюзом "на троих": к Блейку и Флетчеру присоединяется Ким
    Уилсон, еще один мастер-харпер.'
