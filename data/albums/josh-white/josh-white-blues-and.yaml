  date: '2007-12-10'
  text: 'Джош просто обалденно поет и играет на акустической гитаре. Ему помогает джазовый состав. В программе - классные
    блюзы, фолк и джаз. Тут есть такие хиты: "How Long", "Careless Love", "St. Louis Blues", "Good Morning Blues". Изумительная
    запись и атмосфера!'
