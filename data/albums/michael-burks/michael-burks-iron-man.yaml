- id: 1256
  author: Андрей Евдокимов
  mark: 7
  date: '2008-04-23'
  text: 'Есть ли порох в блюз-роковых пороховницах? Конечно, он выдохся еще в начале
    70-х, но для каждого правила найдется свое исключение. По музыке Майкла Беркса
    (и по его мощному внешнему виду, и по энергичным выступлениям) вы не догадаетесь,
    что в прошлом году он отпраздновал свое 50-летие. Потомственный музыкант, он в
    двухлетнем возрасте получил в руки гитару. Папаша учил его по американской системе:
    "Разучишь новую песню к моменту, когда я вернусь домой с работы, получишь доллар".
    Как в любой истории про американского миллионера, с тех пор Беркс только приумножает
    свое музыкальное состояние. В нынешнем альбоме он врывается в тяжелый гитарный
    блюз с яростью и мастерством бывалого легионера. Словно тетиву лука он вытягивает
    пальцами струну на грифе своей гитары Flying V, заставляя гитару и выть, и стенать,
    и гневаться, и ластиться. Он знающий композитор, и пышные гитарные импровизации
    разворачиваются на фоне аранжировок с изысканными гармоническими переходами. И
    вся эта музыка далека от тяжелого рока – Беркс обладает голосом большим, глубоким
    и мягким, комфортным. Он певец старой школы "соул" и хард-блюзовый гитарист. Пикантное
    сочетание!


    <small>впервые опубликовано в газете "Ведомости"</small>'
- id: 1285
  author: Разные авторы
  mark: null
  date: '2008-06-03'
  text: '"Железный человек" идет тяжелой поступью, не тратится на прихотливую вязь
    музыкального узора, его стиль стабилизировался на третьем релизе. Беркс предложил
    нам максимально последовательный в смысле блюза диск. "Жирные" подтяжки-бенды,
    сочные соло его "Гибсона" оттеняются классическим "Хэммондом". Все это неспешно,
    в среднем темпе (чувствуется школа великого Элберта Кинга). Беркс отбросил заигрывания
    с соулом, в которые он пустился на предыдущем диске, и принялся делать ясную и
    несуетную блюзовую материю, демонстрируя не столько виртуозность – это не его
    конек – сколько зрелую мудрость, часто открывающую глубину в простом. Мелодии
    диска, 6 из 10 которых сочинил сам Майкл, просты. Они не имеют отношения к блюзроку,
    хотя достаточно плотны, чтобы считать их отменным современным блюзом. Лучший альбом
    Беркса!'
- id: 2302
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2018-04-12'
  text: 'Несмотря на то, что первый сольник Майкл Беркс выпустил, когда ему было уже
    за 40, а успех пришел к нему еще позже, он пять раз получал номинации на блюзовые
    награды, а журнал Livin'' Blues в 2004 году присудил ему награду критиков как
    лучшему гитаристу.


    Iron Man - вполне адекватное название для четвертого сольного альбома (и третьего
    на лейбле Аллигатор) гитариста и певца Майкла Беркса по прозвищу "Железный человек".
    На диске пять каверов (включая Hard Come Easy Go Тинсди Эллиса и Fire and Water
    от Free), остальной материал авторский. Продюсировали Брюс Иглауэр и Майкл Беркс.
    Достаточно интересный альбом преимущественно среднетемпового современного блюза,
    сыгранный максимально близко к концертному звучанию за счет записи под аккомпанимент
    гастрольной группы Беркса. Особый шарм диску придают мощные техничные соло Майкла,
    а также его глубокий эмоциональный вокал. Альбом добрался до 4 места в топе блюзовых
    альбомов Биллборда.


    К сожалению, 6 мая 2012 года по возвращении в Америку из европейского турне в
    аэропорту Атланты Майкл скончался от сердечного приступа, успев записать только
    еще один альбом Show of Strength 2012.'
