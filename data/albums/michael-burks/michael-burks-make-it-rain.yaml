- id: 318
  author: Евгений Долгих
  mark: null
  date: '2003-12-02'
  text: 'Майкл - потомственный блюзмен. И его дед, и отец играли на гитаре и пели. Неудивительно, что уже в шесть лет он впервые
    вышел на сцену блюзового клуба в родном городе Кэмден, штат Арканзас, вместе со взрослыми музыкантами.


    Образцом для подражания и учебы для Беркса всегда был Альберт Кинг. Нельзя сказать, что он так уж на него похож, но общего
    много. Даже чисто внешне - Майкл тоже высокий и крепкий чернокожий музыкант и играет на Гибсоне "Flying V" - гитаре в
    виде большой латинской буквы V, которая всегда у всех ассоциируется именно с Альбертом Кингом.


    Беркс делает электрический блюз в очень современном стиле, в котором есть элементы и южной, техасской манеры, и чикагской,
    и даже кое-что от госпел. Все вместе насыщено яростной энергией, даже медленные вещи, но к блюз-року это не имеет никакого
    отношения. Здесь скорее продолжение линии того же Альберта Кинга - некое сочетание соул/фанка и блюза. Выходит красиво,
    мелодично, но не попсово. Кстати, этот альбом почему-то очень нравится многим любителям джаза, наверное, из-за яркого
    и чистого звучания инструментала, а также интересного звучания духовых.


    Беркс говорит: "Блюзмен никогда не играет для себя - только для слушателя". Тут он прав - и вы это сразу услышите, когда
    поставите диск в проигрыватель.'
- id: 2086
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2012-08-15'
  text: '"Outrageous tone, explosive solos and soulful vocals-part rock, part soul and plenty of blues. A master...he may
    be the next Luther Allison" - BLUES REVUE


    "One of the 200 best guitar records of all time" - GUITAR ONE


    Второй сольный альбом Майкла вышел на фирме Аллигатор и был тепло встречен критиками и любителями блюза, а журнал Guitar
    One занес его в символические 200 лучших гитарных альбомов всех времен и народов.'
