- id: 755
  author: Дмитрий Казанцев
  mark: 7
  date: '2005-07-07'
  text: 'Это последний альбом Сонни, он умрет через два года после него в 1986 году. Состав здесь очень необычный - Джонни
    Уинтер на гитаре и пианино (это не есть хорошо, как Вы понимаете, он просто забивает Сонни своей шумной и грязной игрой),
    на барабанах некто Стив Хомник (играет он много и не в груве, странный выбор ударника), на контрабасу - Уилли Диксон (тут
    все хорошо, конечно). Сам Сонни никогда не был великим певцом (по сравнению с Брауни МакГи, например), а тут он совсем
    слаб, но его "вупинг" по-прежнему хорош. Гармошка Терри уже тоже не та, но все же это по-прежнему хороший альбом. Надо
    не забывать, что это был 1984 год, дурацкий лейбл Аллигатор, а Терри уже 73 года (а он никогда не был здоровым и дисциплинированным
    человек).


    Хороший диск, но это совсем не то и не так, как они умели делать с Брауни.'
