- id: 615
  author: Дмитрий Казанцев
  mark: 7
  date: '2005-05-05'
  text: Второй альбом Сонни Терри на лейбле Bluesville. Фактически это номерной полусборник. Дело в том, что половина альбома
    записана вместе с Лайтнином Хопкинсом и его ритм-секцией (Леонард Гаскин и Белтон Эванс), а вторая половина - это привычный
    дуэт с Брауни МакГи. Концепция не очень сильная, но зато музыка хорошая на всем альбоме. "One Monkey Don't Stop The Show"
    - просто волшебный блюз.
