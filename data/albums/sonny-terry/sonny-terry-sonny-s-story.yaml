  author: Дмитрий Казанцев
  mark: 8
  date: '2005-05-05'
  text: 'Один из первых альбомов Сонни. На гитаре Stick McGhee, на второй гармошке
    здорово помогает J.C. Burris, кое-где есть негромкие ударные, на которых играет
    Belton Evans или J.C. Burris. Сам Сонни прекрасно поет и дует в свой харм. Он
    него исходит море энергии и музыки. Фолк-блюз, Piedmont Blues, дельта.


    10 прекрасных блюзов, 9 из них написал сам Сонни. Есть один минус - голос Сонни
    записан слишком громко, иногда хочется вытащить на первый план гитару, ударные
    и даже гармошки. Но эту запись делал сам Rudy Van Gelder, ему хотелось так в далеком
    1960 году.'
