  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-02'
  text: 'Сонни Терри я люблю даже больше Сонни Боя Второго. Просто восхищаюсь его записями с Брауни Макги.


    Этот диск вышел в серии Capitol Blues Collection (vol. 2). Здесь собраны записи Сонни 1947 года + 3 композиции 1950-го.
    Записи сделаны с оригинальных пластинок, но звучат на удивление хорошо (для тех лет). Вместе с Терри тут играют: Брауни
    Макги - гитара, Бэйби Доддс - ударные, Мелвин Мерритт - пианино, Уилберт Эллис - пианино. Песни очень классные и отлично
    спеты и сыграны. Must Have для любого любителя блюза!'
