- id: 1348
  author: Константин Колесниченко
  mark: 9
  date: '2008-10-27'
  text: 'У Стива получается очень правильный современный блюз, с харизмой, чувством, а главное - со вкусом. Он очень разумно
    использует свои возможности вокалиста и инструменталиста (гармоника) - ни одной лишней фразы. По сути, музыка Гайгера
    на этом альбоме - это старый добрый чикагский блюз, но современным его делает более широкий мелодический набор: "Lets''
    Rock Tonight" - классная прифанкованная тема, "Monkey On A Limb" - потрясающе красивая композиция с латиноамериканским
    оттенком, "Blue Mambo" - это музыкальная шутка, "Walking Through The Park" Мадди, плавно перетекающая в классическую блюзовую
    мамбу (похожее в свое время сделал Big Walter Horton с "La Cucaracha"). На альбоме Стив часто использует ритмы блюза,
    отличные от шаффла.


    Для меня Гайгер очень похож с Гари Примичем - подход к блюзу и к инструменту у них очень похожий - лаконично, максимально
    разнообразно, но в рамках блюза. У меня переиздание этого альбома - добавлено еще 3 песни и ремастирован звук.'
