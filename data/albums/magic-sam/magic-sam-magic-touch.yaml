  date: '2009-01-13'
  text: '<img src="http://image.allmusic.com/00/amg/cov200/drc600/c698/c69893r7e94.jpg">


    Концертный альбом Magic Sam''a, все записано в каком-то кабачке Чикаго "Sylvio''s" в 1966 году. Обычно я не люблю слушать
    такие записи - у них плохой звук, который, лично меня, отвлекает от прослушивания, как бы хорошо не играл музыкант. Но
    у этой записи, на которой слышен гомон людей в зале, есть какое-то обаяние. Может быть потому, что у Сэма было так мало
    прижизненных записей. Но альбом на самом деле хорош - Сэм играет малым ансамблем, потому все детали и особенности его
    игры - как на ладони.


    Magic Sam''у на альбоме помогают Mack Thompson - bass и Odie Payne - drums, иногда к группе подключается харпер Shakey
    Jake Harris. Материал альбома не самый разнообразный, но если закрыть глаза, включить запись погромче, то от выкриков
    публики на песне "I Got To Know", от безупречной игры Меджика, от его искреннего вокала мурашки пойдут по коже!'
