- id: 445
  author: Федор Романенко
  mark: 9
  date: '2004-02-03'
  text: 'Мне подарили первый и последний компакт-диск гитариста Volker Strifler 2002 года - музыканта немецкого происхождения,
    кажется, из числа друзей Роббена Форда. Первая песня - заявка на то, что я умею играть не хуже Стив-Рей-Вона, в его стиле,
    но с дополнительными выкрутасами, которые тот не успел изобрести. ;) После на пластинке появляется неожиданное разнообразие
    в стилях - часть песен отличным слайдом, а также приджазованно-присвингованные номера, блюз-рок, пара баллад, фьюжн, есть
    даже одна плохая песня и пр. ;) Пластинка с очень современным звучанием - Волкер Страйфлер явно очень хорошо разбирается
    в разных гитарных стилях и весьма свежо их комбинирует. Обычно от гитаристов такого плана слышишь развитости в каком-то
    одном направлении, за что они получают свои регалии, поэтому этот диск - вещь очень неожиданная.


    В-общем, он мне очень понравилось, эту пластинку явно стоит послушать, если вы любите современную гитарную музыку. Причем,
    Страйфлер - гораздно более продвинутый музыкант, нежели толпы молодых блюз-рокеров. Один момент лично меня немного смущает
    - какой-то легкий признак того, что я в блюзе не очень люблю. То, почему я могу слушать одни пластинки бесконечно, а другие
    - только несколько раз. В некоторых песнях этого стиля слышна натянутость, что-ли, которую я, увы, уже не могу НЕ слышать
    у SRV, к примеру. Трудно объяснить, но есть ощущение, что если гитарист перестанет подгонять ритм, то песня сама по себе
    без него умрет. Будто не гитарист играет для хорошей песни, а песня сделана для крутого гитариста ;) Но это - нюансы,
    а в остальном - все очень хорошо. Можно с уверенностью сказать, что Страйфлер - еще один секретный и очень интересный
    современный гитарист, которого, увы, не услышат те, кто не проявляет любопытсва, находясь в плену предрассудков ;)'
