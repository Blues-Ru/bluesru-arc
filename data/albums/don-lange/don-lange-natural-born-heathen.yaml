  author: Дмитрий Казанцев
  mark: 8
  date: '2005-11-27'
  text: Замечательный фолк-блюз-рок. Дон прекрасно поет, пишет песни и играет на акустической гитаре. С ним симпатичная группа,
    хорошо играют и подпевают. Это один из самых ранних альбомов на лейбле Flying Fish - живой звук и атмосфера. Редкость,
    но очень нужная и приятная.
