- id: 1045
  author: Александр Панин
  mark: 10
  date: '2006-11-07'
  text: Этот альбом не входит в официальную дискографию Масслвайта и продается только на его концертах. На нем пятнадцать
    треков, Чарли играет один на акустической гитаре и гармошке. Ряд композиций известен слушателям по его номерным альбомам,
    так, к примеру, "заглавный" трек In My Darkest Hour можно найти на диске <a href="http://www.allmusic.com/cg/amg.dll?p=amg&sql=10:lbjxlfge0cqe">One
    Night In America</a>, песню My Road Lies In Darkness – на <a href="http://www.allmusic.com/cg/amg.dll?p=amg&sql=10:r96dtr3tkl4x">Sanctuary</a>,
    ну а Clarksdale Boogie появился на недавно вышедшем <a href="http://www.allmusic.com/cg/amg.dll?p=amg&sql=10:tm1uaknkdm3m">Delta
    Hardware</a>. Однако все эти известные и "коммерческие" версии исполнены вместе с другими музыкантами, а на Darkest Hour
    звучат те же песни в сольной акустической интерпретации. Записи ни в коем случае нельзя назвать демонстрационными, это
    настоящие законченные произведения, прекрасно сыгранные и записанные. Звонкая гитара, потрясающая гармошка, грустноватый
    и эмоциональный вокал Чарли. И – старый добрый блюз. Старый по духу, поскольку здесь нет ни одного кавера, все песни сочинил
    сам Чарли, и они превосходны. На мой взгляд, это музыкальный шедевр. Очень жаль, что этот диск имеет столь ограниченное
    распространение.
- id: 1056
  author: Константин Колесниченко
  mark: 10
  date: '2007-04-04'
  text: 'Этот альбом не входит в официальную дискографию Масселвайта. Чарли продает его только на своих концертах. Издан альбом
    на лэйбле Henrietta Records, который назван в честь жены Масслевайта, его помощницы и продюсcера.


    Дизайн очень аскетичный - картонный конверт, с минимумом текста и фото, но он, как нельзя лучше, соответствует названию
    "Darkhest Hour".


    Диск заполнен 15 авторскими композициями, исполненными персонально Чарли на гитаре и гармонике (3 инструментальных композиции).
    Это музыка из детства и юности Чарли, когда он жил в Мемфисе и учился играть у Willie Shade и других старых мастеров.
    Некоторые песни с этого альбома есть на других дисках Масселвайта, Впервые за свою карьеру Чарли издает акустический альбом,где
    он в основном играет на гитаре (это его инструент с 13 лет), а не на гармонике. Диск необычайно искренний, Чарли отлично
    играет и очень проникновенно поет.


    "Please remember me I always be your friend"'
