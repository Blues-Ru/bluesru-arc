- id: 887
  author: Константин Колесниченко
  mark: 9
  date: '2005-10-13'
  text: Charlie Musselwhite один из лучших белых блюзменов, харперов. Он разнообразен и искренен в своей музыке. У меня есть
    почти все его альбомы и практически ни на одном из них я не заметил, чтобы Чарли зажимал себя в какие-то рамки, музыкальные,
    стилистические или, чтобы у него были проблемы с подбором материала. Альбом "In My Time" - яркий пример, всего вышеперечисленного.
    Композиции на альбоме подобраны очень интересно, я бы даже назвал это экскурсией в блюз. Начинается он очень традиционным
    материалом – Чарли играет на гитаре и поет, его голос – это искренность и абсолютно никакой деланности, время от времени
    в пении ему помогают Blind Boys of Alabama. Далее идет чикагский блюз, West Coast Blues, композиции в фанковом ключе,
    элементами латины итд. Кстати, на гитаре ему аккомпанирует звезда West Coast – Junior Watson (многие считают лучшими харперами
    West Coast стиля William Clarke, James Harman и Rod Piazza, для меня же в большей степени - это Масселвайт, послушайте
    такие композиции как "When It Rains" или "Watson's Excellent Adventure" и все станет на свои места). Когда я начинал изучать
    блюзовую гармонику, одним из первых моих учителей был Масселвайт, спустя время он им и остался.
