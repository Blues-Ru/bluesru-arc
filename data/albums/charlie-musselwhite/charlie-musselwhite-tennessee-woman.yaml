  author: Константин Колесниченко
  mark: 10
  date: '2005-10-13'
  text: Шестой альбом Масселвайта и последний на Vanguard. 1969 год – золотое время блюз-рока. Чарли уже нашел свой стиль
    и уникальный подход к музыке. Альбом очень разнообразный, насыщенный и слушается на одном дыхании. Потрясающая работа
    Чарли на гармонике, пианиста Skip Rose, гитаристов Tim Kalhatsu и Larry Welker. На "Blue Feeling Today" засветился Rod
    Piazza. Хочется особо отметить композиции "A Nice Day For Something", "Christo Redemptor" и "I am a stranger" - они потрясающи.
    Альбом периздан на СД.
