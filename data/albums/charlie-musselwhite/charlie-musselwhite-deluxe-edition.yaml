- id: 1427
  author: Андрей Евдокимов
  mark: 9
  date: '2009-02-05'
  text: 'В своей домашней коллекции Масселвайт разыскал истинное сокровище! Запись начала 60-х: в доме Уилла Шейда (который
    первую пластинку выпустил в 1925г.) Масселвайт играет на гитаре, а хозяин добродушно и иронично комментирует. Звук архивный,
    пленка чуть плывет, несмотря на 24-битовую реставрацию, - но ведь это почти осязаемая эстафета от древнего черного к современному
    белому блюзу. Другой, не издававшийся ранее трек, - прохладный блюз с горячими выкриками Lotsa Poppa - гарантируют хорошее
    настроение. Остальные треки в равной доле представляют все три альбома, выпущенных им на этом лейбле. С первыми двумя
    он возвращался из долгого забвения – играл энергично и виртуозно. Третий (где впервые в записи ему помогали старые друзья
    из вокального ансамбля The Blind Boys Of Alabama) начинал тот сдержанный во внешних проявлениях и медитативный по духу
    блюз, которым отмечены нынешние работы мастера. Каталог "Alligator" представляет важнейшие события в истории чикагского
    блюза последней трети ХХ века. Соответственно, серия "Deluxe Edition", просто не может не соответствовать названию.'
- id: 1713
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-19'
  text: 'Чарли Масселуайт - воплощение современного чикагского блюза и блюз-рока, музыкант, принятый в Зал славы блюза в 2010
    году, 6 раз номинированный на премию Грэмми и обладатель 24-х блюзовых наград.


    Данный сборник составлен из трех альбомов, записанных Чарли в 90-х годах на фирме Аллигатор - Ace of Harps (1990), Signature
    (1991) и In My Time (1993). Кроме того, в диск включены два неизданных ранее трека: Lotsa Poppa, записанный во время сессий
    к альбому In My Time, и Newport News Blues - демо из коллекции самого Чарли, записанное им совместно с ветераном блюза
    Уиллом Шэйдом.


    Все треки были ремастированы, большая часть треков принадлежит авторству самого Чарли. Приятный диск настоящего современного
    блюза от мастера жанра.'
