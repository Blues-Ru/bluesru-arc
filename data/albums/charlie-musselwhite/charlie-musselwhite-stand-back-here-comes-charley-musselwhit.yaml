- id: 278
  author: Константин Колесниченко
  mark: 10
  date: '2003-11-24'
  text: 'Первый альбом виртуоза губной гармоники – Чарли Масселуайта. Вместе с первыми записями Пола Баттерфилда этот альбом
    считается наиболее ярким образчиком блюз-роковой волны шестидесятых, ее чикагской части.


    Игра Масселуайта на этом альбоме представляет собой смесь стилей таких представителей чикагского "гармошечного" блюза
    как Big Walter Horton и Junior Wells – густой, как бы заполняющий звук Хортона и где-то фанковые находки Веллса. Однако,
    Чарли не теряет индивидуальности и на своих авторских композициях ( "Baby Will You Please Help Me", "Strange Land", "39th
    and Indiana") демонстрирует стиль, который в будущем станет его визитной карточкой. Этот диск демонстрирует все ритмическое
    и мелодическое разнообразие, которое может нести в себе блюз, достаточно послушать "Cha Cha The Blues" и "4 Р.М." Масселуайту
    аккомпанируют не менее известные Харви Мэндел (Harvey Mandel), Барри Голдберг (Barry Goldberg) и Фред Билоу Мл. (Fred
    Below Jr).


    "Посторонись! Приближается бэнд Чарли Масселуайта из Южного района" - с этим нельзя не согласиться.


    Оценка высшая. Этот альбом является, пожалуй, одним из лучших в дискографии самого Масселуайта. Рекомендуется всем изучающим
    технику и фразировку блюзовой гармоники.'
