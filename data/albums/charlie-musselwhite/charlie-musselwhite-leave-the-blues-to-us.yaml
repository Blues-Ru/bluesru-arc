  author: Константин Колесниченко
  mark: 5
  date: '2007-06-20'
  text: 'Очень редкий альбом Масселвайта и, к сожалению , не самый лучший. На мой
    взгляд, лучшие альбомы Чарли делал в 60-х и в 90-2000х.


    С Чарли играет не самый блестящий его состав, на смену братьям Форд пришли новые
    музыканты: Karl Sevareid (Bass), Tim Kaihatsu (Guitar), Larry Martin (Drums),Ray
    Arvin (Sax), Lynn Carey (Background vocals). Хотя с Тимом Чарли играл и в 60-х.
    На нескольких треках с Масселвайтом играют его друзья Barry Goldberg и Mike Bloomfield,
    но в целом это не делает альбом лучше. Чарли играет и поет хорошо, но такое ощущение,
    что ансамбль играет без него, словно в соседнем городе. На диске есть пара неплохих
    треков: "Stranger" и "Skinny Woman".


    Альбом, скорее, не для массового слушателя, а для тех, кто просто копает глубже.'
