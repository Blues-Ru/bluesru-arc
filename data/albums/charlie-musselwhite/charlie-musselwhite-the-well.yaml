reviews:
- id: 1644
  author: Андрей Евдокимов
  mark: 7
  date: '2010-10-06'
  text: 'Лучший блюз - это всегда житейская история. Более сорока лет спустя после
    выхода дебютной пластинки, Масселвайт выпускает полностью автобиографический альбом:
    "Блюз захватил меня, когда я был еще мальчишкой". Комфортное мягкое звучание,
    расслабленная ровная почти повествовательная манера пения. Но альбом не для веселья
    и не для фона. Сюжет песен объясняет, почему музыкальная гладь вдруг взрывается
    такой отчаянно-тоскливой энергетикой соло губной гармоники, и нежнейшие изысканные
    пассажи обрываются в натужный хрип. Исполнительское мастерство лишь средство для
    блюзовой исповеди: без аффектации, без искусственной наигранности – ни одной лишней
    ноты. Чутко, эмоционально, нешаблонно – игра Масселвайта на гармонике естественна,
    как дыхание.'
