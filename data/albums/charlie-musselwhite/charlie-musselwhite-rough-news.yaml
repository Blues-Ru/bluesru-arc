- id: 888
  author: Константин Колесниченко
  mark: 9
  date: '2005-10-13'
  text: Чарли ушел из "Аллигатора" и это очень положительно сказалось на звуке и стилистике. Альбом является как бы продолжением
    предыдущего "In My Time". Музыка очень мелодична и красива, что большая редкость и ценность. Чарли полистилистичен, на
    альбоме можно услышать дельта блюз "Clarksdale Boogie" и замечательную версию "Harlem Nocturne", и латину "Feel It In
    Your Heart", но не смотря на свою эклектичность Масселвайт исключительно блюзовый музыкант, тонко понимающий и чувствующий
    эту музыку.
