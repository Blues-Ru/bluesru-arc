- id: 323
  author: Леонид Аускерн
  mark: null
  date: '2003-12-02'
  text: 'Чарли Масселуайт был и остается одним из крупнейших мастеров игры на губной гармонике. Среди белых блюзменов он все
    годы после смерти Пола Баттерфилда (с которым Чарли в свое время вместе работал) - безусловно, лучший гармошечник. Масселуайт
    прекрасно владеет самыми разными типами инструментов, его техника впитала в себя уроки мастерства, полученные от внимательнейшего
    изучения манеры игры многих темнокожих блюзменов, но в первую очередь Литтла Уолтера.


    Программа этого альбома удивительно разнообразна, это словно экскурсия по миру блюза: здесь есть вещи, близкие и к чикагскому,
    и к пидмонтскому блюзу, есть композиции, выдержанные в ритм-энд-блюзовом ключе.


    И Чарли совершенно свободно чувствует себя в каждом из этих стилей. Более того, пьеса "Azul Para Amparo" - это короткое,
    но довольно удачное путешествие блюзового гармошечника в мир латинской музыки - явление весьма редкое, особенно в те годы,
    когда альбом записывался!


    В нескольких номерах Мусселуайт поет. Певец он, правда, небольшой, но, как говорится, борозды не портит. Среди сайдменов
    особо выделить некого, разве что акустического гитариста шефа фирмы "Kicking Mule" Стефана Гроссмана, который и продюсировал
    этот диск.


    Рекомендую всем любителям качественного блюза!'
- id: 1716
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-19'
  text: '"He lays down plenty of meaty riffs over just about every conceivable blues and blues-related rhythm - downhome,
    shuffle, rock, ragtime, even a touch of funk." - Blues Access


    "The acoustic-centered tunes and Musselwhite''s signature forays into jazz and soul on this set resonate sharply." - Jazz
    & Blues


    "This recording is designed for blues fans in general and harp fans (and players) in particular.... The many forms and
    shadings of the blues are all here, thanks to Musselwhite''s superior versatility" - Dan Forte


    На этой пластинке великий Чарли Масселуайт фактически записал мастер-класс блюзовой гармоники - 13 различных композиций
    в 13 различных традиционных блюзовых ключах и стилях, включая всевозможные положения блюзовой гармоники. Однако эта работа
    отнюдь не претендует на академичность - она пропитана настоящей жизнью, искренними эмоциями, ибо исполнитель вкладывает
    свою душу в каждый трек. Десять композиций написал сам Чарли, оставшиеся три - каверы. Диск вышел на лейбле Blind Pig
    Records, продюсировал Стефан Гроссман (который также записал партии акустической гитары).


    Отличная пластинка - просто must-have для всех любителей блюзовой гармоники.'
