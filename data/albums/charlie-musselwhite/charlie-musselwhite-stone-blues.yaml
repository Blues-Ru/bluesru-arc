- id: 1096
  author: Константин Колесниченко
  mark: 10
  date: '2007-06-15'
  text: 'Это второй альбом Чарли на Vanguard и четвертый по счету. У Чарли новый состав, но подход к музыке и материалу сохранился
    тот же, что и на первом его альбоме. После первого диска у Масселвайта были еще 2 альбома, которые считаются провальными,
    я их не слышал. Но "Stone Blues" - шикарный! Самый настоящий американский блюз-рок 68 года во всей его красе! Ранние работы
    Масселвайта и Баттерфилда - это лучшее, что выдали белые блюз-рокеры в 60-х, 70-х, да и, пожалуй, за всю историю белых
    в блюзе. Черные так еще не играли, англичане тем более. Выделяю следующие композиции: "My Buddy Buddy Friends", инструментал
    "Clay''s Tune", "Gone and Left Me", "Cry for Me Baby", интересно аранжированную композицию Литтл Уолтера"Juke", "She Belongs
    To Me", на которой классно поет органист Clay Cotton.'
