  author: Константин Колесниченко
  mark: 9
  date: '2009-03-10'
  text: 'Второй альбом Чарли для "Аллигатора" и начало взлета его карьеры, связанного
    именно с этим лейблом. По словам Чарли, президент компании Брюс Иглауэр не питал
    особых иллюзий, подписывая контракт с Чарли, ведь музыкант совсем недавно поборол
    серьезную алкогольную зависимость. Издав его первый альбом для этого лейбла ("Ace
    Of Harps"), Брюс Иглауэр лишь после такого своеобразного теста на прочность занялся
    серьезно Масселвайтом. А уж "Аллигатор" знает как продавать альбомы, как поддерживать
    музыкантов, в общем, в курсе маркетинговых штучек. Второй альбом получился гораздо
    сильнее предыдущего, хотя и построен по той же схеме – первая ударная композиция-хит,
    затем довольно традиционный материал, современный блюз с привкусом фанка, в середине
    легкий джаз на хроматической гармонике и опять традиционные номера, перемежающиеся
    с современным блюзом. Но отличительной чертой этого альбома является гораздо более
    лучший звук записи и самой гармоники Чарли (кажется, он нашел свой усилитель),
    более интересный материал, да и слышно, что Чарли сыгрался с новой своей группой,
    лидером которой стал замечательный гитарист Andrew Jones Jr.


    Альбом "Signature" получился довольно ровным и сильным, эта запись – последняя
    ступень перед, пожалуй, одной из самых сильных работ Чарли за всю его карьеру
    - следующим его альбомом "In My Time".


    Как я уже говорил, альбом очень цельный по своему содержанию, но несколько композиций
    я бы выделил: заглавная "Make My Getaway", джазовая "What''s New?", дуэт с Джоном
    Ли Хукером "Cheatin'' On Me".'
