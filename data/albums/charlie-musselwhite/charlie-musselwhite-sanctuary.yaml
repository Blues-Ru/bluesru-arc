- id: 1715
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-19'
  text: 'Один из лучших дисков мастера губной гармоники, певца и композитора Чарли
    Масселуайта, записанный им в возрасте 60 лет на фирме Питера Габриэля Real World
    (там же вышел и следующий альбом Чарли Delta Hardware). Альбом не слишком традиционный,
    довольно мрачный и одновременно интимный, и в то же время бесспорно блюзовый и
    современный. Представьте, что Том Уэйтс или Леонард Коэн решили записать блюзовый
    альбом - это будет близко. Здесь Чарли в большей степени проявляет свои вокальные
    данные, хотя не забывает и о гармонике. На диске представлены каверы песен Бена
    Харпера (который сам присутствует в качестве гостя на двух треках), Сонни Ландрета,
    Рэнди Ньюмана, а также знаменитый Train to Nowhere от Savoy Brown. Сопровождающая
    группа музыкантов играет на самом высоком уровне, особенно хорош гитарист из Остина
    Чарли Секстон (игравший с Бобом Диланом и др.). Вокальная группа Вlind Boys of
    Alabama помогает Чарли на двух композициях.


    Заслуженное 4 место среди блюзовых альбомов Биллборда и почетное звание блюзового
    артиста года у Чарли Масселуайта.'
