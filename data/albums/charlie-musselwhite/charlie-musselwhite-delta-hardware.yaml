- id: 1005
  author: Александр Панин
  mark: 4
  date: '2006-05-07'
  text: Второй альбом выдающегося блюзового харпера Чарли Масслвайта на лейбле Real World. Удивительно, что он опять записался
    у Питера Гэбриэла, ведь там обычно издаются альбомы этнической и околоэтнической музыки. Предыдущий диск Чарли был мрачным
    и депрессивным, на нем играли Алабамские Слепцы и Бен Харпер, и все это было довольно интересно и своеобразно. В этот
    же раз мы получили всего лишь шумную и энергичную электроблюзовую запись, иными словами, это возврат к старым уверенным
    позициям. При этом роль основного гитариста на альбоме исполняет норвежец Кид Андерсен, и в результате электроблюз этот
    вышел скорее пиротехническим и с ярко выраженным роковым оттенком. Преданных поклонников гармошки Чарли или норвежского
    гитарного искусства диск, видимо, порадует, я же чувствую себя разочарованным, общее звучание мне совсем не нравится.
    Хорошо, что запись продолжается всего сорок минут, еще чуть больше, и было бы совсем трудно это слушать.
- id: 1014
  author: Константин Колесниченко
  mark: 9
  date: '2006-06-10'
  text: 'Чарли Масселвайт – прекрасный музыкант, инструменталист, у него хороший музыкальный вкус. Если так можно выразиться,
    то он - мой любимый музыкант. Потому, я с особым нетерпением ждал выхода его последнего альбома "Delta Hardware".


    На своих последних альбомах Чарли много экспериментирует: на "Continental Drifter" – элементы джаза, записи с кубинским
    ансамблем, на "One Night In America" – много намешано корневой американской музыки, на предыдущем "Sanctuary" – какой-то
    особый подход к блюзу – таинственно-тягуче-вязкий звук, в сочетании с особым способом подобранными композициями. И вот,
    новый альбом, с говорящим названием – "Delta Hardware". Альбом такой же грубоватый и вязкий, как предыдущий, но новая
    группа (довольно молодые музыканты) – и потому Чарли в некоторых вещах играет в рок-ключе. Нужно заметить, что впечатления
    это не портит, музыканты не "пилят", все очень лаконично, со вкусом, музыка - очень атмосферная.


    Чарли, безусловно, виртуоз, один из лучших на настоящий момент исполнителей на гармонике, он не использует продвинутую
    технику overblow (по его словам - умеет это делать), не играет на большой скорости, длинных соло, но в его исполнении
    слышен опыт и абсолютное понимание того, что он делает, полный контроль звука и нот.


    На настоящий момент Чарли играет таким составом: Charlie Musselwhite – vocal, harp, guitar, Chris "Kid" Andersen – guitars,
    Randy Bermudes – bass, June Core – drums, percussion.


    Этот альбом Чарли посвятил своим родителям, умершим в прошлом году, а также памяти Little Milton.'
- id: 1426
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: '"Черная вода – знак нашего времени. Это лишь весточка того, что еще грядет. Мир покатился не туда." Масслевайт мрачнее,
    чем когда бы то ни было. После интровертного альбома о поисках душевного покоя он взорвался альбомом жестким, энергичным
    и мизантропичным. Открывает его песней "Все, церковь закрыта!" - и это сатиричная автобиография. В следующий за ней каверверсии
    песни Литл Уолтера ритм загнан вперед самого себя, словно деревенская "кукушка" - перестаравшимся кочегаром, а короткие
    слайдовые пробеги – жалят. Альбом в котором опыт ветерана сочетается с панковской мрачной энергетикой записан Маселвайтом
    вместе с его гастрольным ансамблем. Молодой гитарист Кид Андерсон оказался ему более чем достойным соратником. (Кстати,
    оценить игру восходящей звезды можно будет во время его московский гастролей на этой неделе). Как и все альбомы Масселвайта
    нынешнего столетия, этот тоже представляет собой единую концепцию. Такая цельность в музыки и целеустремленность в общей
    для всех песен идее при разнообразности подхода - в блюзе почти уникальна.'
- id: 1717
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-19'
  text: 'Чарли Масселуайт – один из выдающихся современных блюзовых исполнителей на гармонике, певец, композитор и гитарист.


    Родился в штате Миссисипи в 1944 г., позже перебрался на север в поисках работы, где познакомился с творчеством грандов
    блюзовой губной гармоники: Little Walter, Carey Bell, Big Walter Horton, Sonny Boy Williamson.


    Дебютная пластинка, выпущенная на фирме Vanguard в 1967 году – "Stand Back! Here Comes Charley Musselwhite''s South Side
    Band" вместе с альбомами шестидесятых Пола Баттерфилда и Джона Хаммонда стала классикой белого блюз-рока.


    В семидесятых Чарли сам превратился в учителя, наставника и друга для следующего поколения блюзовых музыкантов - Robben
    Ford, Kim Wilson, Fenton Robinson. Восмидесятые - начало девяностых в творческом плане становятся для Чарли очень удачным
    временем. Проблемы с алкогольной зависимостью и плотный гастрольный график оставляют почти пятилетнюю брешь в дискографии
    музыканта, но в конце девяностых завязавший с алкоголем Масселуайт продолжает выпускать альбомы, которые благодаря великолепному
    музыкальному вкусу, виртуозной игре, смешению различных жанров звучат свежо, актуально и интересно.


    Записанный на фирме Питера Габриэля RealWorld диск Delta Hardware – отличный альбом традиционного блюз-рока с современным
    звучанием, прекрасной игрой музыкантов (особенно интересна работа гитариста из Скандинавии Криса "Кида" Андерсена) и запоминающимися
    мелодиями; альбом, который мог создать только уверенный в себе мастер. Заслуженное 4 место в блюзовом топе Биллборда.'
