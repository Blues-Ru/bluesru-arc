- id: 875
  author: Константин Колесниченко
  mark: 8
  date: '2005-09-30'
  text: 'Полностью акустический альбом Масселвайта. Играют маленьким составом: Charlie
    Musselwhite - vocal, harmonica, Dave Peabody - guitar, Bob Hall - piano. Запись
    сделана в Европе. Музыка проста и искренна. Музыканты отлично поддерживают друг
    друга, играют то масселвайтовскую классику, то блюзовые нетленки. Иногда кажется,
    что композиции немного затянуты, но для живой записи – это нормально. Публика
    горячо поддерживает музыкантов. В общем, приятный альбом, тем более что это, одна
    из немногих живых записей музыканта.'
