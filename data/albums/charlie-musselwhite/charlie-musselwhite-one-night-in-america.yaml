  text: '"Charlie Musselwhite is one of the greatest living harp players of country blues. He is right up there with Sonny
    Boy Williamson, and he''s been my harp player ever since Sonny Boy got killed." - Big Joe Williams


    "Harmonica virtuoso Musselwhite raises the level of emotional expression on his instrument beyond even the masters he
    learned from...the grizzled veteran richly decorates his music with telling nuance and chiseled detail." - San Francisco
    Chronicle


    "...all (the tunes) somehow capture the feeling of the times I remember growing up in Memphis in the 1940s and ''50s.
    They were the times I had-the sad ones and the happy ones-it was all I knew." -Charlie Musselwhite (from the liner notes)


    Чарли Масселуайт вырос в Мемфисе, и данный альбом он посвятил музыке, которая звучала в годы его детства и юности. Американская
    традиционная музыка и деревенский блюз всегда составляли основу творчества Чарли. На диске представлен коктейль из блюза,
    музыки кантри, хиллбилли и рок-н-ролла, исполненный с современным звучанием и высочайшим профессионализмом.


    Помогают знаменитому харперу и певцу такие не менее известные в музыкальных кругах персонажи, как Роббен Форд (Чарли Масселуайт
    обеспечивал молодому Роббену его первые концерты), Келли Уиллис (вокал), Марти Стюарт (гитара и мандолина), Т-Боун Уолк
    (бас) и Пер Хансон (ударные). Четыре трека написаны Чарли, остальное - каверы, которым он дал свое блюзовое прочтение.
    Несмотря на некоторую стилистическую разноплановость, диск интересный.


    Одиннадцатое место в блюзовом топе альбомов Биллборда.'
