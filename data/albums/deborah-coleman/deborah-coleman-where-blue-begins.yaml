  text: '"Where Blue Begins is a smooth blend of Coleman''s furious fretwork and pussycat
    purr of a voice. This album proves Coleman''s not a novelty but a rare talent
    in a genre that desperately needs some new blood." - AllMusic


    "Coleman balances the reserve and control of blues with the extreme personal involvement
    of soul music. Her guitar breathes fire without sacrificing musicality, and her
    singing, at times suggestive of a young Joan Armatrading, packs authentic blues
    feeling: sultriness, longing, tenderness, and defiance." - Downbeat


    "Her fire-on-the-fretboard flamboyance reflects an artistic maturity that would
    be notable in a seasoned veteran. She could easily become one of the leading lights
    in the younger generation of blues artists." - Living Blues


    Третий сольный альбом Дебора Коулман записала с бывшей аккомпанирующей группой
    Лютера Аллисона (к сожалению, к этому моменту Лютера уже не стало) - James Solberg
    Band. Естественно, существенную помощь она получает от Джеймса Солберга - и в
    аранжировках, и с гитарным аккомпаниментом, и как соавтор. Кроме того, на последнем
    треке на слайд-гитаре отметилась другая известная блюзовая гитаристка - Джоанна
    Коннор.


    Пластинка хорошая: профессионально сыгранная, качественно записанная, с хорошим
    драйвом. Неудивительно, что по итогам этого альбома Дебора окончательно утвердилась
    в первых рядах современных блюзовых исполнителей.'
