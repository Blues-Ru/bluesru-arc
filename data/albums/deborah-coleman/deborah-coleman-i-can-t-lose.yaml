reviews:
- id: 337
  author: Андрей Евдокимов
  mark: 6
  date: '2003-12-05'
  text: 'Энергии у этой черной дамы (и, между прочим, матери взрослой дочери) - через
    край. Медленный темп - не для нее. Даже классический томный блюз Билли Холидей
    "Fine And Mellow" она исполняет в быстром темпе. Это, кстати, единственный стандарт
    в альбоме. Семь песен из десяти - ее сочинения, причем музыка - боевитая, а слова
    сказаны женщиной - современно и без комплексов. Она требует любви, иногда шутливо
    ("The Man Is Mine"), а иногда а иногда и в приказнОм порядке ("Roll With Me").
    Гитарные соло хороши, и лишь выбранный ею приглушенный тембр звучания гитары лишает
    их броскости, свойственной Алберту Коллинзу, чей почерк более всего напоминает
    игра Дебры Колумэн. Приятно, что в записи одной из песен (Something''s Wrong)
    принимала дучастие другая современная блюзовая гитаристка, тяготеющая к блюз-року,
    только белая: Джоанна Коннор. Из замечательного в своей цельности альбома выпадает
    лишь заключительный инструментальный номер "My Love Belongs To You".


    Состав: <br> <br>Deborah Coleman - g&v <br>Paryss - g <br>Chuck Webb - b <br>Slam
    - dr <br>Joanna Connor - g on#8'
- id: 1894
  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2011-06-17'
  text: Второй сольный альбом Деборы и одновременно ее дебют на крупной фирме грамзаписи
    - Blind Pig Records. По мнению AMG, который поставил альбому 4 звезды, это лучший
    альбом гитаристки и певицы, которую USA Today назвали "одним из наиболее многообещающих
    молодых блюзовых талантов." Честно говоря, я ничего выдающегося на этом альбоме
    не услышал - среднестатистический современный городской блюз с долей поп и соул,
    техника игры и пения тоже среднестатистические. Неплохо, но не более того - в
    общем, пластинка на любителя :-) А вот следующий ее альбом Where Blue Begins наголову
    лучше.
