reviews:
- id: 43
  author: Алексей Калачев
  mark: 4
  date: '2002-11-05'
  text: Тоже ждали с любопытством. На этом концертном альбоме вы не откроете для себя ничего нового. Ни новых вещей, не новых
    граней самой Деборы. Всем известно, что она хорошая певица и неплохой композитор. Видно, на концертах она любит поиграть
    на гитаре, импровизировать минут по 10, что и попало на диск. Беда, и это высветил её новый диск, что гитаристка она,
    похоже, посредственная.
- id: 1893
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-06-17'
  text: 'И, наконец, то, что так долго ждали ее фаны - концертный альбом, на котором Дебра воистину развернулась вовсю. Диск
    записан в Калифорнии в клубе Sierra Nevada Brewery. Пять треков авторских и три кавера. Продюсировала сама Дебра и Эдвард
    Хмелевски.


    Самая блюзовая пластинка гитаристки, полная импровизационного блюз-рока и длинных гитарных запилов - в общем, мечта для
    любителей гитарного блюза :-) Музыканты играют достаточно расслабленно, прекрасно понимая друг друга, и мы слышим скорее
    концертные джемы и развернутые версии студийных треков. Возможно, Дебре чуть нехватает воображения и таланта в деле построения
    действительно выдающихся и запоминающихся соло, но уж с техникой у нее определенно все в порядке. Пятнадцатое место в
    блюзовом чарте альбомов Биллборда.


    На диске в качестве девятого трека записано видео - пятиминутный джем из середины Goodbye Misery.'
