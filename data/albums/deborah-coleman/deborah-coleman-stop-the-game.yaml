  date: '2011-06-17'
  text: Диск 2007 года - работа зрелого мастера, свободно владеющего различными оттенками
    блюзового жанра. Сама Дебра выступила также в роли продюсера. Диск довольно разноплановый
    - на нем нашлось место и для мощного блюз-рокового первого трека, и для пары энергичных
    инструменталов, и для прифанкованных риффов, и для стилизованного под старину
    слайдового номера. В целом - хорошее впечатление, хотя вторая половина пластинки
    кажется чуть более слабой.
