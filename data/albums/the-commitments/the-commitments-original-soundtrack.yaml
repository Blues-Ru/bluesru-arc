- id: 2048
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2012-08-07'
  text: 'Саундтрек к фильму Алана Паркера, поставленному по книге Родди Дойла. Книга просто великолепна - написана современный
    языком с ирландским жаргоном и музыкальными цитатами, а также хорошим чувством юмора. Адекватно перевести ее на русский
    с сохранением всей специфики, по-моему, просто невозможно. Одно упоминание Майлса Девиса чего стоит! Фильм, поставленный
    по книге - на мой взгляд, лучший оригинальный музыкальный фильм Алана Паркера (а может, и вообще лучший его фильм). Он
    прекрасно передает и юмор, и атмосферу, присущую книге. Знающим английский рекомендую приобрести двухдисковое специздание
    на ДВД - получите массу удовольствия!


    Фильм о нескольких молодых музыкантах, собирающихся создать группу, чтобы играть ирландский вариант музыки соул - от зарождения
    первой идеи до первого настоящего успеха, оказавшегося одновременно концом группы. В фильме играют молодые малоизвестные
    музыканты, причем играют талантливо и искренне, ибо фактически играют самих себя. К сожалению, у нас в стране фильм как-то
    не очень популярен - видимо, в силу невозможности сделать нормальный адекватный перевод. Музыка также записана самими
    актерами, и представляет собой смесь блюза и соул с духовыми. Отдельные каверы блюзовой классики очень хороши, но есть
    и проходные треки. В целом - любопытный диск, добравшийся до 8 места в топе 200 лучших альбомов Биллборда.'
