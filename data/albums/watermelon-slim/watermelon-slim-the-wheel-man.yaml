- id: 1499
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: 'Обложка под "старые добрые времена", дядечка в годах играет на гитаре "lap-top". Шляпа белая и слайд в руке... Наверное,
    это такая благодушная музыка в старинном стиле. Обман! Первой же песней жесткий насыщенный ритм, яростные гитарные соло
    и остроумный текст развеют предубеждение. Сам "Арбуз-пижон" - личность не менее противоречивая. Ветеран войны во Вьетнаме,
    на собственный средства в1973г. выпустивший яростную антивоенную пластинку. Водитель грузовика с несколькими университетскими
    дипломами. Он перешел в профессиональные музыканты после сердечного приступа, и поступок этот необъясним: исполнение такой
    могучей музыки дает нагрузку больше, чем вождение самого тяжелого трейлера. Впрочем, несколько традиционных номеров все
    же нашлись. Участие еще одного Слима: Мэджика – это просто бонус к великолепному альбому.'
