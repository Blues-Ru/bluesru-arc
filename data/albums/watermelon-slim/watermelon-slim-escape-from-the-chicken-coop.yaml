- id: 1891
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-16'
  text: 'Watermelon Slim (Билл Хоманс) всегда включал в свою музыку элементы кантри, и в течение долгого времени мечтал записать
    альбом в этом стиле. Данный диск - воплощение этой мечты. Он был записан в "столице" музыки кантри - Нэшвилле - с участием
    лучших сессионных музыкантов (правда, музыканты основной группы Слима - The Workers - в данном проекте практически не
    участвовали). Альбом посвящен памяти недавно ушедшего от нас Дэйва Дадли, который написал гимн дальнобойщиков на все времена
    - "Шесть дней в дороге". В равной мере диск также посвящен и всем другим дальнобойщикам и водителям грузовиков, причем
    данное ремесло знакомо Биллу не по наслышке - он сам на протяжении ряда лет работал дальнобойщиком, поэтому ничего придумывать
    ему не пришлось.


    Из 21 треков, записанных в студии, для диска были отобраны 13, включая роскошный дуэт с Дженни Литтлтон (трек 3). Да,
    на этом альбоме Билл Хоманс увеличил долю кантри в своей музыке, но и блюзовая составляющая осталась - она просто стала
    менее выраженной. Отличный альбом кантри блюза, исполненный профессионалами своего дела.'
