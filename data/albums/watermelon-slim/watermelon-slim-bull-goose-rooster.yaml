- id: 2138
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2013-07-18'
  text: 'Среди современных блюзовых исполнителей Арбузный Слим один из наиболее титулованных: у него более 20 номинаций на
    блюзовые награды в различных категориях, включая победу в категориях группы года и альбома года.


    С 2008 года Билл Хоманс (aka Watermelon Slim) не записывался со своей бывшей группой The Workers (с которой он выпустил
    свои наиболее востребованные критиками и публикой альбомы 2006, 2007 и 2008 года). В это время он записал пару вполне
    приличных сольных альбомов кантри-блюза, а также альбом в сотрудничестве в Супер Чиканом, но эти работы были не столь
    успешными. Естественно, что воссоединение с проверенным составом "Работяг" было интересно и для самого блюзмена, и для
    его слушателей.


    В результате получился довольно разнообразный стилистически и довольно продолжительный диск, на котором энергичный блюз
    соседствует с фолк-роком, кантри и годспел. Есть приятный дуэт с Даниэллой Шнбелен из Trampled Under Foot. Диск довольно
    длинный - 9 треков авторства Хоманса, и еще 7 каверов. Исполнение высокопрофессиональное, музыка хорошая, лирика как всегда
    достойная, но, пожалуй, диск бы только выиграл, если его слегка подсократить - ряд последних треков уже определенно слушаются
    как необязательные бонусные. В целом - очень прилично, но до лучших альбомов Слима недотягивает.'
