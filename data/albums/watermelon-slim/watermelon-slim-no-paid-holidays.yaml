- id: 1536
  author: Андрей Евдокимов
  mark: 8
  date: '2009-05-18'
  text: Любимое занятие и критиков и слушателей в современном блюзе – классификация. Блюз подлинный редко укладывается в четкие
    рамки. Именно такой предлагает Арбузный Пижон. Половина его песен – автобиографическая. Остальное – о том, кем он мог
    бы быть, или о том, кем он ни за что не будет. Играет слайдом на опрокинутой на спину гитаре ноющим, до печенок достающим
    нотным перебором. Достигает высшего блюзового мастерства в игре на губной гармонике, не обладая сколько-нибудь значимыми
    техническими навыками. Поет так, как пел сидючи посередине свой арбузной бахчи с гармоникой в руке и в 20 милях от ближайшей
    женской особи. Впрочем, песня с названием "Архитипичный блюз" выдает две его ученые университетские степени. У него вообще
    биография авантюриста, только золото он искал не то, что только блестит. И все это теперь – в его музыке.
- id: 1890
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-16'
  text: Cвежий альбом Билла Хоманса (это настоящее имя Watermelon Slim'a) и его группы записан в стилистике предыдущих его
    работ (его предыдущий альбом The Wheel Man получил аж 6 блюзовых номинаций) - это традиционный блюз с элементами кантри,
    интенсивным использованием слайд-гитары, высоким процентом акустических номеров и песен с минимальным аккомпаниментом.
    На диске Слим смог записать композиции в различных блюзовых стилях, не ограничиваясь чем-то одним. При этом музыка Слима
    звучит на удивление искренне, в ней чувствуются многовековые корни, и, хотя Слим не открывает ничего принципиально нового
    данной пластинкой, она оставляет приятное впечатление. Данный альбом более легкий, чем его титулованный предшественник,
    и на мой взгляд чуть послабее его. 10 место в блюзовом чарте Биллборда.
