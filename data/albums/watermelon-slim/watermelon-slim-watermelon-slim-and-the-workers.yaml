- id: 1088
  author: Константин Колесниченко
  mark: 10
  date: '2007-06-06'
  text: 'Арбузный Слим неизвестен у нас в стране, да и за океаном, он тоже - добротный клубный музыкант, известный узкому
    кругу любителей, но он уже немолод и состоявшийся, талантливый музыкант. У Слима очень интересная и довольно тернистая
    биография, которая пересекается со многими известными музыкантами, потому-то и непонятно, почему он не пользовался заслуженной
    популярностью все эти годы.


    Билл Хоманс, так его зовут на самом деле, играет на гармонике и слайд-гитаре, добро. На этих инструментах он играет отлично,
    с драйвом и изобретательностью. Но главным его достоинством я считаю вокал и стиль. Вокал - немного гортанный, скрипучий,
    что-то среднее между Таж Махалом и каким-нибудь древним блюзменом (потому Слиму потрясающе удаются дельта-блюзы, где только
    он и гитара). Стиль - весь альбом, от авторских композиций до оформления, пропитан юмором, особыми выразительными средствами,
    присущими только Слиму. Например, дельта-блюз на французском языке или надпись возле стандартных слов об охране прав:
    "Run, run fast as you can... yu''re gone get eaten by the watermelon man".'
- id: 1494
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: Сиплый шепелявый голос рассказывает о трудных временах... Блюз с первого трека и до последнего. Хотя название последнего
    звучит как "Eau de Boue", означает это любимые в блюзе "Muddy Waters". Певец, харпер и слайдист Watermelon Slim в своих
    песнях и серьезен без пафоса, и ироничен без пустозвонства. Его альбом демонстрирует уже оформляющуюся в тенденцию манеру
    соединять традиционный акустический блюз с насыщенным агрессивным звучанием. Ветеран войны во Вьетнаме, он дебютировал
    в 1973 году с антивоенным альбомом. Обладатель нескольких университетских дипломов, он зарабатывал на жизнь водителем
    грузовика, и только после сердечного приступа обратился в новом веке к музыкальной карьере более серьезно. Для блюзмена
    биография и творчество связаны накрепко. У Watermelon Slim эта связь особенно любопытна.
