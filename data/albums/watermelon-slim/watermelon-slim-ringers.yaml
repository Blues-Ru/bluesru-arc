reviews:
- id: 1892
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-06-16'
  text: 'Прошлогодний опыт Билла Хоманса с альбомом в стиле кантри оказался достаточно успешным, и он решил выпустить еще
    один альбом в том же ключе. На новом диске опять представлен материал, записанный в столице музыки кантри - Нэшвилле -
    в течение двух сессий, проходивших в 2008 и в 2009 году. Подозреваю, что в новый альбом вошла часть треков, отвергнутых
    для включения в предыдущий альбом 2009 года (там оставалось еще 8 песен). Одна из сессий была акустической, другая - электрической.


    Новая работа Билла еще дальше удаляется от блюза в сферу кантри, но при этом и музыка, и исполнение находятся на самом
    высоком уровне. Хоманс сам написал 9 треков и записал 5 каверов кантри-классики. Музыкант по-прежнему демонстрирует искусное
    владение слайд-гитарой, сопровождающих сессионных музыкантов из Нэшвилла характеризует традиционный профессионализм. На
    альбоме много дуэтов, есть треки в стиле госпел, есть много хорошего кантри и только отголоски блюза. Тем не менее диск
    интересный.'
