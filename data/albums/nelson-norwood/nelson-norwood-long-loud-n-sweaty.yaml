  author: Алексей Калачев
  mark: 7
  date: '2003-02-24'
  text: Почти 40 минут крепкого блюз-рока с сильнейшим влияниям Rolling Stones. Аккомпанирует свирепому гитаристу из Техаса
    ничто иное, как Double Trouble! Среди прочего блюзрокового занудства, прошедшего через мои руки в последнее время, Норвуд
    порадовал лаконичностью и зарядом мощи – не только громкостью, а именно мощью. (Не все шумные гитаристы с мрачными лицами
    на обложках и старающиеся петь хрипло, это имеют).
