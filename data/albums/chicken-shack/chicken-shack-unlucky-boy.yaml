- id: 1272
  author: Сергей Исправников
  mark: null
  date: '2008-06-01'
  text: 'Диск "Unlucky Boy" – шестой в дискографии британской блюз-роковой группы "Chicken Shack" – демонстрировал не только
    изменение состава музыкантов, но и звучания. По сравнению с хард-роковой прямолинейностью предыдущего альбома "Imagination
    Lady" (1972), саунд стал более мягким, более блюзовым. Собственно говоря, здесь Стэн Уэбб возвратился к своим корням.
    Состав группы расширился до пяти человек. Прибавились клавишник Tony Ashton (ex-"Ashton, Gardner & Dyke") и саксофонист
    Chris Mercer (ex-"Juicy Lucy"), кроме того, на бас-гитаре Bob Daisley (в будущем басист "Rainbow") заменил ушедшего из
    группы John Glascock.


    Как и для записи предыдущего альбома была арендована лондонская "Olympic Studios". Какой-то заранее определенной концепции
    диска у группы не было, у Стэна Уэбба оказались готовы несколько новых песен, их и решили записать. В первую очередь,
    это была нежная лирическая баллада "As Time Goes Passing By", впоследствии украшенная струнным оркестром, вошедшая как
    в альбом, так и на сингл (в сокращенном виде). Тогда же была записана одна из лучших вещей альбома – построенный на взаимодействии
    партий гитары и саксофона пронзительный блюз "Revelation" с горькими словами "мое лицо выглядит молодо, но тело уже старо".
    К ним добавились "Too Late To Cry" – кавер-версия легенды довоенного блюза и джаза Лонни Джонсона, а также интструментал
    Уэбба "Prudence''s Party". В последнем блестяще проявил себя пианист Tony Ashton. Тони оказался яркой творческой личностью
    и помимо того, что он был блестящий музыкант, любил еще и зажечь. Из их совместных со Стэном джемов родились еще две вошедшие
    в альбом композиции – "Stan The Man" и семиминутная "Jammin'' With The Ash" – записанные практически живьем.


    Дальнейшая работа была перенесена в "Island Studios", где были записаны три оставшиеся композиции, включая титульную "Unlucky
    Boy", делались дополнительные наложения, а также проходило окончательное микширование альбома. Во время сведения диска
    произошел забавный эпизод: когда продюсер диска Neil Slaven и звукоинженер сидели в операторской, в комнату бочком протиснулся
    некий джентльмен с Ямайки и предложил им "травки для музыкантов". Они согласились, и товарищ скоро вернулся с косяком
    огромного размера. Дальше работа пошла как по маслу, Slaven вспоминал, что студия превратилась в кабину космического корабля,
    а музыка была просто неземная. Впрочем, когда результат прослушали на трезвую голову, эйфории никто не испытал – все надо
    было переделывать.


    В конечном итоге, альбом вышел на фирме Deram в мае 1973 г. и, как и его предшественник, неплохо продавался, особенно
    в континентальной Европе, хотя стадионы группа и не собирала. В заключение стоит добавить, что компакт-диск дополнен четырьмя
    бонус-треками времен альбома "The Creeper", изданного на лейбле Ariola в августе 1978 г. Кроме Стэна Уэбба из состава
    "Chicken Shack", записавшего "Unlucky Boy", там присутствует только Tony Ashton. Впрочем, это была уже другая группа и
    другая музыка…'
