  author: Дмитрий Казанцев
  mark: 8
  date: '2004-01-08'
  text: 'Ключевые слова: британский блюз высшего класса, Майк Вернон, Blue Horizon, Christine Perfect, подражание, классный
    звук, коллекционная пластинка. На что это похоже? Конечно на первые альбомы Флитвуд Мак с Питером Грином. Все один в один
    кроме одного ВАЖНОГО момента - у Чикен Шэк НЕТ Питера Грина.


    Хороший альбом. Сразу вспоминаешь первый Fleetwood Mac и Ten Years After. Шикарная запись и прекрасная Кристина. 10 классных
    блюзов и ритм-н-блюзов, простите за тавталогию. А Стэн Уэбб уж слишком подражает Отису Рашу и другим черным. Грин и Кристина
    поют лучше.'
