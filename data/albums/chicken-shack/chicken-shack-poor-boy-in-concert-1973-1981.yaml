  author: Сергей Исправников
  mark: null
  date: '2008-06-28'
  text: 'На диске издан первый официальный концертный альбом "Chicken Shack", одновременно явившийся последним диском группы,
    записанным для лейбла Deram. К моменту записи Стэн Уэбб вновь кардинально изменил состав музыкантов – на этот раз с ним
    играли клавишник Dave Wilkinson, басист Rob Hull и ударник Alan Powell. Концерт проходил 26 октября 1973 г. в лондонском
    Университете Брунела, названном в честь одного из его выпускников – лидера английской индустриальной революции Исамбарта
    Брунела. Помимо того, что университет является символом британских инженерно-технических инноваций, в нем в свое время
    Стэнли Кубрик снимал нашумевший "Заводной апельсин". Половина записанного там альбома занимали авторские композиции Уэбба
    (включая семиминутную версию его бессменного хита "Poor Boy"), а также каверы, содержащие среди прочих "Everyday I Have
    The Blues", "The Thrill Is Gone" и "You''re Mean" из репертуара Би Би Кинга. В целом, альбом демонстрирует таланты Стэна
    Уэбба, как блюзового гитариста-импровизатора, стоящего в одном ряду с такими титанами британского рока, как Эрик Клэптон
    и Джимми Пейдж. Отдельно стоит отметить и блестящие партии клавишных Уилкинсона, особенно вступление в "Webb''s Boogie".
    Но не смотря на все свои достоинства диск был, в конечном итоге, выпушен в 1974 г. только в Германии и Японии под названием
    "Goodbye Chicken Shack". Такая ситуация была вызвана тем фактом, что когда альбом был уже готов Стэн Уэбб в очередной
    раз объявил о роспуске группы и о своем присоединении к "Savoy Brown". Последние в то время были достаточно популярны
    в Америке, а британская блюзовая сцена находилась в состоянии коллапса. Правда, долго он там не задержался, в 1975 г.
    Стэн записывает альбом с собственным составом "Broken Glass", а на следующий год реанимирует "Chicken Shack"…


    В дополнение на данный компакт диск записано две трети материала следующего "живого" альбома группы – "Roadies Concerto"
    (1981 г.). Диск был записан в том же году на концерте в лондонском "Bridge House". Это было культовое место, бывшее не
    только центром британского паб-рока 70-х, но и имевшее собственную студию звукозаписи. Выступали там все, от "U2" и "Depeche
    Mode" до Джеффа Бэка и "Iron Maiden". Часто появлялись там и блюз-рокеры. Состав "Chicken Shack", игравший там, помимо
    Стэна Уэбба, включал второго гитариста Paul Butler, басиста Alan Scott, известного по работе на диске "Unlucky Boy" (1973
    г.) клавишника Tony Ashton и игравшего ранее в "Ten Years After" ударника Ric Lee. Стэн находился в отличной форме, однако
    исполнявшаяся группой музыка была достаточно традиционным хард-блюзом, без намека на инновации и эксперименты. Звучали
    по большей части кавер-версии, среди которых стоит выделить "Tell Me" Хаулин Вулфа, "Back Door Man" Уилли Диксона и "Shake
    Your Money Maker" Элмора Джеймса. Необходимо отметить, что альбом "Roadies Concerto" в виде отдельного компакт-диска до
    настоящего времени не выходил, а недостающие здесь треки можно найти на диске "Black Night", изданным в 1997 г. британской
    фирмой Indigo.'
