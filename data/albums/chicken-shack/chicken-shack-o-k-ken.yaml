- id: 416
  author: Дмитрий Казанцев
  mark: 4
  date: '2004-01-12'
  text: Скучный, монотонный, безыдейный альбом группы. Это только второй диск Шэка, но что-то уже не то. Почти все песни -
    одинаковые тоскливые блюзы "а ля Чикаго", ни о чем. Между песнями идиотские шутки непонятно для кого и зачем. Дудки играют
    странно и мутно. Какие-то признаки жизни и музыки появляются лишь на шестом треке Кристины Перфект "A Woman Is The Blues".
    Без нее этот диск имел бы оценку НОЛЬ; она отлично играет на пианино и поет. Стэн Уэбб же поет очень странно и искусственно;
    даже удивительно, что именно этот диск побывал в Топ-10 английского хит-парада.
