- id: 1047
  author: Александр Панин
  mark: 7
  date: '2006-11-07'
  text: Дебютный альбом молодого чикагского гитариста, внешне похожего на Бадди Холли, но играющего старый акустический блюз.
    На диске записаны каверы произведений Блайнд Блэйка, Роберта Уилкинса, Гэри Дэвиса, Блайнд Вилли Джонсона, Блайнд Вилли
    Мактелла и других древних блюзменов, а также блюзовые интерпретации вещей Сэма Макги и Мерла Трэвиса. Джоэл неплохо знает
    историю жанра, в прилагаемом буклете им прокомментирован каждый трек. Хотя сам Патерсон утверждает, что точной копией
    оригинальной записи является лишь одна вещь диска, Guitar Chimes Блайнд Блэйка (поскольку она, по его мнению, совершенна),
    все же собственных композиций Джоэла здесь явно не хватает. Также, пожалуй, его подходу несколько недостает энергии и
    жизни, при прослушивании в определенные моменты у меня складывалось впечатление, что играет запрограммированный музыкальный
    автомат. В целом это нормальный дебютный альбом интересного музыканта, с качественным фингерпикингом и слайдом и, что
    особенно приятно, неплохим вокалом. Диск вышел в 2002-м году на маленьком лейбле Ventrella, а через три года появился
    второй, электрический альбом Патерсона, записанный уже с группой.
