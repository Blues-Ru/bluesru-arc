- id: 1089
  author: Константин Колесниченко
  mark: 10
  date: '2007-06-07'
  text: Признаюсь, этот альбом у меня появился из-за того, что лидер группы "Devil in a Woodpile" Rick 'Cookin' Sherry играет
    на гармонике. Я не разочаровался ни в гармонике, ни в группе в целом. На альбоме - классная смесь кантри, блюза, регтаймов,
    хот джаза. Все сыграно с необычайным юмором и мастерством. Рик не только харпер,он поет, владеет кларнетом, играет на
    стиральной доске и барабанах. Его игра на гармонике - это стиль Sonny Terry, он мастер, именно композицией Терри и начинается
    альбом - "A long way from home". Дальше "Devil in a Woodpile" мешают американскую музыку как хотят, подбирая очень разнообразный
    материал, например, "Bron-Y-Aur Stomp" Лед Зеппелин или When I'm Drinkin'" Биг Билла Брунзи. И все это в интересной манере,
    с веселым и чуть-чуть манерным вокалом Рика,приправленным тубой и кларнетом. Отличный альбом, рекомендую всем!
