  date: '2014-08-09'
  text: 'Среди вещей представленных на этом диске и ослепительные быстрые номера и расслабленные буги с вкраплениями рэгтаймов
    и тягучие медленные блюзы. Стилистически это стиль - Texas Santa Fe, одними из адептов которого в 30х были Black Boy Shine,
    Andy Boy и Rob Cooper. Шоу был открыт в 60х, как часто было с блюзменами - под конец жизни, когда начался фолк-блюз бум.
    И уху слушателей открылась целая эпоха. Прекрасная запись, однозначно рекомендуется к прослушиванию.


    А вот как живо сам пианист говорил о своей музыке:


    "When you listen to what I''m playing you got to see in your mind all them gals out there swinging their butts and getting
    the mens excited. Otherwise you ain''t got the music rightly understood. I could sit there and throw my hands down and
    make them gals do anything. I told them when to shake it, and when to hold back. That''s what this music is for." Robert
    Shaw, 1963


