- id: 50
  author: Алексей Калачев
  mark: 7
  date: '2002-12-17'
  text: 'Человек за фортепиано. Классика. 72 минуты блюза 40-х годов. Хотя на гитаре Большому Масео подыгрывает Тампа Ред,
    это мало что меняет: негр поёт свои однообразные блюзы, аккомпанируя себе на пианино, остальные инструменты не принципиальны.
    Вполне приличное качество звука для эпохи, когда такие записи часто делались в гостиничных номерах на микрофон, стоящий
    на подоконнике. Относительным недостатком  коллекции можно считать её некоторую монотонность. Дело в том, что когда издаются
    аудио архивы классиков, они издаются сплошняком, без редактирования, коммерческой «верстки» номеров, используемой для
    обычных дисков, грубо говоря, – быстрая, медленная, потом минорная, теперь мажорная и т.д.'
