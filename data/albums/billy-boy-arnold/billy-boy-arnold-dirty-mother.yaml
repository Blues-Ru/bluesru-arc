  author: Константин Колесниченко
  mark: 5
  date: '2008-02-22'
  text: Думаю, ни у кого нет сомнений, какое именно слово подразумевает Билли, когда поет "Dirty Mother Fuyer". Странная песня,
    как-то не совсем в блюзовом ключе, который хоть и использует, порой, топорные метафоры, но все же не говорит так грубо.
    Возможно, время такое для музыки, переломное - 77 год и состав не самый удачный - лысеющие рокеры из Groundhogs. Альбом
    уже не звучит, как чикагский блюз - это скорее блюз с элементами хард-рока и со звуком эха в стиле 80-х. Не могу сказать,
    что музыканты играют плохо, отличное владение инструментом присутствует, но как-то все пресно и совсем неблюзово. Есть
    на альбоме и пара неплохих мелодий, но слушать, большей частью, шаффлы, сыгранные в тяжелой манере - это уж совсем на
    любителя и фаната подобной музыки.
