reviews:
- id: 87
  author: Андрей Евдокимов
  mark: null
  date: '2002-12-17'
  text: 'Документ эпохи молодого чикагского блюза на заре 60-х: безыскусного, энергичного и агрессивного, очарованного электрическими
    искажениями. Билли Бой держит гармонику в чаше своих ладоней, создавая ей аккустическую камеру, и прижимает микрофон вплотную.
    Ни капли энергетики не пролито мимо. Десятилетия спустя эта запись подстегивает слушателя ритмическими импульсами. Записано
    в один день для молодого лейбла начинающим блюзовым энтузиастом; конверт пластинки сопровождает статья молодого журналиста,
    блюзового энтузиаста, который стремится разъяснить своим современникам, что, хоть этот блюз не так субтилен, как записи
    блюзовых патриархов, это все же - настоящий блюз. В студии работал один из признанных блюзмэнов Чикаго - пианист Лафайетт
    Лик. Остальные - молодь. Бассист Джером Арнольд - брат Билли Боя, получивший признание в блюзбэнде Хаулин Вулфа, и славу
    - в легендарном первом составе Блюзбэнда Пола Баттерфилда. Гитарист Майти Джо Янг позже утвердился в качестве солиста,
    работяги чикагских блюз-клубов.'
