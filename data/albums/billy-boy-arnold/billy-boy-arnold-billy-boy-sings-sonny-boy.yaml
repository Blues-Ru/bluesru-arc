- id: 1425
  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-04'
  text: 'Арнольд – участник переворота в звучании чикагского блюза, когда оный из игриво-джазового стал суровым и тяжелым.
    Однако до этого переломного момента он успел попасть под патронаж одного из самых очаровательных персонажей т.н. "довоенного"
    чикагского блюза: Санни Боя Уилльямсона I. Который давал ему и музыкальные, и житейские уроки. Учитель был заколот ледяным
    резаком (очень модный способ убийства в Чикаго 60 лет назад). Блюз с тех пор изменился почти до неузнаваемости, а Арнольд
    сам стал "классиком". Но в этом альбоме время летит назад. Строгость обложки, точность названия соответствует скрупулезности
    воссоздания стилистики исполнения. И мандолина возвращена в блюзбэнд. Здесь два мастера губной гармоники разных эпох встречаются
    снова, теперь на равных. 18 песен сыграны с грубоватой нежностью. Кажется, будь его воля, Арнольд записал бы все песни
    Уилльямсона - с большим удовольствием.'
