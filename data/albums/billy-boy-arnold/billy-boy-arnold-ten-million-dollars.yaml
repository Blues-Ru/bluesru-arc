- id: 1019
  author: Константин Колесниченко
  mark: 9
  date: '2006-07-20'
  text: 'Billy Boy Arnold известен широкой публике в основном своей работой с Bo Diddley,
    ранними работами и своими поздним творчеством на лэйбле "Alligator". Альбом "Ten
    Million Dollars" хорош и интересен тем, что он не относится ни к одному из этих
    периодов творчества музыканта. Альбом записан в 1984 году в Париже, записан очень
    хорошо, на нем нет ужасного звука 80-х.


    По стилистике "Ten Million Dollars" похож на творчество другого харпера – Junior
    Wells. Соло гармоники лаконичны, аранжировки - west side blues. Положительная
    черта исполнительского стиля Billy Boy Arnold – это чистый, неперегруженный звук
    гармоники, естественный, разговорный вокал, хотя, конечно, блистательным певцом
    его не назовешь. На альбоме – известные блюзовые хиты, и авторский материал, включая
    известный хит "Wish You Would", достаточное количество трогательных минорных номеров,
    композиций с привкусом фанка. Особенно хочется отметить: "Just a Little Bit",
    "Trust My Baby", "Going Home".


    Все музыканты черные, потому все ОК, и сделно с особым и классным вкусом: Billy
    Boy Arnold – harmonica, vocals, известный сессионный гитарист Jimmy Johnson, John
    "Mad Dog" Watkins – guitar, очень классный пианист – Saint James Bryant, Larry
    Exum – bass, Fred Grady – drums.'
- id: 1071
  author: Дмитрий Казанцев
  mark: 7
  date: '2007-05-10'
  text: 'Билли Бой начал в 50-х, потом исчез. Потом писАлся в 60-х и снова пропал
    на 10 лет. А потом на 8 (как раз перед этим диском). А затем снова исчез на 9
    лет и появился на Аллигаторе в 1993 году.


    Арнолд поет и играет на губных гармошках. Он также написал несколько известых
    блюзов в начале своей карьеры блюзмена. Этот альбом записан во Франции для фирмы
    Black & Blue. С ним играет довольно большая группа музыкантов (интересная ритм-секция
    и пианист). По музыке это Чикаго-блюз, но совсем не примитивный. Диск начинается
    ужасно - заглавный трек записан с расстроенными гитарами и парни лепят откровенно
    мимо нот (да и игра Билли на гармошке - не фонтан). Радостно то, что потом все
    становится ОК, а поет Билли Бой просто отлично.


    На альбоме 10 песен, 4 написал сам Арнолд. Здесь есть очень известные хиты: "I
    Wish You Would", "My Babe", "Just A Little Bit", Going Home", "Last Night", "Sugar
    Mamma". Симпатичный диск, но не без огрехов, конечно.'
