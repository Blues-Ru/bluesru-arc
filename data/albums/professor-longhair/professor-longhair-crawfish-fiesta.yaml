  author: Константин Колесниченко
  mark: 10
  date: '2009-03-24'
  text: Proffesor Longhair - одна из самых важных фигур в фортепианном блюзе и один из отцов-основателей новоорлеанского блюза.
    О его влиянии на свою музыку говорили Dr. John, Marcia Ball, Allen Toussaint и др. Блюз, который играет Proffesor Longhair,
    пропитан ломаными ритмами, замечательной атмосферой юга, настроением карнавала Mardi Gra и каким-то безграничным оптимизмом.
    Мелодии, записанные на альбоме, достаточно услышать краем уха утром, чтобы зарядиться хорошим настроением и насвистывать
    их потом целый день, именно таким насвистыванием и начинается самая известная его композиция - "Big Chief". Альбом "Crawfish
    fiesta" вышел в1980 году, в этом же году музыканта не стало, но музыка записанная им будет жить вечно.
