  author: Кирилл Мошков
  mark: null
  date: '2003-12-01'
  text: 'Спустя два с половиной года после ухода из жизни 45-летнего мастера блюзовой губной гармоники Уильяма Кларка легендарный
    блюзовый лейбл "Аллигатор", выпустивший четыре самых популярных прижизненных альбомов Кларка, разразился своего рода собранием
    его сочинений. Шестнадцать треков, записанных в разные годы и с разными сопровождающими составами, рисуют почти исчерпывающий
    портрет этого музыканта и вокалиста.


    Кларк отличается от других белых блюзменов своего поколения (да и не только своего). Как и многие из них, он следовал
    в своем творчестве архетипам "чикагской школы" - городскому электрифицированному блюзу, замешанному в той же мере на фразировке
    и идиоматике более ранних, "сельских", почти фольклорных форм этого искусства, в какой и на энергии электричества, на
    городской, настырной, утяжеленной ритмике, причем в варианте Кларка - отраженной и усиленной через зеркало блюз-рока.
    В этой смеси толком уже и не разберешь, что пришло с хлопковых полей Юга 30-х, что - из прокуренных клубов черного чикагского
    Саутсайда 50-х, а что - из звукозаписывающих студий Лондона 60-х. Но, если о других белых блюзменах (особенно как раз
    "гармонистах"), кроме этого, и сказать-то зачастую нечего, то Кларк обладает собственным, достаточно индивидуальным голосом,
    своим почерком, и искусство его, хотя и вторично, вполне может заслужить оценки "совершенно".


    Уильям Кларк пришел к блюзу совсем нетипично для своего поколения. Обычно белые блюзмены в своей студенческой молодости
    слушали пластинки чикагских гигантов: Мадди Уотерса, Хаулин Вулфа, Сонни Бой Уильямсона II, Литтл Уолтера, Отиса Раша,
    Бадди Гая, Джуниора Уэллса... Кларк студентом не был, родом он из калифорнийской пролетарской семьи, и блюз впервые услышал
    14-летним пацаном на пластинках звезд "Британского вторжения", обрушившегося тогда на Америку вслед за битломанией - Rolling
    Stones, Animals, Kinks... Так, отразившись в заокеанском зеркале, блюз нашел нового адепта. Кларк пробовал себя на гитаре,
    на барабанах, но вот в 1967 году, в 16-летнем возрасте, услышал наконец оригинальный чикагский блюз, купил губную гармонику
    - и пропал. Мастерство тогдашних мастеров блюзовой гармоники заворожило его: вместо акустического заунывного звука чикагские
    чернокожие титаны - Биг Уолтер Хортон, Джуниор Уэллс, Джеймс Коттон и особенно Литтл Уолтер - использовали звук электрический,
    "фузящий", получавшийся сознательной перегрузкой специального каплевидного микрофона Shure Blue Bullet, прижатого ладонями
    музыканта прямо к гармонике. Драйвовый, жесткий, хриплый звук этих музыкантов переплелся в игре Кларка с еще одним влиянием:
    в те же годы он страстно полюбил джазовых органистов (Джека Макдаффа, Джимми Макгриффа, Ричарда "Грув" Холмса) и оказался
    под сильным влиянием гармонических и мелодических находок этих музыкантов. Переехав в 18 лет из родного Инглвуда в Лос-Анджелес,
    Кларк пошел работать (он двадцать лет, до конца 80-х, проработал машинистом в бойлерной), и при этом активно и безустанно
    исследовал местную блюзовую жизнь. В одном из клубов Лос-Анджелеса он познакомился с Джорджем "Гармоникой" Смитом, который
    стал его "гуру". Темнокожий мастер, игравший одно время у самого Мадди Уотерса, научил белого юнца всему, что умел сам,
    и на многие годы стал главным ориентиром в творчестве Кларка. Многие годы, до самой кончины "Гармоники" в 1983 г., они
    практиковали совместные выступления.


    Уже в 80-е Кларк стал одним из наиболее известных белых блюзовых "гармонистов". Начиная с 1978 г., на нескольких мелких
    лейблах выходили его виниловые "лонгплэи", привлекшие к нему внимание ценителей. Другое дело, что блюз для Кларка оставался
    музыкой резко некоммерческой. Он шесть раз номиновался на получение престижной премии им. В.К.Хэнди и один раз при жизни
    получил ее (в 1991 г. за композицию "Must Be Jelly", которая, кстати, присутствует на сборнике - три других премии он
    получил посмертно), но вся его музыкальная карьера протекала в прокуренных ночных клубах, которые он со своим ансамблем
    объезжал - от побережья до побережья - на автофургоне в течение долгих, по месяцу-два, туров. Видимо, как раз такой образ
    жизни, неминуемо связанный с плохим питанием и (в блюзовом случае, увы, практически всегда) с неумеренным потреблением
    алкоголя, и свел его в могилу.


    Окидывая взглядом творчество позднего (1991-95) Кларка посредством свежевыпущенного сборника, прежде всего поражаешься
    тому, насколько он и его ансамбли, что называется, sophisticated - искушены, изощрены. Никакой свойственной чикагским
    образцам милой угловатости, никаких пропущенных нот, никакого "блюз без лажи не бывает" - четкая, уверенная, выверенная
    работа инструментов, совершенные аранжировки (которые в большинстве случаев можно рассматривать как архетипичные для всего
    жанра в целом), и, при стопроцентном следовании стандарту - необычайная свежесть в игре. Кроме того, Кларк обладает мощным
    драйвом, который временами заставляет забыть о цвете его кожи (в этом отношении из белых музыкантов его можно сравнить
    разве что с Полом Баттерфилдом, и то я не уверен, что Кларк не выиграет при таком сравнении). Использованные в сборнике
    записи охватывают период с 1986 по 1996 год, но при этом звучание их весьма сходно. Неудивительно: все свои записи Кларк
    продюсировал сам и делал в одной и той же студии (Pacifica, Калвер-Сити) с одним и тем же звукорежиссером - Гленном Нишидой.
    Нишида (и Кларк, как продюсер) следует в этих записях современному чикагскому стандарту, сравнимому, скажем, со звуком
    позднего Джуниора Уэллса: четкая, пространственно узкая ритм-секция, более широкий, с отчетливой эхо-составляющей звуковой
    план с духовыми и клавишными и довлеющие над всем этим грубый, почти "черный" голос Уильяма Кларка и его же ревущая, но
    светлая по тембру гармоника.


    В целом именно этот альбом можно назвать той записью, с которой следует начинать знакомство с творчеством Кларка. Для
    обычного слушателя знакомство может этим альбомом и ограничиться, ну, а ценитель блюза будет иметь повод пойти в своем
    знакомстве с Кларком вглубь.'
