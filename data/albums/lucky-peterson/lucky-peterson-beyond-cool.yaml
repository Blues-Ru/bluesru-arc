- id: 1054
  author: Дмитрий Казанцев
  mark: 6
  date: '2007-02-13'
  text: 'Второй диск для Verve. Он слабее предыдущего. Я бы сказал, что по музыке он совсем хилый, но игра и пение на высоте.
    Проблема в том, что Лаки использует тяжелую блюз-роковую гитару, которая совсем не вяжется с блюзом, соулом, фанком и
    духовыми на этом альбоме. Я бы сказал, что все это звучит как плохой блюз-рок и ритм-н-блюз 80-х, но именно в 80-х Питерсон
    как раз делал хорошие альбомы.


    Этот альбом на грани вылета из категории "нужные диски". Жаль.'
