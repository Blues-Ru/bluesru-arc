  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2013-04-18'
  text: 'Лаки Петерсон дал свой первый концерт в возрасти 3-х лет, а в пять уже выпустил
    первый сингл, продюсером которого был никто иной, как легендарный Уилли Диксон!
    В 6 лет он был уже известен всей Америке благодаря выступлению в телевизионных
    шоу (шоу Эда Салливана и других).


    У отца Лаки был блюзовый клуб в Буффало, в котором часто выступали такие блюзовые
    музыканты, как Бадди Гай, Джуниор Уэллс, Мадди Уотерс, Коко Тэйлор. Выросший практически
    на сцене, Лаки начал играть практически одновременно с тем, как он начал говорить.
    Он начал с ударных, но быстро переключился на орган и фортепиано. К 8 годам он
    освоил и гитару, а в 17 уже подписал трехлетний контракт органиста в группе Литтл
    Милтона.


    Профессиональная сольная карьера Лаки началась в 1989 году с контракта с фирмой
    Аллигатор, на которой он записал альбом Lucky Strikes, за которым последовал Triple
    Play.


    Тройная игра (в названии обыгрывается кол-во инструментов, на которых играет Лаки
    - орган, фортепиано и гитара) - второй альбом блюзового вундеркинда на фирме Аллигатор
    и его лучший альбом по версии AMG.'
