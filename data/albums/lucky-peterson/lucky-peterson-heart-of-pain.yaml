- id: 1635
  author: Андрей Евдокимов
  mark: 7
  date: '2010-07-20'
  text: 'Исполнительской виртуозности не отнять у Лаки. И опыта этому давно уже "экс-вундеркинду" не занимать. А все же хочется
    в его музыку чего-то добавить… Хоть капельку озарения, что ли? Очередной альбом так мастерски сложен из знакомых компонентов,
    что не возникает ощущения вторичной переработки уже игранного и слышанного ранее. Драматургически все очень верно: от
    тягучего чикагского шафла в начале до финального скоростного ритм-энд-блюза через парочку лирико-пафосных медленных блюзов,
    плюс возвышенный госпел (спетый в дуэте с супругой Тамарой) и интермеццо для буги на фортепиано соло. Гитарный саунд Лаки
    на слух продолжает традиции Алберта Коллинза. Кажется, все есть для счастья, но нет: чего-то важного не хватает!'
