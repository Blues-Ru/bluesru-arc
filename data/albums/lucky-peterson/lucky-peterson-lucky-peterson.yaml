reviews:
- id: 2109
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2013-04-18'
  text: Восьмой сольный альбом блюзового вундеркинда, который, естественно, на момент
    выпуска этого альбома уже давно превратился в зрелого мастера. Лаки легко управляется
    с клавишными и гитарой, а также выступает в роли композитора и певца. Довольно
    приятный и исключительно профессионально сделанный и сыгранный альбом, хотя и
    не выдающийся. На кавере трека Уилли Нельсона Funny How Time Slips Away (естественно,
    с привкусом кантри) в качестве приглашенного вокалиста присутствует Джо Луис Уолкер.
    Мне больше всего понравился написанный самим Петерсоном трибьют Лютеру Аллисону,
    а также последний трек с интересным органным соло.
