  author: Дмитрий Казанцев
  mark: 7
  date: '2007-02-13'
  text: 'Четвертый альбом Лаки, первый для Verve. Питерсон поет, пишет, играет на
    гитаре и клавишах. Блюзы, соул-блюз, ритм-н-блюз и даже блюз-рок.


    Сначала плюсы: Лаки отменно поет и играет на клавишах, хорошо (но довольно) стандартно
    солирует на гитаре. Интересные аранжировки и звуки. Есть инструменталы.


    Минусы: альбом длинный - 60 минут, много однообразных блюзов, инструменталы неинтересные.


    Первые 5 песен хороши (стандарты в интересных обработках), а вот потом становится
    хуже. Я ожидал большего от этого дебюта на Verve.'
