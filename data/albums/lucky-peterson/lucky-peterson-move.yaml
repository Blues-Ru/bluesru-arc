  author: Евгений Долгих
  mark: null
  date: '2002-12-17'
  text: 'Очередной альбом Лаки Питерсона не принес каких-то неожиданных блюзовых откровений — он очень добротный, ладно скроенный,
    но, пожалуй, чересчур ровный и однообразный. Блюз вообще построен на игре оттенков, настроений и интонаций и, упустив
    одну из этих особенностей, становитс просто песней, не обладая при этом большими достоинствами с точки зрени текстов.
    Не хочу сказать, что Питерсон потерял блюзовую нить, но большинство вещей исполнено как-то бесстрастно. Достаточно сравнить
    известнейшую вещь "Let''s Go Get Stoned" в этом альбоме с исполнением Рэя Чарлза.


    <p>В целом "Move" выдержан больше в ритм-энд-блюзовой тональности. Темп выше среднего и мощный драйв характерны для большинства
    композиций. Гитара Питерсона очень хороши, я бы сказал, интеллигентна. Даже в самых интенсивных брейках она не срывается
    на визг и не сбиваетс с такта. Противоположностью гитаре является его голос — слегка хриплый, нервный, который ему явно
    приходится сдерживать. К сожалению, это сдерживание иногда идет в ущерб общему блюзовому настрою, как в вышеупомянутом
    "Let''s Go Get Stoned". Зато если Питерсон меньше контролирует себя, получаетс очень эффектно и выразительно ("Tin Pan
    Alley", "I''m Back Again"). Странное дело, но мне показалось, что чужие вещи в его исполнении на этом альбоме звучат ярче
    и свежее, чем собственные.


    <p>Некоторые вариации Питерсона смутно напомнили мне хард-роковые времена — длинные гитарные "запилы", знакомые переходы.
    Внимательно прочитав его же собственную аннотацию к компакту, я убедился в своей правоте — он пишет: "...я люблю придавать
    рок-н-ролльное звучание своим блюзам". Однако такое сочетание, ласкающее слух старых рок-н-ролльщиков, слегка утомляет
    любителя чистого блюза эклектичностью и некоторой назойливостью. Особняком в альбоме стоит не имеющая отношения к блюзу
    песня Принца "Purple Rain", но, надо сказать, она вовсе не портит общей картины благодар очень тактичной и корректной
    аранжировке.


    <p>Новая запись Лаки Питерсона, не являясь шедевром, тем не менее достойна внимательного прослушивания, а любителю рока
    и буги доставит истинное удовольствие.'
