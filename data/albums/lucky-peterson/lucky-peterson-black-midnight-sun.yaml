  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-02'
  text: 'Очень интересный сплав ультрасовременного блюза, соула, фанка, даба, эсид-джаза.
    Продюсер-то Bill Laswell. Но вы не пугайтесь, материал очень понятный и вмеру
    попсовый, есть даже песня Мика Джаггера! Минимум инструментов, максимум грува,
    блюза и фанка.


    И все-таки Лаки слишком "живой" музыкант для такого продакшна.'
