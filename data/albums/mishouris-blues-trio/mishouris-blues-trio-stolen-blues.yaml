  author: Константин Колесниченко
  mark: 9
  date: '2008-12-26'
  text: '<img src="http://i072.radikal.ru/0812/a2/ee0ca98ee9e7x.jpg"> Не будучи москвичом, я познакомился с этой блюзовой
    тусовкой исключительно благодаря интернету – Живой Журнал и blues.ru сделали свое дело. Признаюсь, я даже сложил свое
    мнение о каждой из ключевых фигур этого сообщества. Не стал исключением и Михаил Мишурис, я слышал его предыдущий альбом
    "I Got Money", что-то видел на youtube и общался посредством интернета. Мне нравится его музыка, тем более, что для меня
    стало, в своем роде, открытием, что вот тут, совсем рядом, кто-то может играть мою любимую музыку довольно близко к тому,
    как я хочу, чтобы она звучала.


    Опять же, благодаря Сети, я знал, что Михаил изменил концепцию своей музыки и звучанию бенда с духовой секцией а ля "Roomful
    Of Blues" он предпочел акустический формат. Мы как-то с Мишурисом говорили по этому поводу и вот, что он сказал: "Акустика,
    в моем понимании, это некоторый такой минимализм. Решение музыкальных задач средствами прозрачного звучания и лаконичной
    аранжировки. Сейчас я действительно больше занимаюсь акустикой. Скорее всего потому, что тихий звук позволяет решать какие-то
    музыкальные задачи успешнее. Особенно это актуально при нашей известной проблеме ансамблевой игры, когда музыканты не
    слушают друг друга."


    В общем, не имея возможности услышать все эти перемены в живую, я зато получил возможность послушать новый альбом. Я попробую
    написать про каждый трек отдельно, потому что мне кажется, что к их выбору Михаил подошел очень серьезно и в основе его
    предпочтения лежит определенная концепция.


    1."You don''t have to go" - классический чикагский блюз авторства Джимми Рида. С первых же секунд слышно, что концепция
    музыки Мишуриса изменилась – акустические гитары, барабан, в который наверняка стучит ногой кто-то из гитаристов и, как
    не удивительно, саксофон, не миссисипский саксофон, а самый настоящий сакс. Вот тут я сразу понял, в чем для меня основное
    достоинство новой музыки Миши – она противоречива. В результате, благодаря звучанию группы, получается и не Чикаго, и
    не дельта блюз, а вот что-то где-то посередине. В большей степени – это конечно же благодаря нетипичному инструменту (саксофон)
    плюс мягкий, глубокий и немного манерный голос Мишуриса (потому что, лично у меня, дельта ассоциируется больше с более
    скрипучим вокалом в духе, например, Son House).


    2."Shake ''em on down" - традиционный блюз с интересной перкуссией, игрой слайдом на гитаре – тут уже гораздо ближе к
    дельте и деревенским блюзам давних времен.


    3."Tom Rushen Blues" - несмотря на то, что автором этого блюза является довольно резкий (по саунду) музыкант – Чарли Паттон,
    да и речь в песне идет о местном шерифе, забирающем главного героя в кутузку, этот блюз у меня всегда был чем-то вроде
    колыбельной. У Мишуриса именно так и получилось, очень проникновенно и мягко.


    4."John The Revelator" - почему-то мне кажется, что Михаилу этот трек тоже очень нравится. Этот классический госпел –
    отличная площадка для смены динамики альбома, тут есть где разгуляться Мише, как вокалисту (что он собственно и делает).
    Однозначно один из лучших треков альбома!


    5."Prison Cell Blues" - блюз еще одного известнейшего архаичного блюзмена - Blind Lemon Jefferson''a. Вот тут я, как человек,
    сам увлекающийся игрой на губной гармонике, хочу отметить, что Миша играет довольно изобретательно для музыканта, у которого
    харп далеко не самый основной инструмент.


    6."Boom boom out goes the light" - этот блюз, в свое время играл никто иной, как Литтл Уолтер, а кем он был для блюзовой
    губной гармоники, думаю, рассказывать не нужно. Потому, честно говоря, я ожидал, что для записи этого трека Мишурис пригласит
    кого-нибудь из местных известных харперов. Тут нужна виртуозность, потому что все версии этой песни с гармоникой слушаются
    исключительно под грузом авторитета Маленького Уолтера.


    7."How long, how long" - классический блюз Leroy Carr''a, он для меня всегда был образцом фортепианного блюза, медленного
    и проникновенного. В формате группы Михаила Мишуриса он звучит тоже замечательно.


    8."Joshua Fit The Battle Of Jericho" - если вы слышали, как эту песню поет Махалия Джексон, то не ждите, что на этом альбоме
    она будет исполнена также. Мишурис сделал из этого госпела, нечто очень залихватское и, как мне показалось, с оттенком
    музыки Тома Вейтса в настроении – я все время ожидаю услышать какой-нибудь пиратский присвист во время прослушивания.


    9."Wang dang doodle" - один из любимых моих блюзов в истории жанра. Особенность этой песни в исполнении ее Howlin'' Wolf
    – второго такого певца нет и не будет. Потому, мне кажется, чтобы песня звучала достойно, в нее нужно добавить некоей
    дикости, ярости, которую в нее привнес Волк. В данном случае соло саксофона и гитара на бекграунде делают свое дело, в
    то время, как Миша довольно убедительно поет "We gonna pitch a wang dang doodle all night long ".


    10."St.Louis blues" - классический блюз W.C. Handy в интерпретации Михаила звучит очень по-новоорлеански, в общем так
    и должна звучать эта песня.


    11."Nemov''s Theme" - гитарный инструментал, который ставит точку во всем альбоме.


    Подводя итоги, альбом у Михаила Мишуриса получился отличный! И самое хорошее, это то, что он получился неожиданным, т.е.
    каждый трек несет в себе какую-то особенность, интересность, необычность подхода и исполнения. Ведь по-большому счету,
    материал "Stolen Blues" - это не редкие песни, а всем известная классика – тем сложнее сыграть ее по-новому и вдохнуть
    в нее новую жизнь.


    P.S. Перечитал рецензию, возможно, кому-то может показаться, что она чересчур комплиментарная, но просто, на самом деле,
    альбом получился хороший.'
