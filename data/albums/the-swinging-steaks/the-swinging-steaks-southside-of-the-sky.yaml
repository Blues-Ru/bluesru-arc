- id: 487
  author: Сергей Колобашкин
  mark: null
  date: '2004-03-12'
  text: Это очень редкая группа, с весьма примичательно редким стилем музыки, напоминающим южный рок в тесной любви с блюзом
    и кантри. Очень тяжело оценить песни в отдельности, так как они представляют собой одну очень большую песню, которая сильно
    радует слух. Ребята мне напомнили Lynyrd Skynyrd, не знаю, чем, но что-то там есть! Самой запоминающейся песней является
    "Southside Of The Sky", которая трогает своим весьма личным текстом и отличной музыкой. "Train Wreck" тоже очень приятная
    композиция. "Dancin' On The Water" - это одна из тех песен, которая сразу же западает в сердце, и избавиться от нее весьма
    тяжело. Сразу же после нее следует замечательная "Behind Me". Вообщем это удачный альбом, где нет промахов, и всяких провалов.
    Попсой тоже не пахнет, нет никакой дешевой лажи, так что его смело можно покупать, только при условии, что если его можно
    найти!
