- id: 1223
  author: Константин Колесниченко
  mark: 9
  date: '2008-03-07'
  text: 'Глядя на обложку альбома Дейва, сразу становится понятно - это Джук Джойнт блюз, музыка маленького, душного кабачка
    возле дороги. Это подтверждает и смешная бейсболка, которую Riley накинул на голову очень по-деревенски, да и Sam Carr
    за барабанной установкой не оставляет сомнений в принадлежности альбома именно к этому жанру. Здорово, что появляются
    такие музыканты как Дейв, это оставляет надежду на развитие черного блюза, именно в том формате, который ближе всего к
    истокам.


    Музыка альбома "Whiskey, Money and Women" бескомпромиссна и груба, но это не значит, что Riley плохой гитарист, нет, наоборот
    - он замечательно владеет инструментом. Слышно, что он знаком и с манерой игры таких групп, как Jelly Roll Kings (Sam
    Carr оттуда), но и подход BB King - ему тоже дается легко. По манере исполнения Riley слышно, что он привык выступать
    таким малым составом или в одиночку - он очень грамотно заполняет музыкальное пространство своей игрой, выполняя роль,
    как соло, так и ритм-гитары. Музыка альбома - это правильное и интересное сочетание старого подхода и материала, с тем,
    что может заинтересовать современного слушателя. Есть и шаффлы, есть и более синкопированный вариант блюза, а есть и пара
    проникновенных минорных баллад, исполненных в интересной грязноватой манере под соло электрогитару. Помимо барабанщика
    Sam Carr Дейва на некоторых композициях сопровождает басист и харпер.'
