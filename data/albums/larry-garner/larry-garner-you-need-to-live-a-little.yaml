  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-09-15'
  text: 'Гитарист, композитор и певец из Батон Руж Лэрри Гарнер посвятил себя современному
    Луизианскому свамп-блюзу. Это третий его сольный альбом (и первый на крупном лейбле
    и одновременно первый на родине), на котором он написал все песни (правда, первая
    из них до боли напоминает мне Sensitive Kind). До этого Гарнер завоевал себе славу
    в Европе, где он гастролировал ряд лет и даже успел выпустить пару альбомов на
    английском лейбле JSP.


    Получился альбом качественного современного свамп-блюза, где группа Лэрри усилена
    на некоторых треках духовой секцией с гостевым участием саксофониста Дэвида Ньюмена
    и другого знаменитого музыканта Луизианы - Сонни Ландрета (соло на треке 8). Обратите
    внимание на тембр гитары Лэрри - довольно интересный, да и техника неплохая.'
