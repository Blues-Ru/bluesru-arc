- id: 2002
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-09-15'
  text: 'Очередной альбом от мастера свамп-блюза из Батон-Руж выполнен в лучших традициях жанра: классический блюз с современным
    звучанием, исполненный высокопрофессиональными музыкантами. Этим альбомом Ларри не совершил революции, но звучит все очень
    прилично, и наверняка порадует ухо поклонника традиционного блюза.'
