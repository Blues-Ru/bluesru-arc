  text: 'Cuby and the Blizzards - The Universal Masters Collection - 1965 - 1979


    Сборник лучшего от легенды голландского блюза, прославившейся своими совместными выступлениями и записями как с американскими,
    так и европейскими грандами жанра. Записи в основном периода расцвета коллектива - с 1967 по 1972 год. Диск наверняка
    понравится всем любителям традиционного блюза без исключения, равно как и любителям блюз-рока начала 70-х.'
