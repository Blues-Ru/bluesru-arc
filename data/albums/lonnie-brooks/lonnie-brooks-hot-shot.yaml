reviews:
- id: 561
  author: Дмитрий Казанцев
  mark: 5
  date: '2005-04-02'
  text: 'Типичный блюзовый альбом на Аллигаторе 80-х годов. Звучит как музыка к дешевому
    боевику тех лет. Такое впечатление, что на Аллигаторе пытались сделать поп-глэм-музыку
    из блюза. Может у них и получилось, но блюз ли это? С таким-то звуком и подачей?
    С отсутствием глубины и фила? С гитарными запилами и криками тут и там.


    Я думаю, что блюз - это что-то более интимное и мудрое. Лонни хорошо поет и играет
    на гитаре, но этого вовсе недостаточно чтобы сделать альбом хорошим.'
