  author: Леонид Аускерн
  mark: null
  date: '2002-12-17'
  text: 'Так уж получается, что проходящие в нашем "CD-обзоре" релизы американских
    фирм представляют в основном два крупнейших центра звукозаписи — Нью-Йорк и Калифорнию.
    А сейчас гость достаточно редкий — блюзовый лейбл "Alligator" из Чикаго. Под одинаковым
    названием фирма выпускает коллекцию портретов видных блюзменов, которые с ней
    сотрудничают. Сери прекрасно оформлена — строгая солидная обложка, буклет с мини-постером,
    небольшой "визитной карточкой" музыканта, его дискографией на "Аллигаторе" и целой
    россыпью фотоснимков. И это помимо стандартной информации о размещенных на диске
    треках.


    <p>Лонни Брукс (его настоящее имя Ли Бейкер-младший) играет музыку, достаточно
    далекую не только от архаического, но и от традиционного блюза. Это современный
    ритм-энд-блюз, густо пропитанный джазовыми элементами — в основном традиционных
    джазовых стилей и фанк-джаза. Авторы буклета считают, что он "...соединил свинг
    Техаса, соул Мемфиса и чистую энергию чикагского блюза". Остается добавить, что
    Брукс родом из Луизианы, и это тоже нашло отражение в его музыке. Помимо гитары
    Брукса важную роль в общем саунде ансамбля играет как ритм-гитара его сына Ронни
    Бейкер Брукса, так и духовая секция (браво, Эб Локк за соло на тенор-саксофоне
    в "Family Rules").


    <p>Лонни Брукса нам представляют как короля вуду-блюза. Чисто музыкальных "изюминок",
    придающих такую специфику его игре я, увы, не расслышал. Думаю, что подобное определение
    вызвано скорее частым упоминанием атрибутов этого мистического негритянского культа
    в текстах. А поет Брукс здорово, невзирая на тексты. В его вокале, как и в гитарной
    технике, тоже заметно влияние джаза. Недаром Лонни — желанный гость не только
    на блюзовых, но и на джазовых фестивалях, например, в Монтре. Композиции диска
    представляют 8 его альбомов. Особо я бы выделил "In The Dark" и, великолепную
    "Cold Lonely Nights".'
