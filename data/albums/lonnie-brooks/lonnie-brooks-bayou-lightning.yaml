- id: 1514
  author: Константин Колесниченко
  mark: 8
  date: '2009-03-24'
  text: 'На мой взгляд, в 70-х именно фирма "Аллигатор" заняла место знаменитой "Чесс",
    большинство молодых и перспективных музыкантов заключили с ней долгосрочные контракты:
    Koko Taylor, Son Seals, Fenton Robinson, Lonnie Brooks и т.д. Альбом "Bayou Lightning"
    - это первая запись Брукса для чикагской фирмы.


    Говорят, что концерты Лонни Брукса – это блестящее шоу, пиротехническая игра на
    гитаре, близкий контакт с публикой. Часто, попадая в студию, такие музыканты сковываются
    и запись получается не такой яркой и интересной, как живые выступления. Этот альбом
    опровергает такое предположение. "Bayou Lightning" получился на удивление цельным
    и лаконичным, Лонни не переигрывает, использует различные стили – от современного
    блюза, до музыки соул, кейджн и зайдеко. Что удивительно, что ни к одному конкретному
    стилей полностью нельзя отнести запись, в каждой из песен есть понемногу от каждого
    из направлений.'
