    Лонни Брукс (настоящее имя Ли Бэйкер младший) - ветеран чикагского блюза родом
    из Луизианы, откуда он в начале 50-х годов перебрался в Техас и начал выступать
    под именем Guitar Junior. В 1960 он переехал в Чикаго, где сменил псевдоним и
    стал называться Лонни Брукс. В 1969 году Лонни записал свой первый сольный альбом,
    а с конца 70-х подписал контракт с лейблом Аллигатор, и это сотрудничество растянулось
    на долгие годы. К началу 90-х годов Лонни превратился в одного из признанных лидеров
    чикагского блюза, который успел посотрудничать практически со всеми известными
    блюзовыми музыкантами Америки, начиная от Коко Тэйлор и заканчивая Кенни Уэйном
    Шепердом. В музыкальном плане Брукс не боится смешивать блюз с другими стилями,
    добавляя элементы фанка, кантри и рока, а также вставляя агрессивные импровизационные
    соло во время концертных выступлений.


    Альбом Wound Up Tight был издан лейблом Аллигатор, продюсировали Лонни Брукс и
    сам Брюс Иглауэр. В качестве гостя на диске отметился Джонни Уинтер, который восхищался
    игрой Лонни еще с конца 50-х и даже в юности упросил пустить его в студию в Бемонте,
    штат Техас, где в тот момент записывался Брукс. Альбом получил признание у слушателей
    и критиков, а журнал Rolling Stone по итогам опубликовал статью о Лонни на 6 страницах.
    Приятный альбом энергичного чикагского гитарного блюза с изрядной долей рока,
    сыгранный технично и напористо, с хорошим драйвом.'
