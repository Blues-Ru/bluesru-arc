reviews:
- id: 931
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-12-01'
  text: 'Литтл Сонни - гармонист, певец и автор. Он появился неожиданно, записал три
    альбома для Stax Records, а потом изчез. Это его второй и лучший диск. Дело в
    том, что с ним на этом диске играют ребята из Bar-Kays - это одна из лучших групп
    в соуле/фанке вообще. Сонни шикарно солирует на гармошке, но и пение его на высоте
    (разве что мешает постоянное вибрато на конце фраз).


    На диске 11 песен, из них три инструментала. Музыка в духе соул-блюза и фанка;
    черная, мощная и с грувом. Здесь нет слабых мест, этот диск - супер!'
