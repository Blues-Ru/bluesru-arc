reviews:
- id: 594
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-04-27'
  text: 'Еще один блюзмен на Стаксе, а точнее на подразделении Стакса Enterprise.
    Литтл Сонни - гармонист, певец, автор и лидер. У него приятная манера игры на
    харпе, чем-то напоминающая Сонни Боя Второго. Не смотря на то, что Сонни великолепно
    поет, большинство треков на альбоме инструментальные. Еще одна радостная вещь
    - это то, что 8 вещей на альбоме из 10 написаны самим Литтлом. Аранжировки отличные:
    блюз, соул-блюз, фанки и ритм-н-блюз с очень мощной ритм-секцией и органом. Из
    хитов тут есть "Baby What You Want Me To Do" и "Goin'' Down Slow". Очень хорошая
    музыка и звук; это первая пластинка ЛС для Стакса.'
- id: 1036
  author: Константин Колесниченко
  mark: 10
  date: '2006-10-23'
  text: 'Потрясающий харпер, его дебютный диск. Литтл Сонни мало известен, альбомов
    выпустил тоже мало, и этот его диск - настоящий шедевр.


    Альбом записан на лэйбле "Stax" в 1970 году и это уже говорит о многом. Музыка
    - соул-блюз, чикаго блюз, много фанка и потрясающих инструменталов. Очень странно,
    что Литтл Сонни настолько мало известен, ведь он потрясающий певец (его голос
    чем-то похож на Литтл Милтона), владение гармоникой - гениальное, много элементов
    от Sonny Boy Williamson II, Sonny Terry и Junior Wells, но куча своих штук и фирменных
    приемов!


    Альбом на большую половину состоит из классных, чисто инструментальных композиций
    с налетом фанка и соул, другая часть - вокальная и более традиционна, но аранжировки
    свежие и разнообразные! <b>Высшая оценка, рекомендую этот диск всем! Название
    альбома справедливо.</b> Лучшие композиции выделять бессмысленно - диск очень
    ровный, все сыграно с чувством и мастерством.'
