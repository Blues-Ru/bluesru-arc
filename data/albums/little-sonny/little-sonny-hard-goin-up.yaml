reviews:
- id: 595
  author: Дмитрий Казанцев
  mark: 10
  date: '2005-04-27'
  text: Третий и последний диск Сонни на фирме Стакс вышел через три года после его дебюта. Сплав блюза, фанка и соула с классной
    ритм-секцией и отличными духовыми. Сам Сонни творит чудеса не только на гармошке, но и прекрасно поет. Некоторые песни
    на этом альбоме довольно длинные, можно насладиться интересными джемами с участием Сонни, гитаристов и духовиков. Солидная
    и красивая пластинка в духе соул-блюза.
