  author: Дмитрий Казанцев
  mark: 6
  date: '2005-08-24'
  text: 'Английское издание концерта 1972 года. 8 концертных треков (запись и исполнение не лучшие) добиты двумя интервью
    и тремя редкими синглами 1966 года - вот эти прифанкованные инструментальные синглы и есть самое интересное на этом диске.


    Литтл Сонни записал всего три альбома для фирмы Stax в начале 70-х, его музыка - это вокальный и инструментальный блюз/фанк.'
