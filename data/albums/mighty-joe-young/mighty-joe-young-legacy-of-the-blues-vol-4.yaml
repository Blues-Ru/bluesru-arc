  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-08'
  text: 'Второй альбом Янга вышел в 1972 году в серии Legacy of the Blues, он намного интереснее и музыкальнее его дебюта
    1971 года. На диске 10 композиций в стиле фанки-блюз и соул-блюз. Джо помогают 5 человек: басист, ударник, клавишник,
    трубач и саксофонист.


    Rock Me Baby сыграна в классной аранжировке (лучшая, что я знаю), фанки номера Baby Please и Just A Minute волшебные -
    все по очереди классно солируют. Очень симпатичные версии Early In The Morning и It''s All Right.


    У Джо совсем мало дисков, и этот один из лучших.'
