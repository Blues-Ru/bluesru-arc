reviews:
- id: 564
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-03'
  text: 'Сборник Янга с его двух лучших альбомов на Ovation Records. Всего 12 блюзов на 47 минут, к сожалению. 6 треков с
    Chicken Heads (1974) и другие 6 с Mighty Joe Young (1976). Обложка этого компакт-диска - это и есть обложка номерного
    диска 1976 года (странное дело, конечно).


    Очень хорошая запись и исполнение. Блюз, соул-блюз, фанки (местами напоминает Алберта Кинга). Очень приятное исполнение
    As The Years Go Passing By.


    Если Вы не собираете виниловые пластинки, то надо купить этот сборник - неизвестно, издадут ли те два альбома на КД по
    отдельности.'
