- id: 565
  author: Дмитрий Казанцев
  mark: 5
  date: '2005-04-03'
  text: 'Это дебютный альбом Янга. Вышел он в 1971 году, когда Джо уже стукнуло 44 года. На альбоме всего 7 песен, и некоторые
    из них слишком затянуты. В составе у Янга драммер, басист, пианист/органист и две дудки, но они не смогли создать ту волшебную
    атмосферу соул-блюза, которая задумывалась изначально. Партии духовых размазаны, клавиши задвинуты на задний план, сам
    Янг как-то странно играет на гитаре, да еще и запись совсем плохого качества (что странно для 1971 года). Как бы сказали
    сейчас, банда не зажигает.


    И все же, не так все плохо. Every Man Needs A Woman очень и очень хороша в своем груве, а на Got A Bad Case Of Loving
    You есть приятные моменты в импровизациях.'
