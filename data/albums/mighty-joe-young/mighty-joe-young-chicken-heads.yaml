  text: Это третий альбом гитариста и певца из Чикаго Джо Янга. Лучший из первых четырех.
    Великолепный соул-блюз и фанки. Этот диск точно находится в десятке моих любимых
    блюзовых альбомов. Жаль, что он так и не издан на компакт-диске. Диск классно
    записан и сыгран на лейбле Ovation Records.
