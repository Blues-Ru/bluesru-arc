- id: 355
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-12-12'
  text: 'Это последний альбом Янга, он был выпущен фирмой Blind Pig Records и является полностью проектом самого Джо. Он начал
    работать над ним десятилетием раньше, но проблемы со здоровьем не позволили ему закончить его раньше. Пластика вышла,
    когда Янгу стукнуло 70, а еще через два года он умрет, оставив за собой несколько отличных пластинок и легендарное имя.


    На альбоме 10 композиций, есть и блюзы, но в основном эта пластинка с стиле соул/фанк. Богатый состав группы и обаяние
    самого Джо делают этот диск довольно интересным. Янг сам продюсировал запись, и она далека от совершенства, но вполне
    съедобна; есть странное ощущение, что музыка и атмосфера 70-х сталкивается с очень странным продюсированием и игрой 90-х.
    Джо играет соло только в двух песнях, а ведь когда-то он был классным гитаристом со своим уникальным звуком и манерой.
    Что же касается самих песен, то они все очень хорошо сочетаются друг с другом, и тут нет особых провалов. Я бы лишь выделил
    лучшие номера, это Starvation, Got My Mind On My Woman, Ain''t Goin'' For That и его знаменитый номер еще из далеких 60-х
    Wishy Washy Woman.


    Оценка 4 балла. Хорошая, душевная, почти ностальгическая музыка, но запись и игра очень "бюджетные", и иногда это мешает.
    Джо Янг - еще один неповторимый голос и гитара второго поколения блюзменов; к сожалению нам досталось не так много его
    записей.'
