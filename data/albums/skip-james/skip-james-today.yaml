  author: Дмитрий Казанцев
  mark: 10
  date: '2007-12-15'
  text: 'Скип родился в 1902 году, а записываться начал еще в 30-х годах. Его заново
    открыли в 60-х на волне фолк-возрождения. Его уникальное пение фальцетом известно
    многим; он оказал сильное влияние на белых фолкеров и блюзменов в США и Британии.
    Я уж не говорю про то, что именно он - автор песни "I''m So Glad" (Cream, Deep
    Purple, etc.)


    Джеймс играет на гитаре (и пианино) и роскошно поет. 11 своих песен + "How Long
    Blues". Настоящая южная атмосфера фолк-кантри-блюза. К сожалению, Скип умер уже
    в 1969 году. Он - одна из главных фигур в корневом блюзе. Его влияние огромно,
    и не только в блюзе и фолке.'
