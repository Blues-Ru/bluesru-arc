  author: Алексей Калачев
  mark: 8
  date: '2003-09-18'
  text: Три блистательных пианиста (A.Ammons, M.Lewis, P.Johnson) играют инструментальные буги и джаз. Запись 30-х годов,
    их выступление в прямом эфире радиостанции Чикаго. Всего фирма Сторивилл, насколько мне известно, выпустила три таких
    альбома. Из 23 треков лишь на единственном здесь играют одновременно все трое, на другом дуэт, остальные – сольные выступления.
    Диск исчерпывает тему "бум фортепианного буги 30-40-х", в том смысле, что если он у вас есть, значит, вы обладатель "лучшего
    из лучшего".
