  author: Александр Сомов
  mark: null
  date: '2014-09-24'
  text: 'Все чаще встречаются исполнители из Европы(Норвегия), которые играют дельта
    блюз еще по-круче самих американцев(я про нынешних).


    Описание альбома гласит: "В этих грубых дельта блюзах, буги и госпел песнях, вы
    встретите убийц, приговоренных к смертной казни, отчаявшихся людей потерявших
    всякую надежду, пьяниц, воров и других обреченных, которым некуда податься."


    Крутое описание, что и сказать, но и материал сыгран отлично - здесь вы встретите
    и классические вещи и достойные песни собственного сочинения. В одной из которых
    - Devil''s Game, автор говорит, столько парней уже ходило на этот пресловутый
    перекресток, а вот он не пойдет и вместо дьявола, просит Господа позаботиться
    о нем, и направить. Есть тут и новоорлеанские звуки - Jesus Met The Woman At The
    Well начинается с характерных ударных, гитары и тубы, постепенно появляются бэк-вокалистки,
    вдруг неназойливо заиграл саксофон, через секунду мы уже слышим кларнет и все
    катится и движется в правильном направлении.


    Отдельно стоит сказать, что Daniel Eriksen прекрасный слайд гитарист, уже не первый
    год гастролирующий по обе стороны океана, изучавший игру таких мастеров слайда,
    как Blind Willie Johnson и Mississippi Fred McDowell, и учившийся у современников
    - Roy Rogers, Bob Brozman и John Mooney. При этом звучит он очень естественно
    и разнообразно. Один из лучших альбомов этой стилистики за последнее время.


    Послушать можно тут http://vk.com/wall-13370755_3467'
