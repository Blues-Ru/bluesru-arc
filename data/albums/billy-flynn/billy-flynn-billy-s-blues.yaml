  date: '2014-08-11'
  text: 'Начинал в группе Jimmy Dawkins и с тех пор записывался и играл со многими: Bryan Lee, Little Smokey Smothers, Mark
    Hummel, Willie Kent, Snooky Pryor, Big Bill Morganfield, John Brim, Jody Williams, Little Arthur Duncan, Deitra Farr,
    Billy Boy Arnold, Sunnyland Slim, Legendary Blues Band. Один из основателей Mississippi Heat. Принимал участие в создании
    саундтрека к "Cadillac Records" (2008)


    На записи Билли мастерски играет на слайд гитаре, а также губной гармонике. Традиционное чикагское звучание, но исключительно
    авторские композиции. А большой опыт классической школы блюза и понимание основ, придают собственному репертуару достойное
    звучание. В двух вещах на фортепиано играет Aaron Moore.


    Послушать можно тут https://vk.com/wall-13370755_3215'
