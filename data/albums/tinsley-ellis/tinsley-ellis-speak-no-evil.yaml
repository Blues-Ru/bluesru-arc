- id: 2077
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2012-08-15'
  text: 'ООчередной мощный альбом от виртуоза блюз-рокера выпущен на фирме Аллигатор. На этот раз все треки написаны самим
    Эллисом и сыграны в присущей ему манере тяжелого иногда слегка прифанкованного блюз-рока. Тинсли одинаково хорошо играет
    и на электрогитарах, и на слайде, и на акустике. Сопровождающую его ритм-секцию на половине треков дополняют приглашенные
    клавишники, придавая музыке дополнительные краски. Продюсировал диск сам музыкант, исполнительный продюсер - Брюс Иглауэр.


    Музыка Тинсли Эллиса как разогнавшийся тяжелый грузовик - такая же мощная, напористая и энергичная. Хороший техничный
    и ровный диск, хоть и без особых откровений. Пожалуй, получше предыдущего (Moment of Truth 2007).


    Третье место в топе блюзовых альбомов Биллборда.


    "Powerful, spine-tingling guitar and gritty, soulful vocals... and inspired and passionate fusion of blues and Southern
    rock." - Relix


    Tinsley Ellis always digs deep and plays, as Guitar Player says, "...as if his life depended on it."'
