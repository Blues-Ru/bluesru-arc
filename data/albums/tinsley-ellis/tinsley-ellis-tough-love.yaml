- id: 2190
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2015-02-12'
  text: 'Это уже 18-й альбом знаменитого блюз-рокера из Атланты, который 15 декабря 2014 года был включен в нью-йоркский зал
    славы блюза.


    В отличие от его предыдущего сольника, который мне как-то не очень показался, этот диск оставил очень хорошее впечатление.
    Тинсли выступил не только как автор всех 10 песен (хотя Everything - ну практически 100-процентный Джон Мэйолл!), но и
    как продюсер, да и диск вышел на его собственном лейбле Heartfixer Music. Стилистически диск очень разноплановый - тут
    современный блюз различных направлений, но чувствуется, если угодно, определенная коммерческая просчитанность (в хорошем
    смысле этого слова) - звучание слегка "прилизано". Возможно, чуть более сырой звук был бы интереснее, но это уже дело
    личных предпочтений. Бесспорно одно - в музыкальном и исполнительском плане работа очень сильная, и Эллис как гитарист
    и слайдер показал себя во всей красе. Проходных вещей практически нет. Правда, с вокалом дела обстоят похуже - Эллис уже
    не молод, и голос заметно подсел. Да и прежней мощной энергетики как-то поубавилось - получилась слегка расслабленная
    работа убеленного сединами мастера (в отличие, скажем, от взрывной энергетики последних работ Бадди Гая, который еще и
    постарше Эллиса будет). Изюминка альбома находится в самом конце - In From The Cold с клавишами а-ля No Quarter LZ, также
    отмечу мрачную The King Must Die и "открывашку" Seven Years. All in the Name of Love украшена подключением духовой секции,
    которая, увы, присутствует только на этом треке.


    Подводя итог: "пятерка" за виртуозное исполнение, "четверка" за звучание и скромная "троечка" за вокал (который по сути
    в блюзе не столь критичен). Вердикт: очень приличная работа, одна из лучших у Эллиса, но до моего любимого его диска Storm
    Warning слегка недотягивает.'
