- id: 253
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: 'В конце прошлого года Tinsley Ellis пополнил ряды и без того уже неслабой
    блюзовой команды, связавшей себя контрактами с лейблом Telarc. Теперь на этой
    фирме записываются столь известные блюзмены, как Ronnie Earl, Tab Benoit, Charlie
    Musselwhite, Kenny Neal и другие. Кстати, последним "приобретением" Telarc стал
    гитарист Jimmy Thackery со всей своей группой The Drivers.


    Любопытно, что многие из них стали известны, когда выпускали свои альбомы на чисто
    блюзовом лейбле Alligator. К их числу, бесспорно, относится и сам Ellis, ведь
    свой лучший альбом "Storm Warning" он записал как раз в годы сотрудничества с
    Alligator Records. Судя по всему, за прошедшие с того времени годы блюзовая мода
    несколько изменилась. Блюзменам, исполнявшим весьма агрессивный и жесткий гитарный
    блюз, пришлось стать помягче. Именно это и произошло с Tinsley Ellis. Ряд произведений
    с его нового альбома вполне могут звучать в эфире обычных радиостанций, которые
    крутят песни в исполнении Gary Moore, Chris Rea и Tony Joe White. Особенно это
    касается блюзов "Mystery To Me" и "Real Bad Way". Интересно, что добиться нового
    звучания Tinsley Ellis помог Eddy Offord, человек весьма известный в музыкальных
    кругах. Давным-давно он продюсировал записи Emerson, Lake & Palmer и Yes, а в
    96-м году вместе с Ellis создавал вышеупомянутый "Storm Warning".'
- id: 2081
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2012-08-15'
  text: 'Первый альбом Тинсли Эллиса на фирме Теларк. Смена звукозаписывающего лейбла
    не оказала существенного влияния на музыкальный стиль: Тинсли по-прежнему играет
    тяжелый блюз-рок, временами с примесью фанка, хотя на данном альбоме музыка стала
    чуть помягче. При этом альбом довольно разнообразный - от акустики и блюзовых
    баллад до тяжелого рока. Первая и последняя композиции слегка выбиваются из общей
    музыкальной структуры альбома, но в целом пластинка вполне приличная. Материал
    полностью авторский. Продюсировал знаменитый Эдди Офорд, который также выступил
    в качестве звукоинженера и занимался микшированием альбома.


    Альбом занял 14 место в блюзовом топе Биллборда'
