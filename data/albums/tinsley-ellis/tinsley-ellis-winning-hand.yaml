  date: '2018-02-26'
  text: '"Fiery controlled intensity...soulful, gritty, hard-edged blues rock" -Living Blues


    Тридцать лет назад в уже далеком 1988 на лейбле Аллигатор вышел дебютный сольник Тинсли Эллиса Georgia Blue, после чего
    гитарист выпустил целый ряд альбомов на этой фирме, перейдя затем уже в 21 веке на собственный лейбл Heartfixer Music.
    Однако свой шестнадцатый сольный альбом Winning Hand блюз-рокер из Атланты выпустил вновь на проверенном Аллигаторе. Уж
    не знаю, в чем причина - в смене лейбла или просто время пришло, но альбом у Эллиса получился отменный.


    Этим диском один из лучших современных блюзовых гитаристов Америки не открыл - тут его мощный гитарный блюз-рок присутствует
    во всей красе, и техника игры на самом высшем уровне. Однако стоило только музыканту сделать свою музыку более мелодичной,
    добавив в нее щепотку коммерческого соул, и она заискрилась новыми красками и зазвучала. Лучше всего Тинсли удались мощные
    среднетемповые и медленные блюзы. Эллис сам написал весь материал, за исключением кавера песни Dixie Lullaby Леона Рассела
    и Криса Стейнтона (включение этого трека в альбом скорее дань уважения ушедшему от нас Расселу, без него альбом бы хуже
    не стал). Продюсировали сам Эллис и его клавишник Кевин МакКендри, который также занимался записью и микшированием альбома.


    Диск заслуженно добрался до высшей позиции в блюзовом чарте Биллборда.'
