- id: 242
  author: Михаил Иконников
  mark: null
  date: '2003-10-25'
  text: В свое время, когда Tinsley Ellis еще записывался на Alligator, меня не покидало
    чувство, что гитаристу не совсем подходит этот лейбл. На мой взгляд, Ellis, играющий
    жесткий белый блюз, был, так сказать, белой вороной среди "аллигаторовских" музыкантов.
    Трудно сказать, что думали по данному поводу сам гитарист и его менеджер, но в
    конце концов Ellis расстался с Alligator. Пошло ли это гитаристу на пользу? Возможно.
    Его дебютный альбом на Capricorn явно более коммерческий, чем "аллигаторовские"
    работы. Такое впечатление, будто с Ellis позанимался хороший стилист. Нисколько
    не сомневаюсь, что на кармане музыканта это отразится положительно, а вот часть
    поклонников он, видимо, потеряет. Уж больно много на этой пластинке заимствований,
    которые не могут не раздражать подлинных любителей блюза. Так, на "I've Got To
    Use My Imagination" Ellis по манере исполнения сильно смахивает на Tony Joe White.
    Баллада "I'll Be Loving You" вообще могла бы стать хитом, если бы ее записал Gary
    Moore или Eric Clapton. Ну а следующую за ней "The Other Side Of Town" я бы предложил
    исполнить, например, Joe Cocker. Впрочем, все вышесказанное ни в коей мере не
    умаляет достоинств альбома как такового. Будем считать, что Ellis просто повзрослел
    и начал зарабатывать деньги на спокойную старость.
- id: 2080
  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2012-08-15'
  text: Свой восьмой сольный альбом Тинсли Эллис записал не на уже привычном Аллигаторе,
    и не Теларке (как следующие два диска), а на Capricorn (в чем причина, мне неизвестно).
    Продюсер тоже необычный - David Z, который слегка осовременил звучание альбома,
    добавив модных электронных примочек и даже пригласив ряд гостей для записи (включая
    гитаристов!!!!). В результате получился более коммерческий альбом, не слишком
    характерный для Эллиса. Да, его характерная гитара присутствует, но звучание все-таки
    какое-то слегка выхолощенное, нет той традиционной мощи и искренности, а также
    блюзового драйва, характерного для его работ на Аллигаторе. В принципе, пластинка
    неплохая, но все же уступает и предшествующим, и следующим работам гитариста.
    В общем, диск для любителей коммерческого блюз-рока. Радует то, что больше таких
    экспериментов Тинсли уже не проводил :-)
