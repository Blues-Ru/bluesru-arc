- id: 1456
  author: Андрей Евдокимов
  mark: 6
  date: '2009-02-05'
  text: За 20 лет, прошедшие после выпуска дебютного альбома, Тинсли Эллис впервые выпускает концертную запись. Не было сомнений,
    что это будет качественный блюз-рок. Но никто не знал, что Эллис – так пламенно увлекается в импровизации! Его студийные
    альбомы представляют очень уравновешенного гитариста, обладающего хорошей эрудицией и сдержанного в эмоциях. Но в небольшом
    чикагском клубе он весь отдается импровизации – такого пылкого и свободного блюз-рока вы не слышали с лучших времен "Братьев
    Оллман". Концерт записан в пригородном чикагском клубе, и горячая поддержка аудитории создает нужную блюзовую атмосферу.
