- id: 1361
  author: Константин Колесниченко
  mark: 7
  date: '2008-11-05'
  text: Каталог фирмы "Аллигатор" можно условно разделить на три части – классический чикагский блюз, современный блюз (тут
    все от West-Coast свинга до ритм-н-блюза) и блюз-рок. Тинсли из последней категории. Начиная слушать альбомы подобных
    музыкантов, я частенько ожидаю от них или медленных душераздирающих псевдоблюзов в стиле Гарри Мура, или бесконечных гитарных
    соло. На альбоме Тинсли Эллиса нет ни того, ни другого – это довольно мрачная и минорная музыка, уходящая своими корнями
    к Cream и Jimi Hendrix. Тинсли Эллис слабый вокалист, но конечно же незаурядный гитарист, но благо его музыкальные фразы
    довольно лаконичны и хорошо вписываются в блюзовую квадратуру. Самое сильное место на диске – это "Tell the truth", развивающая
    концепцию альбома, заданную в его названии. Тут появляется беквокалистка, барабанщик переключается на перкуссию, меняя
    общий довольно жесткий настрой альбома.
- id: 2082
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2012-08-15'
  text: '"Dazzling musicianship...exhilarating rock and blues passion...his guitar steps front and center, crying and singing
    a raucous blues" " - LOS ANGELES TIMES


    "A Southern blues-rocker with monstrous guitar chops...feral, incendiary and fiery" - GUITAR ONE


    Очередной релиз Эллиса - и вновь на фирме Аллигатор. Продюсировал сам Тинсли, а в качестве исполнительного продюсера -
    босс лейбла Аллигатор Брюс Иглауэр. За исключением двух каверов материал авторский. Пластинка очень хороша - правда, чуть
    меньше блюза, чем обычно, и чуть больше рока, но от этого альбом хуже не стал. Многие считают эту работу лучшей за всю
    карьеру Эллиса. На мой взгляд, она все же чуть не дотягивает до Storm Warning, которую я нахваливал раньше. Тем не менее
    5 место в блюзовых чартах Биллборда и восторженные отзывы поклонников.'
