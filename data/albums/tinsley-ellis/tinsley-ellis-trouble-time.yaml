  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2012-08-15'
  text: 'Гитарист/вокалист и композитор Тинсли Эллис, играющий тяжелый блюз-рок, выпускает
    пластинки с 1988 года, и преимущественно на фирме Аллигатор рекордс.


    Легенда гласит, что решение стать блюзмэном он принял в 14-летнем возрасте на
    концерте B.B. KING''а: Король блюза порвал струну и сменил ее, не останавливая
    песню и не теряя ритм; эту струну B.B. KING передал подростку в первом ряду -
    им и был Тинсли Эллис, который до сих пор хранит ее как свой блюзовый талисман...


    Тинсли Эллиса критики ставят в один ряд со Стиви Рэем и Джонни Уинтером, и он
    заслужил это место по праву.


    Trouble Time - это четвертый альбом Еллиса, записанный на фирме Аллигатор. Первый
    трек - Highwayman - был востребован на рок радиостанциях, что обеспечило дополнительную
    популярность всему альбому. В целом - добротная работа, мощный утяжеленный блюз-рок.
    Однако настоящим прорывом и, если угодно, шедевром тяжелого блюз-рока, стал его
    следующий сольник - Storm Warning.'
