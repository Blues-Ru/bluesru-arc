  author: Сергей Исправников
  mark: 9
  date: '2009-11-03'
  text: 'На диске издан концерт Евгения Маргулиса с "Kremlin Orchestra", состоявшийся 16 ноября 2007 г. в московском киноцентре
    "Мир" на Цветном бульваре. Это выступление было презентацией последнего сольного диска Маргулиса "Продолжение следует"
    (2007 г.), кроме того там были сыграны хиты двух его предыдущих альбомов "7+1" (1998 г.) и "Евгений Маргулис" (2001 г.).
    Несмотря на наличие на сцене камерного оркестра, концерт оказался очень неформальным, наполненным теплой домашней атмосферой,
    мягким юмором и самоиронией. При монтаже были оставлены все разговоры и реплики музыкантов, что придало диску характер
    раскованности и непринужденности, создавая у зрителя полный эффект присутствия. В бэнд Маргулиса входили уже ранее игравшие
    с Евгением гитарист Михаил Клягин (ex-"Лицей", "Кукуруза"), исполнитель на губной гармонике Михаил Владимиров, а также
    нынешний клавишник группы "Машина Времени" Андрей Державин (ex-"Сталкер") и ударник Евгений Лепендин. С "Kremlin Orchestra"
    Маргулис впервые играл в 2004 г., когда этот состав исполнил несколько концертов с "Машиной времени". Оркестр был основан
    в 1991 г. дирижером Мишей Рахлевским, в 1973 г. эмигрировавшим из СССР и плодотворно работавшим все эти годы в США и Европе.
    В настоящее время "Kremlin Orchestra" имеет международное признание, активно гастролирует и записал около двух десятков
    компакт-дисков. Маргулис привлек Рахлевского к работе над своим альбомом "Продолжение следует", записав уникальное для
    отечественной музыки сочетание блюз-рока с классикой.


    Данный концерт условно делится на три части: в начале и конце в оркестровых аранжировках играется материал альбома "Продолжение
    следует", а в середине Маргулис со своей группой играют акустический блюз-рок. Что касается оркестровой части, то она
    отсылает к довоенному городскому блюзу и джазу 30-х гг., в основном, это нежные лирические баллады, исполненные с легкой
    долей грусти и ностальгии. Среди них стоит отдельно отметить украшенные роскошными гитарными соло Клягина "Не плачь обо
    мне" (песня первоначально была записана с "Машиной времени", полученный вариант не удовлетворил Маргулиса и он его стер),
    "Джаз" (любимая вещь Рахлевского), "МэриДжейниМэриЭнн" (дебютная песня альбома, одна из лучших вещей Маргулиса за последние
    годы), "Ангел" (сначала вошла в альбом "Машины времени", здесь – в кардинально переработанном варианте). Из блюзовой части
    концерта нельзя не отметить драйвовый "Соль-мажор", акустические "40 лет" (исполнение было посвящено присутствовавшему
    на концерте Сергею Галанину, отмечавшему свой день рождения), сыгранный слайдом в стиле Дельты Миссисипи "Блюз о безусловном
    вреде пьянства" (одна из первых вещей Маргулиса), украшенную партией клавишных в исполнении Андрея Державина "Подругу
    № 5". Интересное сочетание классического блюза с оркестровым сопровождением представляет собой дебютный инструментал "Блюз
    для Анны" с проникновенным соло на губной гармонике Михаила Владимирова (вещь была написана как посвящение супруге Маргулиса).
    Излишне говорить о присутствии на концерте хитов всех времен и народов "Шанхай-блюз" и "Мой друг лучше всех играет блюз"
    (последний "Kremlin Orchestra" сыграл с редким драйвом, обычно не свойственным симфоническим музыкантам). Завершают программу
    сыгранные на бис в две гитары с Клягиным наполненные щемящей грустью "Письма", в честь которых назван весь диск. Применение
    при записи и подготовке к изданию диска новейших технологий обработки аудио- и видеосигналов позволили донести до зрителей
    аутентичную концертную атмосферу присутствия на сцене, создав уникальный продукт, в настоящее время не имеющий аналогов
    ни на российском, ни на мировом рынке. Здесь тот редкий случай, когда запись концерта сама по себе превратилась в произведение
    искусства.'
