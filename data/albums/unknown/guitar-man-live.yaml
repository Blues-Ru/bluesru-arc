  author: Андрей Евдокимов
  mark: 6
  date: '2009-02-05'
  text: '"Гитарист на концерте" - в столь прямолинейном названии декларируется простой подход к игре. А за декларацией кроется
    блюз взрывной, сверкающий энергичными и напористыми гитарными соло, подсвеченными плавным звучанием электрооргана "Хэммонд
    Би-3", с великолепным увлекательным ритмом!.. И голос – шершавый, как наждак. Это блюз, который жив именно на концертах.
    Удивительный сплав техасского и луизианского блюза, получившийся энергичным и мужественным. Выбор большинства песен небанален,
    хотя всего три – собственного сочинения. Венчает концерт 11-минутная мрачная интерпретация классической "Tin Pan Alley",
    сыгранная совсем иначе, чем у Стиви Рея Воэна. Записано на одном из прошлогодних европейских блюз-фестивалей. Как и многие
    его блюзовые предшественники, Шерман Робертсон находит больше слушателей по эту сторону Атлантики'
