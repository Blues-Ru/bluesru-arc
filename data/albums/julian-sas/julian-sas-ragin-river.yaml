- id: 1708
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-05-19'
  text: 'В 13 лет Джулиан Сас услышал альбом Джими Хэндрикса Are You Experienced, и с тех пор он полюбил блюз. Коллекция грампластинок
    одного из друзей его отца открыла юному Джулиану множество других блюзовых имен. В дальнейшем он освоил гитару и стал
    одним из наиболее заметных исполнителей блюз-рока не только в родной Голландии, но и в Европе.


    Альбом 2002 года содержит практически полностью авторский материал, а в качестве бонус треков на него добавлено акустическое
    концертное исполнение пяти композиций классиков блюза. Стилистически музыка представляет собой энергичный блюз-рок в составе
    power-trio (ударные - Пьер де Хаард, бас-гитара - Тенни Тахамата), все гитарные и вокальные партии исполнил сам Джулиан.
    Сыграно технично, громко, но слегка бездушно. Диск для любителей блюз-рока, отдающих предпочтение гитарной технике.'
