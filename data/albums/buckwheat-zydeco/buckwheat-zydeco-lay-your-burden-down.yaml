- id: 1535
  author: Андрей Евдокимов
  mark: 8
  date: '2009-05-18'
  text: 'Тридцатилетие своей творческой деятельности луизианец Бакуит Зайдекоу отмечает альбомом, выпущенным знаменитым чикагским
    лейблом (на котором записывал свои последние альбомы и был удостоен Грэмми король зайдекоу Клифтон Шеньер, и на котором
    возмужал талант его наследника Си-Джея Шеньера). У Бакуита смесь легкого зайдекоу с тяжелым чикагским саундом производит
    странное впечатление с первого же трека, написанного Мемфис Минни и прославленного "Лед Зепплин": When the Levee Breaks
    ("Когда прорвет плотину") - расцветает в финале, когда заиграет аккордеон под треск стиральной доски. Лучезарный легкий
    ту-степ Back in Your Arms ("Снова в твоих объятиях"), приплясывающий на синкопах, сыгранный так, как его автор Брюс Спрингстин
    и не подозревал, что это возможно, оправдывает весь альбом. Однако усталость опыта ощущается слишком часто. Альбом хорош
    для внимательного слушателя – луизианский свинг во всей красе, мастерство в каждой детали! А вот энергетики и обаяния
    не хватает. А финальный инструментальный трек – Finding My Way Back Home ("Обретая путь думой") – это красиво и от души.
    Внесли свой вклад в альбом земляки-гитаристы: Sonny Landreth (первые два трека) и Warren Haynes (заглавная песня).'
