- id: 752
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-07-02'
  text: 'Первый из трех альбомов Стэнли Дюраля на Island Records. Помимо его обычного
    состава, на этом диске играют духовики из знаменитой Dirty Dozen Brass Band -
    это классно. Музыка со словами и без слов, на английском и французском языках.
    Зайдеко, кейджун, креольские и ритмн-н-блюзовые ритмы Луизианы, виртуозная игра.
    Стэнли и его аккордеон - это очень мощно и красиво одновременно. Диск назван по
    песне Боба Дилана "On A Night Like This" - она прекрасно вписывается в веселую
    и зажигательную концепцию этой пластинки.


    Очень симпатичный и хорошо записанный альбом; хочешь слушай, а хочешь танцуй и
    веселись.'
