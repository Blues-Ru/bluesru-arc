- id: 444
  author: Дмитрий Казанцев
  mark: 4
  date: '2004-02-02'
  text: Очень своеобразный блюз получается у Тони. Местами копия Криса Ри и Марка Нопфлера, а иногда он просто крадет пьесы
    типа Just The Two Of Us (у кого есть слух и знание аккордов, сразу найдет такой трек на этом альбоме). Надо отметить,
    что Тони отлично играет на своем Стратокастере, но что же у него с вокалом? Не "совок", конечно, но уже близко к тому.
    Это могло бы стать отличной вторичной попсой, но его вокал, мрачное настроение (почти все песни в миноре) и шероховатости
    в записи мешают этому. Испорченные кантри-блюз-поп-баллады, короче.
