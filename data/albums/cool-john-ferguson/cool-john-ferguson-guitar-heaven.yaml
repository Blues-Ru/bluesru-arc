  author: Александр Панин
  mark: 10
  date: '2005-05-21'
  text: 'Один из пяти величайших гитаристов мира по Тадж Махалу. Совершенно неизвестный широкому кругу представитель лейбла
    Music Maker (он часто записывается там с другими исполнителями). Играет невероятно здорово и абсолютно по-разному - на
    этом диске есть и блюз, и джаз, и фанк, и рок. Временами аж дух захватывает - настолько клевая (cool) похлебка (почти
    все вещи - инструменталы). Фергюсон - несомненный кандидат в открытия года.


    "Социальный" лейбл Music Maker занимается поддержкой старых блюзменов, многие из которых живут ныне в нищете. Ранее они
    выпускали дорогие болванки, но вот недавно их продукция появилась и в крупных магазинах, уже на штампованных дисках. Обратите
    внимание на этот лейбл.'
