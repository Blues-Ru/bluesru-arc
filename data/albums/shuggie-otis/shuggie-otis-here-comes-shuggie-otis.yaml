- id: 532
  author: Дмитрий Казанцев
  mark: 9
  date: '2005-04-02'
  text: 'Второй альбом этого замечательного вундеркинда. Тут ему всего 17 лет, но
    он "делает все". Соул, фанк, блюз, рок и "джимихендрикс" в одном флаконе. Его
    игра на гитаре - это море удовольствия! Особенно забавно он изображает игру его
    любимых блюзменов (и рассказывает об этом) - классно.


    Этот диск есть на КД в паре с другим его альбомом. Это супер-человек и музыкант;
    просто был очень скромен и записал мало своих дисков.'
