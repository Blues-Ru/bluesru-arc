  date: '2005-08-02'
  text: 'Гениальный микс соула, рока, фанка, блюза и психоделии. 18-летний Отис творит чудеса не только на гитаре, он также
    прекрасно поет, пишет и играет на различных инструментах.


    Это второй сольник Шагги, если не считать его диск в Элом Купером в 1968 году (когда ему было всего 15). Продюсер этого
    волшебства - его отец, легенда ритм-н-блюза Джонни Отис.


    Этот диск вышел на КД вот в таком виде в Австралии: http://www.amazon.co.uk/exec/obidos/ASIN/B0000CG8HY/qid=1122988372/sr=1-2/ref=sr_1_10_2/026-0229931-0202049'
