  author: Александр Панин
  mark: 10
  date: '2005-05-28'
  text: 'Этот великолепный диск был записан за два дня февраля 1999 года в канзасской
    Blue Heaven Studios (на снимке с разворота обложки видно, что это бывшая церковь).
    Ханибою уже 84 года, с ним играют Мэдисон Слим на губной гармошке и на нескольких
    треках Джимми Дилейн на второй гитаре (это тот самый Дилейн, который не так давно
    приезжал в Москву на очаковский блюзовый фестиваль). Вместе они выдают очень глубокий
    акустический блюз. Кажется, что время остановилось, и на дворе не конец двадцатого
    века, а его тридцатые годы, настолько все подлинно и по-старому. Все, кроме качества
    записи, конечно, здесь нет щелчков и шипения (лейбл Analogue Productions славится
    своим звуком).


    Среди 14 музыкальных треков (еще один - интервью) много каверов и традиционного
    корневого материала. Две композиции Чарли Паттона - High Water Everywhere и Pony
    Blues. Ханибой играл с Паттоном в 1931-м году, играет его песни и в 1999-м. Отличная
    версия Shake ''Em On Down. Catfish Blues, который в трактовке Ханибоя называется
    Bullfrog Blues. Хопкинсовская Bald Headed Woman. Неинтересных вещей вообще нет!
    Древний голос, отличный слайд, кратко подыгрывающая клевая гармошка – что еще
    нужно для полного счастья?'
