- id: 693
  author: Александр Панин
  mark: 10
  date: '2005-05-28'
  text: 'Почти все вещи этого диска записаны на концерте 1997 года, где вместе с Ханибоем играет Кэри Белл на губной гармошке.
    Как всегда, Эдвардс исполняет много древнего материала, на сей раз тут три изумительных слайдовых кавера Роберта Джонсона
    - Walkin'' Blues, Crossroads и Sweet Home Chicago. Catfish Blues и хопкинсовская Too Many Drivers. Ряд собственных вещей
    Ханибоя. Одну песню поет Кэри Белл.


    Кроме музыки (11 треков), на диске еще четыре "истории". Ханибой рассказывает о последних днях жизни Роберта Джонсона,
    о Роберте Найтхоуке, о Чикаго и Кэри Белле. Все это интересно, но без подстрочника, увы, детали не разобрать.


    Этот диск идет дополнением к одноименной автобиографии Эдвардса, выпущенной также в 1997 году. Жаль, что немногие древние
    блюзмены дожили до середины 90-х, когда производители опять серьезно заинтересовались корневой музыкой...'
