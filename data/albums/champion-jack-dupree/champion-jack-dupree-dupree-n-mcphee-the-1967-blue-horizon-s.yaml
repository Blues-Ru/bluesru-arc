- id: 1221
  author: Сергей Исправников
  mark: null
  date: '2008-02-28'
  text: 'На диске впервые в полном объеме изданы совместные записи "Чемпиона" Джека Дюпри и лидера британской блюз-роковой
    группы "Groundhogs", гитариста Тони МакФи, сделанные для лейбла Blue Horizon в 1967 г. Впервые Дюпри и Макфи встретились
    еще в мае 1964 г., когда "Groundhogs" аккомпанировали Дюпри в одном из клубов лондонского Уэст-Энда. Уже тогда знаменитый
    пианист отметил высокий исполнительский уровень англичан, заявив в одном из интервью, что "это лучшая группа, с которой
    я когда-либо выступал". Впоследствии МакФи принимал участие, как сессионный музыкант, в записи альбома Дюпри "From New
    Orleans To Chicago" 1966 г. Запись продюссировал работавший тогда на фирме Decca Майк Вернон. Дюпри и на этот раз лестно
    отозвался о МакФи, заметив, что "в его гитаре больше блюза, чем у парней из Штатов". Соответственно, когда Майк Вернон
    пригласил МакФи записаться вместе с Дюпри уже для своего собственного лейбла Blue Horizon, тот с радостью согласился.
    Необходимо отметить, что к этому времени первоначальный состав "Groundhogs" распался, поскольку МакФи категорически не
    хотел исполнять соул, в направлении которого стала дрейфовать группа. В это время он стал востребованным сессионным музыкантом
    для приезжавших на гастроли в Великобританию американских блюзменов. Однако лидерские амбиции взяли свое, и в 1968 г.
    он снова собирает "Groundhogs", чтобы исполнять собственную музыку.


    Что касается данных записей, то Майк Вернон принял решение записать дуэт двух "звезд", причем Дюпри только пел, а МакФи
    играл на акустической гитаре. Ни до, ни после Дюпри без собственного фортепьянного аккомпанемента не записывался, поэтому
    представленная на диске сессия носит действительно уникальный характер. Авторство всех композиций было указано совместно
    Дюпри и МакФи, хотя фактически записанные песни отсылают к раннему творчеству "Чемпиона". На диске звучит корневой блюз
    с виртуозным аккомпанементом слайд-гитары, в котором МакФи не было равных. Всего было записано 17 композиций, включая
    два гитарных инструментала МакФи, однако к настоящему времени один из них оказался утрачен. В то время лишь две вещи –
    "Get Your Head Happy" и "Easy Is The Way" – были изданы на сингле (Blue Horizon 1007, 1967 г.), а полностью запись представлена
    только сейчас. Как отметил сам МакФи в июне 2005 г. в аннотации к настоящему изданию: "Я очень горжусь тем, что мне выпало
    счастье быть знакомым и играть с таким теплым, щедрым и одаренным человеком, который, к счастью, оставил нам в записях
    много примеров своего таланта. Эти уникальные треки – часть данного наследия".'
- id: 1529
  author: Дмитрий Казанцев
  mark: 8
  date: '2009-04-24'
  text: 'Отец новоорлеанского блюза Джек Дюпри поет, а на акустической гитаре ему подыгрывает Тони МакФи - лидер британской
    группы Groundhogs.


    Странное дело - Чемпион не играет на пианино! А все равно отличный блюз получился! Прекрасная запись - по настроению и
    по качеству.'
