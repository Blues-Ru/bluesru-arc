  author: Сергей Исправников
  mark: null
  date: '2008-03-03'
  text: 'На диске переиздан первый из трех записанных "Чемпионом" Джеком Дюпри на лейбле Atlantic альбомов. Изданный в апреле
    1959 г. диск "Blues From The Gutter" был дебютной долгоиграющей пластинкой Дюпри и, по мнению многих любителей и исследователей
    блюза, оказался лучшей работой за всю его долгую карьеру в звукозаписи. Родившийся 4 июля 1910 г. в Новом Орлеане, Уильям
    Томас Дюпри к этому времени был признанным мастером фортепьянного блюза. Начав записываться еще в 1940 г. на "расовом"
    лейбле Okeh компании Columbia, Дюпри и после войны периодически выпускался на синглах различными небольшими фирмами грамзаписи,
    ориентированными на негритянский рынок. Во второй половине 50-х гг. его, наконец, заметила крупнейшая американская звукозаписывающая
    компания RCA Victor, для которой в 1957 г. он сделал ряд записей. Часть из них была издана ни синглах, однако в том же
    году контракт был расторгнут. Дюпри не растерялся и тут же перешел к основному конкуренту RCA на американском рынке –
    компании Atlantic, руководством которой и было принято решение записать его первый полноценный альбом.


    Диск был записан в Нью-Йорке 4 февраля 1958 г. с использованием лучшей аппаратуры того времени в hi-fi стерео. Продюссировал
    диск Jerry Wexler, вице-президент Atlantic и одна из знаковых фигур в американском звукозаписывающем бизнесе. С его именем
    связаны записи целого ряда этапных для R&B работ, в том числе дисков Рэя Чарльза, Соломона Берка и Ареты Франклин. Аккомпанирующий
    состав был подобран из звезд нью-йоркской джазовой сцены. В первую очередь, это альт-саксофонист Pete Brown, начинавший
    играть в джаз-бэнде Берни Робинсона еще в 1927 г. Партии гитары исполнил один из лучших сессионных нью-йоркских гитаристов
    того периода, Larry Dale, игравший с Дюпри на всех его синглах, изданных в 50-х компаниями группы RCA, из-за контрактных
    ограничений выступивший здесь под именем Ennis Lowery. Ритм-секцию составили басист Wendell Marshall, ранее игравший в
    оркестре Дюка Эллингтона, и ударник Willie Jones, сотрудничавший с такими легендами джаза, как Телониус Монк и Чарльз
    Мингус.


    На диске записаны десять авторских композиций Дюпри. Оправдывая название альбома "Blues From The Gutter" ("Блюз из трущоб"),
    Дюпри включил в него несколько песен, связанных не только с алкогольной, но и наркотической тематикой, в частности, "Can''t
    Kick The Habit" и "Junker''s Blues". Дело в том, что в период между двумя мировыми войнами употребление наркотиков значительно
    возросло, кокаин равно пользовался успехом как в декадентских салонах, так и в самых дешевых притонах, а марихуана вообще
    не была запрещена законом. Впрочем, Дюпри далек от воспевания сомнительных удовольствий наркотического кайфа, у него был
    взгляд человека не питающего иллюзий по поводу последствий употребления того же кокаина, что и нашло отражение в его творчестве.
    Сам Дюпри называл себя одним из последних "кабацких пианистов", играющим в такой манере буги и блюз. Фактически, данный
    диск как раз и решен в подобном ключе, отражая музыку Нового Орлеана, органично сочетающую в себе джазовое и блюзовое
    начало.'
