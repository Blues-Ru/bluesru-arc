  author: Сергей Исправников
  mark: null
  date: '2008-03-10'
  text: 'На диске представлены второй и третий альбомы "Чемпиона" Джека Дюпри, изданные
    на лейбле Atlantic в 1960 г. и 1961 г., соответственно. Оба из них были записаны
    за пределами Соединенных Штатов: первый в Великобритании, а второй в Дании. Дело
    в том, что повторно женившись в 1948 г., к 1959 г. Дюпри имел от этого брака пять
    детей. В США заработки от концертной деятельности не позволяли ему обеспечить
    семью, поэтому днем Дюпри приходилось работать еще и поваром в ресторане. Вместе
    с этим в Британии к этому времени начал проявляться интерес к блюзу, и хотя собственная
    блюзовая сцена находилась там еще в зачаточном состоянии, гастроли таких американских
    исполнителей, как Биг Билл Брунзи, Джош Уайт, Сонни Терри и Броуни Макги имели
    определенный успех. Дюпри впервые оказался на гастролях в Англии в 1959г. в рамках
    джазового шоу Гарольда Дэвидсона и был с восторгом встречен в университетских
    кругах. Тогда же он записывает альбом "Champion Jack''s Natural & Soulful Blues"
    в компании британских музыкантов – Alexis Korner (гитара) и Jack Fallon (бас).


    Алексис Корнер в это время еще не создал "Blues Incorporated", а периодически
    выступал со своим партнером – исполнителем на губной гармонике Сирилом Дейвисом
    либо в формате фолк-блюзового дуэта, либо в составе джаз-бэнда Криса Барбера.
    Jack Fallon был одним из лучших английских джазовых басистов послевоенной эпохи.
    Помимо работы с ведущими британскими джазовыми составами того времени, он был
    наиболее востребованным сессионным музыкантом для иностранных звезд, аккомпанируя
    таким легендам джаза, как Джанго Рейнхарт и Каунт Бэйси. Кроме того, он уже имел
    опыт работы с американскими блюзменами, приезжавшими на гастроли в Великобританию.
    Его мастерская игра стала органичным дополнением к фортепьяно Дюпри, придав диску
    элемент джазовой элитарности.


    На альбоме записано десять композиций: восемь самого Джека Дюпри, одна Лироя Карра
    и одна Алексиса Корнера. Лирой Карр был ведущим довоенным блюзовым пианистом,
    оказавшим большое влияние на формирование городского блюза как оригинального музыкального
    стиля. Карр был кумиром для многих пианистов, в том числе и для Дюпри, в ранних
    работах которого отчетливо прослеживается его влияние. Также на этом альбоме Дюпри
    отдает дань памяти другому выдающемуся довоенному блюзмену – Биг Биллу Брунзи,
    скончавшемуся от рака в 1958 г., исполнив собственную "Death of Big Bill Broonzy".
    В целом, диск является прекрасным образцом фортепьянного блюза, что касается текстов,
    то ряд из них носят социальный характер, отсылая к реалиям Юга США и бурной молодости
    самого Дюпри.


    Прием, оказанный Дюпри в Европе, столь разительно отличался от американского шоу-бизнеса
    тех лет с расовой сегрегацией и жульничеством промоутеров, что Джек не преминул
    воспользоваться подвернувшейся возможностью остаться там жить. Дюпри сначала поселился
    в Швейцарии, а через несколько лет перебрался в Великобританию (Галифакс, графство
    Йоркшир) и в очередной раз женился, на этот раз на англичанке. К себе на родину
    в США он не возвращался вплоть до начала 90-х гг.


    Последний альбом Дюпри на фирме Atlantic – "Champion Of The Blues" – был записан
    уже в Копенгагене 29 декабря 1959 г., причем сольно. Причиной тому, скорее всего,
    были не какие-то концептуальные соображения, а банальное отсутствие там адекватных
    сессионных музыкантов. Продюссировал диск Karl Emil Knudsenn, владелец лэйбла
    Storyville, с которым Дюпри продолжит сотрудничать в последующие годы. В интервью
    того периода Дюпри так охарактеризовал свое творчество: "Сочиняя блюз, я как будто
    пишу письмо. Ты идешь куда-то гулять и видишь какие-то вещи. И ты берешь их. Ты
    можешь взять вот из этого стакана, или из этой пепельницы – откуда угодно, и ты
    можешь сделать из этого блюз".


    На диск вошли двенадцать авторских композиций Дюпри, часть из которых отсылают
    к творчеству его предшественников – Биг Билла Брунзи ("I Had A Dream") и Little
    Brother Montgomery ("New Vicksburg Blues"). Как обычно у Дюпри, часть песен повествует
    о расовой сегрегации в Америке – законах Джима Кроу (принятых в конце XIX века
    и действовавших в ряде штатов США до 60-х гг. XX века нормативных актах, ограничивавших
    права черного населения), а часть посвящена алкогольной тематике. К последним
    относится "Snaps Drinking Woman", в которой Дюпри, не разобравшись в терминологии,
    назвал шнапсом национальный скандинавский крепкий алкогольный напиток – аквавит,
    крупнейшим производителем которого как раз и является Дания.


    Тогда же Дюпри так выразил свое отношение к блюзу, как к неотъемлемой части образа
    жизни американских негров: "Ты можешь приехать в любой мелкий городок и всю ночь
    ничего, кроме блюза, из музыкальных автоматов не услышишь. Это единственная вещь,
    которая приносит им облегчение. Это вещь специально для них, потому что там вообще
    нет счастливых людей. Из цветного населения никто на Юге не счастлив".'
