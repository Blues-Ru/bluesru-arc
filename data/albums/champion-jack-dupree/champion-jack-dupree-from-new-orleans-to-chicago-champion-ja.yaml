  author: Сергей Исправников
  mark: null
  date: '2008-03-23'
  text: 'В настоящем издании представлены оба альбома "Чемпиона" Джека Дюпри, записанные и изданные британским лейблом Decca
    во второй половине 60-х гг. Диски демонстрируют прекрасную творческую форму Дюпри и, пожалуй, являются лучшими работами
    в его британской дискографии. Продюссировал оба альбома Майк Вернон, что не могло не сказаться на качестве материала.
    Впервые Вернон записал Дюпри еще в 1964г., во время его второго британского тура после пятилетнего перерыва. Тогда увидел
    свет EP "London Special" c четырьмя композициями, исполненными Дюпри в сопровождении "Climax Jazz Band" Кейта Смита. Следующая
    возможность поработать с этим незаурядным пианистом из Нового Орлеана выпала Вернону только через восемнадцать месяцев.


    Альбом "From New Orleans To Chicago" был записан в Лондоне в феврале 1966г. на волне "британского блюзового бума". В записи
    приняли участие Keef Hartley (ударные) и Malcolm Pool (бас) из британской ритм-энд-блюзовой группы "Artwoods", лидер "Groundhogs"
    – гитарист Tony McPhee, исполнитель на стиральной доске Bill Short и не нуждающиеся в дополнительном представлении Eric
    Clapton (гитара) и John Mayall (губная гармоника). Таким образом, на альбоме была представлена практически вся элита британского
    блюза того времени. Что касается композиционного решения данного диска, то оно оказалось также довольно необычным – в
    основном, на альбоме были записаны кавер-версии, чего Дюпри практически никогда не делал. Альбом является своего рода
    музыкальным путешествием по городам, эпохам и музыкальным стилям: от исполненной на креольском диалекте традиционной "Ooh
    La-La", отсылающей к Новому Орлеану начала века, до классики послевоенного чикагского электрического блюза "Third Degree"
    Эдди Бойда.


    Альбом хорошо продавался в Великобритании и вызвал определенный интерес в США, где он был издан на лейбле London. Обозреватель
    "Blues Unlimited" отметил, что это наилучший диск Дюпри, записанный по эту сторону Атлантики. Авторитетный эксперт по
    блюзу Пол Оливер в своей заметке в "Jazz Monthly" похвалил игру аккомпанирующего состава, особенно выделив Тони МакФи,
    чье мастерство слайда особенно ярко проявилось в кантри-блюзовой "Down The Valley". В целом, альбом получился очень разнообразным.
    Здесь есть, как медленные блюзы, например, исполненный сольно "Poor Poor Me" – отчаянное обращение к Господу человека,
    над которым нависла зловещая тень Ку-клукс-клана, так и веселые танцевальные мелодии, та же "Shim-Sham-Shimmy", традиционный
    номер для музыкальных автоматов негритянских баров.


    Следующий альбом "Чемпиона" Дюпри на Decca – "Champion Jack Dupree & His Blues Band" – был записан Майком Верноном в Лондоне
    4-5 апреля 1967г. Концепция данного диска отличалась от предыдущего: здесь Вернон решил осуществить реюнион Джека Дюпри
    и гитариста Mickey Baker. Родившийся в 1925 г. в штате Теннеси, Бейкер с четырнадцати лет начал музыкальную карьеру. Он
    перебрался в Нью-Йорк, где работал джазовым гитаристом. Впоследствии, как сессионный музыкант, он играл в самых разнообразных
    стилях, включая мамбо, калипсо, ритм-энд-блюз. Бейкер был сессионным музыкантом у таких звезд, как Рей Чарльз и Джо Тернер,
    а также записывал сольные работы. В середине 50-х гг. он аккомпанировал Дюпри на записях для лейбла King. В 1961г. он
    перебрался жить во Францию, однако сразу же откликнулся на приглашение Майка Вернона и принял самое деятельное участие
    в записи данного альбома, не только как гитарист, но и как аранжировщик.


    В качестве басиста был приглашен Джон Болдуин, впоследствии известный в составе группы "Led Zeppelin" как Джон Пол Джонс.
    За ударной установкой сидел один из лучших джазовых барабанщиков Великобритании – Ronnie Verell, в 50-х гг. приобретший
    известность в Ted Heath Orchestra, а впоследствии активно выступавший как сессионный музыкант. Кроме того, на записи присутствовала
    и внушительная духовая секция из четырех исполнителей. На этот раз Майк Вернон хотел сделать именно авторский альбом Дюпри,
    причем три четверти композиций были записаны Дюпри впервые. Наряду с блюзами диск содержит много танцевальных номеров
    и, в целом, отражает веселую и праздничную атмосферу, характерную для новоорлеанской музыки. Альбом был хорошо встречен
    критикой по обе стороны Атлантики, однако руководство Decca не проявило интереса к дальнейшему сотрудничеству с Дюпри,
    чем не преминул воспользоваться Майк Вернон, вскоре выпустив новый альбом Дюпри на собственном лейбле Blue Horizon.'
