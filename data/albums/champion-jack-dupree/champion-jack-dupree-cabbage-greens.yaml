  text: На этом диске записи Дюпри 1940 и 1941 годов. Всего 16 треков аж на 44 минуты! Очень хороший блюз - пение и пианино
    на высоте. Вместе с ним тут Уилсон Суэйн на басу и (наверное - так и написано!) Тампа Рэд на гитаре! Все записи сделаны
    в Чикаго для фирмы OKeh (ОКей) - еще одно подразделение CBS, а позднее и Sony/Columbia.
