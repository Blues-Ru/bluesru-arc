  author: Дмитрий Казанцев
  mark: 8
  date: '2005-04-29'
  text: 'Хороший альбом Джэка. Записан в 1970 году в Лондоне. С Дюпри играют: Huey Flint - drums; Benny Gallagher - bass,
    Peter Curtley - guitar, Paul Rowan - harmonica. Очень радует тут наличие харпера и то, что альбом записан малым составом.
    Дюпри прекрасно поет и играет на пианино, создавая то серьезные, то шутливые образы в жанре блюза с новоорлеанским оттенком.
    Это один из самых интересных дисков Чемпиона; очень советую его любителям настоящего блюза.'
