- id: 1882
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-15'
  text: Это первый (и пока единственный) альбом, записанный Бобом на Blind Pig Records. На нем бывший гитарист Мадди Уотерса
    играет традиционный блюз в лучших традициях своего учителя. Имеется дуэт с сестрой Боба, которая подыгрывает ему на пианино,
    а также дуэт с сыном Мадди (который выступает под именем Big Bill Morganfield) на последнем треке. Пластинка очень традиционная
    - для любителей Чикагского блюза старой школы.
