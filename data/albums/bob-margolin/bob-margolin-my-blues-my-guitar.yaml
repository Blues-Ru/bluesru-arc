  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-15'
  text: Это четвертый сольник бывшего гитариста Мадди Уотерса Боба Марголина по прозвищу Steady Rollin' Bob Margolin, и его
    второй альбом для Аллигатор рекордз. Стилистически данный альбом похож на альбом 1997 года, который я рецензировал ранее
    - современно звучащий электрический блюз во всех его проявлениях (включая и акустику!) с опорой на традицию чикагской
    школы. Одна треть каверов, остальное - авторский материал. Помогали при записи Снуки Прайор, Марк Казанофф, Дэвид Максвелл
    и другие.
