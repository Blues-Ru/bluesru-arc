  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-15'
  text: 'Через 20 лет после смерти Мадди Уотерса Боб Марголин собрал своих коллег, с которыми он играл в группе Мадди (Кэри
    Белла, Пинетопа Перкинса и Уилли Смита), а также пригласил Хуберта Самлина (отыгравшего 25 лет с Хаулин Вулфом) и Тома
    "Муки" Брилла (игравшего и с Марголиным, и с Кэри Беллом). В результате получился абсолютно звездный состав мастеров чикагского
    блюза, который и записал данный альбом "вживую" (в процессе реального клубного концерта или в студии) в форме джема.


    На диске представлены преимущественно стандарты блюзовой классики, но есть и авторские композиции самого Боба, из которых
    выделяется написанная им по дороге на похороны еще одного великого блюзмена - Джимми Роджерса - версия Mean Old Chicago.
    При исполнении этой песни к группе присоединяется гитарист Джимми Д. Лэйн (сын Джимми Роджерса).


    Диск содержит 15 треков (67 минут ) традиционного блюза, исполненных с отменным мастерством и чувством спонтанности, характерной
    для живого джемового исполнения. При этом мастерство музыкантов настолько высоко, что по большинству треков и не скажешь,
    что данное их исполнение группой является фактически первым. А как Боб имитирует слайд-гитару Мадди!


    Одним словом, приятный диск - может быть, немного старомодно звучащий для 21 века, но ведь блюз и есть традиционная музыка,
    так что для многих это даже "плюс" :-)'
