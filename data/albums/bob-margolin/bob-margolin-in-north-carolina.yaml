  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-06-15'
  text: 'Последний на данный момент сольный альбом бывшего гитариста Мадди Уотерса он записал практически в одиночку с помощью
    наложений у себя дома и в ближайших студиях, а выпустил в качестве первого релиза на собственном лейбле Steady Rollin''
    Records (напомню, что сам гитарист получил в свое время прозвище Steady Rollin'' Bob Margolin).


    Тут Боб представил ту музыку, которую он любит играть дома в северной Каролине для своей семьи и домашних питомцев. Получился
    альбом традиционного блюза с большим стилистическим разнообразием, включая акустику, инструменталы и, конечно же, слайд
    номера. Есть треки с минимальным сопровождением, а есть и полноценно аранжированные композиции. Современные музыкальные
    технологии позволили Марголину записать диск именно таким, каким он хотел его видеть - своего рода расслабленный домашний
    блюз, включающий как каверы, так и собственные треки.'
