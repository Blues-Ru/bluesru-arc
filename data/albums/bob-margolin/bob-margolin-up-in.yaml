    Steady Rollin'' Боб Марголин - американский гитарист, певец и композитор, который
    целых семь лет (с 1973 по 1980) отыграл в группе Мадди Уотерса, начал сольную
    карьеру в 1980 году. Однако первая его пластинка вышла только девять лет спустя
    на небольшом лейбле, затем последовал второй альбом, и только в 1993 году, после
    подписания контракта с фирмой Аллигатор, его музыка стала доступна широким слоям
    любителей блюза. В своих сольных работах Боб является приверженцем традиционного
    блюза (что неудивительно после школы Мадди Уотерса), одновременно стараясь слегка
    раздвинуть его границы. Боб также в течение многих лет ведет колонку в журнале
    Blues Revue.


    На данном альбоме (третьем релизе Марголина для лейбла Аллигатор) 4 кавера, остальное
    - собственный материал Боба. Помогали ему и его группе при записи знаменитый Пинетоп
    Перкинс (фортепиано на 3 вещах), Дэвид Максвелл (фортепиано и орган), а также
    Каз Казанофф (саксофоны и аранжировки для духовых). Продюсировали диск Каз Казанофф
    и Боб Марголин, исполнительный продюсер - сам Брюс Иглауэр. Альбом разнообразный
    - тут есть и слайд, и акустика, и электричество; есть и джазовые куски, и фанк,
    и рол-н-ролл, и блюз-рок, и медленный блюз. Все очень качественно и профессионально
    - вот только недостает изюминки. Добротная работа, но без откровений.'
