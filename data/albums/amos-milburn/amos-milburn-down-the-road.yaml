- id: 51
  author: Алексей Калачев
  mark: 6
  date: '2002-12-17'
  text: Милберн – тоже классический пианист стиля буги-вуги. На альбоме 20 треков
    40-х годов, по которым можно проследить эволюцию, характерную для многих черных
    артистов того периода. Вначале буги, где левая рука на басовом регистре задавала
    тон стилю. Затем место левой руки занимает небольшой ансамбль (бас, ударные, рояль
    и т.д), а роль солирующего инструмента у правой руки постепенно отнимает саксофон.
    Фоно становится ОДНИМ ИЗ инструментов. Появляется джамп-блюз, главный музыкант
    которого - Луис Джордан. Первая десятка песен на нашем диске – буги, вторая –
    джамп.
