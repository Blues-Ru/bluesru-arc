- id: 1631
  author: Андрей Евдокимов
  mark: 7
  date: '2010-07-20'
  text: Звезда эпохи частных реактивных самолетов выпустил альбом после 17 летнего перерыва. Альбом записан в студии Джорджа
    Лукаса, что делает его пикантной сенсацией. В самом альбоме самое приятное, это точное соответствие сюрреалистической
    обложки с поп-рок-психоделическим содержанием. По репертуару это набор старинных блюзовых стандартов (разбавленный одной
    замечательной, но редко исполняемой песней Джимми Воэна). Сануд Миллера остался неизменным, так что ностальгирующим по
    "Абракадабре" тоже будет приятно. Он свое дело знает прекрасно, аранжировки и гитарная игра превосходны. Не надо забывать,
    что Миллер джемовал с блюзовыми титанами калибра Ти-Боун Уокера еще во времена своей нежной юности. Однако для блюза эта
    музыка слишком декоративна. Альбом энергичен и добродушен, но не послушав его, вы ничего не потеряется. Кстати, special
    edition включает дополнительно четыре песни.
- id: 1657
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-11'
  text: 'Через 17 лет после выпуска последнего сольника Стив Миллер записал новый альбом - альбом каверов блюзовых и поп-треков
    из шестидесятых, которые молодой Стив неоднократно играл в молодости в различных составах, а также ряд треков со столь
    любимого им альбома Джимми Воэна Strange Pleasure.


    В группе Стива играют профессионалы высокого класса. Данный альбом оказался последней работой безвременно скончавшегося
    от рака харпера Нортона Буффало. На паре треков на пару со Стивом солирует знаменитый Джо Сатриани.


    Если честно, я не очень понимаю, зачем стоило ждать 17 лет, чтобы записать подобный альбом, ну да Стиву виднее, он может
    позволить себе маленькую прихоть и в очередной раз попытаться подойти к черному материалу с белым блюз-роковым подходом.
    Насколько это хорошо, каждый решает сам. По мне так все вышло технично и профессионально, но как-то бездушевно и уж больно
    вторично.


    Для любителей подобных современных перепевок традиционной музыки 50-х и 60-х рекомендую послушать Билла Уаймана сотоварищи
    (Willie and the Poorboys и Rhythm Kings) - вот там есть и техника, и класс, и драйв!'
