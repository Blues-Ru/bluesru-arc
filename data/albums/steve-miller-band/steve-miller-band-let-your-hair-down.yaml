reviews:
- id: 1655
  author: Дмитрий Казанцев
  mark: 7
  date: '2011-04-17'
  text: 'И так, новый альбом Миллера. Он снова блюзовый, как и его предыдущий диск
    Bingo! На пластинке 10 песен, но есть издание с 4 бонусами. Тут много известных
    песен и блюзов: Snatch It Back And Hold It, I Got Love If You Want It, Just A
    Little Bit, Can''t Be Satisfied, Sweet Home Chicago, Love The Life I Live, When
    Things Go Wrong (It Hurts Me Too), I Ain''t Got You, etc.


    Хороший диск, но он лишь продолжение предыдущего. Жаль, что Стив не придумал ничего
    нового в плане концепции и звука. Ну дык он уже не молод - 68 лет.'
- id: 1658
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-11'
  text: 'Новый альбом Стива Миллера - это своего рода продолжение прошлогоднего альбома
    Bingo!, которым музыкант "вернулся в строй" после многолетнего молчания. Материал
    нового диска в основном был записан во время сессий к предыдущему альбому, включая
    последние работы безвременно ушедшего соратника Стива - харпера Нортона Буффало.


    Что же мы имеем в итоге? Очередную порцию блюзовых стандартов 60-х в изложении
    белого блюз-рокера с технологиями 21 века. Стив потратил достаточно времени, чтобы
    довести все треки до ума и отполировать звук. В принципе все то, что я писал про
    предыдущий альбом, в равной мере относится и к альбому 2011 года. Сыграно высокопрофессионально
    и красиво, но как-то бездушно, без того пресловутого feeling, которое делает блюз
    аутентичным. Для тех слушателей, которые подойдут к альбому с позиции любителей
    рок-музыки, он почти наверняка понравится (хотя переплюнуть ураганную версию Just
    a Little bit от Нодди Холдера сотоварищи вряд ли кому под силу), а вот для любителей
    блюза? Тем, кому хочется услышать настоящий современный блюз, рекомендую последний
    альбом Бадди Гая Living Proof. Впрочем, уверен, у нового диска Миллера найдется
    достаточно поклонников.'
