- id: 117
  author: Алексей Калачев
  mark: 8
  date: '2003-03-18'
  text: 'В прошедшем году диск под названием "8 рук на 88 клавишах" оказался среди трех самых востребованных альбомов по версии
    фэн-клуба программы "Блюзология": десятки людей слушают его благодаря любезности этого клуба на дисках и аудиокассетах
    на просторах бывшего Советского Союза. Вообще 2002 год, с моей точки зрения, прошел под знаком обостренного интереса к
    фортепьянному блюзу. Эрвин Хелфер является одним из участников проекта "8 рук…", то есть одним из героев этого мини-бума.
    Теперь вот его сольная пластинка. Если считать, и вполне обоснованно считать, фортепьянные буги "блюзовой фугой", мы имеем
    дело с действительно изящной, искрометной и тонко продуманной фугой. Но отнюдь не спонтанной, а прописанной по нотам и
    от этого не менее изумительной. Но буги – лишь часть инструментального диска Хелфера. На нем представлены и другие стили,
    иные темы. По-своему диск Эрвина Хелфера – нечто вроде фортепьянного букваря, границы которого иногда расширяются, перенося
    нас и на почву раннего джаза.'
