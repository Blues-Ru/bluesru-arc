  text: '"Stratocaster-fueled, fierce slash-and-burn guitar work...dramatic, smoldering Southern soul-rooted intensity. Montoya''s
    voice is as expressive as his guitar." -Washington Post


    "Montoya is a show-stopper...heartfelt singing and merciless guitar with a wicked icy burn. He swings like a jazz man
    and stings like the Iceman, Albert Collins. He is one of the truly gifted blues artists of his generation." -Living Blues


    Знаменитый блюзовый левша не выпускал нового студийного материала 7 лет (а если учесть тот факт, что альбом 2010 года
    для фирмы Ruf был, прямо скажем, не очень, то с момента последнего достойного студийника (Dirty Deal) прошло ровно 10
    лет). Случайно или нет, но на новом альбоме Коко вернулся на лейбл Аллигатор, для которого он записал свои лучшие работы
    с 2000 по 2007 гг. Хочу сразу сказать, что долгое ожидание оказалось оправданным - альбом у Монтойи получился достойный.


    Авторского материала немного - всего 2 трека написал сам маэстро в соавторстве с Дэйвом Стином, остальное - каверы (от
    Уоррена Хэйнса, Джона Хайатта, Ронни Эрла и других). Продюсировал знаменитый ударник Тони Браунагель (сотрудничал с Эриком
    Бердоном, Бонни Райатт и другими). Сопровождающий состав - профессионалы высочайшего класса, включая гостевое участие
    мастера-слайдера Ли Роя Парнелла. В музыкальном плане альбом разнообразный - тут и блюз, и рок, и фанк, и соул, Монтойя
    играет в лучших традициях - искусно, технично и напористо. Альбом хорошо записан (опять реверанс в адрес Браунагеля) -
    инструменты звучат ясно и четко. Наиболее интересные треки - Before the Bullets Fly, Devil Don''t Sleep, Hard As Hell
    и Truth Be Told.


    Достойная работа настоящего мастера, рекомендуется всем любителям качественного современного блюза.'
