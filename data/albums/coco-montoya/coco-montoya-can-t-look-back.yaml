  text: '"Stunning, powerhouse blues..searing tone, emotional soloing and energetic, unforced vocals" - GUITAR PLAYER


    "Blistering contemporary blues...piercing attack, funky, shivery guitar tones and aggressive, soulful vocals." - BLUES
    REVUE


    Пятый сольный альбом гитариста вышел на фирме Аллигатор с помощью продюсера Джима Гэйнса. Этот второй релиз Монтойи для
    лейбла Аллигатор оказался одним из наиболее успешных дисков музыканта. На диске энергичный блюз-рок Коко украшен эпизодическим
    подключением духовых и слегка разбавлен соул и даже мелодичным хард-роком, в результате чего получился вполне коммерческий
    вариант блюз-рока, одновременно сохраняющий мощный напор блюзового мастера. Примерно половина материала авторская, остальное
    - каверы, включая Same Old Thing от ментора Коко Альберта Коллинза. Хорошая работа, которую можно рекомендовать как любителям
    блюза, так и рока.


    Второе место в топе блюзовых альбомов Биллборда.'
