  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2011-05-18'
  text: 'Последняя работа знаменитого американского гитариста и первый сольный диск Монтойи, который оставил меня равнодушным
    - и после первого прослушивания, и после еще нескольких. Причина в том, что это не блюзовый альбом - здесь есть соул,
    есть поп, есть рок, и только потом блюз. В музыке Монтойи всегда присутствовала некоторая доля попсовости, была заметна
    соул составляющая, но она никогда не доминировала, оставаясь некоторой изюминкой. Данный альбом - это скорее коммерческий
    RnB, чем блюз. О былом сыром мощном блюз-роке, который когда-то был визитной карточкой Монтойи на пару с Уолтером Траутом
    в Блюзбрейкерах Джона Мэйолла очень отдаленно напоминает единственный трек авторства самого Коко - фанковый Dont Go Making
    Plans, все остальное - сладкая коммерция.


    Да, все сыграно профессионально, да, помогают при записи известные музыканты (Кеб Мо, Род Пиацца и др.), да, четвертое
    место в топе Биллборда, но нет, это не блюз.'
