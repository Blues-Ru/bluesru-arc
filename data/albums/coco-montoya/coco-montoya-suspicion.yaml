- id: 1698
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-18'
  text: 'Четвертый сольный альбом бывшего гитариста Альберта Коллинза и Джона Мэйолла
    получился более рОковым и жестким, чем предыдущие. Возможно, сказалась смена лейбла
    - на смену Блайнд Пиг пришел Аллигатор, а может, повлиял сравнительно длительный
    перерыв в записи альбомов (предыдущий был в 1997 году). В кресле продюсера - знаменитый
    Джим Гэйнс. К записи также приложил руки лидер Buddaheads Алан Мирикитани, написавший
    первый трек и выступавший в качестве инженера при записи первого и последнего
    треков. Альбом тяжелого мощного заводного блюз-рока, наполненный техничными соло,
    и включающий также пару более спокойных треков с примесью соул.


    Альбом занял десятое место в топе блюзовых альбомов Биллборда и быстро стал самым
    продаваемым из всех сольников Монтойи.'
