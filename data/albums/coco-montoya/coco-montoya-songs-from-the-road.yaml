  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2014-09-23'
  text: 'Coco Montoya - Songs From the Road - 2014


    Первый (на удивление!) за всю сольную карьеру (а ей уже более 15 лет!) концертник
    знаменитого левши - 14 треков на двух дисках, записанных во время концертов в
    Сиэттле. Концертное исполнение отличается от студийного почти вдвое большей длительностью,
    что не всегда оправданно. Кроме того, 5 из 14 треков взяты с последнего (на мой
    взгляд провального) сольного альбома 2010 года, что тоже не делает подборку оптимальной.
    Сам Монтойя отрабатывает очень прилично, а сопровождающий состав - среднестатистически.


    Диск для любителей концертных выступлений и поклонников большого Коко.'
