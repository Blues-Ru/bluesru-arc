  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2023-12-07'
  text: 'Writing on the Wall - десятый студийник знаменитого блюзового левши и его
    шестой диск для лейбла Alligator. Альбом вышел 1 сентября 2023 года через 4 года
    после предыдущего студийника Coming in Hot. Впервые за время его сотрудничества
    с лейблом Alligator Коко привлек к работе свою гастрольную группу (Джефф Пэрис
    на клавишных и гитарах, Нэйтан Браун на басу и Рина Биверс на ударных). Из 13
    треков альбома Монтойя написал пять (в соавторстве), Джефф Пэрис написал один
    трек, четыре сочинил старый партнер и соавтор Коко Дэйв Стин, да плюс три кавера
    (Лонни Мэка, Бобби Блэнда и Энди Фрейзера).


    Не обошлось и без именитых гостей: продюсирует альбом и играет на ударных на четырех
    треках знаменитый музыкант и продюсер Тони Браунагель, сын Лонни Брукса Ронни
    Бейкер Брукс записал гитару на двух треках ( "You Got Me (Where You Want Me и
    Baby, You''re A Drag), Ли Рой Парнелл исполнил партию слайда на A Chip And A Chair,
    да и Дэйв Стин не остался в стороне - отыграл на ритм-гитаре на A Chip And A Chair
    и The Three Kings and Me (посвящении трем королям блюза - Алберту Кингу, ББ Кингу
    и Фредди Кингу).


    Вот что говорит об альбоме Writing On The Wall сам Монтойя: "Я так горжусь этой
    работой. Мы записывали альбом в студии Джеффа Пэриса, и при этом все просто складывалось
    наилучшим образом. Группа меня вдохновляла - все музыканты каждый раз выкладывались
    по полной. Джефф, Нэйтан и Рина играли так хорошо, что заставили меня играть еще
    жестче. Они заставили меня играть даже выше моих возможностей!"


    Думаю, Коко тут не лукавит - альбом получился более жестким и блюз-роковым, чем
    обычно, характерная для творчества Монтойи соул-составляющая выражена менее заметно.
    Однако страсть, искренность и эмоциональность в музыке Коко по-прежнему присутствуют,
    он играет от всего сердца. О качестве и технике исполнения, думаю, и говорить
    незачем - мастер он и есть мастер, да и аккомпанирующие музыканты мирового класса.
    Современный гитарный блюз во всей красе и настоящий подарок для любителей классического
    эмоционального мелодичного блюза, добротная работа от большого мастера и Блюзмена
    с большой буквы.'
