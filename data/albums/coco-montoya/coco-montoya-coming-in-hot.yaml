  text: '"In a world of blues guitar pretenders, Coco Montoya is the real McCoy. He
    exudes power and authenticity. Be prepared to get scorched by the real thing."
    -Billboard


    "Montoya is a show-stopper...Heartfelt singing and merciless guitar with a wicked
    icy burn...he swings like a jazz man and stings like the Iceman, Albert Collins.
    He is one of the truly gifted blues artists of his generation." -Living Blues


    Свой очередной альбом (девятый по счету студийник) знаменитый блюзовый левша записал
    для лейбла Аллигатор рекордз, на котором два года назад выходил и его предшественник
    Hard Truth. На этом сходство между этими альбомами не заканчивается: в записи
    участвовали практически одни и те же высококлассные музыканты, а также один и
    тот же продюсер - знаменитый ударник Тони Браунагель (сотрудничал с Эриком Бердоном,
    Бонни Райатт и другими). Кроме того, альбом состоит преимущественно из каверов,
    а единственный авторский трек написан Коко Монтойей совместно с Дэйвом Стином
    (на Hard Truth авторских треков было два, и оба авторства Монтойя - Стин).


    В музыкальном плане альбом разнообразный - тут и блюз, и рок, и фанк, и соул.
    Монтойя играет в лучших традициях - мощно и технично, и поет в своей традиционной
    соул-манере. Альбом хорошо записан (опять реверанс в адрес Браунагеля) - инструменты
    звучат ясно и четко. Наиболее интересные треки - Lights Are On But Nobody''s Home
    из репертуара ментора Коко Алберта Коллинза, кавер Уоррена Хэйнса What Am I? и
    открывающий альбом прифанкованный блюз Good Man Gone.


    И хотя альбом сделан по образу и подобию удачного предшественника, результат -
    на мой взгляд - получился гораздо более скромным: диск бесспорно неплохой, но
    до уровня Hard Truth недотягивает.'
