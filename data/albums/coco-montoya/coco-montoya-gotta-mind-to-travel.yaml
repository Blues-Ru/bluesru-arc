  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-18'
  text: 'Дебютный альбом одного из ведущих блюзовых музыкантов современности, который
    оттачивал мастерство гитариста 5 лет в составе Альберта Коллинза и еще почти 10
    лет у Джона Мэйолла. Альбом вышел на студии Blind Pig records и содержал приблизительно
    половину авторского материала.


    В качестве гостей на диске отметились сам Альберт Коллинз (Talkin'' Woman Blues),
    Джон Мэйолл (Top of the Hill) и Дебби Дэвис (гитара и вокальный дуэт), на ударных
    - Джон Или из Блюзбрейкеров, местами также присутсвует духовая секция Texicali
    Horns. Вот что говорит сам Коко о своем дебютном диске: "Моя первая запись определенно
    записана в блюзовом ключе, но она также довольно разнообразна. Я не просто исполнитель
    традиционной музыки, и поэтому хотел показать различные оттенки и чувства в рамках
    блюза."


    Качественный диск современного блюза с легкой примесью соул, которым Монтойя "в
    полный рост" заявил о себе, как вполне сложившемся самостоятельном блюзмене. Диск
    принес музыканту целый ряд блюзовых номинаций и одну вполне заслуженную премию
    Хэнди лучшему молодому блюзовому исполнителю. Альбом посвящен памяти ушедшего
    из жизни учителя Монтойи - мастера телекастера Альберта Коллинза.'
