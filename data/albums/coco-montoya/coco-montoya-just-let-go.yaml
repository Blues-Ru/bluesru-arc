- id: 59
  author: Леонид Аускерн
  mark: null
  date: '2002-12-17'
  text: 'Свинья, как известно, довольно скверно разбирается в апельсинах. А вот "Слепая свинья" обладает прекрасным чутьем
    на добротное блюзовое звучание. Фирма из Сан-Франциско с таким забавным названием и соответствующим логотипом убедительно
    доказывает этот факт данным релизом.


    <p>Гитарист и певец Коко Монтойя — блюзмэн высокого класса, что подтверждается и хвалебными цитатами из блюзовых изданий
    на обложке CD. И достаточно опустить диск в "пасть" плэйера, чтобы убедиться в справедливости таких оценок. Гитарную технику
    Монтойи я бы назвал джазовой. Коко любит "покачать" звук, "повертеть" каждую ноту, как бы рассматривая ее с разных сторон,
    часто пускается он и в по-джазовому длинные импровизации.


    <p>В целом его альбом и не очень-то вписывается в чисто блюзовые рамки. Да, здесь есть классические блюзовые образцы,
    например, "Do What You Want To Do", но есть и энергичные номера в духе хард-рока, есть почти сантановского звучания "Sending
    Me Angels" (пожалуй, единственная вещь, где чувствуется латинское происхождение Монтойи), есть нежная инструментальна
    пьеса "Mother And Daughter". В тексте CD сделано специальное упоминание, что она посвящена конкретным, с перечислением
    имен, людям — женам и дочерям участвовавших в сессиях музыкантов. Жест, на мой взгляд, очень красивый и человечный.


    <p>Кстати, в сессиях работали две разные команды сайдмэнов, с каждой из которых Коко записал по полальбома. Оба состава
    сыграли в высшей степени профессионально, на фоне лидера выделять кого-то трудно.


    <p>Известно, что недостатки наши — продолжение наших достоинств. Виртуозность Монтойи привела, на мой взгляд, к некоторой
    эклектике, к отсутствию определенной концепции альбома. Впрочем, возможно такую задачу он перед собой и не ставил.'
- id: 1694
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-18'
  text: 'Третий сольный альбом Монтойи и последний, записанный на Blind Pig Records. В кресле продюсера - знаменитый Джим
    Гэйнс. В качестве специальных гостей - братья Кэйт и Шон Мерфи (Little Feat).


    Профессионально исполненный альбом современного блюза с изрядной долей блюз-рока и включением джаза и коммерческого соул,
    мощными виртуозными гитарными соло и медленными блюзами в стиле учителя Монтойи - Альберта Коллинза.'
