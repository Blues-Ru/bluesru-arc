- id: 1258
  author: Андрей Евдокимов
  mark: 7
  date: '2008-04-23'
  text: 'Самый твердой, самый мужественный альбом в его сольной дискографии. Пора
    бы, на 56-м году жизни! Тем более что у него хватило прозорливости добавить некоторую
    долю сентиментальности, повторив тот же прием, который сделал дамским любимчиком
    другого хард-блюз-рокера: Гэри Мура. Минусом для Монтойи в этом сравнении является
    то, что для своего альбома он сочинил всего две песни. Зато для каверов выбирает
    еще незаезженные песни. А исполняя песни британца Майка Андерсона или техасца
    Джонни Копленда, он явно бросает вызов самому знаменитому муровскому хиту Still
    Got The Blues. При довольно "тяжелом" общем звучании, он не забывает про проникновенный
    полушепот и мелодичные импровизации гитары. Но в целом Монтойа больше порадует
    не любителей эстрадного блюза, а именно почитателей блюза интенсивного, основанного
    на развернутой гитарной импровизации. Исполняя песни покойных классиков: Отиса
    Раша или Джонни Коплэнда – он верен блюзовой ритмике. Он страстен и порывист по-своему,
    но к их песням относится столь же пламенно, как относились сами авторы.


    <small><i>По заказу газеты "Ведомости"</small></i>'
- id: 1696
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-18'
  text: '"A feral, no-holds-barred blues-rock excursion...monstrous guitar sounds...smoldering
    blues and southern-fried rock ‘n'' roll with a master touch and killer soloing"
    - GUITAR ONE


    Коко Монтойя может служить примером еще одной блюзовой легенды: он был очарован
    блюзом на концерте Альберта Кинга, затем играл на барабанах (!) в группе Альберта
    Коллинза, пока сам "мастер телекастер" не научил его играть на гитаре. Серьезную
    стажировку прошел Коко в группе Джона Мэйолла, где в конце 80-х он играл одновременно
    с Уолтером Траутом. После ухода Траута Коко еще почти 4 года оставался гитаристом
    у Джона, после чего наконец решился начать сольную карьеру. Ну, Джону не привыкать
    - еще один талантливейший гитарист вышел из под его опеки и пошел по стопам Эрика
    Клэптона, Питера Грина, Мика Тэйлора, Уолтера Траута и др. Естественно, работа
    бок о бок с такими гигантами блюза не прошла даром для Монтойи - его сольное творчество
    заслуживает внимания всех любителей блюзовой гитары.


    По итогам выхода первых сольных альбомов в 1996 году он номинирован на Blues Music
    Awards в четырех номинациях и легко побеждает в номинации Best New Blues Artist.


    Альбом Dirty Deal вышел в 2007 году и добрался до 2 места в блюзовом хит-параде
    Биллборда. Коко в соавторстве с Дэйвом Стином написал два трека, остальное - каверы.
    Этот третий релиз Монтойи для лейбла Аллигатор продюсировали Пол Баррере (Little
    Feat) и Роджер Коул , исполнительный продюсер - Брюс Иглауэр. Работа добротная,
    хотя и не лишенная некоторых недостатков, которы отчасти окупаются блестящими
    соло, а за заглавную песню вообще можно простить все огрехи :-)'
