  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-18'
  text: 'Второй сольник знаменитого блюзового левши был записан по итогам осыпанного
    наградами дебютника - и вновь на Blind Pig records. Однако в этот раз Коко уже
    вышел в разряд блюзовых "тяжеловесов" - продюсировал альбом знаменитый Джим Гэйнс,
    а маститых гостей вообще не было (хотя отметились братья Кэйт), обошелся своими
    силами.


    Альбом состоит почти полностью из каверов, и в музыкальном отношении преимущественно
    тяжелее и жестче предшественника - больше блюз-рока, меньше соул. Диск добрался
    до 10 места в блюзовых чартах Биллборда, а также до 6 места в топе записей на
    независимых лейблах. Журнал Blues Review назвал Монтойю "современным блюзовым
    мастером", а журнал Guitar World поместил Коко "в передовые ряды современных блюзовых
    гитаристов".


    Диск качественный, разнообразный, и мастерски сыгранный. И если вокал Коко не
    всегда оказывается на высоте, то гитарная работа Монтойи превыше всяких похвал.'
