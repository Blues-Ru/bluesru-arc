reviews:
- id: 743
  author: Александр Панин
  mark: 8
  date: '2005-06-27'
  text: Новый диск канадского харпера кубинского происхождения имеет подзаголовок Some Recycled Blues And Other Somewhat Related
    Stuff (part 2), что несомненно является аллюзией на работу Тадж Махала начала семидесятых. Как и следовало ожидать, блюза
    в обычном понимании тут почти нет, с ним смешан ряд жанров типа латино и ска. Карлос неплохо играет на гармошке (остальные
    инструменталисты тоже хороши), но поет довольно невыразительно. Необычный и веселый диск.
- id: 1161
  author: Константин Колесниченко
  mark: 9
  date: '2007-11-27'
  text: Carlos Del Junco - яркий пример, того случая, когда виртуозность не ведет к музыкальному спорту, а просто открывает
    перед музыкантом новые возможности. Del Junco - мастер в игре на губной гармонике, революционной технике игры overblow
    он учился у ее изобретателя Говарда Леви. Но, к счастью, альбомы Карлоса не превратились в мастеркласс, и должны быть
    интересны рядовому слушателю, а не изучающему этот инструмент. Уровень Карлоса как музыканта растет с каждым альбомом,
    я сужу об этом исходя из прослушанных предыдущих его записей, развития техники игры на гармонике, и самое важное - Del
    Junco нашел идеальное место гармоники в ансамбле, ее роль в развитии композиции. Даже, если это длинный харп-инструментал,
    музыка группы сбалансирована, никто и ничто не выпирает. По музыке "Blues Mongrel" - интересная смесь блюза, джаза, рока
    и латиноамериканской музыки.Также особенно хочу отметить гитариста группы Kevin Breit.
- id: 1442
  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: 'Неуклюжие, тяжелые и грязноватые вступительные аккорды как и сжатая в зубах губная гармоника на обложке, вводят слушателя
    в заблуждение. На деле альбом очень легкий – головокружительной виртуозный по технике игры и абсолютно легкомысленный
    по настроению. "Блюзовый полукровка" вплетают в блюзовую канву латиноамерикаскую музыку всех видов: ска, мамба, боссонова.
    И потешный уличный марш из Нового Орлеана. Кроме ужасной фотографии на обложке, у альбома есть всего один недостаток:
    "Nine Below Zero", исполненный сольно как поклон Санни Бою Уилльямсону, получился вымученным. Для Дел Джанко ближе нежная
    манера звукоизвлечения Тутса Тилманса. И в легкой импровизации с приятным джазовым привкусом он великолепен. Инструментальные
    пьесы выразительны и образны. Трактовка классических блюзовых тем столь своеобразна, что, например, стандарт Литл Уолтера
    "Blues With A Feeling" можно узнать лишь по тексту. Канадец кубинского происхождения Карлос Дел Джанко утвердил себя одним
    из лучших мастеров губной гармоники на сегодня.'
