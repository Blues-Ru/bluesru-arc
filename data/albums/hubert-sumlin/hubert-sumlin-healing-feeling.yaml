- id: 997
  author: Александр Панин
  mark: 7
  date: '2006-05-03'
  text: Несмотря на то, что Хьюберт Самлин – отличный и очень уважаемый музыкант (бывший лид-гитарист Хаулин Вулфа, если кто
    вдруг забыл), с сольными альбомами ему не очень везет. И количеством их немного, и мариновали, как, например, <a href="http://www.allmusic.com/cg/amg.dll?p=amg&sql=10:tnouak8kam3c">последний</a>,
    по нескольку лет перед выпуском. Да и не всякий альбом задуман и сделан соответствующим образом. Вот взять этот, второй
    диск Самлина на лейбле Black Top, он похож на <a href="http://www.allmusic.com/cg/amg.dll?p=amg&sql=10:v1320rnac48x">выпущенный
    тремя годами ранее</a>, хотя из того сессионного состава остался лишь гитарист Ронни Эрл. Похож по общей атмосфере джема,
    в котором Хьюберт, на мой взгляд, частенько совсем растворяется. Адекватный это диск, несомненно, есть на нем и очень
    хорошие моменты, но абсолютно ничего он к портрету Самлина как музыканта, находящегося как бы в тени других, не добавляет.
    Как оказалось впоследствии, прорыва пришлось ждать еще восемь лет, пока не вышел великолепный альбом <a href="http://www.allmusic.com/cg/amg.dll?p=amg&sql=10:kf5gtq6zmu43">I
    Know You</a>.
