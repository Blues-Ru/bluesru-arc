- id: 1486
  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: 'В свои 73 года Хьюберт Самлин не утратил ни блюзового пыла, ни доброго чувства юмора, ни безупречного ритма. Размеренная
    неторопливая походка чикагского блюза движет все треки его нового альбома. Играет он на гитаре столь же яркими лаконичными
    фразами, порой парадоксальными, что отличали его стиль еще с 50-х, со времени начала его четвертьвекового содружества
    с Хаулин Вулфом, одним из величайших голосов в истории чикагского стиля. В нынешнем альбоме вокальные партии исполняет
    целый звездный хор, в котором сверкают и поп-персонажи: Эрик Клэптон и Кит Ричардс. Из товарищей по блюзовому цеху: Джеймс
    Коттон и Боб Марголин. Самлин поет лишь в финальной акустической This Is The End, Little Girl. Почти все песни – из репертуара
    Мадди Уотерса, и сыграны они с грубоватой простотой ранних записей родоначальника чикагского блюза.'
