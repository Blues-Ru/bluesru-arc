reviews:
- id: 980
  author: Дмитрий Щитов
  mark: 9
  date: '2006-04-04'
  text: Певица Odetta прежде всего известна любителям музыки как великолепная фольк
    исполнительница. В 50-60-е годы вокалистка, кумирами которой являются Bob Dylan
    и Bessie Smith, выпустила несколько альбомов фольк музыки с элементами блюза,
    джаза и госпелз. Odetta не любила большие аккомпанирующие составы и почти все
    свои работы она сделала используя гитару или фортепиано. Однако, развивая вокальные
    традиции ранних блюзовых певиц (Ida Cox, Ma Rainey, Bessie и Mamie Smith), она
    выпустила ряд крепких блюзовых пластинок. После многочисленных концертных альбомов
    конца 50-ых Odetta в 1962 году в сопровождении 6 сильных джазовых музыкантов записала
    альбом, состоящий из традиционных ранних блюзов. Сыгранный без каких либо изысков
    альбом поражает в первую очередь мощным оригинальным вокалом певицы. Складывается
    впечатление, что исполнительница проигнорировала женскую вокальную школу 40-50-ых
    годов и решила донести до нас дух родоначальниц блюза 20-30-ых годов. Стоит также
    обратить внимание на интеллигентную манеру исполнения трубача Buck Clayton и тромбониста
    Vic Dickenson, аккомпанировавшего еще великой певице Mamie Smith. Надолго выпав
    из музыкальной тусовки, Odetta вернулась в 1999 году с бесподобным диском Blues
    everywhere I go, получила кучу блюзовых наград и была награждена Биллом Клинтоном
    медалью за творческие заслуги.
