  author: Андрей Евдокимов
  mark: 7
  date: '2005-04-11'
  text: 'Альбом записан в составе пауэр-трио: гитара, бас, ударные. Носит прямолинейное
    название. Но музыка Скотта Хендерсона, даже базируясь на блюзовой основе, не может
    быть простой и ясной. Пресловутый электрогитарный "запил" он действительно поднимает
    до высот подлинного музыкального искусства в стиле джаз-фьюжин: кроме пламенной
    гитарной импровизации здесь есть и хитроумная игра гармоний и ритма. Не случайно
    с ним сотрудничали такие асы джазовых головоломок, как Чика Кория, Жан Люк Понти
    и Джо Завинул. Собственные студийные достижения Хендерсона давно уже считаются
    выше всякой критики, теперь он впервые предъявляет в записи свои концертных достижения.
    Причем, насколько его гитарному почерку свойственна виртуозность, настолько ему
    чужда и лаконичность. Так что перед вами два полновесных компакт-диска! И ни одной
    пропетой ноты! Зачем, собственно, нужна вся эта гитарная пиротехника – вопрос
    открытый. Но сам процесс – очень увлекательный.


    Современная сольная джаз-блюзовая гитара без вокала в альбомах Now My Soul - Ronnie
    Earl The Way Up - Pat Metheny


    (впервые опубликовано с сокращениями в журнале Play)'
