- id: 1059
  author: Константин Колесниченко
  mark: 6
  date: '2007-04-16'
  text: Очередной харпер из череды всяких Кимов Вилсонов, бесконечных Слимов и прочих калифорнийских блюзменов. Альбом заполнен
    набором композиций, исполненных в традиционном, мягко-подпрыгивающем West Coast стиле. Есть классика блюза вроде "Roller
    Coaster", "Goin' To Chicago" и т.д., есть инструменталы. Вокал a la Lynwood Slim и прочие мяукающие певцы жанра. Альбом
    не вызывает ни отвращения, ни восторга - просто очередная ровная работа, сделанная добротно и качественно, разве что,
    Деннис отлично играет на хроматической гармонике (хотя тут тоже нет особой изюминки - как всегда, Литтл Уолтер, Джордж
    Смит и т.д.)
