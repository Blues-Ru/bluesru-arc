  date: '2009-04-09'
  text: '<img src="http://2.bp.blogspot.com/_XuK57NxIpGg/SF8w5IukOZI/AAAAAAAAAHE/Fx45demQr8w/s320/Dennis+Gruenling+-+I+Just+Keep+Lovin%27+Him.jpg">


    В West Coast Blues''е есть две основных иконы для харперов - Little Walter и George "Harmonica" Smith. Все с них начиналось
    и на них же заканчивается, правда, с небольшими вариациями на тему. На музыке этих двух гигантов воспиталось поразительно
    огромное количество известнейших музыкантов: Rod Piazza, Johnny Dyer, William Clarke, Gary Smith, Mark Hummel, Kim Wilson,
    Rick Estrin и т.д. Есть целая школа аккомпанемента харперам, в стиле Роберта Локвуда, Лютера Такера, Луиса Меерса и Джимми
    Ли Робинсона - они играли с Уолтером. Dennis Gruenling тоже один из продуктов этого "культа", он из более молодого поколения,
    чем все вышеперечисленные харперы. Хотя нужно признать, что он уже успел заработать себе всемирную известность в определенном
    кругу благодаря своей очень техничной игре, а еще он продает винтажные микрофоны для других звездных музыкантов.


    В 2008 году вышел "Кадиллак Рекордз", сам Литтл Уолтер был введен в зал славы рок-н-ролла 10 марта этого же года. Потому
    время для выпуска трибьюта своему любимому музыканту Деннис выбрал удачно, и не менее удачно обыграл в обложке альбома
    известное фото Литтл Уолтера, а в его названии один из его хитов.


    Что касается самого альбома, то запись эта - вершина в современном харперском мире, в его West-Coast части. Все сыграно
    безупречно, стилистически точно и очень близко к оригиналу (звука тех записей все равно уже не получить). Деннис не поет,
    потому вокальные партии за него выполняют, попутно тоже солируя на гармониках, все те же звезды этого стиля: Kim Wilson,
    Rick Estrin, Steve Guyger. Но мне больше всего понравилось как поет девушка с не-по-женски интересным голосом - Gina Fox.
    Говорить, что кроме солистов, в записи принимали участие музыканты встречающиеся на других альбомах Вест-Коаст блюза,
    вроде Rusty Zinn, наверное, бессмысленно.'
