  author: Андрей Евдокимов
  mark: 7
  date: '2005-08-05'
  text: 'Через неделю после получения Грэмми Соломон Бюрк выпускает следующий альбом,
    который доказывает, что почивать на лаврах он не намерен. Жесткий ритм первой
    песни, лаконичные хлесткие гитарные линии, прорывающие вокальную тему, убедительно
    доказывают, что рок вполне ему по плечу. Но Бюрк – лучший голос в современной
    соул-музыке. И дальше следуют вечные для соул вопросы "Кто я и куда иду?", "Что
    делать мне?" и "Кто меня полюбит?" - расположенные на величавых аккордах, безупречном
    неторопливом ритме и, конечно же, сопровождаемые страстными женскими подпевками.
    Высокое качество песен гарантировано звездным составом сочинителей: Хэнк Улльямс,
    Боб Дилан, Кит Ричардз и Мик Джеггер, Вэн Моррисон и Доктор Джон. И хотя в альбоме
    есть и стандарты, но большинство песен написано специально для Бюрка. И все бы
    было замечательно, да смущает одно обстоятельство: альбом абсолютно предсказуем
    до каждой ноты и каждого слова.'
