reviews:
- id: 999
  author: Александр Панин
  mark: 9
  date: '2006-05-05'
  text: Очень мощное выступление Соломона Берка в новоорлеанском Блюзовом Доме 1 мая 1994 года. На сцене много музыкантов
    (в буклете перечислены аж 34 фамилии!), выделяется большая духовая секция (Марк Казанофф сотоварищи). Богатое звучание
    и великолепный вокал Соломона, известные и отличные песни - Everybody Needs Somebody To Love, If You Need Me, Cry To Me,
    Got To Get You Off My Mind, Ain't Nobody's Business, I Want A Little Girl, Good Rockin' Tonight. Диск изначально вышел
    на лейбле Black Top (а это само по себе является сигналом к приобретению), а в прошлом году переиздан конторой под названием
    Shout Factory. Отменный образец соула и блюза!
