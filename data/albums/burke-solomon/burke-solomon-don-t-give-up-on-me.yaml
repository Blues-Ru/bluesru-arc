- id: 53
  author: Алексей Калачев
  mark: 7
  date: '2002-12-17'
  text: В США все рецензенты упирают на то, что Берк спел материал известных попсовиков Дилана, Вен Моррисона, Брайана Вилсона,
    Элвиса Костелло и проч., и в этом, дескать, главная изюмина. Для отечественных любителей ритм-энд-блюза это, похоже, не
    должно иметь никакого значения – не Пугачеву с Газмановым же Соломон перепевал! Более того. Если б он спел обычный "черный"
    материал, талантище его засиял бы во сто крат эффектней. Но главное, конечно, в другом. Во-первых, Берк – супер-звезда
    соул-музыки, блестящий певец. Блестящий. На новом диске это слышно с первых нот. Во-вторых, альбом необычен не авторами,
    а камерностью, звуком, атмосферой, душевностью. Тихий соул. Изумительная работа элетроорганиста.
- id: 1326
  author: Дмитрий Казанцев
  mark: 10
  date: '2008-08-20'
  text: 'Великолепный ритм-н-блюз, кантри-соул и блюз! Берк невероятно круто поет для 62-летнего ветерана. Все сыграно малым
    составом, звук интересный, но неоднозначный - довольно своебразный продакшн (что нормально для Fat Possum).


    Шедевральный альбом, рекомендую его просто всем.'
