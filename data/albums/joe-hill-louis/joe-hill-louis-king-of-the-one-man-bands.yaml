  text: '23 сентября в 1921 году в Лягушачьей Заднице (Froggy Bottom), Теннеси, родился
    Лестер Хилл.(по другим сведениям в Raines) Удача в мальчишеских драках принесла
    ему в качестве прозвища имя известнейшего боксера, и он стал Джо Луи (Joe Hill
    LOUIS). Человек-оркестр, он выступал с гитарой, с губной гармоникой в холдере,
    сидя за ударной установкой. (блюзовый календарь)


    Диск представляет собой собрание всех синглов. Joe Hill Louis - 2008 - King Of
    The One Man Bands CD A (1949 - 1952) CD B (1952 - 1954)


    Известен как один из немногих "one-man band", наряду с Doctor Ross, кто сумел
    в 50х сделать коммерчески успешные записи как лидер и как сессионный музыкант
    для Sun Records.


    В 14 лет ушел из дома и работал у мемфисских богатеев слугой, в конце 30х работал
    в Peabody Hotel. А начиная с 40х и дальше уже работал музыкантом.


    Дебютную пластинку записал в 1949 года для Columbia, в 50х записывался на некоторых
    независимых лэйблах(Modern, Checker, Meteor, Big Town), но самый известный был
    Sun Records, возглавляемый Sam Phillips''ом, где Joe и записал большую часть своего
    материала. Его самый знаменитый сингл "Boogie in the Park" (записанный в июле
    1950 и изданный в августе 1950) предстает как "один из самых громких, перегруженных
    гитарных стомпов, когда-либо записанных", на котором он еще параллельно играет
    на неком подобии ударных. Эта была первая вещь, вышедшая на лэйбле Сэма Филлипса,
    еще до основания Sun Records.


    Некий Jim Miller в своей книге про Rolling Stones упоминал Joe Hill Louis, как
    одного из блюзменов, гитарный звук которых, возможно повлиял на зарождение стиля
    heavy metal в дальнейшем. (глубоко копнул - что сказать).


    Одной из самых известных вещей Louis''а как гитариста-сайдмэна была "Bear Cat"
    Rufus Thomas''а записанная как ответ на песню Big Mama Thornton''s "Hound Dog",
    и которая достигла третьей позиции в R&B чарте и которая привела к судебному иску
    за нарушение авторских прав. Также принимал участие в записи песни "Tiger Man",
    которая позже была записана Элвисом Пресли, среди прочих.


    Около 1950ого получил предложение от B.B. King''а вести на радио WDIA передачу
    Pepticon Boy. И также стал известен как "The Pepticon Boy" и "The Be-Bop Boy".


    Louis умер 5 августа 1957 года в госпитале John Gaston в Мемфисе от столбняка,
    который он заработал на какой-то подработке порезав большой палец. Ему было 35
    лет.


