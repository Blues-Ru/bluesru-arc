- id: 210
  author: Дмитрий Казанцев
  mark: 10
  date: '2003-09-10'
  text: 'Это первый из трех великолепных блюзовых альбомов, записанных им в 90-х для фирмы Private Music. На альбоме 12 треков
    + бонус и длится он 48 минут. Тут с Тажем играет большая группа и среди них такие звезды, как Этта Джеймс (вокал) и Билл
    Пэйн (клавишные). Звук и аранжировки на высоте!


    Первый трек Blues Ain''t Nothin'' - танцевальный блюз Тажа с мощной энергетикой.


    Hard Way продолжает бодрое начало, и становится понятно название альбома, под такие ритмы вполне можно танцевать.


    Strut - интересный и бодрый страт написал Таж! Особенно классно звучит деэт соло-гитары и вокала в унисон!


    Going To The River - спокойный, но танцевальный ритм-н-блюз Фэтса Домино. Вокал Тажа делает невероятные вещи даже в таких
    неярких номерах.


    Mockingbird - великолепный текс-мекс блюз с Эттой Джеймс!


    Blue Light Boogie - очень тонкое исполнение этакого приджазованного буги; Таж подпевает сам себе и играет на органе!


    The Hoochi Coohie Coo - известнейшая популярная композиция; все четко и бодро. Можно выделить интересную вокальную группу
    на подпевках.


    That''s How Strong My Love Is - классическое исполнение этого хита. Отличное сочетание органа, пианино и духовой секции!


    Down Home Girl - второй трек подряд из репертуара Роллинг Стоунз, неужели лн думал о них? Обалденная вещь!


    Stranger In My Own Home Town - вкрадчивый приджазованный блюз с акцентом на вокале Тажа. Супер-соло Билла Пэйна на пианино!


    Sitting On The Top Of The World - очень бодрый и зажигательный вариант этой нетленки Хаулина Вулфа! Таж сильно изменил
    аранжировку и мелодию. Отличная игра Тажа на стил-гитаре и Билл Пэйн на месте!


    I''m Ready - еще одна вещь Домино на альбоме. Рок-н-ролл!


    I Can''t Help Myself - бонус трек. Почти регги. Хорошая веселая песенка.


    Оценка 5 баллов! Я не нашел слабых или скучных мест на альбоме! Все очень здорово, ярко, зажигательно! Таж решил записать
    альбом из блюзов и ритм-н-блюзов, и у него это отлично вышло!'
