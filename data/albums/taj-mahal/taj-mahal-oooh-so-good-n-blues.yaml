  author: Дмитрий Казанцев
  mark: 10
  date: '2003-08-28'
  text: 'Это уже восьмой альбом Тажа для Коламбии! Альбом трудного периода для него, периода перемен и выбора музыкального
    направления. Что же должен делать он в такой ситуации? А что бы сделали Вы? А вот Таж взял и записал ШИКАРНЫЙ акустический
    альбом ПОЧТИ ОДИН. Ему подпевают сестры Пойнтер и иногда подыгрывают на клавишах, но в основном это Таж во всей своей
    красе!


    Альбом никогда не издавался на КД, у меня оригинальный винил первого тиража (а был ли второй?)


    На альбоме всего восемь вещей, но с самого начала альбома ясно, что будет кайф!


    Первый трек - Buck Dancer''s Choice - традиционный инструментал, виртуозно исполненный Махалом. Дальше идет обалденный
    блюз Тажа Little Red Hen - два инструмента, вокал Тажа и подпевки Сестер. Дальше больше - просто убойный блюз опять же
    Тажа Mama Don''t You Know - тут он вообще один, и звучит это очень серьезно (любители архаики и виртуозной игры на акустике
    оценят точно; где ты, Бирюков...) Четвертый трек на первой стороне - Frankie And Albert - знаменитая хитовая вещь Миссиссиппи
    Джона Херта (хотя есть сотня вариантов этой темы и до него); исполнено прекрасно.


    Вторая сторона начинается с Railroad Bill - классный инструментал в стиле блюз/рег; Таж смешно свистит в середине этого
    номера, и кто-то хлопает в ладоши. Второй трек второй стороны - Dust My Broom - эту вещь Элмора Джеймса знают все; тут
    Таж играет и слайдом - делает это очень искусно. Дальше еще один хит - Built For Speed Уилли Диксона; эта песня о Таже
    - он далеко не маленький и не хилого телосложения (хотя и не толстяк вовсе, скорее атлет). Здесь Таж играет на контрабасе
    и гармошке, на пианино Мерл Сондерс (полный кайф). Альбом заканчивается странно; медитативно-джазовая вещь Teacup''s Jazzy
    Blues Tune. Тут есть перкуссия, Таж на контрабасе, свистит и поет jive (без слов), Сестры подпевают. Вещь странная, но
    очень красивая и не портит альбом вовсе.


    Оценка 5! Надо еще отметить прекрасное, почти аудиофильское качество записи. Весь альбом по звуку и подходу напоминает
    вторую сторону Recycling The Blues, и это прекрасно!


    So good''n blues - очень точное название на этот раз!'
