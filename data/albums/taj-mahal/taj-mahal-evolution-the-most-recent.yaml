- id: 201
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-08-29'
  text: 'Третий и последний альбом Тажа на Уорнере. 14-ый у Тажа. Альбом уникальный
    во всех отношениях. Таж исполняет аж три песни Леона Пендарвиса (попсовый товарищ)!
    Таж играет поп-музыку! Таж исчезнет на 9 лет после этого!


    На альбоме 9 вещей на 36 минут - идеально! Здесь мало что осталось от других альбомов
    Махала, но тут есть сам Таж и его гений!


    Первый трек - Sing A Happy Song - попсовая танцевальная вещь Пендарвиса. Классная
    мелодия, классно исполнено, а что еще надо?


    Второй трек Queen Bee - это хит с большой буквы! Одна из лучших вещей Тажа, тут
    и блюз, и регги, и островные дела. Лучший трек на альбоме!


    Lowdown Showdown - опять песня Пендарвиса, опять весело, бодро, реггийно и попсово.
    Но мелодия и энергия на месте!


    The Most Recent - медитативная, инструментальная, прифанкованная композиция с
    разными хитрыми инструментами типа калимбы и стил-драмз. Таж с ребятами "постарались".


    Why Do You Do Me This Way - Пендарвис написал шикарный медленный фанк в южном
    стиле! Отличный трек! Все на месте (попса тоже!)


    Salsa De Laventille - латинский инструментальный поп-фьюжн, а вот этого может
    и не надо было...


    The Big Blues - ну вот и о блюзе вспомнили наконец! Это хороший блюз! Он еще не
    раз его исполнит потом, много лет спустя. Таж поет голосом Хаулин Вулфа - у него
    это отлично получается!


    Highnite - диско в карибском стиле, не более того. Написана перкуссионистом из
    группы Тажа. Необязательный номер.


    Southbound With The Hammer Down - фанк-регги-блюз, написанный Тажем! Все необычно,
    но просто здорово!


    Вот такая сборная солянка тут получилась. 4 балла за такое блюдо. Некоторые вещи
    ну очень хороши!


    И так это был 14-ый альбом Тажа и последний на долгие годы. Последний на большом
    мэйджоре-лейбле. Дальше будет длинный перерыв в 9 лет (выйдет только один странный
    концертник) и Таж вернется совсем другим. 60-е и 70-е кончились, а с ними и мэйджор-эра
    Тажа Махала.


    Revolution? What do you mean, Taj?'
