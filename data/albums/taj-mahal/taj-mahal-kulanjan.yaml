reviews:
- id: 204
  author: Дмитрий Казанцев
  mark: null
  date: '2003-09-02'
  text: 'Это не альбом Тажа, это его проект с Тумани Диабатэ. Последний играет на хитром африканском инструменте КОРА - странное
    подобие лютни с 21 струной!


    Этот альбом имеет очень далекое отношение к блюзу в обычном понимании этого понятия. От блюза тут только сам Таж и иногда
    - попытка исполнить блюз с африканскими музыкантами и певцами. В результате получился альбом в жанре World Music. Хороший
    альбом в этом жанре, но врядли он будет сильно интересен любителям блюза - слишком много странных звуков и нот.


    Оценку я ставить не буду, ибо как альбом "уорлда" он очень хорош, но как блюзовая пластинка - никак.'
- id: 2168
  author: Александр Сомов
  mark: null
  date: '2014-08-04'
  text: 'На этом альбоме Taj Mahal выступает вместе с музыкантом из Мали - Toumani Diabate, который играет на классическом
    инструменте - Ко&#769;ра(струнный щипковый музыкальный инструмент с 21 струной, распространенный в Западной Африке. По
    строению и звуку кора близка к лютне и арфе). На нем играют только джели (более общее слово - гриот, культурный деятель
    широкого профиля, певец, музыкант и сказитель), только определенную музыку и учатся этому всю жизнь. Клан Диабате как
    раз джели и есть.


    Махал впервые посетил Мали в 1979 году и название альбома взято из песни 1970х "Kulanjan" альбома Ancient Strings, записанного
    Toumani Diabat&#233;. Впервые они встретились в 1990 году, а в 1999м Toumani позвал шесть виртуозов малийской музыки,
    с которыми они и записали этот альбом в Афинах, штат Джорджия.


    New Statesman описал этот альбом как поразительный набор эклектичного грува, включающего и рэгтайм, баррелхаус блюз и
    даже ронкролл. Журнал Folk Root назвал Kulanjan альбомом года.


    За альбомом последовал тур Taj Mahal''а вместе с западно-африканскими музыкантами, связывающий его американский блюз с
    народными африканскими ритмами(откуда все и появилось). Помимо прочего Taj Mahal уверен, что его предки - музыкальный
    малийский клан Mande.'
