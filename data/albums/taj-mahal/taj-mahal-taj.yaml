- id: 214
  author: Дмитрий Казанцев
  mark: 6
  date: '2003-09-13'
  text: 'После долгого перерыва в 7 лет Таж вернулся в студию и записал этот альбом на лейбле Gramavision. Ох уж эти 80-е...
    здесь есть все дурацкие звуки этой жуткой декады для музыки. Это не блюзовый альбом. Это не рок-альбом. Это странный камбэк
    с эклектичной программой и отпечатком поп-музыки. Нет, он не плох, просто это не то, за что мы любим Тажа. Тут есть регги,
    латина, блюз, карибские дела, модерн соул, но все это звучит как-то странно с пластиковыми клавишами и идиотскими звуками
    барабанов. Хорош только сам Таж и несколько композиций. Я бы выделил третий номер Do I Love Her, пятый блюзовый трек Deed
    I Do очень хорош, Soothin'' - приятная композиция.


    Оценка 3 балла. Не больше, но и не меньше. Тут нет плохих песен, просто они либо неяркие, либо записаны с дурацким звуком.
    Альбом совсем необязателен для рядовых любителей блюза и Тажа.'
