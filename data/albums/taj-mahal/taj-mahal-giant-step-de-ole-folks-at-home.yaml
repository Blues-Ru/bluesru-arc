  author: Дмитрий Казанцев
  mark: 8
  date: '2003-08-27'
  text: 'Надо сразу сказать, что это не двойной альбом Тажа, - это два альбома на
    одном КД, а также они выходили двойником на виниле и по отдельности тоже. Но все
    же для простоты мы будем называть этот двойник третим альбомом Махала - это 1969
    год.


    Первые 9 треков - это продолжение его второго альбома по звуку и музыке. Немного
    слабее, тем не менее. Первый трек - скорее шуточное вступление, немного мутно
    звучит Give Your Woman What She Wants, некоторые песни слишком шустрые, другим
    не хватает яркости. Следует отметить отличные номера на этом альбоме: Take A Giant
    Step, Good Morning Little School Girl (лучшая вещь на альбоме), Farther On Down
    The Road (это вещь Тажа, не путать с классическим блюзом - там другое название).
    На этом альбоме играют вместе с Тажем: Джесс Эдвин Дэвис - гитара, пианино, орган;
    Гари Гилмор - бас; Чак Блэкуэлл - ударные. Надо отметить классную игру Тажа на
    гармошке; насколько я понимаю, он отлично владеет и многими основными инструментами
    - гитара, банджо, клавиши, бас, гармошка.


    Треки 10-22 - это Таж соло. Где-то он просто поет под хлопки, где-то с гармошкой,
    иногда играет на гитаре или банджо; есть и инструментальные номера. Тут трудно
    что либо выделить - все вещи клевые и сделаны в архаичной манере довоенного блюза
    и фолка. Можно лишь назвать его коронные в будущем номера: Candy Man, Stagger
    Lee, Fishin'' Blues. Эта часть двойника должна понравится любителям архаики, фолка
    и Михаилу Бирюкову.


    Оценка 4 за этот двойник. Есть ощущение, что Тажу надо что-то менять, не хватает
    яркости и новизны. Этот альбом звучит как случайная подборка материала порой.
    Хорошо то, что материал все же очень хорош.'
