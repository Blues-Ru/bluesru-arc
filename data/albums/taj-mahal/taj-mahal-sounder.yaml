  date: '2003-08-28'
  text: 'Этого альбома у меня нет! Его нет на КД, и я НИ РАЗУ не видел его на виниле. Более того, я ни разу не видел людей,
    которые хоть раз держали его в руках!


    Это седьмой альбом Тажа и это саундтрек к фильму Sounder:


    http://www.allmovie.com/cg/avg.dll?p=avg&sql=1:45749


    Как мы видим, фильм - хороший, и Таж сам играет в нем (он играл и в других фильмах). Фильма ТОЖЕ нет в цифре - на ДВД!
    Ну что за напасть!


    Его сильно ругают на Оллмьюзике (слышали ли они этот альбом вообще?), но я все равно хочу его найти для коллекции. ЕСЛИ
    У КОГО-НИБУДЬ ЗАВАЛЯЛСЯ ЭТОТ ВИНИЛ ИЛИ ВЫ ЗНАЕТЕ ЧЕЛОВЕКА, У КОТОРОГО ОН ЕСТЬ НА ЗАПИСЬ ИЛИ НА ПРОДАЖУ, ДАЙТЕ МНЕ ЗНАТЬ,
    ПЛИЗ!


    Sounder... sounds so sweet and willing...'
