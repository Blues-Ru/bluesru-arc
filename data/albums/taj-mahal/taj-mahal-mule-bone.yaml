- id: 212
  author: Дмитрий Казанцев
  mark: 6
  date: '2003-09-10'
  text: 'Это второй альбом Тажа на Gramavision. Это не совсем обычный альбом. Это музыка Тажа на слова Лэнгстона Хьюза к бродвейской
    постановке Mule Bone. То есть это не самостоятельная работа Тажа; почти саундтрек.


    Альбом длится всего 34 минуты и состоит из 11 композиций. Все сыграно довольно сыро, слышно, что писались живьем в студии.
    Есть откровенно лажовые моменты из серии "мимо, но клево". В целом пластинка очень веселая и блюзовая. Может быть, есть
    странное ощущение, что Таж писал блюзы на готовые слова - это редко хорошо получается. Иногда Таж использует довольно
    противный захорусированный звук на акустике, и это звучит плохо. 80-е годы еще не совсем выветрились из его головы. Ярких
    вещей почти нет, можно выделить седьмой трек Shake That Thing Чарли Джексона и интересную песню Crossing (lonely Day)
    - 9 трек.


    Оценка 3 балла. Слишком лоу-фай продакшн и продюсирование. Практически нет "хитов", звук странный и местами искусственный
    несмотря на вполне традиционный материал. Спасает лишь хорошее настроение альбома и пение Тажа.'
