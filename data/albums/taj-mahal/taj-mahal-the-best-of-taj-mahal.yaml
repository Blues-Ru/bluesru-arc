reviews:
- id: 308
  author: Кирилл Мошков
  mark: 10
  date: '2003-12-02'
  text: 'Внушительная компиляция ранних (1967-74) и, вероятно, действительно лучших записей одного из самых парадоксальных
    блюзовых музыкантов. Ныне 60-летний, Генри Сент-Клер Фредерикс родился в Нью-Йорке в семье джазового аранжировщика и изучал
    музыкальную культуру своих афроамериканских предков в университете, потом переехал на Западное побережье (а в 60-е там
    делалось много хорошей музыки!) и стал играть в Лос-Анджелесе электрифицированный кантри-блюз: полная противоположность
    обычным блюзменам, родом с Юга и добившимся успеха в Чикаго! Дело в том, что Тадж Махал с самого начала обращался к молодежной
    аудитории, в массе своей - белой или смешанной. Потому и вовлечен он был в рок-движение куда сильнее, чем в блюзовое сообщество,
    и в его альбомах было столько же рок-музыки, сколько и акустического блюза (а впоследствии появилась еще и масса этнических
    влияний - от африканских до вест-индских).


    Коллекция составлена из фрагментов восьми первых альбомов Таджа и демонстрирует внушительное разнообразие аранжировочных
    и тембровых решений (свойственное, безусловно, скорее рок-музыке тех времен). Кроме двух треков с самого первого альбома
    с их дурно прописанными (хотя и очень органичными в общей картине) барабанами, альбом в основном представляет характерное
    электрифицированное звучание Западного побережья на рубеже 60-70-х, энергичное и очень плотное как в динамическом, так
    и в тембральном смысле. Впрочем, нельзя не отметить, что самые интересные фрагменты - это когда Тадж со всей изощренностью
    "продвинутого" музыковеда - специалиста по блюзу обращается к слушателю соло, аккомпанируя себе (при помощи наивных наложений
    тех лет) на банджо, стил-гитаре и губной гармонике.'
