  author: Дмитрий Казанцев
  mark: 10
  date: '2003-08-25'
  text: 'У Тажа (настоящее имя Henry St. Clair Fredericks) много альбомов. Скоро будет
    уже 40 лет, как он начал записываться вместе с Райлэндом Кудером и группой Rising
    Sons. У него есть блюзовые пластинки, не совсем блюзовые и совсем не блюзовые,
    но, поверьте мне, они все хорошие или очень хорошие.


    Итак, в 25 лет Таж Махал начал свою сольную карьеру, подписав контракт с Коламбией.
    На его дебютном альбоме с ним играет старый друг Рай Кудер, который скоро сам
    начнет записывать альбомы и станет уникальным гитаристом. Таж тоже уникален, но
    его достоинства еще шире - он великолепно поет в разных жанрах, его акустическая
    гитара всегда точна и лаконична, он владеет другими инструментами, а главное -
    он умеет сочинять, адаптировать, делать отличные аранжировки и создавать неподражаемую
    атмосферу радости, юмора, драйва, блюза и музыки. Таких музыкантов очень мало,
    и каждый из них является неповторимой личностью.


    На своем первом альбоме Таж записал всего восемь песен; восемь хороших и известных
    песен. Лишь одну - EZ Rider - он написал сам. Три из восьми - шикарные блюзы Слипи
    Джона Эстеса; и Таж и Рай обожали этого основоположника блюза.


    Не ищите тут слабых песен или вялых нот - весь альбом от начала до конца великолепен.
    Особенно хороши Leaving Trunk, Statesboro Blues (визитная карточка Тажа еще со
    времен Rising Sons), Everybody''s Got To Change Sometimes, EZ Rider и, конечно,
    Diving Duck Blues.


    Этот альбом отличается по саунду от его последующих творений - он довольно жесткий
    и грязный, но начало эпохи Тажа положено, и это - одна из лучших его работ. Максимальные
    5 баллов за этот диск! За каждую секунду его звучания, хотя у него есть более
    сильная следующая пластинка.


    Отличный дебют! Необходимая пластинка в коллекции каждого любителя блюза и блюз-рока.'
