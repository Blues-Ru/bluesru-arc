reviews:
- id: 211
  author: Дмитрий Казанцев
  mark: 10
  date: '2003-09-10'
  text: '48 минут и 14 треков - это второй из трех "золотых" альбомов Тажа на Private
    Music. Певрый был очень силен, но этот еще лучше, если так вообще бывает. Здесь
    в гостях Бонни Рэйтт и Эрик Клэптон!


    Первый трек Lovin'' In My Baby''s Eyes - это восхитительный фолк в исполнении
    Тажа! Может быть лучшая его вещь в 90-х!


    Cheatin'' On You - очень красивая ритм-н-блюзовая композиция с духовыми и подпевками.


    The Hustle Is On - буги, свинг, шаффл; а почему бы и нет, исполнено великолепно!


    Here In The Dark - минорный блюз в новоорлеанском стиле с Эриком Клэптоном - отлично!


    Fanning The Flames - опять минор, опять приджазованно, опять класс, так просто
    не бывает!


    I Need Your Loving - этакий хард-шаффл-блюз с Бонни Рэйтт. Звучит убедительно!


    Ooh Poo Pah Doo - опять Новый Орлеан! Веселая танцевальная вещь в "легком жанре".
    Мастерски сделано!


    Lonely Avenue - эту вещь Дока Помуса исполняли сотни, но и Таж нашел свой вариант
    с лидирующим органом и классными подпевками!


    Don''t Tell Me - мягкий приджазованный соул с очень интересной аранжировкой.


    What Am I Living For - старомодный ритм-н-блюз в стиле Фэтса.


    We''re Gonna Make It - соул, кейджун, кантри в одном флаконе! Здорово!


    Let The Four Winds Blow - а вот это уже бодрый кейджун в чистом виде! Дэйвид Хидальго
    на аккордионе.


    (You''ve Got To) Love Her With A Feeling - довольно известный блюз Фредди Кинга;
    на гитаре Эрик. Все очень здорово!


    The Car Of Your Dreams - неожиданный номер. Слайд-гитара, хитрые звуки на гитарах,
    клавинет, фанк. Классный компот!


    Оценка 5 баллов! Жаль больше нельзя поставить. Все треки интересные и яркие, сыграно
    великолепно. И тут есть Lovin'' In My Baby''s Eyes.'
