- id: 205
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-09-02'
  text: 'Это очень хорошо сыгранный и записанный концерт Тажа. Записан он в 1998,
    но вышел только в 2000. Концерт - длинный и состоит из 13 композиций. В основном,
    это блюзы в новых аранжировках, но есть регги и карибская музыка.


    Играют и поют просто великолепно - настоящий праздник для слушателя! Из "классики"
    тут EZ Rider, Ain''t That A Lot Of Love, Leaving Trunk, Mailbox Blues, Corrina.
    Таж еще раз доказал, что его живые выступления также сильны как и студийные работы.


    Оценка 4 балла, слишком эклектичен для блюзового альбома (а именно так он позиционируется)
    и слишком заблюзован для поп-пластинки.'
