- id: 738
  author: Александр Панин
  mark: 7
  date: '2005-06-27'
  text: Этот диск записан в октябре 2003 года на острове Занзибар. Кроме своей ритм-секции, с Таджем выступает большое число
    местных музыкантов, играющих на самых разнообразных инструментах. Занзибар - это африканский ист-коуст, поэтому звучащие
    на диске мотивы отличаются от результатов известных экспериментов по скрещению блюза и музыки западного побережья. Эта
    музыка более спокойная и заунывная, в ней значительная арабо-азиатская составляющая. Элементы блюза, конечно, на диске
    присутствуют, но их не слишком много, поэтому он рекомендуется в первую очередь любителям этнических звуков.
