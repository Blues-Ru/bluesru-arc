- id: 206
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-09-02'
  text: 'Я не знаю, почему он вышел только два месяца назад в США, я его купил очень давно, и этот альбом - 2001 года, а записан
    в далеком 2000-ом в Германии и на Гавайях.


    Здесь Таж со своими гавайскими друзьями The Hula Blues Band. Играют весело и живо, некоторые треки записаны живьем в студии
    - это хорошо слышно. Тут много своих старых и новых песен, а также традиция и даже Боб Дилан! Альбом длится 45 минут и
    состоит из 11 треков - классика!


    Начинается альбом с Great Big Boat - очень красивая "островная" песня Тажа не без блюзового влияния.


    Потом идет старая народная вещь в обработке Тажа Black Jack Davey. Тут реггийная обработка. Он уже записывал ее в 70-е.


    Третий трек Moonlight Lady - что-то типа мексиканской кантри-песни с гавайскими звуками - очень красиво и гармонично.


    Четвертая вещь King Edward''s Throne - это отдельная история. Музыка Тажа, а слова народные. Всех слов-то: Love, love,
    love alone caused King Edward to leave his throne. Минорная карибская музыка на текст о бедном английском короле Эдуарде.
    Лучший номер на альбоме!


    African Herbman - известная вещь Ричи Хейвенса в реггийной обработке.


    Baby You''re My Destiny - приджазованная вещь Тажа с альбома 70-х годов. Ностальгия по тем годам?


    Седьмой трек Stagger Lee - визитная карточка Тажа; одна из них. Тут в бодрой твистовой обработке. Любит он эту песню!


    Living'' On Easy - веселая народная песня о бедном пьянице. Интересная блюзо-латинистая обработка.


    My Creole Baby - классический блюз-сонг Миссиссипи Джона Херта. Его Таж очень любит и уважает! Супер-песня!


    ALL ALONG THE FUCKING WATCHTOWER!!! By Bob Dylan! Вот это он дал, такого я не ожидал от Тажа! И Дилана значит чтит...
    Отличное исполнение этой нетленки Боба. Один из лучших треков на альбоме!


    Ну и под конец одиннадцатым номером симпатичная островная инструменталка. Вовсе необязательная после вещи Дилана.


    Что сказать, оценка 4 балла. Много старых вещей, а мы хотим новых или еще незаписанных! Остальная часть с новым материалом
    хороша до неприличия!'
- id: 1104
  author: Константин Колесниченко
  mark: 10
  date: '2007-06-27'
  text: Такую музыку играть умеет только Taj Mahal. Не знаю, как у него получается смешивать cтолько жанров, так петь и прочее.
    Это настоящая музыкальная магия! Представте, что в одном альбоме намешано все от блюза, джаза, соула, карибской музыки,
    регги и т.д. Альбом можно слушать бесконечно. Все его фирменные приемы на месте, обожаю, когда он копирует манеру пения
    Howlin' Wolf! Я не могу сказать, что это блюзовый альбом, Taj Mahal шагает широкими шагами по многим музыкальным жанрам.
