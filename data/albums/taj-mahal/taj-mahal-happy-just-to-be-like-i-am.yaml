- id: 191
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-08-28'
  text: 'Ну вот и начались великие эксперименты и нужные движения в жизни Тажа. На его четвертом альбоме на Коламбии чего
    только не творится. Состав расширен дудками, и не простыми, но хитрыми - туба (она же - геликон), флюгельхорн, баритон-саксы,
    флейты и дудочки. Появилась классная перкуссия, изменились ритмические рисунки и аранжировки. Добавлено островное и латинское
    звучание в некоторых вещах. Несмотря на все это, блюзовые корни тут очень глубоки по-прежнему, это еще не переход Тажа
    в "другую" корневую музыку.


    На альбоме всего 8 вещей, но они все классные и РАЗНЫЕ - это всегда интересно. Альбом выходил на КД только на фирме Mobile
    Fidelity, так что это редкость и надо ждать обычного релиза. Я пишу эту рецензию на радио-промо виниловую пластинку того
    года - приятно держать ТАКОЕ в руках.


    Таж не просто начал творить и серьезно погружаться в мир МУЗЫКИ, он начал создавать свой неповторимый стиль игры и пения
    - это великое удовольствие слушать Тажа в его же среде.


    На первой стороне два КЛАССНЫХ блюза - второй трек Stealin'' и четвертый Eighteen Hammers и две бодрые ритм-н-блюзовые
    вещи - первая Happy Just To Be Like I Am и третий трек Susanna. Все это сыграно и записано ПРЕВОСХОДНО! Абсолютно живая
    запись в студии с интересными звуками и "фишками". Никаких дурацких запилов или подражательства - абсолютно свой материал
    с новым видением этой музыки.


    Вторая сторона начинается с очень бодрой Tomorrow May Not Be Your Day - вещь с прифанкованным ритмом и новоорлеанской
    духовой секцией (ох, как же классно звучат эти низкие "пачки" на тубе и баритоне!) Вторая вещь - признанный хит Chevrolet
    - это уже серьезный блюз-рок, так что не удивляйтесь сразу, Таж и на это способен. Вокал в этом треке - это что-то очень
    волшебное! Третья композиция - West Indian Revelation - это уже первые опыты Тажа с островной музыкой, тут и регги, стил-драмс,
    вокальные распевы и атмосфера карибского праздника и беззаботности. Последняя вещь на альбоме - Black Spirit Boogie -
    акустический буги-блюз с гитарой и слайд-гитарой и без вокала (напоминает поздние саундтреки Рая Кудера).


    Оценка 4 балла; немного смазанны последние две вещи на альбоме. Остальные вещи на высоте, и Таж уже в другой лиге - он
    сам пишет, сам играет, сам руководит процессом - в свои неполные 30 лет он стал МАСТЕРОМ с большой буквы.'
