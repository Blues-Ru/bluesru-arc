reviews:
- id: 199
  author: Дмитрий Казанцев
  mark: 8
  date: '2003-08-29'
  text: 'Это первый из трех альбомов Тажа для фирмы Уорнер. Провал последнего альбома для Коламбии требовал изменений, и они
    последовали!


    На этом альбоме всего 8 композиций длиной в 42 минуты - хороший, спокойный формат. Состав группы почти не изменился, а
    вот настроение изменилось в лучшую сторону - все-таки дебют для нового лейбла.


    You Got It - отличное начало! Бодрый интересный соул с элементами карибских стилей (калипсо и т.д.)


    Freight Train - странная композиция, смесь блюза, кантри, текс-мекса и карибских ритмов. Не могу сказать, что она плохая,
    но уж точно не лучшая и затянута к тому же.


    Baby You''re My Destiny - очень приятный трек с почти джазовой гармонией и темой, ну очень красивая мелодия!


    Sailin'' Into Walker''s Cay - чистой воды карибская танцевальная музыка с элементами юмора и пародии - неплохой трек,
    на самом деле.


    Truck Driver''s Two-Step - вот это уже ОЧЕНЬ хорошо! Тут и блюз, и фолк и соул - такие песни Тажа не могут не нравиться!
    Лучшая вещь на альбоме!


    The Four Mills Brothers - <a href="http://www.allmusic.com/cg/amg.dll?p=amg&sql=B3690s33ba3vg">песня о знаменитых Братьях
    Миллз</a> - смесь всего подряд и карибского, плюс юмор и цитаты, хорошая вещь-то!


    Honey Baby - растафарай! Да, это регги, но много карибских звуков, они тут мешают.


    Curry - а вот это уже почти карибское диско! Так "далеко" Таж еще не забирался! Инструментальный трек с постоянной фразой
    "Карри, карри, карри..." Не самый удачный номер на альбоме.


    Оценка 4 балла. Вещи хорошие или очень хорошие, но местами затянуты и перенасыщены карибскими звуками steel drums и другой
    перкуссией.


    Music for you, and for me sometimes.'
