- id: 200
  author: Дмитрий Казанцев
  mark: 6
  date: '2003-08-29'
  text: 'Второй альбом на Уорнере (и 13-ый у Тажа вообще). Это саундтрек к одноименному
    почти прокоммунистическому <a href="http://www.allmovie.com/cg/avg.dll?p=avg&sql=1:86146">фильму
    об Анджеле Дэвис и Джордже Джексоне</a> (это черные якобы коммунисты-активисты).
    Саундтреки - это почти всегда отдельная история, и их нельзя равнять с номерными
    альбомами, но бывают и исключения. На этом альбоме 9 треков, и все они вполне
    "вменяемые", то есть это не просто фоновая музыка, но песни и композиции.


    Очень неплох первый фолк-блюзовый трек Love Theme In The Key Of D. По-прежнему
    сильно карибское влияние в звуке группы Тажа, он слишком сильно подсел на стил-драмз
    и духовые. Трек очень длинный - 8 минут, но оставляет приятное впечатление.


    Вторая вещь Funky Butt - приятный ритм-н-блюзовый номер в среднем темпе. Пока
    все это вообще не звучит как саундтрек.


    Brother''s Doin'' Time - очень приличный блюз про черного заключенного. Никогда
    не подумаешь, что такие песни могут звучать в каких-то фильмах.


    Последняя вещь на первой стороне - Night Rider - вещь почти в стиле диско все
    с тем же островным настроением. Самый слабый трек на первой стороне.


    Вторая сторона начинается с восьмиминутного шаманского заклинания Free The Brothers.
    Перкуссия, странные звуки и все тихонечко рэпуют: "Free the brothers, free the
    brothers..." Вряд ли это можно назвать музыкой вообще. Да еще и на 8 минут! Безобразие!


    Второй трек Sentidos Dulco (Sweet Feelings) - латинская музыка встречается с регги
    и другими стилями с карибов. Есть тут и джазовые оттенки. Интересная перкуссия
    и неплохой инструментальный трек вообще.


    The Funeral March - вовсе не марш и не очень-то и похоронный, скорее похоже на
    инструментальный Пинк Флойд (как это ни странно). Приджазованный соул в медленном
    темпе.


    Malcolm''s Song - грустный инструментальный номер с жалобной мелодией и красивой
    перкуссией. Ну что тут еще добавить?


    Последняя вещь на альбоме David And Angela - это еще один не самый яркий инструментал
    в медленном темпе. На второй стороне мы все-таки дождались настоящего саундтрека!


    Оценка 3 балла, и Таж тут не виноват, формат такой фильмовой. Есть полное безобразие
    на 8 минут, есть серые фоновые композиции, но есть и отличные треки! Не так все
    плохо для 13-го альбома.'
