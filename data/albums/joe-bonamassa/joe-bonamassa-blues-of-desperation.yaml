- id: 2222
  author: Юрий Соловьев (Juergen)
  mark: 10
  date: '2016-03-31'
  text: 17й альбом блюзового вундеркинда составлен полностью из авторского материала и представляет собой блюз-рок самой высокой
    пробы. Этим альбомом Джо (которому уже давно ничего никому не надо доказывать) еще раз продемонстрировал, что из современных
    блюзменов он определенно среди самых-самых-самых. Мощный драйв плюс отличная техника и филигранное исполнение, да еще
    в комплекте с бесспорным талантом музыканта и отменным материалом однозначно делают данный диск одним из лучших у Джо.
    Джо определенно повзрослел и превратился не только в отменного исполнителя, но и хорошего композитора. В продюсерском
    кресле - мастер звука бессменный Кевин Ширли. Рекомендуется слушать громко и с удовольствием!
