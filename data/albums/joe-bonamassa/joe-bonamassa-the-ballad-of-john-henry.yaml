- id: 1539
  author: Андрей Евдокимов
  mark: 7
  date: '2009-05-18'
  text: Джо отбросил стилевые искания. Он заиграл сурово и уверенно. Это настолько тяжелый блюз, насколько это только допустимо
    на сегодня. И уводит назад в прошлое, во времена, когда прогрессивный рок строился на блюзовой основе. И соответственно
    без доли мистической начинки тоже не обошлось. За исключением одной слезливой баллады под Гэри Мура двадцатилетней давности,
    остальные песни исполнены с подкупающей серьезностью, перенасыщены продуманными гитарными соло. Почитателям традиционного
    блюза здесь искать нечего (да не обманет вас традиционалистское название), но для любителей громоподобного блюз-рока это
    настоящая отрада.
- id: 1844
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-06-07'
  text: 'Очередной релиз от одного из лучших современных блюз-роковых гитаристов. Альбом в традициях предыдущего (Sloe Grin
    2007) - неторопливый "вязкий" блюз-рок, мастерски сыгранный и аранжированный. Именно аранжировки и привлечение множества
    новых для Джо разнообразных инструментов заметно выделяют этот альбом из всех остальных.


    Тут нет скоростных соло и тяжеленных рифов, но зато есть то, что приходит только с возрастом (да и то, увы, не ко всем)
    - профессиональная мудрость и отточенное мастерство, и - еще раз! - роскошные аранжировки. А какой дуэт гитары и саксофона
    в The Great Flood!


    Это наиболее зрелая и разнообразная работа музыканта, которой вправе гордиться любой. Отмечу и пару отрицательных моментов
    - почти все песни медленные, быстрых номеров раз-два и обчелся. У Джо по-прежнему проблема с репертуаром: почти половина
    альбома - каверы, а записать качественную версию известного хита очень непросто. В данном случае не понравился кавер Stop!
    Сэм Браун (но это уж, как говорится, из области личных предпочтений - инструментальная середина там очень хороша, а вот
    все вокруг, увы).'
