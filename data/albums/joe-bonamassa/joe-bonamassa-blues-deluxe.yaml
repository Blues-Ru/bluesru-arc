reviews:
- id: 223
  author: Алексей Калачев
  mark: 9
  date: '2003-09-18'
  text: Вслед за альбомом в стиле английского блюз рока рубежа 60-70-х и диска в ключе
    современного американского "roots rock" Джо записал сугубо блюзовый диск. Настоящий
    гитарный contemporary blues – целая коллекция (в основном) каверверсий известных
    блюзов от Джона Ли Хукера до Би Би.
- id: 1848
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-07'
  text: 'Джо Бонамасса - один из сравнительно молодых, но чрезвычайно талантливых
    современных гитаристов, уверенно чувствующий себя и в блюзе, и в роке.


    Blues Deluxe - его третий студийный диск, и первый преимущественно блюзовый альбом,
    на котором Джо дает современную авторскую интерпретацию смеси американского блюза
    дельты и британского блюзового бума 60-х. Собственных треков три, остальное каверы.
    Тут есть и слайд, и акустика, и электричество, а также несомненное мастерство
    и бережное обращение с оригиналом.


    Восьмое место в топе блюзовых альбомов Биллборда, которое вполне оправдано.'
