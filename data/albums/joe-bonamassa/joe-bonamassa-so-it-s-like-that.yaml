- id: 32
  author: Алексей Калачев
  mark: 6
  date: '2002-10-26'
  text: Новый альбом обманет надежды тех, кто надеется застать на нем музыку предыдущего опуса Джо – "A New Day Yesterday".
    В 2001 году Бонамасса сделал по-настоящему потрясающую пластинку в стилистике английского блюз-рока начала 70-х годов.
    Теперь - другое, и название на это намекает – "Ну, вот так…". Во-первых, альбом двойной, вторая часть – ДиВиДи, видео.
    Собственно, музыкальный диск тоже выполнен в стилистике так называемого "roots rock", то есть рока, принципиально основанного
    на ритм-энд-блюзе и кантри. В конце концов, музыка Ван Халена, "Де Маутин", "Ганз энд Роузез", Брайана Адамса  - тоже
    "рутс мьюзик". Джо Бонамасса в новом альбоме по-прежнему не самостоятелен в выборе стиля, он ориентируется в данном случае
    на патриархов, но выходцев с родного континента. Американский блюзрок. Во всяком случае, то, что американцы так называют.
