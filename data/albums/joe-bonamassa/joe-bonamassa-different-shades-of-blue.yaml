  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2014-09-23'
  text: 'Джо Бонамасса - одна из ключевых фигур современной блюзовой сцены, талантливейший гитарист, который с каждым годом
    все больше заявляет о себе также и как вокалист, и как композитор. Джо воистину "многостаночник": он не ограничивается
    только сольной карьерой в блюз-роковой стилистике, но также периодически играет в группах Black Country Communion (преимущественно
    хард-рок) и Rock Candy Funk Party (фанк). Кроме того, записывает успешные совместные альбомы с Бет Харт и Махалией Барнс.


    Очередной сольный альбом Джо вышел 23 сентября 2014 года. Это первый его студийный сольник после Driving Towards the Daylight
    двухлетней давности, и первый альбом за всю карьеру, состоящий полностью из авторского материала (за исключением заглавного
    инструментала авторства Джимим Хэндрикса). Альбом создавался в Нэшвилле, запись осуществлена в Лас-Вегасе, продюсировал
    вновь Кевин Ширли, с которым Бонамасса работает уже не один год. По словам Джо, он решил наконец записать авторский блюзовый
    альбом, в котором он постарался сделать все лучше, чем это было на его предыдущих работах. Насколько ему это удалось -
    судить слушателю, однако количество использованных преимущественно винтажных гитар (19) и усилителей (13) демонстрирует
    тщательный подход к звучанию.


    Аккомпанировали при записи музыканты, с которыми Бонамасса работает уже не первый раз. Стилистически диск довольно разнообразный
    - представлен и блюз-рок, и хард-рок, и фанк с духовыми (духовая секция присуствует где-то в половине треков). Сыграно
    отменно, записано хорошо, но, честно говоря, я ожидал бОльшего - видно надеялся, что за пару лет перерыва Джо сделает
    большой шаг вперед, а он предпочел остаться на месте. Отсутствие по настоящему запоминающихся песен по-прежнему характерно
    для этого прекрасного инструменталиста.


    Резюмируя, можно сказать, что новая работа вполне достойная, но не выдающаяся. Впрочем, она почти наверняка соберет достаточное
    количество наград и дифирамбов. Альбом добрался до первого места в топе блюзовых альбомов 2015 года и до 8 места в чартах
    Биллборда.


    Расширенное издание от Best Buy включает 3 бонусных трека: ничем особенно не поразивший Black Irish Eyes, чуть более интересный
    Better the Devil You Know и, наконец, вполне симпатичный блюз Scarlet Town.'
