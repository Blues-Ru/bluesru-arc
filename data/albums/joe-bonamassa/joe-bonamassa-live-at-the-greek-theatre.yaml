  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2016-09-30'
  text: "•\tThere isn't another bluesman on the planet who could take on the challenge of a whole set devoted to the work\
    \ of the Three Kings (BB, Albert and Freddie) and make it sound so effortless.\n\n- 4.5/5 - Total Guitar Magazine\n\n\
    •\t\"Bonamassa's playing is sublime, yet Joe resists the temptation to let rip, preferring instead to reflect the ground\
    \ breaking playing of electric blues guitar's three most venerable souls. Fabulous!\n\n- 5/5 - Guitar Techniques Magazine\n\
    \n•\t\"Channelling three vocalists and guitarists whose styles are so fundamentally different is no mean feat, and Bonamassa\
    \ manages it, filtering the flair of Freddie, the evil streak of Albert and the dynamics of BB King into his own slick\
    \ style.\"\n\n- 9/10 - Guitar & Bass Magazine\n\nОчередной концертный альбом от гитариста-многостаночника, записанный\
    \ в Лос-Анджелесе по итогам его турне 2015 года, посвященного музыке трех блюзовых королей: Альберта Кинга, Фредди Кинга\
    \ и ВВ Кинга.\n\nЕсли честно, у меня отношение к данному диску неоднозначное. То ли Бонамассе не дает покоя пример Билла\
    \ Уаймана с его Willie and the Poorboys и затем The Rhythm Kings, то ли Кевин Ширли очередную идейку подбросил (думаю,\
    \ уж без Кевина точно не обошлось), но наш неутомимый Джо уже начал превращаться в какой-то кавер-бенд - в этот раз под\
    \ раздачу попали сразу три блюзовых гранда. Конечно, удобно использовать уже проверенный беспроигрышный рецепт для выколачивания\
    \ долларов у преданных фэнов за счет творческого переосмысления классики блюза, соул или фанка (было два студийника и\
    \ концертник с Бет Харт, потом студийник с Махалией Барнс, да и сам ряд концертников наваял), но сколько же можно? Интересно,\
    \ кто из грандов окажется следующим?\n\nИтак, что мы имеем в этот раз: продюсер тот же, музыканты практически те же (что\
    \ и в турне по Мадди Уотерсу и Хаулин Вулфу), подход тот же, ассортимент используемых винтажных гитар тот же, только вот\
    \ репертуар другой. В конце концертного сета добавлен один студийный трек, сочиненный специально по поводу. В целом все\
    \ высокопрофессионально сыграно и спето, все музыканты мирового уровня, Джо демонстрирует отменную технику и повышенную\
    \ скорострельность нотоизвлечения. Вот только не чувствуется искренности и не оставляет смутное ощущение даже не вторичности,\
    \ а какой-то третичности данного диска - ведь еще в начале 90х прошлого века Гэри Мур давал аналогичные концерты с похожим\
    \ материалом и духовой секцией, но при этом приглашал на сцену Альберта Кинга и Альберта Коллинза.\n\nКонцерт, конечно,\
    \ хороший, и наверняка найдет своего слушателя и зрителя (выходит также версия на блюрее), Джо отличный музыкант, но у\
    \ меня все равно остаются какие-то негативные эмоции, которые даже трудно определить словами."
