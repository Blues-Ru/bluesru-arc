- id: 2136
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2013-06-20'
  text: 'Тринадцатый сольный альбом Джо, несмотря на "несчастливый" номер, вознесся на первое место среди блюзовых альбомов
    Биллборда. Диск записан в Лас-Вегасе с помощью продюсера Кевина Ширли, с которым Бонамасса уже работал не раз - в частности,
    там же в Вегасе над альбомом You and Me. Вместо музыкантов, аккомпанирующих гитаристу во время турне, для записи были
    приглашены опытные студийные музыканты, включая Брэда Уитфорда (Aerosmith), Блонди Чаплин, Антона Фига и др. Сам Джо сочинил
    4 песни из 11, заполнив диск своими интерпретациями как блюзовой классики (Роберта Джонсона, Хаулин Вулфа и Уилли Диксона),
    так и современных авторов (Тома Уэйтса. Билла Уитерса). Тягучий блюз Берни Марсдена (A Place in my Heart) усилен духовой
    секцией Jeff Bova and the Bovaland Brass. Последний трек принадлежит перу австралийского певца Джимми Барнса, который
    украсил его своим вокалом.


    В итоге получился альбом типичного для Бонамассы техничного блюз-рока, который, пожалуй, даже более жесткий и тяжелый,
    чем на предшествующих дисках. Музыка порезче и одновременно попроще и попрямолинейнее, хотя мастерство гитариста слышно
    невооруженным ухом, и солирует Джо отменно. На мой взгляд, недостаток диска заключается в том, что он принципиально ничем
    не отличается от того, что делал Джо и до этого, но при этом в музыкальном плане это своего рода шаг назад (или уж по
    крайней мере точно топтание на месте) по сравнению с его более утонченным предшественником Dust Bowl. Хотя, возможно,
    именно такое упрощение и стало причиной коммерческого успеха - большее число слушателей оценило конечный продукт. Резюмирую:
    диск хороший и наверняка найдет своего слушателя не только у поклонников Джо, но это не лучший диск Бонамассы.


    Whatever the future holds for Joe Bonamassa, at this moment he is on a run of unprecedented form and every release should
    be savoured and cherished as musicians like him don''t come around too often. Yes, the blues is cool again and he is the
    undoubted king. Long may he reign.


    - Simon Ramsay (Stereoboard, UK)'
