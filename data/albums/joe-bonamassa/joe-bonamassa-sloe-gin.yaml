  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-06-07'
  text: 'В 2007 году Джо стал лучшим блюзовым гитаристом по итогам опроса журнала
    Guitar Player, и выпустил очередную пластинку.


    Седьмой сольный альбом Джо - наверное, самый спокойный и элегантный из всех предыдущих.
    В какой-то мере это продолжение курса, взятого на альбоме Blues Deluxe, но уже
    на принципиально новом уровне мастерства. Здесь Джо попытался соединить тяжелый
    блюз с акустическими структурами, навеянными первым альбомом Рода Стюарта 1969
    года. Вновь присутствуют струнные, Джо акцентирует внимание на акустике и вокальных
    партиях, хотя и про гитару не забывает. Одним словом, меньше грохота, больше творчества.
    Собственных композиций только 4, остальные - каверы. Альбом не очень характерен
    для предыдущего творчества Бонамассы, но тем и он интересен - это работа зрелого
    мастера, который не боится отойти с уже проторенной дорожки и поэкспериментировать.
    Есть все предпосылки того, что следующий альбом Бонамассы станет чем-то особенным.


    Первое место в блюзовых чартах Биллборда.'
