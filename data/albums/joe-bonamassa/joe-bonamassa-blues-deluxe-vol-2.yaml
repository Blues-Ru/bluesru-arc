  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2023-12-07'
  text: 'Blues Deluxe Vol. 2 - шестнадцатый студийник Джо, вышедший 6 октября 2023 года на лейбле J&R Adventures. До выхода
    альбома с него было выпущено 5 синглов - "I Want to Shout About It", "Twenty-Four Hour Blues", "Well, I Done Got Over
    It", "Lazy Poker Blues" и "Hope You Realize It (Goodbye Again)". Этот диск является логическим продолжением альбома Blues
    Deluxe, выпущенного в 2003 году 20 лет назад, и был задуман в качестве дополнения к юбилейному переизданию исходного диска.


    Этим альбомом Бонамасса хотел показать, насколько он продвинулся за последние 20 лет как исполнитель. Аналогично альбому
    2003 года, на втором Blues Deluxe два авторских трека и восемь интерпретаций блюзовой классики - в этот раз под раздачу
    угодили песни Бобби Блэнда, Алберта Кинга, Питера Грина, Ронни Эрла, Кенни Нила и др. Продюсировал Джош Смит. На девятом
    треке присутствуют гости - Джош Смит и Кирк Флетчер, которые поют и солируют попеременно с Бонамассой.


    В аннотации к альбому Джо заметил следующее: "Контраст между дерзким 26-летним и солидным 46-летним человеком значителен.
    Горит ли огонь так же ярко, как раньше? Испытываю ли я прежнюю жажду творчества? Достаточно ли я хорош, чтобы отдать дань
    уважения героям моих песен? Ответ лежит где-то в этом альбоме".


    На выходе имеем отменно сыгранный и записанный альбом традиционного блюза с духовыми, созданный профессионалами мирового
    класса. Однако звучит он при этом как-то пресновато, без изюминки - группа похожа на хорошо смазанную машину, которая
    честно выполняет свою работу, не вкладывая в нее душу. И если альбом 2003 года звучал более энергично и искренне, то вторая
    часть смахивает на диск, который просто уже надо было выпустить по графику (предыдущий-то студийник был аж 2 года назад,
    и тот альбом Time Clocks был вполне достойный). Понятно, что музыкант класса Бонамассы плохих альбомов не выпускает, но
    и назвать Blues Deluxe 2 хорошим альбомом язык не поворачивается (хотя он не лишен нескольких приличных треков - например,
    Is It Safe To Go Home или Twenty-Four Hour Blues). Увы, Blues Deluxe 2 следует формуле 20-летней давности и не содержит
    ничего принципиально нового (в отличие от предыдущего достаточно интересного альбома Time Clocks, где есть заигрывания
    с прогрессивным роком). Джо лишний раз демонстрирует свою феноменальную технику и умение подобрать высококлассный сопровождающий
    состав, но итог достаточно однообразен и даже скучен - все это уже было на предыдущих дисках Бонамассы, причем было уже
    не раз. Причина в том, что Джо знатный подражатель и прекрасный технарь, но довольно посредственный творец.'
