- id: 1847
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-07'
  text: 'Диск 2006 года "You & Me" (пятый студийный сольник музыканта), неожиданно сместил акценты в видении многогранного
    таланта Бонамасы: хотя музыкант твердо держался корней, на первый план выдвинулся его по-настоящему сильный голос и возможности
    композитора. Звуковая палитра альбома заметно расширилась за счет активного использования клавишных. В записи Джо помогал
    ряд довольно известных в мире музыки товарищей.


    На диске 4 собственных композиции и 7 каверов, включая цеппелиновский Tea for One (на нем поет Дуг Хенторн). Среди гостей
    также Пэт Тралл (вторая гитара на Bridge To Better Days) и молодое дарование - 12-летний харпер ЛД Миллер (Your Funeral
    And My Trial). Продюсировал и микшировал альбом Кевин Ширли.


    На мой взгляд, это бесспорно одна из лучших пластинок Бонамассы из записанных ранее - хотя она, пожалуй, более хард-роковая
    или, если угодно, блюз-роковая, нежели чисто блюзовая, но зато это уже работа зрелого мастера. Альбом занял первое место
    в топе блюзовых альбомов Биллборда.'
- id: 2269
  author: Олег Пчелкин (oleg_spb)
  mark: 9
  date: '2017-04-20'
  text: 'В 2006 году на Provogue Records выходит этот альбом Джо Бонамассы , о котором он сам тогда говорил так. " Это шаг,
    который я хотел сделать в своем личном музыкальном движении. С помощью современной супергруппы музыкантов - Джейсон Бонхэм
    -ударные (сын ударника Led Zeppelin), Кармин Ройяс -бас, Даг Хензорн -вокал на Tea For One, Рик Мелик -клавишные, Пат
    Трал - вторая гитара, - мы сконцентрировались на тяжелой музыке , сыграв ее в блюзовом стиле.


    Я хотел сделать блюзовый альбом, а не рок альбом с блюзами. Ведется много разговоров в наше время, что такое блюз, а что
    -нет, многие альбомы страдают от апологии в саунде блюза, я рискнул, решив остаться в границах жанра, в тоже время открыв
    их пошире,нарушив правила."


    Этот, скажем так, ледзеппелиноподобный альбом начинается с кавера песни Чарли Паттона (Charly Patton) High Water Everywhere,
    записанной впервые в 1929 году и посвященной катастрофическому разливу Миссиссиппи в 1927 году. Получилось что-то такое,
    как если бы Led Zeppelin в далеком 1969 году решили вставить в свой первый альбом по просьбе продюсера песню Паттона и
    сделать это по- тогдашнему.


    Следующая песня альбома, Bridge to Better Ways, уже авторства самого Бонамассы, логически продолжает первую. Третий трек,
    тоже авторства Бонамассы Asking Around You - тривиальный медленный блюз, очередная более или менее удачная вариация на
    тему I need you Love so Bad Мертиса Джона младшего.


    Пафосный кавер в стиле " since I ve been loving you" завершает первую сторону альбома , это- исполнявшийся многими блюзменами
    ранее хит Пола Маршалла (Paul Marshall) So Many Roads, So Many Trains . Об этом Маршалле, кстати, неизвестно просто ничего.
    Совершенно. Косвенным образом можно утверждать, что он был, возможно, пианистом, рискнувшим сочинить текст к собственной
    мелодии.


    Шаффл Дона Робби I don''t Believe открывает вторую сторону альбома, блюз этот совершенно не тяжелый (а ведь Бонамасса,
    напомним, обещал альбом тяжелого блюза), также, как и следующий за ним кавер Рая Кудера Tamp Em Up Solid.


    Седьмым по счету следует маловразумительный, но, видимо, многозначительный медитативный инструментал Django, написанный,
    как следует из текста иллюстрированной вкладки, под впечатлением от (довольно заурядной) вещицы Vous Et Moi (Ты и я, вот
    откуда название-то всего альбома) авторства Роберта Босмана и Этьена Лефевра, которую Бонамасса замедлил раза в три, если
    не в пять.


    Кавер Планта и Пейджа Tea For One сделан Бонамассой с душой и качественно, в сольной партии гитары хватает и драмы и трагедии.
    Бонамасса дает понять, что его собственный вокал высот отчаяния самого Планта достигнуть не в состоянии и поэтому в качестве
    вокалиста появляется нанятый на одну эту песню музыкант и продюсер из Индианы Дуг Хензорн или Хентхорн (Doug Henthorn
    )


    Чтобы придать альбому еще больше схожести с творчеством Led Zeppelin весьма кстати вставлен акустический инструментал
    Trees Helicopters and Gasoline. Ну чем не какой-нибудь Gallows Pole ? И опять же этот трек должен дать нам представление,
    или хотя бы намек, какой Бонамасса еще и крутой акустический гитарист.


    Не длинный, но качественный кавер-шаффл авторства Сонни Боя Уильямсона Your Funeral and My Trial Бонамасса поет и играет
    безупречно.


    Под занавес исполняется вещица Бонамассы и Грега Саттона Thorn Down, Так себе тяжелая вещица, альбом спокойно обошелся
    бы и без нее.'
