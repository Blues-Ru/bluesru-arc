  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2021-11-18'
  text: 'Time Clocks - пятнадцатый студийный сольник Бонамассы, изданный 29 октября
    его лейблом J&R Adventures в Америке и лейблом Provogue в Европе. До этого были
    выпущены синглы "Notches", "The Heart That Never Waits" и "Time Clocks", на эти
    же треки были сняты официальные видео.


    Первоначально Джо планировал записать альбом в составе трио, но в процессе работы
    диск перерос в наиболее авантюрную и сложную работу музыканта. Продюсер Кевин
    Ширли считает, что "Бонамасса создал по-настоящему переходный альбом - от блюзового
    музыканта к суперзвезде". Для микширования был приглашен легендарный зукоинженер
    Боб Клиармоунтайн, который заявил: "Это один из лучших альбомов, которые мне посчастливилось
    сводить на протяжении многих лет. Джо не только один из лучших блюз-роковых гитаристов
    нашего времени, он также прекрасный автор песен, и это очевидно на данном альбоме".


    Диск был записан в Нью-Йорке. Джо вспоминает: "В феврале 2021 года мы оказались
    в студиях Germano и пытались записываться в формате трио (хотя музыка предполагала
    бОльшее число музыкантов). Нам пришлось придумать способ записывать музыку в ситуации,
    когда наш продюсер (Кевин Ширли) застрял в Австралии из-за ковидных ограничений
    на переезды. Но Кевин придумал способ соединить континенты и микшерские пульты
    таким образом, чтобы практически устранить задержки. Добавим в микс Стива МакКея
    (бас) и Антона Фига (ударные), несколько масок и ругательств - и у нас получился
    нью-йоркский альбом под названием ‘Time Clocks''".


    Диск получился довольно разнообразным - Джо разбавил свой фирменный блюз-рок элементами
    кантри, американы и даже прогрессивного рока. Правда, начинается диск довольно
    традиционно, и все стилевые новинки сосредоточены во второй половине альбома.
    Из первых четырех треков отмечу только "The Heart That Never Waits" - песня хоть
    и в традиционном для Бонамассы стиле, но мелодична и хорошо сделана (в отличие
    от прямолинейной хард-роковой "Notches" (правда, с фолковыми вкраплениями) и невнятного
    заглавного трека с привкусом кантри, не слишком характерного для Бонамассы). Следующие
    два трека вполне приличные, но без особых откровений (хотя присутствует неожиданно
    "цыганский" кусочек где-то на 2:20 в Questions And Answers и достойное соло в
    следующей балладе). Зато на следующих двух явно присутствует дух прогрессивного
    рока - кашмирообразная Curtain Call с восточными мотивами и оркестром, а также
    пасторальная The Loyal Kind с мощным припевом и средневековым кельтским привкусом
    (написана в соавторстве с Берни Марсденом, что в какой-то мере может объяснить
    такое звучание), и эти композиции определенно среди лучших треков альбома. Предпоследний
    трек вполне блюз-роковый и традиционный для Бонамассы, а финальная Known Unknowns
    включает американо-фолковые элементы и хорошее развернутое соло.


    Диск занял третье место в Германии, четвертое в Швейцарии, 13-е в Англии и 15-е
    среди независимых альбомов Биллборда. Работа вполне приличная (впрочем, музыкант
    такого уровня явного отстоя не выпускает), но определенно не лучшая у Джо - материал
    не только разноплановый (что в общем-то даже хорошо), но и довольно неоднородный
    по качеству (в результате чего диск слушать полностью нет желания).'
