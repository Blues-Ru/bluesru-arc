- id: 1622
  author: Андрей Евдокимов
  mark: 8
  date: '2010-04-20'
  text: '10-й альбом в сольной дискографии Джо записывал в Греции, в студии Black Rock. Присутствие греческих музыкантов с
    национальными инструментами сути звучания не меняет: энергичный рок с блюзовыми корнями. Куда примечательней выбор песен:
    несколько старых блюзов (от Блайнд Боя Фуллера до Отиса Раша), британский "прогрессив" бурных 60-х, дуэт с королем блюза
    в "золотом" американском стандарте "Night Life" (который БиБиКинг впервые записал как раз за 10 лет до рождения Бонамассы),
    плюс сочинения таких мастеров, как Джо Хиатт и Леонард Коэн – составляют чуть больше половины альбома. Выставлять собственные
    сочинения вперемежку с поп-, рок- и блюз-классикой – это дерзко… И, как минимум, просто любопытно, как гитарный герой
    с ярко индивидуальным почерком игры управится со столь широким временным и стилистическим музыкальным полем. Иногда, например,
    Бонамасса мастерски копирует дух и букву Led Zeppelin.'
- id: 1843
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-07'
  text: 'Десятый студийный альбом блюз-рокового виртуоза был записан в Греции в студии Black Rock (отсюда и название альбома).
    Сам Джо и продюсер Кевин Ширли хотели добавить некоторый колорит world music в конечный продукт, и на паре-тройке треков
    действительно звучат греческие инструменты, расширяя музыкальную палитру альбома.


    Несмотря на стилистическое разнообразие, бОльшей частью альбом все-таки блюз-роковый, тяжелый и техничный (хотя не обошлось
    и без акустики). Джо написал пять треков, остальные - каверы (пара-тройка из этих песен прозвучали на московском концерте
    Джо). На треке Night Life присутствует особый гость - ББ Кинг, который в далеком 1990 году оказал уважение и поддержку
    никому тогда неизвестному молодому гитаристу Джо Бонамасса. В результате получился довольно любопытный дуэт двух блюзовых
    музыкантов, украшенный духовыми.


    Братья японцы, как обычно, отличились, и выпустили данный диск в виде комплекта DVD+CD. Материал, представленный на ДВД,
    не является новым (это куски выступлений Джо с других его официальных ДВД). Зато на КД добавлено два бонусных трека, которые
    до этого нигде не издавались.'
