  text: '"Dust Bowl is very firmly rooted in the Blues, but definitely explores the outer reaches of the genre and showcases
    Joe''s amazing virtuosity as he digs deep into his psyche in some lengthy and blistering guitar solos." - Kevin Shirley


    "This is the best album we''ve ever done. I''m finding more inspiration in storytelling in my 30s, in writing songs that
    are about something more profound than ‘my baby left me.'' I like albums that are made with the right intentions and sound
    organic and a little rough around the edges, like a great band playing live in the room, and that''s what we accomplished
    with Dust Bowl." - Joe Bonamassa


    2010 год был очень удачным в карьере Джо Бонамассы: альбом Black Rock стал наиболе успешным его сольником. Сам музыкант
    получил звания "титана блюз-рока" от журнала Guitar World, а также по итогам опроса читателей журнала Guitar Player стал
    "лучшим гитаристом" (впервые) и "лучшим блюзовым гитаристом" (четвертый год подряд).


    А вот и новый сольный альбом подоспел! Он был записан на студиях в Греции, Нэшвилле, Малибу и Лос-Анжелесе, и сочетает
    сырую блюзовую основу с высокотехничным блюз-роком. Сам Джо считает этот альбом лучшим из того, что ему удавалось сделать
    ранее. Около половины материала написано самим Бонамассой. Заметный вклад в музыку внесли именитые приглашенные гости:
    Джон Хайатт и Винс Джилл добавили долю нэшвилльского саунда на треках с их участием, Гленн Хьюс спел Heartbreaker из репертуара
    Free, а на треке No Love on the Street поучаствовали Бет Харт и Блонди Чаплин. Аккомпанировали при записи известные музыканты,
    с которыми Джо работает не один год: бас-гитарист Кармин Рохас, ударник Антон Фиг и клавишник Риз Уайнанс. Продюсировал
    и микшировал альбом Кевин Ширли.


    Альбом техничный, разнообразный, интересный, и наверняка займет достойное место в коллекциях любителей современного блюз-рока.
    А если бы Джо уделял побольше внимания не скорострельности нотоизвлечения, а мелодичности композиций, то цены бы ему не
    было :-)


    Альбом занял первое место в топе блюзовых альбомов Биллборда.'
