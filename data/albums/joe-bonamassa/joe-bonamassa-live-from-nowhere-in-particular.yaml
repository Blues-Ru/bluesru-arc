- id: 1845
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-07'
  text: 'Двойной концертник от одного из ведущих блюз-роковых гитаристов современности.
    Тут есть все - и техника, и мастерство, и драйв, и мошь, и энергетика. Есть и
    акустические куски, есть и длинные импровизации. Исполняется материал в основном
    с двух предыдущих студийных альбомов - You and Me (2006) и Sloe Gin (2007) - по
    пять треков с каждого. Продюсировал и микшировал альбом Кевин Ширли.


    Диски записаны очень прилично, так что слушать - одно удовольствие. Любители блюз-роковой
    гитары будут слушать и переслушивать :-)


    Альбом занял первое место в топе блюзовых альбомов Биллборда.'
