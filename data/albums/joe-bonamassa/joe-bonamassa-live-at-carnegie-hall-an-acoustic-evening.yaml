  text: '‘Despite being among the most ambitious things I''ve done - I played with
    a 9 piece acoustic band - It came out great. It was a typical Joe freak show.''
    (Joe Bonamassa)


    Очередной двухдисковый концертный альбом от неутомимого гитариста-многостаночника
    - по счету это пятнадцатый концертник Джо, но только второй акустический (до этого
    был акустический сет в Вене 2013 года). На диск попали акустические выступления
    21 и 22 января 2016 года в знаменитом нью-йоркском зале Карнеги Холл. В программе
    представлены как альтернативные аранжировки хорошо известных хитов Бонамассы,
    так и новые песни, включая три кавера (How Can a Poor Man Stand Such Times and
    Live? слепого Алфреда Рида, Hummingbird Леона Расселла, The Rose от Бет Мидлер
    да плюс не совсем кавер - Song Of Yesterday из репертуара Black Country Communion).


    Во время концерта Джо аккомпанировали его старые соратники Риз Уайнанс (фортепиано)
    и Антон Фиг (ударные), а также мультиинструменталист Эрик Базилиан (мандолина,
    саксофон, гитары), египетский перкуссионист Хосам Рэмзи (игравший с Пэйджем и
    Плантом во время турне Unledded) и, наконец, талантливая китайская виолончелистка
    Тина Гуо, играющая также на двухструнной китайской скрипке. На бэк-вокале - трое
    австралийских вокалистов, включая Махалию Барнс.


    Концерт начинается с интро к Locomotive Breath Jethro Tull, плавно перетекающего
    в This Train. Еще одна узнаваемая цитата - "полет шмеля" на Woke Up Dreaming.
    Акустические аранжировки и весомый вклад восточных музыкантов привносят в блюз
    Джо изрядную долю джаза и world-music, поэтому для упертых поклонников "тяжелого"
    блюз-рокового Бонамассы данный диск может оказаться не слишком интересным. Однако
    первоклассный состав музыкантов, новые необычные аранжировки, атмосфера исторического
    концертного зала и высочайшее качество исполнения дают нам прекрасный повод для
    того, чтобы получить удовольствие от прослушивания данного концерта.


    Продюсировал диск неизменный Кевин Ширли.'
