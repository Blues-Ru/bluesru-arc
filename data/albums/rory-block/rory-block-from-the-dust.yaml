- id: 575
  author: Андрей Евдокимов
  mark: 3
  date: '2005-04-11'
  text: '14 песен во славу Творца, исполненные с придыханием и трепетом, понравятся не всем. Неоспоримо, что Рори Блок на
    сегодня – одна из самых лучших исполнителей на гитаре слайдом. Новый ее альбом демонстрирует это лишний раз. Т.е., можно
    было бы и не демонстрировать. Пусть с точки зрения гурманов акустической гитары этот сольный альбом достоин самого пристального
    внимания (Хотя принцип "соло" несколько нарушен, поскольку в некоторых трэках использовано наложение нескольких партий).
    Но общую благостную атмосферу альбома именно любителям блюза трудно будет переварить. К середине альбома становится скучно
    до зевоты. Тут музыка несколько оживает – Блок заиграла блюзовую классику Сона Хауса, Чарли Пэттона и Роберта Джонсона.
    Особо интересна песня I Be Bound Мадди Уотерса, прямая предшественница знаменитой I Can''t Be Satisfied. Но после "классического
    сета" энергетика иссякает, и дальше Блок поет благозвучные романсы собственного сочинения, и только заглавная песня является
    собственно блюзом. Многим дамам понравилась бы эта салонная религиозность, если бы все звучало на родном языке... Тем
    более, что с женской последовательностью певица посвятила этот альбом религиозных песен своим четырем собакам и в буклете
    к довольно пространно уговаривает всех скорее спасать собак. Дело богоугодное, кто ж спорит?! Да оно и попроще, чем души
    спасать.


    (сокращенный вариант был опубликован журналом Play)'
- id: 833
  author: Дмитрий Казанцев
  mark: 7
  date: '2005-08-24'
  text: 'Аврора "Рори" Блок. 56 лет, а выглядит прекрасно. Вряд ли дама с такой внешностью на самом деле "имеет блюз", но
    это и необязательно для нее; Рори - виртуозная гитаристка и великолепная певица. На этом альбоме она играет 10 своих песен
    в стиле фолк-госпел-кантри-блюз и еще 4 блюзовых кавера: "High Water", "I Be Bound", "Stones In My Passway" и "Dry Spell
    Blues". Блок сама себе подыгрывает на разных гитарах и подпевает - кроме нее на записи никого нет. Она использует слайд
    и стил-гитары, а также перестроенные гитары и добро. По звуку ее игра похожа на игру Лео Коттке, а это великий мастер
    акустической гитары.


    Не все песни здесь на пятерку, есть явно проходные вещи и почти дурацкая песенка про собачек Рори, но в целом, альбом
    хорош и разнообразен (нет никакого занудства и истерики). И это совсем не копирование и не попса - очень важный момент
    в женском творчестве.'
