reviews:
- id: 366
  author: Алексей Калачев
  mark: 4
  date: '2003-12-15'
  text: 'Рори – ведущая исполнительница из того направления белых интерпретаторов черного кантри блюза, которое зародилось
    в Штатах еще в конце 40-х. В сущности, она фолк-певица узкого профиля, чье увлечение блюзом пошло от потрафивших вкусам
    белых Лидбелли и дуэта Терри-Макги, хотя сама Блок называет массу других влияний. Это направление поклонников фолка породило
    в итоге Джоан Баэз, Саймона и Гарфанкела, Боба Дилана. Многочисленные диски Рори у нас покупаются плохо, ее пресноватое,
    часто "крикливое" пение в России воспринимают равнодушно.


    Но на нынешнем диске, записанном с большим умением и пониманием, во-первых, с большим свингом, более гибко и объемно звучит
    ее действительно очень хорошая слайд-гитара! Если вы коллекционируете диски блюзовых вокалисток и вам нужно "что-нибудь
    из Рори Блок", остановитесь именно на этом.'
