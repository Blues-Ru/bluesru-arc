  author: Андрей Евдокимов
  mark: 7
  date: '2009-02-05'
  text: Имя более известное слушателям блюза "вживую" нежели собирателям записей.
    Филофонисты знают его главным образом по гостевым появлениям в альбомах блюзовых
    корифеев. Именно так он обрел репутацию одного из лучших мастеров игры слайдом
    нового поколения, приверженца акустики и пламенного ревнителя традиций. Однако
    пятый именной альбом в дискографии Харта разочарует традиционалистов с порога.
    В составе трио единомышленников он играет старый добрый блюз-рок... Примерно такой,
    как мечталось услышать от группы Guess Who, но в балладах Харт идет еще дальше
    от блюза в сторону оптимистичной эпичности Bon Jovi. Программа очень хороша для
    бурной вечеринки. Любителям блюза остается поздравить Харта с тем, что в 40 лет
    он ушел от акустического блюза в сторону энергичного гаражного рока, где его мастерство
    гитариста - избыточно.
