  date: '2005-05-30'
  text: 'Интересный альбом Купера и Отиса, он вышел как продолжение к Super Session
    by Al Kooper, Mike Bloomfield & Stephen Stills, но здесь совсем другая музыка
    и атмосфера. На гитаре играет молодой 17-летний Шэгги Отис - сын знаменитого Джонни
    Отиса.


    Купер убедительно поет на этом диске, а некоторые вещи полностью инструментальные.
    Эл создает волшебный подклад на клавишах, а Отис классно играет на соло-гитаре
    (трудно поверить, что это конец 60-х). 3 (блюзовые) композиции написаны Отисом
    и Купером, а еще 4 - каверы. Очень хорош вариант "Bury My Body" (хит у Animals),
    отличный блюз-рок в "One Room Country Shack", "Looking For A Home" - приятная
    вещь в кантри-соуловом ключе.


    Хорошая блюзовая музыка конца 60-х; редкий и нужный альбом.'
