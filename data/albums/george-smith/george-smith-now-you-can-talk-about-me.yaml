  author: Сергей Исправников
  mark: null
  date: '2008-05-24'
  text: 'Несмотря на культовый статус одного из ведущих послевоенных харперов и наличие
    успешных учеников и последователей в лице Rod Piazza, Charlie Musselwhite, Kim
    Wilson, при жизни Джорджа Смита записывали сравнительно немного, а что касается
    CD-изданий, то их и того меньше. Данный диск дает возможность услышать как его
    сингловые записи первой половины 60-х гг., так и последние сессии, сделанные в
    апреле 1982 г.


    Уроженец Helena, штат Арканзас, в конце 1955 г. Джордж Смит обосновался в Лос-Анджелесе.
    После утраты контракта с лейблом Modern он периодически записывал синглы на небольших
    локальных фирмах грамзаписи, причем как правило под псевдонимами Harmonica King,
    Little Walter Junior и т.д. Впоследствии игравший с ним Род Пьяцца вспоминал,
    что когда они встретились никто не знал Джорджа, как Джорджа Смита, все называли
    его Little Walter или Big Walter. Да и сам Пьяцца сначала решил, что это Big Walter
    Horton, а не Джордж Смит. Первые пять треков данного диска отражают сотрудничество
    Джорджа Смита с продюсером и владельцем лос-анджелесских лейблов Sotoplay и Carolyne,
    Нэтом Мак-Коем, который начиная с 1960 г. выпустил порядка десяти его синглов.
    Аккомпанировали ему местные музыканты: гитаристы Marshall Hooks и Pete Lewis,
    басист Curtis Tilman, ударник Chuck Tomas и пианист J.D.Nicholson. Последний,
    как и большинство остальных лос-анджелесских блюзменов, играл с кем возможно и
    где возможно. Помимо Смита, он аккомпанировал таким звездам, как Джимми Рид, Джонни
    "Guitar" Уотсон, Пи Ви Крэйтон, а также сделал около дюжины сольных записей. Из
    включенных в данный компакт-диск записей данного периода особенно стоит отметить
    инструментал Смита –"Blowing the Blues" (1965 г.) – в полной мере демонстрирующий
    его талант как автора и виртуозного исполнителя, ставший для него своего рода
    визитной карточкой.


    Остальные две трети диска занимают сессии звукозаписи для лейбла Murray Bros.
    1982 г. Из десяти треков, включенных в изданный данной компанией LP "Boogie''n
    With George", на этот диск вошли восемь, а также одна ранее не реализованная вещь
    – пронзительный инструментал "Last Chance", полностью соответствующий своему названию.
    Не совсем понятна логика издателей компакт-диска, сокративших один из немногих
    номерных альбомов Смита, но в более полном виде эти записи в цифровом формате
    не издавались. Смиту здесь аккомпанирует группа Рода Пьяццы "Mighty Flyers", включая
    супругу Рода – пианистку Honey Piazza, гитариста Jr. Watson, басиста Bill Stuve
    и ударника Bill Swartz. В качестве гостевого музыканта в записи принял участие
    лос-анджелесский блюзмен, гитарист, а впоследствии лидер собственной группы –
    Doug MacLeod. Несмотря на серьезные проблемы со здоровьем, игра Смита здесь безупречна.
    Наряду с авторским материалом, половина которого составляют инструментальные композиции,
    Смит тряхнул стариной, исполнив лирическую "Peg O My Heart", ставшую в 1947 г.
    хитом №1 для трио "Harmonicats" (состоявшего из трех харперов: Jerry Murad, Don
    Les и Al Fiore), а также классику "Goin'' Down Slow" – хит 1941 г. культового
    блюзового автора 1930-40 гг. James Oden. Из собственных композиций Смита необходимо
    выделить, наряду с драйвовым титульным треком, джамп-блюз "Sunbird" и берущий
    за душу медленный "Bad Start". Эти сессии показали всю широту творчества Джорджа
    Смита и, к сожалению, стали для него последними – 2 октября 1983 г. он скончался
    от сердечного приступа.'
