  author: Сергей Исправников
  mark: null
  date: '2008-05-14'
  text: 'Изданный в серии "The Modern Masters", диск представляет собой коллекцию
    ранних записей исполнителя на губной гармонике Джорджа Смита, одного из звезд
    уэст-коаст блюза. Из девятнадцати записанных на альбом треков первоначально на
    синглах в период 1955-56 гг. было издано только восемь композиций. Часть впервые
    увидела свет на пластинке 1982 г., остальные – только на этом компакт-диске. По
    словам составителя данного издания, когда в начале 80-х гг. он посетил архив фирмы
    грамзаписи Modern в Лос-Анджелесе, то обнаружил сваленные на полках, покрытые
    слоем пыли коробки с записями, в большинстве случаев без каких-либо аннотаций.
    Проблемой было определить не где, когда и с какой аккомпанирующей группой была
    осуществлена та или иная запись, а в первую очередь, кто где вообще был записан.
    В конечном итоге записи Джорджа Смита были вычленены и собраны для издания на
    LP, а через десять лет – на данном диске английской фирмы Ace.


    В 1954 г. Смит, ранее успевший непродолжительное время поиграть в бэнде Мадди
    Уотерса, обосновался в Канзас-Сити, штат Миссури, где стал фронтменом локальной
    блюзовой группы, выступавшей в клубе "Orchid Room". Там в начале следующего года
    во время одной из своих регулярных поездок по глубинке для поиска талантов и налаживания
    деловых контактов его заметил Joe Bihari, владелец фирмы Modern, и подписал с
    ним контракт. В это время он арендовал в городе студию для записи популярной ритм-энд-блюзовой
    группы "Cadets", заодно записав и несколько треков Джорджа Смита. Вернувшись в
    Лос-Анджелес он издал две из них – "Telephone Blues" и инструментал "Blues In
    The Dark" – на сингле RPM 434. Это были первые сольные записи Джорджа Смита, причем
    на пластинке он был обозначен, как "Little George Smith", хотя вряд ли кто-нибудь
    всерьез назвал бы "маленьким" человека шести футов двух дюймов роста. По мнению
    известного британского продюсера и владельца независимого блюзового лейбла Blue
    Horizon Майка Вернона эти композиции были одними из величайших записей во всем
    послевоенном блюзе. Они попали на вершину региональных ритм-энд-блюзовых чартов
    и только недостаток промоушена не позволил им штурмовать национальный хит-парад.
    На записи Смиту аккомпанировал местный блюз-бэнд, из участников которого с той
    или иной степенью вероятности сейчас можно установить только гитариста Poor Bob
    Woodfork.


    Воодушевленные успехом братья Bihari в 1955 г. выпустили еще один сингл Джорджа
    Смита RPM 442 c композициями "Blues Stay Away" и "Oopin'' Doopin'' Doopin''",
    а сам Смит принял участие в ревю в компании "Чемпиона" Джека Дюпри, Эрл Кинга,
    Литтл Уилли Джона и других звезд. Турне окончилось в конце года в Лос-Анджелесе,
    где Джордж Смит и решил обосноваться. Этот город станет ему родным до конца жизни.
    В начале 1956 г. Bihari снова записали его уже в новой Culver City Studio с известным
    лос-анджелесским саксофонистом и аранжировщиком Maxwell Davies. Для уэст-коаст
    блюза Дейвис сыграл, пожалуй, роль аналогичную Уилли Диксону для послевоенного
    Чикаго. Как музыкант и аранжировщик он участвовал в записях таких исполнителей,
    как Pee Wee Crayton, Johnny "Guitar" Watson, Lowell Fulson, Z.Z. Hill, определивших
    лицо лос-анджелесского ритм-энд-блюза 50-х гг. С его помощью композиции Джорджа
    Смита приобрели джазовый лоск, являвшийся визитной карточкой блюза Западного побережья.
    По результатам сессии был издан сингл RPM 456 c "Love Life" и "Cross Eyed Suzie
    Lee", являющимися классическими образцами жанра. В том же 1956 г. был издан еще
    один сингл Смита – RPM 478 c не менее интересными композициями "You Don''t Love
    Me" и "Hey Mr. Porter". Однако вскоре контракт с ним был расторгнут. Это было
    вызвано изменением конъюнктуры музыкального рынка, обусловленным взрывом интереса
    к рок-н-роллу. На Modern Records сочли, что музыка Джорджа Смита стала для них
    несовременной. В конце 50-х он записывался на крошечных местных лейблах, таких
    как J&M, Lapel, Caddy и других, собрал собственное трио, аккомпанировал "Большой
    Маме" Торнтон… Что касается данного диска, то включенные в него записи имеют не
    только историческое значение, но и дают слушателю возможность получить подлинное
    эстетическое удовольствие от исполнения одного из величайших харперов в истории
    послевоенного блюза в период расцвета его творчества.'
