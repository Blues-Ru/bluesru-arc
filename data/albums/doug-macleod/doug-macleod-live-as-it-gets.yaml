- id: 876
  author: Константин Колесниченко
  mark: 9
  date: '2005-09-30'
  text: Вот такие музыканты меня сейчас и интересуют больше всего! Два бесподобных музыканта, два интересных музыканта! Так
    мало сейчас исполнителей, которые играют именно в формате дуэта, это очень сложно и ответственно. На аллмьюзике этот диск
    указан в дискографии Логана, но большинство композиций тут авторства именно Doug Macleod. Запись живая (записано в одном
    из клубов ББ Кинга), но записано очень хорошо, музыканты расслаблены и ироничны. Тексты песен Doug Macleod - это отдельная
    тема для разговора, они современны и остроумны. Так мало авторов, которые отваживаются делать это! Джон Логан отличный
    харпер, дует очень интересно и мелодично, впервые я его услышал на альбоме Терри Эванса, он отлично играет и не перетягивет
    на себя все время и внимание. Очень рекомендую этот диск любителям блюзовых сокровищ.
