- id: 1197
  author: Константин Колесниченко
  mark: 10
  date: '2008-01-28'
  text: Если вы думаете, что блюз - это застывшая музыкальная форма, послушайте альбомы Doug McLeod. Doug развивает акустическую
    ветвь блюза, он идет плечо к плечу с Keb' Mo', Eric Bibb, Guy Davis, Corey Harris, Roy Rogers and Norton Buffalo. Он старший
    из них и, если так можно выразиться, мудрейший. Мудрость эта и в скромных, но виртуозных аккордах его гитары, и в отличных
    песнях, и в аранжировках, и в красивом вокале. Голосом Doug McLeod ОЧЕНЬ похож на Keb' Mo' - та же небрежная расслабленность,
    но при этом ни одной ноты мимо. Слушая их записи невольно задаешься вопросом - это Keb' играет так по-белому, или Doug
    так по-черному? Ответ, наверное, где-то посередине, оба играют акустическую музыку Америки, уходящую корнями в архаичный
    блюз, и в первые сольные альбомы Клэптона, в соул и джаз, в фолк и кантри. Это та музыка, которую приятно и интересно
    слушать, как блюзовому гурману, так и просто интересующемуся качественной и красивой музыкой.
