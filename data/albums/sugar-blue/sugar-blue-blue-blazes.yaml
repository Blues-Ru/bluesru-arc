  date: '2006-12-22'
  text: Второй и самый известный альбом Шуга Блю и первый на "Аллигаторе". Альбом заполнен достаточно большим количеством
    традиционного материала, но в своеобразном прочтении Шуга Блю. В настоящее время, несмотря на то, что альбом вышел относительно
    недавно - он хрестоматийный - пособие по скоростной игре на гармонике. Хочется отметить такие композиции - "Miss You"
    - c его участием она записывалась на "Some Girls" Rolling Stones, известная "Help me", "That's All Right" - акустическая
    с Lurrie Bell (Acoustic Guitar), "Country Blues" и фанковую версию "Back Door Man".
