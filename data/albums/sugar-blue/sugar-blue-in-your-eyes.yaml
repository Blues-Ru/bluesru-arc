- id: 1049
  author: Константин Колесниченко
  mark: 8
  date: '2006-12-22'
  text: К Sugar Blue у меня двойственное отношение. С одной стороны он - виртуоз,
    очень талантливый музыкант, он со знанием дела подходит к своей музыке. Но с другой
    стороны - его музыка не совсем в моем вкусе. Постараюсь быть объективным. Шуга
    Блю входит в когорту быстрых блюзовых харперов, среди которых, например, Norton
    Buffalo, Johnny Mars "In Your Eyes" - его второй альбом на "Аллигаторе". Этот
    альбом более жесткий, чем предыдущий "Blue Blazes". Звучание гармоники Шуга Блю
    электризовано на всех композициях. Что заслуживает уважения - это потрясающая
    изобретательность в соло, хотя уследишь ли за ним на такой скорости. Первая композиция
    - "Gucci Gucci Man" - жесткий блюз-рок, "Bottom Line" - классная приджазованная
    композиция - скорость тут очень в точку! "In Your Eyes" - медленная соул-баллада,
    Шуга Блю играет на хроматической губной гармонике. "She" - жесткая роковая композиция,
    но Шугар Блю играет и поет неплохую мелодию. "Bluepine" - более-менее традиционный
    блюз, Пайнтоп Перкинс на фортепиано. "Lip Service and Line" - соул-фанк композиция,
    с духовыми и подпевками, классная хроматическая гармоника от Шуга Блю. "Wirlwind"
    - блюз-рок в фанковом ритме. "Listen Baby" - медленный соул-блюз. "Love's Sweet
    Secrets" - классный фанк. И классика блюза "Little Red Rooster". В итоге имеем
    не совсем блюзовую запись, уникального харпера, и набор неплохих песен, но альбому
    не хватает корней, хотя бы капельки старомодности.
