- id: 1553
  author: Константин Колесниченко
  mark: 8
  date: '2009-06-22'
  text: 'Последний альбом этого коллектива, под предводительством лидера JJ Grey,
    практически неотличим от их предыдущей записи "Country Ghetto". Но это один из
    тех редких случаев, когда это комплимент. По-прежнему – это хороший южный рок,
    со здоровой долей фанка и ритм-н-блюза. Ну может, единственное изменение – настроение
    у музыки и лирики группы немного изменилось – оно стало немного бодрее и веселее
    и по-настоящему летним, недаром буклет содержит такие слова от лидера группы:
    "you can almost swim through the smell of orange blossoms… the hummingbirds are
    buzzing, the water is getting warmer, the days are getting longer and the nights
    are on their way to wilder!"'
