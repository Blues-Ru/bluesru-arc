- id: 2103
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2013-04-18'
  text: 'Последний на данный момент студийный альбом ветерана чикагского блюза, гитарного
    новатора, на музыке которого учились и Эрик Клэптон, и Джимми Пэйдж, и многие
    многие другие выдающиеся гитаристы. На диске представлен усиленный духовой секцией
    качественный традиционный блюз (с легким экскурсом в регги на заглавной композиции)
    с отличными гитарными соло и сильным эмоциональным голосом Отиса.


    Диск совершенно заслуженно получил Грэмми в номинации "Лучший традиционный блюзовый
    альбом".'
