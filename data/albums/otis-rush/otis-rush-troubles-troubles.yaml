- id: 1026
  author: Александр Панин
  mark: 8
  date: '2006-08-21'
  text: Альбом был записан осенью 1977 года в Стокгольме для шведского лейбла Sonet. Оригинальная пластинка не входила в их
    известную серию Sonet Blues Story, но в 2005 году эта серия была переиздана в расширенном формате, и к двенадцати основным
    выпускам добавились три диска Раша, Снукса Иглина и Эрла Кинга. Отис играет здесь исключительно каверы, в его исполнении
    звучат номера Джимми Рида, Вилли Диксона, Би Би Кинга, Альберта Кинга, всего десять вещей, две из которых представлены
    на переиздании также и альтернативными версиями. Звучание записи чистое и яркое, соло Раша острые и красивые, сразу ясно,
    что играет один из лучших чикагских блюзовых гитаристов. Ему помогают еще один гитарист Bob Levis, басист Bob Stroger
    и ударник Jessie Lewis. Этот альбом стал впоследствии печально известен тем, что под названием Lost In The Blues был переиздан
    на лейбле Alligator, умельцы которого вырезали ряд оригинальных гитарных соло, добавили специально записанные отдельно
    клавиши Лаки Питерсона и сделали более мутный "фирменный" звук, в результате чего, в частности, превосходная работа басиста
    стала слышна гораздо хуже. Что ж, диск теперь переиздан в том виде, в котором был записан, так что можно сравнивать и
    делать выводы.
