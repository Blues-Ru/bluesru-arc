  author: Дмитрий Казанцев
  mark: 8
  date: '2017-02-27'
  text: 'Alligator 1991.


    Отис Раш - почему-то не очень уважаемый король блюза. Он левша, как и Алберт Кинг,
    но гитару не портит - просто басовая МИ у него внизу - отсюда особая манера. Много
    кто так играл, на самом деле.


    Альбом этот записан в Стокгольме в 1977 году, так что звук тут супер (а не как
    на Аллигаторе 90-х). Lucky Peterson на клавишах, знакомец москвичей Bob Stroger
    на басу (он играл у нас в Доме у дороги).


    Классический и классный блюз! Советую!'
