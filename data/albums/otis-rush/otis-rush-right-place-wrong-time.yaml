- id: 1123
  author: Константин Колесниченко
  mark: 9
  date: '2007-08-31'
  text: Раш был новатором блюза в конце 50-х, у него очень неровная музыкальная карьера. В 60-х, возник интерес к блюзу у
    белых, появились первые белые парни, играющие эту музыку. В 70-х блюз все больше начал приобретать черты соула и фанка,
    классные альбомы в таком ключе записывали Альберт Кинг и Альберт Коллинз, БиБи. А вот тот, кто был новатором в 50-х, Отис,
    который младше всех вышеперечисленных, записал альбом в ключе своей музыки раннего периода. Да, звучит он не так, как
    те сыпящиеся записи на Чесс, аранжирован с большей изобретательностью, сам Раш играет во сто крат лучше, но почему он
    не последовал примеру большинства музыкантов - загадка. Ответом на нее может быть название альбома "Правильное место,
    неправильное время". Хотя все же Отис позволил себе вольность и поместил на альбом потрясающе красивую песню молодого
    белого Тони Джо Вайта "Rany Night in Georgia". Как результат имеем ровный, интересный, очень качественный альбом, с виртуозной
    игрой Раша на гитаре и Марка Нафталина на клавишах, но абсолютно несовременный по подходу того времени (выпустили его,
    кстати, спустя пять лет после записи, в 71 году).
