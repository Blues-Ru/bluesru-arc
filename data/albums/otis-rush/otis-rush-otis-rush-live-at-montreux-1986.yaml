  author: Андрей Евдокимов
  mark: 8
  date: '2009-02-05'
  text: 'Блюз любит стандартные обороты в музыке, может, потому к самим блюзменам
    в жизни часто прилипают клише. Чаще всего – незаслуженные... Отис Раш – один из
    блюзовых революционеров на рубеже 50-60-х годов и автор нескольких блюзовых шедевров.
    Но считается, что после 70-х он не создал уже ничего значительного. На самом деле,
    все, что он призван был создавать, это отличный блюз. Чем он и продолжает заниматься
    до сегодняшнего дня. А издание записи его выступления на самом престижном европейском
    джаз-фестивале лишь доказывает, что никаких "провальных" периодов в его карьере
    не существовало. Гитара звучит эмоционально и проникновенно, голос полон страсти
    – что еще нужно для отличного блюза?! А для хорошего тиража не помешает участие
    Эрика Клэптона в четырех песнях. Формат на выбор: CD или DVD.'
