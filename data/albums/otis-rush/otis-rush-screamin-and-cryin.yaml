  author: Олег Пчелкин (oleg_spb)
  mark: 8
  date: '2020-10-19'
  text: 'Пугающе современная дата выхода компакта не должна смущать, это очередное переиздание. Первоначально материал был
    выпущен на виниле французской Black & Blue в 1977 году. Сама запись была сделана во Франции в студии Barclay 26 ноября
    1974 года.


    "Скрипучая гитара и вокал Отиса Раша никогда не были более выразительными, чем тогда, в 70-е годы, когда казалось, что
    он действительно обратит на себя внимание слушателей и массовую славу, которых он заслуживает." (Из рецензии на Allmusic)
    Но мнения слушателей сильно разделились на обвинительные и оправдательные: Вот например, такой вывод "Это просто очень
    плохая сессия (Отису пришлось сразу же отменить свое европейское турне), которая должна была остаться в мусорной корзине
    навсегда. За свои годы Отис сделал много очень хороших работ, начиная с его ранних шедевров на Cobra и Chess, двух выдающихся
    записей в семидесятых годах "Right Place Wrong Time и So Many Roads Live In Japan" и вернулся в студию в девяностых годах
    с двумя великими альбомами Ain''t Enough Coming, 1994 и Any Place I''m Going, 1998."


    "Этот альбом повсеместно ругают - запись не имеет блеска, группа несыгранная, голос Отиса звучит пьяным или сердитым в
    зависимости от того, какой трек вы слушаете, он кричит на слушателя. Однако, если вы хотите чистый гладкий блюз,- слушайте
    Клэптона, но если вы хотите по-настоящему сырой, болезненный, "я-не-могу-идти-дальше-по-жизни", блюз, этот альбом-настоящая
    вещь. Это Отис без украшений - ему больно. Я гораздо больше предпочитаю его, чем Cold Day in Hell" (Из комментариев к
    рецензии на Allmusic)


    Такое же примерно мнение выражает и комментарий с Amazon: "Если я хочу послушать блюз с духовой секцией, я слушаю артистов
    типа Б. Б. Кинга, это очевидно. НО если вы хотите услышать, как Отис Раш играет без духовых на заднем плане, которые убирают
    сырость звука, то слушайте этот компакт-диск. Все песни длинные-более 6 минут и наполнены протяжными гитарными соло (кроме
    #7), иногда перемежающимися криками и визгом Раша (а чего вы ожидали, диск так и называется !). Другие записи Раша, такие
    как "Ain''t Enough Comin'' In " и "Anyplace i''m Going", звучат слишком по Мотаунски и имеют слишком много духовых инструментов.
    Альбом "Крики и плач" - это просто бас, барабаны, гитара и немного фортепиано и органа на заднем плане."


    Вот рецензия с "Амазона", самая обескураживающая : "Отис Раш может быть одним из самых разочаровывающих блюзменов, так
    как он- один из самых талантливых блюзовых артистов своего поколения, но его записанная продукция печально известна своей
    неоднородностью. Для каждого драгоценного камня в его каталоге обычно есть "драндулет". К сожалению, "Кричать и плакать"
    - это "драндулет". Раш звучит рассеянно, возможно, пьяный или обкурившийся. Он спотыкается о тексты песен, рассеянно бренчит
    на гитаре, а иногда просто бросает все и начинает визжать.


    На многих песнях эти облака-затмения на мгновение расступаются, и Раш на какое-то время становится похожим на себя прежнего,
    но потом все снова по спирали уходит в рассеянность. Это, вероятно, самая неприятная часть...мы получаем краткие проблески
    Раша, но затем он исчезает, как мираж в пустыне.


    Поставив сразу после этого альбом "Правильное место, неправильное время", я вспомнил, каким великим может быть Отис Раш.
    Этого альбома ( Screamin'' And Cryin'') следует избегать, если только у вас просто нет болезненного любопытства слушать,
    как визжит легендарный музыкант, растрачивающий свой талант."


    Еще одна рецензия, оттуда же: " Его записи Cobra 50-х годов и 2 альбома 90-х годов представляют его как одного из самых
    выдающихся блюзовых гитаристов своего поколения. Частично проблема этого альбома заключается в том, что ритм-секция и
    клавишные слишком громкие, плюс гитарная работа Отиса не соответствует его обычному стандарту, а его вокал вообще то -
    в порядке, пусть с некоторыми чрезмерными криками на "Every Day I Have the Blues" и "You'' re Gonna Need Me".


    То, что в конечном счете плохо для меня, - это плохое продюсирование, отсутствие последовательности в песнях и, конечно
    же, плохое сведение звука и редактирование всего."


    Ну и напоследок, еще один неплохой и много объясняющий отклик: "Когда Отис Раш записал это, он чувствовал себя неважно
    и слишком много выпил. На самом деле он сразу после этой записи покинул европейское турне, в котором участвовал и вернулся
    в Штаты. Так это плохой альбом? Разве его не следовало выпустить? Я отвечаю " Нет " на оба этих вопроса. Во-первых, Раша
    поддерживает первоклассная чикагская группа с Джимми Докинзом на второй гитаре, а во-вторых, Отис временами кажется одержимым.
    Он вопит, вопит и импровизирует, превращая стандартные песни в путешествие в свою душу. Звучит ли это жалко? Ну, может
    быть, и так, Но послушайте Everyday I have the blues, когда от мучительных криков Отиса по спине пробегают холодные мурашки.
    Или послушайте A beautiful memory, где Отис вспоминает, как его родители слушали хорошую музыку, но он слышит только блюз.
    Это не "хороший" блюзовый альбом, это не тот альбом, который вы поставили, чтобы чувствовать себя хорошо, но когда вам
    нужен блюз, граничащий с адом, вы не будете разочарованы. Если вам нравится альбом Cold day in hell, вам должен понравиться
    и этот."


    Что пишут сами издатели (из Black & Blue) об этом альбоме в предисловии Дидье Трикара?


    " Отис Раш был болен и на грани нервного срыва, когда он записывал этот альбом. На следующий день ему пришлось вернуться
    в США и прекратить короткий европейский тур, который начался с некоторым определенным успехом. Только после серьезных
    сомнений и колебаний мы приняли решение выпустить альбом. потому что это была просто невероятная атмосфера, такая типичная
    для настоящего блюза, который можно было бы услышать в Чикагском клубе только в особенные вечера. Когда артист забывает
    о том, что он в студии и погружается в выражение своих сокровенных чувств так глубоко и полностью, что он забывает о микрофонах,
    которые фиксируют его крики отчаяния.


    С первых минут записи продюсеры и консультанты поняли, что они здесь бесполезны и что лучше будет оставить все самому
    Рашу. Они предоставили ему свободу большую, чем он имел когда либо. Но самое главное, он мог обнажать свою душу без какого
    либо сдерживания, записав самые запоминающиеся моменты в истории своего блюза.


    Напряжение, нараставшее по ходу сессии, к тому времени, когда музыканты начали играть "Every Day", та атмосфера , уникальная
    для блюза, становилась почти невыносимой. И кажется как невозможным, так и излишним комментировать каждую из записей альбома
    отдельно, потому что все они из одного музыкального ядра, отражающего глубочайшие чувства Раша.


    Позвольте нам только отметить, что "кричащая гитара" Раша звучит в безупречный унисон с вокалом и что то невероятное отчаяние
    с которым они оба кричат, по особому влияет на всех других музыкантов (соло Джимми Докинса на You Gonna Need Me)/ Неважно,
    начинающий ли вы фан Отиса Раша или один из многих, кто открыл его во французском туре - эта запись для вас; подтверждение
    посредством аутентичных эмоций исполнителя, что Отис Раш - великий блюзмен"'
