- id: 411
  author: Дмитрий Казанцев
  mark: 10
  date: '2004-01-08'
  text: Джон - мультиинструменталист. Он работал еще с Райем Кудером и Терри Эвансом, но он также большой друг Гари Примича.
    В отличие от очень блюзового и чикагского Примича, Логан эклектичен и разнообразен во всех отношениях. Да и харизмы у
    него больше. И голос его звучит как вокал рок-идола (где-то он похож на Хаммонда, где-то аж на Джэггера). Джон использует
    очень много перкуссии, фанка, соула, латины, блюза, рока, обояния, драйва; есть даже шуточный хип-хоп на этом альбоме!
    С Примичем их объединяет огромная любовь к классной музыке и ВКУС, тут его много. Он в каждой песне и каждом звуке. Нет
    бездумной игры и пятиминутных запилов. Нет маразма гитарного блюза и бестолкового использования харпа.
