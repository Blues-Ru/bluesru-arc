- id: 1922
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-07-05'
  text: 'Эдди Киркланд родился на Ямайке, а в 20 лет перебрался в штаты. Впоследствии
    он посвятил свою жизнь блюзу, но музыкальное наследие родины всегда накладывало
    особый колорит на его творчество, не укладывающиеся в узкие рамки традиционного
    блюза. Он освоил гитару, гармонику, начал потихоньку петь и сочинять музыку. Его
    глубокий сильный баритон придавал дополнительный соул-оттенок музыке. В послужном
    списке Эдди работа в группе Джона Ли Хукера и сотрудничество с Отисом Реддингом,
    а затем длинная сольная карьера.


    Альбом 1997 года Эдди записал в возрасте 70 лет, но его энергии, задору и драйву
    впору позавидовать любому молодому музыканту. Один список приглашенных гостей
    однозначно провоцирует на прослушивание альбома: тут и мастер-слайдер Сонни Ландрет,
    и рокер Куб Кода, и Тэб Бенуа, и Кенни Нил, и другие. Материал почти полностью
    авторский и представляет собой качественный искренний сырой современный блюз с
    примесью фанка, соул и рока.'
