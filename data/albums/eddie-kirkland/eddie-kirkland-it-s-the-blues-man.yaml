- id: 830
  author: Дмитрий Казанцев
  mark: 8
  date: '2005-08-24'
  text: 'Эдди - гитарист, гармошечник, вокалист и автор; он родился на Ямайке в 1928
    году. С юга Штатов он перебрался в Детройт, где познакомился с Джоном Ли Хукером,
    с которым играл вместе многие годы. В начале 60-х он стал работать с Отисом Реддингом
    и выпустил вот этот необычный альбом (его следующий сольник вышел лишь через 26
    лет).


    На этом диске Эдди играет и поет с джазменами-ритм-н-блюзерами. King Curtis -
    sax, Oliver Nelson - sax, George Stubbs - piano, Billy Butler - guitar, Jimmy
    Lewis - bass guitar, Ray Lucas - drums, Herman Foster - piano, Frank Shea - drums.
    Записи сделаны в конце 1961 и в начале 1962 годов. Инженер и продюсер - сам Руди
    Ван Гелдер. Музыка Керкленда (а все 12 вещей на альбоме написал именно он) - микс
    блюза и ритм-н-блюза. Очень жесткий, крикливый вокал отличает его от большинства
    блюзменов той поры; его голос типичен для soul-shouter-а. На гитаре он играет
    рвано и грязновато, вкладывая много эмоций, но при этом его партии хорошо сочетаются
    с пением.


    Симпатичный альбом - запись очень зрелая для 1962 года, группа играет великолепно,
    совсем не мешая "безумствам" лидера. Этот диск - One-Of-A-Kind, у Эдди больше
    нет подобных работ.'
