  author: Разные авторы
  mark: 8
  date: '2004-02-02'
  text: 'Певица из Аризоны Lisa Otey и голландец Mr. Boogie Woogie познакомились через Интернет и через некоторое время записали
    свой совместный альбом . Молодые и талантливые они великолепно дополнили друг друга. Фортепиано Mr. Boogie Woogie и их
    вокальный дуэт слились в искрометном буги-вуги экстазе.


    Голос Lisa Otey нельзя назвать профессионально поставленным, если такое понятие вообще применимо к подобной музыке, она
    допускает некоторые ляпы, недотягивает кое-где, недовъезжая в гармонию, но свинговость и драйв чувствуются в полной мере.
    Пианист здесь не буги-машина, как иногда бывает в такой музыке, он ярок, все у него в меру.


    Присоединяющиеся временами ударные и саксофон здорово освежают и так отнюдь не кислое исполнение. Некоторые вещи чисто
    инструментальные. Совершенно замечательно исполнение дуэтом "Trouble In Mind". Первый куплет медленен, вальяжен, чувственен
    и звучит, как запев, во второго вступает активный саксофон, а затем начинается энергичная свинг-блюзовая вариация.


    Слабее вокал Mr.Boogie Woogie. Как второй голос или в дуэте это не так заметно, но во время соло отсутствие владения вокалом
    уже чувствуется. Однако появляющееся органное звучание C7 Yamaha и темперамент исполнителей многое компенсируют.


    <p align="right">Андрей Ордальонов'
