- id: 225
  author: Алексей Калачев
  mark: 8
  date: '2003-09-18'
  text: 'Такую музыку за неимением более подходящего термина американцы назвали бы "блюзом 21-го века" или что-нибудь в этом
    роде. Я бы сказал "гитарный neo-soul", хотя это тоже мало, что объясняет. В сухом остатке красноречивый факт: альбом расхватывают
    поклонники блюзового модерна, в первую очередь, поклонники современных гитаристов. Мильтиинструменталист Лумитс выдвигался
    на Гремми еще в 1994 году в категории "современный блюз".'
