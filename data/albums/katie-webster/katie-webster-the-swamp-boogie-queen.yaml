  author: Константин Колесниченко
  mark: 7
  date: '2007-08-11'
  text: 'На этом альбоме с обложкой, которая годится скорее для пластинки с детскими
    песнями из мультфильмов, собрана подборка неплохих и крепко сбитых блюзов, ритмнблюзов
    и соул-блюзов. Все это приправлено игрой в манере Нового Орлеана, близкой к Профессору
    Лонгхэйру и Доктору Джону. Вокалом Кэти похожа на молодую Коко Тэйлор. Кэти Вэбстер
    довольно неизвестная пианистка, но раз Аллигатор взялся выпускать ее альбом,значит,
    она того стоит. Они берутся только за надежных музыкантов. На альбоме вместе с
    Кэти игрет куча звезд: Bonnie Rait, Kim Wilson, Robert Cray, Joe Subblet, Memphis
    Horns, The Paladins, Anson Funderburgh, Silent Partners - группа, переигравшая
    с половиной аллигаторовских музыкантов. Хороший также и подбор песен, единственное,
    что портит картину - это звук 80-х.'
