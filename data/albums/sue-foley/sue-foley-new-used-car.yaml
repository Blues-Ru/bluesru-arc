  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-06-07'
  text: 'Десятый сольный альбом "канадской королевы блюзовой гитары", на котором Сью
    решила пойти чуть более коммерческим путем: чуть меньше блюза, чуть больше рока.
    Эксперимент оказался не слишком удачным: хотя гитарные партии по-прежнему на высоте,
    сами песни не слишком впечатляют (половина треков, на мой взгляд, из категории
    "для заполнения пластинки").


    На диске только один кавер, остальное - авторский материал. Исполнение качественное,
    техника игры хорошая, но вот композиторский талант не слишком проявляется. Тем
    не менее есть ряд вполне достойных треков: это и заглавная New Old Car, и Deep
    Freeze, и роскошные блюзы Mother и Absolution, да и акустическая Long Tomorrow
    вполне на уровне. Альбом неплохой, но не более того - Сью определенно способна
    на бОльшее!'
