reviews:
- id: 1841
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-07'
  text: 'Первый концертный альбом гитаристки и певицы из Оттавы (а всего соответственно
    восьмой ее сольник), записанный безо всяких репетиций, наложений и исправлений
    за один вечер. Запись сделана во время акустического концерта в Торонто, музыка
    рождалась спонтанно прямо на месте. Сью и группа играли и новые только написанные
    песни, и любимые старые, и каверы.


    Часть треков записаны только самой Сью под акустическую гитару, остальные - с
    минималистским аккомпаниментом трио сопровождающих музыкантов. Невооруженным ухом
    слышно, что сами музыканты играли расслабленно и получали удовольствие от процесса.
    В результате получился искренний, честный и даже местами интимный альбом акустического
    блюза, который приятно слушать и переслушивать.'
