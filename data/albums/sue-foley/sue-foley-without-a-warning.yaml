- id: 1840
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-06-07'
  text: 'Второй сольный альбом канадской гитаристки и певицы позволяет судить не только
    об исполнительском мастерстве, но и о композиторских навыках - собственных песен
    8 из 13, включая три инструментала. Половина треков записана в составе трио, на
    остальных подключается еще пианист или органист. Предпоследний трек представляет
    собой дуэт со звездой блюзовой сцены Остина - Анжелой Стрели.


    В музыке чувствуется юношеский задор и некоторая наивность, но она одновременно
    подкупает искренностью исполнения и несомненным талантом Сью. И если первый альбом
    Фоли содержал преимущественно каверы, то этот диск по праву можно рассматривать
    в качестве полноценного свидетельства мастерства будущей "королевы Телекастера".'
