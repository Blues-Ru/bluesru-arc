  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-06-07'
  text: 'Талантливая канадская гитаристка и вокалистка Сью Фоли родилась в Оттаве,
    но к моменту записи первого сольного альбома перебралась в Остин. Однажды 15-летняя
    Сью попала на концерт Джеймса Коттона, и с этого момента она взяла в руки гитару
    и начала долгий путь к блюзу. В середине 80-х она перебралась в Ванкувер, где
    создала собственную группу.


    В 1990 году Сью отправила свою демо-запись в техасскую фирму грамзаписи Antone''s
    Records, и через год подписала с ними контракт, послуживший началом долгой сольной
    карьеры. Альбом 2002 года - седьмой сольник Фоли, содержащий преимущественно авторский
    материал и три кавера, включая Stupid Girl Роллингов и Roll with me Henry из репертуара
    Этты Джеймс. Кроме блюзовых и рОковых интонаций, голос Сью характеризуется явно
    выраженным кантри-звучанием. Альбом стилистически разнообразный, характеризуется
    расслабленным "грязным" исполнением, что не умаляет возможностей гитаристки, да
    и сопровождающий состав производит благоприятное впечатление. Диск будет интересен
    поклонникам блюз-рока в женском исполнении.'
