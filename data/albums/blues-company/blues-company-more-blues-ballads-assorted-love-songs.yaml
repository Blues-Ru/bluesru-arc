- id: 1774
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-25'
  text: 'За 11 лет, прошедших с момента выпуска предыдущего сборника Blues, Ballads And Assorted Love Songs, Блюз Кампани
    успели выпустить еще штук шесть альбомов, и естественно созрела необходимость выпуска еще одного сборника лучшего - благо,
    поле для выбора весьма широкое!


    Однако Тошо сотоварищи не только включили в сборник студийные версии треков, но записали три из них в концертном исполнении
    в сопровождении полноценной духовой секции из 8 музыкантов, продемонстрировав тем самым не только мастерство исполнителей,
    но и аранжировщиков. Группа и духовая секция местами свингуют не хуже настоящего биг-бенда!'
