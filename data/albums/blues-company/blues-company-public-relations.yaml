  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-25'
  text: 'Седьмой альбом базирующегося в Германии ведущего европейского блюзового конгломерата
    под бессменным руководством гитариста, певца и композитора "Тошо" Тодоровича был
    записан в течение 1992 года в Германии и выпущен на лейбле in-akustik в 1993 году
    в Европе и на следующий год в Америке.


    Базовый квартет музыкантов Blues Company на этом диске усилен знаменитыми гостями:
    харпером Кэри Беллом и слайд-гитаристкой и певицей Джоанной Коннор, а также клавишником
    Жан-Жаком Краветцом и духовой группой. Качественный блюз с примесью блюз-рока
    и джаза временами оттеняется мощными вступлениями духовой группы Supercharge Horns,
    что придает дополнительную глубину музыке. Материал практически полностью авторский.
    Альбом качественного и разнообразного современного блюза, наглядно демонстрирующий
    класс музыкантов.'
