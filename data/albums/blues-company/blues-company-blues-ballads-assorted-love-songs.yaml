- id: 1775
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-25'
  text: Сборник лучшего за первые двадцать (!!!) лет существования ведущей европейской блюзовой формации, основанной в 1976
    году Тодором Тодоровичем, который по-прежнему руководит группой и 21 веке. Профессионально исполненный слегка приджазованный
    блюз, временами украшенный духовыми - визитная карточка коллектива. Группа пишется на лейбле Inakustik, который славится
    качественным звуком. Рекомендуется всем любителям как традиционного, так и современного блюза.
