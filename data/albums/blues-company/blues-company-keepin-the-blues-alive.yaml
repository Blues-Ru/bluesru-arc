reviews:
- id: 1779
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-25'
  text: 'Blues Company была создана в далеком 1976 году югославом Тодором Тодоровичем и несколькими немецкими музыкантами,
    и за прошедшие годы превратилась в своего рода европейский блюзовый институт и, если угодно, европейский ответ на Roomful
    of Blues. Музыка группы столь же разнообразна, и включает в себя наравне с блюзом также джаз, фанк, джамп-блюз и рок.
    Группа также широко использует духовые инструменты, придающие дополнительный колорит их музыке. Blues Company группа сильная,
    интересная, разноплановая и поэтому, бесспорно, одна из лучших блюзовых групп Старого света.


    Очень приятственный концерт, записанный по итогам двух блюзовых фестивалей в Германии в 2003 году (треки 1 - 10 записаны
    1 ноября, остальные треки - 27 сентября ). Усиленная традиционной духовой секцией The Fabulous BC Horns, группа играет
    уверенно и, похоже, получает от этого не меньшее наслаждение, чем зрители. Сет лист полностью составлен из собственного
    материала. Видеоверсия данного концерта была издана на ДВД.'
