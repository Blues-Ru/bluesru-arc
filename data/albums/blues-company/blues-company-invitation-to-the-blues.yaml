  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-25'
  text: 'Blues Company была создана в далеком 1976 году югославом Тодором Тодоровичем
    и несколькими немецкими музыкантами, и за прошедшие годы превратилась в своего
    рода европейский блюзовый институт и, если угодно, европейский ответ на Roomful
    of Blues. Музыка группы столь же разнообразна, и включает в себя наравне с блюзом
    также джаз, фанк, джамп-блюз и рок. Группа также широко использует духовые инструменты,
    придающие дополнительный колорит их музыке. И все же, в отличие от их американских
    визави, музыка Blues Company более академична и суха, ей не хватает некоторой
    доли того "раздолбайства" (в хорошем смысле этого слова), которая имеется практически
    в каждом треке Румфулов (видимо, это у них в крови :-)). Тем не менее Blues Company
    группа сильная, интересная, разноплановая и поэтому, бесспорно, одна из лучших
    блюзовых групп Старого света.


    Диск был записан с сентября 1999 по февраль 2000 года и вышел на лейбле InAkustik
    в сентябре. При записи музыкантам помогала духовая секция - The Fabulous BC Horns.
    Диск достаточно разнообразный и включает в себя блюз-рок, фанк, джамп-блюз и джаз,
    причем они сочетаются достаточно органично. На диске один кавер - Goin'' Down,
    остальные треки авторские. Исполнение высокопрофессиональное, качество записи
    как обычно на высоте. На мой взгляд, один из лучших дисков коллектива и прекрасное
    "приглашение на блюз".'
