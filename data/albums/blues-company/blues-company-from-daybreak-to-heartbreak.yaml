  date: '2011-05-25'
  text: Добротный альбом традиционного блюза и блюз-рока с джазовой подкладкой от
    коллектива, который не нуждается в особом представлении. Сыграно профессионально
    и качественно, но как-то без изюминки. Качество записи, как обычно, на самом высоком
    уровне. Хорошая работа, но не лучшая для группы.
