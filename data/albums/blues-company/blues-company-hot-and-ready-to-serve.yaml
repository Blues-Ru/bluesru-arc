reviews:
- id: 1782
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-25'
  text: 'Hot and Ready to Serve - очередная добротная работа от европейского блюзового
    синдиката во главе с бессменным "Тошо" Тодоровичем, сделанная в традиционном для
    группы ключе: смешение всевозможных блюзовых и околоблюзовых стилей (блюз, джамп-блюз,
    фанк, соул, рок), записанных с духовой группой The Fabulous Horns, приглашенными
    артистами и бэк-вокалистами. За исключением последнего инструментального трека
    (попурри из Hideaway Фредди Кинга и Peter Gunn Theme Генри Манчини) , все остальные
    написаны Тодоровичем и музыкантами группы. Пластинка записана в 2007 году, но
    в Америке была издана в январе 2008. Диск традиционно записан в Германии на фирме
    InAkustik, которая славится качеством звука. Хорошая работа, которая слушается
    на одном дыхании!'
