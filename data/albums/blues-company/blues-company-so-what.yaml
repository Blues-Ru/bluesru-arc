  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-25'
  text: 'Четвертый студийный альбом европейской блюзовой формации, записанный за 3
    дня в августе 1987 года, и спродусированный самой группой. Запись была сделана
    "живьем в студии" непосредственно на цифровой мастер по технологии DDD. Кроме
    самой группы, в записи принимали участие приглашенные артисты - большей частью
    те звезды блюза, с которыми Блюз Кампани гастролировала на протяжении предыдущих
    лет, включая Луизиана Реда. Напомню, что группа была создана Тодором Тодоровичем
    в 1976 году, и с тех пор почти непрерывно гастролировала в Европе и Америке.


    В музыкальном плане диск более прямолинейный, чем более поздние работы: это добротный
    блюз и блюз-рок, джазовое влияние почти не проявляется, сопровождение духовых
    также практически отсутствует (хотя приглашенный саксофонист на нескольких треках
    имеется). Тем не менее диск дает наглядную иллюстрацию того, как звучала группа
    на раннем этапе ее карьеры.'
