- id: 1781
  author: Юрий Соловьев (Juergen)
  mark: 9
  date: '2011-05-25'
  text: 'Альбом, записанный к 15-летию существования замечательной европейской блюзовой формации во главе с Тошо Тодоровичем.
    Традиционный для коллектива профессионально исполненный коктейль блюза, джаза и блюз-рока.


    Запись осуществлялась "вживую" в студии без наложений, качество записи отменное. Часть треков во второй части пластинки
    исполнены перед небольшим числом слушателей, которые бурно апплодируют музыкантам.


    С группой традиционно записывается духовая секция, присутствующая на ряде треков. Кроме этого, в полном соответствии с
    названием в джеме принимают участие такие замечательные гости, как Лютер Аллисон, Стен Уэбб и Джон Хиртсман. Хиртсман
    играет на блюзовой флейте (!!!) и органе, и его присутствие придает особый шарм данной пластинке. На мой взгляд, именно
    вторая половина этого диска наиболее интересна, хотя и первая вполне на уровне.'
