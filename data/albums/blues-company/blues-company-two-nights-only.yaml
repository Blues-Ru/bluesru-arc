- id: 1771
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-25'
  text: 'Концертный альбом знаменитого европейского блюзового коллектива, записанный по итогам двух шоу 5 и 6 января 2001
    года в Германии. Диск посвящен памяти давнего друга и продюсера Мика Франке, который внезапно скончался буквально через
    несколько дней после завершения работы над альбомом.


    Основной квартет музыкантов во главе с Тошо Тодоровичем усилен перкуссионистом и вокалистом Мартином Шмахтенбергом, а
    также бессменной духовой секцией Fabulous BC Horns. Группа исполняет в основном собственный материал, разбавив его парой
    - тройкой блюзовых стандартов (которые, на мой взгляд, прозвучали чуть хуже авторского материала). Слушателю предлагается
    качественный альбом современного электрического блюза с духовыми, сыгранный со свойственным группе профессионализмом.
    Несмотря на концертную запись, звук очень качественный и мягкий. В итоге имеем наглядное доказательство мастерства музыкантов,
    которые в любой обстановке играют "на отлично".'
