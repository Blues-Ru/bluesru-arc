  date: '2011-05-25'
  text: 'Blues Company - The Quiet Side of/30 Years of Blues Company - 2006 (2 CD)


    Направляемый бессменным лидером Тодором Тодоровичем ведущий европейский блюзовый состав к тридцатилетию творческой деятельности
    (а образовалась группа в 1976 году) приготовил подарок для своих поклонников - альбом акустического материала, к которому
    в качестве бонусного диска прилагается сборник из 11 треков, взятых с разных альбомов, записанных группой на протяжении
    этих лет.


    Во время турне 2004 года группа попыталась в определенной мере вернуться к истокам - отложила в сторону электрогитары
    и начала играть тихие акустические концерты. Энтузиазм, с которым публика восприняла такой подход, сподобил группу на
    запись акустического альбома, о котором давно их просили фанаты.


    И вот такой альбом состоялся: он был записан в августе 2005 года и включает в себя множество новых интимных баллад, а
    также несколько старых в новом звучании. В музыкальном отношении это прекрасно сыгранный приджазованный акустический блюз,
    звучащий одновременно и традиционно, и современно.


    На втором диске в качестве посвящения 30-летию группы представлен совсем другой материал - тут полно электричества, это
    преимущественно блюз-рок и джамп-блюз с духовой секцией. В отличие от первого диска, иллюстрирующего тихую сторону группы,
    бонусный диск, если угодно, является ее громкой стороной :-)'
