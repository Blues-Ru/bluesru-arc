reviews:
- id: 2290
  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2017-10-24'
  text: "Blues Company была создана в далеком 1976 году югославом Тодором Тодоровичем и несколькими немецкими музыкантами,\
    \ и за прошедшие годы превратилась в своего рода европейский блюзовый институт и, если угодно, европейский ответ на Roomful\
    \ of Blues. Музыка группы столь же разнообразна, и включает в себя наравне с блюзом также джаз, фанк, джамп-блюз и рок.\
    \ Группа также широко использует духовые инструменты, придающие дополнительный колорит их музыке. Blues Company группа\
    \ сильная, интересная, разноплановая и поэтому, бесспорно, одна из лучших блюзовых групп Старого света. Все эти годы группу\
    \ вел за собой ее бессменный лидер - гитарист, певец и композитор Тодор Тодорович по прозвищу \"Тошо\". Коллектив демонстрирует\
    \ свою искреннюю приверженность к блюзу и по сей день, продолжая активную концертную деятельность и периодически выпуская\
    \ новые альбомы (которых у них накопилось уже под 30).\n\nВ 2017 году исполнилось 30 лет с момента подписания первого\
    \ контракта между Тодоровичем (Blues Company) и немецким лейблом inakustik, с которым группа продолжает сотрудничество\
    \ и по сей день. За это время лейбл выпустил 17 дисков Blues Company и два сольника ее лидера. К юбилею был подготовлен\
    \ специальный коллекционный пятидисковый бокс с лимитированным тиражем 2 708 копий. В бокс вошли три оригинальных альбома\
    \ (два студийных и один концертник), а также сборник треков, записанных группой с приглашением других блюзовых музыкантов\
    \ (Ana Popovic, Joanna Connor, Johnny Heartsman, Louisiana Red, Luther Allison, Stan Webb и др.) плюс неиздававшиеся ранее\
    \ выступления \"на бис\" с концертов 2014 и 2016 года.\n\nCD 1:\tInvitation To The Blues (INAK 9064 CD - 2000)\n\nCD 2:\t\
    Hot And Ready To Serve (INAK 9081 CD - 2007)\n\nCD 3:\tAin't Nothing But ... (INAK 91353 CD - 2015)\n\nCD 4:\tWith A Little\
    \ Help ...\n\nCD 5:\tEncores"
