- id: 1777
  author: Юрий Соловьев (Juergen)
  mark: 7
  date: '2011-05-25'
  text: 'Вполне добротный традиционный для "Тошо" Тодоровича сотоварищи альбом профессионального
    качественного блюза с джазовыми отголосками, записанный группой в феврале 1995
    года. Группа на записи была усилена духовыми, клавишником и бэк-вокалистами.


    Однако у данного альбома есть одна изюминка - он наполнен многочисленными звуковыми
    эффектами а-ля Пинк Флойд, которые студийные звукоинженеры фирмы inakustik каким-то
    образом предполагали проигрывать с окружающим звуком. Немного необычно, но быстро
    привыкаешь :-) Однако толи эффекты повлияли на музыку, толи она сама чуть не дотягивает
    до традиционно высокого уровня, свойственного данной группе, но в целом пластинка
    показалась мне средненькой - все прилично, но не более того. Не лучший альбом
    коллектива - и тем не менее, повторюсь, вполне приличный.'
