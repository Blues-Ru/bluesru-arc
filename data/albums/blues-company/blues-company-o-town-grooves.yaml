  author: Юрий Соловьев (Juergen)
  mark: 8
  date: '2011-05-25'
  text: 'Новый альбом ведущей европейской блюзовой группы под бессменным руководством
    Тошо Тодоровича записывался с февраля по октябрь 2009 года, а выходит в 2010 году
    - почти через три года после предыдущего номерного студийника.


    На альбоме квартету музыкантов Blues Company помогает духовой дуэт The Fabulous
    BC Horns и клавишник Мистер Мо, придающие музыке дополнительные краски, а также
    пара приглашенных звезд: Ана Попович (гитара на треке 4) и Гордон Бидл (саксофон
    на треке 6).


    В музыкальном отношении диск полностью традиционный для коллектива - это качественный
    блюз с хорошими аранжировками и отменным исполнением. Единственное отличие - инструментал
    под номером 12, на котором отрывается ударник Флориан Шаубе :-) Диск хороший,
    хотя и не шедевр.'
