  author: Юрий Соловьев (Juergen)
  mark: 6
  date: '2013-08-07'
  text: 'В послужном списке американского рокера родом из среднего запада учеба в
    колледже музыки в Беркли и несколько лет в турне с хард-роковыми группами Sweet
    Water и Second Coming, с которой он выпустил успешный сингл "Vintage Eyes". В
    2006 году Дадли решил заняться сольным творчеством и начал играть блюз-рок в Сиэтле,
    а в 2010 записал свой первый сольный альбом Left for Dead.


    Deep Deep Blue - второй сольник Дадли, который выпустил его в 34 года на собственном
    лейбле и в своем творчестве пытается объединить "рифы Дельты, техасский рок и
    американский блюз" (цитирую с сайта музыканта). Если честно, блюза в традиционном
    понимании тут немного, зато блюз-рока (с ударением на второй составляющей) а-ля
    ZZ Top хватает. Есть и довольно мелодичный хард, и южный рок, и фанк с духовой
    секцией. Восемь треков собственного сочинения и три кавера: от Боба Дилана, Лу
    Рида и Palace of the King из репертуара Фредди Кинга, музыка которого оказала
    сильное воздействие на творчество Тафта. Сыграно энергично и технично, с мощными
    рифами и приличными соло. Альбом наверняка понравится любителям хард рока с блюзовой
    основой.'
