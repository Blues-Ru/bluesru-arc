- id: 958
  author: Дмитрий Казанцев
  mark: 8
  date: '2006-01-15'
  text: 'Есть просто Джонни Тэйлор, а есть Литтл Джонни Тэйлор. Тут речь пойдет о втором. Он обладает классным голосом, а
    записываться начал еще в начале 60-х.


    На этом позднем альбоме для фирмы Ichiban Джонни поет блюзы, ритм-н-блюз, соул и даже фанк. И все же акцент на соул-блюзе.
    Музыка очень традиционная и понятная, но голос Тэйлора так хорош, что слушать все это очень интересно (хотя он вообще
    не форсирует).


    Диск записан в Атланте, где и находится фирма Ichiban. Удивительно, но звук очень приличный и живой для этого лейбла и
    1989 года.'
