  slug: atb-2020-07-27-kimbrough
  topic: Kimbrough
  description: Джуниор Кимброу был настоящий домосед. Родился в Норс Миссиссиппи Хил Каутри - на севере миссиссиппских холмов.
    И там провел всю жизнь, десятилетиями почти каждый вечер играя в своем джюк-джоинте, кабаке с музыкой. Он из тех, что
    считает жителей ближайших городов странными, а в других штатах - сплошь недотепы, а в городах - так и вовсе одни чудики.
    Зато его родной город Холи Спрингз - Святые родники - лучшее место в мире. Хотя его земляки и напивались вдрабадан в его
    заведении, и дрались, и кадрились, и гомонили от заката до рассвета, зато все - душевные отзывчивые люди. Таких больше
    не сыскать. При этом уж сентиментальным Джуниора не назвать. А блюз его так и вовсе - суровый, мрачнее чикагского, вязкий,
    густой, а голос из клети отчаянной кручины... Весь Этот Блюз
  summary: Джуниор Кимброу — отшельник Северного Миссисипи, изобретатель завораживающего «хилл-блюза».
