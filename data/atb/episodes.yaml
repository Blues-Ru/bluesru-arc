  slug: atb-2019-04-15-bessie-smith
  topic: BessieSmith
  description: 'Программа «Весь этот блюз» отмечает 125-летие Бесси Смит, рассказывая о её пути от уличной певицы под опекой
    Ма Рейни до главной звезды лейбла Columbia. Звучат важнейшие песни из её репертуара: «''Tain''t Nobody''s Business If
    I Do», «St. Louis Blues» с Луи Армстронгом, «Backwater Blues», «Nobody Knows You When You''re Down and Out» и другие.
    Ведущий отмечает, что на записях Бесси Смит аккомпанировал Кларенс Уильямс, а среди музыкантов встречались будущие звёзды
    джаза — Джек Тигарден, Коулмен Хокинс, Бенни Гудман. Отдельно разбирается история гибели певицы в 1937 году и миф, развенчанный
    в противовес пьесе Эдварда Олби. Для сравнения звучит также кавер Кэнди Кейн на песню «You''ve Been a Good Old Wagon».'
  summary: 125-летие Bessie Smith — жизнь, карьера и главные песни Императрицы блюза
