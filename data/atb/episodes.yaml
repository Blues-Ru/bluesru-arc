    традициям Бил-стрит. Отдельное место занимает Том Джонс — к его 80-летию рассказывается о блюзовых альбомах «Praise and
    Blame» и «Spirit in the Room», звучат песни Джона Ли Хукера, Билли Боя Арнольда и Джеймса Брауна в его исполнении. Также
