  slug: atb-2018-11-19-mercer
  topic: MERCER
  description: '18 ноября, в 1908 году в Саванне, Джорджия, родился Джонни Мерсер
    (Johnny MERCER), музыкант множества талантов. Певец в легком джазовом стиле, он
    сочинил полторы тысячи песен, лучшие из которых исполнялись звездами джаза и поп-музыки,
    и со временем превратились в подлинную классику. К тому же он инициатор и один
    из учредителей Capital Records. В программе Весь Этот Блюз к 110-летию со дня
    его рождения звучат прекрасные голоса: Aretha Franklin, Billie Holiday, Louis
    Armstrong, Ella Fitzgerald & Louis Jordan, Ray Charles & Betty Carter... И пусть
    скромный, но такой обаятельный голос самого юбиляра. Часть первая'
  summary: 110-летие Джонни Мерсера — певца, лирика Голливуда и «тайного блюзмена».
