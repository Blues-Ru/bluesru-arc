  topic: ''
  description: Выпуск посвящён двум блюзовым юбилеям октября 2021 года. Чикагский пианист Дэйтрой Джуниор (1931–2005) — участник
    антологии «Living Chicago Blues» лейбла Alligator, аккомпаниатор Хаулин Вулфа и автор хита «Call My Job», который исполняли
    Сан Силс и Алберт Кинг; звучат записи разных лет, включая последний альбом «Blues on the Internet» (2004). Гитарист и
    певец Коко Монтоя, отметивший 70-летие 3 октября, прошёл путь от ударника до гитариста в Bluesbreakers Джона Мэйолла,
    где играл десять лет; особое место в его музыке занимает влияние Алберта Коллинза. В программе звучат треки с альбомов
    «Coming in Hot» (2019), «Wake Up Call» Мэйолла (1993), дебютного «Get a Mind to Travel» (1994) и трибьюта Бо Дидли (2008),
    а также вспоминается московский концерт Монтои в зале «Мир».
  summary: 'Юбилеи октября: 90 лет пианисту Дэйтрою Джуниору и 70 лет гитаристу Коко Монтое.'
