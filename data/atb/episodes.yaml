  description: 'Программа целиком посвящена юбилею слайд-гитариста Хоумсика Джеймса (Джеймс Уильямсон), которому в 2020 году
    исполняется 110 лет. Ведущий рассказывает о запутанной биографии музыканта — противоречивых датах рождения и именах, —
    а также о его связях с Робертом Джонсоном и Элмором Джеймсом. В эфире звучат записи разных лет: «Homesick Blues» (1953),
    «Shake Your Money Maker» в дуэте со Снуки Прайором (1973), «So Mean to Me» с альбома «Chicago: The Blues Today!» (1966),
    «Alligator Man» (1971) и ранние записи 1952 года. Отдельно обсуждается кавер на «Got to Move» в исполнении дебютного состава
    Fleetwood Mac Питера Грина (1968), а завершает выпуск соло-версия «Dust My Broom» — песни, услышанной Хоумсиком лично
    от Роберта Джонсона.'
  summary: 110-летие Homesick James (30 апреля 1910)
