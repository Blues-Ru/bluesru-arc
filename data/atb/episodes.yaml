  slug: atb-2020-07-13-dupree
  topic: Dupree
  description: С этом выпуске три юбиляра - все из новоорлеанской старой школы! Многие годы считалось, что 4 июля 1900 года
    - это день рождения гения джаза и блюза Луи Армстронга. Даже на его надгробной плите была выбита именно эта дата. Во времена,
    когда никто особо не заботился о днях рождения афро-американцев, многие из них сами выбирали именно этот день - День независимости.
    Очень удобно - всегда выходной. Сейчас архивариусы добрались до оцифрованных церковных записей тех лет и теперь уверенно
    уверено заявляют, что Армстронг родился да, четвертого, но августа, и не 1900, а 1901 года. Ну, пусть будет так, справим
    юбилей полномасштабно в следующем году. Но для тех, кто привык к 4 июля, как ко дню Луи Армстронга - хоты бы две его любимые
    песни... Champion Jack Dupree - новоорлеанец до мозга кости, хоть и провел десятки лет в добровольной европейской ссылке,
    детдомовец, боксер-чемпион, ветеран II Мировой, узник японского концлагеря, певец, пианист, художник да еще и повар -
    мощная личность. 100 лет со дня рождения Дюка Баррелла праздновали знатоки новоорлеанской музыкальной истории 9 июля 2020
    года. В Новом Орлеане он родился, с ним и связана вся его музыкальная судьба. Он играл в популярных оркестрах Луи Джордана
    и Джонни Отиса, выступал как солист и лидер собственных ансамблей, Duke Burrell's Louisiana Shakers - самый известный
    из них. 100-летие со дня его рождения - лучший повод напомнить о его великолепных записях. Таких мастеров буги-вуги еще
    поискать надо! Весь Этот Блюз
  summary: 'Три новоорлеанских патриарха: Луи Армстронг, Чэмп Батлер и Шэмп Дюпри.'
