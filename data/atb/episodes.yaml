  topic: va
  description: Блюзовые именинники первой половины августа в программе Весь Этот Блюз. 90-летие со дня дня рождения Сэма Чартерза.
    Он историк и аналитик, и искатель. Писатель, публицист и продюсер, и немного музыкант. В историографии блюза он один из
    главных основоположников. Mark NAFTALIN - пианист, бывший в самой гуще блюз-роковых передряг 60-х и пропагандист блюза
    на протяжении всей своей жизни, ему 2 августа исполнилось 75 лет. 7 августа исполнится 75 лет гитаристу и пианисту Денни
    Фримену. Певец и гитарист Baby Boy WARREN, работник General Motors и оригинальнейший блюзмен Детройта - столетний юбилей.
    И песня Фэтса Уоллера "Ain't Misbehavin'", вышедшая в свет 90 лет назад и покорившая поп-музыку XX века. Слушать/Скачивать
    55 мин. 101 Mb
