    и уж совсем на грани парадокса - 60-летие MADAGASCAR SLIM, уроженца Мадагаскара, проживающего в Канаде и смешивающего
    народные мадагаскарские раздумчивые мотивы с блюзовыми традициями. А кроме того надо отметить завтрашний 90-летний юбилей
    легендарного чикагца Dave MYERS, солиста-гитариста группы Aces, отдавшегося игре на бас-гитаре всем пылом души. И уж совсем
    для любителей редкостей и странностей - 80-летие Andre WILLIAMS, специалиста зловещей мелодекламации. "ВЭБ",'
