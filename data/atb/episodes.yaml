  slug: atb-2015-11-30-guy-davis
  topic: GuyDavis
  description: В программе звучат записи, сделанные Гаем Дэвисом специально для «Эха Москвы» в ходе предыдущего визита, —
    «Black Coffee», «Saturday Blues», а также фрагменты интервью с музыкантом. Обсуждаются альбомы «Juba Dance» (совместно
    с Фабрицио Поджи) и «Kokomo Kid»; отдельно рассказывается об истории записи песни Блайнд Лемона Джефферсона «See That
