- date: '2020-11-16'
  slug: atb-2020-11-16-screaming-lord-sutch
  topic: ''
  description: '80 лет назад в Хэрроу, Мидлсекс, Великобритания родился вокалист и шоумен, выступавший как Вопящий Лорд Сатч.
    В начале 60-х он начал выпускать песенки-страшилки. Манерой исполнения он шел по пути, проторенному другим "Вопящим":
    Screamin'' Jay Hawkins. В 1964г. открыл "пиратскую радиостанцию" имени себя: Radio Sutch. На протяжении 60-х он регулярно
    баллотировался в Парламент от Национальной партии подростков (National Teenage Party). А взгляните на список музыкантов,
    которые записывались с ним еще до того, как стали знамениты на весь мир: Jimmy Page, Jeff Beck, Ritchie Blackmore, Nicky
    Hopkins и Mitch Mitchell. Кое-кто считает Лорда посредственным музыкантом. А хоть бы и так, зато весело, и у него явно
    был нюх на гениев рок-н-ролла (когда они еще не были "в звездах". И открытый характер. Ведь потом эти звезды никогда не
    отказывали ему, когда он снова приглашал их на запись. Wiki: David Edward Sutch (10 November 1940 - 16 June 1999), also
    known as 3rd Earl of Harrow, or The Official Screaming Lord Sutch Fan Club, was an English musician and serial parliamentary
    candidate. He was the founder of the Official Monster Raving Loony Party and served as its leader from 1983 to 1999, during
    which time he stood in numerous parliamentary elections. He holds the record for contesting most Parliamentary elections,
    standing in 39 elections from 1963 to 1997. As a singer he variously worked with Keith Moon, Jeff Beck, Jimmy Page, Ritchie
    Blackmore, Charlie Watts and Nicky Hopkins. А так же столетие @Annisten ALLEN. И еще есть поводы послушать@The Yardbirds
    и Vanilla Fudge. Программа Весь Этот Блюз'
  summary: 80-летие Вопящего Лорда Сача — британского шоумена-провокатора на грани блюза и рок-н-ролла.
