  slug: atb-2017-11-20-mose-allison
  topic: MoseAllison
  description: '11 ноября, в 1927 году, 90 лет назад, в Типпо, Миссиссиппи, родился
    Моуз Эллисон (Mose ALLISON). Пианист, певец и сочинитель гениальных песен, он
    изящно балансировал на гранях блюза и джаза, философии и повседневности, драйва
    и расслабленности. Его "Ферма Парчмен" (Parchman Farm) по-джазовому изыскана,
    а по-блюзовому так проста, что часто ее считают либо народной песней, либо сочинением
    одного из чернокожих рецидивистов, мотавших срок в этом заведении в 30-х годах.
    Программа "Весь Этот Блюз" к юбилею уникального артиста: Часть Первая'
  summary: 90-летие Моуза Эллисона — пианиста-певца, балансировавшего между блюзом
