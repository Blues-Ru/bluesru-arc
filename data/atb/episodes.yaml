  slug: atb-2020-10-19-manfred-mann-75
  topic: ''
  description: До того, как Manfred Mann's Earth Band добился славы прог-роком, существовал Manfred Mann Band. С начала 60-х
    он регулярно появлялся в верхней десятке чартов, а кроме того, весьма нетривиально играл блюзовые стандарты. В ознаменование
    80-летия Манфреда Манна посвятим часть программы именно этой странице его долгой и удачной карьеры. Во времена, когда
    все гитарные герои непременно играли блюз, Leslie West (и его главный хард-роковый проект Mountain) делать это избегали.
    Но вдруг в начале нынешнего века Вест выпустил ряд тяжелоблюзовых альбомов. В нынешнем октябре Весту исполнилось 75. Boozoo
    CHAVIS отметил бы 90-летие. Луизианец, он играл Zydeco/Cajun на бояне. Подробней в программе Весь Этот Блюз
  summary: 75-летие Манфреда Манна — блюзовое прошлое до Earth Band и прог-рока.
