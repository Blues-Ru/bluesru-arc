- date: '2020-09-07'
  slug: atb-2020-09-07-piedmont-blues
  topic: ''
  description: 'Пимонтский стиль - самый деликатный и аккуратный из блюзовых разновидностей.
    В конце 20 века лучшими, титулованным и прославленными в этом древнем стиле был
    дуэт Cephas & Wiggins . Гитаристу Джон Цефасу 4 сентября исполнилось бы 90 лет.
    Его отец был проповедником. Мать учила его с братом петь псалмы, каждый день они
    были в церкви. Джон работал плотником. Конечно, родители не одобряли его увлечение
    грешным блюзом. Но отец и сам был гитаристом, он и дал в руки Джону гитару. В
    остальном Джон Цифас был самоучкой. Поразительно, что он так безупречно чисто
    и сохраняя ритм как по метрному, научился играть на гитаре. "я всегда держал басовую
    линию большим пальцем, - говорил Джон Цифас. - она давала опору с мелодией, которую
    я играл на легких струнах. Гитара как бы разговаривала, рассказывала историю,
    подражала чувствам и словам из песни, а стабильный бас придавал пружинистый".
    120 лет тому назад, в Техасе родился Олджер Александр. В блюзе известный именно
    как Тексас Алекзандер. Исключительный случай в блюзе, он не играл, только пел.
    Зато аккомпанировали ему звезды: T-Bone Walker, Lonnie Johnson, Eddie Lang. Пел
    и кантри-блюз, и дискиленд. Голос довольно нежный, обходитьельный... Убил жену
    (за что отсидел пять лет). Умер в 54 года от запущенного сифилиса. И это тоже
    правда блюза. Но Лайтнинг Хопкинс, его кузен, с неподдельным восхищением его мастерством
    песенника, рассказывал как, стоя на грузовике на деревенской ярмарке, он перекрикивал
    шум, импровизируя куплет за куплетом - с неподдельным восхищением его мастерством
    песенника. Весь Этот Блюз'
  summary: 'Пьемонтский стиль: лучшие мастера деликатного блюза конца XX века.'
