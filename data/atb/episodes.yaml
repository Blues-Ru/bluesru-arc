  slug: atb-2018-04-23-eddie-king
  topic: EddieKing
  description: 'Программа отмечает 80-летие Эдди Кинга (род. 21 апреля 1938 года в Алабаме), чикагского блюзового гитариста.
    Рассказывается о его пути: переезд в Чикаго в 14 лет, учёба игре на гитаре рядом с Лютером Эллисоном, Мэджик Сэмом и Джуниором
    Уэллсом, прозвище Little King за сходство с манерой Би Би Кинга. Звучат дебютный сингл «Love You, Baby» (1960), песня
    «The Blues Has Got Me» из альбома 1987 года, записанного с сестрой Мэй Би Мэй, а также трек «Kitten Kat» из альбома «Another
    Cold Night» (1997), удостоенного премии W.C. Handy Award. Отдельно подчёркивается многолетняя работа Кинга штатным гитаристом
    в ансамбле Кока Тейлор, показанная на записи «Let the Good Times Roll» с Чикагского блюз-фестиваля 1987 года.'
  summary: 80-летие Eddie King — чикагского гитариста из окружения Koko Taylor
