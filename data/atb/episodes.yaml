  topic: JFuller
  description: '12 марта 1896 год - 125 лет назад - в Джоунсборо, Джорджия, родился
    Джесси Фуллер, получивший прозвище "Кот, который гуляет сам по себе" (Jesse "Lone
    Cat" FULLER). Оставшись в 50 лет без работы, он стал человеком-оркестром, аккомпанируя
    пению на гитаре, губной гармонике, ударных инструментах и собственного изобретения
    басовом инструменте, сделанном из обрезков рояльных струн: footdella. Jesse Fuller
    (March 12, 1896 - January 29, 1976) was an American one-man band musician, best
    known for his song "San Francisco Bay Blues". Программа Весь Этот Блюз'
