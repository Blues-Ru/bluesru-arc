- date: '2018-04-04'
  slug: atb-2018-04-04-jimmy-nelson
  topic: ''
  description: 'В программе отмечается приближающееся столетие со дня рождения Джимми «T-99» Нельсона (29 апреля 1927 года):
    звучат его хит «Rock Hard Blues», концертная «Insect Ball» совместно с Биг Джей МакНили, песня «My Civil Rights» и заглавный
    трек альбома «House of Blues». Также поздравляют с юбилеем Шемеку Копленд — дочь Лютера Копленда, чей дебютный альбом
    «Turn the Heat Up» она записала до 18 лет; в честь её дня рождения (10 апреля) звучит «I Pity the Fool» в дуэте с Робертом
    Креем. Продолжается тема 75-летия британского гитариста Тони Макфи, исполняющего композиции Мадди Уотерса, чей день рождения
    также приходится на 4 апреля. Кроме того, поздравляют Гей Адегбалолу (Saffire the Uppity Blues Women) с юбилеем и представляют
    Лютера «Guitar Junior» Джонсона — участника блюзбенда Мадди Уотерса, родившегося 11 апреля 1939 года.'
  summary: Юбилей Jimmy «T-99» Nelson; Shemekia Copeland, Tony McPhee, Gay Adegbalola, Luther Johnson
