  topic: ''
  description: 'В субботу, 6 марта, все прогрессивное муз/рок-человечество праздновало 75-летний юбилей Дэвида Гилмора, гитариста-вокалиста
    группы Pink Floyd. Внутренняя история Пинк Флойд достойна пера романиста. Но на выходе она давали альбомы такие, что оправдывали
    существовании рок-музыки вообще. Считается, что группа играла прогрессивный арт-рок, и тут не о чем спорить. Но альбом
    1975 года Wish You Were Here - это 45 минут блюза, несмотря на все гитарные примочки и квадрофоническое сведение... Если
    гитару Гилмора очистить от звукорежиссерских изысков, вы услышите типично блюзовые ходы. Да, есть галантно-европейские
    кружева. Но ноги-то растут из Чикаго. Если бы не Бадди Гай 60-х, Гилмору не на что было бы опереться. Из Пинк Флойд в
    передаче только одна короткая шутливо-тоскливая песня, в которой David Gilmour играет на губной гармонике. Плюс Comfortably
    Numb, записанная на концерте Гилмора в Гданьске. Остальное - блюзы из его гостевых выступлений. Так же в передаче: певица
    Tony Price, кантри и блюз. А так же тяжелый блюз от Walter Trout. Программа Весь Этот блюз'
  summary: '75-летие Дэвида Гилмора: Pink Floyd и блюзовые корни гитарного волшебника.'
