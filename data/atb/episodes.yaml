  topic: Cain
  description: 'Стартует российский гастрольный тур певца и мультиинструменталиста Chris Cain. 28 и 29 сентября он появится
    в Москве. Программа "Весь Этот Блюз" предлагает ознакомиться с записями из нескольких его альбомов за 30 лет: от дебютного
