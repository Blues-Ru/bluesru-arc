  slug: atb-2017-05-15-taj-mahal
  topic: TajMahal
  description: Программа "ВЕСЬ ЭТОТ БЛЮЗ" к юбилею певца, мультиинсрументалиста, композитора
    и знатока world music, музыкального этнографа, известного миру как Тадж Махал.
    В среду на этой неделе, 17 мая 2017 года, Тадж Махал отпразднoвал 75-летие, в
    связи с этим юбилеем мы сегодня и послушаем его альбом, вышедший всего десять
    дней назад - записанный дуэтом с Кебом Мо - посмотрим, чем сегодня интересуется
    ветеран и знаток блюза, который свой первый музыкальный контракт подписал более
    полувека назад. Возраст и опыт солидный, а в новом альбом полно легкомысленных
    и игривых любовных песенок
  summary: 75-летие Таджа Махала — певца и мультиинструменталиста. Часть II.
