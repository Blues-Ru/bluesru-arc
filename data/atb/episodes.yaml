- date: '2021-09-27'
  slug: atb-2021-09-27-don-nix
  topic: Nix
  description: 'Белый саус-кантри-блюз-рокер, певец, саксофонист, пианист и гитарист
    Дон Никс, 27 сентября 2021 года отпразднует 80-летие. О нем, о его знаменитых
    и не очень песнях - в программе Весь Этот Блюз. Биография у юбиляра запутанная,
    пестрая, - за деталями обращайтесь в Интернет, а лучше в библиотеку. Свою книгу
    он назвал метко: Memphis Man: Living High, Laying Low - Человек из Мемфиса: достигать
    высот, жить в тени. Он бывал знаменит, успешен и богат, но бросал все, надолго
    исчезал из музыки, и даже от друзей и родственников. Зарабатывать на жизнь ему
    давно не требуется - авторских отчислений за его песни хватает на жизнь безбедную,
    хорошо обеспеченную. Но, как он спел недавно, он сам принадлежит своим песням.
    Так что к подругам и женам он уже не возвращался, а на сцену возвращался обязательно,
    даже после 10-летнего антракта. Очередной камбак у него случился в первом десятилетии
    нынешнего века, почти 50 лет спустя после дебютной записи. Музыкально тяготел
    к южному року, но со значительным влиянием Мемфиского соул и ритм-энд-блюза, он
    начинал на студи Стакс, и это отпечаталось. Играл на сакофоне в круппе Bar-Keys
    и с двумя однокашниками в группе Booker T. & the MG''s. В 70-х с удовольствием
    много гастролировал, играя южный рок. Но в его концертах звучали и госпел, а непременным
    их участником был патриарх Дельта-блюза Furry Lewis. Знаменитая Going Down, которую
    записал Freddie King - его сочинения. А еще ее пели и записывали Jeff Beck, Deep
    Purple, JJ Cale, Marc Ford, Chicken Shack, Bryan Ferry, Pearl Jam, Gov''t Mule,
    Stevie Ray Vaughan, Joe Satriani, the Who, Led Zeppelin, Sammy Hagar, Joe Bonamassa...
    И будут ее петь и грядущие корифеи жанра. С другим Королем - Албертом (Albert
    King) - Никс тоже много сотрудничал. Записи его песен от 1951 до 2018 года в авторском
    исполнении, и в звездных (включая John Lord''s Hoochie Coochie Men) каверах -
    в программе Весь Этот Блюз'
  summary: 80-летие Дона Никса — саус-рокера, саксофониста и автора «Going Down».
  files:
  - filename: atb-2021-09-27-don-nix-part-9.mp3
    path: /atb/atb-2021-09-27-don-nix-part-9.mp3
- date: '2021-10-04'
  slug: atb-2021-10-04-branch
  topic: Branch
  description: 'Сегодняшние блюзовые юбиляры: Billy_Branch, Keb'' Mo... и внезапно
    примкнувший к ним Chubby Checker. Билли Бранч, мастер игры на губной гармонике,
    может и не самый яркий проводник чикагских блюзовых традиций в наши дни, но виртуоз
    и смачный артистичный и колоритный певец. Получив диплом политолога в Чикагском
    университете, ушел играть в ансамбль Вилли Диксона "Все звезды". Собрал проект
    "Сыны блюза" (Sons Of Blues), много работает и как солист, и как сайдмен, и как
    преподаватель блюзовых наук. Трижды номинировался на Grammy, но почтительно уступал
    граммофончики БиБиКингу и Эрику Клэптону. А вообще его губная гармоника звучит
    в двух с половиной сотнях альбомов! Кевин Мур, ныне известный в блюзе как Кеб-Мо.
    Профессионально выступать начал в 1972 г., но дебютный альбом выпустил только
    22 года спустя. Отлично знает традицию, но в своих альбомах отрабатывает чистый
    современный саунд с прилежанием перфекциониста. Неоднократный лауреат "Грэмми".
    Ну и Чабби "Снова станцуем твист" Чеккер для пикантности. Весь Этот Блюз'
  summary: 'Юбиляры: Билли Бранч — харпер Чикаго, Keb'' Mo и Chubby Checker.'
