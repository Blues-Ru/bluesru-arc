  slug: atb-2011-01-10-sam-chatmon
  topic: Chatmon
  description: '"Работал я все лето и осень, я даже Рождество встречал в рабочем комбинезоне. Тем временем она ушла, а я и
    не переживаю - я словно сижу на вершине мира". От Sittin'' on Top of the World невозможно устать, если вы любите блюз.
    Впрочем, она и на эстраде, и в джазе известна, и кантри-музыканты считают ее своей. А уж в блюзе - это просто азбука.
    Sam Chatmon - один из трех трех братьев, создавших группу "The Mississippi Sheiks и вместе записавших эту песню, сказочно
    популярную с 1931 года. В 40-х, когда кантри-блюзовые пластинки перестали покупать, Сэм Чэтмон на двадцать лет вернулся
    работать на ферме. Как и музыка, труд на земле был знаком ему с пеленок. А в начале 60-х, на волне фолк-блюзового бума
    снова стал выступать, но уже не как модный, танцевальный развлекатель/interteiner, а как патриарх и гуру блюза. Долгожитель,
    образцовый фолк-блюзмен! Последний его альбом - с белыми мальчиками-шашлычниками - яркий и энергичный. Записан в 1981
    году, ровно полвека спустя после его студийного дебюта в рядах "Шейхов Миссиссиппи. В вообще, вундеркинд из музыкальной
    семьи, он выступал с 4 лет. А сегодня - 125-летие со дня рождения Сэма Чэтмона. Весь Этот Блюз'
  summary: 125-летие Сэма Чэтмона (Mississippi Sheiks) — патриарха фолк-блюза и «Sitting on Top of the World».
