  slug: atb-2018-04-02-adam-gussow-hans-theesink
  topic: I
  description: 'Выпуск посвящён блюзовым юбилеям начала апреля 2018 года. Адаму Гусову — 60 лет: рассказывается о его уличной
    карьере, дуэте Satan and Adam со Стерлингом Маги, сольном альбоме «Kick and Stamp» (2013) и научно-преподавательской деятельности
    в университете Оксфорда, штат Миссисипи. Голландскому гитаристу Хансу Цейсингу исполнилось 70 лет — звучат его записи
    с американским вокалистом Терри Эвансом, в том числе «Delta Time» и кавер на «Maybellene» Чака Берри. Отмечается 120-летие
    Пола Робсона: его спиричуэлс, «St. Louis Blues» У. К. Хэнди и история преследований в эпоху маккартизма. Также звучит
    «Bottle Up and Go» Томми Маклина — к 110-летию со дня его рождения.'
  summary: 'Апрельские блюзовые юбилеи: Адам Гусов (60 лет), Ханс Цейсинг (70 лет), Пол Робсон (120 лет), Томми Маклин (110
    лет).'
