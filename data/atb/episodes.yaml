  slug: atb-2020-03-02-primer-mc-farland
  topic: Primer McFarland
  description: Рико МакФарланд (Rico MCFARLAND), который 5 марта будет праздновать
    свое 60-летие. Имя в блюзе не самое громкое и у него всего-то один сольный альбом,
    зато он аккомпанировал корифеям, а кроме Koko_Taylor это еще и James_Cotton, Junior_Wells,
    Son_Seals, Sugar Blue, Lucky_Peterson. И это еще не весь список, по блюзовым меркам
    - жизнь удалась. Тем удивительней, что его единственный сольный альбом называется
    Tired of Being Alone. Замечательный альбом со свингующими медными, с прифанкованным
    по-блюзовому ритмом, с яркой современной блюзовой электрогитарой. Но в том же
    1999 году Макфарланд участвовал в записи традиционалистского акустического альбома
    Джеймса Коттона. И в акустике он тоже совершенно органичен. Сего дня же, но 75
    лет назад в Миссиссиппи родился Джон ПРАЙМЕР (John PRIMER). Он играл вторую гитару
    у Muddy Waters, Willie Dixon, Magic Slim - прежде чем записал первый альбом и
    начал выступать самостоятельно. В 2006 году (при участии группы Омара Итковицы)
    выступал в Москве, продемонстрировав отличную чикагскую выдержку блюза. Фоторепортаж
    из ЦДХ и Дома у дороги (вот где было весело и душевно). Программа Весь Этот Блюз
    о сегодняшних юбилярах
  summary: 'Рико МакФарланд — 60 лет: сольный дебют и годы с Johnnie Johnson и Keb''
    Mo.'
