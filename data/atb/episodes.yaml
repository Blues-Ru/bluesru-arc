  slug: atb-2018-05-00-alexis-korner
  topic: KornerI
  description: 'В апреле нынешнего года (если бы не рак легких) 90-летие отпраздновал бы великолепный и неподражаемый еврее-греко-турок
    из Лондона Алексиз Корнер. В Лондоне, под фашистскими бомбами он слушал пластинку Джимми Янси. "С того времени все, чего
    я хотел - это играть блюз", - вспоминал он. Корнер не только играл блюз сам. Он создал удивительный блюз-дет-сад: группу
    Blues Incorporated. Из нее вышли и "Роллинг Стоунз", и "Лед Зепплин", и... слишком многих придется перечислять. Раздолбайство
    как творческий метод - это про него. и у него получалось отлично! программа "Весь Этот Блюз" - к юбилею.часть I часть
    II часть III часть IV'
  summary: 90-летие Алексиса Корнера — крёстного отца британского блюза. Часть I.
