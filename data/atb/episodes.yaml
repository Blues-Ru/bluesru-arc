  slug: atb-2018-03-05-canned-heat
  topic: CannedHeat
  description: 'Программа приурочена к 75-летию Боба Хайта (26 февраля) — лидера группы Canned Heat по прозвищу «Медведь».
    В эфире звучат записи группы разных лет: «Let''s Work Together» и «Hey Baby» с концерта в Карнеги-холл (1971) совместно
    с Джоном Ли Хукером, а также «Bullfrog Blues», «Evil Is Going On» Уилли Диксона, «Future Blues» и «Election Blues» авторства
    самого Хайта, блюзовый стандарт «Got My Mojo Working» и классика Блайнд Лемона Джефферсона «One Kind Favor». Отдельно
    упоминается песня «The Bear» Джона Мэйолла с альбома «Laurel Canyon» (1970) — воспоминание о посещении хипповой коммуны,
    которой руководил Боб Хайт.'
