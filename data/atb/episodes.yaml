    песнях и каторжном труде, а также о своём опыте воплощения образа Роберта Джонсона в бродвейском спектакле. В выпуске
    также звучат «No Way to Get Along» Роберта Уилкинса и чикагская классика «Little Red Rooster» Вилли Диксона.
