  topic: CoreyHarris
  description: 'Программа приурочена к гастролям Кори Хэрриса по России в январе 2018 года. Звучат песни из его дебютного
    альбома «Between Midnight and Day» (1995), «High Fever Blues» (1997) и трека из альбома «Fulton Blues» (2014), а также
    интервью, записанное в студии «Эха Москвы» в 2016 году, где музыкант рассуждает о природе блюза и различиях между акустической
    и электрической гитарой. В первой части выпуска отмечается 90-летие Рут Браун (1928–2006): рассказывается о её карьере,
    хитах вроде «Mama, He Treats Your Daughter Mean» и премии «Тони» за роль в бродвейском мюзикле «Black and Blue».'
  summary: 'Corey Harris; 90-летие Ruth Brown: интервью и живые записи'
