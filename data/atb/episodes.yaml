- date: '2019-11-25'
  slug: atb-2019-11-25-vernon
  topic: Vernon
  description: 'Сегодня празднует 75-летний юбилей Майк Вернон, гений блюзового продюсирования, основатель лейбла Blue Horizon.
    Он "делал" альбом "Блюзбрейкерз" с участием Эрика Клэптона", который теперь почитается краеугольным камнем в истории британского
    блюза и блюз-рока вообще. Если перечислять всех музыкантов, чьи записи он продюсировал в 60-х, то получится почти полный
    справочник британского блюза: John Mayall, Fleetwood Mac, Chicken Shack, Duster Bennett, Savoy Brown и Ten Years After.
    Он записывал и гастролирующих в Европе американских блюзменов: Чэмпиона Джека Дюпри, Отиса Спэнна и еще дюжину других,
    знамеитых и нет. Основатель лейбла Blue Horizon. В начале 70-ых выпустил два собственных альбома как вокалист и харпер.
    Ему аккомпанировали гитаристы Рори Гэллахер и Пол Кософф, барабанщик Мик Митчелл, а сам Билл Грэхам сыграл на тромбоне.
    И после более чем 40-летнего перерыва, в прошлом году еще один сольный альбом. Вот же человек, не знающий покоя! А 23
    ноября будет праздновать 70-летие Holger Petersen, канадскийский бизнесмен, радиоведущий и основатель лейбла Stony Plain
    Records. А начнет Betty Everett, в 1963 году записавшая милую версия жесткого блюза Hound Dog. Весь Этот Блюз 25.XI.2019'
  summary: 75-летие Майка Вернона — гения блюзового продюсирования, создателя Blue Horizon.
