  slug: atb-2019-04-22-costello
  topic: Costello
  description: 'В программе отмечаются два апрельских юбилея. Джону Кею, основателю группы Steppenwolf, исполнилось 75 лет:
    звучат «Born to Be Wild», «Hoochie Coochie Man» и «Screaming Night Hog». Основная часть посвящена Шону Костелло — выдающемуся
    блюзовому гитаристу, скончавшемуся в 29 лет от случайной передозировки снотворного. Обсуждаются его альбомы «Call the
    Cops» (1996), «Cuttin'' In» (2000), «Sean Costello» (2000) и посмертные записи; звучат версии песен Фентона Робинсона,
    Роберта Джонсона (дуэт с Сюзан Тедески), Отиса Раша и Томми Джонсона. Ведущий отмечает особый природный талант Костелло
    и трагически оборвавшуюся карьеру.'
  summary: 40-летие Sean Costello; 75-летие John Kay (Steppenwolf)
