    и участницы трио Safire the Uppity Blues Women, с фрагментами из её детского альбома «Blues and All Flavors» и архивной
    записи «Middle Age Blues Boogie». Третий юбиляр — Тони Макфи, основатель британской группы Groundhogs, отметивший 70-летие;
