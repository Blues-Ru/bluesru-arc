  slug: atb-2018-06-18-jimmy-oden
  topic: OdenI
  description: 'Программа Весь Этот Блюз к вчерашнему юбилею Сентлуисца Джимми Одена.
    Он родился 115 лет тому назад в Нэшвилле, профессиональным музыкантом стал в Сент-Луисе,
    отыграл там 10 лет, и, когда переехал в Чикаго, получил соответствующее прозвище:
    St. Louis Jimmy Oden. Пианист и певец, он сочинил блюзы, которые играли по обе
    стороны Атлантики, и позже и в Японии и Новой Зеландии. Играли и будут играть.
