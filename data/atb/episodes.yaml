- date: '2021-08-30'
  slug: atb-2021-08-30-charlie-burse-buster-brown
  topic: ''
  description: 'В августе были еще два мощных блюзовых юбилея: 120 лет со дня рождения
    Charlie Burse и 110 лет со дня рождения харпера Buster Brown. Есть, по счастью,
    блюзмены, чьи имена известны далеко за пределами жанра. Они бесспорно, выдающиеся
    таланты. Но их музыка, их достижения не на пустом месте взошли. Почву щедро сдабривало
    все сообщество, от заработка никто не отказывался, но не слава и богатство были
    мотивацией. А преданность музыке, которой было пропитано их детство. Обновляя
    ее звучание, они хранили неизменной суть. Нынешние юбиляры славы не снискали,
    хотя в свое время имели краткий успех. Бюрс начал в колыбели с трещотки-погремушки,
    виртуозно играл на ложках, на расческе, потом на фортепиано, и на саксофоне, и
    на всем, что со струнами: от укулеле до скрипки, включая палку от швабры, воткнутую
    в бочку с привязанной к ним веревкой - в общем, все инструменты, характерные для
    джаг-бэнда, танцевального оркестра народной музыки Юга США, были ему знакомы с
    детства. Он записывался и сольно, но первую известность приобрел именно как участник
    Мемфис Джаг Бэнда, оставившего славный след в истории афроамериканской музыки,
    той, что, так сказать, от сохи. После дня в поле под палящим солнцем душа миссиссиппского
    или мемфисского полевого рабочего хотела развернуться в танце. Сейчас звучание
    их музыки может показаться очень некомфортным, в чем-то нелепым, и определенно
    это спонтанная попытка уложиться в стандарт трех минут (на танцах-то они играли,
    пока сил хватает у танцоров). И все-таки, если вслушаться, обаяние, азарт, человечность
    этой музыки без нот пробивается через девять десятилетий в наши дни. Бастер Браун
    - харпер с одним альбомом в дискографии, зато название какое: New King of the
    Blues. Послушайте танцевальный народный блюз 90-летней и 60-летней давности в
    программе Весь Этот Блюз'
  summary: 120-летие Чарли Бёрса и 110-летие харпера Бастера Брауна — малоизвестные
    жемчужины блюза.
  files:
  - filename: atb-2021-08-30-charlie-burse-buster-brown.mp3
    path: /atb/atb-2021-08-30-charlie-burse-buster-brown.mp3
- date: '2021-09-06'
  slug: atb-2021-09-06-floyd-council
  topic: ''
  description: '110 лет назад, в штате северная Каролина родился кантри-блюзмен Floyd
    COUNCIL - тот самый, в честь которого половина названия группы Pink Floyd (Которого
    Cyd Barret и не слышал, когда сочинял название для группы - почему так вышло?
    Ответ простой). 125 лет назад Edith Goodall родилась в Луисвилле, штат Кентукки,
    в 1896 году. Певица и актриса, вошедшая в историю блюза как Edith Wilson (оба
    ее мужа носили фамилию Вилсон). Выступать на сцене начала в 1919 году, первую
    пластинку выпустила сто лет назад, пела перед публикой в последний раз в 1980
    году на знаменитом Ньюпортском джаз фестивале - за год до смерти. А так же сегодняшние
    блюзы-юбиляры: Blues In The South by Louis ARMSTRONG (чье 120-летие справляли
    в августе) и Thats All Right Mama by Arthur Big Boy Crudup. С исполнения этой
    песни Элвисом Пресли началась легенда-поговорка "Белые украли нашу музыку". Все
    это подробней и с классной старинной музыкой - в программе Весь Этот Блюз'
  summary: 110-летие Флойда Кансела — блюзмена, именем которого наполовину назвалась
