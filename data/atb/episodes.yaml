  description: '"...На сцене он держится ближе к кулисам. К сожалению, в жизни сдержанности ему не хватало. Что и привело
    к раннему концу его музыкальной жизни. Через три года после этого фестивального выступления он попал в тюрьму за убийство
    двух человек: своей подруги и патрульного полицейского, отсидел 16 лет, но воли так и не увидел, он умер в тюрьме от рака
    легких. Самое удивительно, что Пэт Хэир сам напророчествовал себе свою судьбу, записав в 1954 году песню I''m Gonna Murder
    My Baby - я убью свою малышку. Песня с жуткой неотвратимостью, отчаяньем и страстью. И поразительной для 54 года гитарой."
