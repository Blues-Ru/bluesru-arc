- date: '2018-07-02'
  slug: atb-2018-07-02-buddy-guy
  topic: GuyI
  description: 'Андрей Евдокимов рассказывает о новом альбоме Бадди Гая «Blues Is Alive and Well», вышедшем в июне 2018 года.
    Альбом отличается мягким и искренним звучанием; четыре песни посвящены теме ухода из жизни. В записи участвуют звёздные
    гости: Джефф Бек и Кит Ричардс («Cognac»), Мик Джаггер на губной гармонике («You Did the Crime»), а также молодой британский
    музыкант Джеймс Бэй («Blue No More»). Большинство песен написаны продюсером альбома Томом Хэмбриджем в соавторстве с Ричардом
    Флемингом; единственная авторская композиция самого Гая — «Old Fashioned». Среди звучащих в эфире треков — кавер на «Nine
    Below Zero» Сонни Боя Уильямсона II и завершающая «Oh Daddy» в духе Джона Ли Хукера.'
  summary: 'Buddy Guy «Blues Is Alive and Well» (2018): новый альбом накануне 82-летия'
