  slug: atb-2018-12-10-harmonicats
  topic: Harmonicats
  description: 'В этом выпуске программы Весь Этот Блюз: два юбиляра, которые не блюзмены, но блюзу добрые попутчики. 1 января
    исполнилось 100 лет со дня рождения Jerry Murad, по национальности турка, выросшего в Чикаго, чей ансамбль The Harmonicats,
    состояший только из губных гармоник, пользовался огромной популярностью в середине прошлого века. Это необычной звучит
    сегодня, а записано прекрасно. 4 декабря отпраздновал 70-й день рождения колоритный рокер из Нью-Джерси Southside Johnny.
    Блюз он непременно включал в свой репертуар на протяжении долгой карьеры'
