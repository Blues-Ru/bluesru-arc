  slug: atb-2021-09-13-noel-redding
  topic: Redding
  description: 'Одна из самых знаменитых песен в истории американской музыки ХХ века - (Sittin'') On The Dock Of The Bay.
    Автор песни - певец и композитор Отис Реддинг, которому 9 сентября 2021 года исполнилось бы 80 лет. Да жаль, он прожил
    всего 26. Однако этих лет ему было достаточно, чтобы подняться до вершин популярности и войти в историю. (Sittin'') On
    The Dock Of The Bay - последняя его песня: "Сидя на пристани, глядя на волны и корабли, попусту тратя время". Чужие песни,
    которые Реддинг брался петь, он превращал в свои. Как правильный скульптор, он брал главное, отсекал лишнее. Получалось
    бесцеремонно, но по энергетике мощнее оригинала. A Hard Day''s Night в его интерпретации, это чистый Мемфис: далеко не
    Мерси-бит Битлз, а дикий необузданный соул, настолько анархичный, каким через десять лет будет панк. У него, судя по напору,
    после тяжелого трудового дня герой возвращается вечером домой к жене и с порога готов к подвигам. Искусство соул основано
    на тонких вокальных нюансах, на изумительном сочетании гармонии и ритма. Часто даже у самых мастеровитых исполнителей
    соул превращается в набор штампов, и в конце-концов - в сладкую патоку. Но только не у Отиса Реддинга. И лирические баллады,
    и напористый ритм-энд-блюз у него были насыщенны искренностью чувства открытым переживанием. И в студии, и на сцене в
    нем зажигался огонь, оркестр и публика горели вместе с ним безоглядно. Программа Весь Этот Блюз - к 80-летию со дня рождения
    Отиса Реддинга'
  summary: 80-летие Отиса Реддинга — автора «(Sittin') On The Dock Of The Bay».
