  topic: VA
  description: 'Выпуск посвящён нескольким юбилеям: Бадди Майлзу исполняется 70 лет — звучат треки с дебютного сольного альбома
    «Express Way to Your Skull» (1968) и песни группы Electric Flag. Техасский харпер Пол Орта отмечает 60-летие; представлен
    его дуэтный альбом «Poncho Blues» (2008) с гитаристом Тони де ла Пеньей. Кантри-блюзмену Джимми Роджерсу исполнилось бы
    120 лет: звучат «The Brakeman''s Blues», «T.B. Blues» и «Blue Yodel No. 1». Также упоминается 90-летие харпера Хармоника
    Фэтса (Харви Блэкстона) с композицией «Downtime Blues».'
