  slug: atb-2015-11-09-bobby-rush
  topic: BRush
  description: 'Программа целиком посвящена блюзмену Бобби Рашу: от детских воспоминаний о том, как отец-проповедник впервые
    сыграл ему блюз, до его творческого пути через Арканзас и Чикаго. Обсуждаются знаковые записи — хит 1971 года «Chicken
    Heads», акустический альбом «Rooster Tooster» (2008), принёсший две премии Blues Music Awards, а также альбомы «Black
    Snake» (2009) и «Decisions» (2014). Упоминается московские гастроли Раша в 1999 году и его знакомство с Элмором Джеймсом,
    Мадди Уотерсом и Хаулин Вулфом. Звучат треки «Boogie in the Dark», «Swing Low», «Make Love to You» и «Another Murder in
    New Orleans» в дуэте с Доктором Джоном.'
