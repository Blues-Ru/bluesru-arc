- date: '2018-10-18'
  slug: atb-2018-10-18-chicago-rolling
  topic: Chicago Rolling
  description: В выпуске рассматриваются два сюжета. Первый — вышедший в 2018 году альбом «Chicago Plays the Stones», в котором
    чикагские блюзмены Джон Праймер, Бадди Гай, Робби Бейкер Брукс и другие исполняют хиты Rolling Stones в манере чикагского
    электроблюза; особо выделяется дуэт Бадди Гая и Мика Джаггера в песне «Heartbreaker». Второй сюжет посвящён 100-летию
    со дня рождения Бобби Траупа (18 октября 1918 года) — автора легендарной «Route 66», впервые ставшей хитом в исполнении
    Нэта Кинга Коула в 1946 году и впоследствии записанной Чаком Берри, Rolling Stones, Depeche Mode и многими другими. Ведущий
    рассказывает о малоизвестных страницах биографии Траупа, его мягкой свинговой манере и других его сочинениях, в том числе
    «The Girl Can't Help It» для Литтл Ричарда.
  summary: Альбом «Chicago Plays the Stones» и 100-летие Бобби Траупа, автора «Route 66».
