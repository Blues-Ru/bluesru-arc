  topic: ''
  description: К 75-летию певицы р-н-б Jackie Ross, певшей госпел на радио с трех-летнего
    возраста, а, оказавшись в Чикаго, дебютировала в 16-летнем возрасте на Chess Records.
    Другое юное дарование - из совсем другой эпохи. Johnny Lang. Первый альбом записал
    в 14 лет, поразив взрослым голосом, по-блюзовому хриплым (а Джекки пела ангельски
    чистым голоском), и зрелой игрой на гитаре. У Лэнга в дискографии 8 альбомов,
    одна премия Грэмми, а дома пятеро детей. Он записывал альбомы с Вилли Нельсоном,
    Синди Лопер, Марком Нопфлером и Бадди Гаем - все высшая лига. Принимал участие
    в фильме Блюз-Бразерс 2000, несколько раз выступал в фестивале Эрика Клэптона
    Кроссроадз... В общем, есть, чем гордиться. В жизни религиозен, воспитывает пятерых
    детей. Вчера ему исполнилось 40! Весь Этот блюз про юбиляров
