- date: '2021-01-18'
  slug: atb-2021-01-18-captain-beefheart-80
  topic: ''
  description: 'Дон Ван Влит родился 15 января 1941 года. Вполне хорошее имея для сцены, но он предпочел Captain Beefheart
    - Капитан Бычье сердце. В детстве считался вундеркиндом, хорошо учился, а вырос эксцентриком и анархистом. Капитан выпустил
    чертову дюжину альбомов, представляющих то, что называется, закрученной музыкой: авангард и стеб. Но начинал он с блюза,
    к которому относился со всем почтением. От его 60-х остались бутлегерские записи, вполне приличного качества. Вещества,
    расширяющие сознание с свободная любовь на пленку не попали, но волшебным образом чувствуются и полвека спустя. А вот
    отличный горячий блюз, очень правильный, чикагский, но в авторском прочтении - можно послушать. Вот чтобы по возможности
    побывать в Калифорнии, в столице хиппи СанФранциско - послушаем три песни из бутлегерного альбома 1966 танцзал Avalon
    Ballroom. Первая - старинная 03_St. James Infirmary - Лазарет Святого Якова. Песня всем известна, но обычно в стебовом
    исполнении. Так ее делала Кэб Кэллоуэй. Но, Кэптейн Бифхарт таков, что когда все плачут, он смеется, и наоборот. Когда
    всем смешно, он серьезен до пафоса. 15 января 6му исполнилось бы 80 лет. Еще в программе: 105 лет со дня рождения Jay
    McSHANN, пианиста и руководителя оркестра, лидера джамп-блюза Кэнзас Сити; 90-летия певицы Jeanne CARROLL; 80-летие английского
    певца-гитариста Long John Baldry и 125-летие певицы Mama Yancey. Цифры прям монументальные, но блюз живой и брыкается!
    Весь Это Блюз'
  summary: 80-летие Капитана Бифхарта — Дона Ван Влита, гения аванграда на грани блюза и сюрреализма.
