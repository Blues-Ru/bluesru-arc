  description: Отмечаем 75-летие со дня рождения рок/блюз-гитариста Bugs Henderson, родившегося 22 октября 1944 года в Палм-Спрингз
    (штат Калифорния). 1. Have Blues... Must Rock (Bugs Henderson & The Shuffle Kings, альбом "Have Blues... Must Rock", 1998
    г.) Круглая дата - 100 лет со дня рождения вокалиста Crown Prince Waterford. Он родился 21 октября 1919 года в Джонсборо
    (штат Аризона). 2. Coal Black Baby (альбом "The Chronological Crown Prince Waterford 1946-1950" 2001 г., запись 19 ноября
    1947 г.) 3. Hard Driving Woman (альбом "The Chronological Crown Prince Waterford 1946-1950" 2001 г., запись 15 марта 1950
    г.) 4. Satisfied Blues (альбом "The Chronological Crown Prince Waterford 1946-1950" 2001 г., запись 1946 г.) 5. Time to
    Blow (альбом "The Chronological Crown Prince Waterford 1946-1950" 2001 г., запись 15 марта 1950 г.) 6. Crown Prince Blues
    (альбом "The Chronological Crown Prince Waterford 1946-1950" 2001 г., запись 19 ноября 1947 г.) 7. Undercover Blues (альбом
    "The Chronological Crown Prince Waterford 1946-1950" 2001 г., запись 13 марта 1947 г.) 8. Girl Friend Blues (альбом "The
    Chronological Crown Prince Waterford 1946-1950" 2001 г., запись 1946 г.) 9. It's My Own Fault, Baby (Bugs Henderson, альбом
    "Legendary Jams (1976-1980 Historic Live Recordings)" 1997 г.) Певец и гитарист Tony Joe White скончался год назад - 24
    октября 2018 года в Нэшвилле (штат Теннесси). 10. Baby Please Don't Go (альбом "Bad Mouthin'" 2018 г.) 11. Boom Boom (альбом
    "Bad Mouthin'" 2018 г.) Певица Shirley King (дочь B.B.King) родилась 70 лет назад - 26 октября 1949 года в Западном Мемфисе
    (штат Арканзас). 12. Everyday I Have the Blues (альбом "Jump Through My Keyhole" 1992 г.) 13. You're Gonna Make Me Cry
    (O.V. Wright, альбом "(If It Is) Only For Tonight" 1965 г.)99M; 54'13"
