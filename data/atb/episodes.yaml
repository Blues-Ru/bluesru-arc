- date: '2021-12-06'
  slug: atb-2021-12-06-american-blues-1968
  topic: ''
  description: 'В 1968 году вышли два альбома группы под названием American Blues. "Американская печаль" - если переводить
    без нюансов - это и хипповые баллады, и психоделический сюр, и прогрессивно-блюзовые эксперименты в сторону тяжелого рока.
    Лидером полистилистичной банды был Rocky Hill. Dusty Hill, басист и его младший брат, и барабанщик Frank Bird обрели славу
    в группе ZZ Top. Рокки затерялся в техасской блюз-роковой тусе. Зато когда в 80-х стал выпускать сольные альбому, компанию
    ем в студии составили тузы техасского блюза: Albert Collins, Johnnу Winter, Kim Wilson и иже с ними. 1 декабря Рокки Хиллу
    исполнилось бы 75 лет. 2 декабря отпраздновал 80-летие Tom MacGuiness, басист, гитарист, композитор, сооснователь британского
    Blues Band. Еще по-быстренькому отметим юбилеи солнечного Louis Prima, разумный Robben FORD, фьюжинист-"фокусник" Ian
    Akkerman - все блюзу не чужие люди. 120 лет назад где-то в Миссиссиппи родилась Irene SCRUGGS - это классический блюзовый
    вокал, да еще и с виртуозом Blind Blake. И вот все это - в одной программе Весь Этот Блюз'
  summary: 'American Blues 1968: психоделический и прогрессивный блюз на заре хард-рока.'
