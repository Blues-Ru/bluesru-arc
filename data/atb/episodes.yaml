  description: В программе отмечаются дни рождения нескольких музыкантов. Тайни Брэдшоу (115 лет) — автор хита «The Train
    Kept A-Rollin'», подхваченного The Yardbirds, Aerosmith и Led Zeppelin. К 85-летию Фентона Робинсона вспоминают его стандарты
    «Somebody Loan Me a Dime» и «As the Years Go Passing By», а также участие в первой записи «Texas Flood» Ларри Дэвиса.
    Также звучат записи Розы Ли Хилл, зайдико-дуэта Фальконов, дельта-блюзмена Хьюстона Стэкхауса. Отдельный рассказ посвящён
    Тейлдрэггеру — чикагскому последователю Хаулин Вулфа, чья биография включает дружбу с Вулфом, криминальный эпизод 1993
    года и выступления в Москве.
