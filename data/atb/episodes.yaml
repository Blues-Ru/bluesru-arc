  slug: atb-2018-05-07-steve-winwood
  topic: I
  description: Сегодня 75-й день рождения Пола Самвелла-Смита (Paul Samwell-Smith),
    бас-гитариста, композитора, аранжировщика, продюсера, впервые прославившегося
    как основатель группы the Yardbirds и автор их главных хитов. Так ж в этой программе
    Весь Этот Блюз 75-летие его земляка Стива Винвуда (Steve Winwood), певца, клавишника,
    игравшего еще и на всех струнных от бас-гитары до скрипки, и участника знаменитых
    соул-, блюз-, и блюз-рок-групп. К 80-летию Тайрона Дэвиса (Tyrone DAVIS) послушаем
    одну его песенку ровно полувековой давности. Ну а главное время уделим новому
    альбому Бена Харпера и Чарли Масселвайта
  summary: 75-летие Пола Самвелл-Смита — продюсера Yardbirds и Кэт Стивенса. Часть
