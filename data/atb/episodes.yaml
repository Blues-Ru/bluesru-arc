  slug: atb-2019-02-25-harris
  topic: Harris
  description: 'Программа полностью посвящена юбилею Кори Харриса (род. 21 февраля 1969 года): звучат песни из его альбомов
    «Between Midnight and Day» (1995), «Fish Ain''t Biting» и «Fulton Blues» (2014), а также записи, сделанные им живьём в
    студии «Эха Москвы». В интервью Харрис рассказывает о своём знакомстве с малийским музыкантом Али Фарка Туре, совместном
    альбоме «From Mali to Mississippi» и участии в проекте Мартина Скорсезе «Feel Like Going Home». Отдельно обсуждается африканское
    происхождение блюза и написанная Харрисом книга о жизни и музыке Али Фарка Туре. Прозвучали также записи с Осой Тёрнером
    и посвящение памяти барабанщика Джона Гилмора.'
