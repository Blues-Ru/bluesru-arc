  topic: NY
  description: Праздничный выпуск программы целиком посвящён рождественской и новогодней тематике в блюзе. Прозвучали песни
    Кэб Мо, Эдди Си Кэмпбелла, Кларенса Картера («Back Door Santa», 1968), Уильяма Кларка, Руфуса Томаса, Мэйбл Скотт («Boogie
    Woogie Santa Claus», 1948) и оркестра Каунта Бейси с Джимми Рашингом. Особое место заняла история песни «Please Come Home
    for Christmas» Чарльза Брауна (1960) — в редкой версии братьев Уинтер (Джонни и Эдгар) 1965 года. Три «Кинга» блюза —
    Би Би, Фредди и Альберт — также представлены своими рождественскими номерами. Завершили выпуск поздравительные песни Лайтнин
    Хопкинса («Happy New Year») и комический дуэт Баттербинз и Сьюзи («Ain't No Santa Claus», 1928).
  summary: 'Новогодний блюз: Keb'' Mo'', B.B. King, братья Winter — о Санта-Клаусе и праздниках'
