  slug: atb-2021-11-20-allman
  topic: Allman
  description: 'Сегодня исполнилось бы 75-лет пламенному гитарному импровизатору, новатору и первопроходцу южного рока, одному
    из плеяды гитарных героев конца 60-х - Дюану Оллману. Вместе с братом Греггом (вокалистом, органистом, композиоором) он
    создал группу, предопределившую развитие южного рока (и, кажется, судьбу многих лидеров этого движения). В начале пути
    Группа братьев Оллман держалась блюзовых корней, переигрывая на актуальный манер классику жанра от сельских блюзов, до
    первых городских электрических. У Дюана была отличная школа студийной работы с мастерами блюза и соул: Aretha Franklin,
    Wilson Pickett, Clarence Carter, King Curtis, Johnny Jenkins... И с другими реформаторами блюза его эпохи: Eric Clapton,
    Bob Scaggz и John Hammond, мл. Блестящая игра Дюана Оллмана буквально завораживала публику, вводила в музыкальный транс
    его коллег по сцене - и песни длились по 10, 20 минут, не наскучивая. В них был совсем неангельский полет. Но это было
    нечто небесное. В близком кругу Дюана звали Sky Dog - Небесный пес. Он погиб в мотоциклетной аварии, немного не дожив
    до 25 лет. Но музыка его не утратила полетного огня и "песьего" задора. Весь Этот Блюз'
  summary: 75-летие Дюана Оллмана — гитарного новатора и сооснователя Allman Brothers Band.
