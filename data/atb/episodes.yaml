- date: '2019-06-24'
  slug: atb-2019-06-24-beck
  topic: Beck
  description: 'Программа «Весь этот блюз» посвящена 75-летию Джеффа Бека — одного из величайших гитаристов современности.
    Ведущий Андрей Евдокимов рассказывает о ключевых альбомах музыканта: блюз-роковом «Truth» (1968) с Родом Стюартом, яростном
    «Loud Hailer» (2016) и записях трио Beck, Bogert & Appice. Особое место занимает история песни «Train Kept A-Rollin''»
    — от Тини Брэдшоу до The Yardbirds и легендарной сцены из фильма Антониони «Blow-Up». Также упоминается совместная работа
    Бека с Бадди Гаем на альбоме «Damn Right, I''ve Got the Blues» и эффектное выступление с Бет Харт, исполнившей «I''d Rather
    Go Blind».'
