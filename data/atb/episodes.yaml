  topic: I
  description: 'Блюзовые юбилеи прошедшей недели в программе Весь Этот Блюз: ветхозаветный джаз-блюзовый классик Perry BRADFORD,
    сочинивший первый в истории блюз, записанный на граммпластинку - 125 лет; 100-летие певицы Beulah BRYANT, обладательницы
    уникального по тембру голоса; 120-летие пианиста, степиста и садовника Джимми ЯНСИ (Jimmy YANCEY); и, помоложе, но тоже
    даты солидные, музыканты совершенно разных стилей Bobby CHARLES и Texas Johnny BROWN. А в анонс к завтрашнему юбилею светлого
    и доброго Fats DOMINO его песню исполнит Robert Plant & Lil'' Band O'' Gold. Приятного прослушивания (и загруживания).
    Часть первая'
