- date: '2016-07-18'
  slug: atb-2016-07-18-mack
  topic: Mack
  description: Выпуск от 18 июля 2016 года целиком посвящён Лонни Маку — одному из пионеров блюз-рока, чьё 75-летие совпало
    с годом его смерти. Ведущий Андрей Евдокимов рассказывает об альбомах «The Wham of the Memphis Man» (1963) и записях для
    лейбла Alligator («Strike Like Lightning», «Second Side»), а также о легендарной гитаре Gibson Flying V с серийным номером
    007, ставшей главным инструментом музыканта. Отдельно упоминается влияние Мака на Джимми Пейджа, Эрика Клэптона и Стиви
    Рэй Вона, называвшего его одним из двух главных источников своего стиля. Звучат треки «Wham», «Why?», «Cincinnati Jail»,
    «Stop, Hound Dog Man» и другие; приводится цитата основателя Alligator Records Брюса Иглауэра, называющего Мака первым
    настоящим блюз-роковым гитарным героем.
  summary: 75-летие Lonnie Mack — памяти певца и гитариста, скончавшегося в 2016 году
