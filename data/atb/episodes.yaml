  topic: ZZTop
  description: Уходящий год был чередой юбилеев для группы ZZ Top. Всем троим участникам "той самой маленькой группы из Техаса"
    по очереди стукнуло по 70 лет (210 в сумме), а самой группе исполнилось ровно полвека! Не то, чтобы это чисто блюзовая
    техасская банда, но у них настоящий блюзовый дух. В программе ВЭБ к юбилеям - блюзовоя сторона ZZ Top, кое что из раритетных
    записей 60-х (первая запись ZZ Top - это вообще сайкоделик рок, откровенно напоминающий Iron Butterfly) и песни Supersonic
    Blues Machine - чисто блюзового сольного проекта Билли Гиббонса, чей юбилей праздновали 16 декабря 2019 года. Плюс акустика
    с Sue Foley. Четыре юбилея ZZ Top
