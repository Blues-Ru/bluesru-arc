  slug: atb-2018-09-17-koko-taylor
  topic: KokoTaylor
  description: 'Программа Весь Этот Блюз к 90-летию со дня рождения Koko Taylor, Королевы
    чикагского Блюза. А вот домашнее ее прозвище было довольно легкомысленным: "Коко"
    ее прозвали еще в детстве - за любовь к шоколаду, который как раз в детстве доставался
    ей нечасто. Но голос ее не был сладким. Казалось бы, таким голосом не поют: резкий,
    хриплый, режущий слух. Но для блюза, для его страстей и самоиронии - то, что надо!
    В начале карьеры на Chess Records она была протеже самого Willie Dixon. Позже
    на Alligator Records она запела еще мощнее, настоящая "Старая Школа" и "Сила Природы"
    (по названиям двух ее альбомов из 90-х и 00-х. Часть первая'
  summary: 90-летие Коко Тейлор — «Королевы чикагского блюза».
