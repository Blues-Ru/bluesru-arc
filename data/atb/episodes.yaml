  topic: Hummel
  description: Один из ярчайших лидеров современной губной гармоники Mark Hummel едет
    в гости к нам. C 7 по 11 ноября он даст 5 концертов в Москве и Санкт-Петербурге.
    "Дабы проставить на его музыку маркировку, можно формально сказать, то это пост-вест-коаст,
