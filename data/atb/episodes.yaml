  slug: atb-2017-10-02-chenier
  topic: chenier
  description: 'В выпуске отмечаются сентябрьские юбилеи нескольких музыкантов. Си-Джей Шинье — наследник традиций зайдеко,
    сын «короля зайдеко» Клифтона Шинье — представлен песнями из проекта с каверами Джона Хайата, альбома «Blues on Blonde
    on Blonde» и совместной записи с Кэти Уэбстер. Техасский гитарист Джо Гитар Хьюз отмечает 80-летие: обсуждаются его альбом
    «Texas Guitar Slinger» и долгий путь к сольной карьере, начавшейся лишь в 1988 году. Ник Кьюрон, виртуозный гитарист и
    певец, смешивавший джамп-блюз, рокабилли и психоделику, родился 30 сентября 1977 года; его памяти посвящён финал программы
    — он скончался от рака в 2012 году, так и не реализовав в полной мере свой огромный потенциал.'
  summary: 60-летие C.J. Chenier, 80-летие Joe Guitar Hughes; памяти Nick Curran
