- date: '2018-10-01'
  slug: atb-2018-10-01-steve-miller
  topic: II Steve MILLER
  description: 'В первой части программы Андрей Евдокимов рассказывает о Стиве Миллере: его блюзовых корнях, дружбе семьи
    с Лес Полом и Ти-Боун Уокером, чикагской школе рядом с Мадди Уотерсом и Хаулин Вулфом, а также о блюзовом альбоме «Bingo»
    (2010). Вторая часть посвящена 70-летию Дюка Робиларда — гитариста-мастера, основателя Roomful of Blues и автора альбома
    «Duke Robillard and His Dames of Rhythm», где солируют малоизвестные вокалистки. К 75-летию Роя Букбиндера звучат треки
    из его акустических кантри-блюзовых альбомов, включая «Booker Road» и «Ragtime Millionaire». Выпуск завершает пианист
    Сэмми Прайс — в честь 110-летия со дня его рождения.'
  summary: Steve Miller; 70-летие Duke Robillard, 75-летие Roy Bookbinder, 110-летие Sammy Price
