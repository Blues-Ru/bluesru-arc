- date: '2018-04-16'
  slug: atb-2018-04-16-john-mayall-75
  topic: I
  description: Терпкий и сладкий, и горький голос, то жалостливый как у сломавшегося на жизненных и любовных ухабах мужика,
    то с грозным утробным рыком несломленного никем и никогда - Майти Сэм МакКлэйен. Первый альбом выпустил, когда ему было
    43. И, может, даже поспешил. В полной степени его "мощь" отражают альбомы, появившиеся только лет десять спустя. Но это
    были уже бесспорные шедевры, лучший блюзовый вокал двух десятилетий рубежа веков. Родители его исполняли госпел. Иисус
    - частый герой его блюзов. Сегодня Могучему Сэму МакКлейну исполнилось бы 75 лет. Завтра 75-летие певца-гитариста Lonesome
    Dave PEVERETT, группы Savoy Brown Blues Band и Foghat. 19 апреля отпразднуем 120-летие со дня рождения Dr. Clayton, пианиста
    и певца, патриота и алкоголика. А 10 апреля исполнилось 90 лет со дня рождения Rosco GORDON, певца-пианиста, автора полудюжины
    невянущих блюзовых стандартов. О четырех юбилярах - наспех, но с любовью - в программе Весь Этот Блюз. Часть первая
  summary: 75-летие Джона Мэйолла — отца британского блюза и «крёстного отца» легенд рока. Часть I.
