- date: '2020-07-13'
  slug: atb-2020-07-13-dupree
  topic: Dupree
  description: С этом выпуске три юбиляра - все из новоорлеанской старой школы! Многие
    годы считалось, что 4 июля 1900 года - это день рождения гения джаза и блюза Луи
    Армстронга. Даже на его надгробной плите была выбита именно эта дата. Во времена,
    когда никто особо не заботился о днях рождения афро-американцев, многие из них
    сами выбирали именно этот день - День независимости. Очень удобно - всегда выходной.
    Сейчас архивариусы добрались до оцифрованных церковных записей тех лет и теперь
    уверенно уверено заявляют, что Армстронг родился да, четвертого, но августа, и
    не 1900, а 1901 года. Ну, пусть будет так, справим юбилей полномасштабно в следующем
    году. Но для тех, кто привык к 4 июля, как ко дню Луи Армстронга - хоты бы две
    его любимые песни... Champion Jack Dupree - новоорлеанец до мозга кости, хоть
    и провел десятки лет в добровольной европейской ссылке, детдомовец, боксер-чемпион,
    ветеран II Мировой, узник японского концлагеря, певец, пианист, художник да еще
    и повар - мощная личность. 100 лет со дня рождения Дюка Баррелла праздновали знатоки
    новоорлеанской музыкальной истории 9 июля 2020 года. В Новом Орлеане он родился,
    с ним и связана вся его музыкальная судьба. Он играл в популярных оркестрах Луи
    Джордана и Джонни Отиса, выступал как солист и лидер собственных ансамблей, Duke
    Burrell's Louisiana Shakers - самый известный из них. 100-летие со дня его рождения
    - лучший повод напомнить о его великолепных записях. Таких мастеров буги-вуги
    еще поискать надо! Весь Этот Блюз
  summary: 'Три новоорлеанских патриарха: Луи Армстронг, Чэмп Батлер и Шэмп Дюпри.'
  files:
  - filename: atb-2020-07-13-dupree.mp3
    path: /atb/atb-2020-07-13-dupree.mp3
- date: '2020-07-27'
  slug: atb-2020-07-27-kimbrough
  topic: Kimbrough
  description: Джуниор Кимброу был настоящий домосед. Родился в Норс Миссиссиппи Хил
    Каутри - на севере миссиссиппских холмов. И там провел всю жизнь, десятилетиями
    почти каждый вечер играя в своем джюк-джоинте, кабаке с музыкой. Он из тех, что
    считает жителей ближайших городов странными, а в других штатах - сплошь недотепы,
    а в городах - так и вовсе одни чудики. Зато его родной город Холи Спрингз - Святые
    родники - лучшее место в мире. Хотя его земляки и напивались вдрабадан в его заведении,
    и дрались, и кадрились, и гомонили от заката до рассвета, зато все - душевные
    отзывчивые люди. Таких больше не сыскать. При этом уж сентиментальным Джуниора
    не назвать. А блюз его так и вовсе - суровый, мрачнее чикагского, вязкий, густой,
    а голос из клети отчаянной кручины... Весь Этот Блюз
  summary: Джуниор Кимброу — отшельник Северного Миссисипи, изобретатель завораживающего
    «хилл-блюза».
  files:
  - filename: atb-2020-07-27-kimbrough.mp3
    path: /atb/atb-2020-07-27-kimbrough.mp3
