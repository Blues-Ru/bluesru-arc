- date: '2016-04-25'
  slug: atb-2016-04-25-ma-rainey
  topic: MaRainey
  description: 26 апреля 2016 года исполнилось 120 лет со дня рождения Гертруды Ма Рейни. Ведущий Андрей Евдокимов рассказывает
    о её пути от странствующих менестрель-шоу до студийных записей для лейбла «Парамаунт» с 1923 года. В программе звучат
    многочисленные версии «See See Rider» в исполнении Лавёрн Бейкер, Эллы Фицджеральд, Алексиса Корнера, Би-Би Кинга и других,
    а также оригинальные записи самой Ма Рейни — «Moonshine Blues», «Those Dogs of Mine», «Slave to the Blues», «Yonder Come
    the Blues», «Shave 'Em Dry Blues» и «Prove It on Me Blues». Особо подчёркивается самобытность Ма Рейни — её приверженность
    сельской тематике и влияние на последующих исполнительниц, включая Бесси Смит.
  summary: 120-летие Ma Rainey, «Матери блюза», и её «See See Rider»
