  slug: atb-2021-07-26-lonnie-mack
  topic: LonnieMack
  description: 'Программа рассказывает о Лонни Мэке — самобытном гитаристе и певце, чей дебютный альбом «The Wham of That
    Memphis Man» (1963) стал исторической вехой, соединив сёрф, фанк, рок-н-ролл, соул и блюз. В эфире прозвучали композиции
    разных периодов его карьеры: «Wham! Double That, Whammy» совместно со Стиви Рэем Воном, «Further on up the Road» (1987),
    «Cocaine Blues» с альбома «Road Houses and Dance Halls» (1988), а также «Cincinnati Jail» и «Why?» — блюз, который Мэк
    перезаписывал на протяжении всей карьеры. Отмечается, что после яркого дебюта Мэк десятилетиями выступал в придорожных
    заведениях и на танцплощадках, сочетая в творчестве кантри, блюз и рок-н-ролл.'
  summary: 80-летие Lonnie Mack — гитарного героя начала 1960-х
