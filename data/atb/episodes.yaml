  slug: atb-2021-08-09-armstrong-ellis
  topic: Armstrong Ellis
  description: В продолжение путешествия в историю блюза по юбилеям - два героя, оба родились 4 августа и оба более тяготели
    к джазу, но и блюз им был душевно близок. Оба гении. Сто лет со дня его рождения - виртуозный, деликатный, изысканный,
    мягкий и скромный - гитарист Херб Эллис. Мастер нюансов, он в годы расцвета играл очень свежо, уже потом найденные им
    новые краски разобрали сотни, а может, и тысячи студентов музыкальных колледжей, и превратились в такой стандартный набор,
    что сегодня тогдашние новации Эллиса воспринимаются как должное. А вот проникновенная интимность ему музыки осталась не
    повторенной. И 120 лет со дня рождения великолепного и лучезарного Луиса Армстронга. Пусть записи его кажутся многим,
    типа, ретро. А зря. Переслушивать их и вкусно и полезно! Хриплый луженый вокал и пронзительная труба - в них столько жизнелюбия
    и теплоты - по "лелеющей душу гуманности" ему нет равных ни в джазе, ни в блюзе. Весь Этот Блюз
  summary: 100-летие Луи Армстронга и 100-летие Хербара Эллиса — гении джаза и блюза.
