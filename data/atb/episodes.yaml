  description: Программа посвящена живой легенде чикагского блюза Бадди Гаю в день его 83-летия. Андрей Евдокимов зачитывает
    фрагменты интервью музыканта журналу Rolling Stone о жизни на самоизоляции, закрытии его клуба Legends в Чикаго и погромах
    во время протестов. Звучат песни из альбомов «Damn Right, I Got the Blues», «Skin Deep» (2008, при участии Дерека Тракса),
    «The Blues Is Alive and Well» (2018), а также концертная запись «Country Boy». Гай рассуждает о своём детстве на луизианской
