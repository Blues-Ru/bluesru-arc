- date: '2017-09-25'
  slug: atb-2017-09-25-cj-chenier
  topic: CJCh
  description: 'В программе отмечаются два юбилея последней недели сентября: 60-летие певца и аккордеониста Си-Джея Шене,
    наследного короля музыки зайдеко, и 90-летие чикагского певца и харписта Джорджа Мэйвезера. Звучат записи из единственного
    альбома Мэйвезера «Ear Ring» (1992), включая блюзовую классику — песни Литл Уолтера, Джимми Роджерса, Чака Уиллиса и «Gypsy
    Woman» Мадди Уотерса. Рассказывается о биографии Мэйвезера: уроках у Литл Уолтера, совместной работе с Бо Дидли, Джей
    Би Хатто и Эдди Тейлором, а также об отказе занять место Уолтера в группе Мадди Уотерса. Выпуск открывается историей стандарта
    «Baby, Please Don''t Go» и завершается песнями Си-Джея Шене — «Too Much Fun» и «Louisiana Down Home Blues».'
  summary: 60-летие C.J. Chenier; 90-летие George Mayweather
