- date: '2021-07-12'
  slug: atb-2021-07-12-lj-hunter
  topic: LJHunter
  description: Он из тех блюзменов, чью манеру игры можно назвать неспешным выковыриванием
    блюза из гитарной струны. В 1931 году (90 лет назад) в Рингголде, Луизиана, родился
    Джон Хантер, по прозвищу "Длинный" (Long John HUNTER). Техас стал ему родным домом.
    Когда ему было 22, он побывал на концерте БиБиКинга. Понравилась ли ему музыка,
    или этот способ показался простейшим заработком, или реакция девочек на музыку
    его привлекла? Скорее всего, все вместе! Он купил свою первую гитару и год спустя
    выступал в том же баре, где его обратил в блюзмена БиБиКинг. На протяжении десятилетий
    он работал в местных барах на границе СШа и Мексики - 7 дней в неделю от заката
    до рассвета. И выработал блюз мощный, суровый, весомый. В 60 с хвостиком лет вышел
    на мировую блюзовую авансцену, собрал премии, овации и восторженные рецензии.
    За 20 по сути постпенсионных лет выпустил 9 альбомов. Блюзовая публика получила
    вдруг-из-ниоткуда вполне сложившегося, зрелого, уверенного мастера по части музыкальной
    тоски и веселья. Прекрасный соул-блюзовы вокал. Гитара в равной степени АлбертКоллинзовская
    и АлбертКинговская. И шоумен, которого не смутит никакая аудитория - он тертый
    калач и видел кактусы не из конфетных фантиков. В программе ХI Эфесовского блюз-фестиваля
    выступал в России. Программа ВЭБ
  summary: 90-летие Лонг Джона Хантера — луизианского блюзмена с фирменным слайдом.
  files:
  - filename: atb-2021-07-12-lj-hunter.mp3
    path: /atb/atb-2021-07-12-lj-hunter.mp3
