  topic: Grammy
  description: 'Номинанты на Grammy 2021 в категориях: #49 Best Traditional Blues Album For albums containing at least 51%
    playing time of new vocal or instrumental traditional blues recordings. ALL MY DUES ARE PAID by Frank Bey; YOU MAKE ME
    FEEL by Don Bryant; THAT''S WHAT I HEARD by Robert Cray Band; CYPRESS GROVE by Jimmy "Duck" Holmes; RAWER THAN RAW by
    Bobby Rush #50 Best Contemporary Blues Album For albums containing at least 51% playing time of new vocal or instrumental
    contemporary blues recordings. HAVE YOU LOST YOUR MIND YET? by Fantastic Negrito; LIVE AT THE PARAMOUNT by Ruthie Foster
    Big Band; THE JUICE by G. Love; BLACKBIRDS by Bettye LaVette; UP AND ROLLING by North Mississippi Allstars. Все музыканты
    небезталантны, но вот условие про 51% не выполнено. Во многих альбомов блюзы вообще отсутствуют, в других случайно попадается
    один-два. Особенно поражают претенденты на "традиционный блюз" - за исключением акутического сольника Бобби Раша прочие
    заняты поиском "нового блюзового звучания", результатом чего стал, как должны понимать академики звукозаписи Америки,
    стал "heavy sound overproduction", а по-русски говоря, звукорежиссер задавил всех, как цыплят сапогом. Но есть и отрадные
    моменты. Подробности в программе "Весь Этот Блюз" "Весь Этот Блюз"'
