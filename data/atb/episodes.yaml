- date: '2015-01-26'
  slug: atb-2015-01-26-bob-stroger
  topic: 1 Stroger
  description: 'Программа целиком посвящена чикагскому бас-гитаристу и певцу Бобу Строджеру, который в конце января 2015 года
    приехал на гастроли в Москву и Сибирь. Андрей Евдокимов рассказывает биографию музыканта: уроженца Миссури, переехавшего
    в Чикаго, лауреата премии «Грэмми», игравшего с Элмором Джеймсом, Отисом Рашем, Санни Лэнд Слимом и другими легендами.
    В эфире звучат песни из трёх сольных альбомов Строджера, в том числе «Bob''s Back in Town», «That''s My Name» и «Going
    to Chicago», а также треки из его новейшего альбома «Keepin'' It Together» (2014), записанного совместно с барабанщиком
    Кенни «Билли Айз» Смитом. Отдельно отмечается доверительная, почти разговорная вокальная манера Строджера и его роль живого
    посланника традиционного чикагского блюза.'
  summary: 'Bob Stroger: гастроли по России, январь 2015'
