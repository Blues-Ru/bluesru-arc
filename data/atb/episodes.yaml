  description: 'В программе представлен 67-летний дебютант Роберт Финли, выпустивший автобиографический альбом «Sharecropper''s
    Son» 24 мая 2021 года. Рассказывается о его непростой судьбе: работа в поле, служба техником на аэродроме, уличные выступления
    в Мемфисе, потеря зрения — и дебютный альбом лишь в 62 года. Отдельное внимание уделено группе The Black Keys и их десятому
    альбому «Delta Kream» — первому полностью блюзовому, состоящему из каверов на классиков Mississippi Hill Country: Джуниора
    Кимбро и Р. Л. Бёрнсайда. Также отмечается творческий союз Финли с The Black Keys, которые открыли его миру и выступают
    его продюсерами и аккомпаниаторами.'
