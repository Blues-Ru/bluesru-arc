  slug: atb-2019-08-19-aretha
  topic: Aretha
  description: 'В годовщину ухода Ареты Фрэнклин (16 августа 2018) программа сосредоточилась на её блюзовом репертуаре. Прозвучали
    записи из трибьют-альбома «Unforgettable: A Tribute to Dinah Washington» — «Drinking Again» и «Evil Gal Blues», а также
    «I Sing the Blues» и «Son of a Preacher Man». Андрей Евдокимов рассказал о роли продюсера Джона Хэммонда-старшего, семейных
    корнях певицы и её связи с движением за права темнокожих. Прозвучали также кавер-версии «I''m Sitting on Top of the World»,
    «Muddy Water» и «Sweet Sixteen» Би Би Кинга, а также духовные песни «Ave Maria» и «Oh Happy Day» с Мэвис Стейплс из альбома
    «One Lord, One Faith, One Baptism» (1987). Выпуск завершила ранняя студийная версия «Chain of Fools».'
  summary: 'Годовщина смерти Aretha Franklin: блюзовое наследие Королевы соула'
