- date: '2021-11-08'
  slug: atb-2021-11-08-green
  topic: GreenII
  description: '"Я помню, стены и пол сотрясались - столько низов было у гитары и с таким проникновенным чувством он играл"
    - вспоминал Gary Moore ирландские гастроли группы John_Mayall & the BluesBreakers. Никому в Ирландии неизвестный Peter
    Green пришел в Блюзбрейкерз на замену Eric Clapton. Клэптона тогда уже называли Богом, так что 20-летнему Грину было очень
    не просто. Но он играл в своей манере, и это впечатляло. Муру было 14-ть, и не только для него, подростка, но для всего
    зала это было как магия... Нечто сверхъестественное... Грин произвел огромное влияния на свое и последующие поколения
    гитаристов, хоть был на авансцене мене 5 лет. Эти пять лет изломали его, из нового гитарного героя он превратился в утомленного
    славой и разочарованного в роке вегетарианца. Но ведь начало было было лучезарным. От дебюта в Peter B''s Looners до первой
    славы в рядах Блюзбрейкеров Джона Мэйолла и к началу формирования Fleetwood Mac - Во второй части посвященной 75-летию
    Питера Грина программы Весь Этот Блюз'
  summary: 'Питер Грин, часть II: Bluesbreakers, «Боснийская ночь» и рождение Fleetwood Mac.'
