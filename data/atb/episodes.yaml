  slug: atb-2021-08-30-charlie-burse-buster-brown
  topic: ''
  description: 'В августе были еще два мощных блюзовых юбилея: 120 лет со дня рождения Charlie Burse и 110 лет со дня рождения
    харпера Buster Brown. Есть, по счастью, блюзмены, чьи имена известны далеко за пределами жанра. Они бесспорно, выдающиеся
    таланты. Но их музыка, их достижения не на пустом месте взошли. Почву щедро сдабривало все сообщество, от заработка никто
    не отказывался, но не слава и богатство были мотивацией. А преданность музыке, которой было пропитано их детство. Обновляя
    ее звучание, они хранили неизменной суть. Нынешние юбиляры славы не снискали, хотя в свое время имели краткий успех. Бюрс
    начал в колыбели с трещотки-погремушки, виртуозно играл на ложках, на расческе, потом на фортепиано, и на саксофоне, и
    на всем, что со струнами: от укулеле до скрипки, включая палку от швабры, воткнутую в бочку с привязанной к ним веревкой
    - в общем, все инструменты, характерные для джаг-бэнда, танцевального оркестра народной музыки Юга США, были ему знакомы
    с детства. Он записывался и сольно, но первую известность приобрел именно как участник Мемфис Джаг Бэнда, оставившего
    славный след в истории афроамериканской музыки, той, что, так сказать, от сохи. После дня в поле под палящим солнцем душа
    миссиссиппского или мемфисского полевого рабочего хотела развернуться в танце. Сейчас звучание их музыки может показаться
    очень некомфортным, в чем-то нелепым, и определенно это спонтанная попытка уложиться в стандарт трех минут (на танцах-то
    они играли, пока сил хватает у танцоров). И все-таки, если вслушаться, обаяние, азарт, человечность этой музыки без нот
    пробивается через девять десятилетий в наши дни. Бастер Браун - харпер с одним альбомом в дискографии, зато название какое:
    New King of the Blues. Послушайте танцевальный народный блюз 90-летней и 60-летней давности в программе Весь Этот Блюз'
  summary: 120-летие Чарли Бёрса и 110-летие харпера Бастера Брауна — малоизвестные жемчужины блюза.
