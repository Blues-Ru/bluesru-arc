    о своих впечатлениях от России, музыкальном детстве, поездках в Африку и связи блюза с африканскими корнями. Обсуждается
    сотрудничество Хэрриса с малийским музыкантом Али Фарка Туре, совместный альбом «From Mali to Mississippi» и документальный
    фильм Мартина Скорсезе. Звучат треки из альбомов «Blue Black» и «King and Queen» (2009), «Zion Crossroads» (2007), а также
    совместная запись с флейтистом Осой Тёрнером «Lay My Burden Down» (2003).
