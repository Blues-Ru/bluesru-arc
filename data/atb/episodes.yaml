    на уникальной восьмиструнной беспедальной лэп-стил-гитаре. Звучат его песни «Chicken Stuff», «Black Cat Bone», «Be Careful
    with the Blues», «I Met a Strange Woman», а также каверы Джонни Винтера, Дэйва Холла и трио Коупленд–Коллинз–Крей с альбома
