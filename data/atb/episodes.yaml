  slug: atb-2018-08-27-cain
  topic: Cain
  description: 'Стартует российский гастрольный тур певца и мультиинструменталиста
    Chris Cain. 28 и 29 сентября он появится в Москве. Программа "Весь Этот Блюз"
    предлагает ознакомиться с записями из нескольких его альбомов за 30 лет: от дебютного
    1987 года до последнего пока в дискографии 2017-го. В завершение - две песни из
    свежайшего альбома альбома Will Wilde, который принимает участие в нынешнем сезоне
