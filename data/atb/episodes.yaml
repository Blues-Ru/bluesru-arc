- date: '2016-05-09'
  slug: atb-2016-05-09-highway
  topic: Highway61
  description: 'В эфире — три лидера московской блюзовой сцены: Юрий Коверкин, Алексей Аграновский и Вадим Ивашенко. Поводом
    для встречи стал предстоящий «61 Highway Blues Festival» — фестиваль акустического блюза в Московском международном доме
    музыки 19 мая. Гости играют живьём в студии: звучат WPA Blues (Мелроуз и Уэлдон), «My Baby» Вилли Диксона и «I''m Sorry,
    Baby» в версии Джуниора Уэллса. Музыканты рассказывают о своём пути в блюз: Коверкин — о первом знакомстве с Мадди Уотерсом
    и концерте Би Би Кинга в Тбилиси, Ивашенко — о дебютном сольном альбоме акустического кантри-блюза, Аграновский — о группе
    «Чёрный хлеб» и о том, как блюз заменил ему вредные привычки.'
  summary: 'Фестиваль «61 Highway Blues Festival»: Коверкин, Аграновский, Ивашенко'
