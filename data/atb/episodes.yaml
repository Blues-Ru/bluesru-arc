- date: '2017-09-18'
  slug: atb-2017-09-18-big-twist-lovie-austin
  topic: I
  description: 'Выпуск посвящён нескольким сентябрьским юбилярам в истории блюза. Ларри Нолан по прозвищу Биг Твист (80 лет
    со дня рождения) — мощный техасский блюзмен, известный зажигательными выступлениями и песней «Polk Salad Annie». Пианистка
    и аранжировщица Лови Остин отмечает 130-летие: в выпуске звучит её ансамбль в записи 1925 года «Frogtown Step» и аккомпанемент
    к песне Ма Рейни «Honey, Where You Been So Long?». Главным юбиляром второй части стал чикагский гитарист Майти Джо Янг
    (90 лет со дня рождения): звучат «Stormy Monday», «Teasing the Blues», «Five Long Years» и другие композиции, а ведущий
    рассказывает о его работе с Мэджиком Сэмом, Уилли Диксоном и Джимми Роджерсом.'
  summary: Big Twist, Lovie Austin, Mighty Joe Young — три самобытных блюзовых артиста
