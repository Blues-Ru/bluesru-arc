  slug: atb-2014-10-27-guy-davis
  topic: GuyDavis
  description: 'Программа целиком посвящена Гаю Дэвису — певцу, гитаристу и актёру, сочетающему традиционный блюз с театром
    и экспериментом. Звучат треки из альбомов разных лет: «Juba Dance» (2013), «Given Kind» (2002), «Call Down the Thunder»
    (1996), «Butt Naked Free» (2000) и «Skunk Mello» (2006). Андрей Евдокимов рассказывает о биографии Гая Дэвиса: его бродвейском
    дебюте, роли Роберта Джонсона и премии Blues Foundation. Также звучит запись живого выступления Гая Дэвиса с Филом Виггинсом
    и Сэмюэлом Джеймсом в студии «Эха Москвы», где они исполнили импровизацию на тему Мадди Уотерса.'
