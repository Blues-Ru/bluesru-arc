  slug: atb-2021-08-02-lonnie-mack
  topic: LonnieMack
  description: '18 июля 2021 года Лонни Маку исполнилось бы 80 лет. Он гитарный герой начала 60-х, Когда телевидение было
    экзотикой, и видеоклипов не существовало, а это значило, что инструментальная музыка имела все шансы на успех. И отличный
    певец Лонни Мак записывал свои торопливые инструментальные композиции - в свое большое удовольствие: ему гитарный голос
    очень нравился. Серф-стайл еще не ушел, но все уже говорили про Биг-Бит, хотя никто и не вспомнит теперь, что это значило.
    Гитаристы вообще казались гостями из будущего, поскольку из гитар они извлекали совсем немыслимые по тем временам фантастичные
    футуристические звуки. И вот в 1963 году Лонни Мак, которому тогда было 22 года, выпускает альбом The Wham of that Memphis
    Man! Это была фантастика! Серф, фанк, рок-н-ролл, соул и блюз - все с таким юным напором, что не устоять. Публика, в которой
    были и будущие гитарные звезды, была ошеломлена. Теперь альбом считается исторической вехой, а тогда это был просто ураган.
    Проuграмма ВЭБ к юбилею'
  summary: 80-летие Лонни Мака — гитарного героя 60-х, чья игра покорила Хендрикса и Клэптона.
