  slug: atb-2021-09-06-floyd-council
  topic: ''
  description: '110 лет назад, в штате северная Каролина родился кантри-блюзмен Floyd COUNCIL - тот самый, в честь которого
    половина названия группы Pink Floyd (Которого Cyd Barret и не слышал, когда сочинял название для группы - почему так вышло?
    Ответ простой). 125 лет назад Edith Goodall родилась в Луисвилле, штат Кентукки, в 1896 году. Певица и актриса, вошедшая
    в историю блюза как Edith Wilson (оба ее мужа носили фамилию Вилсон). Выступать на сцене начала в 1919 году, первую пластинку
    выпустила сто лет назад, пела перед публикой в последний раз в 1980 году на знаменитом Ньюпортском джаз фестивале - за
    год до смерти. А так же сегодняшние блюзы-юбиляры: Blues In The South by Louis ARMSTRONG (чье 120-летие справляли в августе)
    и Thats All Right Mama by Arthur Big Boy Crudup. С исполнения этой песни Элвисом Пресли началась легенда-поговорка "Белые
    украли нашу музыку". Все это подробней и с классной старинной музыкой - в программе Весь Этот Блюз'
  summary: 110-летие Флойда Кансела — блюзмена, именем которого наполовину назвалась группа Pink Floyd.
