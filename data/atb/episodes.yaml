  slug: atb-2021-06-21-alligator
  topic: Alligator
  description: На прошлой неделе,18 июня вышел сборник к 50-летнему юбилею чикагской фирмы Alligator. Более полувека назад
    юный студент Брюс Иглауэр подрабатывал на славной фирме Delmark, выпускавшую джази блюз. Вечерами в чикагских черных клубах
    потягивал виски из принесенной с собой посуды - иначе не разливали. По утрам пытался уговорить Боба Костнера, основателя
    Делмарка, выпустить альбом его любимой группы Hound Dog Taylor & The Houserockers. Тот не соглашался, по его мнению, Хаундог
    своими примитивными буги ронял высокое реноме блюза. Иглауэр стал меньше пить, больше откладывать. И на свои деньги записал
    альбом своего любимчика - шестипалого гитариста Хауд-Дога Тейлора. Вот с этого началась история лейбла Эллигейтор. М-р
    Иглауэр на своей машине развозил пластинки по магазинам и радиостанциям - лишь бы эту музыку услышало больше людей. Теперь
    чикагского Аллигатора знают во всем мире, к полувековому юбилею в Чикаго объявлен день в его честь. Под знаком лейбла
    начинали безвестные, как например, Saffire -The Uppity Blues Women., возвращались на сцену былые звезды, здесь были и
    традиционалисты и экспериментаторы. Весь Этот Блюз
  summary: 50-летие лейбла Alligator Records — пятьдесят лет главного блюзового издательства Чикаго.
