- date: '2016-08-01'
  slug: atb-2016-08-01-buddy-guy
  topic: Buddy Guy
  description: 'Программа целиком посвящена юбилею Бадди Гая — легендарного чикагского блюзмена, которому исполнилось 80 лет.
    Звучат песни разных лет: «Mary Had a Little Lamb» и «Leave My Girl Alone» с ранних альбомов (1967–1968), «Hold That Plane»
    (1972), «I Smell a Rat» с альбома «Stone Crazy» (1981), а также зрелая «Skin Deep» (2008). Упоминается история с записями
    для Chess Records, в том числе «First Time I Met the Blues» и «When My Left Eye Jumps», а также рассказ самого Гая о том,
    как он учился играть на гитаре. В финале — французская запись 1970 года, где Бадди Гай аккомпанирует Мемфис Слиму вместе
    с Джонни Уэллсом, своим братом Филом Гаем и Эйси Ридом.'
  summary: 80-летие Buddy Guy — патриарха чикагского блюза
