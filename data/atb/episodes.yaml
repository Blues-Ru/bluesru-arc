  description: 'В эфире — анонс 14-го Архангельского блюз-фестиваля (20–21 мая), где хедлайнером выступит Джимми Бёрнс, а
    также Крис Бергсон и Харпер Джайлз Кинг. Отмечается 70-летие басиста ZZ Top Дасти Хилла и 50-летие группы: звучат композиции
