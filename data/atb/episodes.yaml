  slug: atb-2019-05-06-campbell
  topic: Campbell
  description: 'Программа приурочена к двум юбилеям: 70-летию гитариста Боба Марголина (уроженца Бруклина, штат Массачусетс)
    и 80-летию со дня рождения чикагского гитариста и вокалиста Эдди Си Кэмпбелла (6 мая 1939 года). Оба музыканта тесно связаны
    с наследием Мадди Уотерса — звучит запись «Still a Fool» 1951 года с Литтлом Уолтером и Леонардом Чессом на бас-барабане.
    Эдди Си Кэмпбелл рассказывает в цитируемом интервью о своих корнях в Миссисипи, переезде в Чикаго и музыкальном воспитании
    рядом с Мадди Уотерсом, Хаулин Вулфом и Мэджик Сэмом. Представлены треки из его альбомов «Mind Travel», «Baddest Cat on
    the Block» (1985), «My Last Affair» (1986), «Take This World Up» (2009) и «Spider Eating Preacher» (2012). Андрей Евдокимов
    напоминает, что в феврале 2013 года после концерта в Германии у Кэмпбелла случился сердечный приступ, и в ноябре 2018
    года музыкант скончался в возрасте 79 лет.'
  summary: 80-летие Eddie C. Campbell, 70-летие Bob Margolin — блюзмены круга Muddy Waters
