- date: '2015-05-18'
  slug: atb-2015-05-18-mccoy
  topic: I McCoy
  description: 'Программа приурочена к 110-летию со дня рождения (11 мая 1905) певца и гитариста Кэнзас Джо МакКоя. В центре
    выпуска — история песни «Why Don''t You Do Right»: от первой записи Лил Грин (1941) с аккомпанементом Биг Билл Брунзи
    до знаменитой версии Пегги Ли с оркестром Бенни Гудмана (1942) и позднейших трактовок Шинейд О''Коннор и Imelda May. Андрей
    Евдокимов рассказывает о биографии МакКоя: его происхождении из Миссисипи, дуэте с Мемфис Минни и совместно написанной
    песне «When the Levee Breaks», которую впоследствии прославили Led Zeppelin. Также в выпуске звучат «Evil Devil Woman
    Blues», «My Wash Woman''s Gone» и «I''m Going Crazy», а история чикагского октета Harlem Hamfats иллюстрируется записью
    «Oh Red» в исполнении Хаулин Вулфа.'
  summary: 110-летие Kansas Joe McCoy, автора «Why Don't You Do Right»
