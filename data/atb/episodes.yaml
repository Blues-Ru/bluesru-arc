- date: '2015-09-00'
  slug: atb-2015-09-00-jimmy-reed
  topic: Jimmy Reed
  description: 'Программа «Весь этот блюз» отмечает 90-летие со дня рождения Джимми Рида (1925–1976) — гитариста, харпера
    и автора блюзовых стандартов. Ведущий Андрей Евдокимов рассказывает о творческом пути музыканта: о его отказе от Chess
    Records, сотрудничестве с лейблом Vee-Jay и уникальном коммерческом успехе в конце 1950-х. В эфире звучат песни «Honest
    I Do», «Big Boss Man», «Bright Lights, Big City», «You Got Me Dizzy», а также каверы Элвиса Пресли, Мадди Уотерса, Эрика
    Клэптона, The Pretty Things и московской группы Crossroads. Отдельно отмечается роль жены музыканта — Мамы Рид, — которая
    подсказывала ему слова прямо во время записи.'
  summary: 90-летие Jimmy Reed — автора блюзовых стандартов из Чикаго
