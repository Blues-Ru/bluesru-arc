  slug: atb-2017-07-10-blind-boy-fuller
  topic: BBFuller
  description: 'Программа отмечает 110-летие со дня рождения Blind Boy Fuller (1907, Северная Каролина) — представителя пидмонтского
    стиля, виртуоза фингерпикинга. Обсуждается его пятилетняя карьера звукозаписи и влияние на американскую музыку: песня
    «Step It Up and Go» названа прото-рок-н-роллом, её версии исполняли Everly Brothers и Боб Дилан. Звучат оригинальные записи
    1935–1939 годов: «Rag, Mama, Rag», «Lost Lover Blues», «Walking My Troubles Away», «Truckin'' My Blues Away», «I Want
    Some of Your Pie» (с Сонни Терри на губной гармонике). Проводится параллель между Blind Boy Fuller и Робертом Джонсоном
    — ранняя смерть и определяющее влияние на звучание американской музыки.'
  summary: 110-летие Blind Boy Fuller — пионера пидмонтского блюза
