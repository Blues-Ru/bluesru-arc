  description: 'В следующее воскресенье, 4 августа в Санкт-Петербурге, в СевКабеле, а затем, во вторник, 6 августа, в клубе
    Козлова, пройдет однодневный, но масштабный и международный блюз-фестиваль "Мосты". Записи его зарубежных участников:
    Rick Estrin & The Nightcats (former Little Charlie & The Nightcats) with Kid Andersen (Сан-Франциско); John Nemeth & The
    Blue Dreamers (Мемфис), Aki Kumar (Сан-Франциско), Daniel Eriksen (Осло), Emilia Sisco & Helge Tallqvist Band (Хельсинки)
    - представлены в передаче "Весь Этот Блюз". Но главная тема - интервью с организатором и продюсером фестиваля Владимиром
    Русиновым о том, как в прошлом году делался первый фестиваль, чего ждать в нынешнем году от второго и какова вообще идеологическая
    составляющая его программы! ВЭБ, 104 Mb 56''47'
