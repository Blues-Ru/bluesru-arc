- date: '2016-08-08'
  slug: atb-2016-08-08-cannon
  topic: Cannon
  description: 'Программа рассказывает о Торонзо Кэнноне — вокалисте, гитаристе и авторе песен из Чикаго, отметившем в феврале
    2016 года 48-летие выходом альбома «The Chicago Way» на лейбле Alligator. Звучат треки с его альбомов разных лет: «Strength
    to Survive», «She''s Gone» (2007), «Hard Luck» (2011), «Missus from Mississippi» и «Middle Life Crisis» (2016). Ведущий
    рассказывает о необычном пути Кэннона в музыку: до 23 лет он играл в баскетбол, затем работал водителем автобуса более
    20 лет, сочиняя песни прямо на маршруте. Отдельно упоминается влияние Джими Хендрикса (Кэннон, как и Хендрикс, левша),
    а также то, что глава Alligator Records Брюс Иглауэр поставил условием подписания контракта переход на профессиональную
    сцену.'
  summary: 'Toronzo Cannon: дебют с альбомом «The Chicago Way» (2016)'
