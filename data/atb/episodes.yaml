- date: '2021-03-21'
  slug: atb-2021-03-21-clarke
  topic: Clarke
  description: Сего дня 70 лет назад Калифорния, родился Вилльям Кларк (William CLARKE).
    До 37 лет работал механиком, играя в клубах по вечерам и записывая альбомы на
    маленьких лейблах. Широкая публика узнала его только после альбома Blowin' Like
    Hell 1990г. И моментально признала его таланты, как это сделали и специалисты,
    вручившие ему W.C.Handy Award. За оставшиеся ему 6 лет жизни он успел записать
    4 альбома, полностью обновивших представление о возможностях губной гармоники
    и звучании современного блюза, и собрать еще букет профессиональных премией. William
    Clarke (March 21, 1951 - November 2, 1996) was an American blues harmonica player
    and singer. He was chiefly associated with the Chicago blues style of amplified
    harmonica, but also incorporated elements of jump blues, swing, and soul jazz
    into his playing. Clarke was a master of both cross and chromatic harmonica styles
    and many consider him among the blues harmonica greats. Программа Весь Этот Блюз
  summary: 70-летие Уильяма Кларка — западнопобережного харпера-виртуоза, работавшего
