- date: '2021-11-01'
  slug: atb-2021-11-01-waters-jackson
  topic: WatersJackson
  description: 125 лет со дня рождения Ethel Waters и 110 лет со дня рождения Mahalia
    Jackson. Греховные радости блюза и возвышенный экстаз спиричуэлсов разрывали душу
    Этель Вотерс. Мэхалиа Джексон пела только сакральные гимны и, хоть с детства обожала
    Бесси Смит, но сама, в отличие от Императрицы блюза, никогда не спела бы о пиве
    и свиной рульке. Голоса Вотерс и Джексон - мощное глубокое контральто. Обе выросли
    в нищете, без отца и матери. Но Вотерс нашла свой дом в цирке-шапито, а Джексон
    - в церкви. Спиричуэлс и госпел - духовные афроамериканские песнопения. По ХХ
    столетию они шли с блюзом параллельно. По законам неплоской неэвклидовой геометрии
    эти параллели пересекались и по-семейному взаимно оплодотворяли друг друга. Кстати
    и Джексон и Вотерс любили один спиричуэлс - про то, что Он сверху приглядывает
    за нами, как за воробышками. His eye is on the Sparrow. Весь Этот Блюз
  summary: 125-летие Этель Уотерс и 110-летие Мэхалии Джексон — грех, блюз и евангелие.
  files:
  - filename: atb-2021-11-01-waters-jackson.mp3
    path: /atb/atb-2021-11-01-waters-jackson.mp3
- date: '2021-11-08'
  slug: atb-2021-11-08-green
  topic: GreenII
  description: '"Я помню, стены и пол сотрясались - столько низов было у гитары и
    с таким проникновенным чувством он играл" - вспоминал Gary Moore ирландские гастроли
    группы John_Mayall & the BluesBreakers. Никому в Ирландии неизвестный Peter Green
    пришел в Блюзбрейкерз на замену Eric Clapton. Клэптона тогда уже называли Богом,
    так что 20-летнему Грину было очень не просто. Но он играл в своей манере, и это
    впечатляло. Муру было 14-ть, и не только для него, подростка, но для всего зала
    это было как магия... Нечто сверхъестественное... Грин произвел огромное влияния
    на свое и последующие поколения гитаристов, хоть был на авансцене мене 5 лет.
    Эти пять лет изломали его, из нового гитарного героя он превратился в утомленного
    славой и разочарованного в роке вегетарианца. Но ведь начало было было лучезарным.
    От дебюта в Peter B''s Looners до первой славы в рядах Блюзбрейкеров Джона Мэйолла
    и к началу формирования Fleetwood Mac - Во второй части посвященной 75-летию Питера
    Грина программы Весь Этот Блюз'
  summary: 'Питер Грин, часть II: Bluesbreakers, «Боснийская ночь» и рождение Fleetwood
    Mac.'
  files:
  - filename: atb-2021-11-08-green-part-2.mp3
    path: /atb/atb-2021-11-08-green-part-2.mp3
- date: '2021-11-15'
  slug: atb-2021-11-15-green
  topic: GreenIII
  description: '"Now, when the day goes to sleep and the full moon looks The night
    is so black that the darkness cooks Don''t you come creepin'' around - makin''
    me do things I don''t want to Can''t believe that you need my love so bad" - "Теперь,
    когда день уходит спать, и полнолуние смотрит на ночь такую черную, что тьма кипит.
    Не крадись ко мне кругами, заставляя меня делать то, что я не хочу. Не могу поверить,
    что тебе так нужна моя любовь. Ты зеленый Маналиши в двурогой короне" - фаталистичный
    "The Green Manalishi (With the Two Prong Crown)". Знаменитым песням Питера Грина
    уже более полувека. За это время кто только не покушался продемонстрировать свою
    силу духа и музыкальный напор на исполнении "Коронованного зеленого Маналиши".
    Ее и другие песни Грина петь не просто... Или так так просто, что легко скатится
    в другую крайность: исполнять их как ретро-стандарты. Как с ними справляются корифеи
    мирового поп-рока или клубные чикагские блюзмены - в этом выпуске программы Весь
    Этот Блюз'
  summary: 'Питер Грин, часть III: расцвет Fleetwood Mac и магия блюзовой гитары.'
  files:
  - filename: atb-2021-11-15-green-part-3.mp3
    path: /atb/atb-2021-11-15-green-part-3.mp3
- date: '2021-11-20'
  slug: atb-2021-11-20-allman
  topic: Allman
  description: 'Сегодня исполнилось бы 75-лет пламенному гитарному импровизатору,
    новатору и первопроходцу южного рока, одному из плеяды гитарных героев конца 60-х
    - Дюану Оллману. Вместе с братом Греггом (вокалистом, органистом, композиоором)
    он создал группу, предопределившую развитие южного рока (и, кажется, судьбу многих
    лидеров этого движения). В начале пути Группа братьев Оллман держалась блюзовых
    корней, переигрывая на актуальный манер классику жанра от сельских блюзов, до
    первых городских электрических. У Дюана была отличная школа студийной работы с
    мастерами блюза и соул: Aretha Franklin, Wilson Pickett, Clarence Carter, King
    Curtis, Johnny Jenkins... И с другими реформаторами блюза его эпохи: Eric Clapton,
    Bob Scaggz и John Hammond, мл. Блестящая игра Дюана Оллмана буквально завораживала
    публику, вводила в музыкальный транс его коллег по сцене - и песни длились по
    10, 20 минут, не наскучивая. В них был совсем неангельский полет. Но это было
    нечто небесное. В близком кругу Дюана звали Sky Dog - Небесный пес. Он погиб в
    мотоциклетной аварии, немного не дожив до 25 лет. Но музыка его не утратила полетного
    огня и "песьего" задора. Весь Этот Блюз'
  summary: 75-летие Дюана Оллмана — гитарного новатора и сооснователя Allman Brothers
    Band.
  files:
  - filename: atb-2021-11-20-allman.mp3
    path: /atb/atb-2021-11-20-allman.mp3
- date: '2021-12-06'
  slug: atb-2021-12-06-american-blues-1968
  topic: ''
  description: 'В 1968 году вышли два альбома группы под названием American Blues.
    "Американская печаль" - если переводить без нюансов - это и хипповые баллады,
    и психоделический сюр, и прогрессивно-блюзовые эксперименты в сторону тяжелого
    рока. Лидером полистилистичной банды был Rocky Hill. Dusty Hill, басист и его
    младший брат, и барабанщик Frank Bird обрели славу в группе ZZ Top. Рокки затерялся
    в техасской блюз-роковой тусе. Зато когда в 80-х стал выпускать сольные альбому,
    компанию ем в студии составили тузы техасского блюза: Albert Collins, Johnnу Winter,
    Kim Wilson и иже с ними. 1 декабря Рокки Хиллу исполнилось бы 75 лет. 2 декабря
    отпраздновал 80-летие Tom MacGuiness, басист, гитарист, композитор, сооснователь
    британского Blues Band. Еще по-быстренькому отметим юбилеи солнечного Louis Prima,
    разумный Robben FORD, фьюжинист-"фокусник" Ian Akkerman - все блюзу не чужие люди.
    120 лет назад где-то в Миссиссиппи родилась Irene SCRUGGS - это классический блюзовый
    вокал, да еще и с виртуозом Blind Blake. И вот все это - в одной программе Весь
    Этот Блюз'
  summary: 'American Blues 1968: психоделический и прогрессивный блюз на заре хард-рока.'
  files:
  - filename: atb-2021-12-06-american-blues-1968.mp3
    path: /atb/atb-2021-12-06-american-blues-1968.mp3
