  slug: atb-2015-10-26-willie-mabon
  topic: Willie Mabon
  description: 'Программа приурочена к 90-летию со дня рождения Вилли Мэйбуна (24 октября 1925 года) — чикагского певца, пианиста
    и автора песен. Ведущий рассказывает о его биографии: детстве в Теннесси, переезде в Чикаго, наставничестве Биг Мэсео
    Меривезера, Рузвелта Сайкса и Санни Боя Уильямсона. Звучат записи «I''m Mad», «The Seventh Son», «Late Again», «Boogie
    Man» и другие, обсуждается сотрудничество с лейблами «Аполло» и «Чес», роль Вилли Диксона как супервайзера. Отдельное
    внимание уделено европейскому периоду карьеры Мэйбуна и альбому «Chicago Blues Sessions» (1979). Выпуск открывается и
    завершается разбором хита «I Don''t Know» — в исполнении Blues Brothers и Фредди Кинга.'
  summary: 90-летие Willie Mabon, автора «I'm Mad» и «The Seventh Son»
