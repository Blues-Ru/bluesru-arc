  topic: ''
  description: В 1896 году (125 г. назад) (или того же числа, но в 1901 году - разные источники разное говорят - тогда120
    лет назад, тоже юбилей!) в Джорджии родился певец-гитарист левша-слайдист Кокомо АРНОЛЬД (Kokomo ARNOLD). Сам он играл
    уникальным саундом, от которого даже в веселых песенках холодок пробегал по спине. Не смотря на необычно тревожный звук
    слайда, тексты Арнольда почти всегда добродушно-ироничны. Его Milk Cow Blues - "Блюз дойной коровы" (1934г.) - настоящий
    прото-рок-н-ролл, в 50-х стал поп-хитом. Его записывали в стилях от диксиленда, кантри и рокабили, до суиффл, биг-бита
    и хеви -рока. 10 февраля 1921 года в Бирменгеме, Алабама, родился Джо Даскин, по прозвищу "Большой" (Big Joe DUSKIN).
    Играть блюз на клавишах его учил сам Алберт Аммонз, гуру буги-вуги. Но отец Даскина, проповедник, взял с него слово не
    играть "дьявольскую музыку", пока он жив. А прожил благочестивый старик 104 года. И только после его смерти, Даскин в
    возрасте 56 лет выпустил дебютный альбом. Дискография у него небольшая. Но "Награда за достижения всей жизни" от штата
    Цинциннати (Lifetime achievement award - the Cincinnati Area Pop Music Awards) свидетельствует о его важной роли для местной
    блюзовой сцены. 18 февраля 80-летие будет отмечать певица Арма Томас. Он пела соул, ритм-энд блюз, фанк, немного диско.
    Ну и конечно блюзы тоже. И во всем, что она пела, был ясный аромат новоорлеанской музыки. Ее титул Soul Queen of New Orleans
    никто не оспаривает. У нее премия Грэмми за лучший блюзовый альбом 2006 года, несколько номинаций и несколько Blues Awards.
    В музыке Нового Орлеана она воистину культовая фигура. Весь Этот Блюз
