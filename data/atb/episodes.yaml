  slug: atb-2018-08-06-margolin-wlc-i-moscow
  topic: Margolin WLC I Moscow
  description: Программа рассказывает о визите в Россию корифея чикагского блюза Боба Марголина и дуэта «Welch-Ledbetter Connection»
    (гитарист Монстр Майк Уэлч и вокалист Майк Ледбеттер). Обсуждается последний студийный альбом Марголина «The Road» (2016),
    удостоенный BMA как лучший традиционный артист 2017 года, и совместный альбом дуэта «Right Place, Right Time» (2018),
    получивший BMA в категории лучшего альбома традиционного блюза. Звучат песни «Heaven, Mississippi», «Young and Old Blues»,
    «Big Mama», «Cry Me Baby», «Devil's Daughter» и кавер на диксоновскую «Can't Stop You Baby» Отиса Раша. Андрей Евдокимов
    рассказывает о выступлении музыкантов на питерском фестивале «Мосты» и анонсирует их концерт 7 августа в московском Клубе
    Козлова.
