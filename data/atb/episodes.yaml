  topic: Fulson
  description: 'Lowell Fulson (он же Fulsom) был ключевой фигурой блюзовых исканий и перемен середины столетия - революционной
    для жанра поры. Творчество Фулсона наглядно демонстрирует, насколько зыбки классификационные рамки в блюзе: он родился
    в Оклахоме, большую часть жизни прожил в Калифорнии, создавая стиль "уэст-коаст-блюза", играл фанк и Эр-Эн-Би, его лучшие
    записи изданы чикагской фирмой Чесс, но общепризнанно: Фулсон является представителем техасского стиля. Родным для него
    был кантри-блюз, но и в музыке и в стиле жизни он был представителем блюза городского. Программа Весь Это Блюз'
  summary: Ловелл Фулсон — эволюционер блюза от Техаса до Западного побережья, крёстный отец Рэя Чарлза.
