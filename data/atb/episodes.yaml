  slug: atb-2016-04-11-frost
  topic: Frost
  description: 'Выпуск посвящён двум 80-летним юбилярам. В первой части — Фрэнк Фрост: звучат «Midnight Prowler», «King Biscuit
    Blues» в исполнении Jelly Roll Kings с Сэмом Каром и Фредом Джеймсом, дебютные треки 1962 года со студии Sun («Now What
    You Gonna Do», «Jelly Roll King»), а также версия «Got My Mojo Working» ко дню рождения Мадди Уотерса. Во второй части
    — органист Джимми МакГрифф: обсуждаются его дебютный альбом «I''ve Got a Woman» (1962), блюзовый альбом «Back Full of
    Blues» (1967) и запись «The Dream Team» (1996) с Дэвидом «Фэтхедом» Ньюманом.'
  summary: 'Юбилеи Фрэнка Фроста (80 лет) и Джимми МакГриффа (80 лет): два именинника — два стиля блюза.'
