- date: '2016-04-04'
  slug: atb-2016-04-04-harris
  topic: Harris
  description: 'Программа представляет американского блюзового музыканта Кори Хэрриса, который в апреле 2016 года отправляется
    в российское турне по семи городам. Ведущий Андрей Евдокимов проходится по всей студийной дискографии артиста: от дебютного
    альбома «Between Midnight and Day» (1995) и «Fish Ain''t Biting» (1997) до совместной записи с пианистом Генри Батлером
    и экспериментального альбома «Mississippi to Mali» (2003), записанного при участии Али Фарка Туре. Также звучат песни
    из альбомов «Greens from the Garden» (1999), «Blue Black» (2009) и последнего на тот момент студийного альбома 2014 года.
    Особо отмечается умение Хэрриса сочетать верность блюзовым традициям с оригинальными авторскими подходами.'
  summary: 'Corey Harris: гастроли по России, апрель 2016'
