  slug: atb-2021-10-25-green
  topic: GreenI
  description: 'Первая передача из серии к 75-летию Питера Грина (29 октября 1946 года): рассказывается о его пути от группы
    Джона Мэйолла до основания Fleetwood Mac, о психическом надломе и возвращении к музыке в 1997 году. Звучат ранние синглы
    и студийные наброски Fleetwood Mac («Ramblin'' Pony», «Love That Burns», «Oh Well»), записи с чикагскими пианистами Эдди
    Бойдом и Отисом Спэном. Отдельное внимание уделено позднему периоду: альбомам, посвящённым Роберту Джонсону, с участием
    Бадди Гая, Доктора Джона, Отиса Раша и Хьюберта Самлина. Программу завершает версия «Black Magic Woman» Карлоса Сантаны
    — по мотивам темы Питера Грина.'
  summary: 75-летие Peter Green — основателя Fleetwood Mac, британского блюзового гения
