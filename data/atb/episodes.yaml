  slug: atb-2018-04-18-gary-primich
  topic: I
  description: 'Программа «Весь этот блюз» отмечает 60-летие со дня рождения Гэри Примича (1958–2007) — техасского харпера
    с неповторимой манерой игры. Ведущий Андрей Евдокимов рассказывает о биографии музыканта: учёбе у стариков с рынка Максвелл-стрит
    в Чикаго, переезде в Остин, работе в группе The Mannish Boys с барабанщиком Фрэнка Заппы Джимми Карлом Блэком. В эфире
    звучат композиции из девяти сольных альбомов Примича — от дебютного (1991) до последнего «Riding the Dark Horse» (2006),
    в том числе «Early in the Morning», «Let Me Go Home, Whiskey» и «Jailbird» в дуэте со Стивом Джеймсом. Евдокимов вспоминает
    гастроли Примича в Москве в 2004 году и с сожалением говорит о его ранней смерти от героина, не дожив до 50 лет.'
  summary: 60-летие Gary Primich — виртуозного блюзового гармониста
