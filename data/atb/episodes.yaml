- date: '2022-02-28'
  slug: atb-2022-02-28-paul-jones
  topic: Paul Jones
  description: '24 февраля 2022 года отпраздновал свое 80-летие Пол Джонс (Paul Jones). Он выступал с начала 60-х прошлого
    века и до конца 10-х годов нынешнего - пандемия покончила с активной концертной жизнью. Один из создателей группы the
    Blues Band, вокалист и харпер группы Manfred Mann, семь сольных альбомов, а еще он 32 года вел блюзовую программу на BBC.
    А еще временами актер и телеведущий. Сам рыжий, он спел Хуана Перона в оригинальном альбоме "Эвиита" Эндрю Лойда Веббера,
    на сцене играл пирата и сэра Фрэнсиса Дрейка в постановке "Мечта Дрейка", атамана разбойников в "Опере Нищего", и в веселых
    мюзиклах... Как-то в Перестройку приезжал &quot;предвыборным подарком&quot; в Россию... Богатая биография, в которой был
    не только блюз, но блюза было очень много! Удивительно, что темы, корнями уходящие в черную культуру начала прошлого века
    50 лет спустя увлекли сердитых молодых англичан. Для Пола Джонса блюзы из Дельты и Чикаго остались дальним, но верным
    маяком в творчестве. Хотя он записывал еще и песни Seх Pistols и the Ramones - панк-рок. А так же сладкую попсу. Так что
    блюзы среди его записей нужно искать. Но зачем самому, если есть ATB (All That Blues)? В программе три песни про талисман:
    редкая запись 1971 года самого Muddy Waters с Harmonica George Smith; выступление 1981 года Muddy Waters Blues Band в
    крошечном чикагском клубе, куда поджемовать зашли Mick Jagger, Keith Richards, Ron Wood, а пел Junior Wells; и кавер от
    группы Manfred Mann 1964 года. Две песни за мир, одну пел в Лондоне с "местными" Memphis Slim, другую сочинил в спел сам
    Том Джонс. Две песни про одиночество. Одна про "богатые тоже плачут в своем "Жирном городе" (Fat City, запевает Nat Adderley
    Jr., на трубе дико солирует его знаменитый папа Nat Adderley, подпевают шикарные Kokomo Singers), одна про совесть, которая
    не отпустит - гениальная Nobodys Fault But Mine сочинения Blind Willie Johnson. Шопен тоже вписался в программу, потому
    что Слиму понятно "Куда катится этот мир". Но Полу Джонсу еще многая лета! Удивительно, что темы, корнями уходящие в черную
    культуру начала прошлого века 50 лет спустя увлекли сердитых молодых англичан. Для Пола Джонса блюзы из Дельты и Чикаго
    остались дальним, но верным маяком в творчестве. Весь Этот Блюз'
  summary: 80-летие Пола Джонса — певца, гармониста, звезды British Blues и R&B.
