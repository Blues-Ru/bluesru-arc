  slug: atb-2015-08-31-crudup
  topic: Crudup
  description: 24 августа, в 1905 году (111 г. назад) в Форесте (Миссиссиппи) родился Артур Крадап. Из архивов программы Весь
    Этот Блюз извчлечена прошлогодняя передача, посвященная его 110-летию. Главной целью было наглядно (наслышно) продемонстрировать
    тот широкий отклик, который имели песни Крадапа у музыкантов разных стилей и эпох. Часть I; Часть II
  summary: 111-летие Артура Крэдапа — певца и гитариста, чьи песни Элвис Пресли сделал хитами.
