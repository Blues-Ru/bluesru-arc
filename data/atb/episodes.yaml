- date: '2021-08-23'
  slug: atb-2021-08-23-jimmy-mccracklin
  topic: ''
  description: '13 августа 1921 г. в Хелене (Арканзас) родился Джимми МакКраклин (Jimmy
    MCCRACKLIN), блюзовый певец, пианист, гитарист, композитор. Воевал в ВМФ США,
    после войны стал в Лос-Анджелесе профессиональным боксером. Его музыкальная карьера
    продолжалась семь десятилетий. Первую запись сделал в 1945 г. Всего записал более
    30 альбомов, четыре из них стали золотыми. Happy #BluesBirthday, joyful #centenial,
    James David Walker Jr. (August 13, 1921 - December 20, 2012), better known by
    his stage name Jimmy McCracklin, an American pianist, vocalist, and songwriter.
    His style contained West Coast blues, Jump blues, and R&B. Over a career that
    spanned seven decades, he said he had written almost a thousand songs and had
    recorded hundreds of them. McCracklin recorded over 30 albums, and earned four
    gold records. 18 августа 1921 году (100 лет назад) в Джексоне (Миссиссиппи) родился
    Ли Джексон (Lee JACKSON), и скромный, но страстный трудолюбивый деятель чикагской
    блюзовой сцены. Записал несколько синглов, а в 73-м - альбом под собственным именем.
    Как басист или второй гитарист, он записывался со многими выдающимися музыкантами,
    среди которых были Саннилэнд Слим и Джей-Би Хьютто. Happy #BluesBirthday, Warren
    George Harding Lee (August 18, 1921 - July 1, 1979), known professionally as Lee
    Jackson, (Wiki says) an American Chicago blues guitarist, bass guitarist, singer
    and songwriter. Although he did release a number of recordings in his own name,
    such as Lonely Girl (1974), he is most known for his work on recordings with other
    blues musicians such as Johnny Shines, Willie Dixon, Jimmy Reed, J. B. Hutto,
    Sunnyland Slim, Lacy Gibson, and Little Walter. AllMusic noted that "the playing
    style of Jackson is vastly influential". Два столетних юбилея в программе Весь
    Этот Блюз'
  summary: 100-летие Джимми МакКраклина — певца, пианиста и ветерана вест-коаст-блюза.
  files:
  - filename: atb-2021-08-23-jimmy-mccracklin.mp3
