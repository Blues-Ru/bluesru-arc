- date: '2016-08-08'
  slug: atb-2016-08-08-buddy-guy
  topic: Buddy Guy
  description: Программа «Весь этот блюз» отмечает 80-летие Бадди Гая, прослеживая его путь от луизианской фермы до чикагских
    клубов. Звучат ранние записи Chess Records («Broken Hearted», «Ten Years Ago» с Отисом Спэнном и Джуниором Уэллсом), каверы
    на Джона Ли Хукера («Boogie Chillen», «I'm in the Mood») и хиты альбома «Damn Right, I Got the Blues», включая «Where's
    the Next One Coming From?» с Марком Нопфлером и Memphis Horns. Особое место занимает выступление Бадди Гая на концерте
    Rolling Stones из фильма Мартина Скорсезе «Shine a Light» с песней Мадди Уотерса «Champagne and Reefer». Завершается выпуск
    записями из клуба Buddy Guy's Legends в Чикаго, в том числе совместным выходом с Джимми Бёрнсом в июне 2016 года.
  summary: 80-летие Buddy Guy — патриарха чикагского блюза
