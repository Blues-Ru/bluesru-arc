  slug: atb-2020-04-27-svet
  topic: svet
  description: '23 апреля мы праздновали 40-летие со дня рождения минчанина Святослава
    Ходоновича, всем известного как Cвет, и это имя очень ему шло, он в жизни был
    светлым человеком, а на сцене - светлым музыкантом. И ростом, и выражением лица
    Свет напоминал романтичного улыбчивого подростка, открывающего большой мир, в
    котором он всегда видел и слышал что-то яркое, талантливое и свежее. У него самого
    была талантов хоть отбавляй, в том числе и талант делиться своим положительным
    восприятием мира. А еще, хоть он и учился в лицее при минской консерватории, о
    формально музыкального образования ен получил., он был превосходным харпером и
    пианистом, певцом и композитором. Он собрал вокруг себя бэнд мирового уровня.
    И записал в Минске альбом на уровне мировых саунд-стандартов. А какой это был
    артист! Слово "харизма" - слишком грубое. Он не подавлял публику, он ее обаял
    - По артистическим амплуа он был и комик, и первый любовник на сцене. И из интервью
    2005 года Татьяне ЗАМИРОВСКОЙ БелГазете Свет сказал: "За весь мой опыт концертного
    гастролирования среди людей, любящих блюз, я не встретил ни одного человека, который
    бы показался мне агрессивным или мрачным. Блюз не может существовать вне любви!".
    Весь Этот Блюз'
  summary: Памяти Святослава Ходоновича (Света) — минского блюз-музыканта, ушедшего
    в 40 лет.
