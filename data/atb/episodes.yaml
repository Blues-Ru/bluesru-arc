  description: 'Программа посвящена трём юбилеям: 110-летию пианиста-альбиноса Пиано Рэда (Доктор Филгуд), чьи буги-вуги заложили
    основу рок-н-ролла; 120-летию певицы Аделаиды Холл — звезды эпохи джаза, выступавшей с Дюком Эллингтоном, Луи Армстронгом
    и даже гастролировавшей в СССР в годы нэпа; а также 80-летию гитариста и аранжировщика Стива Кроппера — ключевой фигуры
    лейбла Stax, участника Booker T. & the MG''s и автора классических соул-хитов. Звучат записи Piano Red («Doctor of Love»),
    Аделаиды Холл с ансамблем Эллингтона («Creole Love Call», «The Blues I Love to Sing»), а также Кроппера в составе Booker
    T. & the MG''s («Green Onions», «Think»), на альбоме «Jammed Together» с Альбертом Кингом и Попсом Стэйплзом, и его свежем
    альбоме «Dedicated» с Бетти Лавет.'
