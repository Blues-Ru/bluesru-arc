  description: 'Программа отмечает 90-летие чикагского гармониста «Mad Dog» Лестера Давенпорта: рассматриваются его участие
    в записях Бо Дидли 1955 года («Pretty Thing»), совместная работа с Максвелл-стрит Джимми Дэвисом и оба сольных альбома
    — «When the Blues Hit You» (1992) и «I Smell a Rat» (2002). Также отмечается 80-летие техасской певицы и гитаристки-левши
    Барбары Лин, звезды ритм-энд-блюза 60-х, сочетавшей жанровый лоск с истинно блюзовой интонацией. Завершает выпуск рассказ
    о луизианском блюзмене Whispering Smith, которому 25 декабря исполнилось бы 90 лет: звучат его версии «Mojo Hand» — студийная
    и концертная, записанная в Европе вместе с Lightnin'' Slim.'
  summary: 90-летие Lester Davenport, 90-летие Barbara Lynn, 80-летие Whispering Smith
