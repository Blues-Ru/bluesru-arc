  topic: I
  description: 'Выпуск посвящён нескольким юбилеям: 75-летию дельта-блюзмена Бу-Бу Дэвиса — мастера губной гармоники и одноаккордового
    блюза, с песнями из альбомов «Can Man» и «One Chord Blues»; 70-летию со дня рождения Чарльза Брэдли — певца в стиле соул
    и фанк, чей последний альбом «Changes» вышел незадолго до его смерти в 2017 году. Также отмечаются 70-летие вашингтонского
    харпера Марка Уэннера и 75-летие шотландского гитариста Берта Янча. Главный юбилей выпуска — 120-летие со дня рождения
