  topic: I
  description: Сегодня 75-й день рождения Пола Самвелла-Смита (Paul Samwell-Smith), бас-гитариста, композитора, аранжировщика,
    продюсера, впервые прославившегося как основатель группы the Yardbirds и автор их главных хитов. Так ж в этой программе
    Весь Этот Блюз 75-летие его земляка Стива Винвуда (Steve Winwood), певца, клавишника, игравшего еще и на всех струнных
