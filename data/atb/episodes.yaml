- date: '2019-07-01'
  slug: atb-2019-07-01-beck
  topic: Beck
  description: 'Программа "Вeсь Этот Блюз" от 01.VII.2019. Начнут настоящие "легенды"
    - Pinetop Perkins и Hubert Sumlin. Потому что давно пора снова послушать заветную
    Got My Mojo Working. Очень скромно, но со вкусом, с толком, с расстановкой, не
    как пономарь, на губной гармонике будет подыгрывать им Little Annie RAINES, она
    уже не такая уж и маленькая теперь: завра отпразднует солидный круглый юбилей.
    Не забудем и Делани Брамлетта, поскольку вчера ему исполнилось бы 80. А на рубеже
    60-х-70-х его супружеский дуэт Delaney & Bonnie был куда как популярен... В основном
    благодаря участию в концертах и записях уже воссиявших звезд: Duane Allman, Gregg
    Allman, George Harrison, Leon Russell, Bobby Whitlock, Dave Mason, Rita Coolidge,
    King Curtis, and Eric Clapton... Ну и сердечной отзывчивости Бонни. Но большая
    часть передачи будет посвящена записям титана, провидца, умелого тяжеляки и "одного
    из трех ярдбердовских гитаристов", эксперта гитарного тона и умелого композитора
    Джеффа Бека. Во всем, что о играет: от гаражного панка до симфорока - чувствуется
    изначальная блюзовая закваска. Он порой жесток с гитарой, но по жизни - вегетарианец
    уже ровно 50 лет. Happy BluesBirthday, Annie Raines (born July 3, 1969 in Boston,
    Massachusetts) Happy BluesBirthday, Delaney Bramlett (July 1, 1939, Pontotoc County,
    Mississippi - December 27, 2008, Los Angeles) Happy BluesBirthday, Jeff Beck (Geoffrey
    Arnold Beck (born 24 June 1944)! 55''00; 101Mb'
  summary: Пайнтоп Перкинс, Хьюберт Самлин и новинки к 75-летию Джеффа Бека.
  files:
  - filename: atb-2019-07-01-beck.mp3
    path: /atb/atb-2019-07-01-beck.mp3
