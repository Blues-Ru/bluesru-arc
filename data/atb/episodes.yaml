- date: '2016-03-21'
  slug: atb-2016-03-21-pickett
  topic: Pickett
  description: 'В центре выпуска — Уилсон Пикетт, чьё 75-летие отмечалось 16 марта: ведущий Андрей Евдокимов рассказывает
    о его ключевых альбомах — «In the Midnight Hour» (1965), «The Exciting Wilson Pickett» и «The Wicked Pickett» (1966),
    хитах «Mustang Sally», «634-5789» и «Midnight Hour». Отдельно упоминается кавер «Hey Jude» с молодым Дуэйном Олманом на
    гитаре и версия «Born to Be Wild» группы Steppenwolf. Параллельно отмечается 80-летие Соломона Бёрка (21 марта): разбирается
    история взаимного обмена песнями между Бёрком и Пикеттом, в частности конкурирующие версии «If You Need Me» (1963). Юбиляром
    среди записей названа «Laundromat Blues» Альберта Кинга — первая сессия на Stax ровно 50 лет назад, в марте 1966 года.'
  summary: 75-летие Wilson Pickett, 80-летие Solomon Burke — легенды соула 60-х
