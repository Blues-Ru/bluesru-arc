- date: '2021-11-01'
  slug: atb-2021-11-01-waters-jackson
  topic: WatersJackson
  description: 125 лет со дня рождения Ethel Waters и 110 лет со дня рождения Mahalia Jackson. Греховные радости блюза и возвышенный
    экстаз спиричуэлсов разрывали душу Этель Вотерс. Мэхалиа Джексон пела только сакральные гимны и, хоть с детства обожала
    Бесси Смит, но сама, в отличие от Императрицы блюза, никогда не спела бы о пиве и свиной рульке. Голоса Вотерс и Джексон
    - мощное глубокое контральто. Обе выросли в нищете, без отца и матери. Но Вотерс нашла свой дом в цирке-шапито, а Джексон
    - в церкви. Спиричуэлс и госпел - духовные афроамериканские песнопения. По ХХ столетию они шли с блюзом параллельно. По
    законам неплоской неэвклидовой геометрии эти параллели пересекались и по-семейному взаимно оплодотворяли друг друга. Кстати
    и Джексон и Вотерс любили один спиричуэлс - про то, что Он сверху приглядывает за нами, как за воробышками. His eye is
    on the Sparrow. Весь Этот Блюз
  summary: 125-летие Этель Уотерс и 110-летие Мэхалии Джексон — грех, блюз и евангелие.
