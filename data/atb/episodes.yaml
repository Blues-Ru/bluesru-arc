- date: '2021-01-25'
  slug: atb-2021-01-25-richie-havens
  topic: ''
  description: 'Ричи Хаэвенс поэт, художник, борец за гражданские права, певец и гитарист, эктраординарный музыкант, культовый
    в определенных кругах персонаж. Песни Битлз и прочих модных в те времена артистов он играл в стиле фолк, словно только
    так и надо. Он открывал легендарный фестиваль Вудсток в 1969 году. Должен был сыграть четыре песни. В результате сыграл
    все, что знал. Во-первых, из-за гигантского скопления людей и машин все дороги были забиты и организаторы просто умоляли
    его - цитата - "убить время", пока не подъедут следующие участники, во-вторых аудитория требовала еще и еще - в музыке
    Хавенса было все, что созвучно тому времени: и тревога, и нерв перемен, и яростный темп - и уверенность, что сбудется
    все, на что надеялись в так называемое лето любви, в молодежную революцию Америки. Свобода пропитала воздух Вудстока.
    У Хэвенса кончились свои песни, и он взялся за старинные афроамериканские гимны - "Иногда я чувствую себя как ребенок,
    оставшийся без матери". И вдруг по наитию в старинный спиричуэлс об одиночестве и неприкаянности он добавил это слово
    - Свобода - Freedom. И появилась новая песня, с иным посылом. Она стала гимном фестиваля и одним из знаков эпохи... Вудсток,
    лето 1969-го, Ричи Хэвенс; слушателей по склонам холмов, насколько хватает глаз. И песня, родившаяся вот здесь и сейчас,
    точнее, тогда и в тот момент. Ричард Пирс Хэвенс родился в Бруклине, Нью-Йорк, 21 января 1941 года, старший из девяти
    детей в семье. По национальности коренной индеец блэкфуд. Подростком собирал друзей петь танцевальный ду-оп, и сакральный
    госпел. В 20 лет переселился в Гринвич-виледж, наформальную штаб-квартиру неформальной же молодежи. Читал стихи с битниками,
    рисовал, том числе и на улицах портреты на продажу. В 1966 выпустил дебютный альбом, сразу продемонстрировавший отличительные
    черты его музыки: интенсивный вольный гитарный ритм, грустноватый речитатив, создававший впечатление, что он знает больше,
    чем спел, но не хочет никого огорчать раньше времени. Для кого-то эта манера была чуждой, но многих тогда она просто зачаровывала.
    А интуиция и мастерство импровизации позволяло ему улавливать настроение публики и вести ее за собой. Он сочинял то, что
    тогда называлось пени протеста и музыка бунта. Времена менялись, Хэвенс свои пристрастия не менял. 22 января родился красавчик
    Сэм Кук, считающийся первооткрывателем "Соул". Вот он ни денег, ни поклонниц не чурался, одет всегда был Джеймсу Бонду
    на зависть - дорого и со вкусом. Славу познал рано, но и умер, точнее, трагически погиб в 33 года. И тут нет никакой притчи
    или назидательной истории, а просто характеры были разные. Сэму Куку от природы достался роскошный голос, но и владел
    он им искусно. Он бы и так пел, не смог бы иначе, ну а к деньгам относился легко. Есть и ладно, но лучше побольше. Ревность
    или требования повышать и повышать гонорары стали причиной его смерти. Он чаровал аудиторию сладким соул, а мы поищем
    блюзы в его наследии. Оказывается, их немало. И все категории люкс. 22 января 1931 года родился красавчик Сэм Кук, считающийся
    первооткрывателем "Соул". Вот он ни денег, ни поклонниц не чурался, одет всегда был Джеймсу Бонду на зависть - дорого
    и со вкусом. Славу познал рано, но и умер, точнее, трагически погиб в 33 года. И тут нет никакой притчи или назидательной
    истории, а просто характеры были разные. Сэму Куку от природы достался роскошный голос, но и владел он им искусно. Он
    бы и так пел, не смог бы иначе, ну а к деньгам относился легко. Есть и ладно, но лучше побольше. Ревность или требования
    повышать и повышать гонорары стали причиной его смерти. Он чаровал аудиторию сладким соул, но в его наследии блюзов немало.
    И все категории люкс - в роскошных оркестровых аранжировках. Весь Этот Блюз'
  summary: Ричи Хэйвенс — поэт, художник, певец-гитарист, голос Вудстока.
