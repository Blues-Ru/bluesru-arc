  description: 'В выпуске отмечается 80-летие со дня рождения певицы Фонтеллы Басс, записывавшейся на лейбле Chess, — звучат
    её песни «Baby, What You Want Me to Do?» и «Honey Bee». Подробно разбирается новый альбом Боба Дилана «Rough and Rowdy
    Ways» (2020): его близость к чикагскому блюзу, отсылки к Джимми Риду и Билли Зэккит Эмерсону, а также 17-минутная баллада
    «Murder Most Foul» об убийстве Кеннеди. Обсуждается альбом «Blues Freak King» дочери Би-Би Кинга — Ширли Кинг, в котором
    участвуют Пэт Трэверс, Джо Луис Уокер, Элвин Бишоп, Мартин Барр и другие, а с помощью современных технологий звучит голос
    покойного Джуниора Уэллса. Также упоминается свежий альбом Phantom Blues Band «Still Cooking».'
