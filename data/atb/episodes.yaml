  slug: atb-2016-06-06-raful-neal
  topic: Raful Neal
  description: Программа рассказывает о жизни и творчестве Рафула Нила — уроженца Батон-Ружа, прозванного «Луизианской легендой».
    Обсуждаются его альбомы «Louisiana Legend» (1990, Alligator Records) и «I've Been Mistreated» (1991), а также сингл 1998
    года, номинированный на премию W.C. Handy. Отдельное внимание уделено совместному альбому Кенни Нила «Tribute to Slim
    Harpo» (2005), записанному при участии отца и вышедшему уже после его смерти в сентябре 2004 года. Звучат песни «Down
    in Louisiana», «King Bee» Слима Харпо, «Baby, What You Want Me to Do?» Джимми Рида. Завершает выпуск история о проекте
    «Super Harps 2» (Telarc), где Рафул Нил воссоединился со старым другом Лэйзи Лестером — некогда оба играли в группе The
    Clouds, а гитаристом которой в своё время был молодой Бадди Гай.
  summary: Raful Neal — легенда луизианского блюза, мастер губной гармоники
