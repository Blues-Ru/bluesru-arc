- date: '2020-02-17'
  slug: atb-2020-02-17-pink-anderson
  topic: PinkAnderson
  description: 'Это тот самый Пинк, в честь которого - половина названия группы Pink Floyd. И если Пинк Флойд - уже давно
    легенда поп-рок-музыки, то уж Pink Anderson в блюзе получается вдвое легендарней - он был профессиональным артистом-музыкантом
    с пеленок - в самом буквальном смысле. И очевидцем всех перипетий, происходивших с блюзом. В конце-концов он сам на 10
    лет старше этого самого блюза. Samuel Chartes, один из первых документалистов и историков блюза, написал, не кривя душой:
    "Блюзы Пинка Андерсона наполняет меланхоличная печаль. Это грусть-тоска Каролайны, как ее нельзя лучше отобразить. Приглушенные
    чувства, сдержанная печаль. Это выражение тонких нюансов, не замечаемых в спешке. При всех его понятных музыкальных недостатках
    и ограничениях, Пинк создал свой блюз - глубоко личный и трогательный". Пинк Андерсон родился 12 февраля 1900. Он играл
    без претензий душевный и искренний блюз, даже если тема такая банальная, как "Этим утром моя бейби ушла от меня" И на
    этой записи чувства не черствеют. Пинк Андерсон - как зеркало блюзовой истории и его стилистический революций в программе
    Весь Этот Блюз. Весь Этот Блюз'
  summary: Пинк Андерсон — «тот самый Пинк» из названия Pink Floyd, певец-гитарист Пьемонта.
