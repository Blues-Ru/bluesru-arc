  topic: SugarBlue
  description: 'Виртуоз диатонической и хроматической гармоники, он сначала поработал в студии и в клубах с ветеранам самого
    старшего поколения: с Брауни МакГи, Викторией Спивей и Рузвельтом Сайксом, с Мемфисом Слимом. Дружил С Луизианой Редом,
    много сотрудничал с самим Вилли Диксоном... Пропитавшись традициями, как солист он предложил свой, ультрамодерновый, квази-джазовый
    подход к блюзу. Энергичный, виртуозный, нестандартный. 70-летие Sugar Blue - отличный повод вспомнить, какой подвижной,
    напористой, виртуозной и энергичной может быть гармоника в блюзе! Программа Весь Этот Блюз'
