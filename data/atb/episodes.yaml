  description: 80 лет назад, 2 июня 1941 года, в военную пору, в Лондоне на свет явился Чарлз Роберт Воттс. Джаз обожал с
    детства, слушая его на пластиках. Случайно оказался обладателем банджо, которое ему не понравилось. И из корпуса банджо
    он сделал себе барабан, что играть на нем щеточками. Любитель Джелли Ролла Мортона и Чарли паркера познакомился с тощими
    хулиганами лондонских артистических школ. И в 1963 году принял так и быть их приглашение играть в блюзбэнде, названном
    ч сесть песни Мадди Вотерса - THE ROLLING STONES. Рядом с этими, с позволения сказать, коллегами, он выглядел аристократично
    сдержанно. Любовь к джазу не забыл, выпустил 10 джазовых альбомов. (А это больше, чем у Ричардса и Джеггера вместе взятых).
    Deniece Williams - была звездой R.n.B, Занимала в чартах первые номера. Запела госпел - получила 6 премии GRAMMY. Чудесный
    голос. Завтра мы бы праздновали 75-летие потрясающего музыканта, виртуоза губной гармоники и двигателя вест-коаст-блюз
    James Harman. Увы, он не дожил до юбилея две недели. Весь Этот Блюз
  summary: 80-летие Чарли Уоттса — барабанщика Rolling Stones и тайного знатока джаза и блюза.
