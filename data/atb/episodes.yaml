  slug: atb-2016-08-29-august-anniversaries
  topic: I
  description: Выпуск посвящён августовским юбилеям деятелей блюза и джаза. Отмечается столетие Литтл Сона Джексона (техасский
    «гаражный» блюз) и Сонни Томпсона (ритм-н-блюз, аккомпаниатор Фредди Кинга). 75-летие отмечает Джозеф Шабалала — основатель
    южноафриканского ансамбля «Ladysmith Black Mambazo», прославившегося благодаря альбому Пола Саймона «Graceland». Вспоминается
    Жен Барж — аранжировщик лейбла Chess, автор «Mother-in-Law Blues» в исполнении Buddy Guy, а также джазовый пионер электрогитары
    Эдди Дёрхэм. Завершает программу 80-летие Рашана Роланда Кирка — виртуоза саксофона и флейты, исполнившего блюз и тему
    «Peter Gunn» Генри Манчини.
  summary: 'Августовские юбилеи: Литтл Сон Джексон, Джозеф Шабалала, Жен Барж, Сонни Томпсон, Рашан Роланд Кирк и другие.'
