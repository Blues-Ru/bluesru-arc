  description: 'В центре выпуска — норвежский гитарист и вокалист Видар Бюск, отметивший 50-летие: звучат треки с альбома
    «Hustleland Flow» проекта Back Porch Republic, запись «Guitar Mageddon» 2005 года с Джуниором Уотсоном и Китом Андерсоном,
    а также ранние записи 1997 года. К 80-летию со дня рождения вспоминают фолк-блюзмена Филадельфию Джерри Рикса, объездившего
    в том числе СССР. К 110-летию Скэтмена Крозерса — актёра («Сияние» Кубрика) и джазового певца — исполняется его свинг-ритм-н-блюз
    1950-х. Столетие Пегги Ли отмечено её записями «St. Louis Blues» с оркестром Куинси Джонса и знаменитым «Fever» (1958).'
