  slug: atb-2020-11-23-angela-strehli
  topic: ''
  description: В Люббоке, Техас, родилась Анжела Стрелли (Angela STREHLI). Выросла девочка как раз к расцвету фолкового хиппизма,
    к которому с удовольствием и присоединилась. Научилась играть на гармонике и бас-гитаре, стала вокалисткой... Оказалась
    в самом центре остинского блюзового бума. Клуб Энтоунз, котором она три года работала распорядителем, братья Воэн, Ким
    Уилсон, Марсиа Болл и Лоу Энн Бартон - порождения того самого бума. Молодость - они купались в блюзе. И учились у ветеранов.
    Записывается она редко и лишком гладко. А вот концерты ее знатоки расхваливают. И еще, говорят, она знаток истории техасского
    блюза, каких мало. Певец-гитарист Майк Зитоу отпраздновал 50-летний юбилей 19 ноября. Он тое вырос в Техасе. Дебютировал
    как солист, потом 4 года играл в блистательных Royal_Southern_Brotherhood. Нынешний год отметил альбомом Карантинный блюз,
    записанным за две недели самоизоляции. Альбом в сети раздавался бесплатно. Программа Весь Этот Блюз
  summary: Анджела Стрели — техасская блюз-рок певица, участница движения «Третье побережье».
