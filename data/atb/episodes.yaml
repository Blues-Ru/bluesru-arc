  topic: ''
  description: Whistlin' Alex MOORE - 22 ноября исполнилось 120 лет со дня рождения, его запись и откроет программу ВЭБ. Johnny
    Mercer преуспел как голливудский поэт-композитор. Как "эстрадник" попал в блюзовые юбиляры? Ответ в записях Louis Armstrong,
    Oscar Peterson, Louis Jordon, Billie Holiday, Ella Fitzgerald, Aretha Franklin, Ray Charles. Шикарный композиторский блюз!
    Мерсеру родился сего дня 110 лет назад. На десять лет старше его Hoagy Carmichael - джазовый и эстрадный композитор, он
    автор "Up the Lazy River", "Rockin' Chair" и "Georgia on My Mind" . В завершение - одна песня к 125-летию Lucille Hagamin.
    Весь Этот Блюз 18.XI.2019
