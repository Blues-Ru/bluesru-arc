  slug: atb-2021-02-22-jay-geils
  topic: ''
  description: У Джея Гейлза счастливая судьба, в точности соответствующая переменам музыкальной моды. Никто не попрекнет
    его в приспособленчестве, просто интуиция. Его первая группа - вместе с Magic Dick и Peter Wolf - называлась J.Geils Blues
    Band. Зажигательный рок он играл в 70-х. В 90-х собрал интереснейший проект Блюз-Тайм, своеобразную проекцию Чикагского
    блюза на современность. А затем заиграл рафинированный престижный гитарный джаз. 75 лет ему бы исполнилось 20 февраля.
    27 февраля в Луизиана, в семье профессионального музыканта родился Кларенс Гарлоу (Clarence Garlow). Профессионально музыкой
    занялся, когда ему было за тридцать, играл на гитаре, скрипке, аккордеоне - 110 лет со дня его рождения. Главная тема
    - 125-летие Айды Кокс, певицы перового поколения известных нам блюзовых вокалисток, сочинительницы прекрасных песен, например,
    Wild Women Don't Have the Blues ("Диким бабам не о чем грустить"). Весь Этот Блюз
  summary: Биография Джея Гейлса — гитариста, сменившего несколько стилей вместе с музыкальной модой.
