  slug: atb-2020-08-31-van-morrison-75
  topic: ''
  description: Сего дня, но 75 лет назад, в предместье Белфаста, что в Северной Ирландии,
    родился Иван Моррисон. Сын докера, который был еще и упертым меломаном и собирал
    блюзовые и джазовые пластинки. Его сын стал знаменитым на весь мир вокалистом.
    Играл разное, но джаз и блюз оставались его любовью на протяжении всей его долгой
    плодоносной карьеры. 80 лет тому назад, в Луизианской глубинке родился В 1940
    году (80 г. назад) в Лафайетте (Луизиана) родился Фернест Арсену (Fernest ARCENEAUX).
    Как и отец, он собирал хлопок и играл на аккордеоне. Плантации он покинул, чтобы
    играть рок-н-ролл на гитаре в группе с двумя барабанщиками и названием "Громы"
    (Thunders). В конце 70-х он вернулся к корням, и с тех пор не часто, но регулярно
    выпускал альбомы в стиле "зайдекоу". Некоторое время его называли "Новым принцем
    аккордеона", но спустя десятилетия титул несколько утратил актуальность. а музыка
    у него живая, бередит! Оба в программе Весь Это Блюз
  summary: 75-летие Вэна Моррисона — ирландца, сделавшего из блюза «Кельтский соул».
  files:
  - filename: atb-2020-08-31-van-morrison-75.mp3
