- date: '2020-09-23'
  slug: atb-2020-09-23-ray-charles
  topic: RayCharles
  description: Сегодня, 23 сентября, исполнится 90 лет со дня рождения Рея Чарлза,
    певца, композитора, пианиста , аранжировщика. Рэй Чарлз - гений американской музыки.
    Он играл коммерчески-успешный ритм-энд-блюз, джаз от свинга до кул, иногда даже
    рок-н-ролл. Он первым из чернокожих музыкантов стал записывать альбомы белой кантри-музыки,
    чем очень дразнил всяких реднеков. Зато дружил со знаменитейшим кантри-блюзменом
    Вилли Нельсоном. И, конечно, блюз занимал огромное место в его творчестве. Никто
    не считал его прозвище Genius - пустой лестью. Просто так оно и есть. Детство
    гению досталось совсем не безоблачное. Его мать была прачкой. Хромой, ходила с
    тросточкой. Заработков едва хватало на еду. В 15 лет она родила Чарлза, а через
    его - малькика по имени Джордж, который трагически погиб, и Рей всегда винил себя
    в его смерти. Хотя, ну как можно в таком раннем возрасте быть внимательной сиделкой?
    К 7 годам Рей полностью ослеп. Мать понимала, что его надо готовить к самостоятельной
    жизни, и был с ним строга, стараясь приучить его ни от кого не зависеть. Она отдала
    его в школу для слепых и глухих. И хоть тут ему повезло - его учительница Миссис
    Лоренс научила его играть классическую музыку по Брейлю. Это означало сначала
    выучить партию одной руки, пока другая буквально ощупывала ноты, потому партию
    другой - и лишь после этого сыграть произведение целиком. Чарлзу было 14 лет,
    когда умерла его мать. Он пытался заработать как музыкант, но работы не было,
    она жил за гранью бедности. Иногда не ел ничего несколько дней подряд. Но в 17
    лет он уже нашел постоянную работу, играл в клубе с часа ночи до пяти утра. Рей
    Чарлз покинул этот мир в возрасте 73 лет в 2004 году. Почетных наград его не перечесть.
    Звезда на Аллее славы Голливуда, 37 номинаций на Грэмми, из которых 17 он получил.
    Медаль за искусство, почетный доктораты в университетах, выступления в Белом Доме
    и прочая, прочая. Он концертировал до последнего года жизни. Весь Этот Блюз
  summary: 90-летие Рэя Чарлза — гения американской музыки, объединившего блюз, соул
    и джаз.
