  slug: atb-2018-10-22-burton
  topic: Burton
  description: 'В программе звучат треки Чарльза Бёртона — «Shake Your Hips», «Crackdown», «Sweet Potato Pie», «Shake It»
    и «Drop a Dime» — из альбомов 2004 и 2013 годов. Бёртон представлен как мастер широкого диапазона: от медленных 12-тактовых
    блюзов до свингующего шафла. Вторая часть посвящена Корки Сигалу: отмечается 30-летие его проекта Chamber Blues и приближающееся
    75-летие музыканта. Рассказывается история Siegel–Schwall Blues Band (1964–1974), их работа хаус-бэндом в чикагском «Pepper''s
    Lounge» и сотрудничество с Мадди Уотерсом, Хаулин Вулфом и Уилли Диксоном. Упоминается запись произведения Уильяма Руссо
    для блюз-бэнда и симфонического оркестра под управлением Сэйдзи Одзавы для Deutsche Grammophon.'
  summary: 'Charles Burton: гастроли по России; 75-летие Corky Siegel'
