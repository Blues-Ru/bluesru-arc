  topic: ''
  description: 'В программе отмечаются три юбилея 24 февраля: 70-летие гитариста Джорджа Торогуда (George Thorogood) и 100-летие
    новоорлеанского музыканта, аранжировщика и продюсера Дэйва Бартоломью (Dave Bartholomew). Звучат песни Торогуда — «GTO»,
    «I Drink Alone», «I''m a Steady Rollin'' Man», а также его дуэты с Бадди Гаем и Джоном Ли Хукером («Sally Mae»). Бартоломью
    представлен записями «Another Mule», «When the Saints Go Marching In» и «Witchcraft» в исполнении Элвиса Пресли, а также
    дуэтом с Фэтсом Домино. Кроме того, анонсируются российские гастроли американской певицы Джей Джей Тэймс (J.J. Thames)
    с концертами в Москве, Барнауле, Новосибирске и других городах.'
  summary: 70-летие George Thorogood, 100-летие Dave Bartholomew; гастроли JJ Thames
