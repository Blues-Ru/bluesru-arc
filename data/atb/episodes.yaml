  slug: atb-2016-01-25-luther-tucker
  topic: LTucker
  description: 'Центральная тема выпуска — 80-летие чикагского гитариста Лютера Такера (р. 20 января 1936): ведущий рассказывает
    о его дебютном альбоме 1990 года на лейбле Antone''s, о роли Роберта Локвуда-младшего как наставника, об участии Такера
    в альбоме Джеймса Коттона «Pure Cotton» (1968) и о посмертном альбоме с Ford Blues Band. Также отмечается 75-летие британского
    блюзмена Лонг Джона Болдри с исполнением «Got My Mojo Working». Отдельный блок посвящён 80-летию новоорлеанского слепого
    гитариста Снукса Иглина: звучат композиции из альбомов «You Give Me Nothing but the Blues» (1987) и «Out of Nowhere» (1989).
    В финале программы — Ричи Хэвенс, которому исполнилось бы 75 лет, и анонс российских гастролей Джейси Смита.'
  summary: 80-летие Luther Tucker; юбилеи Snooks Eaglin, Long John Baldry, Richie Havens
