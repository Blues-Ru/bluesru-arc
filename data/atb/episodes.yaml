- date: '2021-11-15'
  slug: atb-2021-11-15-green
  topic: GreenIII
  description: '"Now, when the day goes to sleep and the full moon looks The night is so black that the darkness cooks Don''t
    you come creepin'' around - makin'' me do things I don''t want to Can''t believe that you need my love so bad" - "Теперь,
    когда день уходит спать, и полнолуние смотрит на ночь такую черную, что тьма кипит. Не крадись ко мне кругами, заставляя
    меня делать то, что я не хочу. Не могу поверить, что тебе так нужна моя любовь. Ты зеленый Маналиши в двурогой короне"
    - фаталистичный "The Green Manalishi (With the Two Prong Crown)". Знаменитым песням Питера Грина уже более полувека. За
    это время кто только не покушался продемонстрировать свою силу духа и музыкальный напор на исполнении "Коронованного зеленого
    Маналиши". Ее и другие песни Грина петь не просто... Или так так просто, что легко скатится в другую крайность: исполнять
    их как ретро-стандарты. Как с ними справляются корифеи мирового поп-рока или клубные чикагские блюзмены - в этом выпуске
    программы Весь Этот Блюз'
  summary: 'Питер Грин, часть III: расцвет Fleetwood Mac и магия блюзовой гитары.'
