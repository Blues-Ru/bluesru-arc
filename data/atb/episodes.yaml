- date: '2022-01-31'
  slug: atb-2022-01-31-paul-delay
  topic: ''
  description: Харпер, вокалист, сонгстер, бэндлидер и... гарпунер (Harpoon Man) Пол
    ДеЛэй (Paul DeLay). Мужчина крупный, а играл с головокружительной скоростью легко.
    Прекрасный музыкант, дувший без оглядки - просто огонь на сцене! Он зажигал музыкой
    всех вокруг - и коллег, и аудиторию. Среди шуточек и пародий, буги и стилизаций
    под зайдекоу, чистого веселья веселья ради (что тоже очень нужно) - у него встречаются
    и настоящие блюзовые шедевры. Выпало ему прожить всего 55 лет. А сегодня ему исполнилось
    бы 70. Выдающийся музыкант, он ушел на подъеме. Вспомним хотя бы несколько песен
    из его альбомов. И есть повод поговорить о метаморфозах сюжета "Наступит день,
    когда в моей жизни ты уже больше ничего не будешь значить". Ее на свой манер,
    под свой характер записывали первооткрыватель Sleepy John Eastes, продолжатели
    Big Maceo и Muddy Waters, белые реформаторы the Allman Brothers и Eric Clapton,
    а также нобелевец Bob Dylan. А в 1942 году 19 января, (80 лет назад) в Луизиане
    родился Джо Джонсон (Joe Johnson). Он играл и луизианский болотный блюз, и вполне
    эстрадный ритм-энд-блюз. Гитарист, басист, харпер... Какой гитарный старт у песни
    - Dirty Woman Blues - пальчики оближешь... А ведь это блюз грязной женщины! В
    игривой песне змеелова - про гремучую змею, гремучую малышку - грозный стук колдовских
    тамтамов Луизианы. Может и не самый знаменитый, но вполне достойный представитель
    славной блюзовой фамилии. И вообще, в блюзе много Джонсонов не бывает. И такой
    вопрос "Что общего между блюзом и Всемирным океаном? Ответ и все прочее в 55 минутах
    программы Весь Этот Блюз
