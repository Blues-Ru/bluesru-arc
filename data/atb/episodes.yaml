  slug: atb-2021-10-04-branch
  topic: Branch
  description: 'Сегодняшние блюзовые юбиляры: Billy_Branch, Keb'' Mo... и внезапно примкнувший к ним Chubby Checker. Билли
    Бранч, мастер игры на губной гармонике, может и не самый яркий проводник чикагских блюзовых традиций в наши дни, но виртуоз
    и смачный артистичный и колоритный певец. Получив диплом политолога в Чикагском университете, ушел играть в ансамбль Вилли
    Диксона "Все звезды". Собрал проект "Сыны блюза" (Sons Of Blues), много работает и как солист, и как сайдмен, и как преподаватель
    блюзовых наук. Трижды номинировался на Grammy, но почтительно уступал граммофончики БиБиКингу и Эрику Клэптону. А вообще
    его губная гармоника звучит в двух с половиной сотнях альбомов! Кевин Мур, ныне известный в блюзе как Кеб-Мо. Профессионально
    выступать начал в 1972 г., но дебютный альбом выпустил только 22 года спустя. Отлично знает традицию, но в своих альбомах
    отрабатывает чистый современный саунд с прилежанием перфекциониста. Неоднократный лауреат "Грэмми". Ну и Чабби "Снова
    станцуем твист" Чеккер для пикантности. Весь Этот Блюз'
  summary: 'Юбиляры: Билли Бранч — харпер Чикаго, Keb'' Mo и Chubby Checker.'
