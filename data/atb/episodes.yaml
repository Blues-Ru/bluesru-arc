- date: '2017-05-08'
  slug: atb-2017-05-08-joe-bonamassa
  topic: BonamassaI
  description: Выпуск посвящён 40-летию Джо Бонамасы (8 мая 2017 года). Ведущий Андрей Евдокимов рассматривает альбом 2016
    года «Blues of Desperation», разбирая такие треки, как «This Train», «Distant Lonesome Train» и заглавная композиция.
    Отдельное внимание уделяется коллекции винтажных гитар музыканта — от Gibson 1923 года до редкой акустики Грамер модели
    Джонни Кэша 1969 года. Также упоминаются альбомы «Blues Deluxe» и «Dust Bowl», связь Бонамасы с Би Би Кингом и его просветительская
    деятельность. В финале звучит трек «Song of Yesterday» из ещё не вышедшего концертного альбома, записанного в Карнеги-холле.
