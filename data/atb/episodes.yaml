    Had Enough» и «You Got to Reap What You Sow». Среди апрельских юбиляров — гитарист Ларри МакКрей (60 лет), харп-плеер
    и гитарист Пол Ошер (70 лет), первый белый музыкант в бэнде Мадди Уотерса, и пианист Роберт МакКой (110 лет). Отдельное
    место занимает Бобби Макферрин с блюзовой «Beverly Hills Blues» как неожиданный гость программы.
