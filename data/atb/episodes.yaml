  description: 'Конец октября 2016 года - сразу три блюзовых юбилея, каждый из которых
    на свой манер достоин интереса: 70 лет Питеру Грину, онователю группы Fleetwood_Mac;
    120 лет со дня рождения одной из блюзовых див 20-х годов Ethel WATERS; и уж совсем
    на грани парадокса - 60-летие MADAGASCAR SLIM, уроженца Мадагаскара, проживающего
    в Канаде и смешивающего народные мадагаскарские раздумчивые мотивы с блюзовыми
    традициями. А кроме того надо отметить завтрашний 90-летний юбилей легендарного
    чикагца Dave MYERS, солиста-гитариста группы Aces, отдавшегося игре на бас-гитаре
    всем пылом души. И уж совсем для любителей редкостей и странностей - 80-летие
    Andre WILLIAMS, специалиста зловещей мелодекламации. "ВЭБ",'
  summary: 70-летие Питера Грина, 95-летие Джимми Уизерспуна и юбилей ещё одного артиста.
