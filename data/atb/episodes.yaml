- date: '2018-11-26'
  slug: atb-2018-11-26-hadd
  topic: Haddix
  description: 'Сегодня юбилей у Jimmy Johnson - он празднует 90-летие. Завтра 80 лет отметит Travis Haddix. Двум славным
    юбилярам посвящен этот выпуск программы Весь Этот Блюз, особо рекомендуемый тем блюзолюбам, кому эти имена мало что говорят.
    Оба горячо любимы именно в узких кругах! (слушаем/скачиваем) "Поразительно, сколько общего в их биографиях, в позднем
    выходе к публике, а в музыке они разделяют любовь к ярким краскам духовых. И сколько различий - даже собственно в звучании
    гитары. Джонсон, в отличие от Тревиса, гитарный почерк не меняет, ясный суховатый саунд, и его фингерпикиг определенно
    выдает тайные связи с кантри. Ну а все тайное становится явным. Вот вдруг альбом "Причуды Джонсона" (Johnson''s Whacks).
    Помесь Джамболайи с хиллбилли. Текст валит с ног: "Едва вспомню тебя, дорогая, так ногтями впиваюсь в свой гроб". Тексты
    в песнях обоих вообще превеселенькие! Например, у Хэддикса есть такая: "Dick for Dinner". Потому что жене нравится Дик,
    и она его хочет... на обед позвать. Так что выпуск объявляется 18+ (бывшее "детям до 16 вход воспрещен")'
  summary: 'Двойной юбилей: 90-летие Джимми Джонсона и 80-летие Трэвиса Хэддикса.'
