  slug: atb-2020-10-12-houston-stackhouse
  topic: ''
  description: Houston Stackhouse - одинокий блюзмен, которого просто необходимо послушать. Ему в конце сентября исполнилось
    бы 110 лет. 125 лет исполнилось певице Edna Hicks. Она записывалась всего один год, но осталась в истории как образец
    классического женского блюза. Barefootin' - вечнозеленая тема Robert Parker. он герой одной песни, зато ее исполняли и
    The Marvelettes, и Muddy Waters, и Johnny Winter, и дюжины других выдающихся музыкантов. Вчера ему исполнилось бы 90!
    А 20 октября предстоит 130-летний юбилей Jelly Roll MORTON, "Рулета с джемом", который был пианистом-виртуозом, бэндлидером
    и изобретателем джаза. Весь Этот Блюз
