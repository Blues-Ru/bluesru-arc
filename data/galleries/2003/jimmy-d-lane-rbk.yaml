description: Очаково-Блюз 2003. Jimmy D. Lane в Ритм-энд-Блюз кафе, 5 сентября 2003.
  М.Мишурис, Б.Булкин, И.Жук, Blues Doctors.
photos:
- file: sDSCN3638.jpg
  page_html: sDSCN3638.htm
  caption: Шоу Мишуриса — все очень душевно
- file: sDSCN3641.jpg
  page_html: sDSCN3641.htm
  caption: Присутствует доля неложного пафоса
- file: sDSCN3643.jpg
  page_html: sDSCN3643.htm
  caption: Мишурис покорил всех в зале. Бывалые — Маргулис, Макаревич, Нами — просто
    сияли улыбками, пока не заметили
- file: sDSCN3646.jpg
  page_html: sDSCN3646.htm
  caption: На радость публике Мишурис выгуливает саксофонистов по залу. Серьезность
    Бориса Булкина понятна — он несет водку к своему столику
- file: sDSCN3647.jpg
  page_html: sDSCN3647.htm
  caption: Джимми Ди Лейн играет блюз не на шутку.
- file: sDSCN3649.jpg
  page_html: sDSCN3649.htm
  caption: Вероятно, это Mary Had A Little Lamb — не только у нас заездили эту тему.
    Лейн играл ее скорее по образцу SRV, а не BG.
- file: sDSCN3650.jpg
  page_html: sDSCN3650.htm
  caption: Для соло в медляках Джимми присаживался. Самое интересное на этих фотографиях
    — лица слушающих. Лицо Ивана Жука не видно, но и сама поза выразительна.
- file: sDSCN3654.jpg
  page_html: sDSCN3654.htm
  caption: Лицом к лицу Иван Жук и Джимми Ди Лейн.
- file: sDSCN3655.jpg
  page_html: sDSCN3655.htm
  caption: Весь ушел в себя…
- file: sDSCN3662.jpg
  page_html: sDSCN3662.htm
  caption: Blues Doctors завершали концерт, нисколько не снизив планки его качества
    — ярко, энергично, уверенно. Джимми Ди Лейн и его барабанщик слушали екатеринбуржцев
    с очевидным удовольствием.
- file: sDSCN3663.jpg
  page_html: sDSCN3663.htm
  caption: Владимир Демьянов и, на первом плане, какие-то цветочки.
