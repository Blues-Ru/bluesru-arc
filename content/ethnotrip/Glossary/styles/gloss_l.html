<td><div align=justify><a name=lingala><b class="name"><font class="first">L</font>ingala</b></a>: Торговый язык побережья реки Заир между современными Конго и Демократической Республикой Конго(Заир), представляющий собой гибрид нескольких африканских языков. Можно услышать в музыке <a href="gloss_s.html#soukous">soukous</a>.</div></td>
