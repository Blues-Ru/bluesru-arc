  deleted: false
  text: 'http://cs322923.vk.me/v322923695/efc/Fv-3TvlLgHs.jpg


    или вспоминая старинную блюзовую традицию делиться отчетами-рассказиками о том
    где был, чего видел...


    прошедшую неделю провел в Киеве...

    во многом по блюзовым делам, в погоне за впечатлениями...

    на эти дни в славном городе ожидалось прибытие замечательных блюзовых гостей из
    Москвы, давно известных и уважаемых в сообществе...

    следующий день должен был ознаменоваться смотром достижений города Киева по блюзу
    в виде общего (и местами международного) джема...


    в дорогу меня провожала теплая компания в лице Аграновского Алексея Анатольевича
    и Андрея Евдокимова...

    в наушниках, конечно же...

    два давних эфира замечательной передачи "Весь этот Блюз", один из которых с участием
    также Pera Joe, другой же вообще при поддержке цвета Московского Блюза, в лице
    Юрия Каверкина и Вадима Иващенко...

    в такой компании не чувствуешь себя одиноко в дороге...

    душевная компания...

    заставил задуматься один из блюзов Memphis Minnie, бесподобно исполненный доктором
    с сербским гостем на гармошке...

    это сербский гость на гармошке, а доктор, как зачастую, с гитарой, акустической,
    и с вибрато в голосе...

    блюзом был Nothing in Rambling...

    дескать, нет ничего в странствиях...

    задумался я, не предупреждение ли это...

    но вспомнив, что Rambling имеет значение слоняющийся,беспорядочный,хаотичный...

    без цели и без конца...

    в таких путешествиях смысла действительно нет...

    заработаешь только посаженную печень, стоптанные ноги, да горечь по бесцельно
    прошедшей жизни...

    я же имел четкую цель и мне было куда вернуться...

    забегая вперед скажу, что расчет оказался верен и путешествие удалось...

    домой я вернулся с огромным ворохом бесподобно-замечательных впечатлений...


    собственно, к ним и приступим...

    впечатления начались с первого же дня моего пребывания в славном Киеве, субботы...

    хороший день для блюза...

    день, и особенно вечер, когда люди откладывают заботы повседневности в сторону
    и оглядываются по сторонам в поисках катарсиса...

    у некоторых это стандартный набор ТВ-развлечений с синтетической, фальшивой и
    лицемерной музыкой...

    у пятидесяти же киевлян и гостей столицы, собравшихся в уютном зале одного из
    пабов, катарсис этот был натуральным, живым и правильным...

    угощение в этот вечер было королевским...

    на сцене заправляли долгожданные и славные гости из Москвы...

    Юрий Новгородский и Дмитрий Казачков...

    эта компания продемонстрировала особое, во многом утраченное в наше время, умение,
    как при помощи двух акустических гитар и голоса держать крепко в своих руках внимание
    всего полного зала...

    это умение дорогого стоит...

    во многом это чудо было обусловлено той уверенностью в своих силах и в своем искусстве,
    что исходила от музыкантов...

    уверенность у москвичей была такая, что чувствовалось - в округе примерно 3000
    miles лучше них блюзы не играет никто...

    и это правильно...

    ибо, как известно, уверенного блюзмена слушать легко и приятно, в отличии от неуверенного...

    неуверенный и подступаться к этому делу не должен, считаю...

    в общем, доверие к присутствующим на сцене установилось с первых минут и долго
    еще витало в воздухе уже после того как они сошли со сцены...

    Юрий Новгородский поразил звучанием, разнообразием, насыщенностью и красотой звуков
    своей гитары...

    по интернетовским материалам я знал его как адепта электрогитары, но этим вечером
    он продемонстрировал, что и с акустикой он в приятельских и близких отношениях...

    его гитара, для меня, в этот вечер имела звучание National steel гитары...

    это такая старинная, глубоко национальная американская металлическая гитара, каждое
    прикосновение к струнам которой вызывает звук густой, насыщенный и протяжный,
    с эхом...

    попробуйте хлопнуть над пустым металлическим ведром - это будет самое оно...

    ритм наш герой держал четко и вкусно, со знанием традиций, солировал...

    гитара в этот вечер была в надежных и уверенных руках...

    равно, как и вторая гитира на сцене за которую отвечал второй замечательный москвич
    Дмитрий Казачков...

    но главным оружием Дмитрия в этот вечер был все-таки голос и гуманитарное наполнение
    между исполняемыми текстами...

    репертуар в этот вечер звучал незаигранный...

    акустический блюз стародавнего происхождения...

    и это хорошо...

    ибо блюзовые стандарты хороши в меру, но когда они звучат в каждом и любом блюзовом
    мероприятии, ты начинаешь оглядываться по сторонам в поисках оригинальности...

    в тот вечер это было...

    более половины текстов я не узнал...

    чувствуется глубокое погружение исполнителя в материал блюзовых текстов...

    английский исполнителя был достойным...

    подача экспрессивной и уверенной...

    и тут самое время рассказать об одном из двух главных открытий и впечатлений от
    поездки...

    это впечатление от бесподобного умения Дмитрия подавать подводки к исполняемым
    им блюзовым текстам...

    я всегда жду от исполнителя блюза достойного представления того что он исполняет...

    в наших краях это жизненно важно...

    без понимания о том, что говорит исполнитель для зрителя теряется по меньшей мере
    половина обаяние блюзового искусства...

    наш рассказчик в тот вечер понимал блюзовые тексты в полной мере и умел донести
    их до зрителя в небольших и ярких представлениях перед исполнением...

    представления эти были наполнены блюзового смысла, юмора, глубины и внезапных
    сюрпризов...

    например, одна из песен была представлена следующим образом:


    прямая речь начинается...


    "...В следующем произведении лирический герой рассказывает о своих взаимоотношениях
    со своей подругой...

    солнечны и безоблачны они, по его словам...

    каждый куплет подтверждает это следующими словами...


    О, как я люблю её, как она любит меня...

    когда мы гуляет вместе, нам так хорошо...

    О, как я люблю её, как она любит меня...


    О, как я люблю её, как она любит меня...

    когда мы смотрим друг на друга, нам так хорошо...

    О, как я люблю её, как она любит меня...


    и так несколько куплетов...

    но в последнем куплете лирический герой все же несколько проговаривается...

    он признается, что с деньгами то у него зачастую туговато...

    и когда в очередной раз в каком-нибудь кафе-ресторане, после замечательного вечера
    вместе, у него в карманах не оказывается денег рассчитаться...

    Она достает свой кошелек и сполна за всё расплачивается, то...

    О, как я люблю её, как она любит меня...

    О, как я люблю её, как она любит меня..."


    замечательное представление, раскрывающее суть и хитрецу блюзовых текстов, которые
    надо дослушивать обязательно до самого конца...

    ведь обычно, только в самом конце всплывает какая-то многозначительная подробность,
    переворачивающая весь предыдущий рассказ с ног на голову...

    и это правильно, ибо самые откровенные разговоры к концу застолья, когда почти
    все уже допито...

    дослушай до конца, не доверяй сразу и не спеши с выводами...


    я искренне благодарен Дмитрию за эту демонстрацию глубокого понимания блюзовых
    текстов и желания поделиться этим пониманием со зрителем...

    оно подразумевает надежное знание традиции и того, как это должно быть...


    это был первый вечер...

    и он был красив, музыкален и наполнен смыслами...

    позволю себе один многозначительный вывод...

    было время, когда исполнение блюза на постсоветском пространстве подразумевало
    широкополую шляпу, соответствующую техасскую обувь и брутальную посадку на сцене...

    была такая своеобразная игра в блюз, со всеми его атрибутами...

    зачастую это было неестественным и наигранным...

    сейчас же я все чаще и в основном вижу упор на музыкальную красоту и исполнительскую
    искренность...

    люди на сцене остаются самими собой...

    и это красивые люди...


    это был вечер первый...

    и он был великолепен...

    искренне благодарен тому читателю, кто добрел до этих заключительных строк...

    знаю, было нелегко...)'
