  text: 'Вчера приобрел двойной пиратский диск John Campbell - 3 альбома.

    Я давно искал этого гитариста, просто  до этого все время приходилось натыкаться
    на его вещи в разных блюзовых сборниках. А тут все три вышедшие при жизни музыканта
    альбома: "One Believer" (''91),"Howling Mercy" (''93) и достаточно редкий "A Man
    and His Blues". Вещи все как на подбор и даже не хочется выделять, что наиболее
    понравилось. Этот диск очень рекомендую любителям жесткого гитарного блюза с сочным
    и чувственным вокалом. Аналогия с SRV и не только в музыке но и в судьбе (умер
    от сердечного приступа в ''93 в возрасте 41г.).

    Прошу прощения за навязчивость, но поверьте музыка очень достойная...'
