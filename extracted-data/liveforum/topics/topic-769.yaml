    deleted: false
    text: 'John Campbell действительно очень интересная фигура на блюзовом небосклоне.
      Что касается оценок, я бы расставил немного другие акценты. В чём заключается
      «жёсткость»? По-моему не столько, сколько бескомпромиссный, что не совсем одно
      и тоже. Аналогии с SRV: в музыке, по-моему, никакой, в судьбе параллелей тоже
      немного: кажется, JC не отличался столь беспорядочным образом жизни, которым
      славился SRV, однако тут я могу и ошибаться. Редкость "A Man and His Blues"
      и опять вопрос: с чего бы это вдруг? С другими пластинками его вообще сравнивать
      не совсем правомерно. Всё-таки, в отличие от "One Believer" и "Howling Mercy",
      он по большей части акустический, а значит и воспринимается совсем по-иному.
      Но хорош, конечно, ничего не скажешь. А я вот очень люблю «One believer»...'
