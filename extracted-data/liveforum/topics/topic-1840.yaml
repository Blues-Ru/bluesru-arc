  text: "4 февраля в БиБиКинге состоялся ежемесячный открытый джем с Др. Аграновским.\
    \ С самого начала что-то не заладилось. Мы опоздывали к намеченному для подтверждения\
    \ брони столика времени. Каково же было наше удивление, когда, входя во двор дома\
    \ 4/2, мы не увидели привычно освещённого входа в подвал. Всё было во тьме. На\
    \ ступеньках, скамейках, на барной стойке стояли свечки. В БиБиКинге уже час не\
    \ было электричества. Все ходили какие-то ошарашенные и раздражённые. Официантки\
    \ нервно бегали из угла в угол, поскольку кухня естественно не работала, звукачи,\
    \ довольно подхихикивая, что вот, дескать, скоро домой можно ехать будет, тусовались\
    \ в районе гардероба, Док говорил, что «мы готовы ко всему» и, похоже, «придётся\
    \ играть акустику», что само по себе тоже не плохо.\n\tВремя шло, а электричества\
    \ всё не было. Официантка грозилась нас согнать с зарезервированного столика,\
    \ объясняя это тем, что есть клиенты поважнее, которые готовы воспользоваться\
    \ всеми прелестями кухни. Хотя какая, к чёрту, кухня, когда нет электричества,\
    \ а, соответственно, есть только холодные закуски. Впрочем, когда свет появился,\
    \ а случилось это только в 20:25, официантка про нас напрочь забыла, не собираясь\
    \ даже проплывать мимо столика, а всё-таки силком сделанный нами заказ был выполнен,\
    \ когда концерт уже закончился.\n\tИтак, начался джем. Первые несколько вещей\
    \ традиционно отыграл «Чёрный хлеб», затем стали присоединяться джемующие: Андрей\
    \ Цыганков, скрипач, Юрий Каверкин, etc. В середине традиционно состоялся этнический\
    \ сет: выступал монгол Сары Май с какой-то странной дудкой (дудук?) и кучей варганов.\n\
    \        В этот день с утра состоялись похороны лидера группы «Цветы» Александра\
    \ Лосева. Сергей Воронов и Юрий Дегтярюк посвятили памяти Александра и сыграли\
    \ композицию, ставшую, по не только моему мнению, кульминацией вечера.\n     \
    \   Под конец на сцене практически полностью сменился состав музыкантов: вышли\
    \ молодые ребята, игравшие пост-панк в духе «Off Spring».\n       Завершился джем\
    \ традиционным «Got My Mojo Wokin’», в версии Дока с возглавляемым им «Чёрным\
    \ хлебом»."
