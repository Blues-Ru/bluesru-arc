  text: "Девчонки порадовали.\n\nПервой выступала Тина Кузнецова. АЕ за сценой сказал:\
    \ Если бы двадцать лет назад я прибил бы Понамореву, я бы уже отсидел, вышел,\
    \ а такой музыки не было бы. В общем - очень крутой джаз\n\nДальше блюз Тамарка\
    \ с Жуком на клавишах. Буги Чиллен сильно выросли и играли безупречно, особенно\
    \ прогрессирует их гитарист Алекс Силуянов.\n\nЮлька с Гургеном выдали очень круто\
    \ отрепетированную программу а-ля Хендерсон, очень круто.\n\nБлюз Докторсы сыграли\
    \ одну песню с Инес - вау хеви-метал! Прикольно. После концерта Инес искали поклонники.\n\
    \nКатя Сомова из Е-бурга была неотразима. Слов нет, чтобы описать - это надо видеть.\
    \ (Например во вторник)\n\nОксана Кочубей завершила концерт сетом песен Дженис\
    \ - очень мощно и на одном дыхании. \n\nОт блюзменов поздравил только Петрович:("
