  text: "Хороший был джем.\nК началу не успела - оказалась в самый разгар.\nThe Bluesspinners\
    \ джем держали от начала до конца - спасибо Алексею.\nБыл афрорусский музыкант\
    \ (можно я лучше так скажу, а не буду выстраивать легенду, как он будто бы играл\
    \ с Бо Дидли? :) Всё-таки черный в блюзе способен сам по себе создать атмосферу\
    \ блюза. Даже если он сядет на табурет, возьмет в руки бубен и скажет при этом\
    \ под чью-то гитару англо-русско-итальянско-французскую скороговорку.\nПера Джо\
    \ во вкус вошел не сразу, но вошел, и как вошел! :) На сцене был не 5 минут -\
    \ довольно долго, выходил много раз, где-то поддаваясь внутреннему зову, где-то\
    \ по приглашению Алексея, музыкантов, зала. Причем просить его для этого особенно\
    \ не нужно было - рвался не менее, чем Рост Звездин или Жора, когда выступает\
    \ в B.B.King'e. По-моему, джем ему был явно в кайф. Понтярщик? Да, понтярщик,\
    \ но оправданный. Я в гармонике мало что понимаю, если честно, и способ игры на\
    \ ней остается для меня загадкой, но наблюдая на джемах выступления гармошечников,\
    \ уже начинаешь угадывать последующие ходы. Новый человек всегда привносит новые\
    \ эмоции, свое переосмысление нашей с вами музыки, к которой мы  привыкли. Играет\
    \ легко, ненапряжно, нестандартно. Странно, но Сербия - уже Европа.. у нас пока\
    \ что чаще Азия, а так - страна контрастов. Вышли Питерские музыканты митьковского\
    \ вида, по поводу кого меня спросили: А это что за КВН-щики?? Спели блюз на русском\
    \ языке... не помню.. кажется boom boom.. Но джем в целом был хорош настолько,\
    \ что это, как бы, и не важно..\nСаша Братецкий с Пера Джо сыгрались быстро, экспромтом\
    \ получилось микро-шоу - один периодически комментировал коллегу :), другой похлопывал\
    \ по плечу, отнимал гармошки, играл, пожевывая жвачку (и как он ухитрялся это\
    \ делать? :)\nМне нравится, когда, тихо \"перешептываясь\", вместе играют Кожекин\
    \ и Братецкий. Братецкий с Пера Джо \"переговаривались\", \"договаривались\",\
    \ друг другу уступали - был диалог, как в случае с Кожекиным, но другой - иная\
    \ громкость, темп, азарт, последовательность. \nВыступление Роста - живо, искренне,\
    \ в меру грязно - как обычно. Мне нравится, кому-то - нет, но это ваше дело. Есть\
    \ в нем что-то корневое.\nЮрий Каверкин подарил залу две вещи - не считая хозяев\
    \ джема, это был лучший вокал вечера. Отлично было спето! Звук подстроили как-то\
    \ иначе - и получилось громко, чисто, никем не заглушаемо. Публике двух песен\
    \ было явно мало - на бис у нас пока не вызывают, но были записки с заявками-просьбами\
    \ спеть и сыграть ещё. Я видела, не скромничайте :)\nОт девушки Инесс приятное\
    \ осталось впечатление - голос, владение голосом, лучезарная улыбка и ни грамма\
    \ пафоса. Мало только спела и немного скомканно. Казалось, что она готова была\
    \ спеть ещё, но.. \nО потенциале её голоса говорит хотя бы то, что держа микрофон\
    \ на уровне пупка, она доносит до слушателей свое пение, именно пение - не вопль,\
    \ не стон, не хрип - а пение.\nВ конце Пера Джо довольно сильно изменил привычную\
    \ для Дока Got My Mojo Working. Народ повскакивал, танцевал и хлопал. \nСпасибо\
    \ всем - Доку, коллективу, гостям и джемующим."
