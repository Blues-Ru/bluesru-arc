      P.S. Я месяц назад влепил совершенно случайно в сидичейнджер диск Message From
      Munich вместо другого диска Кенни Баррела и Джимми Смита, который собирался.
      Поскольку нормально до этого не слушал обе пластинки, я их перепутал, ездил
      и балдел - ну какой же прекрасный джазовый гитарист Кенни Баррел, все-таки,
      ну это надо же? Прослушал пластинку раз 10, наверное. Оказалось потом, что это
      мой любимый Алекс Шульц с джазовым материалом - записано с немецкими музыкантами
      в классическом составе хаммонд-гитара-ударные + дудки иногда, диск самодельный,
      т.е. он, кажется, не был опубликован большим тиражем. Вот так.'
