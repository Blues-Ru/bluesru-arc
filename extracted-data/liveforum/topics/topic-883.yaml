  text: Люди, вы-блюзеры, вы должны меня понять, мне ща так хреново, как не было никогда.
    Я понял, что у мне не друзей, есть одни знакомые, которым глубоко наплевть на
    меня на самом деле, все подряд лезут ко мне в душу, И вообще жить бывает сложно,
    когда понимаешь что "твой единственный друг говорит, смотрит, выглядит и чувствует
    как ты, и ты делаешь то же самое, что и он", простите за ломанный перевод, но
    состояние действительно ужастное и мне не к кому обратиться, потому что если я
    кому-то говорю о своём состоянии они смотрят на меня с высоты своего самоавторитета
    и говорят, что надо делать так-то и так-то, и жить делая то-то и то-то, совершенно
    не понимая, что это истина только для них. В общем стараюсь как могу оставаться
    собой. Люди, братья и сёстры, ЧУВАКИИИИИ!!! Не дайте мне сдохнуть!!!
