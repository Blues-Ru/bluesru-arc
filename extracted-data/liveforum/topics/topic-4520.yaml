  text: на втором курсе я уже пела джаз в Центральном клубе милиции. Художественным
    руководителем тогда был Марк Соломонович Местехин, который потом долгие годы работал
    в цирке на Цветном бульваре. С джазовым оркестром пела блюз Туликова, а во втором
    отделении выкатывали на сцену рояль, и тут уж я отводила душу в цыганских романсах...
