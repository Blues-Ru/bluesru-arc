  deleted: false
  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=CASS80308171832&sql=A6hqpg4sttv6z\n\
    \nПервое: не надо читать вот это ревью на AMG - там ничего толком не написано\
    \ и много вранья; чтобы писать об этой пластинке надо знать что происходило с\
    \ ДМ в эти годы - автор не знал, видимо.\nВторое: этот альбом столо бы назвать\
    \ Albert King Meets John Mayall - настолько сильно влияние ДМ тут.\nТретье: это,\
    \ пожалуй, единственный альбом АК, где все песни написаны им и Джоном Мэйоллом.\
    \ Уже интересно.\nЧетвертое: не спрашивайте что делает ДМ на Стаксе в 71 году\
    \ - не знаю! Это отдельная тема.\n\nНачну с того, что альбом очень длинный - 48\
    \ минут (10 треков) - это похоже не ДМ тех лет, но никак на альбомы АК или Стакс\
    \ вообще. Альбом записан в Калифорнии (вторая родина ДМ) в 71 году. Звучание не\
    \ похоже ни на Стакс ни на ДМ - one of a kind, короче.\nКто играет? Из звезд только\
    \ АК, ДМ и Блю Митчелл - они сильно понравились друг другу с ДМ и записали несколько\
    \ альбомов вместе, но это другая история. \nИграют люди близкие к джазу, точнее\
    \ к соул-джазу, джаз-фанку - в эту тусовку попал ДМ в начале 70-х. Да еще какой-то\
    \ Кевин на органе и пианино (по пьяни забыли фамилию спросить что ли?) \nВсе то\
    \ не значит, что альбом звучит по-джазовому. Альбом в стиле соул-фанк (его ранней\
    \ формации). Вялый соул-фанк, может быть даже скучный. Короче, не получилось.\
    \ Вообще, у ДМ мало что получалось в одиночку. Странный тут и звук и композиции.\
    \ Какая-то странная депрессия из всего этого вылезает - mixed emotions. Может\
    \ торопились, но не знали что именно надо сделать?\nПоставлю я этой пластинке\
    \ 3 балла (это не так мало, на самом деле). \nВыводы: не надо было ДМ лезть в\
    \ Стакс - там полно хороших продюсеров и умельцев. Не надо ехать в Калифорнию\
    \ чтобы писать альбом для Стакса - там жарко и много народу! Зря они эти песни\
    \ писали вместе - могли бы и каверов добавить - все лучше бы было. ДМ еще не созрел\
    \ как музыкант и продюсер - переезд в другую страну - это всегда нервы и т.д.\
    \ Не знаю почему так слабо!\nЛучшие песни? Нет их тут! Лучшие места? Все соло\
    \ Блю Митчелла и ритм-секция.\n\nЧтобы не раскисать послушайте альбомы Blue Mitchell\
    \ \"Blues' Blues\" и John Mayall \"Jazz Blues Fusion\" - там все хорошо почти\
    \ с этим составом.\n\nАльбом, в общем, нужен (он лучше чем какой-нибудь Electric\
    \ Mud Мадди Уотерса). Интересен он будет любителям блюза и джаз-фанка, рокерам\
    \ тут нечего ловить, для фанкеров он слишком вял и неизобретателен.\n\nДМ - опять\
    \ тройка, но это не надолго!"
