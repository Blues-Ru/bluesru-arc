  text: 'Группа с легкомысленным названием «The Booze Band» собралась не для того,
    чтобы просто побузить. Это реальная новая супергруппа, в составе которой лучший
    блюзовый вокалист России, лучший губной гармошечник Англии и один из лучших блюзовых
    гитаристов мира. И играть они будут материал своих знаменитых предыдущих групп.


    Участие лидера нашей «Лиги Блюза» Николая Арутюнова в таком проекте выглядит вполне
    естественно. Арутюнов – самый интегрированный в мировой блюз российский исполнитель.
    Он пел с такими звездами блюза, как Джонни Копленд, Би Би Кинг, Крис Фарлоу, Миллер
    Андерсон, «Roomful of Blues», «Colosseum». Именно после выступления Арутюнова
    с легендарной английской группой «Colosseum» ее гитарист Клем Клемпсон пригласил
    Николая присоединиться к новому проекту.


    Клем Клемпсон – очень значимая фигура в британском блюзе. Его группа «Bakerloo»
    занимала в нем далеко не последнее место в конце 60-х. В 1970 году Клемпсон получил
    приглашение в «Colosseum» - одну из лучших групп Англии всех времен. После распада
    «Colosseum» (они собрались снова в 1994 году) Клемпсон заменил знаменитого Питера
    Фрэмптона в не менее знаменитой группе «Humble Pie». Именно участие в «Colosseum»
    и «Humble Pie», а также многолетнее сотрудничество со знаменитым Джеком Брюсом
    создало Клему Клемпсону поистине культовую репутацию.


    Будучи очень востребованным гитаристом, он выступал или записывался с огромным
    количеством выдающихся музыкантов, причем не только блюзовых. Среди них Роджер
    Чепмен, Кози Пауэлл, Дейвид Байрон, Танита Тикарам, Deep Purple, Роджер Долтри
    (The Who), Боб Дилан, Ванесса Мэй, Ронни Вуд (Роллинг Стоунз), Пол Маккартни,
    Крис де Бург, Майк Рутерфорд, Роджер Уотерс (Пинк Флойд). Одна из его последних
    работ – прошлогодний диск Би Би Кинга.


    Кроме того, Клемпсон, как разносторонний музыкант, давно стал «своим» на рынке
    саундтреков. Он записывал музыку к таким фильмам, как «Гангстер №1», «Ноттинг
    Хилл», «Блюз мертвого пса», «Секс в большом городе» и многим другим, среди которых
    даже «Бивис и Батхед» и «Симпсоны».


    Гармошечник Марк Фелтэм в Англии - буквально нарасхват. В качестве приглашенного
    музыканта он ездил в туры или записывался едва ли не со всеми – от Энгельберта
    Хампердинка до «Oasis». В его списке – «Texas», «The The», KLF, Дзуккеро, Том
    Джонс, Рой Харпер, Пол Янг, Робби Уиллиамс, Джо Кокер, Джордж Майкл, Роджер Долтри
    (The Who) и т.д. и т.п.


    Однако, Марк Фелтэм, в первую очередь, конечно, блюзовый музыкант, и его постоянное
    место работы – знаменитая группа «Nine Below Zero». Кроме того, Фелтэм может гордиться
    многолетним сотрудничеством с великим ирландским блюзменом Рори Гэллэхером.


    Еще одна звезда в «The Booze Band» - клавишник Ронни Лихи. Это, после Николая
    Арутюнова, самый «русский» участник группы. Дело в том, что Лихи неоднократно
    бывал в Росси в составе «Nazareth», с которыми сотрудничал долгие годы. А начинал
    он свою карьеру в 60-е, в группе «Stone the Crows», одной из самых любопытных
    в британском блюзе тех лет. Затем в его карьере были Элвин Ли, Донован, Джон Андерсон,
    Джек Брюс и другие.


    Бас-гитарист «The Booze Band» Брайан Бител – также выходец из «Nine Below Zero».
    В последнее время играл в «Blow Monkeys».


    И, наконец, самый молодой участник группы – барабанщик Джоэл Клемпсон, сын Клема,
    пока еще не имеет столь насыщенной биографии, как остальные, но успел уже поиграть
    с S Club 7 и Элтоном Джоном.


    В составе:

    гитара: CLEM CLEMPSON (Colosseum, Humble Pie, Jack Bruce Band, Bakerloo)

    вокал: НИКОЛАЙ АРУТЮНОВ (Лига Блюза, Четверг Арутюнова, Funky Soul)

    клавиши: RONNIE LEAHY (Stone The Crows, Nazareth, Jack Bruce Band)

    губная гармошка: MARK FELTHAM (Nine Below Zero, Rory Gallagher Band)

    бас-гитара: BRIAN BEETHELL (Nine Below Zero, Blow Monkeys)

    барабаны: JOEL CLEMPSON'
