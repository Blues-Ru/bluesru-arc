  text: 'Пишут на блюз-ру не часто, а напрасно!.. Наши "форумисты" бывают на блюзовых
    концертах по всему миру... и было бы весьма интересно обмениваться впечатления
    и мыслями по их поводу... И вот, можно сказать, для почина...


    Sergey Kobzar написал нам о концерте легендарного Джонни Уинтера, и его письмо
    мы здесь приводим полностью, как есть... Хотя лично я готов слушать любые байки
    БиБиКинга сколько угодно, и не все молодые так уж безнадежны... Но действительно,
    радостно, что архиветеран Уинтер по-прежнему в строю, бодр и "задорен"!


    Итак:


    __________________________________________


    ЕСТЬ ЕЩЕ ПОРОХ!




    Удивительно и непонятно, все же от куда берутся силы и как Johnny Winter преображается
    на сцене, как только начинают звучать первые аккорды его знаменитых песен.


    B этом месяце Johnny Winter дал порядка 20 концертов, да и еще каких концертов,
    только остается посочувствовать молодому поколению рокеров, выглядящим жалко на
    фоне 70-ти летней легенды.


    12 песен, без остановки, с напором и мощью, достойной лучших его времен 70-х и
    80-х, и ни одной медленой композиции, ни долгоиграющих и никчемных рассуждений
    с стиле B.B. King о "смысле жизни" и рассказки-басни о семье и внуках.


    1 час и 45 минут рок-блюза и энергия заполняющей полностью зал на 1000 человек,
    в таких же татуировках как и сам рокер, кто помнит его выступление на Woodstock
    в 1969 году.

    Конечно же, не те уже пальцы и голос, возраст и здоровье, НО, ни одной ошибки
    в гитарных соло, ни одной забытой строки в песенной лирике!!!


    Достойно восхищения и уважения таланту и куражу с которым Johnny Winter отрабатывает
    свою программу.

    Hи сучка, ни занозочки, но СТОЛЬКО задоринки. Особенно в композициях когда рокер
    играет на своей легендарной гитаре Gibson Firebird свой знаменитый слайд.


    Участники его группы настолько сплоченно и грамотно поддерживают своего лидера,
    что остается только позавидовать подобранному профессиональному составу: Scott
    Spray (bass), Paul Nelson (guitar), Tommy Curiale (drums).


    При всей мощи и жесткости в блюз-роке и его композициях, Johnny Winter очаровательный,
    добрый и мягкий человек, при личном общении я не почувствовал ни капельки снобства
    или высокомерия, очень приятный и милый, даже сказать, нежный и хрупкий, с необычно
    светлым цветом кожи - альбинос и с совершенно разноцветными глазами, но по искоркам
    в которых чувствуется, что сцена и музыка продлевает Johnny Winter жизнь и дает
    новые силы для насыщенного турне по Америке.


    San Juan Capistrano, California, USA.


    July 26, 2013'
