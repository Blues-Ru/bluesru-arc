  text: 'Недавно попал в руки DVD Дж. Ли Хукера "Live in Montreal" (вроде на джаз-фесте,
    года примерно 80-го). Там есть вещь под названием "Look At What You Did To My
    Life". Никто из ДОБРЫХ ЛЮДЕЙ не знает, с какой она пластинки (или хотя бы - какого
    года)?

    Оч. интересно это вот почему: песня (главный риф по кр. мере) - один в один с
    песней Заппы "Willie The Pimp" (а вокалистом там был Бифхарт). Запповское творение
    - с альбома "Hot Rats" 70-го года. Это не совсем стандартный блюз.. в смысле,
    что этот риф, хоть и простой, но оч. запоминающийся. Вот и интересно, кто, такссть,
    был "первым". В принципе, эту вещь (или обе) могу вывесить для сравнения.'
