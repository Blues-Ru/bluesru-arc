    text: 'Неожиданно круто получилось ;) Только когда я с ними разговорился, выяснилось,
      что Alberto Marsico на органе и Gio Rossi на ударных - те два чувака, которые
      с Алексом Шульцем записали неизданную пластинку Message from Munich с музыкой
      в формате органного трио. Я эту пластинку последние недели переслушивал несколько
      раз, тащился, а тут они сами к нам, ха-ха! ;)


      Тут все похвалили ураганного Brian-а, а хочу еще отметить их джазово-фанковую
      программу. В Летчике в начале концерта Энрико играл на гитаре, а у Pietro были
      клавиши. Вот от чего я встал на уши!! Класс, супер!'
