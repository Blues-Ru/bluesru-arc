            - id: 27711
              parent_id: 27706
              date: 2006-06-16 20:37
              poster: Федор Романенко (fedor)
              email: fedor@blues.ru
              subject: Нижний Новгород
              deleted: false
              text: Мы там делали блюзовые концерты два раза. В академическом театре
                драмы им. Горького! Вообще, город огромный - 3й по размеру в России,
                очень красиво сливается Ока и Волга - проезжаешь через километровый
                мост через Оку. Еще есть длиннющая пешеходная улица типа Арбата с
                фонариками и Кремль. Один блюзовый клуб JAM-Престиж, где бывали after-party.
                Одна блюзовая группа Анатолия Морозова JAM. Концерты в театре проходили
                очень смешно - занавес, вступительная 5-минутная речь конферансье
                о блюзе, о приезжих музыкантах. Перерыв, три звонка и пр. В гримерке
                через репродуктор передается звук со сцены. На Киде Андерсене и Бьорне
                Видаре Солли после концерта висели девченки, плакали, говорили, что
                домой без них не пойдут. Академично, но с определенным шармом!
            - id: 27712
              parent_id: 27706
              date: 2006-06-16 20:40
              poster: Федор Романенко (fedor)
              email: fedor@blues.ru
              subject: Ярославль
              deleted: false
              text: Мы туда ездили один раз с Кидом Андерсеном. Город красивый - Кремль,
                виды на речку и пр. В клубе "Партизан", который переоборудован из
                старой совковой столовой, выступают всякие рок-звезды - наши и иногда
                западные. Место не очень светское, там бывают гопники, все по-простому,
                ограждение перед сценой и пр. Сильных духом типа Кида это не испугало,
                там прикольно ;)
            - id: 27713
              parent_id: 27706
              date: 2006-06-16 20:49
              poster: Федор Романенко (fedor)
              email: fedor@blues.ru
              subject: Рязань
              deleted: false
              text: 'В Рязани мы сделали уже штук 5 концертов. Там год назад открылся
                большой клуб Кэрролл. Он считается респектабельным и hi-class - типа
                Форте. Хозяева - очень веселые и вменяемые ребята. Все время смеются
                ;) На концертах много костюмированной публики, которая сидит за столами
                в ресторане, (включая, например, губернатора с его жлобами, который
                пришел на Холмстрома), поэтому поначалу выглядит не очень демократично
                и весело. Но потом почти всегда удается раскачать публику музыкой
                и антиреспектабельным поведением приезжей группы поддержки ;) Дяди
                с тетями скидывают пиджаки и идут плясать на танцпол. Публика к блюзу
                менее привычна, чем во Владимире, но процесс явно идет, так что будет
                лучше и лучше.


                Особый колорит создает придурок-конферансье (извините за выражение,
                он не виноват, работа такая ;), который перед концертом расспрашивает
                какие-то факты про музыкантов, а потом несет что-то такое!!!, отпуская
                комментарии между песнями и пр. Выглядит очень комично ;)


                Центральная часть Рязани - гигантский широкий проспект, не короче
                Ленинского в Москве. Выглядит очень цивилизованно, нет ощущения, что
                приехал в провинцию. Похоже на маленькую Москву.'
