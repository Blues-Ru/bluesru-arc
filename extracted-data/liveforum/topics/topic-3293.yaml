            - id: 27709
              parent_id: 27706
              date: 2006-06-16 20:31
              poster: Федор Романенко (fedor)
              email: fedor@blues.ru
              subject: Про блюзовый Владимир
              deleted: false
              text: 'Расскажу по порядку:


                1) С некоторыми оговорками - там есть одна группа (при том - хорошая!)
                Blackmailers Blues Band, один клуб, один хороший гитарный комбик,
                один блюзовый барабанщик и пр. Но этого достаточно ;) Вру, недавно
                появилась еще крутая группа Ded Morozzza.


                2) Все гастроли, которые организовывало blues.ru, кроме первого случая,
                обязательно проходили также и во Владимире. Их организует со мной
                Алексей "Макарка" Макаров. Обычно это - последний день - воскресенье,
                концерты самые веселые по разным причинам. Я лично расслабляюсь под
                конец гастролей обычно, оставляю машину в гостинице и слушаю блюз,
                выпив пива или виски! Такси дешевое и всегда под рукой.


                3) Оказывается, что средний посетитель этих владимирских концертов
                слушал больше отличного европейского и американского блюза, чем большинство
                людей в московских блюзовых клубах. Просто потому, что они ничего
                не пропускают. Аудитория там уже на блюзе воспитанная и к нему привычная.
                Пожалуй, лучшая в России, imho.


                4) Концерты всегда очень веселые - 200-300 человек с танцами, куча
                красивых девчонок и пр. Перед сценой огромный танцпол, все оттягиваются
                от души.


                5) В основном концерты бывают в боулинг-клубе Z-Club. Там есть проблемы
                со звуком - жуткая реверберация от каменных стен, а также звукорежи
                с кривыми руками. Но несмотря на это, все в результате бывает очень
                весело. Летом на крыше универмага "Валентина", где находится Z-Club,
                открывается огромная открытая площадка "ОЗОН", где делаются большие
                концерты и фестивали. Кид Андерсен будет выступать именно там.'
