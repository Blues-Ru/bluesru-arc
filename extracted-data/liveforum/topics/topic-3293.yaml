  text: 'Был вчера в "Доме у дороги" на концерте итало-американских музыкантов

    и сказать,что удивлен и обрадован - этого мало. Был полнейший кайф.

    С итальянским блюзом не знаком, да и Brian Templeton не слышал до этого. Но то
    что было (особенно второе отделение) - вне всяких похвал. В первом отделение выступал
    Alderto Marsico со своими музыкантами. Хорошая музыка, но сначала слегка вялая...только
    немного погодя музыканты заиграли как надо. Это была чисто джазовая музыка, характерная
    для таких мест как "Le Club"....с хорошим саксофоном и клавишами. А дальше было
    чудо, на сцену вышли Brian Templeton и Enrico Сrivellaro. То как играют и поют
    эти музыканты надо видеть и слышать. Brian - очень классный харпист с хорошим
    голосом и артистизмом. Enrico тоже "давал жару" на  своей гитаре.

    Это уже был настоящий блюз. Море энергетики и драйва.

    Очень советую всем сходить на их концерт.

    Сегодня они играют в "Китайском летчике".'
