  text: 'Следующая радиостанция передает ту блюзовую музыку, которая до сих пор пользуется
    большой популярностью среди чернокожих Американцев, особенно в южных штатах (правда
    молодежь не очень...).  Эта музыка еще малоизвестна в России.  Американские негры
    сейчас называют эту ее "блюзом."  Послушаете на здоровье! :


    http://www.southernsoulradio.com/#'
