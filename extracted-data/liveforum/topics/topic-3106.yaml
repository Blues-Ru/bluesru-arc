    subject: Что же такое все-таки Southern Soul?
    deleted: false
    text: "Друзья, вы подняли интересную тему)\nвот еще одна интернет радиостанция\
      \ http://www.live365.com/stations/bluescritic\nесть также замечательный сайт\
      \ www.bluescritic.com Там четко делят современный блюз и southern soul. или\
      \ предлагаю посмотреть список артистов на сайте www.eckorecords.com\nМне понятно\
      \ далеко не все. Вот есть \"блюзмен\" Lee Shot Williams, я видел в продаже в\
      \ Москве его cd \"Nibble Man\". Если прослушать заглавную \"I'm a Nibble man\"\
      \ (на сайте allmusic.com) , то становится ясно что это не блюз, хотя параллельно\
      \ на диске прописаны и очень \"заблюзованные\", как мне кажется, песни. Тоже\
      \ самое на альбоме Bobby Rush'a \"Night Fishing\" 2005 года, но этот вообще\
      \ придумал термин \"folk funk\".\n2 Dmitri Kazantsev: а что вы имеете в виду\
      \ под термином \"южный поп-соул\" ? поп-соул - это, наверно, Babyface, правда\
      \ \"не южный\". Я к тому, что сам переслушав большое количество \"городского\"\
      \ соул и сравнивая его с южным (типа упомянутых Lee Shot Williams, Bobby Rush\
      \ или, скажем, Kenne Wayne, Nathaniel Kimble, Sir Charles Jones, Sheba Potts-Wright)заметеил\
      \ главные отличия: фразировка при пении, разнящаеся аранжировки и общая стилистика.\
      \ Скажем у всех этих southern soul певцов абсолютно блюзовая подача в пении,\
      \ там у них нет общепринятой соул-мелизматики с длинными нотами и опеваниями,\
      \ они поют относительно короткими фразам. \nНЕТ ГРУПП ПОЮЩИХ SOUTHERN SOUL -\
      \ только сольные исполнители. !!! Может кто нибудь объяснит? Я так понимаю,\
      \ что городской соул с его классическими квартетами основывался на особенностях\
      \ пения doo-wop,ну и госпел наверно,а Southern soul взял за основу блюз. Так\
      \ он (southern soul)и звучит как ритм-энд-блюз.\nEcть еще понятие \"Party Blues\"\
      \ которое приравнивают временами к Southern soul \n\n\nwww.funky-soul.narod.ru"
