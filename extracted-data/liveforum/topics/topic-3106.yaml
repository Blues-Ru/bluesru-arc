          subject: южний поп-соул?
          deleted: false
          text: "Все не так все просто, по-моему.  Обычный \"поп-соул\" на Юге сейчас\
            \ мало отличается от попсы на севере, в США в целом, и на мировой эстраде.\
            \  Это Hip Hop, New Jack, Dancehall, и т.д.   Музыка этой радиостанции\
            \ сейчас зовут блюзом в негретянском обществе.  И понятно, почему.  В\
            \ отличии от современного поп-соула эта музыка насыщена глубоким блюзовым\
            \ чувством.  И это взрослые песни о настоящей жизни.  Танцуют и веселятся\
            \ в южных Juke Joints под эту музыку, как в прошлом под Muddy Waters и\
            \ Elmore James.  Здесь продолжается великая традиция блюзового пения,\
            \ которая пропадает в более традиционных областях блюза.   \n\nЯ слышу\
            \ больше здесь, что мне дорогое в блюзе, чем в дисках Gary Moore, Smokin'\
            \ Joe Kubek, Duke Robillard, и т.д. \n\nMuddy"
