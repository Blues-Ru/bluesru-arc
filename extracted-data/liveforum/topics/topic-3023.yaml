        subject: А зачем кого-то загонять в какие-то таксономические единицы?
        deleted: false
        text: "Мы давно уже определили, что \"русский блюз\" к блюзу как жанру имеет\
          \ отношение примерно такое же, как Русское Бистро к Макдональдсу.\n1. Совершенно\
          \ иная поэзия, основанная на русской стихотворной традиции по смыслу и КСПшных\
          \ дольниках по метрике.\n2. Наложенная сверху, не имеющая отношения к блюзу,\
          \ легковесная мелодическая линия, слегка по гармонии касающаяся блюза, но\
          \ по русской традиции загнанная в мелодический либо гармонический минор\
          \ с вытекающими оттуда разлюли-попсовыми интонациями. \n3. Ну про ритм-секцию\
          \ вообще умолчу ))\n\nПусть Майк Науменко будет сам по себе, он хорош как\
          \ музыкант и поэт вне всяких классификаций, хотя лично я к его поклонникам\
          \ не отношусь никаким боком."
