    text: 'Кстати о Майкле Джексоне: на http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDCASS80311120407350279&sql=Byyf8zfs8eh3k
      говорится что Stephen Vaughan принимал участие как фотограф в создании Michael
      Jackson - Thriller [Bonus Tracks] (2001).

      Он также гитарист, бассист и перкусионист.

      Такой ещё моментик, в 1981 году, СРВ звался Stevie Vaughan (без Ray: см. альбом
      In the Begginning). Кстати, оба сотрудничали с Joe Cocker: Stevie как гитарист,
      Steve как фотограф.

      P.S. На http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDCASS70311241135232922&sql=Anq2m96bo3ep1
      в кредитах Jesus Christ Superstar упамянается некий James Brown играющий на
      трубе. Кажись, ещё один тёзка-однофамилец?'
