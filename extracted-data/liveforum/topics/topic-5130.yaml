  text: 'Когда, после долгого соседства с медведЯми, выходишь потом к людям...

    Связная речь подводит слегка...

    Но не подводит гитара и блюз...

    На губной гармонике какой-то западный медведь, по всему судя...

    За гитарой же наш, северный известный медведь...


    Сибирское одиночество, видимо, учит блюзу неплохо...

    Главное, чтоб блюз - НЕ учил одиночеству, друзья...


    Итак Russian Delta Back Porch Blues...

    Блюз Террасы Заднего Двора в Русской Дельте...


    http://www.youtube.com/watch?v=Ytkh4yoKZPU'
