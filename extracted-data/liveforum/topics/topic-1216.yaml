    subject: Про это же
    deleted: false
    text: "Знаменитый блюзовый певец Бадди Гай (Buddy Guy) решил привлечь к записи\
      \ нового альбома «Blues Singer» пару своих не менее знаменитых друзей. На диске,\
      \ релиз которого состоится 3 июня, можно будет услышать Би Би Кинга и Эрика\
      \ Клэптона.\n\nКлэптон принял участие в записи композиции «Lucy Mae Blues» и\
      \ вместе с Кингом исполнил гитарные партии в классической песне «Crawlin' Kingsnake».\
      \ Последнюю можно послушать на сайте Бадди Гая.\n\nСреди других песен, которые\
      \ войдут в альбом - «Black Cat Blues», «Sally Mae», «I Live the Life I Love»\
      \ и «Hard Times Killing Floor». Вместе с Бадди в записи альбома принимали участие\
      \ ударник Джим Келтнер (Jim Keltner), басист Тони Гарнье (Tony Garnier) и гитарист\
      \ Джимбо Матус (Jimbo Mathus). Продюсером «Blues Singer» выступил Деннис Херринг\
      \ (Dennis Herring). Запись проходила на личной студии Гая Sweet Tea Studios\
      \ в штате Миссури. Студия, кстати, носит название альбома исполнителя 2001 года\
      \ - «Sweet Tea». Этот альбом дебютировал на 1 месте чарта лучших блюзовых альбомов\
      \ Биллборда и был продан в общей сложности тиражом около 129 тысяч экземпляров.\n\
      \nОбычно активно гастролирующий Бадди Гай в настоящее время решил сделать перерыв,\
      \ но уже 10 июня состоится его очередное выступление в городке Харрисбург.\n\
      \nMuse \n\n© 2003 Jazz-Квадрат"
