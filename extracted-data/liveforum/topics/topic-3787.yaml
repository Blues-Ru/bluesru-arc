    text: 'C этим шоу Э.Клаптон приезжал в Россию, в первый и (пока) единственный
      раз, в 2001г.

      Думаю, что многие участники этого форума были на тех концертах. Не то что б
      восторг, но это ж было В ПЕРВЫЙ РАЗ (по крайней мере, для меня) увидеть Э.К.,
      Натана Иста, Стива Гатта и других! Только вот не было у нас покойного ныне Билли
      Престона (RIP). Насколько я помню треклист российских выступлений несколько
      отличается от того что на диске. Приятный концерт, IMHO.

      Очень жаль что в прошлом году обломился концерт в Москве Э.К. с Робертом Крэйем
      на разогреве.

      Кстати, может кто в курсе чем закончилась эта бодяга с отменой концерта на Кр.Площади?
      Ведь далеко не всем возвратили деньги за купленные билеты (как известно, возвратили
      деньги только за самые дешевые билеты).

      Да и кто-то за отмену концерта, по идее, должон неустойку заплатить.

      Либо принимающая сторона (по слухам, это дела Владимира Кисилёва (экс-Земляне,
      ныне чиновник в Кремлёвсом Дворце Съездов)) организававшая концерт на Красной
      Площади, но предоставившей Васильевский Спуск (который, вроде бы, юридически
      является (частью) Красной Площади).

      Либо команда Э.К. которая позволила себя обмануть подписав бумаги согласно которым
      место проведения концерта мог быть и Вас.Спуск

      Кто знает чем закончился этот RedSquareGate? иль всё в песок ушло?'
