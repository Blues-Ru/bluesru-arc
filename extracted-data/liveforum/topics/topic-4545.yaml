      text: 'Вот текст Партера:


        "Кертис Робинсон играет на гитаре так, как будто его жизнь зависит от нее!
        Несомненно, что его творческая жизнь неразрывно связана с этим инструментом,
        ведь он начал играть, когда еще учился в начальной школе. Сегодня житель Чикаго
        Кертис Робинсон перебирает струны гитары настолько мастерски и неудержимо
        вдохновенно, что невозможно не заметить, как далеко он ушел от музыкальных
        азов в сторону свободного самовыражения.

        Гитарист Кертис Робинсон дает джаз-концерты в самых популярных джаз-клубах
        Чикаго, включая "Andy''s Live" и "Pop''s for Champagne", выступает с известными
        музыкантами разных направлений, такими как Рамси Льюис, Кенни Баррелл, "Emotions",
        Ирен Рид и другими, участвует в джазовом фестивале "Очо Риос" (2000 г.) и
        в записи альбома в честь Веса Монтгомери - одного из его самых любимых образцов
        для подражания. Недавний заграничный тур Робинсона в Азию прошел с большим
        успехом. Международная музыкальная сцена дала новую оценку профессиональной
        деятельности и талантов Кертиса".



        А вот то, что ты скоммуниздил. И гонорар тут не при чём.


        "В Москве состоится выступление чикагского джазового гитариста Кертиса Робинсона.
        Два концерта пройдут 4 и 5 марта в столичном клубе "Союз композиторов".


        Робинсон начал играть на гитаре еще в начальной школе. Его творческая жизнь
        неразрывно связана с инструментом. Первые уроки он получил в восемь лет, но
        после освоения азов с учителем ему пришлось долгое время оттачивать дальнейшие
        навыки самостоятельно, говорится в официальном пресс-релизе.


        На сегодня Робинсон дает джаз-концерты в самых популярных клубах Чикаго, включая
        Andy''s Live и Pop''s for Champagne. Также он выступает с известными музыкантами
        разных направлений. В числе его партнеров по сцене бывали икона американской
        джазовой музыки пианист Рамси Льюис, музыкант, прозванный "джазовой гитарой
        пятидесятых и шестидесятых" Кенни Баррелл, женский соул-коллектив The Emotions,
        блюзовая вокалистка Айрин Рейд и другие.


        В 2000 году Робинсон выступал на джазовом фестивале Очо Риос на Ямайке и участвовал
        в записи альбома в честь легендарного гитариста - "патриарха джазовой гитары"
        Уэса Монтгомери - одного из его самых любимых музыкальных образцов для подражания.


        Существует мнение, что сегодня музыкант серьезно удалился от музыкальных азов
        в сторону свободного самовыражения. Тем не менее недавно Робинсон с успехом
        отыграл тур в Азии.


        Московской публике, идя на концерт Робинсона, стоит подготовиться к живому
        общению: большинство репрезентантов "Союза композиторов", привозимых из Штатов,
        широко практикуют вовлечение зрителей непосредственно в процесс исполнения.
        По обыкновению, компанию заезжей звезде составит джаз-бэнд одного из виднейших
        российских джазовых саксофонистов Олега Киреева." (NEWSru.com)



        Впрочем, давай, умничай дальше. Я больше в этой дискуссии участвовать не собираюсь.
        Будут ещё анонсы на NEWSru - следи внимательно, чтобы было что коммуниздить.'
