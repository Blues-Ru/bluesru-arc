  text: 'Во-первый, "спасибо" тому, кто скоммуниздил мой анонс, написанный для NEWSru
    и сослался при этом на Партер, хотя текст говорит сам за себя. Я всё понимаю,
    но не хорошо, товарищи. Вы взяли анонс не с Партера, а именно отсюда

    http://www.newsru.com/cinema/01mar2011/robinson.html


    Во-вторых, и собственно ради этого я сюда зашла, хочется сказать, что концерт
    CR был одним из лучших, слышанных в СК c осени. По качеству сравнимый разве что
    с Фрэнком Лэйси.


    Так что очень хотелось бы пожелать тем, кто сегодня не был в "Союзе композиторов",
    завтра до туда всё-таки дойти. Робинсон просто красавчик.


    Никаких лишних ужимок, движений, но каждая нота пропущена через себя. Приёмы игры
    аккордами в стиле Монтгомери (да-да, это я вычитала в интернете, но затем наблюдала
    на концерте). Не знаю насколько похоже. Сходите - оцените.


    Надо сказать и публика в этот раз подобралась совершенно иного рода, явно слушающая
    и понимающая. И бэнд Киреева играл как-то заметно иначе, чем с заморскими певицами.
    Робинсона же было просто не остановить. Когда мы уходили, он снова вылез на сцену
    и что-то показывал на гитаре подошедшим к сцене меломанам.


    Кстати, я едва не пропустила этот концерт, прочитав в официальном анонсе, что
    Робинсон "на пути к славе". Не тот возраст, конечно, чтобы говорить о каком-то
    пути, но музыкант явно недооценённый. И ещё его "чикагский блюз" не имеет, слава
    Богу, ничего общего с нашим, простите. В общем, очень советую. Всё-таки не часто
    у нас можно послушать хорошего музыканта. Робинсон как раз такой случай. Не упустите!


    пс: в субботу он играет поздно вечером. кто купит диск - пусть не жадничает, а
    делится:)'
