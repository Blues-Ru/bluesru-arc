  text: "Позвольте высказаться напрямую. Со всей откровенностью. Без этих, знаете,\
    \ экивоков. Так вот, в зоопарке в субботу получилась клевая акция. Огромное спасибо\
    \ и музыкантам, и звукоинженерам, и зоопарковским ребятам. Начали готовиться с\
    \ утра. Юра рисовал плакаты (\"леопард, пынящий на Амур\" и другие), я печатал\
    \ на А4 и склеивал простыни Vive Le Leopard d'Amour... Потом повезли комбики и\
    \ ударные из ДАСа, стали ставиться. И сразу же показались отличия (в лучшую сторону)\
    \ от первой блюзоолоджи - звукачи Миша Андреев и Тимофей Земнухов выставили нормальные\
    \ порталы, все грамотно подзвучили (влоть до развешивания \"прищепок\" на все\
    \ компоненты ударной) и добились вкусного и здорового саунда. Входящим давали\
    \ открытки с изображениями хищников семейства кошачьих и кассету группы ЧХ (которая\
    \ при этом не играла, Де Блюсспинерз были). Спасибо группе: Братецкому, Гелюте,\
    \ Половинкину и Кузнецову, спасибо джемующим: Блейки, Сереже Виноградову, Грей\
    \ Вульфу, А. Цыганкову, Мише Владимирову, Юре Каверкину и Володе Фролову (который\
    \ не только зам. директора Московского Зоопарка, но и бас-гитарист с 35-летним\
    \ стажем). Спасибо слушателям - таких апплодисментов и такого кайфа в зале давно\
    \ не упомню. Отдельное слово благодарности - танцующим девушкам. Это было красиво!\n\
    \      В общем, все прошло весело. И это правильно. Природу не надо защищать с\
    \ постным или мрачным выражением лица. Ей и так нелегко."
