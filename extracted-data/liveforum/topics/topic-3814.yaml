        subject: Программы
        deleted: false
        text: "Mожно попробывать сделать это в программе Virtual Dub (программа эта\
          \ абсолютно бесплатная, НО при этом очень мощная и при этом простая).\n\
          Последовательность действий следующая- \n1. Импортируем туда файл (файл\
          \ должен быть обязательно .avi, но сжат может быть абсолютно любым кодеком).\n\
          2. В меню \"Video\" выбираем пункт \"Direct Stream Copy\"\n3. В меню \"\
          Audio\" открываем закладку \"Audio\" открываем закладку \"Interleaving...\"\
          . В открывшемся окне находим пункт \"Delay audio track by\" - и в этой строчке\
          \ вводим в миллисекундах время задержки аудиотрека относительно видео- подбирать\
          \ это придётся вручную, \"на глаз\", \"методом тыка\" и т. д. :-)))))\n\
          4. Из меню File выбираем пункт \"Save as AVI...\"- выбираем путь куда сохранять\
          \ файл.\n\nСкачать программу эту можно здеся: http://virtualdub.sourceforge.net/"
