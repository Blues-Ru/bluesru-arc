  deleted: false
  text: 'Вчера, 17 декабря, в Калифорнии умер Дон ван Влит (Don van Vliet; изначально
    - Donald Glen Vliet), известный как Captain Beefheart (Кэптэн Бифхарт, "Капитан
    Бычье сердце"). Причиной смерти указываются осложнения от обширного склероза (которым
    он болел последние лет 20).

    Капитан буквально месяц не дотянул до своего 70-летия (род. 15 января 1941 г.).'
