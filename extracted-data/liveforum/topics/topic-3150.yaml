  text: "В Екатеринбурге начинается джазовый марафон. С 26 по 28 марта во Дворце молодежи\
    \ (пр. Ленина, 1) пройдут гастроли Мировых звезд джаза. Так, 26 марта Нат Кинг-Коул\
    \ продемонстрирует мастерство вокального джаза в программе «Мировые звезды Гарлемского\
    \ джаза». \n\nГарлемский джаз – общее наименование ряда стилевых направлений негритянского\
    \ джаза 20-х и 30-х годов прошлого века, возникновение которых связано с музыкальной\
    \ жизнью нью-йоркского Гарлема. Здесь получила развитие самобытная манера исполнения\
    \ блюза, сформировалась своя школа фортепианного джаза, а также сложилась особая\
    \ разновидность камерного и оркестрового свинга. \n\nНапомним, что екатеринбуржцы\
    \ уже знакомы с этим направлением. В октябре прошлого года музыкой Гарлема с горожанами\
    \ делились трубач Melvin Vines и барабанщик Аркадий Овруцкий. 27 марта уроженец\
    \ Кубы, ведущий перкуссионист Санкт-Петербурга, пропагандист латиноамериканской\
    \ музыки Йоэль Гонсалез представит программу «Латина-джаз». \n\nЗавершит «джазовую\
    \ лихорадку» в рамках Hennessy Tour выступление знаменитого саксофониста, в разное\
    \ время игравшего для Бориса Ельцина, Владимира Путина, Билла Клинтона и в самом\
    \ престижном джазовом клубе Blue Note в Нью-Йорке Игоря Бутмана и его джаз-бенда.\
    \ Музыканты исполнят как самые известные и любимые джазовые композиции, так и\
    \ новые произведения. Билеты на концерты можно приобрести по цене от 300 до 1500\
    \ рублей."
