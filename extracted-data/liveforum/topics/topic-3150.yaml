    text: "Гарлемский джаз/ Harlem jazz - Общее наименование ряда стилевых направлений\
      \ негритянслого джаза 20-х и 30-х гг., возникновение которых связано с музыкальной\
      \ жизнью нью-йоркского Гарлема. Здесь получила развитие самобытная манера исполнения\
      \ блюза (гарлемский блюз), сформировалась своя школа фортепианного джаза (гарлемский\
      \ страйд-стиль), а также сложилась особая разновидность камерного и оркестрового\
      \ свинга (гарлемский джамп). В 20-е гг. в Гарлеме достиг своего расцвета негритянский\
      \ водевиль. К этому же времени относится начало плодотворной концертной и композиторской\
      \ деятельности Дюка Эллингтона, выступавшего со своим оркестром во многих гарлемских\
      \ клубах и создавшего здесь целый ряд оригинальных стилевых концепций (джангл-стиль,\
      \ концертный стиль, лирический \"стиль настроения\"). Под влиянием традиций\
      \ гарлемского джаза в 40-е гг. развился стиль бибоп (см. боп).\n\nГарлемский\
      \ джаз не вымышлен, не выведен искусственно: это сама жизнь, это песни о том,\
      \ что происходит вокруг. В Европе такое просто невозможно: ей остается лишь\
      \ копировать и пытаться воспроизвести дух гарлемского джаза. Зато она сильна\
      \ в его симфоническом, оркестровом исполнении. Такое сочетание двух культур,\
      \ конечно, не открытие: в 80-х подобные концерты были очень популярны в Америке.\
      \ Но в России, в Москве такие эксперименты до сих пор не проводились.http://www.nestor.minsk.by/jz/news/2003/10/3100602.html\n\
