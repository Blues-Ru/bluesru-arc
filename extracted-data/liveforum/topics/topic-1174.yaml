  deleted: false
  text: "Раз уж мы заговорили про хождение на концерты, я бы всем порекомендовал сходить\
    \ завтра в Крымские Каникулы. Там будет большой сурьезно-подготовленный двойной\
    \ концерт Мишуриса с новой группой и приехавшего Регтайма, который тут бывает\
    \ раз в полгода. Если вы не слышали Мишуриса в новом составе, опять же, очень\
    \ рекомендую хоть раз послушать, а дальше делать для себя выводы. Это совершенно\
    \ другая по качеству группа. \n\nБояться идти в Крымские Каникулы не надо, там\
    \ очень большой зал с танцплощадкой и столами, а также новый дорогой аппарат.\
    \ Кажется, что можно распечатать флаер с первой страницы и получить скидку при\
    \ входе, хотя эта информация требует уточнения.\n\nОткладывать посещения Регтайма,\
    \ к примеру, только на фестиваль, при наличии желания, я бы не стал, ибо на фестивале\
    \ у всех будут короткие выступления. Тусовка людей с блюз.ру завтра ожидается."
