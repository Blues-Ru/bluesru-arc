  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=MISS70308221724&sql=Anl5s8qntbtb4


    Turning point во всех отношениях. Поворот и переворот. Джон уже почти в мерике.
    Это не просто акустический концерт (анплаггд по современному), это гиг без барабанов.
    Это всего лишь квартет: Джон, Стив Томпсон остался на басу, Джон Марк на акустической
    гитаре и Джонни Алмонд на саксофонах и флейте. Этот альбом я услышал в 14 лет
    и тогда мне это казлось чем-то очень волшебным.


    Так в чем же волшебство этого альбома? Длинные акустические номера (все написал
    Джон и Стив) с приджазованными/прифанкованными ритмами и классными психоделическими
    импровизациями. Также надо отметить, что Джон начинает писать "социальную лирику"
    - это странно для блюза, но вполне закономерно для тех лет.


    Тут всего семь песен на 48 минут; иногда они кажутся затянутыми, но это лишь задумка
    Джона погрузить слушателей в атмосферу негромких звуков и ритмов. Все вещи хорошие
    и в принципе блюзовые, просто подача очень необычная и новая для того времени.


    Сложно тут что-то выделить, но мне нравятся So Hard To Share, California и классика
    Джона Room To Move. Оценка 4 балла - мне все же не хватает перкуссии в этой музыке;
    столько грувовых по природе вещей, а басист играет в одиночку.


    Хороший поворот событий - Джон вышел из кризиса и начал экспериментировать.'
