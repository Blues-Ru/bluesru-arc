                      бы просто понравилось, но никаких восторгов бы не было, никаких
                      сильных эмоций. Концерт был бы хорошим, но про него быстро бы
                      забыли. И это за 20 штук. Это - бессмысленно абсолютно. Вместо
                      этого мы сделали несколько потрясающих клубных концертов, приехали
                      лучшие европейские музыканты, у которых понтов гораздо меньше,
                      чем музыкального таланта.

                      Очень трудно на морозе, на стадионе, где со звуком всегда сложнее,
                      расшевелить предубежденного слушателя. Люди, которые в блюзе
                      - начинающие и обычно не ходят в клубы, получили много удовольствия
                      на стадионе. Если меломаны, которые знают, что к чему, не идут
                      на клубные концерты, где всегда круче, это их проблема.

