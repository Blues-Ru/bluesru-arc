    subject: Вчера в Новосибирске был фест
    deleted: false
    text: "Мероприятие для города новое, во всяком случае аналогов не помню. Проводилось\
      \ сие на Сибирской Ярмарке, огромный зал где обычно проводятся выставки, как\
      \ было заявлено на 2000 мест.\n Народу было относительно немного, человек 300,\
      \ как мне кажется. Билет стоил 400, что, как я понимаю, дало некоторый процент\
      \ отсева в условиях Западной Сибири.:-)) И, опять-таки на мой умудрённый опытом\
      \ взгляд, способствовало созданию блюзовой атмосферы: значителеный процент публики\
      \ составляли именно любители блюза в самом разном его виде. Посему, не приходится\
      \ удивляться, что с появлением на сцене первых музыкантов, народ побросал своё\
      \ пиво и сгруппировался у сцены. Что самое приятное - в основной массе были\
      \ люди молодые, нас, старых хренов и перечниц, можно было по пальцам пересчитать.\
      \ И народ пришёл именно на блюз. Достаточно было услышать, как подхватывались\
      \ слова известных блюзовых вещей. А то мне уже казалось , что в городе Новосибирске\
      \ я один их знаю :-))\n Музыканты порадовали: было что послушать и особенно\
      \ посмотреть. А вот звук был противный. Громкость такая, что разобрать даже\
      \ слова порой было затруднительно. Я уже не говорю о том, что динамика и звукоизвлечение\
      \ были убиты на корню. Наверное, стоило бы чуток убавить звук, видя, что народу\
      \ мало и все находятся рядом со сценой. Народ это не смутило и колбасились вовсю\
      \ :-)) А для моих старческих ушей было некомфортно, особенно сравнивая со звуком\
      \ в нашей филармонии (хотя и там, естественно, он далеко не идеальный).\n Всё\
      \ равно мероприятие меня порадовало: увидеть живьём блюзовых товарищей такого\
      \ калибра у нас в городе я уже и не надеялся. Организаторы, конечно же молодцы.\
      \ А звук... Ну когда-нибудь научатся же у нас его делать правильно...:-))"
