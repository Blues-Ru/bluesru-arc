  text: "пластинку Snowy White \"Open for business\"(Belafon). И вот нашел. Диск был\
    \ представлен на Амазоне, лейбл и все остальные реквизиты совпадали.\nПоскольку\
    \ данная пластинка давно в делите, с запросом о ее покупке пришлось обращаться\
    \ к какому-то частному продавцу (Предложения таких товарищей также представлены\
    \ на Амазоне). Заказал, оплатил и через три месяца получил неизвестно что. Никаких\
    \ данных что это Belafon и вообще сылок на какой нибудь лейбл ни обложка ни сам\
    \ CD не содержат. В месте с тем полиграфия и запись хорошая.\nЧто за фигня мне\
    \ пришла? Задал этот вопрос непосредственно продавцу, но ответа пока не получил.\
    \ Может кто нибудь из Вас встречался с такими делами?\nНо это еще не все косяки,\
    \ которые свалились на мою голову. В месте с выше указанной пластинкой заказал\
    \ CD группы \"ONE\". Не знаю что это за группа и какой год альбома. При фрагментарной\
    \ прослушке мне показалось что это хард причем на блюзовой основе и все довольно\
    \ таки вкусно. Манера исполнения и голос вокалиста мне показался похожим на вокалиста\
    \ из Металики. \nВ итоге получил какой то сборник попсы с наименованием ONE. При\
    \ первых аккордах чуть не вывернуло. Вот такие дела.\nУчитывая Мой негативный\
    \ опыт, Друзья будьте осторожны при приобретении дисков таким образом."
