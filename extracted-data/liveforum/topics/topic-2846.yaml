    subject: Группа очень хорошая
    deleted: false
    text: У меня есть пара песенок. Сложно сказать, что это - там много всего, местами
      можно и блюз-роком назвать. Но то, что эту группу основали George Harmonica
      Smith и Rod Piazza делает её фиговость невозможной :), Гармоника Смит даже когда
      лажает - очень кайфово получается. И стоит ли говорить, что это человек у которого
      учились и с которым переиграли почти все современные американские монстры (Kim
      Wilson, James Harman, William Clarke...).
