    subject: Bacon Fat и блюз-рок?
    deleted: false
    text: Насколько я знаю, так называлась в 70-х группа, в которой в молодости играл
      Род Пияцца. Если я не ошибаюсь, изначально ее организовал  George "Harmonica"
      Smith. Оба - очень крутые калифорнийские музыканты, правда, блюз-року, наверное,
      это отношения не имеет. История с группой есть в тексте одной из песен Пьяццы.
  - id: 23781
