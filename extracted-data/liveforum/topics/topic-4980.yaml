    В том году (1974) и там же (Montreaux jazz festival), с участием тех же: Bill
    Wyman, Pinetop Perkins, Terry Taylor, Dallas Taylor - Buddy Guy и Junior Wells
    записали концертный альбом Drinkin TNT & Smokin Dynamite, бывший весьма популярным
    (боюсь, что главным образом благодаря участию одно из Rolling Stones)... Видеоверсия
    издана на DVD, в ней несколько тех же песен, что и в аудио альбоме, но половина
    времени отдана выступлению Muddy Waters.'
