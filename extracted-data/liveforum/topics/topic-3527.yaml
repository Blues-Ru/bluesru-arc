      deleted: false
      text: "Страна должна знать своих героев! Кто такие \"подогнанные парнишки\"\
        \ из абзаца:\n\"Двоих наших парнишек специально подогнали поиграть со звездой.\
        \ Один взял гитару у музыканта в ковбойской шляпе. Другой достал губную гармошку.\"\
        \ Музыкант в ковбойской шляпе - это, очевидно, Омар?\nЧитаем дальше. \"Эдди\
        \ кивнул в мою сторону и, делая вид, что снимает инструмент, снова предложил\
        \ сыграть с коллективом. Я великодушно отказался.\"\" - кто был в Би Би, такое\
        \ было? Действительно Кемпбелл перепутал гитариста с журналистом? Или у мастера\
        \ пера взыграло ретивое?\n\nМне вот это больше всего понравилось: \n«А жаль,\
        \ — подумал я. — Если бы Эдди еще раз мне предложил сыграть, я бы, пожалуй,\
        \ не отказался. И выдал какой-нибудь русский «блюз» вроде «Гоп-стоп» или «Простым\
        \ и нежным взором»."
