      subject: TTL и переезд
      deleted: false
      text: 'Переезд, судя по всему, состоится завтра. IP адреса пока неизвестны,
        поэтому сейчас сообщить не смогу. В обычной ситуации освежение DNS происходит
        в течении суток (12 часов, к примеру), но хитрый Дима Красивов уже сегодня
        закрутил TTL на один час. Так что опросы DNS завтра будут происходить в 24
        раза чаще...

        А всем остальным на момент переезда советую закрыть браузер и спокойно подумать
        о том, как все-таки дорог для вас сайт блюз.ру. Иной раз в суете об этом и
        не подумаешь, и только в такие моменты...............'
