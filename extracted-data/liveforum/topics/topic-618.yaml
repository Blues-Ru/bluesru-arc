  subject: Переезд Blues.ru
  deleted: false
  text: В ближайшие несколько дней возможно произойдет физический переезд сервера
    blues.ru в другое место - в RINET. В связи с этим будут изменяться адреса в DNS,
    которые имеют обыкновение обновляться в кешах в течении суток. Поэтому blues.ru,
    а также почта @blues.ru могут без предупреждения вывалиться на сутки... Морально
    готовьтесь!
