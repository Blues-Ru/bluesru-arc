    text: "Субботним вечером решила превозмочь лень\nи отправилась в гости к Докторам\
      \ в Оракул. \nРебята, этот концерт, если не обращать внимание на некоторые огрехи\
      \ в ритм-секции (что уж, живой коцерт!) и очень даже обращать своё внимание\
      \ на происходившее: вчера был лучший концерт Blues Doctors за всё то короткое\
      \ время как мы познакомились. \nВсё, что составило шоу было великолепно: не\
      \ притянутые за уши шутки, гармонично выстроенная программа концерта, Мишин\
      \ выход в зал с \"соло на барабанах\" (е! пять балов!), полная юмора и абсолютно\
      \ отвязанное соло клавишника на Казу (простите, так эта штука, кажись называется)и\
      \ даже две порвавшиеся струны на гитаре Володи стали ещё одним прекрасным поводом\
      \ заявить: у Докторов всё в порядке!!!\nСпасибо, ребята!!! Так держать!!! :))))"
