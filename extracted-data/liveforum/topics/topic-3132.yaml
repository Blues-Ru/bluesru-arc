          subject: '"The Legacy of the Blues" (Poljazz)'
          deleted: false
          text: 'Щас достал и слушаю ту серию "The Legacy of the Blues" (Poljazz):
            Mighty Joe Young (vol. 4), Juke Boy Bonner (vol. 5), Big Joe Williams
            (vol. 6), Memphis Slim (vol. 7). Купил в 1994г., тогда они появились у
            нас в городе в большом количестве, но про эти ИМЕННО 4 диска (с 4-ого
            по 7-ой) я уже слыхал ранее, в 92-93 гг.: в нашем рок-клубе были на бобинах
            записи этих дисков.

            Есть у меня ещё и польский двойник Muddy Waters Blues Band - The Warsaw
            Session (Poljazz).

            Есть ещё пластинка Поля Робсона, там одна песня с Сонни Терри и Брауни
            МакГи.

            Ну вот и всё что имею и знаю.

            Очень интересно узнать что было ещё.'
