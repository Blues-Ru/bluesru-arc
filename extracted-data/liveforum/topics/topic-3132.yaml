  text: 'Что было блюзового на пластинках в те времена? Я имею в виду не фирменные
    диски (США, Англия), а то что выпускалось или продавалось у нас: Мелодия, Амига
    (ГДР), Супрафон (ЧССР), Югославия, Венгрия...

    Я знаю только:

    - Amiga Blues Friends (ГДР) - очень мне нравился. Гитара, слайд, гармошка... Почти
    что только блюзовые стандарты. Правда английский с немецким акцентом :-)

    - Lubos Andrst, Peter Lipa Blues Band - Blues Office (ЧССР) - много клавиш. ненравилось
    мне...

    Ну и серия "Мастера Блюза": вышли №1 Muddy Waters, №2 Howli'' Wolf и... №4 Сборник
    (Хукер, Джими Рид...)

    Было ли что ещё?'
