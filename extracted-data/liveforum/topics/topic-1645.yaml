  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDCASS70312062120222714&sql=A8p841vf2zzxa


    Этот альбом можно бы было назвать The Robert Johnson Songbook Part II; 16 песен
    уже были записаны два года назад, а еще 13 находятся на этом диске 2000-го года.
    Это уже четверты альбом на Artisan/Snapper и все идет очень хорошо у Питера и
    Ко. Пластинка снова записана на Peter Green with Nigel Watson - Splinter Group.
    Тут много классных гостей, которые добавляют кайфа и настроения. Вместе со Сплинтерами
    играют: Бадди Гай, Ханибой Эдуардс, Доктор Джон!!!, Отис Раш!!!, Джо Луи Уокер
    и Хьюберт Самлин! Отличная тусовка собралась, не правда ли?


    На альбоме всего 13 песен и длится он всего 42 минуты, именно поэтому слушается
    на одном дыхании. Исполнение еще интереснее, чем на первом сборнике Роберта. Оценка
    4 балла, но этот альбом сильнее первой части 1998-го года!'
