  text: "Московская группа «ПЛИМУТ»\n\nИсполняющая актуальный мейнстрим-рок с калифорнийским\
    \ акцентом в духе The Killers, Black Keys и U2. \n\n\n«ПЛИМУТ» - СУПЕРГРУППА,\
    \ состоящая из экс-музыкантов Земфиры, Чичериной, Дмитрия Четвергова, группы \"\
    Конец Фильма\" и др. На концертах прозвучат композиции из дебютного альбома, работа\
    \ над которыми ведется в Лос-Анджелесе и московских студиях. \n\nГруппа «ПЛИМУТ»\
    \ – новый музыкальный проект. Творческий тандем образовался осенью 2008 года схожие\
    \ музыкальные вкусы (инди-, брит-рок) обрастали идеями сотрудничества между автором\
    \ и исполнителем песен, взявшего псевдоним ПЛИМУТ и эксцентричного, не сдающего\
    \ свои боевые позиции Рината Ахмадиева (экс-басс Земфира, Чичерина, Monkey Bones).\
    \ \n\nДебютный клип, на лирическую композицию “Привет” был снят в Лос-Анжелесе,\
    \ в лучших традициях Голливуда, презентация клипа проходила 16 ноября в «ЧАЙНА\
    \ АУН КАФЕ». «Брутальные романтики способные “починить”, разбитые девичьи сердца»\
    \ так окрестили участников группы журналисты &#61514;))).\n\nУчастники группы\
    \ «ПЛИМУТ» знают цену успеху и славе - профессиональные музыканты, талантливые\
    \ исполнители с огромным творческим багажом. У команды очень серьёзные и амбициозные\
    \ планы, вплоть до тотальной “ПЛИМУТИЗАЦИИ” всей страны. - \"Плимутизация в нашем\
    \ понимании - это американское качество, британский стиль, плюс российская ментальность,\
    \ - говорит лидер группы ТОВАРИЩ ПЛИМУТ.  Мы поем по-русски, потому что ориентированы\
    \ на российскую аудиторию. И уверены, что в нашей стране достаточно людей, воспитанных\
    \ на качественной западной музыке - это и есть наши слушатели\"."
