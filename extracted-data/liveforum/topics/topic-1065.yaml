        text: 'Мики Харт оторвался от творчества Деадов очень сильно и заспециализировался
          на этнической (и около-этнической) музыке (владеет целым лэйблом). Он мне
          более симпатичен, а вот Деадов я так и не смог разобрать - может не на те
          альбомы натыкался :(

          У Харта есть один потрясный альбом, заслуженно получивший Грэмми, Planet
          Drum - если тебе не чужды перкуссии (ударные и пр.) и этнический звукоряд
          (не фолк, а именно этнический), то настоятельно рекомендую. Есть у него
          и другие интересные альбомы, Music Of Upper & Lower Egypt весьма неплох.
          Последний альбом Superlingua тоже вроде нашумел, но мне он не пошел (кстати
          могу сменять или продать - всего 510 за двойник - легионская цена).


          ЗЫ - побьют нас с тобой за такие оффтопики :)'
