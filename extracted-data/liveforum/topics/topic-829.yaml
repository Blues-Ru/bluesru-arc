  text: "Приближаются концерты. Как в прошлом году на Бюска мы заранее сделаем небольшие\
    \ списки своих людей, чтобы отдать эти списки в Форте и БиБиКинг и попросить зарезервировать\
    \ места. Речь именно о резервировании мест. Входные билеты в обоих клубах будут\
    \ стоить 350 рублей. Если вы хотите, чтобы я вписал вас в список, напишите мне\
    \ письмо. При этом стоит пометить, что именно эти люди хотят сидеть вместе. Т.е.\
    \ список должен состоять из групп людей. Причем, желательно и по-возможности указать,\
    \ как именно их зовут, а не просто Вася + 3, иначе возникнет полная путаница.\
    \ \nНа концерт в Форте в субботу часть мест резервирует норвежское посольство,\
    \ которое 17го числа отмечает день своей независимости. Места будут, но если все\
    \ отложат посещение концерта до субботы, может произойти конфуз. \nВ БиБиКинге,\
    \ возможно, концерт будет чуть-чуть короче. Обращаю внимание, что он при этом\
    \ реально и конкретно начнется там в половину девятого, а не в девять. Это связано\
    \ с 11-ти часовым ограничением.\nПосле Форте и БиБиКинга мы уезжаем во Владимир,\
    \ там будет зал на 200 человек с танцами и веселухой ;)"
