  text: 'Вот купил на виниле (абсолютно новый) альбом Сона. Что я Вам скажу, я чуть
    не кончил от счастья! Это великолепно! Все отлично - звук, музыка, пение, игра!
    Я слушал это же на компакте - просто плохо, а тут будто он рядом сидит!

    Всем советую именно этот альбом, это 65 год, очень длинная и интересная пластинка,
    спродюсированная Джоном Хаммондом.

    http://www.allmusic.com/cg/amg.dll?p=amg&sql=Arlavqj7bojda


    Кстати, мне достался Роберт Джонсон на виниле. Ремастер от Сони на СиДи просто
    ужас! Антоха и Анисимов свидетели! Пока не услышите архаику на виниле, Вам будет
    казаться, что и запись плохая и музыка не так катит.


    И еще, Антоха (спасибо ему) притащил два диска из The Alan Lomax Collection -
    Deep River Of Song - Mississippi: The Blues Lineage и Mississippi: Saints & Sinners.
    Мне вообще не понравилось. Какая-то самодеятельность, ей Богу!


    Очень хочу услышать мнение Бирюкова по этим трем темам.'
