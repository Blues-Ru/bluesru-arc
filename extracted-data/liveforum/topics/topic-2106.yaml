          text: "вот что стыдно было за качество звука - это правда. Так сказать,\
            \ приняли короля, как сумели. Полгода ведь готовились, мать их так. видимо,\
            \ так увлеклись рекламой и сверхшикарном отелем (ББК сказал, что это едва\
            \ ли не самый раскошный в его жизни), что про звук как-то в попыхах забыли.\
            \ Отсюда и комбики, найденные в последний момент, и железо через пять\
            \ минут после объявленного начала концерта. \nНо я это называю \"или так,\
            \ или никак\". \nДа, ГКДС - отстой по всем параметрам. Но билеты по 500\
            \ баксов можно продавать только в этот зал. и без того скучающего банкира,\
            \ о котором говорил ББК, концерт бы не случился. Да, я бы с радостью посмотрел\
            \ этот концерт в толпе \"волосатых придурков\". но жизнь диктует все по\
            \ другому. Чтобы провести такой концерт, нужно продавать билеты по таким\
            \ ценам. Чтобы продавать билеты по таким ценам - нужна такая публика.\
            \ Чтобы привлечь такую публику - нужен Дворец съездов. \"Россия\" уже\
            \ не прохиляет. я бы рад ошибиться, но пока действует только такая схема,\
            \ г.Денисов. Вы знаете пример успешной работы другой схемы - ткните пальцем.\
            \ И ВИП-места - это тоже необходимость. противная. но без нее - никак.\
            \ \nи еще я знаю, что нормальные клубные концерты Примича имели такие\
            \ финансовые последствия, что мне реально стыдно. в том числе и за свою\
            \ передачу, и за этот сайт, которые при всех потугах так и не смогли собрать\
            \ публику на вполне достойного блюзмена. То же и с Джимми Ди Лейном было.\
            \ А если бы Ди Лейна привезти в Кремль, начать рекламу за полгода, продать\
            \ билеты по 300 баксов - все было бы благополучно. только тут другие обстоятельства\
            \ начинают играть роль. Люди, способные на такие финансовые вложения,\
            \ которых требует кремлевский концерт, лучше знают Шер. И знают, что с\
            \ Шер меньше риска не собрать зал. \nВремена такие. Я помню, как на всех\
            \ концертах ББК в далеком и неуютном спорткомплексе \"Динамо\" были аншлаги\
            \ - билетов в кассах не было! Вереница людей шла под жутким ветром от\
            \ метро церез пустырь к залу - вот это было да! а всего два года спустя\
            \ в МДМ зад был на 2/5 пустой. вот так вот. А на 10 Years After в МДМ\
            \ вообще был провал по посещаемости. А казалось бы, для нас это - легенда.\n\
            Вот теория и практика.\nА по сути.\nЯ не только слушал, не смотря на отвратительный\
            \ звук, БиБиКинга. Я видел его сияющую рожу - и понимал, что мы - те,\
            \ кто в зале - ему понравились и он доволен концертом. Вот так вот. Ему-то\
