            text: "Да. Я не стал писать столь серьезно, простебался чуток.\nЧто и\
              \ говорить. Как сказал САМ - \"у меня болят колени, и я уже заработал\
              \ право СИДЕТЬ на этой сцене\"\nСмысл то у фразы - куда как больший.\
              \ Да, заработал он уже это право. Конечно. Если бы он просто вышел и\
              \ трепался уже мы были бы счастливы. Да, даже если бы и молчал. Вышел\
              \ бы посидеть на стульчике. \nА вот организаторы. Вообще - идея организовать\
              \ блюзовый концерт в этом зале, просиженым многочисленными партсъездами.\
              \  :-Ж\nУ меня есть немецкий учебник по акустике где подробно разбирается\
              \ КДС как пример полного дебилизма архитекторов \"концертного зала\"\
              .\nНо человеческий фактор - еще хуже. Интерлюдия с комбом и ПОЛНОЕ отсутствие\
              \ звукорежиссерской работы или хотя бы намека на нее.\nПопросили бы\
              \ комбик у того-же Петровича. Да неуж то не дал? Просто на порядок было\
              \ бы лучше\n Ужасающий (по виду - Шур 58 очень протертый) микрофон на\
              \ вокал (запирающийся при громких звуках и пропадающий при тихих и с\
              \ явной перегрузкой), почти неслышная РЕЧЬ на сцене.\nСправа от меня\
              \ сидел чувак хлопающий во вторую долю (продвинутый блин) но - катастрофически\
              \ мимо. Слева - долбили как и большинство - в первую и во все 4. В зале\
              \ мерцали мобильники во всей своей 64 голосой полифонии в разных местах,\
              \ разные мелодии. Я для прикола хотел поймать - должна бы хоть раз совпасть\
              \ тональность? Ни разу, хотя новая мелодия возникала примерно раз в\
              \ 8 - 12 секунд.\nПервые ряды. Это - ВАЩЕ проблема. Первый раз я это\
              \ понял когда попал на концерт Карлоса Сантаны в Москве. Туда билеты\
              \ не продавали. Их и не было совсем. Свезли автобусами комсомольских\
              \ активистов и учащихся военных училищ. Я нашел еще чаловек 14 таких\
              \ же придурков волосатых и балдел по полной. КАК он выступал? \nНа Маккартни\
              \ говорят самые дешевые билеты перед самым концертом пустили на стоячие\
              \ места ПАРЕД партером.\nЭто был бы выход. Тогда бы не пришлось ему\
              \ обращатся к красивой девушке и не слышать ответа. И не пришлось бы\
              \ видеть ЭТИ рожи. за 15 тысяч.\nСтыдно было. За организаторов, за публику,\
              \ за себя. Что то у нас неправильно. что то не сходится. Такое ХОРОШЕЕ\
              \ дело. И нет того КАЙФА который бы наверное случился, если бы сидели\
              \ бы мы в каком-нибудь маленьком уютном клубике, рядом со сценой, и\
              \ были бы там на входе громилы, которые бы пропускали не по билету,\
              \ не по пачке денег, а скажем, надо бы было спеть песню из БиБиКинга\
              \ :-)"
