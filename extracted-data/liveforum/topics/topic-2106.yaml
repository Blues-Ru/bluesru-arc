          text: "Я всецело присоединяюсь к теплым словам, сказанным в адрес Би Би\
            \ Кинга. Несмотря на возраст он потрясающе поет и играет на гитаре, не\
            \ говоря про все остальное...\nДля завершения полноты картины хочется\
            \ побольше сказать про звук, ибо не все было сказано. Организаторам из\
            \ Мельницы за этот концерт нужно оторвать крылья (те, которые между ног).\
            \ Имело место фантастическое пренебрежение к техническим вопросам на концерте\
            \ такого уровня, я просто не мог в это поверить. Началось с того, что\
            \ комбик Би Би Кинга (а ведь звук его гитары - одна из главных составляющих)\
            \ был неисправен с начала концерта. На громких нотах звук просаживался\
            \ по мощности (интересно, они его включили хоть раз перед концертом?).\
            \ Это было очевидно с начала первой песни и доставляло неудобства Би Би\
            \ Кингу, который почти из-за этого не играл на гитаре. \nПочесались только\
            \ через три песни, какой-то парень вальяжно принес другой, поставил рядом.\
            \ Настраивал звук на нем посередине песни второй гитарист наугад. После\
            \ этого знаменитая полукустика Люсиль зазвучала как очень тихая перефуженная\
            \ металлерская гитара. Но всем на это было наплевать, а Би Би Кинг встать\
            \ со стула не может. Похоже, что новый комб был вообще транзисторным.\
            \ Далее группа играет две песни, гитару не слышно, а звукорежиссер за\
            \ пультом, у которого есть, в частности, ручка громкости гитары, не понял,\
            \ что что-то не так, и даже не попробовал вывести гитару. В замечательном\
            \ 10-минутном перерыве между песнями с кучей шуток Би Би Кинг попросил\
            \ выключить фонящий комбик, который давил на уши. В начале песни включить\
            \ его забыли, Би Би Кингу пришлось долго упрашивать это сделать второго\
            \ гитариста. Так до конца выступления звук его гитаре и не настроили.\
            \ Такое ощущение, что обслуживающий персонал забыл про тех, кто на сцене...\
            \ Общее сведение было отвратным - по ушам била кликающая бочка, но самой\
            \ бочки с басом слышно не было. В клубах такого бардака, мне кажется,\
            \ не бывает, обязательно кто-то подойдет и поправит, повернет ручку и\
            \ пр.\nНа закуску история - начало концерта в 19:00, но на улице длинная\
            \ очередь, думаю, прямо сейчас не начнут. Захожу в 19:05 через служебную\
            \ калитку без очереди, там на 5 минут задерживают в отстойнике. Сзади\
            \ Макаревич, а перед ним чувак с кофром, в котором лежит железо от барабанов.\
            \ Когда мы проходим, чувака с железом встречает другой чувак с баджем\
            \ с надписью \"Би Би Кинг\", берет у него кофр с тарелками и чешет бегом\
            \ в сторону КДС. Интересно, кому, кроме барабанщика Би Би Кинга в Кремле\
            \ могло понадобиться железо через 5 минут после официального начала концерта???\n\
            Все это немного помешало получить удовольствие от звука Би Би Кинга, которое\
            \ он весьма способен доставить, если концерт организуют вменяемые люди,\
            \ так что не совсем плевать. Тем не менее, от самого Би Би Кинга, того,\
            \ что удалось расслышать, я получил очень хорошие впечатления. Надеюсь,\
            \ что он сам не очень расстроился. Как сказал Евдокимов, за 55 лет карьеры\
            \ Би Би Кинг, вероятно, побывал в передрягах и посерьезнее."
