  text: 'Во время последней своей поездки приобрел два CD премилой девушки ЕВы Кэссади.
    Альбомы очень милые и плюсом их явилось то что девушка очень здорово перерабатывает
    народные и прочие песни и делает их  очень интересными и приятными на слух. Ну
    и само собой голос: голос потрясающий.

    Кстати, любителям Blind boys of Alabama, у Евы два совршено прекрасных кавера
    на песни People get ready and Wade in the water, рекомендую послушать :) :)'
