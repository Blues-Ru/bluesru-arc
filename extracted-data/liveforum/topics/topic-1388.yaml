  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=CASS80305280454&sql=Asq5m962o3ep8


    Не пугайтесь названия, это всего навсего The Natural Blues. Название соответствует
    содержанию альбома (то есть это не как у какого-нибудь Гленна Хьюза и Гари Мура).
    Кудера нет на этом альбоме, но Эл Купер на клавишал (а это уже много), есть Джесс
    Эд Дэвис на гитаре - очень хороший музыкант.


    Эта пластинка лучшая из блюзовых альбомов Тажа. Дело не только в отличном подборе
    композиций и прекрасной игре всех музыкантов, дело еще и в атмосфере, которую
    они смогли создать. Тут и акустические кантри-блюзы, и соул-блюзы (здесь в 68
    году уже заложено все, что потом будут делать Братья Блюз) и даже блюз-баллада
    (а вот этого мы пока не ждали от молодого, жесткого и бескомпромиссного Тажа).


    Все девять песен альбома прекрасны по-своему. Ритмически они очень серьезны и
    не похожи на примитивную игру большинства блюзменов тех лет. Таж и Ко. создали
    какие-то волшебные ритмы и ходы, которые полностью вписываются в каноны блюза,
    но отличаются от него в деталях. То есть блюз продолжался развиваться (не путать
    с деградированием и переходом в другие жанры) даже в 68 году. Тажу помогала его
    любовь к островной музыке, его ум и образованность, его вокальные данные, умение
    играть и обалденное чувство юмора. Прислушайтесь к словам его песен - это классика
    хороших блюзовых текстов. "Gonna move up to the country, gonna paint my mailbox
    blue...", "Good morning Miss Brown, momma how do you do? - I''m din'' fine and
    looking good, man, how about you?".


    Хочется выделить выдающиеся треки даже в таком сильном альбоме. Это Miss Brown,
    Corrina; Going Up To The Country; She Caught The Katy. Обратите внимание на акустическую
    гитару Тажа и филигранную игру Купера; я уже не говорю о великом вокале Махала.


    Оценка 5 по всем статьям. Второй альбом оказался лучшим у Тажа, но это не значит,
    что другие его работы слабые, - они другие, Таж развивался и уходил от блюза,
    он экспериментировал. Его любовь к корневой музыке слышна даже на его припопсованных
    альбомах 80-х и 90-х до его возвращения в блюз.


    Natural blues... Naturally!'
