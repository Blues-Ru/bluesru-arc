  deleted: false
  text: 'Я прочитал уже море отзывов об Эфесе, и периодически порывался что-то ответить,
    с чем-то поспорить, с чем-то согласиться и восторженно поддержать.


    Лично для меня это был праздник. Большой, красивый, шумный, яркий. Дело не только
    в прекрасной музыке, исполненной "на все 100", не только в неплохом пиве, дело
    еще и в настроении, в улыбках людей, в едином душевном порыве, извините за столь
    банальное и избитое клише.


    Когда я видел слова о "пьяной толпе тусовщиков", непонятно вообще зачем пришедших
    в Лужники, мне начинало казаться, что люди, написавшие такое были в каком-то другом
    месте. Извечная тема о "неких личностях", приходящих на концерты выпить и поорать,
    вместо того, чтобы благоговейно, аля "Владимир Ильич слушает Бетховена", посидеть,
    подперев кулаком голову и нахмурив лоб. Утрирую, конечно. Но темы такие поднимались.
    О нет, я не пропагандирую свинского нажирательства на концертах, да и сам я не
    ангел и весьма люблю выпить, но оценивать таким вот образом пришедших порадоваться
    и, подчеркиваю, ПОВЕСЕЛИТЬСЯ (да-да, вообще-то блюз и рокнролл всегда казались
    мне достаточно жизнерадостной, энергичной музыкой, дабы рождать в человеческом
    мозгу некие радостные эмоции, выливающиеся в простое отбивание ритма ладонью об
    коленку, а то и в сложные танцевальные па, иногда даже с кем-нибудь вдвоем, троем,
    четвером...), по-моему, минимум, невежливо.


    Можно установить четкий дресс/фейс контрол (почему-то у кого-то также вызвали
    раздражения люди в шляпах, что мне вообще непонятно:-) и сделать так, чтобы блюзовые
    концерты посещали только избранные любители и ценители жанра. Ну и сами музыканты.
    Это же высокая культура и не замайте ее своими восторженными воплями, пивным перегаром,
    идиотскими танцами, дурацкими нарядами:-))


    Об этом много можно было бы распространяться. Я высказался и с чистой совестью
    отметаю эту тему, потому что мне на подобные вещи просто было некогда обращать
    внимания. Так же как в Питере на концерте Пола Маккартни мне было по барабану
    на то, что я 2 часа сидел почти в луже. Вот таким удивительным образом музыка
    Фрутлэнда Джэксона, Литтл Чарли, Рика Эстрина и Майти Сэма Макклэйна с оркестром
    атрофировала мои чувства и не дала сосредоточиться на "пьяных дядях Васях, орущих
    у сцены". (с)


    Джексон был великолепен, тем более, что я обожаю блюзовую архаику/акустику. Вот
    тем, кстати, кто говорит, что архаичный блюз "скучная и однообразная музыка на
    любителя" следовало бы пронаблюдать, как 1 человек с гитарой практически ввел
    в транс несколько тысяч человек, ловивших каждый звук и взрывавшихся овацией в
    конце каждой песни.


    Про Литтл Чарли очень сложно говорить, плюс ко всему многие говорят, что они отыграли
    не в лучшем виде, точнее, не дали всего, что могли бы. Вроде как турки-устроители
    дали установку на то, что расейская публика незатейлива и "грузить" ее "сложными"
    вещами не надо. Вот лучше бы я этих мнений не видел, хотя в любом случае, я не
    представляю, если ЭТО - стандарт, то что же тогда "высший пилотаж"? Отдельно хочется
    отметить прекрасное шоу Найткэтс. Такие команды не дают забыть, что сцена, пусть
    и чисто музыкальная - это всегда немного театр, а ШОУ - это нечто большее, чем
    только звукоизвлечение и банальное кривляние. Эстрин заставляет вспомнить целую
    эпоху, он как персонаж из старого фильма, или даже мультфильма - яркий, контрастный,
    весь пластичный, гуттаперчевый, состоящий то из одних очков, кока, усов, гармошки
    и улыбки, то занимающий всю сцену. Воистину, Чеширский Кот :-)))) Чарли Бэйти
    не отстает от фронтмена, хотя его гитара показалась мне достаточно лаконичной,
    но, как говорится, на вкус и цвет... Барабанщик и басист - молодца ))) кстати,
    мне очень понравилась песня спетая драммером))) (Сразу оговорюсь - под словом
    "фронтмен" я имею в виду лицо группы, а не создателя и идейного лидера/автора
    большинства композиций и я думаю, что у "Котов" фронтменом является именно харпер)


    А вот Майти Сэм меня впечатлил, к сожалению, не так сильно, как его оркестр. Mercy,
    mercy просто вынула из меня душу и вознесла куда-то к потолку Зала)))) Гитарист
    просто чума, духовые, клавиши - потрясно)) Вокал Макклэйна прекрасен, но вот его
    манера "заигрывания с публикой" показалась мне ненатуральной и неуклюжей после
    "фокусов" Эстрина. Выдумывать на ходу слова конечно здорово, но "Раша" и "Москоу"
    через каждые 5 минут начали напрягать. В любом случае - это еще один великолепный
    блюзовый ли, соул ли коллектив и вокал, и я с удовольствием послушаю Майти Сэма
    еще раз, если представится такая возможность, тем более вживую. Такие вот впечатления...'
