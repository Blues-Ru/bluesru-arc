  text: "Не знаю, почему ещё никто не написал о событии, произошедшем 26 мая 2004\
    \ года на открытом джеме в Би Би Кинге, а произошло то, чего этот клуб ещё не\
    \ видовал!\n В начале всё шло своим чередом. Выступала группа Grayhound , выходили\
    \ гитаристы (и я в том числе), харперы, басисты и барабанщики. Но потом произошло\
    \ нечто! Вышли на сцену две девушки со странными инструментами и исполнили этническую\
    \ композицию гортанного пения, что-то в духе народов севера (мне так кажется,\
    \ простите за делиНтантизм). Конечно я был потрясен их пением- каждая из них голосом\
    \ могла воспроизвести целый аккорд! Но самое интересное было ещё впереди...\n\
    \ Вдруг к ним присоединились хорошо известная всем нам Оксана Кочубей, гитарист\
    \ и басист были из группы Grayhound, клавишник и барабанщик (не знаю имён, но\
    \ играли классно). То, что они там выдали- это было просто нечто!!! Завели весь\
    \ зал авангардной импровизацией. Мне это отчасти напомнило экспериментальные работы\
    \ Фрэнка Заппы, Джона и Йоко и Диаманды Галас с Джоном Полом Джонсом. Восторгу\
    \ публики не было предела (и моему в том числе)! Те кто ушли раньше очень многое\
    \ потеряли. \n  Народ! Кто был на том джеме- откликнитесь! Подскажите имена тех\
    \ двух девушек и игравших с ними музыкантов. Мы должны знать имена своих героев!"
