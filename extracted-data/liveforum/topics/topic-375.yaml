          subject: Сколько людей, столько мнений
          deleted: false
          text: А я вот слушаю сейчас Корнеровские диски и тащусь. Нравится! А уж
            что он глыба и могучий человечище, чистая правда. Помню, как-то в Германии
            видел по телевизору его клубный концерт 60-х. Обомлел. Вот он, блюез.
          replies:
          - id: 7952
            parent_id: 7938
            date: 2002-10-04 17:59
            poster: Иван Иванов
            email: www.geocities.com/drikasblues
            subject: Из Альбиона сообщаю
            deleted: false
            text: "К сожалению блюз (чистый) является наименее популярным стилем в\
              \ Англий, но несмотря на это здесь очень много хороших, именно традиционных\
              \ артистов. Позвольте перечислить и коротко охарактеризовать:\nPapa\
              \ George - отличный певец и акустический ботлнек гитарист играет также\
              \ електрик в трио. http://www.papageorge.co.uk\nLong John Boldry - Ледбели\
              \ Англий.\nDave Peebody - отличный акустик и хорошй певец.\nLittle George\
              \ Sueref - бенд лидер, вокал и гармоника.\nAdrian Byron Burns - Афро-Американец\
              \ но живущий здесь давно. ОЧЕНЬ рекомендую - супер голос и отличный\
              \ гитарист (акустик). Но он более современный, поет блюз, соул и R&B.\
              \   www.adrianbarns.com\nUncle Bob - акустик, казу (фольго резонирующий\
              \ инструмент) и вокал - типа Роберта Джонсона. И много так называемых\
              \ Old Farts, хщроших но к сожалению некому не нужных пуристов.\nПотом\
              \ идут ел.гитаристы типа Альберта Колинза и Кингов:\nOtis Grand - Биг\
              \ банд лидер и гитарист.\nSonny Black - играет блюз-джаз (Б.Б.Кинг +\
              \ Джим Хол). Хорошй гитарист - играет также акустик свинг блюз.\nГруппы:\
              \ \nPaul Lamb and the King Snakes - Вы их видели в Москве.\nNine Below\
              \ zero - играли хорошй чикагски блюз - начали терять слушателей и позже\
              \ стали играь рокенрол - вернули 3 раза болше слушателей.\nTwo Timers\
              \ - Сара Джеймс (вокал, скрипка, перкусия) и экс Фиилгуд Гордон Рассел\
              \ (гитара, мандолина) играют скифл, шафл.\nThe Junkyard Angels - Гитарист\
              \ Джулиан пайпер - блюз, буги.\nИ ТАК ДАЛЕЕ. А потом идут сотнями, более\
              \ молодые имитаторы Хендрикса, SRV и Валтера Траута, то есть блюз-рок\
              \ с более широкой фан базой. \nЯркие представители:\nThe Hamsters -\
              \ самые популярные имитаторы Хендрикса и ZZ Top - все отлично - только\
              \ имитация!\nDanny Briant's RedEye Band - Молодой гитарист и певец (21\
              \ лет) поет один к одному как Вальтер Траут и играет тоже.\nInnes Sibun\
              \ Band - отличный блюз-роковый гитарист и певец типа Джони Винтера и\
              \ Рори Галагера.\nEddie Martin and The Texas Kings - Професиональный\
              \ Техасский блюз-рок.\nИ.Т.Д\nТо есть много професиональных исполнителей\
              \ но мало оригинальных, ищущих нового, своего. Конечно это очень трудно\
              \ как сам по себе, так и под ужасным натиском комерческой поп машины,\
              \ хотя иногда появляются талантливые экспериментаторы умело и приятно\
              \ совмещающие разные стили (блюз, джаз-фюжн, соул, R&B, хип-хоп, драм\
              \ эн бейс) и создавая что то новое - нечто идущее не только от мозга\
              \ но от сердца тоже. Проблема в том что новое почти всегда воспринимается\
              \ с огромным скепсисом, особенно в такой \"традиционной\" стране как\
              \ Англия, по этому таланты не превращаются в звезд и мало кто их замечает.\n\
              Привожу некоторых представителей:\nMatt Schofield - молодой гитарист\
              \ -24х лет- и бенд лидер(Альберт Колинз+Питер Грин+Джим Хол+Пет Матини).\n\
              Jon Amor Band - блюз-фюжн, блюз-бит-хоп. Интересные песни пишет парень.\n\
              James Taylor Band - Квартет молодого певца и гитариста - соул-блюз-фанк.\n\
              Мой старый друг Некрофил Гроболизов утверждает что все это не есть НАСТОЯЩИЙ\
              \ БЛЮЗ (которого играют и поют очень малое количество очень старих негров).\
              \ Да это так, но любя и изучая хорошее старое, нужно старатся создать\
              \ хорошее новое (иа лична так думааиу дааа) а то есть опасность превращения\
              \ в хорошую копию старого трупа. А ЭЭЭЭЭТО ВАМ НААААДАААААА?\nWith love\
              \ from UK\nIvan Ivanoff"
