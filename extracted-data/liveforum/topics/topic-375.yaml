    deleted: false
    text: 'было мало блюзовых пуристов. В основном все же блюз-рок в перемешку с брит-попом.

      Занимались блюзом: Джон Мэйалл, Алексис Корнер (но лучше бы он им не занимался),
      Эрик Клэптон, Питер Грин, Мик Тейлор, Ван Моррисон (мало, но здорово). Из основных
      вот эти ребята. Мало, короче.'
    replies:
    - id: 7930
      parent_id: 7927
      date: 2002-10-04 01:11
      poster: Andrei V. Evdokimov (evdokimov)
      email: evdokimov@blues.ru
      subject: эт-как посмотреть еще
      deleted: false
      text: "В Англии было предостаточно блюзовых пуристов. Играли архаику, старательно\
        \ подражая и очень редким тогда записям, и случавшимся тогда регулярно европейским\
        \ гастролерам из числа ветеранов. Можно уточнить имена, но их наберется с\
        \ два десятка, как минимум - тех, кто оставил записи. тех, кто не оставил,\
        \ должно быть раза втрое больше. Другое дело, что прославились не то, кто\
        \ подражал (порой очеь талантливо), а те, кто придумал из чикагского блюза\
        \ ковать блюз-рок. отсюда и видимость, что англия была только блюз-роковой.\
        \ \nНа самом деле там кипели дискуссии будь здоров - по типу, какой блюз настоящий,\
        \ а какой нет; и были традиционалисты и пуристы, а были и новаторы.\nЗЫ. Не\
        \ поклонник записей Корнера, я отношусь к нему с большим уважением. Его блюзовая\
        \ активность послужила мощным катализатором блюзовой жизни в англии. Достаточно\
        \ взглянуть на список молодых, кого он учил или кому помогал на первых шагах:\
        \ <a href=\"http://www.allmusic.com/cg/amg.dll?p=amg&sql=A9frsa9tgb238\">http://www.allmusic.com/cg/amg.dll?p=amg&sql=A9frsa9tgb238</a>"
      replies:
      - id: 7933
        parent_id: 7930
        date: 2002-10-04 08:25
        poster: Дима Казанцев (Dr. Nick)
        email: dr.nick@blues.ru
        subject: Так и есть
        deleted: false
        text: 'Поэтому я написал лишь самых известных.

          Про Корнера мы уже говорили, Андрей. Я ОЧЕНЬ уважаю его как человека и катализатора
          блюза на Альбионе (ну конечно я в курсе сколько людей он продвинул), ну
          просто не могу я его пластинки слушать. Может это мое заблуждение, но каждый
          год я возвращаюсь к его работам, а мнение пока не изменилось.'
        replies:
