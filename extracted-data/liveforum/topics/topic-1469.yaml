      deleted: false
      text: "Я живьем видел Майка 2 раза - в 85-м, когда он на какой-то овощебазе\
        \ числился вечновыпившим то ли грузчиком, то ли еще кем, а в основном обитал\
        \ и играл в той самой кочегарке, пил портвейн, если кто-то приносил и на слова\
        \ Б.Г.: \"Майк, стань звездой ритм-н-блюза!\" ласково и незлобливо посылал\
        \ его на ....\nА потом на одном из Московских концертов конца 80-х, когда\
        \ про блюз вааще никто не говорил, но народ так колбасило от его песен, потому\
        \ что типа от души и про хреновую жизнь. Видимо, вспоминая формулу: когда\
        \ хорошему человеку плохо - это блюз, все же это был блюз, в том числе и по\
        \ музыке. Что лажали и играли на кривых инструментах криво тогда никого не\
        \ волновало. \nМне кажется, русский блюз - это когда смесь частушки с блюзом,\
        \ тогда ни то, ни то. \nА так высказывания некоторых уважаемх людей в форуме\
        \ на тему - нет блюза кроме негритянско-американского... Может, просто хорошо\
        \ еще не получается по-русски блюз, вот его некоторые  и не жалуют. Будет\
        \ хорошо - будут жаловать?"
