    deleted: false
    text: "Было сложно понять о чём тут вообще речь, потому что было сложно это всё\
      \ прочесть. Ну очень много. У меня сложилось впечатление, что опять стараются\
      \ придумать определение блюза. Типа как в словаре \"блюз а, м. 1. бла-бла-бла,2.\
      \ бла-бла-бла\" Этих определений столько надавали, что будь здоров, и каждое\
      \ не подходит, ну или подходит не совсем. А почему это вы Майку отеазываете\
      \ в блюзовости? Возможно, его слушателям и можно отказать в этом, но ему, по\
      \ моему- нет. Мне кажется, что он то как раз понимал, что да как. Даже умер\
      \ он как настоящий блюзмен (Царствие ему Небесное). По моему, понятие блюзовости\
      \ приходит со временем, человек не может дать определение (его, просто нет,\
      \ наверное) но он всегда узнаёт Blue Feeling. Я не берусь утверждать, что да\
      \ Майк был блюзменом, но и... почему бы и нет? А на счёт фишки от Старого Майора\
      \ про прилагательное \"русский\" в этом что-то есть... Наверное те кто не может\
      \ чего-нибудь дельное сделать присобачивают это прилагательное к своему креативу,\
      \ учитывая гиппертрофированное чувство патриотизма, они адеятся что \"народ\
      \ поймёт, народ полюбит\", и так и получается, народ видит волшебное слово и\
      \ начинае восхищаться этим какой бы лажой это не было... \nЛично я считаю, что\
      \ блюз это американская культура (в общественном плане я космополит, а культуру,\
      \ я думаю каждая страна должна развивать свою, при этом я думаю что кто угодно\
      \ может заинтересоваться какой угодно культурой и совершенно не обязательно\
      \ что все русские обязаны быть помешаны на частушках и Чайковском, человек существо\
      \ свободное и имеет полное право заниматься чем хочет) и переносить на русскую\
      \ почву его мягко говоря, проблематично, хотя это вовсе не значит, что нельзя\
      \ петь русскоязычный блюз. С другой стороны, если кому-то удасться сделать этакого\
      \ симбиота  блюзов и русской культуры (мы её как я недавно узнал, тоже не знаем,\
      \ не знаем мы нашей культуры вообще) это может получиться нечто, но вот вопрос\
      \ будет ли это блюзом?"
