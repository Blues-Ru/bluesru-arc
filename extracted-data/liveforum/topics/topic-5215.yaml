      Tribute to Rory Gallagher - Moscow Festival 2015

      Итак, наконец решила осуществить давнюю затею. 14 июня состоится небольшой трибьют-фестиваль,
      посвящённый 20-летию со дня смерти Рори Галлахера. Приглашаем музыкальные коллективы,
      а также благодарных слушателей! Все новости будут появляться тут: https://vk.com/event89963322


      In memory of Rory and for Long Live Blues rock!


      Надеюсь, что мероприятие станет началом традиции блюзовых трибьют-фестивалей,
      которых в нашей стране проводится очень мало.'
