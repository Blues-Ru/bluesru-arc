  text: 'http://www.amazon.co.uk/exec/obidos/ASIN/B000050F4Q/qid=1070409617/sr=1-17/ref=sr_1_2_17/202-3594806-1489457


    Еще есть вот такой альбом, записанный на Грина. Грин там не везде и вообще не
    очень понятно что это за тусовка и ради чего это делалось. Эта запись (альбомом
    это нельзя назвать) живет в разных вариантах и оформлениях. Я не буду писать рецензию
    на ЭТО. ЭТО из разряда левых редких вещей, но на мой взгляд, отношения к музыке
    имеет мало. Особенно если учитывать ВАЖНОСТЬ Грина в британской музыке 60-х.'
