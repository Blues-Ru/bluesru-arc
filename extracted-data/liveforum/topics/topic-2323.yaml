      deleted: false
      text: "поподробнее, так сказать :)\n.\nконечно, все круто сыграли :) мне больше\
        \ всего понравился Митч Кашмар - ну очень авторитетный и грамотный дядька\
        \ :) здорово и интересно играл :) если у молодых Гьемса и Бергена чувствуется\
        \ прям молодой задор, куча нот, крутая техника и все такое, то у Кашмара наоборот\
        \ недетский такой мужычый подход к делу; это дело мне очень понравилось :)\
        \ \n.\nхаус бенд отличный :) ритм-секция качает по полной программе, Хакон\
        \ в тему и задорно так играет :) молодцы\n.\nзвук был более-менее :) научились\
        \ делать в зете приличное (все слышно и различимо) звучание, это радует \n\
        .\nнароду много было :) это тоже очень клево\nтак что сплошной позитив рекой\
        \ \nвот :) \n.\nеще запомнился момент, когда Митч Кашмар клеил какую-то девушку\
        \ у стойки на входе :) он ей что-то вроде \"чикаго блюз, то се, типо йа йа\"\
        \ а она смотрит на него и ничего не понимает :) зато улыбалась :) ну и он\
        \ тоже"
