    text: Вкратце - дорога в Нижний - 10 часов езды по пятисантиметровому снегу +
      метель, которая заваливала машины снегом и сдувала с дороги. Вечером - супер-концерт
      на 400-500 человек в театре. В воскресенье был самый лучший из четырех концертов
      во Владимире, фантастический драйв, настроение, реакция зала, музыкальность.
      Мне и большей части аудитории снесло крышу ;) Во Владимире супер-классная публика
      ;)
