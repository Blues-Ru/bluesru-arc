      text: "... написали про концерты :)\n.\nThe Norwegian version of the \"Blues\
        \ Harp Melt Down show\" has now returned to Norway. The show was a gigantic\
        \ success! \n\nThe band played 4 shows: 2 club gigs, one Moscow concert hall\
        \ and one academic theatre in Nizhnij Novgorod. \n\nEirik Bergene and Haakon\
        \ Hoeye also showed their faces at a breakfast-show on national television.\
        \ This show is every day viewed by up to 10 million people.\n\nThe guys completed\
        \ their trip by hosting a harmonica workshop for local harmonica-players at\
        \ BB King's blues club in Moscow. \n.\nа здесь такое ощущение, что никто и\
        \ не ходил :)"
