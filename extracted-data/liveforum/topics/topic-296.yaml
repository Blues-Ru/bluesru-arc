            также красивых женщин, которые собрались в зале (про красавиц на сцене
            - см. выше). Только вот мало танцует пипл, в 70-е было по-другому...

            Вообще говоря, легчает там. Проблемы решаются, звук стал лучше, коллектив
            сыгрывается (хотя безобразия пока хватает). В сентябре сделаем акцию в
            Зоопарке, а с октября еще много чего интересного будет. Бог даст.

            Правила участия в джеме остаются прежними - заранее пишите, расскажите,
            приходите. 4 и 18 сентября теперь Ехрат. На следующей неделе в среду -
            ББК, но там плотнее.'
