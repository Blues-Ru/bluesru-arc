                    \ отличную музыку отличные мезыканты. \nА что блюз это не кабак?\
                    \ за исключением зачаточной фолк музыки рабов, до скорой кабакизацыий\
                    \ и комерциализаций. С Роберта Джонсона до Мади и после все они\
