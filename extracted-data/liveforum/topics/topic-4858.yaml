  subject: Сегодня в Омской филармонии блюзовый концерт!
  deleted: false
  text: "(http://tvoiomsk.ru/item.asp?id=2729)\nЗнаменитый российский джазмен Даниил\
    \ Крамер даст в Омской филармонии блюзовый концерт. Вместе с маэстро на сцену\
    \ выйдет признанная королева техасского блюза, американская гитаристка и певица\
    \ Николь Фурнье. \n\n– Даниил Крамер прибывает в наш город в новом статусе. В\
    \ феврале музыканту присвоено почетное звание народного артиста России, – рассказала\
    \ корреспонденту ИА «Твой Омск» замдиректора Омской филармонии по творческой деятельности\
    \ Виктория Багринцева. – К совместному выступлению на сцене Концертного зала пианист\
    \ пригласил российское трио Blues Doctors и американскую гитаристку певицу Николь\
    \ Фурнье. \n\nФурнье называют королевой техасского блюза, а Вашингтонское блюзовое\
    \ общество объявило ее Blueswoman года (в 1996 и 1999 гг.) и отдало ей победу\
    \ в номинациях «Лучшая электрогитара» и «Лучшая блюзовая запись». \n\nВ 2010 году\
    \ Николь Фурнье впервые дала концерт с российским трио Blues doctors. Творческое\
    \ сотрудничество с екатеринбургским ансамблем оказалось успешным. В апреле этого\
    \ года артисты отправляются в гастрольное турне по России. Помимо Омска, они выступят\
    \ в Ижевске, Перми, Екатеринбурге, Тольятти, Самаре, Казани, Кирове, Сыктывкаре,\
    \ Череповце и Вологде. \n\nВыступление американской гитаристки и певицы в ансамбле\
    \ с российскими музыкантами состоится 9 апреля в Концертном зале филармонии. Начало\
    \ концерта в 19:00. \n\nhttp://www.transart.e-burg.ru/performers/fournier/\nhttp://bluesdoctors.ru/"
