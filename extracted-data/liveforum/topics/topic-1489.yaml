    text: 'входить во все подробности в календаре нет никакого смысла. Возражений,
      что Брэдшоу - автор, нет? значит, все правильно.

      PS. может, будем считать Элвиса Пресли - главным исполнителем That''s All Right?
      а Джоплин - главная исполнительница Ball And Chain? То, что их версии имели
      больший коммерческий успех и оказали большее влияние на следующее поколение
      музыкантов, нисколько не отменяет подлинного авторства этих песен. и зачем же
      мне в абзаце про Брэдшоу упоминать позабытого Бурнетта?'
