      date: 2003-09-29 14:42
      poster: Rugged
      email: kirill@hillbilly.ru
      subject: Календарь - значит календарь :)
      deleted: false
      text: "Возражений против авторства нет. Есть возражения против того, что Yardbirds\
        \ делали кавер с Брэдшоу - все же, они делали кавер с Бернетта (кстати, так\
        \ - именно Бернетт, а не Бурнетт). И вовсе он не позабытый. Знали бы Вы, сколько\
        \ кавер-версий этого Train Kept-A Rolling (именно каверов с Бернетта, а не\
        \ с Брэдшоу) было сыграно разными группами во всем мире и у нас в России!\
        \ \n\nP. S. Да, именно так и будем считать. Грешным делом, я, например, авторской\
        \ версии That's All Right не слышал ни разу. При том, что я-то как раз - человек,\
        \ активно интересующийся \"архивной\" американской музыкой, и, говоря без\
        \ ложной скромности, достаточно образованный в этом плане. Просто есть авторы\
        \ песен - а есть их исполнители. И не всегда почетное право называться \"\
        главным исполнителем\" принадлежит автору - по самым разным причинам, порой\
        \ не зависящим ни от самого автора, ни от пресловутого \"главного исполнителя\"\
        . Это вопрос из серии \"кто написал \"Фауста\" - Гете или Гуно? И, кстати,\
        \ в Ваших же словах: \"их версии имели больший коммерческий успех и оказали\
        \ большее влияние на следующее поколение музыкантов\", - кроется ответ на\
        \ вопрос, кого и когда считать \"главным исполнителем\".\n\nP. P. S. Мой первоначальный\
        \ пост не имел цели обличить автора календаря в необъективности или незнании\
        \ тематики. Я хотел лишь дополнить автора, мало ли кто-то заинтересуется,\
        \ что, собственно говоря, и сделал."
