  text: 'Недавно прочитал в новостях блюз.ру про этого перца, а сегодня вот купил
    его диск. Да, джайв там офигительный.


    Однако, люблю объективность. Даже несмотря на то, что Tiny Bradshow действительно
    был автором песни Train Kept A-Rollin'', ее главным исполнителем на все времена
    был и остается Johnny Burnette. И именно с его версии делали свой кавер The Yardbirds,
    для того, чтобы это услышать, не требуется музыкального образования. Но об этом
    факте в новостном сообщении почему-то сказано не было.'
