  text: 'Прям стыдно постить это: подумают что шпиён я какой-то и "тайно посещаю любовницу".

    В общем так, российский дуэт Руки Вверх ("Увози мене скорей, Увози за 100 морей,
    И целуй меня везде: В метро, в подъезде и те де...") тоже к ритм энд блюзу таперича
    приобщились. В их последнем альбоме "Fuc*in'' rock''n''roll" (да уж, такое вот
    названьице) есть песня, я бы даже сказал кавер Shake your Tailfeather. Та самая
    вещь Ray Charles''а что звучит в фильме "Братья Блюз", когда братки пришли в магазин
    к Рэю покупать инструменты.

    Вота ссылка: <a href="http://www.studenkoff.ru/newmusic/ruki_vverx_fucing_rock_n_roll/09.Ray_Charles_vs_RV-Shake_your_Tailfeather.mp3

    ">Ray Charles vs. Руки Вверх - Shake your Tailfeather</a>

    Сам ещё не докачал, т.к. размерчик файла немахонький 7,2 Mb, 256 Kbps, 44 KHz,
    03:50

    P.S. Тут мне сказали что это савсем не кавер, а просто танцевальный ремикс, и
    вроде бы без пения Руков.'
