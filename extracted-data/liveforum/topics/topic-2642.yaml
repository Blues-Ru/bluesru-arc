    subject: Кстати, о ремиксах
    deleted: false
    text: 'Я ведь как набрёл на ссылку этой песни: я искал ремикс композиции из вступления
      к тв передаче "В мире животных" X-mode & Dj Нил - La Peregrinacion/Животные,
      щас её по телику часто крутят, прятный такой клип: животные там всякие, то-сё,
      кароче детство напоминает (в том смысле что только в детстве "В мире животных"
      смотрел, а что тогда было сматреть, когда всего-то 2 тв программы и было?).
      Ну и вот, нашел, а на той страничке и были и другие альбомы, в т.ч. РВ. Я как
      увидел что тама есть вот такая песнЯ, так и качать и её. Так что не падумайте
      што я тут засланный к вам.

      А по поводу ремиксов: вспоминается года 2 назад ремикс Janis Joplin - Mercedes
      Benz. Радостный такой трек :-) И уж самый замечательный ремикс так это Elvis
      Vs Jxl - A Little Less Conversation (2001г.). Полузабытую вещь Элвиса со второй
      стороны сингла так удачно сделали. И клип к ней весёленький сделали, и звучала
      она главной темой в Ocean''s Eleven. Короче, раскрутили песню по полной и очень
      удачно.'
