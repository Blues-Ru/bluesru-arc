  subject: Во, попал!
  deleted: false
  text: "Игорь Бойко играет бойко!\n\n  Занесло меня сегодня с дачи в грязных джинсах\
    \ на концерт Игоря Бойко в Форте. Совершенно неожиданно в рабочий вторник на еженедельном\
    \ концерте я попал на светский раут. Из известных личностей там присутствовали:\
    \ Федя Романенко, Вадик Иващенко, Юра Коверкин, Гия Дзагнидзе, Сережа Крылов и\
    \ Филя Киркоров. Я сидел аккурат промеж двух последних... \n  Из выступления я\
    \ вынес, что Бойко - гитарист виртуозный и один из самых техничных у нас. По-стилистике\
    \ - это форменный джаз-рок с элементами фьюжна. Почему-то мне понравились в основном\
    \ ритмичные композиции, построенные на  роковом риффе с джаз-роковым подвыпердтом.\
    \ Прямо как у Регтайма. В них Бойко накачивался ритмом и упиливал сложнейшие и\
    \ скоростные вещи. Другая половина - баллады (граничащие с романсами и сарабандами),\
    \ а также муть в стиле фьюжн. Это душе моей совсем не близко, ибо я признаю более\
    \ явное выражение музыкальных идей. Особенно мутную муть играли в этих местах\
    \ на клавишах. Все-таки, в этом стиле - это наиболее пидрастический инструмент.\
    \ Какие, все-таки, есть отвратительные регистры на электро-органах... В-общем,\
    \ местами нам с Филей было скучно... Что уж говорить о бедных тетках, которых\
    \ притащил С.Крылов, и которые были вынуждены в загруженном состоянии слушать\
    \ модную музыку. С другой\nстороны, было очень много клевого. А Бойко - крутейший\
    \ чувак, конечно...\n\nВот такой концерт. А Дима Кр. не пошел, сославшись на то,\
    \ что джаз-рок - это музыка для порнофильмов. Не знаю, прогадал - не прогадал.\
    \ ;)\n\nP.S. Так было приятно после послушать в машине такой примитивный Roomful\
    \ of Blues ;)"
