  text: Просто поразительно насколько русские блюзмены могут быть разноплановыми музыкантами.
    В одном клубе играют блюз, вдругом подишь ты уже кавер группа играет зарубежные
    хиты, в третьем уже рок-н ролл, и тоже вроде бы класика жанра, ещё в одном не
    побрезгуем и русской попсятиной типа 80хх. А в тишине, на форуме, обсудим цыганский
    джаз, на самом профессиональном уровне.  Так держать ребята, не посрамите блюз!!!!
