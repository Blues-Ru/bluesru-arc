  text: 'газета Частник из Иваново сообщает:

    "Музыкальная сага: Ритм & Блюз"

    Так назывался конкурс, объявленный редакцией российского журнала по лоскутному
    шитью "Чудесные мгновения". Его финальная экс-позиция едавно завершилась в "Шереметев
    - центре". Более 30 панно лоскутниц из разных городов страны были не просто посвящены
    музыкальной тематике, а буквально сыграли лоскутный блюз. Виниловые пластинки,
    разбросанные ноты, портреты легендарных музыкантов, целые оркестры и абстрактное
    выражение сильных эмоций - все это было воплощено в ситце, шелке и других тканях,
    щедро декорировано и сочетаемо в немыслимых техниках. Эту экспозицию назвали лучшей
    из всех фестивальных экс-позиций, которые на два месяца заполнили наш город.


    На этот раз победителями творческого соревнования стали: Марина Мамонова из города
    Электросталь - с работами "Блюз для влюбленных" и "Рождение блюза" (1-е место
    в номинации "профи" или "бывалых") и мастерица из Ростова-на-Дону Юлия Воронцова
    (1-е место в номинации начинающих за панно "Сумасшедший блюз").'
