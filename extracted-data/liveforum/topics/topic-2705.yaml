    text: 'Какие восхитительные <s>работы</s> названия

      "Блюз для влюбленных", "Рождение блюза", "Сумасшедший блюз"... А не было ли
      там работ с названиями "Ночной блюз", "Блюз дождь", "Сексуальный блюз", "Одинокий
      блюз", "Осенний блюз"? Впрочем "Осенний блюз" это уже явный плагиат - у кого-то
      уже это было: правда то был джаз.

      P.S. Очень было б интересно посмотреть на "Рождение блюза": слепой негр сидит
      в хижине с земляным полом, в руках у него гитара и перо, нотный стан, он сочиняет
      первый в мире блюз и записывает ноты.'
