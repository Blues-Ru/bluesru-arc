    text: "можно порадоваться просто названию газеты, а можно - новому написанию слова\
      \ \"экс-позиция\" (видимо, \"бывшая позиция\")... \nно коллекция названиий со\
      \ словом \"блюз\" - еще ждат своего хранителя. Вот в петербуржском кулинарном\
      \ конкурсе было представлено блюдо \"Блюз белых ночей\": говядина и королевские\
      \ креветки. если предположить, что креветки отвечают за компонент \"блюз\" (например,\
      \ луизианский), то говядине - остается быть \"белыми ночами\". \nили вот \"\
      САНКТ-ПЕТЕРБУРГСКИЕ ВЕДОМОСТИ\" от 9 августа сообщают:\n\"ГОЛОСА ПОД СВОДАМИ\
      \ ХРАМА\nС 5 по 10 августа в Петербурге проходит III международный фестиваль\
      \ хорового искусства \"Поющий мир\"... Открытие фестиваля состоялось в евангелическо-лютеранском\
      \ кафедральном соборе\nсвятых Петра и Павла на Невском....\nХоровое искусство\
      \ России было представлено десятью коллективами.\nАнсамбль \"Невский стиль\"\
      \ исполнил русскую народную песню в стиле блюз...\"\nконец цитаты..."
