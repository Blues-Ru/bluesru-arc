        subject: Imagine all the people livin' for today
        deleted: false
        text: "Друг мой, ты какую газету открыл? Я этих заметок с прущим в лицо астероидом\
          \ в 99-м 98-м и 2000-м столько насмотрелся. Такой у меня Blues был. Пресса\
          \ знаешь-ли, \"торговцы хаосом\" они на этом зарабатывают и скажи пожалуйста,\
          \ Две тысячи лет я жи... пардон, человечество живёт и почему- товсе эти\
          \ астероиды начали падать только в последнее время, причём судя погазетам\
          \ один за другим. Вот недавно меня тоже обрадовали 30-го июня, мол, рухнет\
          \ глыба на уральские горы, и западная европа-то под воду уйдёт и ос-то земной\
          \ смэстытся (полосатый мух- это пчёл, а ос- это палка через земля), и всем\
          \ общая хана. Вот так ну в общем, тот булыжничек оказался раз в десять меньше\
          \ и пролетел раз в десять дальше, чем те пророки предрекали, а расчитать\
          \ всё на 17 лет вперёд, ты меня прости, но это- бред, слышал о такой штуке\
          \ как теория хаоса, ну так вот, не слышал, и газетчики, тоже об этом догадывались,\
          \ потому что если кто в нашей стране и слышал про теорию хаоса что-то то\
          \ это скорее всего- только само название. Так что предсказать вот так напророчить\
          \ чёрт знает что, тем более есть такая фигня, что большую часть поверхности\
          \ нашей планеты составляет мировой океан так что добавь в знаменатель ещё\
          \ пару ноликов и тебе станет лучше, чтоб тебе стало ещё лучше, сообщу что\
          \ на Земле есть такая вещь как атомная бомба а так же- ракета-носитель,\
          \ и если это- действительно правда, то сильным мира сего не в мазу терять\
          \ своё могущество, а так же жизни из-за безмозглого астероида ( подразумеваю,\
          \  что сильные мира сего с мозгами) и они неприменно воспользуются этим\
          \ добром. А чтоб тебе совсем хорошо стало анегдот расскажу:\n \"Поспорил\
          \ как-то Ходжа Насредин с эмиром, что за 50 лет научит осла говорить а в\
          \ противном случае эмир ему- сикир башку устроит. Ну зашел он после этого\
          \ в кабак и рассказал одному из своих друзей, а друг ему в ответ:\n- ты,\
          \ что-сумасшедший, ты же не научишь осла говорить, невозможно это, и эмир\
          \ тебе голову отрубит.\n А хаджа насредин в ответ:\n -Абдула, дружище, ты\
          \ не беспокойся, за пятьдесят лет умрёт либо эмир, либо осёл, либо я\" вот\
          \ так ему Ходжа насредин и ответил, и я хочу сказать, либо астероид к чертям\
          \ развалится( лало-ли с чем он там встретится за 17 лет), либо Земля лишние\
          \ 100000км по орбите сделает( или наооборот), либо человечества так запрогрессирует,\
          \ что лазерами этот астерод в пыль измелют, тем более не забывай, что большая\
          \ часть его сгорает в атмосфере, так что \"аз тля Божья не верю юродивому\
          \ дипутату, а верю юродивому академику\" И лучше следовать совету в теме\
          \ сообщения Джон был умным человеком."
