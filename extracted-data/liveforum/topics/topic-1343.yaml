  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=MISS70308190947&sql=A26jweae04xd7


    Очень важный альбом в карьере Джона! Что он делает на Island я не знаю, но все
    получилось очень хорошо. Спродюсированный Р.С. Филдом, этот диск ознаменовал возвращение
    в хорошую музыку после полного провала целой декады 80-х годов.


    Альбом состоит из 11 треков на 40 минут - отличный формат, не правда ли?

    Тут есть очень важный человек в составе - слайд-гитарист Сонни Ландрет, он же
    автор лучшей вещи с этого альбома - Congo Square.


    Надо сразу сказать, что альбом прекрасно записан и спродюсирован. Альбом блюзовый,
    но все вещи разные и интересные. Очень изобретательные аранжировки, иногда, правда,
    немного тяжеловатые, но это нормально для 1990-го года.


    Плохих вещей тут просто нет, так получилось. Лучшие же вещи - это Congo Square,
    Sensitive Kind (очень хорошая, психоделичная, почти амбиентная версия), Jacksboro
    Highway, Black Cat Moan (вещь Дона Никса в хорошем исполнении), Sugarcane (еще
    одна классная вещь Сонни Ландрета). Остальной материал тоже силен, но довольно
    стандартен.


    Оценка 5 баллов по всем статьям. Айланд помог Джону вернутся к форме и положил
    начало серии хороших альбомов 90-х.


    Welcome back, my friend, to the show that never ends!'
