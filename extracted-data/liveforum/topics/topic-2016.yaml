  text: 'Коллеги,

    делюсь идеей-проведения этой осенью в октябре-ноябре в Клайпеде(Литва)

    блюз фестиваля(это громко),сходки молодых музыкантов-инструменталистов ,вокалистов
    из близких к Литве краев.

    База-Дворец культуры Рыбаков на 1000 мест с малым залом на 150-200мест и просторным
    холлом на 400-450 мест.

    У кого есть интерес к выступлению, просьба написать на наш эл.адрес:

    tvd@takas.lt

    А возможно кто имеет опыт проведения подобных мероприятий.

    Будем рады услышать советы и пожелания.

    С уважением,

    Александр Дмитриев'
