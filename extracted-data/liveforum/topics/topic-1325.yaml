  deleted: false
  text: 'Ситуация такая (со слов Воронова);

    конфликт с соседями привел к серьезному конфликту с милицией - это уже не шутки,
    как я понял.

    Что делать?

    Играть тише, начинать и заканчивать раньше.


    И так, в следующую среду играет Др. Ник.

    Начало СТРОГО в 20:15, последний аккорд или нота СТРОГО в 22:15.

    Приходить (и гостям и джемующим) в 19:45 (желательно).

    Бардак тоже хотят убрать - теперь на сцену будут выпускать не всех - не знаю кто
    проводит отбор, но разберемся, думаю.

    Играть культурно, тихо, с чувством и без клоунады (это касается любителей алкоголя
    и совкового театра).

    Ворона не будет несколько недель, так что не подводите хаус-бэнды, ведите себя
    культурно.

    Что еще сказать; берите с собой хорошие гитары с хорошими струнами и ПОДСТРАИВАЙТЕ
    их по ТЮНЕРУ перед выступлением. Не играйте на убитых гармошках. Не надо орать,
    надо петь - это большая разница. Слушайте ритм и других - это и есть основа блюза
    - перекличка и понимание на сцене. Не надо играть РОК и ДЖАЗ когда все играют
    БЛЮЗ, ФОЛК или СОУЛ.


    Ну вот как-то так. Проблемы в ББК остабются, так что придется нам всем подчиниться
    или все вообще на хер закроют.


    Вопросы задавать можно, но Ворон на них пока не может ответить.


    Приходите в среду пораньше, поиграем и попоем - погляди как получится. Ждем всех
    перцев - КаверКинга, Виноградуса, Юлю Гургеновну, КожеКинга, старика Модернблюзбанда,
    майоров и генералов, Джона, Пола, Джорджа, Ринго и всех всех всех. Певцы-самородки
    особенно приветствуются.


    До встречи!


    Др. Ник'
