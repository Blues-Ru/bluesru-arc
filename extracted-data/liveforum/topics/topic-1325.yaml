    text: 'Будте так добры, научитесь пользоваться комбиками. В ББК они простые и
      примитивные. Не надо крутить все ручки подряд; есть тембры, громкость и реверберация
      (если нужна) - это всё! Не врубайте их на полную, хороший хаус-бэнд подстроится
      под вашу громкость и звук. Не надо использовать драйв, фузз, дисторшн - это
      из другой музыки; комбы и так дают искаженный звук на приличной громкости.


      Ну вот это было о культуре игры, не более того.'
