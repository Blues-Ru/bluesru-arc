    text: 'Watermelon Silm великолепен, очень классный и эмоциональный деревенский
      блюз.


      Вместо Эдди Бо играет какая-то английская тетя - суровая металлистка, Игги Поп
      в женском обличии. Эффектная, но блюза в ней мало, меня не зацепило.


      Ну а Хукер младший - это вообще ужас ходячий. Смесь Эдди Мерфи и Майкла Джексона.
      Если бы он пел также, как выпендривается - было бы намного лучше. А так, папа
      в гробу крутился аки турбина наверное....


      В общем, почти ничего не потеряете, если не пойдете. Лучше в Джаз Таун на Кита
      Данна пойти сегодня.'
