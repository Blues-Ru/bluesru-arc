    text: "большой зал при максимальной загрузке принимает человек 500. \nМалый зал\
      \ тоже не так уж мал, там типичный ресторан, для музыкантов очень маленькая\
      \ сценка. Так что в малый имеет смысл заказать столик заранее. Но по любому,\
      \ в обоих залах достаточно удобно слушать стоя.\nПрограмма действительно огромная...\
      \ так что берегите силы :)"
