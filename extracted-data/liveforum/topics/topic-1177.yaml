  text: подскажите, надо ли покупать билеты заранее, или можно будет прямо перед началом
    приобрести? в смысле ограничено ли количество слушателей или нет и, надеюсь, столики
    там не надо резервировать? т.е. есть ли там хотя бы стоячие места?
  replies:
  - id: 12725
    parent_id: 12718
    date: 2003-05-23 15:12
    poster: Greta
    email: morehemp@mail.ru
    subject: Билеты
    deleted: false
    text: "в Б2 всегда на все без исключения концерты продаются прямо в клубе, на\
      \ лестнице (между вторым и третьим, или третьим и четвертым этажом - не помню).\
      \ Там же Вам и поставят печать на руку :) \nСтоликов там нет (в большом зале).\
      \ Про малую сцену не знаю..\nСтоячих мест там уйма! :) \nВыглядит примерно так:\n\
      Сцена (в большом зале) под высоким потолком, перед ней танцпол. Человек на 50\
      \ максимум. А по краям возвышения за бордюрчиком, где можно присесть на барные\
      \ табуретки.\nЕсть ещё этаж чуть выше, откуда с балкона также можно наблюдать\
      \ действие (когда этот этаж не закрыт). Вот там есть столики, и там кормят.\
      \ Но сидя за столиком не видно музыкантов абсолютно, только слышно.\nВот примерно\
      \ так :)\nХороший клуб. Самое главное, никто не мешает музыкантам играть, жуя\
      \ перед ними стейки :) Это клуб другого уровня. Там еда отдельно, музыка - отдельно.\
      \ Количество слушателей не ограничено."
