  deleted: false
  text: 'РИА НаВятке сообщает:

    "Киров все чаще начинают посещать музыканты и певцы мирового уровня. Во вторник,
    31 января, в Киров приедетизвестная американская блюзовая певица Шерон Льюис.
    Она не только восхитительно поет, но и необыкновенно артистична. За мощный и проникновенный
    вокал чикагские  музыкальные критики называют ее «восьмым чудом света». Сочетание
    госпела и дельта-блюза, манеры техасской и чикагской блюзовых школ делает стиль
    исполнения Шерон Льюис уникальным. Тем приятнее, что для своего первого посещения
    Кирова блюз-дива выбрала камерный зал ресторана GAUDI, благодаря его прекрасному
    звуку. А аккомпанировать мировой звезде в Кирове и Чебоксарах будут музыканты
    популярной группы EL tanGO, которых певица лично пригласила помочь ей.


    http://navyatke.ru/news/13822-s_edinstvennm_kontsertom_v_kirove_vstupit_mirovaya.html'
