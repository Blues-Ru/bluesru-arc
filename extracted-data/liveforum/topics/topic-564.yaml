            subject: коли минчане молчат...
            deleted: false
            text: '...позволю себе ответить на вопрос.


              В Минске уже давно (лет пять или даже больше) существует настоящий блюзовый
              "Стар-клуб", организованный Геннадием Стариковым, хорошим [блюзовым]
              гитаристом. Клуб собирается раз в три недели в диско-клубе Pall-Mall,
              вход обычно бесплатный, но по приглашениям. Играют там не только блюзовые
              группы, но общая направленность всегда блюзовая.


              Иногда блюзовых музыкантов приглашают играть в клуб "Аквариум" (aka
              "Magna"). В кафе "Белая Вежа" на постоянной основе играет минская группа
              Mojo Blues с Ильей Шевчиком. Еще есть заведение ресторанного типа для
              "новых белорусов" с путающим названием "Кафе Блюз", куда приглашают
              музыкантов, но как я понимаю, "для интерьера", это место на клуб не
              тянет.


              Публика понимающая и желающая слушать хорошую музыку в Белоруссии есть,
              как и везде (например, свой блюзовый клуб есть и в Гомеле), но общая
              экономическая ситуация такова, что людям лишь бы хватало "на смятанку
              детям по праздникам", как сказал когда-то Лукашенко (подробнее об этом
              см. <a href="http://charter97.org/rus/news/">Хартия''97</a>).'
