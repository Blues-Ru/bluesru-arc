  deleted: false
  text: 'Я сегодня получил письмо от людей из Минска, которые играют вдвоем традициённый
    блюз на акустике, со слайдом и гармоникой. В репертуаре, в основном, Хукер, Хаулин
    Вульф, Мадди и другие.

    Я послушал музыку, мне ооооооочень понравилось! Там нет торчком торчащих музыкальных
    изысков, но ритмически все ну абсолютно четко,  как в старые добрые времена, сыграно
    и спето мастерски, и в очень правильном блюзовом духе (у нас это называется подачей?
    Или как-то еще? ;). Как мне кажется, при наличии этих условий уже можно начинать
    говорить о творчестве. Они совершенно не похожи на очередного самовыражающегося
    в одиночку барда-исполнителя с акустикой, ибо очень хорошо научились играть традиционный
    блюз. Меня именно поразило весьма необычное в наших краях сочетание скромности
    в выразительных средствах, и недетского мастерства их использования.

    Послушайте обязательно, тем более, что музыкальные файлы там очень небольших размеров.
    Вот ссылка на их сайт:


    http://www.svet-al.boom.ru'
