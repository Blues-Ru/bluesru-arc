          deleted: false
          text: "Я послушал с удовольствием. Что касается языка, то сам Мадди Уотерс\
            \ и прочие люди говорили и пели, конечно же, не на американском и не на\
            \ английском языке. И белые люди над ними смеялись... кроме Ломаксов и\
            \ честных битников. С другой стороны, пытаясь понять Диму, я вот какой\
            \ делаю вывод (не для оценки Свет и Эл, а в общем) - проблема тщательной\
            \ ученической имитации определенного акцента (негритянского, шотландского,\
            \ украинского), конечно, существует. У не-нативного спикера-певца чаще\
            \ всего либо утрированно наплевательское отношение к языку оригинала (дескать,\
            \ блюз пою, по фигу мне - Чарли Паттон ибо я), либо заметны следы того\
            \ самого копирования. Найти правильную середину непросто. Наверное, надо\
            \ быть самим собой, это уже немало. В этом дуэте певец звучит похоже на\
            \ раннего Мадди, заметно многочасовое, с любовью и кайфом, прослушивание\
            \ архаики. Это клёво, я думаю. \nИнтересно, как там в Белоруссии, есть\
            \ ли клубы, понимающая публика. Я работал в Эфиопии с переводчиком Васей\
            \ Шайбаком из Минска, очень был умный и врубающийся в музыку (в том числе\
            \ блюз) чувак. У меня было впечатление, что минская образованная молодежь\
            \ в полном порядке. Помню, как-то пошли мы ночью в Хагере... ладно, стоп.\
            \ А то тут за не-в-тему такое могут в иллюминатор показать..."
