    text: "список участников - на афише.\nплюс к этому клевые BluesDoctors\nс Аграновским\
      \ выйдет и Юра Каверкин. \nна малой сцене (цитирую пресс-релиз):\nПрограмма\
      \ малого зала собирается представить публике относительно неизвестных, но достойных\
      \ внимания музыкантов. Из Пензы приезжает единственный городской блюзбэнд GRAYHOUND\
      \ BLUES. Два свежайших и прелюбопытнейших проекта: это группа BOOGIE CHILLEN,\
      \ в которой солирует Тамара Кожекина: и совместный проект певицы Юли Смолянин\
      \ и гитариста Гургена Джангиряна. Их поддержат молодые, но знаменитые в определенных\
      \ кругах Вовка Кожекин и Ваня Жук: группа «СТАНЦИЯ МИР»."
