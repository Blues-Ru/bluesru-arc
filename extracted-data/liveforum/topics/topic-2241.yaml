      deleted: false
      text: "Двойник \"London Sessions\" вышел в прошлом году.  Но это не live.\n\n\
        К сожалению Howlin' Wolf плохо уловили live.  Записей немного, и то ди качество\
        \ записи плохое, то ли сам Wolf не в полную силу.\n\nЕсть одна совсем неплохая\
        \ профессионалная запись от 1972 на Chess:  Live and Cookin' at Alice's. \n\
        \nМожет быть еще лучше: Live in Europe, 1964\n\nLive in Cambridge 1966:  Качество\
        \ музыки очень высокое, выше чем на вышеизложенных дисках.  Но качество записи\
        \ - ужасное.  \n\nLive at Joe's 1973:  Только для фанатиков.  Качество записи\
        \ плохое и Wolf в плохом состоянии.\n\nЕсть еще несколько записей live от\
        \ его последних годов, когда очень болел.  Ничего особенного.  \n\nЛучший\
        \ Wolf на дисках - это записи studio от 1950-1965.  Почти все эти записи очень\
        \ хорошие.  Лучшего блюза не бывает.\n\nMuddy"
