      deleted: false
      text: 'Я думаю, что тут такая ситуация. На DVD выходит некоторое количество
        живых концертов, их можно купить в Москве в нескольких местах, включая Горбушку.
        Большинство вещей выкачивается в столицах из торрентов. Это действительно
        сильно повышает доступность материалов.


        Самые очевидные и широко-растиражированные вещи типа концертов SRV или Клэптона
        - не так уж сложно добыть в ларьке. В нашей стране люди не привыкли пользоваться
        почтой, не знают, что она работает, поэтому идея что-то предпринимать, чтобы
        меняться записями, их очень отпугивает. Гоняться имело бы смысл за какими-то
        редкими вещами, но не за достаточно очевидными.


        Самая большая коллекция DVD, которую я видел, стоит у Юр.Иваныча в Доме у
        Дороги.


        Наиболее перспективным способом обмена материалом помимо интернета может быть
        следующий. Во-первых, нужно найти друзей по интересам в своем городе. Может,
        форум блюз-ру сможет чем-то помочь? После этого нужно заслать десант, скажем,
        в Москву. Приехать с винчестером и переписать много материала, который отвезти
        домой и поделиться им с единомышленниками. Обмен между двумя отдельными людьми
        - вещь не такая эффективная. А вот осчастливить весь блюзовый Краснодар -
        это да...


        Я вот недавно ездил в Екатеринбург по делам, мы два вечера выпивали с Вовой
        Демьяновым, от после первой ночи купил себе винт, на вторую я ему уже слил
        кучу ценного блюзового mp3.'
