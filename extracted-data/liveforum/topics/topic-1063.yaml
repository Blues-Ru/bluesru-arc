          poster: Алексей Аграновский (Док)
          email: aaa@genebee.msu.su
          subject: Как найти Второй этаж
          deleted: false
          text: "Пешком - до м.Цветной б-р, перейти на другую сторону, держать путь\
            \ к Садовому. Свернуть направо в любой переулок, потом налево на Трубную\
            \ улицу. Искать слева арку с надписью краской \"29\", войти в нее, дойти\
            \ до конца, потом налево (вдоль строения 6). Вход темный, с козырьком.\
            \ \n\nНа машине - по внутренней стороне Садового кольца (Би Би Кинг, где\
            \ завтра играет группа Черный хлеб, пропускаете, увы...), пересечь Цветной\
            \ б-р и свернуть в следующий проезд направо. Попадаете на Трубную улицу.\
            \ Метров через 100 справа будет та самая арка \"29\".\nЕсли поедете со\
            \ стороны Сухаревской пл., то с внешней стороны Садового заезжайте под\
            \ мост, развернитесь и далее все то же самое."
