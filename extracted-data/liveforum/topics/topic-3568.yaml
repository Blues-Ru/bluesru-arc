                  deleted: false
                  text: 'В это время появилось общество любителей блюза среди белой
                    молодежи. Они очень серьезно различали "настоящий" и "ненастояший"
                    блюз, а также "настоящих" и "ненастоящих" блюзменов.  Они были
                    глубоко убеждены, что настоящие блюзмены - это исключительно деревенские
                    акустические негрeтянские музыканты, как Charlie Patton, Blind
                    Lemon Jefferson, Son House, Skip James, Robert Johnson, и т.д.  Считали,
                    что даже Big Bill Broonzy предал блюз, и продался городской коммерческой
                    музыке.  Что касается Muddy Waters, Howlin'' Wolf, John Lee Hooker,
                    Sonny Boy Williamson и д.т., для них это было полное безобразие,
                    негрeтянская попса - ненастоящий блюз ненастоящих блюзменов.  Столько
                    критических замечаний было написан в адрес Мадди, Вольф и др.
                    от самозванцев-молодых белых "экспетров" блюза.


                    А сами музыканты и негрeтянское общество просто плевали на все
                    это, как и на любые другие попытки белого критического общества
                    решать, что такое блюз и что такое неблюз.  Это также касается
                    разницы между блюзом, джазом, соулом, ритм-и-блюзом.  Не сами
                    музыканты придумали эти якобы непересекающие себя категории, и
                    в основном они их не признают.  И слава Богу за это.


                    Muddy'
