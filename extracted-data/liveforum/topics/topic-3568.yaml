                text: "Блюзмены - \n\nнарод обычно чёрный, необразованный, пьяный\
                  \ и драный. Играли криво и мимо, плохо говорили и иногда рвано пели.\
                  \ Многие ничего не понимали в музыке и занимались именно Блюзом\
                  \ (как образом жизни). Фактически, это эдакий протест в песнях,\
                  \ звуках, манерах и традициях. Так было до 80-х, пожалуй. Потом\
                  \ блюза просто не стало, но до сих пор есть неплохие акустические\
                  \ парни и даже классики жанра, которые стали играть получше, но\
                  \ в целом ничего не изменили.\n\nДжазмены - \n\nпафос и спорт. Манерность\
                  \ и стиль. Придумки, выдумки, техника, игра для самих себя, споры\
                  \ о крутизне, собачатина, авангард мать его и прочая хрень. Многие\
                  \ джазмены (особенно бопперы и позднее) вообще не считали блюзменов\
                  \ за музыкантов. А блюз в таком виде не считали за музыку. Обзывали\
                  \ тех неумехами и профнепригодными вообще. Но и джаз умер с появлением\
                  \ рока и соул/фанка в 60-х. Фьюжн и джаз-рок - это уже совсем другая\
                  \ тема.\n\nТак вот, когда блюзмены играют в джазовой или свинговой\
                  \ манере - это попса. Когда джазмены играют блюз - это тоже не то\
                  \ совсем. Хороший блюз - это единицы артистов, которые могли манить\
                  \ к себе своей личностью (Сонни Бой, Мадди, Джуниор Уэллс, Хаулин\
                  \ Вулф и т.д.)\n\nБлюз и джаз - это совсем разный подход и звук.\
                  \ Разный уровень. Блюз - это фолк. Если блюз становится не фолком,\
                  \ то это уже не блюз. Если он переходит в соул - это еще хорошо\
                  \ (настоящее чёрное развитие). А вот есть в танцы, свинг, шоу, рок\
                  \ и хард-рок, то это часто просто ужасно и мерзко. Но джаз - это\
                  \ еще дальше от блюза, ибо они типа делают ИСКУССТВО (то есть арт)\
                  \ - искусственную фигню в основном. Блюз же (настоящий) - это культура\
                  \ и традиция. Образ жизни и натуральность. Простота и лаконичность.\
                  \ Рассказ и песня."
