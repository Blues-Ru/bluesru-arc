                    deleted: false
                    text: 'Миша прав.  Могу прибавить - похоже, что музыка блюза существовала
                      до этого названия.  В 19-ом веке слово "blues" уже употреблялось
                      в смысле тяжелого настроения, т.е. "I''ve got the blues."  Судя
                      по рассказам старых блюзовых артистов, которые помнят последние
                      годы 19-го века в южных штатах, блюзовые песни тогда назывались
                      не "блюз" а "рилс"(Reels).  Когда слово "блюз" заменил "рилс"
                      - это не совсем понятно.  Скорее всего эта замена произошла
                      в одном каком-то районе в связи с тем, что пели "I''ve got the
                      blues," и потом рапространилось по всей стране.


                      Muddy'
