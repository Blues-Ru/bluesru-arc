  text: "Hello -\n \nYou seem to like blues, and harmonicas.  I've been playing diatonic\
    \ harmonicas since High School, and chromatic  harmonicas since I saw Larry Adler\
    \ in concert years ago, and my jaw just dropped!  In that time, I've collected\
    \ an EXTENSIVE LIBRARY of RARE HARMONICA VIDEOS of  ALL KINDS!   MUSIC PLAYED\
    \ includes: blues, jazz, classical, Christmas, rock, C&W, folk, popular, funk,\
    \ bluegrass, avant garde, and more!  HARMONICAS PLAYED include: diatonic, custom\
    \ diatonic (sometimes more than one in the same song!), chromatic, custom chromatic,\
    \ double bass, chord, little lady (sometimes no hands!), harmonetta, musette (designed\
    \ and built by John Infande!), bass, polyphonia, and more!  This is a \"who's\
    \ who\" of harmonica players from across the world, living and deceased, from\
    \ the 1930's on, performing as soloists, duos, trios, quartets, quintets, harmonica\
    \ bands, in movies, and more!  For a FREE LIST of available videos, please send\
    \ an e-mail with \"harmonica  videos\" in the subject field to: jsteinberg@ucwphilly.rr.com.\
    \  Or you can check it out on the Web at: \n\nhttp://jeremy_steinberg.tripod.com/harpvids2.htm"
