  text: 'Борни и Эйвинд произвели на меня достаточно сильное впечатление. Им немного
    лет, но у них изысканный музыкальный вкус, они понимают, что круто - это играть
    не менее рафинированно, чем Jimmy Vaughan или Junior Watson. Они взяли мощный
    звук, лучшее из аранжировок и стиля, и играют гармонически интересные соло.


    Борни - более матерый, гладкий и мощный, он отлично играет Альберта Коллинза,
    я не слышал, чтобы в стандартном строе кто-то играл похоже в стиле Коллинза без
    потерь лучших нюансов. Эйвинд идет по стопам Джуниора Ватсона, все время играет
    рискованно и неожиданно.


    Такого гитарного эстетства я давно не слышал на концерте. Юра записал вчерашний
    концерт, выложит что-то, я надеюсь, сегодня вечером - последний, не пропустите.'
