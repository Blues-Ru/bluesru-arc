        в вечер моего присутствия на сцене была замечательная местная блюзовая команда...

        не из пупер-известных (да и нет таковых в Астрии), но свою добротную борозду
        не портила, но тянула с задором...

        был хороший ритм, и хороший женский вокал, и были широкоизвестные блюзовые
        каверы...

        настроение присутствовало...

        каждому бы городу такое добротное заведение...)'
