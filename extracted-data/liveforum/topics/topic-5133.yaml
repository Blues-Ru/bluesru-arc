  replies:
  - id: 39094
    parent_id: 39093
    date: 2013-09-30 06:57
    poster: Andrei V. Evdokimov
    subject: 'Автор фильма пишет:'
    deleted: false
    text: "<i>У меня дома в Вене, февраль 1975 г. Снято на пленку 8мм, на трехминутные\
      \ ролики. Без звука. (Звук записывался отдельно). “Synchronised” позже с \"\
      acetates\" (http://en.wikipedia.org/wiki/Acetate_disc). Не везде сработало,\
      \ но времени потребовало много (как и тонны сигарет и много выпивки). К сожалению,\
      \ камера дает много шума. Время между 3-хминутными я заполнил съемками, которые\
      \ сделал на вокзале, когда Джонни уезжал из Зальцбурга, и позже у реки  Unfortunately\
      \ also the camera made a lot of noise… I had to fill the time between the 3-minute-clips\
      \ with footage I took at the train station when Johnny left Salzburg and later\
      \ near the river Дунай в Вене (нет, это не дельта). Недолго на экране можно\
      \ видеть мост. Это старый “Reichsbruecke”, который провалился на следующее утро.\n\
      Я должен принести свою благодарность Мистеру Джонни Шайнзу, одному из лучших\
      \ людей, каких я встретил в своей жизни. Я провел с ним чудесную неделю во время\
      \ его трех выступлений в Австрии (три концерта в Вене в Jazzland и по концерту\
      \ в Линцу и Зальцбурге). Спасибо, Джонни, я никогда не забуду эту неделю. \n\
      И: нет, он не подарил мне никакой новой фотографии Р.Дж... Но, похоже, он был\
      \ счастлив, что я ее и не просил.\""
