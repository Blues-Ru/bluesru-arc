  deleted: false
  text: 'Первая ассоциация, которая возникает при прослушивании альбома, что это альбом
    «унца-унца». Он почти весь ритмически построен на шаффлах, что характернее для
    блюза, нежели для джаза. Тем не менее, это так.


    Первая вещь – «Chittlins Con Carne» авторства бесменного гитариста коллектива
    Джимми Смита Кенни Баррелла (Kenny Burrell), и сразу быстрый шаффл. Нога так и
    начинает пристукивать в такт. Мелькают азиатские разрешения, но всё прилично и
    стилизовано.


    Следующая вещь и снова «унца-унца»-импровизация на тему «It’s Alright With Me»
    Cole Porter. Орган визжит и заливается. Свинг растекается по венам. Где-то вдали
    слышны бормотания и всхлипывания органиста. Супер-вещь!


    Он весь такой, этот альбом. Чередуются соло органа и гитары, их перекличка в итоге
    перерастает в подвижный разухабистый дуэт. Свингующие шаффлы льются через край.
    И всё где-то на грани джазовой «строгости» и доступности попсы.


    И, наконец, вот он, блюз. Неужели ж без него могло обойтись на этой пластинке:
    классический «Got My Mojo’ Workin’» великого Muddy Waters’а c вокалом самого Джимми
    Смита. Шаффл? Да, конечно. Но если же описать, каким он получился, то это что-то
    сродни версии Гии Дзагнидзе и его «Modern Blues Band». Громкая вторая доля ударных
    бубнит в колонки на фоне соло гитары и органа. О, теперь ещё и тарелки подключились!
    Вау, вокал Джимми шикарен! Он весь там, в музыке. Иногда речитативно, иногда с
    подвываниями.'
