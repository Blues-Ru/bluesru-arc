      text: "Я тоже откопал небольшой пресс-релиз из Jazz Town: \"В музыкальной карьере\
        \ Уолфа Мейла, выдающегося североамериканского гитариста, один успех идет\
        \ на смену другому. В рекордно короткие сроки он прошел путь от локальных\
        \ выступлений в Южной Калифорнии до участия в Европейском турне Робена Форда,\
        \ получив международное признание и репутацию самого неудержимого исполнителя,\
        \ гастролирующего в 25 странах, музыканта, чьи альбомы попали в десятку самых\
        \ продаваемых в категории блюз/кантри в Японии и Америке.\n\nНациональное\
        \ общественное радио Мемфиса, Теннеси (National Public Radio) называет этого\
        \ экстраординарного гитариста, одаренного певца и плодотворного композитора,\
        \ 'недостающим связующим звеном между Хендриксом и Стиви Рей Воном'. Уолф\
        \ сумел выработать свое собственное 'фирменное' звучание, используя музыкальный\
        \ язык, исполненный страсти и подлинной энергетики, и понятный для всех. \n\
        \nУолф Мейл родился в Канаде и начал играть на гитаре в возрасте 10 лет, слушая\
        \ записи Элмора Джеймса и Рэя Чарльза. Его первый концерт состоялся, когда\
        \ ему исполнилось 14, а в 17 он убежал из дома, чтобы отправиться на гастроли\
        \ со своей группой. Тогда же он познакомился с гитаристом Тедом Наджентом\
        \ (Ted Nudgent) и некоторое время гастролировал с ним. Знакомство с Тедом\
        \ сильно повлияло на Уолфа, и он вскоре принял решение переселиться в Калифорнию,\
        \ чтобы посвятить себя музыкальной карьере. \n\nС первых концертов в знаменитом\
        \ Whisky a go-go в Лос Анжелесе и до выступлений в Shibuya в Токио и в Quarter\
        \ Latin в Париже Уолфа никогда не покидало желание выступать на сцене. В настоящее\
        \ время он является одним из немногих музыкантов, чьи гастроли ежегодно с\
        \ успехом проходят на 4 континентах. Уолф дает более 200 концертов в год в\
        \ США, Канаде, Японии, Европе и Австралии.\"\n\n\nОдно непонятно там заявлены\
        \ еще и \"Blues Doctors\", а Ragtime???"
