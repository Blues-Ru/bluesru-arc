  subject: А что такое "блюзовая группа 108-102"?
  deleted: false
  text: "Вот наткнулся: \n\nГруппа \"108-102\" рассказывает о себе.\n\n14-Aug-2003\
    \ 15:45 MSK\n\nГруппа выступала 01 июля на вечере в клубе \"Б2\". Наверное можно\
    \ с уверенностью сказать, что блюзовое направление рока наиболее близко любителям\
    \ вольной жизни - байкерам, мотоциклистам и экстремалам.\nВот, что говорит круппа\
    \ \"108-102\" о себе самой:\n\nКогда говорят ?Блюз-бэнд?, или ?Блюзовая команда?,\
    \ то сразу представляешь себе нескольких радостных, полноватых чернокожих музыкантов\
    \ с хрипучими голосами, или кучку мрачных, длинноволосых, бородатых бледнолицых\
    \ в джинсе и коже. Все эти люди, конечно же, бунтари и все, что есть у них в жизни\
    \ ? это блюз.\nТак вот, в этом смысле 108-102 никакой ни Блюз-бэнд. Хотя у нас\
    \ в команде есть и бородатые и патлатые товарищи. Но уж больно подкачало социальное\
    \ положение ? банкир, юрист, врач, журналист, экономист. Разве с такими профессиями\
    \ люди играют блюз, спросите вы.\nИграют, и еще как! И не только блюз, еще джаз,\
    \ рок-н-ролл, даже танго. Нас сейчас шестеро:\nНа ударных ? Михаил Чеканов, на\
    \ басу ? Филипп Арнук, эти двое ? наша ритм-секция, на гитарах два Антона ? Родников\
    \ и Бенеславский (за ним, кстати, еще и вокал), лучшая часть нашей группы ? бэк-\
    \ и просто вокалистка Ольга Арсланова, и недавно прибившийся клавишник ? Алексей\
    \ Горожанкин.\nРаньше нас было меньше, к нам изредка прибиваются разные люди,\
    \ кому нравится ? остается, надеемся, это брожение еще не скоро кончится.\nНельзя\
    \ не упомянуть двух людей, без которых, наша группа вряд ли бы просуществовала\
    \ до нынешнего момента ? это два наших звукорежиссера (в хронологическом порядке):\
    \ Константин Дикарев и Павел Андреев (он же Рубин, он же Секамыч). Базой нашей\
    \ уже давно остается замечательная маленькая студия ?Чугун-Рекордз?.\nС чего же,\
    \ все это началось. Никто уже не помнит. Просто собрались, просто сыграли ? понравилось.\
    \ И понеслась. Дату нашего первого сборища можно назвать лишь с очень большой\
    \ погрешностью, а потому днем рождения команды мы решили считать 11 декабря 1998\
    \ года, когда мы впервые играли на публику, на сцене Интер-клуба небезызвестного\
    \ Лумумбария."
