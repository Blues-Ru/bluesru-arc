  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDSUB040311261710020634&sql=Axt6uakok5m3k\n\
    \nДюэйн Оллман погиб, но группа не развалилась. В конце концов, пением и сочинением\
    \ песен занимались Грегг и Дики, так что потеря Дюэйна отразилась лишь на звучании\
    \ и настроении группы.\n\nEat A Peach - это двойной альбом группы, состоящий из\
    \ новых записей, старых записей с Дюэйном и концертных треков с Филлмора. На альбоме\
    \ всего 9 композиций, но Дюэйна нет лишь на первых трех треках. Эти новые треки\
    \ показывают нам, что группа в полном порядке и Грегг с Дики пишут отличные песни\
    \ по-прежнему. Дюэйна никто не заменил, так что группа осталась с одним гитаристом.\
    \ \n\nАльбом начинается с шикарного номера Грегга Ain't Wastin' Time No More.\
    \ Затем идет девятиминутный инструментал Дики - смесь джаза, психоделии и музыки\
    \ Сантаны - отличный трек! Третий трек Melissa считается одним из лучших сочинений\
    \ Грегга; красота да и только!\n\nПотом следует страшная вещь - 34-минутный концертный\
    \ трек Mountain Jam! 34 минуты - это длина звучания приличного альбома, но не\
    \ трека. Конечно, это трибьют Дюэйну, но это явный перебор для пластинки. Пятый\
    \ трек One Way Out - тоже концертная запись с Дюэйном; классный блюз! Trouble\
    \ No More - шестой трек с того же концерта - классический блюз Мадди в классном\
    \ исполнении.\n\nТретья часть альбома состоит из трех студийных треков с Дюэйном.\
    \ Очень хорошие песни Stand Back и Blue Sky, а в качестве эпилога великая инструменталка\
    \ Дюэйна Little Martha!\n\nОценка 4 балла. Три \"средние\" композиции вставлены\
    \ как-то искусственно и плохо вяжутся с остальными треками. Многие считают этот\
    \ альбом лучшим, но именно за студийные треки. Закончилась эра Дюэйна - два студийных\
    \ альбома, двойной концертник и вот этот замечательный компот из трех частей."
