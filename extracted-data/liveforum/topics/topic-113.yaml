      deleted: false
      text: 'Лучше представь себе как сложно потом играть с кем-то другим после Эдика
        (или Севастьянова, Шатуновского, Ефимова). А ведь Эдик не может постоянно,
        хотя играть любит с нами и хочет, но СКВ главнее ;)

        То же самое касается других музыкантов. Красивов сказал, что готов играть
        с нами нашу программу. Он был под шафе "на Бронной", но слышал три часа наших
        вещей и звучал вроде серьезно. Это вариант, конечно, потому как уже много
        лет никого не можем найти, а Дима играет (может играть) так, как нам надо.
        А вообще многие говорят, что нужен именно клавишник, но это вообще утопия.
        Никто ничего не знает, не умеет, да еще и в джаз лезут. Не знаю что делать...'
