  text: "HOOKER, John Lee : Посмертный альбом \n\nУже два года, как ушел из жизни\
    \ блюзовый патриарх Джон Ли Хукер. На конец октября фирма Eagle Records объявила\
    \ о выпуске альбома с его \"новыми\" записями. Это альбом под названием \"Лицом\
    \ к лицу\" (\"Face to Face\"), над которым Хукер работал в последние годы жизни.\
    \ Наряду с нестареющими песнями, которые Хукер не раз перезаписывал за время своей\
    \ долгой карьеры: \"Ямочки\" (Dimples), \"Блюз Сумасшедшего\" (Mad Man Blues)\
    \ и, конечно, \"Гуляй, Ребятня\" (Boogie Chillen) - здесь присутствует целый ряд\
    \ песен, никогда прежде не исполнявшихся им в студии. \nКак и в последних его\
    \ прижизненных альбомах, ему аккомпанируют звезды блюза и популярной музыки: Van\
    \ Morrison, Johnny Winter, Dickey Betts, Warren Haynes, Elvin Bishop, George Thorogood\
    \ и Roy Rogers. Дочь Хукера, певица Закирия осуществляла художественный контроль\
    \ над работой по завершению альбома после смерти отца. \n\n \n29.10.2003, Андрей\
    \ ЕВДОКИМОВ ( ЗВУКИ РУ )"
