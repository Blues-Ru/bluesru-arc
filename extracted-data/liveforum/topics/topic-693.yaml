  text: Поприветствуем новый ресурс  самой живой музыки - WWW.KLADZVEZD.RU! Миссия
    этого проекта - помочь музыкантам донести произведения публике (на сайте размещены
    новые и малоизвестные композиции, ранее исполнявшимися только в кругу близких
    друзей), расширить круг единомышленников для будущих совместных экспериментов
    во благо музыки и слушателя. Цель - объединить музыкантов, готовых творить, помогать
    творить и наслаждаться проделанной работой. Проект интерактивен - помогает музыкантам
    развиваться, общаться и не топтаться на месте.
