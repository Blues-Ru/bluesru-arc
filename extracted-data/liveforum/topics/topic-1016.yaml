                        text: "но в поисках редкостей начинаешь обращать внимание\
                          \ и на то, кто их выпускает-сохраняет-оберегает. потом,\
                          \ убедившись, что это делается точно не за бабки, начинает\
                          \ уважать людей, которые: если, то не было б крепче гвоздей.\
                          \ Язу, Архули, Фэт Поссум - лейблы энтузиастов. Не могу\
                          \ не снять шляпу. Архули - не архивариусы, в отличие от\
                          \ Язу (видать, по созвучию я и спутал). Но их записи гарантируют\
