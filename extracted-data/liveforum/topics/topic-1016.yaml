                          \ деле это one man business: некто Chris Strachvitz. \n\
                          И, если подумать, что  вот от таких людей, как он, зависило:\
                          \ записались бы блюзовые старцы в 60-х, записал бы К.Шеньер\
                          \ свои лучшие альбомы, выпал бы шанс Биг Маме Торнтон поработать\
                          \ в блюзе и с блюзбэндом Мадди Уотерса?.. Ответ: нет. Без\
                          \ мистера Стречвитца ничего этого бы не было. памятник на\
