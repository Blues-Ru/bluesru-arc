  text: 'http://blindboys.portmerch.com/stores/images/D/DVD_neworleansdetail.jpg


    Весной 2008 года Blind Boys отправились в Новый Орлеан, чтобы играть в знаменитом
    клубе Crescent City Tipitina. Концерт проходил при полном аншлаге. В этот особый
    вечер Blind Boys пригласили некоторых из своих любимых музыкантов, чтобы играть
    вместе с ними на одной сцене: Dr. John, Susan Tedeschi, Preservation Hall Jazz
    Band, Henry Butler и Marva Wright. Сет-лист состоит из новых и старых песен из
    четырёх Грэмми альбомов группы... хороший, чувственный (а какой же иной?) госпел
    - это отдельная хорошая история... но этот же госпел на орлеанской сцене в окружении
    местных музыкантов - это десяток историй еще лучше... ребята из Алабамы показали,
    что такое госпел и религиозные тексты, Preservation Hall Jazz Band, в свою очередь,
    познакомили с замечательной музыкой Нью-Орлеана... солнца и тепла Вам, друзья...'
