  deleted: false
  text: 'Дань Элле Фицджеральд

    Документальный фильм (1992). Газеты писали: "Элла Фицджеральд может спеть даже
    телефонный справочник". Себя она считала еще одним инструментом в оркестре и говорила:
    "Когда я пою, я мысленно ставлю себя на место тенор-саксофона". В 50-е годы ни
    один из концертов в Белом доме не проходил без участия певицы. За свою жизнь Элла
    записала более 250 альбомов, было продано более ста миллионов ее пластинок. Двенадцать
    раз Элла Фицджеральд была награждена самой престижной американской музыкальной
    премией "Грэмми".


    "Культура", 30.01.05  00:30'
