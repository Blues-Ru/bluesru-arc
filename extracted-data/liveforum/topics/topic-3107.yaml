      subject: Все очень просто
      deleted: false
      text: "И чего Вы стебетесь? Надо же помочь коллегам. \nПопасть на Московскую\
        \ блюзовую сцену очень просто. Она - демократична, хотя и консервативна :-)\n\
        1) Самое простое - поучаствовать в джемах лидерам коллектива (гитаристу, вокалисту).\
        \ Джемы - достаточно регулярны, надо только договорится с его ведущим, и аккуратно\
        \ сыграть (ну, чтобы пригласили и в следующий раз). Засветитесь - будет проще.\n\
        2) Хорошо бы поучаствовать в каком бы то ни было блюзовом фестивале. В этом\
        \ случае есть шанс \"показатся\" всей немногочисленной блюзовой общественности.\
        \ Как пример - 24-го будет маленький блюз-фест с Keith Dunn, Мишурисом, Светом,\
        \ Аграновским. По моей информации там еще осталось одно место для участия\
        \ :-) http://www.holmi.ru/index.php?pg=240206 (организаторы все еще думают,\
        \ кого бы еще пригласить)\n3) Сработать группой на разогреве. Если понравитесь\
        \ клубу - к вам подойдут и пригласят сработать уже сольно. \n4) Договорится\
        \ с каким нить челом в Москве (кто уже знает) - чтобы разнес ваши ДЕМО по\
        \ клубам и назабивал вам концертов. Чел в москве - вещь полезная. Хороший\
        \ пример Света - приезжают раза 2 в месяц и имеют по 5 концертов за приезд.\
        \ (это ваши ребята, из минска)\n\nКороче - вливайтесь в жизнь страны, и как\
        \ можно активнее."
