  text: '25 марта в Светлановском зале Московского международного Дома Музыки состоится
    грандиозный концерт в честь Юбилея Сергея Манукяна (60 лет)!


    СПЕЦИАЛЬНЫЕ ГОСТИ: Игорь Бутман, пианисты Валерий Гроховский, Евгений Борец и
    Вячеслав Горский, певица Алина Ростоцкая, саксофонист Тимур Некрасов, Юрий Парфенов
    (флюгер-горн), гитаристы Павел Чекмаковский, Александр Родовский и Тимур Ведерников,
    маримбофонист Лев Слепнер, басисты Алекс Ростоцкий и Антон Ревнюк, барабанщики
    Сергей Остроумов и Артем Федотов, перкуссионист Вартан Бабаян, альтистка Марина
    Дубинина, ученики Сергея Манукяна и, конечно же, один из его учителей – сам Анатолий
    Кролл!


    Стоимость билетов в предпродаже - от 1000 рублей в кассах и на сайтах:


    http://mmdm.ru/afishaDescription/8125


    http://ponominalu.ru/event/sergey-manukyan/25.03/19:00


    http://concert.ru/Order.aspx?ActionID=51697


    А также в кассе Дома Музыки по адресу: Космодамианская набережная, 52, стр. 8
    (м. Павелецкая).


    Справки и билеты: +7 (495) 730-10-11.'
