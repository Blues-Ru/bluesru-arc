  text: "Здравствуй, друг, frend, amigo and camrad! \n\nПриглашаю тебя на Второй Фестиваль\
    \ самодельных музыкальных инструментов \"Cigar Box Guitar Blues Session\"\nкоторый\
    \ состоится 3 августа в клубе \"Кафе Блюз\" http://www.cafeblues.ru/ \n\nФормат\
    \ мероприятия:\n\nВерхний зал: весь вечер концерт группы Captain Nemoff and CigarBox\
    \ Orchestra , джем-сейшн .\n\nНижний зал: выставка-продажа CBG , самодельных и\
    \ мастеровых музыкальных инструментов, мастер - класс по игре на CBG , живое общение\
    \ с мастерами, обмен опытом.\n\nИнформация о проведении фестиваля \"Cigar Box\
    \ Guitar Blues Session\" будет указана в интернет-афишах \"Live Band\" , \"Party\
    \ Town\" , \" ПроАртИнфо\", в рекламном блоке телеканала \"Москва 24\" , а так\
    \ же в соцсетях Facebook и Вконтакте.\n\n<iframe width=\"560\" height=\"315\"\
    \ src=\"//www.youtube.com/embed/SfKUAUewPhU\" frameborder=\"0\" allowfullscreen></iframe>\n\
    \nДля мастеров, которые готовы выставить свои шедевры на продажу - вход бесплатный,\
    \ для всех остальных граждан 300 р.\n\nЕсли ты хочешь поиграть на сцене, этот\
    \ вопрос необходимо заранее согласовать с Евгением Немовым \nhttp://vk.com/id76927632\
    \ тел. +7 (917) 555-51-33\n\nПо всем орг. вопросам обращайся к арт-дирекору Фёдору\
    \ Уманскому http://vk.com/f.umansky тел. +7 (916) 851-11-49\n\nПрисоединяйся,\
    \ ты нужен нам и ты нужен миру!\n\n<iframe width=\"560\" height=\"315\" src=\"\
    //www.youtube.com/embed/5tzmStwJ-jQ\" frameborder=\"0\" allowfullscreen></iframe>"
