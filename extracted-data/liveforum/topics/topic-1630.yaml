  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70312021801262281&sql=Aktkcikk6bb89\n\
    \nВторой альбом на Headlide Records с номером HED 2. Это странная пластинка. Очень\
    \ похоже на сборник ауттейков и случайных записей. Все вещи записаны с разным\
    \ качеством, некоторые просто плохо. Все это очень странно, но все же это официальный\
    \ номерной Грин 83 года.\n\nСтало еще больше рока, меньше ярких вещей, некоторые\
    \ композиции звучат как явное заполнение времени на альбоме. Опять большинство\
    \ вещей записаны на M.D. Green-a; получается, что именно брат Грина пишет музыку\
    \ к его альбомам в те годы? Одна вещь написана Питером ГринБАУМОМ, еще одна на\
    \ двоих и Same Old Blues оказался в категории TRADITIONAL. \n\nОценка 3 балла.\
    \ Можно выделить лишь Big Boy Now, Bandit (отличный инструментал, он есть в другом\
    \ исполнении на следующем альбоме); Gotta Do It With Me - почти танцевальный трек,\
    \ но что-то в нем есть. Всю картину окончательно смазывает заключительный Funky\
    \ Jam - нет ни фанка, ни джема. Становится ясно, что Грин опять куда ушел, его\
    \ уже не найти, он сам не знает что творит. На этот раз он исчезнет аж на 15 лет.\n\
    \nRemember when you were young, you shone like the sun..."
