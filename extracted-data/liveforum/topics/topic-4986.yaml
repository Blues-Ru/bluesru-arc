  text: "игровой фильм о блюзовом заведении с живой музыкой в 50-ых... времена и люди\
    \ меняются... \nто, что еще вчера казалось привычным, обыденным и само собой разумеющимся,\
    \ стремительно превращается в устаревшее и отмирающее... \nнекоторые люди трудно\
    \ расстаются с привычным... \nвладелец заведения с живой музыкой весь фильм ведет\
    \ борьбу до последнего патрона с окружающей действительностью в виде наступающей\
    \ механической музыки... \nв фильме все заканчивается хэппи-эндом... \nну, на\
    \ то он и фильм, чтобы... \nсоздателям фильма удалось создать полотно, вызывающее\
    \ доверие и сопереживание... \nодин из немногих правильных фильмов о блюзе...\
    \ \nфильм, в котором грубые шутки, тихая грусть, горечь расставаний и вера в то,\
    \ что ты делаешь, смешаны в идеальных пропорциях... \nфильм делали люди, замечательно\
    \ представляющие себе, что такое блюзовая атмосфера... \nк созданию звукоряда\
    \ были привлечены выдающиеся деятели блюзовой культуры современности... \nпотрясающий\
    \ образ создала неповторимая Mable John... \nприятного просмотра, друзья... \n\
    проведите потора часа этого светлого выходного дня с семьей перед телевизором,\
    \ переглядываясь с женой в особых моментах и объясняя сыну, почему мужчина поступил\
    \ именно так, а не иначе в каких-то важных моментах... \nи в окончание, старая\
    \ болельщицкая кричалка - \n\nПусть твои уши услышат музыку! \nПусть твои глаза\
    \ увидят фильм! \nПусть твоя душа получит Блюз!"
