    text: 'за те многие сотни восторженных отзывов о бесподобном фильме Honeydripper,
      что вы не постеснялись прислать в личных сообщениях...

      тронут...

      бесконечно радостно за современное блюзовое киноискусство, что так глубоко трогает
      людские души до самых до пят...

      однако, меня не на шутку беспокоит отсутствие реакции от немногих нескольких
      из моей многочисленной аудитории...

      полнота внутреннего мира каждого для меня неимоверно важна...

      поэтому продолжаем...

      мы тут посоветовались с Mable John, - она подсказала, что по её мнению в моем
      предыдущем представлении фильма недостаточно освещена линия эротизма и взаимотношений
      полов в вышеозначенном фильме...

      в то время как в фильме эта линия вычерчена самым жирным фломастером и волнует
      своей монументальностью...

      поэтому исправляюсь...

      итак, на сцене бесподобная Mable John с номером - Бывают же женщины в пасторальных
      селеньях !...

      обязательно к прослушиванию тем особам женскаго полу, кто хочет иметь великую
      силу над мужским населением...


      I know a gal by the name of Mae Lou

      She shook it so much she had the German flu


      The women don''t like her, they call her Ida Mae

      But the way the men love her is a cryin'' shame


      http://www.youtube.com/watch?v=sKUV8Mu0rFY


      кому мало - еще вот...

      http://www.youtube.com/watch?v=7-u8xUZn1II'
