                      text: Блюз, Дима, - это вообще не музыка и не музыкальный стиль
                        никакой. Блюз - это, если хочешь, состояние души. А музыка
                        - это лишь форма выражения этого самого состояния души, то
                        есть блюза. Поэтому все разговоры о качестве звука, о гармониях
                        и т.п. - дело абсолютно пустое. И если кого-то в определенный
                        момент прет пить на блюзовом концерте водку с пивом или дешевый
                        виски, то это его полное блюзовое право, или танцевать, грязно
                        приставая к женщинам - все это его личный блюз. Представь,
                        что для кого-то в определенный момент жизни Devil's Got My
                        Woman Скипа Джеймса соответствует собственному душевному состоянию,
                        почему бы ему и не нажраться по этому поводу, например?
