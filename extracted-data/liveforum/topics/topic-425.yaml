      text: "Это фантастика. Они сработали великолепно, но не благодаря постановке\
        \ дела, а вопреки ей. \nОрганизаторам спасибо, что потратились и привезли\
        \ Лэма и Кингснейкс. Однако, каждым делом должны заниматься специально обученные\
        \ люди. Организаторы этих гастролей довольно странно все сделали. Началось\
        \ все еще утром, когда Лэм и переводчик пришли в программу Дата на ТВЦ. Лэм\
        \ играл и говорил, как следует, а переводил его транслятор настолько криво,\
        \ что крякнуть можно. Потом оказалось, что переводчиком был один из организаторов\
        \ концерта. Что, нельзя было профессионала пригласить? Захотелось в телевизоре\
        \ себя посмотреть? \nРекламы было недостаточно, цены на билеты безбожные.\
        \ Народу пришло пол-зала. Не жаловаться на звук мог разве что Пьер Безухов...\
        \ Ужасная работа. Тут обсуждать нечего. Я перед началом подошел к звукорежиссеру\
        \ и спросил, что за фирма ставит звук. Не раскрыл секрета. Это, говорит, вы\
        \ у организаторов спрашивайте, нам реклама не нужна. Правильно, мой маленький\
        \ зуав! Поделить бабки и прятаться, прятаться, как завещал великий Ленин.\n\
        Но на этой ноте не хочется завершать рассказ о впечатлениях. Все-таки это\
        \ был настоящий блюз и классное шоу."
