    text: 'Да... это было очень хорошо.... Но звук действительно оставлял желать лучшего.
      Но я не об этом...

      Удивило отсутствие большинства отечественных столпов губной гармошки,наверное
      причины были весьма веские.

      Был Братецкий, и был он в восторге!!!

      На меня произвело неизгладимое впечатление несколько моментов:

      Сам Paul Lamb - no comments... Певец Earl Green - великолепен!!!

      Бас-гитарист - великолепен!!! Барабанщик (хоть и плохо был подзвучен)

      это живая драм машина!!! Гитарист - вначале был скромен ,но потом дал шороху!!!

      Но для меня было важным другое - как они друг друга слушают и слышат!!

      При любом соло все остальные затихают!!! Наверное ,присутствующие заметили ,в
      одной из последних вещей гитарист лидировал и его проперло,так Paul Lamb мгновенно
      на это отреагировал и дал тому возможность кайфануть на полную....  I have got
      BLUES!!!!'
