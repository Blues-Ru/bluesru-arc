    text: "Был вчера (19.05.2004) на открытом джеме со Stainless Blues Band\". Звук\
      \ мне очень понравился. Не знаю может бывает и лучше, но такого звука на концертах\
      \ в клубах я не встречал.\n Сначала оценил как зритель, а потом поиграл и оценил\
      \ звук со сцены. Было хорошо слышно то , что играешь в отличие от некоторых\
      \ других клубов, где играть приходится \"вслепую\" или точнее сказать \"вглухую\"\
      . Так что очень даже недурственно!\n Отдельный респект Оксане Кочубей :-))))))."
