  text: 'Интересно узнать несколько моментов о Хендриксе.

    Почему свою сольную карьеру, ту что принесла ему мировую известность, он начал
    в Англии?

    Был ли он известен до 1966г. в США? Я имею знали ли что у Литтл Ричарда играет
    <b>ТАКОЙ</b> гитарист?

    Кто <s>первый</s> ранее играл за спиной, за головой, зубами как это мы видим у
    Джими? (мне думается, он эти шоу-элементы увидел у блюзменов. так ди это?)

    Был ли до Хендрикса распространен такой состав группы из трёх человек: гитара,
    басс, барабаны?

    А были ли когда нибудь (а есть ли) блюзовые группы состоящие из чернокожих? И
    ещё, я не знаю ни одной черной группы игравшей хард-рок. Кажись, что такой ваще
    и не было. Почему так?'
