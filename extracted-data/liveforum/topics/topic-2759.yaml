        резона бросаться в продюсирование. Судя по тому, что я читал, он просто влюбился
        в гитару Хендрикса и вел себя, как одержимый: хватал каждого встречного-поперечного
        и втюхивал ему, какого гениального гитариста он нашел. Ну а в Англию он повез
        ДХ потому, что  в там ему было проще сделать его знаменитостью. Все-таки,
        это была не коммерция, а энтузиазм чистой воды.

        2. ДХ играл у Сэма Кука, БиБиКинга, Айка и Тины Тернер и пр. Это высший уровень
