    text: "Hendrix уже славился среди музыкантов R&B в США до 66-го года.  Он уже\
      \ бывало играл за спиной и зубами (Вообще T-Bone Walker это первый делал, и\
      \ еще больше), хотя некоторые лидеры, с кем играл, не давали ему так баловаться\
      \ на сцене и отвлетать внимание от \"звезды.\"   Играл он действительно с Little\
      \ Richard, а также с Isley Brothers, King Curtis, и Curtis Knight.  \n\nБелые\
      \ Американцы пратически его не знали.  Chas Chandler - бассист в группе The\
      \ Animals - его слышал в США и убедил его переехать в Англию и перейти на рок.\
      \  Меня удивляет, в какой степени этот чисто коммерческий эксперимент удался!\n\
      \nЕсть один великий шедевр Little Richard с Jimi Hendrix на гитаре: I Don't\
      \ Know What You Got (But it's Got Me).  Его слушать просто обязательно для любого\
      \ любителя Американской музыки.\n\nMuddy"
    replies:
