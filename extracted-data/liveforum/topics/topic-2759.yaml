    deleted: false
    text: '1. В Англии - потому что в Штатах карьера не шла, а тут подвернулся англичанин
      Час Чандлер (см. The Animals), увидел Божию искру, и увёз его в Англию.

      2. Видимо, не слишком. И Литтл Ричард вряд ли требовал от него того, чем он
      стал впоследствии известен.

      3. Это всё штуки из арсенала старых блюзманов - Томми Джонсона, Чарли Паттона
      и др. Ти-Боун Уокер был знаменит подобными эскападами, есть много соответствующих
      его фотографий.

      5. Бадди Холли и Крикетс. Группа The Who (+ вокалист). Группа Cream.

      Опять же старые блюзовые команды играли в каком угодно составе - и по три указанных
      инструмента в том числе.

      6. Блюзовые группы изначально всегда состояли из чернокожих, начиная с Кэннон''з
      Джаг Стомперз, Мемфис Джаг Бэнд, Миссиссиппи Шейкс, Эстес-Рэйчел-Никсон и т.д.
      (1920-е гг.) Архетип блюзовой группы - бэнд Мадди Уотерса 1950-х гг.

