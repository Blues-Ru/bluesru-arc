    text: 'Английский человек и продюсер предложил ему хороший контракт.


      В США он был известен просто как один из тысящ сессионных музыкантов. Он играл
      у Айлиз, они были очень популярны.


      Дурака валяли многие, но он это делал с остервенением и злостью от алкоголя
      и наркотиков - ужасно.


      Таких составов было полно. И блюзовых, и фолковых и рок-н-ролльных.


      Что ты имеешь в виду под словом группа и хард-рок? Черный хард-рок - этот как?
      Джими вообще не играл никакого хард-рока. Фанкаделик играли хард-фанк. Те же
      Айлиз тоже.'
