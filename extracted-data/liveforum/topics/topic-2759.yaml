    text: "Свой знаменитый квакер Джими подсмотрел не у кого-нибудь, а у самого маэстро\
      \ Фрэнка Заппы! (Заппа использовал его гораздо раньше, правда я сомневаюсь,\
      \ что он его изобрёл).\n У Литтл Ричарда Хендрикс действительно играл, даже\
      \ вроди как бутлеги с такими записями существуют. А выгнал Литтл Ричард Хендрикса\
      \ (по слухам) за то, что Хендрикс был на Ричарда внешне немного похож, и на\
      \ одном из концертов одной из поклонниц Хендрикс дал автограф, представившись\
      \ Литтл Ричардом :-)))))\n А в Англии Хендрикс дебютировал скорее всего потому,\
      \ что то что он делал в то время было по духу ближе в Англии, чем в Америке.\n\
      \ Ну а игра \"за спиной\", \"зубами\" и т. д. - это всё больше кураж и шоу,\
      \ чем музыкальное новаторство :-))))) На гитаре разве что только фаллосом не\
      \ играли (а может я и ошибаюсь):-)))))"
