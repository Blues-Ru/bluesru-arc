          \  Попытка была со стороны достинуть славы и денег таким образом.  Интересно\
          \ еще, что не было до того момента примеров успеха по данному напралению.\
          \  На самом деле был очень рискованый ход.  \n\nНо слава Богу, что Хендрикс\
          \ поехал.  Оказалось, просто нужно было Хендриксу свое поле для проявления\
          \ собственной гениальности.  Перед смертью он уже переходил обратно к своему\
          \ родному R&B (и также джазу).\n\nMuddy"
