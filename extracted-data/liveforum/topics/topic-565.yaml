      text: "Запись пройсходила в Англии у меня в маленькой домашней студии, Папа\
        \ Джордж - довольно известный Лондонский певец и гитарист - играет как рок-блюз\
        \ в трио так и акустик (National Steel) как соло артист http://papageorge.co.uk.\n\
        Кэн Эммерсон - американец живущий на Гавай, был учеником знаменитого Боба\
        \ Брозмана (США)на ботл нэк, а также играет на гавайской гитаре http://www.kenemerson.com/home.html.\n\
        \ Папа и Кэн профи, зарабатывающие кусок хлеба постоянными гигами и гастролями.\
        \ Скоро выложу вторую запись Джорджа The Station - настоящй блюз.\nА я на\
        \ самом деле не Иван, хотья на половину Иванов (с материнской стороны)а на\
        \ другую половвину я \"черный\" и мы с вами дорогой Док давно переписывались\
        \ по мейлу - вы иногда мне свой гиг лист присылали и приглашали на концерт\
        \ (жаль не мог присутствовать) так что проверь\nМыло!\nНу до скорой на форуме,\n\
        Ваш \"Иван\""
