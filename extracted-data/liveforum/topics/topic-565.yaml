  text: "На новый год зашли в гости гитаристы Папа Джордж и Кэн Эммерсон, притащили\
    \ никелированные гитары из желтой меди производства 1928 года.\nЭти гитары пользовались\
    \ огромной популярностью у старых блюзменов потому что были в два раза громче\
    \ чем \"деревяшки\", стоили они дешевлее и не ломались при транспортировке и драке.\
    \ \n  Мы экспромтом записали песню Папа Джорджа и с его согласия предлагаю вам\
    \ короткую (1,2мег. 128b)Mp3 версию на обсуд (пишите пожалуйста).\n  Любители\
    \ акустического слайда и хорошего вокала получат огромный каиф.\nМр3 скачать здесь\
    \ :\nhttp://www.geocities.com/drikasblues/XMAS.mp3"
