    subject: Мой «БЛЮЗ.РУ - 2004»
    deleted: false
    text: "Вот, сходил таки в Б2, хоть и до последнего сумлевался в нужности подобного\
      \ шага. И что же?  Да ничего, в целом понравилось, за исключением маленьких\
      \ НО. Последовательно рассказать что же там было не получится, ибо две сцены,\
      \ всё в каше: музыка, лица, .. напитки. Но надо всем довлел блюз. КСП вот не\
      \ удалось увидеть :( А уж так хотелось! Наверное, всему виной беготня между\
      \ сценами, вот и пропустил невзначай. Кстати, в иные моменты казалось, что народу\
      \ понабежало весьма порядочно. И в одном зале, и в другом. И, что бы не говорили\
      \ скептики, праздник, как мне кажется, удался :)\n\nИтак, поехали. \n\n«Louisiana\
      \ Jumping Cats» (большой зал). Неразбериха с расписанием (19:00, 20:00, 21:00,\
      \ ..) привела к тому, что пришли мы с более чем получасовым опозданием и попали\
      \ лишь на конец их выступления. Скепсис по поводу этого коллектива мгновенно\
      \ испарился. У них всё оказалось чётко и серьёзно. Очень приличный вокалист,\
      \ да и Володя Русинов – молодчина.\n\nАлик Микоян & «Серебряный рубль» (большой\
      \ зал). Пожалуй, с их выступления то и началась моя нелюбовь к ударным. Очень\
      \ гулко, бумкно, временами неразборчиво (Виноваты не музыканты, а акустика и\
      \ звукреж. Интересно, так всегда в Б2?). Микоян играл и пел обычно. Это не хорошо\
      \ и не плохо. Это никак. Одним словом не понравилось. А ведь когда-то в ЦДРИ\
      \ на одном из первых харп-фестов я от Микояна просто конкретно протащился.\n\
      \n«Ragtime» (большой зал). И опять ударные подкачали. Всё остальное как всегда\
      \ на уровне. Однако, впервые присоединяюсь к существующему мнению, что Арсен\
      \ техникой перекрывает всё. Иногда слишком всё. \n\n«Svet & Al Boogie Band»\
      \ (Cool Train). Стильно играют, вкусный звук, всё на месте и при них. Но всё\
      \ же из трёх раз, что мне их удалось послушать (Очаково, Поиск предмета и здесь\
      \ на фесте), домашняя обстановка крошечного «Поиска премета» лучше всего оттеняет\
      \ ребят.\n\nАлексей Аграновский & «Чёрный хлеб» (большой зал). Первый коллектив,\
      \ сумевший зажечь слушателей. Харизма Доктора делает то, что не могут сделать\
      \ ни техника А.Шомахова, ни сыгранность «Blues Makers». Правда, всегда приятнее\
      \ слышать Дока на более низкой (по высоте ;)) сцене. Ближе к народу получается,\
      \ что ли. А, ещё вот что: Евгений Немов вновь выступал в составе ЧХ. Не знаю,\
      \ снова насовсем, или в качестве сессионного гитариста.\n\nДоктор Аграновский\
      \ & «Blues Spinners» (Cool Train). Они как всегда более вальяжные и заводные,\
      \ чем ЧХ. Но кассу сделала Алёна Иванова. Это, безусловно, находка Дока. Третий\
      \ раз слышу, и третий раз балдю ;)  Однако, в этот раз крен был сделан в сторону\
      \ ретро-хитов  не совсем блюзового толка, что, впрочем, звучало очень стильно.\
      \ Может, это что-то из JVL-вской программы Алёны?\n\n«Big Blues Revival» (большой\
      \ зал). Слышал впервые. Какое-то странное осталось ощущение. Вроде всё нормально,\
      \ но чё-то всё равно не так. Шансонность (блатота, иначе) порой перекрывает.\
      \ Смотрел на их фронтмена и не мог отделаться от мысли, что вот, дескать, на\
      \ сцене почти что Шнур из «Ленинграда». Но в принципе интересно было, конечно,\
      \ весело так зажигали.\n\nЮрий Каверкин & «Wrong Way Band» & Михаил Владимиров\
      \ (большой зал). Имхо, одно из лучших электрических выступлений группы. Очень\
      \ сочно, тяжело и одновременно мрачно и легко. То, что надо. Неожиданно не только\
      \ для меня на сцену с WWB вышел Миша Владимиров, удачно вписавшись в достаточно\
      \ специфическую манеру игры Юрия. А, может быть, .. гм.. впрочем, ладно :)\n\
      \nНиколай Садиков & «Blues Hammer Band» (большой зал) Неожиданно для меня самого\
      \ Николай со своей группой в моём личном топе поднимаются всё выше и выше. Третье\
      \ (для меня) их выступление, и всё круче, и круче. Красивый сет. Яркий. Хочу\
      \ ещё :)\n\nЕкатерина Сомова & «Blues Doctors» (Cool Train). Слышал обрывки.\
      \ BD крепкая средняя команда. Играют то, что надо. В общем-то понимают то, что\
      \ играют, но как-то грязновато немного, что ли. Зато вот Екатерина Сомова резко\
      \ освежила всю палитру. Тоже был у меня в отношении неё какой-то не основанный\
      \ ни на чём скепсис, рассосавшийся после первых же тактов. \n\nОксана Кочубей\
      \ & «Life- n- Joy» (Cool Train). Второй раз за последнее время слышал новый\
      \ оксанин проект. Что можно сказать, инструментально очень резко пошли в гору.\
      \ Появилась резвость, прыгучесть, нет, вот слово ещё лучше, «упругость» в игре,\
      \ и сразу драйв перешёл в какое-то совсем иное качество: в серьёзное, во взрослое.\
      \ Сама Оксана, было заметно, что сильно подустала (фестиваль длился уже не один\
      \ час, а Оксана ведь не будет самой собой, если будет спокойно сидеть в уголочке,\
      \ ожидая своей очереди). Короче, вначале была какая-то нервозность, которая\
      \ к середине сета ликвидировалась и всё стало тип-топ.\n\nScolder Blues (+ Николай\
      \ Арутюнов) (большой зал). Удалось послушать всего парочку вещей. Наряду с Садиковым,\
      \ для меня это ещё одно открытие последних месяцев. Вот, вроде и слышал их до\
      \ этого, но не пронимало. Зато тепе-ерь! Кстати, на басе со SB играл\nДмитрий\
      \ Честных. Во, как бывает! На одну вещь спеть со SB вышел фанкер Арутюнов, но\
      \ как бывает почти всегда, когда он выступает не со своим коллективом, выглядел\
      \ неинтересно."
