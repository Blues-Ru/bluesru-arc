  text: 'Ну вот и состоялось....

    Трудно что-то сформулировать (после 2,5 часов сна),но попробую как-нибудь выразить
    свои эмоции.В целом наглядно видно как прогрессирует российский блюз( и что там
    не говорили всякие злопыхатели). Все это наглядно показал вчерашний фест. Выделю
    только наиболее мне понравившихся

    Первыми выступали Louisiana Jumpin'' Cats и на удивление они очень сильно меня
    порадовали. У ребят будущее...очень замечательный вокалист (сильный голос с хорошей
    модуляцией)и Володя Русинов при деле. Ragtime - no comments!!! Мастерство ребят
    прибывает в арифметической прогрессии, обновился ритмический рисунок (меньше стало
    вещей с тяготением в фьюжен, но и новые ритмичные вещи очень граммотно и виртуозно
    сыграны). Арсен -молодец!!!!!

    Док как всегда зажег ....откуда-то в зале появилась лысая пластичная гетера (наверное
    из Доковского фэн-клуба) и стала выделывать такие зажигательные танцевальные па,т.ч
    многие пустились в пляс. Сколдеры тоже порадовали. Слава Бородин настоящий фронтмен.И
    как он только успевает дудеть в сакс и задушевно вокалить....загадка.

    И в самом конце (где-то около 2-х ночи) Блюз Докторс... вот он печальный удел
    молодых настырных провинциальных команд. Играть в опустевшем зале.Но Володя справился.....

    Усееее.....голова падает на клавиатуруууу (сил совсем нет).

    Один минус - плохая реклама и неурочное время (середина рабочей недели). Итог
    народу было неслишком много, а может оно и ...'
