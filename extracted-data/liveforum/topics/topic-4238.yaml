  text: '<a href="http://mp.stroi.ru/detail.aspx?id=9520d6eb-f259-4ac5-a05e-177cd7637e03"
    target="_blank">Озарение Московской перспективы</a>:


    Да, творчество Александра Сергеевича настолько разно­образно и всеобъемлюще, что
    каждый находит в нем свою истину. А еще Пушкин всегда современен. Его стихи легко
    становились романсами, вливались в оперную арию. Его проза, как впрочем и поэзия,
    неисчерпаемо кинематографичны. При желании пушкинские стихи можно пропеть в ритмах
    современного рока и даже негритянского блюза. Попробуйте: «Уж по Тверской возок
    несется через ухабы…»'
