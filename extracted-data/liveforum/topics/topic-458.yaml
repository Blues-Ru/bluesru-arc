  text: "начало фильма:  \n\nчерно-белые кадры, россия, осень, грязь по колено, проселочная\
    \ дорога. \nв качестве музыки - перебор аккорда Am на нестроящей гитаре. \nмолодой\
    \ михаил круг выходит держа наперевес шиховскую акустику на \nперекресток. мимо\
    \ проползает гусеничный трактор... \nтракторист с интересом смотрит на юного музыканта...\n\
    \nсцена 1:\n\nглавный герой фильма - студент московской консерватории по классу\
    \ гитары \nЖеня Барбер - худощавый мальчик в очках из интеллигентной еврейской\
    \ семьи.\nКомната закиданная нотами, из магнитофона играет Владимирский Централ,\
    \ \nженя с классической гитарой alvarez в руках сидит и подыгрывает.\n\nсцена\
    \ 2:\n\nЗачет в консерватории. Студенты по очереди выходят на сцену и исполняют\
    \ \nклассические произведения. Выходит Женя, играет \"шутку\" Баха, в качестве\
    \ коды \nиспользует мотив песни гоп-со-смыком. Преподаватель подзывает его к себе\
    \ и \nчитает ему нотацию, говорит что шансон это не музыка и надо родиться в тюрьме,\
    \ \nа в 14 лет попасть в детскую колонию. Только так можно по мнению данного \n\
    преподавателя играть настоящий шансон.\n\nсцена 3:\n\nЖеня Барбер идет по переходу\
    \ метро на станции Китай Город и вдруг обращает внимание \nна бомжистого вида\
    \ переходного музыканты, который играет на гармони и поет песню \n\"Таганка\"\
    . Женя Барбер подходит к музыканту и спрашивает \"неужели вы тот самый Борис \n\
    Федоров который играл в те годы вместе с Михаилом Кругом?\". Бомжара отвечет:\
    \ \"да, я \nБорис Федоров\", я научу тебя играть песню мурка, если ты поможешь\
    \ мне выбраться отсюда.\n\n\nсцена T:\n\nГерои фильма в г. Владимире стоят у стен\
    \ исправительного заведения, Борис говорит: это \nтот самый Владимирский централ\
    \ про который пел в своих песнях Михаил Круг.\n\n\nсцена M:\n\nПокупка гитары\
    \ пр-ва шиховской мебельной фабрики в промтоварном магазине на станции Александров\
    \ владимирской ж/д\n\n\n\nсцена N:\nмного городов.... много женщин... но я знаю\
    \ одно - ты хорошо играешь мурку, парень....\n\n\nсцена Z-1:\n\n\nБоря Федоров\
    \ и Женя Барбер выходят на перекресток, к ним подходит \"диавол\" - матерый уркан,\
    \ весь в наколках. \"че, фраера, на рамс приканали?\"\n\n\nсцена Z:\n\nсоревнование\
    \ в гитарной игре: в качестве гитариста со стороны \"диавола\" - виктор зинчук.\n\
    Стандарт для импровизации \"мурка\".\n\nВ качестве вступительной фразы на первые\
    \ 2 такта мурки зинчук использует полет шмеля, сыгранный \nза 5 секунд.\n\nавтор\
    \ - shtein"
