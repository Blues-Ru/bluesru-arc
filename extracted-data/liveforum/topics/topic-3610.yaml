            subject: Loseless compression
            deleted: false
            text: Есть алгоритмы сжатия цифровой музыки без потери качества, основанные
              на дифференциальном кодировании, использует то, что "синусоида" "непрерывна",
              можно хранить разницу между семплами и кодировать ее меньшим числом
              битов. Алгоритм есть в рар-е, называется "multimedia compression". Есть
              еще специализированные программы для паковки - Monkey Loseless Audio
              Compression, а также что-то еще. Нужно для хранения или пересылки аудио
              без потери качества. Вместо 600 мег можно переслать, например, 350.
            replies:
            - id: 32117
              parent_id: 32114
              date: 2007-04-05 11:52
              poster: Старый Майор
              email: gypsy@mail.ru
              subject: Это немножко другое..
              deleted: false
              text: 'Эти алгоритмы предназначены для сжатия исходного музыкального
                сигнала например с CD. Поскольку MP3-кодирование само вносит щум,
                то особого выигрыша не будет - это все равно, что сначала перевести
                качественную цифровую картинку в JPG процентов 60% качества, а потом
                ещё дальше ужимать. Руслан правильно заметил, что записи бывают разные.

                Я понимаю, что Эльдар борется за байты в пользу собственного времени
                и кошелька, но в силу природной человеческой лени никто не будет сильно
                напрягаться по поводу применения оптимальных алгоритмов сжатия.

                Так что беседа носит сугубо теоретический характер.'
