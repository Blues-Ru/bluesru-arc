          text: 'Я обратил внимание, что в некоторых перацких сетях музыкальные архивы
            хранятся с расширением .7z. Недолгие поиски показали, что это формат программы
            7-ZIP. На некоторых форумах авторитетные люди пишут, что он лучший именно
            для музыки, причем до 10%

            Этот формат, кстати, поддерживается WinRARом - см. Параметры > Установки
            > Интеграция. И вроде бы даже поддерживается в обе стороны - те на чтение
            и запись. Самому проверять лень. Интересующихся отсылаю к сайтам по теме:

            www.7-zip.com

            http://www.computerra.ru/gid/raznosoft/306956/

            http://www.compression.ru/arctest/self/7-zip.htm'
