            subject: Я думаю всё зависит от конкретной записи
            deleted: false
            text: Сжатие разных .mp3 файлов в архиваж происходит по-разному видимо
              из-за разной сложности структуры звука. Например то же сжатие в .mp3
              разной музыки происходит по-разному. Современные цифровые записи сжимаются
              довольно сносно, но вот старые записи с винила сжимаются с очень сильно
              ощутимой на слух потерей качества, очевидно из-за того, что старые аналоговые
              записи имеют более "хаотичный" спектр, который плохо поддаётся структурированию.
