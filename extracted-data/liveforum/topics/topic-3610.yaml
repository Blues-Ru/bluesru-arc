  text: "Наконец-таки я скачал Kenny Wayne Shepherd - 10 Days Out (Blues from the\
    \ Backroads), лежит здесь:\nftp://share.bluesforum.ru/music/Kenny_Wayne_Shepherd/KWShepherd2007.rar\n\
    <b>Большое спасибо В.Русинову за то что выложил этот альбом.</b>\nОчень многое\
    \ стало интересно об этом диске: \nГде и как записывался это альбом? Некоторые\
    \ вещи записаны с концерта, на некоторых использованы старые записи.\nКто принимал\
    \ в записи из Howlin' Wolf Band кроме Hubert Sumlin. А также из Muddy Waters Band\
    \ кроме Pinetop Perkins?\nДа и вообще, все кредиты с альбома, кто его записывал.\n\
    Кто изображен на обложке диска? Например, второго справа белого дедушку в шляпе\
    \ я не признал...\nНе подскажите ли где можно об этом почитать?\nИ ещё вопрос\
    \ Володе Русинову.\nХочу спросить об этом так как вопрос о размере файлов весьма\
    \ не простой для меня: у меня модемное соединение (max speep 5-6 Kb/sec)\nСкачав\
    \ весь этот архивный файл (размер - 191,4 Mb) я с удивлением обнаружил что архив\
    \ упакован в ВинРаре с нулевым сжатием (т.е. ничего не сжато, как было 100%, так\
    \ и осталось 100). Я упаковал теже файлы максимальным сжатием в ВинРаре, получился\
    \ файл размером 158,5 Mb (86% от начального размера).\nА почему был выбран именно\
    \ такой способ сжатия? Есть ли в этом смысл?"
