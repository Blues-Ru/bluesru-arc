    text: '10 Days Out (Blues from the Backroads)

      Kenny Wayne Shepherd

      Reprise / Wea


      Легче верблюду пройти сквозь игольное ушко, чем симпатичному блондину-гитаристу
      получить признание у любителей традиционного блюза. Спустя 12 лет после выпуска
      дебютного альбома Кенни Уэйн понял, что не обязательно идти напролом. И записал
      альбом из дуэтов и трио с подлинно блюзовыми ветеранами. Есть совсем редкие
      имена. Как не печально, за два года, прошедших с начала работы над альбомом,
      шестеро из них ушли к праотцам. Но жизнь продолжается. Главное достоинство альбома
      в том, что теперь есть ответ на вопрос: "Что порекомендовать начинающему любителю
      блюза?". Именно это! Тут есть и оргазмическая пулеметная стрельба из электро-гитар,
      и домашние посиделки с акустикой на кухне (буквально!), и все, что существует
      в блюзе меж этих границ. А БиБиКинг доблестно записал еще один вариант "The
      Thrill Is Gone", слушать который не скучно ни знатокам, ни неофитам.'
