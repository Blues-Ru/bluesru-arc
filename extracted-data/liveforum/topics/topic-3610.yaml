          text: 'Ошибки тут нет. Я сжимал одни и теже файлы, ничего не потерялось.

            Обратите внимание: я сжимал одно и тоже в RARе (без сжатия) и в ZIPе (Обычный
            (по умолчанию)), а размеры получились разные: в Зипе 87% от исходника.

            Я снова перепроверил: то же самое. Даже попробовал сжимать отдельные,
            единичные мп3 файлы из ЭТОГО архива: результат: сжимается да 85-88% от
            исходного размера.

            Даже и не знаю почему это так происходит, но это так. Попробуйте сами
            сделать с файлами из ЭТОГО же архива.

            Мейби это както связано с тем что битрейд у этих файлов 320 Kb/s - самый
            максимальный (т.е. минимальный формат сжатия в самом мп3), что, наверное,
            и позволяет архиватору "дожать" файлы. Хотя вот только что я сграбил с
            CD трэк с битрейдом 320 Kb/s и сжал его. Сжалось до 98% - почти ничегось...
            Ну, не знаю, может В.Русинов использовал какой-то специальный метод сgrabливания
            который позволяет файлам ТАК сжимться в архиве...

            А вот про <i>rar поддерживает "мультимедия"-сжатие для несжатого CD-Audio
