  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70312211905221638&sql=Al4ue4j170wai


    Это первый из двух альбомов БиБи, записанный вместе со знаменитыми Crusaders (в
    60-х Jazz Crusaders). Правильный выбор, наверное; никто лучше их не играет сплав
    джаза, блюза, фанка и южного соула. Уникальное звучание ритм-секции и отличные
    солисты плюс целая когорта звездных сессионных музыкантов. Даже странно, что оба
    эти альбома записаны только на Кинга; это больше похоже на The Crusaders featuring
    B.B. King, настолько характерно их звучание. Оценка 5 баллов. 7 великолепных треков!
    Мне даже трудно выбрать лучший. Мне очень нравится I Just Can''t Leave Your Love
    Alone в новоорлеанском стиле. Только не ищите блюза на этом диске...'
