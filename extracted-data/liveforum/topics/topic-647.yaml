    text: "Место довольно ужасное. Но это нормально - все начинают играть в ужасных\
      \ местах. Один мой знакомый, также слушавший ребят вчера, заметил, что эта каменная\
      \ кишка напоминает ему \"Пещеру\" в Ливерпуле, где выступали Битлз. Сейчас там\
      \ водят туристов. Что же, задача ясна - превратить поляну в музей. В ясную,\
      \ так сказать, поляну. Что для этого нужно? \nСначала о том, что не нужно. Как\
      \ мне кажется, врядли стоит исполнять всё, что нравится всем членам группы,\
      \ и блюз, и Криденс, и Металлику. Если вы слушаете разную музыку, лучше сразу\
      \ разбрестись. Неплохо бы играть тише. Нехудо бы делать саунд-чек, а то в начале\
      \ вокальный микрофон выдавал военный ультразвук, от которого разбегались девушки.\
      \ Наконец, не надо на свои концерты звать таких персонажей, как тот пьяный молодой\
      \ человек в тельняшке, который шатался по бару. Он явно не с улицы пришел.\n\
      Теперь про плюсы. Мне понравилась группа. Вокал и бэк-вокал хороши. А это самая\
      \ сложная история. Несколько вещей были блюз. Наконец, самое главное - у ребят\
      \ есть following, зал был полон молодежи, которая давала настоящую поддержку.\
      \ Вот такие впечатления."
