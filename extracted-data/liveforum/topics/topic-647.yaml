  text: E-mail ты свой не читаешь, так что решил сунуть тебе сообщение сюда. Был я
    вчера на твоём концерте, правда, опоздал маленько (не разглядел название станции
    метро и вначале поехал не туда). Мне не понравилось, как люди воспринимают Блюз.
    Особенно последний номер (AC DC "Ride On"). Конечно, это их дело и концерт, я
    так понял, для этого и был устроен. Но воспринимать Блюз как развлекательное слушево
    (извините за термин можно сказать "Pulp Listening") это не то. А так, если бы
    не отвратительная аккустика помещения, если бы не чрезмерно усиленый звук, и не
    духота, всё бы было просто ништяк (в хорошем смысле этого слова)
