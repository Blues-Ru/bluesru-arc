    text: "Я так пойду на Baobab Orchestra. это совсем не \"блюз\", но после баобаба\
      \ значения таких малопонятных слов как \"свинг\" \"грув\" \"ДРАЙВ\" \"раскачка\"\
      \ как то сразу становятся ясными. Понятно откуда у латинской музыки ноги растут,\
      \ как в африканской музыке отсутствует сильная доля и все такое, насколько у\
      \ белых людей нет ощущения ритма но все наши генетические корни - из африки\
      \ и насколько они способны проснутся.\nТипа - учебник. Настоятельно рекомендую.\
      \ \nа блюз... Если считать что корни блюза уходят в - Мали-Сенегал, то думаю,\
      \ всем блюзменам нужно идти просто в обязательном порядке. Приобщатся так сказать."
