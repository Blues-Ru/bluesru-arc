          deleted: false
          text: "Вот недавно, пишу одного очень известного саксофониста, \"колтрейниста\"\
            , заснул немного, когда проснулся говорю - типа так и так, в предпоследнем\
            \ квадрате, в 3-м такте неудачно фразку сыграли. Ну и он так точно же\
            \ и сказал, - Во С..чъ, все замечает. \n\nКсения Собчак - Культовый персонаж\
            \ ДБД (Духовно богатая Дева), ведущая реалти порно-шоу, похожа не фернанделя\
            \ или точнее - на лошадь, в пении блюза не замечена (пока). В сообществе\
            \ ДБД - предмет поклонения и обожания (и подражания). Дочь известных политических\
            \ деятелей. Говорят, что воспитывалась на коленях у самого ВВП, но врут\
            \ наверное."
