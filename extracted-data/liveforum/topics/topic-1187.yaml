  text: 'Срочно разыскивается гитарист, способный подыграть на акустике композицию
    Led Zeppelin "Bron-Y-Aur Stomp". Мы должны были исполнять эту песню на фестивале
    Zeppomania''03 (www.ledzeppelin.ru), но в последний момент остались без гитариста.
    Фестиваль будет проходить по адресу: м. Чертановская, ул. Чертановская, д. 1 В,
    корп. 1  в эту пятницу, 30 мая, но для талантливого гитариста выучить материал
    в такие сроки - не помеха, ведь правда? Пожалуйста, помогите, а то номер придется
    выкидывать из программы…

    Связаться с нами можно по адресу moonlitval@mail.ru

    Фестиваль ожидается совершенно грандиозный, и Вы, естественно, сможете попасть
    на него бесплатно в качестве участника, послушать класснейшую музыку, участникам,
    кроме того, положено бесплатное пиво и реклама в СМИ (обязуемся включить информацию
    о Вас в статьи, которые выйдут после фестиваля).

    Мы очень ждем Вашего отклика!

    С уважением,


    Наталья и Евгения (группа "Moonlit Valley")'
