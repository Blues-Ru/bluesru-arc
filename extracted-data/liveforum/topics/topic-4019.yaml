  text: Совсем немного времени осталось до проведения больших фестивалей - ПУСТЫЕ
    ХОЛМЫ и УСАДЬБА-ДЖАЗ. Должен сообщить что Дом у Дороги принимает в них непосредственное
    участие. На "Холмах" мы устроим наш выездной ресторан и всячески будем поддерживать
    НАШИХ БЛЮЗОВЫХ музыкантов, а сам БЛЮЗОВЫЙ ДЕНЬ состоится 14-го июня. А вот на
    "Усадьбе" мы представляем блюзовую программу 13-го июня с 16-ти до 18-ти часов.
    Представлять НАШ блюз В Архангельском будут группа BLUES DOCTORS(Екатеринбург)
    во главе с Владимиром Демьяновым, Вадим Иващенко & BONE SHAKERS и THE KINGSIZE
    Омара Итковичи. Кроме того для НАШИХ ГОСТЕЙ фестиваль УСАДЬБА-ДЖАЗ любезно предоставил
    входные билеты со ЗНАЧИТЕЛЬНОЙ скидкой, купить их можно непосредственно у нас
    в "ДОМе".
