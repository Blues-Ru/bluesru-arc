  text: 'Вчера в Нэшвилле состоялась церемония вручения CMT Awards - одной из важнейших
    в кантри-музыке наград. Вел церемонию зажигательный Кид Рок. Практически всю церемонию
    он "бесился" и развлекал публику как мог. С особой нежностью он встретил только
    Шерил Кроу, которая открывала концерт - и они даже станцевали медленный танец.


    <b>все объяснил Кид Рок: по его мнению, хип-хоп и кантри родственные жанры, так
    как оба этих направления имеют один корень - блюз.</b>


    <i>Почерпнуто тут: http://spletnik.ru/showbiz/26447-cmt-awards-pobediteli-i-gosti.html</b>'
