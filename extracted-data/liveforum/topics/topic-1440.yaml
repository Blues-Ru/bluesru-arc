  text: 'Из-за особенности форума, недоговоренная тема ушла вниз, поэтому простите,
    но я открою новый топик.

    Там Дима Казанцев писал, в контексте беседы о блюзовых ДВД:

    "еще есть что-то про Роберта Джонсона и главный там Джон Хаммонд; знаешь такой?"


    Я знаю, что есть фильм The Search for Robert Johnson, рассказывает там действительно
    Джон Хаммонд. Фильм говорят неплохой, но мне он в наших магазинах не попадался.
    У меня он стоит в очереди на заказ в амазоне.

    Вот ссылка: http://www.allmovie.com/cg/avg.dll?p=avg&sql=1:43367


    А вот еще в Легионе видывал я ДВД Blues Masters, это та передача, где рассказывает
    Колин Джеймс, и там же показано много архивных материалов. Рекомендую, хоть сам
    фильм и небольшой - на 40 минут.'
