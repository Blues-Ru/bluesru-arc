        subject: Советую проверить настройки IE
        deleted: false
        text: "У меня лично никаких проблем не наблюдается. Рекомендую проверить настройкие\
          \ Эксплорера, смотри тут: http://gypsy.bluesman.ru/ieSettings.gif. Если\
          \ раньше стояло \"Never\", то проблема в этом, хотя должно было лечиться\
          \ принудительным рефрешем.\n\nМожно попробовать поставить \"Every visit\
          \ to the page\". \n\nЕщё один источник возможных проблем - настройки прокси-сервера\
          \ у твоего локального провайдера, если подключение идёт через прокси, но\
          \ тут медицина бессильна."
