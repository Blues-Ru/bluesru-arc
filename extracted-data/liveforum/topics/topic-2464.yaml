        ни  Ctrl+R, не помогают.

        Иногда (кажется) помогает пойти по ссылке http://www.blues.ru/forum/?id=0&page=0

        Уже 1,5 месяца этого нет, правда, пару дней назад было один раз. А до этого
        месяца два стабильно была такая фигня.

        Что бы хоть заголовки новых сообщений увидеть я загружаю страничку с помощью
        FlashGet''а (по ссылке http://www.blues.ru/forum/).

        И так не только у меня: у Сергея Бабаева так же. Он очищает папку Temporary
        Internet Files и затем открывает страничку. тогда всё нормально.

        Что в такой ситуёвине надо делать?

        И ещё: иногда (вне зависимости от того какая Виндоуз) страничка загружается
        в кодировке Турецкая (Windows).

        Может это как-то с нашим Интернет провайдером связано?'
