  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDSUB040311250730130433&sql=Aa1w67ur0h0ja


    Казалось, что после дебюта Оллманов ничего не может быть лучше. Но это не так.
    Группа не стала закреплять успех тяжелого звучания первого альбома и двинулась
    в сторону развития и расширения звука. На втором альбоме группы появилось больше
    акустики, фолка, госпела, группового пения; композиции стали еще интереснее. 7
    треков на полчаса. Полчаса полного кайфа! Главный хит Грегга тоже тут - это Midnight
    Rider. Что тут можно выделить? Проще написать что можно не выделять. Кроме Hoochie
    Coochie Man все треки просто супер! Группа не просто классно играет, но и пишет
    великолепные песни и темы. Инструментальная In Memory Of Elizabeth Reed - шедевр!


    Оценка 5 баллов и это ЛУЧШИЙ альбом группы!


    I gotta run to keep from hiding and I''m bound to keep on riding, I got one more
    silver dollar, but I ain''t gonna let them catch the midnight rider...'
