  text: 'М. Мишурис- как много в этом звуке...

    Все постсоветское блюзовое пространство должно быть благодарно ему и кланяться
    в ноги его...

    ибо подвижник...

    блюза...

    ога...

    до Кишинева, Минска, Киева доезжал самолично...

    дал прекрасную возможность услышать, увидеть, почти дотронуться до гитары хорошего
    правильного мастера Дениса Шевченко...

    кроме того, Мишурис XXL-ы собирает...

    трубы в блюзе - это красиво, да...

    кроме того, кларнет в блюзе...

    тоже дело рук Мишурисовых...

    опять же Хаммонд...

    в общем правильно всё, хорошо...

    уважения достоин человек...


    и лишь одно Но!...

    это голос его - невнятный, глухой  не понимающий до небес...

    при всем уважении к персонажу, но истина дороже...

    и таки один вопрос к аудитории - отвыкать ли мне от стандартов вокала John Boutte
    или таки нет ?...'
