  subject: Vidar Busk и вообще о жизни
  deleted: false
  text: "Вот это да....\nПусть говорят что в Форте был еще более сильный концерт.\
    \ Но это же все равно просто другое измерение... \nМожет и звук гитары был в начале\
    \ глуховат и Буск разошелся вовсе не с первых вещей, но... Когда все это пошло\
    \  - чувство, драйв и вся энергетика стали просто невероятными... Нет.. ну  я\
    \ слышал не хуже.. это был не первый раз.. но это было совсем не тут, совсем не\
    \ москве..  Хотя .. это дело не все .. хехе.. и там находят.. \n\nВообщем когда\
    \ концерт кончился ничего кроме желания услышать еще и еще не оставалось. Кстати\
    \ для информации всем кто не знает...\nна бис в Европе (как минимум) вызывают\
    \ не только дружным хлопаньем, но и скандированием WE WANT MORE -  WE WANT MORE.\
    \ Говорю два раза, чтоб в следующий раз  не кричать уже как дураку одному. \n\n\
    Как он играет на гитаре... Чего он только не имеет в своем гитарном словарном\
    \ запасе :) Но! (attention) кроме знания самих этих слов, фраз.. , как и когда\
    \ он их говорит!! 10  минут идет одна только гитара, одна гитара, но нет никакого\
    \ ощущения недостаточности, а только наоборот - полноценный нескончаемый  поток\
    \ настоящей музыки.\n\nИспользование семплера и вообще разных стилистических смесей\
    \ и сдвигов - также потрясает. Вообще не проходит ощущение того, что была то получена\
    \ вовсе не затертая программа, а свободный полет музыки и воображения сильно перекрывающий\
    \ тот список вещей, что лежал  под ногами Буска. Сразу видно, что у такого музыканта\
    \ небывает одинаковых концертов.\n\nВот я вам это все пишу, и могу еще многое\
    \ написать, ибо поток моего сознания, вызванный таким сильным стимулирущим как\
    \ настоящая музыка,\nничуть не слабее, но ведь как известно и не все ушли довольными,\
    \ а ктото и не пришел. Друзья - open your mind - возможно это оказалось несколько\
    \ большим чем вы можете/хотите воспринять, может у вас еще какие мотивы, но вместо\
    \ того чтоб остаться недовльными, вы имели шанс научиться очень многим вещам сегодня,\
    \ очень многим и важным... никакой замкнутый мир московских блюзовых клубов/джемов\
    \ или даже самая обширная коллекиция ЦД и винила не научит вас этому. Конечно\
    \ это все тоже ценно.. все.. но кроме замкнутости. Но ведь тех, вещей что были\
    \ на концерте, не делает тут никто. И не сводите это на уровень конкретики - это\
    \ вопрос отношения и свободы сознания и отношения к тому что делаешь... \nВпрочем\
    \ вам может показаться, что все это знаете, что сегодня видели.. а хрен вам..\
    \ ничего вы такого не знаете.. \nБудте свободнее и честнее и шансы у вас еще возможно\
    \ появяться.. иначе же ... так ничем и кончится.\n\nЕсли обратиться к тексту,\
    \ может показаться, что я оставил много места на выводы, уйдя от самой темы. Ну\
    \ так фиг - я не ушел - главная тема -свобода мышления и честность - только такое\
    \ отношение порождает настоящие исскуство в любой области и одно из доказательств\
    \ этому все еще находится  в Москве. :)   \n\nОчень грустно одно - мааллооо...\
    \ надо еще.. надо больше. И не только Буск, побольше настоящей музыки. побольше...\
    \ а то, как известно, решений у такой проблемы есть только два...\n\nТем кто дочитал\
    \ доконца и понял:\n   спасибо :) мы еще встретимся.\nТем кто дочитал и не понял:\n\
    \   это правда осмысленный текст,\n   хотя вам может так и не показаться.\nТем\
    \ кто не дочитал:\n   да и пошли вы. :)"
