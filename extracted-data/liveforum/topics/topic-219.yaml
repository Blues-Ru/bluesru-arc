        претендуют, имхо, на некую джазовую элитарность, а для этого исполнителя по
        "формату" больше бы подошли Полнолуние и МДМ со входом до 100р. и пивом по
        тридцатнику. Многие молодые поклонники рок-и-роллов а-ля 60-е, коих без сомнения
        у нас достаточно много, в этот раз не имели ни малейшего шанса увидеть этого
        достойнейшего рок-музыканта.
