          достаточно крупные, а таковых, да ещё чтобы попсовостью не несло изо всех
          щелей, в Москве раз-два и обчёлся. Фактически, окромя Форте, Ле Клуба, да
          отпавшего по понятным причинам РБК и нет вовсе :( Есть, конечно, хорошие
          помещения, но они сейчас не используются для проведения концертов, а, соответственно,
          народа соберут сразу принципиально меньше (к примеру, ДК "Высотник" в Раменках,
          где последние месяцы своего существования обитал незабвенный "Nе Бей Копытом").
          Ничего не могу сказать про Полнолуние (просто потому, что ни разу там не
          был), а что касается МДМ... большой зал - однозначно бы не набрался, а паркетный
