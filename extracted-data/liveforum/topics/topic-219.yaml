      deleted: false
      text: 'Не обидно, если честно. ;) По существу и отвечать не буду.

        Дим, на самом деле, как уже выяснялось не один раз, у нас абсолютно не пересекающиеся
        музыкальные пристрастия - ты совершенно не ценишь у музыкантов то, что обожаю
        я. А мне кажется скучным то, что пропирает тебя. К примеру, ты не допускаешь,
        что 5-минутное соло на гитаре может быть интересным само по себе. Мне бывает
        скучно от просто качественно сыгранной песни без интриги, даже если там потрясающие
        ритмы и аккомпанирующая партия на акустике. Хотя, я совершенно допускаю, что
        кому-то с немерянным и качественным вкусом это нравится и все такое... И слава
        Богу! Есть же интеллектуальные любители классической, например, музыки, которые
        заслуживают глубокого уважения, но блюза никогда не поймут... Давай примем
        существование подобного разнообразия хороших вкусов как аксиому.

        В связи с этим, раз у нас так мало общего в муз.взглядах (если подразобраться),
        то обсуждения "это хорошо" - "нет, это плохо" между нами глубокого смысла
        не имеют. А только портят нервы. Так что давай формулировать: "это не моя
        музыка, для меня тут ничего интересного нет" и пр. Ну а за то, что и моя точка
        зрения имеет смысл говорит хотя бы то, что есть другие замечательные люди,
        которую любят музыку, которую люблю я. Про тебя можно сказать то же самое!

        И точка! ;)'
