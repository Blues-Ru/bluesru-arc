    poster: Andrei V. Evdokimov (evdokimov)
    email: evdokimov@blues.ru
    subject: Два дня Бюска в Москве…
    deleted: false
    text: "Пост длинный, не претендую занимать чье-то внимание столь надолго. \nВот\
      \ здесь можно посмотреть, как это выглядело\nhttp://www.blues.ru/bluesnews/Busk/page_01.htm\n\
      http://www.blues.ru/bluesnews/Busk/page_02.htm\nhttp://www.blues.ru/bluesnews/Busk/page_03.htm\n\
      \nКонцерт в FORTE был одним из лучших, что я слыхал вообще в своей жизни. Бюск\
      \ был несколько смущен филармонической атмосферой. (Я и сам, перемещаясь по\
      \ залу, чувствовал себя неловко среди чинно сидящих слушателей. Только столик\
      \ под кодовым названием WAZAP?! был островком рок-н-ролла.) Но есть и положительная\
      \ сторона. По выражению Бюска, он смог услышать те свои ноты, которые обычно\
      \ теряются в шумных залах. Может, поэтому он много игра 3х-пьяно. И играл совершенно\
      \ гениально. \nПугавший меня заочно ди-джей с псевдонимом из 60-х Captain Freedom\
      \ оказался очень уместным чуваком. Все звуки, которые он извлекал из своего\
      \ столика с кнопочками и проводками, были абсолютно уместны: то шум ветра на\
      \ просторе, то конкретные фанковые аккордики… А, когда надо, просто поквакивал\
      \ на невиртуальной гитаре.\nПрограмма в целом был чрезвычайно разнообразна.\
      \ Это был именно концерт, а не танцевальный вечер. Но слушать более двух часов\
      \ было необыкновенно интересно! Разнообразие возможностей такого вроде бы примелькавшегося\
      \ инструмента, как электрогитара, Бюск демонстрировал легко и остроумно и ярко.\
      \ Слов нет, бесполезно описывать музыку. Но у меня осталось ощущение свежести\
      \ от его игры – огромное спасибо за это. \n(А драйвовый концерт Бюска я слышал\
      \ в Нутоддене. Тот самый, на 3 с гаком часа. Это был бесконечный рокабильный\
      \ марафон, публику от отжал как лимон, а сам оставался свеж и блистал улыбкой\
      \ (свойства которой Федором описаны). Но в той программе было имела место однотипность\
      \ ходов. ) И Бюск прекрасно понимает разницу. Он построил концерт по атмосфере\
      \ клуба.\nОстроумие… Он обстебывал мелодии, поворачивая их туда-сюда, вклеивал\
      \ гишпанские переливы, фанковал и свинговал… Но это не было доставшим меня местным\
      \ повсеместным злобным стебом. Это был смех от легкости игры. И чувствовался\
      \ очень положительный посыл. И все время, в люых стилях, чувствовалась и блюзовая\
      \ первооснова – в самой манере звукоизвлечения и построения фраз. (Это особо\
      \ понравилось Вайту Белову, хотя он смотрел Бюска только по тв). \nИ, конечно,\
      \ такая штука, как stage presence. Без нее концерт – дело бесполезное. А Бюск\
      \ хорош как шоу-мэн. \nНа следующий день в Le Clube туго шло все – и саундчек,\
      \ закончившейся странной невозможностью подзвучить барабаны, отчего весь концерт\
      \ позже пошел наперекосяк; и собственно договор с хозяевами о деталях оказался\
      \ неработающим, были всякие закулисные просады... Все, кто были в субботу, в\
      \ воскресенье не могли не отметить отрицательную разницу. Однако ж, если посыла(драйва,\
      \ вдохновения) не хватало, то технику игры Бюск продемонстрировал во всей красе.\
      \ Я мог огорчаться, что накануне было ярче, но как мог на таком концерте заскучать\
      \ МУЗЫКАНТ, впервые слушающий Бюска – я не могу понять… К тому же, к концу выступления\
      \ Бюск несколько оттаял, и последние номера, особенно после бисовки (сердечная\
      \ благодарность чиарлидерам за организацию оваций) отыграл на все 100.\nМне\
      \ показалось, контакт с публикой ему необходим. Не случайно в Форте он играл\
      \ на кромке сцены, свешиваясь в зал. А в Ле Клубе он уходил в глубь сцены… но\
      \ это уже мистика.\nИ напоследок некоторые выводы не о музыке, а о людях. В\
      \ Форте, при всех известных понтах на входе, работают замечательные люди, для\
      \ которых музыка – главное. В Ле Клубе – обыкновенные выжиги и копеешники."
