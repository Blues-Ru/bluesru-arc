  text: 'Занятная новость попалась:

    Just because many progressive rock bands such as Rush are considered ahead of
    their time, doesn''t necessarily mean that they weren''t influenced by their predecessors.
    The Canadian trio has announced that they will cover classics by such bands as
    The Who, Cream, Buffalo Springfield and the Yardbirds on their next album Feedback,
    which will hit stores on June 29th. Only eight songs in length, this is the first
    time the band has recorded material by other artists. Drummer Neil Pert writes
    in the album''s liner notes: "We thought it would be a fitting symbol to commemorate
    our 30 years together if we returned to our roots and paid tribute to those we
    had learned from and were inspired by." The album includes renditions of such
    tunes as the Who''s "The Seeker" and Robert Johnson''s "Crossroads", popularized
    by Clapton''s cover.'
