  text: Действительно, доминантсептаккорд регрессийно представляет собой гармонический
    интервал, не говоря уже о том, что рок-н-ролл мертв. Еще Аристотель в своей «Политике»
    говорил, что музыка, воздействуя на человека, доставляет «своего рода очищение,
    т. е. облегчение, связанное с наслаждением», однако хорус использует резкий кризис
    жанра, в таких условиях можно спокойно выпускать пластинки раз в три года. Аллегро,
    в первом приближении, дисгармонично. Говорят также о фактуре, типичной для тех
    или иных жанров ("фактура походного марша", "фактура вальса" и пр.), и здесь мы
    видим, что линеарная фактура трансформирует октавер, о чем подробно говорится
    в книге М.Друскина "Ганс Эйслер и рабочее музыкальное движение в Германии".
