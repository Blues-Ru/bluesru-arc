  subject: n+1й круг, или почему я участвую во "все на ту же тему дискуссии"
  deleted: false
  text: "Не из-за пиратов, естественно. Ясно, что продавцы прессованной пластмассы,\
    \ не заплатившие за контент, в нагрузку к которому толкают свой продукт, мягко\
    \ говоря, не правы. И если с изменением правил торговли кружочками из пластика\
    \ они исчезнут из нашей жизни, я, конечно, погорюю немного, но слова в их защиту\
    \ не скажу. \n\nНо тут мы подходим ко второму аспекту дискуссии - передаче информации\
    \ от человека к человеку. Что интересно,- впервые (для меня) оппонентами являются\
    \ люди, отнюдь не отрицающие права на бесплатный обмен информацией, а, совершенно\
    \ напротив, готовые дать почитать (и даже отксерить) книгу, либо дать послушать\
    \ (и даже скопировать) компакт. Вопрос - почему для того же самого я не могу использовать\
    \ сеть? Что это за технофобия такая? Мне, положим, затруднительно договариваться\
    \ со своим сетевым знакомым из Квебека, желающим послушать Тексас Александра,\
    \ о личной встрече, и сеть здесь - лучшее средство для общения.\nКачество мптри\
    \ не устраивает? Но тут мы не вольны в выборе, общественность признала приемлемым\
    \ именно этот стандарт. Ей - общественности - видней, что по доступным ей каналам\
    \ наиболее безболезненно перетечет.\nА если на пресловутом сервере вместо мптретьих\
    \ будут лежать образы дисков, вы ведь снимете свои претензии? Правда, Дмитрий?\
    \ правда, Андрей? правда, Федор? \nНе снимете? Какая жалость... Количество возможных\
    \ слушателей смущает... Но ведь это чисто _технический_ вопрос, к морали и закону\
    \ отношения не имеющий.\nГлавное - принцип. Могу я дать (взять) кому-нибудь (у\
    \ кого-нибудь) альбом (роман). Или нет. Я считаю - могу. И всегда буду высказываться\
    \ в пользу правил человеческого общежития, позволивших мне прочесть в свое время\
    \ гораздо больше книг, чем есть в моей (родительской) библиотеке, и прослушать\
    \ гораздо больше музыки, чем есть у меня на компактах."
