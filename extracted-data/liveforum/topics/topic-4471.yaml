  text: "11 декабря в ночном клубе «Палладиум» со своей группой выступит чернокожий\
    \ блюз-оригинал из США Big Walker. 57-летний Деррик Волкер выбрал музыкальную\
    \ карьеру в 9-летнем возрасте и с тех пор не выпускает из рук губную гармошку.\
    \ Ее томные звуки уже очаровали Швецию, Германию, Францию и другие страны Европы.\
    \ Деррик играл на губной гармошке даже в Бродвейском мюзикле «Big River». Своему\
    \ мастерству Волкер обучает в Стокгольмской музыкальной консерватории. Билет на\
    \ концерт стоит 80—150 грн. \n\nhttp://www.segodnya.ua/img/users/483/88/WALK3642CustomImage0037611.jpg"
