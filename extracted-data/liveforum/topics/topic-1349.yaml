  deleted: false
  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=CASS70307281845&sql=Ahe63mpv39foo


    Об этом альбоме столько написано, что я не хочу повторяться.


    Это первый студийный альбом Джона, до этого был лишь неудачный концертный дебют,
    о котором мало кто знает. Многие так и считают альбом с Клэптоном первым. Можно
    считать как угодно, но этот альбом явился прорывом ДМ в хит-парады и в души и
    сердца людей.


    Джон - счастливый человек. Он дожил аж до 33 лет и только тогда выпустил что-то
    стоящее; то есть гораздо моложе своих лет. Эрик моложе его на 11 лет, другие еще
    моложе. Приятно работать с молодыми талантами и ощущать себя таким же.


    Альбом состоит из 11 песен - 37 минут. 11 треков подражания черным американцам
    и не более того. Так за что же этот альбом считают лучшим у ДМ? За присутствие
    ЕС? Или за то же, за что считают королем Элвиса и Майкла Джексона? Нашумел просто.


    Джон изображает из себя Отиса Раша, ЕС изображает из себя американского гитариста
    (он бы на рожицу на свою посмотрел ;)), остальные делают вид, что знают как надо
    играть эту музыку. Будущее покажет, что все они уйдут от копирования и создатут
    свою музыку. Они станут серьезными и циничными. Они станут алкоголиками и наркоманами
    и будут играть свой британский вариант блюза. А пока просто игра и попытка быть
    в струе.


    Хорошие вещи тут есть, но какие-то они сырые и псевдо-бодрые. Мне нравятся All
    Your Love, Little Girl, Have You Heard.


    Я ставлю этой пластинке 3 балла, а Вы думайте сами. Я лучше послушаю Them или
    Stones из британского ритм-н-блюза образца 65-66.


    You think it''s the best, but it''s just a beginning!'
