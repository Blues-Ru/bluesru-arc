  text: 'Тут попался на один сайт <a href="http://rnbstars.narod.ru/">R&B Stars</a>
    Сайт посвящен таким R''n''B исполнителям как Alicia Keys, Aaliyah, Mya, Destiny`s
    Child, Toni Braxton, Whitney Houston...

    Против этой музыки ничего не имею, но и не слушаю её (не моя она). Хотя, Whitney
    Houston - полный одобрям (то, что слыхал у неё).

    Так сказать, понятно, откуда у этой музыки "ноги растут". Соул, черная музыка...

    Вот только вопрос у меня такой имеется. ПОЧЕМУ нынче это называется R''n''B?

    А как насчет R''n''B в смысле Buddy Guy, SRV, Muddy Waters? Ну, в основном это
    гитарная музыка, но это не так обязательно, не столь важно.

    Когда-то мне было как-то не понятно видеть в номинациях Grammy или MTV "Лучший
    R''n''B исполнитель" имена, которые я не знаю как блюзовых исполнителей. Теперь
    уж привык к сему. Скорее, та музыка ближе к рэпу или хип-хопу (так мне кажется),
    нежели к блюзу.

    P.S. По поводу сайта R&B Stars: в правилах форума этого сайта есть такой пункт:

    1. Вы должны уважать певиц и группу, для которых здесь открыты форумы (Aaliyah,
    Mya и Destiny`s Child).

    Да уж...

    Такие вот дела.'
