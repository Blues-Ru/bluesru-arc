        subject: согласен
        deleted: false
        text: Первый раз я Каверкина услышал полгода назад на джеме Др. Ника в БиБиКинге.
          Играл он довольно скромно, но заметно с большим чувством, нежели другие.
          Вчера было намного уверенней (по части исполнения), а по духу - абсолютно
          блюзово. Возможно, он единственный из всех наших музыкантов, который когда
          рассказывает свою историю (не важно, кто автор песни), то вкладывает в этот
          рассказ всю свою душу, кажется, что он переживает каждое сказанное слово.
          И гитарная техника его тоже очень импонирует, она напоминает мне Ти-Боуна
          Уолкера и старика Би Би, не находите? Ох, как это по мне!
