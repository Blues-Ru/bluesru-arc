  - id: 2419
    parent_id: 2406
    date: 2002-03-22 13:58
    poster: Алексей Аграновский (Док)
    email: aaa@genebee.msu.su
    subject: Мультик, второй этаж и Nobody's Fault
    deleted: false
    text: "Да, любопытный мультик - и действительно напоминает его пение!  \nДа не\
      \ подумает кто-нибудь, что это пишется с дружеской подколкой - Nobody's Fault\
      \ But Mine и Black Night's Fallin' в исполнении Юры Каверкина и Саши Братецкого\
      \ получились на джеме очень необычно и хорошо. \n\nЗаодно, чтобы лишнюю ветку\
      \ не заводить, хочу сказать всегдашнее спасибо всем игравшим и хлопавшим. Перечислять\
      \ джемующих не буду, нас было много, но всех было приятно видеть и почти всех\
      \ - слышать. Ну что ж, какой джем без лажи. Фильтровать и отсеивать участников\
      \ - по-моему, лажа еще худшая. Разве что совсем криминал. А так приходится рассчитывать\
      \ на то, что если человек говорит - я умею играть (петь)- то это правда так...\n\
      \nНо главной проблемой остается недостаток времени. Клуб по-прежнему напрягает\
      \ милиция после 22:30. Начать сейшн до 20:00 - никак не получается. Отсюда все\
      \ качества - кому-то не хватает времени сыграть номер, о котором честно договаривались\
      \ перед началом. При этом другие люди (\"не лучше меня\") играют несколько номеров..\
      \ Извините за это, ребята. Идеально организовать можно только похороны. На будущее\
      \ - после электрического джема там почти всегда бывает акустический, к которому\
      \ можно присоединиться и довысказаться."
