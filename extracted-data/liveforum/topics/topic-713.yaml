  text: "Поскольку я тут вроде бы не одна такая, кого интересует подобная музыка,\
    \ то позвольте поделиться :)\nНа Цадике вышла сольная пластинка Roberto J.Rodriguez\
    \ \"El Danzon de Moises\" (2002), драммера из проекта Марка Рибо \"Los Cubanos\
    \ Postizos\",  спродюсированная, конечно же, Джоном Зорном. Здесь Roberto J.Rodriguez\
    \ обозначен в роли перкуссиониста, аранжировщика и продюсера. Набор задействованных\
    \ при записи инструментов (trompeta, clarinete, soprano sax, violin, tuba, accordeon,\
    \ piano, Banjo, percussion..) уже сам по себе обещал неординарное творение. Так\
    \ и вышло.\nХочется обратить на эту работу внимание любителей Cuban & Jewish Jazz.\
    \ Здесь очень гармонично переплетены традиционная еврейская музыка и неповторимый\
    \ кубинский колорит. Хотя аннотация к пластинке скорее гласит о более Jewish-направленности,\
    \ чем Cuban, но если взяться сравнивать несколько выпусков Masada и эту пластинку,\
    \ то \"El Danzon de Moises\" я бы поставила для себя на существенно более высокую\
    \ ступень. Хотя бы ещё и потому, что она незримо (не только в названиях, конечно)\
    \ перекликается скорее не с чисто еврейской народной музыкой, а с примесью кубинской\
    \ музыки, и позволяет думать, что музыкальные идеи Los Cubanos Postizos ещё не\
    \ умерли вместе с кончиной этого проекта. \nhttp://www.allmusic.com/cg/amg.dll?p=amg&uid=6:14:45|AM&sql=A9i1m967ojepf"
