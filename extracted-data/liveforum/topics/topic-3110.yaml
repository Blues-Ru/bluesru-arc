  text: 'Подарили DVD "Ralph Gleason''s Jazz Casual: B.B. King - 1968 / Turk Murphy
    & The San Francisco Jazz Band - 1962". Смотрю, радуюсь. Очень приятное выступление
    и интересное интервью: с удивлением узнал оттуда, что Bukka White его двоюродный
    брат.

    (просто поделился радостью :-)

    Ralph Gleason: B.B. King you''ve been playing and singing the blues all your professional
    life. Did you ever tire of it?

    B.B. King: No (laughing). No I don''t ever tired, Ralph. One thing that do bother
    me sometime, when I think that people maybe getting tire of it. I feel a little
    funny sometime when I started performing but one stay start, you know, the clap
    the hands... I never get tired of them.

    ...

    RG: What do you want to do with you music, with your singing?

    BBK: Play the best as I can. Reach as many people, as many countries. Other worlds
    I''d like whole world be able to hear B.B. King sing and play the blues.'
