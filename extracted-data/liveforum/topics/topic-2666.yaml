  text: "Здравствуйте, Андрей!\n\nУ меня к вам большая просьба. Меня интересуют книги\
    \ о блюзе и блюзменах (естественно на английском). Причем не столько история жанра,\
    \ сколько биографии черных блюзменов, факты и истории из их жизни.Буду признателен,\
    \ если вы мне что-нибудь порекомендуете \"в таком ключе\". \nСпасибо."
