  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70312021801262281&sql=A18se4jo70wau\n\
    \nЭто третий релиз Питера на PVK/Creole Records. Грин продолжает расширять стилистику;\
    \ на этом альбоме появилась отличная реггийная Give Me Back My Freedom, например.\
    \ По-прежнему много соула, блюз-рока и такой странной гриновской психоделии. По-прежнему\
    \ отличные мелодии и гармонии. Все так же хорош вокал, гитары и аранжировки. Я\
    \ бы поставил этому альбому 5 баллов, хотя он немного слабее предыдущих двух;\
    \ дело в том, что тут 10 треков и все они великолепны - что же еще ставить?\n\n\
    Стоит выделить несколько сильнейших треков. Got To See Her Tonight, Bullet In\
    \ The Sky (ох, какая вещь); Give Me Back My Freedom (регги он тоже может); Last\
    \ Train To San Antone (отличный блюз и лучший трек на альбоме); Like A Hot Tomato\
    \ (очень классно). \n\nИ так, три альбома после девятилетнего перерыва и все они\
    \ очень и очень хорошие."
