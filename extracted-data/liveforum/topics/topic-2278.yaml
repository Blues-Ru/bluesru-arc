    text: Нет извините... Не херню пишут... Я на двух Эфесах был, и про остальные
      читал. Ездил на них из Минска, и больше не поеду. Ибо уж очень специфическое
      мероприятие, этот "фестиваль блюза и пива" (именно так он назывался на блюз.ру
      в новостях в прошлом году). Не буду рассуждать о том, какой "эшелон" блюзменов
      на них приезжает, но налицо желание оргинизаторов угодить всем. То есть все
      эфесы проходят по одному сценарию - сначала кто то на акустике, играет типа
      что то "круто-корневое"; затем на сцену выходит тот, ради которого я (как в
      итоге выясняется) собственно и ездил, кто то из так сказать "чикагской школы";
      а третим на сцену вылазят "скоморохи" которые по идее организаторов с разной
      степенью талантливости должны поставить зал на уши... Обя раза я уходил так
      и не дождавшись окончания выступления этих самых "скоморохов", а время, отведенное
      в концерте под "чикагщину" несоизмеримо малО, для того, что бы ради этого перется
      в белокаменную... В итоге, хотелось угодить всем - а угодили только некоторым.
      ИМХО на любителя... Клубная жизнь рулит :)))
