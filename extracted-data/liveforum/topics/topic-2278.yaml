    deleted: false
    text: "Сейчас по Москве всюду висят афиши Efes Pilsener Blues Festival, которые\
      \ вызывают во мне смешанные чувства ностальгии и раздражения.\n\nПервое проведение\
      \ этого фестиваля в 1999 году совпало по времени с началом моего увлечения блюзом,\
      \ так что пропустить такое знаковое мероприятие я никак не мог - тем более,\
      \ мне тогда казалось, что о блюзе в нашей северной стране практически никто,\
      \ кроме меня, и не слышал-то никогда. Так что ожидал чего-то камерного и в известном\
      \ смысле элитарного.\n\nКаково же было моё удивление, когда, придя вместе с\
      \ Константином Бенюмовым в Московский Дом Молодёжи, мы обнаружили, что там буквально\
      \ протолкнуться негде и всё халявное пиво уже закончилось. К слову сказать,\
      \ именно спайка \"пиво и блюз\" стала фатальной для каких-либо блюзовых мероприятий\
      \ в нашей стране. То есть блюз без пива вообще никак, ну а уж после пива - как\
      \ угодно. \n\nТак и был устроен фестиваль: отвратительное качество звука отечественные\
      \ звукорежиссёры смекалисто и с лихвой компенсировали его зашкаливающей громкостью,\
      \ а прыгающая перед сценой пьяная публика не замечает ни то что смены песен\
      \ - даже на смену исполнителей реагирует вяло. Справедливости ради стоит сказать,\
      \ что в этом фестивале традиционно участвуют блюзмены лишь второго или даже\
      \ третьего эшелона. Это так называемые entertainers (\"развлекатели\"), которые\
      \ уделяют больше внимания общению со зрителями и шуткам, нежели собственно музыке.\n\
      \nНа следующий год я опять не смог отказаться от соблазна пойти на фестиваль.\
      \ Решив не отставать от своего народа, я выпил побольше пива и ринулся в самую\
      \ гущу народа, прямо под сцену. Там я стоял и лицезрел музыкантов в непосредственой\
      \ близости, пока чья-то могучая рука не оторвала меня от сцены. Когда я опомнился,\
      \ то увидел, что на моём месте у сцены стоят какие-то девушки, а рядом со мной,\
      \ положив руку мне на плечо, скачет какой-то невероятно жирный и потный мужик\
      \ и орёт на ухо так, что вышибает барабанные перепонки: \"Бери девок и пользуй!\"\
      . Когда я вежливо отказался, сказав, что, вообще-то, пришёл музыку послушать,\
      \ мужик поинтересовался (опять же, подчёркиваю, отнюдь не интимным полушёпотом!),\
      \ не идиот ли я. Поскольку на этот вопрос я всегда затруднялся ответить, то\
      \ просто предпочёл покинуть МДМ, так и не дождавшись окончания концерта.\n\n\
      Какая сила заставила меня пойти на фестиваль в третий раз - не знаю. Но я решил\
      \ для себя, что лезть к сцене не буду, а просто сяду в каком-нибудь укромном\
      \ уголке, буду неторопливо попивать пивко и, не страдая от громкости звука,\
      \ наслаждаться Музыкой. Однако все сидячие места ещё задолго до начала концерта\
      \ оказались заняты. И вот когда я уже совсем отчаялся сесть, какие-то милые\
      \ люди предложили мне место рядом с ними. Присев и поблагодарив их, а также\
      \ посетовав на вечную нехватку мест, я невольно положил начало разговору. В\
      \ ответ я узнал, что это семья из Барнаула, что до поезда им осталось меньше\
      \ 3 часов и что в Москве они могли бы жить, но их совершенно не устраивает экологическая\
      \ ситуация. На этом лично я исчерпал свою тягу к общению, но семейка попалась\
      \ непростая: уже после начала концерта мне пришлось выслушивать историю обучения\
      \ младшего сына игре на баяне. Один раз, правда, глава семества снизошёл до\
      \ обсуждения происходившего на сцене. Махнув рукой на выступавшего, кажется,\
      \ Отиса Тэйлора, он выдал: \"Да херня это всё! Вот у меня троюродный брат, Андрюха,\
      \ - вот он на гитаре фигачит ващще! Да он бы этого Тэйлора...\" - и жестом продемонстрировал\
      \ американскому блюзмену, что, мол, нет пределов блюзового совершенства.\n\n\
      И решил я, что такой блюз для меня непостижим. С тех пор на фестивали не хожу."
