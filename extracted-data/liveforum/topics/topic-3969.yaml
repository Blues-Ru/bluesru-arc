            email: mlives_6@hotmail.com
            subject: Бурк
            deleted: false
            text: 'Solomon Burke еще в прекрасной вокальной форме.  Я видел его на
              сцене недавно.  Физически он очень сдал, конечно, так растолстел, что
              даже выходить ему не сцену стало тяжело.  Ведут его теперь на сцену.  Лично
              мне не нравятся последние его альбомы, несмотря на присутствие качественных
              песен и музыкантов.  Просто дали Соломону незнакомые и непривычные песни,
              и сказали, спойте!  Соломон - это настоящий уличный проповедник.  Он
              должен владеть своими песнями полностью, а не просто их петь.  Кстати
              теперь он уже успел овладеть некоторыми песнями альбома "Don''t give
              Up on Me," и замечательно их исполняет, в 100 раз лучше, чем на альбоме.


              Muddy'
