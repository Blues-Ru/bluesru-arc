    \"I Smell Smoke,\" Michael Burks, writer (\"I Smell\nSmoke,\" Michael Burks)\n\
    \"Lookin' for Trouble!,\" Kim Wilson, writer (\"Lookin'\nfor Trouble!,\" Kim Wilson)\n\
    \"Southern Comfort,\" EG Kight/Tom Horner, writers\n(\"Southern Comfort,\" EG\
