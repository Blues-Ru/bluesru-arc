  text: "Below are the nominees for the 2004 W.C. Handy Blues\nAwards, selected by\
    \ an international voting panel of\nblues fans and blues society members. The\
    \ awards will\nbe presented April 29 at the Cook Convention Center in\nMemphis.\n\
    \nACOUSTIC ALBUM\n\"Natural Light,\" Eric Bibb (Earthbeat)\n\"Last Fair Deal,\"\
    \ Rory Block (Telarc Records)\n\"Chocolate to the Bone,\" Guy Davis (Red House)\n\
    \"Blues Singer,\" Buddy Guy (Silvertone)\n\"Blues 2.0,\" Fruteland Jackson (Electro-Fi)\n\
    \"Big Lonesome Radio,\" Mark Lemhouse (Yellow Dog\nRecords)\n\nACOUSTIC ARTIST\n\
    Eric Bibb\nRory Block\nGuy Davis\nJohn Hammond\nCorey Harris\nAlvin Youngblood\
    \ Hart\n\nBEST NEW ARTIST DEBUT\n\"Sweet Talk,\" Renee Austin (Blind Pig)\n\"\
    Doctor Velvet,\" Nick Curran (Blind Pig)\n\"Up Your Mind,\" Ellis Hooks (Evidence)\n\
    \"Southern Comfort,\" EG Kight (Blue South Records)\n\"Big Lonesome Radio,\" Mark\
    \ Lemhouse (Yellow Dog\nRecords)\n\nBLUES ALBUM\n\"Which Way Is Texas?,\" Anson\
    \ Funderburgh and the\nRockets Featuring Sam Myers (Bullseye Blues)\n\"Blues Singer,\"\
