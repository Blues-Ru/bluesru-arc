      subject: А можно два вопроса?
      deleted: false
      text: 'Я просто увлекаюсь фанком и мне не очень понятен выбор "Редкой Земли".
        Это вроде не самая сильная команда среди Мотауна, а уж тем более среди фанка
        вообще.

        И еще; почему "Маленькие Ножки" только 90-х годов? А как же 70-е с Лоуэлл
        Джорджем?'
      replies:
      - id: 1018
        parent_id: 1016
        date: 2002-02-09 05:14
        poster: Вадим  (AVA)
        email: vad2908@mail.ru
        subject: два ответа
        deleted: false
        text: '1. по поводу Rare Earth - просто это была первая белая группа, играющая
          в этом стиле, которую я услышал в далеком 73 (служа на КСФ, кстати), ну,
          как ты понимаешь, первая привязанность, ностальгия....

          2. по поводу Little Feat история с точностью до наоборот. Несмотря на то,
          что я про них много слышал (а может и не много?), первое, что я услышал,
          был этот концертник. Потом я стал "спускаться вниз по древу",

          но, опять же - первое впечатление - вернее (для меня лично).

          Возвращаюсь к фанку вообще, мне он в принципе нравится, но в небольших кол-вах.
          (исключение см. п.1) Вадим.'
