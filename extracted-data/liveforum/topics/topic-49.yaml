            subject: Вот и не совсем так
            deleted: false
            text: Этот звук что-то среднее между А и У, и по правилам русского языка
              транслируется как У. Послушай те же песни с употреблением этого слова.
            replies:
            - id: 1044
              parent_id: 1034
              date: 2002-02-09 15:54
              poster: Михаил Бирюков (nECKAPb)
              email: blackcat@blues.ru
              subject: пройдемся по английскому
              deleted: false
              text: Буква "u" английского языка в закрытом слоге читается как "a".
                Это основы английской фонетики, а в Штатах говорят всё же на английском
                языке. С этой точки зрения надо подходить и к расшифровке весьма проблематичных
                негритянских произношений, тем более под музыку (звук может глотаться,
                быть произнесённым неопределённо и т.д., однако универсальных правил
                это не меняет).
              replies:
