    text: 'Пытаясь понять название группы методом логической дедукции, я пришёл   к
      следующему прелюбопытнейшему умозаключению, коим не могу не поделитьтся с общественностью:


      Поскольку нота "соль" субконтроктавы - это 24,5 Гц, а нота "ля" там же - 27,5
      гц, то умножая частоту ноты "соль" на величину шага равномерно темперированного
      строя, равного 2^(1/12)~1,059, мы как раз получим 26 Гц, или ноту соль-диез
      субконтроктавы.


      Во как...'
