  text: "Произведение Оксаны ФИЛИППОК \"ЛОЛИТУ ПРЕДПОЧИТАЮТ БОКСЕРЫ\". из издания\
    \ \"Труд-7\"\nдалее: копи-паст:\n\nМногие наши боксеры тренируются под песни в\
    \ исполнении Лолиты Милявской. Во всяком случае так утверждает чемпион мира по\
    \ боксу Андрей Шкаликов. Это признание он сделал на вечеринке, посвященной запуску\
    \ благотворительного проекта \"Время разбрасывать камни\". А предыстория его такова.\
    \ Два творческих человека - певица Лолита и композитор Михаил Денисов (в прошлом\
    \ тоже боксер) - решили объединить усилия и записали сингл \"Время назад, на блюз\"\
    . Поначалу радиостанции не хотели брать композицию.\n- Ведь блюз - \"неформатное\"\
    \ произведение. Но Денисов позвонил кому-то, и проблемы больше не существует.\
    \ Да здравствуют боксеры!.. И муж не ревнует меня к интеллигентным мужчинам, -\
    \ предупредила наш следующий вопрос Лола. - Только к хамам. Но главное, чтобы\
    \ мы с Мишей не походили на дуэт Киркорова с... Сакисом!\nВообще-то Денисов не\
    \ коммерческий композитор - музыку, которую пишет, раньше никаким исполнителям\
    \ не предлагал. Но после трагедии в Беслане он понял: надо что-то делать. Дуэт\
    \ в стиле блюз с Лолитой - это первая ласточка проекта. Дальше Михаил собирается\
    \ записать совместные композиции с другими исполнителями, В сентябре, в канун\
    \ бесланской трагедии, состоится большой благотворительный гала-концерт участников\
    \ этого проекта. \n\n-----\nPS. помятуя прошлую реакцию, хочу сразу сказать: на\
    \ мой взгляд, все это - не повод для организаций марша протеста или раздирания\
    \ блюзовых тельняшек на груди с татуировкой профиля Мадди Уотерса. \nPPS. Я бы\
    \ особое внимание обратил на этот прелестный пассаж: <i>\"- Ведь блюз - \"неформатное\"\
    \ произведение. Но Денисов позвонил кому-то, и проблемы больше не существует.\
    \ Да здравствуют боксеры!..\"</i> Видать, в наших рядах не хватает именно боксеров!"
