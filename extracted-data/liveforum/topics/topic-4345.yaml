  text: "Для всех граждан, желающих увеличить свой доход, есть возможность заработать\
    \ без вложения собственных денег. Это ведущая школа покера русского интернета,\
    \ которая предоставляет вам возможность получить бесплатно 50$ на счет в выбранном\
    \ вами онлайн покер-руме, сдав тест из 20-ти вопросов. \nВажно при этом, что Вы\
    \ не потратите ни копейки собственных денег. \n\n[URL=http://www.pokerstrategy.com/uOVM4R]Русская\
    \ школа покера[/URL] - Научитесь играть в покер, не вкладывая собственных денег!\
    \ Получите бонус в 150$ от школы Покер и станьте выигрывающим игроком! \n\n1.\
    \ Регистрируетесь на сайте и подтверждаете регистрацию со своего e-mail (как при\
    \ регистрации на обычном форуме). \n2. Внимательно изучаете предоставленный материал\
    \ по игре в покер и сдаете тест из 20 вопросов. Будет 5 попыток на успешную сдачу,\
    \ на каждую из которых дается 1 час (в конце каждой статьи есть набор вопросов\
    \ с ответами на них; если сомневаетесь в ответе, лучше проверить). \n3. Если вы\
    \ удачно сдадите тест, то вам предложат выбрать на сайте покер-рум, на счет в\
    \ котором вы хотите получить 50$ для игры (Titan Poker, Party Poker, Poker Stars\
    \ и несколько других румов). \nСкачиваете программное обеспечение выбранного покер-рума,\
    \ устанавливаете и регистрируетесь в нем (при выборе определенного покер-рума,\
    \ появится подробная инструкция по регистрации; для того, чтоб вам перевели 50$,\
    \ нужно строго следовать этой инструкции (самое главное не ошибиться при вводе\
    \ бонус-кода). \n4. Отмечаете на сайте покер-школы в своем профиле выбранное вами\
    \ имя в покер-руме для перевода на него 50$. \n5. Начинаете играть на полученные\
    \ деньги и набирать очки. После набора определенного количества очков, школа переводит\
    \ на ваш счет еще 100$. \n\nВ покер против других людей можно реально стабильно\
    \ выигрывать: при игре в кости все решает только удача, а тут вы сами выбираете\
    \ как вам действовать (когда и сколько ставить, повышать или сбрасывать карты).\
    \ К тому же в покер-румах играет множество зарубежных богатых игроков, основная\
    \ цель которых – развлечение и которые и понятия не имеют о каких-либо стратегиях\
    \ и о теории вероятностей (они считают что с любыми двумя картами шанс победить\
    \ одинаков, а это не так; к примеру, с двумя королями наша вероятность выигрыша\
    \ около 81% и в этом случае нам надо стремиться поставить как можно больше). \n\
    \nПосле регистрации на сайте вам будет доступно огромное количество статей по\
    \ покеру с выигрышными стратегиями игры. Также школа предлагает учебное видео\
    \ (записи онлайн игр профессиональных игроков), онлайн тренировки (вы наблюдаете\
    \ за столом в покер-руме, на котором играет тренер и слушаете его пояснения почему\
    \ он сыграл именно так; для прослушки нужна специальная программа). У школы имеется\
    \ форум, где можно задать любые вопросы и получить полезную информацию и советы\
    \ по улучшению своей игры. Есть возможность получить лицензии на покерный софт:\
    \ Gamblers Little Helper, Poker Ace HUD, PokerStrategy Elephant и другие полезные\
    \ программы, собирающие статистику игры ваших оппонентов, на основе которой можно\
    \ решить как правильно сыграть против того или иного соперника (статистика показывает\
    \ как часто соперник блефует, как часто повышает ставки или сбрасывает карты на\
    \ нашу ставку и множество других важных параметров по его игре. Эти параметры\
    \ отображаются программой прямо на столе напротив имени соперника (очень полезная\
    \ штука, дающая огромное преимущество тем, кто сможет грамотно распорядиться этой\
    \ информацией). \n\nПочему школа просто так дает нам 50$ а потом и еще 100$? В\
    \ каждом онлайн покер-руме, как и в любом покерном клубе для игры вживую, с выигранных\
    \ вами раздач заведение взимает небольшие комиссионные (около 5%). Например, вы\
    \ поставили 1$, а двое других игроков ответили вам, в банке теперь 3$. Если вы\
    \ победите в данной раздаче, то получите 2,85$ (15 центов – комиссия). Эти небольшие\
    \ комиссионные, при продолжительной игре выливаются в огромные прибыли для покер-румов.\
    \ За регистрацию вас в покер-руме, школа покера получает определенный процент\
    \ от этих комиссионных, чего хватает чтоб обеспечить вам начальный стартовый капитал.\
    \ Грамотно используя материалы, даваемые школой, вы сможете без особых усилий\
    \ зарабатывать себе покером на жизнь. Доход ограничен лишь вашими навыками и приложенными\
    \ усилиями!\n\nЕдинственное, что иногда для выдачи денег могут попросить еще скан\
    \ копию паспорта (чтобы одни и те же по 100 раз не получали деньги) - так что\
    \ на всякий случай сфоткай страничку с фио и адресом проживания/прописки.\n\n\n\
    P.S. Просьба писать на random1999@mail.ru либо в ответы к данной теме о всех вопросах\
    \ связанных с игрой в покер онлайн, возможных заработках на покере и т.п.\n\n\
    Также помогу с теорией - всем, кто зарегистрируется по моей ссылке - \n[URL=http://www.pokerstrategy.com/uOVM4R]Русская\
    \ школа покера[/URL] - книжечки электронные БЕСПЛАТНО вышлю на Вашу e-mail.\n\
    Модераторам - просьба не банить - может быть кому-то удастся решить вопросы с\
    \ работой в это непростое время благодаря энтой теме."
