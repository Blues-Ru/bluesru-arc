      Из маленьких радостей:

      - был великолепен Рост в своей непосредственности и стильности;

      - тувинские друзья в тех же аспектах;

      - два тонких лирика (Фёдор и Груша), которые блестяще завершили джем;

      - солирующий тромбон + сценическая манера тромбониста;

      - отличная работа ритм-секции;


      Чего не хватало для полного счастья: на джемах в БиБи хаус-бэнду желательно
