            email: kotmatrs@mail.ru
            subject: А то, что...
            deleted: false
            text: 'Чем отличаются вибрато? Я довольно много исследовал это на женском
              вокале (так уж получилось, что мне чаще приходилось работать с женскими
              голосами). В компьютере, на чистой вокальной дорожке вибрато видно очень
              хорошо, и можно промерить кучу параметров. И замечено что:

              - У профессионалов - вибрато очень стабильное, практически чистая синусоида
              с постоянной частотой. У непрофи - частота и глубина "плавает" и вместо
              красоты, создает ощущение неуверенности.

              - певческое вибрато- это не только модуляция по амплитуде, но и частотная
              модуляция, и тут очень важно, чтобы не возникало ощущение фальши, т.е.глубина
              частотного (фазового) вибрато должна быть вполне определенной. и вкладыватся
              в гармонию. Потому использовать это - надо очень осторожно.

              - Завораживающе звучит вовсе не любое вибрато. Скажем, у пожилых певцов,
              вместо вибрато получается старческое дрожжание.

              - негров этому приему учат. Во всяком случае, насколько я знаю, в негритянских
              церковных хорах это точно. Как впрочем и в любых других музыкальных
              школах.

              - Если получается само собой - так и класс! Но по моему, надо этим учится
              владеть.'
            replies:
            - id: 8592
              parent_id: 8585
              date: 2002-10-29 21:25
