              email: peregnoy@mail.ru
              subject: Ага, понятно. Ну тогда...
              deleted: false
              text: 'По-моему, у профи проблем с частотной модуляцией не возникает.
                То ли вокальная школа даёт о себе знать, то ли просто уши растут откуда
                надо и откровенной грязи ("вибрато" не есть грязь), как правило, нет.

                А у непрофи про вибративную частотность просто говорить не приходится,
                потому что отсутствует она как таковая.


                Насчёт пожилых певцов: большое количество пожилых людей (как певцов,
                так и не певцов), быть может, и не стремятся к вибрато, однако, изношенность
                голосовых и др. механизмов приводит к тому, что вибрация возникает
                сама собой.'
