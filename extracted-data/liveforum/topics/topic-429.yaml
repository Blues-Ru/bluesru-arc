        deleted: false
        text: 'Певческое вибрато - натренированный прием. Собственно, один из тех,
          по которому можно безошибочно определить профессионального певца от любителя.
          Стабильное вибрато появляется с годами тренировок, и стабильным становится
          спустя лет 5 постоянных вокальных упражнений.

          Очень красивый прием, которому у нас мало уделяют внимания. Это связанно
          с малым уровнем профессионализма на сцене.

          У Леши - вибрато довольно своеобразное. Оно глубокое и очень низкочастотное.
          Обычно (при классической постановке голоса) частота вибрато в два-три раза
          выше, а глубина модуляции - ниже.'
