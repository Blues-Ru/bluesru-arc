  text: "Фестиваль blues.ru 2004.\nПрошу извинения у АЕ и ФР за торопливость, но пока\
    \ нет анонса о грядущем событие (только афиша)... у меня есть только ссылка с\
    \ rockmusic.ru о грядущем фестивале. \n \nВ \"Б2\" пройдет фестиваль \"Blues.Ru\
    \ 2004\" \n\nБлюзовый фестиваль \"Blues.Ru 2004\" пройдет 20 апреля в московском\
    \ клубе \"Б2\", сообщил нам организатор фестиваля, ведущий программы \"Весь этот\
    \ блюз\" на радиостанции \"Эхо Москвы\" Андрей Евдокимов. \n\n\"Фестиваль проводится\
    \ с 2000 года. Причиной было полное отсутствие хоть какой-то фестивальной блюз-деятельности\
    \ в Москве: пришлось от \"обозревательства\" перейти к \"организаторству\", -\
    \ рассказывает Андрей Евдокимов. На вопрос о том, отличается ли грядущий фестиваль\
    \ от предыдущего, он ответил: \"И да, и нет. В прошлом году была принята схема\
    \ \"слушатель выбирает, что слушать\". Пока этой схеме соответствует только клуб\
    \ \"Б2\", где и так каждый вторник проходят блюзовые джемы. Соответственно, мы\
    \ в конце сезона, во вторник, проводим итоговое заседание, куда приглашаем всех\
    \ \"особенных\" - вручаются дипломы\". Таким образом, это мероприятие явится \"\
    смотром отечественного блюзового движения по итогам за год\". \n\nФестиваль обещает\
    \ быть грандиозным. Ожидается, что выступят около сорока коллективов и сольных\
    \ исполнителей в том числе \"Серебряный Рубль\", \"Louisiana Jumpin' Cats\", Петрович\
    \ & \"The Bluesmakers\", Леван Ломидзе и \"Blues Сousins\", Николай Арутюнов,\
    \ Михаил Мишурис и его оркестр, Алексей Аграновский и \"Черный Хлеб\" и многие\
    \ другие......\n\nПросьба ко всем любителям блюза поддержать наших российских\
    \ блюзменов и не пропустить это событие."
