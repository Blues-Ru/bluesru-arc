  text: 'Efes Blues Festival 2008 2,3 ноября 2008 года - Москва, клуб «Б1 Maximum»

    Впервые Efes Blues Festival прошел в Стамбуле в 1990 году. В России история фестиваля
    началась в 1999 году, когда в Москве впервые собрались выдающиеся музыканты с
    родины блюза — США. С тех пор Россию посетили многие корифеи мирового блюза —
    Fruteland Jackson, Magic Slim and the Teardrops, Louisiana Red, Syl Johnson, Zora
    Yang и другие.

    В Этом году: John Lee Hooker Jr., Eddie Bo, Watermelon Slim и много пива. Билеты
    660-94-00'
