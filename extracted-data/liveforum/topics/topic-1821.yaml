  text: "В последний день января московская команда «Life-n-Joy» во главе с фронтвумен\
    \ Оксаной Кочубей давала концерт в крохотном клубе «Оракул божественной бутылки»,\
    \ притулившимся в небольшом домике на Овчинниковской набережной.\n\tЗаводные рок-н-роллы,\
    \ блюзы и просто классика рока составили чуть более чем часовую программу. «Johnny\
    \ B. Good» в необычном исполнении, «Lucille», «300 Pounds Of Joy» и  многое другое\
    \ звучало в прошедшую субботу в «Оракуле..».\n\tОксана как всегда была в ударе\
    \ [угаре :)]. Абсолютнейшая безбашенность [это комплимент :)], азартная озорная\
    \ подача музыкального материала, экспрессивность, экстравагантность всегда являлись\
    \ и являются визитной карточкой этой певицы. Она обладает потрясающей способностью\
    \ перевоплощаться, чувствуя образы как частички самой себя. Энергия, не переставая,\
    \ хлещет у неё через край. Меняются проекты, команды, но вот Оксана остаётся прежней.\n\
    \tСледующий концерт коллектива в «Оракуле..»  состоится 14 февраля. Ожидаются\
    \ сюрпризы :)"
