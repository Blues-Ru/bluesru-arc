  text: "Знаю, что сейчас меня здесь просто убить готовы будут :-)))), но тем не менее\
    \ скажу.\n Первое:(Положительное) Сама по себе идея открытых джемов просто отличная!\
    \ В Би Би Кинге отличный звукорежиссер (куча респектов) поэтому и звук отличный!\
    \ Спасибо клубу!!!\n Второе:(Отрицательное) Это уже скорее к музыкантам. Хоть\
    \ это мероприятие и называется \"открытым джемом\"- в реальности же настоящие\
    \ джемы бывают редко. Когда я представляю себе джемы, то приходит на ум группа\
    \ Ринго Старра ALL STARR BAND - куча музыкантов, среди которых Jim Keltner, Joe\
    \ Walsh, Dr. John, Todd Rundgren, Jack Bruce, Peter Frampton, Levon Helm, Rick\
    \ Danko, Billy Preston, Mark Farner и многие другие. Суть группы состоит в том,\
    \ что КАЖДЫЙ участник играет хотя бы один свой номер!- этим группа очень интересна.\
    \ А в Би Би Кинге же джемы очень часто вырождаются в СОЛЬНЫЙ КОНЦЕРТ ведущей группы,\
    \ а все музыканты, выходящие на сцену всего лишь для \"массовки\". Эти приглашенные\
    \ музыканты играют соло на один \"квадрат\", в то время как хэдлайнеры наяривают\
    \ по 10 квадратов. Мне кажется это несправедливо. Это всё таки джем, поэтому приглашенным\
    \ людям должно даваться больше пространства, мне так кажется... Простой пример-\
    \ вот попросил я сегодня сыграть RED HOUSE Хендрикса- причем заметте подошел ещё\
    \ до начала джема и попросил, мне вроди как не отказали, но потом на всё забили,\
    \ сказали что нет времени и т. д. Нет демократии и всё тут! А помнится была FENDER\
    \ PARTY в 2000 году, вроде не джем, а конкурс, но там зато всем действительно\
    \ давали сыграть! Выходит кроме Fender Party и поиграть-то негде нормально. Давайте\
    \ устраивать джемы по принципу Fender Party- только без призов, т. е. каждый джемующий\
    \ выходит и исполняет сольный номер. Единственное что для этого нужно- это ритм\
    \ секция, а остальные меняются. В принципе и ритм-секция может меняться тоже-\
    \ вот это будет настоящий джем! Мне так представляется...\n  P. S. всё вышесказанное\
    \ АБСОЛЮТНО НЕ ОТНОСИТСЯ к Алексею Аграновскому и его групее- вот уж действительно\
    \ гостепреимные люди, дают людям действительно поиграть! У него правильный подход-\
    \ часть вещей они исполняют отрепетированно, а часть отдают под вакханалию джема."
