        subject: Нужно просто уважать друг друга...
        deleted: false
        text: "Не знаю как вам, но мне уже сразу не интересно слушать тех музыкантов,\
          \ которые своим видом стараются показать какие они крутые, еще только выходя\
          \ на сцену. На концерте это личное дело фротмена как построить свое шоу\
          \ и как подать себя публике. Я так, на него никогда больше и не пойду.\n\
          Другое дело джем. Вышел играть с командой, так уважай всю команду, интересно\
          \ же и играть и слушать как играют все музыканты, а не один понтарь считающий\
          \ себя круче всех, пусть даже он реально лучше играет, чем его партненры.\
          \ Хам и эгоист он везде одинаков, независимо на сцене он или нет. \nДля\
          \ меня джем интересен не соревнованием и не выдавливанием начинающих музыкантов\
          \ со сцены, а именно возможностью наблюдать как разные музыканты смогут\
          \ найти общий музыкальный язык на сцене.\nМне памятны джемы или отдельные\
          \ номера, когда музыканты из хомбенда просто забывали и игнорировали приглашенных\
          \ джемовать с ними музыкантов, стоящих с ними на сцене. Зачем тогда им проводить\
          \ эти джемы? Играйте сольные концерты - публика на них найдется.\nМне кажется\
          \ это от неуважения и осознания собственной крутости.\nСамое главное на\
          \ джеме - это ВЗАИМНОЕ УВАЖЕНИЕ друг другу и ДОБРОЖЕЛАТЕЛЬНОСТЬ, и тогда\
          \ будет интересно играть и слушать, не зависимо от того, кто сейчас играет\
          \ начинающий музыкант или бывалый профи."
