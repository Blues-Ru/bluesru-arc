            2) лучше придумать какую-нибудь менее очевидную блюзовую композицию, нежели
            Red House Хендрикса. Похоже, что это - один из трех блюзов, которые знают
            рокеры (еще, кажется, Since I''ve Been Loving You и еще что-то). Когда,
            кстати, на Fender Party 2000 Белов занудил эту песню в очередной раз,
            это было одним из самых занудных моментов вечера...

            А "свои" песни исполнять на джеме - очень даже хорошо, если они соответствуют
            блюзовой тематике, а не "свои" потому, что к блюзу не имеют отношения.
            Кроме того, лучше не играть на двух джемах подряд одну и ту же песню,
            которую знаешь. Кроме того, песня должна быть такой, чтобы ее можно было
            быстро объяснить хаус-бенду.'
