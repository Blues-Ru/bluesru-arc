    text: '...а вот кто-нибудь из здесь присутствующих знает что-нибудь про джемы
      в питерском джаз-клубе "Квадрат"?


      Позволю себе, как человек, на протяжении, наверное, двух лет постоянно там джемовавший,
      немного рассказать об этом действе.


      Во-первых, в "Квадрате" нет такого понятия, как "хаус-бенд". Ритм-секции формируются
      спонтанно, причем их участники по ходу джема еще и меняются (например, сыграл
      три-четыре песни один контрабасист - его сменяет другой, то же с барабанщиками
      и пианистами). Точно так же играются соло: подходят инструменталисты (иногда
      чуть ли не в очередь чтоб сыграть становятся :)), и играют, никто заранее не
      договаривается, не записывается. Песни выбираются спонтанно: "А давай All The
      Things You Are?" - "Нет, не хочу, давай лучше блюз в фа-мажоре" - "Да ну блюз,
      давай лучше Doxy" - "Давай, поехали".


      А во-вторых, естественно, сохраняется принцип, когда начинающему или никому
      не известному музыканту дают играть очень мало или не дают вообще. Из личного
      опыта - на первых порах мне в Квадрате удавалось сыграть по одной-две песни
      за вечер, в каждой - по коротенькому соло. Иногда меня просто "выкидывали" из
      песни (в момент начала моего соло вместе со мной начинал месить кто-нибудь из
      "звезд", и просто "выдувал" меня на фиг). А бывали вечера, когда и вообще сыграть
      не удавалось. Зато авторитетные музыканты играли по двадцать квадратов, и к
      ним не было никаких вопросов, т. к. делали они это круто. Так что это нормально,
      такая "школа выживания" для молодежи :)


      А вообще жаль, что не имею возможности побывать на джемах в ББ Кинге хотя бы
      слушателем :)'
