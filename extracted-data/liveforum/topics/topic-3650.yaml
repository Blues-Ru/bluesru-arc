                  subject: Про мп3
                  deleted: false
                  text: Любое кодирование в .мп3 обязательно срезает частоты выше
                    16000 Гц. Не верите- сравните исходный и сжатый файлы спектроанализатором,
                    который имеется практически в любом аудиоредакторе. Современные
                    цифровые записи в .мп3 слушаются сносно, а вот записи, оцифрованные
                    с аналогового источника слушаются гораздо хуже.
                  replies:
                  - id: 33043
                    parent_id: 33040
                    date: 2007-06-03 21:01
                    poster: Sergey
                    email: petroff.sa.alfa@rambler.ru
                    subject: Ответ "Кодировщику МП3"
                    deleted: false
                    text: "Вы не правы. \nДля проверки я взял \"Adobe Audition 1.5\"\
                      \ и провел анализ исходников и кодированных mp3. Исходники -\
                      \ рипованные треки и сгенеренный этой же программой шумовой\
                      \ (белый, розовый и коричневый). Риповщик - EAC V0,95b. Кодиовщик\
                      \ - \".mp3 Producer (professional)\", поток - 256 кБит. Обрезка\
                      \ не всегда идет выше 16 кГц, иногда выше 18-20 кГц, в зависимости\
                      \ от источника и уровня сигнала. Шумовые файлы, например, практически\
                      \ один в один. \nОднако если кодировщик что-то режет, надо понимать,\
                      \ что но старается выкинуть не нужное исходя из особенностей\
                      \ человеческого слуха, а не исходя из показаний графика анализатора\
                      \ частот.\n\nПовторюсь еще раз - качество всегда зависит\n-\
                      \ от самой музыки (риппинг или оцифровка);\n- самого енкодера;\n\
                      - настроек енкодера;\n- рученок мастера (рипповщика, оцифровщика,\
                      \ кодировщика).\n\nА чем вы рипуете и кодируете в mp3?"
