    subject: Martin Scorcese Presents The Blues...
    deleted: false
    text: "Сорри за лишние, может быть, подробности.\nИтак, 5 сентября 2002 года Конгресс\
      \ США принял решение объявить 2003 год \"Годом блюза\". При объявлении всего\
      \ этого говорилось о теле-сериале, продюсируемом Мартином Скорсезе. Так вот:\
      \ до премьеры остается месяц - начало показа 28 сентября. Будет 7 серий. \n\
      1. Feel Like Going Home - реж. Мартин Скорсезе. Фильм о блюзовых корнях. Путешествие\
      \ от берегов Нигера до плантаций Миссиссиппи. Музыканты: Ali Farka Toure (которого\
      \ называют африканским Джоном Ли Хукером), Salif Keita, Habib Koite (оба - музыканты\
      \ из Мали), Тадж Махал, Кори Харрис, Отас Тернер (его песню Shimmy She Wobble\
      \ Скорсезе использовал в \"Бандах Нью-Йорка\").\n2. Warming by the Devil's Fire\
      \ - реж. Чарльз Бернетт. История про парня и его семью и про взаимоотношения\
      \ между поколениями (действие происходит в Миссиссиппи в 1955 г.) через призму\
      \ музыки: \"правоверный\" госпел против \"дьявольской\" сущности блюза.\n3.\
      \ Piano Blues - реж. Клинт Иствуд. Собственно сабж, вкл. интервью и выступления\
      \ Рэя Чарльза, Фэтса Домино, Литтл Ричарда и Доктора Джона.\n4. Red, White and\
      \ Blues - реж. Майк Фиггис. Фильм о \"втором пришествии\" блюза в Америку на\
      \ волне \"британского вторжения\". Выступают и рассуждают о музыке: Эрик Клэптон,\
      \ Джеф Бек, Вэн Моррисон, Том Джонс и др.\n5. Godfathers and Sons - реж. Марк\
      \ Левин. Хотя один из основных действующий лиц - хип-хоп-исполнитель Чак Д (из\
      \ Public Enemy), тем не менее, фильм все же о Чикагском блюзе. Выступления Хаулин\
      \ Вулфа, Мадди Уотерса, Пола Баттерфилда, Коко Тейлор, Отиса Раша, Мэджик Слима,\
      \ Айка Тернера и др.\n6. The Road to Memphis - реж. Ричард Пирс. Фильм о БиБи\
      \ Кинге и г. Мемфисе. Выступают также Бобби Раш, Роско Гордон, Айк Тернер, использованы\
      \ старые записи Хаулин Вулфа и Фэтса Домино.\n7. The Soul of a Man - реж. Вим\
      \ Вендерс. Фильм о жизни нескольких известных блюзменов - Скипа Джеймса, Блайнд\
      \ Вилли Джонсона и Джей-Би Ленуара. Кроме оригинальных исполнений, каверы их\
      \ песен от Лу Рида, Ника Кейва, Кассандры Уилсон, Бонни Рэйтт, Лос Лобос и др.\n\
      Это еще не все. К каждому фильму выйдет отдельный CD плюс выйдет еще 5-дисковый\
      \ сет под названием \"Martin Scorcese Presents The Blues - A Musical Journey.\"\
      \ Диск с Таджем - один из серии. Остальные тоже в AMG посмотреть можно. Объявленная\
      \ дата релиза всех CD - 9 сентября."
