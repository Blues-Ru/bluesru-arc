  text: В Канне Вим Вендерс представлял свою часть скорсезевого сериала - the Soul
    of a Man. Говорил, что его любимые соул артисты - Блайнд Вилли Джонсон, Скип Джеймс
    и Джей Би Ленуар. Что Ленуар незаслуженно менее известен, а по Джонсону и Джеймсу
    практически нет архивных материалов. Видимо, поэтому, кроме прочих мелькали голос
    Бонни Райт и лицо Лу Рида. :^)
