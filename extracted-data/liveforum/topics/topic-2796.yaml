            subject: ТАК!
            deleted: false
            text: 'Как правильно говорит Фёдор The Moderator, нужна "некоторая безбашенность"
              для того, чтобы рисковать так играть.


              С другой стороны, многие опытные гитаристы играют специальные отработанные
              грязные приёмы, например, диссонансные парные и просто "кривые" одиночные
              бенды, демпфированные ноты и прочее, и прочее. Пример - концертный SRV,
              когда трезвый. У этого парня обычно все экспромты были хорошо отрепетированы.


              А вот Альберт Коллинз, по-моему, вообще никогда чисто в нашем понимании
              не играл. У него весь стиль состоял из потока шумо-нот, организованных
              особенным Коллинзовским чувством ритма. Поэтому Коллинз совершенно неподражаем
              в своём роде, и снимать его пиесы архитрудно - степень сходства, о которой
              я писал ранее, получается гораздо ниже 50%.


              На концертных записях даже аккуратнейший БиБи временами такие выдаёт
              пассажи, что ой-ой, но именно они особенно оживляют его соло, получаются
              типа "шутки гения".'
    - id: 23263
      parent_id: 23253
      date: 2005-09-19 14:16
      poster: Федор Романенко (fedor)
      email: fedor@blues.ru
      subject: Грязь...
      deleted: false
      text: 'Мне кажется, что термин многозначный, особенно в применении к обсуждаемым
        темам. У Хендрикса грязь - это некоторое безбашенное звукоизвлечение на сильно
        примоченной гитаре. Нелимитированное использование сильно примоченной гитары,
        недожатые струны, зацепленные лишние и пр. Он просто не придавал этому значения,
        отчасти, по молодости, потом, из-за стилистики с психоделическим уклоном и
        пр. Не ставил перед собой задачи "балансировки" звучания. Разумеется, он мог
        играть чисто и был крутейшим гитаристом. Просто на протяжении недолгой творческой
        карьеры делал это не всегда. Возможно, что лет через 5-10 он бы заиграл по-другому.
        Т.е. то, что было оправдано моментом для него лично в те 3-4 года, люди потом
        слушают годами и это нагружает уши.

        В блюзе, разумеется, нужна грязь. Я бы не стал ее отождествлять с Хендриковской.
        Гладкость без дополнительной окраски может быть недостаточно выразительна.
        Грязь может быть допустимой небрежностью, не портящей картины и дающей что-то
        дополнительно. Но, надо понимать, что "грязь" также может быть выверенным
        музыкальным приемом хорошего музыканта, который контролирует звук от начала
        и до конца.'
      replies:
      - id: 23266
        parent_id: 23263
        date: 2005-09-19 15:15
        poster: Старый Майор
        email: gypsy@mail.ru
        subject: Очерки бальнеологии
        deleted: false
        text: "Всё блюзовое звукоизвлечение с точки зрения классических и традиционно-ориентированных\
          \ джазовых музыкантов - это такая зюка! \n\nПросто мы уже привыкшие, уши\
          \ адаптировались, и поэтому начинаем делить грязь на традиционно-чистую,\
          \ можно сказать, привычную, и такую совсем грязную-прегрязную.\n\nКлассифицируя\
          \ дальше, можно грязь разделить на вредную и целебную. Целебная грязь полезна\
          \ для ушей блюзофила как антицеллюлитный бальзам для бёдер красавицы, а\
          \ вредная - наоборот.\n\nИ как говорили древние, \"дай мне Б~г мудрости\
          \ различить одно от другого\"."
      - id: 23269
        parent_id: 23263
        date: 2005-09-19 16:42
        poster: Muddy Lives
        email: mlives_6@hotmail
        subject: :)
        deleted: false
        text: "Хорошо сказано.  Я бы еще сказал, что есть грязь, которая может быть\
          \ неприятной сама по себе, но тем не менее очень приятной и интересной в\
          \ контексте всего творческого процесса.  Когда человеку удачно взбирается\
          \ в гору, очень интересны и те моменты, когда падает вниз.  В классической\
          \ музыке часто скрывается этот процесс.  Но влюз - это музыкальное общение\
          \ в настоящее время.  Когда отрабатывается блюзовая песня до такой степени,\
          \ что грязи вообще нет, общение может получиться очень искусственным.  Блюз\
          \ - это реализм, а не социалистический реализм. :)       \n\nMuddy"
