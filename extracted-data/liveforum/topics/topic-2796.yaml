    text: 'Владимир, возможно вы понимаете под словом "грязь" не то, что имеют в виду
      многие участники форума.

      У Хендрикса на самом деле немало грязи, это вам любой гитарист потвердит. Посмотрите
      его видео. Сравните игру Джими с, к примеру, игрой С.Р.Воэна и сразу заметите
      разницу. У СРВ чистая игра, без таких моментов как недожатая струна и т.д.

      Кстати, это никак не умаляет его талантов и заслуг. Это просто факт.

      P.S. Этот вопрос, вообще-то совсем не вопрос. В смысле не вопрос для обсуждения
      на форуме, IMHO. Хотел было на мыло ответить, но там левый адресок: а"нф...

      Ещё раз, IMHO: думаю это обсуждение можно удалить.'
