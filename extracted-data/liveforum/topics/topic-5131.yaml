  text: 'Кто-то не поленился склеить вместе три разных фильма, снятых в начале 70-х.
    В итоге получилось 2 часа, и стоит сразу отправиться на ю-туб, чтобы посмотреть
    их в три приема - там есть ссылки на главы.

    1. - прекрасный Лайтнинг, снятый гепосредственно в среде его обитания и блюзования.

    2. - Рузвельт Сайкс за роялем в концертном зале и за пианино у себя дома.

    3. - История блюза с БиБиКингом. БиБи, звезда ритм-энд блюза и родоначальник модерн-блюза.
    Это стили "эстрадные". А тут можно посмотреть, как он возвращается на родину,
    в Миссиссиппи, чтобы поговорить о блюзе "от сохи": самом изначальном, неотесанном,
    далеком от эстрады. БиБи рассказывает о нем с необыкновенной теплотой и с полным
    понимание. А Сэм Чатмон доказывает делом, что тот древний блюз вполне жив-здоров
    на момент съемок.


    Знание английского, конечно, поможет. Но даже если и нет его, сама атмосфера фильмов
    располагает пропитаться тем блюзом, с которого все и началось.


    Ну и надо, наверно, предупредить: рассчитано на подготовленного зрителя-слушателя.


