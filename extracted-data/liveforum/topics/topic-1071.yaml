  subject: Вопрос по концертам Бюска
  deleted: false
  text: 'В каком составе будет выступать группа Бюска: ''гитара + бас + ударные +
    САМ'' или будет кто-то ещё?'
  replies:
  - id: 4525
    parent_id: 4524
    date: 2002-05-20 00:28
    poster: Федор Романенко (fedor)
    email: fedor@blues.ru
    subject: Состав & Музыка
    deleted: false
    text: 'Вообще, в последнее время он выступает в составе трио - Бюск на страте
      и баритон-гитаре, Мартин Виндстад на барабанах, Бьерн Хольм на басу (иногда
      он играет и на контрабасе, но контрабас не лезет в самолет).

      По самым последним сведениям программа будет наполовину из старых вещей, а на
      другую половину - из новых с самого последнего альбома. Этот вопрос еще в стадии
      обсуждения, возможно старых вещей будет больше. На последнем альбоме музыка
      записана весьма качественная, но "легкая, тихая и спокойная" - смесь блюза и
      поп-музыки. Для концертов они передалали музыку с последнего альбома в более
      блюзовом ключе, но много чего из альбома осталось. В связи с этим четвертый
      член группы, выступающий с ними последние полгода, играет на перкуссии, ритм-гитаре
      и ставит сэмплы с шумом ветра и звуками прибоя. Вот такие дела. Надеюсь, что
      это никого не отпугнет, ибо крутизны там все равно навалом. Для Бюска, что называется,
      нет стилистических рамок. ;)

      Вообще, из Нотодденского опыта следует, что Бюск играет два дня подряд совершенно
      разные концерты. Сначала аранжированный с дудками и всеми делами, а на следующий
      день - клубный в уменьшенном составе и в более горячем режиме. Возможно, что,
      например, в БиБиКинге будет более блюзовая программа, но точно пока непонятно...
      Но идти ТОЛЬКО в БиБиКинг, к примеру, я бы тоже не советовал, ибо концерт, может
      быть, будет неполным и пр... Посмотрим...'
