        subject: Контрабас и состав
        deleted: false
        text: 'Контрабас, на самом деле, влезет, но ему тогда нужно покупать отдельный
          билет на самолет ;))

          По поводу состава - Бюск откатал 2 года гастроли с оркестом со свинговой
          программой с альбома Atomic Swing, после чего это ему, естественно, надоело
          в некоторой степени ;) И он в очередной раз на время сменил ориентацию.
          Теперь играет на страте "под Хендрикса" в некотором смысле, но похожи, конечно,
          только отдельные детали.

          Первая "попытка" и разговор о том, чтобы прокатить в Москву Бюска был как
          раз на рубеже 99-2000г., но тогда нам прислали список на 11 человек. (Мобильный-сокращенный
          состав оркестра). Ну и это, конечно, было нереально по финансовым соображениям.
          И сейчас это нереально, но как-то получилось... ;)

          С другой стороны, чем меньше состав, тем больше возможностей для импровизации.
          Я имею в виду даже не отдельные такты в гитарном соло, а возможность по
          ходу принять решение, куда завернет играемая песня, в частности, и в гармоническом
          плане. ;)'
