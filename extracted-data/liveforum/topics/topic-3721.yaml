  subject: Итальянский блюзмен устроил скандал на концерте в Сардинии
  deleted: false
  text: "http://www.rian.ru/incidents/20070814/71492258-print.html\n14/08/2007 17:56\n\
    РИМ, 14 авг - РИА Новости, Сергей Старцев. Знаменитый итальянский блюзмен Дзуккеро\
    \ (Zucchero) устроил скандал на собственном сольном концерте на курорте Порто\
    \ Черво (Porto Cervo) на Изумрудном побережье Сардинии, сообщают местные СМИ.\
    \ \nВыступая в пятизвездочном отеле \"Кала ди Волпе\" (Cala di Volpe), клиенты\
    \ которого выложили до 1,2тысячи евро за ужин под музыку звезды итальянского блюза,\
    \ Дзуккеро осыпал публику ругательствами. \nПри этом музыкант громогласно заявил,\
    \ что выступает здесь только потому, что ему за это хорошо заплатили. \"Вы мне\
    \ омерзительны!\" - прокричал музыкант. \nВ особенности гнев Дзуккеро вызвала\
    \ некая дама, которая увлеченно отправляла кому-то SMS, не обращая никакого внимания\
    \ на музыку. В адрес женщины со сцены тут же полетели проклятия, а затем и пустая\
    \ бутылка из-под лимонада. \nОднако певец промахнулся и, по данным местной прессы,\
    \ попал в компанию российских туристов, сидевших за соседним столиком. Они не\
    \ только не замедлили с ответом, начав бросать в музыкантов пустые бутылки, но\
    \ и попытались прорваться на сцену, чтобы \"разобраться\" с разошедшимся блюзменом.\
    \ Только жесткие действия секьюрити и пожарных предотвратили неминуемую стычку.\
    \ \nСам Дзуккеро, похоже, остался весьма доволен своей выходкой. \n\"Эта публика\
    \ заметно отличается от тех, кто ходит на мои концерты. Поэтому чтобы завести\
    \ ее - не скрою, - мне приходится прибегать к саркастическим репликам и даже к\
    \ провокациям\", - признался певец после концерта, сборы от которого составили\
    \ 1,2 миллиона евро, 300 тысяч из которых стали его гонораром.\nПять лет назад\
    \ в этом же отеле Дзуккеро учинил аналогичный скандал. \n\"Несмотря на это меня\
    \ пригласили сюда вновь, а это означает, что публика осталась довольной\", - сказал\
    \ 50-летний музыкант, который заехал на Сардинию, временно прервав свое мировое\
    \ турне.\nПравда, на сей раз некоторые клиенты \"Кала ди Волпе\" потребовали возместить\
    \ им цену за билет на скандальный концерт, согласившись оплатить только ужин.\
    \ Администрация отеля удовлетворила эти требования, говорится в сообщении."
