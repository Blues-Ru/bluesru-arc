  text: "В рамках творческого конкурса, проводимого динатоном, отобраны и размещены\
    \ в блоге 10 историй о губной гармошке (в основном, блюзовой). Среди них - несколько\
    \ довольно забавных экземпляров. \n\n<<с 25 октября по 8 ноября Вы можете проголосовать\
    \ за понравившуюся Вам работу, просто поставив метку напротив названия статьи\
    \ в списке.>> По итогам голосования, будут определены победители конкурса. \n\n\
    Кому интересно, пожалуйста голосуйте: \nhttp://hohner.ru/blog/news_konkurs-hohner-ru-golosovanie.html"
