    deleted: false
    text: 'Усталость не позволяет излить впечатления развернуто. С другой стороны,
      политкорректность подсказывает мне не делиться неприятной частью впечатлений
      прилюдно. ;) Отметить хочется несколько вещей.

      Больше всего мне понравился Регтайм в самом начале. Арсен выбросил из руки корнеплод
      и сыграл расслабленней и живее обычного. ;) Во время их выступления я словил
      музыкальный кайф. Говорят, что их концерт в субботу в Форте был очень хорошим,
      но там было всего человек 15, все ушли на фронт.

      Мишурисы сыграли на своем обычном высоком уровне, который лучше оценивать на
      большом клубном персональном концерте, на котором не будет отдельных проблем
      со звуком.

      На малой сцене регулярно перетасовывалась команда из Гургена, Жука, Кожекина,
      Ветерана и других участников. Временами получалась веселая музыка с веселыми
      ритмами. Больше всего мне понравился аккомпанимент Жука ко всем группам на клавишах
      со звуком Хаммонда. Жук играет на клавишах с неменьшим воодушевлением, нежели
      чем на гитаре.

      Вова Могеладзе с группой Блюз Мобиль из Тбилиси, который регулярно разъезжает
      по европейским гастролям, продемонстрировал наиболее "фирменный" звук. Репертуар
      состоял из песен с 3-5 дисков, сооставляющих букварь начинающего блюз-рокера
      (Стив Р.В., Джонни В. и пр.). Несмотря на высокий класс музыкантов, постоянный
      перманентный гитарный забой (довольно чистый по звуку, при этом) переносить
      было крайне тяжело, как морально, так и физически. После их выступления я чувствовал
      себя как килограмм раздавленных помидоров. Ну нельзя так играть ;))) Когда происходит
      непрерывное жужжание на двух примоченных гитарах одновременно, в течении одной-двух
      песен можно поверить, что в этом драйв и фишка. Но, если весь концерт, то это
      уже не смешно и не прикалывает. ;)) Одним словом, после их выступления осталась
      куча противоречивых впечатлений, чувство подавленности, а также было смешно
      в процессе ;) Нельзя так!!!!! ;))

      Под конец выступили Blues Doctors - группа из четырех человек с гитарой и клавишами
      из Екатеринбурга. Они приехали в Москву специально, чтобы сыграть 45 минут на
      фестивале по собственному желанию. Владимир Демьянов играет на гитаре и поет.
      Группа нам очень понравилась. Мне очень понравилось "весьма блюзовое пение"
      Демьянова с соответствующими песне эмоциями в нужных местах. Т.е. это не идеальное
      пение поставленным голосом, а именно то, как нужно петь блюзовые песни, с чего
      нужно начинать и пр. У нас, как ни странно, не так много народу это умеет делать
      ;) К гитаре это относится в той же степени ;) Ритм секция играет хорошо, без
      каких-либо видимых проблем, как с шаффлами, так и в блюз-роковых песнях. Некоторым
      недостатком является недостаточное разнообразие в звуке и выборе репертуара,
      который составлен их простых песен - классических блюзов - лютер эллисон, песня
      кроссроадз, текила и пр. Общее впечатление, несмотря на мелкие недостатки, очень
      хорошее. Многие столичные даже очень известные ансамбли явно уступают Blues
      Doctors из Екатеринбурга в умении исполнять блюз ;)

      На фестивале было не скучно. Мне он понравился больше, чем в 2001 году ;) Народу
      было много, люди веселилсь, было здорово ;)'
