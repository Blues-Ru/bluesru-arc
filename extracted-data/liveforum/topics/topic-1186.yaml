  text: 'после фестиваля blues.ru  вчера в Б2..

    Фест немало порадовал  -все было клево и правильно (ну, за исключением платы за
    вход и пиво-  цены , чессно говоря огорчили, а некоторых -просто обломали). Но
    главное, все же - правильная блюзовая атмосфера и драйв. Что было -то было! Жаль,
    служба не позволила дождаться Левана и Blues Doctors - пришлось уйти раньше (как
    , впрочем, и многим -это минус будних концертов)...

    Вообще -все было очень здорово, не считая отдельных орг.моментов (типа -приходилось
    бегать из зала в зал т.к. хотелось всего и сразу) или технических моментов -это
    когда контробасист  у Мишуриса играл "на ощупь" -мониторы не работали.. Но,вцелом
    - было отлично!!!

    Думаю, что положительных отзывов о фесте еще будет достаточно.

    Отдавая отчет, что местная уважаемая публика меня порвет за эти слова  -позволю
    высказать пару замечаний по теме.

    1.К вопросу о каверах

    Было прикольно  -группа выходит и грит, типа -"Ета вещь уже звучала сегодня, но
    мы ее исполним еще раз, думаем -не испортим"

    Развивая ситуацию  -выходит следующая команда и играет тоже  -и так далее...К
    концу феста просвещенная публика думает, что пирожок, конешно, хорош, однако уже
    набил оскомину...

    Ведь -классные музыканты - ну чего не играть свое-то??

    2.К вопросу о языке

    Можно, конечно, исполняя кавер-версии известных вещей  -что-нить бубнить на пиджин-инглиш.Можно
    ваще - петь на волюпяке  -публике пофигу. Все тащатцца от драйва, от энергетики,
    от мастерства музыкантов. Однако, ИМХО  - при этом мы теряем что-то главное в
    восприятии этой музыки, смысл и причину переживаний блюзмена, сопереживанию его
    порывам.На родном-то языке это все гораздо глубже и ярче воспринимаетцца..

    Особенно пондравилось -ета када благодарят публику на английском. Тоже прикол,
    сэр Пол  -общается с нами на русском, а свои , родные -на английском...

    Отдельные и персональные решпекты -Жуку и Кожекину -БРАВО!!

    А также басисту со "Станции Мир" ( к сожалению не знаю имениотчества).

    Федора было отчего-то жаль  -выглядел он потерянным и уставшим ( все равно, молодец).

    Кстати, пару фотозарисовок с феста можно посмотреть здеся:

    http://www.rusblues.ru/galery/galery04.shtml

    Всем персонажам желаю здоровья, счастья и творческих успехов %)))'
