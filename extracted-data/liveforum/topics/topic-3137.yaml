  text: "Я тут два месяца назад придумал в жж информационный проект \"Энциклопедия\
    \ хорошей музыки\" - типа википедии - раздел \"отечественные блюзмены\" там сейчас\
    \ очень скуден - требуются авторы. Нужны статьи про всех любимых активно концертирующих,\
    \ про клубы, про общую ситуацию с блюзом в городе. Помогайте. \nМирмузуки - межстилевая\
    \ информационная площадка, позволяет привлечь на концерты людей, которые любят\
    \ не только блюз а вообще разную честную музыку. Хотелось бы, чтобы информация\
    \ по блюзменам там была исчерпывающая. \nЖмите ссылку и ищите знакомые лица на\
    \ общей \"Доске Почета\"\nhttp://community.livejournal.com/mirmuzyki/profile"
