  text: "Ещё один коллектив, родившийся на обломках звёздного свингующего оркестра\
    \ Михаила Мишуриса. Когда-то все они были вместе, теперь у каждого своя группа.\
    \ Что занятно, все они играют достаточно близкую музыку, и у всех получается весьма\
    \ достойно. Как говорится, талант не пропьёшь. Возглавил команду классный кларнетист\
    \ Сергей Шитов, отметившийся также несколько лет назад участием в группе «Green\
    \ Square» с вокалом Тамары Кожекиной и харпом Миши Владимирова. Помимо кларнета\
    \ в «26 Hz» имеются также гобой, гитара, контрабас, ударные и, разумеется, вокал.\
    \ Свинговый джаз 30-х годов с элементами латины – пожалуй, так можно охарактеризовать\
    \ музыку, которую исполняет коллектив. Название – да, странное, а объяснение такого\
    \ наименования весьма нетривиально: 26 Hz – это частота, на которой мурлыкают\
    \ кошки, а также частота холостого хода дизельного трактора. Музыканты решили,\
    \ что солистка Екатерина Зенич мурлыкает, как кошка, а инструменталисты звучат\
    \ как дизельный трактор. По-моему, здОрово придумано, а!?:)\n\nВесело, со вкусом,\
    \ с юношеским задором – мало какой коллектив может похвастаться подобным сочетанием.\
    \ Плясками «Экспедиция» была поставлена на уши ещё в первом отделении, несмотря\
    \ на весьма поганенький звук (сводчатые низкие потолки дают о себе знать), однако,\
    \ во втором отделении звукорежиссёр сделал почти невозможное: Екатерина Зенич\
    \ наконец-то зазвучала. Кстати, у девушки очень приятные подача и тембр, которые\
    \ наложенные на непосредственность молодости дают классный результат! Основа группы\
    \ – духовики. Ритм-секция и гитара лишь создают фон, причём гитаристу лучше солировать\
    \ не давать. Пусть играет, как умеет в том качестве, в котором он более уместен.\
    \ По крайней мере, пока.\n\nПриятно ощущение, что для ребят такие выступления\
    \ ещё не стали рутиной. Обаяние молодости вкупе с талантом рождают зажигательную\
    \ искристость, чем на самом деле могут похвастаться далеко не все группы. \n\n\
    Следующий концерт «26 Hz» состоится 14 октября в «Доме у дороги»."
