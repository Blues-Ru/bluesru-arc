    этих постингов бессодержательность. Перепалочки. Упражнения по английскому. Первоапрельские
    шуточки. Реакции на первоапрельские шуточки. Экскламации по поводу первоапрельских
    шуточек. Реакции на реакции на первоапрельские шуточки. И т.д. и т.п.

    Ребята, собака вас кусай. Цените своё слово, в конце-то концов.

    И время потенциального читателя тоже.

    А то форумов-помоек в рунете и так до фига.'
