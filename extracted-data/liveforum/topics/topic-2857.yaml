            deleted: false
            text: 'Я согласен, что альбомы с Уинтером не сравнить с классическими
              записями 40-ых и 50-ых годов.  Тем не менее эти альбомы мне очень нравятся.
              Они повели к некоторому возрождению карьеры Мадди.  Я видел Мадди на
              концерте в 1977-ом, и он казался уже усталым и мало заинтересованным
              в своей музыке.  С Уинтером появилась новая искра.  Мадди сам стал более
              живым на сцене.  Видно, что ему самому было лучше и интереснее.  И он
              стал играть на гитаре больше.


              Muddy'
