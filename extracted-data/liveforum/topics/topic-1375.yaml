  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=MISS70308221724&sql=Acpex97l7krjt\n\
    \nНу всё, Джон затусовался с джазменами и ему это нравится! Им тоже нравится,\
    \ нам должно понравится! \n\nАльбом концертный на 45 минут и состоит всего из\
    \ 7 песен. Состав очень интересный: Блю Митчелл на трубе, Клиффорд Соломон - саксофоны,\
    \ Ларри Тэйлор по-прежнему с Джоном на басу, Рон Сэлико - барабаны и Фредди Робинсон\
    \ на гитаре - классный музыкат! Записано в Бостоне и Нью-Йорке, хорошо записано\
    \ и сыграно.\n\nПервая вещь - Country Road - традиционный блюз в отличном исполнении,\
    \ Mess Around - классика жанра в битовой обработке, Good Times Boogie - шустрый\
    \ буги-блюз с джазовыми импровизациями, Change Your Ways - великолепный фанковый\
    \ номер с отличной темой, Dry Throat - медленный блюз в интересном груве, Exercise\
    \ In C Major For Harmonica - все поиграли, поимпровизировали, но без музыки, Got\
    \ To Be This Way - приличный фанки-блюз. Лучшая вещь - Change Your Ways.\n\nОценка\
    \ 4. Можно было все это подать и лучше. Вещи не самые интересные порой. Впечатление,\
    \ что мало репетировали. Ну и концерт - есть концерт, много минусов случайного\
    \ одноразового исполнения.\n\nДжаз-блюз - это хорошо, но надо работать и над этим."
