  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDCASS80312182150001223&sql=Aoe6qoauabijm


    Довольно сильная посмертная компиляция Стиви. Понятно, что она никогда бы не была
    выпущена в этом виде, будь СРВ жив. Душевная подборка из десяти композиций, что-то
    типа альтернативного The Best Of SRV 1984-1989. Конечно, этот сборник не дотягивает
    до качества двух первых альбомов Стива, но он обязатален в коллекции из-за нескольких
    отличных треков! Sky Is Crying, Little Wing (хорошо, что она инструментальная),
    Chitlins Con Carne (Стив очень хорош, когда вдумчиво и красиво играет), Life By
    The Drop (своего рода "прощальная" СРВ); эти треки просто супер! Остальные - обычный
    Стиви с шумной игрой на гитаре и зажатым голосом. Оценка 3 балла; немного не хватает
    на классный посметрный альбом типа Cry Of Love Джими Хендрикса, например.'
