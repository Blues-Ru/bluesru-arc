  text: 'Посчастливилось послушать выступление одного из лучших певцов блюза и соула
    а также отличного гитариста - Адриана Барнса. Диапазон голоса от Барри Уаита до
    Куртиса Мейфельда, отличное природное вибрато и нюансировка. После концерта познакомился,
    разговорились и он выразил огромный интерес поехать на гастроли в Москву и в Питер.
    Интересно кто и как организует это дело у вас. За инфо буду весьма признателен.

    А так посмотрите и послушаете его здесь - http://www.adrianburns.com/'
