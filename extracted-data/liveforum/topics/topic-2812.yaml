  text: 'Чаще бывает after-party. В пятницу 23 сентября в Би Би Кинге происходила
    pre-party одного из участников фестиваля «Филёвский блюз» Arina & Veto-Bank.


    Кажется, впервые после более чем 13-летнего перерыва (после феста 92-го года «Блюз
    в России») литовцы приехали с концертами в Москву. Надо сказать, в Москве таких
    блюзовых/блюз-роковых вокалисток, как Арина, нет. Есть, конечно, поющие женщины,
    но у них нет почти кошачьей пластики и мягкого, но сочного тембра, как у Арины,
    поэтому её безусловно стоило послушать.


    Программа, начавшаяся как блюзовая или блюзово-фанковая, постепенно переместилась
    в рОковое поле, снизив чёрную составляющую и напротив приобретя прямолинейное
    звучание. А начало, надо сказать, было знатное: сочно-мурлыкающий, яркий голос
    Арины, плюс свингующе-фанкующий Korg, плюс сакс. В коем-то веке в Би Би Кинге
    был пристойно отстроен звук. Просто мняяяяя!:))))) Потом стало больше рока. Хорошо,
    но уже не то. Жаль, что народу было маловато. (видимо, в этот вечер вся блюзовая
    общественность направилась в ЦДХ на Джона Праймера), а те, что пришли, в гораздо
    большей степени были заняты друг другом и поглощением пищи, нежели происходившем
    на сцене. Ясно, что зрители влияют на происходящее на сцене. Отсутствие контакта,
    всё такое… Концерт закончился на удивление внезапно.'
