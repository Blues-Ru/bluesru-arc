                            deleted: false
                            text: '- В кэше Оперы находим файл с именем типа opr0011K.tmp
                              и копируем его. Далее сохраняем его в другом месте и
                              переименновываем его РАСШИРЕНИЕ (но не имя файла!) с
                              ***.tmp на ***.flv

                              Усё! Файл готов!

                              - Кэш браузера Mozilla Firefox

                              В адресной строке Mozilla Firefox ввести:

                              about:cache

                              и там внизу быдет указан адрес кэша браузера Mozilla
                              Firefox. Что-то типа:

                              Cache Directory:

                              C:\Documents and Settings\Admin\Local Settings\Application
                              Data\Mozilla\Firefox\Profiles\wsprlwvu.default\Cache

                              А вот как файл там найти и как его оттуда выцыганить
                              я не знаю :-('
