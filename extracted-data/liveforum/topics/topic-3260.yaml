                      subject: Значится так
                      deleted: false
                      text: "Более-менее разобрался. Значится так, качал это видео:\n\
                        <a href=\"http://www.youtube.com/watch?v=1NRUbNLONqM&search=Stevie%20Ray%20Vaughan%20blues%20guitar\"\
                        >Guitar - Acoustic Slide - Erik Darzell (Guitar clip - acoustic\
                        \ slide clip based on Led Zeppelin's Traveling Riverside Blues)</a>\
                        \ (время - 01:18, размер - 1.11Mb)\nНе получилось мне надыбить\
                        \ ссылку для скачивания с помощью даунлоуд менеджера (программы\
                        \ для скачивания файлов, типа FlashGet, ReGet, Download Master\
                        \ и т.д.).\n<b>А нужна ли она?</b> \nВедь всё равно, даже\
                        \ с нею закачивается в <b>один</b> поток/канал (не разбивается\
                        \ файл на несколько частей и каждая часть закачиваются) и\
                        \ докачка там не поддерживается. Так что в этом случае, что\
                        \ закачка с помощью даунлоуд менеджера, что закачка с помощью\
                        \ браузера - результат тот же самый (и по времени так же).\n\
                        Поэтому с помощью браузера я скачал вышеозначенную станичку\
                        \ с тем видео. Теперь будучи неподключенным к Интернету (в\
                        \ офф-лайне) я могу просматривать это видео в окне браузера\
                        \ в автономном режиме. Видео-файл сохранен в кэше браузера,\
                        \ в папке Temporary Internet Files. Надо лишь его найти там\
                        \ и скопировать в другое место (например, сохранить/вставить\
                        \ на Рабочем столе).\nРаньше я просто шёл в эту папку которая\
                        \ (у меня в Widows XP professional) находится по адресу C:\\\
                        Documents and Settings\\Admin\\Local Settings\\Temporary Internet\
                        \ Files\\\nНо в это раз я там его не увидел. Даже с помощью\
                        \ Поиска (Search) по слову flv (это расширение искомого файла)\
                        \ не получилось. Но файл-то там есть! Надо в адресную строку\
                        \ ввести адрес C:\\Documents and Settings\\Admin\\Local Settings\\\
                        Temporary Internet Files\\Content.IE5 чтобы зайти в папку\
                        \ Content.IE5. Там можно увидеть несколько папок с именем\
                        \ из букв и цифр типа X827GEBF. В одной из них и найдется\
                        \ тот файл. Можно искать по размеру (в моём случае это был\
                        \ 1,1Mb.) или по имени (судя по адресу той странички имя должно\
                        \ быть 1NRUbNLONqM.flv или без расширения 1NRUbNLONqM), но\
                        \ легче всего воспользоваться Поиском (Search) по слову flv.\n\
                        Нашёл файл, скопировал в другом месте. Усё! Либо смотрю с\
                        \ помощью соответствующего плейэра, либо конвертирую в другой\
                        \ более мне приемлимый формат. Теперь могу поделиться файлом\
                        \ со своими друзьями -  что мне и нужно было!\n<b>Важно: я\
                        \ делал это с помощью Internet Explorer! Это также работает\
                        \ для различных надстроек к нему, например, Avant Browser,\
                        \ Maxthon, My IE и т.д.\nКак это работает для Opera, Mozilla\
                        \ Firefox и других браузеров я не знаю (точнее я не знаю как\
                        \ вытащить закаченный файл из браузерского кэша (Cache). Если\
                        \ кто знает, прошу расскажите).</b>"
