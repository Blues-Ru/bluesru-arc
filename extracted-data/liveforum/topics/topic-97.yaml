      Европу, понятно, они сами запечатывают - оттуда и полиэтилен неправильный. Всё
      это делается в целях экономии на таможне, скорее всего, и привозят все в разборе.
      Но бывают казусы и с американскими пластинками - будьте осторожней и внимательней.
      У меня уже есть одна такая некондиция с царапиной, купленная, тем не менее,
      за регулярную цену. Честнее было бы и вовсе не запечатывать или давать прослушивать.
