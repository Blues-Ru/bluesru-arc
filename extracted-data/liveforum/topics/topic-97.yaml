  deleted: false
  text: "дипломатично говоря...\nПосмотрел дискографию и рецензии  Форда на \nhttp://rubl.ru/band/RobbenFord\n\
    решил по старой памяти преобрести диск Handful Of Blues \nв пурпурке и увидев\
    \ там Blues White Album не мог его не приобрести.\nВпечатления - в общем Форд\
    \ больше покатил - но это касается исполнения\n\nхотя наверное белый альбом надо\
    \ послушать несколько раз чтобы понять все правильно - иногда нетерпеливость в\
    \ ожидании сменяется разочарованием, и только потом приходит объективная оценка.\n\
    Хотя следует отметить качество записи - очень плотный звук,\nкороче звукач на\
    \ мой взгляд поработал на славу.\nПравда счас хожу в непонятках по поводу оформления-\n\
    запечатка диска похожа на самоделюьно местную а на полиграфии стоит номер - думал\
    \ что это номер типа оригинальный - а потом посмотрел там несколько дисков и увидел\
    \ что номер один и тот же\nсчас маюсь сомнениями - не качественная ли это подделка???\n\
    вроде все в порядке но вот номер - может кто-нибудь сможет подтвердить или опровергнуть\
    \ мои сумнения...\nвсе ж таки 16 кровных баков.... \nможет надо было на горбе\
    \ за 2 купить???\nХотя Beatles уважаю и беру их диски в коллекцию только в японском\
    \ варианте..."
