  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70402170604091416&sql=Awkua6jo771u0


    Надо сразу отметить, что этот дебют Джуниора на Telarc Blues самый слабый из трех
    альбомов на этом лейбле. Тут Бадди Гай на гитаре, Лаки Питерсон на клавишал, но
    материал слабый, а подача очень холодная. Это просто удивительно! Можно выделить
    лишь интересные обработки Oh, Pretty Woman и The Train (Ray Charles).


    Оценка 3 балла. Хороший живой звук, классные музыканты, неяркие композиции, что-то
    слишком затянуто, холодно и бездушно местами. 10 треков на 60 минут - это слишком
    долго для такого диска.'
