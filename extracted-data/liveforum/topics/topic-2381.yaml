  subject: Gatemouth Brown
  deleted: false
  text: "Gatemouth Brown - это один из настоящих оригиналов американской музыки и\
    \ основателей R&B.  Как блюзовый гитарист, он - легенда, и сильно повлиял на многочисленных\
    \ гитаристов с 1940-ых годов.  На скрипке (fiddle) он тоже прекрасно играет. \
    \ Его музыка и музыкальные интересы не признают ограничений одного или другого\
    \ жанра.       \n\nМало осталось на земле таких блюзовых гигантов, как Gatemouth\
    \ Brown.  Но по-видному он скоро нас тоже покинет.  Летом прошлого года Gatemouth\
    \ узнал, что болеет раком легких.  Он отказался от курса лечения и продолжал жить\
    \ свом обычным образом жизни.  Вчера я получил вести от близких к нему людей,\
    \ что его состояние здоровья очень ухудшилось.  \n\nДаваете будем его вспоминать,\
    \ пока он еще жив.  Gatemouth Brown нуждается в наших молитвах.  \n\nMuddy"
