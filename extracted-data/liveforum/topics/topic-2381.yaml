          text: "Я пока не слышал Timeless.  Собираюсь его купить.  Его диски последних\
            \ лет часто содержат большое разнобразие материала и жанров (blues, R&B,\
            \ jazz, country).  Признаться, для меня это часто слишком много.  В зависимости\
            \ от настроения я могу с удовольствием слушать музыку из любых этих жанров.\
            \  Но редко хочется все слушать одновременно.  Поэтому я лично предпочитаю\
            \ те диски Gatemouth, где меньше стилистических отлонений от блюза и R&B.\
            \  Это включает его первые записи (The Original Peacock Recordings и другие)\
            \ и Gate Swings.  (Кстати, первый диск Gatemouth Brown из французской\
            \ серии Chronological Classics содержит все его ранние записи, которые\
            \ не на The Original Peacock Recordings.)             \n\nMuddy"
