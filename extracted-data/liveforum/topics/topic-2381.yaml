    text: "...это один из первых настоящих музыкантов (блюзовых,не блюзовых - какая\
      \ разница...) которого мне довелось слушать в живую ....Это были мохнатые пьеха-кобзонисто-силантьевские\
      \ семидесятые годы в городе Тбилиси. Проводился один из первых американских\
      \ фолк-просветительных фестивалей в рамках сов - ам.дружбы.\nПредставьте себе\
      \ филармоническую сцену с кучей пожарников за кулисами, которые падали в обморок\
      \ от одного вида Брауна с сигарой (сигарилло)во рту.\nХотите верьте, хотите\
      \ нет - я видел одного из пожарников с огнетушителем на изготовку.... \nА уж\
      \ что вытворял Гейтмаус на сцене!!! И гитара и скрипка дымились в его руках...Зал\
      \ стоял на ушах! \n Приехавший после него ББ Кинг (которого я очень люблю!)\
