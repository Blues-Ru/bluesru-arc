  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDSUB040312222115401377&sql=Acf9us30la3zg


    Они правы на Оллмьюзике, этот альбом стоит назвать Эрик и БиБи, но не наоборот.
    Странно, что этого диска просто НЕТ в дискографии БиБи на Оллмьюзике, хотя первым
    стоит именно его имя. Альбом вышел на лейбле Эрика Reprise Records, на диске играют
    эриковские музыканты. Тут Andy Fairweather Low, Doyle Bramhall II, Nathan East,
    Steve Gadd!!!, Joe Sample!!!. Лучшие из лучших, это слышно с первых нот. Стив
    Гадд даже в этой музыке умеет делать ВСЁ!


    Самое интересное, что это почти спасительный альбом для Эрика! Его последняя приличная
    работа была аж в 1994 году (Пилигрима мы не будем считать, с Вашего позволения)!
    Для Кинга это очередная клевая тусовка, но очень старается и даже играет тут на
    АКУСТИЧЕСКИХ гитарах в некоторых треках!


    12 отличных песен, много блюза, есть соул-рок, есть даже джаз в виде Come Rain
    Or Come Shine (одна из лучших вещей на альбоме). Отличное исполнение Help The
    Poor! Оценка 4 балла. Слишком уж это эклектично даже для Эрика. Мощные роковые
    треки типа Riding With The King или Marry You звучат очень странно с милыми и
    акустическими Key To The Highway или Help The Poor. Такое ощущение, что они легко
    могли сделать два альбома из этого материала, один соул-роковый, другой акустический
    по блюзу. Но они сделали по-другому. В любом случае, это лучшая работа Эрика за
    последние 6, а может быть и 8 лет, и уж точно лучшее "тусование" БиБи за всю его
    жизнь. Мечта Эрика сбылась, он записал диск с БиБи, а вот сбылась ли мечта БиБи?


    Эрика в молодости спрашивали как он так хорошо умеет играть по блюзу на гитаре?
    Он отвечал, что ВСЁ, что он делает, - это КОПИРУЕТ БиБиКинга!'
