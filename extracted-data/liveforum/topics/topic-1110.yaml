                          ночи", честно говоря, жалко.

                          Однако ж если интересует именно глава про Эстеса, то это
                          вопрос решаемый, она не такая уж большая. Можно отксерить,
                          можно отсканить, и т.д.

                          В общем дилемма следующая: маленькие раки сегодня по три,
                          либо большие по пять завтра. Давайте обсуждать.

                          В порядке жеста доброй воли готов также нарезать копию язушного
                          сборника Эстеса 1929 - 1941 годов, или ещё чего-нибудь из
                          него же 60-х. Это вообще один из моих любимых блюзменов,
                          так что исходный материал имеется.

                          Обсуждение организационных деталей предлагаю перенести на
                          мыло :)'
