  text: 'EvilLyrics 0.1.8

    Обновлена интересная программа EvilLyrics до версии 0.1.8, которая позволяет автоматически
    отыскивать в сети Интернет и отображать слова той песни, которая в настоящий момент
    проигрывается в вашем аудио-плеере. Поддерживается работа с плеерами: Winamp,
    Windows Media Player, iTunes, RealPlayer, QCD, MusicMatch и MediaMonkey. Кроме
    этого, EvilLyrics может запускаться вместе с Winamp, находить файлы, снабженные
    системой "караоке", поддерживает управление с помощью "горячих клавиш", а также
    имеет небольшой музыкальный органайзер.

    В новой версии программы добавлена поддержка аудио-плеера foobar2000, универсального
    проигрывателя Jetaudio, Yahoo! Music Machine, а также исправлен ряд ошибок.

    Разработчик: Evil Laboratories

    Распространяется: Freeware

    Операционная система: Windows All

    Размер: 741 Кб

    http://www.evillabs.sk/evillyrics/evillyrics.zip


    Voice Changer 4.0.51

    Программа, позволяющая изменять ваш голос в реальном масштабе времени и превратить
    в женский, дестский, и т.п. Используя эффекты Вы сможете придать сексуальною привлекательность
    голосу. Встроенный Компаратор Голоса помогает моделировать голоса людей, сравнивая
    с другими. Позволяет создавать различные голоса для кино, звуковых клипов и представлений.
    AV Voice Changer делает запись оригинального или измененного звука из любых источников,
    включая микрофон, беседу чата, беседу телефона PC, сообщения голосом, музыку,
    интернет радиопередачу. Поддерживаемые форматы: mp3, wma, wav, ogg, au, ape, nist,
    aif, irc, mp2.

    http://rapidshare.com/files/1637711/voice-changer-4051.rar'
