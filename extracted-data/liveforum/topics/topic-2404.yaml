  text: "Hello!\n\n   Cornell University Press has a book out on the history of blues\
    \ music in Russia. The book is entitled \"Russia Gets the Blues: Music, Culture\
    \ and Community in Unsettled Times\" by Michael Urban with Andrei Evdokimov.\n\
    \n   Below, I have included a copy of a press release for the book. If there are\
    \ any questions, please feel free to contact me at jal225@cornell.edu.\n\nJen\
    \ Longley\nWebsite Coordinator\nCornell University Press\njal225@cornell.edu\n\
    \n\nRecent Publication from Cornell University Press\nRUSSIA GETS THE BLUES\n\
    Music, Culture, and Community in Unsettled Times\n\nMICHAEL URBAN WITH ANDREI\
    \ EVDOKIMOV\n\nMichael Urban chronicles the advent of blues music in Russia and\
    \ explores the significance of the genre in the turbulent, postcommunist society.\
    \ Russians, he explains, have taken a music originating in the “low” culture of\
    \ the American South and transformed it into an object of “high” culture, fashioning\
    \ a social identity that distinguishes blues adherents from both the discredited\
    \ Soviet past and the vulgar consumerism associated with the country's Westernization.\
    \ While adapting the idiom to their own conditions, Russia's bliuzmeny (bluesmen)\
    \ have absorbed the blues ethos encoded in the music by their American forebears,\
    \ using it to invert their social world, thus deriving dignity and satisfaction\
    \ from those very things that give one the blues.  Based on more than forty interviews\
    \ with blues musicians and fans, nightclub managers, and others, Russia Gets the\
    \ Blues reveals the fascinating history of blues in Russia, from the initial mimicry\
    \ of British blues-rock to the recent emergence of a specifically “Russian blues.”\
    \ The gradual mastering of the idiom in Russia has been conditioned by the culture\
    \ of the country's intelligentsia, a fact explaining why, on one hand, bliuzmeny\
    \ feel compelled to proselytize on behalf of the music, to share with others this\
    \ treasure of “world culture,” while, on the other, they perform blues almost\
    \ exclusively in English-which almost no one understands-and condemn any and all\
    \ efforts to make the music commercially successful.\n\nAdvance Praise for Russia\
    \ Gets the Blues:\n“In Russia Gets The Blues Michael Urban successfully accomplishes\
    \ many tasks: he provides a detailed, cogent history of blues in Russia; he analyzes\
    \ this small but growing subculture; he demonstrates exactly how the economics\
    \ and infrastructure that obtained when blues was being introduced had a direct\
    \ impact on the reception and dissemination of blues music; and he examines the\
    \ phenomenon of Russian blues within the larger context of cultural politics.\
    \ The book is beautifully written, with prose that is clear, accessible, and clever.”-Eliot\
    \ Borenstein, Department of Russian and Slavic Studies, New York University\n\n\
    \"Tracing Russian blues from the late 1960s to the present day, Michael Urban\
    \ provides the first extensive account of its history and complex internal struggles.\
    \ Blues culture in Russia--the First Moscow Blues Festival, the Arbat Blues Club,\
    \ and the Dr. Blues Radio Show of the 1990s--is situated in a nuanced, comparative\
    \ argument about the roots of slavery and serfdom, drawing on a range of cultural-studies\
    \ theorists to foreground its connections to both alternative communities within\
    \ the second world and to the global music industry. Both scholars and blues aficionados\
    \ will find Urban's book an engaging read and an invaluable resource.\"-Nancy\
    \ Condee, Graduate Program for Cultural Studies, Univ. of Pittsburgh \n\nMichael\
    \ Urban is Professor of Politics at the University of California, Santa Cruz.\
    \ His books include The Rebirth of Politics in Russia. Andrei Evdokimov hosts\
    \ All This Blues, a weekly radio show in Moscow. For an interview please contact\
    \ Professor Urban: urban47@cats.ucsc.edu or 831-459-3153. \n\nCornell University\
    \ Press\n179 pages\nCloth ISBN: 0-8014-4229-X  Price: $45.00 ?25.95\nPaper ISBN:\
    \ 0-8014-8900-8  Price: $17.95 ?10.50"
