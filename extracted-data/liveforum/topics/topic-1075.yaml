    text: "И Стоунз и Энималз играли то, что знали и умели. Туда входили и ритм-н-блюзовые\
      \ стандарты, и рок-н-роллы, и попса тех лет. Их внешний вид и отношение к жизни\
      \ не может быть блюзовым. К тому же они были совсем молодыми и из Англии.\n\
      Я думаю, что \"блюзовость\" - это больше образ жизни, ощущение фила, чем форма\
      \ трех аккордов. Я не понимаю как можно серьезно говорить о Джонни Лэнге или\
      \ Шеппарде. Это просто дети. \nБлюз - это всегда грусть, нервы, стеб, горький\
      \ юмор, иногда депрессия, личность. Блюзовых групп вообще очень мало. Есть блюзовые\
      \ личности. Это рассказ одного человека; тут не место демократии."
