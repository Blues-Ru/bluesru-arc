    deleted: false
    text: "Настоящих Хаммондов в России несравнимо меньше, чем США и Европе. Есть\
      \ кое-где на студиях и на руках. На форуме www.hammond.ru зарегистрированы владельцы\
      \ подобных аппаратов. Пара ребят в Калуге живет. К сожалению перевозка Хаммонда\
      \ уж очень накладное и сложное занятие. Месяц назад продавали Hammond M3 c leslie.\
      \ Я так и не решился купить: места много занимает, на концерт не отвезешь -\
      \ надо транспорт специальный докупать. Единственный вариант, который мне представлялся\
      \ возможным - покупка Хаммонда одним из клубов. К сожалению ни один клуб не\
      \ поддержал.\n    К счастью есть есть альтернатива - клоны Хаммонда: Roland\
      \ VK-7, Korg BX-3, Korg CX-3, Hammond-Suzuki's XB-2/XB-5, Clavia Nord Electro,\
      \ Clavia Nord Stage, Clavia Nord C1. Цена таких аппаратов несколько ниже, чем\
      \ у настоящего Хаммонда (зависит конечно от конкретной модели и состояния Хаммонда).\
      \ Зато, с транспортировкой все гораздо проще."
