  deleted: false
  text: "Не так давно в ru net появился партал посвященный знаменитому и легендарному\
    \ музыкальному инструмету - органу Hammond. К сожалению в нашей стране уделено\
    \ недостаточное внимание этому фанатстическому инструменту. Однако ряд энтузиастов\
    \ решили исправить положение и создали портал www.hammond.ru. На сайте много всего\
    \ интересного, записи, фотографии, видео, документация, форум.\n\nХочу всчех пригласить\
    \ 9 сентября на празднование первого дня рождения клуба любителей органа Hammond\
    \ www.hammond.ru в клуб \"Синяя Птица\" (М. Дмитровка, 23/15, стр. 1, бронирование\
    \ столиков: т. 699-2225, проезд: м. Пушкинская, Тверская, Чеховская, далее пешком\
    \ 7 минут по ул. Малая Дмитровка).\n\nПрограмма:\n\n20:00 Hammond в Джазе и Блюзе\
    \ \n20:40 Презентация: История и легенды Hammond\n21:00 Hammond в Роке\n21:40\
    \ Продолжение презентация: История и легенды Hammond\n22:00 Open Hammond jam session\
    \ \n\nПриглашаем всех желающих. Особенно приглашаем :) Серегу Конькова, Илью Алехина,\
    \ Мишу Васильева, Леню Веденеева, Вадима Иващенко, Пашу Семилеткова, Кирилла Гуцкова,\
    \ Анрея Филиппова, Михаила Владимирова. \nВообщем должно быть интересно, весело\
    \ и музыкально :)))"
