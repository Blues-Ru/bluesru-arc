  text: "Хорошие новости для любителей блюза Миссиссиппи!   Записи Son House от 1930-го\
    \ г. являются одними из самых ценных среди любителй блюза: My Black Mama (I&II),\
    \ Preachin' the Blues (I&II), Dry Spell Blues (I&II), и Walkin' Blues.  Просто\
    \ нет более глубокого и исторически важного блюза.  В катологе \"Paramount\" перечислен\
    \ еще один диск 78: Mississippi County Farm Blues/Clarksdale Moan.  Но ни одного\
    \ экземпляра не было найдено.  Теперь наконец нашли!  Эти песни должны быть выпущены\
    \ Yazoo Records через несколько месяцев.  Повод для праздника! \n\nMuddy"
