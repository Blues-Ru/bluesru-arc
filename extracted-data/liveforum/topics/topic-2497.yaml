  text: 'Понимаю, тема не совсем блюзовая.


    Но все же.


    Появилась возможность пригласить в Россию Bill Haley''s Original Comets - тех
    самых, которые были пионерами рок-н-ролла и записали песенку Рок Эраунд Зе Клок.
    Причем цена вопроса - прямо-таки смешная для группы такого уровня (у меня есть
    контакт с менеджером Комет). Может быть, кто-либо заинтересуется этой возможностью?
    Можно оставлять мнения, писать на е-мэйл...


    Спасибо!'
  replies:
  - id: 20942
    parent_id: 20940
    date: 2005-03-30 23:08
    poster: Федор Романенко (fedor)
    email: fedor@blues.ru
    subject: Детали организации гастролей
    deleted: false
    text: "Тут ситуация такая - нужен кто-то, кто возьмет на себя всю мороку, забьет\
      \ концерты, продумает рекламу, найдет жилье, сделает визы и пр. В Питере - даже\
      \ пробовать бесполезно, там за концерты денег платить не принято. Контакт с\
      \ менеджером - это очень мало, ибо любой менеджер по-определению вступит в контакт\
      \ с кем угодно, если есть хоть какая-то призрачная возможность забить хоть один\
      \ концерт. Скажем так, даже если группа согласится играть забесплатно, то собрать\
      \ денег на концертах, чтобы оплатить расходы (особенно, авиабилеты из америки),\
      \ - очень сложно. Музыкантов из Европы, или американцев в рамках европейских\
      \ гастролей - привезти проще.\nНу а, главный момент, - кто-то с сильной мотивацией\
      \ должен этим заниматься. Всегда можно найти помощников или сочувствующих, но\
      \ никто за тебя не взвалит эту работу на свои плечи только потому, что идея\
      \ - хорошая. \nИз помощников в конкретном случае могу порекомендовать Таню и\
      \ Крымские Каникулы. У них есть опыт работы с рок-н-ролльными музыкантами и\
      \ публикой. Они иногда кого-то привозят из-за границы в рамках своих скромных\
      \ возможностей."
