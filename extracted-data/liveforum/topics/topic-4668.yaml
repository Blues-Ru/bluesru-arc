  text: 'тут вот "философская" статья: http://www.snob.ru/selected/entry/38101


    Может, кто-нибудь не поленится объяснить автору что фраза "...одни члены группы
    предпочитали чикагский блюз, а другим нравился Чак Берри..." не содержит в себе
    такого уж противостояния вкусов. Берри записывался на "Чесс", оборотная сторона
    его хитовых рок-н-ролльных синлов обычно представляла блюзы, часто - стандарты.
    И многие блюз-музыканты следующих поколений произносили фразу: "Блюз я открыл
    на B-side синглов Чака Берри". Ну и привел Чака Берри на "Чесс" сам Мадди Уотерс...
    Ну а что такое "Чесс" и кто такой Мадди для чикагского блюза - тут пояснять не
    требуется.'
