  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDSUB040312102216502923&sql=Aa96jtr8lkl5x


    У Доктора Джона много альбомов в разных стилях, но этот диск 1972 года ближе всего
    к корневой музыке и блюзу. Типичный сплав новоорлеанского блюза и ритм-н-блюза;
    море энергии и музыки. 12 композиций на 39 минут и это один из лучших альбомов
    Мака Ребеннака. Надо заметить, что это пятый альбом Доктора на лэйбле Atko, но
    предыдущие четыре были более шаманские и психоделические; хотя и на них был явный
    блюзовый замес. После же этого альбома он запишет два шикарных фанковых альбома
    с Meters, а потом уйдет почти в джаз-роковые дебри, так что этот диск абсолютно
    уникален со всех сторон.


    Вы наверняка знаете половину композиций с этого альбома, но в исполнении Доктора
    они имеют свой неповторимый шарм. Iko Iko, Big Chief, Mess Around, Let The Good
    Times Roll, Stack-a-Lee (aka Stagger Lee) - всё это классика новоорлеанской музыки
    в блюзе, джазе, соуле и ритм-н-блюзе. Альбом очень здорово сыгран и записан и
    звучит как одно целое произведение. Ощущение праздника и карнавала остается с
    нами все 40 минут звучания. Оценка 5 баллов! Этот диск обязателен для любителей
    блюза и соула. Доктор - уникальный исполнитель на рояле и небычный вокалист, и
    тут его умение и талант отлично слышны. Один из лучших дисков Мака и этого стиля
    вообще.'
