  text: "Из года в год 25 ноября в ленте новостей сайта , почему-то, объявляется днём\
    \ рождения Etta James, однако во всех официальных источниках указывается 25 января\
    \ 1938 года . Кроме того 25 ноября 1964 года называется днём первого появления\
    \ Little Richard на ТВ. Однако, это далеко не первое появление архитектора rock'n'roll\
    \ на телевидении. Например:\n Steve Allen show в 1957\n1957 Aussie TV show под\
    \ названием \"What's My Line\". \nИ т.д."
