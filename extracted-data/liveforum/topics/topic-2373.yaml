  text: 'Вот прочёл на http://www.beatles.ru/books/paper.asp?id=457

    <i> Издание: Другой (01.06.2002)

    В России любители рок-музыки делились всегда на тех, кто вырос на Rolling Stones,
    и тех, кто на Beatles. Первых было гораздо меньше, и они были снобами. Они считали,
    что Stones выросли на блюзе и потому заслуживают звания более корневых музыкантов
    и почти что этнических героев. А потом пришли любители Uriah Heep. Но это не важно.
    Главное, что наконец-то вышла пластинка, по которой даже Воронов, гитарист, не
    признающий за битлами права на существование, поймет, что в «Битлз» было все,
    и даже блюз.

    Группа отличных корневых музыкантов, связанных со студией Telarc, записала несколько
    битловских песен, вытащив из них всего-навсего то, что там было изначально, -
    блюз. Why Don’t We Doo It In the Road играют Jimmy Thackery & The Drivers; Yer
    Blues поет Lucky Peterson; Happines Is The Warm Gun - Anders Osbourne; Revolution
    - Kenny Neal. Самым большим метаморфозам подверглась Ob-la-di, Ob-la-da в исполнении
    Maria Muldaur. My Guitar Gently Weeps оказалась также весьма блюзовой, а все думали,
    что она попсовая, и даже похожа на песенки группы Шнура. Ее поет и играет Joe
    Louis Walker. Don’t Pass Me By поет T-Bone Wolk, I’m So Tired - Chris Duarte,
    а замечательную акустическую маккартниевскую балладу Blackbird - Colin Linden.
    Больше всего нас удивил тот факт, что ленноновская сентиментальная песня Dear
    Prudence тоже имеет блюзовые корни. </i>

    Кто нибудь слышал этот альбом? Что он из себя представляет, интересен ли? Чёт
    я весьма сумневаюсь о "блюзовых корнях" у Битлз. (это не камень в битловский огород:
    ну просто не блюзмены они...)'
