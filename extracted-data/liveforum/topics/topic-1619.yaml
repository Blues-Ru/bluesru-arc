    text: 'Рой Роджерс записал что-то интересное? Видеошкола по слайду у него классная,
      но вот альбомы... У меня есть его "Rhythm & Groove" 1996-го года, а в каком-то
      магазине я послушал "Slideways" (2002) и еще один, не помню какой, альбом (может
      быть, "Blues On The Range" 1992). НЕ ИНТЕРЕСНО! За техникой, действительно прекрасной,
      совсем нет драйва. А жаль...

      Хотя это лишь моё субъективное мнение.


      Со своей стороны могу порекоммендовать такого человека как Paul Keim и его альбом
      "Cuesta Grande" (1999). Издан, а может и записан немецкой фирмой Taxim Records.
      Там есть и слайд, и fingerpicking, и гармошка. Куплен в Пурпурном Легионе в
      отделе б/у дисков. Есть ли в отделе нормальных дисков, не проверял.'
