  deleted: false
  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70311291829502171&sql=A486gtq2zzu48


    Очень интересный альбом этого замечательного дуэта! Пластинка в стиле "современный
    акустический фолк-блюз". Рой отлично играет на различных гитарах, включая добро
    и слайд-гитару, Нортон прекрасно поддерживает его на гармошке - ничего лишнего
    и грязного. Они оба приятно и расслабленно поют. На диске отличная ритм-секция
    и много интересных перкуссионных и струнных!!! звуков. Контрабас звучит очень
    убедительно в большинстве треков, очень здорово играет перкуссионист!


    Оценка 5 баллов! Море блюза, фолка, кантри-блюза, отличные песни, очень бодро
    и индивидуально. Альбом обязателен для любителей акустики, харпа и фолка вообще!'
