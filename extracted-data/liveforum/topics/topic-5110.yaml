  text: 'Счастливчикам призовые билеты будут вручаться непосредственно перед концертом
    31 июля непосредственно перед входом в Крокус-Сити-холл, с 18.30 до 19.00, непосредственно
    мной самолично. Посему: в ФБ Andrei V. Evdokimov, в Скайпе avevdokimov... или
    присылайте номер вашего мобильника на присланный вам поздравительным письмом имейл
    - созвонимся.


    огромная просьба - если кто "не может" или "не успевает" - дайте знать, чтобы
    не ждать зря и чтобы билет не пропал напрасно.'
