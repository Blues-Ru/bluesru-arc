  text: "Музыкально-танцевальный Фестиваль Свинговый Бум 2009.\nСостоится  в конце\
    \ мая 2009 на одной из крупных площадок в Москве. (дата и время уточняются, следите\
    \ за рекламой)\n\n•\tФестиваль «Свинговый Бум» объединяет лучших музыкантов, играющих\
    \ джаз, блюз, свинг, рок-н-ролл, кантри, сёрф, ска и лучших танцоров рок-н-ролла,\
    \ свинга и буги-вуги.\n\n•\tМузыка и танцы, яркие костюмы и феерическое движение!\
    \ \nСвинг – это весело и культурно! Свинг – это всегда стильно и модно! Фестиваль\
    \ «Свинговый Бум» – это позитивный настрой и неиссякаемая энергия!\n•\t200 пар,\
    \ танцующих в стильных костюмах... 6 часов музыки, 10-15 музыкальных коллективов,\
    \ одетых по моде 30-40-50-60-х годов, сверкающих дудками и никогда не использовавших\
    \ фонограмму – это незабываемой зрелище!\n\n\n\tВ рамках фестиваля состоится:\n\
    •\tшоу-турнир по свинговым танцам (буги-вуги, линди-хоп, чарлстон, степ, джаз)\
    \ с участием танцоров Москвы, Санкт-Петербурга, Калининграда, Н.Новгорода, Ярославля,\
    \ Иванова, Киева, Харькова\n•\tмастер-класс по буги-вуги и джазу дадут чемпионы\
    \ России Владимир Ишимов и Ксения Семенихина. \n•\tшоу студии «Танцкласс». Rambler-Vision\
    \ ведет прямую интернет-трансляцию. \n•\tшоу парижской школы танца «Dancenter»\n\
    •\tшоу студии акробатического рок-н-ролла «Спартак»\n•\tвыставка ретро автомобилей\
    \ представлена  Международным  Ретро Фестивалем «Авто Старина»\n•\tработает бутик\
    \ винтажной одежды.\n**************************************************************************************\n\
    Предварительная программа \n(реальная зависит от финансов и занятости артистов):\
    \ \nПИЖОНЫ (экс-МИСТЕР ТВИСТЕР, буги/свинг/латина) \nГРАССМЕЙСТЕР (экс-КУКУРУЗА)\n\
    COOL & JAZZY (джаз/дуап акапелла) \nКарл Хламкин и ОГНЕОПАСНЫЙ ОРКЕСТР (ска/рэгги,\
    \ Рига) \nOFFBEAT (буги, экс-БРАВО) \nИлья Моисеенко и КОРОЛИ ТВИСТА (твист) \n\
    Том и ФАНТОМЫ (сёрф) \nJUMPING CATS (блюз) \nSKALALA (ска-джаз) \nJulia Jostin\
    \ & GROOVE PARTY (кантри, Рига) \nФРАНТЫ (рокабилли, Кишинёв) \nWISE GUYS (рокабилли,\
    \ Харьков) \nBLACKMAILERS (этно/блюз, Владимир) \nВедутся переговоры с: Максим\
    \ Леонидов (экс-СЕКРЕТ), Евгений Хавтан (сёрф, БРАВО), Валерий Сюткин, Константин\
    \ Никольский, Ирина Богушевская, BILLY’s BAND (алкосвинг, СПб), СТАРЫЙ ПРИЯТЕЛЬ\
    \ (бит), MOSCOW RAGTIME BAND (диксиленд), Денис Мажуков и Алексей Блохин (два\
    \ рок-н-ролльных рояля) и др. Возможен приезд зарубежных звезд из Нью-Йорка и\
    \ Лондона.\nОрганизаторы и участники Фестиваля \nПостановщик фестиваля – известный\
    \ музыкант Олег Усманов из легендарной группы МИСТЕР ТВИСТЕР.\n\n1.\tКомпания\
    \ «Спидола»\n2.\tФедерация танцев в стиле свинг (ФТСС)\n3.\tПарижская школа танца\
    \ «Dancenter»\n4.\tКлуб акробатического рок-н-ролла «Спартак»\n5.\tМеждународный\
    \  Ретро Фестиваль «Авто Старина»\n6.\tИнтернет-сайт www.rockabillyswing.ru\n\n\
    К Фестивалю приурочен выпуск альбома «Спидола», сборника российских артистов,\
    \ исполняющих музыку в стилях близких к свингу, рок-н-роллу и блюзу. Вышло уже\
    \ три компакт-диска с композициями участников Фестиваля и один DVD."
