  text: "Из новостей на сайте Jazz-Квадрат: \n\nБлюзовый DVD с раритетными записями\n\
    \nГотовится к изданию DVD с редкими и ранее не издаваемыми выступлениями легендарных\
    \ блюзменов, в числе которых - знаменитый Мадди Уотерс (Muddy Waters), сообщает\
    \ music.com.ua Диск «The American Folk Blues Festival 1962-1966, Volume 3» станет\
    \ третьим в серии, подготовленной сотрудниками музыкального архива, расположенного\
    \ в Сан-Диего.\n\nНа DVD, помимо Мадди Уотерса, войдут записи таких артистов,\
    \ как Son House, Little Walter и Big Mama Thornton - всего 18 треков. Кстати,\
    \ диск создан в сотрудничестве с Experience Hendrix - компанией, которой принадлежат\
    \ права на творческое наследие Джими Хендрикса.\n\nДальнейшие планы по изданию\
    \ блюза не ограничатся вышеупомянутым сборником. В частности, планируется выпуск\
    \ дисков «Blues Legends: Sonny Boy Williamson and Memphis Slim» из серии Blues\
    \ Legends series и концертного «Soul to Soul», материал для которого был снят\
    \ в 1971 году на музыкальном фестивале в Гане.\n\n\n\nMuse \n\n© 2004 Jazz-Квадрат"
