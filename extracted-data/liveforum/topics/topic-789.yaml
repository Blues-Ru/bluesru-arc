  text: "СЕРИАЛ \"THE BLUES\"\n\nМартин Скорсезе начал работать над этим проектом\
    \ шесть лет назад. \nВ свое время, в его фильм \"Последний вальс\" (The Last Waltz)\
    \ вошла историческая запись выступления группы \"The Band\" в 1976 году в Сан-Франциско.\
    \ В этом прощальном концерте \"The Band\" принимали участие Мадди Уотерс (Muddy\
    \ Waters), \"Стэппл Сингерз\" (The Staple Singers), Доктор Джон (Dr. John), Пол\
    \ Баттерфилд (Paul Butterfield), Вэн Моррисон (Van Morrison), Эрик Клэптон (Eric\
    \ Clapton) и Боб Дилан (Bob Dylan). \nДля реализации сериала \"The Blues\" (состоящего\
    \ из семи фильмов по 90 минут каждый) Скорсезе пригласил режиссеров, разделяющих\
    \ с ним его страсть к блюзу.\n\nКраткое описание фильмов сериала \"The Blues\"\
    :\n\nFrom Mali to Mississippi, режиссер Мартин Скорсезе \nРазмышление об истоках\
    \ блюза в географическом пространстве от хлопковых плантаций на реке Нигер в Мали\
    \ до придорожных закусочных в дельте Миссиссиппи.\nВ картине будут представлены\
    \ выступления Ali Farka Toure, Salif Keita, Habib Koite, Taj Mahal, Corey Harris,\
    \ Othar Turner и редкие киноматериалы.\n\nWarming by the Devil's Fire, режиссер\
    \ Чарльз Барнетт (Killer of Sheep, My Brother's Wedding, To Sleep with Anger)\n\
    Представит историю о столкновении молодого парня и его семьи в Миссиссиппи в 1955\
    \ году в противостоянии божественных мелодий госпела и дьявольских стонов блюза.\n\
    \nThe Road to Memphis, режиссер Ричард Пирс (The Long Walk Home, Leap of Faith,\
    \ A Family Thing) \nПроследит за музыкальной одиссеей блюзовой легенды B.B. King.\
    \ Фильм станет своего рода посвящением городу, который дал рождение новому блюзовому\
    \ стилю. В фильме будут представлены также оригинальные выступления Bobby Rush,\
    \ Rosco Gordon and Ike Turner, а также архивные записи Howlin' Wolf и Fats Domino.\n\
    \nThe Soul of a Man, режиссер Вим Ведерс (Buena Vista Social Club; Wings of Desire;\
    \ Paris, Texas) \nРасскажет о жизни любимых блюзменов режиссера: Skip James, Blind\
    \ Willie Johnson и J. B. Lenoir, включив их биографии в вымышленный сюжет. В картине\
    \ будут использованы архивные киноматериалы и кавер-версии песен в исполнении\
    \ Бонни Райтт, Люсинды Уильямс, Луи Рида, Ника Кейва, Jon Spencer Blues Explosion,\
    \ Кассандры Уилсон, Los Lobos и других.\n\nPiano Blues, режиссер Клинт Иствуд\
    \ (Play Misty for Me, The Outlaw Josey Wales, Unforgiven)\nПризнается в своей\
    \ страсти к фортепианному блюзу (сам Иствуд известен как хороший блюзовый пианист).\
    \ В фильме использованы архивные выступления и интервью Ray Charles, Fats Domino,\
    \ Little Richard и Dr. John.\n\nGodfathers and Sons, режиссер Марк Левин (Slam,\
    \ Whiteboys, Brooklyn Babylon) \nПутешествует в Чикаго с хип-хоп легендой Chuck\
    \ D (из Public Enemy) и Marshall Chess (сын Леонарда Чесса и наследник Chess Records),\
    \ которые объединились, чтобы создать альбом, в котором ветераны Чикагского блюза\
    \ сыграют с современными хип-хоп музыкантами.\nВ картине используются никогда\
    \ ранее не демонстрировавшиеся архивные материалы Howlin' Wolf, Muddy Waters и\
    \ the Paul Butterfield Blues Band, а также оригинальные выступления Koko Taylor,\
    \ Otis Rush, Magic Slim, Ike Turner и Sam Lay.\n\nRed, White and Blues, режиссер\
    \ Майк Фиггис (Leaving Las Vegas, Timecode) \nОбъединяет таких музыкантов, как\
    \ Van Morrison, Eric Clapton, Jeff Beck и Tom Jones, исполняющих и рассказывающих\
    \ о британском вторжении в начале 60-х, которое изменило американский блюзовый\
    \ саунд.\n\nПремьера сериала запланирована на The Public Broadcasting Service\
    \ на осень 2003 года. Sony Music и Universal Music Enterprises осуществят выпуск\
    \ CD-бокссета, DVD, CD с \"best of\", а также семи дисков с саундтреками, трек-лист\
    \ для которых составит каждый из режиссеров."
