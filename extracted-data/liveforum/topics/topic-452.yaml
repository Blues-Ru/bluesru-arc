      subject: Примите извинения
      deleted: false
      text: 'все, кто был приглашен на джем и доехал до Папы Джона. Из-за местных
        уродов пришлось отыграть форматный 1 час, отменить джем с нашими и (честно
        признаться) дать по телефону отбой переводчице не наших...

        А пропо: более странного места, чем этот Папа, видеть не приходилось. Кто-то
        точно заметил, что это просто феллиниевский "Город женщин". В зале была плотная
        толпа, состоящая на 80% из юных дам. Им было совершенно все равно, подо что
        оттягиваться. Играли им блюзы, они плясали под блюзы, визжа в перерывах и
        снимая верхнюю одежду; началась дискотека, долбились под техно. Через 7 минут
        после окончания гига на сцену набилась такая толпа, что мы еле свои инструменты
        вынесли. И все-таки настроение после фестиваля было такое, что отыграли с
        настоящим кайфом. Эфес-то с клинком был на этот раз.'
