    text: 'Где скачать не знаю, но могу рассказать об этом альбоме (у меня он есть).
      Там Грин(ы) только как коммерческий ход. Он(и) не поют и очень мало и невнятно
      играют. Играет, поет и сочиняет человек по имени Raven и группа The Enemy Within.
      Барабаны компьютерные жуткого качества. У альбома как минимум три издания. Вот
      сноска с двумя, у меня третий (и вроде есть еще один). Мой на Castle. В общем
      это не Грин вовсе.

      http://www.fleetwoodmac.net/penguin/albums/twogreen.htm'
