  text: 'Новости такие - репетируем новую полуакустическую программу втроем с Вовкой
    и контрабасистом Мишуриса Сашей Любарским. Необыкновенно доволен тем, как получается
    - потому и пишу с детской радостью


    А концерты такие - в Хендриксе играю в воскресенье 28го со своей старой ритм-секцией
    под названием 2В or not 2B Blues Band, а в субботу в кафе Take 5 в акустике, и,
    может быть, даже какую-нибудь босса-нову... Надеюсь привезти с собой Кожекина,
    но не обещаю.


    А многие удивлялись, почему такое название идиотское - 2B or not 2B?

    А никто и не догадывался, что это была необыкновенно остроумная пародия на Валерия
    Белинова, который тогда в Питере считался главным блюзменом, играя по двенадцатитактовому
    квадрату отличный джаз на электрогитаре под названием KING B & B.B.B.!!! Своего
    рода творческое соревнование по количеству "Б" в названии колектива.

    Все, спасибо.'
