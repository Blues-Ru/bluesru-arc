  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70312211905221638&sql=Ashngtq0ztu48


    Очень хороший сборник БиБи на фирме BluesWay 1969 года! На виниле 11 треков, на
    КД добавили еще 3 (это уже MCA Records). Здесь собраны синглы и альбомные версии
    песен Кинга 60-х годов. Радует отменное качество записи и хороший вкус составителя.
    40 минут классного блюза и ритм-н-блюза (местами джаза); обратите внимание на
    сильное влияние оргАна в музыке БиБи тех лет. Стоит отметить несколько лучших
    треков, это The B.B. Jones, All Over Again, Think It Over, You Put It On Me.


    Оценка 4 балла. Зачем-то вставили концертную версию Sweet Sixteen; вообще мимо
    темы этого сборника. Разница в качестве треков иногда мешает слушать с кайфом.
    Диск рекомендуется тем, кто не собирается покупать ВСЕ альбомы БиБи 60-х; тем
    более, что они далеко не все удачны.'
