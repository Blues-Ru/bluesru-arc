  text: 'вот что пишут!


    "ПРОДОЛЖАЕТСЯ НАБОР в танцевальную группу по парному и соло блюзу (Москва)


    Преподаватель - Александра Жаркая.


    "Блюз - это музыка любви... Любви, на миг, на этот вечер, печально-ускользающей,
    но дарящей вдохновение. Под блюз очень хочется медленно танцевать, рисуя ногами
    и руками изящные фигуры, хочется соблазнять... Блюз - это искусство. Я научу вас
    танцевать чувственно, выразительно, эмоционально, сексуально, стараясь максимум
    внимания уделять индивидуальному стилю и эмоциям. Покажу как работать с пространством
    и со зрителем.

    Входят в моду и затем забываются многие стили, но человек продолжает танцевать
    блюз, следуя своей природе"."'
