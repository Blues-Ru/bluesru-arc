  text: "Привет, \n\nХотелось бы узнать об очень интересном музыканте по имени Carlos\
    \ Johnson.\nЧерный гитарист и певец, из Чикаго, возраст примерно 50 лет.\n\nПроблема\
    \ в том, что он не записал ни одного своего диска (видимо, просто не хотел), хотя\
    \ записывался с другими музыкантами. \nПо молодости я не пошел на его концерт\
    \ (о чем страшно жалел) из за того, что он в свое время выгнал молодого SRV со\
    \ сцены, которого я тогда любил.\n\nСпасибо за любую информацию,\nАлексей"
