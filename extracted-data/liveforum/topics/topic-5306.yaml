  text: "Джазовый опенэйр фестиваль \"Джаз Тихой Заводи\" пройдёт в этом году в пятый\
    \ раз. В программе будут представлены самые разнообразные проекты от мейнстрим\
    \ джаза и фьюжна, до блюз-рока и поп-соула. Главная идея организаторов - наличие\
    \ музыкальной интриги и \"нескучность\" программы при высоком качестве исполнения.\n\
    \nВ программе участвуют:\n\n- Станислав Майнугин, Вадим Майнугин и Майнугин Бенд\
    \ \n- Олег Бутман \n- Группа ChetMen \n- Joander Santos (Бразилия) \n- Lepety\
    \ Daniel (Камерун) \n- Дмитрий Носков и Круглый бенд \n- Михаил Барсуков и The\
    \ Intelligent Village \n- Алла Рид \n- Chuk Register (США) и группа Jasper Lee\
    \ \n- Екатерина Черноусова и трио Игоря Молчанова \n- Зайцев бенд\nСписок будет\
    \ расширяться!\n\nЧетыре года фестиваль проводился в уникальном месте на берегу\
    \ Волги, за это время на площадке фестиваля побывали певицы и музыканты из Северной\
    \ и Южной Америк, Африки и Европы. \nВ этом году решено перенести место проведения\
    \ в одно из красивейших и гостеприимных мест Подмосковья – пансионат \"Бор\",\
    \ где гости фестиваля смогут снять номер и комфортно провести время после окончания\
    \ фестивальной программы, посетить SPA и бассейн.\n\nПо окончанию основной фестивальной\
    \ программы - after party с сольными выступлениями участников фестиваля. \nУверены,\
    \ на новом месте фестиваль станет еще интересней, ярче, и привлечет еще больше\
    \ поклонников джаза и блюза.\nНа фестивальной территории есть бар и ресторан с\
    \ ассортиментом вин и крепких алкогольных напитков.\n\nВ продаже места за столиками,\
    \ сидячие места на веранде отеля \"Бор\" с ресторанным обслуживанием и свободный\
    \ зеленый партер на траве. \nНа фестивальной территории летние кафе, детская площадка.\
    \ \nДети до 7 лет допускаются бесплатно.\n\nЗаказ билетов на фестиваль у организаторов:\n\
    1. онлайн на сайте http://newsintezproject.ru\n2. по телефону +7 495 5007407"
