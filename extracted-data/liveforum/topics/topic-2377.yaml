  text: 'В субботу, 15 января, 60-е вернутся!!! Группа Stone Shades. сыграет 2-часовой
    концерт в отличном клубе- "КАФЕ-БАР-ДЖЕМ" Хороший звук,стильная дискотека(рок-60-х),недорогой
    бар(пиво-40р)и отличное шоу гарантированно!Адрес-м.Маяковская, Белорусская(кольцо),
    далее идти по Тверской-Ямской, ул.Васильевская д.4.Вход 150р-по флаеру,200 без,100
    в стильном прикиде.ФЛАЕР - можно получить на сайте WWW.SCHKURA.RU или у участников
    группы перед концертом. НАЧАЛО шоу СТРОГО в 19-30!

    Stone Shades - отличная концертная группа, исполняющая рок 60-70-х (есть отдельная
    программа из песен Rolling Stones), а также свои вещи в этом же стиле.'
