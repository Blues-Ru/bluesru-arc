                    subject: помедленней, Федь, я записываю
                    deleted: false
                    text: "сначала цитаточку: \"после 65го блюз надолго остановился\
                      \ в развитии\". Кажется, эта фраза не равнозначна \"после 65го\
                      \ блюз навсегда остановился в развитии\". Соответственно, я\
                      \ сказал: \"после 65го блюз надолго остановился в развитии\"\
                      \ - и ничего более. Приводить мне в пример альбом 79 года и\
                      \ массив творений Таджа - это спорить с тем, чего ни я, ни Пескарь\
                      \ не утверждали.  \nПонятно, что хочется возразить. Но, может,\
                      \ хоть иногда, прежде чем возражать, взять да и прочесть ВНИМАТЕЛЬНО,\
                      \ что же это там оппонент написал? И постараться отделить то,\
                      \ что твои личные бесы шепчут тебе на ухо и подзуживают: \"\
                      Ату!\" - от того, что было высказано в реальноти?\nФедор, обрати\
                      \ внимание, что формулировка: \"совокупность интересной музыки\
                      \ в ее развитии, которую играют талантливые люди\", конечно,\
                      \ можно отности и к блюзу. Как и ко всяким другим стилям и жанрам,\
                      \ которые кому-то могут показаться интересными, и их исполнители\
                      \ - талантливыми. Блюз никогда не следовал \"некой единственной\
                      \ правильной традиции\", но предполагал достаточно широкий круг\
                      \ композиционных правил и исполнительских приемов, которые и\
                      \ обосабливали блюз в отдельный жанр. соответственно, отказ\
                      \ от этих правил и приемов ведет к исчезновению блюза. А на\
                      \ его месте, разумеется, может остаться что-то весьма \"интересное\
                      \ в своем развитии\". но блюзом это уже не будет. Или, что,\
                      \ собственно, и пугает нас, завернувших \"экстремально-радикальный\
                      \ подход\" (эка!): \"блюз\" будет. ну, как \"ритм-энд-блюз\"\
                      \ уже есть, так и \"блюз\" будет. \nдумаю, я высказался достаточно\
                      \ ясно для того, кто хочет понять. А для того, кто не хочет\
                      \ понять - зачем тратить слова? пустое."
