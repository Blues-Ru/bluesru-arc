                                            по форме" (в моем понимании) есть конкретные
                                            отличия, которые ты и сам прекрасно знаешь.
                                            Многие номера, которые ты называешь термином
                                            "по-блюзу", но не являющиеся блюзом по
                                            форме, имеют ровно те же отличия от блюзов
                                            по форме, как и те же самые песни. Вот
                                            часть формальных критериев, и не надо
                                            (2All) пустого флейма про то, что нельзя
                                            гармонию алгеброй поверить - я говорю
                                            конкретные вещи...

                                            1) Обязятельные септаккорды, а не трезвучия,
                                            на всех "трех" ступенях.

                                            2) Они не укладываются в простую гармоническую
                                            гамму, сыгранную септаккордами. Ибо тогда
                                            надо играть, к примеру, большой мажорный
                                            вместо доминант-септаккорда. Т.е. при
                                            смене тоники на доминанту происходит что-то
                                            вроде транспозиции. Т.е. соло надо играть
                                            по-разным нотам на разных аккордах, что
                                            совсем наоборот для типичной песни, типа
                                            Let It Be.

                                            3) Никакой лирики или романсов - сочетаний
                                            минорных и мажорных трезвучий в одной
                                            тональности.

                                            4) Правила обыгрывания гармонии - "минорные"
                                            соло на "мажорной гармонии", соответственно,
                                            заигрывания минора с мажором. Исполнение
                                            "одинаковых" фраз на тонику и доминанту
                                            с изменением ролей ступеней. Что очень
                                            согласуется, к примеру, с повторением
                                            первой фразы текста в блюзе (с другой
                                            интонацией).'
