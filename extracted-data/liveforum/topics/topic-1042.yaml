              subject: о действительности
              deleted: false
              text: 'Действительность существует вне наших желаний. Я готов это признать,
                и говорю лишь то, что меня в ней не всё устраивает.

                Что ж до того, что "Блз" развился именно после 65-го года, то мне
                непонятно именно это заявление. В чём именно он так развился? В том,
                что его стали играть на зафузованных гитарах в "битловском" формате
                три гитары+барабаны+гармошка? В том, что отцы по настоянию ушлых продюсеров
                принялись опсиходеливать блюз (вскоре бросили, правда)?.. По-моему,
                это общепринятый факт, что с расцветом рока для блюза наступили не
                лучшие времена, начались какие-то судорожные метания, всем вдруг стало
                казаться, что надо срочно куда-то такое прогрессировать, и почти единственным
                выходом на коммерческое признание для блюзмена стало играть свою музыку
                максимально похоже на рок. Разумеется, каждый артист решал эту проблему
                по-своему, в меру своего таланта, и в результате блюз прошёл через
                это горнило, в чём-то с потерями, в чём-то и с приобретениями, но
                особенного прогресса в этом всё равно никакого я не вижу. Блюз адаптировался
                к "новому уху", он научился нравиться фанам рока, но принципиальных
                изменений в его природе, по-моему, не произошло - слава Богу, а всё
                потому, что к 1965 году ему шёл уже далеко не первый десяток лет,
                и у него был солидный запас прочности.'
