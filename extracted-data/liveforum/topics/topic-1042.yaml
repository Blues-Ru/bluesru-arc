                    deleted: false
                    text: 'Федь, спасибо!

                      Ты написал именно так, как я бы хотел, но не успел или не смог.

                      Чикаго-блюз лично мне интересен может только на треть. Именно
                      там были созданы штампы и одинаковось звучания. Жесткие рамки
                      продюсеров вообще не позволяли музыкантам развиваться. А с появлением
                      рока и остальной музыки все стало открыто и границы были стерты.
                      Примеров полно; Уэллс 65-го, Эрл Хукер 66-го, БиБи конца 60-х
                      начала 70-х, тот же Бадди Гай раннего периода. Потом, была дана
                      возможность записаться многим архаичным дядькам на лучших студиях
                      Европы; а какой был прием! Ну что тут говорить, стиль Чикаго
                      был тупиковым и скучным под конец; качество многих записей на
                      том же Чессе не соответствовало канонам того времени - вот и
                      результат. Но для меня это только в радость, ибо я люблю открытых,
                      раскованных и профессиональных музыкантов, а не винтиков в руках
                      продюсера, выдающего одну и ту же продукцию на протяжении 10
                      лет как минимум.

                      Вот мое сумбурное, но мнение.'
