                text: "можно уверенно заявить, что после 65го блюз надолго остановился\
                  \ в развитии. Единственные выдающиеся работы этого периода - Алберт\
                  \ и Фредди Кинг. Однако основы этих работ были заложены в первой\
                  \ половине 60-х. И, в случае с Албертом Кингом, собственно музыкальные\
                  \ достижения относятся к работе стаксовского ансамбля Букера Ти.\
                  \ стиль игры самого Кинга \"окаменел\" уже к 1965-му. \nПри этом\
                  \ новые имена перестали появляться в блюзе именно после 1965-го;\
                  \ \"отцы-основатели\" впали в долгую спячку; а музыканты \"средней\
                  \ руки\" испытывали огромные трудности и с клубной работой, и со\
                  \ студийными записями. \nКазалось бы, активная студийная работа\
                  \ должна была привести Бадди Гая к успеху, вышло, однако, напротив\
                  \ - ему пришлось подрабатывать водителем-строителем."
