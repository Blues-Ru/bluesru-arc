                      text: 'Сдаётся мне, что говорим мы о разном. Ты взыскуешь технической
                        безупречности, профессионализма и разнообразия. По всем трём
                        позициям это дело мимо блюза - по крайней мере в исходной
                        его форме - абсолютно. Мало найдётся музык столь однообразных
                        по содержанию, технически несовершенно и непрофессионально
                        исполненных, как настоящий блюз.

                        Но это, как ни странно, никогда не шло блюзу в минус. (Блин,
                        я писал об этом уже раз пять наверное.) А вот чем больше он
                        рафинируется, разжижается всякими примесями и одевается в
                        концертный смокинг, - тем почему-то скучнее и неинтереснее
                        он становится.

                        Гарфилд Эйкерс. Всю жизнь играл вариации одной и той же темы.
                        В тех же рамках и профессионализм. (О людях с расстроенными
                        гитарами я тоже уже писал раз пять). Уровень, разумеется,
                        любительский. Слушая - не оторвёшься. Я не могу объяснить
                        почему.

                        А вот случай с Чикаго как раз против Ваших доводов играет.
                        Казалось бы - ощутимый прогресс противу прежнего: электрификация,
                        новый звук, мощный бит, будущее безоблачно, девки пляшут,
                        продюсер собирает полную шляпу выручки. А через некоторое
                        время, действительно, становится скучно, потому что вместо
                        живого творчества начинает работает мейнстримовая формула
                        успеха; шаг вправо, шаг влево - расстрел. Архаичные дядьки,
                        верно, имели успех в 60-е - но! с акустическими программами
                        и до 1965 года. После, когда продюсеры стали с тоской поглядывать
                        в электрический рок-рай, дядькам сразу не стало места в студиях
                        звукозаписи. А попытки идти на поводу у тенденции, как правило,
                        оканчивались провалом. Electric Sleep Слипи Джона Эстеса не
                        только названием созвучен с альбомом Мадди Уотерса, который
                        называется Electric Mud.

                        Значит ли это, что Слипи Джон разучился играть блюз? Ой вряд
                        ли. По крайней мере, за предыдушие полвека ему этого сделать
                        не удалось.

                        А что было после 1965-го - я своё мнение уже высказал. По-моему,
                        триумфальное возвращение блюза в начале 90-х как раз и было
                        связано с тем, что наконец музыканты разобрались, где зерна,
                        где плевелы, и научились тонко сочетать приятность избалованному
                        уху современного слушателя с вечной грубой прямотой своего
                        жанра; уклон в первое чреват отходом от канонов и Дымом над
                        водою; уклон во второе - коммерческими потерями. Но тем не
                        менее символом этого возвращения стал феноменальный успех
                        всё того же двойного CD-сборника Роберта Джонсона. По-моему,
                        говорит само за себя.'
