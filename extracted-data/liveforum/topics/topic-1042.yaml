            \ ни парадоксально. Могли бы, впрочем, перемывать в очередной раз плешь\
            \ какому-нибудь старцу, давно ушедшему в лета - и заниматься этим из темы\
            \ в тему, из года в год. Об этом надо говорить, всенепременно! Да я же\
            \ первой обращусь к Михаилу с вопросом, на который сама не смогу найти\
            \ ответ. Спросить совета насчет архаики - опять к нему. Исчерпывающие,\
            \ искренние, грамотные, взвешенные комментарии от него всегда можно услышать.\
            \ А секундному плохому настроению подвластны все. Речь не о Михаиле.\n\
            Здесь спор идет всего лишь о _равновесии_, максимально возможном, и _терпимости_.\n\
            Не Вы ли сами говорили, что Вам не нравится узость вашего круга..? Спустя\
            \ короткое лишь время, Вы сами себе противоречите, ибо львиная доля посетителей\
            \ этого сайта слушает как старый, так и новый блюз. А Вы половине из них\
            \ отказываете, быть может и  невольно, в наличии чувства вкуса к музыке.\
            \ Разговоры о старом блюзе, о новом - да о каком угодно! Всему свое время.\
            \ \nИ о цитатах. Мне, лично, ближе ваше \"на самом деле _непринципиальные_\
            \ нюансы\". Совершенно точно! Тогда, быть может, и будем придерживаться\
            \ этой позиции? \nНу, а о том что самобытность нивелируется.. - так это\
            \ данность, от которой никуда не деться, как бы Вам-нам-им-ему-ей ни хотелось.\n\
            \ Можно ещё попытаться бороться с природными явлениями, с потеплением\
            \ климата. Можно горы двигать.. Вопрос в том, стоит ли это делать?\n Вы\
            \ лукавите слегка, так как лично Вам эти споры, возможно, не так уж и\
            \ безинтересны и неприятны. Иначе Вы бы их не культивировали ;)\n С уважением,\
            \ Greta"
