                  text: "Ну вы и завернули с Пескарем, это экстремально-радикальный\
                    \ подход. Не совсем так дело обстоит, ибо блюз - скорее не следование\
                    \ некой единственной правильной традиции, а совокупность интересной\
                    \ музыки в ее развитии, которую играют талантливые люди. Ну а\
                    \ их количество в наши дни - примерно такое же, как и раньше.\
                    \ \nЕсли взять какую-нибудь фигуру, к примеру, Тадж Махала (чтобы\
                    \ не брать более спорные фигуры - неохота флеймом заниматься),\
                    \ то он в музыкальном плане написал разной интересной музыки больше,\
                    \ чем, к примеру, Мадди Уотерз или Джими Роджерс. (Ох, боюсь,\
                    \ все-таки, приедется флеймом заниматься). Другое дело в том,\
                    \ что он повлиял на меньшее число музыкантов, ибо многое в том\
                    \ же блюзе придумали еще до него. И с точки зрения музыкального\
                    \ развития его фигура - не такая крупная. Однако, он - замечательный\
                    \ пример развития блюза, его очень интересно слушать, он очень\
                    \ разнообразен и т.д. \nНу а если брать конкретный стиль - Чикаго,\
                    \ то вполне понятно, что там уже все придумали до 65го года. Если\
                    \ для вас понятие \"блюз\" тождественно совпадает с этим стилем\
                    \ (или с \"архаикой\"), то ничего нового в блюзе уже не найдешь.\
                    \ Увы... Но я вам скажу - есть еще полно другой очень интересной\
                    \ музыки!"
