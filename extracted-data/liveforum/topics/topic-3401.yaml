  text: '<a href=''http://www.globalis.ru''>Симфонический оркестр "Глобалис"</a> объявляет
    конкурс в свой новый проект "Классическая музыка в современной обработке".

    Требуются 4 девушки (1-ая и 2-ая скрипки, альт, виолончель).

    Программа прослушивания: скрипки - Вивальди "Времена года" (любой из концертов);
    альт, виолончель - Бах или крупная форма на выбор исполнителя. Прослушивание состоится
    01.10.2006 в студии "Русрекордз" (м. "Ул. 1905 года",ул.2-я Звенигородская,д.13,стр.14)
    c 15:00 до 17:00. Контактные телефоны: 8-926-204-3058, 743-9526.'
