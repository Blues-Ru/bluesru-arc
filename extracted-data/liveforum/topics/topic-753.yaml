  text: "Только что купила пластинку Taj Mahal/Linda Tillery/Eric Bibb \"Shakin' a\
    \ Tailfeather\" из серии Music For Little People. Отличный способ привить вкус\
    \ ребенка к любимой именно вами музыке. Сыном слушается с удовольствием и без\
    \ каких-либо претензий, патамушта вроде бы детская. Особенно радуют слова, им\
    \ сказанные: Поставь её потом, пожалуйста, когда я усну, на _мою_ полку :)\nОччень\
    \ рекомендую. \nhttp://www.allmusic.com/cg/amg.dll?p=amg&uid=1:31:13|PM&sql=A4bkxu3ujan7k"
