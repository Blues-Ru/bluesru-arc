  text: "Чапек Карел\nДвенадцать приемов литературной полемики, или пособие по газетным\
    \ дискуссиям.\n\n\nЭто краткое руководство рассчитано не на участников полемики,\
    \ а на читателей, чтобы они могли хотя бы приблизительно ориентироваться в приемах\
    \ полемической борьбы. Я говорю о приемах, но никак не о правилах, потому что\
    \ в газетной полемике в отличие от всех других видов борьбы - поединков, дуэлей,\
    \ драк, побоищ, схваток, матчей, турниров и вообще состязаний в мужской силе,\
    \ нет никаких правил - по крайней мере у нас. В классической борьбе, например,\
    \ не допускается, чтобы противники ругались во время состязания. В боксе нельзя\
    \ сделать удар в воздух, а потом заявить, что противник нокаутирован. При штыковой\
    \ атаке не принято, чтобы солдаты обеих сторон клеветали друг над друга - это\
    \ делают за них журналисты в тылу. Но все это и даже гораздо большее - совершенно\
    \ нормальные явления в словесной полемике, и трудно было бы отыскать что-либо\
    \ такое, что знаток журнальных споров признал бы недозволенным приемом, неведением\
    \ боя, грубой игрой, обманом или неблагородной уловкой. Поэтому нет никакой возможности\
    \ перечислить и описать все приемы полемической борьбы; двенадцать приемов, которые\
    \ я приведу, - это лишь наиболее распространенные, встречающиеся в каждом, даже\
    \ самом непритязательном сражении в печати. Желающие могут дополнить их дюжиной\
    \ других. \n\n1. Despicere (смотреть свысока - лат.), или прием первый. Состоит\
    \ в том, что участник диспута должен дать почувствовать противнику свое интеллектуальное\
    \ и моральное превосходство, иными словами, дать понять, что противник - человек\
    \ ограниченный, слабоумный, графоман, болтун, совершенный нуль, дутая величина,\
    \ эпигон, безграмотный мошенник, лапоть, плевел, подонок и вообще субъект, недостойный\
    \ того, чтобы с ним разговаривали. Такая априорная посылка дает вам затем право\
    \ на тот барский, высокомерно-поучающий и самоуверенный тон, который неотделим\
    \ от понятия \"дискуссия\". Полемизировать, осуждать кого-то, не соглашаться и\
    \ сохранять при этом известное уважение к противнику - все это не входит в национальные\
    \ традиции. \n\n2. Прием второй, или Termini (терминология - лат.). Этот прием\
    \ заключается в использовании специальных полемических оборотов. Если вы, например,\
    \ напишете, что господин Икс, по вашему мнению, в чем-то неправ, то господин Икс\
    \ ответит, что вы \"вероломно обрушились на него\". Если вы считаете, что, к сожалению,\
    \ в чем-то не хватает логики, то ваш противник напишет, что вы \"рыдаете\" над\
    \ этим или \"проливаете слезы\". Аналогично этому говорят \"брызжет слюной\" вместо\
    \ \"протестует\", \"клевещет\", вместо \"отмечает\", \"обливает грязью\" вместо\
    \ \"критикует\", и так далее. Будь вы даже человек на редкость тихий и безобидный,\
    \ словно ягненок, с помощью подобных выражений вы будете наглядно обрисованы как\
    \ субъект раздражительный, сумасбродный, безответственный и отчасти ненормальный.\
    \ Это, кстати, само собой объяснит, почему ваш уважаемый противник обрушивается\
    \ на вас с такой горячностью: он просто защищается от ваших вероломных нападок,\
    \ ругани и брани. \n\n3. Прием третий известен под названием \"Caput canis\" (здесь:\
    \ приписывать дурные качества - лат.). Состоит в искусстве употреблять лишь такие\
    \ выражения, которые могут создать об избиваемом противнике только отрицательное\
    \ мнение. Если вы осмотрительны, вас можно назвать трусливым; вы остроумны - скажут,\
    \ что вы претендуете на остроумие; вы склонны к простым и конкретным доводам -\
    \ можно объявить, что вы посредственны и тривиальны; у вас склонность к абстрактным\
    \ аргументам - вас выгодно представить заумным схоластом, и так далее. Для ловкого\
    \ полемиста попросту не существует свойств, точек зрения и душевных состояний,\
    \ на которые нельзя было бы наклеить ярлык, одним своим названием разоблачающий\
    \ поразительную пустоту, тупость и ничтожество гонимого противника. \n\n4. Non\
    \ habet (здесь: констатировать отсутствие - лат.), или прием четвертый. Если вы\
    \ серьезный ученый, над вами легко одержать победу с помощью третьего приема,\
    \ заявив, что вы тугодум, болтливый моралист, абстрактный теоретик или что-нибудь\
    \ в этом роде. Но вас можно уничтожить и прибегнув к приему Non habet. Можно сказать,\
    \ что вам не хватает тонкого остроумия, непосредственности чувств и интуитивной\
    \ фантазии. Если же вы окажетесь именно непосредственным человеком, обладающим\
    \ тонкой интуицией, вас можно сразить утверждением, что вам недостает твердых\
    \ принципов, глубины убеждений и вообще моральной ответственности. Если вы рассудочны,\
    \ то вы ни на что не годитесь, так как лишены глубоких чувств, если вы обладаете\
    \ ими, то вы просто тряпка, потому что вам не хватает более высоких рациональных\
    \ принципов. Ваши подлинные свойства не имеют значения - нужно найти, чего вам\
    \ не дано, и втоптать вас в грязь, отправляясь от этого. \n\n5. Пятый прием называется\
    \ Negare (здесь: отрицать наличие - лат.) и состоит в простом отрицании всего\
    \ вашего, всего, что вам присуще. Если вы, к примеру, ученый муж, то можно игнорировать\
    \ этот факт и сказать, что вы поверхностный болтун, пустозвон и дилетант. Если\
    \ вы в течение десяти лет упорно твердили, что (допустим), верите в чертову бабушку\
    \ или Эдисона, то на одиннадцатом году о вас можно заявить в полемике, что никогда\
    \ еще вы не поднимались до позитивной веры в существование чертовой бабушки или\
    \ Томаса Альвы Эдисона. И это сойдет, потому что непосвященный читатель ничего\
    \ о вас не знает, а посвященный испытывает чувство злорадства от сознания, что\
    \ у вас отрицают очевидное. \n\n6. Imago (здесь: подмена - лат.) - шестой прием.\
    \ Заключается в том, что читателю подсовывается некое невообразимое чучело, не\
    \ имеющее ничего общего с действительным противником, после чего этот вымышленный\
    \ противник изничтожается. Например, опровергаются мысли, которые противнику никогда\
    \ и не приходили в голову и которых он, естественно, никогда не высказывал; ему\
    \ показывают, что он болван и глубоко заблуждается, приводя в примеры действительно\
    \ глупые и ошибочные тезисы, которые, однако, не принадлежат ему. \n\n7. Pugna\
    \ (избиение - лат.) - прием, родственный предыдущему. Он основан на том, что противнику\
    \ или концепции, которую он защищает, присваивают ложное название, после чего\
    \ вся полемика ведется против этого произвольно взятого термина. Этим приемом\
    \ пользуются чаще всего в так называемых принципиальных полемиках. Противника\
    \ обвиняют в каком-нибудь непотребном \"изме\" и потом разделываются с этим \"\
    измом\". \n\n8. Ulixes (Улисс (Одиссей) - символ хитрости - лат.) - прием восьмой.\
    \ Главное в нем - уклониться в сторону и говорить не по существу вопроса. Благодаря\
    \ этому полемика выгодно оживляется, слабые позиции маскируются и весь спор приобретает\
    \ бесконечный характер. Это также называется \"изматывать противника\". \n\n9.\
    \ Testimonia (свидетельства - лат.). Этот прием основан на том, что иногда удобно\
    \ использовать ссылку на авторитет (какой угодно), например, заявить - \"еще Пантагрюэль\
    \ говорил\" или \"как доказал Трейчке\". При известной начитанности на каждый\
    \ случай можно найти какую-нибудь цитату, которая наповал убьет противника. \n\
    \n10. Quousque... (доколе... - лат.) Прием аналогичен предыдущему и отличается\
    \ лишь отсутствием прямой ссылки на авторитет. Просто говорят: \"Это уже давно\
    \ отвергнуто\", или \"Это уже пройденный этап\", или \"Любому ребенку известно\"\
    , и так далее. Против того, что опровергнуто таким образом, не требуется приводить\
    \ никаких новых аргументов. Читатель верит, а противник вынужден защищать \"давно\
    \ опровергнутое\" - задача довольно неблагодарная. \n\n11. Impossibile (здесь:\
    \ нельзя допускать - лат.). Не допускать, чтобы противник хоть в чем-нибудь оказался\
    \ прав. Стоит признать за ним хоть крупицу ума и истины - проиграна вся полемика.\
    \ Если иную фразу нельзя опровергнуть, всегда еще остается возможность сказать:\
    \ \"Господин Икс берется меня поучать...\", или \"Господин Икс оперирует такими\
    \ плоскими и давно известными истинами, как его \"открытие...\", или \"Дивись\
    \ весь мир! Слепая курица нашла зерно и теперь кудахчет, что...\". Словом, всегда\
    \ что-нибудь да найдется, не так ли? \n\n12. Jubilare (торжествовать - лат.).\
    \ Это один из наиболее важных приемов, и состоит он в том, что поле боя всегда\
    \ нужно покидать с видом победителя. Искушенный полемист никогда не бывает побежден.\
    \ Потерпевшим поражение всегда оказывается его противник, которого сумели \"убедить\"\
    \ и с которым \"покончено\". Этим-то и отличается полемика от любого иного вида\
    \ спорта. Борец на ковре честно признает себя побежденным; но, кажется, ни одна\
    \ еще полемика не кончалась словами: \"Вашу руку, вы меня убедили\". \n\nСуществует\
    \ много иных приемов, но избавьте меня от их описания; пусть уж литературоведы\
    \ собирают их на ниве нашей журналистики. \n\nПеревод С. Никольского"
