        text: 'Хорошо, а как можно говорить о фэн-клабе Д.Хендрикса, если у него тоже
          был далеко не один состав? Который Experience, или Band Of Gypsys? Или,
          может, Electric Red Church? Если ты и дальше собираешься цепляться к каждому
          МОЕМУ слову, то, обещаю, будут и другие флеймы. Так-что, могу ответить тебе
          в стиле "сам дурак", но это напоминает разборку шпаны в подворотне. Так
          что, "умник", больше думай об интересных темах. И не утверждай, что фэн-клаб
          Зверей невозможен - в любом случае они назывались Animals (Eric Burdon and
          The Animals, The New Animals...) и играли классную музыку. Надеюсь, вопрос
          закрыт. Спасибо за внимание, умник.

          :)'
