    text: 'Петровчи & the Bluesmakers дают концерты с конца ноября прошлого года.
      В составе важную роль играю дудки из небезызвестного и продолжающего самостоятельное
      существование Skolder Blues. Играют в Форте по средам.

      Утратив Петровича и вобрав в себя клавишника-харписта Е.Лепихина (экс-участника
      J.A.M.(Н.Новгород)) остальные участники Blues Hummer Band c Н.Садиковым во главе
      выступают теперь под названием Lonesome Blues Band.'
