  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDSUB040312132137090848&sql=Auitxlfaegcqq


    Отличная компиляция ТиБоуна 50-х годов! Первое издание вышло на Atlantic Jazz
    в далеком 59 году! Потом было переиздание 72 года, а на компакте добавили еще
    четыре трека и издали в 1989-ом.


    15 треков "золотого" периода ТиБоуна середины 50-х. Запись очень хорошая, ведь
    записывался он как джазовый исполнитель на джазовом лейбле. На этом сборнике есть
    все основные "хиты" Уокера и все это слушается как один хороший альбом, ведь все
    треки записаны в течение всего трех лет и очень хорошо спродюсированы.


    Оценка 5 баллов! Это лучший сборник ТиБоуна и необходимая пластинка в любой блюзовой
    коллекции. Звук, игра, подбор песен - все это на высшем уровне тут, не пугайтесь
    55-57 годов.'
