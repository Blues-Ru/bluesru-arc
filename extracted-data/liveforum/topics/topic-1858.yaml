  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70402112230521610&sql=A5vbyxddbool0


    Good old covers and gospel is back...


    Третий альбом Терри снова вышел на AudioQuest Music как и второй. 10 треков на
    48 минут, но на этот раз тут всего три вещи Эванса. Зато есть два великих блюз-хита
    - My Babe и I Just Wanna Make Love To You! В целом звучание альбома напоминает
    предыдущий диск, но тут нет Бохэнона на тромбоне, а появился отличный John "Juke"
    Logan на губной гармошке. Не хватает тут перкуссии Джоакима Кудера и великого
    Келтнера на ударных. В то же время на альбоме снова (как на дебюте) три бэк-вокалиста;
    среди них сам Уилли Грин (еще один коллаборатор Кудера и Эванса). С вокалистами
    вернулось и сильное госпел-звучание в некоторых треках.


    Оценка 4 балла. Альбом все же слабее предыдущего. Не хватает ТЕХ барабанов с перкуссией,
    да и песни не такие яркие порой. Кроме двух отличных хитов еще можно выделить
    Feeling Allright, What You Need и The River - они отличные. Альбом очень силен,
    но все же он проигрывает двум первым; совсем немного, но слабее.'
