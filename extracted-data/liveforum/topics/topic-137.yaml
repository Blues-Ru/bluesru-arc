  text: 'Очень рад за Рому, что он едет в арабские эмираты, мне же он вчера, позвонив
    в 23-00, сообщил совсем другое. В одном из постингов я написал, что Рома был пьяный,
    чем обидел его и его супругу, так как Рома практически не пьёт. Масса роминых
    доброжелателей тут же сообщила ему об этом (сообщив при этом мой телефон). Публично
    опровергаю своё заявление, о том, что Рома был пьяный - пьяный был я ( очень уж
    люблю это состояние тела), РОМА БЫЛ ТРЕЗВЫЙ. Роме и его супруге приношу сильнейшие
    извинения.

    Ромины доброжелатели, надеюсь эта информация поступит к Гегарту так же быстро.

    Ё-моё, страна сексотов, теперь интернетных.'
