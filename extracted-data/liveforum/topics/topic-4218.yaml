  text: "Кит Ричардс из группы The Rolling Stones принял участие в съемках документального\
    \ фильма Blues Britannia: Can Blue Men Sing The Whites?, который посвящен развитию\
    \ блюза и рок-музыки в Британии. \nЛегендарный гитарист рассказал о своих любимых\
    \ музыкантах, а также признался, что раньше ненавидел свое имя. «Меня раздражали\
    \ эти два слова – Кит Ричардс. Им не сравнится с такими именами, как Хаулин Вулф\
    \ или Мадди Уотерс, неправда ли? На своей первой гитаре я написал Бой Блю – но\
    \ это тоже звучало жалко», - поведал Ричардс. \n\nНапомним, недавно The Rolling\
    \ Stones объявили, что намерены переиздать 14 своих старых альбомов, включая такие\
    \ знаменитые пластинки, как Sticky Fingers, Goats Head Soup, Some Girls и A Bigger\
    \ Bang. Их обновленные версии будут выходить тремя «партиями» – первая увидит\
    \ свет сегодня, 4 мая, вторая – 8 июня, третья – 13 июля. Одна из самых известных\
    \ работ группы, изданный в 1972 году альбом Exile On Main Street, выйдет отдельно\
    \ от всех."
