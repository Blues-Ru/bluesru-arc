  text: Во вторник, 3 февраля, в Cool Train’е состоялся первый блюзовый джем жж-юзеров,
    под управлением «Станции Мир». Действо представляло собой трёхчастную форму, где
    вначале небольшой сет отыграл хауз-бэнд, а затем последовало два джемовых отделения.
    Сенсацией явился приход некоего Олега Фокина – колоритного музыканта и «большого»
    человека, играющего на уникальных русских народных инструментах. Достаточно сложно
    было себе представить как будут звучать классические (а классические ли они?)
    фолк-инструменты в блюзово-электрическом обрамлении. Оказалось - звучат замечательно!
    Лютня и колёсная лира великолепно вписались в хипповую блюз-машину «Станции Мир».
    Колорита добавляла и гармошка Вовки Кожекина (тоже, в общем, практически народный
    инструмент). Похоже, подобное «безобразие» теперь будет происходить каждый вторник.
    Вот в следующий раз, например, со «Станцией Мир» будут джемовать екатеринбургские
    «Blues Doctors».
