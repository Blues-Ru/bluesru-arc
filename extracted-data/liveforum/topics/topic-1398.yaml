  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=MISS70308271605&sql=Av1820r5ac48x\n\
    \nНемного новых песен, немного старых хитов, и получился длиннющий двойной концертник\
    \ Тажа. Песен мало (всего 11), а времени много. О чем это говорит? Это говорит\
    \ о том, что песни длинные, в них много импровизации и самодовольство. Раньше\
    \ этого за Тажем не водилось. Нет, мы любим длинные двойные лайвы, но нам же хочется\
    \ 22 хорошие песни, а не 11!\n\nЭто шестой альбом Махала на лейбле Коламбия. Очень\
    \ амбициозный и звездный. Тут все в порядке, есть новые песни, все кайфы с тубами\
    \ тут, Таж на высоте, запись изумительная (для лайва), но все же что-то не то.\
    \ Пять композиций из 11 длиннее восьми минут! Ну куда это годится; это же не джаз\
    \ и не прог-рок, в конце концов. Не буду ничего отмечать тут, просто слушайте\
    \ новые вещи и наслаждайтесь живой атмосферой концерта.\n\nОценка 4 балла за концерник\
    \ и 3 как за шестой альбом. Таж так больше не будет, может он вообще не хотел\
    \ ТАК, может и не он все это придумал. \n\nReal thing is there, but it's oh so\
    \ long and jammy."
