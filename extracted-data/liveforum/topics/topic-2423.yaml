  text: "Всем здравствуйте!\nЯ вчера был на этом мероприятии, мед-пиво пил :)\nУдивлен,\
    \ что было так немного слушателей, джем в своем роде был уникальный... Хотя, что\
    \ удивительного, информации о нем было мало. Большинство любителей блюза, узнав\
    \ об этом пост-фактум, думаю, будут кусать локти :)\nПонравилось, как звучит Черный\
    \ Хлеб (последний раз слышал их довольно давно), но к джему они подготовились\
    \ плохо - Петровичу особо хода не давали, особенно часто звук гармоники пересекался\
    \ с клавишами. Доктор тем не менее почти дирижировал, жестикулируя кому и как\
    \ сейчас играть, и к середине наладилось.\nМихал Петрович стоял в сторонке, выбирая\
    \ буквально вслепую гармоники на слух из своего чемоданчика, где их было не один\
    \ десяток, прислушивался к ним, и делал вид что играет, потому что слышно его\
    \ не было :) Вообще я уверен, он не показал очень многое из того что умеет. Но\
    \ когда в начале Trainstation blues он изобразил приходящий поезд и мурашки побежали\
    \ по телу, завеса немного приоткрылась... Пожилой блюзмен, вместо лица - шляпа,\
    \ борода, сложенные лодочкой руки и хром микрофона, руки исполняли такую модуляцию,\
    \ что было обидно за слабое его присутствие в общем звучании. И приятный ироничный\
    \ хриплый голос после концерта. \nЗвукооператор RJ клуба записал всё действо,\
    \ и после некоторой обработки, я думаю, сможем разместить запись на bluesman.ru\
    \ для удовольствия отстутствовавших :)"
