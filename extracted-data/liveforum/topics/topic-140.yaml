  text: 'Позвольте еще разик (особенно для тех, кто не часто заглядывает на главную
    страницу) сообщить о следующем. У нашей группы ("The EVERGREEN$") случился день
    рождения. Поэтому всем посетителям форума (точнее тем, кто 3 апреля будет в Москве)
    предлагается оторваться...  от экранов мониторов и отправиться в клуб "БиБиКинг",
    где культурно провести вечер под звуки нашей группы. Мероприятие называется "открытый
    джем в день рождения" и начнется в 20:30. То есть все умеющие играть на музыкальных
    инструментах и желающие принять участие в джеме должны либо прислать заявки мне
    на e-mail: evergreens@mail.ru, либо записаться в список при входе в клуб до 20:15,  а
    потом, выйдя на сцену, ...вручить нам подарки и произнести поздравительную речь
    :-))) Также ожидается множество сюрпризов, в том числе участие в джеме наших друзей
    музыкантов (и весьма известных).

    Итак, хватит устраивать грязные разборки в форуме и засорять форум рекламой :-)
    Давайте лучше чаще ходить на живые концерты и общаться в режиме реального времени,
    играть и слушать любимую музыку.'
