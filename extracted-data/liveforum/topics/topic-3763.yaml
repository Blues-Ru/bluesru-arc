    text: "ты пропустил большую часть интересного, но успел почувствовать отголосок.\
      \ ничего блюзового в концерте не было - за исключением той части, что ныне является\
      \ обязательной для любой электрогитарной игры. Для меня концерт был полным сюрпризом\
      \ - совсем не то, что есть на двд. Банамсса был разнообразен, не заискивал перед\
      \ публикой, не убивал ее метал-блюзом, а сам пытался выйти к музыке... в начале\
      \ это удавалось ему плохо... т.е. первые же три вещицы, им сыгранные, показали,\
      \ что с гитарой он может сделать все, что хочет... оставался вопрос, а зачем?...\n\
      после этого он решился поздороваться (пусть формально) с публикой - но морда\
      \ у него оставалась кислая... но дальше концерт пошел к лучшему.\nя давно и\
      \ безнадежно верил, что концерт получается из публики и музыканта.\nпублика\
      \ вчера сыграла роль - бонамасса, готовый сыграть дежурный концерт, прошедший\
      \ доооолгое ожидание любимых инструментов с таможни, - \"зажегся\".\nвторое\
      \ его отделение было просто фейерверком - он играл цитаты из крим, из  дип пепл,\
      \ из пинк флойд - ему это было приятно... но тут же эти цитаты он переводил\
      \ в собственные импровизации. это точно было интересно. точно, это не могло\
      \ оставить никого равнодушным. \nпотом, возгласив, let's have some fun, он отправил\
      \ своих музыкантов покурить... покурить сигару... потому что играл он соло на\
      \ акустике минут 15-20ть. и играл с той же суровость и нотной скорострельностью,\
      \ что и на электрике... это был А) - мощный звук; Б) скоростной звук...\nтипа,\
      \ на конкурсе показать технику...\nпублика вопила от восторга...\nно дальше\
      \ началось волшебство...\nмной нелюбимый Бономасса перешел не к блюзу, а к мелодизму...\
      \ изысканному, требующему логики и чувства одновременно... и это было так красиво...\n\
      и снова врубился в блюз-рок, и снова вернулся к нежным мелодиям.\nвеликолепный\
      \ был концерт... жаль, что к слову \"блюз\" он имел самое далекое отношение...\n\
      PS. после концерта Джо выглядел усталым, но довольным... Есть вероятность, что\
      \ он приедет еще."
