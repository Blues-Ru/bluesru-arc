  text: "Было не ясно, чего ждать от концерта забойного блюз-рокера в Светлановском\
    \ Зале ММДМ. Предыдущие эксперименты были очень странными. Маленькие группы, терявшиеся\
    \ посреди сцены гигантского зала для классической музыки, пытались раскачать чинно\
    \ заседающую (или же вынужденно прикованную к креслам) публику. Почти все концерты\
    \ из серии проходили с плохим звуком, либо было не слышно, либо громко и непонятно\
    \ бухало. Только на Робилларде в зале повесили большие порталы, воспользоваться\
    \ грамотно которыми, правда, при нем не успели.\n\nПеред Бонамассой за спинами\
    \ музыкантов повесили огромный черный экран до потолка, на фоне которого все выглядело\
    \ гораздо более выигрышно. Звук был отстроен очень хорошо, за пультом сидел звукорежиссер,\
    \ которого, судя по всему, привезли с собой. Гитары солисту подносили специальные\
    \ мальчики. Все это создало атмосферу настоящего концерта, а не недоразумения.\n\
    \nГруппа состояла из четырех человек - сам гитарный герой, ритм-секция и клавишник,\
    \ у которого помимо клавиатуры стоял такой соблазнительный и многообещающий Хаммонд\
    \ орган. Однако, все это великолепие было использовано только для того, чтобы\
    \ поддерживать полтора часа плотного звука. Моя спутница пожаловалась на то, что\
    \ не совсем ясно, зачем были нужны клавиши - их не было слышно, ибо играли все\
    \ одновременно. \n\nДжо Бонамассу считают одним из наиболее интересных представителей\
    \ современной волны блюз-рока. Весь концерт он играл 95%-ный рок на Лес Поле через\
    \ два кабинета Маршалла. Очень забойно и местами - виртуозно, но блюза было мало.\
    \ Вторая песня, которая была одним из немногих блюзовых вкраплений, показала неумение\
    \ рокерской ритм-секции играть шаффл. Бономасса все время пользовался преимущественно\
    \ полными мажорными аккордами (power chords) на всех имеющихся струнах (аж с тремя\
    \ тониками), что, конечно, более характерно для молодежного mtv-рока, нежели чем\
    \ для джаза и блюза, где есть хорошая традиция не играть само-собой подразумевающихся\
    \ нот. Меня все это не очень впечатлило. По части mtv-рока, мне кажется, пооригинальней\
    \ звучат группы типа Stone Temple Pilots. Из блюз-рокеров Коко Монтойа, которого\
    \ я слышал вживую в марте, пронял мена на порядки сильнее. Одно ясно, стилистический\
    \ выбор Бонамассы позволяет ему привлекать публику с той и другой стороны.\n\n\
    Фирменный звук, виртуозность и страстность произвели большое впечатление на публику,\
    \ почти всем очень понравился концерт, зал рукоплескал, отовсюду я слышал слова\
    \ восхищения. Он демонстрировал драйв, виртуозность и романтический образ для\
    \ дам. Моей взволнованной подруге концерт понравился чрезвычайно. Можно сказать,\
    \ что Бонамасса нашел своего слушателя и полностью удовлетворил его ожидания,\
    \ за что ставим ему огромный плюс. \n\nСам я все козыри Бонамассы, разумеется,\
    \ отметил, но мне, честно говоря, было скучно. Из полуторачасового концерта не\
    \ запомнилось практически ничего, какой-то проходящий поток надуманных музыкальных\
    \ фраз с натянутой экспрессией. Тихие места означали только одно - затишье перед\
    \ следующей предсказуемой бурей. Не было там для меня заводного грува. Мне кажется,\
    \ что хороший музыкант должен демонстрировать публике не то, как он хорошо играет,\
    \ а как хороша песня, ритм или какой-нибудь гитарный рифф. \n\nДостоинства Бонамассы\
    \ слишком уж очевидны. На концерте я вспомнил про макдональдс - как прекрасен\
    \ горячий гамбургер в красивой упаковке. А когда увидишь холодный в запачканной\
    \ соусом бумажке - очарование спадает совсем. Так и тут, убери все эти внешние\
    \ достоинства, и, кажется, что от музыки ничего не останется, фигня какая-то.\n\
    \nКажется, что проблема у Бонамассы только одна - со вкусом, он, как говорится,\
    \ молодой и глупый. Дело не в том, талантлив музыкант или нет, а в том, что именно\
    \ он играет - его собственный выбор! Все сказанное - мое личное мнение, у меня\
    \ свои потребности в музыке. А публике очень понравилась программа Джо, поэтому\
    \ отдаю должное, молодец, Джо!  \n\nНа бис Джо Бонамасса исполнил божественный\
    \ блюз про \"ангела на моем плече\", там был и соул в голосе, было слышно все\
    \ инструменты по-отдельности, отличная блюзовая партия ударных, наконец, супер-классные\
    \ клавиши. Звучало как совсем другая группа в другом стиле. Соло на гитаре было\
    \ членораздельным, нежным и с включением рокерских трехзвучий, которые и могли\
    \ бы собой являть интересный сплав блюза и рока. Вот с этого и надо было начинать!\
    \ Ну и зачем же, спрашивается, эти полтора часа мутного забоя пополам с балладами??\
    \ Ааа? \n\nРезюме - концерт был интересен, заставил задуматься и понравился мне\
    \ последней песней."
