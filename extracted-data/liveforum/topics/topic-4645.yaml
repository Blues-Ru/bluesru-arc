  text: 'Из Казани пишут (http://prokazan.ru/news/43467.html )



    "На сцене фестиваля "Сотворение мира" выступили музыканты группы Гангбе Брасс
    Бэнд из Бенина и Хазмат Модин из США.



    Коллектив исполнил народные песни государства Бенин. В их песнях также звучали
    мотивы джаза и блюза.



    Сами музыканты использовали во время своего выступления необычную трубу - сасофон,
    которая выдает звук потрясающей глубины."." </I>



    ... Вот все играют на обычнх трубах, а Алехин - на необычной!.. Думаю, что "Алехин
    - на необычной! Думаю, что труба, которая "выдает звук потрясающей глубины" -
    это туба. Но если кто знает об инстументе под малопристойным названием "сасофон"
    (и это не опечатка в слове "саксофон", как считает гугль) - сообщите, буду очень
    признателен.



    Благодаря Нестору (http://www.nestor.minsk.by/jz/news/2011/06/2401.html) выяснислоь,
    что Алвон Джонсон не претендует на блюзовый трон, а всего-то дважды выигрывал
    в каком-то конкурсе местного значения под названием "Король блюза". Вполне возможно,
    что Алвон Джонсон действительно достойный музыкант - проверить это можно на проходящих
    ныне его московских концертах в джаз-клубе "Союз композиторов". Но вот так сразу
    именовать его Королем блюза... Как-то перед БиБиКингом неудобно. (Короли ведь
    не уходят на пенсию).



    ну и совсем вроде бы мелочь, а на самом деле небрежность докладчика: http://muz.ru/Store/NewsDetails.aspx?NewsId=81600
    - North Mississippi Allstars выдвигались на Grammy (что уже почетно), но собственно
    лауреатами не стали (пока, по крайней мере).'
