  text: 'Михаилу Бирюкову:

    На днях мной был куплен Chuck E. Weiss "Old Souls & Wolf Tickets" 2001, спасибо
    Стасу из Meet the records - пластинка также хороша. Ну и поскольку я теперь отслушала
    пластинку и, соответственно, ранее упоминавшийся трек с Willie Dixon(ом), пишу
    просто, чтобы внести ясность :) Вот дословный состав исполнителей:

    9. "Down the Road a Piece"

    Willie Dixon & The Chicago All Stars, featuring

    Guitar: Buster Benton

    Harmonica: Carey Bell

    Piano: Sonnyland Slim

    Drums: Clifford James

    Vocals & Bass: Willie Dixon

    Vocals: LITTLE Chuck E. Weiss

    Recorded at Banana Land, Boulder, CO, 1970

    Не могу, правда, сказать, что это самый лучший трек с пластинки, но прекрасный
    трек. А Чак там и правда молод и, к тому же, скромен в сравнении с последующим
    творчеством :)

    Любителям Taj Mahal, Tom Waits также рекомендуется. Замечательный, не совсем вменяемый
    музыкант. Побольше бы таких :)


    Вадиму(AVA):

    Была также приобретена Etta James "Blue Gardenia". Мне тоже понравилась. Ну и
    что с того, что слишком джазовая - это даже хорошо. Более блюзовые пьесы там тоже
    присутствуют. Да и люблю я смешение, влияние и взаимопроникновение стилей. Голос
    у неё волшебен начиная с первого вздоха в This bitter earth и до конца пластинки.


    Федору: спасибо за убранные листочки и уменьшение интенсивности серого фона :)'
