  text: "Чисто случайно прочел, что Белфор будет выступать 23 августа в Тель-Авиве.\
    \ В свои 72 он еще гастролирует на противоположном от Миссиссипи конце света.\
    \ (никаких <i>коннотаций</i> на 2конец света\", плиз, просто посмотрите на глобус)...\
    \ \n\nВ общем, будь я в земле обетованной, бросил бы все дела (да, даже ужин у\
    \ мамы) и пошел.\n\nпотому что: \n\n<center><iframe width=\"420\" height=\"315\"\
    \ src=\"http://www.youtube.com/embed/d_Es_oKzC44\" frameborder=\"0\" allowfullscreen></iframe></center>\
    \ \n\nМне уже говорили, что как-то он \"не аккуратно играет\". Отвечаю - он, как\
    \ ему надо, так и играет. он не в школе им. Ипполитова-Иванова учился. Ничего\
    \ худого против И-И не имею. Просто, у Белфора - совсем иная школа, его папина\
    \ школа (папа его учил играть), миссиссипская школа, районf Hill Country. \n\n\
    случайно на утубе наткнулся на отличный пример. Вот белая публика слушает Белфора,\
    \ ритм публику берет, и публика начинает хлопать в ритм... пытается, а не очень\
    \ получается... публика в изумлении ребенка: как так? был палец, нет пальца -\
    \ оторвали, а, обратно приставили...где надежная привычная ударная доля? ))) \n\
    тут особая ритмическая \"организация\", абсолютно иная, чем в европейском понимании...\
    \ она в математическом смысле - \"не линейная\". ))) И кроме как у Белфора вы\
    \ ее уже мало где услышите. Крутейшие чернозадые (это комплимент: black ass даже\
    \ круче чем bad ass) акустики-виртуозы, вроде Бибба и Кеба-Мо, так, увы, уже не\
    \ могут. Поэтому нельзя упустить шанс услышать Белфора.\n\n<center><iframe width=\"\
    560\" height=\"315\" src=\"http://www.youtube.com/embed/5Kmk1cBzCfw\" frameborder=\"\
    0\" allowfullscreen></iframe></center>"
