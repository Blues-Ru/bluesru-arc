        subject: Очень уж расплывчато задан вопрос.
        deleted: false
        text: "У меня, к примеру, есть пластиночка, где «схлестнулись» два саксофониста:\
          \ Coleman Hawkins и Ben Webster – просто майский день и именины сердца…\
          \ Но, боюсь, не все разделяют это мнение. Запись 1957 г., там еще Herb Ellis\
          \ на гитаре – сказка!\n\nПрипомнить солистов-саксофонистов в блюзе не просто,\
          \ маловато их вообще-то. Gregg Piccolo из нынешних, Eddie \"Cleanhead\"\
          \ Vinson – из ветеранов. Gene Barge работал в Чикаго. Dick Heckstall-Smith\
          \ – в Лондоне (но это вообще на любителя).  \n\nRoomful Of Blues, Jeannie\
          \ & Jimmy Cheatham – классная секция медных, включая саксофон, разумеется.\
          \ Duke Robillard почти всегда приглашает на запись саксофониста Doug James.\n\
          \nJohn Mayall в альбоме The Turning Point имел саксофониста Johnny Almond\
          \ – очень качественно. \n\n«Брутальный» саксофон – в альбомах George Thorogood\
          \ & The Destroyers; Charles Brown в своих поздних альбомах имел саксофониста\
          \ мелодичного и деликатного: Clifford Solomon…\n \n…А так-то саксофонистов\
          \ в блюзе куча, попадаются и хорошие. )))"
