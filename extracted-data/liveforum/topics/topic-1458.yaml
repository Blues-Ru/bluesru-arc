    subject: Taj Mahal - Se?or Blues - 1997
    deleted: false
    text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=MISS70309091757&sql=A6iaqoarauijx\n\
      \nЭто четвертый альбом Тажа на лейбле Private Music и третий из \"цепочки\"\
      \ его супер-альбомов 90-х годов. 13 композиций на 52 минуты. Таж продолжает\
      \ записывать вещи из разных стилей черной музыки и все это звучит очень убедительно.\n\
      \nНачинается пластинка со знаменитой вещи Тажа 70-х годов Queen Bee. Гениальная\
      \ песня, классное исполнение. Даже трудно сказать какой вариант лучше, оригинальный\
      \ или этот. \nВторой трек - это знаменитый хит Джеймса Брауна Think. Здесь Таж\
      \ создал просто волшебную атмосферу драйва и музыки. Вариант Брауна звучит бледно\
      \ после такой подачи Тажа.\nIrresistable You - отличный ритм-н-блюз в южном\
      \ стиле. Вроде бы ничего особенного, но подача тут решает все.\nHaving A Real\
      \ Bad Day - приджазованный соул-блюз с классными клавишными и духовой секцией.\n\
      Se?or Blues - тайтл-трек, знаменитая тема Хораса Силвера 1956 года. Из джаза\
      \ Таж сотворил что-то очень интересное. Яркая басовая линия в духе латинского\
      \ джаза, супер-духовые и джазовое пианино. Даже джаз Таж играет и поет легко\
      \ и интересно. Очень серьезная композиция!\nSophisticated Mama - блюзовая вещь\
      \ Уошбоард Сэма. Здесь в быстром темпе, с банджо и дудками. A lot of fun!\n\
      Oh Lord, Things Are Gettin' Crazy Up In Here - очень скоростная вещь в духе\
      \ раннего Джеймса Брауна; хот соул, госпел, веселье.\nI Miss You Baby - джаз-блюз\
      \ Фредди Саймона 1953 года. Сентиментально, но не без юмора. Очень стильно играют\
      \ духовые.\nYou Rascal You - опять джаз-джамп-блюз. Вещь аж 1929 года! Таж сделал\
      \ из нее почти чистый джамп и вокальная подача просто изумительна! Дудки и интересная\
      \ партия гитары дополняют все это и делают вещь отличной!\nMind Your Own Business\
      \ - блюз-фолк или фолк-блюз легендарного Хэнка Уильямса 1949 года. Тут и фолк,\
      \ и джаз, и блюз, и Новый Орлеан в одном флаконе. Это один из коньков Тажа -\
      \ очень весело.\n21st Century Gypsy Singin' Lover Man - блюз-баллада Тажа. Его\
      \ стил-гитара изумительно выделяется из этого \"сладкого\" номера.\nAt Last\
      \ - хит Марвина Гея 1967 года. Taj goes soul? Да, и делает это опять здорово.\
      \ Не слышал чтобы соул звучал так откровенно и бодро в 1997 году.\nMr. Pitiful\
      \ - хит Отиса Реддинга, написанный легендарным Стивом Кроппером. Таж все делает\
      \ отлично; под конец альбома ясно, что это самый soul-oriented альбом ТМ. А\
      \ почему бы и нет?\n\nОценка 5 баллов! С \"блюзовой\" точки зрения альбом слабее\
      \ предыдущих двух, но с \"общемузыкальной\" тут все самое лучшее и есть развитие.\
      \ Соул, джаз и блюз в таком варианте - это жемчужина 90-х и большая редкость\
      \ за последние 25 лет вообще."
