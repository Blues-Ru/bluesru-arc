    text: 'Другого я и не ожидал от подобных ведущих...


      Я давно уже смирился с тем, что в России идут как правило от рока к блюзу, т.е.
      люди, в прошлом увлекающиеся первым никак не могут забыть свое "криминальное"
      прошлое и судят о втором именно с этих позиций.


      В условиях отсутствия специализированных по музыкальным направлениям радиостанций,
      молодые и зачастую не искушенные слушатели оказываются на "неверном" пути, и
      порой проходит достаточно времени пока они не возвращаются к так называемым
      истокам.


      Я давно уже перестал слушать подобных ведущих, некоторые из которых позволяют
      себе высказывание вроде "... последний альбом Хукера был достаточно комерческим
      ...", и слава богу, имел честь общаться с авторитетными для меня людьми, для
      которых наверное, упоминание подобных имен является дурным тоном.


      С уважением,


      Алексей Чернятин'
