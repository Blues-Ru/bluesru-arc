      deleted: false
      text: "Уважаемый Алексей Чернятин,\nВы совершенно правы в теоретической части\
        \ своего письма, но напрасно, как мне кажется, переходите к конкретным обвинениям.\
        \ \nДействительно, в «России идут как правило от рока к блюзу», что еще не\
        \ самое грустное. Печально, что такие «блюзноволюбы» не стараются пройти до\
        \ корней и вечно слушают электрогитаристов блюзквадратной направленности,\
        \ каковых и объявляют эталоном жанра. \nОднако, деятельность г-на Калачева\
        \ тут совершенно не при чем. \nЧто касается собственно блюзовых программ Алексея\
        \ Калачева - это передачи, абсолютно компетентные в своей области. Большое\
        \ количество новинок делает содержание многих из них «блюз-роковыми». Увы,\
        \ это отражение объективной картины. \n(в этом вопросе есть масса нюансов,\
        \ и сейчас картина несколько меняется в сторону более свингового (и более\
        \ разнообразного) «вэст-коаста», однако пока что рОковое звучание все еще\
        \ остается преобладающим.) \nОднако кроме обозрения новинок, в этих программах\
        \ подробнейшим образом рассматривались дискографии «до-рОковых» мастеров блюза…\
        \ (или «вне-рОковых», если так можно определить творчество БиБиКинга :), или\
        \ прото-рОковых, если – об Алберте Кинге (естественно, это всё - полушутливая\
        \ градация).\nУвы, радиостанции, специализирующейся на блюзе, в России не\
        \ будет по объективным причинам. Блюзовые радиопередачи выходят на радиостанциях\
        \ «всеядных» (не придерживающихся строгого формата). И в голосовании принимали\
        \ участие не одни только знатоки блюза, но все постоянные (и всеядные) радиослушатели.\
        \ Вот и объяснение, почему в чартах так высоко стоит Гэри Мур. Мне гораздо\
        \ любопытней полный триумф Роббена Форда. \nPS. А вот формулировка «ЛУЧШИЕ\
        \ БЛЮЗОВЫЕ АЛЬБОМЫ РОССИИ ЗИМЫ-ВЕСНЫ 2002 ГОДА» - это сильно! Но, насколько\
        \ я знаю, лично А.Калачев тут не при чем. :)"
