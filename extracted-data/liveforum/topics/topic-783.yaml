      text: 'Джем был потрясный, практически лучших из тех, на которых я присутствовал.
        Сразу виден наивысочайший класс музыкантов, что, разумеется, куда важнее,
        чем рассуждения про "чистый-нечистый" блюз в репертуаре. Когда Мишурисы исполняли
        "заезженные блюзовые стандарты" типа "Stormy Monday", появилась возможность
        сравнить, так сказать, с тем, что слышишь часто на концертах, ибо Мишурисы
        в данной ситуации находились с ними как бы "на одном поле" и пр... Нет слов.
        Иващенко, который стал крутым специалистом по свинговой гитаре, "чистый блюз"
        играет потрясающе, тонко, с чувством и т.д. Новая группа у них получилась
        отличная, на голову выше всего остального, что у нас можно послушать... Разумеется,
        бывают группы интересней, но уже не у нас.

        Братецкий играет лучше и лучше, мне очень понравилось. Лепихин спел и сыграл
        на рояле два супер-классных блюза, у меня нет слов. Мне кажется, что на рояле
        у него получается даже лучше и задушевней, чем на органе, на котором он играет
        обычно. Супер-чувак!

        Я весь вечер веселился, кричал, хлопал и стучал ногами, поэтому непонятно,
        откуда Цыганков взял мой мрачный вид? ;)))'
