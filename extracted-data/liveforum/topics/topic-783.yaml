    deleted: false
    text: "Мдя, говорим мы, как обычно, но не настраивая себя на критический лад,\
      \ а просто бурча про несовершенство жизни вообще и пассивность г-на Евдокимова\
      \ в частности, чьё борзое перо паче моего будет. Но поскольку Евдокимов безмолвствует\
      \ (печатает фотографии с мероприятия, смеем предположить, а не отдыхает после\
      \ вчерашнего), то довольствуйтесь уж моим отчётом, не обессудьте.\nНачну с общего\
      \ впечатления. Вечер удался. Джем состоялся. Это было событие, однозначно! Посетители\
      \ будут вспоминать вечер долго и исключительно хорошими словами.\nМишурис и\
      \ его оркестр - настоящие мастера жанра, который мы бы определили как слияние\
      \ свинга и блюза. Русинов нам подсказывает слово \"джамп\", и наверное, правильно\
      \ подсказывает.\nПосреди клуба \"Последние деньги\" действительно стоит стилизованный\
      \ дуб. Слегка весёлый и от того ещё более харизматический Мишурис расхаживал,\
      \ но не по цепи кругом, а по узкому бордюру, отделяющему музыкантов от зала,\
      \ снявши пиджак и держа сигару в руке (последнее, очевидно, для равновесия,\
      \ ибо сигара была настолько изрядна, насколько и пахуча, но это вопрос нашего\
      \ личного вкуса). Кроме того, Мишурис продемонстрировал кульбит головой вниз\
      \ через оный бордюр, но вполне удачно приземлился на ноги. Посмотрите, в какой\
      \ он форме! ((С) Реклама) \nВедение концерта г-ном Мишурисом само по себе вызывает\
      \ восторг, так как являет собой совершенно профессиональный конферанс, в отличие\
      \ столь привычного нам на других джемах \"а сейчас на сцену приглашается...\
      \ приглашается на сцену... ну.. мнээээ... Полуэкт Полуэктович... наш большой\
      \ друг...\" и так далее. Кто слышал, тот понял.\nКак играли.\nУмопомрачительная\
      \ ритм секция. Такой слаженного звучания акустического контрабаса и ударных\
      \ мы не слыхали давно. Альт- и тенор-саксофоны, совершенно органично звучащие\
      \ как в \"подкладке\", так и в виртуозных и абсолютно драйвовых соло. Вадик\
      \ Иващенко как гитарист, играющий пальцами совершенно в аутентичной манере -\
      \ выше всяческих похвал. Тихий и скромный, но играющий абсолютно к месту клавишник.\n\
      Да! Самое главное - инструменталисты, синхронно совершающие заранее отрепетированные\
      \ телодвижения в такт музыки! \n\nНу и конечно, сам Мишурис, со своей рычаще-агрессивной\
      \ манерой пения, с безукоризненной причёской, в тройке, при галстуке, сигаре\
      \ и печатке на руке, удивительно воспроизводящий всем своим обликом гангстерский\
      \ стиль. Не хватало белых гетров, но их с успехом заменили остроносые туфли.\n\
      Что играли.\nВсего понемногу. Лично мне больше всего запомнилась Saturday Night\
      \ Fish Fry. Русинов вспомнил 300 pounds of joy (вернее сказать, он вспомнил\
      \ почему-то только сто.. впрочем, каждый судит по себе :)) и Built for Comfort.\
      \ Больше никто ничего не помнит... Ты правильно подумал, уважаемый читатель\
      \ - если джем соединить с днём рождения, печень страдает в двойном размере :)))\n\
      Из играющих и поющих гостей были замечены: Петрович, Аграновский, Каверкин,\
      \ Братецкий, Русинов, Володя Иванов. Особо хочу отметить чудо природы - поющий,\
      \ играющий на губной гармошке и совершенно виртуозно - на клавишных, единственный\
      \ и неподражаемый в своём роде говорящий аллигатор Евгений Лепихин! Апплодисменты,\
      \ пожалуйста! Спасибо.\nИз неиграющих гостей были замечены Евдокимов с фотоаппаратом\
      \ и Фёдор Романенко с мрачным видом.\nPS: теперь для составления полного впечатления\
      \ обязательно сходим на трезвого Мишуриса. Не откладывая в долгий ящик, прямо\
      \ сегодня - в Casus Coitus.. то есть Cosinus... не, вроде правильно будет Conus..\
      \ как мне кажется.. надо меньше пить.. пить надо меньше.."
