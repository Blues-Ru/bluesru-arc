  deleted: false
  text: 'Вот прочёл:

    <b><i>Как известно, блюзовые интонации и ритмы увлекали европейских музыкантов,
    в том числе и Мориса Равеля. Одна из частей его Сонаты для скрипки с фортепиано,
    знаменитый фокстрот китайской чашечки и английского чайника в опере-балете "Дитя
    и волшебство", многие эпизоды в Фортепианном концерте для левой руки, которые
    сам композитор называл "джазовыми", навеяны впечатлениями от негритянских блюзов.</i>

    Г.Шнеерсон "Американская песня", Советский композитор, Москва, 1977г., стр. 43</b>

    Забавно и интересно это. А что, это на самом деле так? Может кто слышал?'
