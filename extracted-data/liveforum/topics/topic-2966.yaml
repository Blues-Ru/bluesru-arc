    deleted: false
    text: 'Меня умиляет, как на этом форуме "защищают" блюз от "чужеродных" влияний.

      А теперь собственно ответ по существу:

      Да, действительно в творчестве многих европейских классических композиторов
      конца 19 - начала 20 вв. присутствуют элементы блюза и джаза. Кроме уже упоминавшегося
      Равеля, назову Дебюсси, Дворжака, Бартока. Это не удивительно, поскольку большинство
      европейских музыкантов ездили в США на продолжительные гастроли, где они могли
      познакомиться с негритянским фольклором. Впервые к традициям афроамериканской
      и креольской народной музыке обратился ещё в 1848 Луи Моро Готшалк (Готчок),
      американский пианист и композитор, который сочинил "Луизианскую трилогию". Готчок
      родился в Новом Орлеане, однако родители отправили его учиться музыке во Францию.'
