  text: "По-моему время играть марши ,господа или песни по типу        \n        \
    \  НАШ ДОМ\n\nЗастыли стены в этом доме.\nДверь не скрипит, вода не льется.\n\
    Хозяин мертв, дом продается\nКому-то новому в неволю.\n\nХозяин мертв, его забыли\n\
    Все, кроме выжившего дома,\nИ яблонь, - их в саду зеленом\nВ года былые посадили.\n\
    \nНо двери дома заскрипели.\nПришли хозяева иные,-\nЧто раньше лишь стучались\
    \ в двери,\nЧто раньше лишь гостями были.\n\nИ под чужой ногой тяжелой\nНаш дом\
    \ от боли тихо стонет,\nЧто там стучит в плененном доме?-\nТо стук шагов хозяев\
    \ новых…\n\nОн ходит в доме и смеется,\nНо он чужой, а это хуже,\nЧем смерть,\
    \ кому чужой ты нужен,\nНо слышу вновь,- \"Дом продается\".\n\nПР:\nЭТО НАШ ДОМ!\n\
    ЭТО МЫ В НЕМ!\n\nГруппа \"Петрович бэнд\" Вологда.Мы на время снимаем свои концерты.\n\
    Слишком много крови. Всем привет.Берегите себя."
