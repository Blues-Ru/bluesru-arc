  text: "Hey BO DIDDLEY fans!\n\nOne of the founding fathers of rock & roll, BO DIDDLEY\
    \ celebrates his 74th birthday on Monday December 30th 2002, and we encourage\
    \ all his many fans around the world to visit the BO DIDDLEY - The Originator\
    \ website at\nhttp://members.tripod.com/~Originator_2/index.html and sign the\
    \ Site's Guestbook with your birthday greetings and messages for BO DIDDLEY.\n\
    \nAs we always do at this time of the year, we are making special arrangements\
    \ for him to view each and every one of your greetings. This is your opportunity\
    \ for you to convey your appreciation and best wishes to one of the founding fathers\
    \ of rock & roll. \n\nPlease visit the BO DIDDLEY-The Originator website at http://members.tripod.com/~Originator_2/index.html\
    \ and sign the Guestbook and show your support for The Originator - BO DIDDLEY.\
    \  Thank you very much.\n\nDavid Blakey, Webmaster,\nBO DIDDLEY-The Originator\n\
    http://members.tripod.com/~Originator_2/index.html\nA Celebration of his unique\
    \ contribution to Popular Music."
