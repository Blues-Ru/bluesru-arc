  text: "\"I Can’t Quit You Baby\n[править]Материал из Википедии — свободной энциклопедии\n\
    \n\nВилли Диксон\nI Can’t Quit You Baby — блюзовая песня Вилли Диксона. <b>Она\
    \ была одной из наименее известных в его репертуаре.</b> В 1969 году <b>дело исправила</b>\
    \ британская рок-группа Led Zeppelin, выпустив <i>свою</i> версию на <i>своём</i>\
    \ первом альбоме (<u>трек номер 8</u>). Многие считают, что в техническом плане\
    \ это самая сильная песня группы (включая версии песен других композиторов). Гитарист\
    \ Джимми Пейдж играет скоростное гитарное соло, а бас-гитарист Джон Пол Джонс\
    \ и ударник Джон Бонэм выдают жёсткий аккомпанемент. Песня начинается с сильного\
    \ крика (Роберта Планта). Группа играла песню на концертах с 1968 по 1970 год.\
    \ Версия 9 января 1970 года есть на альбоме Coda 1982 года (запись сделана в Royal\
    \ Albert Hall), с некоторыми изменениями в тексте. В 1970 году песня была исключена\
    \ из репертуара, поскольку в него массово входили песни из альбома Led Zeppelin\
    \ III.\"\n\nЭнциклопедисты... НУ, эмоции перехлестывают, Лед Зепплин же... Я даже\
    \ не знаю, что особо выделить, потому что прекрасно все... Но особенно прекрасны\
    \ скобки в предложении \"Песня начинается с сильного крика (Роберта Планта).\"\
    \ \n\nСобственно, вопрос... автор сам-то понял, что хотел сказать этой фразой:\
    \ \"Многие считают, что в техническом плане это самая сильная песня группы (включая\
    \ версии песен других композиторов)\"?"
