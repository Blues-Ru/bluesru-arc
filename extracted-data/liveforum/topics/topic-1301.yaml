  text: "Всему свое время... Трудно не согласиться с Еклесиастом... Вот и пришло мое\
    \ время познакомится с замечательным фильмом братьев Коэнов \" O brother, where\
    \ art thou\"...\nПочему я пишу об этом фильме здесь и сейчас, на этом форуме?\
    \ Наверное по тому, что этот фильм может претендовать на определенную культовость\
    \ среди людей любящих американскую музыку, американскую народную музыку... Я не\
    \ буду пересказывать сценарий... Форум все таки музыкальный... Напишу о саундтреке.\
    \ Так вот... Он потрясающий. Он подобран настолько тщательно и с таким пониманием\
    \ темы, места и времени, что слушается на одном дыхании (наверное за это он получил\
    \ 5 грэмми, включая альбом года)... Пусть блюза на нем крайне мало... Пожалуй\
    \ единственная блюзовая вещь Hard time killing floor blues в исполнении Chris\
    \ Thomas King, хотя наверное здесь она больше известна в исполнении Skip James...\
    \ Основное внимание на пластинке уделено блюграссу и народным песням Америки...\
    \ И наверное поэтому её стоит послушать... Простые народные песни. Но как они\
    \ исполненны. Среди тех кто писал песни для саундтрека: \nNorman Blake - один\
    \ из лучших блюграссовых музыкантов Америки\nThe WHites - мастера госпел\nThe\
    \ stanley brothers - короли блюграсса\n\nНа этом альбоме не прилизанное кантри\
    \ a-la Dixie Chiks, а красивая трогательная, в чем-то наивная музыка юга довоенной\
    \ Америки...\nЭтот саундтрек стоит послушать..."
