      subject: Неужели?
      deleted: false
      text: "Я никогда не думал, что название Jefferson Airplane имеет какое-нибудь\
        \ отношение к Blind Lemon Jefferson.  Где Вы это слышали?  Ведь Jefferson\
        \ в США - это как Иванов в России.  \n\nЧто касается Pink Floyd, я не знаю\
        \ ответа на вопрос (Barrett наверно сам объяснил причину когда-то.  Нет?)\
        \   Но ввиду того, что оба этих малоизвестных блюзменов были живы в то время,\
        \ Barrett вероятно имеел возможность с ними лично познакомиться, и может быть\
        \ даже с ними играл.\n\nMuddy"
