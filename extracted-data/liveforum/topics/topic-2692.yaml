  deleted: false
  text: "Добрый день.\nОзадачился я вот каким вопросом. Ни для кого не секрет, что\
    \ название группы Pink Floyd происходит от имен блюзовых музыкантов Pink Anderson\
    \ и  Floyd Council. Если первый из них оставил несколько записей (на AMG упоминаются\
    \ 4 пластинки, некоторые из которых рецензированы на этом сайте), то о втором\
    \ вообще очень мало известно, на AMG о нем вообще ничего не написано. Короткую\
    \ информацию о нем можно найти например здесь: http://hem.passagen.se/evilclown/pinkfloyd/FC.htm\
    \ \nОттуда следует, что после себя он оставил записанными меньше 20 треков, из\
    \ которых только в 6-ти он солировал.\nВозникает закономерный вопрос: как так\
    \ получилось, что два не самых известных исполнителя пьемонтского блюза (записи\
    \ которых к тому же видимо не так легко было найти в Великобритании) оказали такое\
    \ сильное влияние на Сида Баррета, что в честь них он решил назвать свою группу?\
    \ Может кто-то знает какие-то легенды или слухи по этому поводу. \nЗаранее спасибо.\n\
    Прошу извенить, если вдруг нечто подобное уже обговаривалось на этом форуме"
