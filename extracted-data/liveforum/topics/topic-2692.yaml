    text: 'Интересно было бы узнать, много ли есть команд, в названиях которых тем
      или иным образом присутствуют имена блюзовых музыкантов. Насколько я знаю, группа
      Jefferson Airplane взяла себе первое слово названия от Blind Lemon Jefferson.
      Может кто-то знает еще примеры? Просто любопытно.

      Заранее спасибо.'
    replies:
    - id: 22265
      parent_id: 22264
