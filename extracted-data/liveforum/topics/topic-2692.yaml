        text: '"The group''s unusual name was suggested by Kaukonen, who had once
          jokingly been dubbed "Blind Thomas Jefferson Airplane" by a friend in reference
          to the blues singer Blind Lemon Jefferson."

          Взято с:

          http://www.allmusic.com/cg/amg.dll?p=amg&sql=11:0ud7yl3jxp9b~T1


          И еще один источник:


          "The term Jefferson airplane is also slang for a used match bent to hold
          a marijuana cigarette that has been smoked too short to hold without burning
          the hands. An urban legend claims this was the origin for the band''s name,
          though according to band member Jorma Kaukonen the name was invented by
          his friend Steve Talbot as a satire of blues names such as "Blind Lemon"
          Jefferson"

          Взято с:

          http://en.wikipedia.org/wiki/Jefferson_Airplane


          Насчет Пинк Флойда. Сомневаюсь, чтобы Баррет встречался с Андерсоном или
          Коунсилом. Я не встречал сведений о том что до конца 60-х Баррет ездил в
          США, как не встречал и сведений о том что Андерсон и Коунсил ездили в Британию.

          Как мне кажется, он был просто знаком с ними только по их записям. Впрочем,
          я могу ошибаться.'
