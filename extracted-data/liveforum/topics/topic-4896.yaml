  text: 'клад, друзья...

    один полновесный час видео с выступления Clarence "Gatemouth" Brown...

    редкость...

    потрясающая атмосфера...

    небольшая студия-зальчик...

    небуйная, но веселая публика...

    Кларенс много общается, шутит и смеётся...

    ему в кайф...

    под конец выступления даже выясняется что наш герой до сих пор помнит свой "trip
    to Soviet Union"...

    и "спасибо" может сказать почти без акцента...

    на фоне 4-ех изданных на DVD лайвовых выступлений Кларенса и многочасового шоу
    The Beat! с его участием, эта сегодняшняя запись для меня выделяется особой уютностью,
    домашнестью и душевностью...


    http://www.youtube.com/watch?v=IKS08o-HqDM


    ну а кто захочет зайти к нашему герою в дом и присесть к нему за стол рядом с
    несколькими молодыми американскими студентами, тот будет накормлен питательным
    и познавательным автобиографическим рассказом от нашего героя...

    вопросы от молодежи - те еще, конечно...

    сырые и непроваренные в смысле...

    но ведь ответы главнее...


    http://www.youtube.com/watch?v=RHq1Scy72Hw'
