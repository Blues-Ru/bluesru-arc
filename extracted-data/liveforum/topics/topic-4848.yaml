  text: "Королева джаза Татьяна Боева тяжело больна. \n\nКак сообщили организаторы\
    \ группы поддержки певицы в Facebook, первая леди украинского джаза лежит в онкоцентре\
    \ – в отделении полихимиотерапии. Врачи делают всю возможное. Ей помогает Юрий\
    \ Кузнецов.\n\nЛечение очень дорогостоящее, никаких накоплений у певицы нет. Неравнодушные\
    \ одесситы открыли счет в Приватбанке, на который можно перевести деньги на лечение\
    \ певицы.\n\nСчет в Приват: № 29244825509100\nМФО 305299\nОКПО 14360570\nНазначение\
    \ платежа: \"На лечение Татьяны Боевой\"\nИли просто на карточку № 4405885820808944\
    \ в Приват Банке ИНН 1955001615\n\nВсе кто живет в Одессе и кому удобно, может\
    \ занести деньги в ресторан \"Кларабара\" в Горсаду и оставить их у администратора\
    \ в конверте с подписью \"Тане Боевой\"\n\nСпасибо всем, кто уже откликнулся на\
    \ призыв о помощи, и всем, кто поможет!\n\nГруппа поддержки на ФБ https://www.facebook.com/groups/323347684394603/"
