  text: "пишут на http://cznews.info/entertainment/20110128/blues.php\n\nБлюзмен Джон\
    \ Майял в этом году вернётся в Чехию\nКороль британского блюза Джон Майял вернётся\
    \ 13 июня с концертом в Чехию. Он выступит в пражском KC Vltavsk&#225;. На сцене\
    \ его будет сопровождать группа Bluesbreakers. \n\n\nМайял своей жизнью доказывает,\
    \ что и в 78 лет можно играть блюз полный энергии, который радует и заинтриговывает\
    \ слушателей. Гитарист, певец, клавишник и игрок на гармони стал примером для\
    \ подражания для таких музыкантов, как Эрик Клептон, Мик Тайлор, Мик Флитвод и\
    \ других.\n\nБилеты на концерт Джона Майяла уже в продаже по 755 крон."
