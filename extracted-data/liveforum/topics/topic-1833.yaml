  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDCASS70402062203262725&sql=Ax9508q9tbtv4


    Ой нет, не туда... Не пугайтесь, это не джаз, но это и не Рай Кудер. То есть его
    гитара просто великолепна и этот диск необходим для ЛЮБОГО гитариста, но где же
    шикарные песни и слова? Кудер обожает южную фолк-музыку, соул, блюз, фанк, джаз
    и кейджун. Все эти стили родились вокруг Нового Орлеана, но тут Рай сосредоточился
    на диксиленде, самом легковесном и попсовом творении Луизианы. Регтайм, ранний
    джаз 20-х годов, южная музыка - всё это есть тут, но звучит это скорее забавно,
    чем интересно. Кудер почти не поет, то есть альбом инструментальный.


    Оценка 2 балла. Диск из разряда "музыка не для всех" или "музыканты шутят". Великолепны
    игра и качество записи, но чего-то не хватает для ощущения восторга от Рая Кудера.
    Big Bad Bill (Is Sweet William Now) - почти шедевр, тем не менее. Диск будет интересен
    любителям раннего джаза, диксиленда, регтайма и обязателен для гитаристов!'
