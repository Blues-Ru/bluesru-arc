    subject: Магазины CD
    deleted: false
    text: 'Я лично покупаю в трех местах:

      1) Пурпурный легион (ул. Новокузнецкая, д.1). Магазин, в целом, ориентирован
      на американских производителей. У них также хороший интернет-отдел, т.е можно
      заказать интересующие диски из СЩА, Европы и Японии.

      2) Сеть магазинов "Союз". Из них самые большие: один напротив "Пурпурного легиона"
      на Пятницкой улице, другой - ближе к началу Ленинского проспекта. У них больше,
      чем в Легионе, представлены CD европейского производства. А со службой заказов  лучше
      не связываться - предупреждаю заранее :)

      3) Трансильвания (Тверская, 8). Позиционируют себя как бутик, соответственно,
      цены за диск по сравнению с другими магазинами выше рублей на 100. Часть продавцов
      считает себя непризнанными гениями, поэтому сервис может быть соответствующим
      :). При всем при том могут быть очень редкие вещи, которых больше нет нигде.'
