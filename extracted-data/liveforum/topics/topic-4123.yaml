    subject: Хотите заработать на авторстве своей песни?
    deleted: false
    text: "Приветствую всех, меня зовут Максим Кириллов. Я музыкальный продюсер, который\
      \ ищет таланты и \nработает с молодыми исполнителями. Я хочу предложить Вам\
      \ возможность заработать деньги и \nизвестность на своем авторстве текста или\
      \ музыки к песням. Я работаю в жанрах поп, данс-поп, \nхаус поп, поп-рок, поп\
      \ – шансон. Также востребованы патриотические авторские песни (про \nРоссию,\
      \ отечественный спорт и т.д.).\n\nЕсли Вы заинтересованы, чтобы ваши песни исполнялись\
      \ на сцене в музыкальных турах по России \nи, возможно, даже зазвучали на радио,\
      \ присылайте образец вашего творчества в формате mp3. Авторам понравившихся\
      \ песен будет сделано коммерческое предложение о покупке песни или об аренде\
      \ коммерческих прав.\n\nМузыкальный файл сопровождайте описанием с указанием\
      \ следующей информации:\n\n– Год написания песни\n\n– Кем исполнялась песня\
      \ (если исполнилась ранее)\n\n– Где песни ротировались: социальные сети,  музыкальные\
      \ сети,  радио, тв и т.д.\n\n– Автор слов, автор музыки, автор аранжировки\n\
      \nСвязаться со мной можно по электронной почте maxim@mixov.ru или через страницу\
      \ в контакте https://vk.com/kirillovmax1982\n\nЕсли есть какие-либо вопросы,\
      \ пожалуйста, не пишите здесь, отправляйте вопросы на емейл: maxim@mixov.ru"
