  deleted: false
  text: "Дорогой читатель!\nЧувствуешь ли ты разницу между бутиком и вьетнамским базаром?\
    \ Вот так вчерашнее блюзовое действо отличалось в лучшую сторону от БиБиКинговских\
    \ столпотворений.\nПринцип персонального приглашения на джем ограниченного числа\
    \ музыкантов безусловно оправдался. Во-первых, музыкантов немного, они не стоят\
    \ в очереди и не переживают, успеют ли сегодня выступить или нет. Во-вторых, играя\
    \ в 3-4 композициях, музыкант успевает разыграться. В-третьих, статус приглашенного\
    \ возрастает, и он относится к своему выступлению с большей ответственностью.\
    \ По крайней мере, мы надеемся. В идеале - приглашать музыканта играть конкретные\
    \ блюзы, чтобы он дома подготовился, первоисточники послушал, фирменные ходы поснимал.\
    \ В некоторых случаях полезно сыграть соло максимально близко к оригиналу, чем\
    \ гонять пентатонику наобум - последнее редко у кого хорошо получается, и я не\
    \ в смысле беглости пальцев по грифу.\n\nПро сам клуб.\n=============\nИз числа\
    \ посещённых нами заведений Вудсток показался нам лучшим местом. Отличная акустика\
    \ помещения - полукруглая стена за сценой направляет звук в вытянутый зал. Приличная\
    \ аппаратура. Грамотный звукооператор. Кому очень громко - может перейти в соседний\
    \ зал и охладиться пивом по умеренным ценам. В третьем зале - бильярд с приличными\
    \ столами Valley. Но это так.. внешний антураж.\n\nПро джем.\n=========\nГлавное,\
    \ что джем удался.\nЧто было приятно - с первых секунд был правильный звук. Хаус-бэнд\
    \ звучал сбалансированно. Было здорово. Адекватная публика отзывалась на все подначки\
    \ Аграновского и оттягивалась по полной программе. Музыканты, получивши хороший\
    \ звук и обратную связь от аудитории, играли на уровень выше обычного. Гелюта\
    \ превзошёл сам себя и показал всё, на что способен.\nПосле джема.\nВесь вечер\
    \ аккомпонировали великолепные Сколдеры и Алексей Блохин со своим Little Grand\
    \ Piano (кажется, Roland 10 - не разглядел точнее).\nОсобенно понравилось публике\
    \ соло Серёжи Капшина на мундштуке от тромбона :)) я даже не буду говорить про\
    \ их великолепную сыгранность с Сашей Бородиным.\nТаня Михеева была, как всегда,\
    \ великолепна. Господа, следует признать, что у нас появилась блюзовая вокалистка\
    \ весьма высокого класса, её надо лелеять и холить. Единственное, что я бы настоятельно\
    \ посоветовал (Вован Евгеньич, это к тебе просьба!) - снабдить Таню текстами тех\
    \ композиций, которые она традиционно исполняет - Summertime, Leaving Blues, пара\
    \ хороших \"тягучих\" блюзов - ну негоже на таком уровне петь \"рыбу\" на типа-английском\
    \ языке.\n\nЛожка дёгтя в бочке джема.\n==========================\nКонечно, благая\
    \ идея, чтобы музыканты были хороши видны публике, но потоки тепла от софитов\
    \ делали пребывание музыкантов на сцене крайне некомфортным, если не сказать хуже...\n\
    Через пару часов звук стал явно громче - то ли усилители прогрелись, то ли звукооператор\
    \ вошел во вкус. Сидящих рядом с порталами просто сносило звуковой волной..звукооператоров\
    \ надо продолжать воспитывать.\nЛёша Блохин злоупотреблял глиссандо..\nСколдерам\
    \ следует немножко разнообразить свои риффы. В медленном темпе их традиционный\
    \ рифф \"малая секунда с зависанием на тонике\" навевал мысли о вечном...\n\n\
    После джема.\n============\nГруппа в составе Кораблин,Братецкий, Вован Иванов,\
    \ ваш покорный слуга и украсившая собой нашу суровую компанию Наташа, отправилась\
    \ в бильярдную, где акустическая гитара Кораблина была включена в Pignose Братецкого.\
    \ На звуки прибежал Гелюта (он просто фанат! и это после трёхчасового концерта!)\
    \ и провёл мастер-класс акустической гитары. Я не назвал бы то, что он играл,\
    \ блюзом - это было движение в сторону джаза, со сложной гармонией, расцвеченное\
    \ традиционными фиоритурами, арпеджио и пассажами через весь гриф, которые стали\
    \ фирменным стилем уважаемого Валерия Евгеньича. Признаться честно, мы с Кораблиным\
    \ грустно переглянулись, потому что расти нам и расти до такого чувства гармонии\
    \ и музыкальности. Опять же, пуритане могут сказать, что это не блюз и всё такое,\
    \ но это мастерство, а загонять Гелюту в какие-то стилистические рамки - занятие\
    \ безнадёжное, и ему самому лично совершенно не импонирующее. Я имею смелость\
    \ утверждать, что Гелюта прежде всего талантливый разноплановый гитарист, а блюзмен\
    \ - это одна из его инкарнаций.\n\nАнекдоты вечера.\n================\nЗвукооператор\
    \ выставил реверберацию на микрофоны примерно 0,2-0,5 сек - получилось такое эхо.\
    \ В некоторых случаях было весело.\nНапример, Аграновский объявляет: Это был Володя\
    \ Кораблин!\nЭхо: аааа блин! аааа блин!\n\nМедицинский анекдот.\nУпарившийся под\
    \ софитом Братецкий и ваш покорный слуга. \n- Саша, ты не скажешь, как называется\
    \ кратко исполнитель на тромбоне?\n- Мнэээ... тромбофлебист.."
