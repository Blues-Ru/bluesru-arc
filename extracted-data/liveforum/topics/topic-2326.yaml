  text: "Пластинка представляет собой сборник классических блюзовых вещей в исполнении\
    \ одной из матриархесс блюза неповторимой Etta James. Тут нет никаких сюсюканий,\
    \ всё взросло и по блюзу. При этом ни одной вещи в сочном «современном» исполнении:\
    \ акустика, полуакустика, аскетизм звучания тех времён, когда не умели хорошо\
    \ писать звук. \nЕдинственная женщина среди мужской рати, в составе которой два\
    \ её сына Donto и Sametto на ударных и басу соответственно, Josh Sklair – гитара/добро-гитара\
    \ и некоторые другие, Etta James, как обычно, великолепна в роли полководца.\n\
    \nОткрывает альбом нестареющая «Got My Mojo Working» в почти что буги-интерпретации.\n\
    Jimmy Reed’овский «Hush Hush» нетороплив и вальяжен – это, пожалуй, одна из самых\
    \ запоминающихся (если такое слово можно вообще употребить по отношению к классике\
    \ жанра) вещей на пластинке. Брутальный звучащий почти речитативом бас Etta James\
    \ оттеняет писклявый харп John «Juke» Logan. Вот это истинный блюз и по настроению,\
    \ и по вкусу! \n«Lil’ Red Rooster» Willie Dixon’a у Etta James превратился в царство\
    \ слайда. \nМонотонной «Crawlin’ King Snake», записанной чисто семейным составом\
    \ James’ов, с подвываниями и скрипящей блеющей гитарой, думается, должен был бы\
    \ быть доволен и сам, приложивший руку к её созданию, John Lee Hooker. \n«The\
    \ Sky Is Crying» представлена дуэтом Etta James и Brian Ray (гитара) – второй\
    \ безусловный шедевр этого альбома. Ни грамма лишнего, ни нотки, ни вздоха. Исполнено\
    \ удивительно красиво, чисто и рационально. \nВ «Driving Wheel» авторства Roosevelt\
    \ Sykes кажется, что Etta James намеренно басит, понижая голос ниже данного ей\
    \ природой, но нет. Всё иначе. Просто годы берут своё: сужается диапазон, и без\
    \ того низкий голос теряет гибкость и внутреннюю влагу. Однако у певицы остаётся\
    \ самое важное – обаяние блюза. И это - главное."
