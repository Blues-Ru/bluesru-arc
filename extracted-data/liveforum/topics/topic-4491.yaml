  text: 'Ещё 7 лет назад, тут

    http://www.blues.ru/forum/topic1287

    я интересовался об авторстве композиции Testify которая звучит у Stevie Ray Vaughan
    в альбоме Texas Flood, 1983.

    В общем, ответ нашёлся:

    http://en.wikipedia.org/wiki/Texas_Flood

    <i>"Testify" (Isley Brothers) – 3:20 *

    * Some album editions and guitar tablature books wrongly credit "Testify" to G.
    Clinton and D. Taylor, but it is actually an Isley Brothers cover. The original
    recording was released in 1964 and features Jimi Hendrix on guitar. There is an
    unrelated Parliament song of the same name (sometimes called "I Wanna Testify")
    written by G. Clinton and D. Taylor. Other versions simply say "writer unknown".</i>

    Я снова послушал Братьев Айсли, и на самом деле всё стало мне много яснее: есть
    моменты общие! :)))'
