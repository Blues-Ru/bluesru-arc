  text: "Читая некролог К.Г.Брауна, я узнал, что некто Colin Walters пишет биографию\
    \ оного. Цитата:\n\"He inherited the legacy of great bluesmen like Muddy Waters\
    \ and John Lee Hooker, but he took what they did and made it better.\"\nУотерс\
    \ – 1915 г.р., Хукер – 1917 или 1920 г.р., Браун – 1924 г.р.\nХукер первую пластинку\
    \ записал в 1948г. в Детройте, Уотерс – в 1946г. в Чикаго, Браун – в 1947г. в\
    \ Хьюстоне.\nБудучи представителями одного блюзового поколения, они работали в\
    \ разных стилях. Интересно, что же Браун мог «унаследовать» у своих современников?\
    \ Никакого влияния Хукера или Уотерса в записях Брауна я не слышу – может, я что-то\
    \ пропустил? А если я не пропустил, то какую же книгу о Брауне может написать\
    \ человек со столь своеобразным взглядом на историю блюза?\nНа amazon.com имеются\
    \ две книги авторства Уолтерса:\n1. The energy problem in Metropolitan Washington,\
    \ a first look (Energy watch report) \nby Colin Walters \nOut of Print--Limited\
    \ Availability\n2. Four thousand years of men and birds (Birds : the magazine\
    \ of the Royal Society for the Protection of Birds. [Offprint])\nЕсли модератор\
    \ позволит процитировать классику, я скажу: «руки прочь от блюза, блядюги!»"
