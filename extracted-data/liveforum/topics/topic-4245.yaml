  text: "В субботу в пивном ресторане \"Тинькофф\" имел место быть обалденный концерт\
    \ группы \"Little Albert & The Deluxe Edition\". Не могу не поделиться впечатлениями!\
    \ Отыграли просто супер! \nХотелось бы узнать, есть ли среди форумчан поклонники\
    \ этого коллектива?"
  replies:
  - id: 36392
    parent_id: 36386
    date: 2009-06-15 23:16
    poster: Федор Романенко
    subject: Little Albert & Deluxe Edition
    deleted: false
    text: "Я слушал в исполнении Ованеса всего две песни на джем-фестивале blues.ru\
      \ в апреле, но успел сделать для себя кой-какие выводы. Все понимают, что это\
      \ - молодая, талантливая группа с описанными достоинствами. \n\nМне тогда показалось,\
      \ что при всем при том, Ованес избрал с самого начала какие-то неполезные ориентиры.\
      \ Т.е. сделал упор на романтический образ блюзмена, экспрессию, сценические\
      \ трюки, выучил весь этот \"взрослый\" артистический словарь. При этом видно,\
      \ что ему как бы по-фигу, что он играет, и песня - это повод, чтобы выступить\
      \ на сцене.\n\nА мне кажется, что лучше, когда по большей части музыканта не\
      \ заметно, но он сделал так, чтобы все заценили красоту и эмоцию в песне. А\
      \ все эти штучки - как небольшая примочка, не являющаяся необходимостью.\n\n\
      Мне кажется, что крайне важно себя правильно сориентировать с самого начала,\
      \ а то потом хуже будет."
