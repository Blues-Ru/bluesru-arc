    subject: Происхождение названия Stratocaster
    deleted: false
    text: 'Don Randall (30.10.1917 - 23.12.2008) в начале 50-ых годов возглавлял Fender
      Sales Inc. и был незаменимым распространителем изделей фабрики. Он и его продавцы
      всегда делились соображениями и пожеланиями с Лео Фендером.

      Дон Рэндалл предложил название Stratocaster. Это название перекликалось с авиационными
      и ракетными программами тех лет (что-то вроде, полеты в стратосфере). А так
      как Рэндалл сам был лётчиком, ему это нравилось.

      А окончание -caster, видимо, идёт от предыдущих моделей Broadcaster, Telecaster,
      может даже в этот ряд можно поставить и Jazzmaster (ну, как бы. тоже на -aster)...'
