  text: "http://3.bp.blogspot.com/_JEuzmcvaXdA/TKz9sicqS_I/AAAAAAAAA60/hIiD8BLlYbM/s1600/joh+primer.jpg\n\
    \nJohn Primer... \nсередина 2000-ых... \nэталонный чикагский блюзовый клуб...\
    \ \nclub B.L.U.E.S, Chicago, 2519 N. Halsted... \nнакурено, шумно и тесно... \n\
    девичьи узкие трусики, как элемент оформления сцены, угу... \nнаш сегодняшний\
    \ герой прошел многодесятилетнюю музыкально-блюзовую закалку в составе двух славнейших\
    \ блюзовых коллективов... \nв 70-ых - начале 80-ых - в составе Muddy Waters Blues\
    \ Band, позже затем - в составе блюз-бенда Мэджика Слима... \nдля человека, поучаствовавшего\
    \ в этих двух составах, секретов музыки блюза и блюзовой философии не остается...\
    \ \nшкола такая, основательная... \nвот и в этот вечер - все эталонно и так, как\
    \ и должно быть... \nвыверена каждая нота и каждый жест на сцене... \nпредставление\
    \ начинается с нескольких акустических блюзов, затем продолжается старой доброй\
    \ городской электрикой... \nв меру жесткой и напористой... \nподдерживающий The\
    \ Real Deal Blues Band весьма добротно знает свое дело, несмотря на то, что в\
    \ его составе довольно безусые лица... \nслучается такое иногда, я тут недавно\
    \ такого 18-летнего блюзового клавишника в Киеве наблюдал, что закачаешься...\
    \ \nтак что возраст - это такое, иногда ошибающееся... \nчто же до нашего главного\
    \ героя, то... хорош... в форме и в голосе...\nрассказывают, что на вопрос - Сколько\
    \ блюзов, Вы, Джон, знаете?... Отвечал - Ну, 500 (!) где-то вспомню... \nна заметку\
    \ тем исполнителям, кто в своих трех текстах путается... ) \nтакже рассказывают,\
    \ что в свой недавний приезд в Москву, Мр. Праймер вместо подготовленной для него\
    \ экскурсии по значимым московским местам, предпочел провести неколько часов у\
    \ простой городской детской площадки, наблюдая как резвятся местные детишки...\
    \ \nи в самом деле, камни везде одинаковые, а детишки (любой и каждый) иной раз\
    \ выкидывают такие коленца... \nне в пример интересней... \nтаков наш герой, задумчивый\
    \ в повседневности, но экспрессивный и энергичный на сцене... \nхотя, все же,\
    \ глаза его, видевшие многое, и на сцене выдают его жизненный размышлизм...\n\n\
    http://castelarblues.blogspot.com/2010/10/dvd-john-primer-live-at-blues.html"
