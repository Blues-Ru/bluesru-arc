  text: 'Ведь в какого поп-деятеля не сморкнись, в какого поп-рокера не плюнь, тот
    непременно вздрепенется и начнет клясться в вечной любви к блюзу. прямо напасть
    какая-то.


    тем приятней было для разнообразия прочесть в интервью Кима Тайила из Soundgarden:


    "Несмотря на то, что в моем стиле игры есть что-то от блюза, я вообще-то его терпеть
    не могу, хоть мне и нравятся некоторые исполнители."


    (напечатано в рус.Rolling Stone: http://www.rollingstone.ru/articles/8962)'
