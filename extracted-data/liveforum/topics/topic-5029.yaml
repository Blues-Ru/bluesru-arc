  text: "В связи с внезапной переменой власти на староваганьковском... возникла неадминистративная\
    \ инициатива \"гульнуть напоследок\". \nМихаил Мишурис приглашает, Blues.Ru поддерживает:\n\
    Собраться в субботу, 6 апреля к 23оо, к началу ночного блюзового бдения Мишуриса\
    \ и Ко... Дабы возблагодарить ЮрИваныча за его неусыпный труд на блюзовых галерах,\
    \ поднять тост за его здоровье, ну и показать свою поддержку в трудный час \"\
    нового великого переселения\". Чай, не первое уже переселние, вместе одолеем и\
    \ это.\nвремени на подготовку меньше двух суток, так что помощь в распространении\
    \ информации будет более чем кстати."
