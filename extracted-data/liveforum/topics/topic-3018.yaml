  text: "Зашёл к друзьям, ужрался в стельку,полтора часа играл, час играл и ПЕЛ, решил\
    \ станцевать брейк-данс, упал, вывихнул руку, помидор (или огурец),играл на бас-барабане,\
    \ аптека, улица , фонарь, опять аптека, признался в любви пробегающей суке (собаке),\
    \ кого-то бил, какие-то хари, темно, стало холодно..., \n\nА после этого он спрашивает\
    \ себя -Где я мог потерять свой медиатр?-"
