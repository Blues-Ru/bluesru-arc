  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70401120901142921&sql=Aeau06j787190\n\
    \nМного блюза, джаза, рояля. Богатые аранжировки, биг-бэнд, сочный вокал, знакомые\
    \ песни. \n\nТомми ЛиПума умеет работать! GRP/Blue Thumb/MCA - вот такие лейблы\
    \ задействованы в создании этого диска. На басу играет сам Рэй Браун! Также на\
    \ басу Джон Клэйтон, Джефф Хэмилтон на барабанах и знаменитый Фил Апчёрч на гитаре.\
    \ Все очень классно, но слишком много поп-джаза. Для кого-то это кайф, но Мак\
    \ - это \"музыка протеста\" и нонконформизм в оригинале. \n\nОценка 4 балла. Лично\
    \ меня пугает биг-бэнд местами. Надо знать что такое GRP, тогда становится не\
    \ так странно, но все же Доктор не такой попсовый и джазовый обычно. В остальном\
    \ же, всё просто отлично!"
