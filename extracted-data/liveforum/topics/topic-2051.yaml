      \ совести, а промоутеры - те ВАЩЕ, им бы только такси водить и складами заведовать.\n\
      Раньше вот. Одна команда. Ну, одна с половиной. Играющая музыку которую они\
      \ считали за блюз. Все было легче. Либо любишь Валю Толкунову - либо слушаешь\
      \ Роллинг Стоунс. Сейчас - все сложнее. И сложнее сказать о каждом что-то свое,\
      \ хорошее, отличающиеся от известных истин и расхожих штампов (см. выше).\n\
      Снял бы шляпу. Правда. Если бы она у меня была.\n\nПо весне внезапно подобревший\
