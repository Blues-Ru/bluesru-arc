      \ другую, третью, четвертую, десятую, (скоро на сотни счет пойдет). И уже ничего\
      \ не можешь сказать кроме злобного занудливого ворчания, что в долю не попадает\
      \ ритм секция а солист в ноты (в тонику!!!!), а гитарист в кассу, и все такое\
