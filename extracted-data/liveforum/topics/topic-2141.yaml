  text: 'Чемпионат Европы по футболу никак нельзя обойти стороной (и даже на этом
    форуме :-)

    Да уж... Каждый раз в ожидании чуда: А может быть в этот раз?..

    Вообще-то, я вот об чём: сейчас по ящику крутят серию реклам Adidas "Noting is
    Impossible / Road to Lisbon" с разными спортсменами. Так вот, в одной из них (там
    где в самом начале футболист сиганул мяч выше ворот в кузов грузовика с песком;
    футболист малехо сконфузился; за грузовиком едут мотоциклисты) звучит интересная
    музыка: кажись, блюзовая гармошка. Звучит музыка совсем недолго (в принципе, как
    и сама реклама), но меня она цепанула. Хочется её найти. Но не знаю кто это играет.
    Не поможете ли мне её опознать.

    Не думаю что это джингл (трек записанный специально для ролика). Также как и в
    ролике Adidas "Noting is Impossible" с Мухамедом Али звучит какой-то Calexico
    - Pepito.

    Кстати, в рекламных роликах нередко звучат блюзовые темы (почему-то чаще вего
    со слайдом и гармошкой)...'
