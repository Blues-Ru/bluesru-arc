    subject: верю что Hendrix с McCartney записывались!
    deleted: false
    text: 'Ладно с ним, с Morrison''ом (никогда я не был от Doors в восторге). Пусть
      покоится с миром. А вот по поводу нынездавствующих товарищей McCartney и Winter:

      Берём книгу "BLUES WHO''S WHO by Sheldon Harris (A Biographical Dictionary of
      Blues Singers)". Fifth paperback printing - March, 1989. Da Capo Press, Inc.
      New York.

      Толстая книжка, как "Советский энциклопедический словарь", хотя сраниц поменее:
      около 800. Читаем с статье о Jimi Hendrix (орфография и сокращения сохранены):

      rec w Paul McCartney, Parlophone label, London, 1967.

      (To: Malcolm Ray Redriver (Mike). Заметьте: Paul McCartney, а не  The Beatles.
      Так что речь идёт не о Sgt. Peppers Lonely Heart Club Band. И ещё: указан лейбл
      (!) под которым они работали)

      По поводу Jimi Hendrix и Johnny Winter - я это, сфолил: нет в этой книге об
      этом упомянания. Видимо, я где-то в другом месте это вычитал. Но то что они
      вместе играли это 100-пудово, я бы даже сказал 300-фунтово! Но честно скажу,
      их студийный джем Things That I Used To Do меня не впечатлил.

      Об этой книге. Первые кадры фильма Crossroads c Ralph Macchio и Joe Seneca:
      Robert Johnson играет Crossroads; аудиокассета крупным планом; камера пошла
      шарить по комнате: пластинки, журналы, книги... Вот она! эта самая книга Blues
      Who''s Who by Sheldon Harris.

      Весьма серьёзное и солидное издание (полагаю, можно доверять). Очень много рассказано
      о чёрных блюзменах, но практически нет упамянания о белых музыкантах 80-ых (ни
      слова о SRV, Robert Cray, но есть Bonnie Raitt [ну она уже в 70-ых была известна]),
      о Clapton''e нет статьи, просто несколько раз упаминается (видимо автор - сторонник
      чистоты рядов). Я думаю, что это из-за того что первое издание книги было в
      1979 и потом она не дополнялась. Всё в ней достаточно подробно. Так например
      я там узнал что Sonny Boy Williamson был женат на half-sister (единоутробная
      или единокровная сестра) Howlin'' Wolf''а.

      Так что вопрос остается на повестке дня, недели, месяца, года, века: Кто идёт
      за "Клинск... Блин! Есть ли какая подробная информация о сотрудничестве Hendrix
      с McCartney и Winter?'
