  deleted: false
  text: 'Читал в толстенной такой энциклопедии "Blues. Who''s Who", в статье про Jimi
    Hendrix, что он в 1967 записывался с Paul McCartney, а в статье про Johnny  Winter,
    что он работал с Jimi Hendrix. Помню в начале 90-х читал в рок-энциклопедии журнала
    Ровесник, что Jimi записывался с Jim Morrison.

    Morrison меня не очень то интересует, по поводу Winter - сиё правда! у меня есть
    запись в которой сразу узнаются оба: Jimi Hendrix - Things I Used To Do (studio
    jam with Johnny Winter in 1968).

    А вот с McCartney... Странно, что факт такого сотрудничества никак не известен.
    Смахивает это на некий домысел, но я читал это в весьма солидном издании.

    Подскажите, есть ли какая информация об этом?'
