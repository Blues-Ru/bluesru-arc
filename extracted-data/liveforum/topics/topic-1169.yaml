    parent_id: 12635
    date: 2003-05-24 02:44
    poster: Эльдap Mузaфaрoв
    email: elicaster@online.tm
    subject: Hendrix/McCartney Jam - вот эта да!
    deleted: false
    text: "Вот прочел на http://www.rockmine.music.co.uk/Hendrix/JimiTape.html\nJimi\
      \ Hendrix Tape List 25:03:1969  Hendrix/McCartney Jam, Record Plant. NYC.\n\
      А вот что Маккартни говорил о Джимми (Ровесник 01/1987):\nО, Джимми! Он был\
      \ великолепен! Я знал его, мы познакомились во время его концерта в Лондоне.\
      \ Когда я впервые увидел его на сцене, я был потрясен. До этого я никогда не\
      \ предполагал, что гитара имеет такие огромные возможности. Так виртуозно еще\
      \ никто не играл, да и, пожалуй, не играет. То, что делал Хендрикс, казалось\
      \ фантастикой. Он был не просто виртуозом гитары, как его называют сейчас, он\
      \ поразительно чувствовал звук, каждая его нота имела особый смысл, а какие\
      \ гармонии звучали в его композициях. \nНевероятно! Я смотрел концерт вместе\
      \ с Эриком Клэптоном и Питом Тауншендом, мы буквально потеряли дар речи, а Клэптон,\
      \ тоже гитарист милостью божьей, впился взглядом в его пальцы и только бормотал:\
      \ \"Этого не может быть!\" Если уж такое говорил сам Клэптон, это что-то значило.\
      \ Но величайшим комплиментом для меня стало завершение концерта, когда Хендрикс\
      \ сказал: \"А сейчас я сыграю вам произведение, которое потрясло меня так же,\
      \ как в свое время ошеломил Бетховен\". \nИ он заиграл \"Sgt. Pepper's Lonely\
      \ Hearts Club Band\". Но как! У меня мурашки пошли по коже от его страстной\
      \ импровизации, больше я никогда ничего подобного не слышал! \nКстати, спустя\
      \ несколько дней \"Melody Maker\" совершенно серьезно заявил, что его корреспондент\
      \ насчитал у Джими шесть пальцев на правой руке, и Леннон отправился на проверку.\
      \ Мы пришли в гостиницу, где остановился Хендрикс, и Джон на глазах ошалевших\
      \ журналистов начал считать пальцы на руке Джими: \"Один, два, три, четыре...\
      \ а где же еще два?\" Хендрикс только посмеивается, а Джон вопит на весь коридор:\
      \ \"Сенсация! В доброй старой Англии обокрали великого гитариста!\" \nДа, Хендрикс\
      \ был великий гитарист. Я ничего не имею против Эдди ван Халена, которого сейчас\
      \ сравнивают с ним, но до Джими ему как до Луны."
