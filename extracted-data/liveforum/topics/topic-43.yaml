  text: 'Нужна Ваша помощь!!

    Только умоляю Вас, не закидывайте меня сразу грязью))  Я человек в блюзе совершенно
    несведующий, то есть  всегда с огромным удовольствием наслаждаюсь им, но совершенно
    не разбираюсь в деталях.  И вот возникла проблемка небольшая. На 14 февраля мне
    нужно подарить одному человеку диск  именно в этом жанре. Знаю что человек любит
    подобную музыку, но что конкретно и какой блюз именно предпочитает – узнать уже
    нет возможности. Хотя могу добавить что он, так же как и я не профи в этом деле.  Соответственно
    вопрос – хочется выбрать какой то небанальный, незаезжанный диск, но чтобы не
    попасть пальцем в небо, выбрав то, что заведомо не интересно. Может из вас есть
    любители, которые знают чей и какой альбом купив я не прогадаю точно. Короче чтоб
    этот диск хотелось слушать, а не засунуть на полку подальше. Да и обо мне память
    останется… Эх… В идеале, что-нибудь романтичное (но конечно в меру:)),  ведь подарок
    приурочен к такому празднику :) Понимаю что для Вас, действительно ценителей,
    подобная постановка вопроса лишена конкретики, да и вообще наверное варварская,
    простите! Но мне уж больно надо что-то придумать. ПОМОГИТЕ!!!!'
