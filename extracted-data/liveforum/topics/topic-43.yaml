      poster: Andrei V. Evdokimov (evdokimov)
      email: evdokimov@blues.ru
      subject: подарочки
      deleted: false
      text: "Fitzgerald - весьма спорно. Далеко не лучшая ее работа. Nina Simone весьма\
        \ специфична. Если брать знаменитых дам, я бы посоветовал сборник поздних\
        \ записей Billy Holiday - даже если там не блюз по форме, это блюз по feelу\
        \ и очень романтично. Ее альбом Lady In Satin, например, великолепен. Хотя,\
        \ увы, не блюз и даже не джаз. \n\nВообще, если не знаешь точно вкусов, лучше\
        \ обойтись хорошим сборником. Я бы присоединился к совету взять The Alligator\
        \ Records. 30th Anniversary Collection, отсоветовав предыдущие сборники. \n\
        Любой Чессовский сборник будет хорош. Если одаряемый пришел к блюзу от рок-музыки,\
        \ наилучшим подарком будет сборник Chess Rock Songbook (или что-то в этом\
        \ роде). Там оригиналы тех песен, которые стали популярны в записи рок-музыкантов.\
        \ Романтичный и забавный: сборник Коко Тейлор \"Got What It Takes\".\n\nНу\
        \ и так далее."
