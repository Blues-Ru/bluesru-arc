  text: 'Помню как в конце августа 1990 года я впервые увидел фотографию Стиви Рей
    Вона. То была заметка в "Комсомольской правде" о его гибели.

    Через несколько дней, я впервые его услышал в <a href="http://seva.ru/audio/rock/1990/r900907vb.mp3">передаче
    Севы Новгородцева "Рок-посевы" (07.09.1990)</a>.

    Но сегодня я с удивлением узнал что я слышал СРВ ещё раньше: только что я посмотрел
    фильм href="http://kinogo-film.top/7987-okno-spalni.html">"Окно спальни"</a> который
    я смотрел примерно в эти августовские дни в 1988 году. И там в одной из сцен звучит
    Cold Shot (кстати, и в титрах она тоже указана).

    <img src="http://img.beatles.ru/f/2344b/2344005.jpg" alt="Комсомольская Правда,
    27 августа 1990">'
