    text: 'в фильме <a href="http://kinogo-film.top/7987-okno-spalni.html">"Окно спальни"</a>
      в главной роли играет Стив Гуттенберг. Тогда я ещё не знал что это сержант Махоуни
      из "Полицейской академии".

      А роль мужика долго разговаривающего в телефонной будке играет Марк Марголис.
      И тем более я не знал что это будущий Мистер Гектор Саламанка из "Во все тяжкие".'
