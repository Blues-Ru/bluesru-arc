    text: ".. а обучение есть труд, как ни тривиально это звучит.\nВторое соображение\
      \ - обучение само по себе в кайф. Получать знания от людей, которые знают и\
      \ умеют больше тебя, и с радостью (ну и немножко за деньги) с тобой делятся\
      \ знаниями - это доставляет огромную радость. Особенно когда начинает что-то\
      \ получаться новое из того, чего не умел раньше.\nТретье соображение. В любом\
      \ искусстве ремесло и вдохновение неотделимы друг от друга. Если не суждено\
      \ родиться гением, осваивай ремесло как можно лучше, тогда через время оно вырулишь\
      \ на уровень крепкого ремесленника, что само по себе есть благо, а отнюдь не\
      \ ругательство. \nРемесленник играет или поёт или хорошо, или отлично, а у человека,\
      \ выступающего \"от сердца\", то бишь \"от сохи\" разброс качества гораздо больше.\
      \ То густо, то пусто. То филин прилетит, то не прилетит. Однако филина надо\
      \ регулярно прикармливать, тогда он и прилетает чаще."
