    text: "Самоучитель игры на бубне \n\nОТ АВТОРА: Настоящий самоучитель призван\
      \ вырвать обучение игре на бубне из рук кустарей-одиночек, передающих своё умение\
      \ по наследству, и сделать бубен достоянием масс. \n\nИСТОРИЧЕСКАЯ СПРАВКА:\
      \ Первое упоминание о бубне мы находим у Плутарха, который отмечает: \"Он (вероятно\
      \ Юлий Цезарь - прим. автора) любил слушать музыку (по-видимому бубен - прим.\
      \ автора)\". \nМалое распространение бубна в Европе объясняется жёстоким преследованием\
      \ инквизиции в эпоху средневекового мракобесия, а также отсутствием подобного\
      \ самоучителя. \n\nТЕХНИКА ИГРЫ: Обучающийся берёт бубен в правую руку и начинает\
      \ встряхивать его, одновременно ударяя по нему кистью другой руки. \n\nНОТЫ:\
      \ При записи музыки для бубна в начале каждой музыкальной фразы ставится бубновый\
      \ ключ. \n\nСИСТЕМА НОТНЫХ ЗНАКОВ: Крестик (дзинь) - знак встряхивания; нолик\
      \ (бум) - знак удара. Например, популярный романс \"Однозвучно звенит колокольчик\"\
      , будучи положен на бубен, выглядит так: \nдзинь, бум, бум, бум, бум, бум, бум,\
      \ бум \nТри начальных удара делаются для того, чтобы привлечь внимание публики\
      \ к исполнителю. \n\nРЕЗЮМЕ: Автор надеется, что, пользуясь самоучителем, владелец\
      \ бубна через три-четыре года достигнет определённой виртуозности игры на этом\
      \ инструменте и испытает немало счастливых минут."
