  subject: Логотип blues.ru
  deleted: false
  text: 'Мы с Андреем решили обратиться за интеллектуальной помощью к блюзовому населению
    вот по какому поводу. Blues.ru все больше учавствует в разных официальных мероприятиях,
    поэтому ему необходима определенная постоянная символика, которая позволила бы
    не терять результаты его популяризации, которую мы можем использовать в своих
    грязных блюзовых целях. В частности, нам нужно раз и навсегда сделать профессиональный
    логотип, который бы нас устраиваил долгое время, и который мы могли бы лепить
    где попало. На афишах, сайте, компакт-дисках, баннерах и пр. У нас есть различные
    полукустарные, даже неплохие варианты, но хочется решить проблему раз и навсегда.
    Для этого мы обратимся к профессионалам с серьезным заказом, тут проблемы нет
    и все будет Ок. Однако мы в качестве знатоков предметной области должны сгенерировать
    определенное количество хороших идей, из которых могут быть изготовлены разные
    варианты и пр. Тут нужна ваша помощь.

    Предварительная универсальная в таких случаях идея примерно такая. Лого - это
    надпись blues.ru и символическая картинка, силуэт, значок и т.д. Логотип должен
    гибко подстраиваться под окружающие условия - иметь черно-белый и цветной варианты.
    Накладываться прозрачно, а также на черный или белый фон, растягиваться безгранично
    и пр. Возможно изменение взаиморасположения надписи и картинки.

    Картинка должна быть простой, запоминающейся, и иметь "семантическое" (по смыслу
    - прим.ред.) отношению к блюзу. А также, возможно, но совершенно необязательно,
    к высоким технологиям (интернет), и возможно, к слову .ru (в России). В качестве
    шутки - балалайка (русский) с бендом (блюз) и земным шаром (в интернете). Понятно,
    что обязательным является только отношение к блюзу, а остальное - не важно.

    В качестве источника вдохновения можно использовать логотипы блюзовых фестивалей,
    записывающих компаний и т.д., чтобы понять общий правильный ход мысли в таких
    случаях.

    С удовольствием воспримем любые (может даже не самые лучшие, на первый взгляд)
    ваши предложения и соображения, хотя бы для того, чтобы рассмотреть разные варианты
    и потом выбрать. Ну и, разумеется, будем думать сами... Автор финальной идеи будет
    занесен в анналы, и как-нибудь блюзово-поощрен при случае. Спасибо!'
