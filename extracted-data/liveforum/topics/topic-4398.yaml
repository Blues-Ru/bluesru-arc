    Vatican beatifies Blues Brothers ... well almost

    VATICAN CITY

    Fri Jun 18, 2010 6:19am EDT

    (Reuters Life!) - Jake and Elwood, the loveable if hapless characters played by
    John Belushi and Dan Aykroyd in the classic 1980 film The Blues Brothers, have
    finally gotten Vatican recognition for their "Mission from God."

    To mark this week''s 30th anniversary of the film, which became a cult classic
    and spawned a fashion of wearing black hats and dark sunglasses to parties, the
    Vatican newspaper dedicated a full page and no fewer than five articles to it.

    One of the articles says there is "no lack of evidence" that The Blues Brothers
    can be considered "a Catholic film."

    It notes that Jake''s release from prison and the commitment by him and Elwood
    to put their blues revival band back together to raise money to save an orphanage
    from forced closure has parallels with the Biblical story of the prodigal son.

    Jake and Elwood -- who say they are on a "mission from God" to raise the money
    to pay a back tax bill for the orphanage -- and the band members, are symbols
    of "redemption obtained with sacrifice."

    The newspaper also notes that the film is sprinkled with Catholic and moral references
    such as the nun Sister Mary Stigmata, who they call "The Penguin."

    Elwood even passes up a chance for a one-night stand with a woman played by Twiggy
    in order to fulfill the mission, it says.

    "This is a memorable film, and, judging by the facts, a Catholic one," the newspaper
    said.

    (Editing by Paul Casciato)


