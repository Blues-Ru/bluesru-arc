    Ватикан благословил братьев Блюз

    Когда герои культового фильма Джона Лэндиса «Братья Блюз» говорили, что их миссия
    «от Бога», их никто не тянул за язык. Католическая церковь запомнила эти слова
    и присмотрелась к картине повнимателеьней.

    К 30-й годовщине фильма, снятого в 1980 году, ватиканская официальная газета L''Osservatore
    Romano назвала фильм «Братья Блюз» «католической классикой» и рекомендовала его
    для просмотра всем католикам.

    Фильм, который родился из скетча, показанного в шоу «Saturday Night Live», с Дэном
    Эйкройдом и Джоном Белуши в главных ролях, действительно – классический. В нем
    приняли участие такие звезды блюзовой музыки как Рей Чарльз и Джонни Ли Хукер.
    В 1998 году было снято продолжение – «Братья Блюз 2000», в котором умершего брата
    заменил Джеймс Белуши и который поучаствовал в программе Каннского кинофестиваля.'
