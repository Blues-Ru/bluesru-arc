  text: Топаем мы вчера с чуваком в недалеко от станции метро Охотный ряд и вдруг
    моё неверное зрение выхватывает до боли знакомое сочетание букв (благо она было
    таким большим что я его сумел разобрать), а именно, синим по белому написано "B.B.
    King", я говорю, чувак, прочти, чего там. А там было написано о концерте Кинга.
    И ещё такая надпись "Прощальный концерт Короля". Чувак жутко обрадовался, мол
    концерт, надо бы денег поднокопить. А я призадумался, а почему "прощальный"? Никто
    ничего не знает?
