                    deleted: false
                    text: "Она прекрасна если употребляется высоко подготовленными\
                      \ и отлично знающими произведение и чувствующими друг друга\
                      \ музыкантами - таких колективов мало несмотря на большое колочество\
                      \ отличных музыкантов.\nНапример послушайте албом Алана Холдсворта\
                      \ \"The sixteen men of tain\" и особенно композицыю \"downside\
                      \ up\", там даже гармония сесквитонная (построение акордов на\
                      \ четвертых) а мелодия убойная ваапче.\nИз традиций - Zoot Sims\
                      \ and Gershwin Brothers, в составе Оскар Петерсон, Джо Пэс,\
                      \ Джордж Мраз и Грэйди Тэйт - очень \"свинговый\" альбом и при\
                      \ этом мелодичный, особенно песня \"How long has this been going\
                      \ on\". \nВсе Live Шакти, особенно новые альбомы с Субраманиамом.\n\
                      \nВозвращаясь к теме, на много легче \"свинговать\" солисту\
                      \ и вести себя НЕЛИНЕЙННО когда ритм секция играет Железно (линейнно)\
                      \ шафл, \"свинг\", whatever.\n\nА когда нелинеарно стараются\
                      \ играть \"прог-рок-блю-ню-мытал\" Ганджубас Многососовы, получается\
                      \ не музыка а шахнота (извиняюсь за мой французский).\n\nМожно\
                      \ ли писать компютером и самплером блюз, \"свинговать\" и.т.д\
                      \ ?\nконечно можно! даже в MIDI не говоря уже о прямой аудйо\
                      \ записи - отключи квантизацию, поставь ритм часы на максимум\
                      \ и сыграй live на драм педах или клавишах а потом подправь\
                      \ визуально-мануально если есть знание и чувство. вопрос в другом\
                      \ - а надо ли это, когда есть аудио запись и хороший самплер.\
                      \ Технология очень помогает В СТУДИИ если ее применять умело\
                      \ и в меру, так что пардон Федор :))\n\nИ на последок, если\
                      \ кто нибудь серезно интересуется современной гармонией, ладами\
                      \ и ритмом - очерь советую : \"Twentieth Century Harmony, Creatve\
                      \ Aspects and Practice\" by Vincent Persichetti  а также \"\
                      Thesaurus Of Scales and Melodic Patterns\" by Nicolas Slonimsky."
