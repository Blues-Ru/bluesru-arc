            text: 'Вообще, мне хотелось в какой-то момент написать текст ровно на
              эту тему в форме какого-нибудь FAQ ;) Хотя я могу наврать по части музыкальной
              терминологии, которой я плохо владею.

              Основная мысль такая - не то, чтобы "слабая доля" - хорошо, а "сильная"
              - это плохо. Просто свинг дает некоторое новое измерение в построении
              музыкальных фраз. Для классической музыки обе восьмые "почти" одинаковые
              (с оговорками). А тут у каждой ноты во фразе появляется новое качество
              и окраска. Соответственно, значительно повышается количество "комбинаций".
              Как только появилось новое измерение, его сразу стали "разрабатывать"
              в новой музыке. Т.е., если регулярно акцентируют неустойчивость на слабой
              доле, играют синкопы, то это просто подчеркивает отличие от классических
              простых мелодий. При этом, для классического ритма синкопа - это фишка,
              которая звучит и выделяется. Если ты в свинге, в котором весь аккомпанимент
              слабыми долями, играешь в брейке акцентированную сильную долю - это
              тоже фишка, но наоборот. Главный рецепт состоит в разнообразии. Любую
              "фишку" повторишь 100 раз, уже будет не смешно.

              Свинг дал музыке новое измерение в ритмическом плане (как, к примеру,
              джазовая гармония на септаккордах - в гармоническом). Если ты в блюзе
              фигачишь на первую долю, то это не "оригинальность", а простое незнание
              языка этого музыкального стиля.'
