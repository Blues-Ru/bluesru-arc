  subject: 'Из гитарз.ру: Свинг и шаффл'
  deleted: false
  text: "Когда говорят про свинг и шаффл, имеют в виду примерно одно и то же. Это\
    \ - одно из основных отличий музыки 20-го века (джаза, блюза, рок-н-ролла) от\
    \ более старой - классической, романсов и т.д. Основная идея такая. К примеру,\
    \ возьмем какую-нибудь фразу восьмыми. В такте их будет 8 штук в чередовании:\
    \ (сильная, слабая) (сильная, слабая) (сильная, слабая) (сильная, слабая). В классической\
    \ музыке, во-первых, все восьмые имеют одинаковую длительность. Во-вторых, акцент\
    \ всегда идет на первую, т.е. сильную долю. Нужно заметить, что в любой музыке\
    \ доли совершенно неравноценны. Т.е. одна и та же фраза из восьмых, если ее сдвинуть\
    \ на одну восьмую так, что сильные станут слабыми и наоборот, будет звучать совершенно\
    \ по-другому. \nГлавное отличие свинга в том, что a) доли не равны по длительности,\
    \ сильная звучит подольше (триольный ритм) б) основной акцент делается не на сильную,\
    \ а наоборот - на слабую долю. \nЭто - схема, в реальности картина посложнее,\
    \ есть исключения, есть сильные-слабые четверти и так далее, но общая идея именно\
    \ такая. Есть нестандартные размеры со свингом и т.д. \nВ результате получается,\
    \ что \"классическая\" мелодия, которая звучит как \n(та да) (та да) (та да) (та\
    \ да) превращается в \nтам (таааа дам) (тааа дам) (тааа дам) тааа ... \nГрубо\
    \ говоря, свинговые фразы и импровизации построены на неустойчивости и обыгрывании\
    \ именно слабой доли. \nКакие отсюда выводы и соображения: \n1) Блюз и джаз на\
    \ 95% процентов в ритме построены на свинге. Если не знаешь, что это такое, или\
    \ не чувствуешь, где какая доля, нужно срочно бежать учиться. Это - основа. \n\
    2) Отечественные блюзроковые и начинающие гитаристы повсеместно \"садятся на первую\
    \ долю\". Это - очень большой и позорный грех для блюза. Таких много, к примеру,\
    \ наш друг Леван, который любит порассуждать, что у него ритм-секция тонко чувствует\
    \ свинг, а потом тут же херачит по первой. Из первого класса джазовой школы за\
    \ такое взашей выгоняют. Если кто-то захочет защитить Левана, к примеру, от моих\
    \ нападок, советую еще раз изучить указанный вопрос, послушав его последнюю пластинку.\
    \ \n3) Чтобы хорошо чувствовать и играть свинг, нужно какое-то время к нему привыкать.\
    \ Для этого нужно слушать много соотв. музыки и тренироваться играть, хлопать\
    \ в ладоши или стучать ногами. \n4) Есть музыка, где свинг является более существенной\
    \ и явной деталью. Есть - где менее. Чтобы хорошо почувствовать свинг, нужно слушать\
    \ соотв. музыку. Например, свинговый период в джазе, бибоп, west-coast blues -\
    \ очень свинговая музыка. Блюз-роковые формы - в значительно меньшей степени.\
    \ В классической музыке, половине рока, в heavy metal его может не быть вообще.\
    \ \n5) Хорошая тренировка состоит в том, чтобы научиться абсолютно точно топать\
    \ ногой или хлопать на слабую долю при прослушивании соотв. музыки. Если это делаешь,\
    \ то начинаешь гораздо лучше чуствовать и понимать эту музыку. Черных музыкантов\
    \ в джазе и блюзе любят за то, что они с детства слушают музыку в свинге и традиционно\
    \ чувствуют свинг гораздо лучше многих белых, которых тянет в рок. Хотя при наличии\
    \ минимального образования и опыта цвет кожи значения не имеет. Сейчас уже нет\
    \ такой разницы в муз.культурах. \n6) Пытаться заколотить в мобилу какой-нибудь\
    \ блюз - пустое занятие. Получится отвратительно именно из-за полного отсутствия\
    \ свинга в ритме. \n7) Хотя нотами свинговые фразы записываются также, как и в\
    \ классической музыке, если тупо сыграть ровными долями, то получится полный отстой.\
    \ Обычно в ключе помечают необходимость свинга пометкой \"триольного ритма\",\
    \ т.е. пишут, что две восьмые как бы равны восьмой с точкой и шестнадцатой. Это,\
    \ конечно, условность... Имея ноты, правильно сыграть джазовую мелодию, как правило,\
    \ можно только ее послушав, ибо \"глубина и острота\" свинга варьируется, то никак\
    \ не помечается в нотной грамоте."
