  text: 'телесериал...

    ...Тетка за рулем иномарки говорит чуваку на пассажирнском сиденье: "Хватит твоих
    блюзов сраных слушать. будем слушать нормальную музыку". И включает нечто хип-хопистое.

    Я возмущен. Слушать "кого? что?" Это ж винительный падеж, а не родительный. Правильно:
    "Хватит твои блюзы сраные слушать."

    Инверсия членов предложения тоже довольно странная, но путать падежи мы не позволим
    никому! Хватит нести безграмотность в массы. Скажем дружно: НТВ - гавеная грамматика.'
