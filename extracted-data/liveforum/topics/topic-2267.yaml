  text: Тут по случаю прикупил N10 журнала "AUDIO & VIDEO" (цена вопроса 110р) и был
    приятно удивлен - внутри находился уже названный диск, обложка + вкладыш к нему.
    Осталось прикупить коробку для CD и полноценный диск у меня в кармане. Что еще
    очень порадовало- хорошие аннотации по исполнителям с фотографиями и качественная
    запись материала.Для тех кто хочет узнать о состоянии дел в рос.блюзе -это удачное
    приобретение. Мне особенно понравились Svet Boogie Band, Dirty Dozen + balalayka.
  replies:
