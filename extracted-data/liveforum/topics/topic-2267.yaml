    subject: Тоже очень хотел поделиться впечатлениями
    deleted: false
    text: "Думаю, что это все молчат... В общем, впечатления замечательные.\nОтличная\
      \ подборка в целом. (Некоторых исполнителей не хватает, но камень в огород по\
      \ этому поводу просто рука не поднимется).\nПрослушал все входные, и еще хочется...\
      \ \nПредставлены и свинг, и рок, и буги, и все что душе угодно из того, что\
      \ мы называем блюзом... Очень приятно порадовало качество звука и профессионализм\
      \ наших музыкантов. (Был не очень удачный опыт приобретения концертного альбома\
      \ Big Blues Revival - после замечательного живого концерта качество записи диска\
      \  не шло ни в какое сравнение) \nМногих из музыкантов, представленных на диске,\
      \ мне доводилось слышать живьем, но теперь очень хочется послушать и всех остальных.\
      \ \nНизкий поклон тем, кто это организовал и вложил душу в этот замечательный\
      \ проект. Сейчас вот рекомендую диск своим знакомых, хотя ценителей блюза среди\
      \ них к сожалению немного. \nОчень понравились Ragtime, Blues Hummer Band и\
      \ Svet Boogie Band, ну от Братецкого я давно без ума...\nИ вообще убеждаюсь,\
      \ что наши ребята (в блюзе по крайней мере) и играют, и поют не хуже многих\
      \ своих западных коллег!\nВ общем, все молодцы!\nLong Live Russian Blues!"
