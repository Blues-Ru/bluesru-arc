  text: 'Читаю статью в память Этты Джеймс:


    > Булеремия, нападавшая в периоды отрезвления, тоже не способствовала здоровью...


    Однако, существуют две разные болезни -  булимия, или паталогическое обжорство
    нервного генезиса, которой, очевидно, и страдала Этта, и туляремия - очень музыкально
    звучит, ноты "до" только не хватает, но это болезнь зайцев и хомячков, а вот "булеремии"
    в природе не существует.'
