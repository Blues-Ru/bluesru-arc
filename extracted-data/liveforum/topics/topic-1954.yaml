  deleted: false
  text: "Традиционный джем по средам в Би Би Кинге 24 марта вёл Николай Садиков и\
    \ возглавляемая им банда «Blues Hammer Band». Николай избавился от своей роскошной\
    \ шевелюры, а новая в меру короткая стрижка прибавляла его внешности ореол романтичности\
    \ и новизны.Традиционный репертуар перемежался с авторскими композициями коллектива.\
    \ Пётр Маевский по случаю джема вместо контрабаса активно пользовался бас-гитарой.\
    \  В условиях тесной бибикинговской сцены массивный громоздкий контрабас откровенно\
    \ неудобен как хауз-бэнду, так и джемующим. Практически не использовался слайд,\
    \ что, в общем, обидно, потому как это, безусловно, одна из сильнейших сторон\
    \ Николая как музыканта.\n    Я так и не понял, состоялась ли на прошлой неделе\
    \ презентация нового диска группы. Ни слова о нём сказано не было.\n    Джем проходил\
    \ мягко и как-то очень так ненавязчиво-фОново. Кажется, причиной тому явилась\
    \ некоторая незамыленность и неопытность что ли в проведении подобных  мероприятий\
    \ самим Садиковым. При том, что из широко известных в узких кругах :) музыкантов\
    \ подошли лишь В.Кораблин, Жора, М.Владимиров, В. Рогожин, С.Воронов да Тарзан,\
    \ записавшихся было столько, что, играя лишь по одной вещи, все желающие окучены\
    \ так и не были. В финале же на сцену вышел известный джазовый кларнетист Анатолий\
    \ Герасимов, выступивший, впрочем, достаточно вяло и неинтересно.\n    В общем\
    \ хорошо было: не жарко, не вялко. Приятный вечер, однако.\n\nPS Надеюсь, фотки\
    \ на блюзмане со временем нарисуются."
