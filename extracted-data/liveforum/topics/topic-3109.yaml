    text: 'CitySpb.ru пишет о спектакле:


      Рядом с женщинами, кем бы они ни были, Дон Жуан выглядит нашкодившим двоечником.
      От них бежит в уголок, к играющим блюзы музыкантам под руководством белого,
      как лунь, Петровича — Максима Соколова. Там Суханов берет в руки микрофон, и
      с его лица мгновенно слетает шкодливая гримаса. Блюз собственного сочинения
      Суханов поет так всерьез, импровизирует так мощно и вдохновенно, что не остается
      сомнения: в выведенной здесь антиномии на верховную роль претендует сам Дон
      Жуан.'
