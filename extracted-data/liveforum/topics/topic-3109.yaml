    subject: А что не понравилось?
    deleted: false
    text: "А что не понравилось? Если режиссерские приемы Мирзоева, так это не тот\
      \ форум, где обсуждается современная режессура. \nПетрович и Hot Rod Band не\
      \ халтурят, играют также хорошо, как и на других площадках, будь то клуб или\
      \ ЦДХ. \nКритиковать Максима Суханова тоже довольно странно - актер он замечательный,\
      \ к тому же сам и на рояле играет и поет (по-моему, для драматического актера\
      \ очень даже неплохо, а блюз вместе с командой Петровича так и вообще хорошо,\
      \ во всяком случае, не хуже многих, уважаемых мною, отечественных блюзменов).\n\
      Не знаю, что было в ПРОсвете, но спекталь я видел в начале осени - типично мирзоевская\
      \ работа. Мне лично нравится. А кому - нет, так и не надо ходить на современные\
      \ постановки. \nЕсли что-то у Петровича и Суханова не получилось в ПРОсвете,\
      \ так у каждого бывают более удачные выступления и менее удачные. Так что -\
      \ о чем спич?"
    replies:
    - id: 26147
      parent_id: 26134
      date: 2006-02-16 13:40
      poster: Kot Matraskin (KotMatraskin)
      email: kotmatrs@mail.ru
      subject: Им бы что нить исполнить из Рамштайна! вот бы был класс!
      deleted: false
      text: "Я честно говоря, не сразу понял что происходит. Сидел спиной к телевизору,\
        \ и когда услышал, первая мысль - \"ну вот, столько у нас классных блюзовых\
        \ команд, а Дибров опять какую то самодеятельность пригласил\". Ни грува,\
        \ ни драйва, только глотку дерут. Короче - сильно расстроился по поводу Дибровского\
        \ вкуса.\nА потом оглянулся - ба! как же классно! Это же ПетровичЪ!!! Ну,\
        \ так совсем другое дело то! Сапоги из крокодила, шляпа - где надо, борода\
        \ - лопатой и гармошка в ладошке. И сразу как то стал позитивнее. \nНе, не\
        \ будем критиковать. Блюз - это замечательно! Если бы был блюз хотя бв раз\
        \ в неделю по ТиВи - глядишь, и молодежь бы потянулась в блюз. И публик, и\
        \ все такое. \nА то что Мирзоев сделал спектакль с БЛЮЗОМ, да еще и с живой\
        \ командой (а не по моде под фанерку) - так ему полный респект.\nТак что -\
        \ всем спасибо. Все было замечательно."
