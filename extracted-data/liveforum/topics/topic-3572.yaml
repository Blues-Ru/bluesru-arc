  subject: КАК ПЕТЬ БЛЮЗ (руководство) :-)
  deleted: false
  text: "1) Запомните, большинство блюзов начинаются с фразы «Проснулся я утром» (Woke\
    \ up this morning...) «Моя жена добрая...» - плохая фраза для начала блюза. Разве\
    \ что, после вы споете что-то вроде «…, но уродина, просто срам!». \n\n2) Блюз\
    \ – простая музыка. После того, как споете первую строку, повторите ее. Потом\
    \ найдите рифму. К примеру: «Моя жена добрая, но уродина, просто срам! / О-о-о,\
    \ моя жена добрая, но уродина, просто срам! / У нее зубы как у Маргарет Тетчер\
    \ и весит она 200 килограмм!». (Got a good woman with the meanest face in town\
    \ / Yes, I got a good woman with the meanest face in town / Got teeth like Margaret\
    \ Thatcher / and she weigh 500 pound.) \n\n3) Блюзовые автомобили это: Шевроле,\
    \ Форд, Кадиллак и любой разбитый грузовик. Вольво, BMW или спортивные родстеры\
    \ – это не блюз. Главное блюзовое средство передвижения – автобус дальнего следования\
    \ или поезд где-то на юге. Хотя, дальние походы пешком – более важная часть блюзового\
    \ образа жизни. \n\n4) Тинейджеры не поют блюз. Блюзовый возраст начинается с\
    \ возможности быть приговоренным к казни на электрическом стуле за убийство человека\
    \ в Мемфисе. \n\n5) Блюз может иметь место в Нью-Йорке, но не Гавайах или в Канаде.\
    \ Тяжелые времена в Сиэтле или Минниаполисе – это, скорее всего, просто депрессия.\
    \ Чикаго, Сент-Луис и Канзас-Сити - все еще лучшие места для блюза. Блюз также\
    \ неуместен в климатических зонах, где не бывает дождей. \n\n6) Мужская лысина\
    \ – это не блюз. А женская – да. Сломать ногу, катаясь на лыжах – это не блюз.\
    \ Другое дело, если вы сломали ногу, когда вами подавился аллигатор. \n\n7) В\
    \ офисе или супермаркете блюза не бывает. Отправляйтесь на автостоянку или, хотя\
    \ бы, пойдите посидите возле туалета. \n\n8) Хорошие блюзовые места: хайвэй, тюрьма,\
    \ пустая кровать, дно стакана с виски. Плохие: бутик Армани, презентация выставки\
    \ авангардной живописи, курсы гольфа. \n\n9) Никто не поверит, что это блюз, если\
    \ на вас костюм. Разве что вы – старый черный и спали в нем (вариант: вас в нем\
    \ хоронят). \n\n10) У вас есть право петь блюз: если вы дожили до преклонного\
    \ возраста или, хотя бы, долго не мылись; если застрелили человека в Мемфисе;\
    \ если вы слепой. Вы не имеете права петь блюз: если у вас сохранились все зубы;\
    \ человек, в которого вы стреляли в Мемфисе, выжил; вашу слепоту вылечили; вы\
    \ владеете трастовым фондом. \n\n11) Блюз не зависит от цвета кожи. Дело – в невезении.\
    \ Майкл Джордан не может петь блюз. А Майк Тайсон – мог бы. Уродливые белые люди\
    \ тоже имеют право исполнять блюзы. \n\n12) Если вам жена наливает бензин, когда\
    \ вы просите про стакан воды, это блюз. Другие подобающие блюзовые напитки: дешевое\
    \ вино, виски или бурбон, мутная вода (muddy water), отвратительный черный кофе.\
    \ Не подобающие блюзовые напитки: Перье, Шардоне, диетические версии газировки.\
    \ \n\n13) Смерть в дешевом мотеле – это блюз. Настоящий блюзмен может быть застрелен\
    \ в уличной разборке или убит в спину ревнивой любовницей. Также подходит электрический\
    \ стул и смерть в одиночестве на сломанной койке. Не годятся сердечный приступ\
    \ во время теннисного матча или липосакция. \n\n14) Подходящие блюзовые имена\
    \ для женщин: Сэйди, Большая Мама, Бесси. Для мужчин: Джо, Вилли, Малыш Вилли,\
    \ Большой Вилли. Люди с именами вроде Мишель, Амбер, Дебби и Хизер не могут петь\
    \ блюз вне зависимости от того, как много людей они застрелили в Мемфисе. \n\n\
    15) Придумайте себе подходящее блюзовое имя. Вам необходимо название какого-либо\
    \ физического недостатка (слепой, хромой, безумный); имя (см. выше); название\
    \ фрукта (лемон, лайм, киви); фамилия американского президента (Джефферсон, Джонсон,\
    \ Филмор). Например: Слепой Лайм Джеферсон (Blind Lime Jefferson), Хромой Лемон\
    \ Джонсон (Lame Lemon Johnson), Безумный Киви Филмор (ну, может, киви и не подходит).\
    \ \n\n16) Вне зависимости от трагизма вашей жизни и количества трупов после визита\
    \ в Мемфис: если у вас есть компьютер, вы не можете петь блюз."
