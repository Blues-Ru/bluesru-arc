  text: 'Недавно попал я на джем где звукооператором был басист Хаус бенда. Все инструменты
    вторично подзвучивались с пульта от которого сигнал шел в минидиск а от туда в
    наушники басиста, который все отлично микшировал. Короткое демо от этого джема
    можете послушать на guitars.ru  демо No.59 .

    www.guitars.ru/demo/redhouse.mp.3

    Любительям Хендрикса может понравиться.'
