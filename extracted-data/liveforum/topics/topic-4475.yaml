  subject: ПЛИМУТ ПОКОРИЛ СЕРДЦА КРАСАВИЦ «НИМ»
  deleted: false
  text: "ПРЕЗЕНТАЦИЯ НОВОГО КЛИПА – САМО ПО СЕБЕ НЕОРДИНАРОНОЕ.\nВечером 16 ноября,\
    \ в «Чайна Таун Кафе» полным ходом проходила подготовка к презентации группой\
    \ ПЛИМУТ дебютного клипа на песню «ПРИВЕТ». \nЗа окном моросит дождь, в кафе за\
    \ столиками сидят несколько человек, пахнет кофе и дымят сигареты, официанты \
    \ готовятся к приему большого количества гостей, сегодня ожидают московский бомонд.\
    \ \nНа сцене  выставили аппаратуру и закончили настраивать звук, утонув в мягких\
    \ диванах, музыканты группы ПЛИМУТ решили передохнуть, до концерта оставался один\
    \ час.\nВнезапно в проеме двери одна за другой  в сторону гардероба стали проходить\
    \ молодые длинноногие красотки,  это массовое шествие привлекло внимание не многочисленных\
    \ посетителей Чайна Таун Кафе. \nДиректор группы ПЛИМУТ решил, что пресса перепутала\
    \ время начала презентации. \nТо, что произошло в следующее мгновение,  не ожидал\
    \ никто, девушки так же дружно вошли в помещение кафе, одновременно достали фотоаппараты,\
    \ с неприлично большими объективами и началось действо. Человек тридцать длинноногих\
    \ декольтированных красавиц  засверкали вспышками, фотографировали все подряд,\
    \ столы, пепельницы, кирпичные стены кафе, софиты, барную стойку, стройные ряды\
    \ бутылок. Большая часть этих  НИМф стремительно бросилась к сцене, на которой\
    \ только что закончился саундчек у группы ПЛИМУТ, в объектив попадало все шнуры,\
    \ микрофонные стойки, барабанная установка, гитары и примочки к ним… сверкали\
    \ вспышки…. самые смелые красавицы бросали взгляд своих объективов в сторону музыкантов.\n\
    В свою очередь музыканты ПЛИМУТ наблюдали этим флэшьмобом, действо завораживало,\
    \ объяснить происходящее ни кто не решался, было похоже на  фото-сессию невидимой\
    \ группы ПЛИМУТ.\nКрасавицы оказались студентками Национального Института Моды\
    \ (НИМ), им перенесли пару на вечер для практического занятия было выбрано помещение\
    \ недавно открывшегося модного заведения Чайна Таун Кафе. \nМузыканты пригласили\
    \ их остаться на презентацию, к девяти часам вечера подтянулся бомонд и папарацци.\
    \ Когда первые аккорды взорвали зал,  раздались восторженные крики и вокруг сцены\
    \ с двойным усердием отовсюду засверкали бесчисленные вспышки фотоаппаратов, музыканты\
    \ группы ПЛИМУТ  окруженные ореолом световых вспышек зажигали сердца своих поклонников,\
    \ в ряды которых так неожиданно влились красавицы НИМ фы."
