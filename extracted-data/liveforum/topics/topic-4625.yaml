  text: "Газета с дивным названием \"Торонтовка\" сообщает:\n\n<i>\nПарк в Торонто\
    \ получил имя знаменитого гитариста Джеффа Хили\n19:17 – 4.6.2011\n\n Вудфорд-парк\
    \ в Этобико, в райoне пересечения улиц Parklawn и Queensway, официально получает\
    \ новое имя.\n\nВ церемонии в воскресенье он будет переименован в Джефф Хили-парк.\n\
    \nХили, известнейший гитарист, игравший в различных стилях - от блюза и джаза\
    \ до рока, вырос в этом райoне Торонто, а когда стал взрослым приходил сюда со\
    \ своими детьми.\n\nВ 2008 году знаменитый гитарист скончался от онкологического\
    \ заболевания. Ожидается, что его вдова Кристи произнесет на церемонии переименования\
    \ парка небольшую речь. </i>\n\n\n\nИсточник: http://www.torontovka.com/news/canada/18991230/13353.html"
