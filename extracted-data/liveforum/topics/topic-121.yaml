    text: 'Меня давно занимал вопрос покупки в забугорных интернет-магазинах.

      Как сейчас диски и книжки проходят границу - таможить надо?

      Во сколько раз увеличивается цена от прайса за счет доставки?

      Как с сохранностью? А наши карты Visa internet, Visa electron - принимают?'
    replies:
    - id: 2906
      parent_id: 2896
      date: 2002-03-27 13:46
      poster: Anton Klepikov (antokha)
      email: antokha@yandex.ru
      subject: вполне реально
      deleted: false
      text: '... делать покупки в забугорных магазинах. Сам делал не раз, но и не
        особо часто. Говорят, что растаможки (пошлин) нет для объявленной стоимости
        до 100$, не вкл. доставку. Стоимость, скорость и надежность самой доставки
        зависит от ее типа (от обычной почты до DHL, UPS, etc.), у Амазона все об
        этом прописано в хелпе. Мою Сберовскую Визу классик принимают, с секъюрностью
        проблем пока не было. тьфу-тьфу-тьфу. I ain''t superstitious, body. :-))'
    - id: 2920
      parent_id: 2896
      date: 2002-03-27 15:35
      poster: Федор Романенко (fedor)
      email: fedor@blues.ru
      subject: Заказ в Амазоне
      deleted: false
      text: 'С таможней такая ситуация - некий беспредел, т.е. сколько захотят, столько
        и возьмут. Но, при отправлении ОБЫЧНОЙ почтой посылок стоимостью до 100$ они
        ничего не берут, ибо у них нет на то технической возможности. Когда я заказывал
        через DHL, то приходило быстро и надежно, но процентов 20% с меня стригли
        каждый раз. Причем, эта сумма зависит только от произвола чиновника, а не
        от состава посылки. В этом случае курьер с тебя берет деньги при доставке,
        ибо DHL с таможней сам уже расплатился. А вот если кому-то взбредет в голову
        задержать на таможне обычную посылку, то добыть ее будет уже невозможно, ибо
        она будет пылиться на каком-то складе где-то. Никакого извещения, судя по
        всему, никто посылать тебе не будет.

        Ну а в остальном - у меня опыт заказа в Амазоне с начала 98 года, проблем
        не было никогда!'
      replies:
      - id: 2931
        parent_id: 2920
        date: 2002-03-27 21:50
        poster: Дима Казанцев (Dr. Nick)
        email: dr.nick@blues.ru
        subject: А вот еще вопрос
        deleted: false
        text: В моем случае пришла секретарша и кинула мне на стол эту коробочку с
          Амазона. Ни расписки не надо было. ничего. А как они узнают, что я ее получил?
          Будут ли высылать извещение о доставке и просьбу подтвердить ее? Когда были
          (или будут) сняты деньги с моей карты и как узнать, что меня не обманули?
          Спасибо за будущие ответы ;)
        replies:
        - id: 2951
          parent_id: 2931
          date: 2002-03-28 13:55
          poster: Anton Klepikov (antokha)
          email: antokha@yandex.ru
          subject: доставка
          deleted: false
          text: если ты заказал доставку обычной почтой, то никакой трассировки доставки
            нет. У меня был такой случай. Заказал на Амазоне два диска Roots of Robert
            Johnson и Harmonica Blues, оба Язуушные, мне при заказе написали, что
            если за 21 бизнес-дей не получите, то пишите. Я прождал больше месяца,
            учитывая нашу почту, а потом начал писать, ну и в течении недели они,
            извинившись за лажу, выслали еще раз такие же компакты. Самое прикольное,
            что первая посылка пришла на след. день. Я им стал писать, чтобы они отменили
            отправку, но они уже выслали, говорят, передайте компакты в какую-нибудь
            школу или публичную библиотеку.
