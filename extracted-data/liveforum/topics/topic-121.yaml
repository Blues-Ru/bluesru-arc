  deleted: false
  text: 'Мне пришла посылка с Амазона (британского) с пятью первыми альбомами Эла
    Грина (Al Green). Все на Hi Records - как должно быть, то есть. Всем очень советую
    послушать этого гения! Великолепное сочетание соула, блюза и фанка. Прекрасная
    игра группы и неповторимый черный БЛЮЗОВЫЙ вокал. Ну и конечно его незабываемые
    композиции.

    Приехал еще и Curtis Mayfield "Sweet Exorsist" 1974. Еще один альбом, и у меня
    будет весь (нужный) Кертис. Очень советую тоже.

    Надеюсь, что это не оффтопик в чистом виде.'
