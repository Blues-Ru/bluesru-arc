  text: 'Неожиданно открыл для себя великолепного вокалиста Johnny Adams.


    Теперь собираю его записи.


    Закрома Родины дали мне только Room with a view of the blues 1987 года и ещё 3-4
    файла россыпью. Вот кто играет с ним на этом альбоме:


    "With great support from an instrumental corps that included guitarists Walter
    "Wolfman" Washington and Duke Robillard, keyboardist Dr. John..." - более чем
    приятная компания!


    Сейчас прямым маршем из Америки ко мне движется почтовой скоростью The Great Johnny
    Adams Blues Album, так что следите за рекламой!'
