  text: 'вспоминает очень правильными словами...

    дело было в 70-ых...

    Pine и Muddy тогда еще в строю и вместе...

    казалось бы, какое может быть дело молодой девушке до тогда уже старых дядек,
    коллег её тогдашнего ухажера...

    однако...

    она вспоминает о них такими словами...


    "...тогдашние рок-музыканты недурно заработали на блюзе, но артисты оригинального
    блюза ничего финансово существенного не получили от постоянных гастролей. Некоторые
    прожили около бедности всю свою жизнь. Это было несправедливо, но я никогда не
    видела у них даже намека на горечь (по этому поводу). Снова и снова, я видела
    элегантность в их присутствии, доброту к незнакомцам и принятие того, что они
    не могли изменить..."


    "...Pinetop был человек, который здоровался с Вами улыбкой и смехом. Независимо
    от того, кем вы были, он был рад видеть вас. Обнимая вас своей улыбкой он делал
    вас живым. Это была та теплота, которую принимаешь. Он не был человеком, чтобы
    жаловаться или хмуриться..."


    "...Была такая благодать в его принятии жизни во всей её неустроенности, сладкий
    смех даже в условиях дискомфорта, и благодарность за дары, которые попадались
    по пути. Этот дух есть в его музыке. Pinetop Perkins blues..."


    приятно сознавать, что кто-то чувствует музыку также как ты...

    хорошая девочка Кэтти в земле мериканской живет...)


    http://www.huffingtonpost.com/cat-bennett/remembering-pinetop-perki_b_839332.html'
