  text: "Jazz washes away the dust of every day life.\n\n—Art Blakey\n\nДжаз - неприкосновенный\
    \ запас мировой музыкальной культуры, к которому каждый самосовершенствующийся\
    \ музыкант обращается снова и снова. Это огромный мир гармонии и звуков, наполняющих\
    \ intro, расширяющих сознание, позволяющих шагнуть за грань.\nНедавно в числе\
    \ немногих джаз-бэндов Харькова появился ещё один молодой коллектив - K-Ration,\
    \ в котором смешались профи и любители, люди разных возрастов, но объединённые\
    \ любовью к джазу. Сегодя нас шестеро, шестеро музыкантов - энтузиастов, желающих\
    \ продвигать искусство джаза в нашем городе. Это:\n\nЮлия Мельник - voice,\nКонстантин\
    \ Чуянов - guitar,\nМаксим Затынин - keyboards,\nЮрий Крамарчук - trumpet,\nJazz\
    \ Cat - bass,\nАнтон Косей - drums\n\nНемного истории:\n\nК-RATION был сформирован\
    \ в сентябре 2011 года бас-гитаристом, aka Jazz Cat. Планировался новый бэнд,\
    \ который исповедовал бы традиции классического джаза, но звучал сообразно сегодняшнему\
    \ времени. Поначалу группу лихорадило с составом: не было постоянного ударника\
    \ и очень не хватало клавишных и духовых. Но, к концу года состав стабилизировался.\
    \ Сейчас в группе играют опытные музыканты: Юлия Мельник - вокал, Максим Затынин\
    \ - клавишные, Jazz Cat - бас. Также в составе K-Ration выступает своеобразный\
    \ блюзовый гитарист - Константин Чуянов, подающий надежды трубач - Юрий Крамарчук\
    \ и ударник из Херсона - Антон Косей, перебравшийся специально в Харьков, чтобы\
    \ поработать с группой. \nВ нашем репертуаре вы услышите произведения Дюка Эллингтона,\
    \ Сонни Роллинза, Уильяма Хенди, Херби Хэнкока, Расса Фримена и других знаменитых\
    \ композиторов джаза. \n\nСтраница вконтакте: \nhttp://vk.com/k_ration"
