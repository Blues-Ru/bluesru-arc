  text: 'В 1999 году (5 г. назад) в Окланде, Калифорния, на 77 году жизни от острой
    сердечной недостаточности скончался великий блюзмен, певец и пианист Чарлз Браун
    (Chsrles BROWN). За десять дней до этого он выступал с концертом для сбора средств
    на нужды Great American Music Hall в Сан-Франциско. AMG пишет: «Как много блюзовых
    артистов оставались на пике творческой формы и полвека спустя после дебюта. Первое
    имя, которое приходит на ум: Чарлз Браун.»

    (сообщение для убежденных форумщиков)'
