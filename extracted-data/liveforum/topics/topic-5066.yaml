  text: 'http://4.bp.blogspot.com/-8uwUg8ybXro/UVGEn_AqPoI/AAAAAAAAHGA/S5jF1JvdQeg/s1600/Barbara+Lynn.jpg


    в то время как вся просвещенная блюзовая общественность погружена в торжества
    по поводу очередных именин блюзовой Ани из Белграда... я провел восхитительный
    вечер с другой замечательный женщиной блюза... чудо как хороша... познакомились
    мы с ней в светлом 66-ом на шоу "Hoss" Allen''a... она выступала там в то время,
    я же наблюдал за ней в каком-то там из 2000-ых... были у неё на этом шоу несколько
    сногшибательных номеров... великолепный голос, удивительная гитара, солнечное
    настроение... в общем сердце учащенно забилось... у меня... сегодня альбом 2000-го
    года... девушке - 58... голос все так же силен и молод... гитара в её искуссных
    руках с левым уклоном по взрослому мудра и восхитительна... больше половины текстов
    и музыки на альбоме - авторства нашей героини... гитарный техаский соул... первая
    запись на славном лейбле Antone''s... Клиффорд Антуан жив еще - исполнительный
    продюссер... есть мимолетное заигрывание с рэпом на одной-двух композициях...
    лучше бы их не было... да уж ладно... тут некоторые со стариком Хью заигрывают,
    так что Барбара с Клиффордом тоже имеют право на эксперименты... альбом замечательный
    своим примером, как себя дОлжно чувствовать 58-летней девушке с замечательным
    голосом и гитарой... настроение у неё правильное и ободряющее...'
