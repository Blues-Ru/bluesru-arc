  text: "Сегодня состоялся конкурс начинающих блюзовых артистов в Доме у дороги/Ритм-н-блюз\
    \ кафе. Главный приз получила Олина ученица Юля Демьянская! Второе место занял\
    \ гитарист из Тулы Саша Щеглов (он, правда, не начинающий, а крутой гитарист и\
    \ певец из местной группы). Третье место (приз зрительских симпатий) досталось\
    \ харперу Илье Портнову. \n\nОрганизаторы конкурса (МузТорг и Дом у дороги/Ритм-н-блюз\
    \ кафе) поставили меня в неловкое положение, посадив в жюри, зная, что я буду\
    \ подыгрывать Демьянской на акустике. Пришлось мне голосовать против неё в итоге.\
    \ Но остальные четверо выбрали именно Юлю в любом случае; это были: Фёдор Романенко,\
    \ Михаил Петрович, Вайт Белов и Андрей Евдокимов.\n\nАтмосфера была отличная,\
    \ звук хороший! Всего в финале участвовало 11 исполнителей: 2 харпера, 5 певиц,\
    \ и 4 гитариста/певца. Поздравляю победивших и вообще участников! Шикарные призы\
    \ на 90 000 рублей, отличный концерт-конкурс! А ведь там были и отборочные туры,\
    \ где выступали ещё десятки начинающих музыкантов.\n\nПасха удалась! Я рад за\
    \ Юлю и Олю! Уже что-то получается!"
