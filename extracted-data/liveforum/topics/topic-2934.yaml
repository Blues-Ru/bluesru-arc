                        компании продают жанры как шмотки, кому какой?   Магазинам
                        обязательно нужна четкая классфикация, чтобы покупатели знали,
                        где найти диски. Еще важнее покупатели должны имееть "свой
                        отдел," где покупается "своя музыка" под новые штаны и ботинки.  Не
                        плевать ли нам на все это?   Кстати я вчера купил диск Cannonball
                        Adderley "Money in the Pocket."  Это записи live от 1966-г.,
                        которые почему-то только сейчас выходят. Cannoball играет
                        на "Here Me Talkin'' to Ya" самый замечательный и глубокий
                        блюз, который я давно слышал.  Но ведь таксономисты считают,
                        что это не блюз, а джаз.  Имеет ли это какое-инбудь важное
                        значение?  По-моему есть более интересные дела для музыковедов.


                        Muddy'
