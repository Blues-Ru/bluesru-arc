      \ наши исполнители поют (играют) на ровных долях - это не блюз а сплошная профанация\
      \ по ощущениям - НЕ КАЧАЕТ.\n2) Правильное вокальное ИНТОНИРОВАНИЕ. Как сказал\
      \ БиБиКинг - \"блюз, это умение рассказывать истории\". В отличее от нашей традиции\
