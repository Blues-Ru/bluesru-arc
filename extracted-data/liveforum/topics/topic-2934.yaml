      text: "Блюз?  Не блюз?  Все зависит от того, как определяется \"блюз.\"  Нет\
        \ одного общепринятого определения.  Я понимаю блюз прежде всего, как язык\
        \ музыкального общения.  (И я также согласен с Котом, что один из основных\
        \ элеменитов этого языка - ритм.)  По такому определению не имеет смысла задавать\
        \ вопрос, является ли данная музыка блюзом или не блюзом.  Вопрос только в\
        \ том, в какой степени и в каком качестве присутсвует блюзовый язык?  Ясно,\
        \ что в некоторой русской музыке (в том числе и на русском языке)присутствуют\
        \ элементы блюза. Какую из этой музыки называть или не называть блюзом?  По\
        \ желанию!  \n\nMuddy"
      replies:
