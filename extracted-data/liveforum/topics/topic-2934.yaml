        subject: Некоторая русская музыка
        deleted: false
        text: '"Ясно, что в некоторой русской музыке (в том числе и на русском языке)присутствуют
          элементы блюза". (Muddy Lives)

          Да. Вы - правы. Блюз очень схож по настроению с загадочной русской душой.
          В русской музыке точно так же, как и в блюзе есть "ритмика работы", взмахи
          косы, или бурлацкое - "Ээх, ухнем". Да и блатые "шестерки" и "восьмерки"
          - ритмики абсолютно грувовые, с явным "перекосом" долей кто их сейчас знает
          и сможет сыграть правильно?

          Но беда в том что русские - НЕ ЗНАЮТ СВОЙ ФОЛЬКЛЕР. И еще большая что русские
          - НЕНАВИДЯТ СВОЙ ФОЛКЛЕР.

          Так уж получилось. Что за последние 80 лет Русская Музыка была изгоем в
          нашей стране. Богатейшее мировое культурное наследие было ВЫЧЕРКНУТО из
          жизни общества, а то что выдавалось за русскую культуру, все эти Бабкины-Зыкины
          и т.п. было жалким суррогатом а-ля рус, припевки с повизгиваниями и притоптыванием,
          частушки,  этакая лубочная субкультура БЕЗКУЛЬТУРНОГО БОЛЬШИНСТВА.

          Беда в том, что наши бабки НЕ ПЕЛИ НАМ КОЛЫБЕЛЬНЫХ НА НОЧЬ.'
