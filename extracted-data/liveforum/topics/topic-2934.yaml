        subject: Грув - это ритмическое ощущение, не фиксируемое научно...
        deleted: false
        text: "Вах!!! Хорошо сказал!!! Но - неправильно.\nФиксировать научно - нет\
          \ проблем. Если есть ритмика - то ее можно разпределить по линейке. блюз\
          \ - легко выкладывается по линейке.\nЯ бы сказал иначе. \nНаучно вычесленный\
          \ грув - это фикция. профанация. Его можно вычислить. Можно его сыграть\
          \ согласно вычислениям.\nНо БиБи и Мади - не требовалось его вычислять.\
          \ Они - им жили. Они им  - дышали. Они не могли играть ИНАЧЕ. Это был ритм\
          \ их сердца.\nЕсли ты пропитаешься этим ритмом - как пропитались они. Если\
          \ сможешь дышать так же. Если будет сердце бится быстрее от тех же проблем.\
          \ \nА самое главное - если СМОЖЕШЬ ЗАСТАВИТЬ ВСЮ сВОЮ КОМАНДУ ДЫШАТЬ В ЭТОМ\
          \ - УЖЕ СВОЕМ РИТМЕ. и еще более главное - сумеешь увлечь ПУБЛИКУ этим ритмом\
          \ и стучать в ЕДИНОМ для зала и сцены ритме.\nвот и будет у вас грув.\n\
          Вычислять - занятие нормальное. Но нормальное - для музыковедов, звукорежиссеров\
          \ и т.п. ОБСЛУЖИВАЮЩЕМУ персоналу.\nА для музыканта блюза - надо просто\
          \ пРОЧУСТВОВАТЬ этот грув. \nи потом - просто жить в нем.\nМузыкант - математик\
          \ с линейкой - это - нонсенс. Академический подход неприемлимый для народной\
          \ музыки.\nно знание основ той музыки, что играешь никому еще не вредило."
