        subject: Очерки блюзовой таксономии
        deleted: false
        text: "Существует общепринятое деление Жанр - Стиль - Стилистика.\n\nБлюз\
          \ как жанр включает в себя множество Стилей. Блюз в чистом виде - понятие\
          \ абстрактное, в природе не существующее в чистом виде, ну скажем, как Животное\
          \ в отличие от Грибов, так и Блюз - это нечто, что позволяет отделить некоторые\
          \ произведения, скажем, от Оперы. \n\nСтиль - это таксономический элемент\
          \ более конкретный, скажем как семейство Кошачьих или Непарнокопытных. Можно\
          \ нарисовать общий контур кошки или собаки, и они будут узнаваемы. Можно\
          \ сыграть несколько нот, которые не принадлежат ни к одной из ранее сыгранных\
          \ блюзовых композиций, тем не менее, слушатель определит, что это, например,\
          \ чикагский стиль, а вот это - вест-коаст (Евдокимов, прости..). \n\nСледуя\
          \ далее, каждый Стиль включает в себя элементы Стилистики, определяемые\
          \ нами на слух еще более определённо и уже привязанно к конкретным личностям.\
          \ Стилистика, как это всегда бывает в искусстве, создаётся одним человеком,\
          \ за которым следуют подражатели - эти очертания уже более характерны, по\
          \ ним можно узнать породу - например, Доберман, Буль-терьер, или T-Bone\
          \ Walker.\nНадо отметить, что грань между стилем и стилистикой очень тонкая,\
          \ так как некоторые стили создаются большими личностями, после чего стиль\
          \ ассоциируется с ними напрямую, а последователи и подражатели заметны меньше.\n\
          \nЕжели масштаб личности какого-либо музыканта недостаточен для того, чтобы\
          \ создать стилистику своего имени, то он довольствуется тем, что некоторые\
          \ его удачные фразы входят в тезаурус блюзового языка, и ими пользуются\
          \ другие ведущие собаководы. Фразы, лики и прочие мелкие элементы, в буквальном\
          \ смысле - песни, растасканные на цитаты - это самые мелкие единицы блюзовой\
          \ таксономии...\n\n(* на этом рукопись Старого Майора, как всегда, обрывается\
          \ *)"
