  text: 'Всем привет!

    Мы тут с Ветераном решили поиграть (и позаписывать) песню Джона Мэйалла "Jenny".
    Текста в сети нет, так что пришлось снимать самому. Если кому интересно, то вот
    слова. Для созидателей нового блюзового сайта тоже пригодится.


    JENNY

    (John Mayall)


    My blues for Jenny mean she''s not around

    I wish my Jenny could be homeward bound

    I''ll live through all my lonely confusions

    If I knew I see her again


    I think of Jenny as a memory

    I wish my Jenny could be here with me

    I''ll live through all my lonely confusions

    If I knew I see her again


    I don''t see Jenny and the years pass by

    Maybe that Jenny got another guy

    I''ll live through all my lonely confusions

    If I knew I see her again


    I dream of Jenny and the night is cold

    My bed is empty, need another home

    I''ll live through all my lonely confusions

    If I knew I see her again'
