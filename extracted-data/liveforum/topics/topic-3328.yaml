        text: '... Сид, заняв место композитора в Pink Floyd (они тогда как-то по
          другому назывались, и кажись как раз мистер Барретт это название и предложил,
          хотя может я и ошибаюсь) начал безумные эксперименты с музыкой и звуком,
          которые увенчались успехом, но для самого Роджера aka Сида Барретта, подсевшего
          на ЛСД (не скажу доброго слова в адрес того кто его придумал это ЛСД, а
          какое скажу, таких слов в приличных обществах в слух не произносят) всё
          закончилось довольно плачевно: он совершенно утратил ощущение реальности,
          был изгнан из группы (собственно и изгонять-то его не надо было, он там
          уже, фактически, только значился) и подличившись в психушке (которая так
          ничего толком и не сделала) продолжил свою жизнь затворником. Так он и покатился
          дальше. Мир восторгался Pink Floyd, а Барретт одиноко выращивал сад, писал
          картины и слеп от диабета... Такова печальная история Сида Барретта. :('
