    text: "Сид Барретт, основатель Pink Floyd, скончался в возрасте 60-ти лет. Об\
      \ этом во вторник сообщила пресс-атташе группы.\nПресс-атташе, которая отказалась\
      \ сообщать свое имя до того, как последует официальное заявление со стороны\
      \ группы, сказала, что Барретт скончался еще несколько дней назад. Причина смерти\
      \ пока неизвестна. \nНапомним, что Барретт стал одним из основателей Pink Floyd\
      \ в 1965 году. В 1967 году вышел первый альбом группы \"The Piper at the Gates\
      \ of Dawn\", большая часть которого была написана Барреттом.\nВ 1968 году он\
      \ был вынужден покинуть Pink Floyd из-за проблем с наркотиками. После ухода\
      \ из группы он достаточно уединенно жил в Кембридже. \nПо словам пресс-атташе,\
      \ на похоронах будут присутствовать только родные и близкие.\nhttp://pink-floyd.ru/\n\
      \nСид Барретт, один из основателей культовой британской группы Pink Floyd и\
      \ ее солист в период 1965-1968 годов, умер в своем доме в графстве Кембриджшир\
      \ в возрасте 60 лет. Причиной смерти, как сообщили газете Guardian родные музыканта,\
      \ стали осложнения, связанные с диабетом."
