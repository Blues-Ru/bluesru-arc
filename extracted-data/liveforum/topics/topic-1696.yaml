  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDCASS80312182218370462&sql=Azmev97wskrrt\n\
    \nДовольно серьезная по объему компиляция, выпущенная фирмой Hip-O Records. На\
    \ диске аж 18 треков, представляющие музыку Фредди с 1960 года почти до самой\
    \ его смерти в 1976 году. Диск отлично звучит и классно оформлен; есть буклет\
    \ с подробным описанием треков и историей Кинга. \n\nОценка 4 балла. Довольно\
    \ тяжело слушать альбом с настолько разным качеством звучания (1960 и 1975 - это\
    \ большая разница в звуке и музыке)."
