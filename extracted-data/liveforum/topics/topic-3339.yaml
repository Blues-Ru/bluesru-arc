            не похожий на Gibson, но похожий на Fender Straocaster. А это вообще другой
            инструмент, для другой музыки!


            Так что ищите инструмент по максимальному визуальному сходству. Если оное
            сходство будет максимальное, то и вероятность похожести звучания инструмента
