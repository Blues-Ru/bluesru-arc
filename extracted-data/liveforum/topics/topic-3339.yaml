    subject: Спрашиваете - отвечаем.
    deleted: false
    text: 'За 7000 рублей можно купить китайский инструмент, максимально похожий на
      тот, который изображен на этой картинке:


      <img src=http://www.musik-service.de/images/ProduX/395753016j00.jpg>


      На инструмент надо поставить струны из комплекта Gibson B.B.King калибром 0,1
      - 0,56


      Или из любого другого комплекта типа D''Addario 0,1-0,52, называется Light Top
      - Heavy Bottom.


      Ввиду малого бюджета придется первое время поиграть unplugged, очень помогает
      почувствовать инструмент, разыграть его, а также не нервировать родныХ, близких
      и соседей. Не все ещё любят блюз в нашей варварской стране, увы.


      далее рекомендуется послушать самого B.B.Kingа, очень помогает =)'
