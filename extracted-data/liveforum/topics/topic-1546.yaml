  text: "Совершенно непредумышленно именно к 2003 году, объявленному Конгрессом США\
    \ как \"Год блюза\", созрело и занялось делом содружество некоммерческого объединения\
    \ \"Другая музыка\" и крупнейшего отечественного пивного концерна \"Очаково\"\
    . Для мировой практики пивные спонсоры - типичная составляющая блюзовых фестивалей.\
    \ И Москва идет той же стезей, заметно ускоряя шаг. И так же непредумышленно первая\
    \ акция городского масштаба, проведенная новыми союзниками, вошла в рамки празднования\
    \ дня города 6 сентября. \nИменно в этот день на Центральном стадионе \"Динамо\"\
    \ прошел многочасовой блюзовый марафон. Его открывали молодые и подающие надежды\
    \ отечественные блюзовые музыканты из 6 российских городов и столиц ближнего зарубежья.\
    \ Свежей трактовкой архаичной блюзовой классики блеснули Свет, Эл и Биг Вэл, этим\
    \ летом удостоенные Первой премии на блюзовом конкурсе-фестивале в Польше. В составе\
    \ специальной программы Сборная России по блюзу выступили корифеи, а аккомпанировал\
    \ им и дирижировал ими Леван Ломидзе и его группа Блюз Казенс, отыгравшие только\
    \ что триумфальный тур в США и ангажированные следующим летом уже на трехмесячные\
    \ гастроли в Америке, включая выступления на крупнейших фестивалях. \n\nПорадовали\
    \ мастерством, энергичностью и хорошим чувством юмора европейские гости: B.B.&\
    \ The Blues Shaks из Германии и шведы Knock Out Greg & the Blue Weather. Мощным\
    \ финалом прозвучало выступление американца Джимми Ди Лейна, разогнав вечерний\
    \ сентябрьский морозец.\n\nОднако программа \"Очаково-блюз\" нацелена не на разовый,\
    \ хоть и грандиозный концерт. На протяжении всего года, до следующего стадионного\
    \ концерта, она еще не раз порадует любителей блюза. На начало ноября намечена\
    \ большая серия музыкальных событий. 6 ноября в Центрально доме художника Федор\
    \ Чистяков представит публике свой долгожданный новый альбом \"Ондатр\" - весьма\
    \ острую музыкальную смесь, в которой блюз играет не последнюю роль. \nНа следующий\
    \ день там же (7 ноября в ЦДХ) состоится уже традиционный, 6-й по счету, Московский\
    \ фестиваль губной гармоники, в котором примут участие все отечественные мастера\
    \ этого своеобразного инструмента, играющие в самых разных жанрах: от джаза и\
    \ блюза до этники и рока. Вот уж где не будет скучно.\nБлюзовые джемы будут проходить\
    \ в Cool Train (Б-2), одном из лучших джазовых залах Москвы. Здесь будет играть\
    \ ритм-секция нового проекта Николая Арутюнова при участии гитаристов Ивана Жука,\
    \ Гургена Джангерянa и харпера Владимира Кожекина. Для ценителей традиционного\
    \ блюза в клубе \"Крымские каникулы\" пройдет серия акустических блюзовых джемов.\
    \ 12 ноября откроет ее московский дуэт Кораблин-Братецкий, недавно подготовивший\
    \ к выходу альбом собственных интерпретаций кантри-блюзовой классики. Альбом обещает\
    \ стать весьма интересным событием, поскольку исполнительское мастерство и пиетет\
    \ перед заочными учителями гармонично сочетаются в нем с оригинальными идеями\
    \ и действительно трепетным стремлением сыграть \"по-своему\". Здесь же в середине\
    \ ноября пройдут музыкальные премьеры. 16 ноября свою новую группу представит\
    \ ветеран отечественной блюзовой и рок-н-ролльной сцены Валерий Гелюта. В понедельник\
    \ 17 ноября будет играть весьма любопытный проект певца и гитариста Юрия Каверкина,\
    \ собравшего Wrong Way Band для исполнения блюза, близкого по духу как ранним\
    \ работам Сона Хауса, так и поздним записям Джона Ли Хукера. Это выступление должно\
    \ открыть серию еженедельных концертов \"Stormy Monday Blues\".\n\nОрганизация\
    \ выступлений корифеев и помощь начинающим - лишь часть обширной программы \"\
    Очаково-Блюз\". В условиях, когда система клубных гастролей еще не отработана,\
    \ она будет помогать в организации выступлений москвичей - в других городах, и\
    \ привозить в Москву тех музыкантов, знакомство с которыми может стать для московских\
    \ меломанов весьма приятным сюрпризом. Высокий исполнительский уровень, и у каждой\
    \ - свой ярко индивидуальный блюзовый почерк - отличаются петербургский септет\
    \ Big Blues Revival и квартет из Екатеринбурга Blues Doctors. Оба коллектива будут\
    \ выступать в клубе \"Крымские каникулы\" 8 ноября. \n\n\n(  0  ) Ваше мнение\
    \ >>> \n \n29.10.2003, Андрей ЕВДОКИМОВ ( ЗВУКИ Р"
