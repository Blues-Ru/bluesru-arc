  subject: ISMN или ISRC?
  deleted: false
  text: "Может кто-нибудь знает и разбирается в тонкостях, тогда расскажите.\nУ нас\
    \ почти готов 40-минутный альбом \"Наш мир\" Джейса. Теперь нужно присвоить номер\
    \ либо всему музыкальному альбому - номер ISMN (таким образом идентифицировать\
    \ музыкальный альбом; в нотной записи его всё-равно нет).\nВозиться с номерами\
    \ ISRC не считаю нужным, они идентифицируют лишь  запись, вне зависимости от автора\
    \ (для выплаты гонорара звукозаписывающим студиям). \nВопрос: Правильна ли моя\
    \ позиция в этом вопросе?"
  replies:
  - id: 38200
    parent_id: 38178
    date: 2012-02-04 01:39
    poster: Тимур Кадыев
    subject: Позиция
    deleted: false
    text: "Бред! Без обид. \nISMN - код печатного издания нотной записи. Если ее нет,\
      \ то нет и кода. Если и есть код, то он не распространяется на CD. \nДля CD\
      \ применяется как раз ISRC. Красная книга (стандарт аудио CD) определяет кодирование\
      \ кодов ISRC на компакт-дисках."
