        text: 'B&O - Baltimor & Ohio - первая американская публичная железнодорожная
          компания, основанная в 1827, запустившая впоследствии фирменные поезда по
          многим направлениям за пределами своего начального региона.

          Специально для этой линии были разработаны мощные дизельные локомотивы и
          особо комфортабельные вагоны.


          B&O также отличалась особым дизайнерским оформлением, о котором можно почитать
          <a href=http://borhs.org/Logos/bo_font_logo.html>тут >></a>


          Streamline - скоростной паровой локомотив обтекаемой формы, примерно такой:

          <img src=http://www.vectis.co.uk/images/potter/030802/469.jpg>


          Очевидно, что дизель и паровоз свистели по-разному, что и отметило чуткое
          ухо автора песни ))'
