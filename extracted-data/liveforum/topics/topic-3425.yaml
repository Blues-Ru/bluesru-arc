                в каком году кто выпустил какой знаковый альбом.

                то я не буду в этой же академической манере объяснять, что блюзовый
                жанр является символьной системой класса протоязыков, с относительно
                несложной порождающей грамматикой, развитие которого практически невозможно
                без разрушения рамок самого языка. Это некоторая когнитивная абстракция,
                которая сообществом слушателей и исполнителей в данный момент времени
                и в данном социальном контексте воспринимается на семантическом уровне
                как "блюз", откуда и происходят трудности с её формальным определением,
                а соответственно и с "общественным договором" о принаддежности тех
                или иных музыкантов к жанру. Мой временной контекст восприятия блюза
                сознательно ограничен примерно 1970 годом, если кто-то расширяет этот
                контекст до наших дней и считает, что блюз а) имеет внутреннюю интенцию
                к развитию б) есть N пассионарных субъектов, которые продолжают его
                развивать, то пусть докажет. Моя точка зрения, что в части интонационной
                и музыкальной формы блюз уже исчерпал возможности своего развития,
                и все нововведения в него относятся к области коммерчески успешных
                компиляций ранее созданного как в случае СРВ, которого я считаю очень
                талантливым по эмоциональной подаче и тембровой фактуре, но глубоко
                вторичным музыкантом в части музыкальной формы и интонации.

                А тот же Клэптон - эмоционально бедный, технически ограниченный и
                всё также вторичный музыкант, к тому же с отвратительным тембровым
                слухом - чего стоит "задавленный" звук его именного стратокастера
                даже в сравнении с богатым тембром Lucille любимого мною B.B.


                Это не значит, что я призываю кого-то запрещать, это вопрос всего
                лишь дефиниций и таксономии.


                Надеюсь, что я объяснил доходчиво.


                PS: при чем тут СССР? Я шуток не понимаю, как я уже Казанцеву отписал.

                В теории коммуникаций есть мнение, что сущность сообщения не в намерениях
                говорящего, а в реакции реципиента, так что в этой части мои "додумки"
                достигли своей цели - я обнаружил в лице SKash очередного агрессивного
                оппонента, который во имя буквального следования фактами решил побороться
                с моей сугубо субъективной точкой зрения, в чём желаю ему больших
