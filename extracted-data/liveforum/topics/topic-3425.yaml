        text: ">Я просто обратил внимание, что альбом Buddy Guy c Otis Rush называется\
          \ \"Buddy Guy & Otis Rush\". \n\nЭтот самопальный сборник? http://www.mmguide.musicmatch.com/album/album.cgi?ALBUMID=1342495\n\
          \n...ибо никакого СОВМЕСТНОГО АЛЬБОМА я у них не припоминаю, а значит и\
          \ \"старики места не делили...\"\n\n>Eric Clapton in где-то там (with Otis\
          \ Rush)\n\nДля справки: Есть ОФИЦИАЛЬНЫЕ СД и ДВД : \"Otis Rush & Friends\
          \ 1986\" и \"EC in Montreux 1986\", а не \"EC in Montreux & gde-to tam Otis\
          \ Rush\". \nЕсть БУТЛЕГ (пиратский релиз) с этих концертов, на котором написано\
          \ \"EC in Montreux feat. Otis Rush\" и ЕС не имеет к этой фразе никакого\
          \ отношения. \n\n>Обидно за Отис Раша\n\nЕсть такой фильм М.Скорцезе NOTHING\
          \ BUT THE BLUES. \nТак вот там, Отис и Дж. Роджерс благодарят Клэптона за\
          \ то, что он записывает и играет ИХ песни, привлекая к ним популярность\
          \ и зарабатывая ИМ деньги. Так что прежде чем что-то писать, лучше хотя\
          \ бы поинтересоваться...\n\n>Не счесть песен других хороших авторов, которые\
          \ он благодаря отлаженной машине self-PRа и self-promotion в глазах мировой\
          \ аудитории стал ассоциировать с собой\n\nА может у него просто есть талант\
          \ к тому, что он может донести узконаправленую вещь до широких масс зрителя,\
          \ а? Такой мысли не было?\n\nПуризм (излишняя строгость в правилах, в нравах,\
          \ в нетерпении чужих слов и пр.) ведет к деградации ;)))\n\nЕсли держать\
          \ блюз в \"рамках\", он сгниет...\n\nИМХО и ничего личного, ест-но! \nСлужу\
          \ Отечеству, тов. Майор! ;)))\nС Уважением."
