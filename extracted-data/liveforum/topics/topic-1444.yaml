    subject: Джимми вчера так вжарил
    deleted: false
    text: "в ритм-энд-блюз-кафе, что победил всех. ему и самому так понравилось, что\
      \ он дополнительно отыграл еще четыре номера (получилось в плюс минут на сорок\
      \ к тому, что он должен был). Играет очень эмоционально, драйв просто сносит\
      \ крышу. Иногда выписывает очень виртуозные кренделя, иногда снимает редкие\
      \ концертные записи Хендрикса один-в-один, иногда по-хендриксовски небрежен.\
      \ но в импровизацию уходит с головой, играет протяженные соло почти в состоянии\
      \ транса. При этом никаких запилов - все слушается на одном дыхании, интересно\
      \ и зажигательно. \nPS В начале концерта Мишурисы зажгли не-по-детски :) Случайно\
      \ получилось так, что, после их возвращения из отпуска, я послушал три их концерта\
      \ кряду: кажды был лучше предыдущего. Хороший вкус с тонким пониманием стиля,\
      \ своеобразие и хорошее чувство юмора, блистательное шоу не только Мишуриса,\
      \ но и всех участников! В общем, получается классная музыка и безолаберная развлекуха\
      \ в одном флаконе.\nPPS - со всех концов к Джими Ди Лейну тянулись люди с рюмочками\
      \ водки: во главе процессии шли Воронов и Булкин. Не только Лейн, но и все участники\
      \ группы категорически отказались от спиртного до конца выступления... о как!"
