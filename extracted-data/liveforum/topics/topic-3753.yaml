    text: 'спасибо за ответы :) кстати, на тему "На русском играй!" я кое-что написал.

      Ну, Dr.Nick - заядлый русофоб в плане блюза :) с ним не поспоришь :) в целом
      ему респект и уважуха, но есть и... Ладно не о том речь.

      2Эльдар: ну да, - грув, техника, вокал и т.д., это конечно ДА. Тут и говорить
      нечего, но лично для меня, всегда было важно не столько это, сколько эмоциональная,
      чувственная составляющая блюза. Какая к слову сказать техника у архаических
      музыкантов? Dr.Nick не даст соврать. Техника часто так себе. Но попробуй сыграть
      так, чтобы волосы на спине встали дыбом. Никто из наших "фирменных" каверистов
      так не сможет, это я точно знаю, включая доктора Ника, - без обид -это частное
      мнение.

      Да, классно когда люди играют хорошо, но помимо пентатоники, должно быть кое-что
      еще. Здорово, когда приходишь в один из блюзовых кабаков, а там сносно играют
      чикаго и если повезет мисисипи. Другой вопрос в том, что в большинстве случаев
      играют чикаго... :) Но вот моя частная проблема состоит в том (я пишу это потому,
      что хочу выяснить есть ли здесь единомышленники, и  только для этого), что мне
      всегда было нужно реальное мясо с кровью, т.е. реальный блюз настоящего человека,
      спетый кишками. Как-то так... Да, мне противны лощеные команды, играющие "на
      ура" любой стандарт, со стандартным набором тупых приколов, повторяющихся из
      раза в раз, причем каждый раз... Не буду показывать пальцем :)

      Я всегда искал и ищу именно это, - жесткие, честные блюзы, сыгрные "от чистого
      сердца", не для самолюбования идиота, а для правды, а затем что смолчать не
      вышло. Мы-то как-то знаем, а далеко не все люди знают язык так, чтобы перевести
      что-то. Пусть попробует человек со стороны перевести "Худу Мэн" в исполнении
      Вэллса... А мозг-то пищи просит. Хочется понять чего это чувака колбасит. Народ-то
      не всегда лох. Музыка прекрасна, но если парень не музыкант и не звукорежиссер
      - как это он, скажите будет оценивать пустую "игру в блюз"? Ну да, гитараст
      вроде бегло играет, одет как фермер или ковбой :))) шляпа там, усы... Ну прикольно...
      И всё. А пищи для души и ума - хер. А музыка при том в высшей степени духовная,
      если можно так выразиться.

      Поэтому и тему двинул такую. Ведь мы все, даже доктор Ник :) думаем по-русски.
      И если тёлка свалит, или беда пришла -  мы же не мусолим одного БиБи Кинга (например).
      Ну если честно - ведь мы же садимся дома на стул и играем что-то горькое но
      полезное, а не отдрачиваем в две тысячи первый раз пару заученных каверов "на
      тему". Что, неправда? И мысли в голове вертятся совсе даже не на английском.

      В связи с этим, думаю что байбл не только в том, чтобы классно сыграть и чисто
      спеть. Надо бы пережить... Потому что например мне плевать на то, как хорошо
      играет и поет славный некто и какой он ковбой, - надо чтобы у меня шерсть дыбом
      встала. Иначе какой резон играть блюз? Что, кто-то из вас, уавжаемые, сможет
      сделать как Бадди Гай? Или как ББ Кинг? Хендрикс? или как Джоплин местами? Хаулин
      Вульф? Роберт Джонсон? (список можно продолжить). Ну это же просто смешно. А
      какой мне толк слушать паршивое или прекрасное исполнение, если я с детства
      знаю как на самом деле ХОРОШО? Да, кавера играть надо  и это прекрасно. Но почему
      бы не сделать хотя-бы честно, "до первой крови", не говоря уже о том, чтобы
      своё.

      Да, это где-то крик души. Как у Маяковского: "Не высидел дома. Анненский, Тютчев,
      Фет...(Bernard Allison, BB King, Junior Wells :)) Опять тоскою к людям ведомый,
      - иду в кинематографы, трактиты, кафе..." и т.д. потом: "нет людей, понимаете
      крик тысчедневных мук..?"

      Простите если где чего соврал. Знаете же этот стих. Приходишь иногда, хочется
      услышать свежего, накопилось... А тут тебе толкают шнягу, да еще с таким видом
      буд-то так и надо! И главное ведь почти всегда погано играют, хоть и пальцы
      от понтов не сгибаются. И сколько раз зарекался, всеравно прихожу, и почти всегда
      облом. Так может лучше где-то вскрыться на русском, чем шустро бакланить на
      форэйне хоть бы и хорошо? Как считаете, господа? Давайте поговорим об этом не
      переходя на личности и без любых понтов.'
