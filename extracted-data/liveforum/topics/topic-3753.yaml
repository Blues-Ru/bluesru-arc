      text: 'Я думаю (IMHO), или точнее меня более интересует не столько язык (язык
        текста), а сколько музыкальная составляющая (владение инструментом и голосом,
        инструментал, сам звук и звукоизвлечение, манера пения, тембр и т.д.).

        Кажись я здесь не смешиваю 2 разных вопроса:

        1. что важнее: музыка или текст

        2. текст: на английском или на русском

        В первом случае, для меня, да и вообще в рок-н-ролле (читай, и в блюзе, и
        в роке: в музыке XX века), на первом месте всегда была музыка (ритм, "кач"/"свинг").

        По поводу языка, то я смогу воспринять только английский и русский текст.
        Немецкий, японский, польский, французкий и т.д. я не восприниму никак. Английский
        - он универсален, его воспримет каждый: и бурят, и калмык. Японецу - англ+япон.,
        немцу - англ.+нем, фр-фр+англ... По поводу вопроса о ритмике и фонетике русского
        языка (в песнях) по сравнению с английским, то тут есть явные трудности. Я
        пока НИ РАЗУ не встречал удачного <s>приобретения</s> варианта русскоязычного
        блюза. (Конечно же ни Машина Времени, ни Чиж нисколько в расчёт не беруться.
        Это не то о чём я говорю: это т.н. русский рок, не блюз, и даже не русскоязычный
        блюз). НО МНЕ НЕ КАЖЕТСЯ, что что удачные вариаyты в русск. яз. не возможны.
        Естесственно, что говоря удачный, я подразумеваю что он удачен ТОЛЬКО для
        русскоязычного слушателя, он никак не пойдёт для венгра или америкоса... Почему
        я так полагаю: в 1989г. на Мелодии вышла пластинка рокабилли коллектива Мистер
        Твистер. Я хорошо помню её, она была просто супер, в стилистике, всё было
        в кассу, и при этом на русском. Это был наилучший (для меня) пример исполнения
        "фирменной" музыки на русском.

        И ещё одна штучка, шоб быть, так сказать, палиткаректным, лучше говорить русскоязычный
        блюз, чем русский блюз. А то как-то навевает Пушкиным, да и  ваще сама фраза
        "русский блюз" для меня звучит как-то даже ужасней чем "русский рок" (ДДТ,
        Алиса, Кино, Аквариум :-)

        Извините за сумбур и неочень внятное изложение.'
