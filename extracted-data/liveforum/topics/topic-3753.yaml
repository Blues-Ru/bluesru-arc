          сознание нашего человека "форматировано" в первую очередь под нашу литературную
          и прочую классику. Это значит, что независимо от личного желания, абстрактная
          идея будет облекаться в словестную, а затем и в поэтическую форму, оперируя
          правилами, понятиями и самое главное образами, являющимися естественными
