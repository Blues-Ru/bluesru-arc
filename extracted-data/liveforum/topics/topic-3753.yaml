      text: 'В моем представлении краеугольная составляющая многих блюзов - это изложение
        жизненной истории очень простыми словами, которые должны вызвать сильную эмоцию
        или рассказать о ней у автора. Как мне кажется, английский язык допускает
        в большей степени прямоту высказывания, чем русский... Какая-нибудь строчка
        из шлягера I looove yooou воспринимается более естественно, чем Я-ааа люблюююююю
        тебяя-ааа. По-русски прямота выражения будет звучать, скорее всего, как стилистическая
        ошибка. Или какая-нибудь тупая лубочная стилизация. Либо как что-нибудь пафосное.
        А если выражаться языком качественной высокой поэзии, то не влезет в размер
        и длину строки, а если чудом влезет, это уже будет не блюз, а другой жанр.


        Т.е., если даже уж очень хочется, то что-то все время по разным причинам не
