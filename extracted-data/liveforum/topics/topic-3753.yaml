      subject: 'Вот такая вот история:'
      deleted: false
      text: 'Однажды (в 1828 году во время путешествия в Арзрум. — О. С.) в палатке
        своего брата Льва и уланского офицера Юзефовича Пушкин с одушевлением переводил
        им с английского Шекспира. В чтении Пушкина английское произношение было до
        того уродливо, что Юзефович заподозрил его знание языка. На следующий день
        он зазвал к себе в палатку Захара Чернышева, знавшего английский язык как
        свой родной, и попросил Пушкина опять почитать им Шекспира. При первых же
        словах, прочитанных Пушкиным по–английски, Чернышев расхохотался и спросил:
        "Ты скажи прежде — на каком языке ты читаешь?". Пушкин тоже расхохотался и
        объяснил, что выучился английскому языку самоучкой, а потому читает английскую
        грамоту как латинскую. Но самый перевод его Чернышев нашел совершенно правильным…

        © Вересаев В. В. Спутники Пушкина. М., 1937. Т. 2. С.'
