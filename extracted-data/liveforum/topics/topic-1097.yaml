  deleted: false
  text: 'Урра! Всем доброго времени^)

    Пришёл ко мне вчера с iddk.ru замечательный диск.  Из серии А. Козлова «Классика.
    Джаз». Называется «Истоки Джаза: ранний блюз, госпел, рэгтайм»...


    Диск очень хорош... В музыкально-мп3 -части -просто неплохой сборник корневой
    американской музыки - разделы: спиричуэлс, госпел, баптисткие гимны и белый спричуэлс,
    американские народные песни, тюремные , рабочие песни, ранний блюз, рэгтайм, традиция
    белого и чёрного сельского рэгтайма.


    Блюзов не слишком много-по одной-две-три песни... имена -от Бесси Смит, Блайнд
    Лемон Джефферсона, Кокомо Арнольда, Томми Маккленнана до Вилли Диксона. В спирричуэлсах
    -Блайнд Вилли Джонсон. В чёрном рэгтайме -Блайнд Бой  Фуллер и Блайнд Блэйк...
    В рабочих песнях -Ледбэлли и Сонни Терри.....


    Но дело, кажется и не в этом. У всякого, кто любит блюз, тем более старый - в
    фонотеке большинство из этого есть, и в более полном формате. Мне самым интересным
    показалось именно прото- и околоблюзовая традиция, представленная   записями почти
    этнографическими (например, полностью -около часа -присутствует запись службы
    с песнопениями  в одной из сельских церквей), а также редкие записи раннего госпела..


    Кроме - и это огромный плюс - размещены на диске тексты Л. Переверзева и В.Дж.
    Конен.....


    И это просто замечательно!!!:)))))

    (ну, для меня -точно....)



    Вообще, при всём моём  энтузиазме и радости  надо сказать, что есть на диске и
    опечатки, и повторы (или отсутствие некоторых фотографий).... И всё равно-вещь
    очень хорошая и полезная...


    Есть упоминание о том, что музыкальная часть диска и редкие записи взяты с винила
    из коллекций московских коллекционеров до 1971 г.



    И вот вопрос сразу. Почему-то джефферсоновская песня про чистую могилу оказалась  на
    этом диске в разделе “Баптистские гимны и белый спричуэлс”.  Почему так? Она стала
    народной - это наверное...её не пела разве что каждая собака:), но в баптистские
    гимны.......


    Андрей, Михаил, прокомментируйте, пожалуйста, историю сего песнопения...



    Всем привет.'
