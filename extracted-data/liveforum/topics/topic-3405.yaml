    text: "вот приобрел диски \"Two Johnsons are better than one\" (Evidence) и \"\
      Tore up from the floor up\" Зоры Янг.\nМне понравилось. Хотя вокал Джонсона\
      \ я почему-то представлял себе несколько иначе. На деле это оказалась некая\
      \ смесь Дабл-ю Си Кларка и Фентона Робинсона. :) Хотя это альбом поздний и,\
      \ может быть, раньше голос Джонсона звучал по-другому.\nТакже не совсем понятно:\
      \ неужели на фестивале не будет сольного исполнителя с акустической гитарой?\
      \ :(( Вроде как все из заявленных играют с бэндами...\nОт Зоры Янг просто в\
      \ восторге. Низкий, грубый вокал. Достаточно резкий, но мощный. Внушаитъ! :)\
      \ Настоящий блюз. \nА вот альбом Джонсонов я бы скорее отнес к некому соулфанку.\
      \ :)"
