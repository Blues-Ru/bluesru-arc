  text: 'Можно специальную доску для этого организовать! Старушки-на-лавочке-онлайн.блюз.ру.

    Начинаю: Какие, все-таки, все бездуховные! Музыку не слушают, по-русски разговаривать
    не умеют! Что уж говорить о Соборности и Сопричастности! На концертах - жуют (как
    можно кюшать, когда на сцене такое!) (Кстати, кто-нибудь видел, какие классные
    гамбургеры и жареную рыбу подают в Buddy Guy''s Lengends?). MP3 сливают прямо
    с пиратских дисков!!!!!! Куда уж там до нюансов в прозрачности ненавязчивой середины!
    Стереокартина, нах, окончательно размыта... Мда...

    В форуме появилось целых пять сообщений про оффтопик! Лучше помолчать о главном,
    чем впустую молоть языком! Или переходить с грубого русского на благородный французский
    (как в 19 веке). Ибо с местным тугим на ухо быдлом тонкому ценителю говорить не
    о чем! Эстест с ним даже рядом с...ть не сядет! Я надеюсь, меня поймет хоть пара
    избранных........ На большее не рассчитываю, ибо нет пророка в своем отечестве...'
