  text: 'Сразу скажу что бы не было непонятностей: Стивен Сигал - известный киноактер,
    летом прошлого года актер выпустил альбом блюзовых композиций собственного сочинения.
    Альбом "Mojo Priest" уже второй в дискографии Сигала.

    Кстати, он недавно он уже приезжал в Россию с гитарой.

    http://www.rambler.ru/news/world/highlife/11642162.html

    Стивен Сигал приедет в Калмыкию

    20.11.2007 15:34 | Правда.РУ

    В Элисту сегодня прибудет известный киноактер, мастер боевых искусств Стивен Сигал.

    Ожидается, что Стивен Сигал даст небольшое выступление, специально для этого он
    привезет с собой в Элисту гитару.'
