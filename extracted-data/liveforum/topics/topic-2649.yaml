      надо, и музыканты должны быть в этом в первую очередь заинтересованы.


      А по поводу прогресса - фестиваль _состоялся_ (учитывая, что его два года не
      было) и даже удалось-таки (заметь, впервые) привезти настоящих слонов (это типа
      не прогресс ни фига?).


      С каждым годом хуже и хуже, да, и сахар раньше слаще был, и трава зеленее. Однако
      ты попробуй в таких условиях хоть что-то сделать.


      От подобных мнений вообще не хочется ничем заниматься.


      Каждый хочет, чтоб ему на тарелке принесли хорошо поиграть. Сиди, жди, когда
      принесут.


      P.S. В любом случае - спасибо тебе за предоставленный Стиву Бейкеру комбик Blues
      Junior.'
