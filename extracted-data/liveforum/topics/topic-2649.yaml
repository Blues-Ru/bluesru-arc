      Назови, пожалуйста, пять достойных блюзовых групп Петербурга.


      2. Бардак с расписанием - это да, по этому поводу надо много работать. Но, поверь,
      ты не хочешь знать, что это такое, когда составляешь программу, потом выясняется,
