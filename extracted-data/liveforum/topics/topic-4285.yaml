  text: "Твиттер - самая быстро-растущая вещь в интернете. В рунете кол-во сообщений\
    \ прибавляется на 80% в месяц. На западе ей пользуется довольно много людей и\
    \ часто предпочитают микроблоггинг написанию в LiveJournal и т.д. \n\nЕсли вы\
    \ зарегистрированы в Твиттере, знайте, что я завел пользователя @blues_ru, куда\
    \ буду сливать какую-то информацию с сайта. Меня там зовут @fedor57. Из людей,\
    \ которые могут быть вам знакомы, я нашел пока: @mike_the_mellow, @maratdakota,\
    \ @Arsen_07, @kidandersen.\n\nЕсть ли тут пользователи Твиттера? Подключайте @blues_ru,\
    \ через него завяжемся."
