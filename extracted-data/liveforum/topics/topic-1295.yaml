  text: 'Помнится, выходила такая серия виниловых пластинок (аннотации и составитель:
    Дмитрий Ухов).

    Да уж... Пиратство, оно конечно же, не есть хорошо. Но тогда, мне, только-только
    окончившего школу, у нас на окраинах тогдашнего Союза (читай: на задворках вселенной),
    где можно было услышать Howlin'' Wolf? Я, кажется, и имя его впервые узнал тогда
    с диска. А в магазинах граммпластинок у нас всегда было весьма скудно и этих пластов
    там и в помине не бывало. Вот и пришлось мне, вчерашнему пионеру, спионерить 3
    диска этой серии из библиотеки (ОТКУДА они там появились? до сих пор не пойму...).
    Те диски (вот они, родные): №1 Howlin'' Wolf, №2 Muddy Waters и №4 Big Car Blues
    (сборник: J.L.Hooker, Jimmy Reed...).

    Так вот, хотелось бы узнать:

    - а на чём/ком закончилась та серия?

    - и самое главное: что же за диск тот №3, которого у меня нет?'
