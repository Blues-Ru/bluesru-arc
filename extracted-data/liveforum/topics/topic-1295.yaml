    text: '"Мелодия" сверхсерьёзная фирмА и такие штучки-шутки не в её характере.

      Дим! Точно знаешь или так предпологаешь.

      Дело в том что я, кажись, слыхал что третий диск это B.B. King. Хотя не уверен:
      может я желаемое принимал за действительное.

      Давно это было...

      А вот ещё я помню тогда в конеце 80-ых "Мелодия" начала выпуск "Архива поп-музыки"
      и ему подобных сборников. Вот на чём тогда закончился "Архив поп-музыки"? Я
      помню №12 Rolling Stones "All Together".'
