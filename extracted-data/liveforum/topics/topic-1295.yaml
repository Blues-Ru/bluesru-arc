      deleted: false
      text: 'Я же маньяк винила ;)

        Три номера по блюзу (к сожалению).

        12 номеров поп-архива и 3 номера рок-архива (дублируют 3 номера поп-архива
        - редкость). Эти пластинки лучше звучат на Апрелевском виниле или на МОЗГе
        (московский опытный завод грамзаписи).'
