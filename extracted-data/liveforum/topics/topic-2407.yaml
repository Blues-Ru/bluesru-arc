      subject: The Hammer Song
      deleted: false
      text: 'Насколько я знаю The Hammer Song (хотя на диске написано просто Hammer
        Song) и If I Had a Hammer это одна и таже песня. Авторы: Lee Hays and Pete
        Seeger.

        If I had a hammer, I''d hammer in the morning;

        I''d hammer in the evening all over this land.

        Если очень интересует я скачаю эту песню, например, в KaZaA или скину с винила
        в мп3, закачаю себе на сайт и дам ссылку для скачивания.

        Кстати, этот винил "Поль Робсон. Негритянские спиричуэлс". Так получилось
        что его оказалось у меня даж две штуки.'
