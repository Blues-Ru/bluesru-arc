  text: 'Пол (Поль) Робсон (1898-1976) был футболистом, юристом, певцом, актером,
    политическим деятелем: дружил с Советским Союзом, боролся против апартеида...

    Перебирая старые пластинки я нашел диск "Поль Робсон. Негритянские спиричуэлс"
    и там первую песню Hammer Song он поёт под аккомпонимент Сонни Терри (гармоника)
    и Брауни Мак-Ги (гитара) !!!

    <a href="http://patefon.tol.ru/music/patephon/sent_louis_blues.mp3">Здесь</a>
    лежит в его исполнении Saint Louis Blues Уильяма Хэнди (хотя там написано Сан-Луи
    блюз :-)

    <DIV align=center><IMG align=baseline alt="" border=0 hspace=0 src="http://www.scc.rutgers.edu/njh/PaulRobeson/Images/youngman.jpg"></DIV>'
