    - id: 20385
      parent_id: 20382
      date: 2005-02-05 20:52
      poster: Федор Романенко (fedor)
      email: fedor@blues.ru
      subject: Новости
      deleted: false
      text: Я говорил час назад с Арсеном. Они сыграли два раза - в четверг и пятницу.
        Около 120 участников были разделены на 10 клубов по 12 групп. В каждом клубе
        трое судей (разные в разные дни) проставляли баллы по 5 категориям оценки,
        по сумме баллов из каждого клуба один участник попадал в финал. Арсен говорит,
        что в финал попали не они, хотя народ стоял на ушах, а в первый день судьи
        втроем трясли им руки после выступления. Общее впечатление от всего очень
        позитивное, надеюсь, что они сами все расскажут поподробнее ;) Во вторник
        концерт в Доме у Дороги.
