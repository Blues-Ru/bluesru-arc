  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDCASS80311181911581814&sql=Adglvadzkv8w1


    Прошло 10 лет с дебютного альбома Уэллса, но вот он снова на Delmark Records в
    Чикаго и делает все отлично. 1975 год - расцвет чего угодно, но только не блюза,
    и тем не менее Джуниор играет и поет по блюзу (а мог бы и в диско кинуться, как
    многие это и делали).


    Прошло 10 лет, запись стала получше, изменился вокал и игра на гармошке, но ощущение
    волшебства осталось. Оно осталось с Уэллсом до конца его дней, слава Богу! На
    этом альбоме у него большая банда из известных музыкантов Чикаго: Сэмми Лохорн
    и Фил Гай на гитарах (отлично нарезают), Джонни Уокер на клавишах, ЭйСи Рид и
    Чарли Майлз дуют в дудки, Херман Эпплуайт басит и Рузвелт Шо барабанит. Отличные
    соло, шикарное пение Джуниора, интересный и хорошо сделанный материал. Тут и So
    Long, и Key To The Highway, и Love Her With A Feeling, и Goin'' Down Slow. Все
    аранжировки свои и очень "сочные" и солидные. Пластинка блюзовая и очень ровная,
    я не хочу выделять лучшие треки - все отлично! 5 баллов и море удовольствия от
    прослушивания!


    PS: 5 баллов за обложку и оформление КД!'
