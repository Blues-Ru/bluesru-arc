  subject: Мой пресс-релиз по поводу bluesmen.ru. Официальный. Шутки в сторону.
  deleted: false
  text: "Сегодня, 8 мая 2003 года, в 18 часов 15 минут, у меня состоялся телефонный\
    \ разговор с Сергеем Тынку по его просьбе.\nБыли высказаны следующие позиции сторон.\n\
    Я заявил, что являюсь добросовестным приобретателем домена bluesmen.ru и считаю,\
    \ что владею им на законных основаниях.\nСергей Тынку заявил, что домен был упущен\
    \ в связи с тем, что у его прежнего владельца, Евгения Ильницкого, были проблемы\
    \ с доступом в сеть Интернет, в результате чего он не получал своевременные уведомления.\
    \ Он также потребовал, чтобы я в течение кратчайшего срока вернул якобы неправомерно\
    \ захваченный мною домен ему, при этом он возместит мне материальные затраты в\
    \ размере стоимости регистрации домена.\nДалее стороны обменялись мнениями по\
    \ поводу оценкие контента ранее присутствовавшего на домене сайта, при этом я\
    \ заявил, что готов пойти на компромисс в случае, если г-н Тынку и его команда\
    \ разместят на домене некоторый контент, отличный от предыдущего, а г-н Тынку\
    \ заявил, что я не вправе быть ему цензором, и он вправе размещать всё, что считает\
    \ остроумным, полезным и так далее по своему личному усмотрению, и я нанёс ему\
    \ личное оскорбление тем, что не согласовал с ним либо с г-ном Ильницким свои\
    \ действия по приобретению домена.\nДалее, поскольку мы не смогли договориться\
    \ по причине принципиальных позиций сторон, г-н Тынку перешел к прямым угрозам\
    \ физической расправы надо мной - пообещал, что меня будут регулярно избивать\
    \ неизвестные мне лица (предполагаю, что по личной просьбе г-на Тынку) до тех\
    \ пор, пока я не передам г-ну Тынку домен bluesmen.ru обратно.\nОфициально извещаю,\
    \ что:\n1) я уже предпринял ряд необходимых мер по физической и юридической защите\
    \ меня, моей семьи и принадлежащей мне собственности;\n2) в случае повторения\
    \ или реализации угроз со стороны г-на Тынку я официально обращусь в правоохранительные\
    \ органы, тем более, что письменные выражения угроз физической расправы в мой\
    \ адрес в избытке содержатся на форуме www.guitars.ru;\n3) я по-прежнему готов\
    \ продолжить с г-ном Тынку переговоры на условиях поиска компромиссного решения\
    \ совместного использования домена;\n4) мне очень жаль, что Сергей Тынку решил\
    \ совершенно открыто заняться тем, что однозначно классифицируется как уголовное\
    \ преступление, классифицируемое по ст.1199 УК РФ (Угроза убийством или причинением\
    \ тяжкого вреда здоровью, http://znai-zakon.narod.ru/z/53/119.htm) К тому же,\
    \ я не беззащитный юноша, связан со многими организациями людьми из разных сфер\
    \ бизнеса, и найду способы и средства для противостояния угрозе. \n5) я публикую\
    \ это сообщение для того, чтобы в случае реализации угроз г-на Тынку, музыкальная\
    \ и сетевая общественность была заранее информирована о причинах произошедшего."
