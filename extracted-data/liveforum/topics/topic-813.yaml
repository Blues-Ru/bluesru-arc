  text: "Наконец нашла последний альбом Джона :)\nОтличная пластинка, но, по-моему,\
    \ несколько для него необычная - не помню, чтобы где-то он делал такой упор на\
    \ кантри, а в эту пластинку включено несколько кантри-вещей. \nЕщё, видимо, уже\
    \ по традиции, на пластинке есть две песни Тома Уэйтса - Gin Soaked Boy и Low\
    \ Side Of The Road. Кстати, Том написал маленькое вступительное слово к этой пластинке\
    \ Джона. Same Thing Вилли Диксона.\nВсё высшей пробы, но более всего понравились:\
    \ написанная Джоном Хэммондом Slick Crown Vic (1) - (видимо, название пластинки\
    \ пошло от неё?), \nNo Chance (2) - David Hidalgo (гитара) \nи Comes Love (10)\
    \ - Lew Brown, Sammy H.Stept, Charles Tobias. \nКому интересно, можно их пока\
    \ послушать в низком кач-ве по адресу \nhttp://greta.bluesman.ru/mine/John_Hammond/RFL/"
