    text: 'В Государственной филармонии Алтайского края 11 мая состоится концерт известного
      американского блюзмена Роберта Лайтхауса. Об этом сообщает пресс-служба филармонии.


      Концерт будет посвящен 100-летию Роберта Джонсона – мировой легенде блюза.


      http://www.politsib.ru/news/?id=50117


      P.S. В Москве 100-летие Р.Джонсона не кого не волнует. У него свой блюз, а у
      нас - свой!'
