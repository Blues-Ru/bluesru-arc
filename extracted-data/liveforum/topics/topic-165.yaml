  text: 'Мне вчера соседка по доброте душевной принесла заслушать некий коллектив
    Gregorian "Masters of Chant" :)

    "Досталось" там много кому, но "Tears in Heaven" Клэптона совсем уж не понятно,
    как туда попала :)

    Это просто ужас какой-то! 8) Примерно как bluesmen.ru :) Это как если бы Enigma
    спели - примерно то же самое.

    Особенным издевательством это выглядит на фоне прослушанного мною Нью-Йоркского
    концерта Клэптона ''94, где он превосходен.'
