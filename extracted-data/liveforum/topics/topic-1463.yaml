  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=CASS80309100659&sql=A5vg9kemt7q7v


    После двух альбомов для детей Таж записал этот альбом для лейбла Private Music.
    Что ожидать от 91-го года? Да чего угодно! Звуки 80-х еще живут на записях, но
    сознание уже меняется. Сразу скажу, что этот альбом сильнее чем 1986-ой, но слабее
    остальных на Private Music. Здесь есть яркие композиции, звук стал лучше и интереснее,
    аранжировки уже на высоте! Тут больше соула и ритм-н-блюза, чем карибских дел,
    и это радует. Хочу выделить лучшие вещи на альбоме: реггийная песня Scattered
    очень хороша; блюзовый трек Ev''ry Wind (In The River) на высоте; неплохо звучит
    пианинная версия Blues With A Feeling; почти рокабильная вещь Squat That Rabbit
    записана с ДИДЖЕЕМ и звучит очень интересно; великолепная Cakewalk Into Town опять
    на альбоме - это здорово; очень бодрый буги-блюз Big Legged Momma Are Back In
    Style Again.


    Оценка 4 балла. Таж почти вернулся в прежнее русло, стало больше блюза и соула,
    но звук еще странный, некоторые вещи звучат как-то неправильно, но что Вы хотите
    от 91-го года?'
