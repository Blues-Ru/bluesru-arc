  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDCASS80401072023310861&sql=Aen7uaknk0m3l


    Не может быть! Медведь в лесу сдох! Джон Хаммонд записывает концептуальный диск!
    Он не играет традиционные блюзы! Он поет 12 песен Тома Уэйтса! Что же делать?
    Брать диск сразу или бояться и хулить? Надо отслушать.


    Дело в том, что Том Уэйтс тоже есть на этом альбоме. Он продюсер, он хлопает в
    ладоши, он присутствует на записи. А теперь подумайте, похож ли Том на Джона?
    Нет, вообще не похож. Том - забияка, безумец, всю жизнь ломающий каноны и стандарты.
    Джон - умница, консерватор, традиционалист. Что-то типа Фрэнк Синатра исполняет
    "хиты" Фрэнка Заппы. Вы можете сказать, что контраст - это классно, но я Вам повторю,
    что Том тоже есть на записи, и этот факт ломает все! Звук тяжелый и грязный, Хаммонд
    явно переигрывает местами, он же не псих, но пытается изображать такового местами.
    Джон далек от театра, а Том им живет. Блюзовой классикой эти песни не станут никогда,
    но многие из них потеряли шарм оригинального исполнения Уэйтса. Сравните хоть
    великую Clap Hands в исполнении Джона и оригинал. От оригинала бегут мурашки,
    от версии Хаммонда ничего не бежит, просто обычная песня. Так он может поступать
    с песнями Диксона или Джонсона, но только не с таким материалом, как Том Уэйтс.


    Оценка 3 балла! Играют и поют классно, но кто же ожидает лажи? Концепция отличная,
    но почему так скучно и что там делает сам Том? Он просто не сочетается с Джоном!
    Они нашли друг друга с Уиллиамом Бэрроузом, но это совсем другой менталитет и
    воспитание. Хамонд хоть и из Нью-Йорка, но по характеру он "деревенщина" и увалень;
    Том должен был это понимать.'
