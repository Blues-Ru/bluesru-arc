  text: 'Подскажите плиз как выглядит вечеринка в стиле блюз? идем на свадьбу тема:
    стиль блюз, не знаем что одеть. Плиз подскажите как наряды должны выглядить мужские
    и женские.'
  replies:
  - id: 35344
    parent_id: 35343
    date: 2008-05-01 01:24
    poster: Старый Майор
    email: gypsy@mail.ru
    subject: Я бы уточнил у организаторов свадьбы..
    deleted: false
    text: '..а то может оказаться, что наше толкование стиля "блюз" в одежде слишком
      не похоже на то, что имели в виду те, кто это затеял.


      Блюз никогда не был связанным с модой молодёжным направлением, блюзмены были
      вообще-то далеко не зажиточными, если не сказать бедными, людьми средних лет,
      так что костюмы в стиле 40-50-х годов будут в тему. Посмотрите также любой из
      фильмов "Братья Блюз" (Blues Brothers).


      Всякие шляпы-ковбойские сапоги и другие аксессуары а-ля Техас - это скорее кантри,
      чем блюз.


      Но ещё раз советую уточнить у организаторов.'
