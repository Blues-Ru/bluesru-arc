    deleted: false
    text: 'Если Мы посмотрим фото  выдающихся блюзменов, то увидим, что люди одевались
      со вкусом, дорого, очень стильно. Ну например Рэй Чарльз,или В.В. Кинг,или Стиви
      Рэй какие у него шикарные были шляпы, Мадди Вотерс тоже модный парень- жилеточки,
      шляпы с маленькими полями, всё по моде, ну а Марк Нопфлер- очень стильный, одни
      гитары чего стоят. Ну а у нас,В Петрович - не отстает, соответствует моде.

      Так что свадьба в стиле блюз- это когда все модные, красивые,дорогие.'
