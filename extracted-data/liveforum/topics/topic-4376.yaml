  text: Билли Ти с группой, разумеется, не смогли улететь утром в воскресенье домой.
    Они зависнут в Москве до позднего вечера, поэтому мы договорились с Юрой о том,
    что завтра на джеме они пару часов будут играть в роли хаусбенда. Будет здорово,
    если кто-то из играющих блюзовых музыкантов специально придет пораньше (к 6-ти),
    чтобы с ними сыграть ;)
