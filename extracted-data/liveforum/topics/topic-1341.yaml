  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=CASS70308182129&sql=Ajy6zefbkhgf8


    Два знаменитых черных записали диск в сопровождении не менее знаменитых белых.

    Тут много известных людей: Эрик Клэптон, ЭйСи Рид, Доктор Джон, Кард Рэдл, Джим
    Гордон и даже J. Geils Band.


    Диск записан неровно потому, что писался в разные дни и в разных местах.


    Диск начинается просто убойно - A Man Of Many Words - БГ поет этот классный соул-номер
    и шумно и суетно пилит на гитаре.


    Потом шустрый блюз My Baby She Left Me - Джуниор поет вещь Сонни Боя Уилльямсона.


    Дальше идет "два в одном" - Come On In This House/Have Mercy Baby - две полупесни
    Уэллса в классном исполнении (чем-то напомнило мне подачу Хаулин Вулфа).


    Ну а теперь T-Bone Shuffle! Ой мама рОдная, опять эта любимая всеми вещь! Автор
    ясен, не так ли? Бадди играет, поет и думает, что он ТиБоун Уолкер! Володю Русинова
    сразу вспоминаю в этом месте ;)


    A Poor Man''s Plea - вот это уже очень здорово! Отличный блюз Джуниора в стиле
    Хукера.


    Messin'' With The Kid - а это просто хит для Уэллса (и Blues Brothers позднее).
    Тут все в порядке!


    This Old Fool - такой залихватский ритм-н-блюз БГ - про себя что ли поет?


    I Don''t Know - прям Мадди Уотерз, а что еще ждать от Джуниора, когда он поет
    классические блюзы? Юмор присутствует ;)


    Bad Bad Whiskey - Бадди поет хороший блюз про свои сложные отношения с алкоголем
    - все страдают от этого дерьма, не так ли?


    Honeydripper - а это что-то типа бугивуги в стиле Джей Джей Кейла. Играют-играют,
    а ты гадаешь - запоют или нет? Так и не решились.


    Ну что сказать, это не самый лучший альбом Бадди и уж точно не лучший для Джуниора.
    Просто приличная блюзовая пластинка. Я поставлю ей 4 балла с натяжкой из-за уважения
    к обоим лидерам и составу. Не ждите от меня двоек и единиц - у меня нет таких
    пластинок в коллекции, а если и попались бы, я бы не стал про них писать.


    Этот альбом все же нужен любителям блюза, но не более того. Лучшие песни - A Man
    Of Many Words и A Poor Man''s Plea.'
