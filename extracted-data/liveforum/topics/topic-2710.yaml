    text: 'Да нет,) я не это имел в виду. Кто придумал этот блюз, я (к своему стыду)
      не знаю; его исполняли Эрик Клэптон (Just One Night, 24 Nights) и B.B.King с
      Клэптоном, - наверно, кто-то (даже много) еще, просто я незнаю. Короче говоря,
      вот его текст, который собственно перевести нужно.

      Oh lordie lord

      Oh lordie lord

      It hurts me so bad for us to part

      But someday baby

      I ain''t gonna worry my life anymore


      So many nights since you''ve been gone

      I''ve had to worry and grieve my life alone

      But someday baby

      I ain''t gonna worry my life anymore


      So many days since you went away

      I''ve had to worry night and day

      But someday baby

      I ain''t gonna worry my life anymore


      Yoo''re on my mind every place I go

      How much I love you nobody knows

      But someday baby

      I ain''t gonna worry my life anymore


      So that''s my story

      This is all I got to say to you

      Goodbye baby I don''t care what you do

      But someday baby

      I ain''t gonna worry my life anymore


      Oh lordie lord

      Oh lordie lord

      It hurts me so bad for us to part

      But someday baby

      I ain''t gonna worry my life anymore


      Впрочем, я немного знаю английский и понять смысл могу - однако некоторые места
      остаются для меня загадкой. (Oh lordie lord?)

      А по поводу названия - я слышал другой неплохой перевод - "Блюз не от хорошей
      жизни"

      P.S. Знает ли кто-нибудь настоящего автора?

      P.P.S.S. Спасибо, Денис, LeVON, что откликнулись!'
