  text: "АМСТЕРДАМ, 10 октября. В амстердамском аэропорту Скипхол в возрасте 70 лет\
    \ скончался американский композитор и певец в жанре соул Соломон Берк.\nВо вторник,\
    \ сообщает BBC, он должен был дать концерт в известном в голландском клубе.\n\
    О причинах смерти автора знаменитой песни «Everybody Needs Somebody to Love» пока\
    \ ничего не сообщается, пишет РБК.\nСоломон Берк родился 21 марта 1940 года в\
    \ Филадельфии, Пенсильвания, США. В конце 1960-х Соломон подписал контракт с лейблом\
    \ «Атлантик Рекордз» и начал свое карьерное продвижение в сторону светской музыки.\
    \ Его первый хит «Just Out Of Reach Of My Open Arms» был кавером кантри-песни.\
    \ \nСамой известной песней Соломона считается Cry to Me, которая была использована\
    \ в танцевальной и соблазняющей сцене фильма «Грязные танцы» в 1987 году.\nВ 1964-м\
    \ Берк написал и записал песню «Everybody Needs Somebody to Love», которая прекрасно\
    \ соответствовала стандартам жанра соул. \nВ 2001-м Соломон Берк был включен в\
    \ Зала славы рок-н-ролла. За альбом «Don't Give Up On Me» он получил премию «Грэмми»\
    \ в номинации Лучший Современный Блюзовый Альбом.\nУ Соломона Берка огромная семья:\
    \ 21 ребенок и 90 внуков.\n\nhttp://www.rosbalt.ru/2010/10/10/779322.html"
