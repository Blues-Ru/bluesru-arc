  deleted: false
  text: 'Тут у нас с товарищами зашёл разговор о Riviera Paradise (альбом In Step
    - 1989) и один из нас заметил что на иностранных форумах этот инструментал давняя
    тема для полемики: (кажется) у Kenny Burrell есть композиция у которой ритмическая
    и гармоническая основы одинаковы. Ну, в общем, похоже что был то непреднамеренный
    плагиат.

    Весьма меня заинтриговало это. Очень хотелось бы в этом разобраться.

    Может кто знает о сём? Может ссылку на обсуждение этого кто подкинет, или название
    той композиции (с точным указанием автора)?

    Короче говоря, задело за живое. Помогите разобраться.'
