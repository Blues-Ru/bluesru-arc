    text: "Ну не знаю не слышал, но разве плагиат бывает непреднамеренным. Можно написать\
      \ очень похожую мелодию, или даже мелодию с той же ритмической и гармонической\
      \ структурой, просто так, совершенно случайно придмалось, а плагиат- это злонамеренное\
      \ копирование. \nКак-то раз я помогал отладить гитару одному чуваку, так вот\
      \ он на отлаженой гитаре исполнил что-то из Bling Guardian. Мне фрагмент оттуда\
      \ показался страшно знакомым, и я тут же нашел композицию, которую как две капли\
      \ воды повторяет это кусочек из блайндов. Это было вступление из After The Gold\
      \ Rush Нила Янга. Ну вот и думай, спёрли BG у Нила Янга или просто им так самим\
      \ придумалось."
