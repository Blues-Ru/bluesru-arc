  text: "Ежемесячно в музыкальном клубе ВЕРМЕЛЬ гитаристы бьются между собой за спонсорские\
    \ призы в рамках 3-часового шоу. Каждый желающий может принять участие в реальной\
    \ гитарной битве. В жюри войдут знаковые отечественные гитаристы разных стилей\
    \ и направлений, а также именитые гитарные педагоги. \n\nВедущий проекта: один\
    \ из главных героев московской серф-сцены, редактор гитарного раздела журнала\
    \ MUSICIAN Михаил Маршак. \n\nВэлкам на сайт проекта WWW.GUITARWAR.RU - там его\
    \ подробное описание."
