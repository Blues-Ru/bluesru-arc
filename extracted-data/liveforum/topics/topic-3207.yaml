  text: "Увы это не анонс, а некоторые впечатления о гастролях этого коллектива из\
    \ Нальчика. Четыре концерта в Москве (на 2-х из них мне посчастливилось побывать).\
    \ Первый концерт в \"Доме у дороги\" состоял в основном из новых вещей с альбома\
    \ \"Dangerous\"-  это уверенная игра,\nжесткий ритм,удивительный замес блюза,\
    \ фанка и джаза. Это безусловно показатель того, что ребята уже мастера (не побоюсь\
    \ такого слова)\nмеждународного класса. Арсен уже не тот слегка застенчивый гитарист,\
    \ \nкоторого я увидел лет 5 назад,  а сформировавшийся мастер гитары.\nПоявились\
    \ краски и полутона, в которые мастер окрашивает свою игру,\nа это высший пилотаж.\
    \ Второй концерт в \"Доме\" был отличный от предыдущего там же. Арсен был слегка\
    \ нездоров (проблемы с голосом)и \nсделал концерт почти инструментальным. Отсутствие\
    \ вокальных партий, Арсен компенсировал просто фантастической игрой на гитаре.\
    \  \nКакая была его игра....нет слов, после концерта я и многие слушатели были\
    \ полностью опустошены от эмоций и полученного кайфа. \nСпасибо Вам...Арсен, Бек\
    \ и Аслан и приезжайте к нам поскорее.\nУдачи!"
