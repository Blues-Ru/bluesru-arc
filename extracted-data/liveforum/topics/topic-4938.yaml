  text: "Вообще, блюз в рекламе - обычно дело.\n\nТеперь вот: Париж, от-кутюр и Сан-Лоран\
    \ - http://www.elle.com/news/culture/top-runway-music-tracks-paris-fashion-week-spring-2013\n\
    \nна весеннем дефиле 2013 года прозвучат \"I've Got You Under My Skin\" - прекрасная\
    \ старинная песня Кола Портера, но recycled by Neneh Cherry. Ничего версия у Нены\
    \ - http://www.youtube.com/watch?v=29J2B2FIgt0 - для клубного расколбаса. а за\
    \ музыкой - к Дайане Кролл -http://www.youtube.com/results?search_query=dianna+krall+i%27ve+got+you+under+my+skin&oq=krall+I%27ve+Got+You+Under+My+Skin&gs_l=youtube.3.0.0i5j0i5i10.26024.28830.0.32438.7.6.1.0.0.0.77.355.6.6.0...0.0...1ac.1.Qfzn2XFFR-g\
    \ - все разные, все прекрасны\n\nеще будет Nina Simone - Sinnerman - http://youtu.be/upVUIuAQqRw\
    \ - тут мне непонятно... ну непонятно мне, как под это можно моду смотреть и хлопать.\
    \ Как модофаги будут ритм держать-то (про текст песни и говорить нечего).\n\n\
    ну и собственно блюз. Daft Punk сделали подборку из Junior Kimbrough, говорят,\
