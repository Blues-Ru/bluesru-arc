  text: "Компания \"Спидола\", Федерация танцев в стиле свинг (ФТСС),\n  телеканал\
    \ \"О2ТВ\", агентство ИТАР-ТАСС, при поддержке интернет-сайта www.rockabillyswing.ru,\
    \ \n представляют\nмузыкально-танцевальный фестиваль \"СВИНГОВЫЙ БУМ\" \nинформационные\
    \ спонсоры: журнал \"Шоу-мастер\", журнал «Технология Праздника»,\nжурнал Сообщества\
    \ студентов и молодых специалистов Перспектива, журнал литераторов России «МОЛ»\n\
    журнал «Технология праздника», Rambler.ru, jazz.ru, blues.ru\n18 мая клуб \"Б2\"\
    \ 18.00\n\nВ программе:\n\n  Презентация альбома оркестра ПИЖОНЫ.\n  мастер-класс\
    \ по буги-вуги дадут чемпионы России В. Ишимов и К. Семенихина.\nработает бутик\
    \ винтажной одежды и парикмахер, делающий стильные прически\n  концертные выступления\
    \ музыкальных коллективов:\nПИЖОНЫ (экс-МИСТЕР ТВИСТЕР, буги/свинг/латина)\nТИМУР\
    \ И ЕГО КОМАНДА (экс-ГРАССМЕЙСТЕР, свинг, блюз, кантри)\nКОРОЛИ ТВИСТА (твист)\n\
    BLUES PARTY ORCHESTRA (джаз/блюз)\nАВОКАДО (рок-н-ролл/твист)\nБИНГО (рокабилли)\n\
    \nВ концерте примут участие В.Кузьмин, С.Мазаев (МОРАЛЬНЫЙ КОДЕКС), А.Дитковский\
    \ (КВАРТАЛ), П.Тихонов (НЕПРИКАСАЕМЫЕ)\n\nВ музыкальной программе возможны изменения."
