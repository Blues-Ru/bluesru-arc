    text: 'У меня остались самые приятные впечатления от всего происходившего, вне
      зависимости от того, что я еще выпивал с друзьями и получал подарки ;)

      Для начала меня порадовал клуб и количество людей в нем. Очень хорошее для таких
      мероприятий заведение - среднедемократичная атмосфера, много места, все видно
      и слышно.

      Эстрин и Бейти - 90 минут радости, нет слов.

      Вова с LJC сначала волновались в присутствии монстров, но потом все встало на
      свои места, и всем было очень весело. Вова и группа играет все лучше и лучше
      с каждым днем, чему я очень рад.

      Арсен с Регтаймом были в ударе, кроме публики от них проперлись также Эстрин
      и Бейти, сказали много приятных Арсену слов. С середины они уехали поджемовать
      с Мишурисами в Форте, там, говорят, тоже было очень круто.

      Blackmailers проездом из Минска во Владимир заскочили сыграть один сет. Они
      отлично развеселили публику, за что им высказали и написали много приятных отзывов.
      С одной стороны - профессионализм и сыгранность группы повысились, с другой
      - Барышев-молодец играл очень интересно на гитаре, с третьей - немного балаганное
      шоу Тимофея (aka Мистер Зло) смотрелось очень естественно и стильно.

      Уже ночью приехали из Форте подуставшие Мишурисы, народу было уже мало, они
      расслабились и исполнили блюзово-фанковую, а не эстрадную программу, в формате
      джема. Профессионализм группы за последний год замечательно вырос. Помимо уровня
      всей группы особенно хочется отметить таланты духовой секции и, в частности,
      Артема, Олега на клавишах и Вадима на гитаре. Он наконец-то стал добавлять в
      свой стиль больше блюзовой жесткости супротив свинговой гладкости, звучало отлично
      и на очень высоком блюзовом уровне. Можно обвинять группу Мишуриса в бездуховности,
      но таких профессионалов по части именно блюза среди соотечественников, пожалуй,
      нет. Больше полугода я не был на их концертах, поэтому не знаю, из чего состоит
      сегодня их обычная программа. Очень хотелось бы слышать там побольше блюза-фанка-соул
      за счет сокращения эстрады.

      Завершился вечер получасовым джемом Арсена с Мишурисами. Арсен выпил немного
      водки в первый раз за два года, расслабился и импровизировал на новые для него
      темы и мотивы. С ним играл в вопрос-ответ Вадим, и все это поддерживалось дудками.
      Вот это - была фантастика, я такого джема еще в жизни не слышал, даже если брать
      в мировом масштабе. У меня съехала крыша. Ситуация помогла им раскрыться - Арсен
      много имровизировал на свингово-фанковом материале, Вадим - на более блюзовом.
      Арсен и Вадим - супер-чуваки и монстры, я от них обоих такого раньше не слышал.
      Это - фантастика. Очень бы хотелось бы, чтобы музыкальные обстоятельства почаще
      ставили их в такие ситуации. К сожалению, таланта бывает недостаточно, нужно,
      чтобы музыкант захотел его реализовать, и если у него это получится, то тогда
      - уважение и почет. Но будем надеяться, что у них все будет отлично!

      Мне очень приятно, что удалось организовать столь приятную вечеринку, лучшего
      дня рождения себя не пожелаешь ;))'
