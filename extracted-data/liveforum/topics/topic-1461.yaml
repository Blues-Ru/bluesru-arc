  text: "Огромное спасибо за вчерашний концерт в Б2! \nЭто было здорово! Настроение\
    \ не испортило даже то, что накануне в Б2 по телефону сказали, что билеты будут\
    \ стоить меньше, чем оказалось на месте, а тетка, их реализовывавшая была редкостно\
    \ нелюбезна, и друзья мои, раздумывавшие тратиться ли им на билеты, узнав, что\
    \ все еще дороже, резко передумали идти на концерт :( \nЯ вот смотрю, тут некоторые\
    \ ругают - те не так играют, эти посредственные. Люди, вы чего?! Ну, да, признаюсь,\
    \ я во время выступления одной не очень впечатлившей меня команды ретировалась\
    \ на другой этаж - в Cool Train, где и осталась на весь вечер, но организаторы\
    \ поступили очень правильно, с моей точки зрения, собрав такие разные коллективы\
    \ - ведь у всех различные вкусы. Кому-то нравится жесткий блюз-рок, а кому-то\
    \ архаика, я вот, например, наконец, услышала \"Темную Ночь\", и мне безумно понравилось!!!\
    \ Нет ли, кстати, диска с этой вещью? Петровича очень давно не слышала с его групой,\
    \ хочу отметить, что его голос очень органично слушается с такой духовой секцией,\
    \ и, вообще, выступление было отличное. Я, к сожелению, не всех застала, но из\
    \ тех, кого услышала, все выступили замечательно. Б. Булкин и Док, как всегда,\
    \ на высоте, Тамара тоже, Ф. Чистяков, А. Козловский, Станция Мир - молодцы! Пользуясь\
    \ случаем, хочу поздравить Вову Кожекина с днем рождения! Хочу выразить признательность\
    \ всем организаторам этого фестиваля и музыкантам, принявшим участие. Увы, всегда\
    \ найдется кто-то чем-то недовольный и будет занудствовать, что все его не устраивает,\
    \ ну так не обращайте внимания! Вы очень хорошее дело делаете, организовать такой\
    \ фестиваль - дело непростое, и вам действительно памятник ставить надо :) Желаю\
    \ успехов в проведении подобных мероприятий! :)"
