    text: "Было хорошо и более весело так сказать :)\nВ КУЛ Тэйн вообще было супер,\
      \ много музыки хорошей и разной. Верхний этаж с монстрами блюза был более академичным\
      \ и менее живым... ИМХО конечно...\nЖалко было тех исполнителей, кто выступал\
      \ после 12 часов, зрителей к тому моменту почти не осталось... И Мишурису, и\
      \ Садикову и Юле Смолянин (а её выступление стоит отдельного разговора... ибо\
      \ было, ИМХО, одним из лучших, жалко что не все его видели и слышали)прямо скажем\
      \ не повезло... Наверное просто сказался день недели...\nВ КУЛ ТРейне же все\
      \ шло мило и гладко... Порадовал первой песней Федор Чистяков, так как было\
      \ похоже на Зайдеко... Юрий Кавекин проявил удивительную волю к победе и несмотря\
      \ на технические неполадки выдал очень впечатляющий сет.\nТамара Кожекина воистину\
      \ взорвала зал, те кто был не дадут соврать, а клавишные Жука были просто-напросто\
      \ феерическими... \nБэнд Русинова порадовал прежде всего очень мощным энергетическим\
      \ зарядом, драйв со сцены пер.\nБыло весело и хорошо..."
