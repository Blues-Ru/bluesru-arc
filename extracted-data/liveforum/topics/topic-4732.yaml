  text: '[img]http://buddyandhopkins.com/BH_Charity1.jpg[/img]

    Бадди и Хопкинс помогают блюзовому фонду.

    Джейсон Носера, создатель музыкального комикса "бадди и хопкинс", накатал очередную
    "серию", чтобы помочь продвинуть blues foundation. типа парней достало то, что
    два два мелих пацана ничего не знают о блюзовых музыкантах. хопкинс спасает положение,
    направляя всех на сайт фонда.

    (blues foundation - некоммерческая контора, которая помогает продвигать музыкантов,
    поддерживает образование и сохраняет историю блюза.)

    носера говорит: "Есть надежда повысить осведомленность о blues foundation и способствовать
    расширению членства. причем речь не только блюзменах, но и о всех остальных музыкантах
    и любителях музыки. в конце концов, блюз лежит в основе всего этого."


    и потом предлагает всем разместить у себя на сайте этот комикс. типа скопировать
    ссылку и опубликовать кто где может.


    подробнее о блзовых комиксах тут: http://www.rusblues.ru/node/441'
