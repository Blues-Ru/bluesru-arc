  text: "аглгс в http://saint-petersburg.ru/m/304895/chem_zanyatysya_na_wyhodnyh_w_peterburge.html?yn\
    \ :\n\nВ петербургской Филармонии джазовой музыки 4 сентября пройдет вечер блюза.\
    \ В филармонии выступит группа \"Big blues revival\". \n\nBig blues revival -\
    \ один из немногих коллективов в Петербурге, чье стилистическое направление определяется\
    \ целиком блюзовым форматом. В их репертуаре - традиционные блюзы и ритм’н’блюзы\
    \ всемирно известных авторов и исполнителей Willie Dixon, John Lee Hooker, Muddy\
    \ Waters, Sonny Boy Williamson II, B.B. King."
