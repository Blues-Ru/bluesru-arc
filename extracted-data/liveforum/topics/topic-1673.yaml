  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDCASS70312151731151687&sql=Adx6ktr3lklox\n\
    \nОдна из необходимых компиляций Мадди. Здесь собраны самые ранние записи Уотерса\
    \ на Чесс Рекордз - синглы 50-х годов. Эти записи никогда бы не были изданы альбомом,\
    \ если бы не фолк-возрождение начала 60-х и появление рок-музыки. Многие блюзы\
    \ Мадди позднее перепевал много раз, но здесь собраны их оригиналы. Все 12 блюзов\
    \ - это классика Мадди и классика блюза! \n\nЕдинственный минус - это сильная\
    \ разница в качестве записи и громкости треков. Продюсеры могли бы сделать хотя\
    \ бы хронологическую подборку, тут же все перемешано и сильно раздражает смена\
    \ громкости. Еще надо отметить тот факт, что некоторые треки записаны с винила\
    \ не самого лучшего состояния."
