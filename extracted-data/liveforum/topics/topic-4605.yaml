  text: "<i>ИА \"Апельсин\" сообщает:</i>\n\nВзрывной блюз подготовили «Blues Doctors»\
    \ \n\nВзрывной блюз планируюи исполнить музыканты коллектива «Blues Doctors» 5\
    \ мая со сцены екатеринбургского джаз-клуба.\n \nКак отметил лидер бэнда, Владимир\
    \ Демьянов, публику ждет программа, наполненная мощной энергетикой и взрывными\
    \ композициями. На 60% она будет состоять из блюз-рока, на 20% из соула и на 20%\
    \ из фанка. Перед публикой выступят гитарист и солист коллектива Владимир Демьянов,\
    \ бас-гитарист Владимир Апаницин и ударник Илья Людевиг.\n \nНапомним, «Blues\
    \ Doctors» исполняют современный гитарный электрический блюз-рок, ориентируясь\
    \ на творческое наследие лучших представителей этого стиля – «King», «Freddy King»,\
    \ «Albert Collins», «Jimi Hendrix» и других. Коллектив обладает бесспорной популярностью,\
    \ как в родном Екатеринбурге, так и на российской блюзовой сцене.\n\nhttp://apelcin.ru/news/57877-vzryvnoj-blyuz-podgotovili-blues-doctors.html"
