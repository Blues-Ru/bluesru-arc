                  deleted: false
                  text: 'Вряд ли в среду с утра я мог представить как пройдут ближайшие
                    два дня... Однако уже вечер среду принес неожиданую радость: проходя
                    по переходу метро, я наобум подощел к кассе и спросил насчет билета
                    на Эфесовский  ФЕст,, самое удивительное, что он оказался в наличии,
                    причем был последним... Обследование остальных касс показало,
                    что на Тверской это был последний билет.

                    Отправивляясь в приподнятом настроение в гости к Диме Казанцеву,
                    я и не думал какие приключения меня ждут...  ОТ ДИмы мы выдвинулись
                    в БиБи КИНГ, все перепутали, думали там будет Борис Булкин, а
                    оказалось, что Ruby Stars. НО это мелочи... Джем прошел ярко и
                    ослепительно... ВСе были безупречны и хороши. (Кстати, почему
                    -то охрана долго не пускала в клуб контрабассиста, и все пыталась
                    посмотреть, что у него такое большое в чехле :) ). Гелюта показал
                    мастер-класс игры на пяти-струнной гитаре, отвечая на предложение
                    поставить таки шестую словами : "Мне хватает". От Гелюты не отставали
                    и Дима Казанцев и ВАня Жук. В одной из вещей Дима и Ваня решили
                    поменяться гитарами и Ваня героически оборвал струны... Что уровняло
                    на сцене Гелюту и Д. Казанцева.

                    Ближе к середине приехал Юрий Каверкин. И под большим секретом
                    сообщил о возможном приезде участников фестиваля. Мы сели ждать.
                    Ожидание происходило в виде приятной беседы: А. Евдокимова, Д.
                    Казанцева, Ю. Каверкина, Мишуриса и вашео покорного слуги. И нет
                    в моих словах никакой иронии, ибо беседа была действительно приятной
                    и интересной... Стоически мы перенесли произвол администрации
                    в отношении занимаемых мест... И вот около 00:00 приехали музыканты.

                    Надо сказать, что люди они очень милые и веселые. Лично я побеседовал
                    с бассистом CJ''я Шенье... Ну очень прикольный мужик... Рассказал,
                    что на басу играет случайно... Что надо было чтобы кто-то игралю,
                    вот он и взял и дня за три примерно понял что это такое...

                    ПОтом начались песни... Луизиана надо сказать играл очень тихо...
                    так что пришлось пролезть как можно ближе... Тут появился Миша
                    Владимиров и стал подыгрывать на гармошке (кстати он и в третий
                    день играл с Луизианой , но уже на сцене "УСЗ Дружба" - как символично!!),
                    помогал в меру сил и Воронов. Потом Подыгрывал ЛИЛ ЭД. В этот
                    момент мы с Юрием вышли на воздух и встретили г-на Братецкого
                    сотоварищи... И вернулись внутрь уже с ними. Г-н Братецкий также
                    поучаствовал в джеме... подыграв в двух или трех композициях...
                    А потом я отошел за кофе, а когда вернулся, увидел , что Юрий
                    Каверин играет с Луизианой, надо сказать, что много не услышал,
                    ну сами понимаете шум, гам, тарарам. Но то, что услышал было клево.
                    Надо сказать, что сам Юрий первые несколько минут после этого
                    действа пребывал в некотором шоке, а на следующий день вообще
                    сомневался в реальности этого события. Но мы удостоверяем его
                    реальность: "Юрий вы действтельно играли с Луизиана Ред!!!". Около
                    2:30 музыканты поехали в гостиницу. А мы остались... Посидели
                    подумали, поговорили.

                    Второй день был Эфесовский Фест. Рассказать можно много, но не
                    буду уж утомлять вас столь длинным повествованием. Скажу просто:
                    Было хорошо! И это главное.'
