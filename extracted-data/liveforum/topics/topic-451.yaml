              poster: Федор Романенко (fedor)
              email: fedor@blues.ru
              subject: Авторские с CD
              deleted: false
              text: 'Отчисляются методом оплаты в централизованные фонды-ассоциации
                музыкантов типа РАО или BMG. Пример, - у нас с пиратских и непиратских
                дисков наших исполнителей уходит по одному центу в РАО за каждую не
                свою песню. По этой причине на компакт-дисках ты обязан указать автора
                песни (причем, его юридическую фамилию, а не псевдоним).

                Другой вопрос в том, какая часть из этих денег попадает потом музыкантам.
                В случае с BMG они гнустно стригут исполнителей, но деньги им перечисляют.
                РАО - чисто пиратская организация.

                В общем, все устроено так, что издающий CD музыкант не должен сам
                думать об отчислении авторских гонораров за использование чужих песен.'
