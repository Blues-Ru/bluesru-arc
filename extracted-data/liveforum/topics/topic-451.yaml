              text: Последний день фестиваля.Впечатление от Луизианы Реда - прекрасное.Не
                буду повторяться,многое уже сказали.Потрясает сочетание какой-то мощи
                и драйва,несвойственное акустической гитаре,с красивой,благородной,я
                бы даже сказал ,изящной подачей звука.Судя по-всему,Луизиана вырос
                под влиянием Мадди Уотерса и Лайтнинга Хопкинса.Он взял от одного
                мощное электрическое звучание ,а от другого - красивый и мелодичный
                архаический блюз.Но все равно получился какой-то новый музыкант.От
                Клифтона Шенье я ожидал,судя по записям,очень веселой и техничной
                аккордеонной музыки в стиле Zydeco и в этом я не ошибся,только исполнение
                было еще более зажигательным и мощным.Потрясло исполнение двух медленных
                блюзовых вещей,звучание трубы и аккордеона.Просто два маленьких шедевра.Наименее
                яркое впечатление от Лил Еда,что в общем-то,судя по записям,тоже ожидалось.Каким-то
                он казался средним и невыразительным на фоне остальных исполнителей.Народу
                в зале было много,энтузиазм был приличный.Акустика для такого помещения
                была  выстроена очень прилично,правда,после длительного прослушивания
                уши сльно уставали.В таком помещении,видимо,хороший звук все равно
                не удастся получить.Раздражало бесконечное хождение по залу людей
                с пивом, курение во время танцев.Все-таки здесь на первом месте должен
                быть блюз,а пиво - только на втором.Конечно,эта пивная компания -
                богатый и главный спонсор,но пиво можно выпить всегда и везде,а такие
                музыканты приезжают реже раза в году,.во-всяком случае,этот фестиваль
                был мощее,чем в 2000,не говоря уже о 2001годе.Тягостное и жалкое впечатление
                призвел пьяный Воронов,запутавшийся в 3-х словах.Все-таки   для любителей
                блюза надо иметь помещение типа  зала в Монтре.Видно,что тяга к блюзу
                в России есть,только здесь очень медленно запрягают да еще дураки
                и дороги.Хорошее место,возможно.театр оперетты,бывший филиал Большого
                Театра.Выступает же там Макаревич  с креольским танго.В Москве,при
                хорошей постановке дела может быть десять и более тысяч любителей
                блюза.Чем она хуже Нотоддена.
