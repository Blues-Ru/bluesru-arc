                  Во-первых, не BMG а BMI. Напару с ASCAP это два самых крупных буржуйских
                  агенства по авторским правам.


                  Во-вторых, отчисления определяются исходя из нескольких параметров,
                  таких как: тираж, рекомендуемая цена, количество треков на альбоме
                  и количество авторов у конкретного трека. После этого вся сумма
                  и необходимые сопроводительные документы (кому, сколько и за что)
                  отчисляется обычно через собственного агента (у нас РАО).


                  Суммы все эти довольно незначительные, и к пиратству все это имеет
                  весьма отдаленное отношение, так как пираты (особенно учитывая так
                  называемую лицензию РАО) нарушают права не авторов, а издателей.
                  И там речь идет о совершенно других суммах.'
