  text: "Ваауууу!!! Клёоооваа!!! Крууутаа!!! Йесссс! Кууул!!!...\nНет, уж лучше я\
    \ \"всё в том же стиле\", к которому \"неравнодушен\" Андрей Цыганков. (ну накурено,\
    \ и что? :))) А \"Крута\" кто-нить другой напишет :о)\nДля сомневающихся, для\
    \ тех, кто не пошел, для тех кто не дошел, для тех, кто пришел, и не послушал\
    \ :).. маленький совет позвольте дать: \nСходите, зрелище весьма и весьма достойное.\
    \ Слушать идите лучше сразу ближе к сцене - там всё видно, слышно. У столиков\
    \ очень скучно и звук несколько, скажем так, не тот.. Вся атмосфэра ближе к сцене.\
    \ И друзей с собой побольше, хотя в одиночку тоже ничего. \nЖалею, что Louisiana\
    \ Red мы слушали на расстоянии. Отлично начал, просто отлично! (Тсс..Не будем\
    \ о звуке :) Ему, казалось бы, не нужно никакого коллектива, он самодостаточен\
    \ и лаконичен. Правда, слушая его, сразу хочется сузить рамки зала и оказаться\
    \ в таком маааленьком камерном клубе, без лишнего шума, без лишней суеты.. в хорошей\
    \ компании. Из реакции зала следует, что народ настолько беззаветно любит только\
    \ Hoochie Coochie Man.\nПрекрасные воспоминания о C.J.Chenier. Ребята, может кто-нибудь\
    \ умеет ТАК играть на аккордеоне, но скрывает это тщательно? :) Ну открывайтесь,\
    \ ну колитесь.. ну их, ваши стеснения, к черту. Это так здорово!.. Никогда особо\
    \ не любила этот инструмент. А всё почему? Никто на нем у нас так не играл, он\
    \ явно был использован не по назначению.. гармонь, аккордеон в нашей стране как\
    \ тяжкий крест, ярмо, печать, как балалайки и медведи на Красной площади.. и в\
    \ музыкальных школах инструмент второго сорта.. А по всему выходит, что русская\
    \ игра на аккордеоне сродни перевозке мешков с дерьмом в кабриолете.. как же так..?\n\
    Первая исполненная C.J.Chenier вещь была \"лучшей песней вечера\".. несколько\
    \ пафосно звучит, но для меня именно так и было. Исполнили массу хорошей музыки.\
    \ Зал был поднят на уши. Только в конце музыканты видимо устали, последний или\
    \ предпоследний денс, протяженностью минут 15, немного утомил. Но исполненное\
    \ C.J. zydeco - это кайф. Стоит сходить уже ради только этого. Если конечно любите..\n\
    Кстати, я не заметила, пластинки может быть где-то всё же продавались? Или это\
    \ не входит в рамки фестиваля? Ответьте, плиз, кто знает. Хочется пластиночку\
    \ C.J.\nЛил'Эд может и племянник J.B.Hutto, но он всё же не J.B.Hutto.. К сожалению.\
    \ Hutto я люблю. Он славный. Лил'Эд, видимо, тоже ничего, но это не моя музыка.\
    \ Когда от него повеяло Альбертом Кингом, мне понравилось. Всё остальное весело\
    \ и пьяно. Пьяно и весело. Наряд у него случился на зависть Элтону Джону и Бутси\
    \ Коллинзу :)\nДа. И стиральная доска. На ней сегодня поиграли :) Она снова на\
    \ повестке дня :)) Инструмент незаменимый.\nОткрою тайну, в глубине души надеялась,\
    \ что C.J. напоследок снова возьмется за аккордеон. Не случилось :( Возможно,\
    \ завтра вам больше повезет.\nЗабавные рисунки-мультики были показаны на прозрачном\
    \ экране слева - девушка, потирающая ээ.. как это называется? дельту Венеры? Вот\
    \ вам и стриптиз :) Мультипликационный и эфемерный.\nПублика мирная, кто-то тут\
    \ боялся, а потому даю отчет: хулиганов нет, всё дружелюбно, аккуратно.\nФестиваль\
    \ понравился. Наверное ещё сходила бы, если бы могла. Но сейчас почему-то грустно.\
    \ Почему? Не знаю..\nВозможно потому, что я не могу понять, как многие (далеко\
    \ не все, конечно) люди могут танцевать весь вечер, при этом не попадая ни на\
    \ слабую, ни на сильную долю.. Куда ни глянь, кругом своё чувство ритма, одинаковое\
    \ под любую музыку - блюз это, лезгинка, рок-н-ролл или буги-вуги. У каждого в\
    \ голове своя музыка. Люди не слышат этот ритм, что музыканты пытаются донести\
    \ до них.. Всё летит в дыру со свистом.. Вот в чем загадка - количество пришедших\
    \ - всё же это любовь к блюзу или больше к пиву? Хотя, какая к черту мне разница..\n\
    Крууутаа.. :)\nСпасибо музыкантам за вечер, а устроителям за постоянство."
