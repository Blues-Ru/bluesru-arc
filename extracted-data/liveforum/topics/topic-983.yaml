  deleted: false
  text: "Как там говорят старушки? Бог любит троицу? :)\nВчерашний джем в БиБике был\
    \ замечательным! Понравились абсолютно все - и хозяева вечера - \"Черный Хлеб\"\
    , и джемующие. Всё отлично - с первой вещи, с первого аккорда. Чувствовали все\
    \ свою игру и игру друг друга замечательно, по-моему. В один момент на сцене оказалось\
    \ 8 или 9 музыкантов, но все попадали и играли здорово! Многих я видела впервые,\
    \ так как опыта хождения по джемам пока маловато и имен, к сожалению, не знаю.\
    \ Харпер, игравший бОльшую часть вечера, - душевен (длинные волнистые светлые\
    \ волосы и, кажется, оранжевая майка-рубашка - имя подскажите?). Саксофонист -\
    \ ну очень кстати! Гитарист, тоже с длинными вьющимися волосами (имя, подскажите\
    \ - не ориентируюсь), играл очень органично. Воронов совершенно замечательно завершил\
    \ вечер своим номером. Юрий Каверкин с, как бы это описать - бархатным? :) - голосом.\
    \ Человек, исполнявший Leadbelly, а затем вытанцовывающий под тувинцев - тоже\
    \ понравился. Тувинцы порадовали особенно! До этого я слышала только модное горловое\
    \ пение, не впечатлившее меня абсолютно. На джеме же была совершенно драйвовая\
    \ гитарная игра и пение тувинцев. \nДа и женский вокал на джеме - это хорошо.\
    \ Если давать девушкам петь больше - они смелее будут себя чувствовать на сцене\
    \ :)\n Алексей, спасибо за удачный джем! Удачного Вам отдыха. \nИ всем огромное\
    \ спасибо - было здорово!"
