    text: "Мне тоже понравился последний джем. Хотя это был эксперимент с непонятным\
      \ исходом - мы взяли за основу \"тиковую\" программу, а там есть вещи с условностями\
      \ (стоп-таймы, тутти) и нестандартной структурой. Расчет был на то, что некоторые\
      \ люди с нами записывались и помнят формы, а другие слышали запись. Например,\
      \ Коля Ширяев и Слава Капорин взяли да и разобрали Louisiana Red и Good Ole\
      \ Wagon - специально на этот случай (надо снять шляпу перед такими живыми и\
      \ не ленивыми людьми). Или гитарист Сережа Виноградов, который слышал на кассете\
      \ Train Station Blues. Ну, и оказалось, что все это сработало нормально. Хотя,\
      \ может быть, некоторые номера надо было заменить стандартами - просто для комфорта.\n\
      Кто были участники? \nХарпер с длинными волосами - Вова Кожекин. Я очень ценю\
      \ этого артиста. Второй харпер - Миша Владимиров. Тоже супер. \nСаксофонист\
      \ - Александр Бородин из группы Сколдер Блюз. Сакс - особая и нужная краска,\
      \ согласен с Вами, Грета. \nГитарист - Слава из Питера.\nМолодая певица мне\
      \ тоже понравилась. Я не знаю, как ее зовут, к сожалению. \nВещи Лидбелли пел\
      \ Рост Звездин, руководитель команд Джаспер Ли и Рост-энд-ролл Бэнд. С ним все\
      \ время что-то происходит интересное. Ну, скажем, он как-то был в Польше и там\
      \ джемовал с Джеффом Беком. Я уж не говорю, что он родной племянник Аркадия\
      \ Северного. Поэма, а не человек.\nТувинцы - молодцы и тонкие музыканты. На\
      \ басу с ними играл Юра Иванов (экс-\"Скоморохи\"). На ударных - Игорь Карташев.\
      \ \nВоронов сначала не хотел играть - было без чего-то 11. Дескать, время. А\
      \ потом все-таки вышел и сыграл и спел. И правильно сделал.\nВсем спасибо!"
