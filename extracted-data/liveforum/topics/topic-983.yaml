            subject: Only for Dr.Nick :)
            deleted: false
            text: '"Sic!" - Так! Заключённое обычно в скобки, это слово указывает
              на желание автора привлечь особое внимание читателя к данному месту,
              чтобы подчеркнуть, что употреблено именно отмечаемое слово (в смысле,
              нет описки - А.). Чаще всего эта пометка встречается в цитатах и выражает
              отношение пишущего к цитируемому автору.

              (Словарь латинских крылатых слов, Москва, Терра, 1997)'
