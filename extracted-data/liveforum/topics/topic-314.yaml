  text: "Опять я немного не в тему :), но мне случайно в руки попала его \"What The\
    \ Hell Was I Thinking\", вышедшая на Fat Possum/Epitaph - офигительно человек\
    \ играет! И гитара записана очень удачно. Гитара и бубен. Замечательное исполнение\
    \ \"Ugly Woman\", \"No Shues\", \"You're Gonna Miss Me\" и других вещей.\nЕсли\
    \ кому-то попадется эта пластинка - очень рекомендую послушать, хотя бы в целях\
    \ расширения кругозора, особенно это касается практикующих музыкантов :P \nhttp://www.allmusic.com/cg/amg.dll?p=amg&sql=Acyom963ogep5\n\
    http://www.allmusic.com/cg/amg.dll?p=amg&sql=IFAT|POSSUM]EPITAPH\n\nЕсли кто-то\
    \ знает об этом дядечке больше, или слышал другие его пластинки, плиз расскажите."
