                От себя лично:

                Если разбираться дотошно в деталях, фраза Казанцева имеет право на
                существование как предположение. Хотя, может, он глубоко ошибается,
                о чем ему вполне можно было бы сообщить, но в парламентских выражениях.

                Есть примеры, когда факт смерти влияет на славу. Например, некоторые
                говорят, что половина популярности SRV в широких кругах связана с
                его трагической гибелью. Хотя в узких кругах ценителей его музыка
                сыграла большую роль, чем то, что он умер. Если вспомнить про Игоря
                Талькова, вообще нет вопросов.

                Я совершенно не хочу сравнивать Лютера с остальными. Просто хочу показать,
                что подобная мысль имеет право на существование. Вопрос о том, прав
                Дима К. или нет, - это уже другой вопрос. Ты с ним не согласен, я
                тоже не согласен. Так нельзя ли об этом написать без ругани? Хотя
                бы про то, как он Хэнди получал?'
