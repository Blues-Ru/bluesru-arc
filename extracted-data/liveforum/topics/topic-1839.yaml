  text: Про клан Эллисонов.Про Лютера Эллисона не скажешь,что его музыка доставляет
    наслаждение.Нет,она просто пронзает насквозь.Его лучшая композиция Red Cherry
    Wine,я думаю,не только лучшая 90-х годов,она просто входит в золотой фонд не только
    блюза,но и всей мировой музыки.Всякий металл или альтернатива здесь просто отдыхают.А
    чего стоит,например,Вad News Coming или лучшее,на мой взгляд,исполнение хита Little
    Red Rooster на джазовом фестивале в Монтре.У меня есть видеокассета с записью
    концерта Эллисона в том же Монтре в 1997 году.С него катил просто пот градом,и
    так пел человек за полтора месяца от смерти! У него был рак,знал ли он об этом
    тогда или нет...Такие вещи запоминаются на всю жизнь,и выложился он на полную
    катушку...Так что передача Андрея Евдокимова в эту субботу в текущих обстоятельствах
    была вполне уместной.А блестящие слова этого хита - не пей так,друг,иначе трава
    на твоей могиле будет вишневой.Эх,если бы в России хотя бы кто-нибудь приблизился
    к нему...Еще раз,Андрей,большое спасибо.
