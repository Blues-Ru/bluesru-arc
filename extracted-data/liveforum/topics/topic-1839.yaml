    text: Видно,слишком долгое пребывание в совке и какие-то особенности нашего менталитета
      сказываются на нас до сих пор не лучшим образом.Торопимся высказать свое мнение,не
      слушаем доводы оппонента,а от этого и непонимание,ссоры.Дима часто бывает прав,иногда
      нет,в знании ему никак не откажешь,но он не господь бог и тоже может ошибиться.Это
      бы нестрашно,но горячность в высказываниях создает ощущение навязывания своего
      мнения другим,хотя при личном общении такого ощущения нет.А насчет Эллисона
      все и так понятно,премии Хэнди,в отличие от Грэмми,просто так не дают.Концерт
      же 1997 года,опять-таки,поражает прежде всего тем,как мог так выступить человек,двумя
      ногами стоящий в могиле,просто какая-то невероятная энергетика.Мало кто даже
      из абсолютно здоровых людей способен на такое.Подборка же музыки у Андрея в
      передаче была действительно очень хорошая.Вот и все.Нам как-то всем надо немного
      успокоиться и повнимательнее и доброжелательнее  относиться друг к другу,что
      отнюдь не должно исключать объективной критики.
