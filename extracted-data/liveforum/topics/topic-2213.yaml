            \ интерпретацию блюза. И это всё происходит на родине блюза.\n А что же\
            \ происходит у нас? Каждый пытается заявить, что так называемый \"блюз\
            \ филинг\" есть только у него. Если ты играешь чаще чем 8-ми - значит\
            \ у тебя нет блюзфилинга, ты поливальщик, тупица и ни хрена в блюзе не\
            \ шаришь. Такая однозначность напрягает, если не сказать больше. Уже давно\
            \ пора понять, что \"техника\" и \"чувство блюза\" вещи независимые! Это\
            \ как две оси на плоскости, а музыкант представляет собой некий \"радиус-вектор\"\
            .\n И последнее. Я лично Blues Cousins слышал всего одну вещь- это был\
