            text: 'Я тоже против того, чтобы пытаться отрезать от блюза какие-то его
              ветви. С этой точки зрения блюз-рок - часть блюза, содержащая большое
              количество элементов рока. Обсуждать имеет смысл только величину правого
              или левого уклона. Уклона от чего? Это - вопрос сложный, но, все-таки,
              есть некоторая совокупность музыкальных элементов и традиций, которые
              большинство называет блюзом. И при их постепенной утрате какую-то музыку
              начинают все реже называть блюзом. Причем, более корректно, на мой взгляд,
              не обсуждать, является ли такой-то блюзовым музыкантом или рокером,
              а обсуждать, что в его творчестве есть столько-то блюза, столько-то
              рока, столько-то рок-н-ролла. В джазовых кругах, скажем, это почему-то
              не является зазорными, - играть в разных стилях. Кто как хочет, так
              и играет. И обычно называют без стыда это своими именами.

              У нас в блюзе - немного по-другому. "Блюз" является модным словом, и
              многие музыканты тянут блюзовое одеяло на себя, утверждая, что их музыка
              и является блюзом. Ко мне не раз присылали записи какие-то группы, которые
              пишут, что играют блюз, а в качестве наиболее характерной композии какой-нибудь
              рок-н-ролл без единой, условно говоря, блюзовой ноты. В остальном же
              оказывается, что это - русский рок. На те же грабли наступают неопытные
              любители музыки, неправильно понимая слово, когда на концерте, который
              называется блюзовым, играют 5% блюза, а остальное - рок.

              На Левана я на вашем месте обязательно бы сходил как минимум один раз.
              Я предполагаю, что вы получите двойственное впечатление, с одной стороны
              - удивитесь мощностью и "энергетикой" полива (в хорошем смысле слова),
              которой мало, кто может похвастаться, с другой стороны - легкое недоумение
              от интерпретации основных блюзовых понятий.'
