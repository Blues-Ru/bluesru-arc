  text: 'Извините за офф-топик. Просто я бываю на соответствующих форумах, а, думаю,
    здесь наверняка есть сведующие товарищи.

    Вот что меня интересует:  лет 10-15 назад нередко видел на выступлениях харденьких
    команд (типа Бон Джови, Мотли Кру...) гитарист применял ттакую штуковину: она
    стояла как микрофон вокалиста на стойке и гитарист, не к столу будет сказано,
    брал её в рот и регулировал ею с помощью рта (ну, типа ножная педаль, но только
    во рту), звук получался интересный: гитара+роботоподобный вокал, мне тогда очень
    это нравилось.

    Уже давно нигде такого я не слышал. Подскажите, что это такое, кто из известных
    музыкантов практикует такое дело? Хочется послушать. Может кого посоветуюте? Очень
    хочется послушать, хотя и не знаю как сейчас это будет слушаться...'
