    subject: Это такая штуковина...
    deleted: false
    text: '... ну в общем там голос этого гитариста по трубочке идёт в коробочку,
      а в той же коробочке находится один динамик и микрофон. Из динамика изсодит
      звук от гитары и он смешивается с голосом и идет на микрофон. Признаться честно
      мне эта штука как и её звучание не очень нравятся. Лучше с обычной квакой или
      с воуодером ( который с частотными фильтрами)'
