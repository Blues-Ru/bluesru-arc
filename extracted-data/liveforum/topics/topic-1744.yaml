  text: 'В общем, гляньте сюда <a href="http://music.advertka.ru/srv.htm">http://music.advertka.ru/srv.htm</a>

    Большая часть песен на самом деле малоизвестна (по крайней мере мне), но некоторые
    уже официально выходили, например, SRV (2001).

    Композиции НЕ ВЫЛОЖЕНЫ на страничке (ссылок там нет), НО ВЫ МОЖЕТЕ ИХ ПОЛУЧИТЬ
    (бесплатно, конечно). Я не буду описывать как это сделать (я эту свою идею я уже
    как-то здесь описывал), просто зайдите, там всё поймёте. Сделано так (в качестве
    эксперимента) чтоб придать симу делу как бы легальненький характер (хотя бы формально).
    Оцените сей эксперимент. Если это будет не удобно, или посчитаете что в этом нет
    смысла, то я выложу ссылки на страничку.

    Честно говоря, не всё там интересно. Но я бы особо отметил бы некоторые треки:
    1. Life Without You; 8. Superstition; 32. Let the Good Times Roll. Радует глаз
    видео: 67. Pride & Joy (MTV Unplugged, January 30, 1990); 68. I''m Going Down
    - Stevie Ray Vaughan & Jeff Beck

    А вот этот трек весьма рапространён среди пользователей peep-to-peer программ
    (например KaZaA). Какая-то дезинформация-провакация: 51. Stevie Ray Vaughan &
    Carlos Santana - Traffic Jam. Хотелось бы узнать ваше мнение что вы знаете/думаете
    об этом треке.'
