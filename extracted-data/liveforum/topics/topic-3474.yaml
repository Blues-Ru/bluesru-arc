    poster: Старый Майор
    email: gypsy@mail.ru
    subject: Я пользовался, рекомендую.
    deleted: false
    text: 'Купил наушники в каком-то интернет-магазине и получил у них купон на скачивание
      100 песен бесплатно.


      Все оцифровано качественно, битрейт VBR до 256, кодировали Lame 3.90, так что
      звучит отлично.

      Можно скачивать с сайта, а можно загрузить страшно глючный потоковый загрузчик
      - у меня он вылетает после каждой третьей загрузки.

      Если качать с сайта, то у файлов вырастает уродливый префикс - вот такой:

      www.CDonPC.ru - 01 - Back Up Train With The Soul Mates.mp3


      Скорость скачивания нереальная - до 2мб в сек.


      Но самое ценное - это однажды зарегистрировавшись, можно потом бесконечно долго
      слушать достаточно качественные превьюшки любых альбомов, причем первая песнь
      даётся на послушать целиком, остальные - по 30 сек.


      Короче, хороший и полезный сайт. Если б не глючный загрузчик, поставил бы полный
      зачОт.'
