    text: 'сомнительно

      Sweet Tea местами почти хэви-метал, для 1968 года такое звучание было бы взрывом
      похлеще атомной бомбы

      вспомните Led Zeppelin и их первый альбом, который был записан как раз в декабре
      68 и вышел в январе 69 - это была революция в музыке, а ведь к примеру опус
      I Gotta Try You Girl потяжелее Dazed and Confused или Communication Breakdown
      будет


      AMG, кстати, сообщает, что автор I Gotta Try You Girl - Junior Kimbrough и первое
      исполнение было записано им же в 1998 году'
