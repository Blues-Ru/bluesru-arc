      \ блюз.ру тоже есть некоторое количество люриксов в виде статических файлов,\
      \ но продолжать в том же духе нет никакого желания. Это очень кропотливая работа,\
      \ которая дает сомнительный результат (его не переформатируешь потом, это все\
      \ равно, что печатать большие тексты не на компьютере, а на пишущей машинке\
      \ - работа \"впустую\"). Поэтому нужно придумать XML формат для люриксов (строчки,\
      \ четверостишия, припевы, название, автор), а потом засунуть в реляционную базу...\n\
      3) Можно, конечно, подумать над тем, как сделать внешнюю структуру для Blues\
      \ Lyrics Online или mp3files.int.ru в виде ссылок, которые генерятся из базы\
      \ для более удобного доступа.\n4) Но... Только для своих делать такую титаническую\
      \ работу - нерациональная трата сил. Ибо на Blues Lyrics Online можно добыть\
      \ все, что нужно потратив лишние 5 минут на поиски, а нужно это не очень часто...\
      \ Т.е. потратив 3 месяца работы можно съэкономить 3 часа времени.\n5) Что стоит\
      \ сделать, так это базу данных по музыкантам и их альбомам, как на allmusic.com\
      \ или amazon.com. Самой главной фишкой, привязанной к персонализации, должна\
      \ быть возможность рецензирования альбомов по-русски и их рейтингования. Простыми\
      \ мат. методами можно будет сравнивать вкусы и делать рекомендации, как на амазоне.\
      \ ;) Имеющиеся разбросанные по сайту материалы нужно также подвязать к этой\
      \ базе. Об этом я и сам интенсивно думаю. Такой ресурс должен быть открытым\
      \ и траффика создавать не будет, так что ему самое место на blues.ru... ;) \n\
      6) А в принципе, хоста или домена третьего уровня в blues.ru мне не жалко, если\
      \ кто-то хочет самостоятельно сделать что-то хорошее. Главной задачей блюз.ру\
      \ является предоставление места для народного творчества на тему... ;) Чтобы\
      \ сайт сам жил даже и без нашего участия ;)"
