  deleted: false
  text: 'Есть у меня одна хорошая идея - а не организовать ли такой закрытый MP3-архивчик
    для практикующих блюзменов с базкой данных всяких текстов, табулатур и прочей
    полезной инфы, чтобы можно было вести по ней поиск. По клубному принципу - приём
    по рекомендации, доступ с паролем. Причина закрытого доступа: За траффик с сервера
    переплачивать не хоцца, к тому же копирайты будут явно нарушены, подставляться
    незачем. Весьма отдалённый пример для подражания по структуре данных - allmusic.com,
    тока там MP3-шек нету, естественно.


    Фёдор, не боись, если коллектив поддержит, программинг и хостинг я взвалю на свои
    хрупкие плечи, а у тебя разве что доменчик попрошу третьего уровня типа archive.blues.ru.
    А концепцию проекта могу написать и разместить для всенародного обсуждения в узком
    кругу.


    Идея появилась после блуждания по серверу http://mp3.int.ru/pub/mp3/ в попытках
    найти что-нить такое.. доселе неслыханное.


    И вообще, на том сервере можно найти всё, что угодно, если хорошо поискать, не
    брезгуя заглядывать в папки с многообещающими названиями типа Trash или Old_Sh*t
    ))'
