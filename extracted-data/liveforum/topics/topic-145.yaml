                              deleted: false
                              text: 'Дело не в том, чтобы играть только свои песни
                                (а хорошие свои бывают у немногих), а в том, чтобы
                                правильно выбирать репертуар. Если наш отечественный
                                музыкант слышал в жизни три пластинки: про Хучи-кучи-мэн,
                                одного Джонни Винтера и одного СРВ, то он и выбирать
                                будет из "стандартного" набора. На самом деле, существует
                                куча замечательнейшей музыки, которую можно играть,
