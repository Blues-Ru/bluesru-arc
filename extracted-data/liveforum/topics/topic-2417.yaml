  text: 'Дорогие друзья,

    Открылся www.agranovsky.ru

    Прежде всего я хочу выразить признательность блюз-ру за приют и помощь в течение
    этих лет. Открытие собственного сайта - лишь возможность разместить некоторые
    материалы, в контексте блюз-ру врядли уместные, но мне дорогие. Ведение здесь
    блогов претерпит некоторые изменения, равно как и материал про группу ЧХ. Все
    остальное пойдет как обычно.

    День рождения сайта и ДР его создателя, почтенного Кота Матраскина, будут отмечаться
    в Клубе на Брестской в пятницу 11 февраля (22:00). Флаер должон быть на аграновском
    сайте вот-вот. В гости придут Иван Жук, Юрий Каверкин, Оксана Кочубей, Тамара
    Кожекина и Boogie Chillun и другие.

    Всем привет, А.'
