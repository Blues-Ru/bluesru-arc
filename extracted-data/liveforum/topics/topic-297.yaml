      text: 'Константин,


        регулярные джемы проходят в Москве пока в двух местах:

        в клубе Би Би Кинг - по средам в 20:30 - разные составы

        в клубе exPat по четвергам, но через раз, в 21:00 - всегда Аграновский со
        товарищи (Док, извини, я уже запутался в твоих музыкантах :)


        Для записи на джем надо подходить за полчаса до начала, к Аграновскому лучше
        записываться по e-mail, чтобы включили в список заранее.


        Адреса и телефоны посмотри, пожалуйста, на сайтах типа inout.ru, а то мне
