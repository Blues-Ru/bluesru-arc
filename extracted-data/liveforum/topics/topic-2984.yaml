        text: "На мой взгляд, все эти разговоры - довольно странные. Попытка изобрести\
          \ какие-то правила. Либо - все наши говно. Тогда и стараться бессмысленно.\
          \ Либо - все не говно, не надо идолопоклонства и пр., тогда уже можно и\
          \ не стараться. Я думаю, что имеет смысл говорить о конкретных людях, обобщать\
          \ проще то, чего ты не послушал - не знаешь. Я лично сам выступаю за адекватность\
          \ восприятия, не более. \nНапример, есть, скажем Eirik Bergene, если его\
          \ поставить рядом с нашими по-очереди, выяснится, что он круче каждого.\
          \ Эйрик продолжает учиться, у него хорошая группа. Каждому из наших надо\
          \ расти, чтобы дойти до его уровня. Но, судя по всему, никто из них 4-х\
          \ это делать не собирается. У кого-нибудь из молодых гармонистов поталантливее,\
          \ вполне есть шансы, но нужно иметь порядок в голове, страсть к музыке и\
          \ потратить много времени.\nЕсть в Осло Руне Майринс, который всех з-л.\
          \ Он, скажем, похож уровнем чем-то на нашего гармониста X, чем X может погордиться.\
          \ Пол Лэмб на сегодня крут - 30-лет играет и копает \"правильную\" для его\
          \ стиля музыку. Чтобы стать поллэмбом, надо очень много потратить сил и\
          \ пр., другого пути покороче нет.\nШомахов и Иващенко - отличные гитаристы,\
          \ вполне на уровне. И им надо дальше расти, шансы есть. Но талант еще нужно\
          \ реализовать. Арсен три года назад играл круче остальных, но гораздо слабее,\
          \ чем делает это сегодня. Если бы он не стремился, не интересовался и пр.,\
          \ не о чем было бы сегодня говорить в \"мировом масштабе\".\nЧем больше\
          \ музыкант узнает, научается, тем больше для него горизонтов для развития,\
          \ и понимания, что можно еще многому научиться. Одновременно - достаточно\
          \ уверенности в том, что что-то интересное можешь сыграть, и отсутствие\
          \ самоудовлетворенности.\nИ на фоне отдельных личностей (про каждую из которых\
          \ надо говорить совершенно отдельно), - в остальном болото из музыкантов,\
          \ которые не хотят, не слышат, нет вкуса, нет знаний, не могут, ибо таланта\
