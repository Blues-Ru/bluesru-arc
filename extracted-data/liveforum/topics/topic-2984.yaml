  text: 'В этом году половина бюджета - Пол Лэмб - круто, но несправедливо. Даже на
    Братецкого денег не хватило. Может как-нибудь формат сменить - в три дня фест
    проводить, больше харперов приглашать. По-любому надо сильно больше рекламы. Попробую
    уже сейчас рекламного спонсора искать. Нужно просто щиты Мосгоррекламы оплатить
    (15000$) - и тогда хоть два Пола Лэмба.


    А ещё я тут замутил проектик российской блюзовой википедии - присоединяйтесь.

    http://www.livejournal.com/users/kozhekin/147411.html'
