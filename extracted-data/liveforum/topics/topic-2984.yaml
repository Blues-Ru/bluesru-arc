            text: 'Все вполне логично. Сын учится у отца, отец - у дета, и так далее.
              Можно пытаться учиться по записям пра-прадеда, но при условии, что его
              невозможно о чем-то спросить (а непонятные вещи будут обязательно),
              придется додумывать самому и не факт, что правильно додумаешь, так -
              главное - еще и время потеряешь.


              Перед концертом Лэмба во Владимире (я пришел рано, чтоб саундчек застать)
              я спросил его про несколько технических штук, это вылилось в небольшой
              мастер-класс и довольно длительный разговор "чиста пра жЫзнь" (я был
              на всех концертах - он меня запомнил и относился очень доброжелательно).
              Я ему говорил про Пьязу и Портного (не только), а он мне говорил про
              Сонни Терри и Джорджа Смита (тоже не только).


              Так оно и работает. Можно отвергнуть современных мастеров, которые учились
              у предыдущих мастеров, которые учились у старых мастеров. Можно признавать,
              например, только старых. Но едва ли сможешь стать таким же, да и пдедыдущим
              едва ли станешь, потому что предыдущий видел старого, а ты - нет. Нет
              возможности поговорить с ним, послушать его вживую, почувствовать. Только
              не надо говорить, что "есть же записи". Записи, безусловно, хороши,
              но для слушателя (кем, безусловно, должен быть каждый хороший музыкант).
              Для того, кто хочет учиться, в разы важнее живой пример.


              Несколько тупо описано, но, надеюсь, понятно то, что я сказать хотел
              :)

              Еще раз скажу - можно отвергнуть современников и пойти своим путем,
              но куда этот путь выведет - неясно.'
