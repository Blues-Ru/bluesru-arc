        deleted: false
        text: 'На первый взгляд, идея очень соблазнительна, однако, при ближайшем
          рассмотрении не всё так уж великолепно. Даже немного более, чем 3-х часовая
          BLUZOOLOGY Vol.1, на 4-м часу начала пробуксовывать: народ зазевал, кто-то
          огородами стал пробираться к выходу, появились первые... тигры под кустами
          и т.п. А тут, представьте себе, позднее (0:00) начало, лето (пора отпусков
          и дач), да и времени заметно больше (6 часов - их-то ведь необходимо заполнить
          искусством, а не просто абы какой лабуденью). Так что такой ночной 6-часовой
          формат вряд ли можно считать удачным. Лучше уж брать те же 3-4 вечерние
          часа, но, к примеру, изменить место, обстановку и т.п. Ещё какие-нибудь
          фенечки придумать.'
