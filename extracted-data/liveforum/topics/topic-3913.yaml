  deleted: false
  text: 'Эту новость Маша Пароходова сообщила сайту <a href="http://www.music.com.ua/news/pop/2008/02/21/26142.html"
    target="_blank">www.music.com.ua</a>. Речь идет о фильме Cadillac Records. Участие
    Бьенс в эпизодической роли Этты Джеймс было объявлено еще 28 января. Видимо, с
    тех пор планы продюсеров переменились, и фильм, посвященный истории Chess, о котором
    Новости Блюз-ру писали еще в январе, теперь станет фильмом об Этте Джеймс. Я бы
    поверил в компетенцию и информированность Маши П., но в ее заметке говорится еще:
    "Режиссером картины является Дарнелл Мартин, известный..." Вообще, по мнению iмdb
    и всяких Википедий Darnell Martin до сих пор была женщиной. Видимо, Маша П. твердо
    знает, что в 44 года г-жа Мартин прошла операцию по смене пола.'
