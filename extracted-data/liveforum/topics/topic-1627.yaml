  text: "http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70312021230531183&sql=Av5220r8ac48z\n\
    \nВторой альбом Грина на PVK вышел сразу после шикарного In The Skies. Никто не\
    \ ожидал от Питера такой прыти. Более того, на альбоме изменилась и музыка, что\
    \ уже интересно само по себе. Стало больше блюза и соула. Две первые вещи даже\
    \ немного шокируют своими фанковыми корнями. \n\n9 отличных композиций в разных\
    \ стилях и ритмах - от блюза до фанка. На барабанах знаменитый Дэйв Мэттэкс из\
    \ Fairport Convention и Jethro Tull (он еще и с БГ записывался). Все очень здорово\
    \ и классно - вокал и гитара Питера очень индивидуальны и на гране фола - мне\
    \ нравится такая подача.\n\nОценка 5 баллов. Любителям чистого блюза этот альбом\
    \ понравится больше, чем In The Skies; он не слабее первого, на самом деле, просто\
    \ камбэк 79 года \"снес крышу\" многим, а такое не сразу забывается. Хочу выделить\
    \ несколько шикарных треков: Loser Two Times; Momma Don'tcha Cry; Born Under A\
    \ Bad Sing; Baby When The Sun Goes Down (лучшая на альбоме!); Crying Won't Bring\
    \ You Back."
