  deleted: false
  text: 'Такой вот грамматический вопрос: слово "blues" единственного или множественого
    числа?

    Очень хотелось бы правильно применять время в разговоре, но не могу точно уяснить
    т.к. с одной стороны, как бы ед. ч. (например, all THAT blues), а с другой - мн.ч.
    (Gary Moore - Midnight Blues 1991. "I''ve got THOSE midnight blues... why THESE
    blues won''t go away...)

    Так как всё же верно: ед.ч. (this/that) или мн.ч. (these/those)?

    P.S. Мне самому думается что blues мн.ч. (these/those), а то что пишется "all
    that blues" это просто по аналогии с устоявшейся фразой "all that jazz" (jazz
    - ед.ч.), хоть и неверно.'
  replies:
  - id: 19897
    parent_id: 19896
    date: 2004-12-03 21:33
