    email: denis1482@mail.ru
    subject: http://dictionary.reference.com/search?q=blues
    deleted: false
    text: 'blues pl.n. (used with a sing. or pl. verb)

      Function: noun plural but singular or plural in construction

      Соответственно по-русски: "сообще-то множественное число, но в словосочетаниях
      используется как во множественном, так и в единственном числе"

      Можно провести и более глубокое исследование, для этого есть целый интернет,
      но мне лень :)'
