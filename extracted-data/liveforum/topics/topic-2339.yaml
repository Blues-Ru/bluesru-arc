      subject: Правильно
      deleted: false
      text: "Blues употребляется и в единственном и в множественном чилсе на английском\
        \ языке.   Нет ясных правил.  Дело в том, что \"blue\" как имя существительное\
        \ не имеет никакого отношения к \"blues\" в смысле музыки или настроения.\
        \   Как причастие, конечно, есть отношение (I am blue, I feel blue).   \n\n\
        \"The blues\" может быть любого числа.  \"A blues\" употребляется исключительно\
        \ в смысле \"a blues song.\"  Так что \"I have the blues\" значит \"мне плохо.\"\
        \  \"I have a blues\" значит \"у меня блюзовая песня.\"\n\n\nMuddy"
