  text: "Сегодня ,8 января 2014, Дерек Тракс и Уоррен Хэйнес сделали совместное заявление\
    \ для прессы, сообщив, что в 2014 году они окончательно расстаются с группой \
    \ Аllman Brothers Band , выразив благодарность группе и ее поклонникам и проведя\
    \ в ней 25 и 15 лет соответственно. \n\nПричина - необходимость сфокусировать\
    \ свои усилия на проектах The Tedeschi Tracks Band и Gov't Mule и желание проводить\
    \ больше времени со своими семьями.\n\nПоследняя гастроль Аllman Brothers Band\
    \ с ними - 10 января, - Атланта, Нью Йорк - Март 7, 8, 11, 12, 14, 15, 18, 19,\
    \ 21 и 22."
