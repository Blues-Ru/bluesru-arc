    subject: Еще раз, более полная информация
    deleted: false
    text: 'Гала-концерт третьего международного фольклорного блюзового фестиваля Дельта
      Невы состоится 9 июля 2005 года в Юсуповском саду, метро Сенная площадь, улица
      Садовая, 50а. Начало в 18:00.


      Стив Бейкер с Крисом Джонсом будут играть чуть ли не полтора часа.


      Цена билета 250 рублей.


      10-го июля двух музыкальных магазинах Петербурга состоятся мастер-классы по
      губной гармонике Стива Бейкера (в Синкопе) и по гитаре Криса Джонса (в Музторге,
      он же A&T Trade).


      Один из мастер-классов начинается в 17:00, другой - в 18:00 (я только не помню,
      какой - во сколько... :))


      С ценами так: на Стива Бейкера отдельного билета нет. Есть билет за 500 рублей,
      который дает право посетить как мастер-класс, так и фестиваль.


      На Криса Джонса будет (по желанию A&T Trade) отдельный билет стоимостью 200
      рублей.


      Поскольку магазины удалены друг от друга, а разница между мастер-классами маленькая,
      не стоит пытаться взять билет и туда, и туда - выбирайте, что вам интереснее.


      Так же на фестивале будет сидячая VIP зона, в нее билет стоит 800 рублей.


      Просьба пиарить все это как можно активнее, а то времени остается немного. Приходите
      сами и приводите друзей! Благо - цены вполне приличные.


      Так же появилась форма заказа билетов: http://www.nevadelta.ru/tickets.php -
      не стесняйтесь ей пользоваться (особенно, если вы не из Петербурга).


      На мастер-классы количество билетов ограничено.'
