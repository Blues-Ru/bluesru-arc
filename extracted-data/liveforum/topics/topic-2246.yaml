  text: "Мое любимое направление в современном блюзе – это пожалуй Soul Blues.   Я\
    \ особенно люблю хорошие блюзовые голоса.  Прекрасных блюзовых гитаристов и пианистов\
    \ остается много, но великих блюзовых голосов становится все меньше и меньше.\
    \   \n\nПо-моему большинство остающихся лучших блюзових голосов находится в области\
    \ Soul Blues.   Конечно мы потеряли много из них в последние годы, в том числе\
    \ Johnnie Taylor, Ray Charles, Johnny Adams, Z.Z. Hill, James Carr.  Но к счастию\
    \ мы еще имеем Solomon Burke, Bobby Bland, Aretha Franklin, Little Milton, Wilson\
    \ Pickett, Gladys Knight, Otis Clay, Ann Peebles, Bettye Lavette, и др.  Хотя\
    \ эти аритсты уже не молодые, большинство из них неплохо сохранили свои голоса.\
    \   \n\nИнтересно замететь, что Soul Blues – Это единственная манера блюза, которая\
    \ до сих пор пользуется большой популярнотсью среди Американских негров.\n\nКакое\
    \ отношение к Soul Blues в России?   Бывают ли артисты Soul Blues на гастролях\
    \ здесь?       \n\nMuddy"
