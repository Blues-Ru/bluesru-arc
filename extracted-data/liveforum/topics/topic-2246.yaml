    deleted: false
    text: 'Не знаю, как в целом по России, но мне лично нравится ;))) Хотя, я не являюсь
      большим знатоком в этой области, как и многие наши соотечественники. Так что
      трудно говорить о всеобщей любви или нелюбви...

      На Эфесовский фестиваль приедет Mighty Sam McClain, это, пожалуй, будет самое
      крупное событие по части соул-блюза, которое здесь когда-либо случалось.

      Я со своей стороны имею очень неконкретные планы когда-нибудь притащить в Россию
      не самых известных, но отличных музыкантов, имеющих прямое отношение к соул-блюзу.
      Это - Sven Zetterberg из Швеции, гениальный молодой американец Sean Costello
      и очень хорошая голландская группа Sunset Travellers с клавишником и вокалистом
      Roel Spanjers, исполняющая R&B и южный соул... Надеюсь, что все получится...
      ;)


      P.S. Blindman''s форум похоже загнулся?'
