      text: "Mighty Sam McClain - действительно хороший певец Soul Blues.  Он пользовалься\
        \ некоторым успехом в 1960-ых годах.  Потом исчез.  Оказалось, что несколько\
        \ лет он жил на улице без работы и денег.  Сеичас опять у него все пошло.\
        \  Когда будет фестиваль?\n\nSunset Travellers - Это наверно та же самая группа,\
        \ в которой пел великий певец gospel и soul blues - O.V. Wright.   Незабываемый\
        \ голос.  Знают ли его в России?  Он спился и умер довлоьно молодо в 1980-г.\
        \  Кстати Mighty Sam McClain поет одну из самых прослаленных песен O.V. Wright\
        \ - Gone For Good.  \n\nЧто касается Blindman's Blues, не знаю, когда решится\
        \ проблема.  Как часто бывает, когда много людей с разными мнениями собираются\
        \ в сиберпространстве, некоторые участники по-видному обиделись.  Хотя бы\
        \ один из потерпевших обиду оказался способным уничожить форум.  Он раз уничтожил,\
        \ востановили, и опять уничтожил.  Будем надееться.\n\nMuddy"
