  subject: '"грубоватый и наивный"'
  deleted: false
  text: "Намеревался Мишурис в своей акустической программе изобразить «квазиуличный\
    \ оркестрик – грубоватый и наивный» - по-моему у него это получилось вполне. Я\
    \ о концерте в понедельник в «Доме у дороги». Две гитары, абсолютно простой, даже\
    \ примитивный барабан, на котором играл сам маэстро, губная гармошка… Необычным\
    \ в ансамбле был фагот – его «придушенный», грубоватый тембр, как оказалось, очень\
    \ неплохо вписался в концепцию «уличного оркестрика». \nЧто еще… неровное исполнение\
    \ – что-то было сыграно очень неплохо по звуку (я имею в виду весь ансамбль),\
    \ что-то – немного хуже. Присоединившаяся позже бас-гитара дела не испортила,\
    \ «потому что ее просто не было слышно» - пошутил Михаил. \nНо все это было проделано\
    \ весело, бойко, поэтому, на мой взгляд, понедельничное шоу вполне удалось."
