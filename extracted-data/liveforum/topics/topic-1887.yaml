  text: '"Блюзовая легенда из Чикаго Мадди Уотерз записывает песню "I''m Your Hoochie
    Coochie Man" для Chess Records. К марту 1954 года сингл станет пятым подряд хитом,
    который попадет в Top 10 R&B. Первым же был "Louisiana Blues" в 1951 году."'
