  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70402170516190278&sql=Axl5k8qftbt94


    Это второй студийный альбом Элвина Ли и Ко. 8 песен на 32 минуты. Нельзя сказать,
    что тут много мути или дури, на этом диске больше шумного, грязного блюз-рока.
    На первой стороне диска неплохо звучит блюзик Two Time Mama, а вот Good Morning
    Little Schoolgirl у них не получился. Вторая сторона гораздо лучше; первые два
    трека - If You Should Love Me и I Don''t Know That You Don''t Know My Name - очень
    хороши, The Stomp - классный блюз на одном аккорде. А вот I Woke Up This Morning
    - тяжелый примитивный блюз-рок, не самый нужный трек.


    Оценка 3 балла. Дело не только в том, что на альбоме хороша лишь половина материала
    (остальное просто съедобно), дело еще и в том, что звук очень жесткий и грубый,
    все как-то сыро и угловато. Тут есть что послушать, но это точно не главный альбом
    Элвина.'
