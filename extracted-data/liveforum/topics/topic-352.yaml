  text: "Извините меня, новичка, за глупые вопросы. У меня сложилось (в приват беседах)\
    \ впечатление о некотором снобистком отношении у российской (московской) общественности\
    \ к таким музыкантам как Гарри Мур в блюзовой эпостаси (а иногда даже к SVR).\
    \ Может быть, если музыкант засветился в других жанрах, он уже не может быть принят\
    \ блюзовым социумом? Типа, надо жизнь положить и все такое, иначе - неправда.\
    \ Он что, действительно не умеет играть блюз? Если бы я услышал, что кто-нибудь\
    \ в BBK играл так, как ГМ (ну, хоть бы тот же Воронов, извините за личности, подставьте\
    \ любую другую фамилию), думаю, это было бы событие. Кажется, Мур не меньше вашего\
    \ (я имею ввиду противников), если не больше любит и понимает блюз, хотя, как\
    \ и вы (мы)белый. Только вот беда - научился владеть инструментом, что вызывает,\
    \ как мне кажется, комплексы  у доморощенных блюзменов. (Отчего-то вспоминаются\
    \ давние споры: Чарли Паркер - джаз или не джаз? А потом был Колтрейн и многие\
    \ другие). Только поймите - дело не в ГМ. Читаю о коллекциях СD представляемых\
    \ на сайте и удивляюсь -  есть много крутых (на мой дилетантский взгляд) современных\
    \ гитаристов, о которых здесь ничего не упоминается. Ну, да Бог с ними...\nОбъясните\
    \ мне, дураку (это действительно так, что касается блюза), почему Джон Ли Хукер,\
    \ играющий на расстроенной гитаре один и тот же рифф лучше того же ГМ? ГМ - попсовый?\
    \ Или только потому, что завсегдатаи блюзовых заведений не могут подняться выше?\
    \ Понятно - истоки. Но ведь время  не стоит на месте, как бы не хотелось кому-нибудь\
    \ его затормозить... Или \"выше\" находится в другом месте?... Может есть все-таки\
    \ какая-то изюминка, о которой я не имею понятия ввиду отсутствия чего-то там\
    \ в гипотоламусе. Хотелось бы прочувствовать. Хотя про Ли Хукера может я зря -\
    \ по неопытности,  мало слы(у)шал, но больше как-то  не захотелось. Может я просто\
    \ - чужак? Не будем торопиться с  диагнозом. Извините за слишком резковатый полемиит-ческий\
    \ тон, но спрашиваю с большим пиететом, не желая ни на кого наехать - злюсь только\
    \ на себя за тупость. Думаю, многим новичкам полезно будет послушать отповедь\
    \ (проповедь) на мое выступление :-)  \nИ еще глупый вопрос : начинающему блюзмену\
    \ на ком лучше поучиться, кого поснимать, чтобы овладеть языком, звуком, фразировкой\
    \ (ох, извините - фишками). Понятно, что любой черный старик - образец для подражания,\
    \ но, желательно, конкретно, ваш совет. Может разные люди разных посоветуют, если\
    \ не забоятся, а я выберу, кто ближе?"
