                                  subject: Про блюз и гаммы :))
                                  deleted: false
                                  text: "Блюзмены играют блюз. Гаммы играют музыканты.\
                                    \ Почувствуйте разницу ))\n\nКстати, очень мне\
                                    \ интересно напомнить про то, что блюз в англоязычных\
                                    \ странах воспринимают преимущественно как поэзию,\
                                    \ он в этом отношении чем-то похож на наше КСП\
                                    \ под три аккорда, а у нас в России блюз процентами\
                                    \ 80-90 слушателей (оптимистичный прогноз) воспринимается\
                                    \ как музыка с вокалом на \"чужом языке\", так\
                                    \ как английский с негритянским или техасским\
                                    \ акцентом да ещё специфической блюзовой лексикой\
                                    \ на слух вряд ли воспринимает кто-то, кроме \"\
                                    пятёрки знатоков\". \n\nКак говаривал наш преподаватель\
                                    \ во времена оны, \"вы английский учите не для\
                                    \ того, чтобы с иностранцами общаться, а для того,\
                                    \ чтобы уметь читать техническую документацию\
                                    \ и вести допрос на языке вероятного противника\"\
                                    ."
