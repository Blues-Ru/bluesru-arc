                          deleted: false
                          text: ">А вот многие мои предложения, заканчивающиеся вопросительным\
                            \ знаком, остались без внимания корпоративного единства.\n\
                            \n** Тоже мне единство...мне кажется, что вопросы эти\
                            \ относятся к нечёткой логике. так как ответ на них зависит\
                            \ от контекста его применения.\n\nНапример, можно ли назвать\
                            \ блюзом игру в четко выдержанной блюзовой стилистике\
                            \ неблюзовыми музыкантами? \n\n** Вот будут меня бить,\
                            \ но фиг с ним. Нет, не может. Это как Палех, сделанный\
                            \ на Арбате. Теряется понятие genuine, как ето бюдет по\
                            \ рюськи? В блюзе, как и в любой музыке, две компоненты\
                            \ - эксплицитная и имплицитная. Эксплицитная компонента\
                            \ записывается нотами, словами и прочими техническими\
                            \ средствами. Она копируется и воспроизводится практически\
                            \ без искажений. Имплицитная компонента имманентно присутствует\
                            \ в момент конкретного исполнения и неотъемлима от личности\
                            \ музыканта. Вывод: копия никогда не достигает качества\
                            \ оригинала.\nДругой подход, терминологический. Я бы предложил\
                            \ нашим господам румяным профессиональным критикам все-таки\
                            \ договориться и дать некоторое квазиакадемическое определение\
                            \ стилистических и жанровых рамок блюза.\nА то две мысли\
                            \ у нас блуждают: а) \"я-то сам понимаю, ещё я знаю двоих,\
                            \ которые тоже типа понимают, да и вообще, эта истина\
                            \ носится в воздухе\" б) \"ах, ты не знаешь, что такое\
                            \ блюз? иди отсюда, мальчик!\"\n\n>Можно ли назвать блюзом\
                            \ игру на джемах в Москве? \n\n** Можно. В контексте терминологической\
                            \ ясности. См.ниже.\n\nСчитаете ли вы, что вы сами умеете\
                            \ играть блюз, или, типа, просто понимаете и любите? \n\
                            \n** Мы умеем играть технически некоторую музыку, которая\
                            \ при определённом стечении благоприятных обстоятельств\
                            \ кажется блюзом нам и нашим слушателям. Это я от лица\
                            \ музыкантов грю, хотя меня никто не уполномачивал. Но\
                            \ есть ещё группа музыковедов, они пусть сами ответ держат,\
                            \ я под взглядом Евдокимова и Греты просто робею как удав\
                            \ перед кроликом. Или наоборот.\n\n>Иногда мне кажется,\
                            \ извините, что меня дурят :))\n\n** Опять же, обращаюсь\
                            \ к своей преамбуле про нечёткую логику.\n\nДружище novice,\
                            \ свяжись со мной приватно, я хочу обсудить с тобой несколько\
                            \ мыслей."
