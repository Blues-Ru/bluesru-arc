                  subject: Блюз
                  deleted: false
                  text: Разные стили музыки способны вызывать разные эмоции, как и
                    усполнителя, так и музыканта. Для металлистов - это выход энергии
                    с элементом агрессии, романсы надавливают на сентиментальность.
                    Панк для молодых, желающих побеситься и т.д. Ксп в крайней форме
                    - для ботаников на лыжах у печки. Блюз в этом ряду - очень эмоциональная
                    музыка, более эмоциональная, чем многие формы джаза, к примеру.
                    И, нескромно замечу, имеет склонность надавливать на более прекрасные
                    человеческие чувства. Весь интерес в блюзе представляет именно
                    то, как чисто музыкальными средствами (последовательностями нот
                    и аккордов, что так не нравится мистикам) можно выражать совершенно
                    конкретные оттенки настроений - слащавость, радость, грусть с
                    тоской, грубость и пр. При этом, как и актер на сцене, музыкант
                    впадает на время в соотв. настроение. Что-то чувствовать во время
                    исполнения блюза ооооочччеееенннььь даже можно... Но для этого
                    нужно уметь неплохо играть...
