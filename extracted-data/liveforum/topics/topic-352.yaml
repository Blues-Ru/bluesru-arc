                    \ в процессе жизни. Плюс жизненный опыт, безусловно. От возраста,\
                    \ на мой взгляд, он прямо пропорционально НЕ зависит.\nГолой техничности\
                    \ явно не достаточно. А в муз.школах, такое ощущение, что обучают\
                    \ именно анемичности, бесчувственности и мертвой игре и пению\
                    \ изначально. Талант, втиснутый в чьи-то чужие рамки - умирает.\
                    \ Вот потому же у нас и масса актеров никаких, что актерская школа\
                    \ сама себя изжила давным-давно. А из голосов лепят \"басковых\"\
                    . Слушать надо много, впитывать.. \nКонкретные люди выбирают конкретную\
                    \ музыку за какие-то конкретные признаки, где-то на подсознательном\
                    \ уровне, по принципу \"свой-чужой\". Как и всё в природе. Вопрос\
                    \ в том, почему одним чаще удается эта связь \"свой-чужой\", а\
                    \ другим реже? При общих, казалось бы, внешних признаках. Так\
                    \ на этот вопрос, боюсь, вы сами и ответили. \nЕсли нет явного\
                    \ чувства в игре - развивайте, если есть из чего. А просто ВЫЖАТЬ\
                    \ из ниоткуда - не получится. Нащупайте в себе те самые чувственные\
                    \ нотки, но только ни с кого их не снимайте - они должны быть\
                    \ вашими, и только вашими.\nВозможно, даже вероятно, сказываются\
                    \ на чувствах в музыке и какие-то жизненные периоды. Иначе не\
                    \ было бы такого факта, как неудавшиеся альбомы у всеми любимых\
                    \ музыкантов. У всех есть взлеты и падения. \nДа, и выберите себе\
                    \ \"целевую аудиторию\", кого вы хотели бы тронуть своей игрой.\
                    \ Всем понравиться искренне просто нереально, но круг слушателей\
