    subject: И я влезу...
    deleted: false
    text: 'Блюз интересен разными вещами. В частности тем, как чисто музыкальными
      средствами подчеркиваются различные оттенки настроения. Блюз не может быть чисто
      мажорным, как рок-н-ролл, хотя гармонии похожие. Кроме того, самые интересные
      блюзы (их большинство) не в чистом миноре. В блюзе не приемлима балладная гладкость
      как в классической гармонии - сочетания чисто-мажорных и число-минорных аккордов
      из одной тональности. В блюзе обязательно должен быть хотя бы легкий элемент
      грубости (в музыкальном плане), как бы минорные ноты с бендами в мажорной гармонии,
      если упрощать. Но грубость должна быть не 100-процентная, как в панке или крайних-запильных
      формах блюз-рока. Есть много великолепных мастеров играть оттенками настроения.
      И, разумеется, чрезвычайно важно сочетание всего этого с ритмом музыки, смыслом
      и звучанием текста песни.

      Люди, которые занимаются блюзом давно, постигают эти тонкости. Простая блюзовая
      по форме вещь без нюансов интересна только для начинающих, ибо надавливает на
      конкретные чувствительные струны относительно грубым образом. По прошествии
      какого-то времени прослушивания от частого надавливания эти самые струны становятся
      менее чувствительными. И ты уже не тащишься от простой забойной композиции,
      ибо слышишь, что за "драйвом в тембре звука" стоит слишком простая и банальная
      вещь. Тогда начинаешь переключаться на других исполнителей, которые играют даже
      иногда кривовато. В том, чтобы играть криво, ничего специально хорошего нет,
      на самом деле, если бы они играли с хорошим звуком, было бы не хуже. Но факт
      того, что песня не так доступна и приятна по качеству звукоизвлечения, со временем
      перестает иметь для тебяя значение, ибо воспринимаются другие более существенные
      детали.

      Для блюза виртуозность ничего не значит. Многие гениальные блюзовые мелодии
      и соло играются восьмыми. В свете вышесказанного блюз в исполнении Гари Мура
      - это довольно простая, прилизанная (а как же оттенки настроения) вещь, хоть
      и с большой скорострельностью. Для гитариста, прошедшего начальный уровень,
      главное, не как он играет (в плане скорости и чистоты извлекаемых нот), а что
      он играет (!). В этом смысле гитара становится второстепенным инструментом,
      а главное - это та музыка, что звучит к него в голове. Ибо, грубо говоря, даже
      для восьмых нот уже существует бесчисленное количество "комбинаций", совершенно
      не равноценных по качеству и интересности. Я в раннем детстве тоже думал, что
      включишь примочку, возьмешь пару забойных нот нот, и все тетки - твои. Тетки-то,
      может, твои и будут, но меломана ты этим не поразишь ;)

      P.S. Про Гарри Мура, пожалуйста, перечти Евдокимовскую статью на нашем сайте.
      Там очень многие поднятные здесь вопросы подняты и рассмотрены, причем, не с
      позиции - все плохо или все хорошо.'
