                    subject: Что послушать
                    deleted: false
                    text: 'Рекомендую альбом <a href="http://www.allmusic.com/cg/amg.dll?p=amg&sql=Abl5h8qfnbtx4"
                      target="_blank">J.B. Lenoir "Alabama Blues"</a> 1965 года (на
                      издании под ссылкой он спарен со следующим, "Down in Mississippi"
                      ''66, а в другом виде на CD, насколько я знаю, не выходил).

                      Альбом многовекторный - не отягощён наворотами, изысками и сложностями,
                      и в то же время по-настоящему блюзовый, не спутать. В меру авторский
                      - в меру традиционный. В меру современный - в меру корневой.
                      Акустический, но с безусловным драйвом. Тут всё взаправду -
                      при этом и красиво, и нескучно. Словом, с него хорошо начинать
                      экскурсию в любом направлении. Боюсь лишь, что назад к Муру
                      уже не захочется.

                      Плюс к тому - проверен на собственной шкуре: для меня он в своё
                      время очень многое определил и многое дал понять.

                      Где скачать - не знаю, эмпэтрями не увлекаюсь. Если есть желание
                      - могу записать на болванку или кассету.'
