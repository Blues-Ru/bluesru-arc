                                        deleted: false
                                        text: "Написано: \"...составляет своеобразие\
                                          \ и самобытность личности музыканта..\"\
                                          , а надо было написать \"музыкальной личности\"\
                                          . Мне как слушателю по большому счёту пох-пох,\
                                          \ что он делает вне сцены и даже за сценой,\
                                          \ вот такой у меня слушательский эгоизм.\
                                          \ Меня лично его личность как человека-немузыканта\
                                          \ почти не волнует, но долгий жизненный\
                                          \ опыт подсказывает, что всё хорошо в меру,\
                                          \ и наркотики и извращения не помогают музыканту\
                                          \ развиваться. Хендрикс сначала стал Хендриксом,\
                                          \ а потом наркоманом. Если так, по-простому.\n\
                                          \nХорошо, что ты сделал оговорку \"так или\
                                          \ иначе копируемо\", это правильно. Контекст\
                                          \ автора сильно отличается от контекста\
                                          \ исполнителя и контекста слушателя, так\
                                          \ что удивительно, что при таком \"испорченном\
                                          \ телефоне\" замысел автора, искаженный\
                                          \ исполнителем, доходит до слушателя :)\
                                          \ В случае, когда российский слушатель слушает\
                                          \ блюз, созданный в совершенно незнакомом\
                                          \ нам контексте, да в исполнении российского\
                                          \ же блюзмена, плохо знающего язык, там\
                                          \ такое многослойное искажение авторского\
                                          \ замысла получается, ой-ой! Это типа как\
                                          \ Дилан начнёт петь \"Милая моя, солнышко\
                                          \ лесное\".. не, ну формально-то он споёт,\
                                          \ но где ему знать про романтику туристских\
                                          \ походов времен позднего развитого социализьма..\
                                          \ намёк мой верно понимаешь?\n\nОсобой интересующихся\
                                          \ означенными проблемами отсылаю к классическому\
                                          \ труду Гриндера и Бэндлера \"Структура\
                                          \ магии\", только там рассматривается проекция\
                                          \ глубинных структур личности на язык разговорный,\
                                          \ а у нас речь идёт про язык музыкальный.\
                                          \ Это почти никто не исследовал. \nТакоже,\
                                          \ рекомендую перечитать Борхеса: \"Пьер\
                                          \ Менар, автор \"Дон Кихота\" - там очень\
                                          \ хорошо написано про контекст переосмысления.\n\
                                          \nВот такие у нас в Советской Армии майоры,\
                                          \ много чему обучены."
