                  email: gypsy@mail.ru
                  subject: Как летает филин, или юноше, обдумывающему житьё..
                  deleted: false
                  text: 'Дружище Novice, ох, подозреваю я, что не так ты прост, как
                    представляешься... ладно, изложу как всегда, тезисами.


                    1) Все мы любим играть на гитаре и на других хороших инструментов.
                    Второй вопрос - умеем ли. Ответ на него состоит из двух частей:
                    объективной и субъективной. Субъективная часть - это то, как ты
                    сам считаешь. Объективная - как тебя оценивают слушатели, если
                    их при этом расспросит внешний беспристрастный наблюдатель. Объективно
                    только Господь Б~г оценивает. См. Д.Хармс. Четыре иллюстрации
                    того, как новая идея огорашивает человека, к ней не подготовленного.
                    (http://www.kulichki.com/~yegor/kharms/sluchai15.html)


                    2) Фиг знает, когда появляется чувство. Психотерапевты называют
                    это "групповой раппорт", когда одна большая эмоция охватывает
                    и музыкантов, и слушателей. Истоки - в шаманских камланиях. Практические
                    рекомендации: компетентность и внутреннее состояние музыканта,
                    подготовленность и ожидания аудитории, которая слышит то, к чему
                    внутренне готовилась, идя на концерт. Филин - птица пугливая,
                    прилетает неожиданно, улетает резко.


                    3) Внутреннее состояние музыканта. Тоже интересная штука, по науке
                    называется "конгруэнтность". Рефлексируя перед концертом, музыкант
                    должен чувствовать себя именно музыкантом, а не, например, пацаном,
                    у которого проблемы с потенцией. Выжимать из себя бесполезно.
                    Скорее, техника вызова состояния конгруэнтности - медитативная.
                    Всякие амулетики, приметы, привычные действия тут более чем уместны.
                    Если раз ловил филина - попробуй вспомнить, какие обстоятельства
                    этому способствовали - любимый медиатор, зажигалка в правом кармане,
                    три глотка пива, половина выкуренной сигареты..иначе будет не
                    день Бэкхема.


                    4) Мнэээ... буду надеяться, что игру на гитаре ты противопоставляешь
                    реальной жизни исключительно в полемическом задоре..а то как-то
                    уныло получается "я тут на гитаре играю, а жизнь мимо проходит"


                    5) Что испытываешь при прилёте филина - обычный адреналиновый
                    выброс: пульс учащается, уши краснеют, слюной можно захлебнуться,
                    если заиграешься и прочее. У кого-то что-то сжимается, но это
                    очень личное.. ))'
