              subject: откуда что растет :))
              deleted: false
              text: "Денн, какой смысл кому-то что-то доказывать? Музыка - дело тонкое,\
                \ интимное. Я, например, никому ничего никогда не доказывают, даже\
                \ поклонникам Бендосовича. \n\nЕсли некто рассуждает о вороватости\
                \ ЛЗ, то это характеризует только этого некто, но никак не ЛЗ. Если\
                \ кто-то говорит, что на форуме, посвященном БЛЮЗУ, нельзя подымать\
                \ вопрос о блюзах, которые исполняют музыканты,работающие  за пределами\
                \ того круга, который определил запретитель, то это никак не характеризует\
                \ запрещенные для оценки группы и исполнителей, а характеризует только\
                \ запретителя. \n\nЯ, собственно, заглядываю сюда время от времени,\
                \ чтобы посмотреть, кто где играет. Мне показалось, что тут присутствуют\
                \ несколько знатоков музыки. Но совершенно простой вопрос вызвал бурю\
                \ эмоций.\n\nВ результате этой бури:\n \nа ) мне было рекомендовано\
                \ слушать черный блюз, который я вполне уважаю, но закончил слушать,\
                \ когда рекоменданты водили хороводы в детском саду; \n\nб) меня начали\
                \ обучать истокам белого блюза люди из того же хоровода;\n\nв) выяснилось\
                \ также, что музыкальная жизнь в Москве началась в 1975 году;\n\n\
                г) что интерес к Rolling Stones может быть ограничен интересом к сожительству\
                \ Джаггера с Боуи. \n\nд) что только наиболее избранным форумчанам\
                \ известно, где расположена голова, а где ноги и прочие элементы анатомии\
                \ блюза;\n\nе) что все фигня кроме пчел, да и пчелы тоже фигня.\n\n\
                \nБыли, конечно, и конструктивные ответы и высказывания. Еще раз спасибо\
                \ этим участником разговора. \n\nОтдельное спасибо Михаилу Мишурису,\
                \ концептуальный взгляд музыканта на вещи всегда интересен.\n\n\n\
