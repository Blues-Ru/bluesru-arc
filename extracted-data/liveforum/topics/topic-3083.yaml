        text: "Расист? Уж сразу и дело шить стали? Небось, щас и жаловаться в СПС?\
          \ Хака-маза поможет, да...\n\nНет, я не расист, отношние к любому цвету\
          \ кожи у меня нейтральное, просто нарисовал расхожую картину блюзмена в\
          \ общественном сознании.\n\nКто-то любит черный блюз, кто-то белый. Черный\
          \ человек - прекрасный композитор, потому что блюз генерирует самой своей\
          \ сутью. Но, на мой взгляд, он малоискусный исполнитель (Хендрикс - исключение,\
          \ которое подтверждает правило). У них однообразные, по крайней мере для\
          \ зала, приемы игры, эмоции без взлетов и падений. Скажем, у Отиса Раша\
          \ на всем альбоме «Any Place I’m Going» могу слушать только Walking The\
          \ Back Streets And Crying. Негры, конечно, ведут медленный, доверительный\
          \ разговор, как умеют.  И я вполне понимаю тех людей, которые любят такой\
          \ доверительный разговор настолько, что могут слушать часами только черный\
          \ блюз. Значит, у них винтики в одну и ту же сторону завернуты завернуты.\
          \ \n\nЗато у каждого талантливого белого блюзмена есть неповторимый натиск,\
          \ которого не хватает черному исполнителю. И как правило, это выходит у\
          \ белых гораздо острее и своеобразней (вот, например, медли из черного блюза\
          \ у David Gogo или вообще автрийские штучки Sir Oliver Mally's). ИМХО, конечно.\n\
          \nЧто касается Джаггеровский песен, время - честный парень. Думаю, что время\
          \ is on my side, yes it is :))"
