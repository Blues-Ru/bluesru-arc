    text: "Тем более, что сам Джаггер всегда был против определения своего стиля.\
      \ Хотя, думаю, к нему вполне приложимы слова, которые Стивен Тайлер из Аэросмит\
      \ сказал о себе:\n\n«The blues are our f***in’ roots. A lot of bands dressed\
      \ up like I used to dress. But there’s no f***in’ middle to what they play.\
      \ No soul. There’s no main vein runnin’ down the middle of it’. \n\nДа и  блюз\
      \ – это совсем не обязательно старый негр, который толстыми, как сосиски, пальцами,\
      \ ползает по грифу. Уверен, что джаггеровские I Got The Blues, Sway, No Expectation,\
      \ You Got The Silver и еще масса других вещей останутся навсегда уникальными\
      \ и лучшими блюзами 20 века.  \n\nА всем спасибо за конструктивные ответы."
