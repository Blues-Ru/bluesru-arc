        \ список блюзовых evergreenов по вкусу.\n\nТеперь берём ингридиенты в произвольных\
        \ сочетаниях и получаем начало рассказа на блюзовую тему. \n\nНапример:\n\
        Молодой белый, ползая по грифу пальцами, толстыми как сосиски, бубнил себе\
        \ под нос \"I am ready for you and I hope you're ready for me\"\n\nПо-моему,\
        \ неплохо получилось :)"
