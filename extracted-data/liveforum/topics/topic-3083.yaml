            replies:
            - id: 25868
              parent_id: 25863
              date: 2006-02-08 11:59
              poster: Дмитрий (фан)
              email: leonidovd@mail.ru
              subject: Кстати еще про Роллингов
              deleted: false
              text: 'В свое время, в начале 90-х, когда я еще блюзменом считал Клэптона,
                а из настоящих слышал только пару альбомов Мадди Ватерса и Хоулин
                Волфа, а про БиБи Кинга знал только, что такой существует (и что он
                Король Блюза - из журнала "Ровестник"), услышал я у другана-меломана
                целиком первывй альбом Роллингов...

                И очень он мне как-то понравился, хотя все их более поздние хиты -
                "Сатисфэкшен", "Пэйнт Ит Блэк", "Леди Джейн" и другие знал и уважал
                уже давно...

                Помню, очень заинтересовался тогда я их творчеством. Книжку купил,
                записал себе на бобинник несколько альбомов в студии граммзаписи "Гармония",
                питерцы-моломаны, думаю, ее хорошо помнят.

                Так вот, послушал тогда я записи Роллингов разных лет, послушал -
                и сделал вывод для себя - первый альбом самый лучший! И если включал
                Стоунз, то в основном только этот диск.

                А потом, когда несколько лет назад увлекся блюзом, узнал,- что это
                на 95% блюзовые стандарты... Вот тебе и лучший альбом Роллинг Стоунз.'
              replies:
              - id: 26067
                parent_id: 25868
                date: 2006-02-13 18:31
                poster: Sam_T
                email: S_and_M_in@yahoo.com
                subject: ещё про Роллингов и блюз
                deleted: false
                text: Можно считать Стоунз хорошими блюзменами, можно не считать --
                  это скорее дело вкуса. Заслуга Rolling Stones не в качестве исполнения
                  того или иного блюза, а в том, что когда в начале 60-х 99,9% групп
                  продвигали биг-бит и мерси-бит в Великобритании (а в США вообще
                  толком никто не знал, что играть), Роллинги чётко работали в стилистике
                  ритм-н-блюза и блюза (а не блю-айз, как другие "белые"!) и в конце
                  концов добились мировой известности. Многих "королей" блюза мир
                  узнал именно благодаря роллинговскому подвижничеству. Много ли народа
                  знало за пределами южных штатов США в конце 50-х, кто такой, к примеру,
                  Хаулин Вулф? А Роллинги его, по сути, "раскрутили"...
