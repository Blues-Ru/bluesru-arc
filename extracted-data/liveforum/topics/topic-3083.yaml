          text: "Подавляющее большинство белых музыкантов подходят к музыке интелектом,\
            \ головой, для них музыка это наука. Белые - это спортсмены ИСПОЛНИТЕЛИ\
            \ !.\nА для черных музыка это чувства, эмоций проходящие через сердце\
            \ и гениталий. Черные - это НАСЛАДИТЕЛИ передающие максимальную эмоциональную\
            \ информацию минимальными средствами. У черных ритмическая и тональная\
            \ нюансировка развита изначально лучше, а самое главное, как правильно\
            \ отмечал Мадди Уотерс, \"белый может делать почти все как черный ИСКЛЮЧАЯ\
            \ ПЕНИЕ !\"  голос это наиважнейши музыкальный инструмент а блюз прежде\
            \ всего вокальная музыка. \nВ джазе были виртуозные черные исполнители\
            \ но у них техника исполнения была не самоцелью как у белых, а натуральным\
            \ РЕЗУЛЬТАТОМ, надстройкой на духовной, эмоциональной основе.\nВ результате\
            \ черный джаз намного ПРИЯТНЕЕ воспринимаеться чем белый. Не говоря о\
            \ блюзе."
