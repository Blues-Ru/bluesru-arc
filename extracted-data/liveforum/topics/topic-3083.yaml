                      deleted: false
                      text: "Я не спорю, что Вы знаете СВОЮ ситуацию. Но как выясняется,\
                        \ всю ситуацию Вы не знаете, хотя пытаетесь экстраполировать\
                        \ собственный опыт на всех :))  - например, судя по заявлению\
                        \ насчет бразильских перепечаток \"Nazareth\". Впочем, я перестал\
                        \ слушать их с 75-76 гг, поэтому на чем они выпускались далее\
                        \ - не ведаю, закупил поздние, в целом очень слабые, альбомы\
                        \ уже гораздо позже, на CD. \n\nBlack Sabbath  слушал как\
                        \ правило на глухом и шипящем Vertigo, Jethro Tull и Procol\
                        \ Harum - на глухом, но не шипиящем Кризалисе, Кинг Кримзон\
                        \ - на великолепнейшей Атлантике, ELP - лейбл был у них такой\
                        \ американский, в виде островка, сейчас уж не упомню, как\
                        \ назывался, ну и т.д.  Такой экзотики, как бразильские перепечатки,\
                        \ просто не представляю. Самое латинское, что видел в своей\
                        \ жизни - это сборник Битлз Por Siempre Beatles. Самое худое\
                        \ же в мое время считалось перепечатенное у каких-нибудь демократов\
                        \ (венгров-поляков-югославов).\n\nНад лейблами тогда никто\
                        \ особо не корчился, внимание было обращено на собственно\
                        \ музыку и на попиленность диска. Кстати, в добрых 50% случаев\
                        \ музыку писали с боббин, хозяева которых как правило не знали\
                        \ названий не только песен, но и исполнителей. До сих пор\
                        \ ищу некоторые группы по зучанию (пока была Горбушка в парке,\
                        \ делать это было легче).\n\nА слушаю англоязыкастых регулярно\
                        \ еще со школы, примерно с 1966-67 гг, когда в силу ряда причин\
                        \ получил отличный источник в виде записей пиратской радиостанции\
                        \ \"Вероника\". Правда, черные музыканты там были представлены\
                        \ узко, главным образом Чаком Берри, Four Tops, Фэтсом Домино,\
                        \ Шенье, Чабби Чекером и другими не менее веселыми ребятами.\
                        \ Из девчушек - Supremes да все прочие, кто решился петь Dancing\
                        \ In The Street: помнится, была там Марта Ривз. Голландеры\
                        \ еще не были такими поликорректными и во всю оттягивались\
                        \ на классическом бите, моутауне и рок-н-ролле.\n\nНачав слушать\
                        \ блюз примерно с 1971 года, в институте (был у нас своеобразный\
                        \ клуб любителей музыки), быстро к нему охладел. И белых блюзовиков\
                        \ того времени, включая помянутого Вами Джонни Винтера, никогда\
                        \ не любил и до сих пор не полюбил. Правда, некоторых слабоидентифицированных\
                        \ помню по сей день, например,  некую блюзовую группу \"Бифитерс\"\
                        , с их шикарным исполнением Papa's Got A Brand New Bag и It\
                        \ Ain't Necessarily So, но пока что не встретил ни в одном\
                        \ магазине. Может, подскажите, где продается? :)\n\nБольшинстово\
                        \ перечисленных Вами людей, и уж тем более крупную Мамку Торнтон,\
                        \ обладанием которой в те годы очень гордился один мой друг,\
                        \ слушать не стремился, поэтому если такие диски и проходили\
                        \ через меня, то внимание на них не акцентировал. Но не сомневаюсь,\
                        \ что они в обороте были, потому что сотни раз видел, как\
                        \ каких-то черных блюзменов из портфеля в портфель перекладывали.\
                        \ Тех, кого я обменивал, записывал и слушал - помню, Вам их\
                        \ назвал. К Честеру Бернетту с тех пор как услышал, как он\
                        \ попросил воды, а ему дали керосин, и до настоящего времени\
                        \ испытываю теплые чувства. Что же касаемо ослепшего Уилли\
                        \ Джонсона, то его тогда я не слышал, но зато у меня была\
                        \ запись на боббине ослепшего Уилли Мактелла, которую я довольно\
                        \ скоро затер (относительно недавно белый блюзовик Тим Брукс\
                        \ со своими Шеркропперами пропел ему гимн в виде - кажись,\
                        \ дилановской? - баллады, хоть и с музыкальными вставками\
                        \ от Богословского). Названия того диска Джонсона я не упомню,\
                        \ помню только как мне доказывали его ценность с той точки\
                        \ зрения, что после этого Джонсон уже не записывался. Вполне\
                        \ возможно, что Вы знаете, о каком идет речь. Я уж не помню.\
                        \ Ну да и бог с ним.  А после появления альбома Клэптона \"\
                        Я и мистер Джонсон\" послушал я Роберта Джонсона в самом что\
                        \ ни на есть оригинале, на CD у друга, и понял, что от такого\
                        \ исполнения я ничего в свои молодные годы не утратил (и не\
                        \ раз потоптанный тут Джаггер не зря напрягался над собственной\
                        \ версией \"Love In Vain\").\n\nПовторюсь: диски в Москве\
                        \ сильной проблемой не были. В основном все обменивались,\
                        \  достаточно легко. Источники были - либо мидовцы, либо спекули.\
                        \ Помимо нашего института диски обменивали и продавали в Трубе\
                        \ и на Горках. Правда, тамошний выбор я особо не знаю, потому\
                        \ что не любил светиться на улицах (например, учившегося у\
                        \ нас сына Сличенко таким образом милиция чуть было не \"\
                        подмела\" у комиссионки на Садовой, но такие люди не пропадют\
                        \ :))).\n\nВ общем, напрасно Вы думаете, что начало музыкальной\
                        \ жизни в Москве совпало с началом Вашего прихода в музыку.\
                        \ \n\nЧто же касаемо второй половины 70-х, то рядом в кинотеатром\
                        \ \"Октбярь\"  была студия звукозаписи, где можно было заказать\
                        \ практически все. Когда я уже не имел возможности бесконечно\
                        \ бегать и меняться дисками, свободно писал там раз в неделю\
                        \ все, что душе угодно. Но черный блюз тогда мне был уже не\
                        \ нужен (как впрочем и сейчас, за редким исключением вроде\
                        \ ребят типа Бадди Гая).\n\nБелый же блюз, в том виде, в котором\
                        \ я его люблю, расцвел с начала 90-х.\n\nА если Вы полагаете,\
                        \ что для того, чтобы определиться с направлением в музыке,\
                        \ надо слушать ее до опупения, то могу отослать Вас к повести\
                        \ Булгакова \"Дьволиада\", где путем глубинного погружения\
                        \ в предмет герой определял великолепное качество спичек,\
                        \ которые ему выдали на работе вместо зарплаты. Мне же такой\
                        \ способ кажется контрпродуктивным.\n\n\nБлюз - он гораздо\
                        \ шире, чем Вы думаете. Это не ИМХО. У черных никто ничего\
                        \ не отнимает. Молодцы, ребята. Но и ограничиваться ими -\
                        \ это просто ограничивать себя. А это уж ИМХО, конечно.\n\n\
                        Впрочем, приятно было кунуться в воспоминания."
