  text: Купил на днях этот новый альбом старины ББ Кинга. Видимо каждый рано или поздно
    должен записать альбом про Рождество :) Мне альбом понравился, уже нет какой то
    искорки в манере исполнения как на "Riding With The King" c Клэптоном, но тут
    именно спокойствие,  некоторое равнодушие как раз и завораживают. Мягкий и тихий
    альбом. Наверное, старина подустал немного... все таки в годах ...
