          subject: очень важно
          deleted: false
          text: обращать внимание на лейбл. Домашний лейбл Би Би Кинга на теперешний
            момент - MCA, посему именно последний его релиз на данном лейбле может
            считаться его последней официально выпущенной продукцией, в выпуске которой
            он так или иначе непосредственно принимал участие. Это не значит, что
            все прочие сплошь пираты, бутлеггеры и т.д., у них могут быть различные
            формы отношений с Би Би Кингом и его выпускающей компанией, однако скорее
            всего они будут выпускать всякого рода сборники, концертные записи прошлых
            лет, неизданное и прочее.
