                шестьдесят лохматого года, даже если впервые был выпущен в свет только
                вчера, позиционировать в общем контексте творчества данного артиста
                именно обозначенного периода.

                Скажем, артист N в 60-х играл психоделик, в 70-х арт-рок и т.д.; сегодня
                он играет жестокий грандж. И вот его лейбл, видя, что выход нового
                гранджевого альбома некоторым образом задерживается, решил покамест
                выпустить архивную запись 60-х гг., тот же концертник. Не будем же
                мы всерьёз в этой связи полагать, что наш артист N вновь заиграл психоделик
                :)'
