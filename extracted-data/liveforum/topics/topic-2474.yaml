  subject: Блюз погубит ваши души.
  deleted: false
  text: "Культуры различных этнических групп складываются из взаимодействия\nлюдей\
    \ с окружающим их миром. Среда обитания формирует в человеке понятия о жизни,\
    \ о смерти, о том, что приводит силы природы в движение, то есть о высшей силе.\n\
    \ Культура любого этноса несет в себе колоссальный заряд энергии, так как без\
    \ ее помощи не возможно выжить ни одному народу. Культура обЪединяет людей. Это\
    \ сила которая может помочь, но она же может и убить, при отсутствии должного\
    \ уважения к ней.\n______________________________________________________________________"
