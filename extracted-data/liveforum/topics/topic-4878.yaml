  text: "\"...Омар привёз в Москву блюзмена из Калифорнии JC Smith’а.\nЭто персона.\n\
    Смит включен (или введен?) в Blues Hall of Fame, а его блюз-бенд признан лучшим\
    \ вштате.\nКалифорния – штат не блюзовый.\nНо это всё не важно. Мне было заранее\
    \ интересно...\"\n \n\"...Это была классная музыка.\nЕсли назвать одно главное\
    \ качество Джей-Си Смита «в деле», то это – ритм.\nЗамечание может показаться\
    \ тривиальным. Какой же артист блюза без ритма?\nТак, но не совсем.\nРитм безупречный\
    \ и совершенный представляет некоторую редкость.\nКогда Омар Итковичи в первый\
    \ раз отыграл гиг с «Чёрным Хлебом», кто-то из ребят заметил: «как кладёт… всё\
    \ в ритме».\nВалера Гелюта говорил интересную фразу: «каждая нота в законе».\n\
    Правда, речь шла не собственно о ритме, скорее о скупости, точности (что у него\
    \ самого, гитариста удивительного, бывает лишь под настроение…)\nТак или иначе,\
    \ мне нравится эта формула.\nВ детстве мы думали, что соло, это когда на гитаре\
    \ нажимают тонкую струну на каждом аккорде песни (мне так рассказывали в школе).\n\
    В юности, что классный гитарист в группе – виртуоз-«запильщик».\nПозже увлекает\
    \ звук, гармония…\nПроходит время, и понимаешь, что магия гитары связана более\
    \ всего со временем (ритмом).\nВ степени владения им есть много растущих градаций.\
    \ Смит показался совершенством…\nПожалуй, Лури Белл на такой ритмической высоте…\n\
    Еще несколько музыкантов, которых слышал живьем.\nВы скажете – а бас, ударные,\
    \ пианист?\nРечь веду об электрогитаре, из которой звуки торчат, как колья.\n\
    В ансамбле её «не вовремя» наиболее заметно...\"\n \nhttp://www.agranovsky.ru/diary/apr_12.htm"
