  text: "маленьким, но очень приятным для поклонника блюза событием в моей жизни.\
    \ На днях на точке у Вадима (кто не знает, в СПб на Нарвской) прикупил CD в свою\
    \ блюзовую коллекцию под НОМЕРОМ 100 !(В принципе там плюс-минус 2-3 диска спорных,\
    \ но я посчитал, пусть этот будет юбилейным). \nНаверное, многим стало смешно,\"\
    подумаешь, развел тут шум из-за сотни\". (У кого-то, может, тысяча). Но наверное,\
    \ каждый радовался когда-то первому, десятому, сотому альбому (или первой гитаре).\
    \ Ехал в другой конец города (на Горбушку, на Юнону, на Нарву...) или вообще в\
    \ другой город с чувством \"предвкушения праздника\" и радовался удачной покупке\
    \ как ребенок, которому подарили новую желанную игрушку...\nНу и срок прошу учитывать,\
    \ т.к. на блюз я запал серьезно где-то с ноября прошлого года. А вообще я когда-то\
    \ (лет 12-13 назад) протащился от Клэптоновского \"Just One Night\". Ну и так,\
    \ что-то как-то слушал, но без восторга. И дальше не пошло.\n И вот хочу сказать\
    \ спасибо лотошнику на \"Лесной\", который прошлой осенью почти втюхал мне сборник\
    \ \"Blues. The Best Of Road Music\", который меня сильно зацепил, но на коем из\
    \ исполнителей к своему удивлению я знал и слышал только B.B. King. Тогда я очень\
    \ заинтересовался и начал шариться по allmusic и подкупать блюзовые сборники и\
    \ альбомы. Оказалось, что блюз это не только Muddy Waters и Howlin' Wolf, что\
    \ это очень современная и \"разная\" (скажу так) музыка, которая цепляет, увлекает,\
    \ завораживает. А сколько исполнителей!!!\n Большое спасибо Вадиму за информацию,\
    \ за отношение, за выбор - от него без покупки не уедешь. У него всегда найдется\
    \ что-то новенькое и интересное из блюза. (А мне далеко не все подряд нравится)\n\
    \ И спасибо сайту Blues.ru, на котором я нашел очень много информации и могу поделиться\
    \ впечатлениями о исполнителе или альбоме. (Правда, вечно времени не хватает).\
    \ А то и в разговор мэтров что-нибудь вставишь.\n По иронии судьбы, сотым диском\
    \ в моей колл. стал альбом исполнителя в стиле (как впоследствии выяснилось) кантри\
    \ (!) Willy Nelson под названием \"Milk Cow Blues\". Не \"very best\", но очень\
    \ приятная вечерняя музыка, вокал для белого весьма хорош и приятен, т.б. ему\
    \ помогают настоящие блюзмены (и леди Susan Tedeschi). Надеюсь, что на двухсотом\
    \ будет истинный блюзовый музыкант!\nИз последних своих приобретений хочу отметить\
    \ альбомы W.C. Clark \"From Austin With Soul\", Coco Montoya \"Gotta Mind To Travel\"\
    , Jay McShann vith Duke Robillard \"Hootie's Jumpin' The Blues\", Dave Specter\
    \ (с Jack McDuff и др.) \"Left urn On Blue\".               \nЛюбимые музыканты\
    \ - Lucky Peterson (особенно), Koko Taylor, Charles Brown, B.B. King, да и каждый\
    \ по-своему хорош!\nКороче, BLUES FORETHER !!!\nP.S. Вот еще вспомнил, - как-то\
    \ по весне подпортилось здоровье. Иду к врачу - настроение хреновейшее, ноги не\
    \ идут. А включил в плеере, по-моему, William Clarke \"The Grove Time\". Тонус\
    \ сразу поднялся оп-па!, шаг сразу стал похож на строевой (Старый Майор, ты слышишь?)\
    \ и настроение: А пущай хоть режут, с ТАКОЙ музыкой не страшно!"
