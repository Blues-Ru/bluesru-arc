      \ блюзменом, так? Но автор, делая реверанс в сторону наших блюзменов \"все не\
      \ плохи\", замечает, что все они не без дефекта. Наверное, не уродились... \n\
      \nPS: как было ниже подмечено одним из моих внимательных оппонентов, я подменяю\
