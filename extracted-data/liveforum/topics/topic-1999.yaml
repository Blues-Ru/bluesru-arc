    text: "День добрый, Дима. Как дела? Это Саша, мой друг еще у тебя в мае в Питере\
      \ бас купил...Если конечно ты тот самый Дима из El Coyotes.( хотя вроде ник\
      \ твой).\nТеперь по теме: \n1) о крутости наших блюзменов. В России нет крутых\
      \ блюзменов. Есть известные и малоизвестные. А крутость и известность это не\
      \ одно и тоже. Все знают Воронова, но только потому что он играет в НЕПРИКАСАЕМЫХ,\
      \ для них он просто гитарист из группы Гарика Сукачева. \nЛомидзе просто хороший\
      \ гитарист...и т. д. Большинство же команд в связях с шоу-бизом замечаны не\
      \ были, и как результат играют по клубам, находясь на примерно одном уровне\
      \ мастерства.\n\n2)Об отношении к блюзу. То что это делается ради денег сомневаюсь\
      \ и мало верю... Прсто потому что видел как Аграновский зажигает на концертах,\
      \ как Ломидзе с трудом удерживается от того чтобы расколотить свой Гибсон об\
      \ пол, как Казанцев поет Wild Horses и т. д. ... Ради денег так не играют...Так\
      \ играют и делают ради публики...\n\n3) о доступности. Никогда не думал, что\
      \ блюз \"доступен и легко исполним\". Если бы блюз был доступен, то по MTV крутили\
      \ бы весь день вместо \"Руки Вверх\" концерты Воэна или Хукера или даже Люка\
      \ Джордана.\n\n4)О легкости исполнения... Ну это как посмотреть...:) Если разговор\
      \ о 12 тактах, то да, а если о чем-то большем то спорно, оч. спорно."
