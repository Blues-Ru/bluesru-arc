  subject: Елена Маркосян предсказывает скорый успех блюза на Е-видении
  deleted: false
  text: 'Тут вот <a href="http://www.kommentarii.ru/comment/18438/2785">http://www.kommentarii.ru/comment/18438/2785</a>
    некая "Консультант-эксперт, Глава президиума профсоюза "Творча нація" Елена Маркосян"
    заканчивает свой анализ EUвидения вот таким пассажем:


    "Особое внимание обратила на дуэт из Армении. Если бы эту песню сестры исполнили
    в ритме (стиле) блюз, они бы оказали более чем достойную конкуренцию Рыбаку. Сестры
    даже пытались это сделать (и за это получили одну оценку в 12 баллов). Но этническая
    составляющая не позволила им раскрыть потенциал песни. Этническая "подача" давлела
    над ритмикой блюза. Кстати, думаю, что красивый блюз будет востребован в следующем
    году на Евровидении."


    Кто отнесет кр.блюз на Европовидение в следующем году? Аналитики предсказывают
    большой спрос!'
