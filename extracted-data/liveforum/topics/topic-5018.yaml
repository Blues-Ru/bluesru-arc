  deleted: false
  text: "II-ой Международный вокальный конкурс «Невероятный отбор»\n\n24 Апреля  -\
    \ 21 Мая  2013г\nРоссия,  Санкт-Петербург,  Концертный зал \"Колизей\", Невский\
    \ пр. 100.\n\nКонкурс проводится по следующим вокальным направлениям:\n- академический\
    \ вокал или классическое пение; \n- эстрадный вокал; \n- джазовый вокал; \n- народное\
    \ или этническое пение.\n\nВозраст участников от 15 до 40 лет. \n\nВсе выступления\
    \ на конкурсе сольные под \"минус\"\nили живой аккомпанемент (гитара, фортепиано\
    \ и др.). \nКонкурсант может пригласить на выступление одного аккомпаниатора.\
    \ \nДлительность песни - не более 5 минут. \n\nДля участия в конкурсе необходимо\
    \ отправить в личном сообщении\nорганизаторам конкурса: \nhttp://vk.com/magsus\
    \ \nhttp://vk.com/kulakovaalinasergeevna \nили по почте: mail@magsus.net\n\n1.\
    \ Заявку с анкетными данными: \n1) Фамилия: \n2) Имя: \n3) Возраст: \n4) Вокальное\
    \ направление: \n(выбрать одно из четырех: \n- академический вокал или классическое\
    \ пение; \n- эстрадный вокал; \n- джазовый вокал; \n- народное или этническое\
    \ пение.) \n5) Семейное положение: \n6) Страна: \n7) Город: \n8) Музыкальное образование:\
    \ \n9) Учусь: \n10) Работаю: \n11) Телефон для связи: \n12) Страничка в Контакте:\
    \ \n13) E-mail: \n2. Одну или несколько фотографий; \n3. Демонстрационные аудиозаписи;\
    \ \n4. Демонстрационные видеоролики. \n\nПодробная информация о конкурсе:\nhttp://vk.com/club44431365\n\
    \nТелефоны для справок\n +7 (963) 313-55-88 \n+7 (911) 287-19-02"
