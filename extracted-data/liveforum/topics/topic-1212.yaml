  text: 'На выходных заходил в Союз, купил диск сравнительно известного исполнителя.
    Все такое правильное, традиционно-дельта-чикагское, мелодии знакомые, только подписаны
    исполнителем и продюсером. :^) Ну, это не ново. :^) И есть такая песенка, что
    даже на вкладыш помещена (из-за нее одной можно было диск покупать)! :^)


    It was a dream, dream I had last night,

    I dreamt I went to the UN and set the whole nation right.


    I dreamt I called on old Castro, stood him on the floor.

    Looked him right in the eye and said, "Boy, you gotta go.

    I''m tired o'' your foolishness and if you dent behave,

    I''m gonna grab you by your beard, give you a Georgia shave".


    Then I told old Krushcheev, sittin'' there lookin'' bad,

    "Get that junk outa Cuba before you make me mad.

    Take off them missile bases, take them planes and all,

    Or I''ll grab me a bat, use your head for the ball.


    Then into Washington they called me and I went

    There to be the guest of the President.

    He said, "***, I''m glad to see ya, so glad you come down here

    To help me run the Russians from the Western Hemisphere".


    I said, "You can run the country, I''m gonna run the Senate.

    I''m gonna mate a few changes, put a few soul brothers in it,

    Ray Charles and Lightning'' Hopkins, a guy like Jimmy Reed,

    Bo Diddley and Big Maybelle be all I need".


    Кто исполняет? :^)'
