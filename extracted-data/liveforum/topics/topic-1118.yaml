      subject: Ответ
      deleted: false
      text: 'Насколько я знаю, в связи с тем, что "Газпром" никак не может определиться
        с тем, что же ему делать с пакетом акций ЭМ, А.Венедиктов объявил о своём
        уходе с радиостанции. С ним же уходит и часть журналистского коллектива. Уже
        зарегистрировано и выиграло конкурс на новую частоту (87,5 МГц) радио "Арсенал",
        куда и переходят все вышеперечисленные лица. Мощность единственного передатчика
        "Арсенала" принципиально слабее нынешних передатчиков ЭМ, а расположен он
        в Мытищах. Из-за этого южные районы Москвы могут в принципе оказаться неохваченными.
        Что будет происходить на ЭМ, совершенно непонятно. Отсюда-то и вопрос о судьбе
        ВЭБ''а.

        Возможно, я в чём-то ошибаюсь. Думаю, что А.Евдокимов лучше прояснит ситуацию.'
