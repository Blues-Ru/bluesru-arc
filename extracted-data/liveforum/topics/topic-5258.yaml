  text: 'Всем привет.Дело было сегодня вечером а именно 19 августа 2016 года. В районе
    21.00 приехал на автомобиле в это кафе поужинать и согреться... погода не очень...осадки
    прошли. Разместился за привычным столиком на улице.. не люблю помещения. Заказал
    у официанта в вежливой форме Облепиховый чай, шашлык и Жареный картофель.. В это
    кафе я заезжаю не редко и нравится кухня, приятная музыка и теплая атмосфера...
    поужинал. Очень все понравилось. я рассчитался и оставил чаевые. НО... с счетом
    ко мне подошел администратор Д...я и попросила не появляться мне больше в этом
    заведении и что впредь мне вход сюда закрыт. На вопрос почему, я получил ответ
    что заведение теперь работает только по пригласительным картам которые к сожалению
    кончились. У меня вопрос: как можно получить эту карту и что происходит??? может
    это личная неприязнь или перепутали меня с кем то?! Вопрос к хозяину Заведения:
    могу ли я вас попросить помочь разобраться в данной ситуации. Я готов не приходить
    к вам и мои друзья тоже, только скажите это прямо и причину а не выдумки противоречащие
    Конституции и закону потребителей. Очень неловко все получилось...'
