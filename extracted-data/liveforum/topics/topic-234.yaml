      text: 'Увы, за несколько посещений NYC ,мне только один раз посчастливилось
        увидеть,услышать и даже немного поиграть с очень похожим дедком. Но поверьте
        на слово, дедок тоже был еще тот (хорошо за 60). Когда он в разговоре уразумел,что
        я из Москвы (той, что на Северном Полюсе)и тащусь от его музыки, он настолько
        охренел ,что предложил мне поиграть с ним на его гитаре,а я охренел на столько,что
        согласился....

        Дед знал много стандартов и классно пел и играл на гармошке. Что еще надо
        для счастья... Лето в NYC, Гринидж Виллидж, черный,хриплый  блюзовый дед ,холодное
        пиво и блюз...

        Заработали мы с ним около 30 баксов за час (я свою долю не брал,за что был
        осмеян дедушкой) и большего удовольствия от собственного участия в блюзе (плохом
        или хорошем, это другая тема)я не получал... А так,в основном на улицах играют
        небольшие джазовые (иногда очень не слабые) составы, много латинской музыки,легкого
        рок"н"ролла и рэпа. Естественно,это мои впечатления и может кому нибудь с
        уличными блюзменами повезло больше...'
