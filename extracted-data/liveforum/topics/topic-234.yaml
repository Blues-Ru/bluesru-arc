    text: То Malclom - не, не тот, тот был Флойд Каунсил. А на Флойде Ли была во второй
      день уличного фестиваля. Отнюдь не старый дедушка выступал вместе с очень классной
      биг мамой Кларой (пели на два голоса), у которой в тот день как раз был день
      рождения, так что "Happy birthday" всей толпой было пропето не один раз. Флойд
      очень душевно и без всяких прикрас исполнял среднетемповые блюзы, но, правда,
      всякий раз сбивался на общение и переклички с публикой - в общем, настоящий
      шоумен. Не только с камерой бегал, но и танцевал, взбирался на стулья и прочие
      возвышенности, откуда и продолжал петь. В перформанс очень удачно вписался Вовка
      Кожекин со своей гармошкой, а вот ритм-секция (тоже из наших молодых) весьма
      страдала незнанием материала и неумением схватывать на слух. Игра же самого
      Флойда на гитаре отличалась сугубой минималистичностью. Но как пел! Отдельное
      шоу было устроено из продажи компактов Флойда и сочувствующих. В общем, очень
      весело и драйвово, настоящий блюз. Плюс всеобщая атмосфера гуляния и праздника,
      пусть даже в отдельно взятом загоне (территория была огорожена сеткой) и с пивом
      за 90 р. Мб, и в самом деле в Нью-Йорке такие Флойды на каждом углу? Кто там
      был - поделитесь информацией, плиз.
