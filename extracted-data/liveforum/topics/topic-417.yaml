      text: секьюрити вполне внушительные стоят. обычно в концу концерта пол залит
        пивом, но его пытаются подбирать швабрами. Это самая большая неприятность
        (мы тут не звук обсуждаем) в МДМ можно было выбрать уголок по вкусу - бесится
        перед сценой, толкаться, танцевать подальше от сцены, можно было сидеть на
        ступенечках, можно сидеть за столиками, наконец - был балкон. Практически
        полная возможность выбрать себе местно по вкусу. Правда, звук нормалный только
        в небольшом треугольничке точно перед сценой. Как будет в Дружбе - не знаю.
        Но секьюрити будет пруд-пруди. Это к доктору не ходи, прямой счас тебе скажу.........
        Да и звук там вряд ли будет лучше. Это обычновенный круглый цирк с железной
        крышой и массой железных деталей архитектуры. Не думаю, что об акустике будут
        особенно печься.
