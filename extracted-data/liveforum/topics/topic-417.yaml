  text: "Простите,немного не про блюз, но зато про будущий фестиваль.\n\nНа прошлых\
    \ фестивалях (в МДМ) было все более менее понятно: столики, барные стойки с пивом\
    \ и сцена. Можно было попить пивка, разогреться и потом вставать и идти поближе\
    \ к сцене (а кому то и просто сидеть и слушать музыку прикайфовывая).  \n\nК сожалению\
    \ на Blues Summit не попал, поэтому не знаю что предстоит увидеть внутри. Вот\
    \ и приходиться спрашивать \"А как будет сейчас на 13th Efes Pilsener Blues Festival\
    \ 2002!??? Стлики или стоя все 5 часов? Пиво будет не спорю, а как с WC?:)\"\n\
    \nЗ.Ы. Вроде бы пивной фестиваль."
