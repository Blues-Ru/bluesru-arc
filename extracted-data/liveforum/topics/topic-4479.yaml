  text: "Случайно попал в весьма известный джазовый клуб Blue Note в Greenwich Village\
    \ в Нью-Йорке на блюзовый концерт. Достаточно завернутый блюзовый гитарист Robben\
    \ Ford пригласил очень завернутого джаз-рокового гитариста John Scofield поиграть\
    \ блюз в джазовый клуб, что было достаточно неожиданно. Я изначально подумал,\
    \ что они будут упражняться в странных гармониях и играть сложную музыку. \n\n\
    Почти так и получилось: они эстетствовали, но исключительно на блюзовые гармонии.\
    \ В качестве темы каждый раз была какая-нибудь сложная гитарная аранжировка с\
    \ кучей нюансов, это было очень интересно слушать. Две гитары играли очень мощно\
    \ в большие комбики, Скофилд хорошо показал себя в блюзовой импровизации, но,\
    \ естественно, не ограничивал себя какими-то рамками. При этом отлично корчил\
    \ физиономии, когда выделывал какие-то необычные штуки. Роббен Форд тоже знает\
    \ все эти аккорды, но он играл в большей степени рок-забойно, все время улыбался\
    \ и с уважением смотрел на старшего товарища. С музыкальной точки зрения местами\
    \ казалось, что я попал на блюзовый концерт сразу двух ранних Арсенов Шомаховых.\
    \ ;)\n\nКонцерт в таком составе у них был первым. Второй совместный концерт они\
    \ играли там же через 2 часа. Одно отделение на 1ч15м, на чем все закончилось.\
    \ \n\nBlue Note - популярное туристическое место, туда набивается за столики 300\
    \ чел плечом к плечу в прямом смысле слова, им дают выпить-закусить, послушать\
    \ концерт, после чего всех выгоняют, чтобы пустить новых людей на второй такой\
    \ же концерт за одну ночь.\n\nСтранная традиция, но что делать, если они не успевают\
    \ деньги собирать. Я такое видел кроме Blue Note также в B.B.King в New York City\
    \ и Biscuits & Blues в San Francisco."
