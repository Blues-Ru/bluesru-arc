    text: 'Спасибо ещё раз Диме Казанцеву (Dr. Nick) за ссылку.

      Вот что узнал из http://www.heyjoe.org/lyrics.html :

      William Moses Roberts Jr. был белый, возможно играл на гитаре, кажется курил,
      похоже что знал нотную грамоту (надо же!). В 1962 он зарегил свою песню Hey
      Joe (та самая!).

      Но тогда кто же такие Chet Powers, Jesse Oris Farrow, Dino Valenti (Valente)?
      Ведь они иногда значились в кредитах именно этой песни!

      Но больше всего поражает на том сайте список исполнителей которые её когда-то
      играли: более 400! Среди них: Allman, Duane; Bad Company; Byrds; Carr, Eric
      (если не ошибаюсь из Kiss?); Cher; Clapton, Eric (Blind Faith); Dave Matthews
      Band; Deep Purple (2 versions); Duarte, Chris; Dylan, Bob (!!!); Gilbert, Paul;
      Gilmour, David feat. Seal; Hendrix, Jimi; Kinks (Hey Donny); Kiss; Kravitz,
      Lenny; Kravitz, Lenny and Healey, Jeff (!!!); Lee Albert and Shack; Lennon,
      John (!!!); Led Zeppelin (Band of Joy); Los Lobos; Murphy Eddie (тот самый?);
      Nick Cave and the Bad Seeds; Offspring; Procol Harum; Red Hot Chili Peppers;
      Rising Force (feat. Ingwie Malsteen) (да уж!); Rivers, Johnny; Sambora, Richie
      (ба! знакомые все лица); Satriani, Joe & Rodgers, Paul; Smith, Patty; Springsteen,
      Bruce; Ten Years After; Warlocks; Who (2 live versions); Yardbirds; Frank Zappa
      Mothers of Invention (Flower Punk) (бездумненькая пародия)...

      To: Grem. Есть у меня The Leaves - Hey Joe. Этакая смесь бита с психоделией.
      Та же песня, с той же гармонией, но с несколько отличным от хендриксовского
      текстом.'
