  deleted: false
  text: 'Все знают Hey Joe в исполнении Jimi Hendrix.

    В моей mp3-коллекции она есть в исполнении Deep Purple, Led Zeppelin, Lenny Kravitz,
    Body Count with Ice T, Willy De Ville, Leaves (запись, кажется, начала 60-х, до
    Джими).

    Но я никак не могу найти её в исполнении автора. В разных источниках указываются
    Chet Powers, Jesse Oris Farrow, Dino Valenti, но чаще всего Billy Roberts. Есть
    также предположение что это один и тот же человек.

    Так вот, кто нибудь сможет ли прояснить вопрос Кто же автор Hey Joe? И ещё, существует
    ли запись песни в авторском исполнении или он был ли только сочинителем?'
