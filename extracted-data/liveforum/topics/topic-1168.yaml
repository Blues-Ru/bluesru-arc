      subject: Roberts (он же Powers, он же Farrow, он же Valente) - плагиатор?!
      deleted: false
      text: 'Елы-палы! Да здесь почти криминальная история! Я ещё больше запутался:
        Hey Joe - traditional song (народная?), но не это столь интересно. Похоже
        что Chet (or Chester) Powers, Jesse Oris Farrow и Dino Valente - на самом
        деле одно и тоже лицо. Billy Roberts украл мелодию у своей подружки (тоже
        сочинительницы песен), добавил свои слова. Но судебной тяжбы не последовало
        т.к. на записи значилось имя Dino Valente (и вроде бы это и есть Billy Roberts).
        Впрочем вот читайте: "история песни до Хендрикса" и "Кто Есть Who"

        http://www.heyjoe.org/index.html

        Hey Joe - Introduction

        "Hey Joe", a traditional song performed by many artists. Sometimes credited
        to Billy Roberts. Sometimes credited to Chet (or Chester) Powers a.k.a. Jesse
        Oris Farrow, n&eacute;e Dino Valente who became the lead singer of Quicksilver
        Messenger Service.

        The first group to record "Hey Joe" was the Surfaris in 1965. In 1965 "Hey
        Joe" was recorded by The Leaves as well. In 1966 they recorded it again with
        a fuzztone guitar sound. Also the Byrds, Love, Shadows of Night, Warlocks
        and many other bands recorded the song in 1966.

        A Japanese group called the Golden Cups recorded a version in 1966 that adapted
        the song to different cultural standards.

        Tim Rose recorded "Hey Joe" in 1966, one month before the Leaves'' version
        entered the charts. Rose played the song at less than half the tempo. He changed
        the key of the song to E instead of A. Rose also roared out the verses, and
        added his own variant on their structure.

        Jimi Hendrix picked up this version of "Hey Joe" and made a European hit out
        of it in 1967.

        Since then many other great guitar players have performed this song.

        See also: Sixties Rock Garage , Psychedelic & Other Satisfactions By Michael
        Hicks (University of Illinois Press)

        Comment from Niela (Halleck) Miller, ex-girlfriend of Billy Roberts

        I would like to set the record straight about Hey Joe...the Untold Story.
        In the late fifties, Billy Roberts was my boyfriend for awhile. I was a songwriter
        and had written a song called "Baby Please Don''t Go To Town". It is copyrighted.
        He STOLE it from me, kept the melody and put different words to it. thereby
        turning it into Hey Joe. My music publisher at the time advised me against
        suing Billy because Dino Valente''s name appeared on the recording and it
        would have been a long and expensive process.

        Please let Billy know that whenever he wants to make amends, I would welcome
        it.

        Comment from N. Jama Santers (Dino''s "Old Lady" from 1976 to 1983)

        I just wanted you to know that I was Dino''s (Chet Powers) woman for 7 years.
        He recieved quarterly royalty statements from BMI and included in the numerous
        song credits and royalties was the song "Hey Joe". He was born on Oct. 7,
        1937 and he died on Nov. 16, 1994.'
