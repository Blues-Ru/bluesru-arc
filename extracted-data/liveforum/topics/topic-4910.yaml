  deleted: false
  text: "и случилось замечательное утро, друзья...\nАндрей Евдокимов поделился замечательным\
    \ эталонным мастер-классом по анализу \"вечнозеленого\" шедевра...\n\"Nobody Knows\
    \ You When You're Down and Out...\"\nвпервые я его услышал в исполнении Bessie\
    \ Smith (запись была корявой, но экспрессия потрясала)...\nуже много лет после\
    \ знакомства с этим блюзом я несколько усвоил, что надо постараться жить так,\
    \ чтобы, когда к тебе придут плохие времена, как можно меньше знакомых глаз оказались\
    \ повернуты в другую сторону...\nжизнь, к счастью, пока не позволила проверить\
    \ удается ли мне это...\nи не надо - прошу я у неё... \nчем хороши блюзовые нетленки\
    \ - тем, что они растут и взрослеют с тобой, с твоими мыслями, с твоим прожитым\
    \ опытом...\nи как пласт за пластом ты открываешь в тех же самых словах другой,\
    \ более глубокий смысл...\nтак у меня случилось с \"Key to the Highway\", \"How\
    \ Long Blues\" и несколькими другими блюзами...\nвот, допустим, после прочтения\
    \ замечательной статьи Андрея мне кое-что показалось в другом свете...\nдо этого\
    \ основным девизом этого блюза для меня было - выбирай внимательно людей для общения\
    \ - пройдут ли они то самое испытание When You're Down and Out...\nпосле урока\
    \ от Alberta Hunter с её save your money now! - мне кажется и в этом есть смысл\
    \ - не привыкай к хорошей жизни, и не думай,что так и должно быть и будет - ведь\
    \ более естественным и распространенным состоянием для человека является ежедневная\
    \ битва за выживание...\nтаково естественное состояние человеческой жизни...\n\
    а жизнь like a millionaire бывает в жизни у каждого, хоть на краткий миг, но бывает...\n\
    не привыкай и не считай, что так будет всегда...\nбудь готов к тому, что все изменится...\n\
    \nhttp://www.blues.ru/news/2012/07/29/story988/"
