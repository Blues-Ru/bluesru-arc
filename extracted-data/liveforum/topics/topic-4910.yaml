              text: 'Jordan later said :- "Fleecie Moore''s name is on it, but she
                didn''t have anything to do with it. That was my wife at the time,
                and we put it in her name. She didn''t know nothin'' about no music
                at all. Her name is on this song and that song, and she''s still getting
                money."


                However, by the time of that quote, Jordan and Moore had divorced
                after a number of arguments in which she had stabbed him with a knife.


                Moore was Louis Jordan''s wife, and was sometimes given credit on
                songs which Jordan himself had written to get around music publishing
                restrictions.'
