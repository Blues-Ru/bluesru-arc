  text: "Джазовый трубач Уинтон Марсалис любит играть как-то очень престижно. Впрочем,\
    \ у него есть на то необходимые предпосылки. Многие годы он ведет статусные концерты\
    \ под лозунгом Jazz at Lincoln Center. В 2007 г. в этом центре он записал альбом\
    \ \nс корифеем кантри Уилли Нельсоном  Two Men with the Blues. В 2010 г.там же\
    \ он записал альбом с Эриком Клэптоном (и, к слову, в прошлом же году принял участие\
    \ в записи альбома Эрика Клэптона с небанальным названием Eric Clapton). \n \n\
    премьера записи концерта в качестве фильма состоится в американских кинотеатрах\
    \ 7 сентября, и вслед за этим появятся DVD и CD.\n\nподробности на английском:\
    \ http://www.wyntonmarsalis.org/2011/08/09/wynton-marsalis-and-eric-clapton-play-the-blues-in-movie-theaters/\
    \ ; или на русском: http://www.runyweb.com/articles/culture/music/wynton-marsalis-and-eric-clapton-play-the-blues.html\
    \ ."
