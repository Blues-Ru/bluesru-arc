  text: 'Вчера прошел концерт Milteau на фестивале "Усадьба Джаз". Команда замечательная,
    парочка чернокожих ребят фантастическая. Народ завели моментально.

    Программа польность соответствовала альбому "Soul Conversation"- т.е. блюза практически
    не было, правда вместо сногсшибательной Beamont Lafayette сочиненной Milteau исполнили
    единственный блюзовой стандарт (в забойной манере) -  всемирно известную Why Are
    People Like Thaht? Роберта Чарльза. После концерта все кто хотел сфотографироваться
    и получить автограф маэстро и членов его команды  сделали это беспрепятственно.
    Последний (одноименный) диск продавался у входа - 600р. Короче - великолепное
    по качеству и энергетике шоу!'
