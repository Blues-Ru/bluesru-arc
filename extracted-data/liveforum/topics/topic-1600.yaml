  text: 'http://www.allmusic.com/cg/amg.dll?p=amg&uid=UIDMISS70311232218241381&sql=Arf9us38ba3xg


    Это шестой студийный альбом Кинга на Стаксе. Именно с него начинается всё это
    великолепие звука и аранжировок музыки Алберта. Создавать этот шедевр Кингу помогали
    ребята из Bar-Kays и Movement (группа и марка Айзака Хейза) - монстры и гении
    соул-фанк музыки на Стаксе.


    На альбоме 8 треков на 40 минут. Великолепный звук и продюсирование вообще. Гитара
    Алберта звучит очень убедительно, это уже не ранний сырой звук, но очень оригинальный
    и узнаваемый саунд. Тут есть всё: великолепный звук оргАна, духовые, перкуссия,
    подпевки, очень серьезная ритм-секция. Очень увлекательная звуковая палитра. На
    альбоме просто нет слабых треков и звуков. Я лишь хочу выделить несколько треков:
    I''ll Play The Blues For You (Parts 1 & 2); Breaking Up Somebody''s Home; I''ll
    Be Doggone.


    Оценка 5 баллов. Благодаря своему стилю соул-фанк-блюза и Стаксу Кинг продолжает
    удерживать само понятие БЛЮЗ на хорошем уровне популярности. На самом же деле,
    Кинг перешагнул границы блюза и расширил его возможности больше, чем кто либо
    еще до или после него.'
