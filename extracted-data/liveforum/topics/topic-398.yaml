  text: 'Вчера в маленьком (вместимость 200 чел.), но очень приятном клубе "The West
    End Centre" города Алдершот UK, проходил очередной концерт "королевских змииий"
    Пола Лэма. После концерта поговорили о предстоящих гастрольях в Москве. Я был
    приятно удивлен как он "is looking forwards to have a great pleasure to play in
    Moscow again".

    Москвичи одни из самых "горячих" слушателей в мире не то что "все видел-слышал-удиви
    менья" Англичан (приходится очень много работать над собой чтоб их удивить - неплохая
    дисциплина кстать!).

    Вспомнил он многих лично. Короче - привет вам и огромного каефа от предстоящих
    концертов.'
