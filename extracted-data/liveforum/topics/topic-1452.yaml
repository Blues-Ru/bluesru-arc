      text: "за это \"безобразие\" организатором надо памятник ставить.\n\nочень жаль\
        \ что тяжело прошел концерт на стадионе, и с пивом \nнеудача и с погодой облом.\
        \ но между прочим в клубах\nритмблюз, форте и крымские каникулы были великолепные\
        \ выступления\nи нокаут-грега и блюзшакс и дилейна. \n\nчтото прошло не так\
        \ как хотелось, еще и Дилейн заболел. музыканты\nустали под конец, но всеравно\
        \ даже смешно говорить, \nсюда привезли три очень сильные команды. сделали\
        \ большой и много маленьких концертов, попытались изо всех сил начать здесь\
        \ делать то, что тут никто не делает, плотный разнообразный по исполнителям\
        \ фестиваль  _мирового_ уровня. попытались смешать наших _лучших_ исполнителей\
        \ с западными. (хотя и не обошлось и без жеста доброй воли в сторону признаных\
        \ российских блюзменов). попытались создать ощущение\nтого, что нашему слушателю\
        \ пока очень мало знакомо. ну нет у нас хороших фестивалей. (Кроме эфеса,\
        \ но он имеет совсем иной статус и приницпы). \n\nсмешно говорить, ах как\
        \ мало у нас любителей блюза, ах они не пришли на стадион. да глупости - на\
        \ стадион не наберется никаких любителей блюза, на стадион конечно хотелось\
        \ чтоб пришли обычные люди - попить пива и оттянутся под хорошую музыку. и\
        \ вообще на всех концертах даже в клубах, у нас 90% именно таких людей.. а\
        \ не любителей.\nбОльшая часть любителей сидит дома и говорит, ах это не тот\
        \ исполнитель, которого я б ща послушал, ах да ну этот шумный клуб.\nдля таких\
        \ любителей оптимальным является вариант, когда они смогут, перекладывать\
        \ живые выступления музыкантов, как пластинки в домашей коллекции. \nблюз\
        \ это живая музыка, живая энергия, она должна идти от исполнителя,\nи возвращаться\
        \ ему от слушателя. и такие слушатели гораздо скорее появется с больших фестивалей\
        \  типа очаково и эфеса, а домашние ценители музыки, чаще всего и на концерте\
        \ сидят  как мертвые,\nтолько поглощают энергию исполнителя.\n\nвообщем  я\
        \ был на 4х концертах. помогал всем чем мог. получил \nморе удоволствие, кучу\
        \ головной боли и усталости. было очень много классного, что можно воспринимать\
        \ на прямую.\n\nкстати кто хочет увидеть конкретного исполнителя как каком\
        \ нить следующем фестивале, я думаю может сам обратиться к организаторам\n\
        и за за сумму в районе $10000-15000 осуществить свою мечту.\nэто подороже\
        \ чем диск в пурпурном легионе купить, однако говорят некоторые и так отрываются......."
