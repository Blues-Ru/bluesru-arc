    text: "Как мне казцааа любой фестиваль такой направленности это праздник...\n\
      И в любом случае преогромнейшее спасибо и участникам и зрителям и в первую очередь\
      \ ОРГАНИЗАТОРАМ фестиваля!!!! \nКак бы все не ныли, ах вот бухла не было, ах\
      \ вот  те не так выступили, праздник состоялся (во всяком случае для очень многих).\n\
      Теперь конкретнее (мнение лично мое,но в большей части для BLUESMAN - скромненький\
      \ ник такой, без претензий и выпячивания :-))\n1. Минчане - одна из наиболее\
      \ блюзовых по духу и по стилю групп на просторах пост советского пространства.\
      \ Любителей запилов и надрывного поскуливания просьба не беспокоиться - у минчан\
      \ этого нет.\nНо... великолепное чувство стиля и любовь к тому, что они делают.\
      \ \nУ них правильный подход - ребята, это просто блюз...не более и не менее\
      \ того... Они (по моему) более клубные музыканты и их музыка подразумевает некую\
      \ джук-джойнтовость (прости Господи!), а не холодную,трезвую погоду на стадионе\
      \ с выкриками ХУЧИ КУЧИ МЕН ДАВАЙ!!!\n\n2. Насчет немцев согласен по сути, но\
      \ не по форме. Добротная белая подача (а другой и быть  не может), культурная\
      \ форма исполнения, для меня холодноваты....На сейшене в Алабаме понравились\
      \ больше чем на стадионе...\n\n3. Blues Doctors - очень хороши были на стадионе.\
      \ И драйв есть и стиль присутствует , хотя это и не моя музыка...Только не могу\
      \ понять как их можно сравнивать с немцами, совершенно разные по стилю и смыслу\
      \ составы...\n4. Шведы - да отточены,но не в этом же суть...По мне они такие\
      \ же (или чуть выше) чем немцы.... Отлично басист на спине играл :-))\n5. Ломидзе...\
      \ Для начала, Mr.Bluesman попробуйте (Вам как эстету это будет не сложно) базар\
      \ фильтровать. Что это - ни мозгов, ни вкуса...\nПользоваться тем, что люди\
      \ Вам не ответят (а в принципе и отвечать некому - Bluesman... клевый ник!)\
      \ не красиво... Хотя, конечно и трех месячный контракт по штатам они получили\
      \ лишь благодаря кавказским связям. Наверное, они просто подкупили всех там,\
      \ чего говорить...То что делают кузены это так-же не моя музыка,но пораскиньте\
      \ мозгами (стараюсь придерживаться доступного Bluesman стиля)и постарайтесь\
      \ порадоваться тому, что хоть кто-то, пусть не любимый Вами получил признание.\
      \ Хотя ,это и сложно...\n6.Сборная - не знаю, не слушал....\n7. Ди Лейн - таких\
      \ музыкантов побольше бы привозить к нам, глядишь и BluesmanЫ появятся... Не\
      \ слушал его в R&B ,но на стадионе он был на очень высоком уровне. В Форте у\
      \ него была очень высокая температура и многие просто не вышли бы на сцену,\
      \ но честь и хвала ему - он своих слушателей уважает. Запилы...ха-ха...Этим\
      \ грешат фраера, у Ди Лейна это были соло на гитаре... \nМне,кроме всего прочего\
      \ посчастливилось присутствовать на саунд чеке перед его выступлением в Форте.\
      \ Пять великолепных, старых блюзов было исполнено во время отстройки звука.\
      \ На мой вкус, это один из самых настоящих блюзовых музыкантов которые приезжали\
      \ к нам. Я только не согласен с характеристиками данными ему до его приезда.\
      \ Ни какого авангардизма я лично не услышал. Этакий, классный электрический\
      \ блюз с неимоверной подачей и драйвом. Да были слышны (не часто) и Воэн и Хендрикс\
      \ и даже Джимми Роджерс, но он и не скрывает своих привязанностей. Мое личное\
      \ мнение и никому его не навязываю....\nЕще раз хочу поблагодарить всех кто\
      \ был причастен к этому фестивалю,\nа то, что бухла на стадионе не было это\
      \ мы наверстаем...."
