    text: 'На мой малоискушенный взгляд, ребята из Минска - самое интересное на сегодняшний
      день явление на постсоветской блюзовой сцене, и слово "посредственность" - категорически
      не про них. Слушайте больше разного блюза высшей пробы, и поймёте.

      Моего мнения не меняет тот факт, что я с огромнейшим уважением отношусь ко всем
      нашим музыкантам, играющим у нас блюз, а тем более сделавшим в этой области
