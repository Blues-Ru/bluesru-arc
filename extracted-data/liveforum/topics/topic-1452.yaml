  text: "Всем привет.\nВремени мало - пишу кратко.\nВпечатления - по порядку:\n1.\
    \ Минчане - к сожалению, очень посредственная группа. \n2. Немцы - лучше, но тоже\
    \ так себе. Средний уровень.\n3. Блюз Докторс - все, вроде, в порядке. Но народ\
    \ заскучал. В отличии от немцев которые зажгли таки зал в конце рок-н-роллом и\
    \ свингами. У БД одна беда - очень уж прямолинейно все. Не хватает группе чего-то.\
    \ Это уже словами не объяснишь.\n4. Шведы - это просто супер-класс. Лучшая группа\
    \ которую я слышали живьем! Портясающий гитарист. Великолепная духовая секция\
    \ - супер-профессиональные аранжировки. Сыграны - феноменально. Все отточено до\
    \ предела. Выглядят шикарно. Просто умопомрачительное выступление.\nГвоздь программы,\
    \ одним словом.\n5. Ломидзе - без комментариев. Единственный плюс - у него есть\
    \ драйв. Грузин - темперамент не спячешь :-)))))) Но мозгов и вкуса - ноль. \n\
    6. Сборная - лучше бы они этого не делали.\n7. Д.Д.Л. - к сожалению, самое большое\
    \ разочарование фестиваля. Очень посредственный исполнитель. Думаю что организаторы\
    \ приглашая его руководствовались прежде всего невысокой ценой. Жаль - опошлили\
    \ финал неплохого действа. \nПозже - подробнее, если кому интересно.\nУдачи всем."
