        subject: значит то,..
        deleted: false
        text: '...что лично мне они наиболее интересны, и вот чем. Если современный
          блюзмен зачастую идёт к блюзу от рока или современного электрического блюза
          (что не плохо, но - просто реальность), то эти ребята выбрали не традиционный,
          и на мой взгляд, очень верный путь - обратились к корням блюза, т.е. к блюзу
          как он изначально есть пошёл. Причём обратились не втуне, а совершенно органично
          восприняв манеру и приёмы блюзовых архаиков. И гармоника, и гитара, и слайд,
          и вокальная подача - всё у них "оттуда", и даже то, что они, как пишет Kotmrs
          "в стиле Петра Мамонова разыгрывали эпилепсического полудурка" - становится
          более понятным, если вспомнить воспоминания современников о выступлениях
          не Мамонова, конечно, но - Чарли Паттона и Томми Джонсона...

          И уж если сами Роберт Джонсон и Мадди Уотерс когда-то копировали  блюзменов
          старшего поколения - а результаты нам известны; то обращение наших современников
          напрямую к тем же образцам как минимум является очень интригующим экспериментом,
          весьма небезынтересно, и я бы всячески приветствовал.

          Ну а сверх того - у ребят всё очень классно получается! и кажется, не один
          я так считаю.

          ----

          Но по поводу "самый - не самый" со мной очень трудно разговаривать. Мне,
          в общем-то, нравится всё. Слушал вчера вслед за ребятами из Минска Юрия
          Каверкина - замечательнейшее выступление, тонкое чувство материала, прекрасная
          игра, захватывающие соло - море удовольствия!.. Следом Станция Мир - отлично!..
          Следом непредвиденный джем с немцами - улётнейше просто!.. Тут многие прохаживаются
          по поводу Левана Ломидзе - а я как-то забрел на его выступление, и получил,
          опять же, большое удовольствие.

          Стилистики разные, да; манеры разные, системы координат разные. И та, в
          которой работают минчане - наиболее близка и интересна лично мне. Ну так
          и мнение было высказано субъективное, и акцент на этом - сделан. А вообще
          - больше блюзменов хороших и разных! Пусть будет и Хучи-Кучи Мэн в несметных
          количествах, - и аутентичный минский Walkin'' Blues, хотя бы иногда.

          Просто к Хучи-Кучи Мэну публика уже более или менее привыкши, и принимает
          как родного; а вот архаику, для необходимого расширения этой самой публики
          кругозора, по-настоящему пытаются двигать пока что лишь эти четверо ребят
          из Белоруссии...'
