  text: 'Есть предложение по проведению встреч туссовки сайта в "реале": есть кофейня,
    с низкими ценам, фоновой музыкой (блюзами) в центре Москвы. Называется сие завдение
    "Блюз Транзит" и находится в Хрустальном переулке д.1 в здании Гостиного Двора.
    Там есть возможность проводить концерты всем желающим блюзменам. Со своей стороны
    обещаю дисконтные карты всем постоянным посетителям сайта и площадку для творческих
    экспериментов всем блюзменам.'
