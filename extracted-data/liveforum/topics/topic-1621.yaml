    subject: Когда в конце 80-ых, начале 90-ых
    deleted: false
    text: 'Когда в конце 80-ых, начале 90-ых слушал по Маяку (или по Юности) "В блюзовых
      тонах", я невольно представлял ведущего передачи (как, впрочем и представлял
      и Сэма Джонса (ВВС - "Бабушкин Сундук"), Севу Новгородцева (ВВС - "Севаоборот"),
      Евгения Аронова (Голос Америки - "Концерт Популярной Музыки")). Думалось  мне,
      что сим добрым голосом летящего на средней волне, говорит "в меру упитанный
      мужчина", лет этак 35, в очках, почему-то он всегда в свитере, когда он ведёт
      передачу сидя в студии в холодной Москве, то он попивает... чай :-( Почему чай???

      Когда в 2000 в Москве увидел его на Blues Summit мой этот образ разрушился (тоже
      самое было когда увидел Новгородцева). Оказалось, более чем "упитанный мужчина"
      :-) и почему то в тюбетейке (О Боже! И здесь её носят :о)

      Многое нам дали те передачи в ту пору полнейшего вакуума информации о блюзе.
      Именно в "В блюзовых тонах" я впервые услышал Etta James, Bonnie Raitt (до сих
      пор сохранилась у меня кассета с песнями из тех передач, совсем недавно Сергей
      Бабаев брал послушать её).

      Спасибо огромное за всё что вы делали и делаете.

      С днём рождения!

      300 фунтов счастья вам!'
