      subject: Нет. Не в этом дело...
      deleted: false
      text: "Не о том я. Просто в музыкальных училищах действительно есть курсы блюза\
        \ и джаза, только как правило преподаватели и авторы учебно-методологической\
        \ литературы СОВСЕМ не знают и не понимают что собственно негры внесли в мировую\
        \ музыкальную культуру. А выпускники их просто УБЕЖДЕНЫ, что то что им в течении\
        \ 2-4 лет втюхивали и есть блюз или джаз.\nПричем - катастрофически не способны\
        \ понять, что это \"не совсем так\" Как пример, одна (очень уважаемая) певица\
        \ - увлекается исполнением босса-нов. При этом СОВЕРШЕННО не понимая и не\
        \ ощущая чем джазовая триоль отличается от классической. В результате - вместо\
        \ очаровательной легкой музыки - тяжеловесная а-ля КСП. А поскольку певица\
        \ то уже популярная, заслужившая любовь и уважение - то никто и не скажет\
        \ ей - \"шла бы ты в \"ДК ЗАМОСКВОРЕЧЬЕ\", поучись лет 5, там тебя посадят\
        \ на необходимую ритмику (препы там это понимают и любят) - и будут у тебя\
        \ получатся те самые босса-новы\"\nС блюзом - еще сложнее. Музыкальных школ\
        \ где бы могли объяснить понятие \"блюзовый ГРУВ\" нет совсем. И беда то в\
        \ том - что и даже внутри нашей блюзовой тусовки - абсолютное большинство\
        \ наших \"блюзменов\" так и не сели на него. Есть \"навал\" заменяющий \"\
        драйв\", есть общая форма напоминающая блюз, есть \"исполнение классических\
        \ произведений\" из репертуара блюзменов. А блюза - НЕТ.\nКогда мне приносят\
        \ записи - я говорю - \"Ребятушки, чего проще, включаете Хукера, садитесь,\
        \ и играите вместе с ним\" \nНе пройдет и 2-3 лет (если конечно у вас есть\
        \ талант и будете играть часов по 16 в день, и каждый день) как этот грув\
        \ полезет у вас из ушей, и вы просто не сможете играть иначе (как играют наши\
        \ КСП шники в лесу у костра, или вся наша \"эстрада\" и \"рок тусовка\").\n\
        Но - увы. Никто, никто не внимает. Они все по прежнему убеждены что \"блюз\
        \ - это просто\" и что то что они играют на сцене в 12-ти тактовом размере,\
        \ с подтяжками на струнах, в блюзовой гармонии - это и есть БЛЮЗ. Как глухари\
        \ блин. Не докричишься."
