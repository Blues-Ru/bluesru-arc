  text: "Нашёл это здесь: http://magazines.russ.ru/novyi_mi/redkol/butov/opub/saks.html\n\
    ОТ САКСОФОНА ДО НОЖА - ОДИН ШАГ\n<i> Настоящая советская поэзия </i>\nП. Антокольский\n\
    Гибель класса\nВладельцы нефти, разносчики ваксы\nБританцы иль янки - мы англосаксы!\n\
    Сидят за круглым столом джентльмены,\nКак смерть мертвы,\nКак боги надменны.\n\
    ....................................\nЕсть у них новинки вроде хлопушек\nЕсть\
    \ хирургов и психиатров орда,\nЧтоб гноить детей, от страха распухших,\nЗаражать\
    \ любым столбняком города.\n\nЕсть у них про запас такие микробы,\nЕсть такой\
    \ рассадник кусачих блох,\nЧто мерещится им - на могилах Европы\nЗашумит некошеный\
    \ чертополох.\n\nЕсть у них тренированные в массовых драках\nЦиркачи и поэты в\
    \ лакейских фраках.\nЕсть у них философ, домашний дурак их,\nНа труды которого\
    \ студенты плюют.\nНаконец, в конурах, в лачугах, в бараках\nЕсть у них безработный\
    \ люд.\n\nКак же им напоследок не учесть векселей!\nКак не справить гибель свою\
    \ веселей!\nИ когда буги-вуги идет на эстраде - \nТанки движутся по автостраде.\n\
    И когда для хозяев старается джаз -\nЗагудел истребитель, кружась.\nИ когда саксофон\
    \ задыхается, блея, - \nГолосует за смерть Ассамблея.\nА когда плясуны попадают\
    \ в такт - \nЭто их Атлантический пакт!\n\nР. Парве\nНочные голоса\n... Тихонько,\
    \ чтоб сынишку не будить,\nЯ наполняю дом гуденьем РЭТа.\nОн хочет нашу юность\
    \ оживить,\nВесну и счастье. Полон песней этой\nНаш старомодный РЭТ.\n........................................\n\
    Вот в песне веет \"голубой платочек\",\nПрощаясь, сына обнимает мать\nИ с фронта\
    \ ждет таких родных ей строчек,\nВот \"Три танкиста\" - нам ли их не знать!\n\
    Ах, песни, песни!\nМного их забылось,\nНо все пережитое в них легло.\nТо - наши\
    \ песни....\n........................................\nНо слышишь? \n       Гнусной\
    \ музыкою джаза\nЭфир вдруг захлестнуло в мирный час.\nИ наши лица помрачнели\
    \ сразу,\nКак будто мрак обрушился на нас.\nВ каком-то кабаке, в дыму, в тумане\n\
    Визжит певица, скачет дикий джаз,\nНочной кутила - браунинг в кармане,\n\"Сверхчеловек\"\
    \ - уже пустился в пляс.\nСмотри - их голоса в моих руках.\nНастройку сдвину -\
    \ и уж нет на свете\nТой нечисти, что воет в кабаках.\nВновь полон дом наш тишиной\
    \ всегдашней,\nА на душе вернувшийся покой.\nДвенадцать бьют часы кремлевской\
    \ башни,\nИ мощный гимн плывет над всей землей."
