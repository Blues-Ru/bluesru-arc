  text: "С великодушного разрешения автора хочу представить многоуважаемой блюзовой\
    \ общественности только что подписанный в печать второй том из серии работ ПРИШЕСТВИЕ\
    \ БЛЮЗА - Delta blues vol.2 Валерия Фридриховича Писигина.\nНапомню - 1-й том\
    \ (http://www.collectable-records.ru/pisigin/vol6/) был посвящён отцам-основателям\
    \ дельта-блюза Чарли Пэттону, Сону Хаусу и Вилли Брауну, а также Томми Джонсону\
    \ - ярчайшему представителю блюзового комьюнити города Джексона, смешавшего дельта-блюз\
    \ с эксцентричными йодлями, которые в дальнейшем подхватил и превратил в свои\
    \ фирменные «волчьи» завывания Хаулин Вулф.\n Герои же второй  книги – добродушный\
    \ дельта-сонгстер Миссиссипи Джон Хёрт с необычно интеллигентной для Дельты манерой\
    \ игры и мягким «домашним» голосом  и пронзительный трагик Нехемия Скип Джеймс\
    \ из Бентонии, певший свои блюзы фальцетом и игравший в необычной минорной настройке.\n\
    \ Чуть было не написал, что Валерий Писигин был очевидцем и документальным фиксатором\
    \ описываемых событий из ранней истории дельта-блюза. Но, как это ни парадоксально\
    \ – так и есть. Пусть спустя почти век после того, как его герои  - гениальные\
    \ негритянские музыканты творили свою музыку. Валерий вместе со свои соратником\
    \ и редактором Светланой Брезицкой исколесил все мифические для исследователя\
    \ блюза уголки Дельты, проинтервьюировал потомков великих блюзменов, и поныне\
    \ живущих в Миссиссипи, изучил множество документальных источников по истории\
    \ блюза. И всё это обобщил в своей книге. \nЧто вызывает мой искренний интерес\
    \ к его работам – это удивительное смешение проработанного, по-научному тщательного\
    \ источниковедческого подхода  и бьющей через край эмоциаональности повествования.\
    \  Для автора блюзмены, о которых он пишет – друзья, товарищи, собеседники. Они\
    \ встают со страниц не сухими скелетами с табличками в несколько строк из музыкальной\
    \ энциклопедии, а живыми, смеющимися, тоскующими, отчаивающимися, радующимися,\
    \ и главное – играющими и поющими – свою жизнь. Свой блюз.\nБез которого бы не\
    \ было этого великого искусства, перетворившего музыкальную историю 20-го века.\n\
    Спасибо, Миссиссипи Джон и Скип Джеймс. Спасибо, Валерий Фридрихович!\n\nhttp://www.collectable-records.ru/pisigin/vol7/\n\
    \nСпасибо за интерес к данной теме Адрею Ордальонову и Юрию Ивановичу Костину."
