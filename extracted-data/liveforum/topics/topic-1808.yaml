    text: "Это старая песня и действительно folksong - \"народная\".\nSt. James Infirmary\n\
      Вариантов текста очень много, как у настоящей народной песни.\nВот вариант Кэба\
      \ Кэллоуэя (см. Блюз Бразерс ч.1)\n\nI'm went' down to St. James Infirmary,\
      \ \nI saw  my baby there; \nShe's stretched out on a long, white table, \nSo\
      \ cold, so pain, so fair. \n\nLet her go, let her go, God bless her, \nWherever\
      \ she may be, \nShe can search this wide world over, \nnever find another good\
      \ lovin'man like me. \n\nNow, when I die, bury me in my straight-leg britches,\
      \ \nPut on a box-back coat and a stetson hat, \nTwenty-dollar gold piece on\
      \ my watch chain, \nSo you can let all the boys know I died standing pat. \n\
      \nFolks, now that you have heard my story, \nSay, boy, hand me another shot\
      \ of that booze; \nIf anyone should ask you, \nTell 'em I've got those St. James\
      \ Infirmary blues."
