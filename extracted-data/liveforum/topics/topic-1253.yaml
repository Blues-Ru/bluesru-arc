    deleted: false
    text: "сидели у самой сцены и не оглохли. Звук был очень приличный (звезды так\
      \ расположились), ребята старались. Юля была  хороша практически во всех вещах.\
      \ А уж в некоторых была просто супер, учитывая то, что большинство вещей были\
      \ довольно сложными и по ритму и по стилистике. Гурген отыграл все чисто (даже\
      \ слишком:) и на подъеме, правда немного тихо (и такое бывает) в первом отделении.Этот\
      \ парень еще многих очень удивит.  В целом это было очень клево - они не похожи\
      \ на остальных и я очень надеюсь что они будут прогрессировать... Хороший басист,\
      \ хороший барабанщик,хорошая лид-гитара и очень хорошая певица - хорошая группа...Все\
      \ просто (Lord, have Mercy!), если не знать каких усилий потребовалось Юле Смолянин\
      \ воплотить этот проект в жизнь.   \n Наверное, были и накладки , но они у всех\
      \ бывают - я лично ничего особо криминального не заметил. Мне понравилось...\
      \ Во всяком случае, это было свежо и от души... И как я слышал, народ в зале\
      \ это оценил!"
