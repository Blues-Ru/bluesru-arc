extra_text: 'Интервью Charlie Musselwhite для "Harmonica Happenings" Интервью Charlie
  Musselwhite для "Harmonica Happenings" Charlie Musselwhite (Чарли Масселуайт) не
  нуждается в представлении, он авторитетный харпер, с огромным музыкальным стажем.
  Вместе с Paul Butterfield он был первопроходцем гармоники в белом блюз-роке, сейчас
  же это признанный мастер, комфортно чувствующий себя в любых стилях. Ниже приведено
  интервью Чарли, которое провел Helmut "Hg" Cote для "Harmonica Happenings" , итак:
  HH: Чарли, прежде всего хочу поблагодарить за то, что Вы нашли время, чтобы дать
  интервью нашему журналу. Вы являетесь вдохновителем и примером для многих музыкантов,
  особенно для харперов. Кто был Вашим вдохновителем, кто вдохновляет Вас и сейчас?
  СМ: С самого начала я действительно очень любил музыку первого Sonny Boy (прим.перев.
  John Lee) , у меня была куча пластинок с его записями. Вообще-то, мне нравятся оба
  Sonny Boy (прим.перев. имеются в виду Rice Miller и John Lee, которые оба носили
  прозвище Sonny Boy, соответственно с приставкой Второй и Первый) , но Sonny Boy
  I все же привлек мое внимание первым. Мне также нравился Jimmy Reed . Я любил такой,
  более земной что ли, деревенский стиль. Will Shade (прим.перев. известный блюзмен
  первого поколения) был моим другом, мы играли у него дома. Позже, когда я подался
  в Чикаго Мемфиса, я сдружился с Big Walter Horton , у него я научился многому. Мне
  кажется, я переслушал всех музыкантов Мемфиса и Чикаго, если не в живую, так на
  записях. Сейчас я прислушиваюсь ко всем инструментам, каждому инструменту есть,
  что сказать. HH: Почему Вы решили играть на гармонике, сколько Вам тогда было лет?
  СМ: Я просто балдел от этого звука и чувства, которое можно в нее вложить. Кажется,
  гармоника всегда была со мной. HH: Гармоника была первым инструментом, который Вы
  освоили? СМ: Да, и еще всякие другие инструменты, которые я делал домашней утвари.
  HH: На каких инструментах Вы еще играете? СМ: На гитаре. HH: Многие музыканты рассказывают
  о своем обучении как о периодах взлета и застоя. Мне знакома эта ситуация, когда
  хочешь долго овладеть какой-то техникой, а потом, однажды - Бах! - и все получается.
  У меня так было с бэндом. Был ли у Вас такой прорыв в обучении, если был, то, что
  Вы пытались тогда освоить? СМ: Не могу припомнить ничего подобного. Тогда мы называли
  бэнд "сужением". Не помню, чтобы у меня были какие-то проблемы с бэндом. Мне он
  всегда казался естественным, сначала это был просто звук, который я мог извлечь
  харпа, позже он стал для меня частью мелодии, которую я делаю с помощью гармоники.
  HH: Хорошее объяснение, почему Вас считают "Маэстро". Играть блюз всегда было Вашей
  целью? Пытались ли Вы играть в других жанрах? СМ: Блюз - это моя любовь, но мне
  интересна любая музыка, у которой есть душа. HH: Какую музыку Вы бы хотели играть,
  делаете какие-нибудь эксперименты на этом поприще? СМ: Я всегда экспериментирую,
  думаю о том, что бы я смог сделать в будущем. Не хотелось бы разглашать все тайны.
  HH: О, понятно! Подождем и увидим. Теперь о блюзе, особенно об исполнении этой музыки
  на гармонике, это идет от души, от творческого центра? СМ: Это всё чувства и игра
  от сердца, это то, что делает блюз не просто музыкой, а чем-то большим. HH: Один
  популярный сайт пишет, что Вы Чикаго. Я не специалист, но мне кажется, что у Вас
  более южное произношение. Другие источники утверждают, что Вы Северной Калифорнии.
  Что этого правда? СМ: Я родился в Kosciusko, штат Мисcиcипи, вырос в Мемфисе, Теннеси.
  В 18 лет я переехал в Чикаго, где прожил 5 лет. Потом я подался в Калифорнию. Сейчас
  у меня есть дом в Калифорнии и в Миссисипи. HH: Где Вы предпочитаете находиться
  больше, когда не в дороге? СМ: Графство Сонома, Калифорния. HH: Сколько дней в году
  Вы проводите в дороге? СМ: Где-то 200 или 250. Но бывало, что и все 300. HH: Это
  очень много. У Вас есть семья, они ездят с Вами? СМ: У меня есть сын и дочь, внук
  и внучка. Моя жена - Генриетта, проводит много времени со мной в дороге. HH: Что
  самое сложное в судьбе путешествующего музыканта? СМ: Это, конечно же, возить за
  собой все это оборудование. И самое важное, это правильно питаться. HH: А что служит
  наградой за все эти сложности? СМ: Улыбающиеся лица фанов. Это важнее всего. HH:
  Где в Интернет можно почитать о Вашем оборудовании, расписании концертов и т.д.?
  СМ: Вы можете "отГуглить" мое имя, и найдете все, что вас интересует. У меня есть
  также вэб-сайт www.charlie-musselwhite.com . HH: Ха, "отГуглить" - замечательное
  слово! Оглядываясь назад, я вижу нить судьбы в Вашем творчестве, время от времени,
  она проступает на поверхность. Это композиция "Иисус Искупитель" Ваших ранних альбомов,
  работа с Five Blind Boys Alabama , заглавная песня альбома "Sanctuary" (прим. перев.
  с англ. "Убежище") . Ваша судьба влияет на музыку или это нечто другое? СМ: Это
  вдохновение, не обязательно религиозное. Я нахожу что-то в моем сердце. HH: А как
  это было - работать с Five Blind Boys Alabama? Какой это дало Вам музыкальный и
  жизненный опыт? СМ: Я обожаю работать с ними. Кстати, в создании их последнего альбома
  я принял участие (прим. перев. альбом называется "Atom Bomb" ) . Мне нравится выступать
  с ними, устраивать совместные туры, да и просто путешествовать. Мы хорошие друзья
  и я их очень уважаю. Они знают все о том, как нужно петь. Невозможно петь с большим
  чувством, чем они. Это очень большая честь, что Five Blind Boys Alabama записались
  на моем последнем альбоме. HH: Огладываясь на свою карьеру, Вы можете сказать, с
  кем было лучше всего работать? СМ: Сложный вопрос. Часто возникало такое чувство:
  "Как было круто!". Я люблю, когда это происходит неожиданно. Недавно, я участвовал
  в одном ТВ-шоу, там были преимущественно джазовые музыканты, мы играли то, что взбредет
  в голову, это было здорово. HH: Вернемся к Вашему последнему альбому "Sanctuary",
  в песне "I Had Trouble" Вы поете: "округ Кук" - это "очень опасное место". Очевидно,
  что речь идет о тюрьме округа Кук в Чикаго. Ассоциации, которые возникают - это,
  конечно, Джейк и Элвуд (прим. перев. имеются ввиду знаменитый фильм "Братья Блюз"
  , где один братьев - Элвуд, встречает выходящего этой тюрьмы брата Джейка) . Любопытно,
  слова этой песни как-то связаны с тем, что Вы были в этой тюрьме? СМ: Представьте
  себе, это было по-настоящему! Если коротко, то это произошло так: однажды ночью
  меня схватили копы и бросили за решетку. Не дали даже позвонить, офицер, арестовавший
  меня, наврал судье, и мне дали 30 дней. Я ничего не смог сделать. Они схватили меня
  по пути домой. Там, в тюрьме, на стенах были огромные надписи, которые декларировали
  права заключенных. Первым было - право на телефонный звонок. Шутка. Ты сам за себя
  в тюрьме и должен как можно быстрее завести друзей. Ха-ха-ха! Я не шучу! Если у
  тебя нет друзей за решеткой - у тебя большие проблемы. К счастью, друзья у меня
  были. HH: Да, теперь мне понятно истинное значение этой песни. Действительно страшное
  место! Давайте поговорим об оборудовании. Ваша усиленная гармоника - это то, что
  у широкой публики ассоциируется с настоящим чикагским звуком. Как всегда, разговор
  о звуке превращается в разговор об оборудовании. Как Вы считаете, насколько важно
  "снаряжение" для звука? СМ: Я считаю, что "снаряжение" - это вторично, найдите сначала
  "свой" звук физически. Затем усильте его! HH: Какие микрофоны и усилители Вы используете?
  СМ: Я использую Beyer M88 или старую "Зеленую пулю". Я не знаю, что там внутри.
  И я люблю Fender Twin (усилитель), иногда его называют "красная башка". HH: А теперь
  очень-очень личное. Вы используете блокировку губами или языком? СМ: Я использую
  обе блокировки. Переключаюсь с одной на другую при игре. HH: Вы предпочитаете диатонику
  или хроматику? СМ: Я бы сказал - диатонику, но хроматика тоже прекрасный инструмент.
  HH: Если бы пришлось вести семинар "Как звучит Чарли Масселвайт", что бы вы сказали
  студентам? СМ: Парень, я не знаю. Я не шучу. У меня нет ответа на эту загадку. Я
  не знаю ничего такого, что бы кто-то другой не мог сделать. Но, может быть, я просто
  не знаю. HH: Насколько важно исполнителю на губной гармонике понимать и владеть
  другими инструментами? Как насчет пения? СМ: Сложно сказать, я считаю, что нужно
  просто прислушиваться к своему сердцу. Это может привести к нужным знаниям. HH:
  Многие музыканты ограничивают себя только блюзом или джазом. Насколько важно расширять
  горизонты между блюзом, джазом или кантри? СМ: Это личный выбор каждого. Как я уже
  говорил, следуй за своим сердцем. Я всегда ищу музыку, которая "заводит" меня, я
  пытаюсь чему-то научиться, перенять от нее. HH: Я могу предположить, что Ваш любимый
  инструмент - это гармоника. А какой инструмент Вы любите слушать? СМ: Вокал. HH:
  Есть ли какие-нибудь планы на будущее? СМ: Я не люблю обсуждать что-то, пока я не
  сделал этого. У меня есть много идей, и в студии я посмотрю, что можно с ними сделать.
  Я не знаю, куда меня может завести музыка. Я пускаю это на самотек. HH: Оглядываясь
  назад, о чем Вы сожалеете, поделитесь с читателями. Если бы Вы смогли изменить одну
  вещь в своей жизни, что бы это было? СМ: Окэй, я уверен, что слишком много времени
  было потрачено на выпивку. Как бы я хотел вернуть это время. Лучше бы я не знал,
  что такое алкоголь. Я не пью уже 17 лет. Не жалею об этом ни на йоту. HH: Спасибо
  за откровенность! Хочется спросить, но я знаю, что вы не любите слово "самый любимый".
  Но все же, кто Ваш самый любимый харпер? СМ: У меня нет ничего самого любимого.
  Мне действительно не хватает таких ребят, как Big Walter Horton, Little Walter ,
  Sonny Boy и William Clarke . Сейчас я получаю удовольствие всякий раз, когда слышу
  своих друзей: Kim Wilson , Mark Hummel и James Cotton . Сегодня очень много музыкантов,
  которых мне действительно приятно слушать. Терпеть не могу перечислять кого-то,
  а потом вдруг осознавать, что кого-то упустил. Я считаю, что Howard Levy играет
  интересные вещи. Всем есть что показать. HH: Есть ли у вас "любимая" песня: блюз,
  гармоника или что-то еще? СМ: Опять "любимая"! У меня действительно нет самой любимой
  вещи. Но то, что первое приходит на ум - это "Palmer''s railroad" авторства Palmer
  McAbee. У меня до сих пор есть эта пластинка, я слушал ее в детстве. Я никогда не
  устаю от этой вещи, она прекрасна. HH: Могу предположить, что Вы хорошо знакомы
  со SPAH. Как Вы считаете, важны ли подобные организации, вроде местных представительств
  SPAH или сообществ любителей блюза? СМ: Я считаю, это здорово! Это действительно
  круто, когда люди собираются вместе, когда ими движет общий интерес. HH: К сожалению,
  наше время заканчивается. Я большой поклонник Вашей музыки. Я бы мог часами сидеть
  и болтать с Вами. Но оставим это для будущих интервью. Есть что-нибудь, что бы Вы
  хотели пожелать нашим читателям? СМ: Приходите на мои концерты. После концерта меня
  всегда можно увидеть продающим свои диски, болтающим с людьми. Просто подойдите
  и скажите: "Привет". Берегите себя и тех, кого любите. Перевод Константина Колесниченко.'
