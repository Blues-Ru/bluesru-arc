extra_text: Bob STROGER Russian Tour 2015 БОБ СТРОДЖЕР В МОСКВЕ "My name is Bob Stroger,
  they can call me anything they choose, well you can call me what you want, but my
  real name is the blues…" - Bob STROGER В минуты, пока я набирала первые слова этого
  текста, люди, о которых я хотела рассказать, вероятно, готовились играть очередной
  концерт. Где-то далеко. Новосибирск, Академгородок. Тур заканчивался, музыканты
  собирались по домам, кто куда - Чикаго, Барселона, Буэнос-Айрес - блюз, этот космополит
  от музыки, за сто с небольшим лет существования, кажется, пустил корни везде. Его
  идентичность размылась, и стало не так уж важно, какого ты пола, цвета кожи, и твоя
  национальная принадлежность не имеет особого значения - будь ты афро-американцем,
  испанцем, аргентинским евреем или благодарным русским слушателем. Так, к чему я
  обо всем этом? Прошло больше месяца с окончания гастролей Боба Строджера и его горячего
  аргентинского блюз-бенда под предводительством большого друга российской блюзовой
  общественности Омара Итковицы, послевкусие от пережитой череды гигов поистерлось,
  а слова наконец-то нашлись. Боб Строджер - живая легенда чикагского блюза - в России
  уже бывал в 2006 г., но только в Москве ( фоторепортаж >>> ). В пресс-релизах любят
  писать, мол, блюзмен как виски - с годами лишь становится лучше. В 2006 году я понятия
  не имела кто такой Боб Строджер, стало быть, сравнивать настоящего 84-летнего Боба
  с ним же самым образца почти десятилетней давности у меня возможности нет. Да и
  нужно ли это, когда концерты были замечательные, душевные, агрентинцы играли выше
  всяких похвал, а еще и истории разные приключались? Боб скорее напомнил мне университетского
  лектора в летах - удивительный опыт за плечами, которым он не прочь поделиться с
  публикой и младшими коллегами по цеху. Этот обмен знаниями и энергией - процесс
  обязательно двусторонний, он был бы невозможен без слушателей, последователей, и
  даже случайных зевак, представляющих о значении этого сухонького старичка для мира
  блюза лишь по рекламным буклетам, которые случайной опечаткой скидывают десяток
  лет с плеч Боба Строджера. Только почтенный возраст иногда напоминает о себе - молодежи
  Боб мог показаться скучноватым. Вечером среды, 27 января, в клубе Calypso, неожиданно
  выросшем среди промзоны в на крайнем юго-востоке Москвы, Боб Строджер вместе с аргентинцами
  давал первый концерт большого российского тура, который стал возможен благодаря
  антрепренёру Евгению Колбашеву и Омару Итковицы. Послушать легендарного блюзового
  дедушку в тот вечер пришли немногие (и я в их число не вхожу). По словам очевидцев
  было хорошо ( фоторепортаж >>> . Если Боб Строджер или даже Омар в представлении
  не нуждаются, то о других музыкантах сказать несколько слов все же стоит. Флавио
  Ригатоццо, он же Ла Тота, - мастер губной гармоники, аргентинец по крови, верноподданный
  Испании, по бумагам, в России выступавший в первый раз. Омейро Толоса, барабанщик
  Буэнос-Айреса, уже бывал в наших краях ранее. Не обошлось без приятных сюрпризов
  - к музыкантам присоединился Хосе Луис Пардо, на несколько дней прилетевший в Москву.
  Второй четырех московских концертов проходил в клубе Алексея Козлова, в стенах которого
  еще не привыкли слушать блюз. Привезти легендарного дедушку с компанией целиком
  преданных блюзу латиноамериканцев, собрать полный аншлаг и убедить несколько высокомерную
  закрытую корпорацию почитателей джазовой традиции в том, что блюз - это по меньшей
  мере здорово - миссия выполнена. Вечер удался даже несмотря на то, что пребывавший
  на сцене в компании бутылки Омар ко второму отделению сошел с дистанции, но его
  ученик и большой друг Хосе Луис взял ситуацию по контроль. Он смог бы и за троих
  сыграть, если бы пришлось. А пока некоторые боролись с зеленым змием, прочие кайфовали
  от блюза, происходившего на сцене. Молодые пары неуклюже, но очень искренне отрабатывали
  танцевальные па. Программа состояла стандартов и каких-то вещиц последнего альбома
  Боба Строджера, записанного вместе с молодым барабанщиком Кенни Смитом, сыном Большеглазого
  Вилли Смита, чье имя и барабаны гремели на весь Чикаго времен Мадди Уотерса. Боб
  говорит, что его настоящее имя - это Блюз. Можно поверить на слово. После концерта
  кто-то зала протягивает охапку роз старому блюзмену. Музыкантов ожидает еда, выпивка,
  но за кулисами толпится полно народу - у каждого имеются слова благодарности в обмен
  на фотографию с блюзовой легендой. Боб дружелюбен, он возвращается на сцену, уводя
  за собой толпу людей, раздает автографы и улыбки для очередного совместного фото.
  Под самую ночь букет роз будет подарен вашей покорной слуге, и все разъедутся, кто
  мирно спать, а кто вести интернациональные беседы о блюзе на крохотной кухоньке
  до самого утра. Пятничный гиг проходил в Би Би Кинге, играли тем же составом, что
  и днем ранее у Козлова. На один номер присоединился новосибирский гитарист Женя
  Коллини, заглянувший в тот вечер в клуб. Было людно, и когда во время исполнения
  кочующей программы в программу "Sweet so Sweet" Боб отложил свой бас в сторону и
  вышел в зал, публика оживилась. Как истый блюзмен Боб обращался к каждой даме, сидевшей
  за очередным столиком, и объяснялся ей своей музыкой, наверное, в любви. Ведь это
  блюз. А дальше по курсу очередная красавица. А еще через день, в воскресенье, музыканты
  уже без Хосе Луиса, улетевшего тем же днем в Мадрид, играли последний, четвертый,
  московский концерт. Площадка новая - клуб "Джем" в районе Бауманской. И публика
  другая, непривычная, зато без стеснений и жеманства. Играть начали необычно рано,
  Омар торопился успеть в Дом у Дороги на джем, который, к слову, оказался для ДуДа
  лучшим за последнее время. Концерт был хорош, музыканты играли безукоризненно, Тота
  покорил своей невероятно сочно звучащей губной гармоникой, Боб был в прекрасной
  форме. Щегольски одетый, неизменно в шляпе, украшенной лихим павлиньим пером, с
  не сходящей с лица доброжелательной тихой улыбкой и мягким взглядом, прячущимся
  за толщиной очков, простой в общении человек и Музыкант, будто бы немного уставший
  от этой большой буквы, - так выглядит в свои 84 года легендарный басист, чей приезд
  я так взволнованно ожидала. Хочется сказать спасибо Роберту, Омару и его друзьям.
  И отдельно поблагодарить Евгения Колбашева - за эти и другие им организованные блюзовые
  гастроли по России, за многие часы пережитой музыки. Кристина КОЛОСОВА 8 марта 2015
  г. Фото автора
