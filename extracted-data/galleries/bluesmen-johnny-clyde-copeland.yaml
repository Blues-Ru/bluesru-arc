extra_text: 'Johnny Clyde Copeland Johnny Clyde Copeland (27.III.1937 - 3.VII.1997)
  "Hey! I''m Johnny Copeland. Texas blues is my thing. I do the swing and the happy
  blues. Let everybody know we''re still workin'', we''re still puttin'' out and preachin''
  Texas Blues!" Серьезное сердечное заболевание у Коплэнда было диагностировано в
  1995г. Ему была проведена операция, установлен аппарат L-Vad, поддерживающий работу
  сердца. И была показана пересадка сердца. В этой жуткой очереди на трансплант он
  стоял два года. Под новый 1997 год была сделана пересадка и был установлен еще некий
  аппарат новой разработки (давайте не будем вникать в медицинские подробности). Все
  два года каждый день для Коплэнда мог реально стать последним. Вполне это осознавая,
  он продолжал сочинять музыку, продолжал выступать, не теряя энергии, всегда ему
  свойственной. - Я просто рад каждому дню. Я счастлив, что со мной всегда музыка.
  Нет причины для горечи. Со мной моя семья, которая поддерживает меня на 100%. И
  вы знаете, как я люблю музыку , - говорил он летом 1996 в радио-интервью, посвященном
  выходу его нового альбома "Jungle Swing". Альбома, который он открывает новым веселым
  блюзом: "Ready, Willing & Able" - "Готов, Хочу и Могу". Интервью вела журналистка
  Мэл Крамер, давний друг Коплэнда. М.Крамер: "Вы пишите сейчас что-то новое?" - Да,
  я работаю над новыми вещами. Но... Единственное, что нарушила моя болезнь, - это
  способность создавать. Именно здесь меня задело серьезно. Моим выступлениям она
  не повредила. Но, знаете, когда внутри тебя стучит все время L-Vad, это... М.Крамер:
  "Меняет твой ритм?" - Просто отвлекает внимание. Очередные гастроли Коплэнд провел
  и в мае-июне этого года. Во второй половине июня лег в больницу на, как это называлось,
  плановое обследование. К тому времени он уже прожил с этим новыи аппаратом больше,
  чем кто-либо до него, прошедший такую же процедуру. Операция прошла, как первоначально
  было объявлено, вполне благополучно. Осложнени начали развиваться только через несколько
  дней. 3 июля 1997 года Джона Клайда Коплэнда не стало. Его дух остался не сломлен
  после нескольких лет тяжелой болезни и 8 операций на открытом сердце. Его сердце
  все перенесло. Не выдержало - чужое сердце. По старой джазовой и блюзовой поговорке,
  скажем: когда святые пройдут маршем, он будет в их рядах. А в тех записях, где он
  полон энергии и будит слушателя по-техасски жарким блюзовым шафлом - он останется
  здесь, с нами, на блюзовой земле. Копланд, родившийся в Луизиане, по духу и основному
  месту работы был техасским блюзмэном. - Мой отец был блюзмэном, и я родился, слушая
  блюз. Я научился играть на гитаре, когда мне было чуть больше 10 лет. Моим главным
  гитарным героем был Ти-Боун Уокер (T-Bone Walker). Он объединил это в одно - пение
  и гитару. Это мне понравилось. Это было отличное сочетание. Блюзу я учился у великих,
  вроде Ти-Боун уокера, Гейтмауса Брауна (Gatemouth Brown), даже Санни Боя Уилльямсона
  (Sonny Boy Williamson), и Лоуэлла Фулсона (Lowell Fulson)... У таких ребят, как
  они. Вот их я слушал. Большинство людей, если скажешь "блюз", отвечают "дельта-блюз".
  Это более суровый блюз. Я делаю свинг и счастливый блюз. Пусть все знают, мы по-прежнему
  работаем, мы по-прежнему выдаем и исповедуем техасский блюз. - говорил Коплэнд в
  интервью весной 1997: Профессионально Коплэнд выступать начал в середине 50х, еще
  школьником. Joe Guitar Hughes был тем человеком, под присмотром которого Коплэнд
  совершал первые шаги на блюзовой сцене Хьюстона. И они оставались постоянными музыкальными
  партнерами от первых уличных выступлений до последних гастролей. Успех пришел далеко
  не сразу. Но в 60х имя Коплэнда уже было достаточно известным. В блюз он был крещен
  как Тексас Твистер - техасский твистер. Играл горячий рит-энд-блюз. С конца семедисятых
  он выходит в лидеры современного техасского блюза, работает в энергичной агрессивной
  манере. Игра на гитаре Peavey, он использовал густной насыщенный звук в манере,
  близкой к Алберту Кингу и в еще большей степени - Алберту Коллинзу. Но Коплэнд всегда
  почитал техасский стиль, любил Ти-Боун Уокера. В конце 80-х он стал особенно внимательно
  изучать историю блюза в записях, заново открыл для себя таких легендарных техасцев
  20-30-х годов, как Блайнд Лимон Джефферсон, Лидбелли. По его словам, ему стала яснее
  та связь, котора соединяет электрогитару Ти-Боун Уокера (пионера электрического
  блюза) с акустикой архаичного фолк-блюза. Примерно в этот же период Коплэнд с группой
  джазовых и блюзовых музыкантов отправляется в большое турне под эгидой Правительства
  США по африканским странам. Под впечатлением этой поездки, новых знаний и ощущений
  он в корне меняет звучание. И, соответственно, гитару. Последние годы он играл на
  Les Paul, сделанной по его личному заказу. Его блюз обрел джазовые оттенки, как
  блюз БиБиКинга. Но техасский аромат остался неизменным в его музыке. Коплэнд - лауреат
  нескольких премий W.C.Handy (Дабл Ю Си Хэнди), и одной блюзовой Грэмми - за альбом
  1985-го года, записанный вместе с Албертом Коллинзом и Робертом Креем. На джаз-фестивале
  в Монтре-95 Джонни Коплэнд пригласил выйти с собой на главную фестивальную сцену
  Николая Арутюнова (Группа "Лига блюза" принимала участие в "дополнительной" программе
  фестиваля - "Off"). В августе 1997 в клубе "БиБиКинг" "Лига блюза" своим концертом
  отметила "сороковины" по Джону Клайду Коплэнду. Отдать дань памяти и уважени вышли
  на сцену Михаил "Петрович" Соколов ("Мьюзик Хаммер Бэнд), Сергей Воронов ("Кроссроудз"),
  Леван Ломидзе ("Блюз Казенз"). Андрей Евдокимов. Николай АРУТЮНОВ (июль 1997г.):
  Несмотря на то, что мы все привыкли - очень даже привыкли - к подобного рода новостями
  за последние годы, все равно люба такая новость меня лично выбивает колеи очень
  здорого, потому что для меня в первую очередь это люди и во вторую очередь это те
  источники, которыми я питаюсь в своей музыке. И, собственно, я этим живу. Когда
  уходит такой человек, то дл меня это - скажу не стесняясь громких слов - дл меня
  это личная потеря. Как это ни ужасно, почему-то именно нашу музыку выкосило это
  дело. Ну, среди звезд блюза соотношение умерших и живых явно перевешивает в сторону
  умерших. И с уходом Комплэнда ушла еще одна частица корневого блюза, потому что
  он все же, несмотря на то, что он моложе Джона Ли Хукера или Хаулин Вулфа, он все
  равно частичка корней блюза. Потому что те блюзмэны, которые сегодня играют - есть
  звезды блюза в Америке, черные. Ну, скажем, Роберт Крэй - нельз назвать его корневым
  человеком. Джонни Коплэнд - это человек от корней, конечно, от земли. В этом он
  сродни БиБиКингу и Алберту Коллинзу. И для мен вот кстати вот эти два человека олицетворяли
  вторую волну, второе поколение корневых блюзмэнов. После них уже как бы становитс
  пустовато... Вот... И еще раз повторяю, грустно мне. Грустно вдвойне, потому что
  я... У меня в жизни была колосальная удача - я общался с Джонни Коплэндом несколько
  часов, беседовал. Даже удостоился выйти с ним на одну сцену. Это считаю, грандиозная
  честь для блюзмэна. Для мен это потрясение на всю жизнь останется, потому что (ну,
  до него я был знаком с несколькими известными блюзмэнами, джэмовал даже, ну, неважно)
  - ну вот так, чтобы выйти на большую сцену впервые в жизни, да еще с таким человеком
  (Я знал уже к тому моменту кто такой Джонни Коплэнд, вот, как-то был уже в курсе
  дела). И я осозновал, вообще, куда попал и с кем я вышел на одну сцену. Другое дело,
  что он не позволил себе ни на йоту посмотреть на меня сверху вниз. И общался он
  со мной совершенно на равных... В начале он удивился, что вот в России есть блюз,
  а потом, собственно говоря, когда мы уже немножко пообщались, он понял, что я уже
  что-то понимаю в этой музыке. Тут же он поставил меня рядом с собой. И задача была
  мне не забыть, кто рядом со мной. Хе-е... Но я постарался этого не сделать. И заряд
  от Джонни Коплэнда - это тоже самое, что заряд от БиБиКинга. Но поскольку он был
  первым - он незабываем. Слава Богу, у мен сохранилось видео. Я пересматриваю его
  часто. Я собственно и его (с Коплэндом) видеозаписи смотрю, часто слушаю его...
  И еще раз повторяю, в этом смысле это грандиозное везение - что почувствовал рядом
  с ним... Что касается, каков он - то это просто потрясающе! Он просто живчик! Что
  еще раз повергает в тоску - этот человек - сама жизнь. Он открытый, веселый, прикольный.
  Он такой... Простецкий! Ну вот так если говорить - он простецкий чувак! Он смеется,
  он принимает хорошо юмор. Несмотря на то, что я говорю на английском хуже чем он,
  вот, но он прекрасно понял все приколы. Он великолепно среагировал на обложку первой
  пластинки, помнишь, такая там у нас юморная пластинка. Он валялся, просто буквально
  валялся. У меня есть это на видео - я не вру! - он хохотал до упаду при виде этой
  обложки. Он такой действительно живчик, он реагирует на все. Кто пришел, сказал
  что - все быстро. Он такой немножко - как техасский черный блюзмэн - он немножко
  фатоватый, в своем оранжевом костюме, такой смешной. Но есть элемент самоиронии
  в этом, понимаешь. Это то, что позволяет... Вот человек другой музыки другого цвета
  кожи, он бы смотрелс в такой ипостаси смешно. А этот - забавно. Потому что он понимает,
  что это - прикол. То есть это - суть блюза. В общем для меня он - Блюзмэн с большой
  буквы. Это все, что я понимаю под блюзом: доброта такая, вместе с тем все это не
  елейно, не показно. Все это естественно, чисто по человечески. Ну тебе говорю, просто
  вот офигительный чувак. Вот бы так о нем сказал. -Как решили, что вы сможете вместе
  исполнить, без репетиций? Да очень просто, я еще раз говорю... Обсуждение того,
  что делать, было уже по другую сторону, как бы, одного момента, который мы сразу
  в начале нашего знакомства перешли. Как только он меня как бы за своего принял,
  он тут же, ничего не рассусоливая: "Что будем играть? Что ты знаешь?" Давай то-то,
  то-то, то-то. "Ну, давай". Решили "Hoochie Coohie Man" и "Sweet Chicago". Тональность
  - все это никого не волнует. Он спросил меня. Я говорю: "Мне по фигу". Он мне дал
  почувствовать, что мы как бы вместе. И вот это очень ценно. И за это я буду благодарен
  ему всю жизнь. Вообще, на мой взгляд, Джонни Коплэнд - недооцененный у нас человек.
  В Америке он - в высшей лиге. У нас - к сожалению... Я был бы очень рад, если бы
  он получил свою долю славы в среде наших любителей блюза. Самое главное, о чем я
  бы хотел сказать, это то, что он очень хитовый блюзовый композитор. В блюзе очень
  трудно создать хит, а он будучи чистым блюзмэном, он практически всегда играет чистый
  блюз, - у него очень запоминающиеся блюзовые мелодии. У него великолепные хиты:
  "Cut Off My Right Arm" - у него, наверное, песня номер один, потом любимая мо "Texas
  Party" и последних вещей - "I''m In Love With Another Man''s Wife". Я бы его назвал
  выдающимс композитором блюза. Как музыкант, я вот что могу о нем сказать. Конечно,
  не гитарист, и гитаристам лучше рассуждать о его гитарной игре. Конечно, он выдающийся
  блюзовый гитарист... Все эти ребята, вот, корневые отцы черные, они, конечно, на
  гитаре играют больше забавно, чем, скажем так, круто. Что, в общем-то, меня устраивает.
  Вот. И Коллинз, и Эллисон, и БиБиКинг. Это чисто черная игра на гитаре! Но, поскольку
  я певец, я могу сказать, что певец Коплэнд колоссальный! У него дикой силы голос.
  Был один совершенно прикольный момент, когда ждал своего выхода за кулисами. Действо
  было передо мной - я с боку смотрю. В один момент он отпел куплет, и началось соло
  на клавишах. И Джонни Коплэнд, он так прохаживается по сцене, и какие-то фразы он
  пропевает. Без микрофона. Но, поверьте, уровень громкости был при этом такой же
  как с мифрофоном! То есть у него дикой силы - страшной силы! - голос. И он такой
  вот какой-то "дикий", вот. Слово "дикий", кстати, очень подходит к его музыке. Я
  не имею ввиду, что он беснуется: красиво, нарочито. Нет, это дикость такая - человеческая,
  нормальная дикость, от земли. Вот это дикость блюзмэна! Это мне очень нравится -
  то, что американцы называют "Rough", "Raw", то, что у нас называется дикий или сырой.
  Таким был Алберт Коллинз. Таким я видел Джонни Коплэнда. Таким я видел Лютера Эллисона.
  Мои любимые блюзмэны - Джонни Уинтер такой же - Raugh! И таким я Джонни Коплэнда
  запомню. То есть Raugh в музыке и Very Very Hot в жизни. Это точно. Дикий, сырой
  и очень теплый. И спасибо ему за все. -Что бы ты порекомендовал для знакомства с
  Коплэндом в записи? Я рекомендую для того, чтобы понять что же такое Джонни Коплэнд,
  что это за явление в блюзе, послушать его пластинку 93 года Catch Up With The Blues.
  Вот если вас интересует мое мнение, вот это вообще считаю, один краеугольных камней
  блюза 90х годов. Дискография: - Mercury: ROCK & ROLL LILY single 1958 - Rounder:
  COPELAND SPECIAL 1981 MAKE MY WHERE I HANG MY HAT (1982) BRINGIN'' IT ALL (1985)
  TEXAS TWISTER (1986) AIN''T NOTHIN'' BUT A PARTY--RECORDED LIVE (1988) BOOM, BOOM
  (1989) TEXAS TWISTER (1986) WHEN THE RAIN STARTS FALLIN'' (1987) - Alligator: SHOWDOWN
  (1985) - Verve: FLYIN'' HIGH (1991) CATCH UP WITH THE BLUES (1991) JUNGLE SWING
  (1996)'
