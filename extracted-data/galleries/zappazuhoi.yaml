  Сан-Диего. Я там, надо сказать, вообще, жил в совершенно удивительном месте, на
  холме под небесами. Невероятное место, названное индейцами, которые там жили, Небеса,
  высочайшее небо, прямо видна его сферичность. И вот там, в этом месте, у нас контакт
  состоялся. Потом у меня еще было одно очень приятное ощущения, как-будто бы я услышал
  в какое-то мгновение мировую гармонию и после этого я уже сам увлекся музицированием.
  ВС : Я думаю, это замечательно, как часть Заппиной космогонии Одной Большой Ноты,
  во всяком случае. Кстати, все хотел спросить, акулу-то желтую у Фрэнка в доме видели?
  ЮБ : Наверное что-то такое висело где-то на стене, но точно не помню. Хорошо помню
  вход в студию, она вся внутри темно-зеленая, как подводная лодка, и там лежала все
  время на пороге его собака. Такая старая, ее особо старались не беспокоить. А вот
  как звали ее, не помню. У него потом была еще пара собак, уже в 1992, лайки такие,
  очень красивые, крупные. Есть фотографии. Особенно много я, правда, в первый приезд
  снимал. У меня был такой простой аппарат-автомат, 32 кадра. Помню сфотографировал
  во дворе дома бюст Бетховена и рядом еще одна не очень почтительная скульптурка,
  гипса с отбитым носом, какого-то популярного американского бейсболиста. ВС : А что
  еще было на стенах в доме? ЮБ : На стенах какие-то риснуки домашних, наверное, друзей
  каких-то... Дом вообще организован, как художественное произведение. Помню, однажды
  пошел и заблудился, плутал, спускался, поднимался по всем этим лесенкам, какие-то
  встречаются китаянки, друзья, людей в доме вообще полным-полно, даже в будни, и
  вдруг попадаю в совершенно черную комнату, и там аквариумы светятся, даже не комната,
  а такой угол коридора. Красота! ВС : Надо же. И в этом райском уголке Фрэнк мечтал
  смонтировать руками сумасшедших русских физиков лабораторию Холодного ядерного синтеза?
  ЮБ : Звучит диковато, но это так. Он сам об этом говорил и не один раз в Москве.
  ВС : Я думаю, наверное, это от того, что в его душе до самого последнего дня не
  унимался озорной пыл малолетнего химика, дух юного экспериментатора и взрывника.
  Не дали ему тогда в школе в Сан-Диего насладиться фейерверком по полной программе,
  так он взрослым дядькой думал... ЮБ : Смешная шутка, мне только кажется, что вся
  жизнь Фрэнка и без этого оказалась сплошным фейерверком открытий, идей, изобретений...
  ВС : Конечно, конечно, и вдвойне приятно, что и ваши искры славно сверкнули в этом
  фонтане огня. Что Вы чувствовали, когда получилось? Шли по ночному Голливуду, танцевали
  и пели? ЮБ : Нет, не пел, просто вышел дома Фрэнка на эту улочку, нашел какое-то
  местечко прямо рядом с домом, там, где машины паркуются перед гаражом, сел и стал
  поджидать своего дружка, который должен был за мной заскочить, хороший, тоже ЛА
  персонаж, режиссер, русских кровей, ассимилировавший, по-настоящему американец,
  в лучшем смысле этого слова, Виктор Гинзбург, и вот он подъехал забрать меня, а
  пока я поджидал его, может быть, минут пятнадцать, сел на какую-то приступочку,
  закурил, подумал о том, о сем, и тут вдруг сообразил, дошло, что вроде бы какой-то
  этап жизни завершился, работа сделана. И не просто работа, а работа-то Фрэнку Заппе
  сделана, и вот он ее только что принял, это же, вообще, что-то, невероятное, удача.
  Счастье. * * * Какое-то время мы оба молчали. Звукочувствительное устройство диктофон
  перестало накручивать ленту. Кажется, интервью получилось. - Еще чайку? - предложил
  Юра. - Давайте, пожалуй, на посошок, - ответил я. Заснувшая уже было вода закипала
  как-то особенно неохотно. На углу юриного стола белел толстенный томик статей Василия
  Кандинского об искусстве. Я раскрыл его наугад. "Schoenberg''s Pictures" немедленно
  подмигнул заголовок. Ну, надо же, не что-нибудь, а именно рецензия на книгу о кумире
  самого ФЗ. "Die Bilder" Arnold Schoenberg Mit Bietragen von Alban Berg. Я повернул
  раскрытый томик к Юре. - Как вы это называли? - спросил он c легким изумлением,
  - Кажется, концептуальное постоянство? - Да, - подтвердил я, - Conceptual Continuity
  - всеобщая и неразрывная связь идей и предметов во вселенной Фрэнка Заппы. Искренне
  Ваш, Владимир Советов http://www.arf.ru/ &nbsp Фото &copy; Игорь Верещагин , 2001
