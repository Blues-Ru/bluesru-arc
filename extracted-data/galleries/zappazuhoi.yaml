extra_text: 'BLUES.RU: Zappa''sUh!Oi!: 25 Aug 01 З аппа''z У х! Ой! русский более
  или менее регулярный бюллетень для поклонников американского композитора Frank''а
  Vincent''а Zappa''ы Выпуск.34 (25 августа 2001) Uri 2 С Юрой Балашовым, московским
  художником, автором обложки альбома Фрэнка Заппы "Civilization, Phaze III" меня
  познакомил замечательный фотограф Игорь Верещагин зимой 2001 года. Тогда у Юры еще
  не было e-mail''а и безотказный Игорь, словно пушкинский почтальон, носил депеши
  от меня к Юре и обратно. Разговор получался интересным, но интервью, как некоторое
  произведение со своими жанровыми законами не выходило, и мы договорились встретиться.
  Дух Фрэнка нам определенно благоволил, потому что именно 14 мая две тысячи первого,
  когда в Калифорнии еще догорало тринадцатое, самый что ни на есть Mothers Day, я
  стоял у окна юриной мастерской на Новом Арбате и смотрел на московские крыши. Юра,
  необыкновенно приятный, неторопливый и принципиально бритый человек, в невероятной
  цветастой ермолке, какую я до этого видел только на голове Телониуса Монка, на рисованной
  обложке какого-то контрафактного сидюка, показывал мне свой город: - Вот, - говорил
  он, ладонью очерчивая, организуя знакомое пространство - здесь двор моей юности,
  там мой дом, тут школа, - я, еще сидя в подвале, еще черте когда, говорил, художник
  должен творить в мансарде. На последнем этаже. Я соглашался. Потом мы обменивались
  автографами, а Игорь Верещагин нас фотографировал. Потом пили чай и слушали Everything
  Is Healing Nicely , который я записал и привез Юре в подарок. Потом я рассказывал
  Юре о недавно изданном романе Мун Юнит . - Знаете, Юра, а ведь дочь изобразила отца
  художником, автором многочисленных полотен, на которых, правда, красовались исключительно
  полноразмерные письки во всю ширину холста, но все же художником, не писателем,
  не актером. Я, откровенно говоря, просто думал немного польстить симпатичному и
  гостеприимному человеку, вот, дескать, Заппа родным и близким тоже представлялся
  ваятелем и живописцем. Однако, эффект моих слов оказался не вполне ожидаемым. Юра
  замолчал, задумался и вдруг признался: - Надо же... А ведь у меня была именно такая
  серия работ. Вульвинизмы. Да... И дочь меня долго не понимала... Мы посмотрели друг
  на друга. - Conceptual Continuity, - пробормотал я. Юра на секретное слово не отреагировал,
  он просто предложил еще стакан чаю. - Может быть, EIHN послушаем еще разок, - сказал
  он, - уж больно музыка хороша. Я не возражал. Потом явились его друзья-монголы и
  пару часов звучали уже степные, военно-полевые песни. Юра самозабвенно играл на
  удивительной штуковине, похожей на обрезок одеревеневшего хобота какой-то зверюги
  доисторической эпохи. Потом он ходил за печеньем и луковыми хлебцами. Опять булькал
  чай и предлагались папиросы. К разговору о любимом композиторе Юра готовился долго
  и тщательно. Как космонавт к полету. Благословенное четырнадцатое стало пятнадцатым,
  когда мы наконец сели за стол и включили диктофон. * * * Владимир Советов : Юра,
  вы, кажется, второй русский человек после Николая Слонимского, которому довелось
  не бизнес делать с Фрэнком Заппой, а нечто разумное, доброе, вечное. Как Вы познакомились
  с ФЗ? Как оказались в Лос-Анджелесе в нужный момент и в нужное время? Юрий Балашов
  : Справедливости ради следует заметить, что и Стас Намин делал с ФЗ разумное, доброе,
  вечное. Насколько я тогда понял разговоров, свидетелем которых я становился по случаю,
  они всерьез раздумывали о реконструкции Манежа в Питере, о каких-то спутниках, реформирующих
  систему коммуникаций в России, о создании Лаборатории Холодного Ядерного Синтеза.
  Да, и первый раз, если не ошибаюсь, ФЗ приезжал в Москву по приглашению Музыкального
  Центра Стаса Намина или СНС. Я работал тогда в СНС художником и по совместительству
  начальником отдела организованной поддержки инициатив. В 1989 несколько сотрудников
  СНС, я в том числе, с Наминым во главе, отправилось в США с "коротким визитом".
  В ЛА Стас привел всех в дом к ФЗ на Вудроу Вилсон драйв. Встретили нас ласково и
  радушно. Накормили-напоили, провели по всему дому, познакомили с домочадцами. Развлекли
  беседой. Я тогда совершенно ошарашен был всем, что видел. В целом. Восток Америки.
  Юг и Запад. И, может быть, важности именно этого события как-то не почувствовал.
  Просто все было здорово, и это тоже. А потом, уже в Москве, года 2 спустя, очередное
  появление ФЗ воспринималось как чудо. Было это зимой. Встречались очень тепло. Пили
  кофе. Курили сигареты. Говорили обо всем, о животных, погоде, о детях. Фрэнк ведь
  отец. Четверо детей. Да, четверо. Ахмет, Двизл, Мун и Дива. Хорошие дети. Потом
  он снова приехал в Москву летом. Ну, летом вообще все хорошо. И свет падает на человека
  правильно. На дома - тоже. Москва ему понравилась. И мне летом нравится. Так что
  при первой возможности я отправился в ЛА, опять же не без участия СНС и Стаса Намина
  лично. ВС : Отлично, Юра, краткий конспект по теме: "Встреча и знакомство" у нас,
  похоже, есть, теперь давайте попробуем, составить что-то вроде хронологии и украсить
  ее живописными деталями. Итак, вот что у меня получается. Первый раз вы встретились
  с ФЗ в 1989 в ЛА. Зимой 1991 Фрэнк сам приезжает в Москву. Летом того же года еще
  раз. Так? ЮБ : Да, как-будто так. ВС : И где же он жил в тогдашней холодной и голодной
  горбачевской Москве? ЮБ : По-моему он жил в гостинице "Советская", там такие хорошие
  номера, имперского какого-то стиля, были, просторные, хотя по удобствам и уступали,
  наверное, тогдашним американским чудесам. Кажется, мы туда несколько раз заезжали,
  но точно не помню, потому что нахожусь частенько в своем внутреннем мире, в общем,
  откидываю какие-то подробности до момента концентрации, конечно, так упускаются
  некоторые моменты и обстоятельства внешние... Да, но Заппа, естественно, был ошарашен
  тем, что тут все так неустроенно, что так тосклива и тяжела жизнь советских граждан,
  это же был 1991 год... Он попытался посмотреть, что здесь происходит, понять. А
  так как человек он наблюдательный и ироничный, у него были поводы поиздеваться над
  тем, что здесь тогда происходило. Полный идиотизм, грабеж, передел собственности,
  он все это прекрасно понимал. ВС : Экономили на всем и в столовых каждую салфетку
  рачительно разрезали на восемь треугольничков. ЮБ : Да, было. В буфете Доме молодежи
  как раз такой артефакт попался Фрэнку на глаза. Он, конечно, очень удивился. Это
  же надо было, каждую развернуть, разрезать на четыре квадратика, а затем квадратики
  еще и по диагонали. Что-то вроде эмблемы нищеты в контексте полной невозможности
  заняться чем-то продуктивным. Но мне больше всего понравилось, как тогда проявился
  сарказм и ирония Заппы. Он взял эту вазочку с торчащими нее бумажными треугольничками
  и поднял над головой будто такой факел. Настоящая статуя свободы получилась. Очень
  смешно. ВС : Действительно. А чем вообще занимался, интересовался Фрэнка, в пору,
  когда Скорпионы у нас тут принюхивались к wind changes? ЮБ : Ну, мы, я имею в виду
  прежде всего, Намина и его центр, ему устроили полную демонстрацию тогдашнего московского
  андеграунда. И я во всем этом участвовал, потому что, как уже говорил, работал у
  Стаса начальником отдела организованной поддержки инициатив, сам себе придумывал
  должность, я еще тогда не знал термина facilitation, поэтому и составил такое нагромождение
  слов. ВС : А отечественные исполнители классической музыки, камерные музыканты его
  не интересовали. Какие-то проекты с их участием не намечались? ЮБ : По-моему, его
  интересовало все, он все разведывал, и получил исчерпывающее представление о предметах
  его интересовавших. С помощью Стаса, конечно, ведь он же со всеми накоротке, Заппе
  было достаточно только сказать, поехали туда, пошли туда, а что у вас здесь, и все
  решалось. Больше Стаса ему никто не мог помочь здесь, в Москве. Да и в Питере они
  побывали. Тогда и идея появились с этим Манежем. А отдыхал он душой в моей мастерской,
  это точно. ВС : Эта та самая, которую он звал Bauhaus? ЮБ : Да, в центре Стаса Намина
  было помещение, которое мне отвели под мастерскую, там бывали все музыканты, появлявшиеся
  в центре Стаса Намина. Это были такие для них happy hours, там они могли чайку попить,
  по-турецки поговорить. И Заппе там очень нравилось, сама обстановка нравилась, то,
  что происходит, какая-то тусовка, активность. ВС : Знаете, Юра, это звучит, по меньшей
  мере удивительно. Заппа, одержимый трудоголик, занятый делом 25 часов в сутки, вдруг
  все бросает и просто приезжает в полудикий край, чтоб отдыхать, "кофе пить и по-турецки
  говорить"? ЮБ : Он, конечно, отдыхал, но и занимался делами. Мотался в Питер. Искал
  каких-то там специалистов, которые занимаются спутниковой связью, искал каких-то
  ученых по части ядерного синтеза, всех их можно, наверное, найти и распросить, о
  чем они с Заппой тогда говорили. Еще какие-то люди были вовлечены во все это, но
  главное, что мы ему могли дать информацию о том, что происходит в плане музыкальном,
  театральном, какие-то показывали перформансы, он записывал все это на видео. Помню,
  еще расставлял микрофоны по собственной системе, очень переживал за эти микрофоны,
  потому что когда артисты разошлись, то стали поливать все вокруг какими-то растворами,
  чем-то опрыскивать, всю эту аппаратура за тысячи долларов. ВС : С Заппой были звукоинженеры,
  кто-то ему помогал? ЮБ : Нет, он все делал сам, он был один, хотя помогать могли
  и наши звукоинженеры. Был у него какой-то походный магнитофон, точно не помню какой,
  но все записывалось. А еще интересно, что он не только смотрел и слушал, но давал
  советы нашим музыкантам. Помню, мы зашли на репетицию группы Николай Коперник Юры
  Орлова, Заппа взял гитару и показал какой-то прием, который сам недавно изобрел,
  и решил поделиться, просто подарить, а эти даже не поняли. Юра Орлов, человек такой
  очень продвинутый, new-wave''овский, совершенно не воспринимал Заппу, который ему
  казался стариком, а тут какой-то блюзовый пассаж, в общем, совсем не оценил подарка.
  ВС : А что-то особо он выделил, что-то особенное ему понравилось? ЮБ : Я помню точно,
  что его тогда порадовала группа "Север". Они в то время как раз начинали. ВС : Хорошо.
  Вернемся теперь в 1989. Кстати, мне кажется, что Стас побывал у Фрэнка дома даже
  раньше. Мне смутно припоминается какое-то фото в МК, наверное, 1987 года. Намин
  у Заппы в гостях, Стас стоит, Заппа сидит, оба с гитарами в руках. ЮБ : Да, вроде
  бы так и было. ВС : Ну, а вас он уже привез в 1989. И вы там ели, пили, и угощались
  Зинфанделем, так? ЮБ : Ага, пили белое вино. Но не чтобы напиться, а просто для
  удовольствия. Да и просто лимонада, кока-колы было сколько угодно. Но главное, было
  много банок с орехами. А я вообще орехолюб, так что для меня это был праздник. Много-много
  орехов, самых разных, бразильских, кедровых, в больших стеклянных банках. Ну, а
  вообще, кухня мне показалась скорее на итальянский манер. ВС : Мун, кстати, утверждает
  в своей книге, что мама готовит раз в год, на Рождество. ЮБ : Ну, там много помощников
  в доме, друзья, родственники. Дело не в этом, а в какой-то общей приподнятой атмосфере
  обеденного помещения, как-то оно было замечательно освещено, огромные окна, вечернее
  небо. Такое специальное помещение, пристройка, вообще, дом мне казался поросшим
  разными пристройками. Пристройка для Мун, пристройка для Двизила, по-моему, где-то
  на крыше, все лепятся, лепятся друг к другу, замечательная постройка. Лестница во
  дворе, а за домом бассейн. Предполагалось, что я его буду расписывать, но как-то
  до этого не дошло. Из-за болезни у Фрэнка не осталось никакого энтузиазма на этот
  счет. ВС : Очень жаль, но продолжаем. В 1992 очередной музыкальный проект Стаса
  Намина вас вновь приводит в ЛА. ЮБ : Да, я туда попал в марте 1992. И месяца через
  два после моего приезда у кого-то семьи был день рождения` и меня пригласили. ВС
  : Через два месяца? В мае? Тогда скорее всего у Ахмета, он родился 15 мая 1974.
  ЮБ : Да, да. Кажется, именно у него. Но точно не больше пары месяцев прошло, потому,
  что я как раз в это время работал над оформлением пластинки Парка Горького. Мы там
  тогда все вместе жили. У нас была такая замечательная коммуна, несколько человек.
  А вот какой район, я уже сейчас точно не помню, все дома вокруг были совсем еще
  новенькими. ВС : То есть вы были приглашены вместе с участниками Парка? Кажется
  ФЗ принимал участие каое-то в их раскрутке там, в Штатах? ЮБ : Он им помогал. Ребята
  там были давно, а меня они позвали, когда уже готовили к выходу пластинку. ВС :
  Слушали ли вы музыку самого ФЗ, справляя день рождение Ахмета? ЮБ : Конечно. На
  той памятной вечеринке ФЗ пригласил всех, кто там был в "святая святых". И мы прослушали
  его последние творения, CPIII в том числе. А в конце вечера, на прощание, ФЗ отвел
  меня в сторонку и попросил принять участие в оформлении диска, на котором, он это
  особо подчеркнул, собраны результаты опытов с записью звука, сделанные им и его
  друзьями за 30 лет. Название: "Цивилизация, Фаза III". Месяца два я ее делал. ВС
  : Ага? Кстати, знаете ли Вы, что Фрэнк и сам неплохой художник? Мальчишкой он побеждал
  на конкурсе детских плакатов, а позднее своими собственными руками делал обложки
  первых дисков Матерей - Freak Out! и Absolutely Free. Ощущали ли Вы в композиторе
  собрата по ремеслу? ЮБ : Да, да, конечно. В доме ФЗ я видел Т-shirts с рисунками
  и логотипами Фрэнка. Мне вообще всегда они нравились, Заппины изошуточки, обложки
  его дисков. Его пластилиновый мультик. Он не неплохой мне кажется, а очень даже
  хороший художник. Его дом - тоже тому подтверждение. ВС : Дом, наверное. А вот пластилиновые
  мультики - это работа Брюса Бикфорда. Вы, Юра, просто Заппу очень любите и по-доброте
  душевной приписываете ему какие-то дополнительные, симпатичные лично вам таланты.
  ЮБ : Ну, нет, я не приписываю это заппиным рукам. Просто человек это делал для него.
  Заппа выбрал именно этого человека. Художников-то тьма-тьмущая, каждый что-то хочет
  делать, а Фрэнк выбирал нечто совершенно конкретное. Значит это он, это его художественный
  продукт. ВС : Любопытно, что не так давно Гэйл высказалась в подобном духе и в отличие
  от вас это многих, особенно художников, обидело. Возможно, перефразируя Булгакова,
