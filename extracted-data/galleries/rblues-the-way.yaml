extra_text: The Way The Way (СПб) Сергей Семенов - вокал/бас-гитара Владимир Березин
  - гитара Дмитрий Евдомаха - ударные Группа "The Way" существует 4 года. Основная
  сфера их исполнительской деятельности - блюз техасского направления и Rhythm & Blues.
  В репертуаре коллектива популярные блюзовые композиции Джимми Хендрикса, Стиви Рей
  Уона, Элмора Джеймса, Джона Ли Хуккера, Альберта Кинга, Уилли Диксона и др. Российские
  музыканты
