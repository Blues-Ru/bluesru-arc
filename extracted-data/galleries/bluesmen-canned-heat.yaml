  CD, 1996) Burnin'' Live (SPV Rec./Aim CD, 1994) In Concert (King Biscuit Entertainment
  CD, 1995) - Концерт 1979 на десятилетии Вудстокского фестиваля с участием гитариста
  "Холивуда Фатса"( Mike "Hollywood Fats" Mann ) и слепого пианиста Джея Спелла (
  Jay Spell ). Internal Combustion (Germany) (Aim CD, 1995) Ties That Bind (Archive
  CD, 1997) On The Road Again (Aim CD, 1997) Boogie 2000 (Ruf CD,1999) The Boogie
  House Tapes (CD 2000) - собрание записей концертов в Бельгийском музее буги-музыки,
  сделанных с 1967 по 1976 годы. Лучший период - это, конечно, начало; когда любовь
  к блюзу сочеталась с искренним молодецким энтузиазмом; когда Хайт и Уилсон обеспечивали
  диалектичнось группы - фактически, это только первые пять альбомов. Европейский
  концерт, где, кстати, на разогреве выступали Deep Purple, был уже предкризисным
  явлением. Сливки лучших альбомов (причем "Future Blues" представлен полностью) квалифицировано
  собраны на первых двух CD тройника The Big Heat - Большая жара. Третий альбом -
  хорошая выборка альбомов начала 70-х. Обширный буклет добавляет привлекательность
  этому сборнику. Обязателен для настоящей блюзовой коллекции студийный двойник "
  Hooker''N''Heat " (не путать с одинарным "концертником" под тем же названием). Наконец,
  " Boogie 2000 " представляет очень любопытное сотрудничество группы с блистательным
  слайд- и акустическим гитаристом Робертом Лукасом. Хотя этот альбом, пожалуй что,
  " на любителя ". " Living The Blues - Рассказ о музыке, наркотиках, смерти, сексе
  и выживании группы "Кэннд Хит", написанный Ф.де ла Парра, ответственным за выживание"
  - биография группы от лица ее нынешнего лидера. Canned Heat - Boogie Assault - видеозапись
  выступления на "Monterey Pop". В сети: Официальный сайт в Германии: http://www.drfeelgood.de/c_heat/index.htm
  , регулярно обновляемый. CANNED HEAT MUSIC - именной сайт. В основном, продажа сувениров.
  Открыт к выходу альбома 1997г., незавершенный " долгострой ". Песня " On the Road
  Again " в MP3. OLGA - аккорды и таблатура трех известных песен группы. http://www.rock-cd.de/CannedHeat.htm
  - развернутая, но не полная дискография с аудио-фрагментами и ссылками на интернетные
  магазины. Дискография на 47(!) позиций'
