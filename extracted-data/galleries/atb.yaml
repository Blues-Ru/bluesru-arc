extra_text: 'Неполная расшифровка передачи Программа "Весь Этот Блюз", ведет ее Андрей
  Евдокимов, добрый вечер. №6 3.00 Бурные споры о том, может ли Эрик Клэптон играть
  блюз - не утихают с 1963 года, когда Клэптон дебютировал на лондонской блюзовой
  сцене в составе группы "Yardbirds". Казалось бы, за прошедшие-то годы одна противоположных
  точек зрения должна была бы победить. Ан нет - спор идет все с прежним накалом,
  в него включаются новые поколения, внося в вечно тлеющий диспут новую порцию горячности.
  Включая в цикл "Золото блюзовой фонотеки" альбом Клэптона 1980 года "Just One Night",
  у меня вовсе не было намерения поставить точку в споре, идущем три с половиной десятилетия.
  Спор будет продолжаться до тех пор, пока жив хоть один ревнитель "чистого, ну то
  есть, грязного блюза". И если уж кого-то интересует моя точка зрения, по-моему,
  Клэптон блюз то играет, то не играет. Мне кажется, именно в этом - ключ к долголетию
  дискуссии. Но разобраться, когда "да" а когда - "нет", это вопрос не голосования
  большинством, а личных пристрастий. По мне альбом "From The Cradle" - это чистая
  фикция, и премия "Грэмми", выданная этому альбому в категории "традиционный", я
  подчеркиваю - традиционный "блюз" - это как пощечина от шоу-бизнеса всем, кто знаком
  с традиционным блюзом. Кого интересует подробное обоснование этой точки зрения -
  поищите в архивах журнала "Роллинг стоун" статью выдающегося историка блюза и музыкального
  критика Роберта Палмера - она опубликована сразу после выхода альбома. Любой нормальный
  музыкант, прочтя такой детальный профессиональный разнос, зарекся бы блюз играть
  до конца жизни. Но Клэптон, как вы понимаете, не читатель, он - писатель. А с другой
  стороны, альбом "фром зе крейдл" любим и ценим многими хорошими людьми, далеко не
  лишенными хорошего вкуса. Другой блюзовый авторитет - Роберт Сантелли, вообще включил
  "Фром зе крейдл" в свой список "ста одного альбомов, без которых нельзя представить
  блюз". Контраверза продолжается, но противников и сторонников хотелось бы примирить
  хотя бы на сегодняшний вечер. Двойной концертный альбом "джаст уан найт" не претендует
  на звание 100%но блюзового. Но это хорошая тонкая гитарная работа, выполненная в
  замечательно-английском тоне меланхолического блюза. И, может быть, именно такой
  смягчающий грустноватый блюз, напетый слабым - очень далеким от любых призывов к
  действию - голос и есть сегодня как раз то, что доктор прописал - в качестве успокоительного.
  №6 классики -блюз Big Maceo Merriweather "Worried Life Blues". Как и многие другие
  номера в программе концерта "Джаст Уан Найт", эта песня уже многие годы, десятилетия,
  правильней сказать, находится в репертуаре Эрика Клэптона. Что, кстати, соответствует
  блюзовой традиции. Альбом 1980 носит название-декларацию - "Джаст Уан Найт - предположим
  перевод - "Всего один вечер". На самом деле это - выборка концертной программы,
  с которой Клэптон гастролировал в Японии в декабре 1979 года. Концерты были записаны
  в токийском театре "Будокан", Клэптону всегда хорошо игралось в этом зале, видимо,
  поэтому именно эти выступления и были выбраны для записи. Очень любопытна приписка
  Клэптона на конверте альбома, изобличающая в нем психопатического интроверта. К
  гастролям в Японии, где Клэптон с успехом выступла много раз, он всегда подходит,
  мол, со смешанными эмоциями. "С одной стороны - слушатели полны энтузиазма почти
  что сверх меры, - поясняет миру Клэптон, - но есть и препоны. В их плотно закрытом
  изолированном обществе ощущаешь себя уродом. Но в конце концов все получается очень
  мило", - заканчивает Клэптон: "Премного благодарностей Удо Тэтсу и Таку". Эрик Клэптон,
  12 марта 1980 года. Не только пресловутая замкнутость японского общества заставляла
  в то время Клэптона чувствовать себя "изгоем". Известно, что с конца 60-х Клэптон
  жил, приглушив работу мозга. Время от времени он побеждал наркоманию алкоголизмом.
  И на период записи альбома как раз приходится этап "алкогольной победы". В авторизированной
  биографии Клэптона сообщается, что набирался он "под завязочку" уже к завтраку в
  понедельник, для того, чтобы в этом состоянии держаться до следующего понедельника.
  Манера эта уже стала притчей во языцах и в кругах высшего общества, и уж того более
  - в желтой прессе. Но за годы Клэптон выработал защитную реакцию. Теперь он откровенничает,
  что тогда научился полностью симулировать трезвое поведение, внешне похожее на вполне
  объяснимую усталость от гастролей, перелетов и проблем личной жизни. А на пресс-конференциях
  клялся, что полностью завязал. Добавить к этому стоит, что набираться до кондиции
  Клэптон предпочитал в общественных пивных, как он заявлял, чтобы чувствовать себя
  ближе к простому народу. Извините, но таковы уж детали к портрету этого художника.
  В голосе его действительно слышна усталость - чуть ли не до безнадежности. Но пальцы
  - не выдают "слоухэнда" - ни разу. №2 "Early In The Morning = Рано по утру", традиционный
  блюз в исполнении Эрика Клэптона. 70-е были для Клэптона временем американизации.
  Со времен "Делани и Бонни" он играл с американскими музыкантами, пока в гастролях
  1978го года не почувствовал, что (цитирую) "не настроен с ними на одну волну". В
  следующие мировые гастроли Клэптон отправился с группой, принципиально набранной
  английских музыкантов. состава в первую очередь нужно назвать замечательного мультиинструменталиста
  он и гитарист и клавишник, и вдобавок - певец: Алберт Лии (Albert Lee, не стоит
  его путать с Элвином Ли "Ten Years After"). На электропиано очень вкусно играет
  Chris Stainton - тоже имя на профессиональной английской эстраде. Бассист - Dave
  Markee и ударник Henry Spinetti. Вместе с Клэптоном - квинтет, записавший этот без
  преувеличения - великолепный вариант исполнения темы Отиса Раша - "Double Trouble"
  - "Ни денег, ни любимой, меня можно звать "Тридцать три несчастья". №1 На протяжении
  всей долгой карьеры Эрика Клэптона редкий его альбом обходился без хотя бы одного
  блюза, или чего-то похожего на блюз. Есть в его дискографии альбомы, которые, может
  быть, в целом имеют большее право именоваться блюзовыми, нежели "Джаст уан найт".
  Но ни один них не содержит блюзового шедевра, подобного "Дабл Трабл". Может быть,
  именно это исполнение не дает противникам Клэптона как блюзмэна - одержать окончательную
  победу в споре. Одина эта запись может служить доказательством существования британского
  блюза. Декабрь 1979го года, токийский театр Будокан. Теперь звучит стандарт Визей
  и Робея "Futher On Up The Road" - "Дальше по этой дороге" №6 "Фезер Он Ап Зе Роад"
  - "Дальше по этой дороге" Все прозвучавшие до сих пор треки - блюзовые стандарты...'
