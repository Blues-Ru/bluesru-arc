extra_text: '"Гитарный Бомбардир" – Джуниор Ватсон. "Гитарный Бомбардир" – Джуниор
  Ватсон. (Junior Watson) Есть некоторые недостатки в том, чтобы быть замужем за гитарным
  фанатиком. Он непроизвольно тормозит машину около каждой комиссионки на вашем пути,
  а его представление о "романтическом путешествии" включает в себя посещение всех
  ныне известных гитарных магазинов мира. Если я первой замечаю на горизонте магазин
  электроники, то тут же начинаю громко разговаривать и указывать в противоположную
  сторону. Но тут уже он стоит на смерть, и незамедлительно включается в игру под
  названием "перетягивание бумажника". С другой стороны: он - ходячая энциклопедия
  малоизвестных фактов мира музыки, он может быть полезен, когда что-то не ладится
  с моим комбиком, и он чертовски здорово играет на гитаре и гармонике. А еще – он
  очень требовательный. Поэтому, когда он категорично заявил, что жизнь немедленно
  прекратится, если я откажусь провести ДВА ЧАСА в баре в ожидании какого-то гитариста
  по имени Джуниор Ватсон, я сдалась. Бэнд, состоял контрабасиста, гитариста, барабанщика
  и певца-харпера. Он заняли сцену и заиграли еще до того, как появился сам Ватсон.
  Он заиграл, и музыка вырвалась гитары, как взрывная волна. Харизматичный лысый человек
  с густой бородой и в жилетке с растительным узором полностью завладел слушателями.
  И его дикий Чикагский блюз, и заводной Уэст-коуст свинг, с мелодиями, приправленными
  рванными гитарными риффами и джазовыми аккордами, вызывали равное восхищение. Большинство
  гитаристов во время игры постоянно пользуются стандартными фразами своего арсенала,
  но Ватсон ничего не повторял дважды. Он просто сгорал на сцене, с нетерпением требуя
  того же от других членов бэнда. Мы с трудом скрывали смех, когда он метнул устрашающий
  взгляд на барабанщика, прозевавшего вступление. Ватсон выглядел как молоток, занесенный
  над гвоздем. Я не могла забыть этого музыканта – мощного, уверенного, требовательного
  и неистово экспрессивного. Позже, когда моя журналистская профессия втянула меня
  в мир Уэст- коуст блюза, мне показалось что все, с кем мне приходилось говорить,
  находились под сильнейшим влиянием страстной игры Ватсона, его яркой личности и
  таланта. Итак, я распушила хвост, и позвонила ему. Он был так вежлив!! (Наверное,
  он никогда не слышал, как я пытаюсь играть фанк). Майк "Джуниор" Ватсон родился
  в 1949 году в Висалии (Visalia), Калифорния, в самый разгар увлечения серф-группами.
  Ему нравилась серф-группа "Satellites" и резкая, режущая ухо Чикагская группа под
  названием "Charades." В 1963 году Ватсон приобрел на блошином рынке блюзовую сорокопятку
  - Lightnin'' Slim''s "Bed Bug Blues" (она все еще у него хранится), которая стала
  его первым знакомством с черным блюзом. В дальнейшем Питер Грин, гитарист группы
  Fleetwood Mac и харпер с манерой трубача Литтл Уолтер (Little Walter (Jacobs), предопределили
  его судьбу. Ватсон вскоре начал играть на ритм-гитаре в "Gary Smith Blues Band"
  - известной в своем районе группе, где он аккомпанировал таким людям, как L.C. Good
  Rockin'' Robinson и Big Mama Thornton. Крепкая дружба со Стивом Гомесом (Steve Gomes
  - работал с Ronnie Earl, Darrell Nulisch, и другими) и Биллом Стьювом (Bill Stuve
  - Mighty Flyers), двумя замечательными басистами, позволяла ему все время быть в
  работе. Он начал приобретать известность. Стьюв и Ватсон в летнее время работали
  с Нэйтом Бранчем (Nate Branch - играл в баскетбольной команде Гарлема Globetrotters),
  в группе, которая выступала в Лас-Вегасе и Рено (уверена, что ущерб тестостерону
  был нанесен ужасающий). В это время Гомес привлек внимание мастера гармоники Рода
  Пьяццы (Rod Piazza) к гитарной игре Ватсона. Вскоре, Ватсон оказался в группе Пьяццы,
  а несколько месяцев спустя, привел туда басиста Билла Стюва (Bill Stuve). После
  неполных одиннадцати лет успешной работы с "Flyers," Ватсон уходит и присоединяется
  к "Canned Heat". Умение Ватсона воспринимать чужую музыку и его работоспособность
  способствовали продолжительной работе на студии и участию во всевозможных независимых
  проектах, таких как создание собственной группы совместно с Линвудом Слимом (Lynwood
  Slim - Richard Duran, певец и харпер), и участие в роли гитариста в "West Coast
  Playboys". Вот уже более 30-и лет Ватсон сплавляет джаз, свинг и блюз воедино в
  своем совершенно оригинальном стиле. Удивительно, что Ватсон, будучи "почти культовой
  фигурой" не имеет широкой известности среди любителей музыки. Возможно, это объясняется
  тем, что в студийной работе он всегда выступает в роли сайдмена, приглашенного гитариста.
  Исключение составляет лишь его собственный альбом "Long Overdue", выпущенный на
  BlackTop. И это вполне естественно. На качество его игры можно уверенно положиться.
  Это прекрасно слышно на его совместных записях с Big Mama Thornton, George "Harmonica"
  Smith, Jimmy Rogers, Luther Tucker, Charlie Musselwhite, Kim Wilson, William Clarke,
  The Mighty Flyers, Canned Heat, всех не назовешь. Ватсон - работяга. Стьюв в шутку
  называл его "саморазрушительной бомбой". Возможно, именно это требуется, чтобы так
  всецело отдаваться блюзу. CATHI: У вас со Стивом (Gomes) и Биллом (Stuve) давняя
  музыкальная дружба? JR: Да, Стив играл на басу в "Gary Smith Band," а потом во "Flyers".
  Он всегда всех вдохновлял. Он очень многому учил меня! Когда мы слушали вместе музыку,
  он часто говорил "А послушай–ка вот это!" Он помешан на музыке. А какая у него коллекция
  записей – невероятно! Позже, когда Род подбирал музыкантов для выступлений в Северной
  Калифорнии, Стив показал ему мои вещи. Это, в общем-то, и сблизило меня с Родом
  и Флаерами. CATHI: И ты подтянул Стьюва? JR: Ну да, мы же выросли вместе... вместе
  играли во всех группах. Стьюв – замечательный парень и обалденный басист. Я помню,
  во время первых гастролей Род заехал за мной на машине. Я полез внутрь, а там сидят
  Smokey Wilson, George "Harmonica" Smith, и Shaky Jake (Harris)! (Смеется) Я просто
  сказал "ОГО... чего это тут происходит!" Мы должны были аккомпанировать этим ребятам,
  и это был лучший момент в моей жизни. Джордж был великолепен! CATHI: Я слышала,
  что он очень артистичен. JR: Замечательный, удивительный музыкант! У меня есть запись
  нашего выступления с ним на Long Beach Festival. Он исполняет только три песни,
  незадолго до этого он перенес операцию на сердце. Он чувствовал себя неважно, и
  ему потребовалось некоторое время, чтобы выйти на сцену. Род дважды объявил его,
  а потом произнес: "Уолтер" (потому что он иногда выставлялся то Литтл Уолтером,
  (смеется), то Джимми Ридом!), "Уолтер, ты вылез лимузина?" А Джордж кричит ему:
  "Я болею, и торопиться не собираюсь!" Он начал играть и очень скоро толпа завелась.
  Я видел, как он прыгал с трехметровой сцены в толпу! Он делал это с кардиостимулятором!
  Но самое лучшее того, что он делал, я увидел в одном занюханном клубе в гетто в
  Санта-Барбаре. Знаете, черные музыканты по-другому выступают в черных клубах. Мне
  кажется, они более сдержаны и зажаты перед белыми зрителями. Ну, в общем, Джордж
  положил глаз на одну здоровую черную девчонку зрителей. Он притащил ей кучу еды,
  он работал на нее, понимаешь? Ну, все выглядело так, словно он играл только для
  нее. А потом, он прыгнул кувырком со сцены и приземлился рядом с ней, а потом сделал
  еще пять таких прыжков, при этом играя на гармонике. Затем, он приблизился к ней,
  упал на колени и схватил себя за волосы – его лоб весь сморщился. Он вдруг стал
  тянуть себя вверх и вниз. Это надо было видеть! Знаете, было похоже на аккордеон
  (смеется). Я закричал «Ого, вот это ДУРЬ!» (Смеется). Джордж сказал мне однажды,
  что это - утраченное искусство блюза. Ребята тогда пытались перещеголять друг друга.
  Джордж рассказывал, как он сажал Мадди (Waters) себе на плечи и нес его сквозь толпу!
  Иногда, исполняя "Mojo" ("I Got My Mojo Workin''"), Мадди брал бутылку пива, взбалтывал
  ее, и совал себе в штаны. А потом просовывал горлышко в ширинку, и стрелял пробкой
  в девчонок (дико хохочет), они от этого становились просто ДИКИМИ! Джордж говорил
  «Считай, что не знаешь Мадди, если не видел, как он проделывает этот трюк!» CATHI:
  Как бы мне хотелось посмотреть всех этих ребят в черных клубах. Джимми Джонсон (Jimmy
  Johnson) однажды сказал мне, что есть два типа блюза – один для черных, другой для
  белых. JR: Это точно. Знаете, своего опыта скажу, я часто бывал в черных клубах,
  им плевать какой у тебя цвет кожи; они заводятся просто моментально. Они ХОТЯТ,
  чтобы ты что-нибудь отколол, понимаешь? Я помню один вечер, когда все черные девчонки
  хотели со мной потанцевать. Джонни (Johnny Dyer) все подходил ко мне и приговаривал:
  «Эй, познакомься с этой девчонкой!» А я ему: «Э-нет, только не с ней!» Это была
  классика. А еще я танцевал как идиот! (Смеется). CATHI: Когда ты присоединился к
  "Flyers", вы со Стьювом направились в Лос- Анжелес. Наверное тогда для вас наступило
  время большой сцены. JR: Мы поначалу ездили туда работать, но всякий раз возвращались
  – это продолжалось…о, Господи – почти год. Наши машины рассыпались на части, а мы
  еще каждое лето должны были выступать с бэндом Нэйта. Было весело. В итоге мы решили
  туда перебраться. Мы некоторое время спали на полу у Джеймса (Harmon). CATHI: Еще
  один персонаж! JR: Он вообще балдежный (смеется)! Мы здорово проводили время. Он
  приходил поиграть, а потом и весь его бэнд тоже. Мы выступали по очереди: его бэнд,
  Hollywood Fats Band и мы. Мы создавали блюзовую сцену, которой там раньше не существовало.
  CATHI: Как долго ты играл с Rod Piazza? JR: В общем, с 77-го по 80-ый, потом взял
  небольшой перерыв, и продолжил с 81-го по 88-ой. CATHI: Устал от гастролей? JR:
  Ну знаешь ли, были маленькие трения. И у Рода и у меня твердый характер (смеется).
  Род иногда мог быть не слишком отзывчивым, и за это его нельзя винить – он невероятный
  харпер. В общем, понимаешь, мне просто хотелось уйти и заняться кое-чем другим.
  Род тоже путешественник – он вкалывает как проклятый – он как автомат для производства
  денег! Чарли Массельвайт (Charlie Musselwhite) пригласил меня на гастроли. Все так
  забавно получилось - примерно тогда же мне позвонил с той же просьбой Джон Ли Хукер
  (John Lee Hooker). Я не мог ему перезвонить, потому что не хотел говорить нет! Но
  я все же решил поехать с Чарли. CATHI: Ты собирался перетянуть к Чарли и Стьюва
  тоже, не так ли? Разве Стьюв не ушел в то же время Флаеров? JR: Ушел. Он тогда играл
  с другой группой, но потом решил попробовать с Чарли. Чарли крепко выпивал в те
  дни. Он здорово шатался, а мне казалось, что он во всю оттягивается. Он подходит
  и говорит Стьюву (растягивая слова): «Что-то я тебя не слышу, но чувствую, как от
  тебя пол трясется!» (смеется) Чарли принял Стьюва на работу, а когда Стьюв уже должен
  был приступить, он просто не вспомнил, что взял его в состав. Тогда я ушел, и мы
  со Стьювом вернулись к Роду. CATHI: Ты окончательно ушел от Пьяццы в 88-ом? JR:
  Мы должны были в очередной раз ехать с гастролями в Финляндию, а мне просто не хотелось.
  Алекс Шульц часто работал на подменах. Он был в восторге от этой музыки, а я к тому
  времени был уже как старый конь (смеется). Ну, я и ушел, и Алекс заменил меня. Тем
  не менее, все было здорово. CATHI: У Пьяццы работали разные гитаристы, и каждый
  со своим характерным стилем. Интересно, как они укладывались в представление Пьяццы
  о блюзе? JR: Все верно, каждый них привносил свое. Знаешь, мне не хотелось идти
  к Алексу до тех пор, пока он сам не был готов к этому, понимаешь? CATHI: Он мог
  перепугаться, если бы ты пошел. Он говорит, ты для него как великий герой. JR: Послушай,
  что я сделал. Я достал парик и обсыпал его мукой. В моей бороде ее тоже было полно,
  (Род был против какой-либо растительности на лице, но я тогда играл с "Canned Heat",
  а им нравилось). Я нацепил такие шмотки, что никто бы меня не узнал, и отправился
  со своей девушкой к ним на концерт. Я изменил голос, и просидел почти целый сет,
  пока кто-то сказал, "Мужик, ты КТО?" А я говорю: «Ватсон». Ну, тот парень бежит
  к Стьюву и рассказывает ему. Стьюв, не предупредив Рода, говорит в микрофон: «Здесь
  находится парень известной рок-банды». Я подумал, он скажет "Canned Heat", а он
  говорит: «Леди и джентльмены, это Джерри Гарсиа!» (Смеется). Ну, я иду на сцену,
  и после первых двух нот все понимают, что это я… Забавно было. Но тогда я в первый
  раз я услышал, как играет Алекс, и свинговал он просто здорово. CATHI: (Смеется)
  Алекс говорит, что передрал у тебя все, что только мог! JR: Ну что ж, он честный
  парень. Ну и не только он... Рик Холмстром тоже признавался. Он мой лучший друг.
  Он славный парень. CATHI: Он только и говорит о том, как ты хорош! JR: Он сам очень
  хорош! Мы скоро закончим нашу запись – уже шесть вещей записали. Может быть, четыре
  них будут что надо. CATHI: Здорово! Итак, ты перебрался в "Canned Heat"? JR: Да.
  Платили МНОГО, но в музыкальном смысле удовлетворения не было. А потом у меня был
  совместный проект с Линвудом Слимом (Lynwood Slim). Он классный харпер и певец.
  Сейчас я уже переиграл почти со всеми харперами на Западном побережье: Lynwood,
  Bill Clarke, Rod (Piazza), Charlie Musselwhite, Gary Smith, Kim Wilson, George "Harmonica"
  Smith, Mark Hummel... CATHI: В чем, как тебе кажется, заключается вся сложность,
  когда аккомпанируешь харперу? JR: Ты не должен ему мешать. Звук должен быть такой
  приглушенный. Нужно играть хороший подклад, акцентировать и не повторяться, ну и
  слушать внимательно. CATHI: Раз уж мы об этом заговорили, расскажи мне о своем звуке.
  Как ты добиваешься такого замечательного звука? JR: По правде говоря, я думаю тут
  все дело в самом отношении к звуку. Многие говорят, что все дело в пальцах и тому
  подобное, но я думаю, ты должен слышать тот звук, который тебе нужен – он должен
  звучать у тебя в голове. Понимаешь, о чем я? Ведь я почти всегда могу сделать свой
  звук на любой гитаре и усилителе. Большинство гитаристов не придают должного значения
  звуку. А это та основная вещь, которая меня зажигает в первую очередь. Да, вот что
  еще хотел сказать… знаешь, когда я начинал с Гэри Смитом (Gary Smith), я слушал
  записи Литтл Уолтера (Little Walter). Это тот стиль аккомпанемента, о котором мечтают
  харперы. Но, существует не так много информации о том, как играть соло на этот дабл-шаффл,
  или на дабл-шаффл с акцентом на основных долях такта. Поэтому я пытался найти это
  у джазменов. Это ассоциировалось у меня именно с их стилем, со стилем ребят вроде
  Тайни Граймса (Tiny Grimes). У него необъятный звук, такой, что выходит берегов
  и заполняет все пространство вокруг, звук гитары с перегруженным усилителем. Просто
  обожаю этот звук! CATHI: Я тоже. Мне кажется замечательно то, что ты потратил массу
  времени, помогая другим гитаристам, так же как и тебе помогали в свое время, увлекая
  их своей игрой, увлекая их старым блюзом, побуждая их играть. Не многие гитаристы
  делают такое. Они не понимают, что ничего от этого не потеряют. JR: Это правда!
  Ты есть ТЫ и никто другой, так? За это тебе тоже воздастся, понимаешь? Рик (Holmstrom,
  нынешний гитарист "Mighty Flyers") и Алекс - это уже два, а теперь есть еще этот
  паренек, Кирк Флетчер (Kirk Fletcher). Ему всего 22 или что- то вроде того, он полон
  сил, энтузиазма, и он ОБОЖАЕТ Вилли Джонсона и всю ту музыку, о которой его ровесники
  просто понятия не имеют. Он не может найти, с кем ему играть, понимаешь? И это печально,
  ведь у него такая страсть к музыке. CATHI: Да, грустно, но так оно и есть. Сейчас
  миром правит блюз-рок. Традиционный блюз вне игры... в игре – наследники Стиви.
  Я рада, что ты так много работаешь в студии, надеюсь, ты запишешь еще один сольный
  альбом. JR: Да. Пока что я участвовал в записи 45-и альбомов, а сейчас мы с Холмстромом
  работаем над кое-чем. Я с восторгом жду, когда начну играть в трио в следующем году.
  Со мной будет Кедар (Kedar Roy- контрабасист в нынешней группе Ватсона) и может
  быть два разных барабанщика. CATHI: Мне не терпится это услышать. В трио у тебя
  будет масса пространства, будет, где развернуться. JR: Да. Мы уже дали несколько
  концертов, все очень здорово, потому что я вижу как в музыкантах появляется раскованность,
  как меняется их отношение. Кедар стал более живой, он вопит и кайфует когда играет,
  ну а я, бывает, вообще просто с ума схожу! (Смеется). К блюзу нельзя слишком почтительно
  относиться! Дискография Дж. Ватсона 10/99 Big Al Blake & The Hollywood Fats Band
