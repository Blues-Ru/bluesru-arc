extra_text: 'Арсен Шомахов и Регтайм в Мемфисе Memphis City I Come или Как мы съездили
  в Мемфис Арсен Шомахов и группа &laquo;Регтайм&raquo; Идея В ноябре 2004 года сайт
  blues.ru стал филиалом Blues Foundation ( blues.org ) и решил выдвинуть нас в качестве
  представителей российского блюзового сообщества (blues.ru community) для участия
  в Международном конкурсе исполнителей блюза, который Blues Foundation в 21-й раз
  проводил в Мемфисе. В этом году конкурс проходил с 3-го по 5-ое февраля. К моменту,
  когда было принято решение подать заявку на участие, в нашем распоряжении был лишь
  один день. Тем не менее, все необходимые материалы были оперативно собраны и предоставлены
  без опоздания. Разница часовых поясов сыграла нам на руку - московское время опережает
  время в Мемфисе на 9 часов. Чуть позже мы получили от Уэсли Смита, продюсера конкурса,
  подтверждение того, что наша группа официально включена в число конкурсантов. Визы
  Получить американские визы нам представлялось делом практически безнадежным, тем
  более что времени на это было в обрез - мы очень долго ждали факс с официальным
  приглашением на конкурс от Уэсли, а когда, наконец, получили его, до даты отъезда
  оставалось 3 недели. Но все же мы взялись за дело, чтобы позднее не было мучительно
  больно за неиспользованный шанс. Мы заполнили необходимые формы, собрали документы,
  подтверждающие отсутствие иммиграционных намерений, собрали публикации и прочие
  материалы о группе, деньги на консульский сбор и курьерские услуги и направили все
  в Москву. Мой брат подал все документы в Pony Express (эта контора принимает заявления
  на неиммиграционные визы и направляет в Посольство США), и в тот же день сообщил
  мне дату и время собеседования. Без особой надежды на успех мы выехали в Москву
  и:, к нашему великому удивлению паспорта с визами были готовы уже на следующий день!
  Спонсоры проблема состояла в том, чтобы за 2 недели найти деньги на покупку авиабилетов,
  оплату гостиницы, проживание, проезд в Москву и обратно. Мы использовали все возможные
  и невозможные приемы, и в результате, благодаря поддержке сайта blues.ru, министерства
  культуры Кабардино-Балкарии, коммерческих банков "Бум.Банк", "Сбербанк", универмага
  "Нальчик", Фонда культуры Кабардино-Балкарии, кафе "Амиго", где мы регулярно выступаем,
  друзей и родственников, необходимая сумма была собрана. Билеты Москва-Нью-Йорк-Цинциннатти-Мемфис
  и обратно были приобретены незамедлительно. По интернету мы отыскали недорогой мотель
  недалеко от центра города и забронировали номер с 1-го по 7-е февраля. Отъезд в
  Москву Мы отправились в Москву на автобусе, прельстившись недорогими билетами и
  относительно небольшим (24 часа, поезд - 36 часов) временем в пути. Все самолеты
  на Москву в тот момент из-за плохой погоды приземлялись в Нижнем Новгороде. Мы собрали
  вещи, инструменты, пирожки в дорогу и отправились в Москву. По плану у нас был день
  в запасе до вылета, чтобы отдохнуть после автобусной тряски, пыли и водки. Мы и
  предположить не могли, с какими сложностями нам придется столкнуться! За полночь
  мы проехали Ростов и, через 50 км, уперлись в пробку, которая как выяснилось позже,
  растянулась на 20км и перекрыла дорогу на неделю. Уговорив водителя вернуться в
  Ростов, мы избежали участи быть заблокированными в постоянно прирастающей череде
  замерзших машин. Добравшись до окраины города, мы стали судорожно соображать, что
  же делать дальше. Около 4 ночи мы остановили проезжавшее мимо автобуса такси, очевидно
  ниспосланное свыше, и направились на ЖД вокзал. Мы взяли билеты на поезд Нальчик
  - Москва, который по счастью уже стоял на станции, и должен был прибыть в Москву
  утром в день вылета. Несмотря на 2-х часовое опоздание поезда, в аэропорт мы попали
  вовремя. Вылет После долгих переговоров нам удалось убедить сотрудников аэропорта
  в невозможности отправки бас гитары с багажом, и никакие упоминания о волшебных
  &laquo;спецконтейнерах&raquo; нас не могли поколебать. Позже мы воочию увидели,
  каким образом перегружался багаж в Нью-Йорке, и сказали себе, что тысячу раз были
  правы: грузчики, похоже, забавы ради, изо всех сил швыряли дорогие чемоданы на ленту
  транспортера, одобрительно покрякивая и ухмыляясь. В комфортабельном и просторном
  Боинге 767 нашлось достаточно места для 2 гитар и набора тарелок. Весь перелет с
  двумя пересадками длился 17 часов. Наконец, около 10 вечера, мы прилетели в Мемфис.
  Мотель В Мемфисе шел дождь. В аэропорту мы взяли такси и минут за 20 добрались до
  мотеля, который произвел на нас несколько тревожное впечатление - подозрительные
  личности, снующие вокруг, какой-то негр на инвалидной коляске вынырнул из-за угла
  и прошипел что-то недружелюбное. В общем, как в плохом кино. Я подумал, что переутомился,
  плохая погода и все такое: Заселившись, мы тут же улеглись спать. (В течение нашего
  пребывания в мотеле, полиция появлялась раза 3, однажды на наших глазах в наручниках
  увезли огромного чернокожего детину) Знакомство с городом День выдался пасмурный,
  мы вышли прогуляться и пешком добрели до набережной Миссиссиппи, где сделали первые
  снимки. Надо сказать, что кроме нас пешеходов в городе почти не было заметно, исключая
  бездельников охотящихся за мелочью. Возвращаясь, мы набрели на офис Blues Foundation,
  который находится недалеко от великой реки, и встретились там с Джеем Зельманом
  - одним сотрудников Фонда. Он был рад, что мы все-таки смогли добраться, и запечатлел
  нас троих на фоне офиса Blues Foundation. Дождь, правда, слегка подпортил фото.
  Конкурс: день первый 84 группы и около 40 дуэтов и солистов 8 стран и 32 американских
  штатов должны были принять участие в конкурсе. Это самое большое число за всю историю
  конкурса, о чем с гордостью говорили его устроители. 84 блюзовые группы были разбиты
  на подгруппы по 8 - 9 в каждой и распределены между 10-ю клубами, располагающимися
  на знаменитой Beale street.. Каждой группе давалась возможность выступить дважды
  - 3-го и 4-го февраля. Время выступления ограничивалось 30-ю минутами. Оба дня выступления
  оценивали разные судьи, по 3-е судей на один клуб. Выступления оценивались по следующим
  критериям: блюзовое содержание, оригинальность, талант, сыгранность, сценическое
  мастерство. За каждые лишние 10 секунд накладывались штрафные очки. По результатам
  2 выступлений каждого клуба в финал могла выйти только одна группа. Нам и всем остальным
  конкурсантам в этот день было необходимо зарегистрироваться в Union Caf&eacute;
  в здании гостиницы Holiday Inn и получить расписание выступлений конкурсантов. Зарегистрировавшись,
  мы получили брошюрку конкурса, где было указано, что выступаем первыми в клубе Blues
  City Cafe в 18ч30 и шестыми на следующий день в 21ч50 мин. Кроме того, нам выдали
  цветные бумажные браслеты, которые являлись пропуском в любой клуб на Beale street
  на 3 и 4 февраля. Получив расписание, мы решили сходить на разведку в Blues City
  Cafe, посмотреть оборудование, помещение и пообедать. После мы направились на очередную
  сходку (Bands orientation), где конкурс был официально открыт, и можно было задать
  вопросы устроителям. Там мы встретились с группой Blues mobile band Грузии, которые
  уже во второй раз приехали на этот конкурс. В Блюз Сити кафе мы прибыли к 18ч00,
  встретились с звукорежем и снабдили его своим стейдж планом. В кафе мы быстро сошлись
  с музыкантами Иллинойса, группы 6V6, которые с радостью одолжили Беку малый барабан
  (в правилах указывалось, что музыканты должны были иметь только свои тарелки и педаль
  басового барабана, однако в реальности все было иначе), и оказались очень простыми
  и отзывчивыми людьми. Наконец нас объявили, и после 10 минут, отведенных на подготовку,
  мы лихо отыграли свои неполные 30 минут. Наш сет лист состоял 6 собственных песен
  и одного не слишком известного кавера. Принимали нас очень тепло, атмосфера была
  замечательная, здорово поддерживали и зрители и конкурсанты. После сета к нам по
  очереди подошли все трое судей и пожали руки. Один них занимается судейством вот
  уже 10 лет, отметил наш "высокий уровень" и сказал, что поставил нам высокие оценки,
  не смотря на то, что сложно это делать в самом начале конкурса, не зная, кто будет
  выступать позже. Все это нас чрезвычайно воодушевило. В тот вечер нам удалось послушать
  большую часть конкурсантов нашей подгруппы, пообщаться с множеством людей и продать
  с десяток пластинок. Было здорово видеть, как люди в инвалидных колясках беспрепятственно
  проезжали к самой сцене и от души прихлопывали в ладоши, попивая пиво. Конкурс:
  день второй На второй день мы подъехали в Блюз Сити Кафе к началу конкурса и стали
  терпеливо дожидаться своей очереди. Мне нездоровилось в течение всего дня, слушать
  было тяжело, хотя звук во второй день был значительно лучше - меньше гудели басы
  и в целом, звучало более прозрачно. всех выступавших в нашей подгруппе нам очень
  понравилась группа Big Rick and the Bombers, состоявшая темнокожих певца-гитариста,
  певицы, барабанщицы (Бек с ней быстро подружился) и белых гитариста и басиста. Они
  играли добротный прифанкованный блюз, их замечательное пение, грув и артистизм привели
  нас в восторг. На удивление звучало много жесткого рок-блюза. Группа Нью-Йорка The
  Urban Pioneers делала костюмированное шоу и играла некую гремучую смесь Дженис Джоплин
  и Лед Зепплин. Было несколько молодых чрезвычайно техничных гитаристов игравших
  в духе СРВ. К сожалению, в нашей подгруппе я не услышал ни одной свинговой группы.
  Мы выступали после Korey Montgomery Band, лидером которой был полный румяный юноша
  в берете с изображением гитары. Он играл на жестко примоченном звуке и пел не по
  годам хриплым голосом, что-то похожее не Джонни Лэнга. Нас объявили весело: Все
  вы уже знаете, слова "Да", "Перестройка" и что-то там еще, а теперь, разрешите представить
  Вам :. и т.д. Выступление нам самим понравилось, больших претензий к себе не возникло.
  Мы продали еще дисков, один конкурсантов спросил меня, есть ли на диске песня "Let
  me be your Romeo" и может ли он сделать ее кавер. Что сказать, приятно:однако этой
  песни на том диске не было. Там же я познакомился с Джейсоном, гитаристом группы
  The Tablerockers Арканзаса - талантливым и приятным в общении человеком. Он рассказал
  мне о сложностях профессиональных блюзменов в Америке. По его словам, если в лучшие
  времена приходилось ехать на своем фургоне до очередного клуба 3 часа, то теперь
  это расстояние увеличилось до 9 часов, т.к. очень много заведений вышло бизнеса.
  С трудом покрываются расходы на бензин, еду и т.д., не говоря уже о заработке, и
  очень много профессионалов были вынуждены прекратить играть. В то же время ему казалось,
  что надежда на улучшение ситуации с блюзом в Америке все-таки есть. Оказалось, Джейсон
  знаком с Аамундом Морюдом, который в прошлом году приезжал на конкурс и запомнился
  ему своим мастерством. Объявление финалистов Незадолго до окончания конкурсной программы
  ко мне подошел звукореж и предложил поиграть по окончании конкурсной программы в
  клубе еще пару часов, до 2 часов ночи. Я обсудил это предложение с Асланом и Беком
  и решил отказаться, т.к. в этот вечер должны были объявить финалистов в Cadre Building,
  где уже шел джем конкурсантов. Переместившись в Cadre Building, мы пополнили толпу
  нетерпеливо ожидавших результатов музыкантов, часть которых жевала чипсы и потребляла
  пиво, другая стояла в очереди для записи на джем, с участием Дебры Колман (кстати,
  я так ее и не увидел на этом джеме, возможно, она выступала в самом начале). Все
  это длилось целую вечность и, наконец, уже после 2 часов ночи были объявлены финалисты.
  С замиранием сердца я вслушивался в слова объявлявшего, однако к моему разочарованию,
  названия нашей группы не прозвучало. Чтобы понять, кто же все-таки вышел в финал
  нашей подгруппы, я подошел к Биг Рику, который на мой вопрос ответил просто: "The
  lady that looks like a dude:", имея в виду вокалистку группы Patrick McLauglin band.
  В голове почему-то сразу зазвучало: "Dude looks like a lady, dude looks like a lady:"
  На самом же деле, в финал вышел Kory Montgomery, молодой гитарист, о котором я писал
  выше. Мы взяли такси и поехали в мотель, я завел беседу со старым чернокожим таксистом,
  который, растягивая на южный манер, говорил: "I used to like the blues when I was
  young:". и т.д., заболтавшись, он завез нас в другой район и, стал извиняться, рассказывая
  очередную байку об одном русском парне, которого он знал в далекой молодости и называл
  не иначе как "Russian Bear". Это был самый замечательный таксист за все время нашего
  пребывания в Мемфисе. Финал Мы пришли посмотреть и послушать финал в Daisy Theater
  за 40 минут до начала. По-видимому, это известный зал, при входе анонсировались
  мартовские концерты Govt Mule и Steve Vai. К тому времени к входу уже выстроилась
  очередь. Людей стали запускать минут за 15 до начала, и очередь успела растянуться
  метров на сто. Нам, бывшим конкурсантам, никаких поблажек при входе не было. Выложив
  по 16 баксов за билет мы вошли. Небольшой зал с балконом и жесткими раскладными
  стульчиками обладал очень важной деталью - огромным баром, у которого все время
  толпился народ. Мы прослушали 8 групп 10 - больше не хватило сил. Прекрасно открыла
  вечер группа Детройта Lady Sunshine and the X Band. Большой состав с брасс секцией
  и превосходной вокалисткой. Но самое яркое впечатление произвела Diunna Greenleaf
  and the Blue Mercy Band. Превосходная певица и замечательный гитарист. Они делали
  классное шоу. Особенно здорово получилась "The things that I used to do" (кавер
  в финале:) Певица и гитарист "ссорились", играли в вопрос-ответ и совершенно покорили
  слушателей. По окончании выступления весь зал и мы в том числе, аплодировал стоя.
  Все остальное показалось не слишком интересным, хотя конечно, уровень был высокий.
  Не обошлось и без накладок по звуку. В течение всего концерта я испытывал болевые
  ощущения в грудной клетке при каждом ударе бас тома, барабаны были отстроены очень
  хорошо, но совершенно по-роковому и громче чем надо. Мы сидели в партере, возможно
  ближе к пульту и задним рядам звук был более сбалансированным. Еще запомнилось выступление
  одного состава, где девушка-харпистка все выступление звучала только в мониторе.
  В последней песне, когда звук наконец пошел в зал, звукореж получил порцию аплодисментов.
  Воскресенье У нас был свободный день перед отъездом, чтобы еще раз побродить по
  городу и послушать музыку. Мы здорово оттянулись в B.B. King club. ПО всей видисоти
  играл тамошний хаусбэнд с мощной певицей и очень пожилым Лид гитаристом, при поддержке
  солидной ритм-секции и молодого ритм-гитариста. Певица принимала заказы написанные
  на салфетках, и, казалось группа могла исполнить все что угодно. Все очень душевно,
  почти по-семейному. В одном супермаркете к нам подошли бывшие конкурсанты и поинтересовались,
  кто-же взял призы. Я объяснил, что мы не досидели до объявления результатов, хотя
  ушли за полночь. Оказалось, что они сидели еще дольше, но даже в 2 ночи результаты
  не объявили. А места распределились следующим образом: 1 место - Joey Gilmore ,
  чернокожий певец гитарист представлявший блюзовое общество Тайваня (!), чье выступление
  в финале не запомнилось вовсе. Призы: 1500 USD, гитары, барабаны и проч. муз оборудование,
  интервью для журнала Blues Wax, консультации фирмы Crows feet productions, выступления
  на 10 фестивалях, включая выступление на VIP pre-party на церемонии вручения премий
  W.C.Handy. 2 место - Diunna Greenleaf and the Blue Mercy Band , группа понравившаяся
  мне больше всех. Гитарист, как мне кажется, совершенно по-праву, получил приз им.
  Альберта Кинга - гитару Gibson flying V. Приз - 750 USD. 3 место - Lady Sunshine
  and the X Band Детройта, о которых я уже писал. Приз - 500 USD. Финалистов выбрало
  жюри в лице представителей блюзовой индустрии, не имеющих отношения к Blues Foundation,
  для пущей беспристрастности. знакомых мне имен прозвучал Пол Ошер. Мы заехали в
  музыкальный магазин, который нашли с трудом, почти на окраине города. Там в просторном
  кафе (часть магазина) с лавочками и фонтанами выступала группа темнокожих подростков,
  которая совершенно свела бы с ума любителей джаз-рока. Особенно понравился басист
  - долговязый левша лет 14-ти, который творил со своим басом что-то невероятное,
  и совершенно дикий барабанщик такого же возраста, который плавал в перекрестных
  ритмах и нестандартных размерах как рыба в воде:Гордый руководитель юных дарований
  сидел рядом и делал по ходу какие то замечания: В тот же день мы попали в деловую
  часть города, которая показалась декорацией к съемкам сюрреалистического фильма
  - ни души на улицах и только пустой трамвай снующий туда - сюда:. очень странное
  впечатление. (Кстати, трамвай по-американски почему-то называется trolley). Отъезд
  в Москву В аэропоту Мемфиса сотрудники отвечающие за безопасность не позволили нам
  взять с собой на борт ключ от малого барабана и ручку гитарного тремоло с шестигранником
  на конце:Пришлось возвращаться, просить в багажном отделении найти сумку, положить
  эти мелочи в багаж, перерегистрировать его, вновь пройти секьюрити чек и т.д. К
  счастью больше проблем не возникло и через15 часов перелета (путь назад чуть короче)
  теплого расслабленного Мемфиса мы попали в занесенную снегом суматошную Москву.
  В тот же вечер мы отыграли концерт в Доме у Дороги, где радостно встретились с друзьями,
  вручили Федору сертификат Филиала Блюзового Фонда и, наконец, в усмерть напились.
  На следующий день Аслан с Беком едва успели на автобус в Нальчик, а я задержался
  еще на пару дней, чтобы поучаствовать в гитарном фестивале в ЦДХ. Выводы Трудно
  поверить, но поездка состоялась. Она придала нам уверенности в себе, своих силах,
  и в своей музыке. Мы получили огромный энергетический заряд. Хотя бы ради этого
  стоило съездить, не говоря уже о возможности посмотреть блюзово-рок-н-ролльный город,
  увидеть Миссиссиппи, снять шляпу перед статуей Хэнди, заглянуть в Sun Studio, послушать
  музыку и пообщаться с американцами. Я искренне благодарен всем и каждому в отдельности,
  кто помог этой поездке осуществиться! Wazzzzuuuuppppp!!! Арсен Шомахов, 17 февраля
  2005, Нальчик ragtime.blues.ru - сайт группы Регтайм arsenic.blues.ru - англоязычный
