extra_text: 'Премия W.C.Handy 2001 года На 22 церемонии вручения главной блюзовой
  премии - имени ДаблЮ-Си-Хэнди - объявлены первые лауреаты нового века. Артистом
  года стал БиБиКинг. У него же премия за лучший альбом современного блюза, записанный
  им напару с Эриком Клэптоном: "Riding with the king". Альбом "Wicked" принес премию
  "За лучший блюзовый альбом года" молодой певице Шемекии Коплэнд. У нее же "Лучшая
  современная певица года". "Соул-певицей года" названа Этта Джеймс. Оно же в этом
  году "зачислена" в "Зал славы блюза". Новый альбом Сана Силза безусловно заслуживает
  премии года, но почему она выпала в категории "Альбом традиционного блюза" - понять
  невозможно. ( Впрочем, меня ужасает и плакат нынешнего года: неприятные краски,
  истеричная дама и странный 4хструнный гибсон, что ли?. ) На церемонии выступали
  Taj Mahal & the Phantom Blues Band, Bobby Rush, Eddy Clearwater, Clarence "Gatemouth"
  Brown, Big Jack Johnson, Kim Wilson and Levon Helm. Подробную информацию с иллюстрациями
  вы найдете на сайте Blues Foundation, которая и заведует премией W.C.Handy Awards.
