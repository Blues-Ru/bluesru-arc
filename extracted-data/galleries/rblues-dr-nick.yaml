extra_text: 'Dr.Nick Московская группа Dr.Nick Коллектив "Dr. Nick" появился на свет
  осенью 1994 года, когда московский гитарист и певец Дмитрий Казанцев решил вернуться
  к музыкальной деятельности после развала его группы "White Spirit". Всё началось
  с того, что Дмитрий и его американский друг Joe DiCarlo начали репетировать программу,
  состоящую, в основном, традиционных блюзов и фолк-песен. Вскоре дуэт стал выступать
  в различных концертных точках Москвы, включая такие клубы, как "Кризис Жанра" и
  "B.B. King". Группа не сразу приобрела постоянный состав и название. Изначально
  она выглядела так: Joe DiCarlo (гитара, добро, вокал), Дмитрий Казанцев (гитара,
  вокал), Colin Oldham (виолончель, вокал), Сергей Слуцкий (бас-гитара). Идея Joe
  заключалась в том, что все играют только на акустических инструментах, пытаясь найти
  новое звучание для классических блюзовых номеров. Название "Dmitri Johnson String
  Quartet" полностью соответствовало его задумке. Через некоторое время в группе появился
  перкуссионист Edward Keenan и гитарист Nick Riesland. Коллектив был переименован
  в "Dead Shrimps" в честь композиции Роберта Джонсона "Dead Shrimp Blues", исполняемой
  группой. Такое необычное название слегка пугало владельцев клубов и потенциальных
  слушателей, видимо, вызывая ассоциации с панк-культурой, и Дмитрий предложил название
  "Dr. Nick" (Nick Riesland работал врачом посольства США в Москве, и был старше и
  колоритнее всех в коллективе). Постепенно американцы уезжали России, и состав группы
  продолжал меняться. Вместо Джо и Ника пришли Greg Smith и Саша Никишин, на ударных
  играл Дмитрий "Ветеран" Честных. Менялся и стиль - с отъездом Джо на родину звучание
  уходило в сторону более сложного, прифанкованного и психоделического блюз-рока.
  Надо также отметить, что Дмитрий Казанцев параллельно играл в составе группы "Cry
  Baby" вместе с Никишиным (гитара, вокал), "Ветераном" (бас-гитара), Романом Гегартом
  (гармошка, вокал) и Игорем Иванковичем (ударные). Состав менялся вплоть до октября
  1998 года, когда Дмитрий Казанцев уехал в Нидерланды. С 1994 по 1998 год в группе
  играли: Joe DiCarlo (гитара, добро, вокал), Дмитрий Казанцев (гитара, вокал), Михаил
  Владимиров (губная гармошка), Сергей Слуцкий (бас-гитара), Colin Oldham (виолончель,
  вокал), Edward Keenan (перкуссия), Nick Riesland (гитара, вокал), Greg Smith (гитара,
  вокал), Саша Никишин (гитара, вокал), Дмитрий "Ветеран" (бас-гитара, вокал, перкуссия,
  ударные, гитара), Dave Grout (ударные, вокал), Костя Бабаян (ударные), Дмитрий Тюрин
  (ударные), Анна Плетнева (вокал), Юрий Дементьев (бас-гитара, вокал), Эдуард Протасов
  (гитара) и многие другие. В течение двух лет группа играла в "Кризисе Жанра" без
  Дмитрия, но в конце 2000 года он вернулся в Москву и продолжил занятия музыкой.
  С 2001 года основой коллектива являются два Дмитрия - Казанцев и "Ветеран". Дмитрий
  Казанцев с конца 80-х годов занимается англоязычным блюзом и роком. Первым его серьезным
  проектом был коллектив "White Spirit". Также Дима играл в таких группах, как "Crazy
  Men Crazy", "Cry Baby", "The Friends", "No Problem", в знаменитой "Sky Stranger"
  (Виктор Анисимов - ударные; Денис Малышев - клавишные, Слава Шин - гитара). Казанцев
  играет на различных гитарах, поет и пишет свои композиции (надо вспомнить, что уже
  в 1993 году выходил альбом "No More Spirits" группы "White Spirit"). В его репертуар
  входят сотни англоязычных композиций. Дима - заядлый меломан и ценитель хорошего
  звука; в его коллекции огромное количество виниловых пластинок и компакт-дисков
  различных жанров и стилей. Иногда на концертах его по ошибке называют Доктором Ником
  - забавно смотреть, как люди зала обращаются к Диме: "Николай!". Бас-гитарист Дмитрий
  "Ветеран" - довольно известная фигура в джазовой, блюзовой и поп-тусовках. Он играл
  в "Tim Strong Blues Band" с Игорем Бутманом и другими корифеями российского джаза;
  принимал участие в авангард-проекте Алексея Айги &laquo;4"33''&raquo;; успел засветиться
  даже в ансамбле Аниты Цой; и наконец, он два года был в составе "Ночных снайперов",
  а это уже вершина нашего поп-олимпа. При этом, "Ветеран" любит слушать и играть
  старый фанки-соул и блюз-рок, может классно исполнять американский рутс-рок. Ну,
  а в московской блюзовой среде его знает просто каждый - ведь он участвовал в таких
  командах, как "Cry Baby", "Blues Cousins", "The Friends", "No Problem", "Sky Stranger"
  и "Scolder Blues" (несколько проектов вместе с Казанцевым, как видите). На ударных
  в группе играют лучшие лучших: Дмитрий Севастьянов, Андрей Шатуновский, Эдуард Зизак,
  Сергей Ефимов, Игорь Игнатов, Виктор Анисимов, Dave Grout, Дмитрий Сланский, Сергей
  Чекморенко. На губной гармошке время от времени играет Сергей "Джон" Сорокин - прекрасный
  московский музыкант, известный по группе "Evergreens". С "Dr. Nick" часто выступает
  органист Гриша Сандомирский - лидер группы "Лампа Ладино". Группа выступает в клубах
  и пабах столицы, а также на фестивалях и музыкальных акциях ("Blues.ru - Весь этот
  блюз", "Путинка-блюз", "Фестиваль бас-гитары Bazz Day", "Блюз-фестиваль имени 100-летия
  Джона Хенри Барби", "Фолк-рок вечер в Ритм-н-блюз кафе", открытые джем-сейшны по
  средам в клубе "B.B. King" и акустические фолк-блюз джемы в "Доме у дороги" по понедельникам).
  Оба Дмитрия также принимают участие в проекте "Чернусь", где Казанцев пишет музыку
  ко многим песням Дмитрия Чернуся, а также занимается звукорежиссурой, продюсированием
  и аранжировками. На фирме "Снегири" вышли уже два альбома этого проекта - "Она"
  (2004) и "Он" (2005). Скоро выйдет и третий диск Чернуся (название держится в секрете).
  И вот, в ноябре 2005 года группа выпустила компакт-диск "Made At Home" на российском
  лейбле "Blues Time". На пластинке 14 композиций: 12 них написаны Дмитриями, а еще
  2 - это обработки традиционных фолк-блюзов. В данный момент группа заканчивает работу
  над вторым альбомом, который будет называться "2nd Time Around". Он появится в продаже
  осенью 2006 года. Контакты 8 903 794 71 73 - Дмитрий Ветеран 8 903 762 41 51 - Дмитрий
  Казанцев dr.nick@blues.ru dr-nick.livejournal.com Фотографии Российские музыканты'
