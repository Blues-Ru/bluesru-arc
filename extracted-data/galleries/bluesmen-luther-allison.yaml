extra_text: 'Luther Allison Luther Allison (17.VIII 1939 Mayflower, Ark., USA - 12.VIII.
  1997, Chicago) "Если вы видели меня на сцене, вы видели, как я получаю наибольшее
  удовольствие от жизни". Лютер Эллисон. Почти одновременно с известием о кончине
  Джона Клайда Коплэнда пришло и сообщение о том, что обнаружен рак легких и верхних
  дыхательных путей у другого лидера современного блюза - Лютера Эллисона. О том,
  насколько неожиданным это было, можно судить хотя бы по плотному гастрольному графику
  Эллисона, составленному на всю вторую половину 1997. Билеты, купленные заранее,
  многие любители блюза оставили у себя. Эллисон сгорел за один месяц. Он умер, не
  дожив 5 дней до 58 лет. Лютер Эллисон: американский блюзовый певец-гитарист, ветеран
  чикагской блюзовой сцены 60х, блюз-рокер начала 70х, традиционалист в 80х, неожиданно
  к концу 90х ставший бесспорным лидером техасского блюзового стиля. Родился в Арканзасе,
  14 15 детей в семье. Первый музыкальный опыт: пение в церковном хоре и игра на церковном
  органе. С семьей переехал в Чикаго в 1941г., стал участником полупрофессиональной
  вокальной группы The Southern Travellers, исполнявшей госпелл. Учился в одном классе
  с сыном Мадди Уотерса и имел возможность присутствовать не только на концертах Отца
  Чикагского блюза, но и на репетициях его блюзбэнда. Игрой на гитаре всерьез увлекся
  относительно поздно, в 18-летнем возрасте. С 1957 вместе со старшими братьями играл
  ритм-энд-блюз в группе The Rolling Stones, переименованной позже в The Four Jivers.
  Акомпанировал выступлениям Фредди Кинга, Мэджика Сэма и Отиса Раша. Под их влиянием
  принял стиль Уэст-Сайд блюза. С 1959 выступал самостоятельно. Сорокопятки, записанные
  в середине 60х на чикагской фирме "Делмарк" (Delmark) собраны в альбом "Sweet Chicago
  (Милый дом мой, Чикаго)". Дебютный альбом записал для этой же фирмы в 1968 - "Love
  Me Mama". Успешное выступление на престижном Эннэрборском блюз-фестивале привлекло
  внимание рок-молодежи к музыке Эллисона. На волне этого успеха Эллисон подписывает
  в 1972 контракт с большой фирмой Мотаун и выпускает еще несколько альбомов. Однако
  интерес публики к блюзу в США стремительно падает, а Эллисон обнаруживает, что в
  европейских музыкальных клубах для него всегда есть работа. В 1979 он окончательно
  перебирается в Париж. Работа в маленьких клубах чередуется с успешными выступлениями
  на крупнейших джазовых фестивалях. В альбоме "Where Have You Been (Где ты был)"
  представлены записи Эллисона в манере жесткого энергичного электроблюза, сделанные
  на джаз-фестивале в Монтре в период с 1976 по 1994. В те же годы для небольших европейских
  фирм он записывает альбомы акустического блюза ("Hand Me Down My Moonshine (Передай
  мне мою самогонку"). В 1989 в его группе начал играл его сын Бернард, выступающий
  теперь самостоятельно. Записанный в 1993 в Мемфисе для европейской фирмы альбом
  "Soul Fixin'' Man", переизданный чикагской фирмой Alligator, стал первым за 20 лет
  альбомом Эллисона, выпущенным в США. Возвращение обернулось триумфом: выступления
  в качестве хедлайнера на всех значительных блюзовых фестивалях США, аншлаговые гастроли,
  блестящие рецензии, статьи во всех блюзовых и гитарных журналах. 1995 год принес
  ему награды имени У.К.Хэнди по 5 основным категориям и 10 итоговых за год премий
  ведущего блюзового журнала Livin'' Blues. Два последовавших альбома, записанных
  в Мемфисе специально для "Эллигейтор", преумножили этот успех. По мнению экспертов
  "Guitar Player" его "свирепое соло сочетает мудрость опытного расказчика с элегантностью
  БиБиКинга, гибкостью Бадди Гая и густым жалящим тоном Алберта Кинга". Лютер Эллисон
  играл современный вариант техасского блюза с энергетикой, редко свойственной его
  ровесникам рок-епархии. Всего несколько лет назад техасский блюз казался процветающим
  направлением, именно в этом стиле блюз звучал наиболее современно, энергично. И
  лидировали в нем мастера достаточно опытные, но по блюзовым меркам еще только входившие
  в расцвет сил. Теперь, со смертью Алберта Коллинза, Джона Коплэнда и Лютера Эллисона,
  техасский блюз - обезглавлен. Андрей Евдокимов. Фотографии: Фотографии с фестиваля
  "Блюзфест" в Eureka Springs , май 1997г. Дискография: 1969 Love Me Mama (Delmark)
  1972 Bad News Is Comming (Motown/Gordy) 1974 Luther''s Blues (Motown/Gordy) 1976
  Night Life (Motown/Gordy) 1977 Love Me Papa (Black & Blue) 1979 Live In Paris (Part
  1) (Blue Sky/Buda) 1979 Live (Part 2) Paris (Album/Buda) 1979 Gonna Be A Live One
  In Tonight (Part 1) (Rumble) 1979 Power Wire Blues (Part 2) (Rumble) 1980 Time (Paris
  Album/Buda) 1984 Life Is A Bitch (Encore!/Melodie) 1984 Serious Blind Pig (American
  reissue Life Is A Bitch) 1985 I Come (Encore!/Melodie) 1987 Rich Man 1989 (Trip/Entente)
  1989 Let''s Try It Again - Live 1989 (Trip / Melodie / Eastwest) 1991 More From
  Berlin (Trip/Melodie/Eastwest) 1992 Hand Me Down My Moonshine (In-Akustik) 1993
  Love Me Papa (Evidence) 1994 Soul Fixin'' Man (Alligator) (US title for "Bad Love"
  Ruf Records) 1995 Blue Streak (Alligator Records) 1996 Live in Paris / Compilation
  (Trip) 1996 Where Have You Been (Ruf Records) 1996 Motown Years (Motown) 1997 Reckless
  (Alligator Records)'
