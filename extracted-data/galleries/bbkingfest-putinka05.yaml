extra_text: 'Блюз-фестиваль в Лефортово 2005 Блюз-фестиваль в Лефортово 2005 Пожарная
  инспекция думала долго и к вечеру в пятницу надумала, что блюз - дело пожароопасное.
  Получив запрет на проведение фестиваля в Крылатском менее, чем за двое суток до
  его начала, оргкомитет фестиваля и его инициативная группа клуба B.B.KING совершила
  организационный подвиг, переместив событие в старый и уютный московский парк Лефортово.
  Пришлось ужаться с двух сцен до одной-единственной. Однако программа фестиваля состоялась
  с минимальными сокращениями. Петрович объединился с Dr.Nick (показав, что такое
  истинное блюзовое братство). В результате на сцене оказался супер-бэнд, в котором
  на бас-гитаре играл не нуждающийся в рекомендациях Ветеран, а на второй губной гармонике
  - Джон Сорокин (тоже давний знакомый, но именно в последнее время он уверенно занимает
  свое место в ряду лучших отечественным мастеров губной гармоники). Фестиваль открывала
  Оксана Кочубей и "Live''N''Joy", сразу сделав инъекцию высокой энергетики. Однако
  вторыми выступали "Мистер Твистер" и сыграли любителям блюза свои любимые твисты
  советских кинофильмов. Сквозь густую листву нежарко и ласково светило солнце...
  Старожилы ощутили себя на танцплощадке своей мечты эпохи застоя. И вышедший следом
  Михаил Мишурис с оркестром сразу отметил, что атмосфера больше напоминает провинциальный
  блюз-фестиваль в Финляндии, нежели столичную блюзовую сходку, и постарался задать
  жару. Что ему вполне удалось! Несколько блюзовых стандартов и песни собственного
  сочинения готовящегося к выпуску альбома группы публику расшевелили. Финальный выход
  в публику без микрофона был отличным восклицательным знаком в конце их выступления.
  Публика оживилась и откликнулась троекратным "Ура"! Игру со зрителем на протяжении
  всего вечера продолжал великолепный красочный ансамбль бразильских барабанов "Маракату",
  дополненный Дмитрием Грудининым - шоуменом, крикуном, саксофонистом и обладателем
  большем коллекции экзотических инструментов. Он очень хорошо поддерживал карнавальное
  настроение "Маракату", но было его чуть-чуть слишком много: иногда любопытно послушать
  барабаны как таковые, без сторонних "шумовых эффектов". Фестиваль в один день должен
  был вместить очень многих музыкантов. "Маракату" обеспечивали отличные веселые "брейки".
  Но при том, что сторонние люди называет блюз "одной затянувшийся песней", однообразия
  удалось избежать легко - прежде всего благодаря исполнителям. К хорошему привыкаешь
  быстро. А ведь еще пять лет назад такой высокий уровень фестиваля московских блюзменов
  - по количеству и разнообразию участников - был решительно невозможен. Лидеры работали
  и тогда, но за последние пять лет необыкновенно и непредсказуемо вырос пресловутый,
  но актуальный "общий уровень". И при высоком "общем уровне", у каждого - свой персональный
  взгляд на блюз. Юра Каверкин, укрепив ритм-секцию новым басистом, играет мрачноватый
  самоуглубленный блюз, перелопачивая классику "под себя" иногда до неузнаваемости.
  Выделяется возвышенно-светлое посвящение родной "Джорджии" его собственного сочинения.
  Слайд-гитара Александра Новоселова - необходимый ингредиент. И вслед за раздумчивым
  "Dirty Dozen" Каверкина публику поднял в рокнролльный пляс "Off Beat" Дениса Мажукова.
  Он был явно в ударе! А тем, кто помнит московский блюз прошлых лет, очень приятно
  было увидеть вновь отличный дуэт Алика Сикорского (вокал) и Валерия Гелюты (гитара):
  второй играет в рядах "Off Beat", другой выходит с ними на сцену как не такой уж
  старый друг по группе "Старая гвардия". С Доктором Аграновским теперь регулярно
  играет Омар "Flying V" Итковичи. Он вышел к микрофону с чикагской суровой классикой
  "Manish Boy", дабы продемонстрировать, что такое блюз всерьез и по-взрослому. Modern
  Blues Band Гии Дзагнидзе обаятелен, лиричен, но может и похулиганить, соединяя с
  блюзом все, что впишется в гитарный "испанский настрой". В Stainless Blues Band
  с Борисом Булкиным играет на губной гармонике Роман Гегарт, чье возвращение на блюзовую
  сцену многие устали ждать, а все-таки все еще надеются... Завершал парад худ-рук
  фестиваля Сергей Воронов и Crossroadz, что было фееричным и по музыке и по огненным
  аккордам пиротехников. Любителей блюза напрягло участие в фестивале "Ва-Банка" и
  Гарика Сукачева почему-то больше, чем "Мистер Твистер". Которым за рубашку флага
  Конфедерации вполне простили песни, типа, "про зайцев". Александр Ф.Скляр, правда,
  почти извинялся перед публикой за свое появление, говорил, что постарался найти
  в репертуаре группы песни "поблюзовее" и "блюзовее они уже не могут". Меж тем, "Ва-Банк"
  явили тот заразительный драйв, который редко услышишь от наших слишком серьезных
  блюзоведов на сцене - публика так и хлынула к сцене. С тем же энтузиазмом народ
  тянулся поближе к Сукачеву, но тут дело было, как мне показалось, уже не в музыкальном,
  а в шаманском угаре. Меж тем, приглашение в программу блюз-фестиваля еще не ставит
  штамп "истинный блюзмен" в учетную карточку музыканта. Блюз сам сложился многих
  музыкальных заимствований, и затем оказал влияние на формирование новых музыкальных
  стилей. Ничего преступного в том, что многочасовой блюз-фестиваль не замыкается
  в узких цеховых рамках, просто нет. У фестиваля оказался другой принципиальный недостаток.
  Приятно было собрать всех на одной сцене, но никаких открытий не случилось. Даже
  молодой трубач Петр Востоков, третий духовик в оркестре Мишуриса, не был сюрпризом
  для завсегдатаев блюз-клуб. Сказать, что публика услышала "обычную клубную программу"
  будет злым преувеличением. Участники фестиваля не только выбрали свое самое лучшее,
  но и выступали с неподдельным подъемом. Однако если "стабильный рост" всегда приятен,
  то "новых направлений" не оказалось вовсе. Зато не оказалось других неприятностей,
  которые в прошлом году все-таки имели место в Лефортово. Если бы не досадное "обилечивание"
  первых зрителей фестиваля (когда людей сначала вывели с площади фестиваля, а потом
  заставили долго ждать открытия кассы), то проведение фестиваля в этом году можно
  считать образцовым. Ну еще расположение VIP-зоны нуждается в более мудром решении.
  Если организация вполне удалась при форс-мажорных обстоятельствах, то в нормальных
  условиях она будет просто идеальной, не так ли? Вся реклама была направлена на Крылатское,
  а в Лефортово по билетам пришло 3125 человек. При поддержке публики (и вменяемом
  поведении всяких инспекций) можно ждать от следующего фестиваля и большей представительности,
  и приятных открытий. А.В.Евдокимов Фоторепортаж о фестивале на сайте клуба B.B.KING
  Статья Игоря Москвичева , опубликованная в РокмЬюзик.Ру 3.VIII.2005 и признанная
  на форуме blues.ru лучшей статьей о фестивале. (Гитариста "Оркестра Мишуриса" на
  самом деле зовут Вадим Иващенко).'
