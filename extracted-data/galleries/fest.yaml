extra_text: 'Интервью с Андреем Евдокимовым для газеты Man''s Music. Фестиваль &laquo;Очаково-Блюз&raquo;
  Интервью с Андреем Евдокимовым для газеты Man''s Music. Зачем Москве второй блюз-фестиваль?
  - Вопрос, конечно, интересный. В Норвегии, где всего населения в половину меньше
  московского, за год проходит 12 больших международных блюзовых фестивалей, плюс
  несчитанное количество фестивалей поменьше. Почему Москва должна довольствоваться
  одним? Ведь Efes Pilsener Blues Festival года в год собирает все больше зрителей!
  Значит, интерес московской публики к блюзу имеется и растет. Я понимаю, что сравнения
  двух фестивалей не избежать, но настаиваю на своей точке зрения: существование одного
  не исключает возможность появления другого. Что же мы, от Норвегии будем отставать?
  Раз все равно сравнения не избежать, в чем же будет отличие нового фестиваля? -
  Отличие принципиальное. Эфес - международная корпорация. Их блюзовый фестиваль -
  очень грамотно составленная концертная программа, которую они возят по разным странам.
  Только в Москве это становится центральным блюзовым событием года, в других странах,
  где существует широкий круг других блюзовых событий, место этого фестиваля гораздо
  скромней. Впрочем, еще раз говорю, не пытаемся мы &laquo;забить Эфесу баки&raquo;,
  я с удовольствием посещаю все их концерты. Но у нас другая концепция. Мы хотим,
  чтобы Москва на несколько дней превратилась в блюзовый город. Поэтому готовим целый
  ряд разнообразных событий. Важно, что программа фестиваля идет от круга любителей
  блюза, собравшегося вокруг интернет-сайта Blues.Ru и радиопрограммы &laquo;Весь
  Этот Блюз&raquo;. Поэтому мы исходим пожеланий самих любителей блюза. А &laquo;Очаково-пиво&raquo;
  дает нам возможность воплотить мечты в реальность. А поточнее? - Главное событие:
  грандиозный блюзовый марафон. 6-часовой концерт пройдет на Центральном стадионе
  &laquo;Динамо&raquo; под открытым небом. Можно будет и позагорать, и пивка попить,
  и клевую музыку слушать весь день. А можно прийти вечером, послушать только наших
  зарубежных гостей и &laquo;Сборную России по блюзу&raquo;. Это что за зверь? - Это
  не зверь, а гвоздь программы. На сцену выйдет группа Левана Ломидзе &laquo;Блюз
  Казенз&raquo;. Это архи-профессиональный коллектив. Последние годы они регулярно
  выступали на главных европейских блюзовых фестивалях, а в этом году они только что
  вернулись США, где их горячо принимали на фестивале &laquo;Бейкер-блюз&raquo;. Таким
  образом, они стали первым российским блюзбэндом, принявшим участие в американском
  блюзовом фестивале. Вот потому-то именно им и доверено право и честь быть хаус-бэндом
  I Московского международного фестиваля &laquo;Очаково-Блюз&raquo;. А в месте с ними,
  по очереди и в различных комбинациях на сцену будут выходить наши блюзовые корифеи.
  Обязательно будут и Сергей Воронов, и Алексей Белов. Вытащим и Николая Арутюнова,
  погрязшего в фанке за последние годы - пусть вспомнит времена Лиги Блюза. Михаил
  &laquo;Петрович&raquo; Соколов - а как же без него! Но кроме маститых у нас поднялся
  целый уражай новых блюзовых талантов, и широкой публике давно пора познакомится
  с этими ребятами. У них и техника, и оригинальная трактовка, и артистизм - все имеется.
  Жаль, здесь места нет поговорить о каждом в отдельности. Ну а блистательный Михаил
  Мишурис будет не только петь, но и поработает &laquo;мастером церемоний&raquo; -
  будет вести концерт. А кто в гостях на фестивале? - Джимми Ди Лейн. Это великолепный
  пример современного чикагского блюза с глубокими корнями в этом стиле. Он виртуозный
  гитарист, записывается на архи-престижной фирме APO. Ну и не лишне знать, что он
  сын легендарного Джимми Роджерса, ближайшего соратника Мадди Уотерса. У него блюз
  с детства, в крови, поскольку в отцовском его доме собирались по вечерам все отцы
  чикагского блюза: сам Мадди, Диксон, Хаулин Вулф и многие другие. Они травили байки,
  пропускали по стаканчику виски, и пели блюзы - в своем кругу. Династии в блюзе -
  это важная вещь. А Лейн играл в отцовском ансамбле целых десять лет. И в студии
  они записывались вместе. Благодаря чему Лейн поработал и подружился и с Клэптоном,
  и с Джегерром и Ричардсом, и с Плантом и Пейджем. Хорошая тусовка, однако! Он единственный
  американский участник фестиваля? - Да. Не надо забывать о том, что блюз, родившись
  в Америке, стал давно уже международной музыкой. Мы Швеции привозим такой блюз-бэнд!
  Услышите - обалдеете. Так и называется &laquo;Нок-Аут Грег и Блю Везер&raquo; (Knock-Out
  Greg & Blue Weather). Играют моторный современный &laquo;вест-коаст&raquo;, свингуют
  &laquo;по-черному&raquo;, при этом гитара звучит изысканно и свежо. Это веселая
  изобретательная музыка. А Германии приезжают &laquo;Би-Би и Блюз Шекс&raquo; (B.B.
  & The Blues Shacks). Здесь больше акцент на стилистику - они играют под 40-50-е
  годы, создают прекрасную блюзовую атмосферу. Обе группы не новички, и в своих странах
  много раз удостаивались титула &laquo;Лучший блюз-бэнд года&raquo;. отечественных
  музыкантов в фестивале примут участие только московские блюзмены? - Отнюдь. Нальчика
  приедет виртуозная группа &laquo;Регтайм&raquo;. Они играют энергичный блюз с элементами
  современного джаза. Солист Арсен Шомахов - это гитарный виртуоз мирового уровня,
  без преувеличения. Минска приедет акустическая группа &laquo;Свет, Эл и Биг Вэл&raquo;
  - обаятельное мастерское исполнение блюзовой классики. Очень сильная группа Санкт-Петербурга,
  давно зарекомендовавшая себя перед москвичами: &laquo;Биг Блюз Ревайвал&raquo;.
  Молодая группа Екатеринбурга &laquo;Блюз Докторз&raquo; - они на сегодня уже, безусловно,
  среди лидеров отечественного блюза. И Нижнего Новгорода приедет группа &laquo;Джем&raquo;
  - это сильный вокал, зажигательная гитарная игра, интересные собственные песни.
  А что кроме стадионного блюз-марафона входит в программу? - Стадион - это наш вариант
  блюзового пикника на свежем воздухе - шумно, с пивом! Но для более интимного общения
  с блюзом мы составили большую клубную программу. Все наши гости будут давать клубные
  концерты в лучших блюзовых и джазовых клубах Москвы: &laquo;Форте&raquo;, &laquo;Ритм-н-блюз
  кафе&raquo; и других. Кроме того, в популярных московских клубах мы организуем концерты
  и джемы. Несколько тематических программ: &laquo;Архаика и акустика&raquo;, &laquo;Губная
  гармоника&raquo;, &laquo;Современная гитара&raquo; - будут представлять лучших по
  этим стилям или инструментам. Наши гости дадут концерты также во Владимире, Воронеже
  и Санкт-Петербурге. И завершится фестиваль 9 сентября большим концертом в клубе
  &laquo;Би-2&raquo; - это будет парад лучших отечественных блюз-бэндов. Ну а подробности
  расписания фестиваля всегда можно найти в интернете на сайте "BLUES.RU".'
