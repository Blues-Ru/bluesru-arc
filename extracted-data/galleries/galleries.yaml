    Он остается гражданином США, но активно гастролирует в Канаде. Ветеран блюза,
    он играет классический (немодернизированный) джамп-блюз. Джак Де Кейзер (Jack
    De Keyzer) выиграл три "Кленовых…": "Интертейнер года", "Электрический блюз года"
