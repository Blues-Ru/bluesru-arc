  extra_text: Газета-Ру о Международном блюз-фестивале Карнавал приполярных ковбоев
    Блюзовый фестиваль – лучшее осеннее развлечение огромной северной страны. Со временем
    он выродится в настоящий русский карнавал. Московский карнавал, который уже много
    лет пытались организовать власти, так никогда и не собрался. То ли город у нас
    слишком холодный, то ли необходимость создать национальные маски и типажи подкосила
    идею – маска мужика с балалайкой способна отпугнуть публику от чего угодно. Но
    праздник-то необходим! Пьяное буйство на несколько дней, музыка, идиотские наряды,
    клубы дыма и неприлично ведущие себя женщины, причем все это должно быть освящено
    веками традиций. Карнавал или не карнавал, но какой-то консервативный музыкально-алкогольно-сексуальный
    праздник у нас в городе есть. Называется он «Эфес Пильзнер блюз фестиваль», то
    есть, пардон, теперь он называется International Blues Festival, потому что пиво
    рекламировать в общественных местах запрещено, а минеральной воды или конфет турецкие
    пивовары еще не производят. Пивной блюзовый фестиваль – это и есть тот консервативный
    карнавал, которого нам в городе не хватает. Во-первых, куда еще мужчины могут
    надеть идиотские ковбойские шляпы, казаки, кожаные жилетки и джинсовые рубахи,
    так идущие к полусантиметровой толщины очкам? Женщины в закатанных до бюста рубашках
    и галстуках, в промо-платьях, напоминающих сигаретный футляр, все оттенки крашеных
    блондинок – где еще они могут изображать девушек байкеров без собственно байкеров?
    Фестиваль называется пятнадцатым, потому что седьмой раз проходит в Москве при
    полных залах. Абсурд – обязательный элемент любого традиционного карнавала. Организаторы
    держат марку, года в год повторяя одинаковый сценарий. Коллективов всегда три.
    Всегда выступает один акустический зануда-традиционалист, сохраняющий и исследующий
    традиции музыки хлопкоробов, и две зажигательно-танцевальные банды. Занудой в
    этот раз был Фрутленд Джексон, называющий себя «устным историком блюза». Господин
    Джексон ведет множество курсов истории блюза, выступает в школах и колледжах,
    читает лекции и поет песни. В Москве на сцене спортивного зала «Дружба» он лекций,
    разумеется, не читал, но некоторые его поступки – то, что он указывал дату написания
    и фамилию автора песни, например – выдавали в нем знатного педагога. Гораздо веселее
    были следующие артисты – Литл Чарли и его банда «Ночных кошек» во главе с солистом
    Риком, странновато выглядящие белые Чикаго, которые не любят фильм «Братья Блюз».
    Про них, разумеется, можно было бы снять такую же музыкально-лузерскую комедию
    о том, как Рику тридцать лет назад явился Господь в виде книгопередвижки, библиотеки
    на колесах, которая показала ему документальный фильм про блюз и дорогу в жизни.
    Рик отлично играет на губной гармошке и поет очень грустную залихватски-зажигательную
    песню о пользе разводов «Ex-Ex-Wife». И совсем уж грандиозен могучий Сэм Маклейн.
    В его группе играет команда белых профессионалов, один которых, с бородой и лысой
    снарядообразной головой, играет на двухклавиатурном электрооргане Korg, сам же
    Сэм стар (62 года) и могуч, он выходит на сцену в длинном белом плаще и выдает
    порцию идеальной поп-музыки – с рыком, воем, медными трубами и элегантным притоптыванием.
    Маклейн больше всего жалеет о двух вещах. Во-первых, силы зла, которые решают,
    какую музыку нам слушать, не считают блюз коммерчески успешной музыкой и закармливают
    публику другой чушью, в которой тоже все мелодии, аранжировки и ходы одинаковые.
    Во-вторых, самого лучшего блюзового фильма о бурной юности, ужасной, трудной и
    нищей зрелости, когда Майти Сэм жил на помойках и зарабатывал на жизнь, сдавая
    кровь, а также о бурной, полной гастролей, записей и пресс-конференций с тупицами-журналистами
    старости, самого лучшего блюз-муви еще не сняли. Но ведь это все на самом деле
    фон, и те, кто выходят на сцену, не более важны, чем диджеи на дискотеках. Гораздо
    важнее возможность одновременно плясать на столах, пить пиво в немыслимых количествах,
    сидеть за столами и курить прямо в зале, одеваться и раздеваться по своему усмотрению
    и устраивать ужасный дебош – почти как в Новом Орлеане. Семен Кваша Газета.Ру
    29 ОКТЯБРЯ 15:27
