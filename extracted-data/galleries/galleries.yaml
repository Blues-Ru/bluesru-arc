  title: Юрий Каверкин, интервью
  photo_count: 13
  captioned: 0
  index_files:
  - i_Kaverkin.htm
  extra_text: 'Юрий Каверкин, интервью Юрий Каверкин интервью в клубе "Дом у Дороги",
    ноябрь 2015 г. Андрей Евдокимов: - Ты на московской блюзовой сцене появился, общем,
    уже не мальчиком. Юрий Каверкин: Уже далеко не мальчиком. - Далеко не мальчиком.
    А что ты делал до этого? Было это как-то связано с музыкой? - Да, конечно, было
    связано. Пожалуй, основная связь с музыкой была в том, что было огромное количество
    друзей-музыкантов, и было огромное стеснение демонстрировать мою игру, музыку.
    Постольку все мои друзья были довольно крупными музыкантами и всегда относились
    ко мне так: ну чувак, знаешь, ты хороший парень, но, займись чем-нибудь другим,
    зачем тебе это нужно? Я начал скромно – я начал играть на бас-гитаре, подумав,
    что они все на шести струнах играют, а я буду скромнее. Ну вот, некоторое время
    играл. Я даже в школе играл на бас-гитаре. - Все-таки ты рано начал. Что-то отвлекало
    от музыки? Конечно. Во-первых, армия. Кстати, армия мне дала Мадди Уотерса, как
    ни странно. - Каким образом?! А вот случайно ко мне попала кассета, и это был
    Мадди Уотерс. Все, и Мадди мне снес башку окончательно. Это был 1975 год. - Именно
    кассета? Да, кассета, не бобина. - Модно. В 1975 году это была новинка, последний
    писк моды. Кассеты еще не проникли в СССР в массовом порядке. Неужели я путаю?
    - Нет, я не к тому. Отдельные встречались, но так чтобы массово... У меня кассетник
    был, как сейчас помню, открывающаяся крышечка. Я сейчас не скажу, какой это был
    концерт, скорее всего это была сборка. С одной стороны это был Мадди Уотерс, а
    с другой стороны "Огайо Плеерс", это фанковая группа. Басист Бутси Коллинз, игравший
    в стиле фанкоделик. Вот оттуда. Естественно, в армии, находишь какую-нибудь гитару,
    особенно если умеешь зажать пару струн. Естественно, я взял гитару и начал подыгрывать
    Мадди Уотерсу. Так что я начал работать с Мадди Уотерсом, можно сказать. - И что
    окружающие по этому поводу думали? Много было таких как ты? Я был весьма привилегированный
    человеком - я сам был инструктором. Но недолго, на самом деле очень недолго. Потому
    что я себя нехорошо вел и был наказан. Потому что там годовой запас спирта был
    уничтожен и другие нехорошие излишества. Были еще пару ребят, которые любили рок,
    рок-н-ролл... Поэтому думали, что это все было вполне нормально. - Я не к тому,
    что тебя там осуждали или не осуждали. Был кто-то, кто разделял твое пристрастие?
    Ну, я же говорю, пара-тройка людей была, конечно...Медсестры. - Они Мадди Уотерса
    полюбили?)) Я начинал с Северного какого-нибудь, и плавно перекатывался к Мадди
    Уотерсу. - Ух ты, он еще и на иностранном умеет - наверное, удивлялись медсестры.
    Да-да-да, ну как в классическом фильме. - А потом что было? Потом были семья и
    основная профессия - я зоолог же. Были экспедиции. В экспедициях тоже гитара.
    - А в экспедициях? Все вокруг поют "Солнышко мое" или?.. Ну, естественно, я даже
    слов этих не знаю. Ужас какой-то! - И ты тут один с Мадди Уотерсом. Да, КСП этот,
    почти как КГБ. Нет, ну не только же Мадди Уотрес. Я к тому времени какие-то рок-н-ролльчики
    мог сыграть на гитаре, попеть. Ну, естественно, было трудно. А кто сказал, что
    будет легко продвигать в среднеазиатских пустынях американский блюз? Конечно,
    нет. А потом было знакомство с доктором Аграновским. - Уже здесь в Москве? Да,
    я довольно часто приезжал в Москву, в командировки и так, по велению плоти. -
    Надеюсь, не крайней? - Бескрайней. Как наша страна. Мы с доком были очень популярны
    среди определенного количества молодых девушек, мы играли на кухнях – никто ничего
    нового не придумал. Как в фильме "Перекресток" (Crossroads, 1986) помнишь - да
    с тобой ни одна девка не будет, если ты на губной гармошке не играешь? Ну, в нашем
    случае это был гитара. - Это речь уже о 80-х годах? Да, о 80-х.Тогда у нас были
    посиделки какие-то блюзовые, в основном на квартирах. Хэппенинги они назывались
    ведь? У Геры Моралеса поигрывали. Потом наши пути с Аграновским разошлись на довольно
    много лет. Потом опять мы с ним где-то случайно пересеклись, и он говорит: чувак,
    а у меня вот группа, «Черный хлеб", приходи на концерт. Я пришел на концерт и
    он мне предложил джемовать. Мне так это понравилось, что через какое-то время
    я, видимо, ему настолько надоел, что он мне сказал: а может тебе свою группу создать
    наконец? И так покатилось. - А в какой момент у тебя появилась электрогитара?
    Как ни странно, она у меня появилась еще когда я учился в школе, классе в восьмом.
    Я уже тогда был повернут на Beatles, естественно, и Rolling Stones, все эти дела...
    У кого-то была электрогитара, у меня ее не было. В общем, я уломал папу, папа
    пошел купил мне электрогитару. Но папа физик-ядерщик, и купил он мне гавайскую
    гитару – lap steel. - А где ж он ее нашел-то? Продавались такие, да… Она вот такой
    толщины неимоверной причем такой толщины гриф. Когда он мне принес ее на день
    рождения, или на новый год, не помню уже, я совершенно обалдевший от счастья,
    беру эту гитару и понимаю, что я не знаю как вообще на ней играть. Потому что
    гриф не зажмешь, ну какие аккорды, если он толщиной с подоконник какой-то огромный…
    В общем, я так расстроился, что папа унес эту гитару и принес мне акустическую
    Кримону, которую у меня украли через неделю! Вот это была моя электрогитара. А
    так серьезно гитара появилась в Москве, да. У меня был Stracotaster, потом появился
    Les Paul. Я не могу сказать, что я человек, повернутый на инструментах. - Когда
    по годам у тебя появились эти гитары? Это уже середина 90-х. - Тогда ты уже в
    Москве был? Тогда я уже перебрался в Москву. - Когда вы джемовали с Аграновским,
    он, наверное, выбирал песни? Первое время да, но потом я начал учить тексты. Понятно,
    что сыграть можно было все, но надо было знать тексты. А я в песнях знал или четверть
    текста, или половину...И я знаю многих музыкантов, которые до сих пор так вполне
    обходятся...Вот. Теперь я знаю более ста, допустим, блюзов, госпелов. - А как
