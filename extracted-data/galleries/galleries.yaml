    ( Joe Satriani ), Металлика ( Metallica ), Фиш ( Phish ) и старина Питер Фрэмптон
    ( Peter Frampton ). НАШИ НА СЕНЕ В ноябре 2000г. Леван Ломидзе и "Блюз Казенз"
