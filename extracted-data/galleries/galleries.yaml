  extra_text: 31.III.2005 Pera Joe & Friends 31.III.2005 Pera Joe & Friends неделя
    марта и первые дни апреля для блюзовой Москвы были отмечены гастролями Перы Джо
    и Стэна Станошевича. Их уже связывают хорошие отношения с московской блюзовой
    общиной. Для Пэры Джо это уже третий визит. В свой черед Доктор Аграновский и
    Юрий Каверкин побывали на блюз-фестивале в Белграде (как и Александр Братецкий
    и Владимир Караблин). Но именно Аграновский и Каверкин были ведущей организационной
    силой нынешнего приезда белградских гостей. Там читайте " Записки Аграновского
    " об этих гастролях, а Тут смотрите картинки, снятые 31 марта на концерте в ЦДХ
