- path: 10Spring/Castro
  type: custom
  title: 'Томми Кастро: интервью триумфатора Blues Music Awards 2010 - за год до триумфа'
  photo_count: 7
  captioned: 0
  index_files:
  - CastroInt.htm
  extra_text: 'Томми Кастро: интервью триумфатора Blues Music Awards 2010 - за год
    до триумфа Томми Кастро удостоен Blues Music Award в четырех категориях на церемонии
    2010-го года: B.B. King Entertainer, Band, Contemporary Blues Album и Contemporary
    Blues Male Artist. По этому поводу - несколько коротких комментариев, и его интервью
    годовалой давности, сделанное после окончания записи альбома "Hard Believer",
    на тот момент еще не вышедшего и не имевшего названия… The Tommy Castro Band Кастро
    спешит отдать должное своей группе в одержанных победах, и начинает с благодарностей
    саксофонисты Киту Кроссану (Keith Crossan): "Он со мной с самого начала, уже 18
    лет. Он один лучших саксофонистов в мире!" Трубач Том Пул (Tom Poole) - тоже ветеран
    бывалый, ранее он играл с такими талантливыми исполнителями, как Этта Джеймс (Etta
    James) и Боб Скагз (Boz Scaggs). Что касается награды имени БиБиКинга "Лучшего
    артиста года", эта победа шокировала самого артиста, добродушного и скромного:
    "Меня очень удивило, что я выиграл нечто такое. Я полагал, что достаточно того,
    что меня номинировали, но я сам никак не ожидал победить, учитывая, какие у меня
    были соперники". (далее: интервью для About.com Blues, записанное по телефону
    Преп. Китом А. Гордоном (Reverend Keith A. Gordon) 18 марта 2009 г.) В начале
    Почему и как Кастро вообще начал интересоваться музыкой? "Она была повсюду в нашем
    доме. Мой старший брат был первым, кто всерьез заинтересовался музыкой. Я помню,
    что первый раз слушал музыку где-то в начале 60-х. В те времена происходило много
    всего интересного; рок-н-ролл был очень кстати". "В пригороде Сан-Хосе, где я
    рос, музыка соул вырывалась окон многих хулиганских машин. Можно было услышать
    Джуниора Уокера (Junior Walker) и Уилсона Пикетта (Wilson Pickett)… А мой брат
    фанател по Битлз и Роллинг Стоунз, так что я слышал много разной хорошей музыки.
    Все это очень волновало меня, и, казалось, от музыки я всегда начинал чувствовать
    себя лучше". Кастро начал играть на гитаре в нежном возрасте 10 лет. "Мой брат
    играл на гитаре, в однажды, когда его не было рядом, когда мой брат не видел,
    я начал подбирать музыку на его гитаре. Он меня застукал и хорошо отмочалил, но
    потом показал мне несколько аккордов и еще что-то на гитаре. Понемногу я разучил
    несколько песен, и не прошло и года, или двух, как я начал джемовать с друзьями".
    Музыка как профессия Когда Кастро впервые задумался о работе музыканта? "Я поздно
    дозрел до этого. Мне не казалось хорошей мыслью стать музыкантом. Мне не казалось,
    что я достаточно талантлив для этого, и я помнил, что есть множество других людей,
    которые мечтали об этой работе. А я просто занимался музыкой ради удовольствия.
    Я знакомился, мы собирали группы, джемовали в гаражах и всякое такое. Потом мы
    организовывали несколько концертов, и вдруг оказалось, что каждый уикенд я играю
    с группой в баре, просто веселья ради - мне было 20". "Когда мне перевалило за
    30, я еще не нашел такую профессию, с которой я мог бы смириться. И тут как будто
    в голове зажегся свет! В то время я уже постоянно получал приглашения выступать,
    и я начал думать, что мне следует пойти за моей главной страстью в жизни. Это
    было единственным, что мне нравилось делать. Наконец до меня это дошло. Я читал
    всякие книги по философии и как достичь успеха, там было написано, что нужно найти
    то, что действительно тебе нравится, и именно это сделать своей главной работой.
    И я решил попробовать зарабатывать на жизнь выступлениями". "К счастью для меня,
    это было время блюзового взрыва 80-х, а я играл именно эту музыку, так что все
    сложилось удачно. До этого я торговал наличниками для окон. Я продавал и устанавливал
    людям наличники на окна. Я всегда стремился быть сам себе начальником, чем бы
    я ни занимался, сам устанавливал себе рабочий день, я работал по утрам, чтобы
    вечером играть концерты". Два года с The Dynatones Приняв решение заниматься только
    музыкой, Кастро переехал Сан-Хосе в Сан-Франциско, где подружился с популярным
    местным блюзбэндом "the Dynatones". "Я знал многих, мы играли в Сан-Франциско
    несколько раз, так что я был сайдменом, аккомпанируя многим". "Вечерами по понедельникам
    я играл с Johnny Nitro and the Door Slammers, а the Dynatones дружили с Джонни.
    Они частенько заходили на его концерты, им нужен был гитарист, и они предложили
    мне присоединиться к их группе. Они отправлялись в Чикаго, и еще в несколько мест,
    где я никогда не бывал, так что я с удовольствием к ним присоединился и болтался
    с ними пару лет!". The Legendary Rhythm & Blues Revue Кастро и его группа играли
    в нескольких турах программы Legendary Rhythm & Blues Revue (океанский круиз с
    соответствующей названию музыкальной программой, в которой принимают участие знаменитые
    и начинающие блюзмены) . "Эта идея пришла появилась у нас во время "Блюзового
    круиза". Причиной было то, что большие джемы проходили на корабле каждую ночь.
    Это удивительная вещь! Это нечто, что объяснить невозможно. Каждый день с утра
    играют блюз лучшие наши музыканты, и главные персонажи блюза играют весь день
    и ночи напролет. И так проходит весь прекрасный день блюзовой музыки, а люди хотят,
    чтобы музыка не кончалась, так что джемы продолжаются до пяти-шести часов утра
    - это было поразительно!" "Для меня это было отличное время, все музыканты прекрасно
    проводили время вместе. Не часто такое выпадает. Если мы встречаем друг друга
    на концерты, мы потом все разъезжаемся каждый сам по себе (а тут все иначе). И
    еще одно я заметил, выражение лиц публики, оно было совсем другим, чем когда я
    отрабатываю свою обычную программу". Происходит что-то волшебное "В этом был такой
    момент… Луи Андерсон говаривал, что людям нравится смотреть выступления комиков
    (stand-up comedy) по той же причине, по какой они смотрят на прыжки со скалы -
    не ради идеального прыжка! Понимание, что в любой момент все может пойти ужасно
    не так, вот что делает такие моменты особенно волнительными. Собирается вместе
    куча музыкантов и начинают спонтанную игру, без каких-то репетиций, без общего
    плана игры, и иногда случается нечто волшебное, а иногда - просто крушение поезда".
    "Отсюда и возникла идея. Я подумал, нам надо нечто подобное устраивать и на суше.
    Самое близкое, что я мог придумать, это собрать группу музыкантов, которые отправились
    бы (на гастроли) со мной и моей группой, и в конце выходить всем вместе и джемовать,
    делать нечто подобное тому, что мы делаем в круиз". Под аккомпанемент группы Кастро
    в программе the Legendary Rhythm & Blues Revue блистали талантом Ронни Бейкер
    Брукс (Ronnie Baker Brooks), Мэджик Дик(Magic Dick) и Диана Богарт (Deanna Bogart).
    Правильное чувство Томми делится своими мыслями о высших точках его растущего
    списка записей. О своей дебютном концертном альбоме "Правильное чувство" (Feelin''
    It) он говорит: "Тут можно получить представление о том, как нам было весело в
    Сан-Франциско, когда мы собирали группу. Моей главной целью тогда было прожить
    играя блюз. У нас тогда было не много своего материала, у нас не было концертного
    агента, менеджмента, ничего вообще. Мы просто играли в барах и на фестивалях,
    если нас приглашали. Мы еще только пытались быть группой". "Причиной, по которой
    я выпустил эту пластинку, была необходимость иметь запись - в те времена это были
    кассеты. Ее мы могли положить в конверт и выслать в другие клубы и попытаться
    получить концерт. Потому что в то время все стали делать компакт-диски, мы решили
    выпустить запись на CD, и вот так у нас появился наш первый альбом". Виновен в
    любви Крутим дальше, к альбому Кастро 2001 г. "Guilty Love". "Эта запись была
    сделана после моего знакомства с несколькими композиторами песен Нэшвилля и Остина,
    что произошло в следствие нашего сотрудничества с Делбертом МаКлинтоном (Delbert
    McClinton) в то время. Мы отработали с Делбертом несколько круизов, я познакомился
    с композиторами, и это полностью изменило то, как я сочинял музыку". "Я был в
    полном восторге от этих мастеров по ковке песен, и я стал больше внимания уделять
    тому, как я сам сочиняю песни. Я сочинял вместе со Стивеном Брютоном (Stephen
    Bruton), с Гэри Николсоном (Gary Nicholson), - вот то, что я слышу, когда я думаю
    об этом альбоме. И, конечно, самое поразительное для меня того, что случилось,
    это то, что Джон Ли Хукер (John Lee Hooker) пел вместе со мной в песне, которая
    потом оказалась его самой последней записью в студии. Это, конечно, нечто совершенно
    особенное!" "Мы были знакомы, мы знали друг друга несколько лет, и он всегда ко
    мне хорошо относился. Я был у него дома, чтобы записать этот фрагмент… Мы не хотели
    заставлять его приезжать в студию. Он был очень пожилым человеком, так что мы
    сидели на кушетке. У меня мурашки побежали по спине, когда я услышал этот голос,
    поющий мою песню… Он умер примерно через неделю". Болеутоляющее Кастро получил
    Blues Music award за альбом 2007 года "Painkiller", выпущенный лейблом Blind Pig
    Records. "Возможно, "Painkiller" - это лучший альбом всех, что мы записали. Мы
    выбрали правильное сочетание стиля и подбора песен. Коко Мантойа (Coco Montoya
    ) и я наконец-то собрались вместе, после многих лет разговоров о том, чтобы сыграть
    вместе, и наконец записали что-то на пленку. Тереса Джеймс (Theresa James) поработала
    на подпевках великолепно". Контракт с Alligator Records "Нам было очень интересно
    поработать над нашим первым альбомом для Alligator Records. Мы делали то, что
    я всегда стараюсь сделать: найти нечто новое, что-то, что я еще не делал, постараться
    не повторять проверенный рецепт, но оставаться быть верными самим себе и традициям
    того музыкальной стиля, который мы исполняем, - а это блюз, соул-музыка и рок-н-ролл
    - сочетаний этих направлений" . "Все это у меня в кармане, так что когда я пишу
    новые песни, с стараюсь и нахожу новые повороты и тут, и там. И даже брал специальные
    уроки на гитаре в последние несколько месяцев. Я думаю. Все у нас пойдет хорошо,
    в нашем сотрудничестве с Alligator. Для нас самое удачное время завязаться с ними".
    Никаких "особых гостей" "Я вам объясню, чего ждать. Знаете, как многие собирают
    "специальных гостей" для большого сюрприза? Теперь каждый, кто выпускает новый
    альбом, приглашает "особых гостей" в качестве большого сюрприза, так что теперь
    в этом уже нет ничего особенного. И я подумал, что особенным будет не приглашать
    никаких "особых гостей"!" А Кастро плывет сейчас против общих течений в индустрии?
    "Да, я такой! - смеется Кастро. - Я даже подумываю сделать специальную наклейку
    с надписью "И никого в роли "особых гостей". Томми Кастро на Blues.RU'
