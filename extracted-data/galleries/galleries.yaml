  extra_text: 'Зимние ВЭБ новости 2004 - ATB''s 2004 Winter Blues News 2004 зима рубрику
    ведет Андрей Евдокимов В хорошие руки - блюзовые щенки от Петровича (поймите правильно).
    И еще не поздно принять участие в определении судьбы премии им. W.C.HANDY . *
    Не самый, как говорится, известный блюзмен. Те его альбомы, которые мне доводились
    слушать, были добротной, но уж слишком предсказуемой музыкой. В 1999г. мне посчастливилось
    побывать на его выступлении на 12 м Нуттоденском блюз-фестивале. Уже достаточно
    перегруженный впечатлениями первого дня, я шел мимо главной городской площади,
    где проходил дневной концерт. Понятно, когда есть возможность войти в клуб и послушать
    выступления с отличным звуком, концертами под открытым небом как-то пренебрегаешь.
    А тут издалека привлек внимание звук гитары, жалящий, как у Алберта Коллинза,
    но при этом гораздо более густой и сочный тембр. С точки зрения техники он играл
    просто, но он владел тем исключительно блюзовым искусством, когда и единственная
    нота наполнена ясным смыслом и ярким чувством. Энергетика этой музыки влекла издалека.
    Пришлось подойти, посмотреть. По сцене прыгал и кувыркался крепкий бритый налысо
    толстячок в ярко-малиновом костюме . Нужды в его трюках не было, поскольку холодные
    норвежские парни и так стояли на ушах, толкаясь, как на одесском рынке. Но переизбыток
    энергии подстегивал и самого Гейнза вертеться веретеном. И, кстати, в том же 1999г.
    он получил премию им.Дабл-Ю-Си Хэнди как "Артист, заслуживающий большего признания"
    (W.C.Handy Award Most Deserving Wider Recognition ) И вот известие, что на Валентинов
    день в Сент-Луисе, в клубе B.B.King Гейнз зажигал с не меньшим напором. Он, правда,
    отрастил седую бороду, но все так же играет, , и разводит блюзовых обозревателей
    на восторги. * БЛЮЗ-ФЕСТИВАЛИ В ДЕЛЬТЕ: байкеры, сеятели и кабаки. В последний
    уик-энд марта в Кларксдейле, легендарном блюзовом городке, с которым крепко связана
    биография Роберта Джонсона, впервые состоится удивительный фестиваль-ралли "Перекресток
    мотоциклов и блюза" (Crossroads Bikes & Blues). Самым известным среди участников
    музыкальной программы является Супер Чикан (Super Chikan). Пока что фестиваль
    строится на энтузиазме добровольцев. Большинство групп выступают бесплатно или
    снизили свой гонорар до минимума. Знакомая ситуация. А 17 апреля, в субботу, в
    Кларксдейле состоится еще одно непростое блюзовое событие: "Праздник кабаков и
    сеятелей" ( Juke Joint Festival & Planter''s Celebration ). В старом здании автовокзала
    автобусной линии Greyhound, о которой пел еще Роберт Джонсон, ныне находится городской
    справочный центр для туристов. Его владельцы и являются инициаторами нового блюзового
    праздника. По словам музыкального координатора "Праздника..." первый вопрос, который
    задают приезжающие в Кларксдейл туристы, это "Где можно послушать блюз?". Второй
    вопрос: "А кабаки еще есть в городе?" Задачей "Праздника..." будет поддержать
    и заведения, и музыкантов, поскольку и те, и другие важны для сохранения легенды
    Кларксдейла. Для воскрешения атмосферы сельского городка, куда на выходные съезжаются
    поторговать и повеселиться фермеры, к событию будет приурочена и ярмарка, и бега
    свиней. "Это самое уморительное зрелище, какое только можно увидеть",- обещают
    устроители. В программу входят дневные бесплатные концерты и вечерня клубная программа
    с возможностью переезжать клуба в клуб на специальном бесплатном транспорте. Звездой
    музыкальной программы является - угадайте, кто - правильно, Супер Чикан. Теперь
    в летний туристический период каждый месяц в Кларксдейле будет происходить значительное
    блюзовое событие. Крупнейшим них остается традиционный Sunflower River Blues &
    Gospel Festival. * Chicago Music Awards Любитель блюза заранее уверен, что "Чикагские
    музыкальные награды" должны отмечать исключительно блюзовые достижения, с акцентом
    на чикагские блюзовые принципы. Меж тем, Чикаго - городок не маленький, и обитают
    там не одни только любители блюза. 10 февраля нынешнего года в Зале съездов отеля
    "Плаца" состоялась 20я церемония вручения музыкальных наград Чикаго. Самой торжественной
    процедурой было вручение специальной награды Джоэлю Дэйлю (Joel Daly) - "За 50
    блестящих лет в кантри-энд-вестерн".В трех категориях: "Артист года", "Сочинитель
    песен" и "Лучший ритмэндблюзовый/соул исполнитель" - победил рэппер Ар-Келли (R.
    Kelly). Приятно, что лучшим классическим составом назван Чикагский симфонический
    оркестр, а лучшей оперой - Чикагская опера (обидно было бы, если бы награда ушла
    в штат Мичиган... Впрочем, пока такого не случалось). Оставив в стороне категорию
    "Юморист года", выделим среди призеров именно блюзовых персонажей. Chicago Music
    Awards Лучший блюзовый артист: Son Seals Лучший блюзовый альбом: Royal Blue by
    Koko Taylor Лучший исполнитель госпел: Tanya Ray Лучший альбом госпел: Calling
    All Saints, Saints With A Vision Самый популярный клуб: House Blues Самый популярный
    блюзовый клуб: Kingston Mines Лучшее музыкальное видео-шоу: Attack The Boogie
    Не стоит удивляться, что неизвестный россиянам клуб "Кингстонские шахты" обошел
    "Дом блюза" как "Лучший блюзовый клуб". Громадный "Дом блюза" - скорее концертный
    зал с рестораном, нежели клуб; и по репертуару он абсолютно всеяден. Среди пяти
    лауреатов награды за "Достижения всей жизни": Мэвис Стапплз (Mavis Staples the
    Staple Singers). Среди пяти лауреатов "Специальной почетной награды за вклад в
    местную музыкальную индустрию": певец, ведущий и конферансье Фрэнк Пеллегримо
    (Frank Pellegrino); легендарный и несокрушимый продюсер Брюс Иглауэр (Bruce Iglauer),
    основатель и президент Alligator Records. * Клэптон и м-р Джонсон На 23 марта
    намечен официальный выпуск альбома, в котором Эрик Клэптон исполняет песни легендарного
    блюзмена Роберта Джонсона . Название: " Я и мистер Джонсон " (Me and Mr. Johnson)
    - без ложной скромности . Клэптон следует по стопам Питера Грина , для которого
    Роберт Джонсон являет собой особую мистическую блюзовую икону. Но и Клэптон известен
    как фанат творчества блюзмена Дельты Миссиссиппи. Общеизвестно, что со времен
    группы Cream в постоянный репертуар Клэптона входит самая известная песен Джонсона:
    " Перекресток " (Crossroads), которая дала название и антологии записей Клэптона
    на 4х компакт-дисках. Две менее известные песни Джонсона входят в программу его
    акустического концерта на MTV Unplagged. Клэптон дебютировал в студии как вокалист
    в 1966г., исполняя песню Джонсона " Собираюсь в дорогу " (Ramblin'' On My Mind).
    В то время он был участником группы Джона Мэйолла Bluesbreakers. Позже как солист
    он дважды переписал эту песню для своих концертных альбомов: E.C. Was и Just One
    Night. Исполнял он ее и на концерте в московском КДС. В новом альбоме он исполняет
    14 29 известных песен Джонсона. Клэптон: " Все, что я услышал до него, казалось
    мне изготовленным для витрины какого-то магазина. Он пел так, словно только для
    самого себя, и, может быть, для Бога. (Музыка Джонсона) по началу поразила меня
    своей насыщенностью, я мог ее воспринимать только небольшими порциями. Мне потребовалось
    набраться сил, прежде чем я смог слушать больше. Но я не мог уже от нее избавиться.
    Спустя годы его музыка стала самым старым моим другом. Она всегда у меня в подсознании.
    И всегда манит меня из-за горизонта. Это лучшая музыка, которую я когда бы то
    ни было слышал. Я всегда доверял и доверять буду ее чистоте. " Клэптон записал
    "Я и мистер Джонсон" вместе со своими испытанными музыкантами-соратниками: гитаристами
    Andy Fairweather Low и Doyle Bramhall II , клавишником Billy Preston , басистом
    Nathan East , барабанщиком Steve Gadd и харпером Jerry Portnoy . Бесспорно, это
    звездный ансамбль. Воспитанник блюзбэнда Мадди Уотерса. Джерри Портной так же
    принимал участие в записи другого единственного в дискографии Клэптона альбома,
