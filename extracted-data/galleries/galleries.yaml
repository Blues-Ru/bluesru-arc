- path: 11A/Stroger
  type: custom
  title: BOB STROGER - ЖИЗНЬ ИЗ МУЗЫКИ И УЛЫБОК
  photo_count: 7
  captioned: 0
  index_files:
  - Stroger11.htm
  extra_text: 'BOB STROGER - ЖИЗНЬ МУЗЫКИ И УЛЫБОК Автор: Фил Ризер, журнал Blues
    Review (JAN/FEB 2011) В 1942 году, благодаря усилиям борцов за гражданские права
    и нужде военного времени в рабочих руках на чикагских консервных заводах и в сталелитейных
    цехах, почти полмиллиона чернокожих приехали сюда с Юга и заполонили бедные кварталы
    Южной и Западной окраин города. Многие этих рабочих привезли с собой блюз, который
    со временем глубоко пропитал всю ткань американской популярной культуры. В свои
    72 года чикагский бас-гитарист Боб Строджер является живой нитью к началу этой
    истории. С 1976 года Строджер прописал басовые партии более чем к четырем десяткам
    альбомов. Среди прочих, это такие мастера как Отис Раш, Саннилэнд Слим, Снуки
    Прайор, Джимми Роджерс, Дэйв Спектер, Луи Майерс, Пайнтоп Перкинс, Карей Бэлл,
    Эдди Клиавотер… Строджер родился и вырос на юго-востоке Миссури, в сельскохозяйственном
    городе Хэйти, вытянувшемся по берегу реки Миссиссиппи, где издавна речные баржи
    перевозили рис, соевые бобы и хлопок к распределительным пунктам по всей Дельте.
    "Если ехать в Мемфис по трассе №84, вы проезжаете прямо через него, - поясняет
    Строджер. - Я там был как-то по случаю, делал фотографии. Этот городок нисколько
    не вырос с тех пор, как я оттуда уехал. Все дома и магазины те же, что были, когда
    я был мальчишкой. Всего один светофор на весь город". Строджер переехал в Чикаго
    в 1955 г., ему было 16 лет. Ему не надо было вылезать своей постели, чтобы слушать
    музыку, которую потом он будет играть всю свою жизнь. Он жил через стенку от ночного
    клуба. Строджер вспоминает: "В этом месте играли Мадди Уотерс и Хаулин Вулф. Как
    я мог видеть и слышать, им было очень весело. И я понял, что это именно то, чем
    я хочу заниматься: играть музыку". "Вскоре после того, как я приехал в Чикаго,
    я женился, и я часто смотрел, как мой шурин играет музыку. Его звали Джонни Фергусон,
    у него с Джей-Би Хьютто была группа под названием The Twisters. В Чикаго они работали
    на 39-й и на Стейт-Стрит, и я ходил за ними каждый вечер и смотрел. А потом дома
    сам учился играть". "Мой двоюродный брат Ралф Рамей сказал, что нам пора самим
    собрать группу, что мы и сделали. Позвали моего брата Джона, который играл на
    барабанах, разучили песни, какие знали, и через четыре месяца уже навели кое-какого
    шороху. Мы пошли в клуб, сыграли две песни и получили работу. Это был один лучших
    клубов; там работали такие музыканты, как Мемфис Слим. Владелец хотел, чтобы мы
    носили одинаковые костюмы, но на покупку у нас не было денег. Мы взяли черные
    шерстяные шапки, сверху приторочили красные круги и назвали группу "Красные вершки"
    (Red Tops), вот с этого все началось". Через несколько лет Строджер почувствовал
    тягу к расширению музыкальных интересов. "Я присоединился к джазовому ансамблю
    и играл с Рафусом Форманом года три. Но работы у нас было совсем мало. Тогда я
    встретил Эдди Кинга. Я рассказал ему, что я играю в джаз-бэнде, и нам требуется
    гитарист, который может играть блюз. Он присоединился к нашей группе, и мы начали
    исполнять блюз и R&B, и дела пошли в гору. Группу мы назвали "Король Эдди и Королевская
    рать" (Eddie King and King Men). И мы оставались вместе 15лет. Потом Эдди уехал
    города. Я на два года бросил играть, потому что мы были так дружны, что я не хотел
    играть ни с кем, кроме него". Он вернулся в блюз, когда пианист Отиса Раша Джесси
    Грин позвонил, чтобы попросить срочно подменить их басиста на концерте. И в 80-х
    он уже постоянно работал с Рашем. "Я всегда буду благодарен Рашу, потому что э
    то он взял меня с собой в Европу, благодаря ему публика начала замечать меня".
    После выступлений с Рашем, Строджер обрел признание как надежный блюзовый бас-гитарист.
    "Он учил меня играть от всего сердца. Он тот человек, сотрудничеством с которым
    я больше всего горжусь - за всю мою долгую музыкальную карьеру". Строджер набирался
    опыта, отправившись на гастроли с Саннилэндом Слимом, выдающимся пианистом, который
    работал с Мадди Уотерсом, Хаулин Вулфом, Робертом Локвудом, Литл Уолтером - едва
    ли ни с каждым знаменитых чикагских музыкантов. "Саннилэнд научил меня, как вести
    дела в музыке, и как вести себя на сцене. Эдди Тейлор, Снуки Прайор - я могу перечислять
    имена бесконечно - стольких ребят я любил, и с ними было хорошо в дороге. Я стал
    первым бас-гитаристом, который так много гастролировал, не будучи вокалистом.
    Все, кто выступали на фолк- и блюз-фестивалях по всему миру, были певцами, только
    не я. Меня хотели потому, что я был пристойным басистом, и я этим горжусь". "Я
    просто влюбился в блюз, он - моя жизнь. Бас - это сердцебиение блюза; я всегда
    объясняю другим музыкантам, что наша работа - это подоплека истории, которую рассказывают
    с авансцены. Люди в песне не слышат баса, они его чувствуют. Бас замечают только
    тогда, когда ты перестаешь играть. Это инструмент, который основывается на ощущении,
    и это я обожаю". "Бас ведет музыку, без баса музыка не далеко пойдет. На самом
    деле бас и ударные держат всю группу, потому что они позволяют гитаристу забираться
    вверх или опускаться вниз по всей песне; определенно без нас гитаристы далеко
    не уйдут". Строджер и Одди Пейн, который был барабанщиком у Чака Берри, стали
    главной ритм-секцией в европейских турах, организованных Херстом Липпманом, постановщиком
    ныне знаменитых Американских фолк-блюзовых фестивалей. После Строджер на протяжении
    долгого времени сотрудничал с Джимми Роджерсом, у которого в составе были Пиано
    Вилли и Мэдисон Слим. Когда харпер Пьер Лакоко в 1991 г. собрал в Чикаго группу
    Mississippi Heat, Строджера позвали принять участие. Он и сейчас с ней выступает.
    Их гастрольное расписание весьма насыщенно, но в перерывах Строджер находит время
    поджемовать со старыми друзьями в чикагских клубах, но предпочитает избегать мест
    скопления туристов. "Мне нравится играть там, где люди переживают блюз, понимаю
    его как искусство. Я по-прежнему раза два в год играю в клубе Бадди Гая "Legends",
    и в Rosa''s Lounge. Но я отошел от тех клубов, в которых начинали музыканты моего
    поколения. Эти клубы по-прежнему в полном порядке, но мы, старички, ушли них,
    чтобы дать место молодым. Процесс идет, этим и хорош чикагский блюз. Если ты своей
    музыкой ничего не можешь добиться в Чикаго, значит, ты нигде ничего не добьешься.
    Нью-Йорк, Мемфис, даже Калифорния не могут предоставить таких условий, в которых
    музыкант сможет зарабатывать на жизнь". Строджер смог установить приятное равновесия
    между домашним образом жизни и работой в музыке. "Я провожу строгую границу между
    ними. Я люблю копаться в земле, сажать цветы в своем саду, и вообще много быть
    на свежем воздухе. Мне нравится садоводство и рыбалка, и домашняя жизнь. Я не
    только занят музыкой, музыкой и только музыкой. Но я счастлив, что в моей жизни
    есть и то, и это". "За эти годы я переиграл в стольких группах, и знаю, что столкновение
    эго всегда выбивает группы лучшее, что в ней было. Мы часто подходили к самому
    порогу успеха, и всегда что-то все портило. Я и решил, что не стоит тратить остаток
    своей жизни на то, чтобы создать успешную группу. Есть столько людей в этом бизнесе,
    кто продолжает идти впереди всех, и надо быть с теми, кого любишь. Музыка для
    меня - это удовольствие. А если нет удовольствия, она превращается в работу. А
    когда она превращается в работу, тогда я увольняюсь". Перевод А.В.Евдокимова P.S.
    Теперь Боб Строджер еще и вокалист. В его сольной дискографии - два альбома: концертный
    In The House: Live At Lucerne и студийный Bob is in Town. Он - многократный лауреат
    Blues Award (бывшая W.C.Handy Award). В 2011 он удостоен Grammy за участие в записи
    альбома Pinetop Perkins and Willie "Big Eyes" Smith - Joined At the Hip. На церемонии
    вручения его фамилия произносится именно как "Строджер"... Хотя, будучи в Москве,
    он не возражал против произношения "Строджер". Пресс-релиз к московским гастролям
    Боба Строджера в клубе "Дом у Дороги" >>> . Газета "Ведомости" о приезде Боба
    Строджера >>> . Обсуждение на "Форуме Блюз-ру" московских концертов Строджера
    >>> . Blues.Ru - Новости | Музыканты | Стили | CD Обзор | Концерты | Live Band
    | Лента | Форум'
