  extra_text: 'Интервью участников 2го фестиваля "Дельта Невы-2002" Вл.ДЕМЬЯНОВ -
    BLUES DOCTORS (Екатеринбург) Играем мы 6 лет. Группа организовалась сразу же тогда,
    когда мы закончили школу. Т.е. нам было тогда по 17 лет, всем, кроме Ромчика,
    его с нами не было, позже мы его нашли. Пробовали мы играть все, в самом деле.
    Чуть шансон только не играли. Играли в поп-группе у певицы, играли в модной группе,
    играли везде - но потом поняли, что лежит душа именно к такой музыке. Ну просто
    стали играть блюз, нам очень понравилось. Потом мы стали блюзбэндом. Сейчас мы
    счастливы, это наша работа, это просто наша жизнь. Мы друзья и играем в этой группе
    - ну что может быть лучше?! Для меня это так сейчас, я понимаю, что каждый день
    все меняется. Но все прекрасно сейчас - музыка есть, а это самое главное. В общем,
    мы год попробовали то да се, и пять лет играем блюз. АЕ : Ну а все-таки, почему
    именно на блюзе "сердце успокоилось"? Блюз у меня вызывает такую бурю тайных чувств
    - я не могу даже объяснить: просто когда я играю блюз - мне очень хорошо. Можно
    в студии записать диск и можно что-то еще, но я обожаю эту музыку просто. Я получаю
    от этого удовольствие и очень сильное. И так я могу сказать все, что я думаю,
    практически кому угодно. Мне нравится эта музыка, она говорит, она живет. АЕ :
    И что, есть работа в городе для блюз-банды? Да, совершенно спокойно. Мы ездим
    на свадьбы играть блюз. У нас давно такая тема. АЕ : Вы не шутите? Вам не надо
    разучивать какие-то еще песни для этого? Ну почему. Мне принадлежит одна идея,
    наверно, не надо ее рассказывать… мы играем блюз - между прочим, нам иногда за
    это платят. Это очень хорошо. И при этом я еще работаю гитаристом в студии. Понятно,
    что там приходится делать разную работу. Ну и все, самое главное, что у нас есть
    вот эта банда, я люблю их каждого. А.МОРОЗОВ - J.A.M. (Н.Новгород): Новенького
    есть кое-что. Вышла пластиночка под названием Blues For My Babe . Это раз. Произошли
    изменения в составе - это два. И в третьих мы приехали сюда, на фест. Программа
    на половину новая, наполовину старая. А в альбоме 11 песен, авторских нет, но
    кавера - они как бы авторские. В оригинальной обработке. Blues For My Babe - это
    стандарт. Я не помню, кто его написал, честно говоря. Просто попался хороший текст,
    я взял, на него придумал музыку. АЕ : Вы путешествовали сюда сутки на машине -
    на кой черт вам это нужно? Это нужно! Неизбалованны российские блюзмены фестивалями
    и общением друг с другом - а это как воздух нужно любому музыканту. А.ЛЯПИН -
    ЛЯПИН''S COMPANY (Санкт-Петербург): АЕ : Почему именно в Питере удалось организовать
    большой регулярный блюзовый фестиваль, тогда как в других городах,в том числе
    и в Москве, это не удалось? Я думаю, что это чисто на человеческом энтузиазме
    и большой любви к этой музыке. У Сергея Некрасова, которого я знаю много лет,
    это очень славный человек и действительно он энтузиаст этого дела очень большой
    и большое дело делает. И вообще один величайших представителей питерской и вообще
    российской интеллигенции. И поэтому нам с ним очень легко дружить и работать.
    Так как я тоже эту музыку люблю и играю и исповедую много лет. Почему я блюз играю?
    Ну, я много чего играю, но это как-то лучше всего получается. И, наверное, потому
    что блюз идет именно от сердца. Мне не 15 лет, все-таки 46. И идет оно изнутри
    то, что надо, а не то, что ты где-то услышал или хочешь кому-то дать какую-то
    идеологию. На фиг надо? Все равно основа даже инструментальных композиций - все
    равно я играю блюз. так же взять Ангуса Янга ЭйСи-ДиСи - человек же играет блюз,
    хотя они играют такую харду там. Он играет по стилю блюз на гитаре. Ну и я то
    же самое, только интеллекта добавляю чуть-чуть иногда - с позволения публики.
    АЕ : Ляпинз Блюз - постоянно существующая команда? Да, на сегодняшний блюз постоянно.
    Не Ляпинз блюз, а Ляпин''s Company. Это Иван Ковалев - бас-гитарист и акустический
    гитарист. Потом мы еще пригласили fretless безладового бассиста - это Володя Коновалов.
    Игорь Бирибеев на барабанах и я, с вашего позволения, на гитаре. И чего-то пою
    там иногда.'
