    носит титул "Отец британского блюза". Не он первым начал играть блюз в Британии,
    но он в своих " Bluesbreakers " вырастил столько звезд блюза - что воистину может
    считаться и праотцем многих британских блюзбэндов. У Мэйэлла, руководителя группы,
    всегда был нюх на отличных гитаристов. Звезды блюзовой гитары от 60-х до 90-х,
    от Питера Грина до Уолтера Траута и Коко Мантойа ( W.Trout , C.Montoya ) - делали
    первые профессиональные шаги в его группе. Это он не дал Клэптону пропасть на
    любительской сцене после его разочарования в "Ярдбердз" ("Yardbirds"). И в рядах
    своих "Блюзбрейкерз" Мэйэлл фактически вырастил несколько знаменитых групп, включая
    "Крим" ("Cream) и "Флитвуд Мак" ("Fleetwood Mac"). Собирать на запись одного альбома
    "сонмы звезд" ему тоже не впервой. Его "Back To Roots" 1970 года записывали Питер
    Грин, Эрик Клэптон, Мик Тейлор (тогда - солист "Rolling Stones") и участники американской
    буги-рок-группы "Canned Heat". 30 лет спустя Мэйэлл вновь проводит большой блюзовый
    сбор, и самый верный его воспитанник - Мик Тейлор - вновь вместе с ним в студии.
    Запланированный на выпуск 26 марта его новый альбом Мэйэлла "Вместе нам по пути"
    (" Along For The Ride ") включает звезд самых разных блюзовых поколений. От самых
    старших - гитарист Отис Раш ( Otis Rush ), мастер чикагского блюза. Гитарист Стив
    Кроппер ( Steve Cropper ) - это классик стиля "соул" (и участник двух фильмов
    про "Братьев блюз"). Билли Гиббонз "ЗиЗиТоп" (Billy Gibbons ZZ Top ) и Стив Миллер
    ( Steve Miller ) представляют эпоху рождения белого блюз-рока в США. Джефф Хилей
    ( Jeff Healey ) - звезда на рубеже 80-х-90-х. Поп-блюз-рок представляют Гэри Мур
    ( Gary Moore ) и - уж совсем нежданно - Крис Ри ( Chris Rea )! Но и это не главная
    сенсация альбома. Впервые с 1970 года собрались в студии участники-основатели
    британского состава легендарной группы "Флитвуд Мак" ( Fleetwood Mac ): Питер
    Грин, Мик Флитвуд и Джон МакВи ( Peter Green, Mick Fleetwood and John McVie )
    - именно для того, чтобы записать песню Тони Джо Уайта ( Tony Joe White , автор
    нескольких хитов Тины Тернер, например) для нового альбома Мэйэлла. The Official
    John Mayall Website . Илья Попов о Джоне Мэйэлле . Бухгалтерский журнал шоу-бизнеса
