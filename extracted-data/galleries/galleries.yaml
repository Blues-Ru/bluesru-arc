  extra_text: 'RAGTIME - статья газеты Кабардино-Балкарская правда Кто лучше всех
    играет блюз? Недавно любители джазовой музыки, а следовательно поклонники единственной
    у нас в республике группы "Рэгтайм", работающей в этом музыкальном направлении,
    увидели яркие афиши, извещающие об очередном выступлении трио, первом после того,
    как Арсен Шомахов (соло-гитара, вокал), Аслан Жантуев (бас-гитара), Султанбек
    Мамишев (ударные инструменты) вернулись Америки. Один лучших российских коллективов
    группа "Рэгтайм" Нальчика в декабре была выдвинута Российским сообществом Блюз.
    Ру (г. Москва) на соискание премии "Лучшая независимая блюзовая группа", ежегодно
    вручаемой Международным блюзовым фондом в США. В состав жюри крупнейшего в мире
    конкурса независимых исполнителей входили владельцы транснациональных звукозаписывающих
    компаний, музыкальные критики и представители СМИ. Арсен Шомахов, Аслан Жантуев
    и Султанбек Мамишев приложили немало усилий, чтобы эта поездка состоялась. Первой
    инстанцией, куда они решили обратиться, было Министерство культуры КБР. По словам
    Аслана Жантуева, в моральную, а тем более материальную поддержку, переступив порог
    родного ведомства, не верили вообще, но решили испытать судьбу. Капризная фортуна
    была к ним на этот раз благосклонна. Заместитель министра культуры КБР по вопросам
    профессионального искусства Виктор Борисов, будучи музыкантом по образованию,
    ранее слушал два альбома группы "Рэгтайм" и уже давно проявлял интерес к столь
    нетрадиционному для музыкальной панорамы республики трио. Чем дольше длился между
    ними разговор, тем больше надежды появлялось у Аслана Жантуева. Наконец-то, впервые
    за долгие годы их поняли. Получив такую поддержку, "Рэгтайм" подал документы на
    участие, прошел собеседование в Москве. Музыкантов отправляли за океан всем миром.
    Оказали разного рода помощь Российский филиал Международного блюзового фонда (г.
    Москва), Министерство культуры КБР, Сбербанк, Бум-Банк, универмаг "Нальчик", фонд
    культуры КБР, кафе-клуб "Амиго", являющийся своего рода стационарной сценической
    площадкой для выступления музыкантов в родном Нальчике. 3 февраля группа "Рэгтайм"
    уже была в городе Мемфисе штата Теннисси США на престижном Международном музыкальном
    конкурсе. По иронии судьбы первый сборник российского блюза получил название "Я
    не увижу Миссисипи", которое выражало пессимистическое чувство его составителей
    по поводу того, что и у нас в России есть хороший блюз, однако, выросший в отрыве
    от материнской дельты, он, к сожалению, и не надеется с ней когда-либо воссоединиться.
    За прошедшие годы очень многое изменилось, и прежде всего - отношение во всем
    мире к российским исполнителям. Как вышло на поверку, блюз живет везде: в дельте
    Миссисипи и в дельте Волги, в предгорьях Аппалачей и в сердце Кавказа. Достижения
    нашего блюза имеют конкретные имена: солист Арсен Шомахов и группа "Рэгтайм".
    И это безусловный успех и признание международной музыкальной общественностью
    трио Нальчика. Как же складывалась формула успеха наших знаменитых далеко за пределами
    республики музыкантов? Какими тропами шли они на вершину музыкального Олимпа?
    Группа "Рэгтайм" приобрела известность в российских блюзовых кругах вскоре после
    выступления на первом международном блюз-фолк фестивале "Дельта Невы" в Санкт-Петербурге
    в 2001 году. При содействии московского журналиста Андрея Евдокимова музыка группы
    и интервью с ней транслируются на радио "Эхо Москвы", на общероссийском канале
    "Культура" в известной передаче Игоря Бутмана "Джазофрения". В сентябре 2003 года
    "Рэгтайм" получает приглашение выступить на международном блюзовом фестивале "Очаково-Блюз"
    с ведущими зарубежными музыкантами. В июле 2004 года группа представляла Россию
    на международном фестивале джаза в Одессе наряду с исполнителями Австрии, Германии,
    Франции, Чехии, Испании, Польши и Украины. В октябре 2004-го песни Арсена Шомахова
    и группы "Рэгтайм" вошли в сборник "Антология российского блюза", который разошелся
    тиражом в 50 тысяч экземпляров. Следующей ступенькой "лестницы в небо" стало приглашение
    в город Мемфис, который считается родиной американского блюза. Сейчас Арсен Шомахов,
    Аслан Жантуев и Султанбек Мамишев снова выступают дома. И Нальчик говорит "спасибо"
    тем, кто лучше всех играет блюз. Р. Герасимова Кабардино-Балкарская правда (Нальчик)'
