    Undercover объявил, что Эрик Клэптон намерен в наступившем году выпустить два
    альбома. Один будет посвящен новым песням. Другой - исключительно песням Роберта
    Джонсона. Любовь Клэптона к песням Джонсона известна. Rambling On My Mind - навсегда
    в его репертуаре. Обложка прошлогоднего двойного концертного альбома Клэптона
    содержала намек и на "Перекресток" и на "Терраплейн". С другой стороны, любовь
    это обретает иногда странные формы. Именно Клэптон взял текст мистической жутковатой
    песни Crossroads и спел его на мотив миссиссипской плясовой Rollin'' And Tumblin''.
    Питер Грин, 38 лет тому назад сменивший Клэптона в группе Джона Мэйолла, за последние
    пять лет записал три полновесных альбома, посвященных именно блюзам Джонсона.
    Клэптон решил вступить в соревнование? * MA RAINEY 14 января американская академия
    звукозаписи (The United States Recording Academy) объявила список песен, зачисленных
    в зал славы Грэмми. Среди них диск Ма Рейни 1925г. "Си Си Райдер" (Ma Rainey "See
    See Rider Blues"). * С 21 по 27 февраля четыре города России посетят с концертами
    Гленн Хьюз и Джо Линн Тернер, не основатели, но герои Deep Purple. По неизвестной
    науке причине, любители хард-н-хэви считают Хьюза большим спецом по блюзу. * Сергей
    Воронов и Гия Дзагнидзе - акустический дуэт. "День Издевательства над блюзом"
    - свою заметку об этом концерте наш форумщик Андрей Ордальонов озаглавил цитатой
    С.Воронова : "В воскресенье 18 января в "Би Би Кинге" звучал акустический "блюз"
    ;) в исполнении Сергея Воронова и Гии Дзагнидзе. Местами блюзом назвать звучавшее
    язык не поворачивается, но вот акустикой завсегда. "БиБиКинг" был переполнен.
    Полтора часа Сергей и Гия отрывались по полной программе: звенели, как ансамбль
    народных инструментов, шептали, как Боря Моисеев, вопили, как не знаю кто, и голосили,
    как Николай Басков. Классика блюза сменялась отнюдь не блюзовыми стандартами,
    а то, что было блюзом, звучало ну совсем не так, как к этому все привыкли, но
    было здорово :) Праздник акустического раздолбайства или "день издевательства
    над блюзом" (по С.Воронову) состоялся." Конечно, это не был вечер ортодоксального
    блюза. Запомнился всем особенно Хучи-кучи Мэн, в аранжировке под фламенко, с положенными
    оному арабскими гортанными воплями, но временами переходивший в "Степь да степь
    кругом" под балалаечную трель. Ни капли садизма над блюзом, разумеется, не было.
    Чувствовалась хорошая школа блюзовых подколок. И уж особенно приятно было видеть
    клуб полным. В этих (технически невсегда удачных) фотографиях легко угадывается
    прикольность вечера. Акустические вечера в B.B.King''e будут продолжаться каждое
    воскресенье. * Bluesmakers Петровича vs. Оркестра Мишуриса Поединок в ЦДХ. Год
    едва начался, а лучший концерт блюзового сезона уже (возможно) состоялся. Во всяком
    случае, те, кто 1 января (по старому стилю) смог притащить свою задницу в такой
    очаг культуры, как Центральный дом художника, едва потом мог на ней усидеть: подстегиваемая
    дуэльным азартом, музыка горячила как никогда! Традиция блюзовых дуэлей идет кабаков
    Дельты Миссиссиппи 20-х годов до Бил-Стрит и Максвелл-Стрит в Чикаго и Мемфисе.
    То, что в Новом Орлеане называлось headcuttin'' jams, добралось и до Москвы -
    в ознаменование столетия блюза. Первыми схлестнулись два блюз-бэнда: "Bluesmakers"
    Михаила ПЕТРОВИЧА Соколова и "Оркестр Михаила Мишуриса. Почему именно они? Они
    составами равны! Единственные в Москве блюзбнды с "дудками"… Причем, чтоб уравнять
    шансы, случай распорядился подсократить группу медных у Петровича. Жаль, конечно,
    что А.Бородин (1/2 Scolder Brothers) на тот момент покинул Москву по срочному
    делу. Зато в результате на сцену ЦДХ вышли две команды, каждая по 7 человек. К
    началу концерта за кулисами все еще кипела словесная баталия по типу "да мы вас
    на раз сделаем" - "кишка тонка" и прочее, о чем не стоит знать почтеннейшей публике.
    Заодно пытались решить вопросы, что когда играть и кому первому начинать. Переговоры
    затягивались - вызывать музыкантов на сцену пришлось долго и громко. На сцене
    метнули жребий. Первый выстрел выпало сделать Мишурису. Он начал вполсилы. Петрович,
    воспользовавшись строчкой Хукера "I am commin'' to shoot you right down", исполнение
    песни "Boom Boom" предварил не "физ-культ-приветом", а "Я иду тебя убивать" (по-русски).
    Bluesmakers начали мощно. Группа играла плотным хорошим саундом, с интересными
    аранжировками, омолодившими подувядшие традиции блюз-рока. А потом они вжарили
    свою версию "Бунта в камере №9" (Riot in the cell #9). И при всеобщем восторге
    и публики, и самих музыкантов в словаре даже самого строгого рецензента остались
    только две оценки: "мощно" и "смачно". В трех раундах публика оценивала бой музыкантов
    громкостью аплодисментов. Первый вчистую выиграл Петрович. Ненадолго показалось,
    что легкомысленный джамп-блюз "Оркестра Мишуриса" будет комическими интермедиями
    среди героических блюзроковых картин Bluesmakers. Тромбонист Сергей Капшин "отдувался"
    за обоих братьев Сколдер. И на фоне его густых вибрато трубач Александр Пчелинцев
    выстреливал ноты "ЦДХ-стратосфера". Незлые, в общем-то, языки объясняли первый
    результат тем, что Михаил Петрович, у которого в друзьях пол-Москвы, насобирал
    аудиторию своих добровольных квакеров. Доля правды есть: гостей "от Петровича"
    в зале было больше. Но в дальнейшем публика абсолютно доказала свою объективность.
    Шляпа и борода Петровича - это фактор на сцене. Но не надо недооценивать артистизма,
    прыжков и жилетки Мишуриса. Не говоря уж о том, что как ведущий концерта он может
    убрать любого конферансье. Пусть это "аксессуары", но их не стоить сбрасывать
    со счетов, когда дуэль проходит перед публикой. Когда Мишурис запел про "пять
    долгих лет, что он проработал на одну женщину. А у нее хватило наглости выгнать
    его дома" (Five Long Years) - тут уж соединились искусство театрального трагика
    старой школы и выдающегося вокалиста, который певческую школу проходил не "где-нибудь
    там", а именно в Чикаго, в блюзовой странице мира. В песне о вреде женского алкоголизма
    (Hard Drinking Woman) он погнал Артема Жульева (тенор-сакс) и Илью Алехина (альт-сакс)
    туда, куда Макар точно телят не гонял - в зрительный зал ЦДХ. Именно "погнал",
    потому что они, якобы, засмущались. И получился триумфальный проход. Соло превратилось
    в скетч, публика радостно вертела головами. Традиционное блюзовое упражнение для
    губной гармоники - про поезд, который набирает ход, гудит, стучит колесами все
    быстрее, и скрывается за горизонтом - стал предметом "конкурса капитанов". Вроде
    бы Петрович на губной гармонике должен был переиграть Мишуриса по той простой
    причине, что это для него главный инструмент, а для Мишуриса - домашнее хобби.
    Лидировал, конечно, Петрович. А вот дуэли не вышло, получился дуэт! Да и вообще,
    пока негритянские воровские песни соседились с пикантными румбами, удивительным
    образом на сцене началось совершенно незапланированное братание. Если в первом
    раунде лидеры обменивались колкостями и угрозами, хоть и шутливыми, то во втором
    раунде Мишурис поблагодарил Петровича за исполнение песни Alabama Train, которую
    он очень любит. А музыканты противоборствующих сторон дружно подпевали и подыгрывали
    соперникам, сияя широкими улыбками. Второй раунд закончился очевидной ничьей.
    В этом был сюрприз вечера - соревнование увлекло всех участников настолько, что
    азарт подстегнул играть весело. Песни чередовались, оба коллектива были постоянно
    на сцене. Оба клавишника пользовались электроинструментами. Но Олег Горчаков ("Оркестр")
    настроился на фортепианный звук и выдал стопроцентно бугивужые перекаты, громко
    и решительно, как я никогда еще его не слышал. Его личный противник Андрей Барбашов
    предпочитал электроорганный джазовый звук, используя тембры от а-ля Хэммонд-Би-3
    до электропиано. Схватка получалась более интересной не откровенной борьбой, а
    пересечением и открытым сравнением возможностей разных инструментов, манеры игры
    и музыкальных стилей. Используя разные наборы ударных, Валерий Дедов на сильную
    долю буквально подпрыгивал на стуле, поскольку играл "jump" - и, напротив, Сергей
    Чекмаренко был стабилен и суров, вколачивая ритм, как надежные сваи в каменный
    "rock"-фундамент. Можно поспорить о деталях игры, но оба гитариста: и Юрий Кривошеин,
    и Вадим Иващенко - мастера своего дела. Но первый предлагал блюз-роковое звучание
    "цельнокорпусного" инструмента, с мощными длинными нотами. Второй предпочитал
    легкие квази-джазовые по-нотные пробеги полуакустики. Правда, Иващенко для дуэли
    припрятал "туз в рукаве" - заиграл слайдом (в чем раньше, кажется, замечен не
    был). Добавьте к этому шестиструнный электро-бас Алексея Малярова vs. контрабас
    Александра Любарского. Получится вечер, перенасыщенный контрастами, событиями,
    игрой и музыкой. В давние-стародавние времена блюзовая дуэль могла закончится
    тем, что публика изгоняла проигравшего. В ЦДХ, 14 января 2004г., по удачному выражению
    рефери победила не дружба, а публика. Хотя за два с половиной часа она заметно
    подустала. Ну так, для восприятия музыки, душа обязана трудиться. А тут еще и
    блюз заставляет вопить, притоптывать ногой и всячески еще двигать телом… Мудрено
    ли, что расходились "с приятной усталостью" и чувством почти забытого "глубокого
    удовлетворения"? * Номинанты на премию W.C.HANDY-2004 Абсолютным чемпионом по
    числу номинаций в нынешнем году стал Ким Уилсон ( Kim Wilson ), что неудивительно,
    поскольку в ушедшем году он выпустил выдающийся альбом " В поисках неприятностей
    " (Lookin'' For Trouble). Довольно неожиданно было увидеть, что четыре номинации
    получил Отис Тейлор (Otis Taylor), участник позапрошлогоднего Эфесовского блюз-фестиваля
    в Москве, выпустивший своеобразный, но и довольно странный с точки зрения чистого
    блюза альбом " Правда - не выдумка " (Truth Is Not Fiction). * Московский LONG
    DISTANCE CALL Гитарист Владимир Кораблин и харпер Владимир Братецкий год назад
    затеяли немодный совсем акустический блюзовый дуэт. Тогда казалось, под такой
    формат и работы не найти. Хотелось хотя бы записать альбом. И так хотелось, что
    альбом был записан и назван по песне Мадди Уотерса "Звонок издалека" (Long Distance
    Call). Весь довольно древних блюзовых стандартов, но исполненный языком современного
    блюза, да еще с преимущественной ориентацией на европейскую манеру. Гибрид получился
    очень свежо звучащим, а главное - очень искренним. Презентация состоялась 11 января
    на акустическом вечере в клубе B.B.King, при единодушном одобрении публики. И
    что интересно - без работы дуэт не простаивает (тьфу-тьфу-тьфу). Здесь небольшой
    фоторепортаж об этом концерте, и ряд фотографий, сделанных во время фотосессии
    для оформления альбома. *'
