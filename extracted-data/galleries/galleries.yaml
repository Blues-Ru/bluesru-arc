    альбом на "Аллигаторе " Испорченная " (Wicked). Ар-Эл Бернсайд (R.L. Burnside)
    продолжает двигать современный миссиссиппский блюз альбомом " Хочу усесться в
    раю " (Wish I Was In Heaven Sitting Down). Понятно, что судьба блюзовой " Грэмми
    " в феврале предрешена уже сейчас. Хорошо, хоть половина ее достанется БиБиКингу.
    А до награждения премиями им.В.К.Хэнди по итогам сезона придется еще ждать до
    мая... Блюз-чарт от 29 декабря 2000г. - блюзовая десятка ХХ века: B.B. King &
    Eric Clapton : " Riding With The King" Stevie Ray Vaughan And Double Trouble :
    " SRV" Keb'' Mo'' : " The Door" Willie Nelson : " Milk Cow Blues" B.B. King :
    " Best B.B. King The Millennium Collection" John Hiatt : " Crossing Muddy Waters"
    Stevie Ray Vaughan And Double Trouble : " The Real Deal: Greatest Hits Volume
    2" Etta James : " Matriarch The Blues" Various Artists : " New Millennium Blues
    Party" Kenny Wayne Shepherd Band : " Live On" Обозор XI Эфесовского блюз-фестиваля.
    Интервью с участниками ХI эфесовского блюз-фестиваля в Москве: Лонг-Джон ХАНТЕР
    ; Братья ХОЛМС ; Лил''Брайан . Статья о Screamin'' Jay HAWKINS , опубликованная
