  extra_text: 'Зимние новости 2003 - ATB''s Winter Blues News 2003 зима 4 827$ Пластинка
    Роберта Джонсона ( Robert Johnson ) на 78 об./мин. с записью песни " 32-20 ",
    выпущенная в начале 1937г., была продана на аукционе Ebay за 4 827 USD. Считается,
    что всех пластинок Джонсона, выпущенных при его жизни, именно эта сохранилась
    в наименьшем количестве коллекционных экземпляров. На стороне B – песня " Нарушена
    честная сделка " Fair Deal Gone Done). Чествование продолжается Живая легенда
    кантри-блюза Дэвид "Медовенький" Эдвардз ( David "Honeyboy" Edwards ) в конце
    80-х выпустил автобиографию " Мир мне не должен " ("The World Don’t Owe Me Nothing"),
    аудио-альбом того же названия и стал героем документального фильма " Медовенький
    " ("Honeyboy"). 18 февраля фильм получил главную премию на фестивале документальных
    фильмов в Лос-Анжелесе (the Pan African Film and Arts Festival 2003). И это уже
    его четвертая награда, полный их список можно посмотреть на сайте фильма . На
    момент съемок герою было 86 лет. Блюзовый дедушка вспоминал о своем детстве, рассказывал
    о человеческих и блюзовых корнях, пугал о жизни в Миссиссиппи до появления там
    "прав человека", рассказывал, что такое жизнь сборщика урожая и как надо на ходу
    запрыгивать в товарный вагон. И как организовывать гастроли по миссиссиппским
    кабакам: juke joints. В фильме есть интервью и с несколькими другими блюзмэнами,
    включая БиБиКинга. На март фильм включен в программу Мемфисского международного
    кино-фестиваля (Memphis International Film Festival). Уж если город Мемфис уже
    снес сам легендарный рынок Максвелл-стрит, историческое место постоянных дневных
    блюзовых уличных джемов и пристанище множества ночных блюзовых клубов, может,
    городской фестиваль найдет премию для фильма об одном главных героев этого легендарного
    блюз-круга. Together we stand Две могучие американские блюзовые организации объявили
    о своем грядущем объединении. "Блюзовый фонд" ( The Blues Foundation ) готовится
    в следующем году раздавать учрежденные им премии им.Дабл-Ю-Си Хэнди (W.C.Handy
    Awards) уже в 25 раз. Кроме того, Фонд работает на создание "Зала блюзовой славы"
    (Blues Hall Fame) и музея Хэнди (Handy Museum), проводит международный конкурс
    "Вызов блюза" (International Blues Challenge) и Награду за общие достижения (the
    Lifetime Achievement Award). "Ассоциация блюзовой музыки ( The Blues Music Association
    ) помоложе, она создана всего пять лет и объединяет профессионалов от блюзовой
    индустрии: фирмы звукозаписи, продюсеров, промоутеров и т.д. Председатель ассоциации
    меняется каждый год, в нынешнем ее президентом является основатель и глава "Аллигатора"
    ( Alligator Records ) Брюс Иглауэр ( Bruce Iglauer ). Он сказал: "Пути наших организаций
    настолько параллельны, что мы элементарно достигнем наших целей быстрее, если
    пойдем вместе. Мы должны создать сильный работоспособный союз блюзовых профессионалов:
    музыкантов, продюсеров и распространителей – с блюзовыми пропагандистами и почитателями".
    Блюзовый туризм: быть или пока что еще нет? В миссиссиппской блюз-мекке, в городе
    Гринвуд работает Greenwood Blues Heritage Museum & Здесь бывает до 70 посетителей
    в месяц… Штатов и со всего света. Чуть западнее, в городе Лиленд принимает гостей
    музей Highway 61 Blues Museum. Его открыл бывший фермер Билли Джонсон, чьи родители
    содержали в городе аптеку, куда часто наведывались знаменитые местные блюз-персонажи.
    Недалеко, в Виксбурге путаются открыть общество "Willie Dixon-Vicksburg Blues
    Society" пытается открыть Vicksburg Blues Museum, пользуясь случаем, что в пригороде
    осободилось здание принадлежавшее YMCA. В Индианаполе, откуда вышел в мир БиБиКинг,
    местные блюз-фаны пошли тропой сотрудничества с краеведческим музеем, и открыли
    в The Tunica Museum свой блюзовый раздел. Добавление в блюз-туристское меню вносит
    Мэри Ф.Харт-Райт, бывшая школьная учительница Чикаго. Для нас существеннее то,
    что она – внучка прославленного фолк-блюзмена Миссиссиппи Джона Харта ( Mississippi
    John Hurt ). В миссиссиппский город Авалон она глубинки перевозит дом Джона Харта
    – трехкомнатную фермерскую хибару. " Всю свою жизнь я помню эту хижину в поле.
    Я всегда хотела что-то с ней придумать. Меня влечет к ней всю жизнь. Сейчас я
    представляю, что она станет местом, куда будут приходить представители самых разных
    культур, независимо от расы, чтобы отдать должное и понять нашу историю и культуру,
    откуда мы вышли " ( Все-таки Мэри осталась в душе учительницей! ). Она уже потратила
    не одну тысячу личных сбережений на переезд и ремонт. К прежнему месту стоянки
    хижины блюз-пилигримы стекались со всего мира, оставляя не только цветы, но и
    медиаторы и разнообразные моджо. На презентацию хижины-музея Джона Харта прошлым
    летом съехалось около трехсот гостей со всего мира. Но и сегодня Харт-Райт пока
    лишь планирует, что музей будет работать день или два в неделю, а она будет вести
    в нем экскурсии. В помощь совершаем блюзовое поломничество некто Steve Cheseborough
    написал путеводитель по блюзовым достопримечательностям Миссиссиппи: " Blues Traveling
    ". "Блюз в полночь" назначен на 11 марта… и другие вести аудио-записи. Bobby "Blue"
    Bland "Blues At Midnight" - название нового альбома Бобби "Грустного" Бланда (
    Bobby "Blue" Bland ), классика старой школы блюзового вокала. В январе нынешнего
    года ему исполнилось 73. В 47м он переехал в Мемфис, где стал участником юношеской
    блэк-группы с банальным заголовком "Mиниатюры"(Miniatures). Зато в этой группе
    играли небанальные будущие звезды: Джонни Эйс ( Johnny Ace ), Джуниор Паркер (
    Junior Parker ), Роско Гордон ( Rosco Gordon ) и его блюзовая светлость БиБиКинг
    ( B.B.King ). Они остались друзьями на всю жизнь, помогая друг другу по жизни
    и выступая вместе на сцене. Дуэты Кинга и Бланда увековечили на виниле ироничную
    задушевность их совместных блюзов. Ветеран Бланд может украсить мундир множеством
    регалий. У него Награды за общие достижения (Lifetime Achievement Award ) и от
    Грэмми, и от Блюз Фаундейшин (Blues Foundation); его имя – в Зале славы рок-н-ролла.
    Нынешний альбом – его 12й релиз на фирме "Молако" ( Malaco Records ). Вице-президент
    лейбла Волк Стефенсон (Wolf Stephenson) стал продюсером альбома и написал статью
    для буклета. В альбоме большая часть песен – новые. Но с названиями по классической
    блюзовой стезе, типа " Кто-то другой заразил меня блюзом " ("I Caught The Blues
    From Someone Else"). Исключения составляют песни ЗиЗиХилла " Я блюзмен " ( Z.Z.
    Hill ''s "I''m A Blues Man"), которая в исполнении Бланда кажется автобиографией;
    соул кантри-блюзовая баллада " Между мужчиной и женщиной " (Man-Woman Thing);
    и вечнозеленая " Что за чудесный мир " ("What A Wonderful World"), посвященная
    в блюзовый вокал еще Луи Армстронгом ( Louis Armstrong ). Various on Tone-Cool
    На 19-м году существования блюзовый лейбл "Тоун-Кул" ( Tone-Cool Records ) отмечает
    выход 50-го альбома в своем каталоге выходом " Первого тома истории "Тоун Кул"
    (The Story Tone-Cool, Vol. 1). Среди " клиентов " лейбла множество славных имен:
    от наиболее успешной по тиражам альбомов певицы-гитаристки Сюзан Тадеши ( Susan
    Tedeschi ), популярнейшего продюсера блюзовых записей и одновременно вокалиста-клавишника
    Тони Зет ( Tony Z ) и созданной СРВ ( SRV ) группы "Тридцать три несчастья" ("
    Double Trouble ") до дуэта традиционалистов "Пол Ришел и Энни Рэйнз" ( Paul Rishell
    & Annie Raines ), великолепных калифорнийских нео-блюз-свингеров "Род Пьяцца и
    Могучие летуны" ( Rod Piazza & The Mighty Flyers ), гитариста-виртуоза для гитаристов,
    уставших от традиций, Рика Холмстрома ( Rick Holmstrom ). Плюс к этому потомственный
    гитарный блюзовик Бернард Эллисон ( Bernard Allison ) и сенсация прошлого года
    "Северо-миссиссиппские все – звезды" ( North Mississippi Allstars ). Little Anthony
    & Sugar Ray , David Maxwell и Mike Welch – тоже отсюда. Все они многократно приносили
    лейблу разнообразные блюзовые награды, включая Грэмми и им.Дабл-Ю-Си Хэнди. Да
    и сам лейбл в нынешнем году номинируется на премию им.Дабл-Ю-Си Хэнди " За поддержку
    жизни в блюзе " ("Keeping the Blues Alive"). Двойной " исторический " альбом содержит
    24 песни и назначен к выходу на 25 февраля. Various in the Mississippi Jukes "
    Последний Миссиссипских кабаков " ( the Mississippi Jukes ) – название аудио-
    и двд-альбома, назначенного к выпуску на 18 марта лейблом "Убежище" ( Sanctuary
    Records ). Название фильма ясно указывает, что это посвящение современному миссиссиппскому
    блюзу, сельским танцплощадкам и кабакам. Для документалиста Роберта Мюджа ( Robert
    Mugge ) это уже второе обращение к теме. В 1991 году, вместе с Роберт Палмером,
    он создал великолепную сагу " Глубокий блюз " ( Deep Blues ). Неэстрадная современная
    музыка является главной его темой вообще. Всего он создал 21 фильм, вот название
    некоторых: " Госпел по Элу Грину " (Gospel According To Al Green) – 1984; " Ритм-Энд-Заливы:
    Дорожная карта луизианской музыки " (Rhythm ''N Bayous: A Road Map to Louisiana
    Music) – 2000; " Сонни Роллинз, колосс саксофона " (Saxophone Colossus with Sonny
    Rollins) – 1986; " Соберемся у реки: Праздник голубой травы " (Gather At The River:
    A Bluegrass Celebration) – 1994. (Мне кажется, я большой поклонник творчества
    этого Мюджа, хотя видел только один его фильм про глубинный блюз - АЕ) . Сам Мюдж
    говорит, что его вдохновляет личный опыт посещения таких заведений, где его "
    захватывает неповторимая атмосфера прокуренных, небольших, слабоосвещенных залов,
    где гармоничен музыкальный союз черных и белых; где местные музыканты играют на
    великолепном уровне; где поют от всего сердца и от полуночи почти до рассвета
    ". Список треков аудио-альбома дает представление об участниках этого фильма:
