    ты учился? На слух, само пришло? Когда я впервые взял гитару, как раз чтоб подыграть
    Мадди Уотерсу, я понял, что это может каждый идиот, сделать судя по тому, что
    у меня начало что-то получаться. Но это очень сложно. И потом, ты же знаешь, что
    я не гитарист. Для меня гитара это как вот палочка, да? Я пробовал петь без гитары,
    но у меня не получается. Мне нужно вот что-то держать. Вот баба в руках должна
    быть. Она же недаром такой формы. Не могу понять гитаристов, которые на флайе
    играют, какое-то извращение. - Ну, Алберт Кинг тебя бы не понял… Я понимаю… Но.
    Может, ему такие нравились? - А эта гитара откуда взялась? А эту гитару мне подарили
    в Нью-Йорке, не знаю, это байка, скорее всего. Ее украли у какого-то музыканта
    в Нью-Йорке. А у меня там товарищ, который коллекционирует гитары, у него группа
    есть своя. А я все время приезжал, у меня с ним был общий бизнес, связанный с
    животными. Он там занимался террариумными животными, я ему привозил в подарок
    каких-то животных, он мне. И как-то мы очень семьями сблизились. - Сблюзились.
    Да, сблюзились. Сблюжение, хорошая фраза. Ставь копирайт. - И как ваше сблюжение
    перешло в эту гитару? Я один раз приехал, а они как раз переехали Нью-Йорка под
    Нью-Йорк, у них был собственный дом там. Ну, он очень состоятельный человек. У
    них такой гостевой домик. Они меня туда селят. Первое, что я вижу, когда туда
    захожу – стоит кофр, жесткий, старый, битый-перебитый, стоит битый-перебитый комбик
    Fender. «Вот я тебе тут инструменты поставил, пока поиграй». А я видел у него
    коллекцию гитар, там много гитар хороших. В общем, я открываю и вижу этот Les
    Paul. Я его беру и понимаю, что вот эта тварь, которая меня сгубила. Ну я там
    месяц как раз целый жил, и мы там джемовали. А когда я уже уезжал, они с женой
    мне вот просто сказали, что они хотят мне ее подарить. Я начал, естественно, сначала
    отказываться. Даже позвонил проконсультироваться там бывшей жены брат – брать
    не брать, она говорит – конечно, нельзя. Я говорю – ах, сволочь ты какая! И ты
    туда же! А потом я допустил ошибку. Я столько отказывался, что они сказали – ну
    ладно, не хочешь – не надо. И я тут же спросил - а кофр можно будет забрать? Они
    сказали, что даже комбик. Но комбик был тяжелый. Потом он мне подарил вторую,
    еще гибсон один. Двенадцатиструнную старую акустику, но, к сожалению, ее надо
    ремонтировать. - Никогда не видел тебя с акустикой на сцене. Не, я играл очень
    часто, я приносил акустику. Ну вот, эта гитара, вот я могу сказать - точно мой
    инструмент. Но я очень люблю ее давать поиграть хорошим музыкантам, и сесть послушать.
    Потому что я так не могу, я не могу показать все, что она может. - Ну и как, тебе
    нравится то, что она может? Да, у нее после этого струны рвутся, это она мне -
    типа не отдавай меня в чужие руки. - Она у тебя еще и расписана. Ну это так, это
    по пьяни. Ну как, по пьяни, да. Первый расписался Джон Праймер. А потом я думаю
    – что такая одинокая подпись? И начали. И набрался такой, знаешь, чуть не сказал
    «пантеон». А Гия хорошо Дзагнидзе по этому поводу сказал: а почему моей подписи
    нету? Она есть сейчас. Я говорю: Гия, я тебе хорошее место найду. Он говорит:
    что, кладбище, что ли? Ну там все достойные гитаристы расписались, ну там есть
    Dave Hole, Walter Traut, Eddie C. Campbell… Там многие руки приложили. В смысле
    расписывались. И играли, да, тоже. - Луизиане Редy ты не давал ee? Луизиане Редy
    нет, не давал. Зато я же джемовал с Луизианой. У меня даже есть фотография, где
    я выгляжу как кролик испуганный. С гитарой. И вот так смотрю, идиотское выражение.
    - Редкий человек напугает Каверкина до состояния кролика... Ну это не испуг был,
    ну, знаешь, это благоговение такое. Нет, слава Богу, я джемовал с многими хорошими
    известными музыкантами, спасибо Омару. Он почему-то свято верил, что именно я
    должен играть с ними блюзы, потому что свято верил, что я один немногих, кто играет.
    Ну, не знаю. Знаешь что, не буду излишне скромным – наверное, это так. - Ну а
    какие-то особенно памятные есть моменты джемования с блюзменами импортными Ты
    знаешь, на самом деле это все настолько страшно, ну, как страшно, это настолько…ну
    как будто это не ты. И ты ни хрена не запоминаешь, с кем тебе было там… - Видимо,
    состояние Наташи ростовой на первом балу? Ну да. Это то же самое, что как лечь
    в постель к какой-нибудь киноактрисе и потом тебя спросят - ну как было? А я не
    помню, не знаю, мы про кино говорили! - Спасибо, что-то еще хочешь добавить? Дай
    бог всем здоровья, всех благ. Передать привет всем, кто меня любит.. - 40 минут.
    Мы молодцы. Попиздеть-то мы горазды. Расшифровка Л.Деевой'
