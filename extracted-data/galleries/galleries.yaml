    что не понравилось обозревателю - это проигнорированный британский блюз эпохи
    60-х. " Эрик Клэптон должен был быть там ", по его мнению. Концерт закончился
    во втором часу, но БиБиКинг, известный полуночник, еще более двух часов принимал
    желающих для беседы в своей гримерке. Концерт отснят, и его фрагменты будут использоваться
    в теле-сериале по истории блюза, который продюссирует Мартин Скорсезе. Билеты
    стоили от 50$ до 1250$. Концерт благотворительный, доходы будут направлены на
    финансирование программы "Год блюза".(подробности на этой странице, ниже) Ветераны
    блюзбэнда Мадди Уотерса вновь вместе. Когда Мадди Уотерс отошел от гастрольной
    деятельности, участники его легендарного блюз-бэнда, многоталантливые музыканты,
    и ранее являвшие способности лидеров и солистов, отпочковались в свой блюз-бэнд.
    Над названием долго головы не ломали. Название простенькое, но со вкусом: The
    Legendary Blues Band - на протяжении 80-х этот коллектив сохранял и обновлял маддиуотерсовский
    бэндовый саунд. В 90-х участники проекта пошли сольными путями, но не раз встречались
    вновь на сцене и в студии. Например, без их участия не возможно представить альбом-посвящение
    Мадди Уотерсу: The Muddy Waters Tribute Band - You''re Gonna Miss Me (When I''m
    Dead & Gone) - записанный в 1996 году фирмой Telarc. В декабре 2002 года трое
    участников блюзбэнда Мадди Уотерса вновь играли на одной сцене в кирпичном здании
    бывшей церкви, перестроенной под концертную студию Blue Heaven/APO Records . Владелец
    фирмы Чэд Кэйсем, эксперт по звуку и звукозаписи, в восторге от акустики этого
    зала. Собрать вместе бывших соратников и сподвижников - задача не простая. И упустить
    такое благоприятное стечение обстоятельств - легендарные музыканты и великолепная
    акустика - было бы непростительно. Концерт записан и будет опубликован. Интимная
    атмосфера относительно небольшого зала (450 мест) так же была благоприятным фактором.
    Сам Мадди говорил, что ему больше по сердцу выступления перед небольшой аудиторией,
    когда проще наладить общение со слушателем. Барабанщик "Пучеглазый" Вилли Смит
    ( Willie "Big Eyes" Smith ) получил свое прозвище от самого Мадди Уотерса. Он
    служил в его блюзбэнде с середины 60-х. В конце 60-х в маддиуотерсовском блюзбэнде
    Отиса Спэна сменил за фортепиано Пайнтоп Перкинс ( Pinetop Perkins ), сегодняшний
    блюзовый патриарх, записавший в 90-х ряд блистательных альбомов. Кстати, Пайнтопу
    Перкинсу летом нынешнего года исполнится именно 90 лет со дня рождения. Заметное
    место в сегодняшнем традиционном блюзе занимает гитарист Боб Марголин ( Bob Margolin
    ). Все эти трое играли в маддиуотерсовском блюзбэнде до 1980 года, до года его
    расформирования. Карей Бэлл ( Carey Bell ), прекрасно знакомый любителям губной
    гармоники, играл и записывался с Мадди Уотерсом относительно недолго. Но ему,
    как и Бобу Марголину, и Вилли Смиту, первую известность принес именно блюзбэнд
    Мадди Уотерса. Открывал концерт Джимми Ди Лэйн ( Jimmy D. Lane & Blue Earth),
    один самых интересных сегодняшних гитаристов, органично сочетающий блюзовую ритмику
    и тяжелое звучание. Он имел особую причину для участие в этой программе. Джидди
    Ди Лэйн - сын умершего 5 лет назад Джимми Роджерса, верного соратника Мадди Уотерса,
    с которым были записаны многие вечнозеленых чикагских блюзовых стандартов. 4 ГАРМОНИСТА
    - аншлаг в ЦДХ! БЛЮЗОВЫЙ ДЖЕМ на Татьянин день официально 2003 й - ГОД БЛЮЗА 5
    сентября 2002 года Конгресс США принял решение объявить 2003 год "Годом блюза",
    в ознаменование 100-летия со дня, когда Дабл-Ю-Си-Хэнди впервые услышал блюз и
    описал эту встречу в своей автобиографии "Отец Блюза" (W.C.Handy "Father the Blues").
    (АЕ: "Отец блюза" встретил названного своего сына уже дотаточно сформировавшимся
    и очень удивился этой встрече... Сей факт не должен смущать, поскольку блюз, собственно,
    и представляет собой гармоничное сочетание парадоксов.) Американская государственная
    программа, посвященная музыке, рожденной в Америке, парадоксальным образом спонсируется
    Фольксвагеном. (АЕ: кажется, в отношении имиджа это наименее американская автомобильная
    компания). "Год блюза" главнейшей своей задачей ставит расширение блюзовой аудитории.
    Школьные учителя, выразившие желание организовать блюзовый курс, получат необходимую
    методическую поддержку. Кроме того, осенью 2003 года Сиэтла (АЕ: почему-то) стартует
    передвижная выставка "Милый дом мой Чикаго", рассказывающая о миграции блюза на
    север в 40-х годах и дальнейшей его эволюции до стадии "современного блюза". Будет
    выпущена 13-серийная радиопрограмма, посвященная истории блюза, и опубликована
    книга под названием "Год блюза", подготовленная ведущими специалистами. В общий
    объем работ включен и уже разрекламированный теле-сериал, продюсируемый Мартином
    Скорсезе (Martin Scorsese). Почитателям блюза Скорсезе дорог как создатель фильма
    "Последний вальс" (The Waltz), в котором, кроме главных героев, группы The Band,
    увековечены сценические выступления Мадди Уотерса , Стэппл Сингерз , Доктора Джона,
    Пола Баттерфилд а и других выдающихся блюзменов. Режиссерами отдельных серий его
    нового проекта выступят: американец Клинт Иствуд (Clint Eastwood), уже не раз
    продемонстрировавший свою любовь к традиционному и свинговому джазу; и германец
    Вим Вендерс (Wim Wenders). (АЕ: Мастер западноберлинского сюр-нео- реализма известен
    своей любовью в Нику Кейву, который, в свою очередь, любит блюз Санни Боя Уилльямсона
    "Тебе похоронят, а меня потом пусть судят". Может быть, поэтому его ангажировали
    на эту работу? В кадре о блюзе будут рассуждать авторитетные у широкой публики
    лица. Кроме всегда ожидаемого в этой роли Эрика Клэптона, появятся и такие известные
    "блюзоведы", как Пол МакКартни.) Реальная поддержка обещана традиционному Чикагскому
    блюзовому фестивалю, и менее известным блюзовым учебным курсам и конкурсам молодых
    исполнителей блюза. Уже открыт и предлагает обширные исторические материалы и
    интервью со специалистами интернет-сайт http://www.yearoftheblues.com/ . Избегая
    конкретного толкования блюза, http://www.yearoftheblues.com/riff.asp предоставляет
    практикам широкий набор учебных пособий: аудио-примеры в MP3, PDF-файлы с нотами
    и таблатурой, видео-уроки исполнения песни Chip’s Blues и полезные упражнения
    по стилевым нюансам. Настоящий оптимизм внушает состав президиум советников (
    Advisory Board ). Его возглавляет известнейший, авторитетный и деятельный блюзовый
    историк и пропагандист Роберт Сантелли ( Robert Santelli ). (АЕ: две его книги:
    The 101 essential Blues Albums и Big Book Blues – являются моими настольными.)
    Опытные и заслуженные историки и публицисты входят в совет: Это, например, архивариус
    Мэри Кэтлин Элдин ( Mary Katherine Aldin ). Сия достойная дама начала блюзовую
    исследовательскую работу 40 лет назад, участвовала в написание полудюжины научных
    книг о блюзе, включая капитальный труд Nothing But The Blues под редакцией L.Cohn,
    подготовила к публикации более 200 альбомов с древними записями корневой афро-американской
    музыки, с 1975 года не пылесосила свою квартиру, а с 1984 она ведет еженедельную
    блюзовую колонку в L.A. Weekly. (АЕ: Все сведения, включая отношение к пылесосу,
    взяты с сайта очаровательной статьи о ней. Если английский позволяет, очень рекомендую
    почитать, просто ради удовольствия http://www.yearoftheblues.com/advBoard.asp?id={EF6B5690-CA2E-46E3-89E1-4C62682A7074}
    . Я же, когда вижу подпись Элдин, всегда абсолютно уверен, что передо мной занудная
    и несомненно достоверная и аккуратная работа.) Видимо, постаравшись объединить
    всех потенциальных союзников в деле пропаганды блюза, в совет пригласили представителей:
    традиционалистского журнала " Living Blues ", музея Delta Blues , Чикагского блюз-фестиваля
    , Зала славы рок-н-ролла , фонда Blues Foundation . Здесь же основатели и президенты
    двух наиболее значительных блюзовых лейблов современности: Брюс Иглауэр, ( Bruce
    Iglauer ) Alligator Records и Майк Кэппус (Mike Kappus), The Rosebud Agency. (АЕ:
    по какому-то совпадению, это именно те двое, что в 1991 году откликнулись на мою
    просьбу помочь аудио-материалами для радио-программы "Весь Этот Блюз") Дабы не
    только теоретики и ответственные работники заседали в президиуме, в его состав
    приняты еще и музыканты, не нуждающиеся на сайте blues.ru в особом представлении:
    Би-Би Кинг ( B.B. King ), Бонни Райтт (Bonnie Raitt), Коко Тейлор ( Koko Taylor
    ) и Кеб-Мо ( Keb'' Mo ''). Двое почетных членов носят фамилию Хэнди. Официальное
    открытие назначено на 7 февраля сего года, когда в нью-йоркском зале Radio City
    Music Hall состоится концерт, в котором примут участие блюзовые ветераны и поп-звезды.
    Концерт будет отснят (опять-таки под продюсированием М.Скорсезе). Доходы от концерта
    и фильма будут направлены через благотворительный фонд Blues Music Foundation
    на поддержку блюзовых проектов: музыкальных, образовательных, пропагандистских
    и пр.'
