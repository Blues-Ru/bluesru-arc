  extra_text: 'XI Efes Pilsner Blues Festival в Москве, 12-14 октября 2000 года, The
    HOLMES BROTHERS. Efes Pilsner Blues Festival интервью с "Братьями ХОЛМС" Это очень
    показательное фото для атмосферы, в которой проходило интервью. В левом темном
    углу, в стороне от всех, сидит Попси Диксон - он почти не принимал участия в беседе.
    А вот сами братья Холмс были в отличном настроении. Многие их заявлений, которые
    в письме могут показаться излишне "пафосными" , на деле были хорошо приправлены
    добрым смехом. "Деды" много шутили, с удовольствием вспоминали... и сами были
    полны любопытства ко всему. A : You travel a lot these days, don''t you? SHERMAN
    HOLMES (SH) : Well, recently we have been to Africa, Australia, New Zealand, all
    over Europe. It''s our time to Russia and I hope it won''t be our time. A : How
    do people react to blues music in different parts the world? WENDELL HOLMES (W)
    : We find it very interesting that the music that we play, what it really is -
    the American roots music: gospel and blues - people seem to like it everywhere
    we go. Or at least the say they do… Ha! SH : We just came from Brazil before we
    came That was an excellent experience. People seem to receive us well. And, like
    u said, we travel a lot and meet different people from all over the world, and
    different cultures and it very enlightening it''s very educational learning other
    people cultures. It''s a good thing. А : Вы теперь много гастролируете? ШЕРМ А
    Н ХОЛМС (Ш) : Ну, за последнее время мы были в Африке, Австралии, Новой Зеландии,
    выступали по всей Европе. Это наш первый приезд в Россию и, я надеюсь, не последний.
    А : И как слушают блюз в разных концах света? ВЕНДЕЛЛ ХОЛМС (В) : Нам самим очень
    интересно то, что та музыка, которую мы играем: а это "корневая" американская
    музыка: госпелл и блюз - нравится людям повсюду, куда бы мы ни приезжали. Или,
    по крайней мере, нам говорят, что нравится. Ха! Ш : До приезда сюда мы как раз
    побывали в Бразилии. Это был великолепный опыт. Кажется, нас хорошо принимали.
    И, как вы и сказали, мы много путешествуем и знакомимся с людьми по всему свету
    и с самыми разными культурами. И это очень вдохновляет. И знакомство с другими
    культурами очень многому учит. Это полезно. A : Your music is defined as down-home…
    Is it so? W : Very down-home - we are from Virginia, as a mater fact Sherman and
    I - we are from Grassland from Virginia, and Popsy is from Beach Virginia. All
    Southern boys! It''s (the music) is the same anywhere we go, we try to do what
    we do, and stick to that. A : The music you''re playing, did you chose this style
    or it came naturally? SH : I think we choose the style… We sorta evolved that
    way. We have played other types music before: a lot heavy r''n''b. And we studied
    classically: piano, he is a trumpet player. A : You ever play trumpet in concerts?
    W : I moved away from that - I smoked too many cigarettes. I don''t have enough
    air in my langs. A : You play together for 33 years? W : 33 years! Actually my
    brother and I - we been playing together all our lives. I won''t tell you how
    old we are but -ha-ha - actually I''m 56, and we been playing together all our
    lives. And Popsy has been with us for 33 years. I met him in a club in New York
    in 1967 and we been together ever since. A : You are playing as trio? W : Yes.
    A : And all you sing… W : All us sing, we play and sing. A : Sometimes you sound
    like a blues band, sometimes like a gospel trio… W : Sometimes we are blues band,
    sometimes we are gospel band, and sometimes we are country band. Ha-ha A : You
    (Wendell) are playing both keyboard and guitar? W : Yes, I am. My brother Sherman
    plays a bass. And brother Popsy is a drummer and great fine singer. POPSY DIXON
    : I started in gospel, when I was 7 years old, growing up I was always in the
    church. Then after awhile worked with another group in gospel, and they said we
    want to start a band, so I started to play in a club in Brookline, And I''ve been
    working nightclubs since then. А : Вашу музыку называют домашней, провинциальной...
    так это? В : Очень домашняя, провинциальная - мы Виржинии, мы с Шерманом Крисслэнда,
    штат Виржиния, а Попси Виржиния-Бич. Наша музыка звучит так же, куда бы мы ни
    поехали, мы придерживаемся своего стиля. А : Та музыка, которую вы играете, вы
    выбрали этот стиль он он сложился естественно? Ш : Думаю, это наш выбор. Мы постепенно
    склонялись в эту сторону. Мы раньше играли и музыку другого рода - много тяжелого
    ритм-энд-блюза. Мы учились классике: я - фортепиано, он (Венделл) - на трубе.
    А : А теперь Вы в концертах играете иногда на трубе? В : Нет, от этого я отошел.
    Я выкурил слишком много сигарет. Теперь в легких не хватает воздуха. А : Вы играете
    вместе 33 года? В : 33 года! Вообще, мы с братом играем вместе всю жизнь. Я не
    скажу вам, сколько нам лет, но - ха-ха - вообще-то мне 56, и мы играем вместе
    всю жизнь. А Попси с нами уже 33 года. Я познакомился с ним в Нью-Йорке в 1967
    году, и с тех пор мы вместе. А : Вы играете как трио? В : Да. А : И все трое -
    вокалисты... В : Все поем, мы и поем, и играем. А : Иногда вы звучите как блюзбэнд,
    а иногда как госпел-трио. В : Иногда мы и есть блюзбэнд, иногда госпелл-бэнд,
    а иногда мы и кантри-бэнд. А : Вы играете и на клавишных и на гитаре? В : Да.
    Мой брат Шерман играет на басу, а брат Попси - он барабанщик и прекрасный чудесный
    певец. ПОПСИ : Я начинал в госпелл, с тех пор, как мне исполнилось 7 лет, я рос
    в церкви. Позже, когда я уже работал с одной госпелл-группой, они сказали, что
    хотят организовать группу, и я начал выступать с ними в Бруклине. Вот с тех пор
    я работаю по ночным клубам. A : What were your early influences? W : Jimmy Reed,
    Gatemouth Brown, Lightning Hopkins, - this goes on and on all the old guys...
    SH : Don''t forget Hank Williams. W : And Hank Williams, country music king. A
    : Yeah I noticed you play country guitar quite often. W : Oh yeah, I do that.
    А : Кто оказал на вас наибольшее влияние в начале пути? В : Джимми Рид, Гейтмаус
    Браун, Лайтнинг Хопкинс - список можно продолжать и продолжать... Все эти старики!..
    Ш. Не забудь Хэнка Уилльямса! В : И Хэнк Уилльямс - король кантри-музыки. А :
    Да, я заметил, вы частенько добавляете кантри-гитару. В : О да, это так. SH :
    In fact when we were small we used to play a game called nightclub. We would pretend
    that we are entertainers. We took broomsticks… W : and drums and go like this.
    (shows enthusiastic drumming) A : …and you are still playing this game! W : We
    are still playing this game. Sometimes we say come on, lets go playing nightclub.
    A : So now you are going to play nightclub in Russia? W : Absolutely - we are
    playing nightclub in Russia! Ш : Вообще-то, еще когда мы были маленькими, мы частенько
    играли в игру под названием "ночной клуб". Мы строили себя артистов. Брали палки
    от швабры... В : и барабаны, и давай вот так (демонстрирует увлеченное барабанение)
    А : Ну так значит, вы и продолжаете играть в эту игру? В : Мы продолжаем играть
    в эту игру. Частенько мы говорим, айда играть в "ночной клуб". А : И вот теперь
    вы сыграете эту игру в России. В : Точно - теперь мы в России играем в "ночной
    клуб". A : This life on the road - how it affects your personal life? W : I''m
    married. I''ve been married for more thirty years to my childhood sweetheart,
    and as a matter fact we are still devote so much it''s always a pleasure to get
    When we leave this tour we gotta be going to Austria and to Spain, then we go
    for a few days, and we come to Bulgaria before Christmas. And Christmas we''ll
    be at with our families. A : That''s the family life for a bluesman... W : Yeah,
    family life for a bluesman, but it''s a very stable relationship. Because we love
    each other. А : Эта жизнь всегда в дороге - как она отразилась на вашей личной
    жизни? В : Я женат. Я женат уже более 30 лет на той, в кого влюбился еще ребенком.
    И мы по-прежнему столь увлечены друг другом, что я всегда с удовольствием возвращаюсь
    домой. Когда мы закончим с этим туром (в программе эфесовского фестиваля), мы
    должны еще поехать в Австрию и Испанию, потом съездим домой на несколько дней,
    и вернемся выступать в Болгарии до Рождества. А на Рождество мы будем дома, с
    нашими семьями. А : Такова семейная жизнь блюзмена? В : Да, такова семейная жизнь
    блюзмена, но у нас очень постоянные отношения. Потому что мы по-прежнему любим
    друг друга. A; What makes blues a very special music? SH : I think that blues
    and soul comes from life experiences. How we feel about what happens to as every
    day. It talks about love, disappointment... W : Pain, poverty... SH : Faith. A
    : There were times, when blues was considered to be "devil''s music". And you
    are performing blues in the same concert with sacred gospel and spiritual. What
    do you feel about it? W : I have no problems with it at all. Because it all comes
    from the same roots. A lot it comes from Africa, lot it comes from Reconstruction
    which is right after slavery in the United States. As a matter fact we have a
    saying. We say: "We gonna unlock them on Saturday and save them on Sunday" - same
    people SH : The devils music - a lot that came from Robert Johnson . People thought
    that he had sold his soul, you know… W : That''s right. SH : But I mean, Jesus
    himself went to where they sold vine and stuff like this. He didn''t really went
    to temples. He was - a man and the people. W : Don''t forget that Jesus turned
    water into vine and not vine in to water. ( laugh ) А : Что делает блюз совершенно
    особенной музыкой? Ш : Я думаю, что блюз и соул идут прямо от жизненного опыта.
    От того, как вы переживаете происшествия каждого дня... Он рассказывает о любви,
    разочаровании, вере... В : О боли, о нищете... Ш : Вере. А : Были времена, когда
    блюз считался дьявольской музыкой. Сейчас вы исполняете блюзы в одной концертной
    программе с церковной музыкой: госпелл и спиричуэлс. Что вы скажете об этом? В
    : У меня с этим никаких проблем не возникает. Все это идет от одних корней. Многое
    корней А фрики, много времен Восстановления, это период сразу после отмены рабства
    в СШ А . Есть ведь поговорка: "не согрешишь в субботу - не в чем будет кается
    в воскресенье". Это все те же люди (кто грешит и кто ходит в церковь). Ш : "Дьявольская
    музыка" - это все идет от Роберта Джонсона. Люди думали, что он продал свою душу,
    знаете ли... В : Да, так... Ш : Но я что хочу сказать... Иисус сам ходил туда,
    где торговали вином и всяким таким. Он не в храмах проповедовал. Он был лицом
    к лицу с простыми людьми. В : И не забывайте, что Иисус обратил воду в вино, а
    не вино в воду! (общий радостный смех) A : Your perform church music. Are you
    religious people? SH : I''m a religious man. That doesn''t mean I''m a good guy,
    but I''m always striving to be a better guy. А : Вы исполняете церковную музыку.
    Вы верующие люди? Ш : Я верующий человек. Это не значит, что я такой уж хороший,
    но я всегда стремлюсь стать лучше. (Венделл одобрительно похлопал брата по плечу,
    и оба рассмеялись.)'
