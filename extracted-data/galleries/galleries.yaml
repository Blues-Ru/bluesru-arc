    как сайкоделик-рок-группа, после 35-летнего перерыва в дискографии выпускает 22
    апреля новый альбом " Птичляндия " (" Birdland "). Мужеству этих людей можно только
    позавидовать. В попытке во второй раз войти в ту же реку их поддерживают их личности,
    увесистые в поп-рок-мире: Стив Вай, Брайан Мей, Джеф Бек (бывший лидер группы,
    ныне появляющегося только как гость на записи), и пр. оригинальных "домашних птиц"
    остались только двое: ритм-гитарист Крис Дрежа ( Chris Dreja ) и барабанщик Джим
    МакКарти ( Jim McCarty ). Лидер-гитаристом стал Джиппи Мэйо ( Gypie Mayo ), бывший
    участник славной буги-блюз-группы "Доктор Айболит" ("Dr. Feelgood"). На губной
    гармонике играет Алан Гленн ( Alan Glen ) бывший участник хеви-блюз-бэнда " Девять
    ниже нуля " ("Nine Below Zero"). Джон Иден ( John Idan ) запевает и играет на
    бас-гитаре. У него славная внешность именно с точки зрения ностальгии по британским
    психоделическим 60-м. Кстати, вот список песен альбома, с указанием, где какой
    гость "приседал" (sit-in): Birdland I''m Not Talking Crying Out For Love The Nazz
    Are Blue - ( Jeff ''Skunk'' Baxter , guitar) For Your Love - ( John Rzeznik ,
    vocals) Please Don''t Tell Me ''Bout The News Train Kept A Rolling - ( Joe Satriani
    , guitar) Mr. Saboteur Shapes Things - ( Steve Vai , guitar) My Blind Life - (
    Jeff Beck , guitar) Over, Under, Sideways, Down - ( Slash , guitar) Mr. You''re
    A Better Man Than I - ( Brian May , guitar) Mystery Being Dream Within A Dream
    Happenings Ten Years Time Ago - ( Steve Lukather , guitar) An Original Man (A
    Song For Keith) Список указывает на абсолютно неблюзовое содержание альбома. Почему
    новости о нем появились во всех блюзовых источниках? Видимо, бюджет с участием
    Слэша обязывает к всеобхватывающей рекламе. Закончили земной путь 6 января объявлено
    о кончине на 59м году жизни певца и харпера Ричарда Ньювелла, известного как Кинг
    Бисквит Бой (Richard (King Biscuit Boy) Newell). Канадского происхождения, он
    играл блюз на губной гармонике с 1961 года. За четыре десятка лет он выпустил
    8 сольных альбом, так и не добившись большой известности. Однако он был бесконечно
    предан блюзу, и за долгую карьеру успешно сотрудничал со многими прославленными
    корифеями жанра, включая такие имена как Muddy Waters, Otis Span, Etta James,
    Joe Cocker, Dr. John. Сценическое прозвище получил от гитариста группы "Группа"
    (The Band) Ронни Хокинса (Ronnie Hawkins) – в честь радиопередачи, которую вел
    харпер Сонни Бой Виллиамсон (Sonny Boy Williamson). И, хотя поначалу оно ему не
    нравилось, прозвище прижилось. 1 марта объявлено о кончине на 95 году жизни флейтиста
    и барабанщика Оты Тернера (Otha Turner). Флейта и барабаны - характернейшее сочетание
    для доблюзовой афроамериканской музыки. Сохранившаяся только в американской глубинке,
    эта традиция связывает блюз с африканской музыкой. И в записи последнего альбома
    Тернера участвовала группа сенегальских барабанщиков и перкуссионистов. Тернер
    появлялся в нескольких документальных фильмах о народной музыке. Его альбом "Everybody
    Hollerin''" 1997 года был назван журналом "Rolling Stone" в числе лучших 10 блюзоых
    альбомов года. Его группа под названием "Rising Star Fife and Drum Corps" была
    постоянным участником фестиваля "Sunflower River Blues and Gospel Festival". Обычно
    именно они открывали фестиваль блюзовым маршем. " Это незабываемо – как он маршировал
    с флейтой и большим барабаном от станции к сцене, и с ним, играя, шли участники
    группы. Без него фестиваль уже не будет таким, как был ," - сказала ответственный
    секретарь фестиваля Ивонна Стэнфорд. GRAMMY-2003 уважаемые имена в забавных местах
    . В нынешнем году, стараясь задобрить российских призывников, 45я по счету церемония
    раздачи граммофончиков Американской академии звукозаписи была приурочена к 23
    февраля. Как всегда, не обошлось без путаницы - к моменту оглашения их победителей,
    у нас День защитника Отечества уже давно закончился, и началась банальная рабочая
    неделя. Что не мешает порадоваться за наших. Получив сразу два граммофончика,
    БиБиКинг ( B.B.King ) довел количество своих G-трофеев до чертовой дюжины. Один
    - за альбом " A Christmas Celebration Hope ", в категории "Традиционный блюзовый
    альбом" ( Traditional Blues Album ). Другой - за трек этого альбома " Auld Lang
    Syne ", в категории "Инструментальная поп-запись" ( Pop Instrumental Performance
    ). Что уж в этом альбоме такого традиционного, если он даже не очень блюзовый?..
    "Auld Lang Syne" - это, кажется, шотландская традиционная мелодия… Но кто скажет,
    что БиБиКингу не положена еще одна Грэмми?! За свои 78 лет он их заслужил гораздо
    больше, чем 13. Другие претенденты-традиционалисты: Burnside On Burnside - R.L.
