    + Greeen Square Радиопрограммы "ВЕСЬ ЭТОТ БЛЮЗ" в RealAudio: " Ветеранский блюз
    , как хорошо выдержанный коньяк, пользовался почтением широкой публики и вызывал
    восторг у пишущей критики"... Альбом 87-летнего певца-гитариста Джесси Томаса
    "Блюз Грустного Гуся" вышел в 1995 году. Альбом представлен в серии " Золото блюзовой
