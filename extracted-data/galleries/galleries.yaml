    MATERIAL THINGS Mel Waiters (Waldoxy/Malaco) Понятно, что лидерство "Поездки с
    королем" определяется не вкладом самого короля блюза, а участием мега-звезды Эрика
    Клэптона . Собственный альбом Кинга прошлого года: "Заниматься любовью тебе на
    пользу" ("Makin'' Love Is Good For You") - остался далек от таких высот и в итоговую
    десятку вообще не вошел. Хотя общий результат БиБиКинга тоже неплох: втечение
    2000го года всего 6 его альбомов (два названных плюс сборники старых записей и
    альбом 1998 года) поднялись в первую десятку самых продаваемых блюзовых альбомов...
    Клэптон же баловался блюзом в молодости, не оставляет этого удовольствия и на
    старости лет. Армия "клэптонманов" определила альбом аж на 3-е место общего списка
    горячих альбомов "Биллбоарда" уже в первую неделю после его выхода. Давненько
    альбом, хотя бы претендующий на блюзовый статус, не попадал так высоко. Впрочем,
    и предыдущий столь же высокий подъем блюза к первым местам в коммерческих сводках
    произвел тот же Клэптон, когда в 1994 году он вместе с участниками маддиуотерсовского
    блюзбэнда записал альбом "С колыбели" ("From The Cradle"). С 13 июня 2000г., со
    дня выпуска, клэптон-кинговский альбом возглавил список "горячих" блюзовых альбомов
    - и вряд ли скоро сойдет с трона "царя блюзовой горы" (разве что Бритни Спиарз
    тоже решит побаловаться блюзом... молитесь, братья!). Примитивный финансовый критерий
    внес в биллбоардовскую блюзовую десятку года несколько еще более сомнительных
    альбомов. Кенни Уэйн Шеппард - хороший гитарист и яростный почитатель SRV, но
    давно уже никто не считает его блюзмэном. Два блюза в альбоме молодого Джонни
    Лэнга тоже слабое основание для его участия в блюзовом параде. В двухтысячном
    исполнилось десять лет со дня трагической гибели Стиви Рея Воэна . И в отношении
    дискографии он повторяет историю своего кумира: после его смерти издано больше
    его записей, чем при жизни. Сразу три этих посмертных изданий вошли в десятку:
    два сборника, приправленных ранее не издававшимися записями, и запись телевизионного
    концерта в дуэте с Албертом Кингом . Уже под конец года вышла коробка "SRV", в
    которой три CD с преимущественно ранее не издававшимся материалом и концертным
    DVD. Несомненно, она будет оставаться в первой десятке на протяжении всего Нового
    (пока) года. В соответствии с шоу-бизнесовым законом, смерть соул-блюзового певца
    Джонни Тейлора в мае 2000 году подняла и тираж его прошлогодней пластинки. Десятка
    просто изобилует прошлогодними релизами, а Джонни Лэнг и Сьэзан Тадеши - вообще
    1998 года. Это говорит об отсутствии должной рекламы новых релизов, отчего требуется
    очень много времени, чтобы публика узнала, распробовала и раскупила "новинку".
    Ну и есть один "неблюзовик", чью работу приятно видеть в этой десятке. Ветеран
    кантри-музыки Уилли Нельсон записал альбом дуэтов с блюзмэнами. Имена их, в общем,
    тоже этой "горячей" десятки: БиБиКинг, Кенни Уэйн Шеппард, Джонни Лэнг, Сьэзан
    Тадеши. Плюс Кэб'' Мо и Доктор Джон. Участники второй биллбоардовской десятки
    по итогам за год: Джон Хиатт (John Hiatt), американский сонгстер, по-прежнему
    считается участником блюзовой команды. Именно его песня & quot;Поездка с королем"
    дала название альбому-лидеру года; и верно, что блюзовики ( Бадди Гай , например)
