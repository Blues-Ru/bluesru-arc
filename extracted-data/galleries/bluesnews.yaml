extra_text: 'Блюзовые новости Января-Февраля 1999 текущие новости ВЕСЬ-ЭТОТ-БЛЮЗ™
  (события - объективно, толкования - сердцу не прикажешь) 1999 январь-февраль События:
  Потери: умер Charles BROWN , умер A.C.LITTLEFIELD * Награды: John Lee HOOKER - награду
  получил, деньги вернул, Otis RUSH - GRAMMY нашла героя, Keb''MO - вторая GRAMMY
  за верную службу SONNY * Наказания: глава фирмы и клуба "ANTONE''s" Clifford ANTONE
  решил признать себя виновным* В записи: выходят переиздания альбомов Stevie Ray
  Vaughan и новый том его же "Greatest Hits" * Выбор "Всего Этого Блюза": PINETOP
  PERKINS & HUBERT SUMLIN "Legends" * Издаются в марте: Anson Funderburgh, Rod Piazza...
  * В паутине: Горячие блюз-альбомы по подсчетам Биллбоарда официальный Stevie Ray
  Vaughan & DOUBLE TROUBLE С обытия Потери CHARLES BROWN 21 января 1999г., в возрасте
  76 лет ушел жизни Чарлз Браун, легендарный певец и пианист, провессионально работавший
  блюз на протяжении более полувека. Дипломированный химик, он принял участие и победил
  в конкурсе музыкантов-любителей, после чего начал профессиональную карьеру. Дебютную
  пластинку записал в составе трио JOHNNY MOORE''STHREE BLAZERS в 1945г. В этом же
  году песня Брауна "DRIFTIN'' BLUES"поднялась до #2 в ритмэндблюзовом хит-параде
  и признана журналом DAWNBEAT лучшей ритмэндблюзовой пластинкой года. С 1949г. выступал
  под собственным именем. Чарлз Браун оставался на вершине популярности до начала
  60-х, затем наступило время испытаний. Он снова работал учителем, дворником и т.д.
  Вернулся к клубным гастролям в 80-х. В 1990г. великолепный энергичный стильный виртуозный
  альбом ALL MY LIFE вернул имя Чарлза Брауна на главную блюзовую сцену: 90-е стали
  временем ренессанса его творчества. Старинный друг Джон Ли Хукер исполняет и записывает
  песню Брауна "DRIFTIN'' BLUES" на протяжении всей своей карьеры. Меняя мелодию почти
  до неузнаваемости, он всегда указывает автора отправной точки. В 90-х Браун и Хукер
  вместе работали над несколькими альбомами. Чарлз Браун в годы успеха и в годы забвения
  оставался неизменно верен своему блюзу: выдержанному в мягких тонах, с джазовыми
  интонациями; глубокий баритон напоминает баллады Нэта Кинга Коула; изысканно-стильная
  манера игры на фортепиано с истинно блюзовым туше - этот блюз уходит навсегда, он
  не повторим. A.C.LITTLEFIELD 22 февраля 1999г., в возрасте 74 лет ушел жизни Эй.Си.Литтфилд,
  лидер госпелл-группы "BELLS JOY". "Бэлз Оф Джой" основана в 1946г. Хитом стал их
  сингл 1951г. "Поговорим об Иисусе", проданный в количестве более миллиона экз. После
  чего фирма "Дюк-Пикок" предложила Литтлфилду более выгодный контракт, если группа
  будет записывать коммерчески более приемлемые ритмэндблюзовые пластинки - но он
  отказался, и продолжал записывать религиозную музыку. Последний альбом группа выпустила
  в 1999г. - "THE SECOND TIME AROUND". Награды: 25 февраля в Лос-Анжелесе патриарху
  блюза Джону Ли Хукеру вручена "Награда Первопроходца" от "Ритмэндблюзового фонда"
  - Lifetime Achievement Rhythm & Blues Foundation Pioneer Award - за "Достижения
  по жизни". Церемонию провели Бонни Рэйтт и Эрик Клэптон. Хукер принял награду с
  признательностью и передал денежную ее часть (20.000$) обратно фонду, для поддержки
  ветеранов блюза - что, собственно, является основной задачей "Rhythm & Blues Foundation".
  В прошлом году Хукер закатил вечеринку "50th Anniversary Boogie" - по случаю 50-летия
  со дня выхода его первой пластинки. ЗХаписываться Хукер, 1917г.р., начал поздновато.
  Блюзовые GRAMMY: В 57-й категории (непосредственно перед полечками) "Лучший альбом
  традиционного блюза" премия досталась Отису Рашу за альбом "Куда б я ни пошел (Там
  точно будет лучше, чем тут, где я сейчас)". Best Traditional Blues Album Otis Rush
  "Any Place I''m Going" [House Blues Records] Ирония судьбы: по достижениям и стажу
  Рашу давно следовала высокая блюзовая награда. Но получил он "традиционный блюз"
  за пластинку в стиле "модерн-блюз". Хорошо хотя бы то, что обычно в поле зрения
  академиков-избирателей, распределяющих и блюзовые награды, попадает года в год традиционная
  обойма наиболее известных блюзмэнов: БиБиКинг, Роберт Крей и примкнувший к ним Эрик
  Клэптон. Я оптимист, и (при всех несуразностях) награда Отису Рашу была для меня
  приятной неожиданностью и чуть поколебала мнение о профанации блюза премиями Грэмми.
  С Отисом Рашем соревновались, да так и остались номинантами (Nominees): - Альбом
  "Памяти Хаулин Вулфа" с участие музыкантов его группы и приглашенных звезд. Henry
  Gray, Calvin Jones, Sam Lay, Colin Linden & Hubert Sumlin With Special Guests "A
  Tribute To Howlin'' Wolf" [Telarc Blues Records] - Традиционалист-ветеран певец-гитарист
  Джон Хэммонда John Hammond "Long As I Have You" [Pointblank Records] - Чикагский
  гитарист, ветеран стиля "Уэст-Сайд" Лютер Джонсон Luther "Guitar Junior" Johnson
  And The Magic Rockers "Got To Find A Way" [Telarc Blues Records] - Ветеран дельта
  и чикагского блюза, пасынок Роберта Джонсона, гитарист Роберт-младший Локвуд. Robert
  Lockwood Jr. "I Got To Find Me A Woman" [Verve Records] Лучшим альбомом современного
  блюза объявлен "Притормози" Кеба Мо. Который, в дуще - апологет акустического блюза.
  Но по жизни Кеб Мо - известный оппортунист (что тем более обидно, поскольку музыкант
  он - редкого дарования), альбом может записать в любом стиле, лишь бы одобрила корпорация
  "Сони", дистрибутирующая его записи. Я этот альбом не слушал - мне хватило предыдущих.
  А, ежели кто слышал и поделится своим мнением - будет кстати. Best Contemporary
  Blues Album Keb'' Mo'' "Slow Down" [Okeh/550 Music] Прочие соискатели-выдвиженцы
  в этой категории: Две певицы Техаса и одна Нового Орлеана: Марсиа Болл, Трейси Нельсон
  и Ирма Томас - Marcia Ball, Irma Thomas &Tracy Nelson "Sing It!"[Rounder Records]
  Крайне неудачный альбом лидера современного чикагского блюза Бадди Гая "Тяжелая
  любовь". - Buddy Guy "Heavy Love" [Silvertone Records] Великолепная соул-блюз-джазовая
  певица Этта Джеймс с альбомом под программным названием "Жизнь, Любовь и Блюз",
  с запродюссированным до ощущения тройной дистилляции пресным звуком В альбоме -
  куча блюзовых стандартов в коммерческих ритмэндблюзовых аранжировках с профессиональными
  музыкантами, которым блюз сыграть - как два пальца обоссать (вот они и...). - Etta
  James "Life, Love & The Blues" [Private Music] Альбом дуэтов короля блюза БиБиКинга
  со всяческими супер- и несупер-звездами "Дубль за дублем". По отдельности каждый
  трек - познавателен, но в целом слушать почему-то тяжело. B.B. King "Deuces Wild"
  [MCA Records] И любителям блюза должно быть приятно, что в 23-й категории "Лучший
  ритм-энд-блюзовый вокал, мужчины", где побеждал туалетный драчун Джордж Майкл, в
  этом году победил-таки достойный человек - Стив Уандер. Best Male R&B Vocal Performance
  "St. Louis Blues" Stevie Wonder (Track from: "Gershwin''s World" (Herbie Hancock)
  [Verve Records]) Наказания C 1997 года тянется дело по обвинению Клиффорда Энтоуна
  в торговле наркотиками и "отмывании денег". Власти обвиняют его в приобретении 9400
  фунтов марихуаны с целью сбыта. В феврале 1999г. К.Энтоун признал себя виновным
  по двум статьям обвинения. Максимальное наказание по ним составляет пожизненное
  заключение и 4.000.000 $ штрафа. К.Энтоун открыл клуб "Энтоунз" в 1975г. в Остине.
  Основанный в трудные для блюза дни, он быстро превратился в центр техасского блюза.
  Благодаря энергии и организационному таланту К.Энтоуна клуб стал настоящим организационным
  центром, дававшим работу дедам блюза (Дж.Л.Хукеру в том числе), остро в ней нуждавшимся
  тогда. Кто-то ветеранов говорил, что в клуб "Энтоунз" было легко отправиться на
  гастроли, поскольку не надо везти с собой группу: аккомпанирующий состав, хорошо
  знающий блюзовый репертуар, легко находился среди завсегдатаев клуба. Это стало
  возможным потому, что К.Энтоун привечал и блюзовую молодежь - братья Воэн, "Фэбьюлос
  Сандербердз" были его протеже; и всем известным именам, появившимся в техасском
  блюзе с конца 70-х, есть, за что сказать спасибо "Энтоунз". Не случайно столько
  звезд приняли участие в праздновании 20-летия клуба (запечатленном в альбоме ANTONE''S
  20TH ANNIVERSARY): Джеймс Коттон, Бадди Гай, Пайнтоп Перкинс, Снуки Прайор, Хьюберт
  Самлин, Джимми Роджерс, Дуг Сэм, Анжелла Стрелли, Лютер Таккер, Ким Уилсон, Сара
  Браун, Дерек О''Брайан, Сью Фолей, Дойл Брамхэлл, Лейзи Лестер - их имена образуют
  далеко не полный список тех, кто многим обязан клубу. Соответственно, любители блюза
  в Техасе и мире сегодня обязаны клубу не меньше. Клуб давал редкую, но столь важную
  основу смешения блюзовых поколений, отчего и старшие обретали новую силу, и молодь
  пропитывалась хорошей закваской. Не случайно техасский клуб к началу 90-х пришел
  в полном расцвете сил. Созданный лейбл "Энтоунз" поддерживал "клубный блюз", а выступление
  блюзмэнов перед небольшой аудиторией - это "то, что они делают лучше всего". Комментарий
  ATB: Есть мнение, что марихуана официально считается наркотиком потому, что ее подпольная
  продажа приносит большую выгоду. Доказано, что она приносит меньше вреда здоровью,
  чем алкоголь, и не вызывает такого привыкания. С другой стороны, марихуана часто
  является первой ступенью к потреблению "тяжелых" наркотиков. Стоит обратить внимание
  на то, что дело на Энтоуна открыто в результате крупномасштабной полицейской операции,
  в результате которой обвинения были выдвинуты против 30 человек. Фигура владельца
  блюзового клуба в такой операции представляется вполне очевидной кандидатурой на
  роль "козла отпущения". Энтоун на протяжении полутора лет заявлял о своей невиновности.
  Последние доказательства его вины получены через признания уже осужденных драг-дилеров.
  (Нужно напоминать, чего стоят показания человека под угрозой приговора, который
  может быть более мягким или строгим?) Энтоун мог признать свою вину и в ситуации,
  когда маловероятно доказать невиновность под грузом контрсвидетельств, и более вероятно
  рассчитывать на снисхождение суда в случае раскаяния. Было ли процветание клуба
  "Энтоунз" во времена, когда блюз был явно "коммерчески не состоятелен", результатом
  закулисных дел, или нет, - но блюзмэнам есть за что оставаться признательным его
  известной, музыкальной части деятельности. Именно в поддержку "Энтоунз" вновь объединились
  Джимми Воэн и Ким Уилсон для февральского концерта в клубе группы "Фэбьюлос Сандербердз".
  http://www.austin360.com/news/001metro/99jan/07/7antone.htm В записи Ремастированное
  переиздание альбомов SRV "Texas Flood" (1983), "Couldn''t Stand The Weather" (1984),
  "Soul To Soul" (1985), и "In Step" (1989) с неиздававшимися студийными и концертными
  треками, с новым буклетом. Новый сборник воэновских записей "The Real Deal: Greatest
  Hits Vol. 2" включает прежде не издававшийся вариант "Leave My Girl Alone" и дуэт
  с серф-гитаристом Dick Dale музыки к фильму "Back To The Beach". (Лучше бы включили
  проамериканский гимн Джеймса Брауна с гитарой SRV) (((От "Всего этого блюза": купишь
  - не забудь поделиться радостью со слушателями ATB!))) ВЕСЬ ЭТОТ БЛЮЗ™ выбирает:
  PINETOP PERKINS & HUBERT SUMLIN "Legends" Что готовится на март: Boozoo Chavis &
  the Magic Sounds, Who Stole My Monkey? (Rounder) Anson Funderburgh & the Rockets
  featuring Sam Myers, Change in My Pocket (Bullseye Blues & Jazz) Kim Lembo, Ready
  to Ride (Blue Wave) Rod Piazza and the Mighty Flyers, and Now (Tone Cool) Toni Price,
  Low Down and Up (Antone''s) Various Artists, Roots for the 21st Century, Vol. 1
  (Severn) [label sampler with new songs from Benjie Porecki, Big Joe Maher, Steve
  Guyger] Aron Burton, Good Blues to You (Delmark) [w/Dave Specter and Lester Davenport]
  Ken Saydak, Foolish Man (Delmark) Tail Dragger, American People (Delmark) [w/Johnny
  B. Moore, Billy Branch, Jimmy Dawkins and Rockin'' Johnny] Howard and the White
  Boys, The Big Score (Evidence) Kenny Neal, Tab Benoit and Debbie Davies, Homesick
  for the Road (Telarc) Извлекаются архива: Ruth Brown, Good Day for the Blues (Bullseye
  Blues & Jazz) Various Artists, Black Appalachia String Bands, Songsters and Hoedowns
  (Rounder) Various Artists, Black Texicans: Balladeers and Songsters the Texas Frontier
  (Rounder) Hadda Brooks, I''ve Got News for You (Virgin) [w/two new tracks featuring
  Carla Bozulich Geraldine Fibbers and Charles Brown ] A.C. Reed, Junk Food (Delmark)
