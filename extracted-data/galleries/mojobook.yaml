extra_text: 'Мадди Уотерс. Глава II. Часть II. II-2 Начиналась Великая Депрессия.
  Цены на хлопок резко упали, обрушив экономику Дельты, где люди и без того жили небогато.
  Десятки тысяч семей - и белых, и черных - были согнаны с земли за неуплату аренды
  или налогов. Чтобы избежать массового голода, администрация округа Коахома, где
  находится Кларксдэйл, до предела снизила цены на овощи, фрукты и молоко. Пустующие
  земли округа выдавались людям под огороды, и урожай не облагался налогом. На плантациях
  не хватало наличных денег, и хозяева расплачивались квитанциями, за которые можно
  было получить продукты. В довершение всего, жизнь Мадди отравляла расовая сегрегация,
  корни которой на Юге были очень глубоки. Мадди не очень задумывался об этом - он
  считал, что белые ведут себя так потому, что дрожат за свои рабочие места и женщин.
  В его родном городе чернокожим было запрещено выходить на улицу после полуночи.
  В 1937 году произошел случай, который многим открыл глаза на несправедливость происходящего:
  26 сентября на шоссе в окрестностях Кларксдэйла потерпела аварию машина, в которой
  находилась знаменитая блюзовая певица Бесси Смит; из-за того, что все близлежащие
  медицинские учреждения были предназначены только для белых, ей не была оказана помощь
  , и она умерла от потери крови. Любопытный способ навсегда избавить страну от расовых
  проблем предложил сенатор от штата Миссисипи Теодор Дж. Бильбо: согласно представленному
  им в 1939 году в Конгресс законопроекту " Greater Liberia Act ", все чернокожее
  население США депортировалось обратно в Африку. Неясно было только, кем господин
  Бильбо собирался заменить сельскохозяйственных рабочих Юга. В 1937 году в руки Мадди
  попала пластинка легендарного Роберта Джонсона . Диск, выпущенный фирмой "Vocalion
  Records", содержал две вещи: " Terraplane Blues " и " Kindhearted Woman Blues ".
  Было очевидно, что, как и Мадди, Джонсон вдохновлялся творчеством Сана Хауса: например,
  его " Walking Blues " - это, несомненно, переработка песни Хауса " My Black Mama
  ". Поначалу Джонсон считался посредственным музыкантом, пока не повстречался, как
  гласит легенда, с самим дьяволом. Темной ночью на пустынном перекрестке они заключили
  договор: Джонсон отдал свою душу в обмен на ярчайший всплеск музыкального мастерства.
  Как бы то ни было, когда Роберт опять появился на публике, он был единодушно признан
  королем блюза. Он не знал себе равных ни как автор, ни как гитарист; одинаково хорошо
  играл как пальцами, так и слайдом. По ритмике его блюзы напоминают песни Хауса,
  однако гитара Джонсона звучит гораздо сложнее и интереснее хаусовской за счет басовой
  линии, которую он совмещает с основным аккомпанементом, а также богатства оттенков
  и украшений. Одно время Роберт Джонсон жил всего в восьми милях от Мадди, в местечке
  Фрайарз Пойнт, но они так ни разу и не встретились. Мадди пару раз видел, как тот
  играет, однако стеснялся подойти. Однажды, заметив на углу одной улиц Джонсона,
  окруженного густой толпой слушателей, Мадди остановил машину и вышел посмотреть,
  но что-то удержало его: " Я сел обратно в машину и уехал: это был опасный человек...
  Вон он умел пользоваться гит-тарой ... Я уполз и спрятался: для меня это было слишком&
  quot;. Адские гончие всю жизнь следовали за Джонсоном по пятам, пока, наконец, не
  схватили за горло - их орудием послужила отравленная бутылка виски, которой, как
  рассказывают, его угостил обманутый муж. Произошло это в баре в окрестностях Гринвуда,
  штат Миссисипи, после концерта. Несколько дней Джонсон находился между жизнью и
  смертью, пока 16 августа 1938 года дьявол, которому он, по легенде, обещал душу,
  не взял свое. Умирая, Джонсон положил поперек груди гитару. При жизни он успел выпустить
  всего одну пластинку, однако впоследствии его записи приобрели огромную известность.
  Несмотря на то, что Мадди был потрясен игрой Джонсона и считал его одним лучших
  слайдовых гитаристов Дельты, он утверждал, что Чарли Пэттон ничуть не уступал Джонсону
  в мастерстве, и что в конечном итоге Пэттон оказал на него, Мадди, гораздо большее
  влияние: " Мне кажется, что я - это нечто вроде смеси троих музыкантов: часть -
  это я сам, часть - это Сан Хаус и небольшая часть - это Роберт Джонсон ". В то время
  Мадди играл не только в барах, но и на улице - уличные музыканты зарабатывали не
  так уж плохо. В Кларксдэйле он облюбовал себе район Четвертой авеню, где собирались
  плантационные рабочие со всей округи - они прозвали это место "Новый свет". " Все
  было просто замечательно , - вспоминает Мадди свой первый выход на публику. - Я
  поставил себе под ноги коробку из-под сигар, сам сел на ящик, и через пять минут
  вокруг выросла такая толпа, что приехала полиция, и мне пришлось уйти ". Переходя
  с одного места на другое, Мадди за вечер собирал от 20 до 30 долларов - во много
  раз больше, чем получал за день работы в поле. Эрли Райт (Early Wright), который
  в 1942 году стал ди-джеем радио WROX в Кларксдэйле, вспоминает, как подружился в
  конце тридцатых с Мадди Уотерсом. Он часто слушал его и в Кларксдэйле, и в окрестных
  деревушках: Мэттсоне, Дублине, Фрайарз Пойнт. Иногда Мадди выступал один, иногда
  с группой, но в любом случае было видно, что этот музыкант уже нашел свою собственную
  манеру и его не спутаешь ни с кем. Он мог играть и сидя, и стоя, но всегда находился
  в центре внимания, а другие члены группы ориентировались на него. Мадди всегда отличался
  на редкость легким и веселым характером. Несмотря на растущую популярность, он не
  зазнавался, и, хотя играл блюз, сам никогда не унывал. Добившись относительного
  успеха, он начал хорошо одеваться и даже купил машину, что резко подняло его статус.
  С Райтом они обычно говорили о бейсболе, а иногда Мадди рассказывал про свою бабушку,
  которая воспитала его и даже в то время продолжала оказывать на него большое влияние.
  Дорога блюзмена вовсе не была усеяна розами: например, Мадди жаловался, что хозяева
  клубов обманывают его при расчете, - однако он ни на секунду не усомнился в своем
  призвании. "С первого взгляда было видно, что этот человек рожден для большого успеха",
  - вспоминает Райт. В то время Мадди начал всерьез подумывать об отъезде: его уже
  не прельщала известность, на которую он мог рассчитывать, оставаясь в Миссисипи.
  Гармошечник Уилли Фостер (Willie Foster) подростком слушал Мадди, когда тот приезжал
  в его родной городок Леланд, в 100 с лишним километрах к югу от Кларксдэйла, а сводный
  брат Мадди вспоминает, что по выходным он часто выступал в Роллинг Форк. Слух о
  том, что приезжает Мадди, распространялся уст в уста. В такие поездки он обычно
  отправлялся один - например, Фостер в то время ни разу не слышал его с группой.
  И Фостер, и Эрли Райт сходятся в том, что в этот период Мадди был занят разработкой
  собственного стиля и что он уже производил огромное впечатление на слушателей -
  в том числе и как личность. "Он был очень добрый, - говорил Фостер. - Казалось,
  что он любит всех на свете". Мадди всегда нравились красивые девушки, умевшие хорошо
  одеваться, и, надо сказать, сам он вовсе не страдал от недостатка их внимания. Внешность
  у него была действительно запоминающаяся: высокий, худощавый, скуластый, чуть раскосые
  глаза под тяжелыми веками. Однако с какой бы легкостью Мадди не заводил романы,
  он не допускал, чтобы женщины становились между ним и музыкой. Как-то раз он сказал
  Райту, что, по всей видимости, серьезные отношения с женщиной будут мешать его карьере
  - судьба брака с Мэйбл была предрешена. Музыка оказалась важнее. Мадди чувствовал,
  что для успешного продвижения ему не хватает собственной пластинки. Ему казалось,
  что для этого нужно ехать в Сент-Луис - по примеру его друга Роберта МакКоя (теперь
  взявшего псевдоним " Найтхок "), который сумел завести там нужные знакомства и в
  результате договорился о записи. В один прекрасный день Мадди отпросился у своих
  музыкантов, оставил Мэйбл работать на ферме вместо себя и отправился в Сент-Луис
  с подружкой. Сент-Луис оказался огромным и крайне недружелюбным городом - Мадди
  очень скоро понял, что вся его популярность тут не стоит ни гроша. Более того, оказалось,
  что ни одной звукозаписывающей фирмы в городе нет. Мадди удалось продержаться в
  Сент-Луисе несколько месяцев, но заинтересовать кого-либо своей музыкой он так и
  не смог. Работы было мало, и платили музыкантам всего по три-четыре доллара за вечер
  - не больше, чем дома. После всего, что ему пришлось пережить, Мадди возненавидел
  большие города. Вернувшись на плантацию, он выгнал Мэйбл дома и поселился там со
  своей девушкой. В это время у Скотта Боэннера и двоюродной сестры Мадди родилась
  дочь, и они уехали в Чикаго, а Мадди вернулся в группу Сана Симмса - после ухода
  Питти Пэта ( Pitty Pat ) она начала называться " Son Simms Four " - "Четверка Сана
  Симмса". В 1941 году Сан Симмс установил на свою скрипку звукосниматель и начал
  играть через усилитель. Вторым гитаристом был плантационный рабочий Перси Томас
  ( Percy Thomas ), а на мандолине играл Луи Форд ( Louis Ford ), до этого работавший
  с Чарли Пэттоном. Имея за плечами такой состав, Мадди уже начал разрабатывать стиль,
  который он позже разовьет в Чикаго. Мадди вспоминал, что ударных в группе не было
  - струнные составы того времени обходились без них, - однако Эрли Райт утверждает,
  что Мадди иногда играл и с барабанщиком. Время от времени - смотря по тому, как
  он был загружен на ферме - Мадди играл и с Биг Джо Уильямсом ( Big Joe Williams
  ), мастером самодельной девятиструнной гитары. В 1941 году Биг Джо записал один
  своих хитов - песню " Baby Please Don''t Go "; Мадди выучил ее и с тех пор исполнял
  на протяжении всей жизни. В это время в пяти километрах к югу от Стоволла, в местечке
  Фаррел, остановилась новоорлеанская водевильная труппа. Это было большое событие:
  шоу Сайласа Грина ( Silas Green ) с песнями, танцами и комедийными вставками считалось
  лучшим разъездных музыкальных представлений подобного рода. В такие труппы обычно
  приглашали и местных артистов, поэтому Мадди и Скотт Боэннер сразу же отправились
  в Фаррел и были приняты: Мадди как гармошечник, а Скотт как гитарист; с ними, скорее
  всего, приехали и Сан Симмс с Луи Фордом. Через два дня артисты покинули городок,
  но Мадди с ними не было: он решил остаться дома, так как, по его словам, не был
  готов к кочевой жизни. " А еще я обожал бабушку и совсем не хотел от нее уезжать
  ". Вскоре предприимчивый музыкант задумал открыть в своем доме на плантации кабачок.
  Для человека, знавшего толк в выпивке, женщинах, игре и всякого рода денежных предприятиях,
  такая идея была как нельзя кстати - тем более, что ему требовалась и постоянная
  сцена. В те времена люди старались не уходить далеко от дома: в городах существовал
  комендантский час для чернокожих, двери кинотеатров, за редким исключением, были
  для них закрыты. После работы они могли собираться только в двух местах: в церкви
  и в кабаке. Почти на каждой плантации было свое заведение, где по субботам и воскресеньям
  выпивка, танцы, игра и блюз помогали рабочим на время забыть об унылых трудовых
  буднях. Говарду Стоволлу идея понравилась. Он считал, что на каждой плантации должно
  быть свое питейное заведение вместе с самогонным аппаратом: пока рабочие развлекались
  неподалеку от дома, любое происшествие оставалось под контролем; если же в поисках
  удовольствий они забредали на чужую территорию и попадали в беду, то могли рассчитывать
  только на себя. Южное законодательство недвусмысленно намекало неграм, что лучше
  сидеть дома. Такой кабачок служил центром всех возможных развлечений, не одобренных
  церковью. В одном углу дощатой хибарки шла игра: тощие сбережения рабочих ставились
  на карту, проигрывались в рулетку; стук костей, горячие молитвы о тройке или семерке,
  возгласы радости и отчаяния были неотъемлемой частью жизни на плантации, где не
  было другого доступа к легким деньгам. Качественный самогон от местного производителя
  горячил кровь и игрокам, и любителям танцев, которые обливались потом в соседней
  комнате, где играл грубый деревенский блюз - там мог быть и гитарист, и целый состав,
  и музыкальный автомат. Возбужденные, кипящие энергией танцоры топали и хлопали от
  души; вечнозеленые гимны Дельты не смолкали до самого рассвета. Как выразился Мадди,
  в его кабачке развлекались " с вечера и до упаду. Иногда мы гуляли всю ночь и даже
  утром ". Как правило, музыкальное сопровождение обеспечивал сам хозяин со своим
  бэндом; нередко заходили поджемовать и другие музыканты. К услугам посетителей был
  и дешевый музыкальный автомат - по 10 центов за песню. Моуз "Брауни" Эмерсон гнал
  самогон в 50-галлонных бензиновых бочках, спрятанных в лесу. Многие считали, что
  Мадди и сам промышляет этим, но, вероятнее всего, он просто сотрудничал с Эмерсоном,
  сбывая "огненную воду" в своем заведении. Эмерсон был человеком бесшабашным и неунывающим;
  он уже успел отсидеть срок за самогоноварение, но это его ничуть не обескуражило.
  Мадди часто играл у него на вечеринках за пять долларов наличными и неограниченное
  количество выпивки. Популярность Мадди росла довольно быстро, и неудивительно, что
  вскоре он попал в поле зрения фольклориста по имени Алан Ломакс ( Alan Lomax ).
  Алан был сыном Джона Эвери Ломакса (John Avery Lomax), одного первых исследователей
  американского фольклора, который на рубеже веков начал свою деятельность со сбора
  песен Дикого Запада. В 1933 году, когда восемнадцатилетний Алан уже путешествовал
  вместе с отцом, они организовали запись заключенному луизианской тюрьмы Харди Ледбеттеру
  ( Hardie Ledbetter ) по прозвищу "Ледбелли" (" Leadbelly "), исполнявшему пестрый
  набор народных песен под аккомпанемент двенадцатиструнной гитары. Летом 1941 года
  Алан Ломакс отправляется в путешествие, чтобы запечатлеть на пластинках музыку негритянского
  Юга. Проект по изучению фольклора округа Коахома спонсировали Библиотека Конгресса,
  представителем которой и был Ломакс, и Фискский университет - высшее учебное заведение
  для чернокожих в Нэшвилле, Теннеси. Там проектом заведовал Чарльз С. Джонсон (Charles
  S. Johnson), декан факультета общественных наук, сбором материала занимался его
  ассистент Льюис Джонс (Lewis Jones), а профессор музыкального факультета Джон Уорк
  (John Work), известный негритянский композитор и собиратель фольклора, переносил
  музыку на нотные листы. Прежде всего Алан Ломакс мечтал записать Роберта Джонсона.
  Он сумел найти его мать, однако выяснилось, что ее " маленького Роберта " уже три
  года как нет в живых. Работа продолжалась - 28 августа Ломакс, Льюис Джонс, Уорк
  и мистер Росс с театрального факультета Фиска собрались в Кларксдэйле. Кто-то местных
  жителей рассказал им о Мадди, и Уорк, Ломакс и его жена Элизабет отправились к нему
  в Стоволл. Произошло это, по словам Ломакса, между 24-м и 31-м августа, а Мадди,
  со своей стороны, вспоминает, что был субботний вечер; таким образом, наиболее вероятная
  дата их встречи - 30 августа 1941 года. Ломакс вспоминает, что с первого взгляда
  Мадди с его широкими скулами и раскосыми глазами показался ему "темнокожим дружелюбным
  эскимосом". Вначале Мадди держался настороженно: в его глазах любой белый незнакомец
  был агентом налоговой инспекции, вынюхивающим, откуда пахнет самогоном. Его подозрения
  только усилились, когда Ломакс предложил подвезти его на своей машине, зашел к нему
  домой и даже выпил с ним воды одной кружки - для белого это означало перейти невидимую,
  но четкую границу. " Это было немного слишком - то, как он себя вел , - вспоминает
  Мадди, - и я говорил себе: они еще и не то придумают, чтобы тебя сцапать ". Мадди
  никогда не слышал о Библиотеке Конгресса, но сразу ухватился за возможность сделать
  запись, хотя и знал, что издавать ее не будут. Ему обещали выслать две пластинки
  и 20 долларов за работу. Мадди провел гостей в дом: " Мы вытащили багажника множество
  всяких приборов и большие аккумуляторы, расставили все это на крыльце, а сам я сел
  в комнате с гитарой и микрофоном. Потом он протянул через окошко провод, заземлил
  его, и мы взялись за дело ". По иронии судьбы Мадди получил возможность записаться,
  не выходя собственного дома, хотя до этого он провел в городе несколько месяцев,
  так ничего и не добившись. Звукозаписывающий аппарат, привезенный Ломаксом, весил
  почти 150 килограммов. Это была новая, усовершенствованная модель: вместо устаревших
  алюминиевых дисков в нем использовались 16-дюймовые целлулоидные, вмещавшие до 15
  минут записи на каждой стороне. Как писал Алан Ломакс в книге " The Land Where Blues
  Began " ("Земля, где родился блюз"): "И вот изумрудная игла машины начала свой путь,
  в буквальном смысле оставляя свой след в истории музыки - дорожку с песней, которую
  Мадди назвал " Country Blues "". Как и многие другие блюзы, эта вещь передает душевное
  состояние человека, от которого ушла любимая женщина. Голос Мадди то зависает на
  глубоких, грустных низких нотах, то взлетает на самый верх в пронзительном крике
  отчаяния; слайд-гитара следует за ним, подчеркивая то или иное эмоциональное состояние.
  После записи Ломакс взял у Мадди интервью. Мадди рассказал, что сочинил эту вещь
  в начале октября 1938 года, пока менял проколотую шину - накануне его действительно
  бросила девушка. Однако он признался, что песня имеет свои источники: " My Black
  Mama " Сана Хауса (записана 28 мая 1930 года) и " Walking Blues " Роберта Джонсона
  (датируется 1936 годом). У Хауса Мадди позаимствовал мелодию - на это ясно указывает
  одинаковый гитарный проигрыш в конце квадрата - и один куплет текста, который есть
  и в песне Джонсона. У Джонсона он взял еще один куплет, так что совпадают целых
  два, но в " Country Blues " они расположены по-другому. Несмотря на столь очевидные
  заимствования, вся песня несет на себе явный отпечаток его собственного стиля. Гитарное
  соло, которого нет в двух других вариантах, звучит впечатляюще, не оставляя никаких
  сомнений в огромном исполнительском даровании Мадди. В " I Be''s Troubled " Мадди
  отходит от традиционной двенадцатитактовой структуры. Текст этой песни пришел ему
  в голову, когда он шел по дороге, напевая про себя какой-то церковный гимн. И идея,
  и исполнение выше всяких похвал. Слайд Мадди звучит, как второй голос, а ритмическая
  партия на басовых струнах добавляет всей песне объем. Еще одна вещь, " Burr Clover
  Farm Blues ", была написана Мадди и Саном Симмсом по просьбе Говарда Стоволла, большого
  поклонника их группы. " В молодые годы мне пришлось нелегко, но у меня был хороший
  хозяин, мистер Говард Стоволл, и я уважаю его ", - говорил Мадди. Burr clover -
  бобовое растение, которое высаживали, чтобы обогатить почву азотом; первую машину
  для его уборки изобрел в 1935 году сам Говард Стоволл. Мадди играет на гитаре пальцами;
  ему аккомпанирует Сан Симмс. Это вполне традиционный блюз, где повторяется строчка
  каждого куплета. Текст представляет собой сильно приукрашенное описание жизни на
  плантации - заметно, что сочинялся он в угоду хозяину. Переписка Мадди и Ломакса
  свидетельствует о том, что в тот день была записана еще одна вещь под названием
  " Number One Highway Blues ", однако она не сохранилась. "Мастерство Мадди ошеломило
  меня, - пишет Ломакс. - Он великолепно владел и голосом, и гитарой, которые находились
  у него в постоянном и очень тонком взаимодействии, а его тексты отличались мягкостью
  и добродушием". И Ломакс, и Уорк расспрашивали Мадди о том, как он пишет песни.
  За исключением " I Be''s Troubled ", которую он написал на уже существующую мелодию,
  все его вещи начинались с текста, а затем он пробовал несколько мелодий и выбирал
  наиболее подходящую. Когда запись была окончена и Ломакс поставил пластинку на воспроизведение,
  Мадди был потрясен: " Это был лучший день в моей жизни. Я никогда не слышал своего
  голоса в записи, и, господи, как же это было здорово! ". Оба они чувствовали, что
  работа была проделана не зря: " Когда мистер Ломакс поставил мне эту пластинку,
  я подумал: а ведь этот парень хорошо поет! Я и не знал, что могу так ", - вспоминал
  Мадди. Ломакс отправился на север, к озеру Корморант, где записал Сана Хауса с Вилли
  Брауном ( Willie Brown ), Лироя Уильямса ( Leroy Williams ) и Скрипача Джо Мартина
  ( Fiddlin'' Joe Martin ), а Уорк вернулся в Нэшвилл. Уорк переложил записанный Ломаксом
  материал - в общей сложности 16 дисков - на ноты, однако впоследствии они были утеряны.
  Мадди, видимо, не терпелось взять в руки готовую пластинку. 21 сентября 1941 года,
  через три недели после записи, он посылает Ломаксу следующее письмо (написанное,
  скорее всего, кем-то другим под его диктовку): " Пишет вам парень, который записал
  "Burr Clover Blues", "Number One Highway Blues" и еще другие блюзы. Я хочу спросить,
  выпустили ли их? Если да, то пожалуйста, сэр, пришлите несколько штук в Кларксдэйл,
  Миссисипи. Напишите нам, пожалуйста. М. Дж. Морганфилд и Сан Сим. " Ломакс ответил
  только через четыре месяца, за которые Мадди, скорее всего, уже простился с надеждой
  увидеть свою пластинку. Письмо от 27 января 1942 года, помеченное Архивом народной
  музыки Библиотеки Конгресса, гласит: "Здесь, в Библиотеке, Ваши блюзы благодаря
  превосходному исполнению всем очень понравились, и я рад выслать Вам пластинку с
  двумя лучшими вещами. Я думаю, что Вам стоит продолжать заниматься музыкой, так
  как уверен, что рано или поздно Вы добьетесь успеха, которого вполне заслуживаете."
  Мадди получил два диска с " Country Blues " на первой стороне и " I Be''s Troubled
  " на обороте, а также обещанные 20 долларов. " Интересно, за сколько бы я их заработал,
  если за пять дней мне платили 3 доллара 75 центов? - размышлял Мадди. - Двадцать
  долларов - хорошие деньги, ничего не скажешь, и я был им всем очень благодарен ".
  Но больше всего он радовался, когда диск занял свое место в музыкальном автомате
  в одном ряду с пластинками знаменитых блюзменов. Он включал его всякий раз, когда
  оставался в комнате один. Мадди хорошо знал, что его пластинка ни в чем не уступает
  записям известных артистов. Дж.Л.Коллиер. "Становление джаза" ("Радуга", 1984),
  стр.103: Вскоре после ее смерти возникла легенда, что ранение Бесси не было смертельным
  и трагический исход наступил только потому, что в клинике для белых ее отказались
  принять из-за цвета кожи. Эта легенда стала широко известной и даже легла в основу
  пьесы Эдварда Олби "Смерть Бесси Смит". Однако, по мнению Албертона и других авторов,
  эта история была, по-видимому, целиком и полностью придумана некоторыми политиками
  с пропагандистской целью. По свидетельству врача, оказывавшего последнюю помощь
  Бесси Смит, "на месте катастрофы не нашлось ни одной санитарной машины, которая
  могла бы доставить ее в больницу. В то время в глубинных районах хлопковых плантаций
  Юга не было санитарных машин ни для белых, ни для цветных." Врач так же утверждает,
  что состояние Бесси было столь тяжелым, что у нее не оставалось практически никаких
  шансов. Следует учесть так же крайне низкий уровень развития здравоохранения в тогдашней
  американской провинции. прим.пер.: Крупнейший исследователь жизни и творчества Бесси
  Смит К.Албертон считает эту историю вымышленной: "На самом деле ее немедленно отвезли
  в больницу для черных, где она скончалась от потери крови. Скорее всего, Бесси нельзя
  было бы спасти даже при наличии современного медицинского оборудования" -Вернуться
  в текст-'
