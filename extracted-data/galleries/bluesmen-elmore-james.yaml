extra_text: 'ATB''s Who''s Who - Elmore JAMES - ATB''s Who''s Who - Elmore JAMES 27
  января 1918, Ричлэнд, Миссиссиппи - 24 марта 1963, Чикаго, Иллинойс) Настоящее имя:
  Элмор БРУКС (Elmore BROOKS). Элмор ДЖЕЙМС - Американский блюзовый гитарист, певец;
  первооткрыватель техники игры слайдом на электрогитаре; один наиболее выдающихся
  музыкантов эпохи расцвета чикагского блюза, чьи новации оказали огромное влияние
  и на дальнейшее развитие блюза, и на формирование рок-музыки. Родился в районе Дельты
  Миссиссиппи в крестьянской семье. Учился играть на самодельной гитаре с одной струной.
  Вполне вероятно, именно это обстоятельство послужило его стремлению найти свой прежде
  неслыханный стиль игры на гитаре. С подросткового возраста подрабатывал по выходным
  выступлениями в близлежащих кабаках и на ярмарках. В районе 1937 года познакомился
  с Робертом Джонсоном ( Robert Johnson ), легендарным гитаристом Дельты Миссиссиппи,
  и перенял у него некоторые элементы как исполнения блюза на гитаре в целом, так
  и техники игры слайдом в частности. Примерно тогда же познакомился с Райсом Миллером
  (которому еще только предстояло стать Санни Боем Уилльямсоном II ( Sonny Boy Williamson
  II )); они часто выступали дуэтом; Элмор Джеймс иногда аккомпанировал Санни Бою
  Уилльямсону и во время его легендарных радиоконцертов, и на самых первых записях.
  С 1943 по 1945 служил в ВМС США. После демобилизации вернулся в Дельту, и организовал
  едва ли не первый в регионе электрический блюзбэнд. В 1952г. под собственным именем
  выпустил дебютную пластинку на крошечной местной фирме " Trumpet " (где записывался
  и Санни Бой Уилльямсон II). Запись представляла собой авторизированный вариант блюза
  Роберта Джонсона " I Beleive I''ll Dust My Broom ", исполненный на акустической
  гитаре с приклеенным звукоснимателем. Но если тема была известна, а инструмент -
  примитивен, то исполнение оказалось экстраординарным. Элмор Джеймс извлекал гитары
  звук необычайного эмоционального напряжения. Пластинка стала одним ритмэндблюзовых
  бестселлеров года. Более крупные фирмы звукозаписи бросились с предложениями к Элмору
  Джеймсу, под их далеко неделикатным давлением Элмор Джеймс переселился в Чикаго,
  начал записывать пластинки для фирмы " Meteor/Modern ". Организованный им в Чикаго
  блюзбэнд, названный по наиболее известному хиту "Брумдастерз" ( Broomdusters ),
  считался одно время самым "горячим" блюз-бэндом города, превосходя по популярности
  даже блюзбэнд Мадди Уотерса. В составе группы играли пианист Джонни Джонс ( Johnny
  Jones ), саксофонист Джи-Ти Браун ( J.T.Brown ) и гитаристы Хоумсик Джеймс ( Homesick
  James ) или Эдди Тейлор ( Eddie Taylor ) - все это были земляки Элмора Джеймса,
  как и он, сыгравшие немалую роль в формировании чикагского стиля городского блюза.
  Элмор Джеймс записывался в период с 1952 по 1963 - чуть более десяти лет. Он умер
  от сердечного приступа в 1963г., за несколько лет до того, как британские музыканты,
  которым предстояло стать суперзвездами: Эрик Клэптон , Питер Грин , Джимми Пейдж
  - стали пытаться открыть секрет его уникальной техники игры. Можно согласиться,
  что Элмор Джеймс слишком часто повторял и мелодические ходы своих песен, и исполнительские
  приемы. Но яркая оригинальность музыкального почерка и эмоциональная насыщенность
  с лихвой искупали однотипность, которая после первых же шагов поставила бы крест
  на карьере менее одаренного артиста. Без этого уникального слайда вся история блюза
  пошла бы иначе. Возможно, пусть и преувеличение, но правда, что на самом деле в
  его репертуаре были только две мелодии: быстрая и медленная. Хоть бы и так, но без
  этих двух его песен, быстрой и медленной - Shake Your Money Maker и Sky Is Crying
  - невозможно представить историю блюза. Эти песни переиграли рок-музыканты четырех
  десятилетий, и они по сей день продолжают оставаться в постоянном репертуаре и блюзовых
  звезд мирового уровня, и блюзбэндов местного значения. ВЭБ™''99 Песни Элмора Джеймса
  в RealAudio: The Sky Is Crying (322k) Look On Yonder Wall (284k) I Done Somebody
  Wrong (265k) Shake Your Moneymaker (320k) Дискография (только издания на СD): King
  The Slide Guitar (box set) (Capricorn 2CD, 1991) Whose Muddy Shoes (with John Brim)
  (MCA/Chess) The Immortal Elmore James: King The Bottleneck Music (Music Club) Dust
  My Broom (Tomato) Let''s Cut It: The Best Elmore James (Flair/Virgin CD, 1991) The
  Sky Is Crying: The History Elmore James (Rhino CD, 1993) Это все - блюзовая классика.
  Мои личные симпатии склоняются к носороговскому сборнику 1993 года. Во-первых, потому
  что у "Rhino" всегда наиболее компетентно подготовленные "сборники". Во-вторых и
  в-главных, потому что этот "сборник" Элмора Джеймса составлял и комментировал Роберт
  Палмер , автор фундаментального труда по истории блюза " Deep Blues " (" Глубокий
  блюз "). Фотографии: Elmore James В сети: Биография и дискография на Tunes.com.
  Биография написана Кьюбом Кодой Harry''s Blues Lyrics Online - Собрание текстов
  Элмора Джеймса .'
