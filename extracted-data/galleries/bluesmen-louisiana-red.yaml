extra_text: 'ATB''s Who''s Who - LOUISIANA RED ATB''s Who''s Who LOUISIANA RED 23
  марта 1936, Виксбург, Миссиссиппи Настоящее имя: МИНТЕР, Иверсон (MINTER, Iverson).
  Первый псевдоним: РОККИ ФУЛЛЕР (Rocky Fuller). ЛУИЗИАНА РЕД ( Рыжий Луизианы ) -
  Американский блюзмэн, певец, гитарист; представитель традиционного подхода к искусству
  блюза на современной блюзовой сцене; последователь слейдовой манеры игры Мадди Уотерса
  , он, подобно Уотерсу, исполняет блюз как драму с сюжетом и развитием характеров,
  и играет по системе Станиславского - с полным перевоплощением. Рос сиротой. Мать
  умерла вскоре после его рождения; отец убит куклуксклановцами. Раннее детство провел
  в сиротских приютах. С 9 лет воспитывался у родственников. В 11 лет получил в подарок
  гитару. Самоучкой овладел искусством игры на гитаре и губной гармонике, получив
  только несколько уроков блюзового ветерана Крита Уалтерса ( Crit Walters ). Бродяжничал,
  зарабатывая на жизнь уличными выступлениями. В 13 лет приехал в Чикаго. Утверждает,
  что принимал участие в записях синглов Мадди Уотерса ( Muddy Waters ) и Литл Уолтера
  ( Little Walter ). В 16 ушел добровольцем в армию, службу проходил в Корее во время
  ведения военных действий. Демобилизовался в 1958г.. Вернулся в Чикаго, где записал
  дебютный сингл под псевдонимом Плейбой Фуллер ( Playboy Fuller ). Под этим псевдонимом
  сделал несколько записей для фирмы "Чесс" ( Chess ). Первые записи под псевдонимом
  Луизиана Ред появились в 1960г.. Политическая песня " Red''s Dream " ("Мечта Реда"),
  представляющая собой антивоенную "речь", которую в своем сне Луизиана Ред произносил
  перед ООН ( "...но это только сон" ), вошла в первую десятку ритмэндблюзовых чартов.
  В 1962г. записал альбом, имевший хороший коммерческий успех и высоко оцененный критикой.
  До появления этого альбома записи Луизиана Реда укладывались в рамки традиционного
  ритм-энд-блюза, хоть и исполненного с неподдельно горячим молодым энтузиазмом. Альбом
  впервые представил Луизиана Реда как самостоятельного музыканта, способного идти
  своим путем. Для своего времени это была прогрессивная работа, предвосхищавшая открытия
  блюз-рока. Однако достойного продолжения не последовало. До конца 60-х Луизиана
  Ред чередовал выступления на клубном уровне с работой в немузыкальной сфере. Принимал
  участие в европейских гастролях "Американского фолк-блюзового фестиваля", инициатором
  которого был Уилли Диксон ( Willie Dixon ). В 1971 записал для мэйджор-фирмы "Этлэнтик"
  (Atlantic) альбом "Louisiana Red Sings The Blues", который постиг коммерческий провал.
  В 1975г. в Нью-Йорке стараниями писателя, журналиста, страстного пропагандиста блюза
  Кента Купера ( Kent Cooper ) сделал ряд сольных записей, собранных позже в альбом
  "Midnight Rambler", остающийся наиболее значительной его студийной работой. C середины
  70-х Луизиана Ред живет и выступает в Европе, лишь изредка появляясь на американских
  блюз-фестивалях. Для малоизвестный европейских независимых фирм он записал несколько
  альбомов, весьма неровных в творческом отношении. Но концертные выступления, в которых
  Луизиана Ред продолжает нести традиции таких классиков блюза, как Мадди Уотерс и
  Джимми Рид ( Jimmy Reed ), поддерживают его репутацию "лучшего блюзмена Америки
  в изгнании". Впрочем, в конце 90-х блюзовая общественность признала его достижения
  премиями и номинациями на премию им. В.К.Хэнди . ВЭБ™''99 Музыка 1962: Red''s Dream
  1975: King Bee 1975: Too Poor To Die 1997: Tell Me Baby Фотографии Louisiana Red
  Дискография (избранная): The Lowdown Porch Blues (Roulette LP, 1962) Louisiana Red
  Sings The Blues (Atlantic LP, 1971) Midnight Rambler (Tomato LP, 1989) Ashland Avenue
  Blues (CMA Music CD, 1992) Walked All Night Long (with LEFTY DIZZ) (Blues Alliance
  CD, 1997) I Hear The Train Coming (Chrisly Records CD 1997) В сети: Биография и
  дискография на Соник-нет'
