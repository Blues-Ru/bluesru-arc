extra_text: 'Клуб Blues.Ru - Club Blues.Ru Клуб Blues.Ru Клуб Blues.Ru | Гастроли
  | Команда Igor Prado Band & Raphael Wressnig "The Soul Connection" 18.07.2017, Вт,
  клуб Forte , 20:00 19.07.2017, Ср, клуб Дом у Дороги , 20:30 Мы любим крутые блюзовые
  концерты в клубах и сами их организуем! Клуб Blues.Ru - это тусовка вокруг сайта
  Блюз.Ру, которая подсела на классные блюзовые концерты. Уже 12 лет мы организуем
  клубные гастроли ради собственного удовольствия и чтобы порадовать друзей. Мы не
  зарабатываем на гастролях и единственная наша цель - это яркие и волнующие концерты.
  Если концерт маркирован как организованный Клубом Blues.Ru, это значит, что мы отвечаем
  за его качество. Мы не будем привозить группу, если сами не тащимся от её музыки,
  и есть сомнения в том, что будет отлично. Насколько можно доверять нашему вкусу,
  решать вам. Вот, что мы сделали раньше: Музыканты и гастроли Клуба Blues.Ru (2001-2016)
  - история'
